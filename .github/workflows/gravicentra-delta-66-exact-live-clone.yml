# I6.6 exact Hosting version clone ONLY. B4-007 historic close and Firestore data untouched.
name: Gravicentra I6.6 Exact Preview to LIVE Clone

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-delta-66-exact-live-clone.yml
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261110.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111_R2.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111_R3.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111_R4.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261112_R5.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261112_R6.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261113_R8.json
      - artifacts/orbit360-recovery/release-control/I6_6_CLIENTE360_ADVISOR_EXACT_LIVE_REQUEST_20261119.json
      - artifacts/orbit360-recovery/release-control/I6_6_CLIENTE360_EDIT_ACTIVITY_EXACT_LIVE_REQUEST_20261119.json
      - artifacts/orbit360-recovery/release-control/I6_6_OPS_LEADS_RETURN_EXACT_LIVE_REQUEST_20261119.json
      - artifacts/orbit360-recovery/release-control/I6_6_ISSUED_RENEWAL_PAYMENT_EXACT_LIVE_REQUEST_20261120.json
      - artifacts/orbit360-recovery/release-control/I6_6_DOCUMENT_IMPORT_SOURCE_EXACT_LIVE_REQUEST_20261120.json
      - tools/gravicentra-i6-6-live-exact-clone.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-delta-66-live-hosting
  cancel-in-progress: false

jobs:
  exact-hosting-clone:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PROJECT_ID: ays-orbit-360-lab
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      I66_PACKAGE_ROOT: /tmp/gi-i66-promote-package
      I66_APPROVED_RELEASE_REQUEST: artifacts/orbit360-recovery/release-control/I6_6_DOCUMENT_IMPORT_SOURCE_EXACT_LIVE_REQUEST_20261120.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce explicit LIVE approval, historically sealed gate and exact success proofs
        id: approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-6-delta-guard.mjs
          node --check tools/gravicentra-i6-6-live-exact-clone.mjs
          node --check tools/gravicentra-i6-6-carlos-german-assignment-roster-readonly.cjs
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const assert=require('node:assert/strict');
          const j=JSON.parse(fs.readFileSync(process.env.I66_APPROVED_RELEASE_REQUEST,'utf8'));
          const importReview=j.schema==='GRAVICENTRA_I6_6_DOCUMENT_IMPORT_SOURCE_EXACT_LIVE_V1';
          const issuedRenewal=importReview||j.schema==='GRAVICENTRA_I6_6_ISSUED_RENEWAL_PAYMENT_EXACT_LIVE_V1';
          if(issuedRenewal||j.schema==='GRAVICENTRA_I6_6_CLIENTE360_ADVISOR_EXACT_LIVE_V1'){
            (async()=>{
              assert.equal(j.requireSignedLiveCoradoQueueReadback,true);
              assert.equal(j.gate,'I6.6');
              assert.equal(j.status,'OWNER_AUTHORIZED_TARGETED_LIVE_PENDING_PROTECTED_RUN');
              assert.equal(j.approvedByDirection,true);
              if(issuedRenewal){
                assert.equal(cp.execFileSync('git',['hash-object',process.env.I66_APPROVED_RELEASE_REQUEST],{encoding:'utf8'}).trim(),importReview?'616109f0a5611c833ece9789b8317af65060fdb9':'4956a5cc5d2109b60adb4e02e6602bf737dba23c','EXACT_UI_APPROVAL_RECORD_DRIFT');
                assert.equal(j.signedPreviewScope.renewalNumberInsurerSuggestedTermAndManualOverride,true);
                assert.equal(j.requireHostedPaymentFeedbackTests,true);
                assert.equal(j.backendDeploy,false);
              }else{
                assert.equal(j.sourceSha,'7791f34cf2574d1915701ee22cf3993e8de79249');
                assert.equal(j.buildRunId,44674734296);
                assert.equal(j.artifactId,14601447337);
                assert.equal(j.signedCarlosPaulaPreviewUatRunId,44675079983);
                assert.equal(j.sourceQaRunId,44674566070);
                assert.equal(j.sourceGuardRunId,44674566034);
                assert.equal(j.expectedPriorLiveSourceSha,'9c689bd283793a635f6a94197351b3fe0ecf2da9');
                assert.equal(j.expectedPriorLiveHostingVersion,'sites/ays-orbit-360-lab/versions/29889fb4208832e6');
              }
              assert.equal(j.buildId,'gi-i66-'+j.sourceSha.slice(0,12)+'-57f234755dc1');
              assert.equal(j.previewChannel,'gi-i66-rc-'+j.buildRunId);
              assert.match(j.artifactDigest,/^sha256:[0-9a-f]{64}$/);
              assert.equal(j.signedPreviewScope?.germanAndPriscilaActualEditNewClientPolicyOps,true);
              assert.equal(j.signedPreviewScope?.signedBothRolePaymentReceiptCobroPortfolioSyntheticWriteReloadRestore,true);
              assert.equal(j.signedPreviewScope?.realCustomerWrites,0);
              for(const key of ['sameImmutableArtifactPreviewAndLive','exactAllFilesDualOriginReadback',
                  'requireLiveEditAndNewClientGermanPriscilaRealRoleReadback','rollbackLiveBackendTrafficAndHostingOnAnyFailure',
                  'noFirestoreRulesAuthOrOtherBackendFunctions','noRealFinancialDataBackfillOrPaymentWrites',
                  'doNotClaimFullPlatformProductionAccepted','doNotClaimFocalCaseEdsonDataUpdatedWithoutWriteReadback']){
                assert.equal(j[key],true,'I66_CLIENTE360_NEW_RELEASE_GUARD_MISSING_'+key);
              }
              cp.execFileSync('git',['merge-base','--is-ancestor',j.sourceSha,'HEAD']);
              const changed=cp.execFileSync('git',['diff','--name-only',j.sourceSha,'HEAD','--',
                'orbit360-platform','functions','firebase.json','firestore.rules','storage.rules'],{encoding:'utf8'}).trim();
              assert.equal(changed,'','I66_CLIENTE360_PRODUCT_CHANGED_AFTER_APPROVED_IMMUTABLE_BUILD');
              const control=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
              assert.equal(control.status,'OPERATIONAL_EXACT_LIVE_ACCEPTED_LOCKED');
              assert.equal(control.livePromotionAuthorized,false);
              assert.equal(control.currentExactHostingRelease.sourceSha,'1b65a790530d49fe1d1fb451f02838fd9a713c53');
              // Signed 1b history is not silently rewritten to physical b38.
              const gh='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
              const heads={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','User-Agent':'GI-I66-Same-Artifact-Signed-Release'};
              const runIds=[j.buildRunId,j.signedCarlosPaulaPreviewUatRunId,j.sourceQaRunId,j.sourceGuardRunId];
              const responses=await Promise.all([...runIds.map(id=>fetch(gh+'runs/'+id,{headers:heads})),fetch(gh+'artifacts/'+j.artifactId,{headers:heads}),
                fetch(j.previewUrl+'/__recovery__/build.json',{headers:{'Cache-Control':'no-cache'}}),
                fetch('https://app.aysseguros.com/__recovery__/build.json',{headers:{'Cache-Control':'no-cache'}}),
                fetch('https://ays-orbit-360-lab.web.app/__recovery__/build.json',{headers:{'Cache-Control':'no-cache'}}),
                fetch(gh+'runs/'+j.signedCarlosPaulaPreviewUatRunId+'/jobs?per_page=100',{headers:heads})]);
              assert.ok(responses.every(x=>x.ok),'I66_RELEASE_PROOF_OR_PUBLIC_ORIGIN_UNAVAILABLE');
              const result=await Promise.all(responses.map(x=>x.json()));
              for(let i=0;i<4;i++)assert.equal(result[i].conclusion,'success','I66_SIGNED_RUN_INCOMPLETE_'+runIds[i]);
              assert.equal(result[0].head_sha,j.sourceSha);
              assert.equal(result[0].path,'.github/workflows/gravicentra-release-delta-66-package.yml');
              assert.equal(result[1].path,'.github/workflows/gravicentra-i66-current-exact-preview-cross-module-uat-20261119.yml');
              assert.equal(result[2].path,'.github/workflows/gravicentra-i66-privileged-role-parity-source-qa.yml');
              assert.equal(result[3].path,'.github/workflows/gravicentra-release-lock-sync.yml');
              assert.equal(result[4].workflow_run?.id,j.buildRunId);
              assert.equal(result[4].workflow_run?.head_sha,j.sourceSha);
              assert.equal(result[4].digest,j.artifactDigest);
              assert.equal(result[4].expired,false);
              assert.equal(result[5].sourceSha,j.sourceSha);
              assert.equal(result[5].buildId,j.buildId);
              for(const n of [6,7]){
                assert.equal(result[n].sourceSha,j.expectedPriorLiveSourceSha);
                assert.equal(result[n].buildId,j.expectedPriorLiveBuildId);
              }
              const signedSteps=(result[8].jobs||[]).flatMap(z=>z.steps||[]);
              assert.equal(control.currentPhysicalHostingRelease.sourceSha,j.expectedPriorLiveSourceSha);
              assert.equal(control.currentPhysicalHostingRelease.liveHostingVersion,j.expectedPriorLiveHostingVersion);
              const authority=importReview?control.importSourceReviewPreviewRequest20261120:issuedRenewal?control.issuedRenewalPaymentPreviewRequest20261120:control.postAcceptanceOwnerInsurerSelectionPreviewBuildRequest20261119;
              assert.equal(result[2].head_sha,authority.sourceQaHead);
              if(issuedRenewal){
                assert.equal(result[1].head_sha,j.signedPreviewQaCommit);
                if(importReview){
                  assert.equal(j.requireHostedImportTests,true);
                  assert.equal(j.requireSignedImportRealSourceReview,true);
                  assert.equal(j.signedPreviewScope.importSourceReviewBothRoles,true);
                  assert.ok(signedSteps.some(s=>s.name==='Check import source review against the exact bytes served by Preview'&&s.conclusion==='success'));
                  const harness='tools/gravicentra-i6-6-carlos-client-edit-signed-synthetic-uat.cjs';
                  cp.execFileSync('git',['diff','--quiet',j.signedPreviewQaCommit,'HEAD','--',harness]);
                }
                assert.equal(result[1].head_branch,'recovery/fase-a-clean-20260831');
                assert.equal(authority.previousLiveArtifactDigest,j.signedPriorLiveReleaseEvidence.artifactDigest);
                assert.equal(authority.previousLiveArtifactId,j.signedPriorLiveReleaseEvidence.artifactId);
                assert.equal(control.currentPhysicalHostingRelease.artifactDigest,authority.previousLiveArtifactDigest);
                assert.equal(control.currentPhysicalHostingRelease.artifactId,authority.previousLiveArtifactId);
                assert.equal(authority.consumedByVerifiedLiveRun,undefined);
                assert.ok(signedSteps.some(s=>s.name==='Check renewal and payment behavior against the bytes served by this Preview'&&s.conclusion==='success'));
              }
              assert.equal(result[3].head_sha,result[2].head_sha);
              assert.equal(j.requireClientEditLiveSyntheticWriteReloadCleanup,true);
              for(const name of [
                'Carlos and Dirección signed actual Editar Cliente phone/advisor/atomic country activity durable write reload and cleanup',
                'Carlos Operativo signed roster in actual Editar Cliente, Nuevo Cliente, Nueva Póliza and Ops; LIVE untouched',
                'Real-role signed Preview Ops Leads Tasks transactional writes and restoration',
                'Real-role signed Preview direct-renewal hydration (read-only)',
                'Real-role signed Preview payment receipt-carrier synthetic UAT and restoration']){
                assert.ok(signedSteps.some(x=>x.name===name&&x.conclusion==='success'),'I66_SIGNED_PREVIEW_STEP_NOT_ACCEPTED_'+name);
              }
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'artifact_id='+j.artifactId+'\nbuild_run_id='+j.buildRunId+'\n');
              console.log('I66_EXACT_ARTIFACT_AND_SIGNED_PREVIEW_GATE_PASS');
            })().catch(error=>{console.error('I66_CLIENTE360_LIVE_GATE_HOLD '+String(error.message||error).slice(0,320));process.exitCode=1;});
          }else{
          if(j.schema!=='I6_6_EXACT_HOSTING_LIVE_PROMOTION_V1'||j.status!=='LIVE_HOSTING_CLONE_APPROVED_AFTER_TARGETED_PREVIEW_QA_PASS'||j.approvedByDirection!==true||j.noBackendDeploy!==true||j.noFirestoreAuthOrDataWrites!==true)throw Error('I66_PROMOTION_APPROVAL_INVALID');
          if(!/^[0-9a-f]{40}$/.test(j.sourceSha||'')||!Number.isSafeInteger(j.buildRunId)||j.buildRunId!==j.qaRunId||!Number.isSafeInteger(j.artifactId)||j.artifactId<=0||!/^[0-9a-f]{64}$/.test(j.artifactZipSha256||''))throw Error('I66_APPROVED_SOURCE_ID_INVALID');
          cp.execFileSync('git',['merge-base','--is-ancestor',j.sourceSha,'HEAD']);
          if(cp.execFileSync('git',['diff','--name-only',j.sourceSha,'HEAD','--','orbit360-platform',':(exclude)orbit360-platform/docs/**','functions','firebase.json','firestore.rules','storage.rules'],{encoding:'utf8'}).trim())throw Error('I66_PRODUCT_CHANGED_AFTER_BUILD');
          (async()=>{
            const api='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const heads={Authorization:'Bearer '+process.env.GITHUB_TOKEN,'User-Agent':'GI-I66-Exact-Hosting-Clone','X-GitHub-Api-Version':'2022-11-28'};
            const ev=j.qaEvidence||{};
            const permissionRepair=ev.releaseKind==='TRANSVERSAL_ROLE_PERMISSION_REPAIR';
            const supporting=permissionRepair
              ? [ev.signedActualRoleAndEquipoMatrixPreviewRunId,ev.controlPlaneRunId,ev.sourceRoleQaRunId]
              : [ev.signedDualRolePreviewRunId,ev.controlPlaneRunId];
            if(permissionRepair){
              if(supporting.some(x=>!Number.isSafeInteger(x)||x<=0)||
                 ev.sourceTestsPassed!==17||
                 JSON.stringify(ev.actualSignedPreviewRoleActions)!==JSON.stringify({Operativo:8,Direccion:10})||
                 JSON.stringify(ev.equiposProtectedMatrixRoles)!==JSON.stringify(['Direccion','SuperAdmin','AdminTenant','Admin','Operativo'])||
                 ev.equiposProtectedMatrixCriticalModules!==7||ev.equiposProtectedMatrixVerifiedCells!==35||
                 ev.signedPreviewNoDataWrites!==true||ev.noClaimOfActualRenewalOrPaymentWriteAcceptance!==true||
                 ev.noRealInsurerDocumentAcceptanceClaim!==true||ev.noAuthRulesTenantCountryOrBackendChanges!==true||
                 ev.noClaimOfFullModuleRoleCountryAcceptance!==true||ev.noClaimOfAllLivePersistedWriteFlows!==true)
                throw Error('I66_PRIVILEGED_PERMISSION_REPAIR_SIGNED_PREVIEW_EVIDENCE_INCOMPLETE');
            }else if(supporting.length!==2||supporting.some(x=>!Number.isSafeInteger(x)||x<=0)||
               ev.sourceTestsPassed!==43||!Array.isArray(ev.previewRolesActuallyVerified)||
               !ev.previewRolesActuallyVerified.includes('Direccion')||!ev.previewRolesActuallyVerified.includes('Operativo')||
               JSON.stringify(ev.explicitHydrationCollections)!==JSON.stringify(['gestiones','polizas','vehiculos','clientes'])||
               ev.signedCarlosAndDirectionHydrationPass!==true||
               ev.missingManagementFailClosedAfterHydration!==true||
               ev.signedPreviewNoDataWrites!==true||ev.noClaimOfActualRenewalOrPaymentWriteAcceptance!==true||
               ev.noRealInsurerDocumentAcceptanceClaim!==true||ev.noAuthRulesTenantCountryOrBackendChanges!==true||
               ev.noClaimOfWholePlatformPerformancePass!==true||ev.noClaimOfFullModuleRoleCountryAcceptance!==true)
              throw Error('I66_TARGETED_EXPLICIT_RENEWAL_HYDRATION_PREVIEW_QA_EVIDENCE_INCOMPLETE');
            const [qr,ar,...probes]=await Promise.all([fetch(api+'runs/'+j.qaRunId,{headers:heads}),fetch(api+'artifacts/'+j.artifactId,{headers:heads}),...supporting.map(id=>fetch(api+'runs/'+id,{headers:heads}))]);
            if(!qr.ok||!ar.ok||probes.some(p=>!p.ok))throw Error('I66_SUCCESS_PROOF_UNAVAILABLE');
            const qa=await qr.json(),a=await ar.json(),proofs=await Promise.all(probes.map(p=>p.json()));
            if(qa.status!=='completed'||qa.conclusion!=='success'||qa.head_sha!==j.sourceSha||a.workflow_run?.id!==j.buildRunId||a.workflow_run?.head_sha!==j.sourceSha||
               a.digest!=='sha256:'+j.artifactZipSha256||a.expired===true)throw Error('I66_QA_OR_PACKAGE_SUCCESS_PROOF_DRIFT');
            if(proofs.some(p=>p.status!=='completed'||p.conclusion!=='success'))throw Error('I66_TARGETED_QA_RUN_NOT_SUCCESS');
            if(permissionRepair &&
              (proofs[0].path!=='.github/workflows/gravicentra-i66-privileged-role-real-signed-matrix-preview-readonly.yml'||
               proofs[1].path!=='.github/workflows/gravicentra-release-lock-sync.yml'||
               proofs[2].path!=='.github/workflows/gravicentra-i66-privileged-role-parity-source-qa.yml'||
               proofs[1].head_sha!==j.sourceSha||proofs[2].head_sha!==j.sourceSha))
              throw Error('I66_PRIVILEGED_PERMISSION_QA_PROOF_WORKFLOW_OR_SOURCE_DRIFT');
            for(const p of proofs)cp.execFileSync('git',['merge-base','--is-ancestor',j.sourceSha,p.head_sha]);
            console.log(permissionRepair?'I66_SIGNED_CARLOS_DIRECTION_35_EQUIPOS_RULES_AND_SOURCE_PASS':'I66_SIGNED_CARLOS_AND_DIRECCION_PROTECTED_PREVIEW_AND_CONTROL_PROOFS_PASS');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`artifact_id=${j.artifactId}\nbuild_run_id=${j.buildRunId}\n`);
            console.log('I66_PINNED_PREVIEW_QA_AND_PACKAGE_SUCCESS_PROOFS_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          }
          NODE
      - name: Download original immutable GitHub artifact only; no rebuild
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.approve.outputs.artifact_id }}
          run-id: ${{ steps.approve.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gi-i66-artifact-download
      - name: Verify artifact TAR checksum and unpack original site manifest
        run: |
          set -euo pipefail
          DLROOT="$RUNNER_TEMP/gi-i66-artifact-download"
          mapfile -t TARS < <(find "$DLROOT" -maxdepth 3 -type f -name 'gi-i66-exact-package.tar.gz' -print)
          mapfile -t SUMS < <(find "$DLROOT" -maxdepth 3 -type f -name 'gi-i66-exact-package.sha256' -print)
          test "${#TARS[@]}" -eq 1
          test "${#SUMS[@]}" -eq 1
          test "$(dirname "${TARS[0]}")" = "$(dirname "${SUMS[0]}")"
          ZIPDIR="$(dirname "${TARS[0]}")"
          echo "I66_ARTIFACT_BUNDLE_PAIR_EXACTLY_ONE=true"
          echo "I66_ARTIFACT_BUNDLE_FILENAMES=$(basename "${TARS[0]}"),$(basename "${SUMS[0]}")"
          EXPECTED="$(cut -d' ' -f1 "$ZIPDIR/gi-i66-exact-package.sha256")"
          ACTUAL="$(sha256sum "$ZIPDIR/gi-i66-exact-package.tar.gz" | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p "$I66_PACKAGE_ROOT"
          tar -xzf "$ZIPDIR/gi-i66-exact-package.tar.gz" -C "$I66_PACKAGE_ROOT"
          test -f "$I66_PACKAGE_ROOT/evidence/site-manifest.sha256"
          test -f "$I66_PACKAGE_ROOT/bundle/site/__recovery__/build.json"
          echo "I66_IMMUTABLE_ARTIFACT_TAR_SHA256=$ACTUAL"
      - name: Select existing Firebase LAB service-account and pinned Hosting clone CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-promote-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-promote-auth'
          candidates=[]
          for n,key in enumerate(('SA_LAB','SA_LAB_ALT','SA_DEFAULT')):
              try: value=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError): continue
              if value.get('type')=='service_account' and value.get('project_id')=='ays-orbit-360-lab' and value.get('private_key'):
                  p=root/f'{n}.json';p.write_text(json.dumps(value));p.chmod(0o600);candidates.append(str(p))
          if not candidates: raise SystemExit('I66_CLONE_CREDENTIAL_NOT_FOUND')
          (root/'candidates').write_text('\n'.join(candidates)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-i66-promote-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-i66-promote-cli"
          CLI="$RUNNER_TEMP/gi-i66-promote-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate";break
            fi
          done < "$RUNNER_TEMP/gi-i66-promote-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/gi-i66-promote-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/gi-i66-promote-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-i66-promote-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
      - name: Install signed Carlos read-only browser for mandatory post-LIVE full selector smoke and rollback
        run: |
          set -euo pipefail
          node --check tools/gravicentra-i6-6-carlos-german-assignment-roster-readonly.cjs
          node --check tools/gravicentra-i6-6-live-exact-clone.mjs
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Clone exact signed Preview Hosting version to LIVE, readback all bytes and sign Carlos UI; rollback on any mismatch
        run: node tools/gravicentra-i6-6-live-exact-clone.mjs
      - name: Preserve release/rollback proof without user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-live-exact-clone-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/i66-live-exact-clone-readback.json
          retention-days: 14
          if-no-files-found: warn
