# I6.6 exact Hosting version clone ONLY. B4-007 historic close and Firestore data untouched.
name: Gravicentra I6.6 Exact Preview to LIVE Clone

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-delta-66-exact-live-clone.yml
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261110.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111_R2.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111_R3.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261111_R4.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261112_R5.json
      - artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261112_R6.json

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-delta-66-live-hosting
  cancel-in-progress: false

jobs:
  exact-hosting-clone:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PROJECT_ID: ays-orbit-360-lab
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      I66_PACKAGE_ROOT: /tmp/gi-i66-promote-package
      I66_APPROVED_RELEASE_REQUEST: artifacts/orbit360-recovery/release-control/I6_6_EXACT_HOSTING_LIVE_PROMOTION_REQUEST_20261112_R6.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce explicit LIVE approval, historically sealed gate and exact success proofs
        id: approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-6-delta-guard.mjs
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const j=JSON.parse(fs.readFileSync(process.env.I66_APPROVED_RELEASE_REQUEST,'utf8'));
          if(j.schema!=='I6_6_EXACT_HOSTING_LIVE_PROMOTION_V1'||j.status!=='LIVE_HOSTING_CLONE_APPROVED_AFTER_TARGETED_PREVIEW_QA_PASS'||j.approvedByDirection!==true||j.noBackendDeploy!==true||j.noFirestoreAuthOrDataWrites!==true)throw Error('I66_PROMOTION_APPROVAL_INVALID');
          if(!/^[0-9a-f]{40}$/.test(j.sourceSha||'')||!Number.isSafeInteger(j.buildRunId)||j.buildRunId!==j.qaRunId||!Number.isSafeInteger(j.artifactId)||j.artifactId<=0||!/^[0-9a-f]{64}$/.test(j.artifactZipSha256||''))throw Error('I66_APPROVED_SOURCE_ID_INVALID');
          cp.execFileSync('git',['merge-base','--is-ancestor',j.sourceSha,'HEAD']);
          if(cp.execFileSync('git',['diff','--name-only',j.sourceSha,'HEAD','--','orbit360-platform',':(exclude)orbit360-platform/docs/**','functions','firebase.json','firestore.rules','storage.rules'],{encoding:'utf8'}).trim())throw Error('I66_PRODUCT_CHANGED_AFTER_BUILD');
          (async()=>{
            const api='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const heads={Authorization:'Bearer '+process.env.GITHUB_TOKEN,'User-Agent':'GI-I66-Exact-Hosting-Clone','X-GitHub-Api-Version':'2022-11-28'};
            const ev=j.qaEvidence||{};
            const supporting=[ev.signedDualRolePreviewRunId,ev.controlPlaneRunId];
            if(supporting.length!==2||supporting.some(x=>!Number.isSafeInteger(x)||x<=0)||
               ev.sourceTestsPassed!==43||!Array.isArray(ev.previewRolesActuallyVerified)||
               !ev.previewRolesActuallyVerified.includes('Direccion')||!ev.previewRolesActuallyVerified.includes('Operativo')||
               JSON.stringify(ev.explicitHydrationCollections)!==JSON.stringify(['gestiones','polizas','vehiculos','clientes'])||
               ev.signedCarlosAndDirectionHydrationPass!==true||
               ev.missingManagementFailClosedAfterHydration!==true||
               ev.signedPreviewNoDataWrites!==true||ev.noClaimOfActualRenewalOrPaymentWriteAcceptance!==true||
               ev.noRealInsurerDocumentAcceptanceClaim!==true||ev.noAuthRulesTenantCountryOrBackendChanges!==true||
               ev.noClaimOfWholePlatformPerformancePass!==true||ev.noClaimOfFullModuleRoleCountryAcceptance!==true)
              throw Error('I66_TARGETED_EXPLICIT_RENEWAL_HYDRATION_PREVIEW_QA_EVIDENCE_INCOMPLETE');
            const [qr,ar,...probes]=await Promise.all([fetch(api+'runs/'+j.qaRunId,{headers:heads}),fetch(api+'artifacts/'+j.artifactId,{headers:heads}),...supporting.map(id=>fetch(api+'runs/'+id,{headers:heads}))]);
            if(!qr.ok||!ar.ok||probes.some(p=>!p.ok))throw Error('I66_SUCCESS_PROOF_UNAVAILABLE');
            const qa=await qr.json(),a=await ar.json(),proofs=await Promise.all(probes.map(p=>p.json()));
            if(qa.status!=='completed'||qa.conclusion!=='success'||qa.head_sha!==j.sourceSha||a.workflow_run?.id!==j.buildRunId||a.workflow_run?.head_sha!==j.sourceSha||
               a.digest!=='sha256:'+j.artifactZipSha256||a.expired===true)throw Error('I66_QA_OR_PACKAGE_SUCCESS_PROOF_DRIFT');
            if(proofs.some(p=>p.status!=='completed'||p.conclusion!=='success'))throw Error('I66_TARGETED_QA_RUN_NOT_SUCCESS');
            for(const p of proofs)cp.execFileSync('git',['merge-base','--is-ancestor',j.sourceSha,p.head_sha]);
            console.log('I66_SIGNED_CARLOS_AND_DIRECCION_PROTECTED_PREVIEW_AND_CONTROL_PROOFS_PASS');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`artifact_id=${j.artifactId}\nbuild_run_id=${j.buildRunId}\n`);
            console.log('I66_PINNED_PREVIEW_QA_AND_PACKAGE_SUCCESS_PROOFS_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - name: Download original immutable GitHub artifact only; no rebuild
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.approve.outputs.artifact_id }}
          run-id: ${{ steps.approve.outputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gi-i66-artifact-download
      - name: Verify artifact TAR checksum and unpack original site manifest
        run: |
          set -euo pipefail
          DLROOT="$RUNNER_TEMP/gi-i66-artifact-download"
          mapfile -t TARS < <(find "$DLROOT" -maxdepth 3 -type f -name 'gi-i66-exact-package.tar.gz' -print)
          mapfile -t SUMS < <(find "$DLROOT" -maxdepth 3 -type f -name 'gi-i66-exact-package.sha256' -print)
          test "${#TARS[@]}" -eq 1
          test "${#SUMS[@]}" -eq 1
          test "$(dirname "${TARS[0]}")" = "$(dirname "${SUMS[0]}")"
          ZIPDIR="$(dirname "${TARS[0]}")"
          echo "I66_ARTIFACT_BUNDLE_PAIR_EXACTLY_ONE=true"
          echo "I66_ARTIFACT_BUNDLE_FILENAMES=$(basename "${TARS[0]}"),$(basename "${SUMS[0]}")"
          EXPECTED="$(cut -d' ' -f1 "$ZIPDIR/gi-i66-exact-package.sha256")"
          ACTUAL="$(sha256sum "$ZIPDIR/gi-i66-exact-package.tar.gz" | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p "$I66_PACKAGE_ROOT"
          tar -xzf "$ZIPDIR/gi-i66-exact-package.tar.gz" -C "$I66_PACKAGE_ROOT"
          test -f "$I66_PACKAGE_ROOT/evidence/site-manifest.sha256"
          test -f "$I66_PACKAGE_ROOT/bundle/site/__recovery__/build.json"
          echo "I66_IMMUTABLE_ARTIFACT_TAR_SHA256=$ACTUAL"
      - name: Select existing Firebase LAB service-account and pinned Hosting clone CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-promote-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-promote-auth'
          candidates=[]
          for n,key in enumerate(('SA_LAB','SA_LAB_ALT','SA_DEFAULT')):
              try: value=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError): continue
              if value.get('type')=='service_account' and value.get('project_id')=='ays-orbit-360-lab' and value.get('private_key'):
                  p=root/f'{n}.json';p.write_text(json.dumps(value));p.chmod(0o600);candidates.append(str(p))
          if not candidates: raise SystemExit('I66_CLONE_CREDENTIAL_NOT_FOUND')
          (root/'candidates').write_text('\n'.join(candidates)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-i66-promote-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-i66-promote-cli"
          CLI="$RUNNER_TEMP/gi-i66-promote-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate";break
            fi
          done < "$RUNNER_TEMP/gi-i66-promote-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/gi-i66-promote-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/gi-i66-promote-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-i66-promote-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
      - name: Clone exact Preview Hosting version to LIVE with rollback and two-origin 100-percent byte readback
        run: node tools/gravicentra-i6-6-live-exact-clone.mjs
      - name: Preserve release/rollback proof without user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-live-exact-clone-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/i66-live-exact-clone-readback.json
          retention-days: 14
          if-no-files-found: warn
