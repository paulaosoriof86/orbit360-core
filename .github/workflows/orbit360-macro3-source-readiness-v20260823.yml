name: Orbit360 Macro3 Source Readiness 20260823

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/orbit360-macro3-source-readiness-v20260823.yml'
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
      - '.github/workflows/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml'
      - '.github/orbit360-authorizations/f2-runtime-authorization-intent-*.json'
      - 'tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs'
      - 'tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs'
      - 'tools/orbit360-control-plane-evidence-convergence-v20260822.mjs'
      - 'tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json'

permissions:
  contents: read
  actions: read

jobs:
  macro3-source-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = 'ays/backend-tenant-lab-v99-20260703'
          node --check tools/orbit360-continuity-transition-owner-v20260820.mjs
          node --check tools/orbit360-continuity-projection-atomic-v20260820.mjs
          node --check tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
          node --check tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node --check tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs
      - name: Verify single writer and current convergence
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          node tools/orbit360-control-plane-evidence-convergence-v20260822.mjs --repo-only
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
      - name: Verify canonical source-only F2 engine before authorization materialization
        shell: bash
        run: |
          set -euo pipefail
          E=orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          node tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs f2-productive-acceptance-exact-successor-v20260818 | tee "$RUNNER_TEMP/f2-source-precheck.json"
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .executionAuthorized==false and .runtimeAuthorized==false and .browserAuthorized==false and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$RUNNER_TEMP/f2-source-precheck.json" >/dev/null
          if git ls-files --error-unmatch "$E" >/dev/null 2>&1; then git restore "$E"; else rm -f "$E"; fi
      - name: Synthetic v3 request selftest without runtime
        shell: bash
        run: |
          set -euo pipefail
          LEDGER=orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
          SYN=.github/orbit360-requests/f2-macro3-source-readiness-synthetic-v20260823.json
          OUT=orbit360-platform/runtime-gate-crm-v20260716/f2-macro3-source-readiness-synthetic-v20260823.json
          jq -n --arg auth '9b50d4e95cf32cc8e693dd184ca945e1f532521f37ea8b64f7a1c65e546baa22' --argjson artifact "$(jq -r '.successorCandidate.artifactId' "$LEDGER")" --arg source "$(jq -r '.successorCandidate.sourceHead' "$LEDGER")" --arg digest "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")" '{schemaVersion:"orbit360-f2-productive-acceptance-runtime-browser-readonly-request-v3",status:"MATERIALIZED_SOURCE_ONLY_AWAITING_PREFLIGHT",approved:true,allowedExecutions:1,consumed:false,authorizationFrozen:true,replayAllowed:false,historical:false,authorizationIdentityDigest:$auth,candidateArtifactId:$artifact,candidateSourceHead:$source,candidateArtifactDigest:$digest}' > "$SYN"
          ORBIT360_REQUEST_FILE="$SYN" ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$OUT" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          jq -e '.ok==true and .status=="F2_FULL_RUNTIME_KNOWN_ROOTFIXES_SOURCE_AUDIT_PASS" and .semanticRegisterValidation==true and .storeGetRootfix==true and .clientProjectionRootfix==true and .deployCommandPresent==false and .runtimeExecuted==false and .browserExecuted==false' "$OUT" >/dev/null
          rm -f "$SYN" "$OUT"
      - name: Verify certified artifact still exists and is not expired
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LEDGER=orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
          ID=$(jq -r '.successorCandidate.artifactId' "$LEDGER")
          DIGEST=$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" > "$RUNNER_TEMP/artifact.json"
          jq -e --argjson id "$ID" --arg digest "$DIGEST" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/artifact.json" >/dev/null
      - name: Final clean readback
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'MACRO3_SOURCE_READINESS_PASS'
