name: Orbit 360 · registrar Gate 7.13 RC1.2

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/register-gate713-rc12-v20260803.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: orbit360-register-gate713-rc12-v20260803
  cancel-in-progress: false

env:
  REQUEST: .github/orbit360-requests/register-gate713-rc12-v20260803.json
  GATE_ID: block7.13-rc12-membership-rootcause-cumulative-closure-v20260803
  STATUS_CONTEXT: orbit360/register-gate713-rc12

jobs:
  register:
    name: Gate 7.13 · registro contractual source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout request exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar frontera source-only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.status=="AUTHORIZED_SOURCE_ONLY" and .gateId==env.GATE_ID and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false and .consumed==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-registrar-gate713-rc12-v20260803.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-rc12-rootcause-cumulative-closure-v20260803.mjs
          jq -e '.gateId==env.GATE_ID and .gateContractVersion=="7.13.0" and .executionProfile.phase=="GRAVICENTRA_RC12_ROOTCAUSE_CUMULATIVE_AUDIT_CLOSURE"' tools/orbit360-validator-lifecycle-contract-rc12-rootcause-cumulative-closure-v20260803.json >/dev/null

      - name: Registrar Gate 7.13
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-registrar-gate713-rc12-v20260803.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          git diff --check
          test "$(git diff --name-only | wc -l)" = '1'
          test "$(git diff --name-only)" = 'tools/orbit360-validar-gate-contracts-v20260717.mjs'

      - name: Persistir registro contractual
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs
          git commit -m 'gate: registrar contrato 7.13 RC1.2'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703

      - name: Publicar PASS
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:process.env.STATUS_CONTEXT,description:'Gate 7.13 registrado sin acceso a datos',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Publicar FAIL
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:process.env.STATUS_CONTEXT,description:'Gate 7.13 no pudo registrarse',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
