name: Orbit360 Paula Membership Canonical Readonly Reconciliation V4 20260817
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-paula-membership-readonly-reconcile-v2-runbound-*.json'
permissions:
  contents: write
concurrency:
  group: orbit360-auth-paula-membership-readonly-reconcile-v4-20260817
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_EXPECTED_REQUEST_VERSION: AUTH_PAULA_MEMBERSHIP_READONLY_RECONCILE_V2
  ORBIT360_GATE_ID: block-auth-paula-membership-readonly-reconcile-v2-lab-v20260817
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-paula-membership-readonly-reconcile-v2-lab-v20260817.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize run-bound pipeline channels
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST_FILE="${CHANGED[0]}"
          case "$REQUEST_FILE" in
            .github/orbit360-requests/auth-paula-membership-readonly-reconcile-v2-runbound-*.json) ;;
            *) echo 'PIPELINE_MECHANISM_FAILURE:REQUEST_PATH_NOT_ALLOWED' >&2; exit 41 ;;
          esac
          mkdir -p "$EVIDENCE_DIR"
          RECON="$EVIDENCE_DIR/auth-paula-membership-readonly-reconciliation-v2-run-${GITHUB_RUN_ID}.json"
          PREFLIGHT="$EVIDENCE_DIR/preflight-paula-membership-v2-run-${GITHUB_RUN_ID}.json"
          JOURNAL="$EVIDENCE_DIR/auth-paula-membership-pipeline-run-${GITHUB_RUN_ID}.json"
          rm -f "$RECON" "$PREFLIGHT" "$JOURNAL"
          echo "ORBIT360_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_RECON_EVIDENCE=$RECON" >> "$GITHUB_ENV"
          echo "ORBIT360_PREFLIGHT_EVIDENCE=$PREFLIGHT" >> "$GITHUB_ENV"
          echo "ORBIT360_STAGE_JOURNAL=$JOURNAL" >> "$GITHUB_ENV"
          echo "ORBIT360_RECON_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          jq -n --arg run "$GITHUB_RUN_ID" --arg request "$REQUEST_FILE" --arg head "$GITHUB_SHA" '{schemaVersion:"orbit360-auth-paula-membership-pipeline-journal-v1",runId:$run,request:$request,headSha:$head,status:"RUN_INITIALIZED",currentStage:"INIT",classification:"PIPELINE_IN_PROGRESS",containsPII:false,containsSecrets:false,firestoreWrites:0,authWrites:0,operationalWrites:0}' > "$JOURNAL"
      - name: Verify exclusive request and corrected owners
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="VERIFY_REQUEST"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          node --check tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-lab-v20260817.mjs
          node --check tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs
      - name: Validate fresh evidence mechanism source-only
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="SOURCE_ONLY_FRESHNESS_VALIDATION"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          TOOL=tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
          grep -F "ORBIT360_RECON_RUN_ID" "$TOOL" >/dev/null
          grep -F "canonical-multirol-v2-fresh-evidence-bound" "$TOOL" >/dev/null
          test ! -e "$ORBIT360_RECON_EVIDENCE"
          test ! -e "$ORBIT360_PREFLIGHT_EVIDENCE"
      - name: Register corrected gate in working tree
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="REGISTER_GATE"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          node tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs
          git diff --check
      - name: Mandatory canonical gate before secrets
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="CANONICAL_PREFLIGHT"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          test ! -e "$EVIDENCE_DIR/preflight-sanitizado.json"
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          test -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$ORBIT360_PREFLIGHT_EVIDENCE"
          jq -e --arg run "$GITHUB_RUN_ID" '.status=="GO_GATE_CONTRACT" and .contractVersion=="14.3.0" and .failed==0 and .ok==true and .runId==$run and .evidenceFreshness=="current-run-only" and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .authWriteAuthorized==false and .runtimeAuthorized==true and .browserAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .targetCount==1' "$ORBIT360_PREFLIGHT_EVIDENCE" >/dev/null
          jq '.currentStage="CANONICAL_PREFLIGHT_PASS"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
      - name: Install provider dependency
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="INSTALL_PROVIDER"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13.10.0 >/dev/null
      - name: Bind provider after GO
        if: steps.preflight.outcome == 'success'
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="BIND_PROVIDER"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-paula-membership-readonly-v4.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Execute corrected canonical reconciliation
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="EXECUTE_RECONCILIATION"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          node tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
      - name: Cleanup provider material
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Seal current-run evidence only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ORBIT360_PREFLIGHT_EVIDENCE" ] && [ -f "$EVIDENCE_DIR/preflight-sanitizado.json" ]; then
            jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$ORBIT360_PREFLIGHT_EVIDENCE"
          fi
          if [ -f "$ORBIT360_PREFLIGHT_EVIDENCE" ]; then
            jq -e --arg run "$GITHUB_RUN_ID" '.runId==$run and .evidenceFreshness=="current-run-only"' "$ORBIT360_PREFLIGHT_EVIDENCE" >/dev/null
          fi
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then
            jq -e --arg run "$GITHUB_RUN_ID" '.runId==$run and .validatorRevision=="canonical-multirol-v2-fresh-evidence-bound"' "$ORBIT360_RECON_EVIDENCE" >/dev/null
            BEFORE_SHA="$(sha256sum "$ORBIT360_RECON_EVIDENCE" | awk '{print $1}')"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lp=process.env.ORBIT360_LIFECYCLE;
          const ep=process.env.ORBIT360_RECON_EVIDENCE;
          const pp=process.env.ORBIT360_PREFLIGHT_EVIDENCE;
          const jp=process.env.ORBIT360_STAGE_JOURNAL;
          const run=process.env.GITHUB_RUN_ID||'';
          const journal=fs.existsSync(jp)?JSON.parse(fs.readFileSync(jp,'utf8')):{currentStage:'INIT_MISSING'};
          let e;
          if(fs.existsSync(ep)) e=JSON.parse(fs.readFileSync(ep,'utf8'));
          else if(fs.existsSync(pp)){
            const p=JSON.parse(fs.readFileSync(pp,'utf8'));
            if(p.ok!==true) e={ok:false,status:p.status||'PREFLIGHT_STOP',classification:p.classification||'PIPELINE_MECHANISM_FAILURE',failedCheck:(p.failedCheckIds||[])[0]||'CANONICAL_PREFLIGHT',runId:run,firestoreWrites:0,authWrites:0,operationalWrites:0};
            else e={ok:false,status:'PIPELINE_ABORT_AFTER_GO_GATE_CONTRACT',classification:'PIPELINE_MECHANISM_FAILURE',failedCheck:`PIPELINE_STAGE_${journal.currentStage||'UNKNOWN'}`,runId:run,firestoreWrites:0,authWrites:0,operationalWrites:0};
          } else e={ok:false,status:'PIPELINE_ABORT_BEFORE_FRESH_PREFLIGHT_EVIDENCE',classification:'PIPELINE_MECHANISM_FAILURE',failedCheck:`PIPELINE_STAGE_${journal.currentStage||'UNKNOWN'}`,runId:run,firestoreWrites:0,authWrites:0,operationalWrites:0};
          const l=JSON.parse(fs.readFileSync(lp,'utf8'));
          l.status=e.ok?'AUTH_PAULA_MEMBERSHIP_READONLY_V2_CONSUMED_PASS':'AUTH_PAULA_MEMBERSHIP_READONLY_V2_CONSUMED_STOP_RETRY';
          l.authorization.activeRequest=false;l.authorization.allowedExecutions=0;l.authorization.consumed=true;
          l.executionResult={stage:e.status,classification:e.classification,failedCheck:e.failedCheck||'',ok:e.ok===true,runId:e.runId||run,firestoreWrites:e.firestoreWrites||0,authWrites:e.authWrites||0,operationalWrites:e.operationalWrites||0};
          fs.writeFileSync(lp,JSON.stringify(l,null,2)+'\n');
          const j=fs.existsSync(jp)?JSON.parse(fs.readFileSync(jp,'utf8')):{};
          j.status=e.ok?'SEALED_PASS':'SEALED_STOP_RETRY';j.currentStage='SEALED';j.classification=e.classification;j.failedCheck=e.failedCheck||'';j.runId=run;j.firestoreWrites=0;j.authWrites=0;j.operationalWrites=0;
          fs.writeFileSync(jp,JSON.stringify(j,null,2)+'\n');
          NODE
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then
            AFTER_SHA="$(sha256sum "$ORBIT360_RECON_EVIDENCE" | awk '{print $1}')"
            test "$BEFORE_SHA" = "$AFTER_SHA"
          fi
          git config user.name orbit360-auth-readonly-bot
          git config user.email orbit360-auth-readonly-bot@users.noreply.github.com
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_LIFECYCLE" "$ORBIT360_STAGE_JOURNAL"
          if [ -f "$EVIDENCE_DIR/preflight-sanitizado.json" ]; then git add "$EVIDENCE_DIR/preflight-sanitizado.json"; fi
          if [ -f "$ORBIT360_PREFLIGHT_EVIDENCE" ]; then git add "$ORBIT360_PREFLIGHT_EVIDENCE"; fi
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then git add "$ORBIT360_RECON_EVIDENCE"; fi
          if ! git diff --cached --quiet; then git commit -m 'auth: persist run-bound Paula membership pipeline evidence [skip ci]'; git push origin "HEAD:$ORBIT360_BRANCH"; fi
      - name: Require PASS from this exact run
        if: always()
        shell: bash
        run: |
          test -f "$ORBIT360_RECON_EVIDENCE"
          jq -e --arg run "$GITHUB_RUN_ID" '.ok==true and .status=="TARGET_IDENTITY_MEMBERSHIP_READONLY_PASS" and .classification=="PASS" and .runId==$run and .validatorRevision=="canonical-multirol-v2-fresh-evidence-bound" and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .readbackUnchanged==true' "$ORBIT360_RECON_EVIDENCE" >/dev/null
