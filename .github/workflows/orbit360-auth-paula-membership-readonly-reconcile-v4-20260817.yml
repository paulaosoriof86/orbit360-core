name: Orbit360 Paula Membership Canonical Readonly Reconciliation V4 20260817
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-paula-membership-readonly-reconcile-v2-lab-v20260817.json'
permissions:
  contents: write
concurrency:
  group: orbit360-auth-paula-membership-readonly-reconcile-v4-20260817
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/auth-paula-membership-readonly-reconcile-v2-lab-v20260817.json
  ORBIT360_EXPECTED_REQUEST_VERSION: AUTH_PAULA_MEMBERSHIP_READONLY_RECONCILE_V2
  ORBIT360_GATE_ID: block-auth-paula-membership-readonly-reconcile-v2-lab-v20260817
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-paula-membership-readonly-reconcile-v2-lab-v20260817.json
  ORBIT360_RECON_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/auth-paula-membership-readonly-reconciliation-v2-sanitized-v20260817.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exclusive request and corrected owners
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          node --check tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-lab-v20260817.mjs
          node --check tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs
      - name: Register corrected gate in working tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs
          git diff --check
      - name: Mandatory canonical gate before secrets
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="14.3.0" and .failed==0 and .ok==true and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .authWriteAuthorized==false and .runtimeAuthorized==true and .browserAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .targetCount==1' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Install provider dependency
        if: steps.preflight.outcome == 'success'
        run: npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13.10.0 >/dev/null
      - name: Bind provider after GO
        if: steps.preflight.outcome == 'success'
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-paula-membership-readonly-v4.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Execute corrected canonical reconciliation
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: node tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
      - name: Cleanup provider material
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Seal and persist sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src='orbit360-platform/runtime-gate-crm-v20260716/auth-paula-membership-readonly-reconciliation-sanitized-v20260817.json';
          const dst=process.env.ORBIT360_RECON_EVIDENCE;
          if(fs.existsSync(src)){const e=JSON.parse(fs.readFileSync(src,'utf8'));e.schemaVersion='orbit360-auth-target-membership-readonly-reconciliation-v2';fs.writeFileSync(dst,JSON.stringify(e,null,2)+'\n');}
          const lp=process.env.ORBIT360_LIFECYCLE;const e=fs.existsSync(dst)?JSON.parse(fs.readFileSync(dst,'utf8')):{ok:false,status:'NOT_EXECUTED',classification:'PIPELINE_MECHANISM_FAILURE',firestoreWrites:0,authWrites:0,operationalWrites:0};
          const l=JSON.parse(fs.readFileSync(lp,'utf8'));l.status=e.ok?'AUTH_PAULA_MEMBERSHIP_READONLY_V2_CONSUMED_PASS':'AUTH_PAULA_MEMBERSHIP_READONLY_V2_CONSUMED_STOP_RETRY';l.authorization.activeRequest=false;l.authorization.allowedExecutions=0;l.authorization.consumed=true;l.executionResult={stage:e.status,classification:e.classification,failedCheck:e.failedCheck||'',ok:e.ok===true,firestoreWrites:e.firestoreWrites||0,authWrites:e.authWrites||0,operationalWrites:e.operationalWrites||0};fs.writeFileSync(lp,JSON.stringify(l,null,2)+'\n');
          NODE
          git config user.name orbit360-auth-readonly-bot
          git config user.email orbit360-auth-readonly-bot@users.noreply.github.com
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_LIFECYCLE" "$EVIDENCE_DIR/preflight-sanitizado.json"
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then git add "$ORBIT360_RECON_EVIDENCE"; fi
          if ! git diff --cached --quiet; then git commit -m 'auth: persist corrected Paula membership readonly evidence [skip ci]'; git push origin "HEAD:$ORBIT360_BRANCH"; fi
      - name: Require PASS
        if: always()
        shell: bash
        run: |
          test -f "$ORBIT360_RECON_EVIDENCE"
          jq -e '.ok==true and .status=="TARGET_IDENTITY_MEMBERSHIP_READONLY_PASS" and .classification=="PASS" and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .readbackUnchanged==true' "$ORBIT360_RECON_EVIDENCE" >/dev/null
