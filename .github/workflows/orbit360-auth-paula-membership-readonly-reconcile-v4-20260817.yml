name: Orbit360 Paula Membership Gate 14.3 Runbound Pipeline 20260817
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-paula-membership-readonly-reconcile-v2-runbound-*.json'
permissions:
  contents: write
concurrency:
  group: orbit360-auth-paula-membership-gate14-3-20260817
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block-auth-paula-membership-readonly-reconcile-v2-lab-v20260817
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-paula-membership-readonly-reconcile-v2-lab-v20260817.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  gate14_3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize immutable run channels
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST_FILE="${CHANGED[0]}"
          case "$REQUEST_FILE" in
            .github/orbit360-requests/auth-paula-membership-readonly-reconcile-v2-runbound-*.json) ;;
            *) echo 'PIPELINE_MECHANISM_FAILURE:REQUEST_PATH_NOT_ALLOWED' >&2; exit 41 ;;
          esac
          VERSION="$(jq -r '.requestVersion // empty' "$REQUEST_FILE")"
          case "$VERSION" in
            AUTH_PAULA_MEMBERSHIP_READONLY_RECONCILE_V2) MODE=readonly; REVISION=canonical-multirol-v2-fresh-evidence-bound ;;
            AUTH_PAULA_MEMBERSHIP_SCOPE_CANONICAL_REPAIR_V1) MODE=repair; REVISION=canonical-scope-repair-v1-semantic-noexpansion ;;
            *) echo 'PIPELINE_MECHANISM_FAILURE:REQUEST_VERSION_NOT_ALLOWED' >&2; exit 41 ;;
          esac
          mkdir -p "$EVIDENCE_DIR"
          RESULT="$EVIDENCE_DIR/auth-paula-membership-gate14-3-${MODE}-run-${GITHUB_RUN_ID}.json"
          PREFLIGHT="$EVIDENCE_DIR/preflight-paula-membership-gate14-3-${MODE}-run-${GITHUB_RUN_ID}.json"
          JOURNAL="$EVIDENCE_DIR/auth-paula-membership-gate14-3-pipeline-run-${GITHUB_RUN_ID}.json"
          rm -f "$RESULT" "$PREFLIGHT" "$JOURNAL"
          echo "ORBIT360_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_EXPECTED_REQUEST_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ORBIT360_PIPELINE_MODE=$MODE" >> "$GITHUB_ENV"
          echo "ORBIT360_EXPECTED_RESULT_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "ORBIT360_RECON_EVIDENCE=$RESULT" >> "$GITHUB_ENV"
          echo "ORBIT360_PREFLIGHT_EVIDENCE=$PREFLIGHT" >> "$GITHUB_ENV"
          echo "ORBIT360_STAGE_JOURNAL=$JOURNAL" >> "$GITHUB_ENV"
          echo "ORBIT360_RECON_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          jq -n --arg run "$GITHUB_RUN_ID" --arg request "$REQUEST_FILE" --arg head "$GITHUB_SHA" --arg mode "$MODE" '{schemaVersion:"orbit360-auth-paula-membership-gate14-3-journal-v1",runId:$run,request:$request,headSha:$head,mode:$mode,status:"RUN_INITIALIZED",currentStage:"INIT",classification:"PIPELINE_IN_PROGRESS",containsPII:false,containsSecrets:false,firestoreWrites:0,authWrites:0,operationalWrites:0}' > "$JOURNAL"
      - name: Verify owners and source mechanism
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="VERIFY_SOURCE"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          node --check tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
          node --check tools/orbit360-auth-paula-membership-scope-repair-v20260817.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-lab-v20260817.mjs
          node --check tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs
          grep -F 'AUTH_PAULA_MEMBERSHIP_SCOPE_CANONICAL_REPAIR_LAB' tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs >/dev/null
          test ! -e "$ORBIT360_RECON_EVIDENCE"
          test ! -e "$ORBIT360_PREFLIGHT_EVIDENCE"
      - name: Register current gate phases in working tree
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="REGISTER_GATE"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          node tools/orbit360-register-auth-paula-membership-readonly-reconcile-v2-gate-v20260817.mjs
          git diff --check
      - name: Mandatory canonical gate before provider
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="CANONICAL_PREFLIGHT"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          test -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$ORBIT360_PREFLIGHT_EVIDENCE"
          if [ "$ORBIT360_PIPELINE_MODE" = readonly ]; then
            jq -e --arg run "$GITHUB_RUN_ID" '.status=="GO_GATE_CONTRACT" and .contractVersion=="14.3.0" and .ok==true and .runId==$run and .evidenceFreshness=="current-run-only" and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .authWriteAuthorized==false and .runtimeAuthorized==true and .browserAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .targetCount==1' "$ORBIT360_PREFLIGHT_EVIDENCE" >/dev/null
          else
            jq -e --arg run "$GITHUB_RUN_ID" '.status=="GO_GATE_CONTRACT" and .contractVersion=="14.3.0" and .classification=="GO_TARGET_MEMBERSHIP_SCOPE_CANONICAL_REPAIR" and .ok==true and .runId==$run and .evidenceFreshness=="current-run-only" and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==true and .authWriteAuthorized==false and .firestoreWriteBudget==1 and .semanticAccessExpansionAllowed==false and .targetFieldPath=="dataScopes.default" and .targetValue=="all" and .runtimeAuthorized==true and .browserAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .targetCount==1' "$ORBIT360_PREFLIGHT_EVIDENCE" >/dev/null
          fi
          jq '.currentStage="CANONICAL_PREFLIGHT_PASS"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
      - name: Install provider dependency after GO
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="INSTALL_PROVIDER"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13.10.0 >/dev/null
      - name: Bind provider after GO
        if: steps.preflight.outcome == 'success'
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          jq '.currentStage="BIND_PROVIDER"' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-paula-membership-gate14-3.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Execute authorized gate phase
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq --arg stage "EXECUTE_${ORBIT360_PIPELINE_MODE^^}" '.currentStage=$stage' "$ORBIT360_STAGE_JOURNAL" > "$ORBIT360_STAGE_JOURNAL.tmp" && mv "$ORBIT360_STAGE_JOURNAL.tmp" "$ORBIT360_STAGE_JOURNAL"
          if [ "$ORBIT360_PIPELINE_MODE" = repair ]; then
            node tools/orbit360-auth-paula-membership-scope-repair-v20260817.mjs
          else
            node tools/orbit360-auth-paula-membership-readonly-reconcile-v20260817.mjs
          fi
      - name: Cleanup provider material
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Seal exact current-run evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ORBIT360_PREFLIGHT_EVIDENCE" ] && [ -f "$EVIDENCE_DIR/preflight-sanitizado.json" ]; then
            jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$ORBIT360_PREFLIGHT_EVIDENCE"
          fi
          if [ -f "$ORBIT360_PREFLIGHT_EVIDENCE" ]; then jq -e --arg run "$GITHUB_RUN_ID" '.runId==$run and .evidenceFreshness=="current-run-only"' "$ORBIT360_PREFLIGHT_EVIDENCE" >/dev/null; fi
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then
            jq -e --arg run "$GITHUB_RUN_ID" --arg rev "$ORBIT360_EXPECTED_RESULT_REVISION" '.runId==$run and .validatorRevision==$rev' "$ORBIT360_RECON_EVIDENCE" >/dev/null
            BEFORE_SHA="$(sha256sum "$ORBIT360_RECON_EVIDENCE" | awk '{print $1}')"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lp=process.env.ORBIT360_LIFECYCLE,ep=process.env.ORBIT360_RECON_EVIDENCE,pp=process.env.ORBIT360_PREFLIGHT_EVIDENCE,jp=process.env.ORBIT360_STAGE_JOURNAL,run=process.env.GITHUB_RUN_ID||'';
          const journal=fs.existsSync(jp)?JSON.parse(fs.readFileSync(jp,'utf8')):{currentStage:'INIT_MISSING'};
          let e;
          if(fs.existsSync(ep)) e=JSON.parse(fs.readFileSync(ep,'utf8'));
          else if(fs.existsSync(pp)){
            const p=JSON.parse(fs.readFileSync(pp,'utf8'));
            e=p.ok===true?{ok:false,status:'PIPELINE_ABORT_AFTER_GO_GATE_CONTRACT',classification:'PIPELINE_MECHANISM_FAILURE',failedCheck:`PIPELINE_STAGE_${journal.currentStage||'UNKNOWN'}`,runId:run,firestoreWrites:0,authWrites:0,operationalWrites:0}:{ok:false,status:p.status||'PREFLIGHT_STOP',classification:p.classification||'PIPELINE_MECHANISM_FAILURE',failedCheck:(p.failedCheckIds||[])[0]||'CANONICAL_PREFLIGHT',runId:run,firestoreWrites:0,authWrites:0,operationalWrites:0};
          } else e={ok:false,status:'PIPELINE_ABORT_BEFORE_FRESH_PREFLIGHT_EVIDENCE',classification:'PIPELINE_MECHANISM_FAILURE',failedCheck:`PIPELINE_STAGE_${journal.currentStage||'UNKNOWN'}`,runId:run,firestoreWrites:0,authWrites:0,operationalWrites:0};
          const l=JSON.parse(fs.readFileSync(lp,'utf8'));
          l.status=e.ok?'AUTH_PAULA_MEMBERSHIP_GATE14_3_CONSUMED_PASS':'AUTH_PAULA_MEMBERSHIP_GATE14_3_CONSUMED_STOP_RETRY';l.authorization.activeRequest=false;l.authorization.allowedExecutions=0;l.authorization.consumed=true;
          l.executionResult={stage:e.status,classification:e.classification,failedCheck:e.failedCheck||'',ok:e.ok===true,runId:e.runId||run,firestoreWrites:e.firestoreWrites||0,authWrites:e.authWrites||0,operationalWrites:e.operationalWrites||0,semanticAccessExpansion:e.semanticAccessExpansion===true};fs.writeFileSync(lp,JSON.stringify(l,null,2)+'\n');
          journal.status=e.ok?'SEALED_PASS':'SEALED_STOP_RETRY';journal.currentStage='SEALED';journal.classification=e.classification;journal.failedCheck=e.failedCheck||'';journal.runId=run;journal.firestoreWrites=e.firestoreWrites||0;journal.authWrites=e.authWrites||0;journal.operationalWrites=e.operationalWrites||0;journal.semanticAccessExpansion=e.semanticAccessExpansion===true;fs.writeFileSync(jp,JSON.stringify(journal,null,2)+'\n');
          NODE
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then AFTER_SHA="$(sha256sum "$ORBIT360_RECON_EVIDENCE" | awk '{print $1}')"; test "$BEFORE_SHA" = "$AFTER_SHA"; fi
          git config user.name orbit360-auth-readonly-bot
          git config user.email orbit360-auth-readonly-bot@users.noreply.github.com
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_LIFECYCLE" "$ORBIT360_STAGE_JOURNAL"
          if [ -f "$EVIDENCE_DIR/preflight-sanitizado.json" ]; then git add "$EVIDENCE_DIR/preflight-sanitizado.json"; fi
          if [ -f "$ORBIT360_PREFLIGHT_EVIDENCE" ]; then git add "$ORBIT360_PREFLIGHT_EVIDENCE"; fi
          if [ -f "$ORBIT360_RECON_EVIDENCE" ]; then git add "$ORBIT360_RECON_EVIDENCE"; fi
          if ! git diff --cached --quiet; then git commit -m 'auth: persist gate 14.3 run-bound evidence [skip ci]'; git push origin "HEAD:$ORBIT360_BRANCH"; fi
      - name: Require exact phase PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ORBIT360_RECON_EVIDENCE"
          if [ "$ORBIT360_PIPELINE_MODE" = repair ]; then
            jq -e --arg run "$GITHUB_RUN_ID" '.ok==true and (.status=="TARGET_MEMBERSHIP_SCOPE_CANONICAL_REPAIR_PASS" or .status=="TARGET_MEMBERSHIP_SCOPE_ALREADY_CANONICAL") and .classification=="PASS" and .runId==$run and .validatorRevision=="canonical-scope-repair-v1-semantic-noexpansion" and .authWrites==0 and (.firestoreWrites==0 or .firestoreWrites==1) and .semanticAccessExpansion==false and .beforeEffectiveDefaultScope=="all" and .afterEffectiveDefaultScope=="all" and .readbackUnchangedExceptTarget==true' "$ORBIT360_RECON_EVIDENCE" >/dev/null
          else
            jq -e --arg run "$GITHUB_RUN_ID" '.ok==true and .status=="TARGET_IDENTITY_MEMBERSHIP_READONLY_PASS" and .classification=="PASS" and .runId==$run and .validatorRevision=="canonical-multirol-v2-fresh-evidence-bound" and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .readbackUnchanged==true' "$ORBIT360_RECON_EVIDENCE" >/dev/null
          fi
