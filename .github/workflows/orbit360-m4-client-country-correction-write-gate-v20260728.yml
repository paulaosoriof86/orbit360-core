name: Orbit 360 · M4 61 client GT/GTQ corrections · WRITE_ONCE
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m4-client-country-correction-write-request-v20260728.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m4-client-country-correction-write
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block4-client-country-correction-write-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m4-client-country-correction-write-request-v20260728.json
  ORBIT360_EXISTING_FIREBASE_PROJECT_ID: ays-orbit-360-lab
jobs:
  correction-write:
    name: M4 · Apply exactly 61 GT/GTQ client corrections · Atomic write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2, persist-credentials: false}
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validar autorización inmutable sin acceso externo
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${ORBIT360_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),bad=[];
          if(r.schemaVersion!=='orbit360-m4-client-country-correction-write-request-v1'||r.contractVersion!=='4.2.11')bad.push('schema');
          if(r.gateId!==process.env.ORBIT360_GATE_ID||r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent)bad.push('binding');
          if(r.explicitAuthorization!==true||r.allowedExecutions!==1||r.atomicClientCorrectionWrite!==true)bad.push('authorization');
          if(r.expectedProjectId!==process.env.ORBIT360_EXISTING_FIREBASE_PROJECT_ID||r.expectedClients!==414||r.expectedInsurers!==26||r.expectedCorrections!==61||r.country!=='GT'||r.currency!=='GTQ')bad.push('baseline');
          if(r.snapshotWritesAuthorized!==61||r.auditWritesAuthorized!==61||r.clientUpdatesAuthorized!==61||r.emergencyRollbackAuthorized!==true||r.maxRollbackRestores!==61||r.maxRollbackAuditEvents!==61)bad.push('write_boundary');
          if(r.insurerWrites!==false||r.targetOverlayWrites!==false||r.configurationWrites!==false||r.membershipWrites!==false||r.deletes!==false||r.merges!==false||r.imports!==false||r.policies!==false||r.applyRules!==false||r.hostingDeploy!==false||r.functionsDeploy!==false||r.production!==false||r.mergeMain!==false)bad.push('scope');
          if(r.containsPII!==false||r.containsSecrets!==false)bad.push('sanitization');if(bad.length)throw new Error('REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico antes de secretos y escrituras
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="4.2.11" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .activationMode=="immutable_request_present" and .validationMode=="executed_contract_fixtures" and .literalSourceInspection==false and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Probar contrato antes de secretos y escrituras
        run: node tools/orbit360-m4-client-country-correction-write-contract-v20260728.cjs
      - name: Resolver cuenta existente después del preflight
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m4-client-country-correction-write.json"; printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_EXISTING_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"; echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Instalar dependencia controlada
        run: npm install --no-save --ignore-scripts firebase-admin@13
      - name: Ejecutar corrección atómica de exactamente 61 clientes
        run: node tools/orbit360-m4-client-country-correction-write-v20260728.mjs
      - name: Validar evidencia sanitizada
        shell: bash
        run: |
          jq -e '.ok==true and .status=="M4_CLIENT_COUNTRY_CORRECTION_WRITE_COMPLETED" and .transactionCommitted==true and .priorCorrectionDryRunValidated==true and .postRetirementRevalidationValidated==true and .before.sourceClients==414 and .before.sourceInsurers==26 and .before.targetClients==0 and .before.targetInsurers==0 and .selection.records==61 and .selection.missingCurrency==61 and .selection.nonCanonicalCountry==61 and .selection.country=="GT" and .selection.currency=="GTQ" and .selection.deterministicSelection==true and .selection.recordIdsExported==false and .selection.rawValuesExported==false and .writes.snapshotWrites==61 and .writes.auditWrites==61 and .writes.clientUpdates==61 and .writes.totalOperationalWrites==183 and .writes.insurerWrites==0 and .writes.targetOverlayWrites==0 and .after.sourceClients==414 and .after.sourceInsurers==26 and .after.targetClients==0 and .after.targetInsurers==0 and .after.correctedClients==61 and .after.missingCurrencyRemaining==0 and .after.countryCanonicalForCorrected==true and .after.currencyCanonicalForCorrected==true and .after.nonCandidateDigestUnchanged==true and .rollback.available==true and .rollback.snapshotCount==61 and .rollback.executed==false and .audit.mode=="append_only" and .audit.eventsWritten==61 and .verification.snapshotReadback==61 and .verification.auditReadback==61 and .verification.correctedClientReadback==61 and .verification.sourceCountsUnchanged==true and .verification.targetOverlayStillZero==true and .approvalReadyForM4ClosureReview==true and .approvalReadyForPolicies==false and .policiesBlocked==true and .containsPII==false and .containsSecrets==false' orbit360-platform/runtime-gate-crm-v20260716/m4-client-country-correction-write-summary.json >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m4-client-country-correction-write-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-client-country-correction-write-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-client-country-correction-write-summary.json
          retention-days: 30
      - name: Publicar estado observable sanitizado
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          summary='orbit360-platform/runtime-gate-crm-v20260716/m4-client-country-correction-write-summary.json'; state=failure; description='M4 61 GT/GTQ correction write failed'
          if [ -f "$summary" ] && [ "$(jq -r '.ok // false' "$summary")" = true ]; then state=success; description='M4 61 GT/GTQ correction write completed'; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m4-client-country-correction-write"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - name: Limpiar material efímero
        if: always()
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-}"
