name: Orbit360 Fase A Ops Leads CRM Release Source Only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'tools/orbit360-fase-a-ops-leads-crm-release-contract-v20260812.json'
      - 'tools/orbit360-fase-a-ops-leads-crm-auth-matrix-v20260812.mjs'
      - 'tools/orbit360-validar-fase-a-ops-leads-crm-release-source-v20260812.mjs'
      - '.github/workflows/orbit360-fase-a-ops-leads-crm-release-source-v20260812.yml'
permissions:
  contents: read
concurrency:
  group: orbit360-fase-a-ops-leads-crm-release-source-v20260812
  cancel-in-progress: false
jobs:
  source-only:
    name: Fase A Ops Leads CRM source-only preparation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scope and source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-fase-a-ops-leads-crm-auth-matrix-v20260812.mjs
          node --check tools/orbit360-validar-fase-a-ops-leads-crm-release-source-v20260812.mjs
          node --check orbit360-platform/modules/ops.js
          node --check orbit360-platform/modules/leads.js
          node --check orbit360-platform/core/ciclo.js
      - name: Validate existing canonical Block1 source contract without runtime
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.failed==0 and .executionAuthorized==false and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Validate Fase A release evidence delta source-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-fase-a-ops-leads-crm-release-source-v20260812.mjs
          jq -e '.status=="GO_FASE_A_OPS_LEADS_CRM_SOURCE_ONLY_PREP" and .checksFailed==0 and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .runtimeAuthorizationPresent==false and .canonicalRegistrationPending==true and .ok==true' orbit360-platform/runtime-gate-crm-v20260716/fase-a-ops-leads-crm-release-source-sanitized-v20260812.json >/dev/null
      - name: Upload sanitized source-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-fase-a-ops-leads-crm-release-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/fase-a-ops-leads-crm-release-source-sanitized-v20260812.json
          retention-days: 14
