name: Orbit360 F2 Request10 Route Visibility Validator Sourcefix 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/f2-request10-route-visibility-validator-sourcefix-target-v20260820.json'
permissions:
  contents: write
concurrency:
  group: orbit360-f2-request10-route-visibility-sourcefix
  cancel-in-progress: false
jobs:
  sourcefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inert sourcefix boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          node --check tools/orbit360-f2-request10-route-visibility-validator-sourcefix-v20260820.mjs
          node --check tools/orbit360-test-f2-request10-route-visibility-validator-sourcefix-v20260820.mjs
          test -f tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs
          test "$(git hash-object tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs)" = '0bf28d3b6338f062de15f0ed96308f9eb94884ab'
      - name: Apply validator sourcefix only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-f2-request10-route-visibility-validator-sourcefix-v20260820.mjs
          node --check tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs
          node tools/orbit360-test-f2-request10-route-visibility-validator-sourcefix-v20260820.mjs
          jq -e '.ok==true and .status=="F2_REQUEST10_ROUTE_VISIBILITY_VALIDATOR_SOURCEFIX_APPLIED" and .classification=="VALIDATOR_STALE_ROOTFIX" and .request10RunId==32318415706 and .request10EvidenceArtifactId==9388976113 and .candidateArtifactId==9387820198 and .productMutation==false and .candidateRebuild==false and .dataMutation==false and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .membershipWrites==0 and .dataWrites==0 and .operationalWrites==0 and .deployExecuted==false and .publicationExecuted==false and .productionTouched==false and .request11Created==false and .request11Authorized==false' orbit360-platform/runtime-gate-crm-v20260716/f2-request10-route-visibility-validator-sourcefix-v20260820.json >/dev/null
          git diff --check
          mapfile -t CHANGED < <(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "${CHANGED[@]}"
          test "${#CHANGED[@]}" = '2'
          test "${CHANGED[0]}" = 'orbit360-platform/runtime-gate-crm-v20260716/f2-request10-route-visibility-validator-sourcefix-v20260820.json'
          test "${CHANGED[1]}" = 'tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs'
      - name: Persist sourcefix and sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-sourcefix-bot'
          git config user.email 'orbit360-sourcefix-bot@users.noreply.github.com'
          git add tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs orbit360-platform/runtime-gate-crm-v20260716/f2-request10-route-visibility-validator-sourcefix-v20260820.json
          git commit -m 'fix(f2): close Request10 route visibility validator stale'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
