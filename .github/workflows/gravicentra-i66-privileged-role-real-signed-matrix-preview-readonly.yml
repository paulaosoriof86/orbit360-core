# Browser signed as the actual two existing users, isolated Preview, NO WRITES.
name: Gravicentra I6.6 Signed Actual Eight Module Matrix Preview READ ONLY
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-privileged-role-real-signed-matrix-preview-readonly.yml
      - tools/gravicentra-i66-privileged-role-signed-ui-permissions-readonly.cjs
permissions:
  contents: read
jobs:
  actual-signed-preview-matrix:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert all product owners still match immutable Preview source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0153f5cbbe00c3732e11ebae59b32bd357e38bfd HEAD
          test -z "$(git diff --name-only 0153f5cbbe00c3732e11ebae59b32bd357e38bfd HEAD -- orbit360-platform functions)"
          node --check tools/gravicentra-i66-privileged-role-signed-ui-permissions-readonly.cjs
      - name: Sign in as actual Carlos and Paula to existing Preview and verify eight modules
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
          node tools/gravicentra-i66-privileged-role-signed-ui-permissions-readonly.cjs
