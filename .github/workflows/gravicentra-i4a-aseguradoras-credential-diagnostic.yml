name: Gravicentra I4A Aseguradoras Credential Diagnostic

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - artifacts/orbit360-recovery/release-control/I4A_ASEGURADORAS_DIAGNOSTIC_INTENT.json

permissions:
  contents: read

concurrency:
  group: gravicentra-recovery-i4a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aseguradoras-credential-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Recovery control plane with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: release
        name: Fail closed against canonical CONTROL_PLANE
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-control-plane-guard-v2.mjs --mode=i4a
          node --check tools/gravicentra-i4a-aseguradoras-credential-diagnostic-v1.mjs

      - name: Validate diagnostic intent and frozen release binding
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const i=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I4A_ASEGURADORAS_DIAGNOSTIC_INTENT.json','utf8'));
          const need=(ok,code)=>{if(!ok)throw new Error(code);};
          need(i.schemaVersion==='gravicentra-i4a-aseguradoras-diagnostic-intent-v1','ASEGURADORAS_DIAG_INTENT_SCHEMA_INVALID');
          need(i.nonAuthoritative===true,'ASEGURADORAS_DIAG_INTENT_MUST_BE_NON_AUTHORITATIVE');
          need(i.gate==='I4A','ASEGURADORAS_DIAG_GATE_INVALID');
          need(i.certifiedSourceSha===process.env.SOURCE_SHA,'ASEGURADORAS_DIAG_SOURCE_MISMATCH');
          need(i.buildId===process.env.BUILD_ID,'ASEGURADORAS_DIAG_BUILD_MISMATCH');
          need(i.previewUrl===process.env.PREVIEW_URL,'ASEGURADORAS_DIAG_PREVIEW_MISMATCH');
          need(i.productionMutationAuthorized===false&&i.operationalDataWritesAuthorized===false,'ASEGURADORAS_DIAG_MUTATION_FORBIDDEN');
          console.log('ASEGURADORAS_DIAGNOSTIC_INTENT=PASS');
          NODE

      - name: Install diagnostic dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Execute ref-specific read-only credential diagnostic
        env:
          I4A_ASEGURADORAS_DIAG_DIR: ${{ runner.temp }}/gravicentra-i4a-aseguradoras-diag
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i4a-aseguradoras-credential-diagnostic-v1.mjs

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-aseguradoras-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-aseguradoras-diag
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo '## Gravicentra Insurance — I4A Aseguradoras ref-specific diagnostic'
            echo "- Certified source: \`$SOURCE_SHA\`"
            echo "- Build: \`$BUILD_ID\`"
            echo "- Preview: $PREVIEW_URL"
            echo '- Privileged roles: Dirección, SuperAdmin, AdminTenant, Operativo'
            echo '- Credential refs recorded: `false`'
            echo '- Secret values recorded: `false`'
            echo '- Production mutation authorized: `false`'
            echo '- Operational writes authorized: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
