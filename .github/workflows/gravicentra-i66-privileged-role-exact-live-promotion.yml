          I66_PREVIEW_ORIGIN=https://app.aysseguros.com I66_SIGNED_TEST_LIVE=true node tools/gravicentra-i6-6-proposal-application-signed-uat.cjs
          if test "$I66_DIRECT_FORMS_QA" = true; then
            I66_RENEWAL_QA_PHASE=LIVE node tools/gravicentra-i6-6-carlos-paula-live-direct-renewal-synthetic-uat.cjs
          fi
          node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-role-live-functions-after.json"
          node - <<'LIVE_INVENTORY'
