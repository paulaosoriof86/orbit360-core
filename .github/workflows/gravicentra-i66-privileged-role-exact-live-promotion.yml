# I6.6 critical-role release. Same immutable artifact as signed Preview; only
# the exact authorized existing production functions, then exact Hosting clone.
# Entire authorized function/dual-origin change rolls back on missing evidence.
name: Gravicentra I6.6 Five Role Exact LIVE With Rollback
on:
  workflow_dispatch:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-privileged-role-three-function-exact-live
  cancel-in-progress: false
jobs:
  phase:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.phase.outputs.authorized }}
      make_ingress: ${{ steps.phase.outputs.make_ingress }}
      configuration_operation: ${{ steps.phase.outputs.configuration_operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read canonical LIVE phase without credentials or mutations
        id: phase
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
          let authorized=c.status==='OPERATIONAL_EXACT_LIVE_PROMOTION_AUTHORIZED';
          const p=c.operationalReleaseCandidate||c.lastConsumedOperationalCandidate,makeIngress=p?.makeIngressComposite===true;
          const before=process.env.GITHUB_EVENT_NAME==='push'?JSON.parse(require('node:child_process').execFileSync('git',['show',
            'HEAD^:artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json'],{encoding:'utf8'})):null;
          if(authorized&&makeIngress&&before)authorized=JSON.stringify(before.operationalReleaseCandidate)!==JSON.stringify(p);
          const op=c.makeIngressProtectedOperation;
          const configurationOperation=Boolean(makeIngress&&c.status==='OPERATIONAL_EXACT_LIVE_ACCEPTED_LOCKED'&&
            !c.operationalReleaseCandidate&&!c.scopedBackendPreviewI66&&op?.phase==='live'&&op.sourceSha===p.sourceSha&&
            (!before||JSON.stringify(before.makeIngressProtectedOperation)!==JSON.stringify(op)));
          if(configurationOperation)require('./tools/gravicentra-i66-make-lead-protected-executor.cjs').requireOperation(op,p,'live');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'authorized='+String(authorized)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'make_ingress='+String(makeIngress)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'configuration_operation='+String(configurationOperation)+'\n');
          console.log(authorized?'I66_OPERATIONAL_LIVE_PHASE_READY_FOR_STRICT_GATES':'I66_OPERATIONAL_LIVE_PHASE_NOOP');
          NODE
  exact-role-live:
    needs: phase
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831' && needs.phase.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.phase.outputs.make_ingress == 'true' && 85 || 65 }}
    permissions:
      contents: write
      actions: read
    env:
      I66_MAKE_INGRESS: ${{ needs.phase.outputs.make_ingress }}
      PROJECT_ID: ays-orbit-360-lab
      SITE: ays-orbit-360-lab
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate exact signed Preview, unchanged product owners and immutable artifact
        run: |
          set -euo pipefail
          node --test tools/gravicentra-i6-6-workflow-candidate-resolution.test.cjs
          node --test tools/gravicentra-i66-composite-acceptance.test.cjs tools/gravicentra-i66-frontend-control.test.cjs tools/gravicentra-i66-frontend-promotion-transaction.test.cjs
          node tools/gravicentra-i6-6-direction-preview-legal-acceptance.cjs --preflight-live-authority
          node --test tools/gravicentra-i6-6-operational-release-candidate.test.cjs
          if test "$I66_MAKE_INGRESS" = true;then node --test tools/gravicentra-i6-6-make-lead-ingress-release.test.cjs tools/gravicentra-i6-6-financial-page-read-efficiency.test.cjs;fi
          node --test tools/gravicentra-i6-6-preview-candidate-binding.test.cjs
          node --test tools/gravicentra-i6-6-direction-preview-i66-consent-scope.test.cjs
          node --test tools/gravicentra-i6-6-direction-live-legal-acceptance.test.cjs
          node --test tools/gravicentra-i6-6-technical-preview-rollover.test.cjs
          node --test tools/gravicentra-i6-6-source-intake-readiness.test.cjs
          node --test tools/gravicentra-i6-6-operational-live-acceptance.test.cjs
          node --test tools/gravicentra-i6-6-live-proof-artifact-layout.test.cjs
          node tools/gravicentra-i6-6-operational-release-candidate.cjs live
          node --check tools/gravicentra-i6-6-carlos-paula-live-synthetic-ops-leads-uat.cjs
          node --check tools/gravicentra-i66-privileged-role-signed-ui-permissions-readonly.cjs
          node --check tools/gravicentra-i66-privileged-role-exact-live-transport.mjs
          node tools/gravicentra-i6-6-delta-guard.mjs > "$RUNNER_TEMP/gi-role-source-guard.log"
          node --test tools/gravicentra-i6-6-privileged-role-portfolio-parity.test.cjs tools/gravicentra-i6-6-privileged-role-writer-transaction.test.cjs
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.I66_PREVIEW_QA_ARTIFACT_ID }}
          run-id: ${{ env.I66_PREVIEW_QA_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/gi-i66-operational-preview-proof
      - name: Verify durable signed Preview proof is for this same immutable source and artifact
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const p=g.candidateForPhase(require('./'+g.CONTROL),'live');
          const proof=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gi-i66-operational-preview-proof/i66-operational-preview-proof.json','utf8'));
          g.validateProof(p,proof);
          if(proof.runId!==p.previewQa.runId||proof.headSha!==p.previewQa.headSha)throw Error('I66_OPERATIONAL_PREVIEW_RECEIPT_RUN_IDENTITY_DRIFT');
          console.log('I66_OPERATIONAL_SAME_ARTIFACT_SIGNED_PREVIEW_PROOF_PASS');
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.I66_ROLE_ARTIFACT_ID }}
          run-id: ${{ env.I66_ROLE_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gi-i66-role-live-archive
      - name: Read immutable TAR and exact backend and frontend source without rebuilding
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/gi-i66-role-live-archive"
          mapfile -t TARS < <(find "$DL" -maxdepth 3 -type f -name 'gi-i66-exact-package.tar.gz')
          mapfile -t SUMS < <(find "$DL" -maxdepth 3 -type f -name 'gi-i66-exact-package.sha256')
          test "${#TARS[@]}" -eq 1 && test "${#SUMS[@]}" -eq 1
          test "$(dirname "${TARS[0]}")" = "$(dirname "${SUMS[0]}")"
          test "$(sha256sum "${TARS[0]}" | awk '{print $1}')" = "$(awk '{print $1}' "${SUMS[0]}")"
          FROOT="$RUNNER_TEMP/gi-i66-role-live-package"
          mkdir -p "$FROOT"
          tar -xzf "${TARS[0]}" -C "$FROOT" --no-same-owner
          (cd "$FROOT/bundle/backend" && sha256sum --check --quiet "$FROOT/evidence/backend-manifest.sha256")
          export I66_PACKAGE_ROOT="$FROOT"
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const p=process.env.I66_PACKAGE_ROOT+'/bundle';
          const m=JSON.parse(fs.readFileSync(p+'/site/__recovery__/build.json','utf8'));
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          g.validateBuildMarker(g.candidateForPhase(require('./'+g.CONTROL),'live'),m);
          assert.equal(m.sourceSha,process.env.I66_ROLE_SOURCE_SHA);
          assert.equal(m.gate,'I6.6');assert.equal(m.product,'Gravicentra Insurance');
          for(const [target,source] of [
            ['backend/b4-003-scoped-access-boundary.js','functions/b4-003-scoped-access-boundary.js'],
            ['backend/b4-003-scoped-related-reader.js','functions/b4-003-scoped-related-reader.js'],
            ['backend/product-operational-domain.js','functions/product-operational-domain.js'],
            ['backend/product-ops-leads-domain.js','functions/product-ops-leads-domain.js'],
            ['backend/cobros-reconciliation-domain.js','functions/cobros-reconciliation-domain.js'],
            ['backend/advisor-commission-payable-contract.js','functions/advisor-commission-payable-contract.js'],
            ['backend/advisor-assignment-correction-contract.js','functions/advisor-assignment-correction-contract.js'],
            ['backend/proposal-application-boundary.js','functions/proposal-application-boundary.js'],
            ['backend/payment-inference-engine.js','functions/payment-inference-engine.js'],
            ['backend/i66-conciliaciones-active-ledger-projection.js','functions/i66-conciliaciones-active-ledger-projection.js'],
            ['site/core/access-scope.js','orbit360-platform/core/access-scope.js']
          ])assert.ok(fs.readFileSync(p+'/'+target).equals(execFileSync('git',['show',process.env.I66_ROLE_SOURCE_SHA+':'+source])),'I66_ROLE_PRODUCT_OWNER_BYTES_DIFFER:'+source);
          if(process.env.I66_MAKE_INGRESS==='true'){
            const scope=require('./tools/gravicentra-i66-make-release-scope.cjs');
            const source=file=>execFileSync('git',['show',process.env.I66_ROLE_SOURCE_SHA+':'+file]);
            const packager=source(scope.PACKAGER_PATH);
            for(const file of scope.SOURCE_PATHS)scope.validatePackagedSourceBytes(file,source(file),
              fs.readFileSync(p+'/backend/'+file.slice(10)),packager);
          }
          assert.ok(fs.existsSync(p+'/backend/bootstrap.js')&&fs.existsSync(p+'/backend/package-lock.json'));
          console.log('I66_ROLE_ORIGINAL_PREVIEW_ARTIFACT_EXACT_BACKEND_AND_FRONTEND_BYTES_PASS');
          NODE
          node tools/gravicentra-i6-6-direction-preview-legal-acceptance.cjs --preflight-live-package
          (cd "$FROOT/bundle/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"bundle/backend","runtime":"nodejs22"}}\n' > "$FROOT/firebase.functions-transport.json"
          echo "I66_PACKAGE_ROOT=$FROOT" >> "$GITHUB_ENV"
          echo "I66_LIVE_FIREBASE_CONFIG=$FROOT/firebase.functions-transport.json" >> "$GITHUB_ENV"
      - name: Authenticate existing same-project LAB credentials and install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-role-live-auth"
          python3 - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-role-live-auth'
          found=[]
          for i,k in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:v=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError):continue
              if v.get('type')=='service_account' and v.get('project_id')=='ays-orbit-360-lab' and v.get('private_key'):
                  f=root/f'{i}.json';f.write_text(json.dumps(v));f.chmod(0o600);found.append(str(f))
          if not found:raise SystemExit('I66_ROLE_SIGNED_CONFIGURED_CREDENTIAL_MISSING')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-role-live-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-role-live-cli"
          CLI="$RUNNER_TEMP/gi-role-live-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r f;do
            if GOOGLE_APPLICATION_CREDENTIALS="$f" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-role-live-functions-before.json" 2>/dev/null;then selected="$f";break;fi
          done < "$RUNNER_TEMP/gi-role-live-auth/candidates"
          test -n "$selected"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$selected" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund google-auth-library@10.9.1 firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Verify exact financial Preview report and read-only authority before five-target LIVE deployment
        if: env.I66_MAKE_INGRESS == 'true'
        run: node tools/gravicentra-i66-frontend-promotion-owner.cjs --verify-composite-financial-preview
      - name: Test signed existing Carlos and Direction Preview eight-module permissions before touching LIVE
        run: |
          set -euo pipefail
          node tools/gravicentra-i66-privileged-role-signed-ui-permissions-readonly.cjs
          echo 'I66_LIVE_PREFLIGHT_TWO_REAL_SIGNED_ACTORS_ALL_VISIBLE_MODULES_PERMISSIONS_PASS_NO_WRITES'
      - name: Snapshot exact LIVE function revisions, inventory and previous Hosting version for rollback
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          node - <<'NODE'
          const assert=require('node:assert/strict'),a=require(process.env.RUNNER_TEMP+'/gi-role-live-functions-before.json');
          const rows=Array.isArray(a.result)?a.result:Array.isArray(a)?a:[];
          const id=x=>String(x.entryPoint||x.id||x.name||'').split('/').pop();
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const p=g.candidateForPhase(JSON.parse(require('node:fs').readFileSync(g.CONTROL,'utf8')),'live');
          if(p.makeIngressComposite===true)require('./tools/gravicentra-i66-make-release-scope.cjs').validateInventoryBefore(p,'live',a,g.targetsForCandidate(p,'live'));
          for(const {name,region} of g.targetsForCandidate(p,'live')){
            if(p.makeIngressComposite===true&&name==='orbit360MakeLeadIngress'&&p.makeIngress.targetBefore.live.state==='ABSENT')continue;
            const match=rows.filter(x=>id(x)===name);assert.equal(match.length,1,'I66_ROLE_EXISTING_LIVE_TARGET_NOT_UNIQUE_'+name);
            assert.equal(String(match[0].region||match[0].location||''),region,'I66_ROLE_LIVE_TARGET_REGION_DRIFT');
          }
          console.log('I66_ROLE_AUTHORIZED_PREEXISTING_LIVE_TARGETS_ONLY_PASS count='+g.targetsForCandidate(p,'live').length);
          NODE
          : > "$RUNNER_TEMP/gi-role-live-old-revisions.tsv"
          LIVE_TARGET_COUNT="$(node - <<'LIVE_TARGETS'
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const candidate=g.candidateForPhase(require('./'+g.CONTROL),'live');
          process.stdout.write(String(g.targetsForCandidate(candidate,'live').length));
          LIVE_TARGETS
          )"
          PAIRS='orbit360ProductOperationalCommand:us-central1 orbit360CobrosReconciliationCommand:us-central1 orbit360ScopedPolicyRead:us-east1'
          if test "$LIVE_TARGET_COUNT" -eq 5;then
            PAIRS="$PAIRS orbit360OpsLeadsCommand:us-central1 orbit360MakeLeadIngress:us-central1"
            node tools/gravicentra-i66-make-lead-protected-executor.cjs snapshot-trigger live
          elif test "$LIVE_TARGET_COUNT" -eq 4;then
            PAIRS="$PAIRS orbit360OpsLeadsCommand:us-central1"
          elif test "$LIVE_TARGET_COUNT" -ne 3;then
            echo 'I66_LIVE_AUTHORIZED_TARGET_COUNT_INVALID' >&2
            exit 1
          fi
          for PAIR in $PAIRS;do
            FN="${PAIR%:*}";REGION="${PAIR#*:}";export FN REGION
            if test "$FN" = orbit360MakeLeadIngress && test "$I66_MAKE_TRIGGER_PREVIOUS_STATE" = ABSENT;then
              printf '%s|%s|-|ABSENT\n' "$FN" "$REGION" >> "$RUNNER_TEMP/gi-role-live-old-revisions.tsv"
              continue
            fi
            gcloud functions describe "$FN" --gen2 --region "$REGION" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/gi-role-before-fn.json"
            SERVICE=$(node - <<'NODE'
          const f=require(process.env.RUNNER_TEMP+'/gi-role-before-fn.json');
          const route=String(f.serviceConfig?.service||''),s=route.split('/').at(-1);
          if(!route.includes('/locations/'+process.env.REGION+'/services/')||!/^[a-z][a-z0-9-]+$/.test(s))throw Error('I66_ROLE_PREVIOUS_FUNCTION_SCOPE_NOT_EXACT');
          process.stdout.write(s);
          NODE
            )
            export SERVICE
            gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/gi-role-before-service.json"
            OLD_REV=$(node - <<'NODE'
          const r=require(process.env.RUNNER_TEMP+'/gi-role-before-service.json');
          const active=(r.status?.traffic||r.traffic||[]).filter(x=>Number(x.percent)>0);
          const rev=String(active[0]?.revisionName||active[0]?.revision||'');
          if(active.length!==1||Number(active[0].percent)!==100||!rev.startsWith(process.env.SERVICE+'-'))throw Error('I66_ROLE_PREVIOUS_LIVE_TRAFFIC_NOT_PINNED');
          process.stdout.write(rev);
          NODE
            )
            printf '%s|%s|%s|%s\n' "$FN" "$REGION" "$SERVICE" "$OLD_REV" >> "$RUNNER_TEMP/gi-role-live-old-revisions.tsv"
          done
          EXPECTED_REVISIONS="$LIVE_TARGET_COUNT"
          test "$(wc -l < "$RUNNER_TEMP/gi-role-live-old-revisions.tsv")" -eq "$EXPECTED_REVISIONS"
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsSL --max-time 25 -H "Authorization: Bearer $TOKEN" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/$SITE/channels/live/releases?pageSize=1" \
            > "$RUNNER_TEMP/gi-role-live-before-hosting.json"
          unset TOKEN
          OLD_VERSION=$(node - <<'NODE'
          const r=require(process.env.RUNNER_TEMP+'/gi-role-live-before-hosting.json');
          const s=String(r.releases?.[0]?.version?.name||'');
          const m=s.match(/^sites\/ays-orbit-360-lab\/versions\/([A-Za-z0-9_-]+)$/);
          if(!m)throw Error('I66_ROLE_PREVIOUS_HOSTING_VERSION_NOT_PINNED');
          if(s!==process.env.I66_PREVIOUS_HOSTING_VERSION)throw Error('I66_OPERATIONAL_LIVE_BACKUP_POINTER_CHANGED');
          process.stdout.write(m[1]);
          NODE
          )
          echo "I66_ROLE_ROLLBACK_HOSTING_VERSION=$OLD_VERSION" >> "$GITHUB_ENV"
          echo "I66_ROLE_AUTHORIZED_REVISIONS_AND_HOSTING_IMMUTABLE_ROLLBACK_POINTER_PASS count=$EXPECTED_REVISIONS"
      - name: Deploy exact authorized LIVE backend revisions and clone exact Preview artifact with automatic rollback
        env:
          I66_LIVE_ORIGIN: https://app.aysseguros.com
        run: |
          set -euo pipefail
          completed=0;started=0
          rollback(){
            code=$?
            if test "$started" = 1 && test "$completed" != 1;then
              set +e;failed=0
              if ! node tools/gravicentra-i66-frontend-promotion-owner.cjs --authorize-composite-rollback;then
                echo 'I66_ROLE_ROLLBACK_BLOCKED_COMMITTED_OR_UNDETERMINED_NO_PHYSICAL_MUTATIONS'
                if test "$code" = 0;then code=1;fi
                exit "$code"
              fi
              if test "$I66_MAKE_INGRESS" = true;then
                node tools/gravicentra-i66-make-lead-protected-executor.cjs rollback live || failed=1
              fi
              while IFS='|' read -r FN REGION SERVICE OLD_REV;do
                if test "$OLD_REV" = ABSENT;then continue;fi
                gcloud run services update-traffic "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --to-revisions="$OLD_REV=100" --quiet || failed=1
                export OLD_REV
                gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/gi-role-rollback-service.json" || failed=1
                node - <<'NODE' || failed=1
          const s=require(process.env.RUNNER_TEMP+'/gi-role-rollback-service.json');
          const active=(s.status?.traffic||s.traffic||[]).filter(x=>Number(x.percent)>0);
          if(active.length!==1||Number(active[0].percent)!==100||String(active[0].revisionName||active[0].revision)!==process.env.OLD_REV)
            throw Error('I66_OPERATIONAL_BACKEND_ROLLBACK_READBACK_FAILED');
          NODE
              done < "$RUNNER_TEMP/gi-role-live-old-revisions.tsv"
              node "$FIREBASE_CLI_BIN" hosting:clone "$SITE@$I66_ROLE_ROLLBACK_HOSTING_VERSION" "$SITE:live" --project "$PROJECT_ID" --non-interactive || failed=1
              for o in https://ays-orbit-360-lab.web.app https://app.aysseguros.com;do
                curl -fsSL --retry 3 --retry-delay 3 --max-time 30 "$o/__recovery__/build.json" > "$RUNNER_TEMP/gi-role-rollback-hosting-marker.json" || failed=1
                node - <<'NODE' || failed=1
          const b=require(process.env.RUNNER_TEMP+'/gi-role-rollback-hosting-marker.json');
          if(b.sourceSha!==process.env.I66_PREVIOUS_SOURCE_SHA||b.buildId!==process.env.I66_PREVIOUS_BUILD_ID)
            throw Error('I66_OPERATIONAL_HOSTING_ROLLBACK_READBACK_FAILED');
          NODE
              done
              if test "$failed" = 0;then
                node tools/gravicentra-i66-frontend-promotion-owner.cjs --record-composite-rollback || failed=1
              fi
              echo "I66_ROLE_AUTO_ROLLBACK_FAILURE_COUNT=$failed"
              if test "$failed" != 0;then echo 'I66_ROLE_CRITICAL_ROLLBACK_NOT_VERIFIED';fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          printf '[]\n' > "$RUNNER_TEMP/gi-role-effective-revisions.json"
          LIVE_TARGET_COUNT="$(node - <<'LIVE_DEPLOY_TARGETS'
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const candidate=g.candidateForPhase(require('./'+g.CONTROL),'live');
          process.stdout.write(String(g.targetsForCandidate(candidate,'live').length));
          LIVE_DEPLOY_TARGETS
          )"
          started=1
          if test "$LIVE_TARGET_COUNT" -eq 5;then
            node tools/gravicentra-i66-make-lead-protected-executor.cjs before-deploy live
            node tools/gravicentra-i66-make-firebase-project-iam-guard.cjs "$FIREBASE_CLI_BIN" live deploy \
            --only functions:orbit360ProductOperationalCommand,functions:orbit360CobrosReconciliationCommand,functions:orbit360ScopedPolicyRead,functions:orbit360OpsLeadsCommand,functions:orbit360MakeLeadIngress \
