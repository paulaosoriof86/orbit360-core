          if(p.makeIngressComposite===true)require('./tools/gravicentra-i66-make-release-scope.cjs').validateInventoryAfter(p,'live',before,after,expected);
          else assert.deepEqual(rows(before).map(id).sort(),rows(after).map(id).sort(),'I66_ROLE_NON_TARGET_FUNCTION_INVENTORY_CHANGED');
          for(const {name,region} of expected){
