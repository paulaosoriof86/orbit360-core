              preview,secretIamReadback,secretIamWrites:secretIamReadback.iamWrites,configurationWritesOutsideDataOnly:true,externalMessagesSent:0};
          }
          p.sameImmutableArtifact=true;p.liveBackendSameArtifact=true;
          p.functionsInventoryUnchangedExceptTargets=true;p.rollbackSnapshotReady=true;
          p.fullI66ProductionAccepted=false;
          const proposal=JSON.parse(fs.readFileSync(process.env.I66_PACKAGE_ROOT+'/evidence/i66-proposal-application-signed-uat-live.json','utf8'));
          const advisor=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gravicentra-i66-advisor-payables-signed-uat-live.json','utf8'));
          p.directionLiveLegalAcceptance={advisorPayables:advisor.directionLiveLegalAcceptance,proposalApplication:proposal.directionLiveLegalAcceptance};
          p.sourceIntake=require('./tools/gravicentra-i6-6-proposal-uat-diagnostics.cjs').safeSourceIntakeEvidence(proposal.sourceIntake);
          p.runId=Number(process.env.GITHUB_RUN_ID);p.headSha=process.env.GITHUB_SHA;
          p.recordedAtUtc=new Date().toISOString();
          g.validateLiveProof(candidate,p);
          fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          NODE
          if test "$LIVE_TARGET_COUNT" -ge 4;then
