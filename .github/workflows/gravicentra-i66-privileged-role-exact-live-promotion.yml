  protected-make-configuration:
    needs: phase
    if: needs.phase.outputs.configuration_operation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_ID: ays-orbit-360-lab
      GH_TOKEN: ${{ github.token }}
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a COMMITTED exact artifact before any real ingress configuration
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs'),e=require('./tools/gravicentra-i66-make-lead-protected-executor.cjs');
          const c=JSON.parse(fs.readFileSync(g.CONTROL)),p=e.resolveCandidate(c,'live',true);
          e.requireOperation(c.makeIngressProtectedOperation,p,'live');
          require('./tools/gravicentra-i66-make-release-scope.cjs').verifySourcePins(p);
          assert.equal(execFileSync('git',['diff','--name-only',p.sourceSha,'HEAD','--',...g.PINNED_OWNER_PATHS],{encoding:'utf8'}).trim(),'');
          const base='artifacts/orbit360-recovery/release-control/';
          require('./tools/gravicentra-i66-frontend-control.cjs').physicalGuard(JSON.parse(fs.readFileSync(base+'CONTROL_PLANE.json')),
            JSON.parse(fs.readFileSync('orbit360-platform/docs/recovery/orbit360-recovery-state-v1.json')),c,fs);
          const api=async suffix=>{const r=await fetch('https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/'+suffix,
            {headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
            assert.ok(r.ok);return r.json();};
          (async()=>{const[run,artifact]=await Promise.all([api('runs/'+p.buildRunId),api('artifacts/'+p.artifactId)]);
            g.validateArtifact(p,run,artifact);
            for(const[k,v]of Object.entries(g.envFor(p)))fs.appendFileSync(process.env.GITHUB_ENV,k+'='+v+'\n');
            console.log('I66_MAKE_COMMITTED_ARTIFACT_CONFIGURATION_AUTHORITY_PASS');
          })().catch(()=>{console.error('I66_MAKE_COMMITTED_CONFIGURATION_AUTHORITY_HOLD');process.exitCode=1;});
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.I66_ROLE_ARTIFACT_ID }}
          run-id: ${{ env.I66_ROLE_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gi-i66-make-operation-artifact
      - name: Reuse immutable backend SDK and verify every ingress source byte
        run: |
          set -euo pipefail
          mapfile -t TARS < <(find "$RUNNER_TEMP/gi-i66-make-operation-artifact" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz)
          mapfile -t SUMS < <(find "$RUNNER_TEMP/gi-i66-make-operation-artifact" -maxdepth 3 -type f -name gi-i66-exact-package.sha256)
          test "${#TARS[@]}" -eq 1 && test "${#SUMS[@]}" -eq 1
          test "$(dirname "${TARS[0]}")" = "$(dirname "${SUMS[0]}")"
          test "$(sha256sum "${TARS[0]}" | awk '{print $1}')" = "$(awk '{print $1}' "${SUMS[0]}")"
          export I66_PACKAGE_ROOT="$RUNNER_TEMP/gi-i66-make-operation-package"
          mkdir -p "$I66_PACKAGE_ROOT"
          tar -xzf "${TARS[0]}" -C "$I66_PACKAGE_ROOT" --no-same-owner
          (cd "$I66_PACKAGE_ROOT/bundle/backend" && sha256sum --check --quiet "$I66_PACKAGE_ROOT/evidence/backend-manifest.sha256")
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const s=require('./tools/gravicentra-i66-make-release-scope.cjs');
          const source=file=>execFileSync('git',['show',process.env.I66_ROLE_SOURCE_SHA+':'+file]);
          const packager=source(s.PACKAGER_PATH);
          for(const file of s.SOURCE_PATHS)s.validatePackagedSourceBytes(file,source(file),
            fs.readFileSync(process.env.I66_PACKAGE_ROOT+'/bundle/backend/'+file.slice(10)),packager);
          NODE
          (cd "$I66_PACKAGE_ROOT/bundle/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          echo "I66_PACKAGE_ROOT=$I66_PACKAGE_ROOT" >> "$GITHUB_ENV"
      - name: Select an existing authorized same-project credential without exposing it
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),{createRequire}=require('node:module');
          const requireFrom=createRequire(path.join(process.env.I66_PACKAGE_ROOT,'bundle/backend/package.json'));
          const {GoogleAuth}=requireFrom('google-auth-library');
          const root=path.join(process.env.RUNNER_TEMP,'gi-make-operation-auth');fs.mkdirSync(root,{recursive:true,mode:0o700});
          (async()=>{for(const [i,key]of ['SA_LAB','SA_ALT','SA_DEFAULT'].entries()){
            let v;try{v=JSON.parse(process.env[key]||'');}catch{continue;}
            if(v.type!=='service_account'||v.project_id!=='ays-orbit-360-lab'||!v.private_key)continue;
            const file=path.join(root,i+'.json');fs.writeFileSync(file,JSON.stringify(v),{mode:0o600});
            try{const auth=await new GoogleAuth({keyFilename:file,scopes:['https://www.googleapis.com/auth/cloud-platform']}).getClient();
              await auth.request({url:'https://cloudfunctions.googleapis.com/v2/projects/ays-orbit-360-lab/locations/us-central1/functions/orbit360MakeLeadIngress',method:'GET'});
              fs.appendFileSync(process.env.GITHUB_ENV,'GOOGLE_APPLICATION_CREDENTIALS='+file+'\n');
              console.log('I66_MAKE_EXISTING_PROJECT_CREDENTIAL_SELECTED');return;
            }catch{/* Try only the configured same-project credentials; never log provider errors. */}
          }throw Error();})().catch(()=>{console.error('I66_MAKE_EXISTING_PROJECT_CREDENTIAL_UNAVAILABLE');process.exitCode=1;});
          NODE
      - name: Execute only the exact authorized CAS or canonical readback operation
        run: node tools/gravicentra-i66-make-lead-protected-executor.cjs operate live
      - name: Preserve safe configuration and real ingress readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-make-live-configuration-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-make-live-operate.json
          retention-days: 30
          if-no-files-found: warn
