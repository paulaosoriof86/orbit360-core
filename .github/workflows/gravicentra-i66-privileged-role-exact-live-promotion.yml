          echo "I66_ROLE_AUTHORIZED_FUNCTIONS_SAME_IMMUTABLE_HOSTING_SIGNED_CARLOS_PAULA_LIVE_PASS count=$LIVE_TARGET_COUNT"
      - name: Preserve PII-free immutable release proof
        if: always()
