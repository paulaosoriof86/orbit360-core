          p.syntheticRestoreComplete=true;p.realFinancialOrCustomerWrites=0;
          p.focusedReports=g.focusedReportsFromDisk(candidate,'LIVE');
          p.buildId=candidate.buildId;p.buildRunId=candidate.buildRunId;p.previewQa=candidate.previewQa;
          p.previousLive=candidate.currentLive;p.targets=g.targetsForCandidate(candidate,'live');
          p.backendRevisions=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gi-role-effective-revisions.json','utf8'));
