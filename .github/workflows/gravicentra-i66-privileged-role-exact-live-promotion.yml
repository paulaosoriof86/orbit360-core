            assert.equal(String(found[0].region||found[0].location||''),region,'I66_LIVE_DEPLOYED_TARGET_REGION_DRIFT_'+name);
          }
          const targets=new Set(expected.map(x=>x.name));
          const untouched=x=>rows(x).filter(r=>!targets.has(id(r))).sort((l,r)=>id(l).localeCompare(id(r)));
