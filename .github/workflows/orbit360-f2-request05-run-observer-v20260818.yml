name: Orbit360 F2 Request11 Runtime Run Observer 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f2-request05-run-observer-v20260818.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: orbit360-f2-request11-run-observer-20260820
  cancel-in-progress: false
env:
  TARGET_SHA: 1809552cc6dceacae1527be34299ef17b32bff98
  TARGET_WORKFLOW_NAME: Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818
  TARGET_BRANCH: ays/backend-tenant-lab-v99-20260703
  REQUEST_PATH: .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-20260820-11.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  OBSERVER_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/f2-request11-runtime-run-observer-v20260820.json
jobs:
  observe_request11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify observer and immutable Request11 boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test -f "$REQUEST_PATH"
          jq -e '.requestOrdinal==11 and .status=="AUTHORIZED_ONCE" and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and .candidateArtifactId==9387820198 and .authorizationRecordPath==".github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-request11-v20260820.json" and .authorizationRecordSha256=="d7e6bf2a110b1fc83357f7b6420f9164f77048cfae25146df15dd8cad01e1698" and .scope.writes==false and .scope.deploy==false and .scope.production==false' "$REQUEST_PATH" >/dev/null
      - name: Locate unique Request11 runtime run and wait for terminal metadata
        id: locate
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100"
          mkdir -p "$EVIDENCE_DIR"
          RUN_ID=''; CONCLUSION=''
          for i in $(seq 1 75); do
            RESP="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API")"
            MATCHES="$(printf '%s' "$RESP" | jq --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '[.workflow_runs[] | select(.head_sha==$sha and .name==$name and .event=="push")]')"
            COUNT="$(printf '%s' "$MATCHES" | jq 'length')"
            if [ "$COUNT" -gt 1 ]; then
              printf '%s' "$MATCHES" | jq --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '{schemaVersion:"orbit360-f2-request11-run-observer-v1",ok:false,status:"PIPELINE_MECHANISM_FAILURE",classification:"MULTIPLE_REQUEST11_RUNTIME_RUNS_FOUND",targetSha:$sha,workflowName:$name,uniquenessCount:length,runs:[.[]|{id,run_attempt,status,conclusion,created_at,updated_at}],containsPII:false,containsSecrets:false}' > "$OBSERVER_EVIDENCE"
              exit 41
            fi
            if [ "$COUNT" -eq 1 ]; then
              RUN_ID="$(printf '%s' "$MATCHES" | jq -r '.[0].id')"
              STATUS="$(printf '%s' "$MATCHES" | jq -r '.[0].status')"
              CONCLUSION="$(printf '%s' "$MATCHES" | jq -r '.[0].conclusion // ""')"
              if [ "$STATUS" = 'completed' ]; then
                printf '%s' "$MATCHES" > "$RUNNER_TEMP/request11-run.json"
                break
              fi
            fi
            sleep 10
          done
          test -n "$RUN_ID" || { jq -n --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '{schemaVersion:"orbit360-f2-request11-run-observer-v1",ok:false,status:"F2_REQUEST11_RUNTIME_PUSH_RUN_NOT_OBSERVED",classification:"PIPELINE_MECHANISM_FAILURE",targetSha:$sha,workflowName:$name,runtimeRunObserved:false,containsPII:false,containsSecrets:false}' > "$OBSERVER_EVIDENCE"; exit 42; }
          test -f "$RUNNER_TEMP/request11-run.json" || { jq -n --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" --arg run "$RUN_ID" '{schemaVersion:"orbit360-f2-request11-run-observer-v1",ok:false,status:"ENVIRONMENT_FAILURE",classification:"REQUEST11_RUNTIME_RUN_NOT_TERMINAL_WITHIN_OBSERVER_WINDOW",targetSha:$sha,workflowName:$name,runtimeRunId:$run,containsPII:false,containsSecrets:false}' > "$OBSERVER_EVIDENCE"; exit 42; }
          echo "F2_RUNTIME_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "F2_RUNTIME_CONCLUSION=$CONCLUSION" >> "$GITHUB_ENV"
      - name: Download and validate sanitized Request11 terminal evidence
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          META="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${F2_RUNTIME_RUN_ID}/artifacts?per_page=100")"
          NAME="orbit360-f2-productive-acceptance-${F2_RUNTIME_RUN_ID}"
          COUNT="$(printf '%s' "$META" | jq --arg n "$NAME" '[.artifacts[] | select(.name==$n and .expired==false)] | length')"
          test "$COUNT" = '1'
          ART_ID="$(printf '%s' "$META" | jq -r --arg n "$NAME" '.artifacts[] | select(.name==$n and .expired==false) | .id')"
          ZIP="$RUNNER_TEMP/f2-request11-evidence.zip"; DIR="$RUNNER_TEMP/f2-request11-evidence"; mkdir -p "$DIR"
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" -o "$ZIP"
          unzip -q "$ZIP" -d "$DIR"
          FINAL="$(find "$DIR" -type f -name "f2-final-run-${F2_RUNTIME_RUN_ID}.json" -print -quit)"
          test -n "$FINAL"; test -f "$FINAL"
          jq -e '.candidateArtifactId==9387820198 and .containsPII==false and .containsSecrets==false' "$FINAL" >/dev/null
          for f in "f2-runtime-preflight-run-${F2_RUNTIME_RUN_ID}.json" "f2-candidate-source-run-${F2_RUNTIME_RUN_ID}.json" "f2-identity-run-${F2_RUNTIME_RUN_ID}.json" "f2-browser-run-${F2_RUNTIME_RUN_ID}.json" "f2-final-run-${F2_RUNTIME_RUN_ID}.json"; do
            SRC="$(find "$DIR" -type f -name "$f" -print -quit)"
            if [ -n "$SRC" ] && [ -f "$SRC" ]; then cp "$SRC" "$EVIDENCE_DIR/$f"; fi
          done
          cp "$(find "$DIR" -type f -name 'f2-data-integrity-before-v20260818.json' -print -quit)" "$EVIDENCE_DIR/f2-data-integrity-before-v20260818.json" 2>/dev/null || true
          cp "$(find "$DIR" -type f -name 'f2-data-integrity-after-v20260818.json' -print -quit)" "$EVIDENCE_DIR/f2-data-integrity-after-v20260818.json" 2>/dev/null || true
          cp "$(find "$DIR" -type f -name 'f2-integrity-before-after-v20260818.json' -print -quit)" "$EVIDENCE_DIR/f2-integrity-before-after-v20260818.json" 2>/dev/null || true
          FINAL_JSON="$(cat "$FINAL")"
          RUN_JSON="$(cat "$RUNNER_TEMP/request11-run.json")"
          jq -n --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" --arg observer "$GITHUB_RUN_ID" --arg run "$F2_RUNTIME_RUN_ID" --arg conclusion "$F2_RUNTIME_CONCLUSION" --arg artifact "$ART_ID" --argjson meta "$RUN_JSON" --argjson final "$FINAL_JSON" '{schemaVersion:"orbit360-f2-request11-run-observer-v1",ok:true,status:"REQUEST11_RUNTIME_TERMINAL_EVIDENCE_OBSERVED",classification:"OBSERVATION_PASS",targetSha:$sha,workflowName:$name,uniquenessCount:($meta|length),observerRunId:$observer,runtimeRunId:$run,runtimeConclusion:$conclusion,evidenceArtifactId:$artifact,run:{id:$meta[0].id,run_attempt:$meta[0].run_attempt,status:$meta[0].status,conclusion:$meta[0].conclusion,event:$meta[0].event,head_sha:$meta[0].head_sha,created_at:$meta[0].created_at,run_started_at:$meta[0].run_started_at,updated_at:$meta[0].updated_at},terminal:$final,containsPII:false,containsSecrets:false,productMutation:false,requestMutation:false,runtimeReplay:false}' > "$OBSERVER_EVIDENCE"
          jq -e '.ok==true and .uniquenessCount==1 and .run.status=="completed" and .run.head_sha=="1809552cc6dceacae1527be34299ef17b32bff98" and .terminal.candidateArtifactId==9387820198' "$OBSERVER_EVIDENCE" >/dev/null
      - name: Persist observer and sanitized runtime evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OBSERVER_EVIDENCE" "$EVIDENCE_DIR"/f2-runtime-preflight-run-*.json "$EVIDENCE_DIR"/f2-candidate-source-run-*.json "$EVIDENCE_DIR"/f2-identity-run-*.json "$EVIDENCE_DIR"/f2-browser-run-*.json "$EVIDENCE_DIR"/f2-final-run-*.json "$EVIDENCE_DIR"/f2-data-integrity-before-v20260818.json "$EVIDENCE_DIR"/f2-data-integrity-after-v20260818.json "$EVIDENCE_DIR"/f2-integrity-before-after-v20260818.json 2>/dev/null || true
          git diff --cached --check
          git commit -m '[skip ci] evidence(f2): persist Request11 terminal runtime observation'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
