name: Orbit360 F2 Request12 Runtime Run Observer 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f2-request05-run-observer-v20260818.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: orbit360-f2-request12-run-observer-20260820
  cancel-in-progress: false
env:
  TARGET_SHA: 3993fb5a8a8d3636914fa4a6d5bbdd18d5d6964d
  TARGET_WORKFLOW_NAME: Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818
  TARGET_BRANCH: ays/backend-tenant-lab-v99-20260703
  REQUEST_PATH: .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-20260820-12.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  OBSERVER_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/f2-request12-runtime-run-observer-v20260820.json
jobs:
  observe_request12:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Observe Request12 and persist terminal result even on failure
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          OBS_OK=false
          STATUS_CODE='PIPELINE_MECHANISM_FAILURE'
          STATUS_NAME='F2_REQUEST12_RUNTIME_PUSH_RUN_NOT_OBSERVED'
          RUN_ID=''
          CONCLUSION=''
          ART_ID=''
          TERMINAL_JSON='null'
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test -f "$REQUEST_PATH"
          jq -e '.requestOrdinal==12 and .status=="AUTHORIZED_ONCE" and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and .candidateArtifactId==9387820198 and .authorizationRecordPath==".github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-request12-v20260820.json" and .authorizationRecordSha256=="dfecef5f15b3fa50af425b8cfcfece9b4336ae94ed05f036371601e518426cd0" and .scope.writes==false and .scope.deploy==false and .scope.production==false' "$REQUEST_PATH" >/dev/null
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100"
          MATCHES='[]'
          for i in $(seq 1 120); do
            RESP="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API")"
            MATCHES="$(printf '%s' "$RESP" | jq --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '[.workflow_runs[] | select(.head_sha==$sha and .name==$name and .event=="push")]')"
            COUNT="$(printf '%s' "$MATCHES" | jq 'length')"
            if [ "$COUNT" -gt 1 ]; then STATUS_NAME='F2_REQUEST12_MULTIPLE_RUNTIME_RUNS_FOUND'; break; fi
            if [ "$COUNT" -eq 1 ]; then
              RUN_ID="$(printf '%s' "$MATCHES" | jq -r '.[0].id')"
              RUN_STATUS="$(printf '%s' "$MATCHES" | jq -r '.[0].status')"
              CONCLUSION="$(printf '%s' "$MATCHES" | jq -r '.[0].conclusion // ""')"
              if [ "$RUN_STATUS" = 'completed' ]; then STATUS_NAME='F2_REQUEST12_RUNTIME_TERMINAL_METADATA_FOUND'; break; fi
            fi
            sleep 10
          done
          COUNT="$(printf '%s' "$MATCHES" | jq 'length')"
          if [ "$COUNT" = '1' ] && [ -n "$RUN_ID" ] && [ "$(printf '%s' "$MATCHES" | jq -r '.[0].status')" = 'completed' ]; then
            META="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
            NAME="orbit360-f2-productive-acceptance-${RUN_ID}"
            ACOUNT="$(printf '%s' "$META" | jq --arg n "$NAME" '[.artifacts[] | select(.name==$n and .expired==false)] | length')"
            if [ "$ACOUNT" = '1' ]; then
              ART_ID="$(printf '%s' "$META" | jq -r --arg n "$NAME" '.artifacts[] | select(.name==$n and .expired==false) | .id')"
              ZIP="$RUNNER_TEMP/f2-request12-evidence.zip"; DIR="$RUNNER_TEMP/f2-request12-evidence"; mkdir -p "$DIR"
              curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" -o "$ZIP"
              unzip -q "$ZIP" -d "$DIR"
              FINAL="$(find "$DIR" -type f -name "f2-final-run-${RUN_ID}.json" -print -quit)"
              if [ -n "$FINAL" ] && [ -f "$FINAL" ] && jq -e '.candidateArtifactId==9387820198 and .containsPII==false and .containsSecrets==false' "$FINAL" >/dev/null; then
                TERMINAL_JSON="$(cat "$FINAL")"
                for f in "f2-full-runtime-known-rootfixes-selftest-${RUN_ID}.json" "f2-runtime-preflight-run-${RUN_ID}.json" "f2-candidate-source-run-${RUN_ID}.json" "f2-identity-run-${RUN_ID}.json" "f2-browser-run-${RUN_ID}.json" "f2-final-run-${RUN_ID}.json"; do SRC="$(find "$DIR" -type f -name "$f" -print -quit)"; if [ -n "$SRC" ] && [ -f "$SRC" ]; then cp "$SRC" "$EVIDENCE_DIR/$f"; fi; done
                for f in f2-data-integrity-before-v20260818.json f2-data-integrity-after-v20260818.json f2-integrity-before-after-v20260818.json; do SRC="$(find "$DIR" -type f -name "$f" -print -quit)"; if [ -n "$SRC" ] && [ -f "$SRC" ]; then cp "$SRC" "$EVIDENCE_DIR/$f"; fi; done
                OBS_OK=true; STATUS_CODE='OBSERVATION_PASS'; STATUS_NAME='F2_REQUEST12_RUNTIME_TERMINAL_EVIDENCE_OBSERVED'
              else STATUS_NAME='F2_REQUEST12_TERMINAL_ARTIFACT_CONTENT_MISSING'; fi
            else STATUS_NAME='F2_REQUEST12_TERMINAL_ARTIFACT_COUNT_INVALID'; fi
          fi
          jq -n --argjson ok "$OBS_OK" --arg status "$STATUS_NAME" --arg classification "$STATUS_CODE" --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" --arg observer "$GITHUB_RUN_ID" --arg run "$RUN_ID" --arg conclusion "$CONCLUSION" --arg artifact "$ART_ID" --argjson matches "$MATCHES" --argjson terminal "$TERMINAL_JSON" '{schemaVersion:"orbit360-f2-request12-run-observer-v1",ok:$ok,status:$status,classification:$classification,targetSha:$sha,workflowName:$name,uniquenessCount:($matches|length),observerRunId:$observer,runtimeRunId:$run,runtimeConclusion:$conclusion,evidenceArtifactId:$artifact,run:(if ($matches|length)==1 then {id:$matches[0].id,run_attempt:$matches[0].run_attempt,status:$matches[0].status,conclusion:$matches[0].conclusion,event:$matches[0].event,head_sha:$matches[0].head_sha,created_at:$matches[0].created_at,run_started_at:$matches[0].run_started_at,updated_at:$matches[0].updated_at} else null end),terminal:$terminal,containsPII:false,containsSecrets:false,productMutation:false,requestMutation:false,runtimeReplay:false}' > "$OBSERVER_EVIDENCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OBSERVER_EVIDENCE" "$EVIDENCE_DIR"/f2-full-runtime-known-rootfixes-selftest-*.json "$EVIDENCE_DIR"/f2-runtime-preflight-run-*.json "$EVIDENCE_DIR"/f2-candidate-source-run-*.json "$EVIDENCE_DIR"/f2-identity-run-*.json "$EVIDENCE_DIR"/f2-browser-run-*.json "$EVIDENCE_DIR"/f2-final-run-*.json "$EVIDENCE_DIR"/f2-data-integrity-before-v20260818.json "$EVIDENCE_DIR"/f2-data-integrity-after-v20260818.json "$EVIDENCE_DIR"/f2-integrity-before-after-v20260818.json 2>/dev/null || true
          git diff --cached --check
          git commit -m '[skip ci] evidence(f2): persist Request12 terminal runtime observation'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          test "$OBS_OK" = true
