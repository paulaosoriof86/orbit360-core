# I6.6 read-only tenant authorization truth before a five-role release.
# No Firestore mutation, Auth mutation, Hosting or Cloud Functions deployment.
name: Gravicentra I6.6 Actual Tenant Privileged Role Rights READ ONLY
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-privileged-role-live-authz-readonly.yml
permissions:
  contents: read
concurrency:
  group: gi-i66-actual-tenant-privileged-role-readonly
  cancel-in-progress: false
jobs:
  tenant-access-readback:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read active five-role tenant matrix without logging member identity
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
          node - <<'NODE'
          const assert=require('node:assert/strict'),admin=require('firebase-admin');
          const valid=['SA_LAB','SA_ALT','SA_DEFAULT'].map(k=>{try{return JSON.parse(process.env[k]||'');}catch{return null;}})
            .find(x=>x?.type==='service_account'&&x.project_id==='ays-orbit-360-lab'&&x.private_key);
          assert.ok(valid,'I66_READONLY_CONFIGURED_TENANT_IDENTITY_REQUIRED');
          admin.initializeApp({credential:admin.credential.cert(valid),projectId:'ays-orbit-360-lab'});
          const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
          const roles=['Operativo','Dirección','Admin','AdminTenant','SuperAdmin'];
          const modules=['cliente360','polizas','renovaciones','cobros','ops','leads','aseguradoras','cancelaciones','siniestros','comisiones'];
          const db=admin.firestore(),t=db.collection('tenants').doc('alianzas-soluciones');
          (async()=>{
            const [config,members]=await Promise.all([t.collection('config').doc('access').get(),t.collection('members').limit(250).get()]);
            assert.ok(config.exists,'I66_REAL_TENANT_ACCESS_CONFIG_MISSING');
            assert.ok(members.size<250,'I66_REAL_MEMBER_SCAN_UNBOUNDED');
            const c=config.data()||{},scope=c.roleScopes||{},matrix=c.rolePermissions||{};
            const key=(obj,role)=>Object.keys(obj).find(k=>norm(k)===norm(role));
            const row=[];
            for(const role of roles){
              const k=key(scope,role),ceiling=norm(k===undefined?'':scope[k]);
              const mk=key(matrix,role),permissions=mk===undefined?{}:matrix[mk]||{};
              const restrictions=modules.map(m=>{
                const pm=permissions[Object.keys(permissions).find(x=>norm(x)===norm(m))]||{};
                return{module:m,visible:pm.ver!==false,editable:pm.editar!==false,creatable:pm.crear!==false};
              }).filter(x=>!x.visible||!x.editable||!x.creatable);
              const active=members.docs.filter(d=>{const m=d.data()||{};
                return (Array.isArray(m.roles)?m.roles:[]).some(r=>norm(r)===norm(role))&&m.active!==false&&m.activo!==false&&
                  !['blocked','suspended','inactivo','inactive'].includes(norm(m.status||m.estado));
              }).length;
              row.push({role,configuredScope:ceiling||'DEFAULT',activeAssignedMembers:active,explicitRestrictions:restrictions});
              console.log('I66_ACTUAL_TENANT_ROLE_READONLY '+JSON.stringify(row.at(-1)));
            }
            const op=row.find(x=>x.role==='Operativo');
            assert.equal(op.configuredScope,'all','I66_ACTUAL_OPERATIVO_NOT_ALL_IN_SIGNED_TENANT');
            assert.equal(op.explicitRestrictions.filter(x=>x.visible&&(!x.editable||!x.creatable)).length,0,
              'I66_ACTUAL_OPERATIVO_VISIBLE_MODULE_HAS_WRITE_DENIAL_NEEDS_RESOLUTION');
            assert.ok(op.activeAssignedMembers>=1,'I66_NO_ACTIVE_OPERATIVO_MEMBER_TO_TEST');
            console.log('I66_REAL_OPERATIVO_TENANT_ROLE_CONFIG_AND_ALL_TEN_APPROVED_MODULES_READONLY_PASS');
            console.log('I66_OTHER_ROLES_EXPLICIT_MATRIX_READBACK_COMPLETE_NO_WRITES');
          })().catch(e=>{console.error(String(e.message||e));process.exitCode=1;}).finally(()=>admin.app().delete());
          NODE
