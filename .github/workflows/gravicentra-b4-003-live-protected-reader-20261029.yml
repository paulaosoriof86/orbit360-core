name: Gravicentra B4-003 Scoped LIVE Reader Only

# Ordinary pushes perform READBACK ONLY. The exact approved deploy subject or dispatch
# binds the exact branch HEAD and previous deployed manifest before one-function
# deployment. Hosting, Rules, other Functions and business data are untouched.
on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-live-protected-reader-20261029.yml'
      - 'artifacts/orbit360-recovery/release-control/I6_5_B4_003_ISOLATED_READER_DEPLOY_ACTIVATION_20261107.json'

  workflow_dispatch:
    inputs:
      mode:
        description: Read only, or deploy the one reviewed reader
        type: choice
        options: [readback, deploy]
        default: readback
        required: true
      expected_head:
        description: Exact canonical HEAD required for deploy
        type: string
        required: false
      expected_before_source_manifest_sha256:
        description: Exact before reader manifest from the readback artifact
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gravicentra-b4-003-live-protected-reader
  cancel-in-progress: false

jobs:
  deploy-one-protected-reader:
    if: github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROJECT_ID: ays-orbit-360-lab
      RELEASE_HEAD: ${{ github.sha }}
      GI_TARGET_FUNCTION: orbit360ScopedPolicyRead
      EXPECTED_READER_PREDECESSOR_ARCHIVE: eb076c9f52c16d1a66bd3bd0b31a25555a57fc6109cdfe9b6d0f61dcfcd27fe9
      EXPECTED_READER_PREDECESSOR_REVISION: orbit360scopedpolicyread-00001-tiv
      PRESERVED_FRONTEND_SOURCE: e5030ec5ba9854f0c576fd905c2f510766347ffa
      READER_ACTIVATION_PATH: artifacts/orbit360-recovery/release-control/I6_5_B4_003_ISOLATED_READER_DEPLOY_ACTIVATION_20261107.json
      REQUESTED_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'push' && github.event.head_commit.message == 'deploy(b4-003): exact isolated LIVE reader e503 successor' && 'deploy' || 'readback' }}
      EXPECTED_DEPLOY_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head || github.sha }}
      EXPECTED_BEFORE_MANIFEST: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_before_source_manifest_sha256 || '067c746216f25a8aecbcf435bd0cd00a2ed0f8463c7446bb9c36ee5dc5a822ff' }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fail closed on source or authority drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_HEAD"
          REMOTE=$(git ls-remote origin refs/heads/recovery/fase-a-clean-20260831 | awk '{print $1}')
          test "$REMOTE" = "$RELEASE_HEAD"
          test "$PROJECT_ID" = ays-orbit-360-lab
          git diff --exit-code "$PRESERVED_FRONTEND_SOURCE" HEAD -- functions orbit360-platform ':(exclude)orbit360-platform/docs/**'
          case "$REQUESTED_MODE" in
            readback) ;;
            deploy) test "$EXPECTED_DEPLOY_HEAD" = "$RELEASE_HEAD"; [[ "$EXPECTED_BEFORE_MANIFEST" =~ ^[0-9a-f]{64}$ ]] ;;
            *) exit 1 ;;
          esac
          test -f functions/b4-003-scoped-policy-callable.js
          test -f functions/b4-003-scoped-access-boundary.js
          test -f functions/b4-003-scoped-policy-reader.js
          test -f functions/b4-003-scoped-related-reader.js
          test -f functions/b4-003-scoped-bootstrap-reader.js
          test -f functions/bootstrap.js
          grep -Fq 'orbit360ScopedPolicyRead:onCall(opts,handle)' functions/b4-003-scoped-policy-callable.js
          if grep -Fq "require('./b4-003-scoped-policy-callable')" functions/bootstrap.js; then
            echo 'B4_003_LIVE_READER_ALREADY_IN_SOURCE_BOOTSTRAP'; exit 1
          fi
          node --check functions/b4-003-scoped-policy-callable.js
          node --check tools/gravicentra-b4-003-live-backend-source-readback.cjs
          node tools/gravicentra-b4-003-live-reader-source-readback.test.cjs
          node tools/gravicentra-b4-003-isolated-reader-package.test.cjs
          node tools/gravicentra-i6-control-plane-guard-v1.mjs --mode=i6
          node tests/goal-participation-classification-writer.test.cjs
          node tools/gravicentra-b4-003-scoped-bootstrap-reader.test.cjs
          node tools/gravicentra-b4-003-scoped-policy-reader.test.cjs
          node tools/gravicentra-b4-003-scoped-related-reader.test.cjs
          node tools/gravicentra-b4-003-role-context-recovery.test.cjs
          node tools/gravicentra-b4-003-dual-host-protected-transport.test.cjs

      - name: Stage isolated function-only package
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ROOT="$RUNNER_TEMP/gi-b4003-live-reader-only"
          mkdir -p "$TARGET_ROOT"
          node tools/gravicentra-b4-003-isolated-reader-package.cjs stage functions "$TARGET_ROOT/backend" > "$RUNNER_TEMP/gi-b4003-isolated-reader-package.json"
          printf '{"functions":{"source":"backend","ignore":["node_modules","**/node_modules/**",".git","firebase-debug.log","firebase-debug.*.log"]}}\n' > "$TARGET_ROOT/firebase.json"
          (cd "$TARGET_ROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "TARGET_ROOT=$TARGET_ROOT" >> "$GITHUB_ENV"
          echo "GI_DEPS_DIR=$TARGET_ROOT/backend/node_modules" >> "$GITHUB_ENV"

      - name: Select existing project-scoped deployment identity
        shell: bash
        run: |
          set -euo pipefail
          AUTH_ROOT="$RUNNER_TEMP/gi-b4003-live-reader-auth"
          mkdir -p "$AUTH_ROOT"
          export AUTH_ROOT
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['AUTH_ROOT']); found=0
          for label in ('SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB'):
              try: data=json.loads(os.environ.get(label,''))
              except (ValueError,TypeError): continue
              if data.get('type')!='service_account' or data.get('project_id')!='ays-orbit-360-lab' or not data.get('private_key'):
                  continue
              out=root/(str(found)+'.json');out.write_text(json.dumps(data));out.chmod(0o600)
              found+=1
          if found==0: raise SystemExit('B4_003_NO_EXISTING_PROJECT_CREDENTIAL')
          PY
          CLI_ROOT="$RUNNER_TEMP/gi-b4003-live-reader-firebase-cli"
          npm install --prefix "$CLI_ROOT" --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CLI_ROOT"
          CLI="$CLI_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          SELECTED=''
          for F in "$AUTH_ROOT"/*.json; do
            if GOOGLE_APPLICATION_CREDENTIALS="$F" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-b4003-pre-functions.json" 2>/dev/null; then
              SELECTED="$F"; break
            fi
          done
          test -n "$SELECTED"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SELECTED" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"

      - name: Read exact deployed source before any mutation
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-b4-003-live-backend-source-readback.cjs before
          node - <<'NODE'
          const fs=require('node:fs'),tmp=process.env.RUNNER_TEMP;
          const before=JSON.parse(fs.readFileSync(tmp+'/gi-b4003-live-sources-before.json','utf8'));
          if(before.target!=='orbit360ScopedPolicyRead'||before.region!=='us-east1'||before.functions.length!==3)throw Error('EXACT_READER_READBACK_REQUIRED');
          if(process.env.REQUESTED_MODE==='deploy'&&before.readerSourceManifestSha256!==process.env.EXPECTED_BEFORE_MANIFEST)throw Error('DEPLOYED_READER_CHANGED_SINCE_REVIEW');
          const needed=process.env.REQUESTED_MODE==='deploy'&&!before.readerSourceMatchesCurrent;
          if(needed){
            const prior=before.functions[2];
            if(prior.archiveSha256!==process.env.EXPECTED_READER_PREDECESSOR_ARCHIVE||prior.revision!==process.env.EXPECTED_READER_PREDECESSOR_REVISION||!prior.archiveSourceManifestSha256)throw Error('EXACT_READER_PREDECESSOR_ARCHIVE_REQUIRED');
            const cp=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
            const freeze=JSON.parse(fs.readFileSync(cp.ownerDecisionFreeze20261107.path,'utf8'));
            const grant=freeze.readerDeploymentSuccessor;
            const activation=JSON.parse(fs.readFileSync(process.env.READER_ACTIVATION_PATH,'utf8'));
            const git=(...args)=>require('node:child_process').execFileSync('git',args,{encoding:'utf8'}).trim();
            if(activation.schema!=='GRAVICENTRA_ISOLATED_READER_DEPLOY_ACTIVATION_V1'||activation.status!=='AUTHORIZED_EXACT_ISOLATED_READER_DEPLOY'||activation.target!=='orbit360ScopedPolicyRead'||activation.region!=='us-east1'||activation.project!==process.env.PROJECT_ID||activation.beforeSourceManifestSha256!==before.readerSourceManifestSha256||activation.beforeArchiveSha256!==prior.archiveSha256||activation.beforeRevision!==prior.revision||activation.expectedIsolatedSourceManifestSha256!==before.expectedReaderSourceManifestSha256||activation.preservedFrontendSource!==process.env.PRESERVED_FRONTEND_SOURCE||activation.realBusinessWritesAuthorized!==false||activation.otherFunctionsDeployAuthorized!==false||!Number.isSafeInteger(activation.reviewedReadbackRunId)||activation.reviewedReadbackRunId<=0||!/^[a-f0-9]{40}$/.test(activation.reviewedSourceHead||''))throw Error('EXACT_READER_ACTIVATION_REQUIRED');
            git('merge-base','--is-ancestor',activation.reviewedSourceHead,'HEAD');
            if(git('diff','--name-only',activation.reviewedSourceHead,'HEAD','--','functions','orbit360-platform',':(exclude)orbit360-platform/docs/**','.github/workflows/gravicentra-b4-003-live-protected-reader-20261029.yml','tools/gravicentra-b4-003-live-backend-source-readback.cjs','tools/gravicentra-b4-003-isolated-reader-package.cjs')!=='')throw Error('READER_SOURCE_CHANGED_AFTER_REVIEW');
            if(!grant||grant.deployAuthorized!==true||grant.target!=='orbit360ScopedPolicyRead'||grant.region!=='us-east1'||grant.preservedFrontendSource!==process.env.PRESERVED_FRONTEND_SOURCE||grant.before.archiveSha256!==prior.archiveSha256||grant.before.sourceManifestSha256!==before.readerSourceManifestSha256||grant.expectedIsolatedSourceManifestSha256!==before.expectedReaderSourceManifestSha256)throw Error('EXACT_READER_DEPLOYMENT_AUTHORITY_REQUIRED');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needs_deploy='+needed+'\n');
          fs.writeFileSync(tmp+'/gi-b4003-live-reader-result.json',JSON.stringify({status:process.env.REQUESTED_MODE==='readback'?'READBACK_ONLY':needed?'EXACT_READER_DEPLOY_PREPARED':'READER_ALREADY_EXACT_NOOP',head:process.env.GITHUB_SHA,mode:process.env.REQUESTED_MODE,sourceManifest:before.readerSourceManifestSha256,readerSourceMatchesCurrent:before.readerSourceMatchesCurrent,productDeployed:false,businessWrites:0,productionAccepted:false},null,2)+'\n');
          NODE

      - name: Diagnose tenant catalog source without invoking or deploying it
        continue-on-error: true
        env:
          GI_TARGET_FUNCTION: orbit360TenantDomainConfig
          GI_DIAGNOSTIC_ONLY: 'true'
        run: node tools/gravicentra-b4-003-live-backend-source-readback.cjs before

      - name: Prepare exact predecessor rollback package
        if: steps.assess.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export RESTORE_ROOT="$RUNNER_TEMP/gi-b4003-live-reader-previous"
          mkdir -p "$RESTORE_ROOT"
          python3 - <<'PY'
          import os,pathlib,zipfile,shutil
          dst=pathlib.Path(os.environ['RESTORE_ROOT']);ex=dst/'extract';ex.mkdir()
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-b4003-before-orbit360ScopedPolicyRead.zip'
          with zipfile.ZipFile(src) as z:
              for item in z.infolist():
                  p=(ex/item.filename).resolve()
                  if not p.is_relative_to(ex.resolve()):raise SystemExit('SOURCE_ARCHIVE_PATH_ESCAPE')
              z.extractall(ex)
          roots=[p.parent for p in ex.rglob('package.json') if (p.parent/'b4-003-scoped-policy-callable.js').is_file() and (p.parent/'bootstrap.js').is_file() and (p.parent/'package-lock.json').is_file()]
          if len(roots)!=1:raise SystemExit('EXACT_READER_BACKUP_INCOMPLETE')
          shutil.copytree(roots[0],dst/'backend')
          (dst/'firebase.json').write_text('{"functions":{"source":"backend"}}\n')
          PY
          (cd "$RESTORE_ROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "RESTORE_ROOT=$RESTORE_ROOT" >> "$GITHUB_ENV"

      - name: Deploy only the isolated reader and verify its complete source package
        id: deploy_and_readback
        if: steps.assess.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_DEPLOY_HEAD" = "$RELEASE_HEAD"
          test "$(git ls-remote origin refs/heads/recovery/fase-a-clean-20260831 | awk '{print $1}')" = "$RELEASE_HEAD"
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360ScopedPolicyRead --config "$TARGET_ROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          node tools/gravicentra-b4-003-live-backend-source-readback.cjs after
          node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-b4003-live-reader-after-inventory.json"
          node - <<'NODE'
          const fs=require('node:fs'),tmp=process.env.RUNNER_TEMP;
          const stable=x=>Array.isArray(x)?x.map(stable):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x;
          const rows=file=>{const data=JSON.parse(fs.readFileSync(file,'utf8')),raw=data.result??data,v=typeof raw==='string'?JSON.parse(raw):raw;return Array.isArray(v)?v:Array.isArray(v.functions)?v.functions:[];};
          const identity=r=>String(r.id||r.name||r.function||'').split('/').pop();
          const before=rows(tmp+'/gi-b4003-pre-functions.json'),after=rows(tmp+'/gi-b4003-live-reader-after-inventory.json');
          const others=a=>a.filter(r=>identity(r)!=='orbit360ScopedPolicyRead').map(stable).sort((a,b)=>identity(a).localeCompare(identity(b)));
          if(!before.length||after.length!==before.length||after.filter(r=>identity(r)==='orbit360ScopedPolicyRead').length!==1||JSON.stringify(others(before))!==JSON.stringify(others(after)))throw Error('NON_TARGET_FUNCTION_INVENTORY_CHANGED');
          const readback=JSON.parse(fs.readFileSync(tmp+'/gi-b4003-live-sources-after.json','utf8'));
          if(readback.readerSourceMatchesCurrent!==true)throw Error('EXACT_READER_BYTES_REQUIRED');
          fs.writeFileSync(tmp+'/gi-b4003-live-reader-result.json',JSON.stringify({status:'EXACT_READER_BYTES_PASS_SIGNED_UI_PENDING',head:process.env.GITHUB_SHA,onlyDeployed:'orbit360ScopedPolicyRead',region:'us-east1',sourceManifest:readback.readerSourceManifestSha256,productDeployed:true,businessWrites:0,hostingChanged:false,rulesChanged:false,productionAccepted:false},null,2)+'\n');
          NODE

      - name: Restore exact predecessor if deploy or verification fails
        if: failure() && steps.deploy_and_readback.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESTORE_ROOT/backend/b4-003-scoped-policy-callable.js"
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360ScopedPolicyRead --config "$RESTORE_ROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          node tools/gravicentra-b4-003-live-backend-source-readback.cjs rollback

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gi-b4003-live-reader-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gi-b4003-live-sources-before.json
            ${{ runner.temp }}/gi-b4003-live-sources-after.json
            ${{ runner.temp }}/gi-b4003-live-sources-rollback.json
            ${{ runner.temp }}/gi-b4003-live-reader-result.json
            ${{ runner.temp }}/gi-b4003-isolated-reader-package.json
            ${{ runner.temp }}/gi-b4003-tenant-config-source-readback.json
          if-no-files-found: warn
          retention-days: 30

