name: Orbit 360 · Validar preflight fase-aware · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  phase-aware-preflight-source-only:
    if: github.head_ref == 'ays/sourcefix-v9-validator-stale-stop-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact sourcefix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and phase-aware suite
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node --check tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs
          bash -n tools/orbit360-preflight-visual-matrix-runtime-relay-v8-v20260806.sh
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs

      - name: Assert zero-risk source evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'orbit360-platform/runtime-gate-crm-v20260716/preflight-portable-source-test-sanitized-v20260806.json';
          const evidence = JSON.parse(fs.readFileSync(file, 'utf8'));
          const ok = evidence.status === 'PASS_SOURCE_ONLY_PHASE_AWARE_PREFLIGHT_VALIDATOR' &&
            evidence.failed === 0 && evidence.ok === true &&
            evidence.secretsRead === false && evidence.firebaseAccess === false &&
            evidence.firestoreWrites === 0 && evidence.authWrites === 0 &&
            evidence.operationalWrites === 0 && evidence.browserExecuted === false &&
            evidence.deployExecuted === false && evidence.productionTouched === false;
          if (!ok) process.exit(41);
          console.log(JSON.stringify({status:evidence.status,total:evidence.total,passed:evidence.passed,failed:evidence.failed,ok:true}, null, 2));
          NODE
