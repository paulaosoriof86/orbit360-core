name: Orbit 360 · Policies canonical prewrite read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-policies-prewrite-readonly-v20260730.yml'
      - 'tools/orbit360-policies-canonical-apply-v20260730.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-prewrite-readonly-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block7-policies-static-v20260730
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  DRIVE_FILE_ID: 1NXHACZ11815882AhoyGrQQCb9Amgbi95
  PACKAGE_SHA256: b63c5d10be40fcd4039be1b7844cafb0bf45c2a9904dd47ad65443b5fb43a89f
jobs:
  prewrite:
    name: Policies · exact package vs live store
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico antes de secrets/Firestore
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .failed==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Preparar dependencias aisladas
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save firebase-admin@13.4.0 xlsx@0.18.5 >/dev/null 2>&1
      - name: Descargar paquete privado exacto
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{const sa=JSON.parse(process.env.SERVICE_ACCOUNT),b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url'),now=Math.floor(Date.now()/1000);if(sa.project_id!=='ays-orbit-360-lab')throw new Error('ENVIRONMENT_FAILURE:PROJECT_ID_MISMATCH');const unsigned=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/drive.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});const sig=crypto.sign('RSA-SHA256',Buffer.from(unsigned),sa.private_key).toString('base64url');const body=new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+sig});const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body});const tj=await tr.json();if(!tr.ok||!tj.access_token)throw new Error('ENVIRONMENT_FAILURE:OAUTH_'+tr.status);const r=await fetch(`https://www.googleapis.com/drive/v3/files/${process.env.DRIVE_FILE_ID}?alt=media&supportsAllDrives=true`,{headers:{authorization:`Bearer ${tj.access_token}`}});if(!r.ok)throw new Error('ENVIRONMENT_FAILURE:DRIVE_'+r.status);const b=Buffer.from(await r.arrayBuffer()),sha=crypto.createHash('sha256').update(b).digest('hex');if(sha!==process.env.PACKAGE_SHA256)throw new Error('DATA_CONTRACT_FAILURE:PACKAGE_SHA');fs.writeFileSync('/tmp/policies-canonical.xlsx',b);})().catch(e=>{console.error(String(e.message||e));process.exit(41)});
          NODE
          export SERVICE_ACCOUNT
          ORBIT360_POLICIES_MODE=DRY_RUN \
          ORBIT360_POLICIES_XLSX=/tmp/policies-canonical.xlsx \
          ORBIT360_POLICIES_XLSX_SHA256="$PACKAGE_SHA256" \
          ORBIT360_POLICIES_EVIDENCE="$EVIDENCE_DIR/policies-canonical-prewrite.json" \
          node tools/orbit360-policies-canonical-apply-v20260730.mjs
          jq -e '.status=="PREWRITE_READY" and .ok==true and .before.clientes==414 and .before.aseguradoras==26 and .before.asesores==7 and .before.polizas==0 and .plan.clients==16 and .plan.insurers==4 and .plan.policies==1373 and .plan.pendingPolicies==64 and .plan.excluded==4 and .plan.noReceiptWrites==true and .plan.noCarteraWrites==true and .plan.noCobroWrites==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/policies-canonical-prewrite.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-canonical-prewrite-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/policies-canonical-prewrite.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/policies-canonical-prewrite.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Policies canonical prewrite failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.status==='PREWRITE_READY'&&p.firestoreWrites===0){state='success';description=`Policies prewrite PASS: ${p.plan.clients}+${p.plan.insurers}+${p.plan.policies}; zero writes`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-prewrite',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
