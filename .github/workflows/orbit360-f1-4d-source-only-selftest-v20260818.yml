name: Orbit360 F1.4D Source Only Selftest 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'tools/orbit360-f1-4d-candidate-contract-v20260818.json'
      - 'tools/orbit360-validator-lifecycle-contract-auth-paula-membership-readonly-reconcile-v2-f1-4d-v20260818.json'
      - 'tools/orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-f1-4d-v20260818.mjs'
      - 'tools/orbit360-register-f1-4d-gate-v20260818.mjs'
      - 'tools/orbit360-f1-4d-candidate-smoke-wrapper-v20260818.mjs'
      - 'tools/orbit360-f1-4d-single-successor-runtime-browser-readonly-v20260818.mjs'
      - '.github/workflows/orbit360-f1-4d-single-successor-runtime-browser-readonly-v20260818.yml'
      - '.github/workflows/orbit360-f1-4d-source-only-selftest-v20260818.yml'
permissions:
  contents: write
concurrency:
  group: orbit360-f1-4d-source-only
  cancel-in-progress: false
jobs:
  source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate F1.4D source-only mechanism
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR=orbit360-platform/runtime-gate-crm-v20260716
          node --check tools/orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-f1-4d-v20260818.mjs
          node --check tools/orbit360-register-f1-4d-gate-v20260818.mjs
          node --check tools/orbit360-f1-4d-candidate-smoke-wrapper-v20260818.mjs
          node --check tools/orbit360-f1-4d-single-successor-runtime-browser-readonly-v20260818.mjs
          node tools/orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-f1-4d-v20260818.mjs --self-test
          jq -e '.ok==true and .status=="F1_4D_EXACT_CANDIDATE_GATE_SOURCE_ONLY_PASS" and .candidateArtifactId==9345207863 and .oldPublishedArtifactBlocked==true and .rootfixLineagePass==true and .f1_3EvidencePass==true and .f1_4bEvidencePass==true and .f1_4cCertificationPass==true and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .packageRebuilt==false and .deployExecuted==false and .publicationExecuted==false' "$EVIDENCE_DIR/f1-4d-exact-candidate-gate-source-only-v20260818.json" >/dev/null
          node tools/orbit360-f1-4d-candidate-smoke-wrapper-v20260818.mjs --self-test
          jq -e '.ok==true and .status=="R4_CERTIFIED_VALIDATOR_ROOTFIX_SOURCE_PASS" and .sourceHead=="29caae94a3db1f1626bdde2ea6ee9a21799f9df6" and .manifestStatus=="FASE_A_PRODUCT_F1_4C_SUCCESSOR_CERTIFIED" and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .packageRebuilt==false' "$EVIDENCE_DIR/f1-4d-candidate-wrapper-source-only-v20260818.json" >/dev/null
          WORKFLOW=.github/workflows/orbit360-f1-4d-single-successor-runtime-browser-readonly-v20260818.yml
          GATE_LINE=$(grep -n 'Mandatory canonical gate before candidate artifact or provider/browser' "$WORKFLOW" | head -1 | cut -d: -f1)
          ART_LINE=$(grep -n 'Download and fully verify exact candidate after GO' "$WORKFLOW" | head -1 | cut -d: -f1)
          PROVIDER_LINE=$(grep -n 'Bind provider after GO' "$WORKFLOW" | head -1 | cut -d: -f1)
          BROWSER_LINE=$(grep -n 'Execute one narrow bootstrap confirmation' "$WORKFLOW" | head -1 | cut -d: -f1)
          test "$GATE_LINE" -lt "$ART_LINE"
          test "$GATE_LINE" -lt "$PROVIDER_LINE"
          test "$GATE_LINE" -lt "$BROWSER_LINE"
          ! grep -E 'firebase(\.cmd)? deploy|firebase hosting|gcloud .*deploy|playwright install' "$WORKFLOW"
          node tools/orbit360-register-f1-4d-gate-v20260818.mjs > "$RUNNER_TEMP/register.json"
          grep -F 'orbit360-validator-lifecycle-contract-auth-paula-membership-readonly-reconcile-v2-f1-4d-v20260818.json' tools/orbit360-validar-gate-contracts-v20260717.mjs >/dev/null
          grep -F 'orbit360-validar-gate-contracts-engine-auth-paula-membership-readonly-reconcile-v2-f1-4d-v20260818.mjs' tools/orbit360-validar-gate-contracts-v20260717.mjs >/dev/null
          git checkout -- tools/orbit360-validar-gate-contracts-v20260717.mjs
          jq -n --arg head "$GITHUB_SHA" '{schemaVersion:"orbit360-f1-4d-source-only-preflight-v1",ok:true,status:"F1_4D_SOURCE_ONLY_PREFLIGHT_PASS",classification:"PASS",sourceHead:$head,gateBeforeArtifact:true,gateBeforeProvider:true,gateBeforeBrowser:true,exactCandidateBound:true,narrowBootstrapOnly:true,oldPublishedArtifactBlocked:true,browserExecuted:false,runtimeExecuted:false,secretAccess:false,dataAccess:false,firestoreWrites:0,authWrites:0,operationalWrites:0,packageRebuilt:false,deployExecuted:false,publicationExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/f1-4d-source-only-preflight-v20260818.json"
      - name: Persist source-only evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbit360-platform/runtime-gate-crm-v20260716/f1-4d-exact-candidate-gate-source-only-v20260818.json orbit360-platform/runtime-gate-crm-v20260716/f1-4d-candidate-wrapper-source-only-v20260818.json orbit360-platform/runtime-gate-crm-v20260716/f1-4d-source-only-preflight-v20260818.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(f1.4d): persist source-only gate evidence'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
