# I6.6 successor, build-only. B4-003/004/005/006/007 historic gates are immutable.
# This workflow performs no Hosting/Functions deployment, no Firestore mutation,
# no Rules/Auth modification and no preview/live release promotion.
# Separate approval, isolated Preview readback and exact-artifact LIVE promotion
# are mandatory after this package is certified.
name: Gravicentra I6.6 Build Immutable Release Package

on:
  workflow_dispatch:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-release-delta-66-package.yml
      - artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json
      - artifacts/orbit360-recovery/release-control/I6_6_APPROVED_PRODUCT_DELTA_MANIFEST_20261110.json

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-delta-66-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      source: ${{ steps.release.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
          const scopedPreview=c.status==='PAYMENT_FUNCTION_PREVIEW_AUTHORIZED'&&c.backendFunctionPreviewOnly===true&&c.forbidBackendLiveFunctionDeploy===true&&c.livePromotionAuthorized===false&&c.previewApproved===false;
          const scopedLive=c.status==='PAYMENT_LIVE_FUNCTION_PROMOTION_AUTHORIZED'&&c.liveFunctionScope==='orbit360CobrosReconciliationCommand'&&c.noHostingPromotion===true&&c.forbidBackendLiveFunctionDeploy===false&&c.livePromotionAuthorized===true&&c.previewApproved===true&&c.previewFunctionRunId===42955048019;
          if(c.schema!=='GRAVICENTRA_I6_6_SINGLE_ARTIFACT_RELEASE_TRANSPORT_V1'||c.gate!=='I6.6'||c.historicalClosedGate!=='B4-007'||(c.forbidBackendFunctionDeploy!==true&&!scopedPreview&&!scopedLive)||c.forbidFirestoreRulesDataAuthWrites!==true)throw Error('I66_TRANSPORT_SCOPE_INVALID');
          if((scopedPreview||scopedLive)&&(!/^[0-9a-f]{40}$/.test(c.approvedSourceSha||'')||!(c.sourceBuildWorkflowRunId>0)||!(c.immutableArtifactId>0)||!/^[0-9a-f]{64}$/.test(String(c.immutableArtifactZipDigest||'').replace(/^sha256:/,''))))throw Error('I66_PAYMENT_SCOPED_RELEASE_PROOF_MISSING');
          let mode='disabled',source='';
          if(c.status==='PREVIEW_BUILD_REQUESTED'&&c.livePromotionAuthorized===false)mode='package';
          if(c.status==='LIVE_PROMOTION_APPROVED'&&c.livePromotionAuthorized===true&&c.previewApproved===true){
            if(!/^[0-9a-f]{40}$/.test(c.approvedSourceSha||'')||!(c.sourceBuildWorkflowRunId>0)||!/^[0-9a-f]{64}$/.test(c.immutableTarSha256||'')||!/^gi-i66-rc-[0-9]+$/.test(c.sourcePreviewChannelId||''))throw Error('I66_LIVE_PROMOTION_PROOF_MISSING');
            throw Error('I66_LIVE_PROMOTION_REQUIRES_SEPARATE_APPROVED_EXACT_ARTIFACT_TRANSPORT');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`mode=${mode}\nsource=${source}\n`);
          console.log('I66_TRANSPORT_MODE='+mode);
          NODE
  immutable-package:
    needs: gate
    if: needs.gate.outputs.mode == 'package'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      PROJECT_ID: ays-orbit-360-lab
      HOSTING_SITE: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      RELEASE_GATE: I6.6
      BUILD_PREFIX: gi-i66
      ENVIRONMENT_REF: firebase-hosting-preview-i6-6
      GRAVICENTRA_B4_003_SCOPED_PREVIEW: 'true'
      GRAVICENTRA_B4_003_GOALS_PREVIEW: 'true'
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exactly the selected canonical SHA with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify latest I6.6 source and historical B4 seals without reopening B4
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --check tools/gravicentra-governance-preflight-v1.mjs
          node --check tools/gravicentra-i6-6-delta-guard.mjs
          node --check tools/gravicentra-i6-1-preview-package.mjs
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
      - name: Set up existing Firebase LAB credentials for read-only public config and tenant branding
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-auth'
          candidates=[]
          for n,key in enumerate(('SA_LAB','SA_LAB_ALT','SA_DEFAULT')):
              try: value=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError): continue
              if value.get('type')=='service_account' and value.get('project_id')==os.environ['PROJECT_ID'] and value.get('private_key'):
                  p=root/f'{n}.json';p.write_text(json.dumps(value));p.chmod(0o600);candidates.append(str(p))
          if not candidates: raise SystemExit('I66_CONFIG_CREDENTIAL_NOT_FOUND')
          (root/'candidates').write_text('\n'.join(candidates)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-i66-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-i66-cli"
          CLI="$RUNNER_TEMP/gi-i66-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate";break
            fi
          done < "$RUNNER_TEMP/gi-i66-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/gi-i66-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/gi-i66-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-i66-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
      - name: Build a single immutable package from the exact I6.6 source and config snapshot
        working-directory: candidate
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-i66-apps.json"
          APP_ID=$(node -e "const x=require(process.env.RUNNER_TEMP+'/gi-i66-apps.json');const a=(x.result||[]).filter(y=>['WEB','PLATFORM_WEB',''].includes(String(y.platform||'').toUpperCase()));if(a.length!==1)process.exit(2);process.stdout.write(a[0].appId)")
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-i66-sdkconfig.json"
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/gi-i66-branding.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/gi-i66-branding.json"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/gi-i66-package" "$RUNNER_TEMP/gi-i66-sdkconfig.json" > "$RUNNER_TEMP/gi-i66-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const base=process.env.RUNNER_TEMP+'/gi-i66-package/bundle';
          const cfg=JSON.parse(fs.readFileSync(base+'/firebase.json','utf8'));
          const meta=JSON.parse(fs.readFileSync(base+'/site/__recovery__/build.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_APPROVED_PRODUCT_DELTA_MANIFEST_20261110.json','utf8'));
          if(Object.keys(cfg).join(',')!=='hosting'||cfg.hosting.site!==process.env.HOSTING_SITE||cfg.hosting.public!=='site')throw Error('I66_PACKAGE_HOSTING_ONLY_OR_TARGET_DRIFT');
          if(meta.sourceSha!==process.env.SOURCE_SHA||meta.gate!=='I6.6'||!meta.buildId.startsWith('gi-i66-'))throw Error('I66_PACKAGE_SOURCE_OR_GATE_DRIFT');
          const runtime=fs.readFileSync(base+'/site/product-runtime-config.js','utf8');
          if(!runtime.includes('"scopedReadPreviewCandidate":true')||!runtime.includes('"goalParticipationPreviewCandidate":true'))throw Error('I66_SCOPED_READ_FLAG_DRIFT');
          // Every approved source is SHA-pinned; only TWO known output transforms
          // may change its packaged bytes. Those must match the builder's exact
          // deterministic output, including buildId, not a broad exemption.
          function expectedIndex(html,buildId){
            const branding=/<script\s+src=["']core\/public-tenant-branding\.js[^"']*["']\s*><\/script>/i;
            if(!branding.test(html))throw Error('I66_INDEX_BRANDING_TAG_NOT_FOUND');
            html=html.replace(branding,'<script src="data/tenant-public-branding-snapshot.generated.js"></script>\n$&');
            let bound=0;
            const bind=url=>{
              const raw=String(url||'');
              if(!raw||/^(?:https?:|data:|blob:|\/\/|#)/i.test(raw)||!/.(?:js|css)(?:[?#]|$)/i.test(raw))return raw;
              const hashAt=raw.indexOf('#'),hash=hashAt>=0?raw.slice(hashAt):'',base=hashAt>=0?raw.slice(0,hashAt):raw;
              const next=/([?&])orbitBuild=[^&#]*/.test(base)
                ?base.replace(/([?&])orbitBuild=[^&#]*/,'$1orbitBuild='+encodeURIComponent(buildId))
                :base+(base.includes('?')?'&':'?')+'orbitBuild='+encodeURIComponent(buildId);
              bound++;
              return next+hash;
            };
            html=html.replace(/(<script\b[^>]*\bsrc=["'])([^"']+)(["'])/gi,(m,a,u,z)=>a+bind(u)+z);
            html=html.replace(/(<link\b[^>]*\brel=["']stylesheet["'][^>]*\bhref=["'])([^"']+)(["'])/gi,(m,a,u,z)=>a+bind(u)+z);
            html=html.replace(/(<link\b[^>]*\bhref=["'])([^"']+\.css(?:[^"']*)?)(["'][^>]*\brel=["']stylesheet["'])/gi,(m,a,u,z)=>a+bind(u)+z);
            if(bound<10)throw Error('I66_INDEX_BUILD_BINDING_TOO_FEW');
            // Verify both favicon links against the authoritative public tenant
            // snapshot, without admitting any other generated HTML transform.
            const snapCode=fs.readFileSync(base+'/site/data/tenant-public-branding-snapshot.generated.js','utf8');
            const brandCtx={window:{}};vm.runInNewContext(snapCode,brandCtx,{timeout:1000});
            const brand=brandCtx.window.__ORBIT360_TENANT_BRANDING_SNAPSHOT__;
            if(!brand||brand.tenantId!==process.env.TENANT_HINT||!/^[0-9a-f]{64}$/.test(brand.hash||''))throw Error('I66_TENANT_SNAPSHOT_INVALID');
            const favicon=String(brand.branding&&brand.branding.favicon||'').replace(/^\/+/, '');
            const tenantPrefix='assets/tenant/'+brand.tenantId+'/';
            if(!favicon.startsWith(tenantPrefix)||!/^[a-z0-9_.-]+\.png$/i.test(favicon.slice(tenantPrefix.length)))throw Error('I66_TENANT_FAVICON_SCOPE_INVALID');
            const icon192=favicon.replace(/-\d+\.png$/i,'').replace(/\.png$/i,'')+'-192.png';
            const iconStamp='?brand='+brand.hash.slice(0,12);
            const faviconTag=/(<link rel="icon"[^>]*href=")[^"]+("[^>]*>)/i;
            const appleTag=/(<link rel="apple-touch-icon"[^>]*href=")[^"]+("[^>]*>)/i;
            if(!faviconTag.test(html)||!appleTag.test(html))throw Error('I66_TENANT_INDEX_ICON_TAGS_MISSING');
            html=html.replace(faviconTag,(_,a,b)=>a+'/'+favicon+iconStamp+b)
              .replace(appleTag,(_,a,b)=>a+'/'+icon192+iconStamp+b);
            return Buffer.from(html,'utf8');
          }
          function expectedPwa(js,buildId){
            const edits=[
              [/var RUNTIME_BUILD = '[^']+';/,"var RUNTIME_BUILD = '"+buildId+"';"],
              [/var CRITICAL_RELEASE = '[^']+';/,"var CRITICAL_RELEASE = '"+buildId+"';"]
            ];
            for(const [pattern,value] of edits){
              if(!pattern.test(js))throw Error('I66_PWA_BUILD_PIN_PATTERN_DRIFT');
              js=js.replace(pattern,value);
            }
            return Buffer.from(js,'utf8');
          }
          function expectedBootstrap(js){
            const marker="require('./b4-003-scoped-policy-callable')";
            const alreadyIntegrated=js.includes(marker);
            if(js.includes('b4-003-scoped-policy-callable')&&!alreadyIntegrated)
              throw Error('B4_003_SCOPED_EXPORT_DUPLICATE');
            const scoped=process.env.GRAVICENTRA_B4_003_SCOPED_PREVIEW==='true';
            const suffix="\n// B4-003 dual-name source; executor deploys Preview only.\nObject.assign(module.exports,require('./b4-003-scoped-policy-callable'));\n";
            return Buffer.from(scoped&&!alreadyIntegrated?js+suffix:js,'utf8');
          }
          // The delta guard validates each explicit replaces-chain. Check the
          // terminal approved blob for each path; earlier receipts stay sealed.
          const effectivePins=new Map();
          for(const change of manifest.changes)for(const pin of change.paths)effectivePins.set(pin.path,pin);
          for(const [p,pin] of effectivePins){
            const source=fs.readFileSync(p);
            if(execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim()!==pin.gitBlobSha)
              throw Error('I66_SOURCE_MANIFEST_PIN_DRIFT:'+p);
            // Build tooling is SHA-pinned and executed, never published as a site asset.
            if(p==='tools/gravicentra-i6-1-preview-package.mjs')continue;
            const target=fs.readFileSync(base+'/'+(p.startsWith('functions/')?'backend/'+p.slice(10):'site/'+p.slice(18)));
            let expected=source;
            if(p==='orbit360-platform/index.html')expected=expectedIndex(source.toString('utf8'),meta.buildId);
            else if(p==='orbit360-platform/core/pwa.js')expected=expectedPwa(source.toString('utf8'),meta.buildId);
            else if(p==='functions/bootstrap.js')expected=expectedBootstrap(source.toString('utf8'));
            if(!expected.equals(target))throw Error('I66_APPROVED_PRODUCT_BUILD_BYTES_DRIFT:'+p);
          }
          const staticManifest=JSON.parse(fs.readFileSync('orbit360-platform/manifest.webmanifest','utf8'));
          const builtManifest=JSON.parse(fs.readFileSync(base+'/site/manifest.webmanifest','utf8'));
          const brandCtx={window:{}};vm.runInNewContext(fs.readFileSync(base+'/site/data/tenant-public-branding-snapshot.generated.js','utf8'),brandCtx,{timeout:1000});
          const brand=brandCtx.window.__ORBIT360_TENANT_BRANDING_SNAPSHOT__;
          const iconPrefix=String(brand.branding.favicon).replace(/^\/+/, '').replace(/-\d+\.png$/i,'').replace(/\.png$/i,'');
          if(brand.tenantId!==process.env.TENANT_HINT||staticManifest.id!=='/'||staticManifest.scope!=='/'||staticManifest.start_url!=='/')throw Error('I66_TENANT_PWA_STABLE_ID_DRIFT');
          staticManifest.name='Gravicentra Insurance · '+String(brand.branding.displayName).trim();
          staticManifest.icons=[192,512].map(size=>({src:'/'+iconPrefix+'-'+size+'.png?brand='+brand.hash.slice(0,12),sizes:size+'x'+size,type:'image/png',purpose:'any maskable'}));
          assert.deepStrictEqual(builtManifest,staticManifest,'I66_TENANT_PWA_MANIFEST_BYTES_SEMANTIC_DRIFT');
          console.log('I66_MANIFEST_EXACT_BUILD_BOUND_INDEX_PWA_AND_TENANT_ICONS_PASS');
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==meta.sourceSha)throw Error('I66_PACKAGE_BUILD_AFTER_SOURCE_MUTATION');
          console.log('I66_BUILD_ONE_SOURCE_ONE_ARTIFACT_NO_DEPLOY_PASS');
          NODE
      - name: Preserve byte-exact package, digest and source identity for Preview then LIVE
        run: |
          set -euo pipefail
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/gi-i66-exact-package.tar.gz" -C "$RUNNER_TEMP/gi-i66-package" bundle evidence
          sha256sum "$RUNNER_TEMP/gi-i66-exact-package.tar.gz" > "$RUNNER_TEMP/gi-i66-exact-package.sha256"
          test -s "$RUNNER_TEMP/gi-i66-exact-package.tar.gz"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "I6.6: build only; Preview=NOT_DEPLOYED; LIVE=NOT_DEPLOYED; DATA_WRITES=0" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: immutable_artifact
        with:
          name: gi-i66-immutable-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gi-i66-exact-package.tar.gz
            ${{ runner.temp }}/gi-i66-exact-package.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Fingerprint both existing LIVE origins before isolated Preview deployment
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/gi-i66-live-before.sha"
          curl --fail --location --silent --show-error --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/gi-i66-staff-before.sha"
      - name: Publish exact immutable site only to isolated Hosting Preview
        id: preview
        run: |
          set -euo pipefail
          CHANNEL_ID="gi-i66-rc-${GITHUB_RUN_ID}"
          echo "channel=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/gi-i66-package/bundle"
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/gi-i66-preview-result.json" 2>&1
          export CHANNEL_ID
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os,re
          raw=open(os.environ['RUNNER_TEMP']+'/gi-i66-preview-result.json').read()
          prefix='https://ays-orbit-360-lab--'+os.environ['CHANNEL_ID']+'-'
          urls=sorted(set(u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.startswith(prefix)))
          if len(urls)!=1:raise SystemExit('I66_PREVIEW_URL_NOT_UNIQUE')
          print('url='+urls[0])
          PY
      - name: Preview readback all artifact files and confirm both LIVE origins are untouched
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_CHANNEL: ${{ steps.preview.outputs.channel }}
          ARTIFACT_ID: ${{ steps.immutable_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.immutable_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gi-i66-package/bundle/site"
          mkdir -p "$RUNNER_TEMP/gi-i66-readback"
          READY=0
          for attempt in $(seq 1 25); do
            if curl -fsSL --max-time 15 "$PREVIEW_URL/__recovery__/build.json" -o "$RUNNER_TEMP/gi-i66-readback/build.json" 2>/dev/null &&
               cmp -s "$ROOT/__recovery__/build.json" "$RUNNER_TEMP/gi-i66-readback/build.json"; then READY=1;break;fi
            sleep 4
          done
          test "$READY" = 1
          while IFS= read -r line; do
            rel="${line#*  }"
            mkdir -p "$RUNNER_TEMP/gi-i66-readback/$(dirname "$rel")"
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --max-time 25 "$PREVIEW_URL/$rel" -o "$RUNNER_TEMP/gi-i66-readback/$rel"
            cmp "$ROOT/$rel" "$RUNNER_TEMP/gi-i66-readback/$rel"
          done < "$RUNNER_TEMP/gi-i66-package/evidence/site-manifest.sha256"
          curl --fail --location --silent --show-error --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/gi-i66-live-after.sha"
          curl --fail --location --silent --show-error --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/gi-i66-staff-after.sha"
          cmp "$RUNNER_TEMP/gi-i66-live-before.sha" "$RUNNER_TEMP/gi-i66-live-after.sha"
          cmp "$RUNNER_TEMP/gi-i66-staff-before.sha" "$RUNNER_TEMP/gi-i66-staff-after.sha"
          echo "## I6.6 — Preview exact, LIVE untouched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview channel: $PREVIEW_CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- LIVE and staff-origin fingerprints: UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "- LIVE promotion: REQUIRES SEPARATE HUMAN GATE" >> "$GITHUB_STEP_SUMMARY"
