            return Buffer.from(scoped&&!alreadyIntegrated?js+suffix:js,'utf8');
          }
          // The delta guard validates each explicit replaces-chain. Check the
          // terminal approved blob for each path; earlier receipts stay sealed.
          const effectivePins=new Map();
          for(const change of manifest.changes)for(const pin of change.paths)effectivePins.set(pin.path,pin);
          for(const [p,pin] of effectivePins){
            const source=fs.readFileSync(p);
            if(execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim()!==pin.gitBlobSha)
              throw Error('I66_SOURCE_MANIFEST_PIN_DRIFT:'+p);
            // Build tooling is SHA-pinned and executed, never published as a site asset.
            if(p==='tools/gravicentra-i6-1-preview-package.mjs')continue;
            const target=fs.readFileSync(base+'/'+(p.startsWith('functions/')?'backend/'+p.slice(10):'site/'+p.slice(18)));
            // The public PWA manifest is deterministically tenant-bound;
            // compare its COMPLETE expected object below, not source bytes.
            if(p==='orbit360-platform/manifest.webmanifest')continue;
            let expected=source;
            if(p==='orbit360-platform/index.html')expected=expectedIndex(source.toString('utf8'),meta.buildId);
            else if(p==='orbit360-platform/core/pwa.js')expected=expectedPwa(source.toString('utf8'),meta.buildId);
            else if(p==='functions/bootstrap.js')expected=expectedBootstrap(source.toString('utf8'));
            if(!expected.equals(target))throw Error('I66_APPROVED_PRODUCT_BUILD_BYTES_DRIFT:'+p);
          }
          const staticManifest=JSON.parse(fs.readFileSync('orbit360-platform/manifest.webmanifest','utf8'));
          const builtManifest=JSON.parse(fs.readFileSync(base+'/site/manifest.webmanifest','utf8'));
          const brandCtx={window:{}};vm.runInNewContext(fs.readFileSync(base+'/site/data/tenant-public-branding-snapshot.generated.js','utf8'),brandCtx,{timeout:1000});
          const brand=brandCtx.window.__ORBIT360_TENANT_BRANDING_SNAPSHOT__;
          const iconPrefix=String(brand.branding.favicon).replace(/^\/+/, '').replace(/-\d+\.png$/i,'').replace(/\.png$/i,'');
          if(brand.tenantId!==process.env.TENANT_HINT||staticManifest.id!=='/'||staticManifest.scope!=='/'||staticManifest.start_url!=='/')throw Error('I66_TENANT_PWA_STABLE_ID_DRIFT');
          staticManifest.name='Gravicentra Insurance · '+String(brand.branding.displayName).trim();
          staticManifest.icons=[192,512].map(size=>({src:'/'+iconPrefix+'-'+size+'.png?brand='+brand.hash.slice(0,12),sizes:size+'x'+size,type:'image/png',purpose:'any maskable'}));
          assert.deepStrictEqual(builtManifest,staticManifest,'I66_TENANT_PWA_MANIFEST_BYTES_SEMANTIC_DRIFT');
          console.log('I66_MANIFEST_EXACT_BUILD_BOUND_INDEX_PWA_AND_TENANT_ICONS_PASS');
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==meta.sourceSha)throw Error('I66_PACKAGE_BUILD_AFTER_SOURCE_MUTATION');
          console.log('I66_BUILD_ONE_SOURCE_ONE_ARTIFACT_NO_DEPLOY_PASS');
          NODE
      - name: Preserve byte-exact package, digest and source identity for Preview then LIVE
        run: |
          set -euo pipefail
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/gi-i66-exact-package.tar.gz" -C "$RUNNER_TEMP/gi-i66-package" bundle evidence
          sha256sum "$RUNNER_TEMP/gi-i66-exact-package.tar.gz" > "$RUNNER_TEMP/gi-i66-exact-package.sha256"
          test -s "$RUNNER_TEMP/gi-i66-exact-package.tar.gz"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "I6.6: build only; Preview=NOT_DEPLOYED; LIVE=NOT_DEPLOYED; DATA_WRITES=0" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: immutable_artifact
        with:
          name: gi-i66-immutable-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gi-i66-exact-package.tar.gz
            ${{ runner.temp }}/gi-i66-exact-package.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Fingerprint both existing LIVE origins before isolated Preview deployment
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/gi-i66-live-before.sha"
          curl --fail --location --silent --show-error --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/gi-i66-staff-before.sha"
      - name: Publish exact immutable site only to isolated Hosting Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANNEL_ID="gi-i66-rc-${GITHUB_RUN_ID}"
          cd "$RUNNER_TEMP/gi-i66-package/bundle"
          if ! node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/gi-i66-preview-result.json" 2>&1; then
            node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync(process.env.RUNNER_TEMP+'/gi-i66-preview-result.json','utf8');
          const clean=s=>String(s||'').replace(/Bearer\s+\S+/gi,'[REDACTED]')
            .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g,'[EMAIL]')
            .replace(/-----BEGIN[\s\S]*?-----END[^\n]*/g,'[KEY_REDACTED]')
            .slice(0,260);
          let errors=[];
          try{
            const j=JSON.parse(raw),e=j.error||j.result?.error||{};
            errors=[clean(j.status||''),clean(e.code||e.status||''),
              clean(typeof e==='string'?e:e.message||''),
              clean(j.message||''),clean(j.result?.message||''),
              ...[].concat(j.messages||[]).slice(-2).map(clean),
              'rootKeys:'+Object.keys(j).sort().join(',')].filter(Boolean);
          }catch(_){
            errors=raw.split('\n').filter(x=>/(?:error|denied|forbidden|quota|limit|channel|http)/i.test(x))
              .slice(-5).map(clean);
          }
          if(errors.length===0)errors.push('OUTPUT_LENGTH_'+raw.length);
          console.error('I66_PREVIEW_DEPLOY_DIAGNOSTIC '+JSON.stringify(errors));
          NODE
            # A 429 for new channels is a quota, not a source QA failure.
            # Direction authorizes a single known R7 Preview channel rollover
            # only after exact current version/source and R7 rollback artifact
            # are proved; LIVE and all business data remain untouched.
            if ! grep -Eqi 'HTTP Error: 429.*channel quota' "$RUNNER_TEMP/gi-i66-preview-result.json"; then exit 1; fi
            REUSE_ID='gi-i66-rc-42868854629'
            node "$FIREBASE_CLI_BIN" hosting:channel:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-i66-reuse-before.json"
            export REUSE_ID
            node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const control=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
          const a=control.i66ConciliacionesStagePreviewQuotaRecovery20261113||{};
          assert.equal(control.status,'PREVIEW_BUILD_REQUESTED','I66_QUOTA_RECOVERY_GATE_NOT_REQUESTED');
          assert.ok(control.livePromotionAuthorized===false&&control.forbidBackendFunctionDeploy===true&&
            control.forbidBackendLiveFunctionDeploy===true&&control.noHostingPromotion===true&&
            control.forbidFirestoreRulesDataAuthWrites===true,'I66_QUOTA_RECOVERY_WRITE_BOUNDARY_DRIFT');
          assert.ok(a.allowOnlyKnownSinglePreviewChannel===true&&a.denyLiveHostingOrBackendDataWrites===true&&
            a.denyChannelDeletion===true&&a.stopOnAnySourceVersionOrArtifactMismatch===true&&
            a.authorizedExistingChannelId===process.env.REUSE_ID&&
            a.expectedCurrentSourceSha==='0153f5cbbe00c3732e11ebae59b32bd357e38bfd'&&
            a.expectedCurrentHostingVersion==='9cedc5ecda75bb2a'&&
            a.expectedCurrentPreviewUrl==='https://ays-orbit-360-lab--gi-i66-rc-42868854629-abj14q6n.web.app'&&
            a.recoverableR7SourceRunId===43371940341&&a.recoverableR7ArtifactId===14013250472&&
            a.recoverableR7ArtifactDigest==='sha256:a1e16528689cc02336a3d753e3086c95eeedce92f753d14de20e790552b9f461',
            'I66_QUOTA_RECOVERY_EXACT_OWNER_AUTHORIZATION_MISSING');
          const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gi-i66-reuse-before.json','utf8'));
          const channels=Array.isArray(j.result)?j.result:j.result?.channels||[];
          const id=x=>String(x.channelId||x.name||'').split('/').pop();
          const target=channels.filter(x=>id(x)===process.env.REUSE_ID);
          assert.equal(target.length,1,'I66_REUSE_EXACT_PREVIEW_NOT_UNIQUE');
          assert.equal(String(target[0].release?.version?.name||'').split('/').pop(),
            a.expectedCurrentHostingVersion,'I66_REUSE_R7_PREVIEW_VERSION_CHANGED_STOP');
          assert.ok(String(target[0].createTime||'').startsWith('2026-11-10T')&&
            id(target[0])!=='live','I66_REUSE_R7_PREVIEW_SCOPE_DRIFT');
          const live=channels.find(x=>id(x)==='live');
          assert.ok(live&&String(live.release?.version?.name||'').split('/').pop()===a.expectedCurrentHostingVersion,
            'I66_REUSE_R7_LIVE_VERSION_DRIFT');
          (async()=>{
            const h={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json',
              'User-Agent':'GI-I66-Exact-R7-Preview-Quota-Recovery'};
            const root='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const [r,b,p]=await Promise.all([fetch(root+'runs/'+a.recoverableR7SourceRunId,{headers:h}),
              fetch(root+'artifacts/'+a.recoverableR7ArtifactId,{headers:h}),
              fetch(a.expectedCurrentPreviewUrl+'/__recovery__/build.json',{cache:'no-store'})]);
            assert.ok(r.ok&&b.ok&&p.ok,'I66_REUSE_R7_PREVIEW_OR_ARTIFACT_PROOF_UNAVAILABLE');
            const run=await r.json(),artifact=await b.json();
            const build=await p.json();
            assert.ok(run.conclusion==='success'&&
              run.head_sha===a.expectedCurrentSourceSha&&
              artifact.expired===false&&artifact.workflow_run?.id===a.recoverableR7SourceRunId&&
              artifact.digest===a.recoverableR7ArtifactDigest&&
              build.sourceSha===a.expectedCurrentSourceSha,
              'I66_REUSE_R7_EXACT_IMMUTABLE_ARTIFACT_NOT_RECOVERABLE');
            console.log('I66_KNOWN_R7_PREVIEW_EXACT_VERSION_SOURCE_AND_BACKUP_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
            CHANNEL_ID="$REUSE_ID"
            node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/gi-i66-preview-result.json"
            echo 'I66_PREVIEW_CHANNEL_QUOTA_RECOVERY_R7_BACKED_ROLLOVER_NO_DELETION'
          fi
          echo "channel=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          export CHANNEL_ID
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os,re
          raw=open(os.environ['RUNNER_TEMP']+'/gi-i66-preview-result.json').read()
          prefix='https://ays-orbit-360-lab--'+os.environ['CHANNEL_ID']+'-'
          urls=sorted(set(u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.startswith(prefix)))
          if len(urls)!=1:raise SystemExit('I66_PREVIEW_URL_NOT_UNIQUE')
          print('url='+urls[0])
          PY
      - name: Preview readback all artifact files and confirm both LIVE origins are untouched
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_CHANNEL: ${{ steps.preview.outputs.channel }}
          ARTIFACT_ID: ${{ steps.immutable_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.immutable_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gi-i66-package/bundle/site"
          mkdir -p "$RUNNER_TEMP/gi-i66-readback"
          READY=0
          for attempt in $(seq 1 25); do
            if curl -fsSL --max-time 15 "$PREVIEW_URL/__recovery__/build.json" -o "$RUNNER_TEMP/gi-i66-readback/build.json" 2>/dev/null &&
               cmp -s "$ROOT/__recovery__/build.json" "$RUNNER_TEMP/gi-i66-readback/build.json"; then READY=1;break;fi
            sleep 4
          done
          test "$READY" = 1
          while IFS= read -r line; do
            rel="${line#*  }"
            mkdir -p "$RUNNER_TEMP/gi-i66-readback/$(dirname "$rel")"
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --max-time 25 "$PREVIEW_URL/$rel" -o "$RUNNER_TEMP/gi-i66-readback/$rel"
            cmp "$ROOT/$rel" "$RUNNER_TEMP/gi-i66-readback/$rel"
          done < "$RUNNER_TEMP/gi-i66-package/evidence/site-manifest.sha256"
          curl --fail --location --silent --show-error --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/gi-i66-live-after.sha"
          curl --fail --location --silent --show-error --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/gi-i66-staff-after.sha"
          cmp "$RUNNER_TEMP/gi-i66-live-before.sha" "$RUNNER_TEMP/gi-i66-live-after.sha"
          cmp "$RUNNER_TEMP/gi-i66-staff-before.sha" "$RUNNER_TEMP/gi-i66-staff-after.sha"
          echo "## I6.6 — Preview exact, LIVE untouched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview channel: $PREVIEW_CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- LIVE and staff-origin fingerprints: UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "- LIVE promotion: REQUIRES SEPARATE HUMAN GATE" >> "$GITHUB_STEP_SUMMARY"

  protected-conciliaciones-reader-preview:
    needs: gate
    if: >-
      needs.gate.outputs.mode == 'reader-preview' &&
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROJECT_ID: ays-orbit-360-lab
      SOURCE_SHA: ${{ needs.gate.outputs.source }}
      SOURCE_RUN: ${{ needs.gate.outputs.source_run }}
      ARTIFACT_ID: ${{ needs.gate.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.gate.outputs.artifact_digest }}
      ACCESS_BLOB_SHA: ${{ needs.gate.outputs.access_sha }}
      READER_BLOB_SHA: ${{ needs.gate.outputs.reader_sha }}
      PREVIEW_CHANNEL_ID: ${{ needs.gate.outputs.preview_channel }}
      TARGET_FUNCTION: orbit360ScopedPolicyReadPreview
      TARGET_REGION: us-east1
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout approved control only and verify exact authorization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse any wrong source, artifact, scope, or release target
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
          const stage=c.status==='CONCILIACIONES_STAGE_READER_PREVIEW_AUTHORIZED';
          const r=stage?(c.i66ConciliacionesStageReaderPreviewAuthorization20261113||{}):(c.readerPreviewAuthorization||{});
          if(!['CONCILIACIONES_READER_PREVIEW_AUTHORIZED','CONCILIACIONES_STAGE_READER_PREVIEW_AUTHORIZED'].includes(c.status)||
             c.forbidFirestoreRulesDataAuthWrites!==true||c.forbidBackendLiveFunctionDeploy!==true||
             c.forbidBackendFunctionDeploy!==false||c.backendFunctionPreviewOnly!==true||
             c.livePromotionAuthorized!==false||c.previewApproved!==false||
             r.targetFunction!==process.env.TARGET_FUNCTION||r.region!==process.env.TARGET_REGION||
             r.sourceCommit!==process.env.SOURCE_SHA||r.sourceWorkflowRunId!==Number(process.env.SOURCE_RUN)||
             r.sourceArtifactId!==Number(process.env.ARTIFACT_ID)||
             r.dataWritesPermitted!==false||r.liveBackendDeployPermitted!==false||
             r.hostingPromotionPermitted!==false||
             c.immutableArtifactZipDigest!==process.env.ARTIFACT_DIGEST||
             c.approvedSourceSha!==process.env.SOURCE_SHA||
             c.sourcePreviewChannelId!==process.env.PREVIEW_CHANNEL_ID||
             (stage&&(r.previewFunctionOnly!==true||r.realSourceReadOnlyRun!==43383902368||
               r.sourceArtifactDigest!==process.env.ARTIFACT_DIGEST)))
            throw Error('I66_READER_PREVIEW_AUTHORIZATION_OR_IMMUTABLE_SOURCE_DRIFT');
          NODE
          curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_READ_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/i66-read-source-run.json"
          curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_READ_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/i66-read-source-artifact.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const run=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i66-read-source-run.json','utf8'));
          const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i66-read-source-artifact.json','utf8'));
          if(run.id!==Number(process.env.SOURCE_RUN)||run.head_sha!==process.env.SOURCE_SHA||
             run.status!=='completed'||run.conclusion!=='success'||run.head_branch!=='recovery/fase-a-clean-20260831'||
             a.id!==Number(process.env.ARTIFACT_ID)||a.expired!==false||
             a.digest!==process.env.ARTIFACT_DIGEST||
             a.name!=='gi-i66-immutable-'+process.env.SOURCE_SHA||
             a.workflow_run?.id!==Number(process.env.SOURCE_RUN)||
             a.workflow_run?.head_sha!==process.env.SOURCE_SHA)
            throw Error('I66_READER_PREVIEW_SIGNED_SOURCE_ARTIFACT_READBACK_REJECTED');
          console.log('I66_READER_PREVIEW_EXACT_ARTIFACT_PROVENANCE_PASS');
          NODE

      - name: Download existing certified immutable artifact; never rebuild
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.gate.outputs.source_run }}
          artifact-ids: ${{ needs.gate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gi-i66-reader-artifact

      - name: Verify byte-exact archive and protected reader source before deployment
        run: |
          set -euo pipefail
          DOWNLOAD="$RUNNER_TEMP/gi-i66-reader-artifact"
          mapfile -t TARS < <(find "$DOWNLOAD" -type f -name 'gi-i66-exact-package.tar.gz')
          mapfile -t SUMS < <(find "$DOWNLOAD" -type f -name 'gi-i66-exact-package.sha256')
          test "${#TARS[@]}" -eq 1
          test "${#SUMS[@]}" -eq 1
          test "$(dirname "${TARS[0]}")" = "$(dirname "${SUMS[0]}")"
          # The build wrote its signed SHA alongside an absolute runner-temp
          # pathname. A different runner cannot re-use that pathname; validate
          # the digest against the actual downloaded tar, not the stale path.
          EXPECTED="$(awk 'NR==1 {print $1}' "${SUMS[0]}")"
          test "${#EXPECTED}" -eq 64
          case "$EXPECTED" in *[!0-9a-f]*) exit 1;; esac
          ACTUAL="$(sha256sum "${TARS[0]}" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          PACKAGE="$RUNNER_TEMP/gi-i66-reader-certified"
          mkdir -p "$PACKAGE"
          tar -xzf "${TARS[0]}" -C "$PACKAGE"
          BACKEND="$PACKAGE/bundle/backend"
          test -f "$PACKAGE/bundle/site/__recovery__/build.json"
          test -f "$BACKEND/bootstrap.js"
          test -f "$BACKEND/b4-003-scoped-policy-callable.js"
          test "$(git hash-object "$BACKEND/b4-003-scoped-access-boundary.js")" = "$ACCESS_BLOB_SHA"
          test "$(git hash-object "$BACKEND/b4-003-scoped-related-reader.js")" = "$READER_BLOB_SHA"
          node --check "$BACKEND/b4-003-scoped-policy-callable.js"
          node --check "$BACKEND/b4-003-scoped-related-reader.js"
          node --check "$BACKEND/bootstrap.js"
          export PACKAGE
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.PACKAGE+'/bundle';
          const b=JSON.parse(fs.readFileSync(p+'/site/__recovery__/build.json','utf8'));
          const code=fs.readFileSync(p+'/backend/bootstrap.js','utf8');
          const reader=fs.readFileSync(p+'/backend/b4-003-scoped-policy-callable.js','utf8');
          if(b.sourceSha!==process.env.SOURCE_SHA||b.gate!=='I6.6'||
             !code.includes("require('./b4-003-scoped-policy-callable')")||
             !reader.includes('orbit360ScopedPolicyReadPreview:onCall(opts,handle)')||
             !reader.includes('const {readScopedRelatedDocument,readScopedRelatedList}'))
             throw Error('I66_READER_PREVIEW_BACKEND_PACKAGE_OR_EXPORT_DRIFT');
          console.log('I66_READER_PREVIEW_CERTIFIED_BACKEND_BYTES_PASS');
          NODE
          echo "I66_READER_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Select existing scoped LAB credentials and snapshot both LIVE Hosting origins
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/i66-reader-live-lab-before.sha"
          curl -fsSL --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/i66-reader-live-staff-before.sha"
          mkdir -p "$RUNNER_TEMP/i66-reader-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'i66-reader-auth'
          found=[]
          for n,key in enumerate(('SA_LAB','SA_LAB_ALT','SA_DEFAULT')):
            try: obj=json.loads(os.environ.get(key,''))
            except (ValueError,TypeError): continue
            if obj.get('type')=='service_account' and obj.get('project_id')==os.environ['PROJECT_ID'] and obj.get('private_key'):
              p=root/f'{n}.json';p.write_text(json.dumps(obj));p.chmod(0o600);found.append(str(p))
          if not found:raise SystemExit('I66_READER_PREVIEW_EXISTING_LAB_ACCOUNT_MISSING')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/i66-reader-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/i66-reader-cli"
          CLI="$RUNNER_TEMP/i66-reader-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate";break
            fi
          done < "$RUNNER_TEMP/i66-reader-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/i66-reader-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/i66-reader-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/i66-reader-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"

      - name: Prove target is an existing Preview function; build only a Functions config
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/i66-reader-functions-before.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i66-reader-functions-before.json','utf8'));
          const all=Array.isArray(x.result)?x.result:Array.isArray(x)?x:[];
          const preview=all.filter(r=>[r.entryPoint,r.id,r.name].some(x=>String(x||'').includes('orbit360ScopedPolicyReadPreview')));
          if(preview.length!==1)throw Error('I66_READER_PREVIEW_EXISTING_TARGET_NOT_EXACTLY_ONE');
          if(String(preview[0].region||preview[0].location||'us-east1')!=='us-east1')
            throw Error('I66_READER_PREVIEW_REGION_DRIFT');
          const live=all.filter(r=>String(r.entryPoint||r.id||r.name||'').includes('orbit360ScopedPolicyRead')&&!String(r.entryPoint||r.id||r.name||'').includes('Preview'));
          if(live.length!==1)throw Error('I66_READER_LIVE_CONTROL_TARGET_NOT_EXACTLY_ONE');
          NODE
          (cd "$I66_READER_PACKAGE/bundle/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"backend","runtime":"nodejs22"}}\n' > "$I66_READER_PACKAGE/bundle/firebase.json"

      - name: Deploy exclusively one authorized existing scoped callable to Preview
        run: |
          set -euo pipefail
          cd "$I66_READER_PACKAGE/bundle"
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360ScopedPolicyReadPreview --config firebase.json --project "$PROJECT_ID" --non-interactive
          echo "I66_READER_PREVIEW_ONLY_DEPLOY_COMPLETED"

      - name: Read back target and prove all other Functions and both LIVE origins unchanged
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/i66-reader-functions-after.json"
          node - <<'NODE'
          const fs=require('node:fs'),base=process.env.RUNNER_TEMP+'/i66-reader-functions-';
          const norm=file=>{
            const x=JSON.parse(fs.readFileSync(file,'utf8'));return Array.isArray(x.result)?x.result:Array.isArray(x)?x:[];
          };
          const before=norm(base+'before.json'),after=norm(base+'after.json');
          const id=x=>String(x.entryPoint||x.id||x.name||'');
          const names=all=>all.filter(x=>!id(x).includes('orbit360ScopedPolicyReadPreview')).map(id).sort();
          if(JSON.stringify(names(before))!==JSON.stringify(names(after)))
            throw Error('I66_READER_PREVIEW_OTHER_FUNCTION_INVENTORY_DRIFT');
          const target=after.filter(x=>[x.entryPoint,x.id,x.name].some(y=>String(y||'').includes('orbit360ScopedPolicyReadPreview')));
          if(target.length!==1)throw Error('I66_READER_PREVIEW_TARGET_MISSING_AFTER_DEPLOY');
          console.log('I66_READER_PREVIEW_SINGLE_FUNCTION_INVENTORY_PASS');
          NODE
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 25 --head https://us-east1-ays-orbit-360-lab.cloudfunctions.net/orbit360ScopedPolicyReadPreview)
          test "$status" = 400
          curl -fsSL --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/i66-reader-live-lab-after.sha"
          curl -fsSL --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/i66-reader-live-staff-after.sha"
          cmp "$RUNNER_TEMP/i66-reader-live-lab-before.sha" "$RUNNER_TEMP/i66-reader-live-lab-after.sha"
          cmp "$RUNNER_TEMP/i66-reader-live-staff-before.sha" "$RUNNER_TEMP/i66-reader-live-staff-after.sha"
          echo "I66_READER_PREVIEW_TECHNICAL_READBACK_PASS_ONE_FUNCTION_ZERO_LIVE_WRITES"
          echo "## I6.6 — Conciliaciones protected reader Preview only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certified source: $SOURCE_SHA; run $SOURCE_RUN; artifact $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed: $TARGET_FUNCTION in $TARGET_REGION (1 existing function only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unauthenticated endpoint guard: HTTP 400 (callable protocol)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Other Functions inventory and both LIVE Hosting origins: UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firestore document writes, Rules/Auth/IAM and Hosting promotion: NONE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authenticated role/country Preview UAT: PENDING" >> "$GITHUB_STEP_SUMMARY"
