# I6.6 successor, build-only. B4-003/004/005/006/007 historic gates are immutable.
# This workflow performs no Hosting/Functions deployment, no Firestore mutation,
# no Rules/Auth modification and no preview/live release promotion.
# Separate approval, isolated Preview readback and exact-artifact LIVE promotion
# are mandatory after this package is certified.
name: Gravicentra I6.6 Build Immutable Release Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravicentra-delta-66-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  immutable-package:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      PROJECT_ID: ays-orbit-360-lab
      HOSTING_SITE: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      RELEASE_GATE: I6.6
      BUILD_PREFIX: gi-i66
      ENVIRONMENT_REF: firebase-hosting-preview-i6-6
      GRAVICENTRA_B4_003_SCOPED_PREVIEW: 'true'
      GRAVICENTRA_B4_003_GOALS_PREVIEW: 'true'
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exactly the selected canonical SHA with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify latest I6.6 source and historical B4 seals without reopening B4
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --check tools/gravicentra-governance-preflight-v1.mjs
          node --check tools/gravicentra-i6-6-delta-guard.mjs
          node --check tools/gravicentra-i6-1-preview-package.mjs
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
      - name: Set up existing Firebase LAB credentials for read-only public config and tenant branding
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-auth'
          candidates=[]
          for n,key in enumerate(('SA_LAB','SA_LAB_ALT','SA_DEFAULT')):
              try: value=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError): continue
              if value.get('type')=='service_account' and value.get('project_id')==os.environ['PROJECT_ID'] and value.get('private_key'):
                  p=root/f'{n}.json';p.write_text(json.dumps(value));p.chmod(0o600);candidates.append(str(p))
          if not candidates: raise SystemExit('I66_CONFIG_CREDENTIAL_NOT_FOUND')
          (root/'candidates').write_text('\n'.join(candidates)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-i66-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-i66-cli"
          CLI="$RUNNER_TEMP/gi-i66-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate";break
            fi
          done < "$RUNNER_TEMP/gi-i66-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/gi-i66-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/gi-i66-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-i66-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
      - name: Build a single immutable package from the exact I6.6 source and config snapshot
        working-directory: candidate
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-i66-apps.json"
          APP_ID=$(node -e "const x=require(process.env.RUNNER_TEMP+'/gi-i66-apps.json');const a=(x.result||[]).filter(y=>['WEB','PLATFORM_WEB',''].includes(String(y.platform||'').toUpperCase()));if(a.length!==1)process.exit(2);process.stdout.write(a[0].appId)")
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-i66-sdkconfig.json"
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/gi-i66-branding.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/gi-i66-branding.json"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/gi-i66-package" "$RUNNER_TEMP/gi-i66-sdkconfig.json" > "$RUNNER_TEMP/gi-i66-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const base=process.env.RUNNER_TEMP+'/gi-i66-package/bundle';
          const cfg=JSON.parse(fs.readFileSync(base+'/firebase.json','utf8'));
          const meta=JSON.parse(fs.readFileSync(base+'/site/__recovery__/build.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_APPROVED_PRODUCT_DELTA_MANIFEST_20261110.json','utf8'));
          if(Object.keys(cfg).join(',')!=='hosting'||cfg.hosting.site!==process.env.HOSTING_SITE||cfg.hosting.public!=='site')throw Error('I66_PACKAGE_HOSTING_ONLY_OR_TARGET_DRIFT');
          if(meta.sourceSha!==process.env.SOURCE_SHA||meta.gate!=='I6.6'||!meta.buildId.startsWith('gi-i66-'))throw Error('I66_PACKAGE_SOURCE_OR_GATE_DRIFT');
          const runtime=fs.readFileSync(base+'/site/product-runtime-config.js','utf8');
          if(!runtime.includes('"scopedReadPreviewCandidate":true')||!runtime.includes('"goalParticipationPreviewCandidate":true'))throw Error('I66_SCOPED_READ_FLAG_DRIFT');
          for(const change of manifest.changes)for(const {path:p} of change.paths){
            const source=fs.readFileSync(p),target=fs.readFileSync(base+'/'+(p.startsWith('functions/')?'backend/'+p.slice(10):'site/'+p.slice(18)));
            if(!source.equals(target))throw Error('I66_APPROVED_PRODUCT_FILE_NOT_REACHED_UNCHANGED:'+p);
          }
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==meta.sourceSha)throw Error('I66_PACKAGE_BUILD_AFTER_SOURCE_MUTATION');
          console.log('I66_BUILD_ONE_SOURCE_ONE_ARTIFACT_NO_DEPLOY_PASS');
          NODE
      - name: Preserve byte-exact package, digest and source identity for Preview then LIVE
        run: |
          set -euo pipefail
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/gi-i66-exact-package.tar.gz" -C "$RUNNER_TEMP/gi-i66-package" bundle evidence
          sha256sum "$RUNNER_TEMP/gi-i66-exact-package.tar.gz" > "$RUNNER_TEMP/gi-i66-exact-package.sha256"
          test -s "$RUNNER_TEMP/gi-i66-exact-package.tar.gz"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "I6.6: build only; Preview=NOT_DEPLOYED; LIVE=NOT_DEPLOYED; DATA_WRITES=0" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gi-i66-immutable-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gi-i66-exact-package.tar.gz
            ${{ runner.temp }}/gi-i66-exact-package.sha256
          retention-days: 30
          if-no-files-found: error
