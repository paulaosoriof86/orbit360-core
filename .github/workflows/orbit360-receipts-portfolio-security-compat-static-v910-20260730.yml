name: Orbit 360 · Recibos/Cartera 9.1.0 · security compatibility static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-security-compat-static-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-security-compat-static-v910-20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  static_security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico antes de herramientas
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-build-legacy-lab-read-compat-candidate-v910-20260730.mjs
          node --check tools/orbit360-test-legacy-lab-read-compat-candidate-v910-20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Construir candidata inerte en runtime
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-build-legacy-lab-read-compat-candidate-v910-20260730.mjs
          jq -e '.classification=="SECURITY_FAILURE" and .candidateCommitted==false and .technicalLabIdentityOnly==true and .allowedCollections==["clientes","aseguradoras","asesores","polizas","vehiculos","recibosEsperados","carteraPrimas","cobros"] and .readOnly==true and .writesAllowed==false and .credentialRefsAllowed==false and .otherMembersLegacyAllowed==false and .productionRuleSourceModified==false and .deployExecuted==false' "$EVIDENCE_DIR/firestore-legacy-lab-compat-candidate-v910.json" >/dev/null
      - name: Preparar Java 21 para emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar emulador local aislado
        shell: bash
        run: |
          set -euo pipefail
          java -version
          npm install --no-save --package-lock=false --ignore-scripts firebase-tools@latest @firebase/rules-unit-testing@latest firebase@latest
          cat > "${RUNNER_TEMP}/firebase-emulator-v910.json" <<JSON
          {
            "firestore": {"rules": "${GITHUB_WORKSPACE}/orbit360-platform/runtime-gate-crm-v20260716/firestore.product-readonly.v910-candidate.rules"},
            "emulators": {"firestore": {"host": "127.0.0.1", "port": 8080}}
          }
          JSON
      - name: Probar mínimo privilegio en emulador
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --only firestore --project demo-orbit360-security-v910 --config "${RUNNER_TEMP}/firebase-emulator-v910.json" "node tools/orbit360-test-legacy-lab-read-compat-candidate-v910-20260730.mjs"
          jq -e '.ok==true and .status=="SECURITY_COMPAT_CANDIDATE_EMULATOR_PASS" and .checks.labAllowedCollectionRead==true and .checks.labSecondAllowedCollectionRead==true and .checks.labLegacyWriteDenied==true and .checks.sensitiveLegacyCollectionDenied==true and .checks.otherActiveMemberLegacyDenied==true and .checks.unauthenticatedLegacyDenied==true and .checks.productReadPreserved==true and .checks.productWriteStillDenied==true and .checks.credentialRefsStillDenied==true and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/firestore-legacy-lab-compat-emulator-v910.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-security-compat-v910-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/firestore-legacy-lab-compat-candidate-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/firestore-legacy-lab-compat-emulator-v910.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          TEST: orbit360-platform/runtime-gate-crm-v20260716/firestore-legacy-lab-compat-emulator-v910.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Security compatibility static failed';
            try{const t=JSON.parse(fs.readFileSync(process.env.TEST,'utf8'));if(t.ok===true&&t.status==='SECURITY_COMPAT_CANDIDATE_EMULATOR_PASS'){state='success';description='Security compatibility candidate PASS; no deploy';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-security-compat-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
