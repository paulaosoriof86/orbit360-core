name: Orbit 360 · M5 5.0.40 legacy seed marker static validation
run-name: M5 5.0.40 · static root-cause closure · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-academia-legacy-seed-marker-static-540-trigger-v20260730.json'

permissions:
  contents: read
  statuses: write

jobs:
  static:
    name: M5 · legacy seed marker 5.0.40 · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar gate canónico 5.0.40
        shell: bash
        env:
          ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
          ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_ACADEMIA_LEGACY_SEED_MARKER_540_STATIC_PASS" and .contractVersion=="5.0.40" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .criticalAssets==46 and .remoteAssetsExpected==29 and .remoteAssetsMatched==25 and .mismatchCount==4 and .approvalReadyForLabDelivery==true and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-academia-legacy-seed-marker-540-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-academia-legacy-seed-marker-540-fixture-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-540-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest-540.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          PRE: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.40 static remediation failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.PRE,'utf8'));if(p.status==='M5_ACADEMIA_LEGACY_SEED_MARKER_540_STATIC_PASS'&&p.failed===0&&p.remoteAssetsMatched===25&&p.mismatchCount===4){state='success';description='M5 5.0.40 static PASS; new RC ready for Hosting';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-academia-seed-marker-static-540',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
