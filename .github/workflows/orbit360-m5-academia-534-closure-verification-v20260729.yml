name: Orbit 360 · M5 5.0.34 closure verification
run-name: M5 5.0.34 · post-remediation zero-capability closure · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-academia-534-closure-verification-v20260729.yml'

permissions:
  contents: read
  statuses: write

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: 401f87b148048f85db3f4956474258c51c29e2c9e7c9a59e52f425d491ab89e7

jobs:
  verify:
    name: M5 · verify 5.0.34 closure · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar cierre canónico
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-academia-remediation-534-v20260729.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-academia-534-closed-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_ACADEMIA_REMEDIATION_534_CLOSED_NEW_RC_READY_TO_REQUEST_HOSTING_AUTHORIZATION" and .contractVersion=="5.0.34" and .executionPhase=="M5_POST_ACCESS_RC_READINESS_STATIC" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==44 and .remoteAssetsExpected==27 and .remoteAssetsMatched==26 and .mismatchCount==1 and .mismatchPaths==["data/academia-plus.js"] and .hostingLabDeliveryAuthorized==false and .allowedHostingExecutions==0 and .runtimeSmokeAuthorized==false and .allowedRuntimeExecutions==0 and .runtimeAuthorizationConsumed==true and .visualReviewAuthorized==false and .productionAuthorized==false and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .secretsRead==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-academia-534-closure-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.34 closure verification failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(s.status==='M5_ACADEMIA_REMEDIATION_534_CLOSED_NEW_RC_READY_TO_REQUEST_HOSTING_AUTHORIZATION'&&s.failed===0){state='success';description='M5 5.0.34 closed; new RC 44/27; Hosting auth required';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-academia-534-closure',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
