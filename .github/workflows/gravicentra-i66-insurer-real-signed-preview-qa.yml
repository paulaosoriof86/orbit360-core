# I6.6 real signed Direccion/Operativo insurer QA. Preview and LIVE read-only; never mutate insurer or permissions.
name: Gravicentra I6.6 Real Signed Insurer Preview QA
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths: [.github/workflows/gravicentra-i66-insurer-real-signed-preview-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gi-i66-real-insurer-signed-qa
  cancel-in-progress: false
jobs:
  qa:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 0a54148547282b07536d5cc1c92854b023f23d71
      PREVIEW_ORIGIN: https://ays-orbit-360-lab--gi-i66-rc-43293845272-j4qucpnj.web.app
      LIVE_ORIGIN: https://app.aysseguros.com
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove source, artifact identity and regression without new product mutations
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -z "$(git diff --name-only "$SOURCE_SHA" HEAD -- orbit360-platform functions firebase.json firestore.rules storage.rules)"
          node tools/gravicentra-i6-6-insurer-operativo-signed-scope.test.cjs
          node tools/gravicentra-i6-6-insurer-legacy-credential-update.test.cjs
          node tools/gravicentra-i6-6-insurer-credential-placeholder-integrity.test.cjs
          curl -fsSL --max-time 25 "$PREVIEW_ORIGIN/__recovery__/build.json" > "$RUNNER_TEMP/i66-insurer-build.json"
          node - <<'NODE'
          const b=require(process.env.RUNNER_TEMP+'/i66-insurer-build.json');
          if(b.sourceSha!==process.env.SOURCE_SHA||b.gate!=='I6.6'||!String(b.buildId).startsWith('gi-i66-'+process.env.SOURCE_SHA.slice(0,12)+'-'))throw Error('I66_INSURER_PREVIEW_SOURCE_MISMATCH');
          console.log('I66_INSURER_PREVIEW_EXACT_SOURCE_PASS');
          NODE
      - name: Install pinned read-only signed Chrome QA dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Confirm Paula Direccion and Carlos Operativo signed insurer preflight in Preview
        run: |
          node - <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const sdk=require('firebase-admin'),{chromium}=require('playwright');
          const service=['SA_LAB','SA_ALT','SA_DEFAULT'].map(n=>process.env[n]).filter(Boolean)
            .map(s=>{try{return JSON.parse(s);}catch(_){return null;}})
            .find(s=>s&&s.type==='service_account'&&s.project_id==='ays-orbit-360-lab'&&s.private_key);
          assert.ok(service,'I66_EXISTING_FIREBASE_IDENTITY_NOT_FOUND');
          sdk.initializeApp({credential:sdk.credential.cert(service),projectId:'ays-orbit-360-lab'});
          const db=sdk.firestore(),auth=sdk.auth(),root=db.collection('tenants').doc('alianzas-soluciones');
          const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          (async()=>{
            const [members,advisors]=await Promise.all([
              root.collection('members').limit(150).get(),
              root.collection('data').doc('asesores').collection('items').limit(400).get()
            ]);
            assert.ok(members.size<150&&advisors.size<400,'I66_SIGNED_QA_BOUND_HOLD');
            const advisorIds=new Set(),userIds=new Set();
            for(const d of advisors.docs){
              const a=d.data()||{};
              if([a.nombre,a.nombreCompleto,a.displayName,a.name].some(x=>norm(x).startsWith('carlos castro'))){
                advisorIds.add(d.id);
                for(const k of [a.authUid,a.uid,a.userId])if(k)userIds.add(String(k));
              }
            }
            const candidates=members.docs.filter(d=>{
              const m=d.data()||{},isCarlos=[m.nombre,m.displayName,m.name,m.nombreCompleto,m.fullName]
                .some(x=>norm(x).startsWith('carlos castro'))||advisorIds.has(String(m.advisorId||m.asesorId||''))||userIds.has(d.id);
              const roles=[m.activeRole,m.rol,m.rolDefault,...[].concat(m.roles||[])].map(norm);
              return isCarlos&&roles.includes('operativo')&&m.active!==false&&m.activo!==false&&
                !['inactivo','inactive','bloqueado','blocked'].includes(norm(m.status||m.estado));
            });
            assert.equal(candidates.length,1,'I66_CARLOS_SIGNED_MEMBER_NOT_UNIQUE');
            const member=candidates[0].data()||{};
            assert.equal(norm(member.activeRole),'operativo','I66_CARLOS_ACTIVE_ROLE_DRIFT');
            assert.ok([].concat(member.countries||member.paises||[]).map(x=>String(x).toUpperCase()).includes('GT'),'I66_CARLOS_GT_DENIED');
            const user=await auth.getUser(candidates[0].id);
            assert.ok(!user.disabled&&user.emailVerified,'I66_CARLOS_AUTH_NOT_READY');
            const token=await auth.createCustomToken(user.uid);
            const paulaAdvisorIds=new Set(),paulaUserIds=new Set();
            for(const d of advisors.docs){
              const a=d.data()||{};
              if([a.nombre,a.nombreCompleto,a.displayName,a.name].some(x=>norm(x).includes('paula')&&norm(x).includes('osorio'))){
                paulaAdvisorIds.add(d.id);
                for(const k of [a.authUid,a.uid,a.userId])if(k)paulaUserIds.add(String(k));
              }
            }
            const paulaMembers=members.docs.filter(d=>{
              const m=d.data()||{},named=[m.nombre,m.nombreCompleto,m.displayName,m.name,m.fullName]
                .some(x=>norm(x).includes('paula')&&norm(x).includes('osorio'))||
                paulaAdvisorIds.has(String(m.advisorId||m.asesorId||''))||paulaUserIds.has(d.id);
              return named&&norm(m.activeRole).includes('direccion')&&
                [].concat(m.countries||m.paises||[]).map(x=>String(x).toUpperCase()).includes('GT')&&
                m.active!==false&&m.activo!==false&&
                !['inactivo','inactive','bloqueado','blocked'].includes(norm(m.status||m.estado));
            });
            assert.equal(paulaMembers.length,1,'I66_PAULA_SIGNED_MEMBER_NOT_UNIQUE');
            const paulaMember=paulaMembers[0].data()||{};
            assert.ok(norm(paulaMember.activeRole).includes('direccion'),'I66_PAULA_ACTIVE_ROLE_DRIFT');
            assert.ok([].concat(paulaMember.countries||paulaMember.paises||[]).map(x=>String(x).toUpperCase()).includes('GT'),'I66_PAULA_GT_DENIED');
            const paulaAuth=await auth.getUser(paulaMembers[0].id);
            assert.ok(!paulaAuth.disabled&&paulaAuth.emailVerified,'I66_PAULA_AUTH_NOT_READY');
            const otherToken=await auth.createCustomToken(paulaAuth.uid);
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              const context=await browser.newContext({viewport:{width:1280,height:900}});
              async function checkOrigin(origin,actorToken,expectedRole){
                const isolatedActor=await browser.newContext({viewport:{width:1280,height:900}});
                try {
                  const page=await isolatedActor.newPage();
                  await page.goto(origin+'/#/aseguradoras?ficha=gt-aseguradora-guatemalteca',{waitUntil:'commit',timeout:30000});
                  await page.waitForFunction(()=>!!window.Orbit?.productRuntimeBrowserProvidersP0&&!!window.Orbit?.productAppP0,null,{timeout:30000});
                  const authResult=await page.evaluate(async(token)=>{
                    const provider=Orbit.productRuntimeBrowserProvidersP0, state=await provider.initialize();
                    await state.modules.auth.signInWithCustomToken(state.auth,token);
                    const result=await Orbit.productAppP0.activate();
                    return {started:result?.started===true,role:String(Orbit.session?.rol?.()||'')};
                  },actorToken);
                  assert.ok(authResult.started,'I66_SIGNED_PRODUCT_ACTIVATION_FAILED');
                  assert.ok(norm(authResult.role).includes(norm(expectedRole)),'I66_SIGNED_ROLE_INCORRECT');
                  await page.waitForFunction(()=>!!window.Orbit?.store?.get('aseguradoras','gt-aseguradora-guatemalteca'),null,{timeout:30000});
                  const readback=await page.evaluate(()=>{
                    const rec=Orbit.store.get('aseguradoras','gt-aseguradora-guatemalteca');
                    const member=Orbit.auth?.productUser||{};
                    return {found:!!rec,tenant:rec?.tenantId==='alianzas-soluciones',country:rec?.pais==='GT',
                      lacksAdvisor:!rec?.asesorId,role:String(Orbit.session?.rol?.()||''),
                      assignedRoles:[].concat(member.roles||[],member.activeRole||''),
                      activeRole:member.activeRole,
                      scope:Orbit.access.dataScope('aseguradoras'),
                      matrixAllows:Orbit.access.can('aseguradoras','edit'),
                      preflightAllows:Orbit.access.canAccessRecord(rec,'aseguradoras',{collection:'aseguradoras'})};
                  });
                  if(origin===process.env.PREVIEW_ORIGIN){
                    async function selectSignedTab(tab){
                      const locator=page.locator('[data-tab="'+tab+'"]');
                      try {
                        await locator.scrollIntoViewIfNeeded({timeout:4500});
                        await locator.click({timeout:4500,noWaitAfter:true});
                      } catch (error) {
                        const diagnostic=await page.evaluate(t=>{
                          const element=document.querySelector('[data-tab="'+t+'"]');
                          if(!element)return {tab:t,missing:true};
                          const b=element.getBoundingClientRect(),hit=document.elementFromPoint(b.x+b.width/2,b.y+b.height/2);
                          return {tab:t,selected:element.getAttribute('aria-selected'),visible:getComputedStyle(element).visibility,
                            inViewport:b.x>=0&&b.y>=0&&b.bottom<=innerHeight&&b.right<=innerWidth,
                            hitTag:hit&&hit.tagName,hitClass:String(hit&&hit.className||'').slice(0,72),hitIsTab:!!hit&&(hit===element||element.contains(hit))};
                        },tab);
                        console.log('I66_SIGNED_TAB_POINTER_HOLD='+JSON.stringify(diagnostic));
                        await locator.evaluate(element=>element.click());
                      }
                      await page.waitForFunction(t=>document.querySelector('[data-tab="'+t+'"]')?.getAttribute('aria-selected')==='true',tab,{timeout:8000});
                    }
                    await page.locator('#af-editar').waitFor({state:'visible',timeout:20000});
                    await page.locator('#af-editar').click();
                    assert.equal(await page.locator('#af-logo-file').count(),1,'I66_EDITABLE_LOGO_FILE_MISSING');
                    assert.equal(await page.locator('#af-logo-file').isEnabled(),true,'I66_LOGO_FILE_DISABLED');
                    await selectSignedTab('bancos');
                    assert.ok(await page.locator('#af-cuentas [data-ccn]').count()>0,'I66_EDITABLE_BANK_ACCOUNTS_MISSING');
                    assert.equal(await page.locator('#af-cuentas [data-ccn]').first().isEnabled(),true,'I66_BANK_ACCOUNT_READ_ONLY');
                    await selectSignedTab('plataformas');
                    assert.ok(await page.locator('#af-portales [data-ppass]').count()>0,'I66_SECURE_PASSWORD_INPUT_MISSING');
                    assert.equal(await page.locator('#af-portales [data-ppass]').first().isEnabled(),true,'I66_PASSWORD_INPUT_DISABLED');
                    await page.locator('#af-cancelar').click();
                    console.log('I66_'+expectedRole.toUpperCase()+'_PREVIEW_INSURER_BANK_PASSWORD_LOGO_EDITABLE_NO_WRITES_PASS');
                  }
                  return readback;
                } finally {await isolatedActor.close();}
              }
              for(const actor of [{name:'CARLOS',token,role:'operativo'},{name:'PAULA',token:otherToken,role:'direccion'}]){
                const preview=await checkOrigin(process.env.PREVIEW_ORIGIN,actor.token,actor.role);
                assert.ok(preview.found&&preview.tenant&&preview.country&&preview.lacksAdvisor,'I66_PREVIEW_REAL_INSURER_SCOPE_DRIFT_'+actor.name);
                assert.ok(preview.assignedRoles.some(x=>norm(x).includes(actor.role)),'I66_PREVIEW_ASSIGNED_ROLE_DRIFT_'+actor.name);
                assert.equal(preview.scope,'all','I66_PREVIEW_SCOPE_NOT_TENANT_'+actor.name);
                assert.equal(preview.matrixAllows,true,'I66_PREVIEW_ROLE_EDIT_DENIED_'+actor.name);
                assert.equal(preview.preflightAllows,true,'I66_PREVIEW_REAL_SAVE_PREFLIGHT_DENIED_'+actor.name);
                console.log('I66_REAL_'+actor.name+'_SIGNED_PREVIEW_INSURER_SAVE_PREFLIGHT_PASS');
                // LIVE remains an observed baseline: no real customer writes, no false certification.
                const live=await checkOrigin(process.env.LIVE_ORIGIN,actor.token,actor.role);
                assert.ok(live.found&&live.tenant&&live.country&&live.lacksAdvisor,'I66_LIVE_BASELINE_RECORD_DRIFT_'+actor.name);
                console.log('I66_EXISTING_LIVE_'+actor.name+'_MATRIX_ALLOWS='+Boolean(live.matrixAllows));
                console.log('I66_EXISTING_LIVE_'+actor.name+'_INSURER_PREFLIGHT_ALLOWS='+Boolean(live.preflightAllows));
              }
              console.log('I66_TWO_REAL_ROLES_PREVIEW_COUNTRY_SCOPE_AND_NO_ADVISOR_PASS');
              // Baseline is observed only to distinguish old LIVE policy, never write real records.
              console.log('I66_LIVE_INSURER_BASELINE_OBSERVED_WITHOUT_WRITE_OR_FALSE_PASS');
              // Reproduce tab-local productUser outliving browser-wide Firebase LOCAL
              // auth after a different authorized user signs in on the same origin.
              // No real insurer mutation and no settings/persistence changes.
              const carlosPage=await context.newPage();
              await carlosPage.goto(process.env.PREVIEW_ORIGIN+'/#/aseguradoras?ficha=gt-aseguradora-guatemalteca',{waitUntil:'commit',timeout:30000});
              await carlosPage.waitForFunction(()=>!!window.Orbit?.productRuntimeBrowserProvidersP0&&!!window.Orbit?.productAppP0);
              await carlosPage.evaluate(async(t)=>{
                const p=Orbit.productRuntimeBrowserProvidersP0,c=await p.initialize();
                await c.modules.auth.signInWithCustomToken(c.auth,t);
                const result=await Orbit.productAppP0.activate();
                if(result?.started!==true)throw Error('CARLOS_ACTIVATION_FAILED');
              },token);
              const otherPage=await context.newPage();
              await otherPage.goto(process.env.PREVIEW_ORIGIN+'/#/inicio',{waitUntil:'commit',timeout:30000});
              await otherPage.waitForFunction(()=>!!window.Orbit?.productRuntimeBrowserProvidersP0);
              await otherPage.evaluate(async(t)=>{
                const p=Orbit.productRuntimeBrowserProvidersP0,c=await p.initialize();
                await c.modules.auth.signInWithCustomToken(c.auth,t);
              },otherToken);
              // A session-isolated fixed build must NOT be forced to reproduce
              // the historical cross-tab identity drift to pass this QA.
              await carlosPage.waitForTimeout(400);
              const drift=await carlosPage.evaluate(async()=>{
                const c=await Orbit.productRuntimeBrowserProvidersP0.initialize();
                return {projectionStillCarlos:!!Orbit.auth.productUser?.uid,
                  providerNowDifferentUser:!!c.auth.currentUser&&c.auth.currentUser.uid!==Orbit.auth.productUser?.uid,
                  writeGuardWouldFail:!c.auth.currentUser||c.auth.currentUser.uid!==Orbit.auth.productUser?.uid};
              });
              // A browser/SDK may immediately refresh the stale projection in
              // this scenario; a non-reproduction is evidence, not a false
              // product failure or a license to declare the cause proven.
              console.log('I66_LOCAL_PERSISTENCE_MULTITAB_DRIFT_OBSERVED='+Boolean(drift.projectionStillCarlos&&drift.providerNowDifferentUser&&drift.writeGuardWouldFail));
              await otherPage.close();await carlosPage.close();
              // The independent-session contract must also be proven in the
              // actual Firebase SDK, not only by source-text unit assertions.
              // Custom-token sign-in is used for QA without revealing a password.
              const isolated=await browser.newContext({viewport:{width:1280,height:900}});
              const first=await isolated.newPage();
              await first.goto(process.env.PREVIEW_ORIGIN+'/#/inicio',{waitUntil:'commit',timeout:30000});
              await first.waitForFunction(()=>!!window.Orbit?.productRuntimeBrowserProvidersP0&&!!window.Orbit?.productAppP0,null,{timeout:30000});
              await first.evaluate(async(t)=>{
                const p=Orbit.productRuntimeBrowserProvidersP0,c=await p.initialize();
                await c.modules.auth.setPersistence(c.auth,c.modules.auth.browserSessionPersistence);
                await c.modules.auth.signInWithCustomToken(c.auth,t);
                const a=await Orbit.productAppP0.activate();if(a?.started!==true)throw Error('ISOLATED_CARLOS_PRODUCT_ACTIVATION_FAILED');
              },token);
              const second=await isolated.newPage();
              await second.goto(process.env.PREVIEW_ORIGIN+'/#/inicio',{waitUntil:'commit',timeout:30000});
              await second.waitForFunction(()=>!!window.Orbit?.productRuntimeBrowserProvidersP0,null,{timeout:30000});
              await second.evaluate(async(t)=>{
                const p=Orbit.productRuntimeBrowserProvidersP0,c=await p.initialize();
                await c.modules.auth.setPersistence(c.auth,c.modules.auth.browserSessionPersistence);
                await c.modules.auth.signInWithCustomToken(c.auth,t);
              },otherToken);
              const stable=await first.evaluate(async()=>{
                const c=await Orbit.productRuntimeBrowserProvidersP0.initialize();
                return !!c.auth.currentUser?.uid&&c.auth.currentUser.uid===Orbit.auth.productUser?.uid;
              });
              assert.equal(stable,true,'I66_BROWSER_SESSION_TABS_STILL_SHARE_AUTH');
              console.log('I66_FIREBASE_BROWSER_SESSION_TWO_REAL_ACTORS_ISOLATED_PASS');
              await isolated.close();
              console.log('I66_FIRESTORE_WRITES=0,AUTH_ACCOUNT_CONFIG_WRITES=0,INSURER_FIELDS_REDACTED=true');
            } finally {await browser.close();}
          })().catch(e=>{console.error('I66_SIGNED_PREVIEW_QA_HOLD='+String(e.message||e).replace(/[^A-Za-z0-9_ -]/g,'').slice(0,120));process.exitCode=1;});
          NODE
