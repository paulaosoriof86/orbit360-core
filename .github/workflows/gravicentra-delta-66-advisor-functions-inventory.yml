# Read-only I6.6 Advisor approved four-function inventory, no deploy/Firestore/Rules/Auth changes.
name: Gravicentra I6.6 Advisor LIVE Functions Inventory
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-delta-66-advisor-functions-inventory.yml
permissions:
  contents: read
concurrency:
  group: gravicentra-i66-advisor-functions-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_ID: ays-orbit-360-lab
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 439ff7aebc685866c5605407dbc920fb329a552b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate using already configured same-project read authority
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adv-inventory-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'adv-inventory-auth';found=[]
          for i,key in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try: data=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError):continue
              if data.get('type')=='service_account' and data.get('project_id')=='ays-orbit-360-lab' and data.get('private_key'):
                  p=root/f'{i}.json';p.write_text(json.dumps(data));p.chmod(0o600);found.append(str(p))
          if not found:raise SystemExit('I66_ADVISOR_INVENTORY_LAB_CREDENTIAL_UNAVAILABLE')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/adv-inventory-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/adv-inventory-cli"
          CLI="$RUNNER_TEMP/adv-inventory-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          SEL=''
          while IFS= read -r c;do
            if GOOGLE_APPLICATION_CREDENTIALS="$c" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/adv-inventory-firebase.json" 2>/dev/null;then SEL="$c";break;fi
          done < "$RUNNER_TEMP/adv-inventory-auth/candidates"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/adv-inventory-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/adv-inventory-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/adv-inventory-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Inventory all four exact Function identities/regions and Cloud Run revisions
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          node - <<'NODE'
          const fs=require('node:fs'),j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/adv-inventory-firebase.json'));
          const a=j.result||j.functions||[];
          if(!Array.isArray(a))throw Error('I66_ADVISOR_FIREBASE_LIST_SCHEMA_UNSUPPORTED');
          const names=['orbit360CobrosReconciliationCommand','orbit360NotificationOutboxCreated','orbit360GetAdvisorOpsInbox','orbit360UpdateAdvisorOpsInboxState'];
          for(const name of names){
            const x=a.filter(row=>String(row.id||row.name||row.functionName||'').split('/').at(-1)===name);
            console.log('I66_ADVISOR_FIREBASE_LIST_ID='+name+' MATCHES='+x.length+' REGIONS='+x.map(z=>z.region||z.location||'?').join(','));
            if(x.length>1)throw Error('I66_ADVISOR_DUPLICATE_FUNCTION_NAME:'+name);
          }
          NODE
          for FN in orbit360CobrosReconciliationCommand orbit360NotificationOutboxCreated orbit360GetAdvisorOpsInbox orbit360UpdateAdvisorOpsInboxState; do
            for REG in us-central1 us-east1; do
              if gcloud functions describe "$FN" --gen2 --region "$REG" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/adv-inv-$FN-$REG.json" 2> "$RUNNER_TEMP/adv-inv-$FN-$REG.error";then
                SERVICE=$(node - "$FN" "$REG" <<'NODE'
          const fs=require('node:fs'),fn=process.argv[2],region=process.argv[3],r=process.env.RUNNER_TEMP;
          const o=JSON.parse(fs.readFileSync(r+'/adv-inv-'+fn+'-'+region+'.json'));
          const service=String(o.serviceConfig?.service||''),name=service.split('/').at(-1);
          if(!service.includes('/locations/'+region+'/services/')||!/^[a-z][a-z0-9-]+$/.test(name))
            throw Error('I66_ADVISOR_FUNCTION_SERVICE_UNAVAILABLE:'+fn+':'+region);
          process.stdout.write(name);
          NODE
                )
                gcloud run services describe "$SERVICE" --region "$REG" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/adv-inv-$FN-$REG-run.json"
                node - "$FN" "$REG" "$SERVICE" <<'NODE'
          const fs=require('node:fs'),fn=process.argv[2],reg=process.argv[3],service=process.argv[4],r=process.env.RUNNER_TEMP;
          const v=JSON.parse(fs.readFileSync(r+'/adv-inv-'+fn+'-'+reg+'-run.json')),ts=v.status?.traffic||v.traffic||[];
          const full=ts.filter(x=>Number(x.percent)===100),rev=String(full[0]?.revisionName||full[0]?.revision||'');
          if(full.length!==1||!rev.startsWith(service+'-'))throw Error('I66_ADVISOR_FUNCTION_REVISION_NOT_UNIQUE:'+fn+':'+reg);
          console.log('I66_ADVISOR_CLOUD_FUNCTION='+fn+' REGION='+reg+' CLASS=EXISTING_REV REV='+rev);
          NODE
              else
                if ! grep -Fq 'status=[404]' "$RUNNER_TEMP/adv-inv-$FN-$REG.error";then
                  echo "I66_ADVISOR_GCLOUD_ERROR_NOT_404:$FN:$REG";exit 1
                fi
                echo "I66_ADVISOR_CLOUD_FUNCTION=$FN REGION=$REG CLASS=ABSENT_VERIFIED"
              fi
            done
          done
          echo 'I66_ADVISOR_ALL_FOUR_FUNCTIONS_READONLY_INVENTORY_PASS; REAL_DATA_WRITES=0'
      - name: I6.6 P0 Ops Leads callable and record path read-only identity
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          gcloud functions describe orbit360OpsLeadsCommand --gen2 --region us-central1 --project "$PROJECT_ID" --format='value(state)' | sed 's/^/I66_OPS_LIVE_FUNCTION_STATE=/'
          gcloud functions describe orbit360OpsLeadsCommand --gen2 --region us-central1 --project "$PROJECT_ID" --format='value(updateTime)' | sed 's/^/I66_OPS_LIVE_FUNCTION_UPDATED_AT=/'
          REV="$(gcloud run services describe orbit360opsleadscommand --region us-central1 --project "$PROJECT_ID" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          echo "I66_OPS_LIVE_CLOUDRUN_READY_REVISION=${REV:-UNAVAILABLE_WITH_EXISTING_IAM}"
          if gcloud run services describe orbit360opsleadscommand --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/i66-ops-cloudrun-service.json" 2>/dev/null;then
            python3 - <<'PY'
          import json,os
          s=json.load(open(os.environ['RUNNER_TEMP']+'/i66-ops-cloudrun-service.json'))
          traffic=(s.get('status') or {}).get('traffic') or []
          print('I66_OPS_CLOUDRUN_TRAFFIC_READONLY='+json.dumps([{'revision':v.get('revisionName',''), 'percent':v.get('percent',0),'latestRevision':v.get('latestRevision',False)} for v in traffic],sort_keys=True))
          PY
          else echo 'I66_OPS_CLOUDRUN_TRAFFIC_READONLY=UNAVAILABLE_WITH_EXISTING_IAM';fi
          python3 - <<'PY'
          import json,os,subprocess,urllib.request,urllib.parse,urllib.error,hashlib,datetime
          project=os.environ['PROJECT_ID']
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True).strip()
          root='https://firestore.googleapis.com/v1/projects/'+project+'/databases/(default)/documents/tenants/alianzas-soluciones/data/'
          def field(row,key):
              v=(row.get('fields') or {}).get(key) or {}
              return str(v.get('stringValue') or '')
          documentPrefix='https://firestore.googleapis.com/v1/projects/'+project+'/databases/(default)/documents/'
          def exact_document(path):
              request=urllib.request.Request(documentPrefix+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:return json.load(response),200
              except urllib.error.HTTPError as error:
                  if error.code==404:return None,404
                  raise
          def query(collection):
              rows=[];page=''
              for _ in range(10):
                  url=root+collection+'/items?pageSize=500'+('&pageToken='+urllib.parse.quote(page,safe='') if page else '')
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=25) as response:
                          body=json.load(response)
                  except urllib.error.HTTPError as e:
                      print('I66_OPS_CANONICAL_READ_ERROR='+collection+':HTTP_'+str(e.code))
                      raise
                  rows.extend(body.get('documents') or [])
                  page=str(body.get('nextPageToken') or '')
                  if not page:break
              else:
                  raise RuntimeError('I66_OPS_READONLY_PAGINATION_LIMIT_'+collection)
              bad=[d for d in rows if field(d,'id') and field(d,'id') != d['name'].split('/')[-1]]
              missing=[d for d in rows if not field(d,'id')]
              if collection=='negocios':
                  sample=[d for d in rows if field(d,'nombre').casefold()=='fernando arias']
              else:
                  sample=[d for d in rows if 'B4-003-EXP-38102224750' in field(d,'titulo')]
              matched=[{'physicalEqualsLogical':field(d,'id')==d['name'].split('/')[-1],
                        'hasCanonicalId':bool(field(d,'id')),
                        'referenceHash16':hashlib.sha256(('alianzas-soluciones|'+collection+'|'+d['name'].split('/')[-1]).encode()).hexdigest()[:16],
                        'archiveState':str((d.get('fields') or {}).get('archivado') or {})[:45]}
                       for d in sample]
              print('I66_OPS_CANONICAL_IDENTITY='+json.dumps({'collection':collection,'physicalDocumentCount':len(rows),'idMismatchCount':len(bad),'missingLogicalIdCount':len(missing),'specificScreenshotRecordCount':len(sample),'specificScreenshotRecordIdentity':matched},sort_keys=True))
              return rows
          negocios=query('negocios')
          gestiones=query('gestiones')
          # 10-Nov 16:04 GT I6.6 UAT: enumerate only a precise synthetic QA
          # marker. Never disclose a document ID, client name or note content.
          canary=[]
          for d in gestiones:
              marker=' '.join(field(d,k) for k in ('nota','notas','proximaAccion','titulo')).casefold()
              if 'qa i6.6' not in marker:continue
              physical=d['name'].split('/')[-1]
              fields=d.get('fields') or {}
              canary.append({'referenceHash16':hashlib.sha256(('alianzas-soluciones|gestiones|'+physical).encode()).hexdigest()[:16],
                  'archive':(fields.get('archivado') or {}).get('booleanValue') is True,
                  'hasCountry':bool(field(d,'pais')),'hasAdvisor':bool(field(d,'asesorId')),
                  'listHash12':hashlib.sha256(field(d,'lista').encode()).hexdigest()[:12] if field(d,'lista') else ''})
          allCanonicalGestionHashes={hashlib.sha256(('alianzas-soluciones|gestiones|'+d['name'].split('/')[-1]).encode()).hexdigest()[:16] for d in gestiones}
          print('I66_OPS_1604_CANARY_GESTIONES='+json.dumps({'matchedCount':len(canary),'rows':canary},sort_keys=True))

          # The server writes workflowRequests/status=committed in the SAME
          # transaction as data/gestiones. Read-only request inventory verifies
          # whether a 200 invocation actually committed a management creation.
          reqRoot='https://firestore.googleapis.com/v1/projects/'+project+'/databases/(default)/documents/tenants/alianzas-soluciones/workflowRequests'
          start=datetime.datetime.fromisoformat('2026-11-10T22:03:00+00:00')
          end=datetime.datetime.fromisoformat('2026-11-10T22:07:00+00:00')
          reqCount=0;window=[];page=''
          for _ in range(15):
              url=reqRoot+'?pageSize=500'+('&pageToken='+urllib.parse.quote(page,safe='') if page else '')
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=25) as response:body=json.load(response)
              docs=body.get('documents') or [];reqCount+=len(docs)
              for d in docs:
                  fields=d.get('fields') or {}
                  if field(d,'operation')!='create_management':continue
                  stamp=(fields.get('committedAt') or {}).get('timestampValue') or ''
                  try:when=datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))
                  except ValueError:continue
                  if not start<=when<=end:continue
                  result=(fields.get('result') or {}).get('mapValue') or {}
                  resultFields=result.get('fields') or {}
                  entity=(resultFields.get('entityId') or {}).get('stringValue') or ''
                  eventId=(resultFields.get('eventId') or {}).get('stringValue') or ''
                  entityHash=hashlib.sha256(('alianzas-soluciones|gestiones|'+entity).encode()).hexdigest()[:16] if entity else ''
                  eventHash=hashlib.sha256(eventId.encode()).hexdigest()[:16] if eventId else ''
                  entityDoc,entityHttp=exact_document('tenants/alianzas-soluciones/data/gestiones/items/'+urllib.parse.quote(entity,safe='')) if entity else (None,0)
                  eventDoc,eventHttp=exact_document('tenants/alianzas-soluciones/workflowEvents/'+urllib.parse.quote(eventId,safe='')) if eventId else (None,0)
                  eventFields=(eventDoc.get('fields') or {}) if eventDoc else {}
                  eventEntity=(eventFields.get('entityId') or {}).get('stringValue') or ''
                  eventOp=(eventFields.get('operation') or {}).get('stringValue') or ''
                  eventType=(eventFields.get('entityType') or {}).get('stringValue') or ''
                  window.append({'requestHash16':hashlib.sha256(d['name'].split('/')[-1].encode()).hexdigest()[:16],
                      'entityReferenceHash16':entityHash,'status':field(d,'status'),
                      'entityType':str((resultFields.get('entityType') or {}).get('stringValue') or ''),
                      'committedAtUtc':stamp,'directCanonicalEntityHttp':entityHttp,
                      'entityExistsInCanonicalGestiones':entityHash in allCanonicalGestionHashes,
                      'sameEntityAsCanary':any(x['referenceHash16']==entityHash for x in canary),
                      'eventHash16':eventHash,'directWorkflowEventHttp':eventHttp,
                      'workflowEventEntityMatchesRequest':bool(eventEntity and eventEntity==entity),
                      'workflowEventOperation':eventOp,'workflowEventEntityType':eventType,
                      'eventAfterDigestPresent':bool((eventFields.get('afterDigest') or {}).get('stringValue')),
                      'requestResultWritePathContract':str((resultFields.get('writePath') or {}).get('stringValue') or ''),
                      'hasCanonicalEntityId':bool(entity)})
              page=str(body.get('nextPageToken') or '')
              if not page:break
          else:
              raise RuntimeError('I66_OPS_READONLY_REQUEST_PAGINATION_LIMIT')
          print('I66_OPS_1604_WORKFLOW_REQUESTS='+json.dumps({'inspectedCount':reqCount,'windowMatches':len(window),'rows':window},sort_keys=True))
          print('I66_OPS_LIVE_IDENTITY_READONLY_COMPLETE; MUTATIONS=0')
          PY
      - name: I6.6 P0 Ops Leads Cloud Run error evidence read-only
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          SVC="$(gcloud functions describe orbit360OpsLeadsCommand --gen2 --region us-central1 --project "$PROJECT_ID" --format='value(serviceConfig.service)' | awk -F/ '{print $NF}')"
          test -n "$SVC"
          # Keep original entries in runner temp, never upload or print payloads with client data.
          if ! gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SVC\" AND timestamp>=\"2026-11-10T19:30:00Z\" AND timestamp<=\"2026-11-10T20:10:00Z\"" --project "$PROJECT_ID" --limit=500 --format=json > "$RUNNER_TEMP/i66-ops-runtime-logs.json" 2>"$RUNNER_TEMP/i66-ops-runtime-logs.err";then
            echo 'I66_OPS_CLOUD_LOG_READ=UNAVAILABLE; MUTATIONS=0'
            exit 0
          fi
          python3 - <<'PY'
          import collections,json,os
          rows=json.load(open(os.environ['RUNNER_TEMP']+'/i66-ops-runtime-logs.json'))
          status=collections.Counter()
          issue=collections.Counter()
          for row in rows:
              h=row.get('httpRequest') or {}
              if h.get('status') is not None:status[str(h.get('status'))]+=1
              s=str(row.get('textPayload') or row.get('jsonPayload') or '')
              if 'El registro no existe' in s:issue['CANONICAL_RECORD_NOT_FOUND']+=1
              if 'PERMISSION_DENIED' in s or 'permission-denied' in s:issue['PERMISSION_DENIED']+=1
              if 'not found' in s.lower() or 'not-found' in s.lower():issue['OTHER_NOT_FOUND_MARKER']+=1
          print('I66_OPS_CLOUD_LOG_INVENTORY='+json.dumps({'entryCount':len(rows),'httpStatusCounts':dict(status),'diagnosticCodeCounts':dict(issue)},sort_keys=True))
          print('I66_OPS_CLOUD_LOG_READONLY_COMPLETE; MUTATIONS=0')
          PY
