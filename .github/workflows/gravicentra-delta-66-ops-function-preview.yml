# I6.6 Carlos all-scope Preview callables, exact 0a541 artifact; no LIVE/Firestore business writes.
name: Gravicentra I6.6 Carlos Transversal Function Preview
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-delta-66-ops-function-preview.yml
      - artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json
permissions:
  contents: read
  actions: read
concurrency:
  group: gravicentra-i66-ops-p0-function-preview
  cancel-in-progress: false
jobs:
  stage-ops-preview:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROJECT_ID: ays-orbit-360-lab
      SOURCE_SHA: 0a54148547282b07536d5cc1c92854b023f23d71
      ARTIFACT_ID: '13977703391'
      ARTIFACT_DIGEST: sha256:000572953a2fd39e95b4efabb3975a485d61675d5a317adf7643e18d835c97e7
      ARTIFACT_RUN: '43293845272'
      EMULATOR_QA_RUN: '43293845340'
      PREVIEW_CHANNEL: gi-i66-rc-43293845272
      PREVIEW_URL: https://ays-orbit-360-lab--gi-i66-rc-43293845272-j4qucpnj.web.app
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d810b4d20569a18e90f4387928cf8816da88aa6a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source, immutable bundle and successful synthetic QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -z "$(git diff --name-only "$SOURCE_SHA" HEAD -- orbit360-platform functions firebase.json firestore.rules storage.rules)"
          node tools/gravicentra-i6-6-carlos-ops-tasks-transversal.test.cjs
          node tools/gravicentra-i6-6-ops-crud-role-country.test.cjs
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json'));
          const p=c.carlosPreviewAuthorization20261112||{};
          const targets=['orbit360OpsLeadsCommandPreview','orbit360ProductOperationalCommandPreview','orbit360ScopedPolicyReadPreview'];
          assert.equal(c.status,'CARLOS_TRANSVERSAL_FUNCTIONS_PREVIEW_AUTHORIZED');
          assert.equal(c.forbidBackendFunctionDeploy,false);assert.equal(c.backendFunctionPreviewOnly,true);
          assert.equal(c.forbidBackendLiveFunctionDeploy,true);assert.equal(c.livePromotionAuthorized,false);
          assert.equal(c.forbidFirestoreRulesDataAuthWrites,true);assert.equal(p.protectedSyntheticQaOnly,true);
          assert.equal(p.allowRealCustomerDataWrites,false);assert.equal(p.allowHostingLivePromotion,false);
          assert.equal(p.allowBackendLivePromotion,false);assert.equal(p.allowFirestoreRulesAuthIamChange,false);
          assert.deepEqual(p.targetFunctions,targets);assert.equal(p.targetRegion,'us-east1');
          assert.equal(p.sourceCommit,process.env.SOURCE_SHA);assert.equal(p.immutableBuildRunId,Number(process.env.ARTIFACT_RUN));
          assert.equal(p.immutableArtifactId,Number(process.env.ARTIFACT_ID));assert.equal(p.immutableArtifactZipDigest,process.env.ARTIFACT_DIGEST);
          assert.equal(p.hostingPreviewUrl,process.env.PREVIEW_URL);assert.equal(p.hostingPreviewChannel,process.env.PREVIEW_CHANNEL);
          console.log('I66_CARLOS_EXACT_THREE_PREVIEW_CALLABLES_AUTHORIZED_NO_LIVE_WRITES');
          NODE
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const h={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'GI-I66-Ops-P0'};
            const base='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const [q,b,a]=await Promise.all([
              fetch(base+'runs/'+process.env.EMULATOR_QA_RUN,{headers:h}).then(r=>r.json()),
              fetch(base+'runs/'+process.env.ARTIFACT_RUN,{headers:h}).then(r=>r.json()),
              fetch(base+'artifacts/'+process.env.ARTIFACT_ID,{headers:h}).then(r=>r.json())
            ]);
            assert.equal(q.conclusion,'success','OPS_EMULATOR_QA_HOLD');
            assert.equal(q.head_sha,process.env.SOURCE_SHA,'OPS_EMULATOR_QA_COMMIT_DRIFT');
            assert.equal(b.conclusion,'success','OPS_PACKAGE_NOT_GREEN');
            assert.equal(b.head_sha,process.env.SOURCE_SHA,'OPS_PACKAGE_SOURCE_DRIFT');
            assert.equal(a.digest,process.env.ARTIFACT_DIGEST,'OPS_ARTIFACT_DIGEST_DRIFT');
            assert.equal(a.workflow_run.id,Number(process.env.ARTIFACT_RUN),'OPS_ARTIFACT_RUN_DRIFT');
            assert.equal(a.expired,false,'OPS_ARTIFACT_EXPIRED');
          console.log('I66_CARLOS_SOURCE_EMULATOR_AND_ONE_ARTIFACT_PROOF_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13977703391
          run-id: 43293845272
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ops-package-downloaded
      - name: Verify one TAR and backend bytes; use original source only
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/ops-package-downloaded"
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz | wc -l)" -eq 1
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 | wc -l)" -eq 1
          TAR=$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz -print -quit)
          SUM=$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 -print -quit)
          test "$(dirname "$TAR")" = "$(dirname "$SUM")"
          test "$(sha256sum "$TAR" | awk '{print $1}')" = "$(awk '{print $1}' "$SUM")"
          mkdir -p "$RUNNER_TEMP/ops-immutable-packet"
          tar -xzf "$TAR" -C "$RUNNER_TEMP/ops-immutable-packet" --no-same-owner
          export OPS_PKT="$RUNNER_TEMP/ops-immutable-packet"
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const p=process.env.OPS_PKT+'/bundle/',marker=JSON.parse(fs.readFileSync(p+'site/__recovery__/build.json'));
          if(marker.sourceSha!==process.env.SOURCE_SHA||marker.gate!=='I6.6')throw Error('OPS_IMMUTABLE_MARKER_DRIFT');
          const backend=fs.readFileSync(p+'backend/product-ops-leads-domain.js');
          const source=execFileSync('git',['show',process.env.SOURCE_SHA+':functions/product-ops-leads-domain.js']);
          if(!backend.equals(source)||!fs.existsSync(p+'backend/index.js')||!fs.existsSync(p+'backend/package-lock.json'))
            throw Error('OPS_BACKEND_ARTIFACT_DRIFT');
          console.log('I66_OPS_EXACT_BACKEND_AND_MARKER_PASS build='+marker.buildId);
          NODE
      - name: Pick already configured LAB authority and pinned Firebase CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ops-preview-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ops-preview-auth'
          found=[]
          for i,key in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try: a=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError):continue
              if a.get('type')=='service_account' and a.get('project_id')=='ays-orbit-360-lab' and a.get('private_key'):
                  p=root/f'{i}.json';p.write_text(json.dumps(a));p.chmod(0o600);found.append(str(p))
          if not found: raise SystemExit('I66_OPS_PREVIEW_LAB_CREDENTIAL_NOT_CONFIGURED')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/ops-preview-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/ops-preview-cli"
          CLI="$RUNNER_TEMP/ops-preview-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          SEL=''
          while IFS= read -r c;do
            if GOOGLE_APPLICATION_CREDENTIALS="$c" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/ops-functions-before.json" 2>/dev/null;then SEL="$c";break;fi
          done < "$RUNNER_TEMP/ops-preview-auth/candidates"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/ops-preview-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/ops-preview-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ops-preview-auth/selected.json" >> "$GITHUB_ENV"
          echo "OPS_FIREBASE_CLI=$CLI" >> "$GITHUB_ENV"
      - name: Deploy only three existing Preview callables from immutable backend, never Hosting LIVE
        run: |
          set -euo pipefail
          FROOT="$RUNNER_TEMP/ops-preview-functions";mkdir -p "$FROOT"
          cp -a "$RUNNER_TEMP/ops-immutable-packet/bundle/backend" "$FROOT/backend"
          (cd "$FROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"backend"}}\n' > "$FROOT/firebase.json"
          node - <<'NODE'
          const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ops-functions-before.json'));
          const all=Array.isArray(x.result)?x.result:Array.isArray(x)?x:[];
          for(const name of ['orbit360OpsLeadsCommandPreview','orbit360ProductOperationalCommandPreview','orbit360ScopedPolicyReadPreview']){
            const found=all.filter(f=>String(f.entryPoint||f.id||f.name||'').split('/').pop()===name);
            if(found.length!==1)throw Error('I66_CARLOS_EXISTING_PREVIEW_FUNCTION_NOT_UNIQUE:'+name);
            const region=String(found[0].region||found[0].location||'us-east1');
            if(region!=='us-east1')throw Error('I66_CARLOS_PREVIEW_REGION_DRIFT:'+name);
          }
          console.log('I66_CARLOS_THREE_EXISTING_TARGETS_PRESENT_PREDEPLOY');
          NODE
          curl -fsSL --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/i66-carlos-live-lab-before.sha"
          curl -fsSL --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/i66-carlos-live-staff-before.sha"
          node "$OPS_FIREBASE_CLI" deploy --only functions:orbit360OpsLeadsCommandPreview,functions:orbit360ProductOperationalCommandPreview,functions:orbit360ScopedPolicyReadPreview --config "$FROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          for f in __recovery__/build.json core/router.js modules/ops.js modules/cronograma.js;do
            curl --fail --silent --show-error --retry 3 --max-time 30 "$PREVIEW_URL/$f" > "$RUNNER_TEMP/$(basename "$f").preview"
            cmp "$RUNNER_TEMP/ops-immutable-packet/bundle/site/$f" "$RUNNER_TEMP/$(basename "$f").preview"
          done
          node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/build.json.preview','utf8'));
          if(j.sourceSha!==process.env.SOURCE_SHA||j.gate!=='I6.6')throw Error('OPS_PREVIEW_HOSTING_EXACT_SOURCE_DRIFT');
          console.log('I66_CARLOS_EXISTING_HOSTING_PREVIEW_UNCHANGED_FOUR_EXACT_ASSETS_PASS');
          NODE
          node "$OPS_FIREBASE_CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/ops-functions-after.json"
          node - <<'NODE'
          const fs=require('node:fs'),j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ops-functions-after.json'));
          const arr=Array.isArray(j.result)?j.result:Array.isArray(j)?j:[];
          const prior=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ops-functions-before.json'));
          const before=Array.isArray(prior.result)?prior.result:Array.isArray(prior)?prior:[];
          const names=x=>x.map(r=>String(r.entryPoint||r.id||r.name||'').split('/').pop()).sort();
          if(JSON.stringify(names(arr))!==JSON.stringify(names(before)))throw Error('I66_CARLOS_OTHER_FUNCTION_INVENTORY_CHANGED');
          for(const name of ['orbit360OpsLeadsCommandPreview','orbit360ProductOperationalCommandPreview','orbit360ScopedPolicyReadPreview']){
            const found=arr.filter(f=>String(f.entryPoint||f.id||f.name||'').split('/').pop()===name);
            if(found.length!==1)throw Error('I66_CARLOS_PREVIEW_FUNCTION_READBACK_MISSING:'+name);
          }
          console.log('I66_CARLOS_THREE_EXACT_PREVIEW_CALLABLES_READBACK_PASS');
          console.log('I66_CARLOS_LIVE_BACKEND_DEPLOYS=0; CUSTOMER_DATA_WRITES=0');
          NODE
          curl -fsSL --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/i66-carlos-live-lab-after.sha"
          curl -fsSL --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/i66-carlos-live-staff-after.sha"
          cmp "$RUNNER_TEMP/i66-carlos-live-lab-before.sha" "$RUNNER_TEMP/i66-carlos-live-lab-after.sha"
          cmp "$RUNNER_TEMP/i66-carlos-live-staff-before.sha" "$RUNNER_TEMP/i66-carlos-live-staff-after.sha"
          echo 'I66_CARLOS_BOTH_LIVE_HOSTING_ORIGINS_UNCHANGED_PASS'

