name: Gravicentra B4-003 Owner LIVE Readback Rootfix Bytes

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-integrate-institutional-goals-20261029.yml'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-owner-live-readback-rootfix-bytes
  cancel-in-progress: false

jobs:
  preserve-owner-live-readback-rootfix-bytes:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'exec(i6.5 B4-003): preserve owner LIVE readback rootfix bytes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORKFLOW_PATH: .github/workflows/gravicentra-b4-003-cumulative-safe-read-preview-20261029.yml
      PREPARED_PATH: artifacts/orbit360-recovery/release-control/I6_5_B4_003_OWNER_LIVE_READBACK_ROOTFIX_WORKFLOW_20261029.yml
      RECEIPT_PATH: artifacts/orbit360-recovery/release-control/I6_5_B4_003_OWNER_LIVE_READBACK_ROOTFIX_20261029.json
      EXPECTED_BEFORE: b27daac122c7aadc5ab00f1c384217be400ff15e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare and validate exact workflow bytes
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          PARENT=$(git rev-parse HEAD)
          test "$PARENT" = "$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$(git show -s --format=%s HEAD)" = 'exec(i6.5 B4-003): preserve owner LIVE readback rootfix bytes'
          test "$(git hash-object "$WORKFLOW_PATH")" = "$EXPECTED_BEFORE"
          test "$(git hash-object orbit360-platform/modules/equipo.js)" = '5ce317a0641709e1a405e61435578de934fa194d'
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          python3 tools/gravicentra-b4-003-owner-live-readback-rootfix-20261029.py > "$RUNNER_TEMP/rootfix.json"
          AFTER=$(git hash-object "$WORKFLOW_PATH")
          test "$AFTER" != "$EXPECTED_BEFORE"
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0]); puts 'YAML_PASS'" "$WORKFLOW_PATH"
          export AFTER PARENT
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path(os.environ['WORKFLOW_PATH']).read_text(encoding='utf8')
          blocks=[];pos=0
          marker="<<'NODE'\n"
          while True:
              i=s.find(marker,pos)
              if i<0: break
              start=i+len(marker)
              end=s.find('\n          NODE',start)
              if end<0: raise SystemExit('UNTERMINATED_NODE_HEREDOC')
              lines=s[start:end].splitlines()
              js='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
              p=Path(os.environ['RUNNER_TEMP'])/f'workflow-node-{len(blocks)+1}.js'
              p.write_text(js,encoding='utf8');blocks.append(p);pos=end+1
          if len(blocks)<5: raise SystemExit('EXPECTED_NODE_BLOCKS_MISSING')
          Path(os.environ['RUNNER_TEMP']+'/node-blocks.list').write_text('\n'.join(map(str,blocks))+'\n')
          PY
          while IFS= read -r js; do node --check "$js"; done < "$RUNNER_TEMP/node-blocks.list"
          grep -q "const source=productCommit;" "$WORKFLOW_PATH"
          grep -q "gi-owner-build-before.json" "$WORKFLOW_PATH"
          grep -q "OWNER_ROOT_STRUCTURAL_IDENTITY_CHANGED" "$WORKFLOW_PATH"
          grep -q "gi-b4003-live-identity-readback" "$WORKFLOW_PATH"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/prepared-workflow.yml"
          git reset --hard "$PARENT"
          mkdir -p "$(dirname "$PREPARED_PATH")"
          cp "$RUNNER_TEMP/prepared-workflow.yml" "$PREPARED_PATH"
          test "$(git hash-object "$PREPARED_PATH")" = "$AFTER"
          python3 - <<'PY'
          import json,os,pathlib
          receipt={
            'schema':'GRAVICENTRA_I65_B4003_OWNER_LIVE_READBACK_ROOTFIX_V1',
            'gate':'I6.5/B4-003','status':'WORKFLOW_BYTES_PREPARED_YAML_AND_NODE_PASS',
            'repository':'paulaosoriof86/orbit360-core','branch':os.environ['GITHUB_REF_NAME'],
            'parentHead':os.environ['PARENT'],'workflowPath':os.environ['WORKFLOW_PATH'],
            'beforeBlob':os.environ['EXPECTED_BEFORE'],'afterBlob':os.environ['AFTER'],
            'preparedPath':os.environ['PREPARED_PATH'],
            'cause':'CUSTOM_OWNER_ROOT_RAW_HTML_VARIED_WHILE_PREVIEW_AND_LAB_LIVE_BYTES_MATCHED',
            'remediation':'KEEP_EXACT_LAB_LIVE_ROOT_AND_BUILD_COMPARISON; REQUIRE_OWNER_BUILD_RUNTIME_AND_STRUCTURAL_ROOT_IDENTITY',
            'sourceAnchor':'LAST_COMMIT_TOUCHING_ORBIT360_PLATFORM_MODULES_EQUIPO_JS',
            'boundaries':{'productSourceChanged':False,'livePromotion':False,'dataWrites':False,'rulesAuthIamChanges':False,'externalMessages':False,'securityB4003StillHold':True,'acceptanceGranted':False}
          }
          pathlib.Path(os.environ['RECEIPT_PATH']).write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf8')
          PY
          git config user.name gravicentra-release-bot
          git config user.email gravicentra-release-bot@users.noreply.github.com
          git add "$PREPARED_PATH" "$RECEIPT_PATH"
          test "$(git diff --cached --name-only | sort | wc -l)" = '2'
          git commit -m 'prep(i6.5 B4-003): preserve owner LIVE readback rootfix workflow bytes'
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$PARENT"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf '%s\n' \
            "Owner LIVE readback workflow blob: $AFTER" \
            'YAML and all embedded Node blocks: PASS' \
            'No product, LIVE, data, Rules, Auth/IAM or external messages.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve patcher diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-owner-live-readback-rootfix-${{ github.run_id }}
          path: ${{ runner.temp }}/rootfix.json
          if-no-files-found: warn
          retention-days: 7
