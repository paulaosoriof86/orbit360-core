name: Gravicentra B4-003 Owner Root Structural Identity Rootfix

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - '.github/workflows/gravicentra-b4-003-integrate-institutional-goals-20261029.yml'
      - 'tools/gravicentra-b4-003-owner-root-structural-identity-rootfix-20261030.py'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-owner-root-structural-identity-rootfix
  cancel-in-progress: false

jobs:
  apply-transport-rootfix:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'exec(i6.5 B4-003): apply owner root structural identity rootfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORKFLOW_PATH: .github/workflows/gravicentra-b4-003-cumulative-safe-read-preview-20261029.yml
      PATCHER_PATH: tools/gravicentra-b4-003-owner-root-structural-identity-rootfix-20261030.py
      EXPECTED_BEFORE: 086147a8e66b0b8e25b39449599304db52c411ad
      EXPECTED_PRODUCT: 5ce317a0641709e1a405e61435578de934fa194d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded transport-only correction and trigger exact Preview
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          PARENT=$(git rev-parse HEAD)
          test "$PARENT" = "$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$(git show -s --format=%s HEAD)" = 'exec(i6.5 B4-003): apply owner root structural identity rootfix'
          test "$(git hash-object "$WORKFLOW_PATH")" = "$EXPECTED_BEFORE"
          test "$(git hash-object orbit360-platform/modules/equipo.js)" = "$EXPECTED_PRODUCT"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          python3 "$PATCHER_PATH" "$WORKFLOW_PATH" > "$RUNNER_TEMP/rootfix.json"
          AFTER=$(git hash-object "$WORKFLOW_PATH")
          test "$AFTER" != "$EXPECTED_BEFORE"
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0]); puts 'YAML_PASS'" "$WORKFLOW_PATH"
          export AFTER PARENT
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path(os.environ['WORKFLOW_PATH']).read_text(encoding='utf8')
          blocks=[];pos=0;marker="<<'NODE'\n"
          while True:
              i=s.find(marker,pos)
              if i<0: break
              start=i+len(marker);end=s.find('\n          NODE',start)
              if end<0: raise SystemExit('UNTERMINATED_NODE_HEREDOC')
              lines=s[start:end].splitlines()
              js='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
              p=Path(os.environ['RUNNER_TEMP'])/f'workflow-node-{len(blocks)+1}.js'
              p.write_text(js,encoding='utf8');blocks.append(p);pos=end+1
          if len(blocks)<5: raise SystemExit('EXPECTED_NODE_BLOCKS_MISSING')
          Path(os.environ['RUNNER_TEMP']+'/node-blocks.list').write_text('\n'.join(map(str,blocks))+'\n')
          PY
          while IFS= read -r js; do node --check "$js"; done < "$RUNNER_TEMP/node-blocks.list"
          ! grep -q 'OWNER_ROOT_STABLE_IDENTITY_MISSING' "$WORKFLOW_PATH"
          grep -q 'OWNER_ROOT_STRUCTURAL_IDENTITY_MISSING' "$WORKFLOW_PATH"
          grep -q "Buffer.byteLength(html,'utf8')>=512" "$WORKFLOW_PATH"
          test "$(git diff --name-only | sort)" = "$WORKFLOW_PATH"
          git config user.name gravicentra-release-bot
          git config user.email gravicentra-release-bot@users.noreply.github.com
          git add "$WORKFLOW_PATH"
          test "$(git diff --cached --name-only)" = "$WORKFLOW_PATH"
          git commit -m 'build(i6.5 B4-003): trigger cumulative safe-read isolated Preview only'
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$PARENT"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf '%s\n' "Transport rootfix blob: $AFTER" 'YAML and embedded Node blocks: PASS' 'Same institutional-goals source will be rebuilt; no product, LIVE, data, Rules or Auth/IAM changes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve rootfix diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-owner-root-structural-rootfix-${{ github.run_id }}
          path: ${{ runner.temp }}/rootfix.json
          if-no-files-found: warn
          retention-days: 7
