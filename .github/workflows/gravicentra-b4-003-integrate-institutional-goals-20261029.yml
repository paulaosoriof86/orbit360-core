# One-time transport retained only as immutable trace; the exact Preview receipt is already bound in Control Plane.
name: Gravicentra B4-003 Institutional Goals Exact Preview Freeze

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - '.github/workflows/gravicentra-b4-003-integrate-institutional-goals-20261029.yml'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-institutional-goals-preview-freeze
  cancel-in-progress: false

jobs:
  freeze-exact-preview:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'freeze(i6.5 B4-003): bind institutional goals exact Preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      GUARD: tools/gravicentra-i6-control-plane-guard-v1.mjs
      RECEIPT: artifacts/orbit360-recovery/release-control/I6_5_B4_003_INSTITUTIONAL_GOALS_EXACT_PREVIEW_PASS_20261030.json
      FREEZER: tools/gravicentra-b4-003-freeze-institutional-preview-20261030.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact Preview receipt and bind authority
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          HEAD_NOW=$(git rev-parse HEAD)
          test "$HEAD_NOW" = "$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$(git show -s --format=%s HEAD)" = 'freeze(i6.5 B4-003): bind institutional goals exact Preview'
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node "$FREEZER"
          git add "$CONTROL" "$GUARD" "$RECEIPT"
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' "$CONTROL" "$GUARD" "$RECEIPT" | sort)"
          git config user.name gravicentra-release-bot
          git config user.email gravicentra-release-bot@users.noreply.github.com
          git commit -m 'freeze(i6.5 B4-003): bind institutional goals exact Preview receipt'
          PARENT=$(git rev-parse HEAD^)
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$PARENT"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf '%s\n' 'Institutional goals exact Preview receipt: PASS' 'No rebuild, LIVE promotion, data, Rules, Auth or IAM changes.' >> "$GITHUB_STEP_SUMMARY"
