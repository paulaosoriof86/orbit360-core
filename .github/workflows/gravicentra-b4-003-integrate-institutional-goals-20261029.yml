name: Gravicentra B4-003 Institutional Preview Transport Preparer

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-integrate-institutional-goals-20261029.yml'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-institutional-preview-preparer
  cancel-in-progress: false

jobs:
  prepare-existing-preview-transport:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'exec(i6.5 B4-003): prepare institutional Preview transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source successor and clean transport parent
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$(git show -s --format=%s HEAD)" = 'exec(i6.5 B4-003): prepare institutional Preview transport'
          test -f tools/gravicentra-b4-003-prepare-institutional-preview-20261029.py
          test "$(git hash-object orbit360-platform/modules/equipo.js)" = '5ce317a0641709e1a405e61435578de934fa194d'
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          git diff --exit-code
          git diff --cached --exit-code

      - name: Patch only the existing cumulative Preview workflow
        run: |
          set -euo pipefail
          python3 tools/gravicentra-b4-003-prepare-institutional-preview-20261029.py | tee "$RUNNER_TEMP/institutional-preview-transport.json"
          test "$(git show -s --format=%s HEAD)" = 'build(i6.5 B4-003): trigger cumulative safe-read isolated Preview only'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/gravicentra-b4-003-cumulative-safe-read-preview-20261029.yml'

      - name: Publish transport-only fast-forward commit
        run: |
          set -euo pipefail
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf '%s\n' \
            'Existing cumulative Preview workflow updated for the institutional-goals successor.' \
            'Transport commit changes one workflow only; no product, data, Rules, Auth/IAM or LIVE.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve preparer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-institutional-preview-preparer-${{ github.run_id }}
          path: ${{ runner.temp }}/institutional-preview-transport.json
          if-no-files-found: warn
          retention-days: 7
