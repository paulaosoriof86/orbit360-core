name: Gravicentra B4-003 Institutional Preview Workflow Bytes

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-integrate-institutional-goals-20261029.yml'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-institutional-preview-bytes
  cancel-in-progress: false

jobs:
  preserve-corrected-workflow-bytes:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'exec(i6.5 B4-003): preserve corrected institutional Preview workflow bytes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREPARED_PATH: artifacts/orbit360-recovery/release-control/I6_5_B4_003_INSTITUTIONAL_GOALS_PREVIEW_WORKFLOW_20261029.yml
      WORKFLOW_PATH: .github/workflows/gravicentra-b4-003-cumulative-safe-read-preview-20261029.yml
      EXPECTED_BLOB: b27daac122c7aadc5ab00f1c384217be400ff15e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and repair exact one-workflow transport bytes
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          PARENT=$(git rev-parse HEAD)
          test "$PARENT" = "$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$(git show -s --format=%s HEAD)" = 'exec(i6.5 B4-003): preserve corrected institutional Preview workflow bytes'
          test "$(git hash-object orbit360-platform/modules/equipo.js)" = '5ce317a0641709e1a405e61435578de934fa194d'
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          python3 tools/gravicentra-b4-003-prepare-institutional-preview-20261029.py > "$RUNNER_TEMP/preparer.json"
          test "$(git show -s --format=%s HEAD)" = 'build(i6.5 B4-003): trigger cumulative safe-read isolated Preview only'
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['WORKFLOW_PATH'])
          b=p.read_bytes()
          b=b.replace(b"split(/\r?\n/)",b"split(/\\r?\\n/)")
          b=b.replace(b"fs.appendFileSync(process.env.GITHUB_ENV,'EXACT_SOURCE_SHA='+source+'\n');",b"fs.appendFileSync(process.env.GITHUB_ENV,'EXACT_SOURCE_SHA='+source+'\\n');")
          b=b.replace(b"fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-authorized-source.sha',source+'\n');",b"fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-authorized-source.sha',source+'\\n');")
          old=(b"          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,\n"
               b"           'Preview authority: CONTROL_PLANE.b4003InstitutionalGoalsSourceSuccessor20261029\n'+\n"
               b"           'Product commit: '+productCommit+'\nSource to build: '+source+'\nTransport-only commit: '+process.env.TRANSPORT_SHA+'\n');")
          new=(b"          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,\n"
               b"           'Preview authority: CONTROL_PLANE.b4003InstitutionalGoalsSourceSuccessor20261029\\n'+\n"
               b"           'Product commit: '+productCommit+'\\nSource to build: '+source+'\\nTransport-only commit: '+process.env.TRANSPORT_SHA+'\\n');")
          if old not in b: raise SystemExit('CORRUPTED_SUMMARY_BLOCK_NOT_FOUND')
          b=b.replace(old,new,1)
          p.write_bytes(b)
          if b.count(b'\r')!=0: raise SystemExit('CARRIAGE_RETURN_REMAINS')
          PY
          test "$(git hash-object "$WORKFLOW_PATH")" = "$EXPECTED_BLOB"
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0]); puts 'YAML_PASS'" "$WORKFLOW_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=Path(os.environ['WORKFLOW_PATH']).read_text(encoding='utf8')
          start=s.index("          node - <<'NODE'")+len("          node - <<'NODE'\n")
          end=s.index("          NODE\n",start)
          lines=s[start:end].splitlines()
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path(os.environ['RUNNER_TEMP']+'/institutional-preview-authority.js').write_text(js,encoding='utf8')
          PY
          node --check "$RUNNER_TEMP/institutional-preview-authority.js"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/prepared-workflow.yml"
          git reset --hard "$PARENT"
          mkdir -p "$(dirname "$PREPARED_PATH")"
          cp "$RUNNER_TEMP/prepared-workflow.yml" "$PREPARED_PATH"
          test "$(git hash-object "$PREPARED_PATH")" = "$EXPECTED_BLOB"
          git config user.name gravicentra-release-bot
          git config user.email gravicentra-release-bot@users.noreply.github.com
          git add "$PREPARED_PATH"
          test "$(git diff --cached --name-only)" = "$PREPARED_PATH"
          git commit -m 'prep(i6.5 B4-003): preserve corrected institutional Preview workflow bytes'
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$PARENT"
          git push origin "HEAD:$GITHUB_REF_NAME"
          printf '%s\n' \
            "Prepared workflow blob: $EXPECTED_BLOB" \
            'YAML and embedded Node syntax: PASS' \
            'Repository write: evidence path only; no product, data, Rules, Auth/IAM or LIVE.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-institutional-preview-bytes-${{ github.run_id }}
          path: ${{ runner.temp }}/preparer.json
          if-no-files-found: warn
          retention-days: 7
