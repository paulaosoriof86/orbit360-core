name: Gravicentra B3-008 Exact Preview

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'

permissions:
  contents: write

concurrency:
  group: gravicentra-b3-008-${{ github.ref }}
  cancel-in-progress: false

jobs:
  b3-008-exact-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      HOSTING_SITE: ays-orbit-360-lab
      CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      B3_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B3_EXECUTION_LOCK_20260929.json
      FINDINGS: artifacts/orbit360-recovery/release-control/I6_FINDINGS_LEDGER_20260924.json
      COMPOSITION: artifacts/orbit360-recovery/release-control/I6_CANONICAL_ACCUMULATIVE_COMPOSITION_LOCK_20260924.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact B3-008 candidate head
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          CANDIDATE_SOURCE_SHA=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$CANDIDATE_SOURCE_SHA" = "$REMOTE"
          echo "CANDIDATE_SOURCE_SHA=$CANDIDATE_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Gate exact B3-008 Preview
        id: gate
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const l=JSON.parse(fs.readFileSync(process.env.B3_LOCK,'utf8'));
          const ok=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B3_008_CONTRACT_AND_EXACT_PREVIEW'
            && c.currentB3?.status==='B3_008_SOURCE_FIXED_PENDING_CONTRACT_AND_EXACT_PREVIEW'
            && c.i65ForensicRemediationPlan?.b3?.status==='B3_008_SOURCE_FIXED_PENDING_CONTRACT_AND_EXACT_PREVIEW'
            && l.status==='B3_008_SOURCE_FIXED_PENDING_CONTRACT_AND_EXACT_PREVIEW'
            && l.activeFinding?.id==='B3-008'
            && l.activeFinding?.boundaries?.businessWritesAuthorized===false
            && l.activeFinding?.boundaries?.reimportAuthorized===false
            && l.activeFinding?.boundaries?.liveHostingPromotionAuthorized===false;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(ok?'true':'false')+'\n');
          console.log('B3_008_PREVIEW_MODE='+(ok?'RUN':'NOOP'));
          NODE

      - name: Assert LIVE unchanged
        if: steps.gate.outputs.run == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: Validate B3-008 contract and syntax
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/queries.js
          node --check orbit360-platform/modules/cliente360.js
          node --check orbit360-platform/modules/inicio.js
          node --check orbit360-platform/modules/cobros.js
          node --check orbit360-platform/modules/polizas.js
          node --check orbit360-platform/core/router.js
          node --check tools/gravicentra-i6-5-b3-008-contract.mjs
          node --check tools/gravicentra-i6-5-b3-008-preview-proof.mjs
          node tools/gravicentra-i6-5-b3-008-contract.mjs

      - name: Prepare Firebase and browser dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b3-008-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json'
                  p.write_text(json.dumps(d))
                  p.chmod(0o600)
                  rows.append(str(p))
          if not rows:raise SystemExit('B3_008_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          CROOT="$RUNNER_TEMP/b3-008-firebase-cli"
          npm install --prefix "$CROOT" --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CROOT"
          CLI="$CROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          SEL=''
          while read -r F; do
            if GOOGLE_APPLICATION_CREDENTIALS="$F" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              SEL="$F"
              break
            fi
          done < "$ROOT/files"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/b3-008-sa.json"
          chmod 600 "$RUNNER_TEMP/b3-008-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/b3-008-sa.json" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Resolve public web config
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps-b3-008.json"
          export APPS="$RUNNER_TEMP/apps-b3-008.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['APPS']))
          a=d.get('result') if isinstance(d,dict) else None
          web=[x for x in (a or []) if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1:raise SystemExit('B3_008_WEB_APP_CARDINALITY:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config-b3-008.json"
          echo "PUBLIC_CONFIG_FILE=$RUNNER_TEMP/public-config-b3-008.json" >> "$GITHUB_ENV"

      - name: Materialize immutable B3-008 package
        if: steps.gate.outputs.run == 'true'
        id: build
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/b3-008-branding-snapshot.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/b3-008-branding-snapshot.json"
          export SOURCE_SHA="$CANDIDATE_SOURCE_SHA"
          export RELEASE_GATE="I6.5-B3-008"
          export BUILD_PREFIX="gi-i65-b3"
          export ENVIRONMENT_REF="firebase-hosting-preview-i6-5-forensic-b3-008"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/b3-008-package" "$PUBLIC_CONFIG_FILE" > "$RUNNER_TEMP/b3-008-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/b3-008-package-output.json'));
          for(const [k,v] of Object.entries({build_id:d.buildId,hosted_payload_digest:d.hostedPayloadDigest,backend_source_digest:d.backendSourceDigest,bundle_digest:d.bundleDigest}))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\n');
          NODE

      - name: Deploy exact package to isolated Preview
        if: steps.gate.outputs.run == 'true'
        id: preview
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/b3-008-package/bundle"
          CHANNEL_ID="gi-b3008-$GITHUB_RUN_ID"
          deploy_channel() {
            set +e
            node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/b3-008-preview.json" 2>&1
            RC=$?
            set -e
            cat "$RUNNER_TEMP/b3-008-preview.json"
            return "$RC"
          }
          if ! deploy_channel; then
            if grep -Fq "channel quota reached" "$RUNNER_TEMP/b3-008-preview.json"; then
              node "$GITHUB_WORKSPACE/tools/gravicentra-preview-channel-gc.mjs" "$FIREBASE_CLI_BIN" "$PROJECT_ID" "$CHANNEL_ID" "$GITHUB_WORKSPACE" "gi-"
              deploy_channel
            else
              exit 1
            fi
          fi
          export DEPLOY="$RUNNER_TEMP/b3-008-preview.json"
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['DEPLOY']).read()
          prod='https://'+os.environ['HOSTING_SITE']+'.web.app'
          urls=[u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.rstrip('/')!=prod]
          if not urls:raise SystemExit('B3_008_PREVIEW_URL_NOT_FOUND')
          print(urls[-1])
          PY
          )
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Exact Hosting Preview readback
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/b3-008-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/')
          for attempt in range(1,9):
              bad=[]
              for want,rel in rows:
                  try:
                      req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?b3008='+str(attempt)+'-'+str(int(time.time())),headers={'Accept-Encoding':'identity','Cache-Control':'no-cache, no-store'})
                      with urllib.request.urlopen(req,timeout=30) as z:got=hashlib.sha256(z.read()).hexdigest()
                  except Exception as e:got=type(e).__name__
                  if got!=want:bad.append(rel)
              with urllib.request.urlopen(base+'/__recovery__/build.json?b3008='+str(time.time()),timeout=30) as z:marker=json.loads(z.read())
              if not bad and marker.get('sourceSha')==os.environ['CANDIDATE_SOURCE_SHA'] and marker.get('buildId')==os.environ['EXPECTED_BUILD_ID']:break
              if attempt==8:raise SystemExit('B3_008_READBACK:'+str(bad[:5])+':'+str(marker))
              time.sleep(3)
          print('B3_008_HOSTING_READBACK=PASS')
          PY

      - name: Cleanup known B3-004 synthetic human fixture
        if: steps.gate.outputs.run == 'true'
        env:
          B3_004_HUMAN_FIXTURE_MODE: cleanup
          B3_004_HUMAN_FIXTURE_OUT: ${{ runner.temp }}/b3-004-human-fixture-cleanup.json
          B3_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b3-004-human-fixture.mjs
          node -e "const x=require(process.env.B3_004_HUMAN_FIXTURE_OUT);if(x.status!=='CLEANED')process.exit(1);console.log('B3_004_SYNTHETIC_FIXTURE_CLEANUP=PASS')"

      - name: Read-only browser reality proof
        if: steps.gate.outputs.run == 'true'
        env:
          B3_008_PROOF_OUT: ${{ runner.temp }}/b3-008-preview-proof.json
          B3_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b3-008-preview-proof.mjs
          node -e "const x=require(process.env.B3_008_PROOF_OUT);const a=x.assertions||{};if(x.status!=='PASS'||a.monthlyProductionIndependent!==true||a.financialRealityIndependent!==true||a.noSyntheticMetaPct!==true||a.advisorMissingMetaFailClosed!==true||a.metaSchemaAligned!==true||a.countryScope!==true||a.clientListPerformance!==true||a.client360CountryKpis!==true||a.client360GTCountryKpis!==true||a.client360InternalCountryKpis!==true||a.clientCountryPartition!==true||a.kpiDetailSurfaces!==true||a.cobrosCorePerformance!==true||a.cobrosCountSemantics!==true||a.cobrosSmallAmountClarity!==true||a.cobrosCountryCountPartition!==true||a.policyCurrencyAuthority!==true||a.deepReceiptCalendarAuditCollected!==true||a.deepPremiumRulesAuditCollected!==true||a.inicioCanonicalDetailOwner!==true||a.sigaDirectIncluded!==true||a.polizasCountryScope!==true||a.healthStable!==true||a.healthIndependentRealClient!==true||a.b3007SyntheticResidueAbsent!==true||a.cronogramaPerformance!==true||a.b3004SyntheticFixtureAbsent!==true||x.operationalBusinessWrites!==0)process.exit(1);console.log('B3_008_R2_PREVIEW_MACHINE_PROOF=PASS')"

      - name: Upload immutable package and proof
        if: steps.gate.outputs.run == 'true'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-b3-008-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b3-008-package
            ${{ runner.temp }}/b3-008-preview-proof.json
            ${{ runner.temp }}/b3-004-human-fixture-cleanup.json
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Freeze B3-008 machine pass pending targeted visual
        if: steps.gate.outputs.run == 'true'
        env:
          B3_BUILD_ID: ${{ steps.build.outputs.build_id }}
          B3_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          B3_CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
          B3_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          B3_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          B3_PROOF: ${{ runner.temp }}/b3-008-preview-proof.json
        run: |
          set -euo pipefail
          RECEIPT="artifacts/orbit360-recovery/release-control/I6_5_B3_008_MACHINE_PASS_PENDING_TARGETED_VISUAL_20261002.json"
          export RECEIPT
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$CANDIDATE_SOURCE_SHA"
          node - <<'NODE'
          const fs=require('node:fs'),p=JSON.parse(fs.readFileSync(process.env.B3_PROOF,'utf8'));
          if(p.status!=='PASS'||p.operationalBusinessWrites!==0)throw Error('B3_008_PROOF_NOT_PASS');
          const rr={schema:'GRAVICENTRA_I6_5_B3_008_MACHINE_PASS_PENDING_TARGETED_VISUAL_V2',recordedAt:new Date().toISOString(),status:'MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',findingId:'B3-008',sourceSha:process.env.CANDIDATE_SOURCE_SHA,buildId:process.env.B3_BUILD_ID,previewUrl:process.env.B3_PREVIEW_URL,channelId:process.env.B3_CHANNEL_ID,runId:Number(process.env.GITHUB_RUN_ID),artifactId:Number(process.env.B3_ARTIFACT_ID),artifactDigest:process.env.B3_ARTIFACT_DIGEST||'',exactHostingReadback:true,assertions:p.assertions,performance:p.performance,countries:p.countries,health:p.health,b3007:p.b3007,pageErrors:p.pageErrors,consoleErrors:p.consoleErrors,operationalBusinessWrites:0,dataWrites:false,reimport:false,livePromoted:false,nextAction:'B3_008_TARGETED_PAULA_VISUAL_WITH_B3_007_CRONOGRAMA'};
          fs.writeFileSync(process.env.RECEIPT,JSON.stringify(rr,null,2)+'\n');
          NODE
          RECEIPT_BLOB=$(git hash-object "$RECEIPT"); export RECEIPT_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.COMPOSITION,o=JSON.parse(fs.readFileSync(p,'utf8'));
          o.activeFindingId='B3-008';
          o.b3008MachinePass={status:'MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',path:process.env.RECEIPT,blobSha:process.env.RECEIPT_BLOB,sourceSha:process.env.CANDIDATE_SOURCE_SHA,buildId:process.env.B3_BUILD_ID,previewUrl:process.env.B3_PREVIEW_URL,runId:Number(process.env.GITHUB_RUN_ID),artifactId:Number(process.env.B3_ARTIFACT_ID),artifactDigest:process.env.B3_ARTIFACT_DIGEST||'',productSourceChanged:true,operationalBusinessWrites:0};
          fs.writeFileSync(p,JSON.stringify(o,null,2)+'\n');
          NODE
          COMPOSITION_BLOB=$(git hash-object "$COMPOSITION"); export COMPOSITION_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.FINDINGS,o=JSON.parse(fs.readFileSync(p,'utf8')),f=(o.findings||[]).find(x=>x.id==='B3-008');if(!f)throw Error('B3_008_MISSING');
          Object.assign(f,{status:'MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',blocking:true,nextAction:'B3_008_TARGETED_PAULA_VISUAL',machineProofReceiptPath:process.env.RECEIPT,machineProofReceiptBlobSha:process.env.RECEIPT_BLOB,currentCandidateEligibleForPromotion:false,productMutationAuthorized:false,dataMutationAuthorized:false,reimportAuthorized:false,livePromotionAuthorized:false});
          o.currentB3={...(o.currentB3||{}),status:'B3_008_MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',activeFindingId:'B3-008',compositionLockBlobSha:process.env.COMPOSITION_BLOB,noLive:true,noReimport:true};
          fs.writeFileSync(p,JSON.stringify(o,null,2)+'\n');
          NODE
          FINDINGS_BLOB=$(git hash-object "$FINDINGS"); export FINDINGS_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.B3_LOCK,o=JSON.parse(fs.readFileSync(p,'utf8'));
          o.status='B3_008_MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL';
          o.activeFinding={...(o.activeFinding||{}),id:'B3-008',status:'MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',blocking:true,boundaries:{businessWritesAuthorized:false,configWritesAuthorized:false,reimportAuthorized:false,liveHostingPromotionAuthorized:false,productMutationAuthorized:false},nextAction:'B3_008_TARGETED_PAULA_VISUAL',machineProofReceiptPath:process.env.RECEIPT,machineProofReceiptBlobSha:process.env.RECEIPT_BLOB};
          o.nextRequiredProof=['B3_008_TARGETED_PAULA_VISUAL_ACCEPTANCE'];o.compositionLock={...(o.compositionLock||{}),blobSha:process.env.COMPOSITION_BLOB};o.findingLedger={...(o.findingLedger||{}),blobSha:process.env.FINDINGS_BLOB};
          fs.writeFileSync(p,JSON.stringify(o,null,2)+'\n');
          NODE
          LOCK_BLOB=$(git hash-object "$B3_LOCK"); export LOCK_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.CONTROL,o=JSON.parse(fs.readFileSync(p,'utf8')),b=o.i65ForensicRemediationPlan.b3;
          Object.assign(b,{status:'B3_008_MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',activeFindingId:'B3-008',executionLockBlobSha:process.env.LOCK_BLOB,findingLedgerBlobSha:process.env.FINDINGS_BLOB,compositionLockBlobSha:process.env.COMPOSITION_BLOB,sourceSha:process.env.CANDIDATE_SOURCE_SHA,buildId:process.env.B3_BUILD_ID,previewUrl:process.env.B3_PREVIEW_URL,runId:Number(process.env.GITHUB_RUN_ID),artifactId:Number(process.env.B3_ARTIFACT_ID),artifactDigest:process.env.B3_ARTIFACT_DIGEST||'',exactReadback:true,contractPass:true,previewProofPass:true,productMutationAuthorized:false,dataMutationAuthorized:false,reimportAuthorized:false,candidateEligibleForPromotion:false,livePromoted:false,machineProofReceiptPath:process.env.RECEIPT,machineProofReceiptBlobSha:process.env.RECEIPT_BLOB,nextAction:'B3_008_TARGETED_PAULA_VISUAL'});
          o.currentB3={...(o.currentB3||{}),status:'B3_008_MACHINE_PASS_PENDING_TARGETED_PAULA_VISUAL',activeFindingId:'B3-008',compositionLockBlobSha:process.env.COMPOSITION_BLOB,findingLedgerBlobSha:process.env.FINDINGS_BLOB,executionLockBlobSha:process.env.LOCK_BLOB,noLive:true,noReimport:true};
          o.nextAction='I6_5_FORENSIC_REMEDIATION_B3_008_VISUAL';
          o.canonicalAccumulationControl={...(o.canonicalAccumulationControl||{}),compositionLockBlobSha:process.env.COMPOSITION_BLOB,findingLedgerBlobSha:process.env.FINDINGS_BLOB,nextAction:'B3_008_TARGETED_PAULA_VISUAL'};
          fs.writeFileSync(p,JSON.stringify(o,null,2)+'\n');
          NODE
          git add "$RECEIPT" "$COMPOSITION" "$FINDINGS" "$B3_LOCK" "$CONTROL"
          git config user.name gravicentra-recovery-bot
          git config user.email gravicentra-recovery-bot@users.noreply.github.com
          git commit -m "pass(i6.5 B3-008): exact reality Preview pending targeted visual"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Fail closed
        if: failure() && steps.gate.outputs.run == 'true'
        run: echo "B3_008_FAILED_NO_OPERATIONAL_WRITES_NO_REIMPORT_NO_LIVE"
