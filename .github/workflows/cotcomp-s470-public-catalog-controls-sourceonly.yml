name: CotComp S4.70 public catalog controls source-only

on:
  push:
    branches:
      - ays/cotcomp-s470-public-catalog-controls-sourceonly-20261002
    paths:
      - '.github/cotcomp-lab-intents/s470-public-catalog-controls-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s470-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.70 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s470-public-catalog-controls-sourceonly.json
          jq -e '
            .authorization=="S470_PUBLIC_CATALOG_CONTROLS_SOURCEONLY" and
            .journeyId=="GT_AUTO_MOTO_HYBRID" and
            .appDataReads==false and
            .appDataWrites==false and
            .deploy==false and
            .release==false and
            .providerOrRater==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.70 safeguards
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-public-catalog-controls-s470.js
          node --check cotcomp-public-catalog-controls-s470.test.js
          node --test cotcomp-public-catalog-controls-s470.test.js

      - name: Generate sanitized S4.70 receipt
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s470"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./cotcomp-public-catalog-controls-s470');
          const r=s.sourceOnlyReadiness();
          if(!r.sourceContractReady)throw new Error('S470_SOURCE_CONTRACT_NOT_READY');
          if(r.publicUiReleaseReady)throw new Error('S470_RELEASE_MUST_REMAIN_BLOCKED_WITHOUT_CATALOGS');
          if(!r.blockers.includes('PUBLIC_CATALOG_BINDING_REQUIRED'))throw new Error('S470_CATALOG_DEPENDENCY_MISSING');
          if(r.brandControl!=='catalog_select'||r.lineModelControl!=='dependent_catalog_select')throw new Error('S470_DROPDOWN_TRUTH_INVALID');
          if(r.executionEnabled||r.appDataReadsAllowed||r.appDataWritesAllowed||r.deployAllowed||r.releaseAllowed)throw new Error('S470_BOUNDARY_INVALID');
          const receipt={
            schemaVersion:'ays-cotcomp-s470-public-catalog-controls-sourceonly-receipt-v1.0',
            sourceSha:process.env.GITHUB_SHA,
            journeyId:r.journeyId,
            sourceContractReady:true,
            publicUiReleaseReady:false,
            blocker:'PUBLIC_CATALOG_BINDING_REQUIRED',
            dropdownRequirementFrozen:true,
            brandControl:r.brandControl,
            lineModelControl:r.lineModelControl,
            dependentBrandModel:true,
            catalogKeys:r.catalogKeys,
            completionContractIsPresentationAuthority:false,
            appDataReads:0,
            appDataWrites:0,
            deploy:false,
            release:false,
            providerOrRaterCalls:0,
            productionTouched:false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s470/S470_PUBLIC_CATALOG_CONTROLS_SOURCEONLY_RECEIPT.json',JSON.stringify(receipt,null,2));
          NODE

      - name: Upload sanitized S4.70 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s470-public-catalog-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/s470/S470_PUBLIC_CATALOG_CONTROLS_SOURCEONLY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
