# B4-003 same-artifact release lane (reusable); does not touch LIVE, Rules, Auth or business data.
# Team classification projection repair updates only the EXISTING Preview read callable.
# 2026-11-05: causal same-channel rebuild for source/runtime resource reconciliation (no LIVE/data changes).
# 2026-11-05: final anti-drift commit - every canonical push runs governance; guarded from path-filter regressions.
# 2026-11-05: advisor visibility selector and exact Inicio/Equipo served-byte readback.
# 2026-11-05: final canonical HEAD after exact deployed goal-writer no-op and certification ledger sync.
# 2026-11-04: exact same-channel candidate after Inicio signed-advisor first-paint fix.
# 2026-11-04: same-channel causal rerun after Inicio event-listener VM compatibility guard.
# 2026-11-04: repackage after witnessed Inicio 1 póliza/obligación grammar bug and regressions.
# Reusable in the same canonical branch when a causal source fix invalidates
# the former immutable candidate; never patch or promote the older bundle.
name: Gravicentra B4-003 Immutable Candidate Hosting Preview
on:
  workflow_dispatch:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-b4-003-immutable-candidate-preview.yml
      - orbit360-platform/core/queries.js
      - orbit360-platform/core/ciclo.js
      - orbit360-platform/index.html
      - orbit360-platform/styles/infra.css
      - tools/gravicentra-b4-003-inbox-human-identity.test.cjs
      - tools/gravicentra-b4-003-commercial-pipeline-qa-isolation.test.cjs
      - orbit360-platform/modules/equipo.js
      - orbit360-platform/core/policy-receipts-engine.js
      - orbit360-platform/modules/policy-receipts-v1199-bridge.js
      - orbit360-platform/modules/crm-v1198-operational-bridge.js
      - tools/gravicentra-b4-004-policy-form-currency-commission.test.cjs
      - tools/gravicentra-b4-004-equipo-commission-audit.test.cjs
      - tools/gravicentra-b4-004-client-create-country-scope.test.cjs
      - tools/gravicentra-policy-writer-backend-causal.test.cjs
      - orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js
      - tools/gravicentra-b4-004-policy-capture-preview-qa.mjs
      - tools/gravicentra-b4-004-policy-capture-preview-qa.test.mjs
      - tools/gravicentra-b4-004-receipt-editor-preservation.test.cjs
      - tools/gravicentra-i6-5-b4-003-preview-proof.mjs
      - orbit360-platform/data/store-firestore-product-operational-p0.js
      - tests/goal-participation-classification-writer.test.cjs
      - functions/b4-003-scoped-bootstrap-reader.js
      - functions/product-operational-domain.js
      - tools/gravicentra-b4-003-scoped-bootstrap-reader.test.cjs
      - tools/gravicentra-b4-003-operational-write-security-regression.test.cjs
      - tools/gravicentra-b4-003-scoped-boundary.test.cjs
      - tools/gravicentra-b4-003-financial-qa-commercial-exclusion.test.cjs

permissions:
  contents: read
  actions: read

concurrency:
  group: gi-b4003-immutable-candidate-preview
  cancel-in-progress: false

jobs:
  canonical-artifact-hosting-preview:
    # One reusable B4-003 candidate Preview path. Source tested once, bundle retained for identical LIVE promotion.
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message != 'transport(b4-003): reuse existing isolated Preview channel under quota'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.sha }}
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      HOSTING_SITE: ays-orbit-360-lab
      FRONTEND_CONTRACT: artifacts/orbit360-recovery/release-control/I6_5_B4_004_POLICY_CAPTURE_CAUSAL_FRONTEND_SUCCESSOR_CONTRACT_20261107.json
      RELEASE_GATE: I6.5-B4-003
      BUILD_PREFIX: gi-i65-b4
      GRAVICENTRA_B4_003_SCOPED_PREVIEW: 'true'
      GRAVICENTRA_B4_003_GOALS_PREVIEW: 'true'
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout and certify exact canonical source and E4 regression
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source, scope and functional regression
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 66012815b42c0cc26cb372c19f74d52bddba953d HEAD
          test "$(git rev-parse HEAD:functions/assignable-advisor-roster.js)" = '9778d74b6d305ff56caf73bb68be3dadac4b14ce'
          test "$(git rev-parse HEAD:functions/product-operational-domain.js)" = '187efbfa9868531349154f26ec90a5e2c2ed33e8'
          test "$(git rev-parse HEAD:functions/goal-participation-contract.js)" = 'ff86fa441fd6cb4ec6254e2dc5078a37bf68fc36'
          test "$(git rev-parse HEAD:orbit360-platform/modules/equipo.js)" = 'f584c4109294f8e32621c9ee9dd5cfdd55ca2c79'
          test "$(git rev-parse HEAD:orbit360-platform/core/ciclo.js)" = '7068c028419c7c13d9dc12b0fb715dd7bb3ce8c1'
          test "$(git rev-parse HEAD:orbit360-platform/index.html)" = '867c5e108988b68ca49702e494e96fa9f01afd71'
          test "$(git rev-parse HEAD:orbit360-platform/styles/infra.css)" = '788570e8f490dc5232bf8b4d6ff6fe5e87fb9bb2'
          test "$(git rev-parse HEAD:orbit360-platform/modules/ops.js)" = 'eadc3ffd5ce9eb8c3c696870a8a7069f78908dc1'
          test "$(git rev-parse HEAD:orbit360-platform/modules/leads.js)" = 'f4af7b02d79890ca7ab8c39fb9f0269dac772b93'
          test "$(git rev-parse HEAD:orbit360-platform/core/queries.js)" = '391d6c7df59b5d6fbb64adb419cb240c078545b8'
          test "$(git rev-parse HEAD:orbit360-platform/modules/cobros.js)" = 'ed8e23f47f31401012ddc4632e75386f30dda158'
          test "$(git rev-parse HEAD:tools/gravicentra-b4-003-e4-anulado-projection.test.cjs)" = '3f471893daabc44e3d226b6983393114d568c1f8'
          test -f artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
          test -f orbit360-platform/docs/recovery/orbit360-recovery-state-v1.json
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const c=JSON.parse(fs.readFileSync(process.env.FRONTEND_CONTRACT,'utf8'));
          const need=(v,e)=>{if(!v)throw Error('FRONTEND_SUCCESSOR_'+e);};
          need(c.schema==='GRAVICENTRA_CURRENT42_CAUSAL_FRONTEND_SUCCESSOR_CONTRACT_V1'&&c.status==='SOURCE_CONTRACT_ONLY_PREVIEW_AND_PROMOTION_PENDING','CONTRACT');
          need(c.repository===process.env.GITHUB_REPOSITORY&&process.env.GITHUB_REF==='refs/heads/'+c.branch,'BOUNDARY');
          need(c.scope.b4003Reopened===false&&c.scope.nextGateExecuted===false&&c.scope.backendFunctionDeploys===0&&c.scope.businessWrites===0&&c.scope.rulesWrites===0&&c.promotion.authorized===false,'SCOPE');
          git('merge-base','--is-ancestor',c.sourceBaseHead,'HEAD');
          need(git('rev-parse','HEAD')===process.env.SOURCE_SHA,'HEAD');
          const cp=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          const seal=cp[c.preservedAcceptance.cursor]?.formalLiveAcceptance;
          need(seal&&seal.status===c.preservedAcceptance.status&&seal.sourceSha===c.preservedAcceptance.sourceSha&&seal.buildId===c.preservedAcceptance.buildId&&Number(seal.artifactId)===c.preservedAcceptance.artifactId&&seal.receiptBlobSha===c.preservedAcceptance.receiptBlobSha,'PRESERVED_CURRENT42_SEAL');
          const paths=git('diff','--name-only',c.sourceBaseHead,'HEAD','--','orbit360-platform').split(/\r?\n/).filter(p=>p&&!p.startsWith('orbit360-platform/docs/')).sort();
          need(JSON.stringify(paths)===JSON.stringify(c.productChanges.map(x=>x.path).sort()),'UNDECLARED_PRODUCT_CHANGE');
          for(const x of c.productChanges){need(git('rev-parse',c.sourceBaseHead+':'+x.path)===x.beforeBlobSha&&git('hash-object',x.path)===x.afterBlobSha,'PRODUCT_BLOB');}
          need(git('hash-object',c.preservedBuilder.path)===c.preservedBuilder.blobSha&&git('hash-object','orbit360-platform/index.html')===c.preservedBuilder.indexBlobSha,'BUILDER_OR_INDEX_CHANGED');
          need(git('diff','--name-only',c.preservedAcceptance.sourceSha,'HEAD','--','functions')==='','BACKEND_SOURCE_CHANGED');
          console.log('FRONTEND_SUCCESSOR_CONTRACT_PASS_CURRENT42_PRESERVED_NO_LIVE_AUTHORIZATION');
          NODE
          node tools/gravicentra-b4-003-role-first-paint-and-team-regression.test.cjs
          node --test tools/gravicentra-b4-003-renewals-cancellations-focused.test.cjs tools/gravicentra-b4-003-cancelaciones-commercial-qa.test.cjs
          node --check functions/b4-003-scoped-policy-reader.js
          node --check orbit360-platform/modules/polizas.js
          node --check orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          node tools/gravicentra-b4-003-scoped-policy-reader.test.cjs
          node tools/gravicentra-b4-003-scoped-bootstrap-reader.test.cjs
          node tools/gravicentra-b4-003-polizas-advisor-hydration-20261102.test.cjs
          node tools/gravicentra-b4-003-policy-client-scope-link.test.cjs
          node --check orbit360-platform/modules/reportes.js
          node --check orbit360-platform/modules/cobros.js
          node --check orbit360-platform/modules/cancelaciones.js
          node --check orbit360-platform/modules/renovaciones.js
          node --check orbit360-platform/core/assignable-advisor-roster-client.js
          node --check orbit360-platform/core/ciclo.js
          node --check orbit360-platform/data/store-firestore-product-operational-p0.js
          node tools/gravicentra-b4-003-inicio-role-country-team.test.cjs
          node tools/gravicentra-b4-003-inicio-personal-recaudo.test.cjs
          node tools/gravicentra-b4-003-financial-qa-commercial-exclusion.test.cjs
          node tools/gravicentra-b4-003-commercial-pipeline-qa-isolation.test.cjs
          node tools/gravicentra-b4-003-ops-leads-role-scopes.test.cjs
          node tools/gravicentra-b4-003-ops-leads-advisor-r38.test.cjs
          # Causal QA-board filter successor: ciclo.js exact blob pinned above; historical receipts remain untouched.
          # QA repair: isolate the full validName arrow closure before executing it in vm.
          node tools/gravicentra-b4-003-inbox-human-identity.test.cjs
          node tools/gravicentra-b4-003-operational-write-security-regression.test.cjs >/dev/null
          node tools/gravicentra-b4-003-financial-role-scope-transversal.test.cjs
          node tools/gravicentra-b4-003-reportes-e4-transversal.test.cjs
          node tools/gravicentra-b4-003-e4-anulado-projection.test.cjs
          node tools/gravicentra-b4-003-renovaciones-qa-provenance.test.cjs
          node tools/gravicentra-b4-003-cross-module-readback-contract.test.cjs
          node --check functions/goal-participation-contract.js
          node --check orbit360-platform/modules/equipo.js
          node --check orbit360-platform/core/policy-receipts-engine.js
          node --check orbit360-platform/modules/policy-receipts-v1199-bridge.js
          node --check orbit360-platform/modules/crm-v1198-operational-bridge.js
          node --test tools/gravicentra-b4-004-policy-form-currency-commission.test.cjs
          node --test tools/gravicentra-b4-004-equipo-commission-audit.test.cjs
          node --test tools/gravicentra-b4-004-client-create-country-scope.test.cjs
          node --test tools/gravicentra-policy-writer-backend-causal.test.cjs
          node tools/gravicentra-b4-004-policy-capture-successor.test.mjs
          node --test tools/gravicentra-b4-004-policy-capture-preview-qa.test.mjs
          node --test tools/gravicentra-b4-004-receipt-editor-preservation.test.cjs
          node --check orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js
          node --check tools/gravicentra-i6-5-b4-003-preview-proof.mjs
          node --test tests/goal-participation*.test.cjs
          timeout -k 3s 55s node tools/gravicentra-i6-control-plane-guard-v1.mjs --mode=i6
      - name: Freeze LIVE fingerprints before isolated Preview
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/gi-e4-live-before.sha"
          curl -fsSL --retry 2 --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/gi-e4-domain-before.sha"
      - name: Reuse configured LAB credential and install pinned Firebase CLI
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-e4-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-e4-auth'
          paths=[]
          for n,key in enumerate(('SA_LAB','SA_LAB_ALT','SA_DEFAULT')):
            try: value=json.loads(os.environ.get(key,''))
            except (ValueError,TypeError): continue
            if value.get('type')=='service_account' and value.get('project_id')==os.environ['PROJECT_ID'] and value.get('private_key'):
              p=root/f'{n}.json';p.write_text(json.dumps(value));p.chmod(0o600);paths.append(str(p))
          if not paths: raise SystemExit('LAB_SERVICE_ACCOUNT_NOT_CONFIGURED')
          (root/'candidates').write_text('\n'.join(paths)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-e4-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-e4-cli"
          CLI="$RUNNER_TEMP/gi-e4-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate";break
            fi
          done < "$RUNNER_TEMP/gi-e4-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/gi-e4-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/gi-e4-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-e4-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
      - name: Preserve current backend for the authorized frontend-only successor
        working-directory: candidate
        run: |
          set -euo pipefail
          # Backend readback/deployment is a separately reviewed existing workflow.
          # This transport never redeploys any callable while fixing frontend state.
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const c=JSON.parse(fs.readFileSync(process.env.FRONTEND_CONTRACT,'utf8'));
          execFileSync('git',['diff','--exit-code',c.preservedAcceptance.sourceSha,'HEAD','--','functions'],{stdio:'inherit'});
          console.log('BACKEND_SOURCE_UNCHANGED_NO_FUNCTION_DEPLOY');
          NODE
      - name: Build immutable exact E4 Hosting package once
        working-directory: candidate
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-e4-apps.json"
          APP_ID=$(node -e "const x=require(process.env.RUNNER_TEMP+'/gi-e4-apps.json');const a=(x.result||[]).filter(y=>['WEB','PLATFORM_WEB',''].includes(String(y.platform||'').toUpperCase()));if(a.length!==1)process.exit(2);process.stdout.write(a[0].appId)")
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-e4-sdkconfig.json"
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/gi-e4-branding.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/gi-e4-branding.json"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/gi-e4-canonical-hosting" "$RUNNER_TEMP/gi-e4-sdkconfig.json" > "$RUNNER_TEMP/gi-e4-package-output.json"
          ROOT="$RUNNER_TEMP/gi-e4-canonical-hosting/bundle/site"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cmp functions/b4-003-scoped-policy-reader.js "$RUNNER_TEMP/gi-e4-canonical-hosting/bundle/backend/b4-003-scoped-policy-reader.js"
          cmp orbit360-platform/modules/polizas.js "$ROOT/modules/polizas.js"
          cmp orbit360-platform/modules/policy-receipts-v1199-detail-guard.js "$ROOT/modules/policy-receipts-v1199-detail-guard.js"
          cmp orbit360-platform/modules/cancelaciones.js "$ROOT/modules/cancelaciones.js"
          cmp orbit360-platform/modules/reportes.js "$ROOT/modules/reportes.js"
          cmp orbit360-platform/core/access-scope.js "$ROOT/core/access-scope.js"
          cmp orbit360-platform/core/queries.js "$ROOT/core/queries.js"
          cmp orbit360-platform/modules/equipo.js "$ROOT/modules/equipo.js"
          cmp orbit360-platform/core/policy-receipts-engine.js "$ROOT/core/policy-receipts-engine.js"
          cmp orbit360-platform/modules/policy-receipts-v1199-bridge.js "$ROOT/modules/policy-receipts-v1199-bridge.js"
          cmp orbit360-platform/modules/crm-v1198-operational-bridge.js "$ROOT/modules/crm-v1198-operational-bridge.js"
          cmp orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js "$ROOT/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js"
          cmp orbit360-platform/core/tenant-access-policy-effective-p0.js "$ROOT/core/tenant-access-policy-effective-p0.js"
           cmp orbit360-platform/modules/cobros.js "$ROOT/modules/cobros.js"
          cmp orbit360-platform/modules/renovaciones.js "$ROOT/modules/renovaciones.js"
          cmp orbit360-platform/core/assignable-advisor-roster-client.js "$ROOT/core/assignable-advisor-roster-client.js"
          cmp orbit360-platform/core/ciclo.js "$ROOT/core/ciclo.js"
          cmp orbit360-platform/styles/infra.css "$ROOT/styles/infra.css"
          cmp orbit360-platform/data/store-firestore-product-operational-p0.js "$ROOT/data/store-firestore-product-operational-p0.js"
          node - <<'NODE'
          const fs=require('node:fs'),r=process.env.RUNNER_TEMP+'/gi-e4-canonical-hosting/bundle';
          const c=JSON.parse(fs.readFileSync(r+'/firebase.json','utf8'));
          const b=JSON.parse(fs.readFileSync(r+'/site/__recovery__/build.json','utf8'));
          const p=fs.readFileSync(r+'/site/product-runtime-config.js','utf8');
          if(Object.keys(c).join(',')!=='hosting'||c.hosting.site!==process.env.HOSTING_SITE||c.hosting.public!=='site')throw Error('HOSTING_ONLY_EXISTING_LAB_REQUIRED');
          if(b.sourceSha!==process.env.SOURCE_SHA||b.gate!=='I6.5-B4-003'||!p.includes('"scopedReadPreviewCandidate":true')||!p.includes('"goalParticipationPreviewCandidate":true'))throw Error('CANONICAL_E4_PREVIEW_SOURCE_INVALID');
          NODE
      - name: Freeze the ONE build into an immutable promotion artifact
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gi-e4-canonical-hosting/bundle"
          test -f "$ROOT/firebase.json"
          test -f "$ROOT/site/__recovery__/build.json"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/gi-b4003-immutable-release-bundle.tar.gz" -C "$RUNNER_TEMP/gi-e4-canonical-hosting" bundle
          sha256sum "$RUNNER_TEMP/gi-b4003-immutable-release-bundle.tar.gz" > "$RUNNER_TEMP/gi-b4003-immutable-release-bundle.sha256"
          test -s "$RUNNER_TEMP/gi-b4003-immutable-release-bundle.tar.gz"
          tar -tzf "$RUNNER_TEMP/gi-b4003-immutable-release-bundle.tar.gz" > "$RUNNER_TEMP/gi-b4003-immutable-bundle-entries.txt"
          grep -Fxq 'bundle/site/modules/reportes.js' "$RUNNER_TEMP/gi-b4003-immutable-bundle-entries.txt"
      - name: Retain exact artifact for same-byte LIVE promotion after gate approval
        id: retained_bundle
        uses: actions/upload-artifact@v4
        with:
          name: gi-b4003-immutable-release-bundle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gi-b4003-immutable-release-bundle.tar.gz
            ${{ runner.temp }}/gi-b4003-immutable-release-bundle.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Deploy ONLY existing isolated Hosting Preview channel from retained exact bundle
        id: hosting
        run: |
          set -euo pipefail
          CHANNEL_ID="gi-i65-b4-rc-41765742748"
          test "${#CHANNEL_ID}" -le 32
          cd "$RUNNER_TEMP/gi-e4-canonical-hosting/bundle"
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/gi-e4-hosting-result.json" 2>&1
          export CHANNEL_ID
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['RUNNER_TEMP']+'/gi-e4-hosting-result.json').read()
          prefix='https://ays-orbit-360-lab--'+os.environ['CHANNEL_ID']+'-'
          urls=sorted(set(u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.startswith(prefix)))
          if len(urls)!=1:raise SystemExit('B4003_CANONICAL_PREVIEW_URL_NOT_UNIQUE')
          print(urls[0])
          PY
          )
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
      - name: Verify exact served artifact, preserve both LIVE sites
        env:
          PREVIEW_URL: ${{ steps.hosting.outputs.url }}
          RETAINED_ARTIFACT_ID: ${{ steps.retained_bundle.outputs.artifact-id }}
          RETAINED_ZIP_SHA256: ${{ steps.retained_bundle.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gi-e4-canonical-hosting/bundle/site"
          mkdir -p "$RUNNER_TEMP/gi-e4-readback/__recovery__"
          # Hosting CDN propagation may lag a successful deploy. Readiness requires
          # the expected exact build bytes, not just HTTP 200 from an older release.
          READY=0
          for attempt in $(seq 1 90); do
