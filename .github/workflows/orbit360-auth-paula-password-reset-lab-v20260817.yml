name: Orbit 360 · Reset único credencial Paula LAB

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-paula-password-reset-lab-v20260817.json'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-auth-paula-password-reset-lab-v20260817
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/auth-paula-password-reset-lab-v20260817.json
  ORBIT360_EXPECTED_REQUEST_VERSION: AUTH_PAULA_PASSWORD_RESET_V1
  ORBIT360_GATE_ID: block-auth-paula-password-reset-lab-v20260817
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_RESET_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/auth-paula-password-reset-sanitized-v20260817.json
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-paula-password-reset-lab-v20260817.json
  ORBIT360_CLOSURE: orbit360-platform/docs/CIERRE-AUTH-PAULA-PASSWORD-RESET-LAB-20260817.md

jobs:
  reset-existing-credential:
    name: Gate → identidad existente → reset 1 correo → integridad
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout autorización exacta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar request único e inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-auth-paula-password-reset-request-v1" and
            .requestVersion=="AUTH_PAULA_PASSWORD_RESET_V1" and
            .gateId=="block-auth-paula-password-reset-lab-v20260817" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .consumed==false and
            .authorizationFrozen==false and .replayAllowed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and
            .parentHead==$parent and
            .target.advisorId=="ase-paula-osorio" and
            .target.emailHash=="9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f"
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - name: Validar source y registrar gate estrecho
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-register-auth-paula-password-reset-gate-v20260817.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-auth-paula-password-reset-lab-v20260817.mjs
          node --check tools/orbit360-auth-paula-password-reset-lab-v20260817.mjs
          node tools/orbit360-register-auth-paula-password-reset-gate-v20260817.mjs
          git diff --check

      - name: Gate contractual obligatorio antes de secretos
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '
            .status=="GO_GATE_CONTRACT" and .contractVersion=="14.0.0" and
            .failed==0 and .ok==true and
            .executionAuthorized==true and .secretAccessAuthorized==true and
            .firestoreReadAuthorized==true and .writeAuthorized==false and
            .authWriteAuthorized==false and .passwordResetRequestAuthorized==true and
            .runtimeAuthorized==true and .browserAuthorized==false and
            .deployAuthorized==false and .functionsDeployAuthorized==false and
            .hostingDeployAuthorized==false and .rulesDeployAuthorized==false and
            .productionAuthorized==false and .targetCount==1 and
            .maxPasswordResetRequests==1
          ' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null

      - name: Resolver credencial LAB después del GO
        if: steps.preflight.outcome == 'success'
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-paula-reset-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Instalar runtime reproducible
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 google-auth-library@9 >/dev/null

      - name: Enviar un único reset a la identidad existente
        id: reset
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-paula-password-reset-lab-v20260817.mjs
          jq -e '
            .ok==true and .stage=="AUTH_PAULA_PASSWORD_RESET_PASS" and
            .existingAuthIdentityVerified==true and .existingMembershipVerified==true and
            .privilegedMembershipVerified==true and .passwordResetRequests==1 and
            .firebasePasswordResetEmailAccepted==true and
            .directPasswordSets==0 and .authUsersCreated==0 and .authUsersDeleted==0 and
            .authUserMutations==0 and .firestoreWrites==0 and
            .uidUnchanged==true and .authIdentityUnchanged==true and
            .membershipUnchanged==true and .teamRecordUnchanged==true and
            .rolesScopesUnchanged==true and .containsPassword==false and
            .containsActionLink==false
          ' "$ORBIT360_RESET_EVIDENCE" >/dev/null

      - name: Sellar lifecycle y cierre sanitizado
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const epath=process.env.ORBIT360_RESET_EVIDENCE;
          const lpath=process.env.ORBIT360_LIFECYCLE;
          const cpath=process.env.ORBIT360_CLOSURE;
          const e=fs.existsSync(epath)?JSON.parse(fs.readFileSync(epath,'utf8')):{
            stage:'STOP_RETRY_AUTH_PAULA_PASSWORD_RESET',
            classification:'PIPELINE_MECHANISM_FAILURE',
            error:'RESET_EVIDENCE_MISSING',
            passwordResetRequests:0,
            ok:false
          };
          const lifecycle=JSON.parse(fs.readFileSync(lpath,'utf8'));
          lifecycle.status=e.ok?'AUTH_PAULA_PASSWORD_RESET_CONSUMED_PASS':'AUTH_PAULA_PASSWORD_RESET_CONSUMED_STOP_RETRY';
          lifecycle.authorization.activeRequest=false;
          lifecycle.authorization.allowedExecutions=0;
          lifecycle.authorization.consumed=true;
          lifecycle.authorization.replayAllowed=false;
          lifecycle.executionResult={
            stage:e.stage||'',
            classification:e.classification||'',
            ok:e.ok===true,
            passwordResetRequests:e.passwordResetRequests||0
          };
          fs.writeFileSync(lpath,JSON.stringify(lifecycle,null,2)+'\n','utf8');
          fs.mkdirSync('orbit360-platform/docs',{recursive:true});
          const closure=[
            '# CIERRE — RESET ÚNICO DE CREDENCIAL PAULA LAB',
            '',
            'Fecha: 2026-08-17',
            'Gate: `block-auth-paula-password-reset-lab-v20260817`',
            'RC: `RC-AYS-LAB-CANONICA-01`',
            '',
            '```text',
            String(e.stage||'UNKNOWN'),
            String(e.classification||''),
            `resetRequests: ${e.passwordResetRequests||0}`,
            `uidUnchanged: ${e.uidUnchanged===true}`,
            `membershipUnchanged: ${e.membershipUnchanged===true}`,
            `rolesScopesUnchanged: ${e.rolesScopesUnchanged===true}`,
            '```',
            '',
            '- Identidades creadas/eliminadas: 0/0.',
            '- Contraseña directa asignada o expuesta: 0.',
            '- Firestore/CRM writes: 0.',
            '- Functions/Hosting/Rules/deploy/browser: 0.',
            '- Producción/main/merge: 0.',
            '- El request queda consumido y no admite replay.',
            ''
          ].join('\n');
          fs.writeFileSync(cpath,closure,'utf8');
          NODE

      - name: Persistir evidencia y consumo sin modificar request
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-auth-reset-bot
          git config user.email orbit360-auth-reset-bot@users.noreply.github.com
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_LIFECYCLE" orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json "$ORBIT360_RESET_EVIDENCE" "$ORBIT360_CLOSURE"
          if ! git diff --cached --quiet; then
            git commit -m 'auth: persist single existing-identity password reset [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Publicar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-auth-paula-password-reset-sanitized-v20260817
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            ${{ env.ORBIT360_RESET_EVIDENCE }}
            ${{ env.ORBIT360_CLOSURE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Comentar cierre en PR 5
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=process.env.ORBIT360_RESET_EVIDENCE;
            const e=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{stage:'STOP_RETRY_EVIDENCE_MISSING',ok:false};
            const body=[
              `## Reset único de credencial administrativa — ${e.ok?'PASS':'STOP_RETRY'}`,
              '',
              '```text',
              `stage: ${e.stage||''}`,
              `resetRequests: ${e.passwordResetRequests||0}`,
              `uidUnchanged: ${e.uidUnchanged===true}`,
              `membershipUnchanged: ${e.membershipUnchanged===true}`,
              `rolesScopesUnchanged: ${e.rolesScopesUnchanged===true}`,
              'identidades creadas/eliminadas: 0/0',
              'Firestore/CRM writes: 0',
              'Functions/Hosting/Rules/producción/main/merge: 0',
              '```'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});

      - name: Exigir PASS sin segundo intento
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ORBIT360_RESET_EVIDENCE"
          jq -e '.ok==true and .stage=="AUTH_PAULA_PASSWORD_RESET_PASS" and .passwordResetRequests==1' "$ORBIT360_RESET_EVIDENCE" >/dev/null
