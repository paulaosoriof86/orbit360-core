        run: |
          set -euo pipefail
          cd orbit360-platform
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$GATE_ID" | tee /tmp/f2-source-gate.txt
          grep -F 'PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE' /tmp/f2-source-gate.txt
      - name: Write sanitized post-sync source-only evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p=process.env.POSTSYNC_EVIDENCE;
          const e={
            schemaVersion:'orbit360-f2-rules01-postdeploy-pass-postsync-source-only-v1',
            ok:true,
            status:'F2_RULES01_POSTDEPLOY_PASS_POSTSYNC_SOURCE_ONLY_PASS',
            classification:'SOURCE_CONTRACT_PASS',
            gateId:process.env.GATE_ID,
            gateMarker:'PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE',
            postdeployProbe:{runId:32272580947,artifactId:9372746151,httpStatus:403,errorStatus:'PERMISSION_DENIED',crossTenantDenied:true,integrityBeforeAfterPass:true,requestConsumed:true,replayAllowed:false,rulesRedeployExecuted:false},
            boundary:{phase:'F2_RULES01_POSTDEPLOY_PROBE_PASS_REQUEST06_AUTHORIZATION_PENDING',request06Created:false,request06Authorized:false,successorArtifactId:9345207863,successorPublished:false,productionOperationalDeclared:false},
            scope:{secretAccess:false,firestoreRead:false,authRead:false,browserExecuted:false,runtimeExecuted:false,firestoreDocumentWrites:0,authWrites:0,membershipWrites:0,dataWrites:0,rulesDeploy:false,hostingDeploy:false,functionsDeploy:false,packageRebuild:false,publication:false,production:false,mainMerge:false},
            observerRootCause:{classification:'PIPELINE_MECHANISM_FAILURE',code:'F2_POSTDEPLOY_PROBE_OBSERVER_OVERCONSTRAINED_BY_ACTIONS_PATH_FIELD',status:'CLOSED',probeReplayed:false},
            containsPII:false,containsSecrets:false,generatedAt:new Date().toISOString()
          };
          fs.mkdirSync(require('path').dirname(p),{recursive:true});
          fs.writeFileSync(p,JSON.stringify(e,null,2)+'\n');
          NODE
          jq -e '.ok==true and .postdeployProbe.crossTenantDenied==true and .postdeployProbe.integrityBeforeAfterPass==true and .postdeployProbe.requestConsumed==true and .postdeployProbe.replayAllowed==false and .boundary.request06Created==false and .boundary.successorPublished==false and .scope.firestoreDocumentWrites==0 and .scope.authWrites==0 and .scope.membershipWrites==0 and .scope.dataWrites==0 and .scope.rulesDeploy==false and .scope.hostingDeploy==false and .scope.functionsDeploy==false and .scope.packageRebuild==false and .scope.publication==false and .scope.production==false' "$POSTSYNC_EVIDENCE" >/dev/null
      - name: Persist synchronized source-only closure
