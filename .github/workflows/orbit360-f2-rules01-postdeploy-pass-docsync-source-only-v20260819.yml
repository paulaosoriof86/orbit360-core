          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/5")"
          test "$(printf '%s' "$PR" | jq -r '.state')" = 'open'
          test "$(printf '%s' "$PR" | jq -r '.draft')" = 'true'
          test "$(printf '%s' "$PR" | jq -r '.merged')" = 'false'
          test "$(printf '%s' "$PR" | jq -r '.head.ref')" = "$TARGET_BRANCH"
          test "$(printf '%s' "$PR" | jq -r '.head.sha')" = "$GITHUB_SHA"
          test -f .github/orbit360-requests/f2-rules01-postdeploy-probe-readonly-v20260818-01.json
          jq -e '.status=="CONSUMED_PASS" and .consumed==true and .allowedExecutions==0 and .replayAllowed==false and .terminal.runId==32272580947 and .terminal.responseStatus==403 and .terminal.responseErrorStatus=="PERMISSION_DENIED" and .terminal.crossTenantDenied==true and .terminal.integrityBeforeAfterPass==true and .terminal.rulesRedeployExecuted==false and .terminal.firestoreDocumentWrites==0 and .terminal.authWrites==0 and .terminal.membershipWrites==0 and .terminal.dataWrites==0 and .terminal.hostingDeploy==false and .terminal.functionsDeploy==false and .terminal.packageRebuild==false and .terminal.publication==false and .terminal.production==false' .github/orbit360-requests/f2-rules01-postdeploy-probe-readonly-v20260818-01.json >/dev/null
