          MATCH="$(printf '%s' "$ARTS" | jq --arg name "$TARGET_ARTIFACT_NAME" '[.artifacts[] | select(.name==$name)]')"
          test "$(printf '%s' "$MATCH" | jq 'length')" = '1'
          test "$(printf '%s' "$MATCH" | jq -r '.[0].id')" = "$TARGET_ARTIFACT_ID"
          test "$(printf '%s' "$MATCH" | jq -r '.[0].digest')" = "$TARGET_ARTIFACT_DIGEST"
