name: Orbit 360 · Activación v16 hydration sequence · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  source-v16-hydration-sequence:
    if: github.head_ref == 'ays/source-activation-v16-hydration-sequence-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source activation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate source-only and perform explicit transition once
        shell: bash
        run: |
          set -euo pipefail
          CONTROLLER='tools/orbit360-activate-v16-hydration-sequence-source-v20260807.mjs'
          LIFECYCLE='tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json'
          OVERLAY='tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json'
          REQUEST='.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json'
          VERSION='20260807.16-two-phase-runtime'
          STATUS="$(node -e "const j=require('./'+process.argv[1]);process.stdout.write(String(j.status||''))" "$LIFECYCLE")"

          node --check "$CONTROLLER"
          node --check tools/orbit360-transition-visual-matrix-lifecycle-source-to-runtime-v20260807.mjs
          node --check tools/orbit360-consume-visual-matrix-request-on-stop-v20260807.mjs
          node --check tools/orbit360-seal-visual-matrix-corrected-post-auth-runtime-v20260805.mjs
          node --check tools/orbit360-visual-runtime-rootfix-browser-precheck-v20260805.mjs

          if [[ "$STATUS" == 'AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST' ]]; then
            node "$CONTROLLER" validate-runtime-pending
            echo 'PASS_V16_SOURCE_ACTIVATION_ALREADY_TRANSITIONED_NO_MUTATION'
            exit 0
          fi

          node "$CONTROLLER" check-rootfix
          node tools/orbit360-test-v15-inicio-hydration-stop-consumer-rootfix-source-v20260807.mjs
          node tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs
          node tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs

          node "$CONTROLLER" prepare
          node "$CONTROLLER" validate-source-stage
          node tools/orbit360-transition-visual-matrix-lifecycle-source-to-runtime-v20260807.mjs "$LIFECYCLE" "$OVERLAY" "$REQUEST" "$VERSION"
          node "$CONTROLLER" validate-runtime-pending

          node - <<'NODE'
          const fs=require('fs');
          const request=JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const lifecycle=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const overlay=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          if(request.requestVersion!=='20260807.15-two-phase-runtime'||request.consumed!==true||request.authorizationFrozen!==true||request.allowedExecutions!==0||request.replayAllowed!==false) process.exit(41);
          if(lifecycle.status!=='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST'||lifecycle.expectedRequestVersion!=='20260807.16-two-phase-runtime'||lifecycle.currentPhase!=='VISUAL_MATRIX_CORRECTED_POST_AUTH_LAB_EXECUTION') process.exit(41);
          if(overlay.status!=='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST'||overlay.expectedNextRequestVersion!=='20260807.16-two-phase-runtime') process.exit(41);
          console.log(JSON.stringify({status:'PASS_V16_SOURCE_ONLY_BEFORE_REQUEST',priorRequestV15ConsumedFrozen:true,requestV16Created:false,sequence:['HYDRATION_CONTRACT_MOUNTED','INICIO_REQUIRED_HYDRATION','INICIO_READY'],runtimePending:true,secretsRead:false,firebaseAccess:false,hostingTouched:false,browserExecuted:false,deployExecuted:false,writes:0,ok:true},null,2));
          NODE

          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add "$LIFECYCLE" "$OVERLAY" 'orbit360-platform/runtime-gate-crm-v20260716/v16-source-activation-hydration-sequence-sanitized-v20260807.json'
          if ! git diff --cached --quiet; then
            git commit -m 'source-only: persist v16 runtime-pending hydration sequence [skip ci]'
            git push origin HEAD:ays/source-activation-v16-hydration-sequence-20260807
          fi

      - name: Assert no runtime side effects
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const evidence=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/v16-source-activation-hydration-sequence-sanitized-v20260807.json','utf8'));
          const ok=evidence.ok===true&&evidence.runtimePending===true&&evidence.secretsRead===false&&evidence.firebaseAccess===false&&evidence.firestoreReads===0&&evidence.firestoreWrites===0&&evidence.authWrites===0&&evidence.operationalWrites===0&&evidence.hostingTouched===false&&evidence.browserExecuted===false&&evidence.deployExecuted===false&&evidence.productionTouched===false;
          if(!ok) process.exit(41);
          console.log('PASS_V16_SOURCE_ONLY_ZERO_RUNTIME_SIDE_EFFECTS');
          NODE
