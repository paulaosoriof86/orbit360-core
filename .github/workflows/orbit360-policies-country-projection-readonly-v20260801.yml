name: Orbit 360 · Pólizas · diagnóstico país read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-diagnostics/policies-country-projection-readonly-v20260801.json'
      - '.github/orbit360-resume/policies-country-projection-validator-resume-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-country-projection-readonly-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block7-policies-static-v20260730
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_REQUEST_FILE: .github/orbit360-diagnostics/policies-country-projection-readonly-v20260801.json
  ORBIT360_RESUME_FILE: .github/orbit360-resume/policies-country-projection-validator-resume-v20260801.json
  ORBIT360_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-policies-static-v20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  diagnose:
    name: Pólizas · país/country y relaciones · read-only v2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar alcance congelado y reanudación
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-policies-country-projection-diagnostic-request-v1" and .gateId==env.ORBIT360_GATE_ID and .contractVersion=="7.0.1" and .approved==true and .consumed==false and .allowedExecutions==1 and .classification=="DATA_CONTRACT_FAILURE" and .sourceRun==30723733270 and .rules.inferCountry==false and .rules.writeCountry==false and .capabilities.firestoreRead==true and .capabilities.writes==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.deploy==false and .capabilities.rulesDeploy==false and .capabilities.production==false' "$ORBIT360_REQUEST_FILE" >/dev/null
          jq -e '.schemaVersion=="orbit360-policies-country-projection-diagnostic-resume-v1" and .gateId==env.ORBIT360_GATE_ID and .contractVersion=="7.0.1" and .approved==true and .resumeSequence==2 and .sourceRun==30723931071 and .sourceJob==91432109841 and .sourceArtifact==8825711437 and .classification=="VALIDATOR_STALE" and .rootCause=="NESTED_COUNTRY_COUNTED_AS_TOP_LEVEL_FIRESTORE_FIELD" and .reportedStatus=="POLICIES_COUNTRY_PROJECTION_DIAGNOSTIC_INCONCLUSIVE" and .canonicalPreflightPassed==17 and .canonicalPreflightFailed==0 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .validatorRevision=="top-level-country-v2" and .countryInferenceAllowed==false and .countryWriteAllowed==false' "$ORBIT360_RESUME_FILE" >/dev/null
          jq -e '.status=="POLICIES_COUNTRY_PROJECTION_DIAGNOSTIC_RESUME_AUTHORIZED" and .executionProfile.phase=="LAB_DATA_CONTRACT_REPAIR_DRYRUN" and .authorization.diagnosticExecutionsAllowed==1 and .authorization.diagnosticConsumed==false and .authorization.diagnosticResumeAllowedOnce==true and .authorization.diagnosticResumeSequence==2 and .authorization.additionalPreviewAuthorized==false and .diagnosticHistory.firstRun.run==30723931071 and .diagnosticHistory.firstRun.classification=="VALIDATOR_STALE" and .diagnosticHistory.validatorCorrection.revision=="top-level-country-v2" and .humanApproval.polizas==false and .guards.countryInferenceAllowed==false and .guards.countryRepairAllowed==false' "$ORBIT360_LIFECYCLE_FILE" >/dev/null

      - name: Gate canónico antes de secrets y Firestore
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-policies-static-v20260730.mjs
          node --check tools/orbit360-diagnosticar-policies-country-projection-readonly-v20260801.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="POLICIES_COUNTRY_PROJECTION_DIAGNOSTIC_RESUME_READY" and .executionPhase=="LAB_DATA_CONTRACT_REPAIR_DRYRUN" and .phase=="POLICIES_COUNTRY_PROJECTION_READONLY_DIAGNOSTIC_RESUME" and .resumeSequence==2 and .sourceValidatorStaleRun==30723931071 and .pipelineResumeAllowed==true and .executionAuthorized==true and .firestoreReadAuthorized==true and .allowedExecutions==1 and .validatorRevision=="top-level-country-v2" and .writeAuthorized==false and .browserAuthorized==false and .deployAuthorized==false and .countryInferenceAllowed==false and .countryRepairAllowed==false and .failed==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Instalar dependencia aislada
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 >/dev/null

      - name: Resolver identidad LAB
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-policies-country-diagnostic-v2.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_PROJECT_ID=$ORBIT360_PROJECT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_TENANT_ID=$ORBIT360_TENANT_ID" >> "$GITHUB_ENV"

      - name: Ejecutar diagnóstico corregido de contrato de país
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-diagnosticar-policies-country-projection-readonly-v20260801.mjs
          jq -e '.ok==true and .schemaVersion=="orbit360-policies-country-projection-diagnostic-v2" and .validatorRevision=="top-level-country-v2" and .status=="POLICIES_COUNTRY_PROJECTION_DIAGNOSTIC_PASS" and .classification=="DATA_CONTRACT_FAILURE_CONFIRMED" and .rootCauseConfirmed==true and .currentProjectionMatchesFailedBrowser==true and .counts.clientes==430 and .counts.aseguradoras==30 and .counts.polizas==1373 and .counts.vehiculos==1032 and .counts.recibosEsperados==1294 and .counts.carteraPrimas==673 and .counts.cobros==5 and .fieldStats.clientes.currentPaisGT==414 and .fieldStats.aseguradoras.currentPaisGT==26 and .fieldStats.polizas.currentPaisGT==2 and .fieldStats.vehiculos.currentPaisGT==1 and .fieldStats.recibosEsperados.currentPaisGT==0 and .fieldStats.carteraPrimas.currentPaisGT==0 and .fieldStats.cobros.currentPaisGT==2 and .summary.missingTopLevelCountryRows>0 and .summary.exactRelationshipCandidates>0 and .summary.allMissingCountryRowsRequireValidationBeforeWrite==true and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .containsPII==false and .containsPolicyNumbers==false and .containsAmounts==false and .containsIds==false and .containsSecrets==false' "$EVIDENCE_DIR/policies-country-projection-diagnostic-v20260801.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-country-projection-readonly-v2-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/policies-country-projection-diagnostic-v20260801.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/policies-country-projection-diagnostic-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Policies country diagnostic v2 failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.rootCauseConfirmed===true&&p.validatorRevision==='top-level-country-v2'&&p.firestoreWrites===0){state='success';description='Country projection root cause confirmed v2; zero writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-country-projection-readonly',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
