name: Orbit 360 · M5 runtime validator remediation · 5.0.15
run-name: M5 5.0.15 · static validator remediation · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-validator-remediation-515-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: ae6bb2a35ce4f03c0353d670218c841e51b57a2461a3ba9e741d8bd7a973fd61

jobs:
  static_validator_remediation:
    name: M5 · correct stale predicate · prove no product change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history for root-cause proof
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar rama y ejecución manual congelada
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 0702b42346054158b7268348d6a2c2d2ffdfdad0^{commit}

      - name: Verificar contrato de selectores jq Unicode
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/orbit360-jq-selector-safety-contract-v20260729.json
          node <<'NODE'
          const fs=require('fs');
          const files=['.github/workflows/orbit360-m5-lab-hosting-delivery-513-v20260729.yml','.github/workflows/orbit360-m5-runtime-validator-remediation-515-v20260729.yml'];
          const unsafe=/\.[A-Za-z_][A-Za-z0-9_\u0080-\uFFFF]*[\u0080-\uFFFF][A-Za-z0-9_\u0080-\uFFFF]*/g;
          const findings=[];
          for(const file of files){fs.readFileSync(file,'utf8').split(/\r?\n/).forEach((line,i)=>{if(!/\bjq\b/.test(line))return;for(const m of line.matchAll(unsafe))findings.push({file,line:i+1,token:m[0]});});}
          if(findings.length)throw new Error('UNSAFE_JQ_UNICODE_SELECTOR:'+JSON.stringify(findings));
          console.log('PASS_JQ_UNICODE_SELECTOR_SAFETY');
          NODE

      - name: Preflight canónico estático
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-runtime-validator-remediation-515-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-514-browser-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.15" and .executionPhase=="M5_RUNTIME_SMOKE_ROOT_CAUSE_REMEDIATION_STATIC" and .failed==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==42 and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .dataAccess==false and .secretAccess==false and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Validar cierre estático de causa raíz
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M5_RUNTIME_VALIDATOR_515_STATIC_PASS" and .classification=="VALIDATOR_STALE" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==42 and .ownerVersion=="20260729.3" and .staleOwnerVersion=="20260728.2" and .productOwnerUnchangedSinceRuntime514==true and .stalePredicateAbsent==true and .runtime514AuthorizationConsumed==true and .priorRuntimeCountsStable==true and .priorRuntimeDigestsStable==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .deploy==false and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .visualReview==false and .["pólizas"]==false and .failed==0 and .passed==.total' "$ORBIT360_EVIDENCE_DIR/m5-runtime-validator-remediation-515-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-validator-remediation-515-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-validator-remediation-515-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-validator-remediation-515-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.15 static validator remediation failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true){state='success';description='M5 validator stale corrected; RC unchanged';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-validator-remediation-515',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
