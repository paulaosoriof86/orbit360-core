# G12 source-only replacement for the historical S5.09 LAB publisher.
# NOTE: the prior advisor-lead-attention-s509-fixture.js writes synthetic Firestore
# documents and is intentionally NOT executed under this authorization.
name: Gravicentra S5.09 New Lead Attention SOURCE ONLY
on:
  workflow_dispatch:
  push:
    branches:
      - ays/gravicentra-s509-new-lead-attention-20261007
    paths:
      - 'functions/advisor-lead-attention-s509.js'
      - 'functions/advisor-lead-attention-s509.test.js'
      - 'functions/advisor-lead-attention-s509-fixture.js'
      - 'functions/bootstrap.js'
      - 'orbit360-platform/core/advisor-lead-attention-s509.js'
      - 'orbit360-platform/core/backend-lab-init.js'
      - '.github/workflows/gravicentra-s509-new-lead-attention-lab.yml'
permissions:
  contents: read
jobs:
  s509-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local test dependencies
        working-directory: functions
        run: npm ci
      - name: Preserve code and unit-test contracts without any cloud access
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check advisor-lead-attention-s509.js
          node --check advisor-lead-attention-s509-fixture.js
          node --check ../orbit360-platform/core/advisor-lead-attention-s509.js
          node --test advisor-lead-attention-s509.test.js
          grep -q "leadAttention: 'orbit360AdvisorLeadAttentionS509'" ../orbit360-platform/core/backend-lab-init.js
          grep -q "advisor-lead-attention-s509.js" ../orbit360-platform/core/backend-lab-init.js
          grep -q "require('./advisor-lead-attention-s509')" bootstrap.js
      - name: No-release safety receipt
        run: echo 'G12_S509_SOURCE_ONLY_PASS NO_HOSTING_MUTATION NO_FIRESTORE_WRITES NO_FUNCTION_DEPLOY NO_REAL_DATA'
# No Firebase credentials, Firebase CLI, Hosting publish, Firestore fixture execution or production.
