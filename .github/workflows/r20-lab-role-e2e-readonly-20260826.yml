name: Orbit 360 · R20 LAB role E2E read-only

on:
  push:
    branches:
      - qa/r20-lab-role-e2e-20260826
    paths:
      - '.github/orbit360-r20-e2e/request-20260826.json'

permissions:
  contents: read

concurrency:
  group: orbit360-r20-lab-role-e2e-20260826
  cancel-in-progress: false

env:
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_BASE_URL: https://ays-orbit-360-lab.web.app/index.html?orbitBackend=firestore-lab&tenant=alianzas-soluciones&runtime=20260717-2
  ORBIT360_REQUEST_FILE: .github/orbit360-r20-e2e/request-20260826.json
  ORBIT360_EVIDENCE_DIR: r20-lab-role-e2e-evidence

jobs:
  role-e2e:
    name: Operativo + Asesor · Ops/Leads · screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify one-shot read-only request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          jq -e '
            .schemaVersion=="orbit360-r20-lab-role-e2e-request-v1" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .replayAllowed==false and
            .baseCandidateSha=="8c9668d6d423e82826b0295431ec699390d79b4b" and
            .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and
            .targetRoles==["Operativo","Asesor"] and
            .scope.labOnly==true and .scope.realExistingIdentities==true and
            .scope.customTokenEphemeralAuth==true and .scope.firestoreReadOnly==true and
            .scope.production==false and .scope.deploy==false and .scope.dataWrites==false and
            .scope.adminAuthWrites==false and .scope.notifications==false and
            .scope.captureScreenshots==true
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve LAB service account without exposing it
        shell: bash
        env:
          SA1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA1:-${SA2:-${SA3:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY="$RUNNER_TEMP/orbit360-r20-e2e-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY"
          chmod 600 "$KEY"
          test "$(jq -r '.project_id // empty' "$KEY")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY" >> "$GITHUB_ENV"

      - name: Install reproducible browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 playwright@1.52.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p "$ORBIT360_EVIDENCE_DIR"

      - name: Execute read-only role E2E and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';
          import { cert, getApps, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId = process.env.ORBIT360_PROJECT_ID;
          const tenantId = process.env.ORBIT360_TENANT_ID;
          const baseUrl = process.env.ORBIT360_BASE_URL;
          const evidenceDir = process.env.ORBIT360_EVIDENCE_DIR;
          const credential = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
          const app = getApps()[0] || initializeApp({ credential: cert(credential), projectId });
          const db = getFirestore(app);
          const auth = getAuth(app);
          const sha = value => crypto.createHash('sha256').update(String(value), 'utf8').digest('hex');
          const text = value => String(value == null ? '' : value).trim();
          const norm = value => text(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
          const alias = new Map([
            ['direccion','Dirección'],['director','Dirección'],['superadmin','SuperAdmin'],['super_admin','SuperAdmin'],
            ['admin','AdminTenant'],['administrador','AdminTenant'],['admin_tenant','AdminTenant'],['admintenant','AdminTenant'],
            ['operativo','Operativo'],['operaciones','Operativo'],['finanzas','Finanzas'],['financiero','Finanzas'],
            ['marketing','Marketing'],['asesor','Asesor'],['comercial','Comercial'],['asistente','Asistente']
          ]);
          const canonical = value => alias.get(norm(value)) || text(value);
          const unique = values => [...new Set([].concat(values || []).map(text).filter(Boolean))];
          const rolesOf = row => unique([].concat(row.roles || [], row.rolesAsignados || [], row.assignedRoles || [], row.role || [], row.rol || [], row.defaultRole || [], row.rolDefault || [], row.activeRole || [], row.rolActivo || [])).map(canonical).filter(Boolean);
          const active = row => {
            const s = norm(row.status || row.estado);
            return row.active !== false && row.activo !== false && !['inactive','inactivo','blocked','bloqueado'].includes(s);
          };
          const docStamp = doc => `${doc.id}:${doc.updateTime ? doc.updateTime.toMillis() : 0}`;
          async function collectionStamp(ref) {
            const snap = await ref.get();
            const rows = snap.docs.map(docStamp).sort();
            return { count: rows.length, digest: sha(rows.join('|')) };
          }
          async function integritySnapshot() {
            const tenant = db.collection('tenants').doc(tenantId);
            const legacy = db.collection('tenantId').doc(tenantId);
            const refs = {
              members: tenant.collection('members'),
              workflowEvents: tenant.collection('workflowEvents'),
              workflowRequests: tenant.collection('workflowRequests'),
              notificationOutbox: tenant.collection('notificationOutbox'),
              legacyNegocios: legacy.collection('negocios'),
              legacyGestiones: legacy.collection('gestiones'),
              legacyNotifs: legacy.collection('notifs'),
              canonicalNegocios: tenant.collection('workflow').doc('negocios').collection('items'),
              canonicalGestiones: tenant.collection('workflow').doc('gestiones').collection('items')
            };
            const out = {};
            for (const [key, ref] of Object.entries(refs)) out[key] = await collectionStamp(ref);
            const cfg = await tenant.collection('config').doc('workflow').get();
            out.workflowConfig = { exists: cfg.exists, updateTime: cfg.updateTime ? cfg.updateTime.toMillis() : 0 };
            return out;
          }

          const membersSnap = await db.collection('tenants').doc(tenantId).collection('members').get();
          const members = membersSnap.docs.map(d => ({ id: d.id, ...(d.data() || {}) })).filter(active);
          const byRole = role => members.filter(m => rolesOf(m).includes(role));
          const operativoPool = byRole('Operativo');
          const asesorPool = byRole('Asesor');
          if (!operativoPool.length) throw new Error('NO_ACTIVE_OPERATIVO_MEMBER');
          if (!asesorPool.length) throw new Error('NO_ACTIVE_ASESOR_MEMBER');
          const operativo = operativoPool[0];
          const asesor = asesorPool.find(m => m.id !== operativo.id) || asesorPool[0];
          if (asesor.id === operativo.id) throw new Error('OPERATIVO_ASESOR_DISTINCT_MEMBER_REQUIRED');

          const workflowCfgSnap = await db.collection('tenants').doc(tenantId).collection('config').doc('workflow').get();
          const workflowCfg = workflowCfgSnap.exists ? (workflowCfgSnap.data() || {}) : {};
          const channels = unique(workflowCfg.notificationChannels || ['portal','in_app']).map(norm);
          const externalChannels = channels.filter(ch => !['portal','in_app'].includes(ch));

          const before = await integritySnapshot();
          const browser = await chromium.launch({ headless: true });
          const results = [];
          for (const target of [{ role: 'Operativo', member: operativo }, { role: 'Asesor', member: asesor }]) {
            const user = await auth.getUser(target.member.id);
            const token = await auth.createCustomToken(user.uid, { orbit360R20ReadOnlyE2E: true });
            const context = await browser.newContext({ viewport: { width: 1600, height: 1000 }, locale: 'es-GT' });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error && error.message || error).slice(0, 500)));
            await page.goto(`${baseUrl}#/inicio`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.firebase && window.firebase.apps && window.firebase.apps.length && typeof window.firebase.auth === 'function', null, { timeout: 60000 });
            await page.evaluate(async t => { await window.firebase.auth().signInWithCustomToken(t); }, token);
            await page.waitForFunction(() => window.Orbit && Orbit.session && Orbit.session.membershipProjectionStatus && Orbit.session.membershipProjectionStatus().ready === true, null, { timeout: 60000 });
            const allowedRoles = await page.evaluate(() => Orbit.session.allowedRoles());
            if (!allowedRoles.includes(target.role)) throw new Error(`ROLE_NOT_ASSIGNED_${target.role.toUpperCase()}`);
            const switched = await page.evaluate(role => Orbit.session.set(role), target.role);
            if (!switched) throw new Error(`ROLE_SWITCH_BLOCKED_${target.role.toUpperCase()}`);
            await page.waitForFunction(role => window.Orbit && Orbit.session && Orbit.session.rol() === role, target.role, { timeout: 15000 });

            const routeResults = [];
            for (const route of [
              { hash: '#/ops', marker: 'Orbit Ops', key: 'ops' },
              { hash: '#/leads', marker: 'Orbit Leads', key: 'leads' }
            ]) {
              await page.evaluate(hash => { window.location.hash = hash; }, route.hash);
              await page.waitForFunction(marker => document.body && document.body.innerText.includes(marker), route.marker, { timeout: 60000 });
              await page.waitForTimeout(1200);
              const safeRoleState = await page.evaluate(() => ({
                activeRole: Orbit.session.rol(),
                allowedRoles: Orbit.session.allowedRoles(),
                membership: Orbit.session.membershipProjectionStatus(),
                headingPresent: document.body.innerText.includes(location.hash.includes('leads') ? 'Orbit Leads' : 'Orbit Ops')
              }));
              const fileName = `r20-${target.role.toLowerCase()}-${route.key}.png`;
              await page.screenshot({ path: path.join(evidenceDir, fileName), fullPage: true });
              routeResults.push({ route: route.key, screenshot: fileName, ...safeRoleState });
            }
            results.push({
              role: target.role,
              identityDigest: sha(user.uid).slice(0, 16),
              emailDigest: sha(String(user.email || '').toLowerCase()).slice(0, 16),
              authIdentityExists: true,
              assignedRoles: allowedRoles,
              routes: routeResults,
              pageErrorCount: pageErrors.length,
              pageErrors
            });
            await context.close();
          }
          await browser.close();
          const after = await integritySnapshot();
          const integrityPass = JSON.stringify(before) === JSON.stringify(after);
          const routesPass = results.every(r => r.routes.length === 2 && r.routes.every(x => x.headingPresent && x.activeRole === r.role && x.membership && x.membership.ready === true));
          const pageErrorsPass = results.every(r => r.pageErrorCount === 0);
          const communicationsPass = externalChannels.length === 0;
          const ok = integrityPass && routesPass && pageErrorsPass && communicationsPass;
          const report = {
            schemaVersion: 'orbit360-r20-lab-role-e2e-evidence-v1',
            status: ok ? 'R20_LAB_ROLE_E2E_READONLY_PASS' : 'R20_LAB_ROLE_E2E_READONLY_FAIL',
            classification: ok ? 'PASS' : 'FAIL',
            executedAtUtc: new Date().toISOString(),
            baseCandidateSha: '8c9668d6d423e82826b0295431ec699390d79b4b',
            projectId,
            tenantId,
            host: new URL(baseUrl).host,
            targetRoles: ['Operativo','Asesor'],
            distinctRealExistingIdentities: operativo.id !== asesor.id,
            authMethod: 'firebase-admin-custom-token-ephemeral',
            humanPasswordAccessed: false,
            adminAuthWritesExecuted: 0,
            firestoreWritesExecutedByTest: 0,
            deployExecuted: false,
            productionTouched: false,
            notificationChannels: channels,
            externalNotificationChannels: externalChannels,
            communicationsGatePass: communicationsPass,
            integrityBefore: before,
            integrityAfter: after,
            beforeAfterIntegrityPass: integrityPass,
            roleRouteResults: results,
            screenshots: results.flatMap(r => r.routes.map(x => x.screenshot)),
            ok
          };
          fs.writeFileSync(path.join(evidenceDir, 'r20-lab-role-e2e-report.json'), JSON.stringify(report, null, 2) + '\n');
          if (!ok) process.exitCode = 2;
          NODE
          jq -e '.status=="R20_LAB_ROLE_E2E_READONLY_PASS" and .ok==true and .distinctRealExistingIdentities==true and .beforeAfterIntegrityPass==true and .communicationsGatePass==true and .productionTouched==false and .deployExecuted==false and .firestoreWritesExecutedByTest==0 and (.screenshots|length)==4' "$ORBIT360_EVIDENCE_DIR/r20-lab-role-e2e-report.json" >/dev/null

      - name: Upload screenshots and sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-r20-lab-role-e2e-${{ github.run_id }}
          path: r20-lab-role-e2e-evidence/
          retention-days: 14
          if-no-files-found: error
