name: Orbit360 source activate transition v19 bounded render

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-activate-v19-source-stage-v20260807.mjs'
      - '.github/workflows/orbit360-source-activate-transition-v19-bounded-render-v20260807.yml'

permissions:
  contents: write

jobs:
  source-activate-transition-v19:
    if: github.head_ref == 'ays/sourcefix-v19-cliente360-bounded-render-work-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Final source package validation before transition
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/orbit360-registered-relay-v18-transactional-hydration-v20260807.yml
          test -e .github/workflows/orbit360-registered-relay-v19-bounded-render-v20260807.yml
          node --check orbit360-platform/modules/cliente360.js
          node --check orbit360-platform/core/visual-runtime-rootfix-v20260805.js
          node --check tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs
          node --check tools/orbit360-seal-visual-matrix-corrected-post-auth-runtime-v20260805.mjs
          node --check tools/orbit360-activate-v19-source-stage-v20260807.mjs
          node --check tools/orbit360-test-v19-cliente360-bounded-render-source-v20260807.mjs
          node tools/orbit360-test-v19-cliente360-bounded-render-source-v20260807.mjs
          node tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs
          echo PASS_V19_FINAL_SOURCE_PACKAGE_BEFORE_TRANSITION

      - name: Reserve source activation v19
        run: node tools/orbit360-activate-v19-source-stage-v20260807.mjs

      - name: Explicit source to runtime-pending transition
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-transition-visual-matrix-lifecycle-source-to-runtime-v20260807.mjs \
            tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json \
            tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json \
            .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json \
            20260807.19-two-phase-runtime
          node - <<'NODE'
          const fs=require('fs');
          const lifecycle=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const overlay=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          const out={
            schemaVersion:'orbit360-v19-source-to-runtime-pending-transition-v1',
            generatedAt:'2026-08-07T10:44:00-06:00',
            runId:process.env.GITHUB_RUN_ID||'',
            status:'PASS_V19_SOURCE_TO_RUNTIME_PENDING',
            requestVersion:'20260807.19-two-phase-runtime',
            lifecycleStatus:lifecycle.status,
            lifecyclePhase:lifecycle.currentPhase,
            executionAuthorized:lifecycle.executionAuthorized===true,
            secretAccessAuthorized:lifecycle.secretAccessAuthorized===true,
            firestoreReadAuthorized:lifecycle.firestoreReadAuthorized===true,
            writeAuthorized:lifecycle.writeAuthorized===true,
            browserAuthorized:lifecycle.browserAuthorized===true,
            hostingDeployAuthorized:lifecycle.hostingDeployAuthorized===true,
            relay: lifecycle.registeredWorkflowPath,
            secretsRead:false,firebaseAccess:false,hostingTouched:false,browserExecuted:false,deployExecuted:false,writes:0,
            containsPII:false,containsSecrets:false,ok:true
          };
          fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/v19-source-to-runtime-pending-transition-sanitized-v20260807.json',JSON.stringify(out,null,2)+'\n');
          if(lifecycle.status!=='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST'||overlay.status!=='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST'||lifecycle.expectedRequestVersion!=='20260807.19-two-phase-runtime') process.exit(41);
          NODE

      - name: Persist runtime-pending source state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add \
            tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json \
            tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json \
            orbit360-platform/runtime-gate-crm-v20260716/v19-cliente360-bounded-render-source-sanitized-v20260807.json \
            orbit360-platform/runtime-gate-crm-v20260716/v19-source-to-runtime-pending-transition-sanitized-v20260807.json
          if ! git diff --cached --quiet; then
            git commit -m 'source v19: reserve and transition runtime-pending [skip ci]'
            git push origin HEAD:ays/sourcefix-v19-cliente360-bounded-render-work-20260807
          fi

      - name: Assert no runtime effects
        run: |
          echo PASS_V19_SOURCE_TO_RUNTIME_PENDING_NO_RUNTIME
          echo 'secretsRead=false firebaseAccess=false hostingTouched=false browserExecuted=false deployExecuted=false writes=0'
