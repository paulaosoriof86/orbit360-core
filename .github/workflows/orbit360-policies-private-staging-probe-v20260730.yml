name: Orbit 360 · Policies private staging channel probe
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['.github/workflows/orbit360-policies-private-staging-probe-v20260730.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-private-staging-probe-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block7-policies-static-v20260730
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  probe:
    name: Policies · private staging identity probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate estático antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .failed==0 and .secretAccess==false and .firestoreRead==false and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Resolver solo identidad pública de cuenta existente
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          export SERVICE_ACCOUNT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=process.env.SERVICE_ACCOUNT; const j=JSON.parse(raw);
          if(j.project_id!=='ays-orbit-360-lab'||!j.client_email||!j.private_key) throw new Error('ENVIRONMENT_FAILURE:SERVICE_ACCOUNT_IDENTITY_INVALID');
          const out={schemaVersion:'orbit360-private-staging-probe-v1',ok:true,projectId:j.project_id,serviceAccountEmail:j.client_email,emailDigest:crypto.createHash('sha256').update(j.client_email).digest('hex'),privateKeyExposed:false,secretValueCount:0,firestoreRead:false,firestoreWrites:0,operationalWrites:0,productionTouched:false};
          fs.mkdirSync(process.env.EVIDENCE_DIR,{recursive:true}); fs.writeFileSync(process.env.EVIDENCE_DIR+'/policies-private-staging-probe.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Subir evidencia sin secreto
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-private-staging-probe-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/policies-private-staging-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE: orbit360-platform/runtime-gate-crm-v20260716/policies-private-staging-probe.json
        with:
          script: |
            const fs=require('fs'); let state='failure',description='Private staging identity probe failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.PROBE,'utf8'));if(p.ok===true&&p.privateKeyExposed===false){state='success';description='Private staging identity resolved; no Firestore/data writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-private-staging-probe',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
