name: Orbit 360 · Rootfix visual observable v2 post-Auth · LAB

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/orbit360-requests/visual-observable-rootfix-lab-v20260805-*.json'
      - '.github/orbit360-requests/visual-observable-rootfix-v2-lab-v20260805-*.json'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-visual-observable-rootfix-v2-lab-v20260805
  cancel-in-progress: false

jobs:
  visual-observable-rootfix-v2:
    name: Registro → gate → backup → Hosting → precheck → matriz
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout request exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Ejecutar runner contractual único
        env:
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          chmod +x tools/orbit360-run-visual-observable-rootfix-v2-lab-v20260805.sh
          tools/orbit360-run-visual-observable-rootfix-v2-lab-v20260805.sh

      - name: Publicar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-observable-rootfix-v2-lab-sanitized
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/visual-observable-rootfix-v2-*-sanitized-v20260805.json
            orbit360-platform/docs/CIERRE-VISUAL-OBSERVABLE-ROOTFIX-V2-LAB-20260805.md
            orbit360-visual-observable-v2-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
