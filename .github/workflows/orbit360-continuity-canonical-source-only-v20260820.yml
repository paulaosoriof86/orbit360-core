name: Orbit360 Continuity Canonical Source Only
# CONTROL_PLANE_CONVERGENCE_V1
# Single physical writer. Durable evidence -> transition owner -> ledger -> derived projections -> convergence gate.
# Macro-2 candidate rebuild/replay is forbidden after durable reconciliation.

on:
  workflow_dispatch:
    inputs:
      transition:
        description: Readback only
        required: true
        type: string
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
      - '.github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-continuity-projection-atomic-v20260820.mjs'
      - 'tools/orbit360-control-plane-evidence-convergence-v20260822.mjs'
      - 'tools/orbit360-control-plane-composite-invariant-v20260820.mjs'
      - 'tools/orbit360-control-plane-independent-readback-v20260820.mjs'
      - 'tools/orbit360-documentation-state-discovery-v20260821.mjs'
      - 'tools/orbit360-workflow-operational-surface-audit-v20260820.mjs'
      - 'tools/orbit360-macro2-pipeline-preflight-v20260821.mjs'
      - 'tools/orbit360-promote-macro2-transversal-candidate-v20260821.mjs'
      - '.github/orbit360-source-patches/macro2-v20260821/macro2-v3r1-post.sh'
      - 'orbit360-platform/docs/orbit360-control-plane-canonicality-contract-v20260822.json'
      - 'orbit360-platform/docs/orbit360-continuity-writer-registry-v20260820.json'
      - 'orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'
      - 'orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'
      - 'orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'
      - 'tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json'
      - 'tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json'
      - 'tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json'
      - 'orbit360-platform/docs/orbit360-live-state-v1.json'
      - 'orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json'
      - 'orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md'
      - 'orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md'
      - 'README.md'
      - 'orbit360-platform/CHANGELOG.md'
      - 'orbit360-platform/runtime-gate-crm-v20260716/macro2-candidate-artifact-metadata-v20260821.json'
      - 'orbit360-platform/runtime-gate-crm-v20260716/control-plane-canonicality-convergence-audit-v20260822.json'

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  POINTER: .github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json
  METADATA: orbit360-platform/runtime-gate-crm-v20260716/macro2-candidate-artifact-metadata-v20260821.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  OWNER: tools/orbit360-continuity-transition-owner-v20260820.mjs

jobs:
  canonical-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce branch and dispatch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            test "${{ inputs.transition }}" = 'READBACK_ONLY'
          fi

      - name: Prove single physical writer before any repair
        shell: bash
        run: node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: diagnose
        name: Diagnose evidence convergence without mutation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node "$CONVERGENCE" --repo-only > "$RUNNER_TEMP/convergence-diagnostic.json"
          RC=$?
          set -e
          cat "$RUNNER_TEMP/convergence-diagnostic.json"
          if [ "$RC" -eq 0 ]; then
            echo 'mode=READBACK' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = 'push' ] && jq -e '.repairable==true and .repairReason=="DURABLE_CANDIDATE_SAFE_FOR_CANONICAL_OWNER_REDUCTION"' "$RUNNER_TEMP/convergence-diagnostic.json" >/dev/null; then
            echo 'mode=RECONCILE' >> "$GITHUB_OUTPUT"
          else
            echo 'CONTROL_PLANE_CONVERGENCE_NOT_REPAIRABLE_FAIL_CLOSED' >&2
            exit 41
          fi

      - id: artifact
        if: steps.diagnose.outputs.mode == 'RECONCILE'
        name: Verify durable candidate artifact from GitHub Actions authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ID=$(jq -r '.artifactId' "$METADATA")
          DIGEST=$(jq -r '.artifactDigest' "$METADATA")
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" > "$RUNNER_TEMP/artifact-raw.json"
          jq -e --argjson id "$ID" --arg digest "$DIGEST" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/artifact-raw.json" >/dev/null
          jq '{id,digest,expired,created_at,expires_at,workflow_run:{id:.workflow_run.id,head_sha:.workflow_run.head_sha,head_branch:.workflow_run.head_branch}}' "$RUNNER_TEMP/artifact-raw.json" > "$RUNNER_TEMP/artifact-attestation.json"
          cat "$RUNNER_TEMP/artifact-attestation.json"

      - name: Reconcile durable evidence through the sole transition owner
        if: steps.diagnose.outputs.mode == 'RECONCILE'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER")
          PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" \
            --transition CONTROL_PLANE_EVIDENCE_RECONCILE \
            --expected-revision "$LR" \
            --expected-package-revision "$PRV" \
            --candidate-metadata "$METADATA" \
            --artifact-attestation "$RUNNER_TEMP/artifact-attestation.json" | tee "$RUNNER_TEMP/reconcile.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_EVIDENCE_RECONCILED_AND_MACRO2_PROMOTED" and .progress==75 and .runtimeAllowed==false' "$RUNNER_TEMP/reconcile.json" >/dev/null

      - name: Validate repaired worktree before publication
        if: steps.diagnose.outputs.mode == 'RECONCILE'
        shell: bash
        run: |
          set -euo pipefail
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-before-publish.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS" and .productionRouteProgressPct==75' "$RUNNER_TEMP/convergence-before-publish.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: publish
        if: steps.diagnose.outputs.mode == 'RECONCILE'
        name: Publish one atomic canonical state transition with remote CAS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          cat > "$RUNNER_TEMP/allowed.txt" <<'LIST'
          .github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json
          README.md
          orbit360-platform/CHANGELOG.md
          orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md
          orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json
          orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
          orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
          orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json
          orbit360-platform/docs/orbit360-live-state-v1.json
          orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
          tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json
          tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json
          tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json
          LIST
          printf '%s\n' "${CHANGED[@]}" | sed '/^$/d' > "$RUNNER_TEMP/changed.txt"
          diff -u <(sort "$RUNNER_TEMP/changed.txt") <(sort "$RUNNER_TEMP/allowed.txt")
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          xargs -d '\n' git add -- < "$RUNNER_TEMP/allowed.txt"
          git diff --cached --check
          git commit -m 'gate(control-plane): reconcile durable evidence and converge current state'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch origin "$ORBIT360_BRANCH"
          test "$(git rev-parse origin/$ORBIT360_BRANCH)" = "$GITHUB_SHA"
          git push origin "HEAD:$ORBIT360_BRANCH"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Project the same canonical fingerprint into the actual PR body
        if: steps.diagnose.outputs.mode == 'RECONCILE'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-patch.json"
          curl -L --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" \
            --data-binary @"$RUNNER_TEMP/pr-body-patch.json" > "$RUNNER_TEMP/pr-after.json"
          jq -r '.body' "$RUNNER_TEMP/pr-after.json" > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-after-pr.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS" and .prBodyValidated==true' "$RUNNER_TEMP/convergence-after-pr.json" >/dev/null
          echo 'CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS'

      - name: Inert canonical readback including actual PR body
        if: steps.diagnose.outputs.mode == 'READBACK'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" | jq -r '.body' > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-readback.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS" and .prBodyValidated==true' "$RUNNER_TEMP/convergence-readback.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          ORBIT360_PR_BODY_FILE="$RUNNER_TEMP/pr-body.txt" node tools/orbit360-control-plane-independent-readback-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          test -z "$(git status --porcelain)"
          echo 'CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS'
