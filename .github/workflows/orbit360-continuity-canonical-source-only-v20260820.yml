name: Orbit360 Continuity Canonical Source Only
# CONTROL_PLANE_CONVERGENCE_V1
# MACRO3_INLINE_F2_V1
# F2_LIVE_BASE_TRANSPORT_V1

on:
  pull_request:
    types: [synchronize]
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_EXPECTED_REQUEST_VERSION: F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V3
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  F2_ARTIFACT_ID: '9504702901'
  F2_AUTH_IDENTITY: 225f0f73b44b56006ae92d57a4f8024dba64ead40beec903cf064c03db87f924
  F2_INTENT: .github/orbit360-authorizations/f2-runtime-authorization-intent-225f0f73b44b-v20260824.json
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  BOUNDARY: orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  OWNER: tools/orbit360-continuity-transition-owner-v20260820.mjs
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  canonical-control-plane:
    if: github.event.pull_request.head.ref == 'orbit360/f2-one-shot-livebase-225f0f73b44b-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR merge context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate live-base transport and all source gates before authorization consumption
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "${{ github.event.action }}" = 'synchronize'
          test "${{ github.event.pull_request.base.ref }}" = "$ORBIT360_BRANCH"
          test "${{ github.event.pull_request.head.ref }}" = 'orbit360/f2-one-shot-livebase-225f0f73b44b-20260824'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          LIVE_BASE=$(git rev-parse FETCH_HEAD)
          test "${{ github.event.pull_request.base.sha }}" = "$LIVE_BASE"
          echo "ORBIT360_LIVE_BASE=$LIVE_BASE" >> "$GITHUB_ENV"
          mapfile -t CHANGED < <(git diff --name-only "$LIVE_BASE" '${{ github.event.pull_request.head.sha }}')
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
          cp .github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml "$RUNNER_TEMP/executing-workflow.yml"
          echo "ORBIT360_F2_WORKFLOW_SOURCE_FILE=$RUNNER_TEMP/executing-workflow.yml" >> "$GITHUB_ENV"

          jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" '.status=="USER_AUTHORIZATION_RECEIVED" and .authorizationIdentityDigest==$auth and .candidateArtifactId==$artifact and .candidateArtifactDigest=="sha256:f11dd2a350b4160465dfc93b0dd9153e697d09773fa00aa4ee5ed13d93401ca2" and .candidateSourceHead=="8c9668d6d423e82826b0295431ec699390d79b4b" and .oneShotOnly==true and .replayAllowed==false and .scope.runtimeReadOnly==true and .scope.secrets==true and .scope.firestoreRead==true and .scope.browser==true and .scope.writes==false and .scope.deploy==false and .scope.production==false and .scope.main==false and .scope.merge==false' "$F2_INTENT" >/dev/null
          jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" '.revision==35 and .productionReopeningPackage.revision==29 and .successorCandidate.artifactId==$artifact and .successorCandidate.sourceHead=="8c9668d6d423e82826b0295431ec699390d79b4b" and .successorCandidate.artifactDigest=="sha256:f11dd2a350b4160465dfc93b0dd9153e697d09773fa00aa4ee5ed13d93401ca2" and .authorizationBoundary.preparedAuthorizationIdentityDigest==$auth and .authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and .authorizationBoundary.authorizationRecordPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT" and .progress.productionRouteProgressPct==75' "$LEDGER" >/dev/null
          jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" '.authorized==false and .authorizationPersisted==false and .requestMaterialized==false and .runtimeAllowed==false and .authorizationIdentity.digest==$auth and .candidate.artifactId==$artifact' "$BOUNDARY" >/dev/null

          node --check "$OWNER"
          node --check "$CONVERGENCE"
          node --check tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node --check tools/orbit360-f2-terminal-evidence-normalizer-v20260824.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs | tee "$RUNNER_TEMP/workflow-audit.json"
          jq -e '.ok==true and .totalWorkflowFiles==1' "$RUNNER_TEMP/workflow-audit.json" >/dev/null
          ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-macro3-mechanism-preflight-v20260823.mjs
          jq -e '.ok==true and .status=="MACRO3_MECHANISM_PREFLIGHT_PASS" and .allowedExecutionsAfterAccept==0 and .replayAllowed==false' "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json" >/dev/null
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs "$ORBIT360_GATE_ID" | tee "$RUNNER_TEMP/f2-source-precheck.json"
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .executionAuthorized==false and .runtimeAuthorized==false and .browserAuthorized==false and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$RUNNER_TEMP/f2-source-precheck.json" >/dev/null
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-source.json"
          jq -e '.ok==true and .ledgerRevision==35 and .packageRevision==29 and .candidateArtifactId==9504702901 and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-source.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${F2_ARTIFACT_ID}" > "$RUNNER_TEMP/f2-artifact.json"
          jq -e --argjson id "$F2_ARTIFACT_ID" '.id==$id and .expired==false and .digest=="sha256:f11dd2a350b4160465dfc93b0dd9153e697d09773fa00aa4ee5ed13d93401ca2"' "$RUNNER_TEMP/f2-artifact.json" >/dev/null
          if git ls-files --error-unmatch "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null 2>&1; then git restore "$EVIDENCE_DIR/preflight-sanitizado.json"; else rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"; fi
          if git ls-files --error-unmatch "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json" >/dev/null 2>&1; then git restore "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json"; else rm -f "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json"; fi
          test -z "$(git status --porcelain)"

      - name: Switch to exact live canonical base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$ORBIT360_LIVE_BASE"
          git checkout --force -B orbit360-f2-runtime "$ORBIT360_LIVE_BASE"
          test -z "$(git status --porcelain)"
          test -f "$F2_INTENT"
          echo "ORBIT360_F2_WORKFLOW_SOURCE_FILE=$RUNNER_TEMP/executing-workflow.yml" >> "$GITHUB_ENV"

      - id: materialize
        name: Persist authorization, request and consume runtime-attempt budget atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.revision' "$LEDGER")" = '35'
          test "$(jq -r '.revision' "$PACKAGE")" = '29'
          node "$OWNER" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --expected-revision 35 --expected-package-revision 29 --authorization-identity "$F2_AUTH_IDENTITY" > "$RUNNER_TEMP/f2-auth-persist.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_AUTHORIZATION_PERSISTED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-auth-persist.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_REQUEST_MATERIALIZE --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" --parent-head "$ORBIT360_LIVE_BASE" > "$RUNNER_TEMP/f2-request-materialize.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_REQUEST_MATERIALIZED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-request-materialize.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_ATTEMPT_ACCEPT --expected-revision "$LR" --expected-package-revision "$PRV" --runtime-run-id "$GITHUB_RUN_ID" > "$RUNNER_TEMP/f2-attempt-accept.json"
          jq -e --argjson run "$GITHUB_RUN_ID" '.ok==true and .status=="ORBIT360_F2_RUNTIME_ATTEMPT_ACCEPTED_ONE_SHOT" and .runtimeRunId==$run and .replayAllowed==false' "$RUNNER_TEMP/f2-attempt-accept.json" >/dev/null
          REQUEST=$(jq -r '.authorizationBoundary.activeRequestPath' "$LEDGER")
          test -n "$REQUEST" && test -f "$REQUEST"
          jq -e --argjson run "$GITHUB_RUN_ID" '.allowedExecutions==0 and .runtimeAttemptAccepted==true and .runtimeAttemptCount==1 and .runtimeRunId==$run and .replayAllowed==false and .consumed==false' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Validate accepted one-shot state before publication
        shell: bash
        run: |
          set -euo pipefail
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-attempt.json"
          jq -e '.ok==true and .authorized==true and .authorizationPersisted==true and .requestMaterialized==true and .runtimeAllowed==false and .productionRouteProgressPct==75' "$RUNNER_TEMP/convergence-attempt.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs

      - id: authpublish
        name: Publish accepted one-shot state with remote CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|.github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|README.md|orbit360-platform/CHANGELOG.md|orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|orbit360-platform/docs/orbit360-live-state-v1.json|orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_AUTH_PUBLICATION_SURFACE:$f" >&2; exit 41 ;;
            esac
          done
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): accept one-shot runtime attempt'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$ORBIT360_LIVE_BASE"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${ORBIT360_BRANCH}"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_REQUEST_FILE=${{ steps.materialize.outputs.request }}" >> "$GITHUB_ENV"

      - name: Converge actual PR body before runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-patch.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-patch.json" > "$RUNNER_TEMP/pr-after.json"
          jq -r '.body' "$RUNNER_TEMP/pr-after.json" > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-attempt-pr.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==true and .requestMaterialized==true and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-attempt-pr.json" >/dev/null

      - id: preruntime
        name: Verify accepted request, gate and exact candidate before provider secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$ORBIT360_REQUEST_FILE"
          test -f "$REQUEST"
          test "$(jq -r '.status' "$REQUEST")" = 'RUNTIME_ATTEMPT_ACCEPTED_PREFLIGHT_PENDING'
          test "$(jq -r '.allowedExecutions' "$REQUEST")" = '0'
          test "$(jq -r '.runtimeAttemptAccepted' "$REQUEST")" = 'true'
          test "$(jq -r '.runtimeRunId' "$REQUEST")" = "$GITHUB_RUN_ID"
          AUTHORITY=tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json
          CERT=$(jq -r '.candidateCertificationEvidence // ""' "$AUTHORITY")
          test -n "$CERT" && test -f "$CERT"
          export ORBIT360_CANDIDATE_CERTIFICATION_EVIDENCE="$CERT"
          export ORBIT360_CANDIDATE_ARTIFACT_ID=$(jq -r '.successorCandidate.artifactId' "$LEDGER")
          export ORBIT360_CANDIDATE_SOURCE_HEAD=$(jq -r '.successorCandidate.sourceHead' "$LEDGER")
          export ORBIT360_CANDIDATE_ZIP_SHA256=$(jq -r '.successorCandidate.zipSha256' "$LEDGER")
          export ORBIT360_CANDIDATE_MANIFEST_SHA256=$(jq -r '.successorCandidate.manifestSha256' "$LEDGER")
          echo "ORBIT360_CANDIDATE_CERTIFICATION_EVIDENCE=$ORBIT360_CANDIDATE_CERTIFICATION_EVIDENCE" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_ARTIFACT_ID=$ORBIT360_CANDIDATE_ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_SOURCE_HEAD=$ORBIT360_CANDIDATE_SOURCE_HEAD" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_ZIP_SHA256=$ORBIT360_CANDIDATE_ZIP_SHA256" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_MANIFEST_SHA256=$ORBIT360_CANDIDATE_MANIFEST_SHA256" >> "$GITHUB_ENV"
          ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json" ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          jq -e --arg run "$GITHUB_RUN_ID" --argjson artifact "$ORBIT360_CANDIDATE_ARTIFACT_ID" '.ok==true and .status=="GO_GATE_CONTRACT" and .classification=="GO_F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY" and .runId==$run and .candidateArtifactId==$artifact and .runtimeAttemptAccepted==true and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .runtimeAuthorized==true and .browserAuthorized==true and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" >/dev/null
          OUTER="$RUNNER_TEMP/f2-artifact-outer.zip"; OUTER_DIR="$RUNNER_TEMP/f2-outer"; CANDIDATE_DIR="$RUNNER_TEMP/f2-candidate"
          mkdir -p "$OUTER_DIR" "$CANDIDATE_DIR"
          curl -L --fail --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORBIT360_CANDIDATE_ARTIFACT_ID}/zip" -o "$OUTER"
          unzip -q "$OUTER" -d "$OUTER_DIR"
          mapfile -t FILES < <(find "$OUTER_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#FILES[@]}" = '1'
          INNER="$OUTER_DIR/${FILES[0]}"
          test "$(sha256sum "$INNER" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_ZIP_SHA256"
          unzip -q "$INNER" -d "$CANDIDATE_DIR"
          test "$(sha256sum "$CANDIDATE_DIR/orbit360-package-manifest.json" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_MANIFEST_SHA256"
          ORBIT360_F2_CANDIDATE_DIR="$CANDIDATE_DIR" ORBIT360_F2_CANDIDATE_SOURCE_EVIDENCE="$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-f2-exact-candidate-source-validator-v20260819.mjs
          jq -e '.ok==true and .status=="F2_EXACT_CANDIDATE_SOURCE_VALIDATION_PASS" and .fullRehashPass==true and .storeGetRootfixPass==true' "$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" >/dev/null
          echo "ORBIT360_F2_CANDIDATE_DIR=$CANDIDATE_DIR" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_MANIFEST_STATUS=$(jq -r '.status' "$CANDIDATE_DIR/orbit360-package-manifest.json")" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_MANIFEST_FILE_COUNT=$(jq -r '.fileCount' "$CANDIDATE_DIR/orbit360-package-manifest.json")" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0 >/dev/null
          BROWSER_EXECUTABLE=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$BROWSER_EXECUTABLE"
          echo "ORBIT360_SYSTEM_BROWSER_EXECUTABLE=$BROWSER_EXECUTABLE" >> "$GITHUB_ENV"

      - id: runtime
        name: Execute authorized F2 read-only provider, identity, integrity and browser
        if: steps.preruntime.outcome == 'success'
        continue-on-error: true
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          SA_FILE="$RUNNER_TEMP/orbit360-f2-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$SA_FILE"; chmod 600 "$SA_FILE"
          jq -e '.type=="service_account" and (.project_id|length)>0 and (.client_email|length)>0 and (.private_key|length)>0' "$SA_FILE" >/dev/null
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          ORBIT360_SMOKE_IDENTITY_EVIDENCE="$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" ORBIT360_SMOKE_RUN_ID="$GITHUB_RUN_ID" ORBIT360_SMOKE_TARGET_EMAIL_HASH="$ORBIT360_TARGET_EMAIL_HASH" ORBIT360_SMOKE_TARGET_ADVISOR_ID="$ORBIT360_TARGET_ADVISOR_ID" node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .targetIdentityMatches==true and .requiredRolesPresent==true and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" >/dev/null
          node tools/orbit360-f2-data-integrity-readonly-v20260818.mjs before
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$ORBIT360_F2_CANDIDATE_DIR" > "$RUNNER_TEMP/f2-http.log" 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/orbit360-package-manifest.json >/dev/null && break; sleep 1; done
          export ORBIT360_F2_URL=http://127.0.0.1:4173/
          RUNTIME_REQUEST="$RUNNER_TEMP/f2-runtime-request-v3-adapter.json"
          jq --arg status "$ORBIT360_F2_MANIFEST_STATUS" --argjson count "$ORBIT360_F2_MANIFEST_FILE_COUNT" '. + {candidate:{manifestStatus:$status,fileCount:$count}}' "$ORBIT360_REQUEST_FILE" > "$RUNTIME_REQUEST"
          ORBIT360_REQUEST_FILE="$RUNTIME_REQUEST" ORBIT360_F2_OUT="$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json" node tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs
          node tools/orbit360-f2-data-integrity-readonly-v20260818.mjs after
          node tools/orbit360-f2-compare-integrity-v20260818.mjs

      - id: terminal_evidence
        name: Build sanitized terminal evidence for every accepted attempt
        if: always() && steps.materialize.outcome == 'success'
        shell: bash
        env:
          PRERUNTIME_OUTCOME: ${{ steps.preruntime.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          FINAL="$EVIDENCE_DIR/f2-runtime-terminal-inline-${GITHUB_RUN_ID}.json"
          B="$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json"
          I="$EVIDENCE_DIR/f2-integrity-before-after-v20260818.json"
          S="$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json"
          P="$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          FINAL="$FINAL" B="$B" I="$I" S="$S" P="$P" RUN="$GITHUB_RUN_ID" REQUEST="$ORBIT360_REQUEST_FILE" ARTIFACT="$F2_ARTIFACT_ID" STAGES="preruntime=${PRERUNTIME_OUTCOME};runtime=${RUNTIME_OUTCOME}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {normalizeTerminalClassification, truthfulTerminalFlags} from './tools/orbit360-f2-terminal-evidence-normalizer-v20260824.mjs';
          const read=p=>p&&fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};
          const browser=read(process.env.B),integrity=read(process.env.I),selftest=read(process.env.S),preflight=read(process.env.P);
          let source=browser;if(!Object.keys(source).length)source=Object.keys(preflight).length?preflight:(Object.keys(selftest).length?selftest:{ok:false,classification:'PIPELINE_MECHANISM_FAILURE',error:`F2_STAGE_OUTCOME:${process.env.STAGES}`});
          const flags=truthfulTerminalFlags({browser,integrity});
          const ok=browser.ok===true&&browser.status==='F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_PASS'&&integrity.ok===true&&integrity.status==='F2_INTEGRITY_BEFORE_AFTER_PASS'&&flags.zeroCrossTenant===true&&flags.zeroUnexpectedWrites===true;
          const classification=normalizeTerminalClassification({...source,ok});
          const out={schemaVersion:'orbit360-f2-terminal-v5-inline-normalized',ok,status:ok?'F2_PRODUCTIVE_ACCEPTANCE_PASS':'F2_PRODUCTIVE_ACCEPTANCE_FAIL',classification,error:ok?null:String(source.failureCode||source.error||`F2_STAGE_OUTCOME:${process.env.STAGES}`).slice(0,900),runId:process.env.RUN,request:process.env.REQUEST,candidateArtifactId:Number(process.env.ARTIFACT),runtimeAttemptAccepted:true,allowedExecutions:0,...flags,firestoreWrites:Number(browser.firestoreWrites||0),authWrites:Number(browser.authWrites||0),operationalWrites:Number(browser.operationalWrites||0),deployExecuted:false,publicationExecuted:false,productionHostingTouched:false,containsPII:false,containsSecrets:false};
          fs.writeFileSync(process.env.FINAL,JSON.stringify(out,null,2)+'\n','utf8');
          NODE
          echo "evidence=$FINAL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always() && steps.materialize.outcome == 'success'
        with:
          name: orbit360-f2-productive-acceptance-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-inline-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore transient runtime mutations and nonterminal evidence
        if: always() && steps.materialize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/orbit360-validar-gate-contracts-v20260717.mjs tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json "$EVIDENCE_DIR/preflight-sanitizado.json" "$EVIDENCE_DIR/f2-data-integrity-before-v20260818.json" "$EVIDENCE_DIR/f2-data-integrity-after-v20260818.json" "$EVIDENCE_DIR/f2-integrity-before-after-v20260818.json"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git restore "$f"; else rm -f "$f"; fi
          done
          rm -f "$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json"
          rm -rf node_modules
          test -f "${{ steps.terminal_evidence.outputs.evidence }}"

      - name: Reconcile terminal exactly once through canonical owner
        if: always() && steps.materialize.outcome == 'success'
        env:
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_TERMINAL_RECONCILE_GENERIC --expected-revision "$LR" --expected-package-revision "$PRV" --terminal-evidence "$TERMINAL" | tee "$RUNNER_TEMP/f2-terminal-reconcile.json"
          jq -e '.ok==true and .status=="F2_RUNTIME_TERMINAL_RECONCILED_GENERIC" and .replayAllowed==false' "$RUNNER_TEMP/f2-terminal-reconcile.json" >/dev/null
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-terminal.json"
          jq -e '.ok==true and .authorized==false and .authorizationPersisted==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-terminal.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs

      - id: terminalpublish
        name: Publish one atomic terminal transition with remote CAS
        if: always() && steps.materialize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-inline-*.json|.github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|.github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|README.md|orbit360-platform/CHANGELOG.md|orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|orbit360-platform/docs/orbit360-live-state-v1.json|orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_TERMINAL_PUBLICATION_SURFACE:$f" >&2; exit 41 ;;
            esac
          done
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): reconcile inline one-shot terminal'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ steps.authpublish.outputs.final_head }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${ORBIT360_BRANCH}"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Project terminal state into actual PR body and enforce no replay
        if: always() && steps.materialize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-terminal.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-terminal.json" > "$RUNNER_TEMP/pr-terminal.json"
          jq -r '.body' "$RUNNER_TEMP/pr-terminal.json" > "$RUNNER_TEMP/pr-body-final.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body-final.txt" | tee "$RUNNER_TEMP/convergence-terminal-pr.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-terminal-pr.json" >/dev/null
          jq -e '.authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .activeState.runtimeReplayAllowed==false' "$LEDGER" >/dev/null
          if jq -e '.ok==true and .classification=="PASS"' "$TERMINAL" >/dev/null; then
            jq -e '.progress.productionRouteProgressPct==85 and .progress.f2TerminalPass==true and .nextAction.id=="AWAIT_EXPLICIT_GO_LIVE_AUTHORIZATION"' "$LEDGER" >/dev/null
            echo 'F2_TERMINAL_PASS'
          else
            jq -e '.progress.productionRouteProgressPct==75 and .nextAction.id=="DIAGNOSE_ROOT_CAUSE_BEFORE_ANY_FRESH_AUTHORIZATION"' "$LEDGER" >/dev/null
            echo 'F2_TERMINAL_FAIL_NO_REPLAY'
            exit 41
          fi
