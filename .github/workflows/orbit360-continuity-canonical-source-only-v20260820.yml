name: Orbit360 Canonical Single-State Runner
# SINGLE_STATE_CONTROL_PLANE_V1
# Evidence/runtime runner. Canonical operational state lives only in the ledger.

on:
  push:
    branches:
      - 'ays/orbit360-exec-*'
    paths:
      - '.github/orbit360-intents/*.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: orbit360-single-state-${{ github.sha }}
  cancel-in-progress: false

env:
  ORBIT360_CANONICAL_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  ORBIT360_REGISTRY: orbit360-platform/docs/orbit360-continuity-writer-registry-v20260820.json
  ORBIT360_OWNER: tools/orbit360-single-state-ledger-owner-v20260826.mjs
  ORBIT360_INVARIANT: tools/orbit360-single-state-invariant-v20260826.mjs
  ORBIT360_PUBLISHER: tools/orbit360-control-plane-publication-preflight-v20260825.mjs

jobs:
  single-state-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable execution commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: inspect
        name: Validate one-commit execution transport against live canonical state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == ays/orbit360-exec-* ]]
          PARENT=$(git rev-parse HEAD^)
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = '1'
          INTENT="${CHANGED[0]}"
          [[ "$INTENT" =~ ^\.github/orbit360-intents/[A-Za-z0-9._-]+\.json$ ]]
          cp "$INTENT" "$RUNNER_TEMP/orbit360-intent.json"
          BASE=$(jq -r '.canonicalBaseHead // empty' "$INTENT")
          EXPECTED=$(jq -r '.expectedLedgerRevision // empty' "$INTENT")
          [[ "$BASE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED" =~ ^[0-9]+$ ]]
          test "$PARENT" = "$BASE"
          git fetch --no-tags origin "$ORBIT360_CANONICAL_BRANCH"
          LIVE=$(git rev-parse FETCH_HEAD)
          test "$LIVE" = "$BASE"
          git checkout --force -B orbit360-canonical "$LIVE"
          node "$ORBIT360_INVARIANT"
          node "$ORBIT360_OWNER" --inspect-intent "$RUNNER_TEMP/orbit360-intent.json" > "$RUNNER_TEMP/inspect.json"
          jq -e '.ok==true and .status=="SINGLE_STATE_INTENT_VALID"' "$RUNNER_TEMP/inspect.json" >/dev/null
          echo "transition=$(jq -r '.transitionId' "$RUNNER_TEMP/inspect.json")" >> "$GITHUB_OUTPUT"
          echo "class=$(jq -r '.capabilityClass' "$RUNNER_TEMP/inspect.json")" >> "$GITHUB_OUTPUT"
          echo "state_mutation=$(jq -r '.stateMutation' "$RUNNER_TEMP/inspect.json")" >> "$GITHUB_OUTPUT"
          echo "handler=$(jq -r '.handler // ""' "$RUNNER_TEMP/inspect.json")" >> "$GITHUB_OUTPUT"
          echo "handler_ready=$(jq -r '.handlerReady' "$RUNNER_TEMP/inspect.json")" >> "$GITHUB_OUTPUT"
          test "$(jq -r '.handlerReady' "$RUNNER_TEMP/inspect.json")" = 'true'

      - name: Run source-only single-state selftest
        if: steps.inspect.outputs.transition == 'CONTROL_PLANE_SELFTEST'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT360_RELEASE_HANDLER_SELFTEST_OUT: ${{ runner.temp }}/release-handler-selftest.json
        shell: bash
        run: |
          set -euo pipefail
          node "$ORBIT360_OWNER" --selftest | tee "$RUNNER_TEMP/single-state-selftest.json"
          jq -e '.ok==true and .status=="SINGLE_STATE_CONTROL_PLANE_SELFTEST_PASS" and .projectionWrites==0 and .secondClaimBlocked==true and .staleRevisionBlocked==true' "$RUNNER_TEMP/single-state-selftest.json" >/dev/null
          RELEASE_HANDLER=$(jq -r '.executionTransitions.GO_LIVE_RELEASE_WINDOW.handler // empty' "$ORBIT360_REGISTRY")
          test -n "$RELEASE_HANDLER" && test -f "$RELEASE_HANDLER"
          node "$RELEASE_HANDLER" --source-only-selftest --out "$ORBIT360_RELEASE_HANDLER_SELFTEST_OUT"
          jq -e '.ok==true and .status=="GO_LIVE_RELEASE_HANDLER_SOURCE_ONLY_PASS" and .handlerReady==true and .fullRehashPass==true and .targetDerivedFromCandidate==true and .releasePlanPass==true and .hostingOnlyDeploy==true and .rulesDeploy==false and .rollbackPreflightPass==true and .authorizationConsumed==false and .privilegedRiskObserved==false and .secretAccess==false and .firestoreRead==false and .deployExecuted==false and .productionTouched==false' "$ORBIT360_RELEASE_HANDLER_SELFTEST_OUT" >/dev/null
          node tools/orbit360-bind-f2-browser-evidence-run-v20260824.mjs --selftest | tee "$RUNNER_TEMP/browser-binder-selftest.json"
          jq -e '.ok==true and .status=="F2_BROWSER_BINDER_CURRENT_RUN_CAUSAL_SELFTEST_PASS" and .structuralCurrentRunNetworkAttribution==true and .secondaryBrowserReproductionRequired==false and .causalPassAccepted==true and .ambiguousReclassifiedValidatorStale==true and .invalidAttributionBlocked==true and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false' "$RUNNER_TEMP/browser-binder-selftest.json" >/dev/null
          node "$ORBIT360_INVARIANT"
          test -z "$(git status --porcelain)"

      - id: claim
        name: Atomically claim risk transition in ledger before privileged capabilities
        if: steps.inspect.outputs.state_mutation == 'CLAIM_TERMINAL'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT360_PUBLICATION_CLASS: SINGLE_STATE_CLAIM
          ORBIT360_PUBLICATION_TRANSACTION_OUT: ${{ runner.temp }}/single-state-claim-publication.json
          ORBIT360_PUBLICATION_COMMIT_MESSAGE: 'gate(control-plane): claim single-state execution before privileged risk'
        shell: bash
        run: |
          set -euo pipefail
          node "$ORBIT360_OWNER" --claim "$RUNNER_TEMP/orbit360-intent.json" --run-id "$GITHUB_RUN_ID" | tee "$RUNNER_TEMP/claim.json"
          jq -e --argjson run "$GITHUB_RUN_ID" '.ok==true and .status=="SINGLE_STATE_EXECUTION_CLAIMED" and .runId==$run' "$RUNNER_TEMP/claim.json" >/dev/null
          node "$ORBIT360_PUBLISHER"
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PREPARED" and .changed==["orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json"] and .remoteCASPass==true and .pushDryRunPass==true' "$ORBIT360_PUBLICATION_TRANSACTION_OUT" >/dev/null
          node "$ORBIT360_PUBLISHER" --publish-validated "$ORBIT360_PUBLICATION_TRANSACTION_OUT" | tee "$RUNNER_TEMP/claim-publish.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PUBLISHED" and .remoteReadbackPass==true and .localReadbackPass==true' "$RUNNER_TEMP/claim-publish.json" >/dev/null

      - id: execute
        name: Execute registered handler only after canonical claim
        if: steps.inspect.outputs.state_mutation == 'CLAIM_TERMINAL' && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT360_EXECUTION_INTENT: ${{ runner.temp }}/orbit360-intent.json
          ORBIT360_EXECUTION_RUN_ID: ${{ github.run_id }}
          ORBIT360_TERMINAL_EVIDENCE: ${{ runner.temp }}/orbit360-terminal.json
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          HANDLER='${{ steps.inspect.outputs.handler }}'
          test -n "$HANDLER" && test -f "$HANDLER"
          node "$HANDLER" --intent "$ORBIT360_EXECUTION_INTENT" --run-id "$ORBIT360_EXECUTION_RUN_ID" --terminal-out "$ORBIT360_TERMINAL_EVIDENCE"
          test -f "$ORBIT360_TERMINAL_EVIDENCE"

      - id: terminal
        name: Reduce run-scoped terminal evidence to ledger only
        if: always() && steps.inspect.outputs.state_mutation == 'CLAIM_TERMINAL' && steps.claim.outcome == 'success' && steps.execute.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT360_PUBLICATION_CLASS: SINGLE_STATE_TERMINAL
          ORBIT360_PUBLICATION_TRANSACTION_OUT: ${{ runner.temp }}/single-state-terminal-publication.json
          ORBIT360_PUBLICATION_COMMIT_MESSAGE: 'gate(control-plane): reconcile single-state execution terminal'
          ORBIT360_TERMINAL_EVIDENCE: ${{ runner.temp }}/orbit360-terminal.json
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ORBIT360_TERMINAL_EVIDENCE"
          node "$ORBIT360_OWNER" --terminal "$ORBIT360_TERMINAL_EVIDENCE" | tee "$RUNNER_TEMP/terminal.json"
          node "$ORBIT360_PUBLISHER"
          node "$ORBIT360_PUBLISHER" --publish-validated "$ORBIT360_PUBLICATION_TRANSACTION_OUT" | tee "$RUNNER_TEMP/terminal-publish.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PUBLISHED" and .remoteReadbackPass==true and .localReadbackPass==true' "$RUNNER_TEMP/terminal-publish.json" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-single-state-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/inspect.json
            ${{ runner.temp }}/single-state-selftest.json
            ${{ runner.temp }}/release-handler-selftest.json
            ${{ runner.temp }}/browser-binder-selftest.json
            ${{ runner.temp }}/orbit360-terminal.json
          if-no-files-found: ignore
          retention-days: 14
