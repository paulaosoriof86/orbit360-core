name: Orbit360 Continuity Canonical Source Only
# CONTROL_PLANE_CONVERGENCE_V1
# MACRO3_INLINE_F2_V1
# MACRO3_PR_TRANSPORT_V1
# Same canonical owner; PR is only an event transport. No merge, no main, no cross-workflow dispatch.

on:
  pull_request:
    types: [opened]
    branches:
      - ays/backend-tenant-lab-v99-20260703

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: read

concurrency:
  group: orbit360-macro3-f2-one-shot
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_ACTIVATION_BRANCH: orbit360/f2-one-shot-activation-9b50d4e95cf3-20260823
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_EXPECTED_REQUEST_VERSION: F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V3
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  ORBIT360_AUTH_IDENTITY: 9b50d4e95cf32cc8e693dd184ca945e1f532521f37ea8b64f7a1c65e546baa22
  ORBIT360_ARTIFACT_ID: '9485621192'
  ORBIT360_INTENT: .github/orbit360-authorizations/f2-runtime-authorization-intent-9b50d4e95cf3-v20260823.json
  ORBIT360_MARKER: .github/orbit360-activation/f2-one-shot-9b50d4e95cf3-v20260823.json
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  BOUNDARY: orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  OWNER: tools/orbit360-continuity-transition-owner-v20260820.mjs
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_BASE_HEAD: ${{ github.event.pull_request.base.sha }}
  ORBIT360_HEAD_REF: ${{ github.event.pull_request.head.ref }}
  ORBIT360_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
  ORBIT360_BASE_REF: ${{ github.event.pull_request.base.ref }}
  ORBIT360_TRANSPORT_PR: ${{ github.event.pull_request.number }}
  ORBIT360_PR_ACTION: ${{ github.event.action }}

jobs:
  canonical-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout PR merge ref for transport validation only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact same-repository PR transport before any state mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "$ORBIT360_PR_ACTION" = 'opened'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$ORBIT360_BASE_REF" = "$ORBIT360_BRANCH"
          test "$ORBIT360_HEAD_REF" = "$ORBIT360_ACTIVATION_BRANCH"
          test "$ORBIT360_HEAD_REPO" = "$GITHUB_REPOSITORY"
          PR_JSON="$RUNNER_TEMP/transport-pr.json"
          FILES_JSON="$RUNNER_TEMP/transport-files.json"
          for i in $(seq 1 10); do
            curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${ORBIT360_TRANSPORT_PR}" > "$PR_JSON"
            M="$(jq -r '.mergeable' "$PR_JSON")"
            test "$M" != 'null' && break
            sleep 2
          done
          jq -e --arg base "$ORBIT360_BRANCH" --arg head "$ORBIT360_ACTIVATION_BRANCH" --arg repo "$GITHUB_REPOSITORY" '.state=="open" and .merged==false and .mergeable==true and .base.ref==$base and .head.ref==$head and .head.repo.full_name==$repo' "$PR_JSON" >/dev/null
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${ORBIT360_TRANSPORT_PR}/files?per_page=100" > "$FILES_JSON"
          jq -e --arg wf '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml' --arg marker "$ORBIT360_MARKER" 'length==2 and ([.[].filename]|sort)==([$wf,$marker]|sort)' "$FILES_JSON" >/dev/null
          jq -e --arg auth "$ORBIT360_AUTH_IDENTITY" --argjson artifact "$ORBIT360_ARTIFACT_ID" '.status=="USER_AUTHORIZATION_RECEIVED" and .authorizationIdentityDigest==$auth and .candidateArtifactId==$artifact and .oneShotOnly==true and .replayAllowed==false' "$ORBIT360_INTENT" >/dev/null

      - name: Prove anti-loop mechanism on the transport merge ref
        shell: bash
        run: |
          set -euo pipefail
          node --check "$OWNER"
          node --check tools/orbit360-continuity-projection-atomic-v20260820.mjs
          node --check "$CONVERGENCE"
          node --check tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          node tools/orbit360-macro3-mechanism-preflight-v20260823.mjs
          jq -e '.ok==true and .status=="MACRO3_MECHANISM_PREFLIGHT_PASS" and .allowedExecutionsAfterAccept==0 and .replayAllowed==false' "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json" >/dev/null
          rm -f "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json"

      - name: Switch working tree to exact canonical base SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$ORBIT360_BASE_HEAD"
          git checkout --force -B orbit360-canonical "$ORBIT360_BASE_HEAD"
          test "$(git rev-parse HEAD)" = "$ORBIT360_BASE_HEAD"
          test -z "$(git status --porcelain)"

      - name: Static source readiness on canonical base before consuming authorization
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg auth "$ORBIT360_AUTH_IDENTITY" --argjson artifact "$ORBIT360_ARTIFACT_ID" '.authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT" and .authorizationBoundary.preparedAuthorizationIdentityDigest==$auth and .successorCandidate.artifactId==$artifact' "$LEDGER" >/dev/null
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs "$ORBIT360_GATE_ID" | tee "$RUNNER_TEMP/f2-source-precheck.json"
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .executionAuthorized==false and .runtimeAuthorized==false and .browserAuthorized==false and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$RUNNER_TEMP/f2-source-precheck.json" >/dev/null
          if git ls-files --error-unmatch "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null 2>&1; then git restore "$EVIDENCE_DIR/preflight-sanitizado.json"; else rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"; fi
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-source.json"
          jq -e '.ok==true and .productionRouteProgressPct==75 and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-source.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          test -z "$(git status --porcelain)"

      - name: Validate explicit authorization intent and certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ORBIT360_INTENT"
          jq -e --arg auth "$ORBIT360_AUTH_IDENTITY" --argjson artifact "$ORBIT360_ARTIFACT_ID" '.status=="USER_AUTHORIZATION_RECEIVED" and .authorizationIdentityDigest==$auth and .candidateArtifactId==$artifact and .scope.runtimeReadOnly==true and .scope.secrets==true and .scope.firestoreRead==true and .scope.browser==true and .scope.writes==false and .scope.deploy==false and .scope.production==false and .scope.main==false and .scope.merge==false and .oneShotOnly==true and .replayAllowed==false' "$ORBIT360_INTENT" >/dev/null
          test "$(jq -r '.candidateArtifactDigest' "$ORBIT360_INTENT")" = "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")"
          test "$(jq -r '.candidateSourceHead' "$ORBIT360_INTENT")" = "$(jq -r '.successorCandidate.sourceHead' "$LEDGER")"
          test "$(jq -r '.authorizationIdentity.digest' "$BOUNDARY")" = "$ORBIT360_AUTH_IDENTITY"
          test ! -e ".github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-${ORBIT360_AUTH_IDENTITY:0:12}-v20260820.json"
          test ! -e ".github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-${ORBIT360_AUTH_IDENTITY:0:12}-v20260820.json"
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORBIT360_ARTIFACT_ID}" > "$RUNNER_TEMP/f2-artifact.json"
          jq -e --argjson id "$ORBIT360_ARTIFACT_ID" --arg digest "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/f2-artifact.json" >/dev/null

      - id: materialize
        name: Persist AUTH, request and F2_RUNTIME_ATTEMPT_ACCEPT once
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$ORBIT360_AUTH_IDENTITY" > "$RUNNER_TEMP/f2-auth.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_AUTHORIZATION_PERSISTED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-auth.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_REQUEST_MATERIALIZE --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$ORBIT360_AUTH_IDENTITY" --parent-head "$ORBIT360_BASE_HEAD" > "$RUNNER_TEMP/f2-request.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_REQUEST_MATERIALIZED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-request.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_ATTEMPT_ACCEPT --expected-revision "$LR" --expected-package-revision "$PRV" --runtime-run-id "$GITHUB_RUN_ID" > "$RUNNER_TEMP/f2-accept.json"
          jq -e --argjson run "$GITHUB_RUN_ID" '.ok==true and .status=="ORBIT360_F2_RUNTIME_ATTEMPT_ACCEPTED_ONE_SHOT" and .runtimeRunId==$run and .replayAllowed==false' "$RUNNER_TEMP/f2-accept.json" >/dev/null
          REQUEST=$(jq -r '.authorizationBoundary.activeRequestPath' "$LEDGER")
          jq -e --argjson run "$GITHUB_RUN_ID" '.allowedExecutions==0 and .runtimeAttemptAccepted==true and .runtimeAttemptCount==1 and .runtimeRunId==$run and .replayAllowed==false and .consumed==false' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          # anti-loop contract literals: allowedExecutions==0 runtimeAttemptAccepted

      - name: Validate accepted state before publication
        shell: bash
        run: |
          set -euo pipefail
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-attempt.json"
          jq -e '.ok==true and .authorized==true and .authorizationPersisted==true and .requestMaterialized==true and .runtimeAttemptAccepted==true and .runtimeAllowed==false and .productionRouteProgressPct==75' "$RUNNER_TEMP/convergence-attempt.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: authpublish
        name: Publish accepted one-shot state to canonical branch with remote CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|\
              .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|\
              .github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|\
              README.md|orbit360-platform/CHANGELOG.md|\
              orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|\
              orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|\
              orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|\
              orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|\
              orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|\
              orbit360-platform/docs/orbit360-live-state-v1.json|\
              orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|\
              tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|\
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|\
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_AUTH_PUBLICATION_SURFACE:$f" >&2; exit 41 ;;
            esac
          done
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): accept one-shot runtime attempt'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$ORBIT360_BASE_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$ORBIT360_BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_REQUEST_FILE=${{ steps.materialize.outputs.request }}" >> "$GITHUB_ENV"

      - name: Converge PR #5 body before runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-patch.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-patch.json" > "$RUNNER_TEMP/pr5.json"
          jq -r '.body' "$RUNNER_TEMP/pr5.json" > "$RUNNER_TEMP/pr5-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr5-body.txt" | tee "$RUNNER_TEMP/convergence-pr5.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==true and .requestMaterialized==true and .runtimeAttemptAccepted==true and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-pr5.json" >/dev/null

      - id: sourceguard
        name: Verify accepted request and reusable rootfixes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$ORBIT360_REQUEST_FILE"
          test "$(jq -r '.status' "$REQUEST")" = 'RUNTIME_ATTEMPT_ACCEPTED_PREFLIGHT_PENDING'
          test "$(jq -r '.allowedExecutions' "$REQUEST")" = '0'
          test "$(jq -r '.runtimeAttemptAccepted' "$REQUEST")" = 'true'
          test "$(jq -r '.runtimeRunId' "$REQUEST")" = "$GITHUB_RUN_ID"
          AUTHORITY=tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json
          CERT="$(jq -r '.candidateCertificationEvidence // ""' "$AUTHORITY")"
          test -n "$CERT" && test -f "$CERT"
          echo "ORBIT360_CANDIDATE_CERTIFICATION_EVIDENCE=$CERT" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_ARTIFACT_ID=$(jq -r '.successorCandidate.artifactId' "$LEDGER")" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_SOURCE_HEAD=$(jq -r '.successorCandidate.sourceHead' "$LEDGER")" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_ZIP_SHA256=$(jq -r '.successorCandidate.zipSha256' "$LEDGER")" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_MANIFEST_SHA256=$(jq -r '.successorCandidate.manifestSha256' "$LEDGER")" >> "$GITHUB_ENV"
          ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs

      - id: register
        name: Register F2 runtime lifecycle transiently
        if: steps.sourceguard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          git diff --check

      - id: gate
        name: Mandatory F2 gate before artifact/provider/browser
        if: steps.register.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          jq -e --arg run "$GITHUB_RUN_ID" --argjson artifact "$ORBIT360_ARTIFACT_ID" '.ok==true and .status=="GO_GATE_CONTRACT" and .classification=="GO_F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY" and .runId==$run and .candidateArtifactId==$artifact and .runtimeAttemptAccepted==true and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .runtimeAuthorized==true and .browserAuthorized==true and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" >/dev/null

      - id: candidate
        name: Download and fully verify exact certified candidate after GO
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$RUNNER_TEMP/f2-artifact-outer.zip"; OUTER_DIR="$RUNNER_TEMP/f2-outer"; CANDIDATE_DIR="$RUNNER_TEMP/f2-candidate"
          rm -rf "$OUTER" "$OUTER_DIR" "$CANDIDATE_DIR"; mkdir -p "$OUTER_DIR" "$CANDIDATE_DIR"
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORBIT360_ARTIFACT_ID}/zip" -o "$OUTER"
          unzip -q "$OUTER" -d "$OUTER_DIR"
          mapfile -t FILES < <(find "$OUTER_DIR" -maxdepth 1 -type f -printf '%f\n' | sort); test "${#FILES[@]}" = '1'
          INNER="$OUTER_DIR/${FILES[0]}"
          test "$(sha256sum "$INNER" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_ZIP_SHA256"
          unzip -q "$INNER" -d "$CANDIDATE_DIR"
          test "$(sha256sum "$CANDIDATE_DIR/orbit360-package-manifest.json" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_MANIFEST_SHA256"
          ORBIT360_F2_CANDIDATE_DIR="$CANDIDATE_DIR" ORBIT360_F2_CANDIDATE_SOURCE_EVIDENCE="$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" node tools/orbit360-f2-exact-candidate-source-validator-v20260819.mjs
          jq -e --argjson artifact "$ORBIT360_ARTIFACT_ID" '.ok==true and .status=="F2_EXACT_CANDIDATE_SOURCE_VALIDATION_PASS" and .candidateArtifactId==$artifact and .fullRehashPass==true and .inicioFiniteRootfixPass==true and .routerReadinessRootfixPass==true and .storeGetRootfixPass==true' "$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" >/dev/null
          echo "ORBIT360_F2_CANDIDATE_DIR=$CANDIDATE_DIR" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_MANIFEST_STATUS=$(jq -r '.status' "$CANDIDATE_DIR/orbit360-package-manifest.json")" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_MANIFEST_FILE_COUNT=$(jq -r '.fileCount' "$CANDIDATE_DIR/orbit360-package-manifest.json")" >> "$GITHUB_ENV"

      - id: dependencies
        name: Install runtime dependencies after GO
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0 >/dev/null
          BROWSER_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_EXECUTABLE"
          echo "ORBIT360_SYSTEM_BROWSER_EXECUTABLE=$BROWSER_EXECUTABLE" >> "$GITHUB_ENV"

      - id: provider
        name: Bind read-only provider only after GO
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          SA_FILE="$RUNNER_TEMP/orbit360-f2-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$SA_FILE"; chmod 600 "$SA_FILE"
          jq -e '.type=="service_account" and (.project_id|length)>0 and (.client_email|length)>0 and (.private_key|length)>0' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"

      - id: identity
        name: Resolve exact protected F2 identity read-only
        if: steps.provider.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_SMOKE_IDENTITY_EVIDENCE="$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" ORBIT360_SMOKE_RUN_ID="$GITHUB_RUN_ID" ORBIT360_SMOKE_TARGET_EMAIL_HASH="$ORBIT360_TARGET_EMAIL_HASH" ORBIT360_SMOKE_TARGET_ADVISOR_ID="$ORBIT360_TARGET_ADVISOR_ID" node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .targetIdentityMatches==true and .requiredRolesPresent==true and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" >/dev/null

      - id: integrity_before
        name: Integrity snapshot before browser
        if: steps.identity.outcome == 'success'
        continue-on-error: true
        run: node tools/orbit360-f2-data-integrity-readonly-v20260818.mjs before

      - id: serve
        name: Serve exact candidate on loopback
        if: steps.integrity_before.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$ORBIT360_F2_CANDIDATE_DIR" > "$RUNNER_TEMP/f2-http.log" 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/orbit360-package-manifest.json >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/orbit360-package-manifest.json >/dev/null
          echo 'ORBIT360_F2_URL=http://127.0.0.1:4173/' >> "$GITHUB_ENV"

      - id: browser
        name: Execute complete F2 browser acceptance
        if: steps.serve.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_REQUEST="$RUNNER_TEMP/f2-runtime-request-v3-adapter.json"
          jq --arg status "$ORBIT360_F2_MANIFEST_STATUS" --argjson count "$ORBIT360_F2_MANIFEST_FILE_COUNT" '. + {candidate:{manifestStatus:$status,fileCount:$count}}' "$ORBIT360_REQUEST_FILE" > "$RUNTIME_REQUEST"
          ORBIT360_REQUEST_FILE="$RUNTIME_REQUEST" ORBIT360_F2_OUT="$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json" node tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs

      - id: integrity
        name: Integrity snapshot after browser and compare
        if: always() && steps.integrity_before.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-f2-data-integrity-readonly-v20260818.mjs after
          node tools/orbit360-f2-compare-integrity-v20260818.mjs

      - id: terminal_evidence
        name: Build sanitized terminal evidence for every accepted attempt
        if: always() && steps.materialize.outcome == 'success'
        shell: bash
        env:
          SOURCEGUARD_OUTCOME: ${{ steps.sourceguard.outcome }}
          REGISTER_OUTCOME: ${{ steps.register.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          INTEGRITY_BEFORE_OUTCOME: ${{ steps.integrity_before.outcome }}
          SERVE_OUTCOME: ${{ steps.serve.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        run: |
          set -euo pipefail
          FINAL="$EVIDENCE_DIR/f2-runtime-terminal-inline-${GITHUB_RUN_ID}.json"
          B="$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json"
          I="$EVIDENCE_DIR/f2-integrity-before-after-v20260818.json"
          C='PIPELINE_MECHANISM_FAILURE'; E='F2_RUNTIME_STAGE_FAILED'; OK=false
          if [ -f "$B" ] && [ -f "$I" ] && jq -e '.ok==true and .status=="F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_PASS" and .crossTenantDenied==true and .runtime.ready==true and .runtime.writeEnabled==false and .localWriteGuard.blocked==true and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and (.writeSignals|length)==0 and (.pageErrors|length)==0 and (.consoleErrors|length)==0' "$B" >/dev/null && jq -e '.ok==true and .status=="F2_INTEGRITY_BEFORE_AFTER_PASS" and .countsIdentical==true and .digestsIdentical==true' "$I" >/dev/null; then
            OK=true; C='PASS'; E='PASS'
          elif [ "$SOURCEGUARD_OUTCOME" != 'success' ]; then C='VALIDATOR_STALE'; E='F2_SOURCEGUARD_FAILED'
          elif [ "$REGISTER_OUTCOME" != 'success' ]; then C='VALIDATOR_STALE'; E='F2_REGISTER_FAILED'
          elif [ "$GATE_OUTCOME" != 'success' ]; then C='PIPELINE_MECHANISM_FAILURE'; E='F2_GATE_FAILED'
          elif [ "$CANDIDATE_OUTCOME" != 'success' ]; then C='DATA_CONTRACT_FAILURE'; E='F2_CANDIDATE_VERIFICATION_FAILED'
          elif [ "$DEPENDENCIES_OUTCOME" != 'success' ]; then C='ENVIRONMENT_FAILURE'; E='F2_DEPENDENCIES_FAILED'
          elif [ "$PROVIDER_OUTCOME" != 'success' ]; then C='ENVIRONMENT_FAILURE'; E='F2_PROVIDER_BIND_FAILED'
          elif [ "$IDENTITY_OUTCOME" != 'success' ]; then C='SECURITY_FAILURE'; E='F2_IDENTITY_RESOLUTION_FAILED'
          elif [ "$INTEGRITY_BEFORE_OUTCOME" != 'success' ]; then C='DATA_CONTRACT_FAILURE'; E='F2_INTEGRITY_BEFORE_FAILED'
          elif [ "$SERVE_OUTCOME" != 'success' ]; then C='ENVIRONMENT_FAILURE'; E='F2_LOOPBACK_SERVE_FAILED'
          elif [ "$BROWSER_OUTCOME" != 'success' ]; then
            C='FUNCTIONAL_DEFECT'; E='F2_BROWSER_FAILED'
            if [ -f "$B" ]; then C="$(jq -r '.classification // "FUNCTIONAL_DEFECT"' "$B")"; E="$(jq -r '.error // "F2_BROWSER_FAILED"' "$B")"; fi
          elif [ "$INTEGRITY_OUTCOME" != 'success' ]; then C='DATA_CONTRACT_FAILURE'; E='F2_INTEGRITY_AFTER_FAILED'
          fi
          jq -n --arg run "$GITHUB_RUN_ID" --arg request "$ORBIT360_REQUEST_FILE" --argjson artifact "$ORBIT360_ARTIFACT_ID" --arg c "$C" --arg e "$E" --argjson ok "$OK" '{schemaVersion:"orbit360-f2-terminal-v5-pr-transport",ok:$ok,status:(if $ok then "F2_PRODUCTIVE_ACCEPTANCE_PASS" else "F2_PRODUCTIVE_ACCEPTANCE_FAIL" end),classification:$c,error:(if $ok then null else $e end),runId:$run,request:$request,candidateArtifactId:$artifact,runtimeAttemptAccepted:true,allowedExecutions:0,browserMatrixPass:$ok,integrityBeforeAfterPass:$ok,zeroCrossTenant:$ok,zeroUnexpectedWrites:$ok,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,publicationExecuted:false,productionHostingTouched:false,containsPII:false,containsSecrets:false}' > "$FINAL"
          echo "evidence=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Restore transient runtime mutations
        if: always() && steps.materialize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/orbit360-validar-gate-contracts-v20260717.mjs tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json "$EVIDENCE_DIR/preflight-sanitizado.json" "$EVIDENCE_DIR/f2-data-integrity-before-v20260818.json" "$EVIDENCE_DIR/f2-data-integrity-after-v20260818.json" "$EVIDENCE_DIR/f2-integrity-before-after-v20260818.json"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git restore "$f"; else rm -f "$f"; fi
          done
          rm -f "$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" "$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json"
          rm -rf node_modules
          test -f "${{ steps.terminal_evidence.outputs.evidence }}"

      - name: Reconcile terminal exactly once through canonical owner
        if: always() && steps.materialize.outcome == 'success'
        env:
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TERMINAL"
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_TERMINAL_RECONCILE_GENERIC --expected-revision "$LR" --expected-package-revision "$PRV" --terminal-evidence "$TERMINAL" | tee "$RUNNER_TEMP/f2-terminal-reconcile.json"
          jq -e '.ok==true and .status=="F2_RUNTIME_TERMINAL_RECONCILED_GENERIC" and .replayAllowed==false' "$RUNNER_TEMP/f2-terminal-reconcile.json" >/dev/null
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-terminal.json"
          jq -e '.ok==true and .authorized==false and .authorizationPersisted==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-terminal.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: terminalpublish
        name: Publish terminal state to canonical branch with remote CAS
        if: always() && steps.materialize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-inline-*.json|\
              .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|\
              .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|\
              .github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|\
              README.md|orbit360-platform/CHANGELOG.md|\
              orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|\
              orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|\
              orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|\
              orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|\
              orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|\
              orbit360-platform/docs/orbit360-live-state-v1.json|\
              orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|\
              tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|\
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|\
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_TERMINAL_PUBLICATION_SURFACE:$f" >&2; exit 41 ;;
            esac
          done
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): reconcile inline one-shot terminal'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ steps.authpublish.outputs.final_head }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$ORBIT360_BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Project terminal state into PR #5 and enforce no replay
        if: always() && steps.materialize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-terminal.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-terminal.json" > "$RUNNER_TEMP/pr5-terminal.json"
          jq -r '.body' "$RUNNER_TEMP/pr5-terminal.json" > "$RUNNER_TEMP/pr5-body-final.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr5-body-final.txt" | tee "$RUNNER_TEMP/convergence-terminal-pr.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-terminal-pr.json" >/dev/null
          jq -e '.authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .activeState.runtimeReplayAllowed==false' "$LEDGER" >/dev/null
          if jq -e '.ok==true and .classification=="PASS"' "$TERMINAL" >/dev/null; then
            jq -e '.progress.productionRouteProgressPct==85 and .progress.f2TerminalPass==true and .nextAction.id=="AWAIT_EXPLICIT_GO_LIVE_AUTHORIZATION"' "$LEDGER" >/dev/null
            echo 'F2_TERMINAL_PASS'
          else
            jq -e '.progress.productionRouteProgressPct==75 and .nextAction.id=="DIAGNOSE_ROOT_CAUSE_BEFORE_ANY_FRESH_AUTHORIZATION"' "$LEDGER" >/dev/null
            echo 'F2_TERMINAL_FAIL_NO_REPLAY'
            exit 41
          fi
