name: Orbit360 Continuity Canonical Source Only
# Single-writer, revision-aware control-plane bridge. Never executes runtime/browser/secrets/Firestore itself.

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'
      - 'orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'
      - 'orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs'
      - 'tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs'
      - '.github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json'
      - '.github/orbit360-authorizations/f2-runtime-one-shot-intent-v20260820.json'
      - '.github/orbit360-authorizations/f2-terminal-reconcile-intent-*-v20260820.json'
      - '.github/orbit360-authorizations/f2-boundary-refresh-intent-*-v20260820.json'
      - '.github/orbit360-authorizations/f2-projection-reconcile-intent-*-v20260820.json'
      - '.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json'
      - '.github/orbit360-requests/f2-functional-defect-successor-promotion-*.json'
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
  workflow_dispatch:
    inputs:
      bridge_action:
        description: 'Source-only bridge action'
        required: true
        default: verify
        type: choice
        options: [verify, persist-authorization, materialize-request, terminal-reconcile, boundary-refresh, projection-reconcile, functional-successor-promotion]
      authorization_identity:
        description: 'F2 authorization identity SHA-256 (active or historical according to action)'
        required: false
        type: string
      runtime_run_id:
        description: 'Completed F2 runtime run id (terminal-reconcile/boundary-refresh)'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  statuses: write
  pull-requests: read
concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  canonical-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail-closed CAS and source-only preflight
        shell: bash
        env:
          BRANCH: ays/backend-tenant-lab-v99-20260703
          INPUT_ACTION: ${{ inputs.bridge_action || 'verify' }}
          INPUT_AUTH: ${{ inputs.authorization_identity || '' }}
          INPUT_RUNTIME_RUN_ID: ${{ inputs.runtime_run_id || '' }}
        run: |
          set -euo pipefail
          START_HEAD=$(git rev-parse HEAD)
          RUNTIME_INTENT='.github/orbit360-authorizations/f2-runtime-one-shot-intent-v20260820.json'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          mapfile -t TERMINAL_INTENTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-authorizations/f2-terminal-reconcile-intent-[a-f0-9]\{12\}-v20260820\.json$' || true)
          mapfile -t REFRESH_INTENTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-authorizations/f2-boundary-refresh-intent-[a-f0-9]\{12\}-v20260820\.json$' || true)
          mapfile -t PROJECTION_INTENTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-authorizations/f2-projection-reconcile-intent-[a-f0-9]\{12\}-v20260820\.json$' || true)
          mapfile -t FUNCTIONAL_PROMOTION_REQUESTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-requests/f2-functional-defect-successor-promotion-[0-9]\+-v20260820\.json$' || true)
          MUTATION_REQUESTED=false
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_ACTION" != 'verify' ]; then MUTATION_REQUESTED=true; fi
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            if printf '%s\n' "${CHANGED[@]}" | grep -Fx "$RUNTIME_INTENT" >/dev/null || [ "${#TERMINAL_INTENTS[@]}" = '1' ] || [ "${#REFRESH_INTENTS[@]}" = '1' ] || [ "${#PROJECTION_INTENTS[@]}" = '1' ] || [ "${#FUNCTIONAL_PROMOTION_REQUESTS[@]}" = '1' ]; then MUTATION_REQUESTED=true; fi
          fi
          git fetch origin "$BRANCH"
          REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
          if [ "$REMOTE_HEAD" != "$START_HEAD" ]; then
            if [ "$MUTATION_REQUESTED" = 'true' ]; then echo "REMOTE_CAS_MISMATCH_MUTATION:$REMOTE_HEAD"; exit 54; fi
            git merge-base --is-ancestor "$START_HEAD" "$REMOTE_HEAD" || { echo "REMOTE_CAS_NON_DESCENDANT:$REMOTE_HEAD"; exit 54; }
            mapfile -t REMOTE_DRIFT < <(git diff --name-only "$START_HEAD..$REMOTE_HEAD")
            for f in "${REMOTE_DRIFT[@]}"; do
              case "$f" in
                .github/orbit360-requests/f2-runtime-observer-successor-*.json|.github/workflows/orbit360-f2-runtime-observer-v20260820.yml|orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-observer-dispatch-*-v20260820.json|orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-dispatch-*-v20260820.json|orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-pre-gate-*-v20260820.json) ;;
                *) echo "REMOTE_CAS_MISMATCH_NON_OBSERVER_DRIFT:$f"; exit 54;;
              esac
            done
          fi
          STATUS=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').status")
          STEP=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').resumeProtocol.firstIncompleteStep")
          test "$STATUS" = CLOSED_PASS || exit 58
          ACTION="$INPUT_ACTION"; AUTH_IDENTITY="$INPUT_AUTH"; RUNTIME_RUN_ID="$INPUT_RUNTIME_RUN_ID"; PROMOTION_EVIDENCE=''
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if printf '%s\n' "${CHANGED[@]}" | grep -Fx "$RUNTIME_INTENT" >/dev/null; then
              test "${#CHANGED[@]}" = '1' || { echo INTENT_COMMIT_SURFACE_INVALID; exit 62; }
              jq -e '.schemaVersion=="orbit360-f2-runtime-one-shot-intent-v1" and .approved==true and .oneShot==true and .consumed==false and .replayAllowed==false and .runtimeProfile=="F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY" and (.authorizationIdentityDigest|test("^[a-f0-9]{64}$")) and (.parentHead|test("^[a-f0-9]{40}$"))' "$RUNTIME_INTENT" >/dev/null
              test "$(jq -r '.parentHead' "$RUNTIME_INTENT")" = "$(git rev-parse HEAD^)" || { echo INTENT_PARENT_HEAD_MISMATCH; exit 63; }
              ACTION=consume-intent; AUTH_IDENTITY=$(jq -r '.authorizationIdentityDigest' "$RUNTIME_INTENT")
            elif [ "${#TERMINAL_INTENTS[@]}" = '1' ]; then
              test "${#CHANGED[@]}" = '1' || { echo TERMINAL_INTENT_COMMIT_SURFACE_INVALID; exit 64; }
              TERMINAL_INTENT="${TERMINAL_INTENTS[0]}"
              jq -e '.schemaVersion=="orbit360-f2-terminal-reconcile-intent-v1" and .approved==true and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .replayAllowed==false and (.authorizationIdentityDigest|test("^[a-f0-9]{64}$")) and (.runtimeRunId|type=="number") and .runtimeRunId>0' "$TERMINAL_INTENT" >/dev/null
              ACTION=terminal-reconcile; AUTH_IDENTITY=$(jq -r '.authorizationIdentityDigest' "$TERMINAL_INTENT"); RUNTIME_RUN_ID=$(jq -r '.runtimeRunId' "$TERMINAL_INTENT")
            elif [ "${#REFRESH_INTENTS[@]}" = '1' ]; then
              test "${#CHANGED[@]}" = '1' || { echo REFRESH_INTENT_COMMIT_SURFACE_INVALID; exit 66; }
              REFRESH_INTENT="${REFRESH_INTENTS[0]}"
              jq -e '.schemaVersion=="orbit360-f2-boundary-refresh-intent-v1" and .approved==true and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .authorizationGranted==false and .requestMaterializationAllowed==false and .replayAllowed==false and (.priorAuthorizationIdentityDigest|test("^[a-f0-9]{64}$")) and (.priorRuntimeRunId|type=="number") and .priorRuntimeRunId>0' "$REFRESH_INTENT" >/dev/null
              ACTION=boundary-refresh; AUTH_IDENTITY=$(jq -r '.priorAuthorizationIdentityDigest' "$REFRESH_INTENT"); RUNTIME_RUN_ID=$(jq -r '.priorRuntimeRunId' "$REFRESH_INTENT")
            elif [ "${#PROJECTION_INTENTS[@]}" = '1' ]; then
              test "${#CHANGED[@]}" = '1' || { echo PROJECTION_INTENT_COMMIT_SURFACE_INVALID; exit 68; }
              PROJECTION_INTENT="${PROJECTION_INTENTS[0]}"
              jq -e '.schemaVersion=="orbit360-f2-projection-reconcile-intent-v1" and .approved==true and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .authorizationGranted==false and .requestMaterializationAllowed==false and .replayAllowed==false and (.authorizationIdentityDigest|test("^[a-f0-9]{64}$"))' "$PROJECTION_INTENT" >/dev/null
              ACTION=projection-reconcile; AUTH_IDENTITY=$(jq -r '.authorizationIdentityDigest' "$PROJECTION_INTENT")
            elif [ "${#FUNCTIONAL_PROMOTION_REQUESTS[@]}" = '1' ]; then
              PROMOTION_REQUEST="${FUNCTIONAL_PROMOTION_REQUESTS[0]}"
              for f in "${CHANGED[@]}"; do
                case "$f" in
                  "$PROMOTION_REQUEST"|.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml|.github/workflows/orbit360-f2-functional-defect-successor-promotion-sourceonly-v20260820.yml) ;;
                  *) echo "FUNCTIONAL_PROMOTION_COMMIT_SURFACE_INVALID:$f"; exit 69;;
                esac
              done
              jq -e '.schemaVersion=="orbit360-f2-functional-defect-successor-promotion-request-v1" and .approved==true and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false and .expectedLedgerRevision==24 and .expectedPackageRevision==18 and .candidateArtifactId==9433944723 and .candidateSourceHead=="c3bb825da2b1ecae08dabc2034c753482b086fec" and .canonicalTriggerRevision==1 and .candidateEvidence=="orbit360-platform/runtime-gate-crm-v20260716/f2-successor-client-projection-rootfix-v20260820.json" and .oneShot==true and .replayAllowed==false and .containsPII==false and .containsSecrets==false' "$PROMOTION_REQUEST" >/dev/null
              ACTION=functional-successor-promotion
              PROMOTION_EVIDENCE=$(jq -r '.candidateEvidence' "$PROMOTION_REQUEST")
            else ACTION=verify; fi
          fi
          case "$ACTION:$STEP" in
            verify:*) ;;
            persist-authorization:F2-RUNTIME-AUTHORIZATION) ;;
            materialize-request:F2-RUNTIME-REQUEST-MATERIALIZATION) ;;
            consume-intent:F2-RUNTIME-AUTHORIZATION) ;;
            terminal-reconcile:F2-RUNTIME-PREFLIGHT) ;;
            boundary-refresh:F2-RUNTIME-AUTHORIZATION-BOUNDARY-REFRESH) ;;
            projection-reconcile:F2-RUNTIME-AUTHORIZATION) ;;
            functional-successor-promotion:F2-RUNTIME-PREFLIGHT) ;;
            *) echo "BRIDGE_ACTION_STEP_MISMATCH:$ACTION:$STEP"; exit 59;;
          esac
          if [ "$ACTION" != verify ] && [ "$ACTION" != functional-successor-promotion ]; then echo "$AUTH_IDENTITY" | grep -Eq '^[a-f0-9]{64}$' || { echo AUTH_IDENTITY_REQUIRED; exit 60; }; fi
          if [ "$ACTION" = terminal-reconcile ]; then
            PREPARED=$(node -p "require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json').authorizationIdentity.digest"); test "$AUTH_IDENTITY" = "$PREPARED" || exit 61
            echo "$RUNTIME_RUN_ID" | grep -Eq '^[0-9]+$' || exit 65
            node --check tools/orbit360-continuity-transition-owner-v20260820.mjs
            REQUEST=$(node -p "require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json').activeRequestPath")
            TERMINAL="orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-dispatch-${AUTH_IDENTITY:0:12}-v20260820.json"
            test -f "$REQUEST" && test -f "$TERMINAL"
            jq -e --arg run "$RUNTIME_RUN_ID" --arg request "$REQUEST" '.status=="F2_PRODUCTIVE_ACCEPTANCE_FAIL" and .classification=="VALIDATOR_STALE" and (.runId|tostring)==$run and .request==$request and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .publicationExecuted==false and .productionHostingTouched==false and .containsPII==false and .containsSecrets==false' "$TERMINAL" >/dev/null
          elif [ "$ACTION" = boundary-refresh ]; then
            echo "$RUNTIME_RUN_ID" | grep -Eq '^[0-9]+$' || exit 67
            node --check tools/orbit360-continuity-transition-owner-v20260820.mjs
            node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
            BOUNDARY='orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'
            test "$(jq -r '.status' "$BOUNDARY")" = 'CONSUMED_FAIL_VALIDATOR_STALE_AWAITING_FRESH_BOUNDARY'
            test "$(jq -r '.terminalRunId' "$BOUNDARY")" = "$RUNTIME_RUN_ID"
            test "$(jq -r '.authorizationIdentity.digest' "$BOUNDARY")" = "$AUTH_IDENTITY"
          elif [ "$ACTION" = projection-reconcile ]; then
            BOUNDARY='orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'
            test "$(jq -r '.authorizationIdentity.digest' "$BOUNDARY")" = "$AUTH_IDENTITY"
            jq -e '.status=="PREPARED_SOURCE_ONLY_AWAITING_EXPLICIT_USER_AUTHORIZATION" and .authorized==false and .authorizationPersisted==false and .requestMaterialized==false and .runtimeAllowed==false' "$BOUNDARY" >/dev/null
            node tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs
          elif [ "$ACTION" = functional-successor-promotion ]; then
            node --check tools/orbit360-f2-functional-defect-successor-promotion-v20260820.mjs
            test -n "$PROMOTION_EVIDENCE" && test -f "$PROMOTION_EVIDENCE"
            jq -e '.ok==true and .status=="F2_SUCCESSOR_CLIENT_PROJECTION_ROOTFIX_SOURCEONLY_CERTIFIED" and .candidateArtifactId==9433944723 and .baseArtifactId==9395391426 and .deltaCount==1 and .deltaPaths==["core/crmkit.js"] and .unchangedFileCount==193 and .fileCount==194 and .syntheticRootfixPass==true and .fullRehashPass==true and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false and .writes==0 and .deployExecuted==false and .productionTouched==false' "$PROMOTION_EVIDENCE" >/dev/null
          else
            if [ "$ACTION" != verify ]; then PREPARED=$(node -p "require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json').authorizationIdentity.digest"); test "$AUTH_IDENTITY" = "$PREPARED" || exit 61; fi
            node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
          fi
          echo "START_HEAD=$START_HEAD" >> "$GITHUB_ENV"; echo "ACTION=$ACTION" >> "$GITHUB_ENV"; echo "CURRENT_STEP=$STEP" >> "$GITHUB_ENV"; echo "AUTH_IDENTITY=$AUTH_IDENTITY" >> "$GITHUB_ENV"; echo "RUNTIME_RUN_ID=$RUNTIME_RUN_ID" >> "$GITHUB_ENV"; echo "PROMOTION_EVIDENCE=$PROMOTION_EVIDENCE" >> "$GITHUB_ENV"

      - name: Persist already-granted authorization source-only
        if: env.ACTION == 'persist-authorization' || env.ACTION == 'consume-intent'
        shell: bash
        run: |
          set -euo pipefail; LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision"); PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --authorization-identity "$AUTH_IDENTITY"
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
      - name: Materialize exactly one immutable successor request source-only
        if: env.ACTION == 'materialize-request' || env.ACTION == 'consume-intent'
        shell: bash
        run: |
          set -euo pipefail; LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision"); PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition F2_RUNTIME_REQUEST_MATERIALIZE --authorization-identity "$AUTH_IDENTITY" --parent-head "$START_HEAD"
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
      - name: Reconcile consumed F2 terminal runtime source-only
        if: env.ACTION == 'terminal-reconcile'
        shell: bash
        run: |
          set -euo pipefail; LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision"); PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition F2_RUNTIME_TERMINAL_RECONCILE --authorization-identity "$AUTH_IDENTITY" --runtime-run-id "$RUNTIME_RUN_ID"
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
      - name: Prepare fresh F2 authorization boundary source-only
        if: env.ACTION == 'boundary-refresh'
        shell: bash
        run: |
          set -euo pipefail; LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision"); PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision"); NEXT_LR=$((LR+1))
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition F2_RUNTIME_AUTHORIZATION_BOUNDARY_REFRESH
          # Canonical boundary generator is the final boundary writer; owner only advances revisioned state.
          node tools/orbit360-f2-runtime-authorization-boundary-v20260820.mjs
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$NEXT_LR"
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
          node tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs
      - name: Reconcile canonical projections source-only
        if: env.ACTION == 'projection-reconcile'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision")
          BEFORE=$(node -p "require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json').authorizationIdentity.digest")
          node tools/orbit360-f2-runtime-authorization-boundary-v20260820.mjs
          AFTER=$(node -p "require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json').authorizationIdentity.digest")
          test "$BEFORE" = "$AFTER" && test "$AFTER" = "$AUTH_IDENTITY"
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$LR"
          node tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step F2-RUNTIME-AUTHORIZATION --expected-package-status CLOSED_PASS
          node -e "const fs=require('fs'),L=require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'),P=require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'),B=require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json');fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/f2-projection-reconcile-v20260820.json',JSON.stringify({schemaVersion:'orbit360-f2-projection-reconcile-v1',ok:true,status:'F2_CANONICAL_PROJECTION_RECONCILED_SOURCE_ONLY',ledgerRevision:L.revision,packageRevision:P.revision,authorizationIdentitySha256:B.authorizationIdentity.digest,authorized:false,requestMaterialized:false,runtimeAllowed:false,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,writes:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false},null,2)+'\n')"

      - name: Promote certified F2 functional rootfix successor source-only
        if: env.ACTION == 'functional-successor-promotion'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision")
          PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          node tools/orbit360-f2-functional-defect-successor-promotion-v20260820.mjs --expected-ledger "$LR" --expected-package "$PR" --evidence "$PROMOTION_EVIDENCE" | tee "$RUNNER_TEMP/promotion.json"
          jq -e '.ok==true and .status=="F2_FUNCTIONAL_DEFECT_SUCCESSOR_PROMOTED_SOURCE_ONLY" and .toLedgerRevision==25 and .toPackageRevision==19 and .candidateArtifactId==9433944723 and .authorizationGranted==false and .requestMaterialized==false and .runtimeAllowed==false and .writes==0' "$RUNNER_TEMP/promotion.json" >/dev/null
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision 25
          node tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs | tee "$RUNNER_TEMP/cp11.json"
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs | tee "$RUNNER_TEMP/composite.json"
          ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step F2-RUNTIME-AUTHORIZATION --expected-package-status CLOSED_PASS | tee "$RUNNER_TEMP/readback.json"
          jq -n --argjson p "$(cat "$RUNNER_TEMP/promotion.json")" --argjson c "$(cat "$RUNNER_TEMP/cp11.json")" --argjson i "$(cat "$RUNNER_TEMP/composite.json")" --argjson r "$(cat "$RUNNER_TEMP/readback.json")" '{schemaVersion:"orbit360-f2-functional-defect-successor-promotion-evidence-v2",ok:true,status:"F2_FUNCTIONAL_DEFECT_SUCCESSOR_PROMOTION_CANONICAL_SOURCEONLY_PASS",publicationOwner:".github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml",promotion:$p,cp11Audit:$c,composite:$i,independentReadback:$r,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,writes:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > orbit360-platform/runtime-gate-crm-v20260716/f2-functional-defect-successor-promotion-v20260820.json

      - name: Commit single-writer bridge mutation
        if: env.ACTION != 'verify'
        shell: bash
        env:
          BRANCH: ays/backend-tenant-lab-v99-20260703
        run: |
          set -euo pipefail
          git config user.name orbit360-control-plane; git config user.email orbit360-control-plane@users.noreply.github.com
          git add orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json orbit360-platform/docs/orbit360-live-state-v1.json orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json tools/orbit360-gate-contract-registry-v20260717.json tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json .github/orbit360-authorizations .github/orbit360-requests
          [ -f orbit360-platform/runtime-gate-crm-v20260716/f2-projection-reconcile-v20260820.json ] && git add orbit360-platform/runtime-gate-crm-v20260716/f2-projection-reconcile-v20260820.json
          [ -f orbit360-platform/runtime-gate-crm-v20260716/f2-functional-defect-successor-promotion-v20260820.json ] && git add orbit360-platform/runtime-gate-crm-v20260716/f2-functional-defect-successor-promotion-v20260820.json
          git diff --cached --quiet && { echo NO_MUTATION_TO_COMMIT; exit 92; }
          git commit -m "fix(control-plane): advance F2 source-only bridge ${ACTION}"
          git fetch origin "$BRANCH"; test "$(git rev-parse origin/$BRANCH)" = "$START_HEAD" || { echo FINAL_CAS_MISMATCH; exit 103; }; git push origin "HEAD:$BRANCH"

      - name: Verify post-state remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
          if [ "$ACTION" = 'boundary-refresh' ] || [ "$ACTION" = 'projection-reconcile' ] || [ "$ACTION" = 'functional-successor-promotion' ]; then node tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs; fi
          if [ "$ACTION" = 'functional-successor-promotion' ]; then node tools/orbit360-control-plane-composite-invariant-v20260820.mjs; fi
          node -e "const B=require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'); if(B.runtimeAllowed) process.exit(111); console.log(JSON.stringify({ok:true,sourceOnly:true,runtimeAllowed:false,authorizationPersisted:B.authorizationPersisted,requestMaterialized:B.requestMaterialized}))"

      - name: Dispatch existing active F2 runtime from BP6
        if: env.ACTION == 'verify' && env.CURRENT_STEP == 'F2-RUNTIME-PREFLIGHT'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ays/backend-tenant-lab-v99-20260703
          RUNTIME_WORKFLOW: orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml
        run: |
          set -euo pipefail
          BOUNDARY='orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'; REQUEST=$(jq -r '.activeRequestPath // ""' "$BOUNDARY"); AUTH=$(jq -r '.authorizationIdentity.digest // ""' "$BOUNDARY")
          test -n "$REQUEST" && test -f "$REQUEST"; echo "$AUTH" | grep -Eq '^[a-f0-9]{64}$'
          jq -e --arg request "$REQUEST" --arg auth "$AUTH" '.authorized==true and .authorizationPersisted==true and .requestMaterialized==true and .runtimeAllowed==false and .activeRequestPath==$request and .authorizationIdentity.digest==$auth' "$BOUNDARY" >/dev/null
          jq -e --arg auth "$AUTH" '.requestVersion=="F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V2" and .status=="MATERIALIZED_SOURCE_ONLY_AWAITING_PREFLIGHT" and .approved==true and .allowedExecutions==1 and .consumed==false and .authorizationFrozen==true and .replayAllowed==false and .historical==false and .authorizationIdentityDigest==$auth' "$REQUEST" >/dev/null
          TERMINAL="orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-dispatch-${AUTH:0:12}-v20260820.json"
          REQUEST_CONSUMED=$(jq -r '.consumed // false' "$REQUEST")
          REQUEST_HISTORICAL=$(jq -r '.historical // false' "$REQUEST")
          if [ -f "$TERMINAL" ] && jq -e --arg request "$REQUEST" --argjson artifact "$(jq -r '.candidateArtifactId' "$REQUEST")" '.request==$request and (.candidateArtifactId|tonumber)==$artifact and (.runId|tostring|length)>0 and (.classification|length)>0 and .containsPII==false and .containsSecrets==false' "$TERMINAL" >/dev/null 2>&1; then
            PRE_GATE=$(jq -r '.preGateFailure // false' "$TERMINAL")
            if [ "$REQUEST_CONSUMED" = 'true' ] || [ "$REQUEST_HISTORICAL" = 'true' ] || [ "$PRE_GATE" != 'true' ]; then
              echo '{"ok":true,"status":"F2_ONE_SHOT_TERMINAL_EVIDENCE_PRESENT_NO_REPLAY","runtimeDispatched":false,"authorizationReplayAllowed":false,"writes":0}'
              exit 0
            fi
            echo '{"ok":true,"status":"F2_ACTIVE_PRE_GATE_RETRY_ALLOWED","priorTerminalPreserved":true,"authorizationConsumed":false,"writes":0}'
          fi
          payload=$(jq -n --arg ref "$BRANCH" --arg request "$REQUEST" --arg auth "$AUTH" '{ref:$ref,inputs:{request_path:$request,authorization_identity:$auth}}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$RUNTIME_WORKFLOW/dispatches" -d "$payload"
          echo '{"ok":true,"status":"F2_RUNTIME_WORKFLOW_DISPATCH_ACCEPTED","authorizationConsumed":false,"runtimeExecutedByDispatcher":false,"secretAccessByDispatcher":false,"firestoreReadByDispatcher":false,"browserExecutedByDispatcher":false,"writesByDispatcher":0}'
