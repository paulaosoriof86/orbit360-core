name: Orbit360 Control Plane Concurrency Recovery V2

on:
  pull_request:
    types: [synchronize]
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/orbit360-intents/control-plane-concurrency-recovery-v2-20260826.json'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: orbit360-control-plane-recovery-v2-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORIGINAL_WORKFLOW_BLOB: 1ba4d377d457e3e77919be30ca293690257d66cc
  WORKFLOW_PATH: .github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml

jobs:
  repair-concurrency-generation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate one recovery intent without checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "${{ github.event.action }}" = 'synchronize'
          test "${{ github.event.pull_request.base.ref }}" = "$ORBIT360_BRANCH"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/compare.json"
          jq -e '.files|length==1' "$RUNNER_TEMP/compare.json" >/dev/null
          test "$(jq -r '.files[0].filename' "$RUNNER_TEMP/compare.json")" = '.github/orbit360-intents/control-plane-concurrency-recovery-v2-20260826.json'

      - name: Rebuild exact canonical workflow with base-SHA generation mutex
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -L --fail --silent --show-error "${AUTH[@]}" "$API/git/blobs/$ORIGINAL_WORKFLOW_BLOB" > "$RUNNER_TEMP/original-blob.json"
          jq -r '.content' "$RUNNER_TEMP/original-blob.json" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/original.yml"
          test "$(wc -c < "$RUNNER_TEMP/original.yml" | tr -d ' ')" = '74147'
          test "$(grep -c '^  group: orbit360-continuity-canonical-ays$' "$RUNNER_TEMP/original.yml")" = '1'
          python3 - "$RUNNER_TEMP/original.yml" "$RUNNER_TEMP/patched.yml" <<'PY'
          import sys
          src,dst=sys.argv[1:]
          text=open(src,'r',encoding='utf-8').read()
          old='  group: orbit360-continuity-canonical-ays\n'
          new='  group: orbit360-continuity-canonical-ays-' + '$' + '{{ github.event.pull_request.base.sha }}\n'
          if text.count(old)!=1:
              raise SystemExit('PIPELINE_MECHANISM_FAILURE:CONCURRENCY_SOURCE_LINE_COUNT')
          out=text.replace(old,new,1)
          if out.count(new)!=1 or old in out:
              raise SystemExit('PIPELINE_MECHANISM_FAILURE:CONCURRENCY_PATCH_VERIFY')
          open(dst,'w',encoding='utf-8',newline='').write(out)
          PY
          test "$(grep -F -c 'group: orbit360-continuity-canonical-ays-${{ github.event.pull_request.base.sha }}' "$RUNNER_TEMP/patched.yml")" = '1'
          test "$(wc -l < "$RUNNER_TEMP/patched.yml" | tr -d ' ')" = "$(wc -l < "$RUNNER_TEMP/original.yml" | tr -d ' ')"
          jq -Rs '{content:.,encoding:"utf-8"}' < "$RUNNER_TEMP/patched.yml" > "$RUNNER_TEMP/blob-request.json"
          curl -L --fail --silent --show-error -X POST "${AUTH[@]}" "$API/git/blobs" --data-binary @"$RUNNER_TEMP/blob-request.json" > "$RUNNER_TEMP/new-blob.json"
          NEW_BLOB=$(jq -r '.sha' "$RUNNER_TEMP/new-blob.json"); [[ "$NEW_BLOB" =~ ^[a-f0-9]{40}$ ]]
          REF_URL="$API/git/ref/heads/$ORBIT360_BRANCH"
          curl -L --fail --silent --show-error "${AUTH[@]}" "$REF_URL" > "$RUNNER_TEMP/ref-before.json"
          LIVE_HEAD=$(jq -r '.object.sha' "$RUNNER_TEMP/ref-before.json"); [[ "$LIVE_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$LIVE_HEAD" = '${{ github.event.pull_request.base.sha }}'
          curl -L --fail --silent --show-error "${AUTH[@]}" "$API/git/commits/$LIVE_HEAD" > "$RUNNER_TEMP/commit-before.json"
          BASE_TREE=$(jq -r '.tree.sha' "$RUNNER_TEMP/commit-before.json"); [[ "$BASE_TREE" =~ ^[a-f0-9]{40}$ ]]
          jq -n --arg base "$BASE_TREE" --arg path "$WORKFLOW_PATH" --arg blob "$NEW_BLOB" '{base_tree:$base,tree:[{path:$path,mode:"100644",type:"blob",sha:$blob}]}' > "$RUNNER_TEMP/tree-request.json"
          curl -L --fail --silent --show-error -X POST "${AUTH[@]}" "$API/git/trees" --data-binary @"$RUNNER_TEMP/tree-request.json" > "$RUNNER_TEMP/tree.json"
          TREE=$(jq -r '.sha' "$RUNNER_TEMP/tree.json"); [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          jq -n --arg msg 'fix(control-plane): isolate orphaned concurrency by canonical base generation' --arg tree "$TREE" --arg parent "$LIVE_HEAD" '{message:$msg,tree:$tree,parents:[$parent]}' > "$RUNNER_TEMP/commit-request.json"
          curl -L --fail --silent --show-error -X POST "${AUTH[@]}" "$API/git/commits" --data-binary @"$RUNNER_TEMP/commit-request.json" > "$RUNNER_TEMP/commit-new.json"
          NEW_HEAD=$(jq -r '.sha' "$RUNNER_TEMP/commit-new.json"); [[ "$NEW_HEAD" =~ ^[a-f0-9]{40}$ ]]
          curl -L --fail --silent --show-error "${AUTH[@]}" "$REF_URL" > "$RUNNER_TEMP/ref-cas.json"
          test "$(jq -r '.object.sha' "$RUNNER_TEMP/ref-cas.json")" = "$LIVE_HEAD"
          jq -n --arg sha "$NEW_HEAD" '{sha:$sha,force:false}' > "$RUNNER_TEMP/ref-update.json"
          curl -L --fail --silent --show-error -X PATCH "${AUTH[@]}" "$REF_URL" --data-binary @"$RUNNER_TEMP/ref-update.json" > "$RUNNER_TEMP/ref-after.json"
          test "$(jq -r '.object.sha' "$RUNNER_TEMP/ref-after.json")" = "$NEW_HEAD"
          echo "ROOTFIX_HEAD=$NEW_HEAD"
          echo "ROOTFIX_BLOB=$NEW_BLOB"

      - name: Prove source-only recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'PIPELINE_MECHANISM_FAILURE_ROOTFIXED:CONCURRENCY_GENERATION_BY_CANONICAL_BASE_SHA'
          echo 'runtimeExecuted=false browserExecuted=false secretAccess=false firestoreRead=false writes=0 deployExecuted=false productionTouched=false'
