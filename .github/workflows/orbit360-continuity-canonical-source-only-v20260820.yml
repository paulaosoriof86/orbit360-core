name: Orbit360 Continuity Canonical Source Only
# MACRO3_SOURCE_REPAIR_FREEZE_20260823
# Temporary fail-closed source-only freeze while the Macro-3 activation mechanism is synchronized.
# No push trigger, no runtime, no secrets, no Firestore, no browser, no deploy, no production.

on:
  workflow_dispatch:
    inputs:
      transition:
        description: 'INERT_SOURCE_REPAIR_FREEZE'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  source-repair-freeze:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'MACRO3_SOURCE_REPAIR_FREEZE'
          echo 'Runtime remains fail-closed until the canonical mechanism preflight is synchronized.'
          exit 41
