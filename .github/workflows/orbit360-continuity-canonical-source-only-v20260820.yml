          git push origin "HEAD:$ORBIT360_BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Project terminal state into actual PR body and enforce no replay
        if: always() && (steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY') && steps.materialize.outcome == 'success'
