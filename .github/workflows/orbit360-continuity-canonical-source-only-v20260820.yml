name: Orbit360 Continuity Canonical Source Only
# ROOT-CAUSE PROBE ONLY — source-only, no product/runtime/browser/secrets/Firestore/deploy.
on:
  workflow_dispatch:
    inputs:
      transition:
        description: 'Explicit source-only transition identifier'
        required: true
        type: string
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  PROBE_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/macro2-v3-actions-push-registration-probe-v20260821.json

jobs:
  fail-closed-control-plane-owner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce explicit source-only owner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "$ORBIT360_BRANCH"
          case "${{ inputs.transition }}" in
            READBACK_ONLY)
              node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
              node tools/orbit360-control-plane-independent-readback-v20260820.mjs
              node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
              node tools/orbit360-documentation-state-discovery-v20260821.mjs
              ;;
            *) exit 41 ;;
          esac

  root-cause-push-registration-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Persist sanitized trigger proof only
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "$ORBIT360_BRANCH"
          mkdir -p "$(dirname "$PROBE_EVIDENCE")"
          cat > "$PROBE_EVIDENCE" <<JSON
          {
            "schemaVersion": "orbit360-macro2-actions-push-registration-probe-v1",
            "ok": true,
            "status": "ACTIONS_PUSH_REGISTRATION_PROBE_PASS",
            "classification": "PIPELINE_MECHANISM_DIAGNOSTIC_PASS",
            "eventName": "${GITHUB_EVENT_NAME}",
            "triggerSha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "actor": "${GITHUB_ACTOR}",
            "branch": "${GITHUB_REF_NAME}",
            "sourceOnly": true,
            "productTouched": false,
            "runtimeExecuted": false,
            "browserExecuted": false,
            "secretAccess": false,
            "firestoreRead": false,
            "writes": 0,
            "deployExecuted": false,
            "productionTouched": false,
            "containsPII": false,
            "containsSecrets": false
          }
          JSON
          git config user.name "orbit360-control-plane-bot"
          git config user.email "orbit360-control-plane-bot@users.noreply.github.com"
          git add -- "$PROBE_EVIDENCE"
          git commit -m "evidence(macro2): prove Actions push registration"
          git push origin "HEAD:$ORBIT360_BRANCH"
