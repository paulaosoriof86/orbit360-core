name: Orbit360 Canonical Control Plane
# CONTROL_PLANE_CONVERGENCE_V1
# MACRO3_INLINE_F2_V1
# GENERIC_INTENT_ROUTER_V1
# CONTROL_PLANE_SELFTEST_V1
# Stable base-owned workflow. Execution PRs may change one intent JSON only; they may not change this workflow.

on:
  pull_request:
    types: [synchronize]
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/orbit360-intents/*.json'

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_EXPECTED_REQUEST_VERSION: F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V3
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  BOUNDARY: orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  OWNER: tools/orbit360-continuity-transition-owner-v20260820.mjs
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  canonical-control-plane:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable base-owned workflow with intent merge context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: intent
        name: Validate single generic intent against live canonical base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "${{ github.event.action }}" = 'synchronize'
          test "${{ github.event.pull_request.base.ref }}" = "$ORBIT360_BRANCH"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          LIVE_BASE=$(git rev-parse FETCH_HEAD)
          test "${{ github.event.pull_request.base.sha }}" = "$LIVE_BASE"
          mapfile -t CHANGED < <(git diff --name-only "$LIVE_BASE" '${{ github.event.pull_request.head.sha }}')
          test "${#CHANGED[@]}" = '1'
          INTENT="${CHANGED[0]}"
          [[ "$INTENT" =~ ^\.github/orbit360-intents/[A-Za-z0-9._-]+\.json$ ]]
          MODE=$(jq -r '.mode // empty' "$INTENT")
          EXPECTED_LEDGER=$(jq -r '.expectedLedgerRevision // empty' "$INTENT")
          EXPECTED_PACKAGE=$(jq -r '.expectedPackageRevision // empty' "$INTENT")
          [[ "$EXPECTED_LEDGER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_PACKAGE" =~ ^[0-9]+$ ]]
          IDENTITY=''; AUTH_INTENT=''; ARTIFACT=''; SOURCE=''; DIGEST=''
          case "$MODE" in
            CONTROL_PLANE_SELFTEST)
              jq -e '.schemaVersion=="orbit360-control-plane-intent-v1" and .mode=="CONTROL_PLANE_SELFTEST" and .sourceOnly==true and .oneShotOnly==false and .replayAllowed==false and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false and .mainAllowed==false and .mergeAllowed==false and .containsPII==false and .containsSecrets==false' "$INTENT" >/dev/null
              ARTIFACT=$(jq -r '.candidateArtifactId // empty' "$INTENT")
              SOURCE=$(jq -r '.candidateSourceHead // empty' "$INTENT")
              [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
              [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
              ;;
            F2_RUNTIME_ONE_SHOT)
              jq -e '.schemaVersion=="orbit360-control-plane-intent-v1" and .mode=="F2_RUNTIME_ONE_SHOT" and .oneShotOnly==true and .replayAllowed==false and .sourceOnly==false and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false and .mainAllowed==false and .mergeAllowed==false' "$INTENT" >/dev/null
              IDENTITY=$(jq -r '.authorizationIdentityDigest' "$INTENT")
              AUTH_INTENT=$(jq -r '.authorizationIntentPath' "$INTENT")
              ARTIFACT=$(jq -r '.candidateArtifactId' "$INTENT")
              SOURCE=$(jq -r '.candidateSourceHead' "$INTENT")
              DIGEST=$(jq -r '.candidateArtifactDigest' "$INTENT")
              [[ "$IDENTITY" =~ ^[a-f0-9]{64}$ ]]
              [[ "$AUTH_INTENT" =~ ^\.github/orbit360-authorizations/f2-runtime-authorization-intent-[a-f0-9]{12}-v[0-9]{8}\.json$ ]]
              [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
              [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
              [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
              curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}" > "$RUNNER_TEMP/f2-artifact-metadata.json"
              jq -e --argjson id "$ARTIFACT" --arg digest "$DIGEST" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/f2-artifact-metadata.json" >/dev/null
              ;;
            *) echo "PIPELINE_MECHANISM_FAILURE:UNSUPPORTED_CONTROL_PLANE_INTENT_MODE:$MODE" >&2; exit 41 ;;
          esac
          cp "$INTENT" "$RUNNER_TEMP/control-plane-intent.json"
          cp .github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml "$RUNNER_TEMP/executing-workflow.yml"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "live_base=$LIVE_BASE" >> "$GITHUB_OUTPUT"
          echo "intent=$INTENT" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "auth_intent=$AUTH_INTENT" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "expected_ledger=$EXPECTED_LEDGER" >> "$GITHUB_OUTPUT"
          echo "expected_package=$EXPECTED_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_F2_WORKFLOW_SOURCE_FILE=$RUNNER_TEMP/executing-workflow.yml" >> "$GITHUB_ENV"
          if [ "$MODE" = 'F2_RUNTIME_ONE_SHOT' ]; then
            echo "F2_ARTIFACT_ID=$ARTIFACT" >> "$GITHUB_ENV"
            echo "F2_AUTH_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "F2_AUTH_INTENT=$AUTH_INTENT" >> "$GITHUB_ENV"
          fi

      - name: Switch to exact live canonical base before reading mode state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = '${{ steps.intent.outputs.live_base }}'
          git checkout --force -B orbit360-control-plane-runtime '${{ steps.intent.outputs.live_base }}'
          test -z "$(git status --porcelain)"
          MODE='${{ steps.intent.outputs.mode }}'
          if [ "$MODE" = 'CONTROL_PLANE_SELFTEST' ]; then
            jq -e --argjson lr '${{ steps.intent.outputs.expected_ledger }}' --argjson pr '${{ steps.intent.outputs.expected_package }}' --argjson artifact '${{ steps.intent.outputs.artifact }}' --arg source '${{ steps.intent.outputs.source }}' '.revision==$lr and .productionReopeningPackage.revision==$pr and .activeState.phase=="MACRO1_CONTROL_PLANE_TRUTH_HARDENING_SOURCE_ONLY" and .activeState.runtimeAuthorized==false and .activeState.runtimeReplayAllowed==false and .authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and .authorizationBoundary.authorizationRecordPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .progress.productionRouteProgressPct==75 and .progress.f2TerminalPass==false and .successorCandidate.artifactId==$artifact and .successorCandidate.sourceHead==$source' "$LEDGER" >/dev/null
            test -f orbit360-platform/docs/PLAN-MAESTRO-CONGELADO-SALIDA-PRODUCCION-SIN-BUCLES-ORBIT360-AYS-20260824.md
          else
            test -f "$F2_AUTH_INTENT"
            jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" --arg source '${{ steps.intent.outputs.source }}' --arg digest '${{ steps.intent.outputs.digest }}' '.status=="USER_AUTHORIZATION_RECEIVED" and .authorizationIdentityDigest==$auth and .candidateArtifactId==$artifact and .candidateArtifactDigest==$digest and .candidateSourceHead==$source and .oneShotOnly==true and .replayAllowed==false and .scope.runtimeReadOnly==true and .scope.secrets==true and .scope.firestoreRead==true and .scope.browser==true and .scope.writes==false and .scope.deploy==false and .scope.production==false and .scope.main==false and .scope.merge==false' "$F2_AUTH_INTENT" >/dev/null
            jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" --arg source '${{ steps.intent.outputs.source }}' --arg digest '${{ steps.intent.outputs.digest }}' --argjson lr '${{ steps.intent.outputs.expected_ledger }}' --argjson pr '${{ steps.intent.outputs.expected_package }}' '.revision==$lr and .productionReopeningPackage.revision==$pr and .successorCandidate.artifactId==$artifact and .successorCandidate.sourceHead==$source and .successorCandidate.artifactDigest==$digest and .authorizationBoundary.preparedAuthorizationIdentityDigest==$auth and .authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and .authorizationBoundary.authorizationRecordPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT" and .progress.productionRouteProgressPct==75' "$LEDGER" >/dev/null
            jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" '.authorized==false and .authorizationPersisted==false and .requestMaterialized==false and .runtimeAllowed==false and .authorizationIdentity.digest==$auth and .candidate.artifactId==$artifact' "$BOUNDARY" >/dev/null
          fi

      - id: control_plane_selftest
        name: Run source-only control-plane selftest
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_SELFTEST'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-control-plane-no-source-rewrite-guard-v20260824.mjs
          ORBIT360_SELFTEST_EXPECTED_LEDGER='${{ steps.intent.outputs.expected_ledger }}' ORBIT360_SELFTEST_EXPECTED_PACKAGE='${{ steps.intent.outputs.expected_package }}' node tools/orbit360-control-plane-selftest-v20260824.mjs | tee "$RUNNER_TEMP/control-plane-selftest.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_SELFTEST_PASS" and .authorizationMaterialized==false and .requestMaterialized==false and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$RUNNER_TEMP/control-plane-selftest.json" >/dev/null
          git restore orbit360-platform/runtime-gate-crm-v20260716/macro3-mechanism-preflight-sanitized-v20260823.json 2>/dev/null || true
          rm -f orbit360-platform/runtime-gate-crm-v20260716/macro3-mechanism-preflight-sanitized-v20260823.json~
          test -z "$(git status --porcelain)"
          jq -e --argjson lr '${{ steps.intent.outputs.expected_ledger }}' '.revision==$lr and .activeState.runtimeAuthorized==false and .authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and .authorizationBoundary.authorizationRecordPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .progress.productionRouteProgressPct==75 and .progress.f2TerminalPass==false' "$LEDGER" >/dev/null

      - name: Source-only mechanism gates before authorization consumption
        if: steps.intent.outputs.mode == 'F2_RUNTIME_ONE_SHOT'
        shell: bash
        run: |
          set -euo pipefail
          node --check "$OWNER"
          node --check "$CONVERGENCE"
          node --check tools/orbit360-f2-gate-semantic-v20260824.mjs
          node --check tools/orbit360-terminal-truth-invariant-v20260824.mjs
          node --check tools/orbit360-control-plane-independent-readback-v20260820.mjs
          node --check tools/orbit360-f2-data-integrity-readonly-v20260818.mjs
          node --check tools/orbit360-f2-compare-integrity-v20260818.mjs
          node tools/orbit360-control-plane-no-source-rewrite-guard-v20260824.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs | tee "$RUNNER_TEMP/workflow-audit.json"
          jq -e '.ok==true and .totalWorkflowFiles==1' "$RUNNER_TEMP/workflow-audit.json" >/dev/null
          ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-macro3-mechanism-preflight-v20260823.mjs
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs "$ORBIT360_GATE_ID" | tee "$RUNNER_TEMP/f2-source-precheck.json"
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .executionAuthorized==false and .runtimeAuthorized==false and .browserAuthorized==false' "$RUNNER_TEMP/f2-source-precheck.json" >/dev/null
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-source.json"
          jq -e '.ok==true and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-source.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs

      - id: materialize
        name: Persist authorization request and F2_RUNTIME_ATTEMPT_ACCEPT once
        if: steps.intent.outputs.mode == 'F2_RUNTIME_ONE_SHOT'
        shell: bash
        run: |
          set -euo pipefail
          LR='${{ steps.intent.outputs.expected_ledger }}'; PRV='${{ steps.intent.outputs.expected_package }}'
          node "$OWNER" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" > "$RUNNER_TEMP/f2-auth-persist.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_AUTHORIZATION_PERSISTED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-auth-persist.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_REQUEST_MATERIALIZE --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" --parent-head '${{ steps.intent.outputs.live_base }}' > "$RUNNER_TEMP/f2-request-materialize.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_REQUEST_MATERIALIZED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-request-materialize.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_ATTEMPT_ACCEPT --expected-revision "$LR" --expected-package-revision "$PRV" --runtime-run-id "$GITHUB_RUN_ID" > "$RUNNER_TEMP/f2-attempt-accept.json"
          jq -e --argjson run "$GITHUB_RUN_ID" '.ok==true and .status=="ORBIT360_F2_RUNTIME_ATTEMPT_ACCEPTED_ONE_SHOT" and .runtimeRunId==$run and .replayAllowed==false' "$RUNNER_TEMP/f2-attempt-accept.json" >/dev/null
          REQUEST=$(jq -r '.authorizationBoundary.activeRequestPath' "$LEDGER")
          jq -e --argjson run "$GITHUB_RUN_ID" '.allowedExecutions==0 and .runtimeAttemptAccepted==true and .runtimeAttemptCount==1 and .runtimeRunId==$run and .replayAllowed==false and .consumed==false' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_REQUEST_FILE=$REQUEST" >> "$GITHUB_ENV"

      - id: authpublish
        name: Publish accepted one-shot state with remote CAS
        if: steps.intent.outputs.mode == 'F2_RUNTIME_ONE_SHOT'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node "$CONVERGENCE" --repo-only >/dev/null
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|.github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|README.md|orbit360-platform/CHANGELOG.md|orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|orbit360-platform/docs/orbit360-live-state-v1.json|orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_AUTH_PUBLICATION_SURFACE:$f" >&2; exit 41 ;;
            esac
          done
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "${CHANGED[@]}"; git diff --cached --check
          git commit -m 'gate(f2): accept generic-intent one-shot runtime attempt'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = '${{ steps.intent.outputs.live_base }}'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${ORBIT360_BRANCH}"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - id: gate
        name: Enforce semantic F2 gate and verify exact artifact before provider
        if: steps.intent.outputs.mode == 'F2_RUNTIME_ONE_SHOT'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json" ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq --argjson run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          jq -e --argjson run "$GITHUB_RUN_ID" --argjson artifact "$F2_ARTIFACT_ID" '.ok==true and .status=="GO_GATE_CONTRACT" and .runId==$run and .candidateArtifactId==$artifact and .runtimeAttemptAccepted==true and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .runtimeAuthorized==true and .browserAuthorized==true and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" >/dev/null
          export ORBIT360_CANDIDATE_ARTIFACT_ID=$(jq -r '.successorCandidate.artifactId' "$LEDGER")
          export ORBIT360_CANDIDATE_SOURCE_HEAD=$(jq -r '.successorCandidate.sourceHead' "$LEDGER")
          export ORBIT360_CANDIDATE_ZIP_SHA256=$(jq -r '.successorCandidate.zipSha256' "$LEDGER")
          export ORBIT360_CANDIDATE_MANIFEST_SHA256=$(jq -r '.successorCandidate.manifestSha256' "$LEDGER")
          echo "ORBIT360_CANDIDATE_ARTIFACT_ID=$ORBIT360_CANDIDATE_ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_SOURCE_HEAD=$ORBIT360_CANDIDATE_SOURCE_HEAD" >> "$GITHUB_ENV"
          OUTER="$RUNNER_TEMP/f2-artifact-outer.zip"; OUTER_DIR="$RUNNER_TEMP/f2-outer"; CANDIDATE_DIR="$RUNNER_TEMP/f2-candidate"; rm -rf "$OUTER" "$OUTER_DIR" "$CANDIDATE_DIR"; mkdir -p "$OUTER_DIR" "$CANDIDATE_DIR"
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORBIT360_CANDIDATE_ARTIFACT_ID}/zip" -o "$OUTER"
          unzip -q "$OUTER" -d "$OUTER_DIR"; mapfile -t FILES < <(find "$OUTER_DIR" -maxdepth 1 -type f -printf '%f\n' | sort); test "${#FILES[@]}" = '1'; INNER="$OUTER_DIR/${FILES[0]}"
          test "$(sha256sum "$INNER" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_ZIP_SHA256"
          unzip -q "$INNER" -d "$CANDIDATE_DIR"
          test "$(sha256sum "$CANDIDATE_DIR/orbit360-package-manifest.json" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_MANIFEST_SHA256"
          ORBIT360_F2_CANDIDATE_DIR="$CANDIDATE_DIR" ORBIT360_F2_CANDIDATE_SOURCE_EVIDENCE="$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" ORBIT360_F2_WORKFLOW_SOURCE_FILE="$RUNNER_TEMP/executing-workflow.yml" node tools/orbit360-f2-exact-candidate-source-validator-v20260819.mjs
          echo "ORBIT360_F2_CANDIDATE_DIR=$CANDIDATE_DIR" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_MANIFEST_STATUS=$(jq -r '.status' "$CANDIDATE_DIR/orbit360-package-manifest.json")" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_MANIFEST_FILE_COUNT=$(jq -r '.fileCount' "$CANDIDATE_DIR/orbit360-package-manifest.json")" >> "$GITHUB_ENV"

      - id: dependencies
        name: Install runtime dependencies only after semantic gate GO
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0 >/dev/null
          BROWSER_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_EXECUTABLE"
          echo "ORBIT360_SYSTEM_BROWSER_EXECUTABLE=$BROWSER_EXECUTABLE" >> "$GITHUB_ENV"

      - id: provider
        name: Bind read-only provider only after gate GO
        if: steps.gate.outcome == 'success' && steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
