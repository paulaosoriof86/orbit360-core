name: Orbit360 Continuity Canonical Source Only
# DEFINITIVE SINGLE PHYSICAL WRITER — 2026-08-21.
# Explicit-dispatch only. No runtime/browser/secrets/Firestore/deploy.
# Historical workflows are preserved under .github/workflows-history-20260821/ and are not executable.

on:
  workflow_dispatch:
    inputs:
      transition:
        description: 'Explicit source-only transition identifier'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  fail-closed-control-plane-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce explicit source-only owner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = 'ays/backend-tenant-lab-v99-20260703'
          case "${{ inputs.transition }}" in
            READBACK_ONLY)
              node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
              node tools/orbit360-control-plane-independent-readback-v20260820.mjs
              node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
              node tools/orbit360-documentation-state-discovery-v20260821.mjs
              ;;
            *)
              echo 'PIPELINE_MECHANISM_FAILURE:UNIMPLEMENTED_CANONICAL_TRANSITION_FAIL_CLOSED' >&2
              exit 41
              ;;
          esac
