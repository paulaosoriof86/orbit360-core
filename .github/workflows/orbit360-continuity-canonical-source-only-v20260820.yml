name: Orbit360 Continuity Canonical Source Only
# Single-writer, revision-aware control-plane bridge. Never executes runtime/browser/secrets/Firestore.

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'
      - 'orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'
      - 'orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs'
      - '.github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json'
      - '.github/orbit360-authorizations/f2-runtime-one-shot-intent-v20260820.json'
      - '.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json'
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
  workflow_dispatch:
    inputs:
      bridge_action:
        description: 'Source-only bridge action'
        required: true
        default: verify
        type: choice
        options: [verify, persist-authorization, materialize-request]
      authorization_identity:
        description: 'Prepared F2 authorization identity SHA-256 (required for mutation actions)'
        required: false
        type: string

permissions:
  contents: write
  statuses: write
  pull-requests: read
concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  canonical-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fail-closed CAS and reachability preflight
        shell: bash
        env:
          BRANCH: ays/backend-tenant-lab-v99-20260703
          INPUT_ACTION: ${{ inputs.bridge_action || 'verify' }}
          INPUT_AUTH: ${{ inputs.authorization_identity || '' }}
        run: |
          set -euo pipefail
          START_HEAD=$(git rev-parse HEAD)
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$START_HEAD" || { echo REMOTE_CAS_MISMATCH; exit 54; }
          STATUS=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').status")
          STEP=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').resumeProtocol.firstIncompleteStep")
          test "$STATUS" = CLOSED_PASS || exit 58
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
          ACTION="$INPUT_ACTION"
          AUTH_IDENTITY="$INPUT_AUTH"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            INTENT='.github/orbit360-authorizations/f2-runtime-one-shot-intent-v20260820.json'
            mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
            if printf '%s\n' "${CHANGED[@]}" | grep -Fx "$INTENT" >/dev/null; then
              test "${#CHANGED[@]}" = '1' || { echo INTENT_COMMIT_SURFACE_INVALID; exit 62; }
              jq -e '.schemaVersion=="orbit360-f2-runtime-one-shot-intent-v1" and .approved==true and .oneShot==true and .consumed==false and .replayAllowed==false and .runtimeProfile=="F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY" and (.authorizationIdentityDigest|test("^[a-f0-9]{64}$")) and (.parentHead|test("^[a-f0-9]{40}$"))' "$INTENT" >/dev/null
              test "$(jq -r '.parentHead' "$INTENT")" = "$(git rev-parse HEAD^)" || { echo INTENT_PARENT_HEAD_MISMATCH; exit 63; }
              ACTION=consume-intent
              AUTH_IDENTITY=$(jq -r '.authorizationIdentityDigest' "$INTENT")
            else
              ACTION=verify
            fi
          fi
          case "$ACTION:$STEP" in
            verify:*) ;;
            persist-authorization:F2-RUNTIME-AUTHORIZATION) ;;
            materialize-request:F2-RUNTIME-REQUEST-MATERIALIZATION) ;;
            consume-intent:F2-RUNTIME-AUTHORIZATION) ;;
            *) echo "BRIDGE_ACTION_STEP_MISMATCH:$ACTION:$STEP"; exit 59;;
          esac
          if [ "$ACTION" != verify ]; then
            echo "$AUTH_IDENTITY" | grep -Eq '^[a-f0-9]{64}$' || { echo AUTH_IDENTITY_REQUIRED; exit 60; }
            PREPARED=$(node -p "require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json').authorizationIdentity.digest")
            test "$AUTH_IDENTITY" = "$PREPARED" || { echo AUTH_IDENTITY_MISMATCH; exit 61; }
          fi
          echo "START_HEAD=$START_HEAD" >> "$GITHUB_ENV"
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "CURRENT_STEP=$STEP" >> "$GITHUB_ENV"
          echo "AUTH_IDENTITY=$AUTH_IDENTITY" >> "$GITHUB_ENV"
      - name: Persist already-granted authorization source-only
        if: env.ACTION == 'persist-authorization' || env.ACTION == 'consume-intent'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision")
          PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --authorization-identity "$AUTH_IDENTITY"
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
      - name: Materialize exactly one immutable successor request source-only
        if: env.ACTION == 'materialize-request' || env.ACTION == 'consume-intent'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision")
          PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition F2_RUNTIME_REQUEST_MATERIALIZE --authorization-identity "$AUTH_IDENTITY" --parent-head "$START_HEAD"
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
      - name: Commit single-writer bridge mutation
        if: env.ACTION != 'verify'
        shell: bash
        env:
          BRANCH: ays/backend-tenant-lab-v99-20260703
        run: |
          set -euo pipefail
          git config user.name orbit360-control-plane
          git config user.email orbit360-control-plane@users.noreply.github.com
          git add orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json .github/orbit360-authorizations .github/orbit360-requests
          git diff --cached --quiet && { echo NO_MUTATION_TO_COMMIT; exit 92; }
          git commit -m "fix(control-plane): advance F2 source-only bridge ${ACTION}"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$START_HEAD" || { echo FINAL_CAS_MISMATCH; exit 103; }
          git push origin "HEAD:$BRANCH"
      - name: Verify post-state remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-f2-control-plane-reachability-v20260820.mjs
          node -e "const B=require('./orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'); if(B.runtimeAllowed) process.exit(111); console.log(JSON.stringify({ok:true,sourceOnly:true,runtimeAllowed:false,authorizationConsumed:false}))"
