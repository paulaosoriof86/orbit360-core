name: Orbit360 Continuity Canonical Source Only

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'
      - 'orbit360-platform/docs/orbit360-continuity-writer-registry-v20260820.json'
      - 'orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-continuity-projection-atomic-v20260820.mjs'
      - 'tools/orbit360-control-plane-composite-invariant-v20260820.mjs'
      - 'tools/orbit360-store-read-amplification-synthetic-v20260820.mjs'
      - 'tools/orbit360-workflow-operational-surface-audit-v20260820.mjs'
      - 'tools/orbit360-production-reopening-integrated-audit-v20260820.mjs'
      - 'tools/orbit360-control-plane-independent-readback-v20260820.mjs'
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  canonical-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Audit and atomically reconcile control plane
        id: canonical
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ays/backend-tenant-lab-v99-20260703
        run: |
          set -euo pipefail
          START_HEAD=$(git rev-parse HEAD)
          git fetch origin "$BRANCH"
          REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
          test "$REMOTE_HEAD" = "$START_HEAD"

          STATUS=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').status")
          STEP=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').resumeProtocol.firstIncompleteStep")

          publish_closure_status() {
            local sha="$1"
            payload=$(printf '{"state":"success","context":"orbit360/hardening-closed","description":"Control-plane hardening reconciled CLOSED_PASS"}')
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -d "$payload"
          }

          if [ "$STATUS" = "CLOSED_PASS" ]; then
            RECONCILED=$(node -p "Boolean(require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').controlPlaneClosure?.status === 'CLOSED_PASS_RECONCILED')")
            if [ "$RECONCILED" = "true" ]; then
              node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
              ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-11 --expected-package-status CLOSED_PASS
              publish_closure_status "$START_HEAD"
              echo "mode=closed-verify" >> "$GITHUB_OUTPUT"
              echo "closure_sha=$START_HEAD" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision")
            PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
            node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition POST_CLOSE_RECONCILE_CONTROL_PLANE_METADATA
            LR=$((LR+1))
            node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$LR"
            node tools/orbit360-control-plane-composite-invariant-v20260820.mjs > orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-composite-v20260820.json
            ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-11 --expected-package-status CLOSED_PASS > orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-readback-v20260820.json
            node <<'NODE'
            const fs=require('fs'); const L=require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'); const P=require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json');
            fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-metadata-reconciliation-v20260820.json',JSON.stringify({schemaVersion:'orbit360-postclose-reconciliation-evidence-v1',ok:true,status:'POST_CLOSE_CONTROL_PLANE_METADATA_RECONCILED_PASS',ledgerRevision:L.revision,packageRevision:P.revision,firstIncompleteStep:P.resumeProtocol.firstIncompleteStep,atomicProjection:L.continuityControl.syncTool,compositeInvariant:L.continuityControl.invariant,runtimeAuthorized:false,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,operationalWrites:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false},null,2)+'\n');
            NODE

            git fetch origin "$BRANCH"
            REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
            test "$REMOTE_HEAD" = "$START_HEAD"
            git config user.name "orbit360-control-plane"
            git config user.email "orbit360-control-plane@users.noreply.github.com"
            git add \
              orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json \
              orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json \
              orbit360-platform/docs/orbit360-live-state-v1.json \
              orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json \
              orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md \
              orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md \
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json \
              orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-composite-v20260820.json \
              orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-readback-v20260820.json \
              orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-metadata-reconciliation-v20260820.json
            git commit -m "fix(control-plane): reconcile post-close canonical owner metadata"
            CLOSURE_SHA=$(git rev-parse HEAD)
            git fetch origin "$BRANCH"
            REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
            test "$REMOTE_HEAD" = "$START_HEAD"
            git push origin "HEAD:$BRANCH"
            publish_closure_status "$CLOSURE_SHA"
            echo "mode=post-close-reconcile" >> "$GITHUB_OUTPUT"
            echo "closure_sha=$CLOSURE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$STATUS" = "OPEN_FAIL_CLOSED"
          test "$STEP" = "CP-03"
          node tools/orbit360-production-reopening-integrated-audit-v20260820.mjs > orbit360-platform/runtime-gate-crm-v20260716/cp03-cp08-integrated-sourceonly-audit-v20260820.json
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision")
          PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision")
          advance() {
            node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition "$1"
            LR=$((LR+1)); PR=$((PR+1))
          }
          advance CP03_PASS_TO_CP04
          advance CP04_PASS_TO_CP05
          advance CP05_PASS_TO_CP06
          advance CP06_PASS_TO_CP07
          advance CP07_PASS_TO_CP08
          advance CP08_PASS_TO_CP09
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$LR"
          ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-09 --expected-package-status OPEN_FAIL_CLOSED > orbit360-platform/runtime-gate-crm-v20260716/cp09-independent-readback-v20260820.json
          advance CP09_PASS_TO_CP10
          advance CP10_CLOSE_PACKAGE
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$LR"
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs > orbit360-platform/runtime-gate-crm-v20260716/cp10-closure-composite-invariant-v20260820.json
          ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-11 --expected-package-status CLOSED_PASS > orbit360-platform/runtime-gate-crm-v20260716/cp10-closure-independent-readback-v20260820.json
          node <<'NODE'
          const fs=require('fs'); const L=require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'); const P=require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json');
          fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/cp03-cp10-hardening-atomic-closure-v20260820.json',JSON.stringify({schemaVersion:'orbit360-hardening-closure-evidence-v1',ok:true,status:'CP03_CP10_HARDENING_ATOMIC_CLOSED_PASS',ledgerRevision:L.revision,packageRevision:P.revision,packageStatus:P.status,firstIncompleteStep:P.resumeProtocol.firstIncompleteStep,candidateArtifactId:L.successorCandidate.artifactId,candidateSourceHead:L.successorCandidate.sourceHead,runtimeAuthorized:false,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,publicationExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false},null,2)+'\n');
          NODE
          git fetch origin "$BRANCH"
          REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
          test "$REMOTE_HEAD" = "$START_HEAD"
          git config user.name "orbit360-control-plane"
          git config user.email "orbit360-control-plane@users.noreply.github.com"
          git add orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json orbit360-platform/docs/orbit360-live-state-v1.json orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json orbit360-platform/runtime-gate-crm-v20260716/cp03-cp08-integrated-sourceonly-audit-v20260820.json orbit360-platform/runtime-gate-crm-v20260716/cp09-independent-readback-v20260820.json orbit360-platform/runtime-gate-crm-v20260716/cp10-closure-composite-invariant-v20260820.json orbit360-platform/runtime-gate-crm-v20260716/cp10-closure-independent-readback-v20260820.json orbit360-platform/runtime-gate-crm-v20260716/cp03-cp10-hardening-atomic-closure-v20260820.json
          git commit -m "fix(control-plane): atomically close CP03-CP10 hardening"
          CLOSURE_SHA=$(git rev-parse HEAD)
          git fetch origin "$BRANCH"
          REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
          test "$REMOTE_HEAD" = "$START_HEAD"
          git push origin "HEAD:$BRANCH"
          publish_closure_status "$CLOSURE_SHA"
          echo "mode=atomic-close" >> "$GITHUB_OUTPUT"
          echo "closure_sha=$CLOSURE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish trigger commit result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.canonical.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then state=success; description='Atomic control-plane reconciliation PASS'; else state=failure; description='Atomic control-plane reconciliation FAIL; runtime remains closed'; fi
          payload=$(printf '{"state":"%s","context":"orbit360/hardening-atomic-close","description":"%s"}' "$state" "$description")
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"

      - name: Enforce terminal result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.canonical.outcome }}
        run: test "$OUTCOME" = "success"
