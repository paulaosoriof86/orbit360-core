name: Orbit360 Continuity Canonical Source Only
# MACRO1 MAINTENANCE LOCK — discovery phase 2026-08-21.
# Read-only: discovers hidden branch writers and conflicting state-bearing documents.

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
      - 'tools/orbit360-workflow-operational-surface-audit-v20260820.mjs'
      - 'tools/orbit360-documentation-state-discovery-v20260821.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  discovery-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Global physical-writer discovery
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
      - name: State-bearing documentation discovery
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
      - name: Source-only boundary
        shell: bash
        run: |
          echo '{"runtimeExecuted":false,"browserExecuted":false,"secretAccess":false,"firestoreRead":false,"operationalWrites":0,"deployExecuted":false,"productionTouched":false}'
