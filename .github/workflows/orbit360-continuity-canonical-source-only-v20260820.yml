name: Orbit360 Canonical Control Plane
# CONTROL_PLANE_CONVERGENCE_V1
# MACRO3_INLINE_F2_V1
# GENERIC_INTENT_ROUTER_V1
# CONTROL_PLANE_REGRESSION_REOPEN_V1
# CONTROL_PLANE_SELFTEST_V1
# CONTROL_PLANE_SELFTEST_DURABLE_HANDSHAKE_V2
# CONTROL_PLANE_HARDENING_CLOSE_V1
# F2_PUBLICATION_CHAIN_GUARD_V1
# F2_PREPUBLICATION_FAILURE_REDUCER_V1
# EVIDENCE_LIFECYCLE_CLASS_WIDE_V1
# CONTROL_PLANE_IDEMPOTENT_REPROJECTION_V1
# SINGLE_VALIDATED_PUBLICATION_TRANSACTION_V1
# TRANSITION_PRECONDITION_SINGLE_OWNER_V1
# Stable base-owned workflow. Execution PRs may change one intent JSON only; they may not change this workflow.

on:
  pull_request:
    types: [synchronize]
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/orbit360-intents/*.json'

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_EXPECTED_REQUEST_VERSION: F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V3
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  BOUNDARY: orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  OWNER: tools/orbit360-continuity-transition-owner-v20260824.mjs
  TRANSITION_PRECONDITION_OWNER: tools/orbit360-control-plane-transition-precondition-owner-v20260825.mjs
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  EVIDENCE_LIFECYCLE: tools/orbit360-control-plane-evidence-lifecycle-v20260824.mjs
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  PUBLICATION_OWNER: tools/orbit360-control-plane-publication-preflight-v20260825.mjs

jobs:
  canonical-control-plane:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable base-owned workflow with intent merge context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: intent
        name: Validate single generic intent against live canonical base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "${{ github.event.action }}" = 'synchronize'
          test "${{ github.event.pull_request.base.ref }}" = "$ORBIT360_BRANCH"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          LIVE_BASE=$(git rev-parse FETCH_HEAD)
          test "${{ github.event.pull_request.base.sha }}" = "$LIVE_BASE"
          mapfile -t CHANGED < <(git diff --name-only "$LIVE_BASE" '${{ github.event.pull_request.head.sha }}')
          test "${#CHANGED[@]}" = '1'
          INTENT="${CHANGED[0]}"
          [[ "$INTENT" =~ ^\.github/orbit360-intents/[A-Za-z0-9._-]+\.json$ ]]
          MODE=$(jq -r '.mode // empty' "$INTENT")
          EXPECTED_LEDGER=$(jq -r '.expectedLedgerRevision // empty' "$INTENT")
          EXPECTED_PACKAGE=$(jq -r '.expectedPackageRevision // empty' "$INTENT")
          [[ "$EXPECTED_LEDGER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_PACKAGE" =~ ^[0-9]+$ ]]
          IDENTITY=''; AUTH_INTENT=''; ARTIFACT=''; SOURCE=''; DIGEST=''; CONTROL_PLANE_EVIDENCE=''; CONTROL_PLANE_FAILURE_EVIDENCE=''
          case "$MODE" in
            CONTROL_PLANE_REGRESSION_REOPEN)
              jq -e '.schemaVersion=="orbit360-control-plane-intent-v1" and .mode=="CONTROL_PLANE_REGRESSION_REOPEN" and .sourceOnly==true and .oneShotOnly==false and .replayAllowed==false and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false and .mainAllowed==false and .mergeAllowed==false and .containsPII==false and .containsSecrets==false' "$INTENT" >/dev/null
              ARTIFACT=$(jq -r '.candidateArtifactId // empty' "$INTENT")
              SOURCE=$(jq -r '.candidateSourceHead // empty' "$INTENT")
              CONTROL_PLANE_FAILURE_EVIDENCE=$(jq -r '.controlPlaneFailureEvidence // empty' "$INTENT")
              [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
              [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
              [[ "$CONTROL_PLANE_FAILURE_EVIDENCE" =~ ^orbit360-platform/runtime-gate-crm-v20260716/f2-pipeline-publication-failure-run-[0-9]+-v20260824\.json$ ]]
              ;;
            CONTROL_PLANE_SELFTEST)
              jq -e '.schemaVersion=="orbit360-control-plane-intent-v1" and .mode=="CONTROL_PLANE_SELFTEST" and .sourceOnly==true and .oneShotOnly==false and .replayAllowed==false and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false and .mainAllowed==false and .mergeAllowed==false and .containsPII==false and .containsSecrets==false' "$INTENT" >/dev/null
              ARTIFACT=$(jq -r '.candidateArtifactId // empty' "$INTENT")
              SOURCE=$(jq -r '.candidateSourceHead // empty' "$INTENT")
              [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
              [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
              ;;
            CONTROL_PLANE_HARDENING_CLOSE)
              jq -e '.schemaVersion=="orbit360-control-plane-intent-v1" and .mode=="CONTROL_PLANE_HARDENING_CLOSE" and .sourceOnly==true and .oneShotOnly==false and .replayAllowed==false and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false and .mainAllowed==false and .mergeAllowed==false and .containsPII==false and .containsSecrets==false' "$INTENT" >/dev/null
              ARTIFACT=$(jq -r '.candidateArtifactId // empty' "$INTENT")
              SOURCE=$(jq -r '.candidateSourceHead // empty' "$INTENT")
              CONTROL_PLANE_EVIDENCE=$(jq -r '.controlPlaneEvidence // empty' "$INTENT")
              [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
              [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
              [[ "$CONTROL_PLANE_EVIDENCE" =~ ^orbit360-platform/runtime-gate-crm-v20260716/control-plane-selftest-handshake-run-[0-9]+-v20260824\.json$ ]]
              ;;
            F2_RUNTIME_ONE_SHOT)
              jq -e '.schemaVersion=="orbit360-control-plane-intent-v1" and .mode=="F2_RUNTIME_ONE_SHOT" and .oneShotOnly==true and .replayAllowed==false and .sourceOnly==false and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false and .mainAllowed==false and .mergeAllowed==false' "$INTENT" >/dev/null
              IDENTITY=$(jq -r '.authorizationIdentityDigest' "$INTENT")
              AUTH_INTENT=$(jq -r '.authorizationIntentPath' "$INTENT")
              ARTIFACT=$(jq -r '.candidateArtifactId' "$INTENT")
              SOURCE=$(jq -r '.candidateSourceHead' "$INTENT")
              DIGEST=$(jq -r '.candidateArtifactDigest' "$INTENT")
              [[ "$IDENTITY" =~ ^[a-f0-9]{64}$ ]]
              [[ "$AUTH_INTENT" =~ ^\.github/orbit360-authorizations/f2-runtime-authorization-intent-[a-f0-9]{12}-v[0-9]{8}\.json$ ]]
              [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
              [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
              [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
              curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}" > "$RUNNER_TEMP/f2-artifact-metadata.json"
              jq -e --argjson id "$ARTIFACT" --arg digest "$DIGEST" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/f2-artifact-metadata.json" >/dev/null
              ;;
            *) echo "PIPELINE_MECHANISM_FAILURE:UNSUPPORTED_CONTROL_PLANE_INTENT_MODE:$MODE" >&2; exit 41 ;;
          esac
          cp "$INTENT" "$RUNNER_TEMP/control-plane-intent.json"
          cp .github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml "$RUNNER_TEMP/executing-workflow.yml"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "live_base=$LIVE_BASE" >> "$GITHUB_OUTPUT"
          echo "intent=$INTENT" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "auth_intent=$AUTH_INTENT" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "control_plane_evidence=$CONTROL_PLANE_EVIDENCE" >> "$GITHUB_OUTPUT"
          echo "control_plane_failure_evidence=$CONTROL_PLANE_FAILURE_EVIDENCE" >> "$GITHUB_OUTPUT"
          echo "expected_ledger=$EXPECTED_LEDGER" >> "$GITHUB_OUTPUT"
          echo "expected_package=$EXPECTED_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_F2_WORKFLOW_SOURCE_FILE=$RUNNER_TEMP/executing-workflow.yml" >> "$GITHUB_ENV"
          if [ "$MODE" = 'F2_RUNTIME_ONE_SHOT' ]; then
            echo "F2_ARTIFACT_ID=$ARTIFACT" >> "$GITHUB_ENV"
            echo "F2_AUTH_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "F2_AUTH_INTENT=$AUTH_INTENT" >> "$GITHUB_ENV"
          fi

      - name: Switch to exact live canonical base before reading mode state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$ORBIT360_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = '${{ steps.intent.outputs.live_base }}'
          git checkout --force -B orbit360-control-plane-runtime '${{ steps.intent.outputs.live_base }}'
          test -z "$(git status --porcelain)"
          MODE='${{ steps.intent.outputs.mode }}'
          jq -e --argjson lr '${{ steps.intent.outputs.expected_ledger }}' --argjson pr '${{ steps.intent.outputs.expected_package }}' --argjson artifact '${{ steps.intent.outputs.artifact }}' --arg source '${{ steps.intent.outputs.source }}' '.revision==$lr and .productionReopeningPackage.revision==$pr and .activeState.runtimeAuthorized==false and .activeState.runtimeReplayAllowed==false and .authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and .authorizationBoundary.authorizationRecordPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .progress.productionRouteProgressPct==75 and .progress.f2TerminalPass==false and .successorCandidate.artifactId==$artifact and .successorCandidate.sourceHead==$source' "$LEDGER" >/dev/null
          PHASE=$(jq -r '.activeState.phase' "$LEDGER")
          STATUS=$(jq -r '.activeState.status' "$LEDGER")
          if [ "$MODE" = 'CONTROL_PLANE_REGRESSION_REOPEN' ]; then
            F='${{ steps.intent.outputs.control_plane_failure_evidence }}'; test -f "$F"
            node "$TRANSITION_PRECONDITION_OWNER" --transition CONTROL_PLANE_REGRESSION_REOPEN --expected-revision '${{ steps.intent.outputs.expected_ledger }}' --expected-package-revision '${{ steps.intent.outputs.expected_package }}' --control-plane-failure-evidence "$F" > "$RUNNER_TEMP/regression-reopen-precondition.json"
            jq -e '.ok==true and .status=="CONTROL_PLANE_REGRESSION_REOPEN_PRECONDITION_PASS" and .validationMode=="CANONICAL_OWNER_SCRATCH_BEHAVIORAL_SIMULATION" and .canonicalLedgerMutated==false and .runtimeExecuted==false and .browserExecuted==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$RUNNER_TEMP/regression-reopen-precondition.json" >/dev/null
          elif [ "$MODE" = 'CONTROL_PLANE_SELFTEST' ] || [ "$MODE" = 'CONTROL_PLANE_HARDENING_CLOSE' ]; then
            if [ "$PHASE" = 'MACRO1_CONTROL_PLANE_TRUTH_HARDENING_SOURCE_ONLY' ] && { [ "$STATUS" = 'CONTROL_PLANE_FALSE_PASS_INVALIDATED' ] || [ "$STATUS" = 'CONTROL_PLANE_REGRESSION_OPEN_STOP_RETRY' ]; }; then
              CONTROL_PLANE_STATE='OPEN'
            elif [ "$PHASE" = 'CONTROL_PLANE_DEFINITIVE_CAUSAL_PASS_AWAITING_F2_AUTHORIZATION' ] && [ "$STATUS" = 'CONTROL_PLANE_DEFINITIVE_CAUSAL_PASS' ]; then
              CONTROL_PLANE_STATE='CLOSED'
            else
              echo "PIPELINE_MECHANISM_FAILURE:CONTROL_PLANE_MODE_STATE_INVALID:${PHASE}:${STATUS}" >&2; exit 41
            fi
            if [ "$MODE" = 'CONTROL_PLANE_HARDENING_CLOSE' ]; then
              E='${{ steps.intent.outputs.control_plane_evidence }}'; test -f "$E"
              jq -e --argjson artifact '${{ steps.intent.outputs.artifact }}' --arg source '${{ steps.intent.outputs.source }}' '.ok==true and .status=="CONTROL_PLANE_SELFTEST_HANDSHAKE_PASS" and .classification=="PASS" and .controlPlaneSelftestPass==true and .exactF2SourcePathExecuted==true and .classWidePreAuthEvidenceLifecyclePass==true and .classWidePreTerminalEvidenceLifecyclePass==true and .arbitraryFutureFilenameCleanupPass==true and .candidateArtifactId==$artifact and .candidateSourceHead==$source and .authorizationMaterialized==false and .requestMaterialized==false and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$E" >/dev/null
              if [ "$CONTROL_PLANE_STATE" = 'OPEN' ]; then
                jq -e --argjson lr '${{ steps.intent.outputs.expected_ledger }}' --argjson pr '${{ steps.intent.outputs.expected_package }}' '.expectedLedgerRevision==$lr and .expectedPackageRevision==$pr' "$E" >/dev/null
              fi
            fi
          else
            test "$PHASE" = 'CONTROL_PLANE_DEFINITIVE_CAUSAL_PASS_AWAITING_F2_AUTHORIZATION'
            test "$STATUS" = 'CONTROL_PLANE_DEFINITIVE_CAUSAL_PASS'
            test -f "$F2_AUTH_INTENT"
            jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" --arg source '${{ steps.intent.outputs.source }}' --arg digest '${{ steps.intent.outputs.digest }}' '.status=="USER_AUTHORIZATION_RECEIVED" and .authorizationIdentityDigest==$auth and .candidateArtifactId==$artifact and .candidateArtifactDigest==$digest and .candidateSourceHead==$source and .oneShotOnly==true and .replayAllowed==false and .scope.runtimeReadOnly==true and .scope.secrets==true and .scope.firestoreRead==true and .scope.browser==true and .scope.writes==false and .scope.deploy==false and .scope.production==false and .scope.main==false and .scope.merge==false' "$F2_AUTH_INTENT" >/dev/null
            jq -e --arg auth "$F2_AUTH_IDENTITY" '.authorizationBoundary.preparedAuthorizationIdentityDigest==$auth and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT"' "$LEDGER" >/dev/null
          fi

      - id: regression_reopen
        name: Reduce durable control-plane regression and reopen Iteration 1
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_REGRESSION_REOPEN'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT360_PUBLICATION_CLASS: CONTROL_PLANE_REGRESSION
          ORBIT360_PUBLICATION_TRANSACTION_OUT: ${{ runner.temp }}/control-plane-regression-publication.json
          ORBIT360_PUBLICATION_COMMIT_MESSAGE: 'gate(control-plane): reopen regression stop-retry'
        shell: bash
        run: |
          set -euo pipefail
          node "$OWNER" --transition CONTROL_PLANE_REGRESSION_REOPEN --expected-revision '${{ steps.intent.outputs.expected_ledger }}' --expected-package-revision '${{ steps.intent.outputs.expected_package }}' --control-plane-failure-evidence '${{ steps.intent.outputs.control_plane_failure_evidence }}' | tee "$RUNNER_TEMP/regression-reopen.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_REGRESSION_REOPENED_STOP_RETRY" and .progress==75 and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$RUNNER_TEMP/regression-reopen.json" >/dev/null
          node tools/orbit360-terminal-truth-invariant-v20260824.mjs
          node tools/orbit360-control-plane-independent-readback-v20260820.mjs
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PREPARED" and .publicationClass=="CONTROL_PLANE_REGRESSION" and .canonicalRunner==true and .diffCheckPass==true and .commitTreePass==true and .remoteCASPass==true and .pushDryRunPass==true' "$ORBIT360_PUBLICATION_TRANSACTION_OUT" >/dev/null

      - id: regression_publish
        name: Publish regression reopen exact prepared commit with remote CAS and readback
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_REGRESSION_REOPEN' && steps.regression_reopen.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node "$PUBLICATION_OWNER" --publish-validated "$RUNNER_TEMP/control-plane-regression-publication.json" | tee "$RUNNER_TEMP/control-plane-regression-publish.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PUBLISHED" and .publicationClass=="CONTROL_PLANE_REGRESSION" and .pushPass==true and .remoteReadbackPass==true and .localReadbackPass==true' "$RUNNER_TEMP/control-plane-regression-publish.json" >/dev/null
          FINAL_HEAD=$(jq -r '.commitSha' "$RUNNER_TEMP/control-plane-regression-publish.json"); [[ "$FINAL_HEAD" =~ ^[a-f0-9]{40}$ ]]
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-regression.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-regression.json" >/dev/null
          jq -e '.activeState.status=="CONTROL_PLANE_REGRESSION_OPEN_STOP_RETRY" and .productionReopeningPackage.authorizationAllowed==false and .progress.productionRouteProgressPct==75' "$LEDGER" >/dev/null
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - id: control_plane_selftest
        name: Run exact-path source-only control-plane selftest
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_SELFTEST'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-control-plane-no-source-rewrite-guard-v20260824.mjs
          ORBIT360_SELFTEST_EXPECTED_LEDGER='${{ steps.intent.outputs.expected_ledger }}' ORBIT360_SELFTEST_EXPECTED_PACKAGE='${{ steps.intent.outputs.expected_package }}' node tools/orbit360-control-plane-selftest-v20260824.mjs | tee "$RUNNER_TEMP/control-plane-selftest.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_SELFTEST_PASS" and .exactF2SourcePathExecuted==true and .classWidePreAuthEvidenceLifecyclePass==true and .classWidePreTerminalEvidenceLifecyclePass==true and .arbitraryFutureFilenameCleanupPass==true and .authorizationMaterialized==false and .requestMaterialized==false and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$RUNNER_TEMP/control-plane-selftest.json" >/dev/null
          test -z "$(git status --porcelain)"

      - id: selftest_handshake
        name: Build durable handshake from this exact selftest run
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_SELFTEST' && steps.control_plane_selftest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" > "$RUNNER_TEMP/jobs.json"
          JOB_ID=$(jq -r '.jobs[] | select(.name=="canonical-control-plane") | .id' "$RUNNER_TEMP/jobs.json" | head -1); [[ "$JOB_ID" =~ ^[0-9]+$ ]]
          E="$EVIDENCE_DIR/control-plane-selftest-handshake-run-${GITHUB_RUN_ID}-v20260824.json"
          jq -n --argjson run "$GITHUB_RUN_ID" --argjson job "$JOB_ID" --argjson pr '${{ github.event.pull_request.number }}' --arg base '${{ steps.intent.outputs.live_base }}' --arg intentHead '${{ github.event.pull_request.head.sha }}' --argjson lr '${{ steps.intent.outputs.expected_ledger }}' --argjson pkg '${{ steps.intent.outputs.expected_package }}' --argjson artifact '${{ steps.intent.outputs.artifact }}' --arg source '${{ steps.intent.outputs.source }}' --slurpfile s "$RUNNER_TEMP/control-plane-selftest.json" '{schemaVersion:"orbit360-control-plane-selftest-handshake-v2-full-path",ok:true,status:"CONTROL_PLANE_SELFTEST_HANDSHAKE_PASS",classification:"PASS",controlPlaneSelftestPass:true,runId:$run,jobId:$job,technicalPullRequest:$pr,canonicalBaseHead:$base,intentHead:$intentHead,expectedLedgerRevision:$lr,expectedPackageRevision:$pkg,candidateArtifactId:$artifact,candidateSourceHead:$source,exactF2SourcePathExecuted:$s[0].exactF2SourcePathExecuted,classWidePreAuthEvidenceLifecyclePass:$s[0].classWidePreAuthEvidenceLifecyclePass,classWidePreTerminalEvidenceLifecyclePass:$s[0].classWidePreTerminalEvidenceLifecyclePass,arbitraryFutureFilenameCleanupPass:$s[0].arbitraryFutureFilenameCleanupPass,authorizationMaterialized:false,requestMaterialized:false,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,productionTouched:false,replayAllowed:false,containsPII:false,containsSecrets:false}' > "$E"
          jq -e '.ok==true and .exactF2SourcePathExecuted==true and .classWidePreAuthEvidenceLifecyclePass==true and .classWidePreTerminalEvidenceLifecyclePass==true and .arbitraryFutureFilenameCleanupPass==true' "$E" >/dev/null
          echo "evidence=$E" >> "$GITHUB_OUTPUT"

      - id: selftest_publish
        name: Publish durable selftest handshake with remote CAS
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_SELFTEST' && steps.selftest_handshake.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          E='${{ steps.selftest_handshake.outputs.evidence }}'; mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" = '1'; test "${CHANGED[0]}" = "$E"
          git config user.name 'orbit360-control-plane'; git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "$E"; git diff --cached --check; git commit -m 'test(control-plane): publish exact-path handshake evidence'
          FINAL_HEAD=$(git rev-parse HEAD); git fetch --no-tags origin "$ORBIT360_BRANCH"; test "$(git rev-parse FETCH_HEAD)" = '${{ steps.intent.outputs.live_base }}'; git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${ORBIT360_BRANCH}"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - id: control_plane_close
        name: Close control-plane hardening through canonical owner
        if: steps.intent.outputs.mode == 'CONTROL_PLANE_HARDENING_CLOSE'
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT360_PUBLICATION_CLASS: CONTROL_PLANE_CLOSE
          ORBIT360_PUBLICATION_TRANSACTION_OUT: ${{ runner.temp }}/control-plane-close-publication.json
          ORBIT360_PUBLICATION_COMMIT_MESSAGE: 'gate(control-plane): close full-path causal hardening'
        shell: bash
        run: |
          set -euo pipefail
          E='${{ steps.intent.outputs.control_plane_evidence }}'
