name: Orbit360 Continuity Canonical Source Only
# Final clean invocation after read-only proof of owner, projection, composite, readback, staging, local commit and CAS.

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'
      - 'orbit360-platform/docs/orbit360-continuity-writer-registry-v20260820.json'
      - 'orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-continuity-projection-atomic-v20260820.mjs'
      - 'tools/orbit360-control-plane-composite-invariant-v20260820.mjs'
      - 'tools/orbit360-control-plane-independent-readback-v20260820.mjs'
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  pull-requests: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  canonical-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preflight closed package and remote CAS
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ays/backend-tenant-lab-v99-20260703
        run: |
          set -u
          START_HEAD=$(git rev-parse HEAD) || exit 51
          git fetch origin "$BRANCH" || exit 52
          REMOTE_HEAD=$(git rev-parse "origin/$BRANCH") || exit 53
          test "$REMOTE_HEAD" = "$START_HEAD" || exit 54
          STATUS=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').status") || exit 55
          STEP=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').resumeProtocol.firstIncompleteStep") || exit 56
          RECONCILED=$(node -p "Boolean(require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').controlPlaneClosure?.status === 'CLOSED_PASS_RECONCILED')") || exit 57
          test "$STATUS" = "CLOSED_PASS" || exit 58
          test "$STEP" = "CP-11" || exit 59
          if [ "$RECONCILED" = "true" ]; then MODE=verify; else MODE=reconcile; fi
          echo "START_HEAD=$START_HEAD" >> "$GITHUB_ENV"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          payload=$(printf '{"state":"success","context":"orbit360/reconcile-preflight","description":"preflight + initial CAS PASS; mode=%s"}' "$MODE")
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Apply revisioned post-close transition
        if: env.MODE == 'reconcile'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision") || exit 61
          PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision") || exit 62
          node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition POST_CLOSE_RECONCILE_CONTROL_PLANE_METADATA || exit 63
          NEXT_LR=$((LR+1))
          echo "NEXT_LR=$NEXT_LR" >> "$GITHUB_ENV"
          payload='{"state":"success","context":"orbit360/reconcile-owner","description":"revision-aware owner PASS"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Build atomic projections
        if: env.MODE == 'reconcile'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$NEXT_LR" || exit 71
          payload='{"state":"success","context":"orbit360/reconcile-projection","description":"atomic projection PASS"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Composite invariant and independent readback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ "$MODE" = "reconcile" ]; then
            node tools/orbit360-control-plane-composite-invariant-v20260820.mjs > orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-composite-v20260820.json || exit 81
            ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-11 --expected-package-status CLOSED_PASS > orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-readback-v20260820.json || exit 82
            node -e "const fs=require('fs');const L=require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json');const P=require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json');const out={schemaVersion:'orbit360-postclose-reconciliation-evidence-v1',ok:true,status:'POST_CLOSE_CONTROL_PLANE_METADATA_RECONCILED_PASS',ledgerRevision:L.revision,packageRevision:P.revision,firstIncompleteStep:P.resumeProtocol.firstIncompleteStep,atomicProjection:L.continuityControl.syncTool,compositeInvariant:L.continuityControl.invariant,runtimeAuthorized:false,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,operationalWrites:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false};fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-metadata-reconciliation-v20260820.json',JSON.stringify(out,null,2)+'\n');" || exit 85
          else
            node tools/orbit360-control-plane-composite-invariant-v20260820.mjs || exit 83
            ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-11 --expected-package-status CLOSED_PASS || exit 84
          fi
          payload='{"state":"success","context":"orbit360/reconcile-audit","description":"composite + independent readback PASS"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Stage and create local reconciliation commit
        if: env.MODE == 'reconcile'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name "orbit360-control-plane"
          git config user.email "orbit360-control-plane@users.noreply.github.com"
          git add orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json orbit360-platform/docs/orbit360-live-state-v1.json orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-composite-v20260820.json orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-readback-v20260820.json orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-metadata-reconciliation-v20260820.json || exit 91
          git diff --cached --quiet && exit 92
          git commit -m "fix(control-plane): reconcile post-close canonical owner metadata" || exit 93
          CLOSURE_SHA=$(git rev-parse HEAD) || exit 94
          echo "CLOSURE_SHA=$CLOSURE_SHA" >> "$GITHUB_ENV"
          payload='{"state":"success","context":"orbit360/reconcile-local-commit","description":"staging + local commit PASS"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Final CAS and fast-forward publication
        if: env.MODE == 'reconcile'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ays/backend-tenant-lab-v99-20260703
        run: |
          set -u
          git fetch origin "$BRANCH" || exit 101
          REMOTE_HEAD=$(git rev-parse "origin/$BRANCH") || exit 102
          test "$REMOTE_HEAD" = "$START_HEAD" || exit 103
          git push origin "HEAD:$BRANCH" || exit 104
          payload='{"state":"success","context":"orbit360/hardening-closed","description":"post-close metadata reconciled; CLOSED_PASS"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CLOSURE_SHA" -d "$payload" >/dev/null
          payload='{"state":"success","context":"orbit360/reconcile-push","description":"final CAS + fast-forward push PASS"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Publish verification status
        if: env.MODE == 'verify'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload='{"state":"success","context":"orbit360/hardening-closed","description":"reconciled CLOSED_PASS verified"}'
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
