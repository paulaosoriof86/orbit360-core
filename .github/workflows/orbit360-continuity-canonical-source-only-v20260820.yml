      - name: Normalize transient evidence surface before terminal reconcile
        if: always() && steps.materialize.outcome == 'success' && steps.terminal_evidence.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/orbit360-validar-gate-contracts-v20260717.mjs tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json; do if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git restore "$f"; fi; done
          rm -rf node_modules
          TERMINAL='${{ steps.terminal_evidence.outputs.evidence }}'; node "$EVIDENCE_LIFECYCLE" --phase pre-terminal --preserve "$TERMINAL" | tee "$RUNNER_TEMP/pre-terminal-lifecycle.json"; jq -e --arg terminal "$TERMINAL" '.ok==true and .remaining==[$terminal]' "$RUNNER_TEMP/pre-terminal-lifecycle.json" >/dev/null

      - id: reconcile
        name: Reconcile terminal exactly once through canonical owner
        if: always() && steps.materialize.outcome == 'success' && steps.terminal_evidence.outcome == 'success'
        env:
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
          GH_TOKEN: ${{ github.token }}
          ORBIT360_PUBLICATION_CLASS: F2_TERMINAL
          ORBIT360_PUBLICATION_TRANSACTION_OUT: ${{ runner.temp }}/f2-terminal-publication.json
          ORBIT360_PUBLICATION_COMMIT_MESSAGE: 'gate(f2): reconcile generic-intent one-shot terminal'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE"); node "$OWNER" --transition F2_RUNTIME_TERMINAL_RECONCILE_GENERIC --expected-revision "$LR" --expected-package-revision "$PRV" --terminal-evidence "$TERMINAL" | tee "$RUNNER_TEMP/f2-terminal-reconcile.json"; jq -e '.ok==true and .status=="F2_RUNTIME_TERMINAL_RECONCILED_GENERIC" and .replayAllowed==false' "$RUNNER_TEMP/f2-terminal-reconcile.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs; node tools/orbit360-documentation-state-discovery-v20260821.mjs
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PREPARED" and .publicationClass=="F2_TERMINAL" and .canonicalRunner==true and .diffCheckPass==true and .commitTreePass==true and .remoteCASPass==true and .pushDryRunPass==true' "$ORBIT360_PUBLICATION_TRANSACTION_OUT" >/dev/null

      - id: terminalpublish
        name: Publish terminal exact prepared commit with compare-and-swap
        if: always() && steps.materialize.outcome == 'success' && steps.authpublish.outcome == 'success' && steps.reconcile.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node "$PUBLICATION_OWNER" --publish-validated "$RUNNER_TEMP/f2-terminal-publication.json" | tee "$RUNNER_TEMP/f2-terminal-publish.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PUBLISHED" and .publicationClass=="F2_TERMINAL" and .pushPass==true and .remoteReadbackPass==true and .localReadbackPass==true' "$RUNNER_TEMP/f2-terminal-publish.json" >/dev/null
          FINAL_HEAD=$(jq -r '.commitSha' "$RUNNER_TEMP/f2-terminal-publish.json"); [[ "$FINAL_HEAD" =~ ^[a-f0-9]{40}$ ]]; echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - id: failurepublish
        name: Atomically publish terminal FAIL exact prepared commit when accepted state publication failed
        if: always() && steps.materialize.outcome == 'success' && steps.authpublish.outcome == 'failure' && steps.reconcile.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node "$PUBLICATION_OWNER" --publish-validated "$RUNNER_TEMP/f2-terminal-publication.json" | tee "$RUNNER_TEMP/f2-failure-publish.json"
          jq -e '.ok==true and .status=="CONTROL_PLANE_PUBLICATION_TRANSACTION_PUBLISHED" and .publicationClass=="F2_TERMINAL" and .pushPass==true and .remoteReadbackPass==true and .localReadbackPass==true' "$RUNNER_TEMP/f2-failure-publish.json" >/dev/null
          FINAL_HEAD=$(jq -r '.commitSha' "$RUNNER_TEMP/f2-failure-publish.json"); [[ "$FINAL_HEAD" =~ ^[a-f0-9]{40}$ ]]; echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Project actual PR body and enforce terminal truth
        if: always() && steps.materialize.outcome == 'success' && steps.terminalpublish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-terminal.json"; curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-terminal.json" >/dev/null
          if jq -e '.ok==true and .classification=="PASS" and .browserMatrixPass==true and .integrityBeforeAfterPass==true and .zeroCrossTenant==true and .zeroUnexpectedWrites==true and .browserRunId==.runId and .integrityRunId==.runId' "$TERMINAL" >/dev/null; then jq -e '.progress.productionRouteProgressPct==85 and .progress.f2TerminalPass==true and .nextAction.id=="AWAIT_EXPLICIT_GO_LIVE_AUTHORIZATION"' "$LEDGER" >/dev/null; echo 'F2_TERMINAL_PASS'; else jq -e '.progress.productionRouteProgressPct==75 and .progress.f2TerminalPass==false and .nextAction.id=="DIAGNOSE_ROOT_CAUSE_BEFORE_ANY_FRESH_AUTHORIZATION"' "$LEDGER" >/dev/null; echo 'F2_TERMINAL_FAIL_NO_REPLAY'; exit 41; fi

      - name: Project prepublication FAIL and enforce STOP_RETRY truth
        if: always() && steps.materialize.outcome == 'success' && steps.failurepublish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL: ${{ steps.terminal_evidence.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-prepublication-fail.json"; curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-prepublication-fail.json" >/dev/null
          jq -e '.classification=="PIPELINE_MECHANISM_FAILURE" and .runtimeExecuted==false and .browserExecuted==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$TERMINAL" >/dev/null
          jq -e '.progress.productionRouteProgressPct==75 and .progress.f2TerminalPass==false and .activeState.status=="F2_TERMINAL_RECONCILED_NO_REPLAY" and .nextAction.id=="DIAGNOSE_ROOT_CAUSE_BEFORE_ANY_FRESH_AUTHORIZATION"' "$LEDGER" >/dev/null
          echo 'F2_PREPUBLICATION_FAIL_CANONICALLY_REDUCED_STOP_RETRY'; exit 41