name: Orbit360 Continuity Canonical Source Only
# TERMINAL/INERT OWNER after STOP_RETRY on 2026-08-22.
# No automatic trigger remains. Re-enable only when a dispatch-capable execution path is available.

on:
  workflow_dispatch:
    inputs:
      transition:
        description: 'Readback only while Macro-2 trigger mechanism is terminal'
        required: true
        default: 'READBACK_ONLY'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  POINTER: .github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json
  PREFLIGHT: tools/orbit360-macro2-pipeline-preflight-v20260821.mjs

jobs:
  fail-closed-readback-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce terminal readback only
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.transition }}" = 'READBACK_ONLY'
          test "$(jq -r '.status' "$POINTER")" = 'IDLE'
          test "$(jq -r '.mode' "$POINTER")" = 'IDLE'
          test "$(jq -r '.allowedExecutions' "$POINTER")" = '0'
          test "$(jq -r '.replayAllowed' "$POINTER")" = 'false'
          test "$(jq -r '.lastTerminal.classification' "$POINTER")" = 'PIPELINE_MECHANISM_FAILURE'
          echo 'MACRO2_TRIGGER_MECHANISM_TERMINAL_READBACK_PASS'
