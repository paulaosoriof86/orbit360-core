name: Orbit360 Continuity Canonical Source Only
# CONTROL_PLANE_CONVERGENCE_V1
# Sole physical writer for operational continuity state.
# Durable evidence -> transition owner -> ledger -> derived projections -> convergence/readback.
# Macro-2 is CLOSED_PASS and cannot be rebuilt or replayed.

on:
  workflow_dispatch:
    inputs:
      transition:
        description: Readback only
        required: true
        type: string
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
      - '.github/workflows/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml'
      - '.github/orbit360-authorizations/f2-runtime-authorization-intent-*.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-continuity-projection-atomic-v20260820.mjs'
      - 'tools/orbit360-control-plane-evidence-convergence-v20260822.mjs'
      - 'tools/orbit360-control-plane-composite-invariant-v20260820.mjs'
      - 'tools/orbit360-control-plane-independent-readback-v20260820.mjs'
      - 'tools/orbit360-documentation-state-discovery-v20260821.mjs'
      - 'tools/orbit360-workflow-operational-surface-audit-v20260820.mjs'
      - 'tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs'
      - 'tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs'
      - 'tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json'
      - 'tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json'
      - 'tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json'
      - 'orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json'
      - 'orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json'
      - 'orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json'
      - 'orbit360-platform/docs/orbit360-live-state-v1.json'
      - 'orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json'
      - 'orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md'
      - 'orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md'
      - 'README.md'
      - 'orbit360-platform/CHANGELOG.md'
  workflow_run:
    workflows: ['Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818']
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  OWNER: tools/orbit360-continuity-transition-owner-v20260820.mjs
  F2_WORKFLOW: orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml
  F2_RUNTIME_NAME: Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818
  F2_ARTIFACT_ID: '9485621192'
  F2_AUTH_IDENTITY: 9b50d4e95cf32cc8e693dd184ca945e1f532521f37ea8b64f7a1c65e546baa22
  PREFLIGHT_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json

jobs:
  canonical-control-plane:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'ays/backend-tenant-lab-v99-20260703'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: mode
        name: Resolve canonical transition mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$ORBIT360_BRANCH" || test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH" || [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            test "${{ inputs.transition }}" = 'READBACK_ONLY'
            echo 'mode=READBACK' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            test "${{ github.event.workflow_run.name }}" = "$F2_RUNTIME_NAME"
            test "${{ github.event.workflow_run.head_branch }}" = "$ORBIT360_BRANCH"
            test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
            echo 'mode=TERMINAL' >> "$GITHUB_OUTPUT"
          else
            mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
            mapfile -t INTENTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-authorizations/f2-runtime-authorization-intent-[a-f0-9]\{12\}-v20260823\.json$' || true)
            if [ "${#INTENTS[@]}" = '1' ]; then
              test "${#CHANGED[@]}" = '1'
              echo "intent=${INTENTS[0]}" >> "$GITHUB_OUTPUT"
              echo 'mode=AUTH' >> "$GITHUB_OUTPUT"
            else
              echo 'mode=READBACK' >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "CANONICAL_MODE=$(tail -1 "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Prove single physical writer
        shell: bash
        run: node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - name: Static Macro-3 source readiness before authorization consumption
        if: steps.mode.outputs.mode != 'TERMINAL'
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-continuity-transition-owner-v20260820.mjs
          node --check tools/orbit360-continuity-projection-atomic-v20260820.mjs
          node --check tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
          node --check tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs "$ORBIT360_GATE_ID" | tee "$RUNNER_TEMP/f2-source-precheck.json"
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .executionAuthorized==false and .runtimeAuthorized==false and .browserAuthorized==false and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$RUNNER_TEMP/f2-source-precheck.json" >/dev/null
          if git ls-files --error-unmatch "$PREFLIGHT_EVIDENCE" >/dev/null 2>&1; then git restore "$PREFLIGHT_EVIDENCE"; else rm -f "$PREFLIGHT_EVIDENCE"; fi

      - name: Validate explicit F2 authorization intent and certified artifact
        if: steps.mode.outputs.mode == 'AUTH'
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT: ${{ steps.mode.outputs.intent }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.status' "$INTENT")" = 'USER_AUTHORIZATION_RECEIVED'
          test "$(jq -r '.authorizationIdentityDigest' "$INTENT")" = "$F2_AUTH_IDENTITY"
          test "$(jq -r '.authorizationIdentity.digest' orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json)" = "$F2_AUTH_IDENTITY"
          test "$(jq -r '.candidateArtifactId' "$INTENT")" = "$F2_ARTIFACT_ID"
          test "$(jq -r '.successorCandidate.artifactId' "$LEDGER")" = "$F2_ARTIFACT_ID"
          test "$(jq -r '.candidateArtifactDigest' "$INTENT")" = "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")"
          test "$(jq -r '.candidateSourceHead' "$INTENT")" = "$(jq -r '.successorCandidate.sourceHead' "$LEDGER")"
          test "$(jq -r '.branch' "$INTENT")" = "$ORBIT360_BRANCH"
          test "$(jq -r '.pullRequest' "$INTENT")" = '5'
          jq -e '.scope.runtimeReadOnly==true and .scope.secrets==true and .scope.firestoreRead==true and .scope.browser==true and .scope.writes==false and .scope.deploy==false and .scope.production==false and .scope.main==false and .scope.merge==false and .containsPII==false and .containsSecrets==false' "$INTENT" >/dev/null
          jq -e '.authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT"' "$LEDGER" >/dev/null
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${F2_ARTIFACT_ID}" > "$RUNNER_TEMP/f2-artifact.json"
          jq -e --argjson id "$F2_ARTIFACT_ID" --arg digest "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/f2-artifact.json" >/dev/null

      - id: materialize
        name: Persist authorization and materialize exactly one immutable F2 request
        if: steps.mode.outputs.mode == 'AUTH'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" | tee "$RUNNER_TEMP/f2-auth-persist.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_AUTHORIZATION_PERSISTED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-auth-persist.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_REQUEST_MATERIALIZE --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" --parent-head "$GITHUB_SHA" | tee "$RUNNER_TEMP/f2-request-materialize.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_REQUEST_MATERIALIZED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-request-materialize.json" >/dev/null
          REQUEST=$(jq -r '.authorizationBoundary.activeRequestPath' "$LEDGER")
          test -n "$REQUEST" && test -f "$REQUEST"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          jq -e '.authorizationBoundary.activeRuntimeAuthorization==true and .authorizationBoundary.freshAuthorizationRequired==false and (.authorizationBoundary.activeRequestPath|type=="string") and .productionReopeningPackage.requestMaterializationAllowed==false and .nextAction.id=="RUN_F2_SOURCE_AND_RUNTIME_PREFLIGHT_FAIL_CLOSED"' "$LEDGER" >/dev/null

      - name: Validate authorized state before publication
        if: steps.mode.outputs.mode == 'AUTH'
        shell: bash
        run: |
          set -euo pipefail
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-auth.json"
          jq -e '.ok==true and .authorized==true and .authorizationPersisted==true and .requestMaterialized==true and .runtimeAllowed==false and .productionRouteProgressPct==75' "$RUNNER_TEMP/convergence-auth.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: authpublish
        name: Publish one atomic authorized state transition with remote CAS
        if: steps.mode.outputs.mode == 'AUTH'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|.github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|README.md|orbit360-platform/CHANGELOG.md|orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|orbit360-platform/docs/orbit360-live-state-v1.json|orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_AUTH_PUBLICATION_SURFACE:$f" >&2; exit 41;;
            esac
          done
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): materialize authorized one-shot request'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch origin "$ORBIT360_BRANCH"
          test "$(git rev-parse origin/$ORBIT360_BRANCH)" = "$GITHUB_SHA"
          git push origin "HEAD:$ORBIT360_BRANCH"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Converge actual PR body and dispatch F2 read-only runtime once
        if: steps.mode.outputs.mode == 'AUTH'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ steps.materialize.outputs.request }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-patch.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-patch.json" > "$RUNNER_TEMP/pr-after.json"
          jq -r '.body' "$RUNNER_TEMP/pr-after.json" > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-auth-pr.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==true and .requestMaterialized==true and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-auth-pr.json" >/dev/null
          jq -n --arg ref "$ORBIT360_BRANCH" --arg request "$REQUEST" --arg auth "$F2_AUTH_IDENTITY" '{ref:$ref,inputs:{request_path:$request,authorization_identity:$auth}}' > "$RUNNER_TEMP/f2-dispatch.json"
          curl -L --fail --silent --show-error -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${F2_WORKFLOW}/dispatches" --data-binary @"$RUNNER_TEMP/f2-dispatch.json" | grep -q '^204$'
          echo 'F2_ONE_SHOT_RUNTIME_DISPATCHED'

      - id: terminal
        name: Read and validate durable F2 terminal evidence
        if: steps.mode.outputs.mode == 'TERMINAL'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > "$RUNNER_TEMP/artifacts.json"
          URL=$(jq -r --arg name "orbit360-f2-productive-acceptance-${RUN_ID}" '.artifacts[]|select(.name==$name and .expired==false)|.archive_download_url' "$RUNNER_TEMP/artifacts.json" | head -1)
          test -n "$URL"
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$URL" -o "$RUNNER_TEMP/f2-evidence.zip"
          mkdir -p "$RUNNER_TEMP/f2-evidence"; unzip -q "$RUNNER_TEMP/f2-evidence.zip" -d "$RUNNER_TEMP/f2-evidence"
          SRC=$(find "$RUNNER_TEMP/f2-evidence" -type f -name "f2-final-run-${RUN_ID}.json" -print -quit)
          test -n "$SRC"
          DEST="orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-dispatch-${RUN_ID}.json"
          cp "$SRC" "$DEST"
          jq -e --arg run "$RUN_ID" --argjson artifact "$F2_ARTIFACT_ID" '.runId==$run and .candidateArtifactId==$artifact and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionHostingTouched==false and (.classification=="PASS" or .classification=="FUNCTIONAL_DEFECT" or .classification=="VALIDATOR_STALE" or .classification=="DATA_CONTRACT_FAILURE" or .classification=="ENVIRONMENT_FAILURE" or .classification=="PIPELINE_MECHANISM_FAILURE" or .classification=="SECURITY_FAILURE")' "$DEST" >/dev/null
          if jq -e '.ok==true and .classification=="PASS"' "$DEST" >/dev/null; then test "$RUN_CONCLUSION" = 'success'; else test "$RUN_CONCLUSION" = 'failure'; fi
          echo "evidence=$DEST" >> "$GITHUB_OUTPUT"

      - name: Reconcile F2 terminal exactly once through transition owner
        if: steps.mode.outputs.mode == 'TERMINAL'
        env:
          EVIDENCE: ${{ steps.terminal.outputs.evidence }}
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_TERMINAL_RECONCILE_GENERIC --expected-revision "$LR" --expected-package-revision "$PRV" --terminal-evidence "$EVIDENCE" | tee "$RUNNER_TEMP/f2-terminal-reconcile.json"
          jq -e '.ok==true and .status=="F2_RUNTIME_TERMINAL_RECONCILED_GENERIC" and .replayAllowed==false' "$RUNNER_TEMP/f2-terminal-reconcile.json" >/dev/null
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-terminal.json"
          jq -e '.ok==true and .authorized==false and .authorizationPersisted==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-terminal.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: terminalpublish
        name: Publish one atomic terminal transition with remote CAS
        if: steps.mode.outputs.mode == 'TERMINAL'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-dispatch-*.json|.github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|.github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|README.md|orbit360-platform/CHANGELOG.md|orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|orbit360-platform/docs/orbit360-live-state-v1.json|orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_TERMINAL_PUBLICATION_SURFACE:$f" >&2; exit 41;;
            esac
          done
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): reconcile terminal one-shot evidence'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch origin "$ORBIT360_BRANCH"
          test "$(git rev-parse origin/$ORBIT360_BRANCH)" = "${{ github.event.workflow_run.head_sha }}"
          git push origin "HEAD:$ORBIT360_BRANCH"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Project terminal state into actual PR body
        if: steps.mode.outputs.mode == 'TERMINAL'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-patch.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-patch.json" > "$RUNNER_TEMP/pr-after.json"
          jq -r '.body' "$RUNNER_TEMP/pr-after.json" > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-terminal-pr.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-terminal-pr.json" >/dev/null
          echo 'CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS'

      - name: Inert canonical readback including actual PR body
        if: steps.mode.outputs.mode == 'READBACK'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" | jq -r '.body' > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-readback.json"
          jq -e '.ok==true and .prBodyValidated==true' "$RUNNER_TEMP/convergence-readback.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          ORBIT360_PR_BODY_FILE="$RUNNER_TEMP/pr-body.txt" node tools/orbit360-control-plane-independent-readback-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          test -z "$(git status --porcelain)"
          echo 'CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS'
