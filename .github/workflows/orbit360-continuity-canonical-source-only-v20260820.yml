          node "$OWNER" --transition F2_RUNTIME_TERMINAL_RECONCILE_GENERIC --expected-revision "$LR" --expected-package-revision "$PRV" --terminal-evidence "$TERMINAL" | tee "$RUNNER_TEMP/f2-terminal-reconcile.json"
