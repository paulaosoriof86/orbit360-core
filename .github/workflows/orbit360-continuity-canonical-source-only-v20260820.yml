name: Orbit360 Continuity Canonical Source Only
# CONTROL_PLANE_CONVERGENCE_V1
# MACRO3_INLINE_F2_V1
# Sole physical workflow for Macro-3. No workflow_dispatch/workflow_run chaining.
# Explicit authorization intent -> source gate -> one-shot accept -> inline read-only F2 -> terminal reducer.

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
      - '.github/orbit360-authorizations/f2-runtime-authorization-intent-*.json'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs'
      - 'tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs'
      - 'tools/orbit360-control-plane-evidence-convergence-v20260822.mjs'
      - 'tools/orbit360-workflow-operational-surface-audit-v20260820.mjs'
      - 'tools/orbit360-macro3-mechanism-preflight-v20260823.mjs'

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_EXPECTED_REQUEST_VERSION: F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V3
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  LEDGER: orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json
  PACKAGE: orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json
  BOUNDARY: orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json
  PR_STATE: orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md
  OWNER: tools/orbit360-continuity-transition-owner-v20260820.mjs
  CONVERGENCE: tools/orbit360-control-plane-evidence-convergence-v20260822.mjs
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  F2_ARTIFACT_ID: '9485621192'
  F2_AUTH_IDENTITY: 9b50d4e95cf32cc8e693dd184ca945e1f532521f37ea8b64f7a1c65e546baa22

jobs:
  canonical-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: mode
        name: Resolve deterministic Macro-3 mode
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          mapfile -t DIRECT_INTENTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-authorizations/f2-runtime-authorization-intent-[a-f0-9]\{12\}-v20260823\.json$' || true)
          if [ "${#DIRECT_INTENTS[@]}" = '1' ] && [ "${#CHANGED[@]}" = '1' ]; then
            echo "intent=${DIRECT_INTENTS[0]}" >> "$GITHUB_OUTPUT"
            echo 'mode=AUTH' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RECOVERY_OK=true
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml|\
              .github/workflows/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml|\
              tools/orbit360-continuity-transition-owner-v20260820.mjs|\
              tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs|\
              tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs|\
              tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs|\
              tools/orbit360-control-plane-evidence-convergence-v20260822.mjs|\
              tools/orbit360-workflow-operational-surface-audit-v20260820.mjs|\
              tools/orbit360-macro3-mechanism-preflight-v20260823.mjs|\
              orbit360-platform/docs/BUGFIX-MACRO3-ACTIONS-TRIGGER-MECHANISM-20260823.md) ;;
              *) RECOVERY_OK=false ;;
            esac
          done
          mapfile -t PENDING < <(find .github/orbit360-authorizations -maxdepth 1 -type f -name 'f2-runtime-authorization-intent-*.json' -print | sort | while read -r f; do
            jq -e --arg auth "$F2_AUTH_IDENTITY" --argjson artifact "$F2_ARTIFACT_ID" '.status=="USER_AUTHORIZATION_RECEIVED" and .authorizationIdentityDigest==$auth and .candidateArtifactId==$artifact and .oneShotOnly==true and .replayAllowed==false' "$f" >/dev/null && echo "$f" || true
          done)
          if $RECOVERY_OK && [ "${#PENDING[@]}" = '1' ] && jq -e '.authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT"' "$LEDGER" >/dev/null; then
            AUTH_RECORD=".github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-${F2_AUTH_IDENTITY:0:12}-v20260820.json"
            REQUEST_RECORD=".github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-${F2_AUTH_IDENTITY:0:12}-v20260820.json"
            test ! -e "$AUTH_RECORD"
            test ! -e "$REQUEST_RECORD"
            echo "intent=${PENDING[0]}" >> "$GITHUB_OUTPUT"
            echo 'mode=AUTH_RECOVERY' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=READBACK' >> "$GITHUB_OUTPUT"
          fi

      - name: Prove single operational workflow and no chaining surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t WORKFLOWS < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          test "${#WORKFLOWS[@]}" = '1'
          test "${WORKFLOWS[0]}" = '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
          ! grep -q 'git pull --rebase' .github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          node tools/orbit360-macro3-mechanism-preflight-v20260823.mjs
          jq -e '.ok==true and .status=="MACRO3_MECHANISM_PREFLIGHT_PASS" and .allowedExecutionsAfterAccept==0 and .replayAllowed==false' "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json" >/dev/null

      - name: Static Macro-3 source readiness before authorization consumption
        shell: bash
        run: |
          set -euo pipefail
          node --check "$OWNER"
          node --check tools/orbit360-continuity-projection-atomic-v20260820.mjs
          node --check "$CONVERGENCE"
          node --check tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs "$ORBIT360_GATE_ID" | tee "$RUNNER_TEMP/f2-source-precheck.json"
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .executionAuthorized==false and .runtimeAuthorized==false and .browserAuthorized==false and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$RUNNER_TEMP/f2-source-precheck.json" >/dev/null
          if git ls-files --error-unmatch "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null 2>&1; then git restore "$EVIDENCE_DIR/preflight-sanitizado.json"; else rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"; fi
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-source.json"
          jq -e '.ok==true and .productionRouteProgressPct==75 and .authorized==false and .requestMaterialized==false and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-source.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs
          if git ls-files --error-unmatch "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json" >/dev/null 2>&1; then git restore "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json"; else rm -f "$EVIDENCE_DIR/macro3-mechanism-preflight-sanitized-v20260823.json"; fi

      - name: Inert readback when there is no valid pending authorization transition
        if: steps.mode.outputs.mode == 'READBACK'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" | jq -r '.body' > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-readback.json"
          jq -e '.ok==true and .prBodyValidated==true' "$RUNNER_TEMP/convergence-readback.json" >/dev/null
          test -z "$(git status --porcelain)"
          echo 'CONTROL_PLANE_EVIDENCE_CONVERGENCE_PASS'

      - name: Validate explicit F2 intent and certified artifact
        if: steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY'
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT: ${{ steps.mode.outputs.intent }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.status' "$INTENT")" = 'USER_AUTHORIZATION_RECEIVED'
          test "$(jq -r '.authorizationIdentityDigest' "$INTENT")" = "$F2_AUTH_IDENTITY"
          test "$(jq -r '.authorizationIdentity.digest' "$BOUNDARY")" = "$F2_AUTH_IDENTITY"
          test "$(jq -r '.candidateArtifactId' "$INTENT")" = "$F2_ARTIFACT_ID"
          test "$(jq -r '.successorCandidate.artifactId' "$LEDGER")" = "$F2_ARTIFACT_ID"
          test "$(jq -r '.candidateArtifactDigest' "$INTENT")" = "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")"
          test "$(jq -r '.candidateSourceHead' "$INTENT")" = "$(jq -r '.successorCandidate.sourceHead' "$LEDGER")"
          test "$(jq -r '.branch' "$INTENT")" = "$ORBIT360_BRANCH"
          test "$(jq -r '.pullRequest' "$INTENT")" = '5'
          jq -e '.scope.runtimeReadOnly==true and .scope.secrets==true and .scope.firestoreRead==true and .scope.browser==true and .scope.writes==false and .scope.deploy==false and .scope.production==false and .scope.main==false and .scope.merge==false and .oneShotOnly==true and .replayAllowed==false and .containsPII==false and .containsSecrets==false' "$INTENT" >/dev/null
          jq -e '.authorizationBoundary.activeRuntimeAuthorization==false and .authorizationBoundary.activeRequestPath==null and (.authorizationBoundary.runtimeAttemptAccepted // false)==false and .productionReopeningPackage.authorizationAllowed==true and .nextAction.id=="AWAIT_EXPLICIT_F2_RUNTIME_AUTHORIZATION_ONE_SHOT"' "$LEDGER" >/dev/null
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${F2_ARTIFACT_ID}" > "$RUNNER_TEMP/f2-artifact.json"
          jq -e --argjson id "$F2_ARTIFACT_ID" --arg digest "$(jq -r '.successorCandidate.artifactDigest' "$LEDGER")" '.id==$id and .expired==false and .digest==$digest' "$RUNNER_TEMP/f2-artifact.json" >/dev/null

      - id: materialize
        name: Persist authorization, request and consume runtime-attempt budget atomically
        if: steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY'
        shell: bash
        run: |
          set -euo pipefail
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_AUTHORIZATION_PERSIST --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" > "$RUNNER_TEMP/f2-auth-persist.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_AUTHORIZATION_PERSISTED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-auth-persist.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_REQUEST_MATERIALIZE --expected-revision "$LR" --expected-package-revision "$PRV" --authorization-identity "$F2_AUTH_IDENTITY" --parent-head "$GITHUB_SHA" > "$RUNNER_TEMP/f2-request-materialize.json"
          jq -e '.ok==true and .status=="ORBIT360_F2_RUNTIME_REQUEST_MATERIALIZED_SOURCE_ONLY"' "$RUNNER_TEMP/f2-request-materialize.json" >/dev/null
          LR=$(jq -r '.revision' "$LEDGER"); PRV=$(jq -r '.revision' "$PACKAGE")
          node "$OWNER" --transition F2_RUNTIME_ATTEMPT_ACCEPT --expected-revision "$LR" --expected-package-revision "$PRV" --runtime-run-id "$GITHUB_RUN_ID" > "$RUNNER_TEMP/f2-attempt-accept.json"
          jq -e --argjson run "$GITHUB_RUN_ID" '.ok==true and .status=="ORBIT360_F2_RUNTIME_ATTEMPT_ACCEPTED_ONE_SHOT" and .runtimeRunId==$run and .replayAllowed==false' "$RUNNER_TEMP/f2-attempt-accept.json" >/dev/null
          REQUEST=$(jq -r '.authorizationBoundary.activeRequestPath' "$LEDGER")
          test -n "$REQUEST" && test -f "$REQUEST"
          jq -e --argjson run "$GITHUB_RUN_ID" '.authorizationBoundary.activeRuntimeAuthorization==true and .authorizationBoundary.runtimeAttemptAccepted==true and .authorizationBoundary.runtimeRunId==$run and .productionReopeningPackage.requestMaterializationAllowed==false and .nextAction.id=="RUN_F2_SOURCE_AND_RUNTIME_PREFLIGHT_FAIL_CLOSED"' "$LEDGER" >/dev/null
          jq -e --argjson run "$GITHUB_RUN_ID" '.allowedExecutions==0 and .runtimeAttemptAccepted==true and .runtimeAttemptCount==1 and .runtimeRunId==$run and .replayAllowed==false and .consumed==false' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Validate accepted one-shot state before publication
        if: steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY'
        shell: bash
        run: |
          set -euo pipefail
          node "$CONVERGENCE" --repo-only | tee "$RUNNER_TEMP/convergence-attempt.json"
          jq -e '.ok==true and .authorized==true and .authorizationPersisted==true and .requestMaterialized==true and .runtimeAllowed==false and .productionRouteProgressPct==75' "$RUNNER_TEMP/convergence-attempt.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs
          node tools/orbit360-documentation-state-discovery-v20260821.mjs
          node tools/orbit360-workflow-operational-surface-audit-v20260820.mjs

      - id: authpublish
        name: Publish accepted one-shot state with remote CAS
        if: steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain | sed 's/^...//' | sort -u)
          test "${#CHANGED[@]}" -gt 0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-auth-*.json|\
              .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-*.json|\
              .github/orbit360-requests/macro2-canonical-source-activation-pointer-v20260821.json|\
              README.md|orbit360-platform/CHANGELOG.md|\
              orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md|\
              orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json|\
              orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md|\
              orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json|\
              orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json|\
              orbit360-platform/docs/orbit360-live-state-v1.json|\
              orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json|\
              tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json|\
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json|\
              tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json) ;;
              *) echo "PIPELINE_MECHANISM_FAILURE:F2_AUTH_PUBLICATION_SURFACE:$f" >&2; exit 41 ;;
            esac
          done
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add -- "${CHANGED[@]}"
          git diff --cached --check
          git commit -m 'gate(f2): accept one-shot runtime attempt'
          FINAL_HEAD=$(git rev-parse HEAD)
          git fetch origin "$ORBIT360_BRANCH"
          test "$(git rev-parse origin/$ORBIT360_BRANCH)" = "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$ORBIT360_BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_REQUEST_FILE=${{ steps.materialize.outputs.request }}" >> "$GITHUB_ENV"

      - name: Converge actual PR body before runtime
        if: steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{body:.}' < "$PR_STATE" > "$RUNNER_TEMP/pr-body-patch.json"
          curl -L --fail --silent --show-error -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/5" --data-binary @"$RUNNER_TEMP/pr-body-patch.json" > "$RUNNER_TEMP/pr-after.json"
          jq -r '.body' "$RUNNER_TEMP/pr-after.json" > "$RUNNER_TEMP/pr-body.txt"
          node "$CONVERGENCE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" | tee "$RUNNER_TEMP/convergence-attempt-pr.json"
          jq -e '.ok==true and .prBodyValidated==true and .authorized==true and .requestMaterialized==true and .runtimeAllowed==false' "$RUNNER_TEMP/convergence-attempt-pr.json" >/dev/null

      - id: sourceguard
        name: Verify accepted request and reusable rootfixes before F2 gate
        if: steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$ORBIT360_REQUEST_FILE"
          test -f "$REQUEST"
          test "$(jq -r '.status' "$REQUEST")" = 'RUNTIME_ATTEMPT_ACCEPTED_PREFLIGHT_PENDING'
          test "$(jq -r '.allowedExecutions' "$REQUEST")" = '0'
          test "$(jq -r '.runtimeAttemptAccepted' "$REQUEST")" = 'true'
          test "$(jq -r '.runtimeRunId' "$REQUEST")" = "$GITHUB_RUN_ID"
          AUTHORITY=tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json
          CERT="$(jq -r '.candidateCertificationEvidence // ""' "$AUTHORITY")"
          test -n "$CERT" && test -f "$CERT"
          ARTIFACT="$(jq -r '.successorCandidate.artifactId' "$LEDGER")"
          SOURCE="$(jq -r '.successorCandidate.sourceHead' "$LEDGER")"
          ZIP_SHA="$(jq -r '.successorCandidate.zipSha256' "$LEDGER")"
          MANIFEST_SHA="$(jq -r '.successorCandidate.manifestSha256' "$LEDGER")"
          echo "ORBIT360_CANDIDATE_CERTIFICATION_EVIDENCE=$CERT" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_ARTIFACT_ID=$ARTIFACT" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_SOURCE_HEAD=$SOURCE" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_ZIP_SHA256=$ZIP_SHA" >> "$GITHUB_ENV"
          echo "ORBIT360_CANDIDATE_MANIFEST_SHA256=$MANIFEST_SHA" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_FINAL=$EVIDENCE_DIR/f2-final-run-${GITHUB_RUN_ID}.json" >> "$GITHUB_ENV"
          ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$EVIDENCE_DIR/f2-full-runtime-known-rootfixes-selftest-${GITHUB_RUN_ID}.json" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs

      - id: register
        name: Register F2 runtime lifecycle transiently
        if: (steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY') && steps.sourceguard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          git diff --check

      - id: gate
        name: Mandatory canonical F2 gate before artifact or provider/browser
        if: (steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY') && steps.register.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          jq -e --arg run "$GITHUB_RUN_ID" --argjson artifact "$ORBIT360_CANDIDATE_ARTIFACT_ID" '.ok==true and .status=="GO_GATE_CONTRACT" and .classification=="GO_F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY" and .runId==$run and .candidateArtifactId==$artifact and .runtimeAttemptAccepted==true and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .runtimeAuthorized==true and .browserAuthorized==true and .writeAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" >/dev/null

      - id: candidate
        name: Download and fully verify exact F2 candidate after GO
        if: (steps.mode.outputs.mode == 'AUTH' || steps.mode.outputs.mode == 'AUTH_RECOVERY') && steps.gate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$RUNNER_TEMP/f2-artifact-outer.zip"; OUTER_DIR="$RUNNER_TEMP/f2-outer"; CANDIDATE_DIR="$RUNNER_TEMP/f2-candidate"
          rm -rf "$OUTER" "$OUTER_DIR" "$CANDIDATE_DIR"; mkdir -p "$OUTER_DIR" "$CANDIDATE_DIR"
