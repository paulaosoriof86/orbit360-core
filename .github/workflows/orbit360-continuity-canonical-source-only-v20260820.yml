name: Orbit360 Continuity Canonical Source Only
# MACRO1 MAINTENANCE LOCK — 2026-08-21
# This is the sole workflow allowed to publish operational continuity state.
# Until the definitive reducer/audits are installed, pushes are verification-only.

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-continuity-canonical-source-only-v20260820.yml'
      - 'tools/orbit360-continuity-transition-owner-v20260820.mjs'
      - 'tools/orbit360-continuity-projection-atomic-v20260820.mjs'
      - 'tools/orbit360-control-plane-composite-invariant-v20260820.mjs'
      - 'tools/orbit360-control-plane-independent-readback-v20260820.mjs'
      - 'tools/orbit360-workflow-operational-surface-audit-v20260820.mjs'
      - 'tools/orbit360-documentation-state-discovery-v20260821.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit360-continuity-canonical-ays
  cancel-in-progress: false

jobs:
  maintenance-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source-only maintenance boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'ays/backend-tenant-lab-v99-20260703'
          echo '{"ok":true,"status":"MACRO1_CONTROL_PLANE_MAINTENANCE_LOCK","branchMutation":false,"runtimeExecuted":false,"browserExecuted":false,"secretAccess":false,"firestoreRead":false,"operationalWrites":0,"deployExecuted":false,"productionTouched":false}'
