name: Gravicentra I6.5 B4-003 Cumulative Safe-Read LAB Preview 20261029

# Transport of the existing single canonical recovery branch, not a new gate.
# One existing LAB Preview callable plus one immutable build on the existing seven-day Preview channel; preserve origin/session, never LIVE or data.
# Resolve the approved source from Control Plane; stale transport pins are not authority.
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-b4-003-cumulative-safe-read-preview-20261029.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gi-b4003-cumulative-safe-read-preview-20261029
  cancel-in-progress: false

jobs:
  exact-existing-callable-and-hosting-preview:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'build(i6.5 B4-003): trigger cumulative safe-read isolated Preview only'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRANSPORT_SHA: ${{ github.sha }}
      PREVIEW_CHANNEL_ID: gi-i65-b4-sr-41066435386
      EXPECTED_PREVIEW_URL: https://ays-orbit-360-lab--gi-i65-b4-sr-41066435386-r09pl1ti.web.app
      PREDECESSOR_SOURCE_SHA: eb9ce731832d236fedc545185ec7c66bd10849bb
      PREDECESSOR_BUILD_ID: gi-i65-b4-eb9ce731832d-57f234755dc1
      TARGET_FUNCTION: orbit360ProductOperationalCommandPreview
      TARGET_REGION: us-east1
      EXPECTED_SOURCE_PARENT: b5c83cf255afd01cd348c53b904c1c47dbdcb241
      PROJECT_ID: ays-orbit-360-lab
      HOSTING_SITE: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      RELEASE_GATE: I6.5-B4-003
      BUILD_PREFIX: gi-i65-b4
      ENVIRONMENT_REF: firebase-hosting-preview-i6-5-forensic-b4-003
      GRAVICENTRA_B4_003_SCOPED_PREVIEW: 'true'
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - name: Checkout exact single-branch candidate with complete governance ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require exact eleven-file Metas source, one-file transport and source Guard PASS
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const need=(ok,code)=>{if(!ok)throw Error(code);};
          const controlPath='artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json';
          const workflowPath='.github/workflows/gravicentra-b4-003-cumulative-safe-read-preview-20261029.yml';
          const receiptPath='artifacts/orbit360-recovery/release-control/I6_5_B4_003_METAS_ATOMIC_PREVIEW_SOURCE_SUCCESSOR_20261030.json';
          const progressPath='artifacts/orbit360-recovery/release-control/I6_5_B4_003_REAL_PROGRESS_RECONCILIATION_20261030.json';
          const sources=['functions/product-operational-domain.js','orbit360-platform/modules/equipo.js','orbit360-platform/data/store-firestore-product-operational-p0.js'];
          const tests=['tools/gravicentra-b4-003-metas-preview-session.test.cjs','tools/gravicentra-b4-003-metas-atomic-ui.test.cjs','tools/gravicentra-b4-003-metas-preview-projection.test.cjs'];
          const expectedTests={ [tests[0]]:56,[tests[1]]:17,[tests[2]]:5 };
          const ciTestPath='tools/gravicentra-b4-003-scoped-boundary.test.cjs';
          const expected=[...sources,...tests,ciTestPath,controlPath,'tools/gravicentra-i6-control-plane-guard-v1.mjs',receiptPath,progressPath].sort();
          const C=JSON.parse(fs.readFileSync(controlPath,'utf8')),S=C.b4003MetasAtomicPreviewSourceSuccessor20261030;
          need(S&&S.gate==='I6.5/B4-003'&&S.status==='SOURCE_AND_SYNTHETIC_QA_PASS_PREVIEW_UAT_PENDING'&&
           S.previewAuthorizedAfterGuardAndRegressionPass===true&&S.previewFunction===process.env.TARGET_FUNCTION&&
           S.previewRegion===process.env.TARGET_REGION&&S.previewProject===process.env.PROJECT_ID&&
           S.productionPromotionAuthorized===false&&S.authIamRulesChangeAuthorized===false&&
           S.realBusinessWritesAuthorized===false&&S.currentCapabilityAcceptances===0,'METAS_EXACT_PREVIEW_AUTHORITY_REQUIRED');
          need(C.repository===process.env.GITHUB_REPOSITORY&&C.branch===process.env.GITHUB_REF_NAME,'REPOSITORY_BRANCH_MISMATCH');
          need(git('rev-parse','HEAD')===process.env.TRANSPORT_SHA&&git('show','-s','--format=%s','HEAD')===
           'build(i6.5 B4-003): trigger cumulative safe-read isolated Preview only','EXACT_TRANSPORT_MISMATCH');
          need(git('diff','--name-only','HEAD^','HEAD')===workflowPath,'TRANSPORT_MUST_CHANGE_ONLY_EXISTING_WORKFLOW');
          const source=git('log','-1','--format=%H','--',sources[0]);
          need(/^[0-9a-f]{40}$/.test(source)&&git('rev-parse','HEAD^')===source&&
           S.parentHead===process.env.EXPECTED_SOURCE_PARENT&&git('rev-parse',source+'^')===S.parentHead,
           'SOURCE_MUST_BE_DIRECT_CHILD_OF_B5_AND_DIRECT_PARENT_OF_TRANSPORT');
          need(S.receiptPath===receiptPath&&git('hash-object',receiptPath)===S.receiptBlobSha,'METAS_RECEIPT_BINDING_MISMATCH');
          const R=JSON.parse(fs.readFileSync(receiptPath,'utf8'));
          need(R.schema==='GRAVICENTRA_I65_B4003_METAS_ATOMIC_PREVIEW_SOURCE_SUCCESSOR_V1'&&
           R.gate===S.gate&&R.status===S.status&&R.parentHead===S.parentHead&&R.repository===C.repository&&R.branch===C.branch,
           'METAS_RECEIPT_IDENTITY_MISMATCH');
          const b=R.boundaries||{};
          need(b.liveDeployment===false&&b.authIamRulesChange===false&&b.realBusinessWrites===0&&b.newCollections===0&&
           b.newEndpoints===0&&b.newWorkflows===0&&b.freelancerContractInvented===false&&b.authenticatedUatAccepted===false,
           'METAS_BOUNDARY_MISMATCH');
          const P=R.previewTransport||{};
          need(P.reuseExistingChannel===true&&P.hostingChannelId===process.env.PREVIEW_CHANNEL_ID&&
           String(P.expectedPreviewUrl||'').replace(/\/$/,'')===process.env.EXPECTED_PREVIEW_URL&&
           P.predecessorSourceSha===process.env.PREDECESSOR_SOURCE_SHA&&P.predecessorBuildId===process.env.PREDECESSOR_BUILD_ID,
           'SESSION_PRESERVING_EXISTING_PREVIEW_TRANSPORT_REQUIRED');
          const actual=git('diff','--name-only',S.parentHead,source).split(/\r?\n/).filter(Boolean).sort();
          for(const list of [actual,S.atomicCommitPaths||[],R.atomicCommitPaths||[]])
           need(JSON.stringify(list.slice().sort())===JSON.stringify(expected)&&list.length===11,'EXACT_ELEVEN_ATOMIC_PATHS_REQUIRED');
          need(JSON.stringify(Object.keys(R.sourceFiles||{}).sort())===JSON.stringify(sources.slice().sort()),'EXACT_THREE_SOURCE_PATHS_REQUIRED');
          for(const p of sources){const v=R.sourceFiles[p];need(v&&v.causalFinding&&
           git('rev-parse',S.parentHead+':'+p)===v.beforeBlob&&git('rev-parse',source+':'+p)===v.afterBlob&&
           git('hash-object',p)===v.afterBlob,'SOURCE_BLOB_MISMATCH:'+p);}
          need(JSON.stringify(Object.keys(R.regressionTests||{}).sort())===JSON.stringify(tests.slice().sort()),'EXACT_THREE_NEW_REGRESSION_BINDINGS_REQUIRED');
          for(const p of tests){const v=R.regressionTests[p];need(v&&v.syntheticOnly===true&&v.externalRequests===0&&
           Number.isInteger(v.tests)&&v.tests===expectedTests[p]&&git('rev-parse',source+':'+p)===v.blob&&git('hash-object',p)===v.blob,'REGRESSION_BINDING_MISMATCH:'+p);}
          const T=R.requiredCiTestSuccessor;
          need(T&&T.path===ciTestPath&&T.beforeBlob==='26ba2d9d44c4679b0eef9f61032cd511ea4f7e61'&&
           T.afterBlob==='ad2dcd823f579df223c9048490125bb4c410efb0'&&typeof T.reason==='string'&&T.reason.trim().length>0&&
           git('rev-parse',S.parentHead+':'+ciTestPath)===T.beforeBlob&&
           git('rev-parse',source+':'+ciTestPath)===T.afterBlob&&git('hash-object',ciTestPath)===T.afterBlob,
           'REQUIRED_CI_SCOPED_BOUNDARY_SUCCESSOR_BINDING_MISMATCH');
          const backend=fs.readFileSync(sources[0],'utf8');
          need(backend.includes("const PREVIEW_REGION = 'us-east1'")&&backend.includes('exports.orbit360ProductOperationalCommandPreview')&&
           fs.readFileSync('functions/bootstrap.js','utf8').includes("require('./product-operational-domain')"),'EXISTING_PREVIEW_EXPORT_REQUIRED');
          (async()=>{
            const url='https://api.github.com/repos/'+C.repository+'/actions/workflows/gravicentra-release-lock-sync.yml/runs?head_sha='+source+'&per_page=100';
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_READ_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            need(response.ok,'SOURCE_GUARD_API_READ_FAILED_HTTP_'+response.status);
            const body=await response.json();
            const runs=(body.workflow_runs||[]).filter(r=>r.head_sha===source&&r.head_branch===C.branch).sort((a,b)=>b.id-a.id);
            need(runs[0]&&runs[0].status==='completed'&&runs[0].conclusion==='success','LATEST_EXACT_SOURCE_GUARD_SUCCESS_REQUIRED');
            const binding={sourceSha:source,sourceParent:S.parentHead,transportSha:process.env.TRANSPORT_SHA,guardRunId:runs[0].id,sourceBlobs:Object.fromEntries(sources.map(p=>[p,R.sourceFiles[p].afterBlob])),receiptPath,receiptBlobSha:S.receiptBlobSha};
            fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-metas-source-binding.json',JSON.stringify(binding,null,2)+'\n');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-authorized-source.sha',source+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'EXACT_SOURCE_SHA='+source+'\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Exact Metas source: '+source+'\nSource Guard SUCCESS: '+runs[0].id+'\nExisting LAB callable only: '+process.env.TARGET_FUNCTION+' / '+process.env.TARGET_REGION+'\n');
          })().catch(e=>{console.error(String(e.message||e));process.exitCode=1;});
          NODE
          git diff --exit-code
          git diff --cached --exit-code
          SOURCE_SHA=$(cat "$RUNNER_TEMP/gi-authorized-source.sha")
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node tools/gravicentra-b4-003-metas-preview-session.test.cjs
          node tools/gravicentra-b4-003-metas-atomic-ui.test.cjs
          node tools/gravicentra-b4-003-metas-preview-projection.test.cjs
          node tools/gravicentra-b4-003-operational-write-security-regression.test.cjs
          node tools/gravicentra-b4-003-before-image-regression.test.cjs
          node tools/gravicentra-b4-003-scoped-boundary.test.cjs
          node tools/gravicentra-b4-003-cronograma-durable-task.test.cjs
          node tools/gravicentra-b4-003-closeout-source-successor.test.cjs
          PLANTILLAS_SOURCE="$PWD/orbit360-platform/modules/plantillas.js" node artifacts/orbit360-recovery/release-control/b4003-uat-20261029/tests/plantillas-use-lifecycle.test.cjs
          node tools/gravicentra-b4-003-insights-financial-native.test.cjs
          node tools/gravicentra-b4-003-portal-country-lifecycle.test.cjs
          node tools/gravicentra-b4-003-shell-country-sync.test.cjs
          node tools/gravicentra-b4-003-cobros-role-hydration-successor.test.cjs
          node tools/gravicentra-b4-003-insights-plantillas-country-no-seed.test.cjs
          node tools/gravicentra-b4-003-cross-module-readback-contract.test.cjs
          node tools/gravicentra-b4-003-cobros-unassigned-country.test.cjs
          node tools/gravicentra-b4-003-c360-cobros-currency-overdue.test.cjs
          node tools/gravicentra-b4-003-role-context-recovery.test.cjs
          node tools/gravicentra-b4-003-insurer-preview-projection.test.cjs

      - name: Capture exact existing Preview origin and predecessor before any deployment
        run: |
          set -euo pipefail
          test "$PREVIEW_CHANNEL_ID" = 'gi-i65-b4-sr-41066435386'
          test "$EXPECTED_PREVIEW_URL" = 'https://ays-orbit-360-lab--gi-i65-b4-sr-41066435386-r09pl1ti.web.app'
          curl --fail --silent --show-error --location --retry 2 --max-time 30 "$EXPECTED_PREVIEW_URL/__recovery__/build.json" > "$RUNNER_TEMP/gi-preview-predecessor-build.json"
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const raw=fs.readFileSync(process.env.RUNNER_TEMP+'/gi-preview-predecessor-build.json'),meta=JSON.parse(raw);
          if(meta.sourceSha!==process.env.PREDECESSOR_SOURCE_SHA||meta.buildId!==process.env.PREDECESSOR_BUILD_ID||meta.gate!=='I6.5-B4-003')throw Error('EXISTING_PREVIEW_PREDECESSOR_IDENTITY_MISMATCH');
          const record={observedAtUtc:new Date().toISOString(),previewUrl:process.env.EXPECTED_PREVIEW_URL,channelId:process.env.PREVIEW_CHANNEL_ID,sourceSha:meta.sourceSha,buildId:meta.buildId,buildMarkerSha256:crypto.createHash('sha256').update(raw).digest('hex'),sameOriginPreservesExistingBrowserSession:true,hostingLive:false,previousReceiptRemainsHistorical:true};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-preview-predecessor-identity.json',JSON.stringify(record,null,2)+'\n');
          NODE

      - name: Snapshot public LIVE identities before preview
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ > "$RUNNER_TEMP/gi-live-before.html"
          for n in 1 2; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 -D "$RUNNER_TEMP/gi-owner-before-$n.headers" https://app.aysseguros.com/ > "$RUNNER_TEMP/gi-owner-before-$n.html"
          done
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://app.aysseguros.com/product-runtime-config.js > "$RUNNER_TEMP/gi-owner-runtime-before.js"
          cat > "$RUNNER_TEMP/gi-owner-root-fingerprint.js" <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');
          const [phase,fileA,fileB,out]=process.argv.slice(2);
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          function fingerprint(path){
            const html=fs.readFileSync(path,'utf8');
            const title=((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'').replace(/\s+/g,' ').trim();
            const buildIds=[...new Set([...html.matchAll(/orbitBuild=([^&"'<>\s]+)/g)].map(m=>decodeURIComponent(m[1])))].sort();
            const assets=[...html.matchAll(/<(?:script|link)\b[^>]*(?:src|href)=["']([^"']+)["']/gi)].map(m=>m[1]).map(raw=>{
              try{
                const u=new URL(raw,'https://app.aysseguros.com/');
                if(u.origin==='https://app.aysseguros.com'&&u.pathname.startsWith('/cdn-cgi/'))return '';
                const build=u.searchParams.get('orbitBuild');
                return (u.origin==='https://app.aysseguros.com'?'':u.origin)+u.pathname+(build?'?orbitBuild='+build:'');
              }catch{return String(raw).split('#')[0];}
            }).filter(Boolean);
            const uniqueAssets=[...new Set(assets)].sort();
            const htmlDocument=/<html\b/i.test(html)&&/<\/html>/i.test(html);
            const bodyDocument=/<body\b/i.test(html)&&/<\/body>/i.test(html);
            const nonTrivial=Buffer.byteLength(html,'utf8')>=512;
            const productMarker=/Gravicentra Insurance|Insurance OS/i.test(html);
            if(!htmlDocument||!bodyDocument||!nonTrivial)throw Error('OWNER_ROOT_STRUCTURAL_IDENTITY_MISSING:'+path);
            return {title,htmlDocument,bodyDocument,productMarker,buildIds,assets:uniqueAssets};
          }
          const first=fingerprint(fileA),second=fingerprint(fileB);
          if(JSON.stringify(first)!==JSON.stringify(second))throw Error('OWNER_ROOT_PREDEPLOY_STRUCTURAL_VARIANCE');
          fs.writeFileSync(out,JSON.stringify({phase,rawHashes:[sha(fileA),sha(fileB)],rawByteStable:sha(fileA)===sha(fileB),fingerprint:first},null,2)+'\n');
          NODE
          node "$RUNNER_TEMP/gi-owner-root-fingerprint.js" before "$RUNNER_TEMP/gi-owner-before-1.html" "$RUNNER_TEMP/gi-owner-before-2.html" "$RUNNER_TEMP/gi-owner-identity-before.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const p=process.env.RUNNER_TEMP+'/gi-owner-runtime-before.js';
          const content=fs.readFileSync(p,'utf8');
          const bytes=Buffer.byteLength(content,'utf8');
          if(bytes<64||/<html\b/i.test(content))throw Error('OWNER_RUNTIME_CONFIG_STRUCTURAL_IDENTITY_MISSING');
          NODE

      - name: Resolve pre-existing LAB-only account and pinned Firebase CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-preview-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-preview-auth'
          matches=[]
          for n,k in enumerate(('SA_ORBIT360_LAB','SA_ORBIT_360_LAB','SA_DEFAULT')):
              try: val=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError): continue
              if val.get('type')=='service_account' and val.get('project_id')==os.environ['PROJECT_ID'] and val.get('private_key'):
                  p=root/f'{n}.json'
                  p.write_text(json.dumps(val),encoding='utf8')
                  p.chmod(0o600)
                  matches.append(str(p))
          if not matches: raise SystemExit('EXISTING_LAB_ACCOUNT_NOT_CONFIGURED')
          (root/'candidates').write_text('\n'.join(matches)+'\n',encoding='utf8')
          PY
          CLI_ROOT="$RUNNER_TEMP/gi-preview-cli"
          npm install --prefix "$CLI_ROOT" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CLI_ROOT"
          CLI="$CLI_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done < "$RUNNER_TEMP/gi-preview-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/gi-preview-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/gi-preview-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-preview-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null

      - name: Read only public LAB web configuration
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-preview-apps.json"
          export APPS_FILE="$RUNNER_TEMP/gi-preview-apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          apps=json.load(open(os.environ['APPS_FILE'])).get('result') or []
          web=[a for a in apps if str(a.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1: raise SystemExit('EXACT_ONE_LAB_WEB_APP_REQUIRED')
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-preview-sdkconfig.json"

      - name: Package exact Hosting-only cumulative candidate
        run: |
          set -euo pipefail
          export SOURCE_SHA="$EXACT_SOURCE_SHA"
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/gi-preview-branding.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/gi-preview-branding.json"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/gi-preview-package" "$RUNNER_TEMP/gi-preview-sdkconfig.json" > "$RUNNER_TEMP/gi-preview-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const root=process.env.RUNNER_TEMP+'/gi-preview-package/bundle';
          const conf=JSON.parse(fs.readFileSync(root+'/firebase.json','utf8'));
          const meta=JSON.parse(fs.readFileSync(root+'/site/__recovery__/build.json','utf8'));
          if(Object.keys(conf).join(',')!=='hosting'||conf.hosting.site!=='ays-orbit-360-lab'||conf.hosting.public!=='site')throw Error('HOSTING_ONLY_REQUIRED');
          if(meta.sourceSha!==process.env.EXACT_SOURCE_SHA||meta.gate!=='I6.5-B4-003')throw Error('SOURCE_GATE_MISMATCH');
          for(const rel of ['modules/inicio.js','modules/equipo.js','modules/insights.js','modules/portal.js','core/legal.js','data/store-firestore-product-readonly-p0.js','modules/cobros.js','modules/plantillas.js','core/product-app-p0.js','core/queries.js','data/store-firestore-product-operational-p0.js']){
            if(!fs.readFileSync('orbit360-platform/'+rel).equals(fs.readFileSync(root+'/site/'+rel)))throw Error('BUNDLE_DIFF:'+rel);
          }
          let expectedIndex=fs.readFileSync('orbit360-platform/index.html','utf8');
          const brandingScript=/<script\s+src=["']core\/public-tenant-branding\.js[^"']*["']\s*><\/script>/i;
          if(!brandingScript.test(expectedIndex))throw Error('SOURCE_BRANDING_TAG_MISSING');
          expectedIndex=expectedIndex.replace(brandingScript,'<script src="data/tenant-public-branding-snapshot.generated.js"></script>\n$&');
          let bound=0;
          const bind=url=>{
            const raw=String(url||'');
            if(!raw||/^(?:https?:|data:|blob:|\/\/|#)/i.test(raw)||!/.(?:js|css)(?:[?#]|$)/i.test(raw))return raw;
            const hashAt=raw.indexOf('#'),hash=hashAt>=0?raw.slice(hashAt):'',base=hashAt>=0?raw.slice(0,hashAt):raw;
            const next=/([?&])orbitBuild=[^&#]*/.test(base)
              ?base.replace(/([?&])orbitBuild=[^&#]*/,'$1orbitBuild='+encodeURIComponent(meta.buildId))
              :base+(base.includes('?')?'&':'?')+'orbitBuild='+encodeURIComponent(meta.buildId);
            bound++;return next+hash;
          };
          expectedIndex=expectedIndex.replace(/(<script\b[^>]*\bsrc=["'])([^"']+)(["'])/gi,(m,a,u,z)=>a+bind(u)+z);
          expectedIndex=expectedIndex.replace(/(<link\b[^>]*\brel=["']stylesheet["'][^>]*\bhref=["'])([^"']+)(["'])/gi,(m,a,u,z)=>a+bind(u)+z);
          expectedIndex=expectedIndex.replace(/(<link\b[^>]*\bhref=["'])([^"']+\.css(?:[^"']*)?)(["'][^>]*\brel=["']stylesheet["'])/gi,(m,a,u,z)=>a+bind(u)+z);
          if(bound<10||fs.readFileSync(root+'/site/index.html','utf8')!==expectedIndex)throw Error('INDEX_DETERMINISTIC_PACKAGE_TRANSFORM_DIFF');
          const runtime=fs.readFileSync(root+'/site/product-runtime-config.js','utf8');
          if(!runtime.includes('"scopedReadPreviewCandidate":true'))throw Error('PROTECTED_PREVIEW_CONFIG_REQUIRED');
          const evidence=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gi-preview-package-output.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Build: '+evidence.buildId+'\nHosted payload digest: '+evidence.hostedPayloadDigest+'\nBundle digest: '+evidence.bundleDigest+'\n');
          NODE

      - name: Retain the exact immutable Hosting build and manifests, never credentials
        uses: actions/upload-artifact@v4
        with:
          name: gi-b4003-cumulative-hosting-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gi-preview-package/bundle/site/
            ${{ runner.temp }}/gi-preview-package/bundle/firebase.json
            ${{ runner.temp }}/gi-preview-package/evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Stage exact backend source and capture existing target metadata
        run: |
          set -euo pipefail
          BACKEND_ROOT="$RUNNER_TEMP/gi-metas-backend"
          mkdir -p "$BACKEND_ROOT"
          git archive --format=tar "$EXACT_SOURCE_SHA" functions/ > "$RUNNER_TEMP/gi-metas-backend-source.tar"
          tar -xf "$RUNNER_TEMP/gi-metas-backend-source.tar" -C "$BACKEND_ROOT"
          printf '{"functions":{"source":"functions","runtime":"nodejs22","ignore":["node_modules",".git","firebase-debug.log","firebase-debug.*.log","*.local"]}}\n' > "$BACKEND_ROOT/firebase.json"
          (cd "$BACKEND_ROOT/functions" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          export BACKEND_ROOT
          echo "BACKEND_ROOT=$BACKEND_ROOT" >> "$GITHUB_ENV"
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const files=git('ls-tree','-r','--name-only',process.env.EXACT_SOURCE_SHA,'--','functions/').split(/\r?\n/).filter(Boolean);
          const manifest=files.map(path=>{const staged=fs.readFileSync(process.env.BACKEND_ROOT+'/'+path),expected=execFileSync('git',['show',process.env.EXACT_SOURCE_SHA+':'+path]);if(!staged.equals(expected))throw Error('BACKEND_STAGE_DIFF:'+path);return {path,gitBlobSha:git('rev-parse',process.env.EXACT_SOURCE_SHA+':'+path),sha256:sha(staged),bytes:staged.length};});
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-metas-backend-source-manifest.json',JSON.stringify({sourceSha:process.env.EXACT_SOURCE_SHA,target:process.env.TARGET_FUNCTION,region:process.env.TARGET_REGION,archiveSha256:sha(fs.readFileSync(process.env.RUNNER_TEMP+'/gi-metas-backend-source.tar')),files:manifest},null,2)+'\n');
          NODE
          cat > "$RUNNER_TEMP/gi-metas-function-snapshot.cjs" <<'NODE'
          'use strict';
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {GoogleAuth}=require(process.env.BACKEND_ROOT+'/functions/node_modules/google-auth-library');
          const phase=process.argv[2],tmp=process.env.RUNNER_TEMP;
          const stable=x=>Array.isArray(x)?x.map(stable):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x;
          const hash=x=>crypto.createHash('sha256').update(typeof x==='string'?x:JSON.stringify(stable(x))).digest('hex');
          const doc=JSON.parse(fs.readFileSync(tmp+'/gi-metas-functions-'+phase+'.json','utf8'));
          const rows=Array.isArray(doc.result)?doc.result:Array.isArray(doc)?doc:[];
          const summary=rows.map(r=>{const id=String(r.id||r.entryPoint||r.name||'').split('/').pop(),region=String(r.region||r.location||((String(r.name||'').match(/\/locations\/([^/]+)/)||[])[1])||'').split('/').pop();return{id,region,key:region+'/'+id,metadataSha256:hash(r)};}).sort((a,b)=>a.key.localeCompare(b.key));
          if(!summary.length||summary.some(r=>!r.id||!r.region)||new Set(summary.map(r=>r.key)).size!==summary.length)throw Error('FUNCTION_INVENTORY_IDENTITY_INCOMPLETE');
          const target=summary.filter(r=>r.id===process.env.TARGET_FUNCTION&&r.region===process.env.TARGET_REGION);
          if(target.length!==1||summary.filter(r=>r.id===process.env.TARGET_FUNCTION).length!==1)throw Error('EXISTING_EXACT_TARGET_CARDINALITY_REQUIRED');
          (async()=>{
            const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const name='projects/'+process.env.PROJECT_ID+'/locations/'+process.env.TARGET_REGION+'/functions/'+process.env.TARGET_FUNCTION;
            const {data:f}=await client.request({url:'https://cloudfunctions.googleapis.com/v2/'+name});
            if(f.name!==name||f.buildConfig?.entryPoint!==process.env.TARGET_FUNCTION||f.environment!=='GEN_2'||f.state!=='ACTIVE'||f.buildConfig?.runtime!=='nodejs22')throw Error('TARGET_METADATA_IDENTITY_OR_STATE_MISMATCH');
            const svc=f.serviceConfig||{},build=f.buildConfig||{};
            const resolved=build.sourceProvenance?.resolvedStorageSource||build.source?.storageSource||null;
            const targetMetadata={name:f.name,environment:f.environment,state:f.state,updateTime:f.updateTime||null,build:build.build||null,runtime:build.runtime||null,entryPoint:build.entryPoint,sourceStorage:resolved,revision:svc.revision||null,service:svc.service||null,uri:svc.uri||null,codeHash:f.labels?.['firebase-functions-hash']||null,labels:f.labels||{},serviceAccountEmail:svc.serviceAccountEmail||null,ingressSettings:svc.ingressSettings||null,environmentVariablesSha256:hash(svc.environmentVariables||{}),secretEnvironmentVariablesSha256:hash(svc.secretEnvironmentVariables||[]),serviceConfigNonRevisionSha256:hash(Object.fromEntries(Object.entries(svc).filter(([k])=>k!=='revision')))};
            let iam={status:'NOT_AVAILABLE',policySha256:null};
            if(svc.service){try{const {data:p}=await client.request({url:'https://run.googleapis.com/v2/'+svc.service+':getIamPolicy'});iam={status:'READ',policySha256:hash({version:p.version||0,bindings:(p.bindings||[]).map(b=>({...b,members:(b.members||[]).slice().sort()})).sort((a,b)=>JSON.stringify(stable(a)).localeCompare(JSON.stringify(stable(b))))})};}catch(e){iam.httpStatus=Number(e.response?.status||0);}}
            const result={phase,observedAt:new Date().toISOString(),functions:summary,target:targetMetadata,iam};
            fs.writeFileSync(tmp+'/gi-metas-function-'+phase+'-snapshot.json',JSON.stringify(result,null,2)+'\n');
            if(phase==='after'){
              const before=JSON.parse(fs.readFileSync(tmp+'/gi-metas-function-before-snapshot.json','utf8'));
              if(JSON.stringify(before.functions.map(r=>r.key))!==JSON.stringify(summary.map(r=>r.key)))throw Error('FUNCTION_CREATED_OR_DELETED');
              const key=process.env.TARGET_REGION+'/'+process.env.TARGET_FUNCTION;
              const changed=summary.filter((r,i)=>r.metadataSha256!==before.functions[i].metadataSha256).map(r=>r.key);
              if(changed.some(k=>k!==key))throw Error('NON_TARGET_FUNCTION_CHANGED:'+changed.filter(k=>k!==key).join(','));
              for(const field of ['serviceAccountEmail','ingressSettings','environmentVariablesSha256','secretEnvironmentVariablesSha256','serviceConfigNonRevisionSha256','service','uri'])if(before.target[field]!==targetMetadata[field])throw Error('TARGET_NON_SOURCE_CONFIGURATION_CHANGED:'+field);
              if(before.iam.status==='READ'&&iam.status==='READ'&&before.iam.policySha256!==iam.policySha256)throw Error('TARGET_RUN_IAM_CHANGED');
              const proof={status:'SOURCE_STORAGE_READBACK_UNAVAILABLE',storageSource:resolved,objectSha256:null,sourceFiles:[],errorHttpStatus:null};
              if(resolved?.bucket&&resolved?.object){
                try{
                  const u='https://storage.googleapis.com/storage/v1/b/'+encodeURIComponent(resolved.bucket)+'/o/'+encodeURIComponent(resolved.object)+'?alt=media'+(resolved.generation?'&generation='+encodeURIComponent(resolved.generation):'');
                  const {data}=await client.request({url:u,responseType:'arraybuffer'});
                  const bytes=Buffer.from(data),archive=tmp+'/gi-metas-deployed-source.zip';fs.writeFileSync(archive,bytes);proof.objectSha256=crypto.createHash('sha256').update(bytes).digest('hex');
                  const {execFileSync}=require('node:child_process');
                  const py="import json,sys,zipfile,pathlib,hashlib\nz=zipfile.ZipFile(sys.argv[1]);root=pathlib.Path(sys.argv[2]);files=json.loads(sys.argv[3]);out=[]\nfor rel in files:\n names=[n for n in z.namelist() if n==rel or n.endswith('/'+rel)]\n if len(names)!=1: raise SystemExit('DEPLOYED_SOURCE_PATH_CARDINALITY:'+rel)\n b=z.read(names[0]);expected=(root/rel).read_bytes()\n if b!=expected: raise SystemExit('DEPLOYED_SOURCE_BYTES_MISMATCH:'+rel)\n out.append({'path':rel,'sha256':hashlib.sha256(b).hexdigest()})\nprint(json.dumps(out))";
                  const manifest=JSON.parse(fs.readFileSync(tmp+'/gi-metas-backend-source-manifest.json','utf8'));
                  const executableFiles=manifest.files.map(x=>x.path.replace(/^functions\//,'')).filter(p=>/\.(?:cjs|mjs|js)$/.test(p)||p==='package.json'||p==='package-lock.json');
                  if(!executableFiles.includes('product-operational-domain.js')||!executableFiles.includes('bootstrap.js'))throw Error('BACKEND_MANIFEST_EXECUTABLE_SOURCE_MISSING');
                  proof.sourceFiles=JSON.parse(execFileSync('python3',['-c',py,archive,process.env.BACKEND_ROOT+'/functions',JSON.stringify(executableFiles)],{encoding:'utf8'}));
                  proof.status='DEPLOYED_BACKEND_SOURCE_BYTES_MATCH_EXACT_STAGE';
                }catch(e){if(e.response?.status===403||e.response?.status===404){proof.errorHttpStatus=e.response.status;}else throw Error('DEPLOYED_SOURCE_READBACK_FAILED:'+String(e.stderr||e.message||e));}
              }
              const identityChanged=['revision','build','codeHash','updateTime'].some(k=>before.target[k]&&targetMetadata[k]&&before.target[k]!==targetMetadata[k]);
              if(!identityChanged&&proof.status!=='DEPLOYED_BACKEND_SOURCE_BYTES_MATCH_EXACT_STAGE')throw Error('TARGET_NO_CHANGED_REVISION_OR_EXACT_SOURCE_PROOF');
              fs.writeFileSync(tmp+'/gi-metas-function-readback.json',JSON.stringify({status:proof.status==='DEPLOYED_BACKEND_SOURCE_BYTES_MATCH_EXACT_STAGE'?'TARGET_ONLY_DEPLOY_AND_SOURCE_READBACK_PASS':'TARGET_ONLY_DEPLOY_PASS_SOURCE_READBACK_UNPROVEN',onlyTargetChanged:true,changedFunctionKeys:changed,inventoryCount:summary.length,before:before.target,after:targetMetadata,iamUnchanged:before.iam.status==='READ'&&iam.status==='READ'?before.iam.policySha256===iam.policySha256:null,sourceProof:proof,authenticatedUat:'PENDING'},null,2)+'\n');
            }
          })().catch(e=>{console.error(String(e.message||e));process.exitCode=1;});
          NODE
          node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-metas-functions-before.json"
          node "$RUNNER_TEMP/gi-metas-function-snapshot.cjs" before

      - name: Retain exact backend archive and source manifest without credentials
        uses: actions/upload-artifact@v4
        with:
          name: gi-b4003-metas-backend-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gi-preview-predecessor-build.json
            ${{ runner.temp }}/gi-preview-predecessor-identity.json
            ${{ runner.temp }}/gi-metas-backend-source.tar
            ${{ runner.temp }}/gi-metas-backend-source-manifest.json
            ${{ runner.temp }}/gi-metas-source-binding.json
            ${{ runner.temp }}/gi-metas-function-before-snapshot.json
