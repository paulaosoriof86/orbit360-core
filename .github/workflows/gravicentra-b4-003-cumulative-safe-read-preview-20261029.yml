            seen.add(info.filename)
            dest=out.joinpath(*p.parts)
            if info.is_dir(): dest.mkdir(parents=True,exist_ok=True)
            else:
             dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(info))
          proof.append({'label':label,'artifactId':artifact_id,'runId':run_id,'zipBytes':size,'zipSha256':digest,'files':len(infos),'digestVerified':True})
         backend=root/'gi-resume-backend';snap=root/'gi-resume-snapshots';hosting=root/'gi-resume-hosting'
         for name in ['gi-insurer-function-before-snapshot.json','gi-insurer-source-binding.json','gi-preview-predecessor-build.json','gi-preview-predecessor-identity.json']:
          if (backend/name).read_bytes()!=(snap/name).read_bytes(): raise RuntimeError('CROSS_ARTIFACT_BINDING_MISMATCH')
         for name in ['gi-insurer-backend-source-manifest.json','gi-insurer-source-binding.json','gi-insurer-function-before-snapshot.json']:
          shutil.copyfile(backend/name,root/name)
         shutil.copyfile(snap/'gi-insurer-function-after-snapshot.json',root/'gi-insurer-function-initial-after-snapshot.json')
         shutil.copyfile(root/'gi-resume-patch/gi-insurer-reader-env-restoration.json',root/'gi-insurer-reader-patch-attempt1.json')
         shutil.copytree(hosting,root/'gi-preview-package')
         shutil.copyfile(hosting/'evidence/package-output.json',root/'gi-preview-package-output.json')
         stage=root/'gi-insurer-backend';stage.mkdir()
         with tarfile.open(backend/'gi-insurer-backend-source.tar') as archive:
          seen=set()
          for member in archive.getmembers():
           p=safe_name(member.name)
           if member.name in seen or not (member.isfile() or member.isdir()) or not (member.name=='firebase.json' or p.parts[0]=='functions'): raise RuntimeError('UNSAFE_BACKEND_TAR_MEMBER')
           seen.add(member.name);dest=stage.joinpath(*p.parts)
           if member.isdir(): dest.mkdir(parents=True,exist_ok=True)
           else:
            dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(archive.extractfile(member).read())
         manifest=json.loads((root/'gi-insurer-backend-source-manifest.json').read_text())
         actual={str(p.relative_to(stage)) for p in (stage/'functions').rglob('*') if p.is_file()}
         if manifest['sourceSha']!=os.environ['EXACT_SOURCE_SHA'] or actual!={x['path'] for x in manifest['files']}: raise RuntimeError('EXACT_BACKEND_MANIFEST_REQUIRED')
         for item in manifest['files']:
          data=(stage/item['path']).read_bytes()
          if len(data)!=item['bytes'] or hashlib.sha256(data).hexdigest()!=item['sha256']: raise RuntimeError('BACKEND_MANIFEST_BYTES_MISMATCH')
         site=hosting/'bundle/site';listed=set()
         for line in (hosting/'evidence/site-manifest.sha256').read_text().splitlines():
          digest,rel=line.split('  ',1);safe_name(rel);listed.add(rel)
          if hashlib.sha256((site/rel).read_bytes()).hexdigest()!=digest: raise RuntimeError('HOSTING_MANIFEST_BYTES_MISMATCH')
         if listed!={str(p.relative_to(site)) for p in site.rglob('*') if p.is_file()} or len(listed)!=218: raise RuntimeError('EXACT_HOSTING_FILE_SET_REQUIRED')
         meta=json.loads((site/'__recovery__/build.json').read_text());config=json.loads((hosting/'bundle/firebase.json').read_text())
         if meta['sourceSha']!=os.environ['EXACT_SOURCE_SHA'] or meta['buildId']!='gi-i65-b4-bcb54435788e-57f234755dc1' or meta['gate']!='I6.5-B4-003': raise RuntimeError('IMMUTABLE_HOSTING_SOURCE_MISMATCH')
         if list(config)!=['hosting'] or config['hosting']['site']!='ays-orbit-360-lab' or config['hosting']['public']!='site': raise RuntimeError('IMMUTABLE_HOSTING_ONLY_CONFIG_REQUIRED')
         binding=json.loads((root/'gi-insurer-source-binding.json').read_text())
         if binding['sourceSha']!=os.environ['EXACT_SOURCE_SHA'] or binding['transportSha']!=os.environ['INITIAL_TRANSPORT_SHA'] or binding['guardRunId']!=41150390700: raise RuntimeError('INITIAL_SOURCE_BINDING_MISMATCH')
         (root/'gi-insurer-artifact-reuse.json').write_text(json.dumps({'status':'ORIGINAL_IMMUTABLE_ARTIFACTS_AND_EXACT_PATCH_REPORT_VERIFIED','artifacts':proof,'hostingFiles':len(listed),'backendFiles':len(actual),'backendCodeRedeployed':False,'hostingRebuilt':False},indent=2)+'\n')
         with open(os.environ['GITHUB_ENV'],'a') as target: target.write('BACKEND_ROOT='+str(stage)+'\n')
         print('IMMUTABLE_HOSTING_BACKEND_AND_SNAPSHOT_ARTIFACTS_VERIFIED')
        except Exception as error:
         if isinstance(error,RuntimeError): print(str(error))
         else: print('ARTIFACT_REUSE_FAILED:'+type(error).__name__)
         raise SystemExit(1)
        PY
    - name: Capture exact existing Preview origin and predecessor before any deployment
      run: |
        set -euo pipefail
        test "$PREVIEW_CHANNEL_ID" = 'gi-i65-b4-sr-41066435386'
        test "$EXPECTED_PREVIEW_URL" = 'https://ays-orbit-360-lab--gi-i65-b4-sr-41066435386-r09pl1ti.web.app'
        curl --fail --silent --show-error --location --retry 2 --max-time 30 "$EXPECTED_PREVIEW_URL/__recovery__/build.json" > "$RUNNER_TEMP/gi-preview-predecessor-build.json"
        node - <<'NODE'
        const fs=require('node:fs'),crypto=require('node:crypto');
        const raw=fs.readFileSync(process.env.RUNNER_TEMP+'/gi-preview-predecessor-build.json'),meta=JSON.parse(raw);
        if(meta.sourceSha!==process.env.PREDECESSOR_SOURCE_SHA||meta.buildId!==process.env.PREDECESSOR_BUILD_ID||meta.gate!=='I6.5-B4-003')throw Error('EXISTING_PREVIEW_PREDECESSOR_IDENTITY_MISMATCH');
        const record={observedAtUtc:new Date().toISOString(),previewUrl:process.env.EXPECTED_PREVIEW_URL,channelId:process.env.PREVIEW_CHANNEL_ID,sourceSha:meta.sourceSha,buildId:meta.buildId,buildMarkerSha256:crypto.createHash('sha256').update(raw).digest('hex'),sameOriginPreservesExistingBrowserSession:true,hostingLive:false,previousReceiptRemainsHistorical:true};
        fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-preview-predecessor-identity.json',JSON.stringify(record,null,2)+'\n');
        NODE
    - name: Snapshot public LIVE identities before preview
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ > "$RUNNER_TEMP/gi-live-before.html"
        for n in 1 2; do
          curl --fail --silent --show-error --location --retry 2 --max-time 30 -D "$RUNNER_TEMP/gi-owner-before-$n.headers" https://app.aysseguros.com/ > "$RUNNER_TEMP/gi-owner-before-$n.html"
        done
        curl --fail --silent --show-error --location --retry 2 --max-time 30 https://app.aysseguros.com/product-runtime-config.js > "$RUNNER_TEMP/gi-owner-runtime-before.js"
        cat > "$RUNNER_TEMP/gi-owner-root-fingerprint.js" <<'NODE'
        'use strict';
        const fs=require('node:fs'),crypto=require('node:crypto');
        const [phase,fileA,fileB,out]=process.argv.slice(2);
        const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
        function fingerprint(path){
          const html=fs.readFileSync(path,'utf8');
          const title=((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'').replace(/\s+/g,' ').trim();
          const buildIds=[...new Set([...html.matchAll(/orbitBuild=([^&"'<>\s]+)/g)].map(m=>decodeURIComponent(m[1])))].sort();
          const assets=[...html.matchAll(/<(?:script|link)\b[^>]*(?:src|href)=["']([^"']+)["']/gi)].map(m=>m[1]).map(raw=>{
            try{
              const u=new URL(raw,'https://app.aysseguros.com/');
              if(u.origin==='https://app.aysseguros.com'&&u.pathname.startsWith('/cdn-cgi/'))return '';
              const build=u.searchParams.get('orbitBuild');
              return (u.origin==='https://app.aysseguros.com'?'':u.origin)+u.pathname+(build?'?orbitBuild='+build:'');
            }catch{return String(raw).split('#')[0];}
          }).filter(Boolean);
          const uniqueAssets=[...new Set(assets)].sort();
          const htmlDocument=/<html\b/i.test(html)&&/<\/html>/i.test(html);
          const bodyDocument=/<body\b/i.test(html)&&/<\/body>/i.test(html);
          const nonTrivial=Buffer.byteLength(html,'utf8')>=512;
          const productMarker=/Gravicentra Insurance|Insurance OS/i.test(html);
          if(!htmlDocument||!bodyDocument||!nonTrivial)throw Error('OWNER_ROOT_STRUCTURAL_IDENTITY_MISSING:'+path);
          return {title,htmlDocument,bodyDocument,productMarker,buildIds,assets:uniqueAssets};
        }
        const first=fingerprint(fileA),second=fingerprint(fileB);
        if(JSON.stringify(first)!==JSON.stringify(second))throw Error('OWNER_ROOT_PREDEPLOY_STRUCTURAL_VARIANCE');
        fs.writeFileSync(out,JSON.stringify({phase,rawHashes:[sha(fileA),sha(fileB)],rawByteStable:sha(fileA)===sha(fileB),fingerprint:first},null,2)+'\n');
        NODE
        node "$RUNNER_TEMP/gi-owner-root-fingerprint.js" before "$RUNNER_TEMP/gi-owner-before-1.html" "$RUNNER_TEMP/gi-owner-before-2.html" "$RUNNER_TEMP/gi-owner-identity-before.json"
        node - <<'NODE'
        const fs=require('node:fs');
        const p=process.env.RUNNER_TEMP+'/gi-owner-runtime-before.js';
        const content=fs.readFileSync(p,'utf8');
        const bytes=Buffer.byteLength(content,'utf8');
        if(bytes<64||/<html\b/i.test(content))throw Error('OWNER_RUNTIME_CONFIG_STRUCTURAL_IDENTITY_MISSING');
        NODE
    - name: Resolve pre-existing LAB-only account and pinned Firebase CLI
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/gi-preview-auth"
        python3 - <<'PY'
        import json,os,pathlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-preview-auth'
        matches=[]
        for n,k in enumerate(('SA_ORBIT360_LAB','SA_ORBIT_360_LAB','SA_DEFAULT')):
            try: val=json.loads(os.environ.get(k,''))
            except (ValueError,TypeError): continue
            if val.get('type')=='service_account' and val.get('project_id')==os.environ['PROJECT_ID'] and val.get('private_key'):
                p=root/f'{n}.json'
                p.write_text(json.dumps(val),encoding='utf8')
                p.chmod(0o600)
                matches.append(str(p))
        if not matches: raise SystemExit('EXISTING_LAB_ACCOUNT_NOT_CONFIGURED')
        (root/'candidates').write_text('\n'.join(matches)+'\n',encoding='utf8')
        PY
        CLI_ROOT="$RUNNER_TEMP/gi-preview-cli"
        npm install --prefix "$CLI_ROOT" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
        node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CLI_ROOT"
        CLI="$CLI_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
        selected=''
        while IFS= read -r candidate; do
          if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
            selected="$candidate"
            break
          fi
        done < "$RUNNER_TEMP/gi-preview-auth/candidates"
        test -n "$selected"
        cp "$selected" "$RUNNER_TEMP/gi-preview-auth/selected.json"
        chmod 600 "$RUNNER_TEMP/gi-preview-auth/selected.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gi-preview-auth/selected.json" >> "$GITHUB_ENV"
        echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
    - name: Read the known completed restoration operation and reader configuration without mutation
      id: postpatch_readback
      env:
        GI_READER_POSTPATCH_READBACK_AUTHORIZATION: READ_KNOWN_OPERATION_AND_CONFIGURATION_ONLY
      run: |
        set -euo pipefail
        (cd "$BACKEND_ROOT/functions" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
        node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-insurer-functions-resume-before.json"
        node - <<'NODE'
