      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,json,pathlib,urllib.request,urllib.error,urllib.parse,hashlib,zipfile,tarfile,shutil
        root=pathlib.Path(os.environ['RUNNER_TEMP']);api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
        initial_sha=os.environ['INITIAL_TRANSPORT_SHA']
        pins=[('hosting',13023285501,1491734,'6f9ecc3e254be0cefcb86964e00ce74b3abd54223a8774e87bdcfd2cede4b2ba',41150545623,initial_sha),('backend',13023370282,185439,'97e730f44d6a4045b9d75f76c435dc97845505889699b44bcabbe5d6c3e87c7c',41150545623,initial_sha),('snapshots',13023550013,12940,'df0deeb1363e2182d81045da821970e500d5fb0cad0207f7b26ac05d93101325',41150545623,initial_sha),('patch',13024615471,16359,'ba67c529382cdb987612939f4f743cafbd6405c96b84fe967821cdf9ab6e5091',41153515829,'a4c3d37dc8d9a4bf11451d9b9b61b3a66e439825')]
        headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
        class NoRedirect(urllib.request.HTTPRedirectHandler):
         def redirect_request(self,req,fp,code,msg,headers,newurl): return None
        opener=urllib.request.build_opener(NoRedirect)
        def safe_name(name):
         p=pathlib.PurePosixPath(name)
         if not name or chr(92) in name or p.is_absolute() or '..' in p.parts: raise RuntimeError('UNSAFE_ARCHIVE_PATH')
         return p
        proof=[]
        try:
         for label,artifact_id,size,digest,run_id,head_sha in pins:
          endpoint=api+'/actions/artifacts/'+str(artifact_id)
          with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers),timeout=45) as response: meta=json.load(response)
          if meta.get('id')!=artifact_id or meta.get('expired') is not False or meta.get('size_in_bytes')!=size or meta.get('digest')!='sha256:'+digest or meta.get('workflow_run',{}).get('id')!=run_id or meta.get('workflow_run',{}).get('head_sha')!=head_sha: raise RuntimeError('EXACT_ARTIFACT_METADATA_REQUIRED')
          try:
           response=opener.open(urllib.request.Request(endpoint+'/zip',headers=headers),timeout=45)
           response.close();raise RuntimeError('SIGNED_ARTIFACT_REDIRECT_REQUIRED')
          except urllib.error.HTTPError as error:
           if error.code not in (301,302,303,307,308): raise RuntimeError('ARTIFACT_DOWNLOAD_REDIRECT_FAILED')
           signed=error.headers.get('Location','')
          parsed=urllib.parse.urlparse(signed)
          if parsed.scheme!='https' or not parsed.hostname or parsed.username or parsed.password: raise RuntimeError('SIGNED_HTTPS_ARTIFACT_REQUIRED')
          # The external signed URL is fetched without the GitHub Authorization header.
          with urllib.request.urlopen(urllib.request.Request(signed),timeout=60) as response: data=response.read(10*1024*1024)
          if len(data)!=size or hashlib.sha256(data).hexdigest()!=digest: raise RuntimeError('IMMUTABLE_ARTIFACT_ZIP_DIGEST_MISMATCH')
          archive=root/('gi-resume-'+label+'.zip');archive.write_bytes(data)
          out=root/('gi-resume-'+label);out.mkdir()
          with zipfile.ZipFile(archive) as z:
           seen=set();infos=z.infolist()
           if sum(x.file_size for x in infos)>100*1024*1024: raise RuntimeError('ARCHIVE_SIZE_BOUND_EXCEEDED')
