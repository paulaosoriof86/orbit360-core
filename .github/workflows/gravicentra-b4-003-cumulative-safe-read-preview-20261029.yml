          if-no-files-found: error

      - name: Deploy only the existing exact LAB operational Preview callable
        id: backend_deploy
        run: |
          set -euo pipefail
          test "$TARGET_FUNCTION" = 'orbit360ProductOperationalCommandPreview'
          test "$TARGET_REGION" = 'us-east1'
          test "$PROJECT_ID" = 'ays-orbit-360-lab'
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360ProductOperationalCommandPreview --config "$BACKEND_ROOT/firebase.json" --project "$PROJECT_ID" --non-interactive > "$RUNNER_TEMP/gi-metas-function-deploy.log" 2>&1

