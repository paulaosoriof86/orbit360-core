          ROOT="$RUNNER_TEMP/gi-preview-package/bundle/site"
          for rel in index.html __recovery__/build.json product-runtime-config.js modules/inicio.js modules/equipo.js modules/insights.js modules/portal.js core/legal.js data/store-firestore-product-readonly-p0.js modules/cobros.js modules/plantillas.js core/product-app-p0.js core/queries.js data/store-firestore-product-operational-p0.js; do
