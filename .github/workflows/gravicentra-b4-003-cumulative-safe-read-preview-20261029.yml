      - name: Update only the existing isolated seven-day LAB Preview channel, preserve session origin
        id: deploy
        run: |
          set -euo pipefail
          CHANNEL_ID="$PREVIEW_CHANNEL_ID"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 "$EXPECTED_PREVIEW_URL/__recovery__/build.json" > "$RUNNER_TEMP/gi-preview-predecessor-immediate.json"
          cmp "$RUNNER_TEMP/gi-preview-predecessor-build.json" "$RUNNER_TEMP/gi-preview-predecessor-immediate.json"
