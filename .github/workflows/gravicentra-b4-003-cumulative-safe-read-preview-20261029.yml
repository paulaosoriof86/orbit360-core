        const runs=await request('actions/workflows/gravicentra-release-lock-sync.yml/runs?head_sha='+m.sourceCommit+'&per_page=100');
        const candidates=(runs.workflow_runs||[]).filter(r=>r.head_sha===m.sourceCommit&&r.head_branch===process.env.GITHUB_REF_NAME).sort((a,b)=>b.id-a.id);
        need(candidates[0]?.status==='completed'&&candidates[0]?.conclusion==='success','EXACT_RECOVERY_SOURCE_GUARD_REQUIRED');
        const result={schema:'GRAVICENTRA_I65_B4003_INSURER_PREVIEW_RECOVERY_BINDING_V1',sourceSha:k.source,sourceGuardRunId:k.sourceGuardRunId,initialTransportSha:k.parent,initialRunId:k.initialRunId,failedRecoveryTransportSha:'850b156f7c00080d933b0af8ba16837a89f76160',failedRecoveryRunId:41152465200,postPatchFailureRunId:41153515829,postPatchFailureTransportSha:'a4c3d37dc8d9a4bf11451d9b9b61b3a66e439825',postPatchFailureHistory:postPatchAttempts,recoverySourceSha:m.sourceCommit,recoveryGuardRunId:candidates[0].id,recoveryTransportSha:process.env.TRANSPORT_SHA,recoveryRunId:Number(process.env.GITHUB_RUN_ID),artifacts:k.artifacts,receiptPath:m.authorityReceiptPath,receiptBlobSha:m.authorityReceiptBlobSha,previousRecoveryReceiptPath:k.receipt,previousRecoveryReceiptBlobSha:git('hash-object',k.receipt),workflowBlobSha:git('hash-object',k.workflow),backendCodeRedeploy:false,hostingRebuild:false};
        fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-insurer-recovery-binding.json',JSON.stringify(result,null,2)+'\n');
        fs.appendFileSync(process.env.GITHUB_ENV,'RECOVERY_SOURCE_SHA='+m.sourceCommit+'\n');
        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Original product source: '+k.source+'\nRecovery source Guard SUCCESS: '+candidates[0].id+'\nInitial backend deployment and immutable Hosting package: '+k.initialRunId+'\n');
        NODE
        git diff --exit-code
        git diff --cached --exit-code
        node tools/gravicentra-b4-003-insurer-reader-postpatch-readback.test.cjs
        node --test tools/gravicentra-b4-003-insurer-preview-resume.test.mjs
    - name: Recover exact original artifacts and the single known PATCH report without rebuilding
      env:
