          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(process.env.RUNNER_TEMP+'/'+p)).digest('hex');
          const report={schema:'GRAVICENTRA_OWNER_LIVE_IDENTITY_READBACK_V1',labLiveRootExact:true,ownerRuntimeExact:true,ownerRootStructuralExact:true,ownerRootRawByteStableBefore:before.rawByteStable,ownerRootRawByteStableAfter:after.rawByteStable,ownerRootRawHashesBefore:before.rawHashes,ownerRootRawHashesAfter:after.rawHashes,ownerRuntimeSha256:hash('gi-owner-runtime-after.js'),previewSource:process.env.EXACT_SOURCE_SHA,previewUrl:process.env.PREVIEW_URL,livePromotion:false};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gi-live-identity-readback.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Owner root raw bytes stable before: '+before.rawByteStable+'\nOwner root raw bytes stable after: '+after.rawByteStable+'\nOwner stable runtime/structural identity: PASS\n');
