name: Orbit 360 · Rootfix v14 requestScope · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-request-scope-rootfix:
    if: github.head_ref == 'ays/sourcefix-v14-request-scope-contract-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact sourcefix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate scope-aware guard and fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs
          node --check tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node --check tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs

      - name: Prove v14 root cause and no runtime side effects
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const guard=fs.readFileSync('tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs','utf8');
          const engine=fs.readFileSync('tools/orbit360-validar-gate-contracts-engine-visual-matrix-corrected-post-auth-lab-v20260805.mjs','utf8');
          const request=JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const baseline=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/request-lifecycle-baseline-contract-source-test-sanitized-v20260806.json','utf8'));
          const portable=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/preflight-portable-source-test-sanitized-v20260806.json','utf8'));
          const fields=['precheckRequiredBeforeMatrix','directionDesktop','operationalTablet','advisorMobile','viewportCaptureOnly'];
          const aligned=fields.every(f=>guard.includes(`scope.${f} === true`) && engine.includes(`scope.${f} === true`));
          const omissionsRejected=fields.every(f=>baseline.checks[`missing_${f}_rejected`]===true && portable.checks[`guardRejectsMissing_${f}`]===true);
          const stopped=request.status==='CONSUMED_STOP_RETRY_REQUESTSCOPE' && request.consumed===true && request.allowedExecutions===0 && request.authorizationFrozen===true && request.replayAllowed===false;
          const ok=aligned && omissionsRejected && stopped && baseline.ok===true && portable.ok===true;
          if(!ok) process.exit(41);
          console.log(JSON.stringify({
            status:'PASS_V14_REQUEST_SCOPE_ROOTFIX_SOURCE_ONLY',
            immediateFailure:'DATA_CONTRACT_FAILURE_REQUEST_SCOPE',
            deeperRootCause:'PIPELINE_MECHANISM_FAILURE_GUARD_SCOPE_DRIFT',
            missingFields:fields,
            guardAndGateAligned:true,
            everyMissingFieldRejectedBeforeRuntime:true,
            v14RequestConsumedAndFrozen:true,
            secretsRead:false,
            firebaseAccess:false,
            firestoreReads:0,
            firestoreWrites:0,
            authWrites:0,
            operationalWrites:0,
            browserExecuted:false,
            hostingTouched:false,
            deployExecuted:false,
            productionTouched:false,
            ok:true
          },null,2));
          NODE
