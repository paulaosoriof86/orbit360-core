name: Orbit 360 · Sourcecheck v17 advisor cache + route readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: orbit360-sourcecheck-v17-advisor-cache-route-readiness
  cancel-in-progress: false

jobs:
  source-v17-advisor-cache-route-readiness:
    if: github.head_ref == 'ays/sourcefix-v17-advisor-cache-route-readiness-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact sourcefix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert authorized source base and fail-closed v16
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD ad6f2e16305c7f519dcd213e26997695637621b8)" = 'ad6f2e16305c7f519dcd213e26997695637621b8'
          node - <<'NODE'
          const fs = require('fs');
          const req = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const lifecycle = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const overlay = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          if (req.requestVersion !== '20260807.16-two-phase-runtime' || !req.consumed || !req.authorizationFrozen || req.allowedExecutions !== 0 || req.replayAllowed !== false) process.exit(41);
          if (!lifecycle.stopRetryActive || lifecycle.executionAuthorized || overlay.runtimeAllowed) process.exit(42);
          console.log('PASS_V16_FAIL_CLOSED_BEFORE_V17_SOURCEFIX');
          NODE

      - name: Apply source-only control-plane evidence correction
        shell: bash
        run: node tools/orbit360-apply-v17-control-plane-evidence-sourcefix-v20260807.mjs

      - name: Syntax and protected-scope validation
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-apply-v17-control-plane-evidence-sourcefix-v20260807.mjs
          node --check tools/orbit360-test-v17-advisor-cache-route-readiness-source-v20260807.mjs
          node --check tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs
          node --check tools/orbit360-seal-visual-matrix-corrected-post-auth-runtime-v20260805.mjs
          node --check tools/orbit360-consume-visual-matrix-request-on-stop-v20260807.mjs
          node --check orbit360-platform/core/visual-runtime-hydration-contract-v20260805.js
          if test -e .github/workflows/orbit360-registered-relay-v16-hydration-v20260807.yml; then
            echo 'STOP_V16_RELAY_STILL_PRESENT'; exit 43;
          fi
          git diff --name-only ad6f2e16305c7f519dcd213e26997695637621b8...HEAD | tee /tmp/v17-source-files.txt
          if grep -E '(^|/)(data/store\.js|data/store-firestore-lab\.local\.js|core/backend-lab-|core/auth\.js|core/importa\.js|firestore\.rules)$' /tmp/v17-source-files.txt; then
            echo 'STOP_PROTECTED_FILE_TOUCHED'; exit 44;
          fi

      - name: Validate v17 root cause fixture
        shell: bash
        run: node tools/orbit360-test-v17-advisor-cache-route-readiness-source-v20260807.mjs

      - name: Run governing portable suites
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs

      - name: Write sanitized source-only evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          node - <<'NODE'
          const fs = require('fs');
          const evidence = {
            schemaVersion: 'orbit360-v17-advisor-cache-route-readiness-rootfix-source-v1',
            generatedAt: new Date().toISOString(),
            runId: process.env.GITHUB_RUN_ID || '',
            gateId: 'block2.7-visual-matrix-corrected-post-auth-lab-v20260805',
            sourceAuthorizationBaseHead: 'ad6f2e16305c7f519dcd213e26997695637621b8',
            status: 'PASS_V17_ADVISOR_CACHE_ROUTE_READINESS_ROOTFIX_SOURCE_ONLY',
            classification: 'FUNCTIONAL_DEFECT_AND_PIPELINE_MECHANISM_FAILURE_CORRECTED_SOURCE_ONLY',
            rootCauses: [
              'FUNCTIONAL_DEFECT_READ_ONLY_ADVISOR_PROJECTION_REBUILD_AMPLIFICATION',
              'PIPELINE_MECHANISM_FAILURE_GENERIC_ROUTE_READINESS_OBSCURED_RENDER_STALL'
            ],
            fixture: { advisorLookups: 430, projectionBuildsBeforeInvalidation: 1, projectionBuildsAfterOneInvalidation: 2, membershipInvalidationValidated: true },
            readinessAuthority: 'OrbitHydrationContractDiagnostics',
            routeCheckpointOrder: ['REQUIRED_HYDRATION_PASS','RENDER_READY_PASS'],
            v16EvidenceCorrected: { browserExecuted: true, hostingState: 'ROLLBACK_RESTORED_AFTER_V16_STOP' },
            governingSuites: {
              requestLifecycle: 'PASS', captureWatchdog: 'PASS', windowsSignal: 'PASS', signalSafe: 'PASS', crossRunner: 'PASS', preflightPortable: 'PASS', transportBaseSha: 'PASS'
            },
            v16RequestConsumedFrozen: true,
            v16RelayDisarmed: true,
            runtimeExecuted: false,
            secretsRead: false,
            firebaseAccess: false,
            hostingTouched: false,
            browserExecuted: false,
            deployExecuted: false,
            firestoreWrites: 0,
            authWrites: 0,
            operationalWrites: 0,
            productionTouched: false,
            containsPII: false,
            containsSecrets: false,
            ok: true
          };
          fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/v17-advisor-cache-route-readiness-rootfix-source-sanitized-v20260807.json', JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Persist source-only evidence and control-plane correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-source-gate-bot
          git config user.email orbit360-source-gate-bot@users.noreply.github.com
          git add \
            .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json \
            tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json \
            tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json \
            tools/orbit360-seal-visual-matrix-corrected-post-auth-runtime-v20260805.mjs \
            orbit360-platform/runtime-gate-crm-v20260716/v17-advisor-cache-route-readiness-rootfix-source-sanitized-v20260807.json
          if ! git diff --cached --quiet; then
            git commit -m 'sourcefix: persist v17 root cause evidence [skip ci]'
            git push origin HEAD:ays/sourcefix-v17-advisor-cache-route-readiness-20260807
          fi
          echo 'PASS_V17_SOURCE_ONLY_NO_SECRETS_NO_RUNTIME_NO_HOSTING_NO_BROWSER'
