# I6.6 P0 diagnostic: verify the canonical versus logical identity of historical
# documents using counts only. Never print a client name, ID or payment amount.
name: Gravicentra I6.6 Historic ID Readonly
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-historic-id-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-identities:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only SDK
        run: npm install --prefix "$RUNNER_TEMP/i66-readonly" --no-save --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
      - name: Read metadata-only identity alignment for operational and financial collections
        run: |
          node - <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const sdk=require(process.env.RUNNER_TEMP+'/i66-readonly/node_modules/firebase-admin');
          const choices=['SA_LAB','SA_ALT','SA_DEFAULT'].map(n=>process.env[n]).filter(Boolean);
          const service=choices.map(s=>{try{return JSON.parse(s);}catch(_){return null;}})
            .find(s=>s&&s.type==='service_account'&&s.project_id==='ays-orbit-360-lab'&&s.private_key);
          assert.ok(service,'READONLY_IDENTITY_PROBE_AUTH_NOT_CONFIGURED');
          sdk.initializeApp({credential:sdk.credential.cert(service),projectId:'ays-orbit-360-lab'});
          const db=sdk.firestore(),tenant='alianzas-soluciones';
          const collections=['negocios','gestiones','recibosEsperados','carteraPrimas','cobros','polizas'];
          const target='B4-003-EXP-38102224750',policyNumber='VA125-00010478';
          (async()=>{
            const docsByCollection=new Map();
            for(const collection of collections){
              const path=db.collection('tenants').doc(tenant).collection('data').doc(collection).collection('items');
              const snap=await path.select(
                'id','tenantId','titulo','numero','polizaId','workflowType','endorsementStage','opsBoardHidden',
                'reciboId','receiptId','matchedReceiptId','cobroId','cuota','serie','numeroReciboFuente',
                'primaTotal','monto','montoTotal','saldo','estado','estadoCartera','estadoOperativo',
                'carteraActiva','fechaPago','paidDate','applicationState','paymentState',
                'deleted','archivado','eliminado','fechaVencimiento','vence','fechaLimite',
                'clienteId','asesorId','pais','policyUpdatedId','historial','ultimoEndosoId'
              ).limit(5001).get();
              assert.ok(snap.size<=5000,'READONLY_PROBE_LIMIT_EXCEEDED_'+collection);
              docsByCollection.set(collection,snap.docs);
              let mismatch=0,missing=0,missingTenant=0,foreignTenant=0;
              for(const doc of snap.docs){const row=doc.data()||{},logical=String(row.id||'').trim();
                if(!logical)missing++;else if(logical!==doc.id)mismatch++;
                if(!row.tenantId)missingTenant++;else if(row.tenantId!==tenant)foreignTenant++;
              }
              console.log('ID_PROBE '+collection+' total='+snap.size+' logical_physical_mismatch='+mismatch+' missing_logical='+missing+' missing_tenant='+missingTenant+' foreign_tenant='+foreignTenant);
            }
            const mg=docsByCollection.get('gestiones').filter(d=>String(d.data().titulo||'').includes(target));
            console.log('ID_PROBE_APPLIED_ENDORSEMENT matches='+mg.length+' physical_matches_logical='+mg.filter(d=>d.id===String(d.data().id||'')).length+' hidden='+mg.filter(d=>d.data().opsBoardHidden===true).length);
            if(mg.length===1){const g=mg[0].data()||{},p=docsByCollection.get('polizas').find(d=>d.id===String(g.polizaId||'')),pr=p?.data()||{};
              const history=[].concat(pr.historial||[]);const approved=g.endorsementStage==='APLICADO'||Boolean(g.policyUpdatedId)||pr.ultimoEndosoId===mg[0].id||history.some(e=>e&&e.gestionId===mg[0].id);
              console.log('ID_PROBE_B4_HIDE_ELIGIBILITY '+JSON.stringify({workflowTypeValid:g.workflowType==='endorsement_request',policyIdPresent:Boolean(g.polizaId),policyFound:Boolean(p),tenantPolicyValid:!pr.tenantId||pr.tenantId===tenant,clientSame:String(pr.clienteId||'')===String(g.clienteId||''),advisorSame:String(pr.asesorId||'')===String(g.asesorId||''),countrySame:String(pr.pais||'').toUpperCase()===String(g.pais||'').toUpperCase(),stage:g.endorsementStage||'',approved,hidden:g.opsBoardHidden===true}));
            }
            const policies=docsByCollection.get('polizas').filter(d=>String(d.data().numero||'')===policyNumber);
            const pIds=new Set(policies.flatMap(d=>[d.id,String(d.data().id||'')]).filter(Boolean));
            console.log('ID_PROBE_PAYMENT_POLICY matches='+policies.length+' physical_matches_logical='+policies.filter(d=>d.id===String(d.data().id||'')).length);
            for(const coll of ['recibosEsperados','carteraPrimas','cobros']){
              const refs=docsByCollection.get(coll).filter(d=>pIds.has(String(d.data().polizaId||'')));
              console.log('ID_PROBE_PAYMENT_'+coll+' linked='+refs.length+' physical_matches_logical='+refs.filter(d=>d.id===String(d.data().id||'')).length);
            }
            const linkedReceipts=docsByCollection.get('recibosEsperados').filter(d=>pIds.has(String(d.data().polizaId||'')));
            const linkedPortfolios=docsByCollection.get('carteraPrimas').filter(d=>pIds.has(String(d.data().polizaId||'')));
            const normalized=v=>String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
            const activePortfolio=r=>r.carteraActiva!==false&&!['anulado','cancelado','cancelada','superseded','reemplazado'].includes(normalized(r.estadoCartera||r.estado));
            const activePortfolios=linkedPortfolios.filter(d=>activePortfolio(d.data()||{}));
            const grouped=new Map();for(const d of activePortfolios){const rid=String(d.data().reciboId||'');if(rid)grouped.set(rid,(grouped.get(rid)||0)+1);}
            const inactiveReceipts=linkedReceipts.filter(d=>{const r=d.data()||{};return r.deleted===true||r.eliminado===true||r.archivado===true||['anulado','cancelado','superseded','reemplazado'].includes(normalized(r.estado));});
            const paymentRecord=docsByCollection.get('cobros').filter(d=>pIds.has(String(d.data().polizaId||'')));
            const appliedReceiptRefs=new Set(paymentRecord.map(d=>String(d.data().reciboId||d.data().receiptId||d.data().matchedReceiptId||'')).filter(Boolean));
            console.log('ID_PROBE_BAYRON_SHAPE receipts='+linkedReceipts.length+' inactive_receipts='+inactiveReceipts.length+' active_portfolio='+activePortfolios.length+' unlinked_portfolio='+activePortfolios.filter(d=>!d.data().reciboId).length+' ambiguous_active_portfolio_receipts='+Array.from(grouped.values()).filter(n=>n>1).length+' paid_receipt_refs='+appliedReceiptRefs.size+' paid_receipt_ref_exists='+[...appliedReceiptRefs].every(id=>linkedReceipts.some(d=>d.id===id)));
            const amount=d=>{const r=d.data()||{};for(const k of ['monto','montoTotal','primaTotal','saldo']){const n=Number(r[k]);if(r[k]!==undefined&&r[k]!==null&&r[k]!==''&&Number.isFinite(n))return Math.round(n*100)/100;}return null;};
            const amountClasses=docs=>({approved1557_92:docs.filter(d=>amount(d)===1557.92).length,legacy242_67:docs.filter(d=>amount(d)===242.67).length,other:docs.filter(d=>amount(d)!==null&&amount(d)!==1557.92&&amount(d)!==242.67).length,missing:docs.filter(d=>amount(d)===null).length});
            const states=docs=>Object.fromEntries(Object.entries(docs.reduce((acc,d)=>{const r=d.data()||{},k=normalized(r.estadoOperativo||r.estadoCartera||r.estado)||'sin_estado';acc[k]=(acc[k]||0)+1;return acc;},{})).filter(([k])=>/^[a-z_]{1,45}$/.test(k)));
            console.log('ID_PROBE_BAYRON_RECEIPTS_CLASS '+JSON.stringify({amounts:amountClasses(linkedReceipts),states:states(linkedReceipts),paid:linkedReceipts.filter(d=>Boolean(d.data().cobroId)).length}));
            console.log('ID_PROBE_BAYRON_PORTFOLIO_CLASS '+JSON.stringify({amounts:amountClasses(linkedPortfolios),states:states(linkedPortfolios),linked:linkedPortfolios.filter(d=>Boolean(d.data().reciboId||d.data().receiptId)).length}));
            console.log('ID_PROBE_BAYRON_COBRO_CLASS '+JSON.stringify({count:paymentRecord.length,linked:paymentRecord.filter(d=>Boolean(d.data().reciboId||d.data().receiptId)).length,states:states(paymentRecord),paidDatePresent:paymentRecord.filter(d=>Boolean(d.data().paidDate||d.data().fechaPago)).length,applicationStatePresent:paymentRecord.filter(d=>Boolean(d.data().applicationState)).length}));
            const receiptsById=new Map(docsByCollection.get('recibosEsperados').map(d=>[d.id,d.data()||{}]));
            const portfoliosByReceipt=new Map();for(const d of docsByCollection.get('carteraPrimas')){const r=d.data()||{},rid=String(r.reciboId||r.receiptId||'');if(rid&&activePortfolio(r)){if(!portfoliosByReceipt.has(rid))portfoliosByReceipt.set(rid,[]);portfoliosByReceipt.get(rid).push(r);}}
            const allCobros=docsByCollection.get('cobros');
            let paidCobros=0,linkedPaid=0,missingReceipt=0,ambiguousPortfolio=0,activePortfolioMissing=0,portfolioStatusStale=0,receiptStatusStale=0;
            for(const doc of allCobros){const c=doc.data()||{},st=normalized(c.estado||c.paymentState||'');if(st!=='pagado'&&!st.startsWith('paid'))continue;paidCobros++;
              const rid=String(c.reciboId||c.receiptId||c.matchedReceiptId||'');if(!rid||!receiptsById.has(rid)){missingReceipt++;continue;}linkedPaid++;
              const receipt=receiptsById.get(rid);if(normalized(receipt.estado)!=='pagado')receiptStatusStale++;
              const pp=portfoliosByReceipt.get(rid)||[];if(!pp.length)activePortfolioMissing++;if(pp.length>1)ambiguousPortfolio++;
              if(pp.length===1&&!['pagado','recaudado','conciliado','aplicado'].includes(normalized(pp[0].estadoCartera||pp[0].estado)))portfolioStatusStale++;
            }
            console.log('ID_PROBE_PAID_LEDGER_COHERENCE '+JSON.stringify({allCobros:allCobros.length,paidCobros,linkedPaid,missingReceipt,ambiguousPortfolio,activePortfolioMissing,portfolioStatusStale,receiptStatusStale}));
            console.log('I66_READONLY_METADATA_PROBE_COMPLETED_WITHOUT_WRITES');
          })().catch(e=>{console.error(String(e.message||e).replace(/[^a-zA-Z0-9_ -]/g,''));process.exitCode=1;});
          NODE
      - name: Probe existence of LIVE callable endpoints without authentication or writes
        run: |
          node - <<'NODE'
          'use strict';
          const names=['orbit360OpsLeadsCommand','orbit360CobrosReconciliationCommand','orbit360ProductOperationalCommand','orbit360B4003ProtectedReader'];
          (async()=>{
            for(const name of names){
              const endpoint='https://us-central1-ays-orbit-360-lab.cloudfunctions.net/'+name;
              try{
                const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{}}),signal:AbortSignal.timeout(15000)});
                const response=await res.text();let code='';try{const obj=JSON.parse(response);code=String(obj.error&&obj.error.status||obj.error&&obj.error.message||'').replace(/[^A-Za-z_-]/g,'').slice(0,60);}catch(_){code='NON_JSON';}
                console.log('ENDPOINT_PROBE '+name+' http='+res.status+' unauthenticated_error='+code);
              }catch(e){console.log('ENDPOINT_PROBE '+name+' http=NETWORK_ERROR class='+String(e.name||'error').replace(/[^A-Za-z_-]/g,''));}
            }
          })().catch(e=>{console.error(String(e.name||'error'));process.exitCode=1;});
          NODE
