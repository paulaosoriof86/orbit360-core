name: Orbit 360 · M5 runtime package 5.0.33
run-name: M5 5.0.33 · runtime package zero capabilities · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-runtime-package-533-v20260729.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-package-533-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: 4bf3c8025654f43f6e4af20e5d16115bdc0851352ccddc6f099649405883cf3b

jobs:
  package:
    name: M5 · runtime package 5.0.33 · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar rama y ejecución única
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Preflight canónico 5.0.32 cerrado y cero capacidades
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_HOSTING_532_CLOSED_26_OF_26_READY_TO_REQUEST_RUNTIME_AUTHORIZATION" and .contractVersion=="5.0.32" and .executionPhase=="M5_POST_ACCESS_RC_READINESS_STATIC" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssetsExpected==26 and .remoteAssetsMatched==26 and .mismatchCount==0 and .remoteParity==true and .hostingAuthorizationConsumed==true and .runtimeSmokeAuthorized==false and .allowedRuntimeExecutions==0 and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false and .secretsRead==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Validar contrato 5.0.33 y probes sin ejecutar runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-m5-runtime-smoke-533-browser-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-533-close-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-533-contract-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs
          node --check tools/orbit360-gate-bootstrap-auth-legal-normalized-v20260729.mjs
          node tools/orbit360-m5-runtime-smoke-533-contract-v20260729.mjs
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_533_CONTRACT_PASS" and .failed==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssetsExpected==26 and .remoteAssetsMatched==26 and .remoteParity==true and .legacyProbeBlobSha=="70d6ad22553bd0387fa08dd2eeeb6e3b9834fa12" and .legacyProbeContractVersion=="5.0.25" and .packageInputImmutable==true and .multirolCompatibilityVersion=="20260729.2" and .accessOwnerVersion=="20260729.3" and .secrets==false and .firestoreRead==false and .runtime==false and .browser==false and .deploy==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-533-contract-summary.json" >/dev/null

      - name: Revalidar paridad pública 26/26 sin secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-530-v20260729.mjs
          jq -e '.ok==true and .status=="M5_RC_READY_FOR_RUNTIME_SMOKE" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==43 and .remoteLab.assetsExpected==26 and .remoteLab.assetsChecked==26 and .remoteLab.assetsMatched==26 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-summary.json" >/dev/null

      - name: Crear cierre sanitizado del package
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const d=process.env.ORBIT360_EVIDENCE_DIR;
          const read=n=>JSON.parse(fs.readFileSync(path.join(d,n),'utf8'));
          const p=read('preflight-sanitizado.json'),c=read('m5-runtime-smoke-533-contract-summary.json'),r=read('m5-release-candidate-readiness-530-summary.json');
          const ok=p.status==='M5_HOSTING_532_CLOSED_26_OF_26_READY_TO_REQUEST_RUNTIME_AUTHORIZATION'&&p.failed===0&&c.ok===true&&c.status==='M5_RUNTIME_SMOKE_533_CONTRACT_PASS'&&c.failed===0&&r.status==='M5_RC_READY_FOR_RUNTIME_SMOKE'&&r.remoteLab&&r.remoteLab.assetsMatched===26&&r.remoteLab.mismatchCount===0;
          const out={schemaVersion:'orbit360-m5-runtime-package-533-summary-v1',generatedAt:new Date().toISOString(),ok,status:ok?'M5_RUNTIME_533_PACKAGE_PASS':'M5_RUNTIME_533_PACKAGE_FAIL',gateId:process.env.ORBIT360_GATE_ID,contractVersion:'5.0.33',releaseCandidateHash:process.env.EXPECTED_RC_HASH,criticalAssets:43,remoteAssetsExpected:26,remoteAssetsMatched:Number(r.remoteLab?.assetsMatched ?? 0),mismatchCount:Number(r.remoteLab?.mismatchCount ?? 26),remoteParity:Boolean(r.remoteLab&&r.remoteLab.remoteParity),requestCreated:false,secrets:false,firestoreRead:false,firestoreWrites:0,operationalWrites:0,runtime:false,browser:false,deploy:false,functionsDeploy:false,rulesDeploy:false,production:false,containsPII:false,containsSecrets:false};
          fs.writeFileSync(path.join(d,'m5-runtime-package-533-summary.json'),JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));if(!ok)process.exitCode=41;
          NODE

      - name: Validar cierre esperado
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M5_RUNTIME_533_PACKAGE_PASS" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssetsExpected==26 and .remoteAssetsMatched==26 and .mismatchCount==0 and .remoteParity==true and .requestCreated==false and .secrets==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .deploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-package-533-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-package-533-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-533-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-530-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest-530.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-package-533-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-package-533-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 runtime 5.0.33 package failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.ok===true&&s.status==='M5_RUNTIME_533_PACKAGE_PASS'&&s.mismatchCount===0){state='success';description='M5 runtime 5.0.33 package PASS; RC 26/26';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-package-533',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
