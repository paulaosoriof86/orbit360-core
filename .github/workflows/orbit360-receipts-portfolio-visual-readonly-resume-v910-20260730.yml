name: Orbit 360 · Recibos/Cartera · visual focal sanitizada fail-closed
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-human-review-sanitized-visual-v910-20260731
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  TRIGGER: .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  visual_focal:
    name: Visual focal sanitizada fail-closed · zero deploy/write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar recuperación SECURITY_FAILURE y alcance
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-sanitized-visual-security-recovery-v3" and .classification=="SECURITY_FAILURE" and .invalidatedPriorVisualRun==30674070410 and .invalidatedPriorArtifact==8809808825 and .technicalHumanReviewRun==30673945126 and .technicalHumanReviewPassed==true and .sourceHostingRun==30670430241 and .sourceHostingDeployPassed==true and .hostingDeploy==false and .rulesDeploy==false and .functionsDeploy==false and .storageDeploy==false and .dataWrites==false and .production==false and .browserReadOnly==true and .screenshotsSanitizedFailClosed==true and .visibleScreenshotSurfaceOnly==true' "$TRIGGER" >/dev/null
          node --check tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          grep -Fq "SANITIZATION_RESIDUAL_VISIBLE_CONTENT" tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          grep -Fq "residualVisibleFormValues" tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Preparar navegador
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install chromium
      - name: Generar set visual sanitizado fail-closed
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          jq -e '.schemaVersion=="orbit360-human-review-sanitized-screens-v3" and .ok==true and .status=="SANITIZED_VISUAL_SET_READY" and .securityFailClosed==true and .invalidatedPriorRun==30674070410 and (.screens|length)==6 and .sanitization.residualDynamicText==0 and .sanitization.residualVisibleFormValues==0 and .containsPII==false and .containsSecrets==false and .firestoreWrites==0 and .operationalWrites==0 and .hostingDeployExecutions==0 and .production==false' "$EVIDENCE_DIR/human-review-sanitized-screens-v20260731.json" >/dev/null
          test "$(find "$EVIDENCE_DIR/human-review-sanitized-screens" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = '6'
      - name: Subir evidencia visual sanitizada válida
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-human-review-sanitized-visual-secure-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Subir solo diagnóstico si sanitización bloquea
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-human-review-sanitization-blocked-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens-v20260731.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens-v20260731.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Sanitization security gate blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='SANITIZED_VISUAL_SET_READY'&&p.securityFailClosed===true&&p.screens?.length===6&&p.sanitization?.residualDynamicText===0&&p.sanitization?.residualVisibleFormValues===0&&p.containsPII===false&&p.containsSecrets===false){state='success';description='Sanitized focal visual set secure';}else if(p.error){description=String(p.error).slice(0,100);}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/sanitized-visual-focal-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
