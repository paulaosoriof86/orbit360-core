name: Orbit 360 · Pólizas router state · diagnóstico read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-router-state-diagnostic-20260731
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  TRIGGER: .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  router_state:
    name: Pólizas · router/DOM state · zero deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar diagnóstico y gate
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-policies-router-state-trigger-v1" and .sourceHostingRun==30670430241 and .hostingDeploy==false and .dataWrites==false and .production==false and .browserDiagnostic==true' "$TRIGGER" >/dev/null
          node --check tools/orbit360-diagnose-policies-router-state-v20260731.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Preparar navegador después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install chromium
      - name: Capturar estado router y DOM
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-diagnose-policies-router-state-v20260731.mjs
          jq -e '.ok==true and .status=="ROUTER_STATE_DIAGNOSTIC_CAPTURED" and .firestoreWrites==0 and .operationalWrites==0 and .hostingDeployExecutions==0 and .production==false' "$EVIDENCE_DIR/policies-router-state-diagnostic-v20260731.json" >/dev/null
      - name: Evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-router-state-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/policies-router-state-diagnostic-v20260731.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/policies-router-state-diagnostic-v20260731.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Policies router diagnostic failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok&&p.status==='ROUTER_STATE_DIAGNOSTIC_CAPTURED'){state='success';const last=p.snapshots?.[p.snapshots.length-1]||{};description=`route=${last.routeKey||'-'} rows=${last.rows||0} premium=${!!last.hasPrimaTotalText}`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-router-state-diagnostic',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
