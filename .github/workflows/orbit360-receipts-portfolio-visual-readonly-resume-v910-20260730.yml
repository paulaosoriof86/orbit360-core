name: Orbit 360 · Recibos/Cartera · recuperación browser post-Hosting final
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-final-browser-recovery-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_POLICIES_BLOB: 46b197a77c162c88af498b5a89a759386a36e9e7
  ORBIT360_READMODEL_BLOB: 2dd34645d08b0836ebeaa369376364ac760a2f74
  ORBIT360_RECEIPTS_BLOB: bd2beaeded48d2ec2780f3830ca91f5e475fca20
  TRIGGER: .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  browser_recovery:
    name: Browser recovery · zero deploy/write · final closure
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar causa raíz, lineage y cero deploy
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-receipts-portfolio-final-browser-recovery-v1" and .classification=="PIPELINE_MECHANISM_FAILURE_DIAGNOSTIC" and .sourceFinalHostingRun==30676303473 and .sourceFinalHostingHead=="e89e4ef437e627dcc2bdc0a5f0b39bb83b715778" and .sourceFinalHostingDeployPassed==true and .sourceFinalRemoteParityPassed==true and .sourceFinalHydrationDiagnosticPassed==true and .sourceFailureStage=="runtime_base_hydrate" and .hostingDeploy==false and .rulesDeploy==false and .functionsDeploy==false and .storageDeploy==false and .dataWrites==false and .production==false and .browserReadOnly==true and .continueOnlyIfBaseVisualPasses==true' "$TRIGGER" >/dev/null
          BASE="$(jq -r '.authorizedRecoveryBase' "$TRIGGER")"
          test -n "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          bad="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^\.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730\.json$' || true)"
          test -z "$bad"
          test "$(git hash-object orbit360-platform/modules/polizas.js)" = "$ORBIT360_POLICIES_BLOB"
          test "$(git hash-object orbit360-platform/modules/policy-receipts-v1199-detail-guard.js)" = "$ORBIT360_READMODEL_BLOB"
          test "$(git hash-object orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js)" = "$ORBIT360_RECEIPTS_BLOB"
          node --check tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          node --check tools/orbit360-human-review-visual-lab-v20260731.mjs
          node --check tools/orbit360-test-receipt-hero-badge-browser-v20260801.mjs
          node --check tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Verificar paridad remota sin publicar
        shell: bash
        run: |
          set -euo pipefail
          files=('index.html' 'core/client-canonical-view-projection-v20260716.js' 'core/backend-lab-receipts-portfolio-projection-v910.js' 'core/importa-dryrun-p0.js' 'core/importa-transversal-p0-bootstrap-v20260731.js' 'core/importa-identity-upsert-v20260731.js' 'core/importa-polizas-p0.js' 'core/importa-cartera-p0.js' 'modules/policy-receipts-v1199-detail-guard.js' 'modules/polizas.js' 'modules/cliente360.js' 'sw.js')
          pass=0
          for f in "${files[@]}"; do
            local_sha="$(sha256sum "orbit360-platform/$f" | awk '{print $1}')"
            tmp="${RUNNER_TEMP}/recovery-$(basename "$f")"
            curl -fsSL --retry 3 "${ORBIT360_LAB_URL}/${f}?orbitRecovery=${GITHUB_SHA}" -o "$tmp"
            test "$(sha256sum "$tmp" | awk '{print $1}')" = "$local_sha"
            pass=$((pass+1))
          done
          jq -n --argjson pass "$pass" '{schemaVersion:"orbit360-final-browser-recovery-parity-v1",ok:($pass==12),passed:$pass,failed:(12-$pass),hostingDeployExecutions:0,firestoreWrites:0,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/final-browser-recovery-parity-v20260801.json"
          test "$pass" = '12'
      - name: Preparar navegador después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install chromium
      - name: Runtime base instrumentado
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          jq -e '.ok==true and .status=="VISUAL_LAB_PASS" and .contractVersion=="9.1.0" and .checks.baseline==true and .checks.projectionReady==true and .checks.downstreamZero==true and .roleViews["Dirección"].rowsVisible>0 and .roleViews["Operativo"].rowsVisible>0 and .roleViews["Asesor"].rowsVisible>0 and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null
      - name: Runtime humano integral
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-human-review-visual-lab-v20260731.mjs
          jq -e '.ok==true and .status=="HUMAN_REVIEW_VISUAL_LAB_PASS" and .counts.clientes==430 and .counts.polizas==1373 and .counts.vehiculos==1032 and .counts.recibosEsperados==1293 and .counts.carteraPrimas==673 and .counts.cobros==0 and .checks.globalPoliciesResponsive==true and .checks.globalPoliciesPaginated==true and .checks.globalPoliciesPremiumHeaderVisible==true and .checks.policyPremiumSemantic==true and .checks.policyQualityFailClosed==true and .checks.vehicleFullPage==true and .checks.vehicleSemanticFieldsVisible==true and .checks.receiptDetail==true and .checks.receiptSemanticFieldsVisible==true and .checks.reportedPaymentNotCobro==true and .checks.portfolioReconciledVisible==true and .checks.portfolioNotPayment==true and .checks.portfolioTraceVisible==true and .checks.downstreamZero==true and .checks.noPageErrors==true and .checks.noTechnicalCopy==true and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/human-review-visual-lab-v20260731.json" >/dev/null
      - name: Browser contract badge compacto
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-test-receipt-hero-badge-browser-v20260801.mjs
          jq -e '.ok==true and .status=="RECEIPT_HERO_BADGE_BROWSER_PASS" and .badge.visible==true and .badge.compact==true and .badge.height<=32 and .badge.alignSelf=="flex-start" and .badge.flexGrow=="0" and .badge.flexShrink=="0" and .hostingDeployExecutions==0 and .firestoreWrites==0 and .operationalWrites==0 and .production==false' "$EVIDENCE_DIR/receipt-hero-badge-browser-v20260801.json" >/dev/null
      - name: Evidencia visual sanitizada fail-closed
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          jq -e '.schemaVersion=="orbit360-human-review-sanitized-screens-v3" and .ok==true and .status=="SANITIZED_VISUAL_SET_READY" and .securityFailClosed==true and (.screens|length)==6 and .sanitization.residualDynamicText==0 and .sanitization.residualVisibleFormValues==0 and .containsPII==false and .containsSecrets==false and .firestoreWrites==0 and .operationalWrites==0 and .hostingDeployExecutions==0 and .production==false' "$EVIDENCE_DIR/human-review-sanitized-screens-v20260731.json" >/dev/null
          test "$(find "$EVIDENCE_DIR/human-review-sanitized-screens" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = '6'
      - name: Cerrar evidencia de recuperación
        if: always()
        shell: bash
        run: |
          set +e
          PARITY=false; BASE=false; HUMAN=false; BADGE=false; VISUAL=false
          jq -e '.ok==true and .passed==12' "$EVIDENCE_DIR/final-browser-recovery-parity-v20260801.json" >/dev/null 2>&1 && PARITY=true
          jq -e '.ok==true and .status=="VISUAL_LAB_PASS"' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null 2>&1 && BASE=true
          jq -e '.ok==true and .status=="HUMAN_REVIEW_VISUAL_LAB_PASS"' "$EVIDENCE_DIR/human-review-visual-lab-v20260731.json" >/dev/null 2>&1 && HUMAN=true
          jq -e '.ok==true and .status=="RECEIPT_HERO_BADGE_BROWSER_PASS"' "$EVIDENCE_DIR/receipt-hero-badge-browser-v20260801.json" >/dev/null 2>&1 && BADGE=true
          jq -e '.ok==true and .status=="SANITIZED_VISUAL_SET_READY" and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/human-review-sanitized-screens-v20260731.json" >/dev/null 2>&1 && VISUAL=true
          jq -n --argjson parity "$PARITY" --argjson base "$BASE" --argjson human "$HUMAN" --argjson badge "$BADGE" --argjson visual "$VISUAL" '{schemaVersion:"orbit360-receipts-portfolio-final-browser-recovery-v1",ok:($parity and $base and $human and $badge and $visual),status:(if ($parity and $base and $human and $badge and $visual) then "RECEIPTS_PORTFOLIO_FINAL_VISUAL_CLOSURE_PASS" else "RECEIPTS_PORTFOLIO_FINAL_BROWSER_RECOVERY_FAIL" end),sourceHostingRun:30676303473,sourceHostingDeployPassed:true,remoteParity:$parity,baseVisual:$base,humanVisual:$human,receiptHeroBadgeCompact:$badge,sanitizedVisualEvidence:$visual,hostingDeployExecutions:0,rulesDeployExecutions:0,functionsDeploy:false,storageDeploy:false,firestoreDataWrites:0,operationalWrites:0,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/receipts-portfolio-final-browser-recovery-v20260801.json"
      - name: Subir evidencia de recuperación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-final-browser-recovery-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/final-browser-recovery-parity-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-lab-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-visual-lab-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/receipt-hero-badge-browser-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens/*.png
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-final-browser-recovery-v20260801.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-final-browser-recovery-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Receipts/portfolio browser recovery failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok&&p.status==='RECEIPTS_PORTFOLIO_FINAL_VISUAL_CLOSURE_PASS'){state='success';description='Receipts/portfolio final visual closure PASS';}else if(p.status){description=String(p.status).slice(0,100);}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-final-visual-closure',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
