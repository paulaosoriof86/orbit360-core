name: Orbit 360 · Recibos/Cartera 9.1.0 · visual read-only resume
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-visual-readonly-v910-20260730
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  SOURCE_HOSTING_RUN: '30670430241'
  SOURCE_HOSTING_ARTIFACT: '8808577341'
  VALIDATOR_FIX_COMMIT: da4ae989ee8682ab865a41d1fdc2c43fca000577
  VALIDATOR_STATIC_RUN: '30672771524'
jobs:
  visual_readonly:
    name: Human review recovery · browser read-only · zero deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar lineage y alcance cero deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          git merge-base --is-ancestor "$VALIDATOR_FIX_COMMIT" HEAD
          test -f .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json
          jq -e '.schemaVersion=="orbit360-human-review-readonly-recovery-v2" and .classification=="VALIDATOR_STALE" and .pipelineClassification=="PIPELINE_MECHANISM_FAILURE" and .sourceHostingRun==(env.SOURCE_HOSTING_RUN|tonumber) and .sourceHostingArtifact==(env.SOURCE_HOSTING_ARTIFACT|tonumber) and .sourceHostingDeployPassed==true and .sourceRemoteParityPassed==true and .sourceHydrationPassed==true and .sourceBaseVisualPassed==true and .previousHumanFailedStage=="global_policies" and .secondHumanFailedStage=="global_policies" and .stopRetryApplied==true and .rootCause=="HUMAN_VALIDATOR_MISSING_DETERMINISTIC_DIRECTION_ROLE_CONTEXT" and .validatorFixCommit==env.VALIDATOR_FIX_COMMIT and .validatorStaticRun==(env.VALIDATOR_STATIC_RUN|tonumber) and .validatorStaticPassed==true and .rulesDeploy==false and .hostingDeploy==false and .functionsDeploy==false and .storageDeploy==false and .dataWrites==false and .cobrosWrites==false and .production==false and .browserReadOnly==true and .newAuthorization==false' .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json >/dev/null
          test "$(git diff --name-only "$VALIDATOR_FIX_COMMIT"..HEAD | grep -Ev '^\.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730\.json$' | wc -l | tr -d ' ')" = '1'
          grep -Fq "await role(page,'Dirección')" tools/orbit360-human-review-visual-lab-v20260731.mjs
          grep -Fq "POLICIES_ACCESS_NOT_GRANTED_FOR_DIRECTION" tools/orbit360-human-review-visual-lab-v20260731.mjs
      - name: Gate canónico antes de secreto/browser
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-human-review-visual-lab-v20260731.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node tools/orbit360-test-human-visual-contract-v20260731.mjs > "$EVIDENCE_DIR/human-review-recovery-static-v20260731.json"
          jq -e '.status=="HUMAN_VISUAL_STATIC_READY" and .failed==0 and .passed==.total and .firestoreWrites==0 and .deployExecuted==false' "$EVIDENCE_DIR/human-review-recovery-static-v20260731.json" >/dev/null
      - name: Preparar navegador después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install chromium
      - name: Ejecutar runtime humano read-only corregido
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-human-review-visual-lab-v20260731.mjs
          jq -e '.ok==true and .status=="HUMAN_REVIEW_VISUAL_LAB_PASS" and .counts.clientes==430 and .counts.aseguradoras==30 and .counts.asesores==7 and .counts.polizas==1373 and .counts.vehiculos==1032 and .counts.recibosEsperados==1293 and .counts.carteraPrimas==673 and .counts.cobros==0 and .counts.finmovs==0 and .checks.globalPoliciesResponsive==true and .checks.globalPoliciesPaginated==true and .checks.globalPoliciesDirectionRole==true and .checks.policyPremiumSemantic==true and .checks.policyQualityFailClosed==true and .checks.vehicleFullPage==true and .checks.receiptDetail==true and .checks.reportedPaymentNotCobro==true and .checks.portfolioReconciledVisible==true and .checks.portfolioNotPayment==true and .checks.downstreamZero==true and .checks.noPageErrors==true and .checks.noTechnicalCopy==true and .metrics.activeRoleForHumanReview=="Dirección" and .metrics.globalPoliciesRows>0 and .metrics.globalPoliciesRows<=100 and .metrics.globalPoliciesHasPremiumLabel==true and .metrics.globalPoliciesHasPaginationText==true and .metrics.globalPoliciesAccessCan==true and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/human-review-visual-lab-v20260731.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-human-review-readonly-recovery-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-recovery-static-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-visual-lab-v20260731.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          HUMAN: orbit360-platform/runtime-gate-crm-v20260716/human-review-visual-lab-v20260731.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Human review read-only recovery failed';
            try{const h=JSON.parse(fs.readFileSync(process.env.HUMAN,'utf8'));if(h.ok===true&&h.status==='HUMAN_REVIEW_VISUAL_LAB_PASS'&&h.firestoreWrites===0&&h.operationalWrites===0&&h.productionTouched===false){state='success';description='Human review read-only recovery PASS';}else if(h.errorCode){description=`Human review blocked: ${String(h.errorCode).slice(0,90)}`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/human-review-readonly-recovery-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
