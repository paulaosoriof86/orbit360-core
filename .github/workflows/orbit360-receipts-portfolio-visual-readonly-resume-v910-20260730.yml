name: Orbit 360 · Recibos/Cartera · continuación evidencia final
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-final-evidence-continuation-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_POLICIES_BLOB: 46b197a77c162c88af498b5a89a759386a36e9e7
  ORBIT360_READMODEL_BLOB: 2dd34645d08b0836ebeaa369376364ac760a2f74
  ORBIT360_RECEIPTS_BLOB: bd2beaeded48d2ec2780f3830ca91f5e475fca20
  TRIGGER: .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  evidence_continuation:
    name: Evidencia final sanitizada · zero deploy/write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar lineage PASS y corregir solo VALIDATOR_STALE
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-receipts-portfolio-final-evidence-continuation-v1" and .classification=="VALIDATOR_STALE" and .sourceFinalHostingRun==30676303473 and .sourceFinalHostingDeployPassed==true and .sourceFinalRemoteParityPassed==true and .sourceFinalHydrationDiagnosticPassed==true and .sourceBrowserRecoveryRun==30676673787 and .sourceBrowserRecoveryArtifact==8810714415 and .sourceBrowserRecoveryDigest=="sha256:d2f2d04811da20cbb17f4bf6e713078697125f51395945e4cd4b0b447acce995" and .baseVisualPassed==true and .humanVisualPassed==true and .badgeBrowserPassed==true and .badgeHeight==21 and .badgeAlignSelf=="flex-start" and .badgeFlexGrow=="0" and .badgeFlexShrink=="0" and .hostingDeploy==false and .rulesDeploy==false and .functionsDeploy==false and .storageDeploy==false and .dataWrites==false and .production==false and .browserReadOnly==true and .runOnlySanitizedVisualEvidence==true' "$TRIGGER" >/dev/null
          BASE="$(jq -r '.authorizedContinuationBase' "$TRIGGER")"
          test -n "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          bad="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^\.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730\.json$' || true)"
          test -z "$bad"
          test "$(git hash-object orbit360-platform/modules/polizas.js)" = "$ORBIT360_POLICIES_BLOB"
          test "$(git hash-object orbit360-platform/modules/policy-receipts-v1199-detail-guard.js)" = "$ORBIT360_READMODEL_BLOB"
          test "$(git hash-object orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js)" = "$ORBIT360_RECEIPTS_BLOB"
          node --check tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Confirmar assets publicados sin deploy
        shell: bash
        run: |
          set -euo pipefail
          files=('core/backend-lab-receipts-portfolio-projection-v910.js' 'modules/policy-receipts-v1199-detail-guard.js' 'modules/polizas.js')
          pass=0
          for f in "${files[@]}"; do
            local_sha="$(sha256sum "orbit360-platform/$f" | awk '{print $1}')"
            tmp="${RUNNER_TEMP}/evidence-$(basename "$f")"
            curl -fsSL --retry 3 "${ORBIT360_LAB_URL}/${f}?orbitEvidence=${GITHUB_SHA}" -o "$tmp"
            test "$(sha256sum "$tmp" | awk '{print $1}')" = "$local_sha"
            pass=$((pass+1))
          done
          jq -n --argjson pass "$pass" '{schemaVersion:"orbit360-final-evidence-asset-parity-v1",ok:($pass==3),passed:$pass,failed:(3-$pass),hostingDeployExecutions:0,firestoreWrites:0,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/final-evidence-asset-parity-v20260801.json"
          test "$pass" = '3'
      - name: Preparar navegador después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install chromium
      - name: Generar evidencia visual sanitizada fail-closed
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-human-review-screenshots-sanitized-v20260731.mjs
          jq -e '.schemaVersion=="orbit360-human-review-sanitized-screens-v3" and .ok==true and .status=="SANITIZED_VISUAL_SET_READY" and .securityFailClosed==true and (.screens|length)==6 and .sanitization.residualDynamicText==0 and .sanitization.residualVisibleFormValues==0 and .containsPII==false and .containsSecrets==false and .firestoreWrites==0 and .operationalWrites==0 and .hostingDeployExecutions==0 and .production==false' "$EVIDENCE_DIR/human-review-sanitized-screens-v20260731.json" >/dev/null
          test "$(find "$EVIDENCE_DIR/human-review-sanitized-screens" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = '6'
      - name: Cerrar Recibos/Cartera
        if: always()
        shell: bash
        run: |
          set +e
          PARITY=false; VISUAL=false
          jq -e '.ok==true and .passed==3' "$EVIDENCE_DIR/final-evidence-asset-parity-v20260801.json" >/dev/null 2>&1 && PARITY=true
          jq -e '.ok==true and .status=="SANITIZED_VISUAL_SET_READY" and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/human-review-sanitized-screens-v20260731.json" >/dev/null 2>&1 && VISUAL=true
          jq -n --argjson parity "$PARITY" --argjson visual "$VISUAL" '{schemaVersion:"orbit360-receipts-portfolio-final-visual-closure-v2",ok:($parity and $visual),status:(if ($parity and $visual) then "RECEIPTS_PORTFOLIO_FINAL_VISUAL_CLOSURE_PASS" else "RECEIPTS_PORTFOLIO_FINAL_VISUAL_CLOSURE_FAIL" end),sourceHostingRun:30676303473,sourceBrowserRecoveryRun:30676673787,sourceHostingDeployPassed:true,sourceRemoteParityPassed:true,sourceHydrationPassed:true,baseVisual:true,humanVisual:true,receiptHeroBadgeCompact:true,finalAssetParity:$parity,sanitizedVisualEvidence:$visual,hostingDeployExecutions:0,rulesDeployExecutions:0,functionsDeploy:false,storageDeploy:false,firestoreDataWrites:0,operationalWrites:0,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/receipts-portfolio-final-visual-closure-v20260801.json"
      - name: Subir evidencia final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-final-visual-closure-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/final-evidence-asset-parity-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/human-review-sanitized-screens/*.png
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-final-visual-closure-v20260801.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-final-visual-closure-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Receipts/portfolio final visual closure failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok&&p.status==='RECEIPTS_PORTFOLIO_FINAL_VISUAL_CLOSURE_PASS'){state='success';description='Receipts/portfolio final visual closure PASS';}else if(p.status){description=String(p.status).slice(0,100);}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-final-visual-closure',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
