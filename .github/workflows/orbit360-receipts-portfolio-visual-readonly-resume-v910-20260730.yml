name: Orbit 360 · Pólizas serving drift · diagnóstico read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-serving-drift-diagnostic-20260731
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  TRIGGER: .github/orbit360-triggers/receipts-portfolio-visual-readonly-resume-v910-20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  serving_drift:
    name: Pólizas · serving/cache drift · zero browser zero deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar alcance diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-policies-serving-drift-diagnostic-v1" and .classification=="PIPELINE_MECHANISM_FAILURE" and .sourceHostingRun==30670430241 and .sourceRemoteParityPassed==true and .browserFailuresAtGlobalPolicies==3 and .lastDiagnostics.rows==100 and .lastDiagnostics.activeRole=="Dirección" and .lastDiagnostics.accessCanPolizas==true and .lastDiagnostics.hasPaginationText==true and .lastDiagnostics.hasPremiumLabel==false and .hostingDeploy==false and .browser==false and .secrets==false and .dataWrites==false and .production==false' "$TRIGGER" >/dev/null
          grep -Fq 'modules/polizas.js?v1318' orbit360-platform/index.html
          grep -Fq 'Prima total' orbit360-platform/modules/polizas.js
          grep -Fq 'Mostrando' orbit360-platform/modules/polizas.js
      - name: Comparar asset fijado vs cache-busted
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          local_file='orbit360-platform/modules/polizas.js'
          pinned="${RUNNER_TEMP}/polizas-pinned.js"
          fresh="${RUNNER_TEMP}/polizas-fresh.js"
          index_remote="${RUNNER_TEMP}/index-remote.html"
          pinned_headers="${RUNNER_TEMP}/pinned-headers.txt"
          fresh_headers="${RUNNER_TEMP}/fresh-headers.txt"
          curl -fsSL --retry 3 -D "$pinned_headers" "${ORBIT360_LAB_URL}/modules/polizas.js?v1318" -o "$pinned"
          curl -fsSL --retry 3 -D "$fresh_headers" "${ORBIT360_LAB_URL}/modules/polizas.js?orbitServingDiag=${GITHUB_SHA}" -o "$fresh"
          curl -fsSL --retry 3 "${ORBIT360_LAB_URL}/index.html?orbitServingDiag=${GITHUB_SHA}" -o "$index_remote"
          local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
          pinned_sha="$(sha256sum "$pinned" | awk '{print $1}')"
          fresh_sha="$(sha256sum "$fresh" | awk '{print $1}')"
          local_premium=false; pinned_premium=false; fresh_premium=false; pinned_pagination=false; fresh_pagination=false; remote_index_v1318=false
          grep -Fq 'Prima total' "$local_file" && local_premium=true
          grep -Fq 'Prima total' "$pinned" && pinned_premium=true
          grep -Fq 'Prima total' "$fresh" && fresh_premium=true
          grep -Fq 'Mostrando' "$pinned" && pinned_pagination=true
          grep -Fq 'Mostrando' "$fresh" && fresh_pagination=true
          grep -Fq 'modules/polizas.js?v1318' "$index_remote" && remote_index_v1318=true
          pinned_cache="$(grep -i '^cache-control:' "$pinned_headers" | tr -d '\r' | tail -1 | sed 's/^[^:]*:[[:space:]]*//' || true)"
          fresh_cache="$(grep -i '^cache-control:' "$fresh_headers" | tr -d '\r' | tail -1 | sed 's/^[^:]*:[[:space:]]*//' || true)"
          classification='SERVING_DRIFT_NOT_CONFIRMED'
          if [ "$fresh_sha" = "$local_sha" ] && [ "$pinned_sha" != "$local_sha" ]; then classification='SERVING_CACHE_VERSION_DRIFT_CONFIRMED'; fi
          if [ "$fresh_sha" = "$local_sha" ] && [ "$pinned_sha" = "$local_sha" ]; then classification='SERVING_ASSET_MATCHES_CURRENT_SOURCE'; fi
          jq -n \
            --arg classification "$classification" \
            --arg localSha "$local_sha" --arg pinnedSha "$pinned_sha" --arg freshSha "$fresh_sha" \
            --arg pinnedCache "$pinned_cache" --arg freshCache "$fresh_cache" \
            --argjson localPremium "$local_premium" --argjson pinnedPremium "$pinned_premium" --argjson freshPremium "$fresh_premium" \
            --argjson pinnedPagination "$pinned_pagination" --argjson freshPagination "$fresh_pagination" --argjson remoteIndexV1318 "$remote_index_v1318" \
            '{schemaVersion:"orbit360-policies-serving-drift-diagnostic-v1",ok:true,status:"DIAGNOSTIC_CAPTURED",classification:$classification,localSha256:$localSha,pinnedV1318Sha256:$pinnedSha,cacheBustedSha256:$freshSha,localHasPrimaTotal:$localPremium,pinnedV1318HasPrimaTotal:$pinnedPremium,cacheBustedHasPrimaTotal:$freshPremium,pinnedV1318HasMostrando:$pinnedPagination,cacheBustedHasMostrando:$freshPagination,remoteIndexLoadsV1318:$remoteIndexV1318,pinnedCacheControl:$pinnedCache,cacheBustedCacheControl:$freshCache,browserExecuted:false,secretsAccessed:false,hostingDeployExecutions:0,rulesDeployExecutions:0,functionsDeploy:false,storageDeploy:false,dataWrites:0,production:false}' > "$EVIDENCE_DIR/policies-serving-drift-diagnostic-v20260731.json"
          jq . "$EVIDENCE_DIR/policies-serving-drift-diagnostic-v20260731.json"
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-serving-drift-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/policies-serving-drift-diagnostic-v20260731.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar estado diagnóstico
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/policies-serving-drift-diagnostic-v20260731.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Policies serving drift diagnostic failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok&&p.status==='DIAGNOSTIC_CAPTURED'){state='success';description=String(p.classification).slice(0,100);}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-serving-drift-diagnostic',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
