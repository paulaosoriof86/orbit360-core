name: Orbit 360 · Receipts/portfolio Drive reader diagnostic
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-receipts-portfolio-drive-reader-diagnostic-v20260730.yml'
permissions:
  contents: read
  statuses: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico antes de secret
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block9-receipts-portfolio-static-v20260730
          jq -e '.status=="GO_GATE_CONTRACT" and .failed==0 and .operationalWrites==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Verificar principal técnico sin exponerlo
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          EXPECTED_EMAIL_SHA256: 752480dd69b2b564912e0cfac90fbaae8cbeba49eee0475e6c95aacca700015a
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          node <<'NODE' >/tmp/drive-reader-diagnostic.json
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.SERVICE_ACCOUNT||'{}');
          const actual=crypto.createHash('sha256').update(String(sa.client_email||'')).digest('hex');
          const projectOk=sa.project_id==='ays-orbit-360-lab';
          const principalMatch=actual===process.env.EXPECTED_EMAIL_SHA256;
          const out={status:projectOk&&principalMatch?'DRIVE_READER_PRINCIPAL_CONFIRMED':'DRIVE_READER_PRINCIPAL_MISMATCH',projectOk,principalMatch,containsPII:false,containsSecrets:false,firestoreRead:false,operationalWrites:0,productionTouched:false};
          console.log(JSON.stringify(out));
          if(!projectOk||!principalMatch)process.exit(41);
          NODE
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let state='failure',description='Drive reader principal mismatch';
            try{const p=JSON.parse(fs.readFileSync('/tmp/drive-reader-diagnostic.json','utf8'));if(p.status==='DRIVE_READER_PRINCIPAL_CONFIRMED'){state='success';description='Drive reader principal confirmed by hash';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-drive-reader-diagnostic',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
