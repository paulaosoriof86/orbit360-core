name: Orbit 360 · Block 12 · continuidad request v4 source-only

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/block12-go-lab-candidate-visible-v4-source-only.json'

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-block12-request-v4-provenance-source-only
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_SOURCE_ONLY_REQUEST: .github/orbit360-requests/block12-go-lab-candidate-visible-v4-source-only.json
  ORBIT360_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/microblock24-request-v4-provenance-source-only.json
  ORBIT360_PREFLIGHT: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json

jobs:
  source-only-continuity:
    name: Request v4 + provenance + outer router + inner engine · cero capacidades
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout request source-only exacto con historia completa
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar request source-only v4 y frontera
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_SOURCE_ONLY_REQUEST"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-microblock24-continuity-source-only-request-v1" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and .microblock=="2.4" and
            .gate=="PASS_REQUEST_V4_PROVENANCE_COMPOSITION" and
            .status=="AUTHORIZED_SOURCE_ONLY_ONCE" and
            .approved==true and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .authorizationRef=="user_authorized_microblock_2_4_source_only_20260804T2341-0600" and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and .parentHead==$parent and
            .runtimeAuthorized==false and .secretAccessAuthorized==false and .firebaseAuthorized==false and
            .firestoreAuthorized==false and .functionsAuthorized==false and .hostingAuthorized==false and
            .browserAuthorized==false and .deployAuthorized==false and .rulesAuthorized==false and
            .reimportAuthorized==false and .productionAuthorized==false and .mainAuthorized==false and
            .mergeAuthorized==false and .functionalReplayAuthorized==false and
            .outerRouterRequired==true and .innerEngineRequired==true and
            .checkoutFetchDepth==0 and .baselineExistenceGuardRequired==true and
            .futureRuntimeRequest==".github/orbit360-requests/block12-go-lab-candidate-visible-v4.json" and
            .consumedRuntimeRequest==".github/orbit360-requests/block12-go-lab-candidate-visible-v3.json" and
            .containsPII==false and .containsSecrets==false
          ' "$ORBIT360_SOURCE_ONLY_REQUEST" >/dev/null

      - name: Ejecutar request, provenance y composición canónica source-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-request-v4-provenance-source-only-v20260805.mjs
          jq -e '.status=="PASS_REQUEST_V4_PROVENANCE_COMPOSITION" and .classification=="GO_SOURCE_ONLY_CONTROL_PLANE" and .failed==0 and
            .provenance.baselinePresent==true and .provenance.baselineAncestorOfParent==true and
            .provenance.productBaselineUnchanged==true and .provenance.consumedV3BlobUnchanged==true and
            .runtimeRequestExists==false and .outerRouterExitCode==0 and .innerEngineReached==true and
            .innerPreflightStatus=="PASS_CANONICAL_PREFLIGHT_COMPOSITION" and
            .runtimeAuthorized==false and .secretAccess==false and .firebaseCommandsExecuted==false and
            .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and
            .functionsDeployAttempted==false and .hostingDeployAttempted==false and
            .browserExecuted==false and .deployExecuted==false and .rulesDeployed==false and
            .realDataReimported==false and .functionalReplayExecuted==false and
            .productionTouched==false and .mainTouched==false and .mergeExecuted==false and
            .containsPII==false and .containsSecrets==false and .ok==true' "$ORBIT360_EVIDENCE" >/dev/null
          jq -e '.status=="PASS_CANONICAL_PREFLIGHT_COMPOSITION" and .sourceOnlyCompositionTest==true and
            .executionAuthorized==false and .secretAccessAuthorized==false and .firestoreReadAuthorized==false and
            .browserAuthorized==false and .deployAuthorized==false and .functionsDeployAuthorized==false and
            .hostingPreviewAuthorized==false and .rulesDeployAuthorized==false and .productionAuthorized==false and
            .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and
            .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .ok==true' "$ORBIT360_PREFLIGHT" >/dev/null

      - name: Publicar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-microblock24-source-only-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/microblock24-request-v4-provenance-source-only.json
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar resultado en PR 5
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS='STOP_RETRY_SOURCE_ONLY_REQUEST_V4'
          PASSED='0'
          TOTAL='0'
          CLASSIFICATION='PIPELINE_MECHANISM_FAILURE'
          if [ -f "$ORBIT360_EVIDENCE" ]; then
            STATUS="$(jq -r '.status // "STOP_RETRY_SOURCE_ONLY_REQUEST_V4"' "$ORBIT360_EVIDENCE")"
            PASSED="$(jq -r '.passed // 0' "$ORBIT360_EVIDENCE")"
            TOTAL="$(jq -r '.total // 0' "$ORBIT360_EVIDENCE")"
            CLASSIFICATION="$(jq -r '.classification // "PIPELINE_MECHANISM_FAILURE"' "$ORBIT360_EVIDENCE")"
          fi
          BODY="## RC-AYS-LAB-CANONICA-01 · Microbloque 2.4 · run ${GITHUB_RUN_ID}\n\n- Estado: \`${STATUS}\`\n- Clasificación: \`${CLASSIFICATION}\`\n- Gate: \`PASS_REQUEST_V4_PROVENANCE_COMPOSITION\`\n- Checks: \`${PASSED}/${TOTAL}\`\n- Runtime, secretos, Firebase, Firestore, Functions, Hosting, navegador y deploy: \`no\`\n- Rules, reimportación, producción, main y merge: \`no\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="$BODY" >/dev/null
