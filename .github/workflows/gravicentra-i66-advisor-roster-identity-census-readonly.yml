name: Gravicentra I6.6 Advisor Roster Identity Census Readonly
on:
  workflow_dispatch:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-advisor-roster-identity-census-readonly.yml
      - tools/gravicentra-i6-6-advisor-roster-identity-census-readonly.cjs
permissions:
  contents: read
concurrency:
  group: gi-i66-roster-identity-readonly
  cancel-in-progress: false
jobs:
  census:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only exact authorized tenant roster and memberships
        run: |
          set -euo pipefail
          node --check tools/gravicentra-i6-6-advisor-roster-identity-census-readonly.cjs
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
          node tools/gravicentra-i6-6-advisor-roster-identity-census-readonly.cjs
