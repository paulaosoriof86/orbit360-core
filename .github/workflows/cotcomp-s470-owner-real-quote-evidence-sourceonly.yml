name: CotComp S4.70 owner real quote evidence source-only

on:
  push:
    branches:
      - ays/cotcomp-s470-owner-proposal-evidence-ready-20261002
    paths:
      - '.github/cotcomp-lab-intents/s470-owner-real-quote-evidence-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s470-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.70 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s470-owner-real-quote-evidence-sourceonly.json
          jq -e '
            .authorization=="S470_OWNER_REAL_QUOTE_EVIDENCE_SOURCEONLY" and
            .projectId=="ays-orbit-360-lab" and
            .tenantId=="alianzas-soluciones" and
            .journeyId=="GT_AUTO_MOTO_HYBRID" and
            .appDataReads==false and
            .appDataWrites==false and
            .realData==false and
            .providerOrRater==false and
            .production==false and
            .issuance==false and
            .binding==false and
            .payment==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.70 safeguards
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-owner-proposal-evidence-s470.js
          node --check cotcomp-owner-proposal-evidence-s470.test.js
          node --test cotcomp-owner-proposal-evidence-s470.test.js

      - name: Generate sanitized S4.70 receipt
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s470"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./cotcomp-owner-proposal-evidence-s470');
          const r=s.sourceBundleReadiness();
          if(!r.sourceBundleReady)throw new Error('S470_SOURCE_BUNDLE_NOT_READY');
          if(r.documentaryAlternatives!==3||r.uniqueSourceDocuments!==2)throw new Error('S470_EVIDENCE_COUNT_INVALID');
          if(r.ownerHumanValidationRequired!==true||r.ownerHumanValidationPresent!==false)throw new Error('S470_HUMAN_VALIDATION_GATE_INVALID');
          if(r.appDataReads!==0||r.appDataWrites!==0||r.realDataTouched||r.providerOrRaterCalls!==0||r.productionTouched)throw new Error('S470_BOUNDARY_INVALID');
          if(r.realProposalCreated||r.comparisonSetCreated)throw new Error('S470_REAL_OBJECT_CREATION_FORBIDDEN');
          const receipt={
            schemaVersion:'ays-cotcomp-s470-owner-real-quote-evidence-sourceonly-receipt-v1.0',
            sourceSha:process.env.GITHUB_SHA,
            sourceBundleReady:true,
            documentaryAlternatives:3,
            uniqueSourceDocuments:2,
            ownerHumanValidationRequired:true,
            ownerHumanValidationPresent:false,
            secondControlledExecutionAuthorizationRequired:true,
            reusesExistingS469Contract:true,
            admittedSourceTypes:['pdf_externo'],
            rawPdfPersistedInGitHub:false,
            rawPiiPersistedInGitHub:false,
            appDataReads:0,
            appDataWrites:0,
            realDataTouched:false,
            realProposalCreated:false,
            comparisonSetCreated:false,
            providerOrRaterCalls:0,
            productionTouched:false,
            issuance:false,
            binding:false,
            payment:false,
            generalPersistenceReleased:false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s470/S470_OWNER_REAL_QUOTE_EVIDENCE_SOURCEONLY_RECEIPT.json',JSON.stringify(receipt,null,2));
          NODE

      - name: Upload sanitized S4.70 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s470-owner-real-quote-evidence-sourceonly-${{ github.run_id }}
          path: ${{ runner.temp }}/s470/S470_OWNER_REAL_QUOTE_EVIDENCE_SOURCEONLY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
