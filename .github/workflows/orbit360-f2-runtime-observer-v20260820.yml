name: Orbit360 F2 Runtime Observer 20260820
# HISTORICAL / READ-ONLY after definitive control-plane freeze 2026-08-21.
# Runtime evidence is an Actions artifact. This observer MUST NOT mutate branch state.

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  historical-readback-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce observer non-writer contract
        shell: bash
        run: |
          set -euo pipefail
          echo '{"ok":true,"status":"F2_OBSERVER_HISTORICAL_READ_ONLY","branchMutation":false,"runtimeExecuted":false,"browserExecuted":false,"secretAccess":false,"firestoreRead":false,"operationalWrites":0,"deployExecuted":false,"productionTouched":false}'
