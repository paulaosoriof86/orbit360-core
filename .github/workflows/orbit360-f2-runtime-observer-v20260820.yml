name: Orbit360 F2 Runtime Observer 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/f2-runtime-observer-runbound-*.json'
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate observer request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST="${CHANGED[0]}"
          case "$REQUEST" in .github/orbit360-requests/f2-runtime-observer-runbound-*.json) ;; *) exit 41 ;; esac
          jq -e '.schemaVersion=="orbit360-f2-runtime-observer-request-v1" and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .targetRequestOrdinal==13' "$REQUEST" >/dev/null
          echo "OBSERVER_REQUEST=$REQUEST" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$(jq -r '.targetRequestCommit' "$REQUEST")" >> "$GITHUB_ENV"
      - name: Observe exact runtime and persist sanitized terminal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RUN_JSON="$RUNNER_TEMP/runs.json"; RUN_ID=''; CONCLUSION=''; STATUS=''
          for i in $(seq 1 60); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" -o "$RUN_JSON"
            RUN_ID="$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[]|select(.head_sha==$sha and .name=="Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818")][0].id // empty' "$RUN_JSON")"
            if [ -n "$RUN_ID" ]; then
              STATUS="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|.status' "$RUN_JSON")"
              CONCLUSION="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|.conclusion // ""' "$RUN_JSON")"
              [ "$STATUS" = 'completed' ] && break
            fi
            sleep 10
          done
          OUT=orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-observer-request13-v20260820.json
          FINAL_COPY=orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-request13-v20260820.json
          mkdir -p "$(dirname "$OUT")"
          TERMINAL_OK=false; TERMINAL_STATUS='RUN_NOT_FOUND'; CLASS='PIPELINE_MECHANISM_FAILURE'; ARTIFACT_ID=''; ARTIFACT_DIGEST=''
          if [ -n "$RUN_ID" ] && [ "$STATUS" = 'completed' ]; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/runs/$RUN_ID/artifacts" -o "$RUNNER_TEMP/artifacts.json"
            ARTIFACT_ID="$(jq -r --arg name "orbit360-f2-productive-acceptance-$RUN_ID" '[.artifacts[]|select(.name==$name)][0].id // empty' "$RUNNER_TEMP/artifacts.json")"
            ARTIFACT_DIGEST="$(jq -r --arg name "orbit360-f2-productive-acceptance-$RUN_ID" '[.artifacts[]|select(.name==$name)][0].digest // ""' "$RUNNER_TEMP/artifacts.json")"
            if [ -n "$ARTIFACT_ID" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/artifacts/$ARTIFACT_ID/zip" -o "$RUNNER_TEMP/evidence.zip"
              mkdir -p "$RUNNER_TEMP/evidence"; unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
              FINAL="$(find "$RUNNER_TEMP/evidence" -type f -name "f2-final-run-${RUN_ID}.json" | head -1)"
              if [ -n "$FINAL" ] && jq -e '.containsPII==false and .containsSecrets==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$FINAL" >/dev/null; then
                cp "$FINAL" "$FINAL_COPY"
                TERMINAL_OK="$(jq -r '.ok' "$FINAL")"; TERMINAL_STATUS="$(jq -r '.status' "$FINAL")"; CLASS="$(jq -r '.classification' "$FINAL")"
              else TERMINAL_STATUS='TERMINAL_EVIDENCE_MISSING_OR_UNSAFE'; fi
            else TERMINAL_STATUS='RUNTIME_ARTIFACT_MISSING'; fi
          else TERMINAL_STATUS='RUNTIME_RUN_NOT_COMPLETED_OR_NOT_FOUND'; fi
          jq -n --arg run "$RUN_ID" --arg status "$STATUS" --arg conclusion "$CONCLUSION" --arg artifact "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" --arg terminal "$TERMINAL_STATUS" --arg class "$CLASS" --argjson ok "$TERMINAL_OK" --arg target "$TARGET_SHA" '{schemaVersion:"orbit360-f2-runtime-observer-v1",ok:$ok,status:$terminal,classification:$class,targetRequestCommit:$target,targetRequestOrdinal:13,runtimeRunId:($run|if length>0 then tonumber else null end),runtimeStatus:$status,runtimeConclusion:$conclusion,evidenceArtifactId:($artifact|if length>0 then tonumber else null end),evidenceArtifactDigest:$digest,sourceOnlyObserver:true,runtimeExecutedByObserver:false,browserExecutedByObserver:false,secretAccessByObserver:false,firestoreReadByObserver:false,writesByObserver:0,containsPII:false,containsSecrets:false}' > "$OUT"
          git config user.name 'orbit360-f2-runtime-observer-bot'
          git config user.email 'orbit360-f2-runtime-observer-bot@users.noreply.github.com'
          git add "$OUT"; [ -f "$FINAL_COPY" ] && git add "$FINAL_COPY"
          git commit -m 'evidence(f2): persist Request13 runtime observation [skip ci]'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
