name: Orbit360 F2 Runtime Observer 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/f2-runtime-observer-successor-*.json'
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate identity-bound dispatch observer request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          mapfile -t REQUESTS < <(printf '%s\n' "${CHANGED[@]}" | grep '^\.github/orbit360-requests/f2-runtime-observer-successor-.*\.json$' || true)
          test "${#REQUESTS[@]}" = '1'
          REQUEST="${REQUESTS[0]}"
          for f in "${CHANGED[@]}"; do
            case "$f" in "$REQUEST"|.github/workflows/orbit360-f2-runtime-observer-v20260820.yml) ;; *) echo "OBSERVER_COMMIT_SURFACE_INVALID:$f" >&2; exit 41;; esac
          done
          jq -e '.schemaVersion=="orbit360-f2-runtime-observer-request-v3" and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .event=="workflow_dispatch" and (.notBeforeUtc|test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")) and (.authorizationIdentityDigest|test("^[a-f0-9]{64}$")) and (.targetRequestPath|test("^\\.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-successor-[a-f0-9]{12}-v20260820\\.json$"))' "$REQUEST" >/dev/null
          TARGET_PATH="$(jq -r '.targetRequestPath' "$REQUEST")"
          test -f "$TARGET_PATH"
          test "$(jq -r '.authorizationIdentityDigest' "$TARGET_PATH")" = "$(jq -r '.authorizationIdentityDigest' "$REQUEST")"
          test "$(jq -r '.requestVersion' "$TARGET_PATH")" = 'F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V2'
          test "$(jq -r '.consumed' "$TARGET_PATH")" = 'false'
          test "$(jq -r '.replayAllowed' "$TARGET_PATH")" = 'false'
          echo "OBSERVER_REQUEST=$REQUEST" >> "$GITHUB_ENV"
          echo "TARGET_PATH=$TARGET_PATH" >> "$GITHUB_ENV"
          echo "AUTH_DIGEST=$(jq -r '.authorizationIdentityDigest' "$REQUEST")" >> "$GITHUB_ENV"
          echo "AUTH_SHORT=$(jq -r '.authorizationIdentityDigest' "$REQUEST" | cut -c1-12)" >> "$GITHUB_ENV"
          echo "NOT_BEFORE=$(jq -r '.notBeforeUtc' "$REQUEST")" >> "$GITHUB_ENV"
      - name: Publish immediate runtime and dispatcher diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ays/backend-tenant-lab-v99-20260703
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RUNTIME_NAME='Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818'
          CONTROL_NAME='Orbit360 Continuity Canonical Source Only'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/runs?branch=$BRANCH&per_page=100" -o "$RUNNER_TEMP/runs.json"
          RUN_ID="$(jq -r --arg since "$NOT_BEFORE" --arg branch "$BRANCH" --arg name "$RUNTIME_NAME" '[.workflow_runs[]|select(.name==$name and .event=="workflow_dispatch" and .head_branch==$branch and .created_at >= $since)]|sort_by(.created_at)|reverse|.[0].id // empty' "$RUNNER_TEMP/runs.json")"
          CONTROL_ID="$(jq -r --arg since "$NOT_BEFORE" --arg branch "$BRANCH" --arg name "$CONTROL_NAME" '[.workflow_runs[]|select(.name==$name and .head_branch==$branch and .created_at >= $since)]|sort_by(.created_at)|reverse|.[0].id // empty' "$RUNNER_TEMP/runs.json")"
          STATUS=''; CONCLUSION=''; HEAD_SHA=''; CONTROL_STATUS=''; CONTROL_CONCLUSION=''; CONTROL_HEAD=''
          if [ -n "$RUN_ID" ]; then
            STATUS="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|.status' "$RUNNER_TEMP/runs.json")"
            CONCLUSION="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|.conclusion // ""' "$RUNNER_TEMP/runs.json")"
            HEAD_SHA="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|.head_sha // ""' "$RUNNER_TEMP/runs.json")"
          fi
          if [ -n "$CONTROL_ID" ]; then
            CONTROL_STATUS="$(jq -r --argjson id "$CONTROL_ID" '.workflow_runs[]|select(.id==$id)|.status' "$RUNNER_TEMP/runs.json")"
            CONTROL_CONCLUSION="$(jq -r --argjson id "$CONTROL_ID" '.workflow_runs[]|select(.id==$id)|.conclusion // ""' "$RUNNER_TEMP/runs.json")"
            CONTROL_HEAD="$(jq -r --argjson id "$CONTROL_ID" '.workflow_runs[]|select(.id==$id)|.head_sha // ""' "$RUNNER_TEMP/runs.json")"
          fi
          OUT="orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-observer-dispatch-${AUTH_SHORT}-v20260820.json"
          FINAL_COPY="orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-terminal-dispatch-${AUTH_SHORT}-v20260820.json"
          mkdir -p "$(dirname "$OUT")"
          TERMINAL_OK=false; TERMINAL_STATUS='RUNTIME_RUN_NOT_FOUND'; CLASS='PIPELINE_MECHANISM_FAILURE'; ARTIFACT_ID=''; ARTIFACT_DIGEST=''
          if [ -n "$RUN_ID" ]; then
            if [ "$STATUS" != 'completed' ]; then
              TERMINAL_STATUS='RUNTIME_RUN_IN_PROGRESS'; CLASS='RUNTIME_PENDING'
            else
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/runs/$RUN_ID/artifacts" -o "$RUNNER_TEMP/artifacts.json"
              ARTIFACT_ID="$(jq -r --arg name "orbit360-f2-productive-acceptance-$RUN_ID" '[.artifacts[]|select(.name==$name)][0].id // empty' "$RUNNER_TEMP/artifacts.json")"
              ARTIFACT_DIGEST="$(jq -r --arg name "orbit360-f2-productive-acceptance-$RUN_ID" '[.artifacts[]|select(.name==$name)][0].digest // ""' "$RUNNER_TEMP/artifacts.json")"
              if [ -n "$ARTIFACT_ID" ]; then
                curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/actions/artifacts/$ARTIFACT_ID/zip" -o "$RUNNER_TEMP/evidence.zip"
                rm -rf "$RUNNER_TEMP/evidence"; mkdir -p "$RUNNER_TEMP/evidence"; unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
                FINAL="$(find "$RUNNER_TEMP/evidence" -type f -name "f2-final-run-${RUN_ID}.json" | head -1)"
                if [ -n "$FINAL" ] && jq -e '.containsPII==false and .containsSecrets==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$FINAL" >/dev/null; then
                  cp "$FINAL" "$FINAL_COPY"
                  TERMINAL_OK="$(jq -r '.ok' "$FINAL")"; TERMINAL_STATUS="$(jq -r '.status' "$FINAL")"; CLASS="$(jq -r '.classification' "$FINAL")"
                else TERMINAL_STATUS='TERMINAL_EVIDENCE_MISSING_OR_UNSAFE'; fi
              else TERMINAL_STATUS='RUNTIME_ARTIFACT_MISSING'; fi
            fi
          elif [ -n "$CONTROL_ID" ]; then
            TERMINAL_STATUS='RUNTIME_RUN_NOT_FOUND_AFTER_CONTROL_PLANE_RUN'
          fi
          jq -n --arg run "$RUN_ID" --arg status "$STATUS" --arg conclusion "$CONCLUSION" --arg artifact "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" --arg terminal "$TERMINAL_STATUS" --arg class "$CLASS" --argjson ok "$TERMINAL_OK" --arg head "$HEAD_SHA" --arg path "$TARGET_PATH" --arg auth "$AUTH_DIGEST" --arg since "$NOT_BEFORE" --arg control "$CONTROL_ID" --arg controlStatus "$CONTROL_STATUS" --arg controlConclusion "$CONTROL_CONCLUSION" --arg controlHead "$CONTROL_HEAD" '{schemaVersion:"orbit360-f2-runtime-observer-v5",ok:$ok,status:$terminal,classification:$class,event:"workflow_dispatch",notBeforeUtc:$since,runtimeHeadSha:$head,targetRequestPath:$path,authorizationIdentityDigest:$auth,runtimeRunId:($run|if length>0 then tonumber else null end),runtimeStatus:$status,runtimeConclusion:$conclusion,evidenceArtifactId:($artifact|if length>0 then tonumber else null end),evidenceArtifactDigest:$digest,controlPlaneRunId:($control|if length>0 then tonumber else null end),controlPlaneStatus:$controlStatus,controlPlaneConclusion:$controlConclusion,controlPlaneHeadSha:$controlHead,sourceOnlyObserver:true,runtimeExecutedByObserver:false,browserExecutedByObserver:false,secretAccessByObserver:false,firestoreReadByObserver:false,writesByObserver:0,containsPII:false,containsSecrets:false}' > "$OUT"
          git config user.name 'orbit360-f2-runtime-observer-bot'
          git config user.email 'orbit360-f2-runtime-observer-bot@users.noreply.github.com'
          git add "$OUT"; [ -f "$FINAL_COPY" ] && git add "$FINAL_COPY"
          git commit -m "evidence(f2): persist immediate workflow-dispatch diagnostic ${AUTH_SHORT} [skip ci]"
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
