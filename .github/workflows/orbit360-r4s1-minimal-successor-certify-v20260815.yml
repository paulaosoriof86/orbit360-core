name: Orbit360 R4S1 Minimal Successor Certify 20260815

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4s1-minimal-successor-certify-v20260815.yml'
      - 'tools/orbit360-r4-minimal-successor-package-v20260815.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit360-r4s1-minimal-successor-certify-v20260815
  cancel-in-progress: false

env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  BASE_ARTIFACT_ID: '9232555925'
  BASE_ZIP_NAME: orbit360-fase-a-product-r3-4f70f0dd6e87.zip
  BASE_ZIP_SHA256: 4fd52a748fa130fd069b2d2684e1944369164aeb0646fe728067dd7b4ce29e69
  BASE_SOURCE_HEAD: 4f70f0dd6e870e8c7443a7638a9dc6e954eace1b
  DELTA_SOURCE_HEAD: df4c217c34722c03215f88b62f6865ab41c2a9f3
  DELTA_PATH: orbit360-platform/core/access-scope.js
  SUCCESSOR_ZIP_NAME: orbit360-fase-a-product-r4s1-df4c217c3472.zip

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical gate before successor construction
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node --check tools/orbit360-r4-minimal-successor-package-v20260815.mjs
          git cat-file -e "${BASE_SOURCE_HEAD}^{commit}"
          git cat-file -e "${DELTA_SOURCE_HEAD}^{commit}"

      - name: Recover exact durable R3 and stage single delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/orbit360-r4s1"
          BASE="$WORK/base"
          SUCCESSOR="$WORK/successor"
          VERIFY="$WORK/verify"
          OUTER="$WORK/r3-artifact.zip"
          INNER="$WORK/$BASE_ZIP_NAME"
          REPLACEMENT="$WORK/access-scope.rootfix.js"
          CERT="$EVIDENCE_DIR/r4s1-minimal-successor-certification-v20260815.json"
          mkdir -p "$WORK" "$BASE" "$VERIFY" "$EVIDENCE_DIR"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o "$OUTER"
          unzip -q "$OUTER" -d "$WORK/outer"
          test -f "$WORK/outer/$BASE_ZIP_NAME"
          cp "$WORK/outer/$BASE_ZIP_NAME" "$INNER"
          test "$(sha256sum "$INNER" | awk '{print $1}')" = "$BASE_ZIP_SHA256"
          unzip -q "$INNER" -d "$BASE"

          git show "${DELTA_SOURCE_HEAD}:${DELTA_PATH}" > "$REPLACEMENT"
          node --check "$REPLACEMENT"
          test "$(sha256sum "$REPLACEMENT" | awk '{print $1}')" = "$(git show "${DELTA_SOURCE_HEAD}:${DELTA_PATH}" | sha256sum | awk '{print $1}')"

          node tools/orbit360-r4-minimal-successor-package-v20260815.mjs prepare "$BASE" "$SUCCESSOR" "$REPLACEMENT" "$CERT"
          jq -e '.ok==false and .status=="R4S1_SUCCESSOR_STAGED_AWAITING_ZIP_VERIFY" and .baseZipSha256==env.BASE_ZIP_SHA256 and .baseSourceHead==env.BASE_SOURCE_HEAD and .deltaSourceHead==env.DELTA_SOURCE_HEAD and .changedProductFileCount==1 and .unchangedFileCount==193 and .fileCount==194 and .writeAuthorized==false and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .deployExecuted==false and .productionTouched==false' "$CERT" >/dev/null

          (cd "$SUCCESSOR" && find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/$SUCCESSOR_ZIP_NAME" -@)
          SUCCESSOR_ZIP_SHA256="$(sha256sum "$SUCCESSOR_ZIP_NAME" | awk '{print $1}')"
          test "${#SUCCESSOR_ZIP_SHA256}" -eq 64
          unzip -q "$SUCCESSOR_ZIP_NAME" -d "$VERIFY"
          export SUCCESSOR_ZIP_SHA256 SUCCESSOR_ZIP_NAME
          node tools/orbit360-r4-minimal-successor-package-v20260815.mjs verify "$BASE" "$VERIFY" - "$CERT"
          jq -e '.ok==true and .status=="R4S1_MINIMAL_SUCCESSOR_DURABLE_CERTIFIED" and .classification=="FUNCTIONAL_DEFECT_ROOTFIX_SUCCESSOR_CERTIFIED" and .baseZipSha256==env.BASE_ZIP_SHA256 and .baseSourceHead==env.BASE_SOURCE_HEAD and .deltaSourceHead==env.DELTA_SOURCE_HEAD and .changedProductFileCount==1 and .unchangedFileCount==193 and .fileCount==194 and (.zipSha256|length)==64 and .writeAuthorized==false and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .deployExecuted==false and .productionTouched==false and .containsPII==false and .containsSecrets==false' "$CERT" >/dev/null
          test "$(jq -r '.zipSha256' "$CERT")" = "$SUCCESSOR_ZIP_SHA256"
          test "$(sha256sum "$SUCCESSOR_ZIP_NAME" | awk '{print $1}')" = "$SUCCESSOR_ZIP_SHA256"
          cp "$VERIFY/orbit360-package-manifest.json" "$EVIDENCE_DIR/r4s1-orbit360-package-manifest-v20260815.json"
          printf '%s  %s\n' "$SUCCESSOR_ZIP_SHA256" "$SUCCESSOR_ZIP_NAME" > "$EVIDENCE_DIR/r4s1-minimal-successor-sha256-v20260815.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s1-minimal-successor-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s1-minimal-successor-certification-v20260815.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s1-orbit360-package-manifest-v20260815.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s1-minimal-successor-sha256-v20260815.txt
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orbit360-r4s1-minimal-successor-durable-${{ github.run_id }}
          path: |
            orbit360-fase-a-product-r4s1-df4c217c3472.zip
          if-no-files-found: error
          retention-days: 14
