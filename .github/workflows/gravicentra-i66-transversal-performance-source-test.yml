# I6.6: explicit trans-role performance fixes, no Firebase data writes or deployments.
name: Gravicentra I6.6 Transversal Performance Source QA
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - orbit360-platform/core/tenant-domain-config-client.js
      - orbit360-platform/core/access-scope.js
      - orbit360-platform/data/store-firestore-product-readonly-p0.js
      - orbit360-platform/core/router.js
      - tools/gravicentra-i6-6-transversal-access-index-mobile.test.cjs
      - artifacts/orbit360-recovery/release-control/I6_6_APPROVED_PRODUCT_DELTA_MANIFEST_20261110.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check orbit360-platform/core/tenant-domain-config-client.js
          node --check orbit360-platform/core/access-scope.js
          node --check orbit360-platform/data/store-firestore-product-readonly-p0.js
          node --check orbit360-platform/core/router.js
          node --check tools/gravicentra-i6-6-transversal-access-index-mobile.test.cjs
      - name: Functional cache and role policy unit QA, no operational mutations
        run: |
          set -euo pipefail
          node --test tools/gravicentra-i6-6-protected-read-clone-performance.test.cjs tools/gravicentra-i6-6-transversal-access-index-mobile.test.cjs
