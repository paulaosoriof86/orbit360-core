        run: |
          set -euo pipefail
          rm -rf .tmp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs \
