          MATCH="$(printf '%s' "$ARTS" | jq --arg name "$POSTDEPLOY_ARTIFACT_NAME" '[.artifacts[]|select(.name==$name)]')"
          test "$(printf '%s' "$MATCH" | jq 'length')" = '1'
          test "$(printf '%s' "$MATCH" | jq -r '.[0].id')" = "$POSTDEPLOY_ARTIFACT_ID"
          test "$(printf '%s' "$MATCH" | jq -r '.[0].digest')" = "$POSTDEPLOY_ARTIFACT_DIGEST"
