          fs.mkdirSync(path.dirname(process.env.ROOTFIX_EVIDENCE),{recursive:true});fs.writeFileSync(process.env.ROOTFIX_EVIDENCE,JSON.stringify(rootfix,null,2)+'\n');
          const post={schemaVersion:'orbit360-f2-pre-request06-postsync-source-only-v1',ok:true,status:'F2_PRE_REQUEST06_KNOWN_ROOTFIXES_POSTSYNC_SOURCE_ONLY_PASS',classification:'SOURCE_CONTRACT_PASS',gateId:process.env.GATE_ID,gateMarker:'PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE',postdeployProbe:{runId:32272580947,crossTenantDenied:true,integrityBeforeAfterPass:true,requestConsumed:true,replayAllowed:false,rulesRedeployExecuted:false},knownRootfixes:{crossTenantSharedContract:true,roleView:true,legalDetachQuietWindow:true,dynamicRequestLifecycle:true,routeTopology:true,pwaSwBuildParity:true,frozenProductAuthProvider:true},boundary:{phase:'F2_RULES01_POSTDEPLOY_PROBE_PASS_REQUEST06_AUTHORIZATION_PENDING',request06Created:false,request06Authorized:false,successorArtifactId:9345207863,successorPublished:false,productionOperationalDeclared:false},scope:{browserExecuted:false,runtimeExecuted:false,secretAccess:false,firestoreRead:false,firestoreDocumentWrites:0,authWrites:0,membershipWrites:0,dataWrites:0,rulesDeploy:false,hostingDeploy:false,functionsDeploy:false,packageRebuild:false,publication:false,production:false,mainMerge:false},pipelineRootCausesClosed:['F2_POSTDEPLOY_PROBE_OBSERVER_OVERCONSTRAINED_BY_ACTIONS_PATH_FIELD','DOCSYNC_WORKFLOW_INVOKED_CANONICAL_ROOT_TOOLS_FROM_ORBIT360_PLATFORM_CWD'],containsPII:false,containsSecrets:false,generatedAt:new Date().toISOString()};
          fs.writeFileSync(process.env.POSTSYNC_EVIDENCE,JSON.stringify(post,null,2)+'\n');
          NODE
          jq -e '.ok==true and .request06Created==false and .browserExecuted==false and .secretAccess==false and .firestoreDocumentWrites==0 and .rulesDeploy==false and .production==false' "$ROOTFIX_EVIDENCE" >/dev/null
          jq -e '.ok==true and .knownRootfixes.crossTenantSharedContract==true and .knownRootfixes.roleView==true and .knownRootfixes.legalDetachQuietWindow==true and .knownRootfixes.dynamicRequestLifecycle==true and .knownRootfixes.pwaSwBuildParity==true and .knownRootfixes.frozenProductAuthProvider==true and .boundary.request06Created==false and .boundary.successorPublished==false and .scope.browserExecuted==false and .scope.secretAccess==false and .scope.firestoreDocumentWrites==0 and .scope.production==false' "$POSTSYNC_EVIDENCE" >/dev/null
      - name: Persist one serialized source-only closure
