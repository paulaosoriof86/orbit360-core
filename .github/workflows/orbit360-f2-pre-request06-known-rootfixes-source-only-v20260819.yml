  POSTDEPLOY_RUN_ID: '32272580947'
  POSTDEPLOY_ARTIFACT_NAME: orbit360-f2-rules01-postdeploy-probe-32272580947
  POSTDEPLOY_ARTIFACT_ID: '9372746151'
  POSTDEPLOY_ARTIFACT_DIGEST: sha256:c087ad3bae277f990c760eb04edcce96ef2746add36120040ba6da5f4d55a860
  SELFTEST_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/f2-full-runtime-known-rootfixes-selftest-v20260819.json
