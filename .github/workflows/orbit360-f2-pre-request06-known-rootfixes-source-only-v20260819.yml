          gh run download "$POSTDEPLOY_RUN_ID" -n "$POSTDEPLOY_ARTIFACT_NAME" -D .tmp/f2-postdeploy
          TERMINAL=.tmp/f2-postdeploy/f2-rules01-postdeploy-probe-terminal-run-32272580947.json
          test -f "$TERMINAL"
          jq -e '.ok==true and .status=="F2_RULES01_POSTDEPLOY_CROSS_TENANT_PROBE_PASS" and .probe.responseStatus==403 and .probe.responseErrorStatus=="PERMISSION_DENIED" and .probe.crossTenantDenied==true and .integrity.integrityBeforeAfterPass==true and .integrity.countsIdentical==true and .integrity.digestsIdentical==true and .scope.rulesRedeployExecuted==false and .scope.firestoreDocumentWrites==0 and .scope.authWrites==0 and .scope.membershipWrites==0 and .scope.dataWrites==0 and .scope.hostingDeploy==false and .scope.functionsDeploy==false and .scope.packageRebuilt==false and .scope.publicationExecuted==false and .scope.productionHostingTouched==false' "$TERMINAL" >/dev/null
      - name: Synchronize live state from already-consumed PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-rules01-postdeploy-pass-docsync-v20260819.mjs
          node tools/orbit360-f2-rules01-postdeploy-pass-docsync-v20260819.mjs --terminal .tmp/f2-postdeploy/f2-rules01-postdeploy-probe-terminal-run-32272580947.json | tee /tmp/f2-docsync.txt
          grep -F 'F2_RULES01_POSTDEPLOY_PASS_DOCSYNC_PREPARED' /tmp/f2-docsync.txt
