          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .stableBoundaryContract==true and .sourceClosed==true and .phaseStillF2==true and .nextActionBound==true and .indexBoundaryCurrent==true and .executionAuthorized==false and .secretAccessAuthorized==false and .firestoreReadAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
