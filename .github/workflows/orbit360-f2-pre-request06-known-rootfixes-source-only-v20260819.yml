        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old=`need(role.includes("SuperAdmin: 'Dirección'")||role.includes("['Dirección','SuperAdmin']"),'VALIDATOR_STALE:F2_ROLE_VIEW_DIRECTION_EQUIVALENCE_MISSING');`;
          const neu=`need(role.includes("'Dirección': Object.freeze(['Dirección', 'SuperAdmin'])"),'VALIDATOR_STALE:F2_ROLE_VIEW_DIRECTION_EQUIVALENCE_MISSING');`;
          if(s.includes(old)) s=s.replace(old,neu);
          if(!s.includes(neu)) throw new Error('PIPELINE_MECHANISM_FAILURE:F2_SELFTEST_ROLE_ASSERTION_PATCH_FAILED');
          fs.writeFileSync(p,s,'utf8');
          NODE
      - name: Apply shared-contract rootfix to all runtime owners
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-full-runtime-cross-tenant-rootfix-v20260819.mjs
          node tools/orbit360-f2-full-runtime-cross-tenant-rootfix-v20260819.mjs | tee /tmp/f2-rootfix.txt
          grep -F 'F2_FULL_RUNTIME_CROSS_TENANT_VALIDATOR_STALE_ROOTFIX_APPLIED' /tmp/f2-rootfix.txt
          git diff --check
      - name: Run source-only audit of all previously known F2 blockers
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$SELFTEST_EVIDENCE" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          jq -e '.ok==true and .status=="F2_FULL_RUNTIME_KNOWN_ROOTFIXES_SOURCE_AUDIT_PASS" and .crossTenant.pathValid==true and .crossTenant.reservedIdAbsent==true and .crossTenant.sharedContractBound==true and .roleView.rootfixBound==true and .legalGate.detachQuietWindowRootfixBound==true and .requestLifecycle.dynamicRunbound==true and .requestLifecycle.ordinalCoupling==false and .pwa.buildsMatch==true and .auth.passwordSignInProviderPresent==true and .runtimeWorkflow.deployCommandPresent==false and .request06Created==false and .browserExecuted==false and .secretAccess==false' "$SELFTEST_EVIDENCE" >/dev/null
      - name: Verify exact existing postdeploy PASS artifact without replay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${POSTDEPLOY_RUN_ID}")"
          test "$(printf '%s' "$RUN" | jq -r '.status')" = 'completed'
          test "$(printf '%s' "$RUN" | jq -r '.conclusion')" = 'success'
          test "$(printf '%s' "$RUN" | jq -r '.run_attempt')" = '1'
