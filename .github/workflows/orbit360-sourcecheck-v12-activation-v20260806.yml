name: Orbit 360 · Validar activación v12 · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-v12-activation-source-only:
    if: github.head_ref == 'ays/runtime-v12-activation-source-only-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact activation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate source package
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/orbit360-preflight-visual-matrix-runtime-relay-v8-v20260806.sh
          bash -n tools/orbit360-restore-visual-matrix-v12-baseline-before-runtime-v20260806.sh
          bash -n tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v4-transport-base-sha-v20260806.sh
          node --check tools/orbit360-playwright-capture-watchdog-lib-v20260806.mjs
          node --check tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs
          node --check tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs

      - name: Assert v12 activation contract and zero risk
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const lifecycle = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const overlay = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          const request = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const workflow = fs.readFileSync('.github/workflows/orbit360-claude-paquete-reconciliado-v1205.yml','utf8');
          const restore = fs.readFileSync('tools/orbit360-restore-visual-matrix-v12-baseline-before-runtime-v20260806.sh','utf8');
          const source = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/capture-watchdog-source-test-sanitized-v20260806.json','utf8'));
          const ok =
            lifecycle.status === 'AUTHORIZED_FRESH_REQUEST_ONLY_V12_PENDING_EXCLUSIVE_REQUEST' &&
            lifecycle.authorizedBaseHead === 'a0bd5533dc7c3c0efd87019e7b1c9001ce23d26e' &&
            lifecycle.expectedRequestVersion === '20260806.12-capture-watchdog-runtime' &&
            lifecycle.authorizationReserved === true && lifecycle.allowedExecutions === 1 && lifecycle.executionAuthorized === false &&
            overlay.status === 'AUTHORIZED_FRESH_REQUEST_ONLY_V12_PENDING_EXCLUSIVE_REQUEST' && overlay.runtimeAllowedOnlyWithFreshExclusiveRequest === true &&
            request.requestVersion === '20260806.11-transport-base-sha-runtime' && request.consumed === true && request.allowedExecutions === 0 && request.replayAllowed === false &&
            workflow.includes('ORBIT360_EXPECTED_REQUEST_VERSION: 20260806.12-capture-watchdog-runtime') &&
            workflow.includes('orbit360-restore-visual-matrix-v12-baseline-before-runtime-v20260806.sh') &&
            restore.includes("SOURCE_BACKUP='visual-matrix-corrected-backup-31135532118'") &&
            restore.includes("GO_GATE_CONTRACT_NOT_PASS") &&
            source.status === 'PASS_CAPTURE_WATCHDOG_SOURCE_ONLY' && source.failed === 0 && source.ok === true &&
            source.synthetic.timeoutContextCloseCalls === 0 && source.synthetic.timeoutBrowserCloseCalls === 0 && source.synthetic.pageStillUsable === true;
          if (!ok) process.exit(41);
          console.log(JSON.stringify({
            status:'PASS_V12_ACTIVATION_SOURCE_ONLY',
            authorizedBaseHead:lifecycle.authorizedBaseHead,
            expectedRequestVersion:lifecycle.expectedRequestVersion,
            captureWatchdogChecks:source.passed,
            runtimeExecuted:false,
            secretsRead:false,
            firebaseAccess:false,
            browserExecuted:false,
            hostingTouched:false,
            deployExecuted:false,
            writes:0,
            ok:true
          },null,2));
          NODE
