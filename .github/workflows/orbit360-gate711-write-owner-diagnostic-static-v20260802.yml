name: Orbit 360 · Gate 7.11 · diagnóstico owner · estático
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-write-owner-diagnostic-static-v20260802.json'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    name: Gate 7.11 · contrato sanitizado del diagnóstico
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar trigger y contrato
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=.github/orbit360-static-requests/gate711-write-owner-diagnostic-static-v20260802.json
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST"
          jq -e '.schemaVersion=="orbit360-gate711-write-owner-diagnostic-static-request-v1" and .approved==true and .allowedExecutions==1 and .consumed==false and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-diagnosticar-browser-write-owner-gate711-v20260802.mjs
          node --check tools/orbit360-validar-write-owner-diagnostic-contract-v20260802.mjs
          node tools/orbit360-validar-write-owner-diagnostic-contract-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_WRITE_OWNER_DIAGNOSTIC_STATIC_PASS" and .classification=="GO_STATIC_WRITE_OWNER_DIAGNOSTIC" and .failed==0 and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .production==false and .containsPII==false and .containsValues==false and .containsSecrets==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-write-owner-diagnostic-static-v20260802.json >/dev/null
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-write-owner-diagnostic-static-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/gate711-write-owner-diagnostic-static-v20260802.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/gate711-write-owner-diagnostic-static-v20260802.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Gate 7.11 diagnostic static contract failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='GATE711_WRITE_OWNER_DIAGNOSTIC_STATIC_PASS'&&p.secretAccess===false&&p.runtimeExecuted===false){state='success';description='Gate 7.11 diagnostic contract PASS; static only';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-write-owner-diagnostic-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
