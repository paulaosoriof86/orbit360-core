name: Gravicentra S5.10 Lead Card Summary LAB

on:
  workflow_dispatch:
  push:
    branches:
      - ays/gravicentra-s510-lead-card-summary-20261007
    paths:
      - 'orbit360-platform/core/ciclo.js'
      - 'functions/lead-card-summary-s510.test.js'
      - '.github/workflows/gravicentra-s510-lead-card-summary-lab.yml'

permissions:
  contents: read
  actions: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab
  LAB_HOST: https://ays-orbit-360-lab.web.app

jobs:
  lead-card-summary-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and regression QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check ../orbit360-platform/core/ciclo.js
          node --test lead-card-summary-s510.test.js
      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s510/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s510/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.0
      - name: Deploy LAB hosting only
        shell: bash
        run: firebase deploy --only hosting --project "$GCLOUD_PROJECT" --non-interactive --force
      - name: Hosted source readback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$LAB_HOST/core/ciclo.js" -o "$RUNNER_TEMP/s510/evidence/ciclo.js"
          grep -q "Producto / familia" "$RUNNER_TEMP/s510/evidence/ciclo.js"
          grep -q "Resumen del riesgo" "$RUNNER_TEMP/s510/evidence/ciclo.js"
          grep -q "Datos de contacto disponibles" "$RUNNER_TEMP/s510/evidence/ciclo.js"
          grep -q "Sin aseguradora seleccionada" "$RUNNER_TEMP/s510/evidence/ciclo.js"
      - name: Build sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/s510/evidence/receipt.json"
          console.log(JSON.stringify({
            schemaVersion:'gravicentra-s510-lead-card-summary-v1',
            labHostingDeployed:true,
            productSummary:true,
            originSummary:true,
            riskSummary:true,
            contactAvailabilitySummary:true,
            advisorSummary:true,
            falseInsurerFallbackRemoved:true,
            productionTouched:false
          },null,2));
          NODE
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-s510-lead-card-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/s510/evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/s510/firebase-service-account.json"