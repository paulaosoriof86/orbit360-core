# G12 source-only replacement for S5.10; never publishes Hosting.
name: Gravicentra S5.10 Lead Card Summary SOURCE ONLY
on:
  workflow_dispatch:
  push:
    branches:
      - ays/gravicentra-s510-lead-card-summary-20261007
    paths:
      - 'orbit360-platform/core/ciclo.js'
      - 'functions/lead-card-summary-s510.test.js'
      - '.github/workflows/gravicentra-s510-lead-card-summary-lab.yml'
permissions:
  contents: read
jobs:
  s510-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and regression QA only
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check ../orbit360-platform/core/ciclo.js
          node --test lead-card-summary-s510.test.js
      - name: No-release safety receipt
        run: echo 'G12_S510_SOURCE_ONLY_PASS NO_HOSTING_MUTATION NO_FUNCTION_DEPLOY NO_REAL_DATA'
# No Firebase credentials, Firebase CLI, Hosting publish or production.
