name: CotComp S5.06 UI Inbound LAB Integration

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s506-ui-inbound-lab-synthetic-20261006
    paths:
      - 'functions/cotcomp-owner-review-s506.js'
      - 'functions/cotcomp-owner-review-s506.test.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/cotcomp-s506-ui-inbound-lab-integration.yml'

permissions:
  contents: read
  actions: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab
  S506_FUNCTION: cotcompOwnerReviewS506
  S506_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompOwnerReviewS506
  PAGE_ORIGIN: https://us-central1-ays-orbit-360-lab.cloudfunctions.net

jobs:
  s506-ui-inbound:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Static and unit QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check cotcomp-owner-review-s506.js
          node --check cotcomp-owner-review-s506.test.js
          node --test cotcomp-owner-review-s506.test.js
          grep -q "maxInstances:1" cotcomp-owner-review-s506.js
          grep -q "concurrency:1" cotcomp-owner-review-s506.js
          grep -q "realCustomerDataUsed:false" cotcomp-owner-review-s506.js

      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s506/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s506/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S5.06 Owner Review to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$S506_FUNCTION" --project "$GCLOUD_PROJECT" --non-interactive --force

      - name: Physical GET readback
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o "$RUNNER_TEMP/s506/evidence/page.html" -w '%{http_code}' "$S506_URL")"
          test "$CODE" = "200"
          grep -q "Registrar solicitud de prueba en A&S" "$RUNNER_TEMP/s506/evidence/page.html"
          grep -q "synthetic@example.invalid" "$RUNNER_TEMP/s506/evidence/page.html"
          grep -q "Continuar por WhatsApp" "$RUNNER_TEMP/s506/evidence/page.html"
          grep -q "Continuar por correo" "$RUNNER_TEMP/s506/evidence/page.html"

      - name: Physical UI-to-adapter synthetic POST
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"synthetic":true,"consent":true,"country":"GT","needFamily":"vehicle"}'
          CODE="$(curl -sS -o "$RUNNER_TEMP/s506/evidence/register.json" -w '%{http_code}'             -X POST "$S506_URL"             -H "Origin: $PAGE_ORIGIN"             -H 'Content-Type: application/json'             --data "$BODY")"
          test "$CODE" = "200"
          node - "$RUNNER_TEMP/s506/evidence/register.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.ok!==true||r.integrationConfirmed!==true||r.retryReused!==true||r.advisorTargetConfirmed!==true||r.cleaned!==true)process.exit(1);
          if(r.productionTouched!==false||r.realCustomerDataUsed!==false)process.exit(1);
          NODE

      - name: Negative gates
        shell: bash
        run: |
          set -euo pipefail
          BAD_ORIGIN="$(curl -sS -o "$RUNNER_TEMP/s506/evidence/bad-origin.json" -w '%{http_code}'             -X POST "$S506_URL"             -H 'Origin: https://example.com'             -H 'Content-Type: application/json'             --data '{"synthetic":true,"consent":true,"country":"GT","needFamily":"vehicle"}')"
          test "$BAD_ORIGIN" = "403"

          REAL_CODE="$(curl -sS -o "$RUNNER_TEMP/s506/evidence/real-denied.json" -w '%{http_code}'             -X POST "$S506_URL"             -H "Origin: $PAGE_ORIGIN"             -H 'Content-Type: application/json'             --data '{"synthetic":false,"consent":true,"country":"GT","needFamily":"vehicle"}')"
          test "$REAL_CODE" = "403"

          NO_CONSENT="$(curl -sS -o "$RUNNER_TEMP/s506/evidence/no-consent.json" -w '%{http_code}'             -X POST "$S506_URL"             -H "Origin: $PAGE_ORIGIN"             -H 'Content-Type: application/json'             --data '{"synthetic":true,"consent":false,"country":"GT","needFamily":"vehicle"}')"
          test "$NO_CONSENT" = "403"

      - name: Build receipt
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/s506/evidence" <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.argv[2],r=JSON.parse(fs.readFileSync(path.join(dir,'register.json'),'utf8'));
          const out={
            schemaVersion:'ays-cotcomp-s506-ui-inbound-lab-receipt-v1.0',
            projectId:'ays-orbit-360-lab',
            tenantId:'alianzas-soluciones',
            uiDeployedToLab:true,
            uiToAdapterIntegrationConfirmed:r.integrationConfirmed===true,
            retryReused:r.retryReused===true,
            advisorTargetConfirmed:r.advisorTargetConfirmed===true,
            cleanupConfirmed:r.cleaned===true,
            productionTouched:false,
            realCustomerDataUsed:false,
            realCustomerSubmissionAllowed:false
          };
          fs.writeFileSync(path.join(dir,'S506_UI_INBOUND_LAB_RECEIPT.json'),JSON.stringify(out,null,2));
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s506-ui-inbound-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s506/evidence/S506_UI_INBOUND_LAB_RECEIPT.json
            ${{ runner.temp }}/s506/evidence/register.json
            ${{ runner.temp }}/s506/evidence/bad-origin.json
            ${{ runner.temp }}/s506/evidence/real-denied.json
            ${{ runner.temp }}/s506/evidence/no-consent.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/s506/firebase-service-account.json"
