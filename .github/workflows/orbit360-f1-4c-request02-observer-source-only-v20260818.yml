name: Orbit360 F1.4C Request02 Observer Source Only 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f1-4c-request02-observer-source-only-v20260818.yml'
permissions:
  contents: write
  actions: read
jobs:
  observe_request02_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REQUEST_COMMIT: 0080eafac6a48aebb46debddcae405783b29a97b
      BUILD_WORKFLOW_NAME: Orbit360 F1.4C Successor Artifact Build 20260818
      EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Observe exact request02 run without rerun
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''; STATUS=''; CONCLUSION=''; COUNT='0'
          for i in $(seq 1 45); do
            curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${REQUEST_COMMIT}&event=push&per_page=20" > /tmp/runs.json
            COUNT="$(jq -r --arg n "$BUILD_WORKFLOW_NAME" '[.workflow_runs[]|select(.name==$n)]|length' /tmp/runs.json)"
            RUN_ID="$(jq -r --arg n "$BUILD_WORKFLOW_NAME" '[.workflow_runs[]|select(.name==$n)]|if length==1 then .[0].id else "" end' /tmp/runs.json)"
            if [ -n "$RUN_ID" ]; then
              STATUS="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|.status' /tmp/runs.json)"
              CONCLUSION="$(jq -r --argjson id "$RUN_ID" '.workflow_runs[]|select(.id==$id)|(.conclusion // "")' /tmp/runs.json)"
              [ "$STATUS" = completed ] && break
            fi
            sleep 2
          done
          mkdir -p "$EVIDENCE_DIR"
          test "$COUNT" = '1'
          test -n "$RUN_ID"
          test "$STATUS" = completed
          ART_COUNT=0; CAND_ID=''; EVID_ID=''; CERT_OK=false; ZIP_REHASH=false; ZIP_SHA=''; ZIP_NAME=''; FILE_COUNT=0; DELTA_COUNT=0; UNCHANGED=0
          curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > /tmp/artifacts.json
          ART_COUNT="$(jq -r '.total_count' /tmp/artifacts.json)"
          if [ "$CONCLUSION" = success ]; then
            CAND_ID="$(jq -r '[.artifacts[]|select(.name|startswith("orbit360-f1-4c-successor-unpublished-"))]|if length==1 then (.[0].id|tostring) else "" end' /tmp/artifacts.json)"
            EVID_ID="$(jq -r '[.artifacts[]|select(.name|startswith("orbit360-f1-4c-successor-evidence-"))]|if length==1 then (.[0].id|tostring) else "" end' /tmp/artifacts.json)"
            test -n "$CAND_ID"; test -n "$EVID_ID"
            curl -L -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVID_ID}/zip" -o /tmp/evidence.zip
            mkdir -p /tmp/evidence; unzip -q /tmp/evidence.zip -d /tmp/evidence
            CERT="$(find /tmp/evidence -name f1-4c-successor-artifact-certification-v20260818.json -print -quit)"; test -n "$CERT"
            jq -e '.ok==true and .status=="F1_4C_SUCCESSOR_ARTIFACT_CERTIFIED_UNPUBLISHED" and .sourceHead=="29caae94a3db1f1626bdde2ea6ee9a21799f9df6" and .fileCount==194 and .deltaCount==2 and .unchangedProductFiles==192 and .rootfixAncestors==true and .f1_4bAncestor==true and .f1_3MembershipSemanticsPresent==true and .f1_3BootstrapAuthOwnershipPresent==true and .published==false and .packageRebuilt==true and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$CERT" >/dev/null
            ZIP_SHA="$(jq -r '.zipSha256' "$CERT")"; ZIP_NAME="$(jq -r '.zipName' "$CERT")"; FILE_COUNT="$(jq -r '.fileCount' "$CERT")"; DELTA_COUNT="$(jq -r '.deltaCount' "$CERT")"; UNCHANGED="$(jq -r '.unchangedProductFiles' "$CERT")"
            curl -L -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CAND_ID}/zip" -o /tmp/candidate-artifact.zip
            mkdir -p /tmp/candidate; unzip -q /tmp/candidate-artifact.zip -d /tmp/candidate
            test -f "/tmp/candidate/$ZIP_NAME"; test "$(sha256sum "/tmp/candidate/$ZIP_NAME"|awk '{print $1}')" = "$ZIP_SHA"
            cp "$CERT" "$EVIDENCE_DIR/f1-4c-successor-artifact-certification-v20260818.json"
            CERT_OK=true; ZIP_REHASH=true
          fi
          jq -n --arg run "$RUN_ID" --arg conclusion "$CONCLUSION" --arg artifacts "$ART_COUNT" --arg cand "$CAND_ID" --arg evid "$EVID_ID" --arg sha "$ZIP_SHA" --arg zip "$ZIP_NAME" --arg fileCount "$FILE_COUNT" --arg deltaCount "$DELTA_COUNT" --arg unchanged "$UNCHANGED" --argjson certOk "$CERT_OK" --argjson zipRehash "$ZIP_REHASH" '{schemaVersion:"orbit360-f1-4c-request02-run-summary-v1",ok:($conclusion=="success"),status:(if $conclusion=="success" then "F1_4C_REQUEST02_BUILD_PASS" else "F1_4C_REQUEST02_BUILD_STOP" end),classification:(if $conclusion=="success" then "PASS" else "PIPELINE_MECHANISM_FAILURE" end),requestCommit:"0080eafac6a48aebb46debddcae405783b29a97b",sourceHead:"29caae94a3db1f1626bdde2ea6ee9a21799f9df6",runId:$run,runConclusion:$conclusion,artifactCount:($artifacts|tonumber),candidateArtifactId:$cand,evidenceArtifactId:$evid,zipName:$zip,zipSha256:$sha,fileCount:($fileCount|tonumber),deltaCount:($deltaCount|tonumber),unchangedProductFiles:($unchanged|tonumber),certificationVerified:$certOk,candidateZipRehashed:$zipRehash,priorRequest01CandidateBuilds:0,request02RerunExecuted:false,observerBuildExecuted:false,browserExecuted:false,runtimeExecuted:false,secretAccess:false,dataAccess:false,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/f1-4c-request02-run-summary-v20260818.json"
      - name: Persist sanitized exact-run observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-f1-4c-request02-observer-bot
          git config user.email orbit360-f1-4c-request02-observer-bot@users.noreply.github.com
          git add "$EVIDENCE_DIR/f1-4c-request02-run-summary-v20260818.json"
          if [ -f "$EVIDENCE_DIR/f1-4c-successor-artifact-certification-v20260818.json" ]; then git add "$EVIDENCE_DIR/f1-4c-successor-artifact-certification-v20260818.json"; fi
          git commit -m 'build(f1.4c): persist request02 exact run evidence [skip ci]'
          git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
