name: Orbit 360 · M5 runtime smoke LAB · 5.0.33
run-name: M5 5.0.33 · one runtime on RC 4bf3 · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-runtime-smoke-533-request-v20260729.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-smoke-533-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m5-runtime-smoke-533-request-v20260729.json
  EXPECTED_RC_HASH: 4bf3c8025654f43f6e4af20e5d16115bdc0851352ccddc6f099649405883cf3b
  EXPECTED_FIREBASE_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PREVIEW_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_EXPECTED_RUNTIME: 20260717-2
  ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  runtime_smoke_lab:
    name: M5 · exactly one runtime 5.0.33 · snapshots + zero writes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar rama SHA solicitud y primer intento
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$ORBIT360_REQUEST_FILE"

      - name: Validar solicitud inmutable sin secretos
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m5-runtime-smoke-request-533-v1'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='5.0.33')bad.push('schema');
          if(r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent||r.allowedExecutions!==1||r.runtimeSmoke!==true)bad.push('binding');
          if(r.releaseCandidateHash!==process.env.EXPECTED_RC_HASH||r.criticalAssets!==43||r.remoteAssetsExpected!==26||r.remoteAssetsMatched!==26)bad.push('candidate');
          if(r.browserBlobSha!=='ca7d7a13c7889c8fea55ada358adbd6742422c42'||r.closerBlobSha!=='ec06019c23cb78c71fdb6f6fba16bee67758a49a'||r.legacyProbeBlobSha!=='70d6ad22553bd0387fa08dd2eeeb6e3b9834fa12')bad.push('blobs');
          if(r.packageRunId!==30494751648||r.packageJobId!==90720843440||r.packageArtifactId!==8741127750)bad.push('package');
          if(r.projectId!==process.env.EXPECTED_FIREBASE_PROJECT_ID||r.canonicalUrl!==process.env.ORBIT360_PREVIEW_URL||r.reviewUrl!==process.env.ORBIT360_PREVIEW_URL+'/ays-lab-preview.html')bad.push('target');
          if(r.secrets!==true||r.firestoreRead!==true||r.firestoreWrite!==false||r.operationalWrites!==false||r.runtime!==true||r.browser!==true||r.deploy!==false||r.hostingDeploy!==false||r.functionsDeploy!==false||r.rulesDeploy!==false||r.production!==false||r.mergeMain!==false||r.policies!==false||r.visualReview!==false||r['pólizas']!==false||r.containsPII!==false||r.containsSecrets!==false)bad.push('capabilities');
          if(bad.length)throw new Error('M5_RUNTIME_533_REQUEST_INVALID:'+bad.join(','));
          console.log('M5_RUNTIME_533_REQUEST_BOUND_OK');
          NODE

      - name: Preflight canónico antes de identidad
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-runtime-smoke-533-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-533-contract-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-533-browser-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-533-close-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.33" and .executionPhase=="LAB_RUNTIME_GATE" and .activationMode=="immutable_request_present" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssetsExpected==26 and .remoteAssetsMatched==26 and .remoteParity==true and .packageRunId==30494751648 and .packageJobId==90720843440 and .packageArtifactId==8741127750 and .browserBlobSha=="ca7d7a13c7889c8fea55ada358adbd6742422c42" and .closerBlobSha=="ec06019c23cb78c71fdb6f6fba16bee67758a49a" and .legacyProbeBlobSha=="70d6ad22553bd0387fa08dd2eeeb6e3b9834fa12" and .capabilityProfile.secrets==true and .capabilityProfile.firestoreRead==true and .capabilityProfile.writes==false and .capabilityProfile.runtime==true and .capabilityProfile.browser==true and .capabilityProfile.deploy==false and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .dataAccess==false and .secretAccess==false and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Confirmar paridad pública 26/26 antes de identidad
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-530-v20260729.mjs
          cp "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-summary.json" "$ORBIT360_EVIDENCE_DIR/m5-runtime-readiness-533-before.json"
          jq -e '.ok==true and .status=="M5_RC_READY_FOR_RUNTIME_SMOKE" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==43 and .remoteLab.assetsExpected==26 and .remoteLab.assetsChecked==26 and .remoteLab.assetsMatched==26 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-readiness-533-before.json" >/dev/null

      - name: Instalar dependencias read-only y navegador
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Resolver identidad LAB después del preflight
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_LOGIN_SECRET: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_LOGIN_SECRET} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-m5-runtime-smoke-533-lab.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$EXPECTED_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_LAB_LOGIN_PASSWORD=$ORBIT360_LOGIN_SECRET" >> "$GITHUB_ENV"

      - name: Snapshot Firestore read-only antes
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs before
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .checksPassed==11 and .checksTotal==11 and .counts.sourceClients==414 and .counts.sourceInsurers==26 and .counts.advisors==7 and .counts.canonicalClients==414 and .counts.canonicalInsurers==26 and .counts.memberships==1 and .counts.config==1 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-live-before.json" >/dev/null

      - name: Ejecutar único runtime 5.0.33
        id: browser
        continue-on-error: true
        shell: bash
        run: node tools/orbit360-m5-runtime-smoke-533-browser-v20260729.mjs

      - name: Snapshot Firestore read-only después
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs after
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .checksPassed==11 and .checksTotal==11 and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-live-after.json" >/dev/null

      - name: Cerrar evidencia y comparar digests
        if: always()
        continue-on-error: true
        shell: bash
        run: node tools/orbit360-m5-runtime-smoke-533-close-v20260729.mjs

      - name: Crear resumen sanitizado de control
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const d=process.env.ORBIT360_EVIDENCE_DIR;const read=n=>{try{return JSON.parse(fs.readFileSync(path.join(d,n),'utf8'))}catch{return null}};
          const p=read('preflight-sanitizado.json'),r=read('m5-runtime-smoke-533-summary.json'),b=read('m5-runtime-smoke-533-browser-summary.json'),before=read('m5-runtime-smoke-live-before.json'),after=read('m5-runtime-smoke-live-after.json');
          const ok=!!(p&&p.status==='GO_GATE_CONTRACT'&&p.failed===0&&p.executionAuthorized===true&&r&&r.ok===true&&r.status==='M5_RUNTIME_SMOKE_533_CLOSED_SUCCESS'&&r.allCountsStable===true&&r.allDigestsStable===true&&r.firestoreWrites===0&&r.operationalWrites===0);
          const out={schemaVersion:'orbit360-m5-runtime-533-control-summary-v1',generatedAt:new Date().toISOString(),ok,status:ok?'M5_RUNTIME_533_CLOSED_SUCCESS':'M5_RUNTIME_533_FAILED_STOP_LINE',gateId:process.env.ORBIT360_GATE_ID,contractVersion:'5.0.33',releaseCandidateHash:process.env.EXPECTED_RC_HASH,preflightStatus:p&&p.status||'MISSING',runtimeStatus:r&&r.status||'MISSING',browserStatus:b&&b.status||'MISSING',failureStage:b&&b.failureStage||'',browserError:b&&b.error||'',snapshotBeforeOk:Boolean(before&&before.ok),snapshotAfterOk:Boolean(after&&after.ok),allCountsStable:Boolean(r&&r.allCountsStable),allDigestsStable:Boolean(r&&r.allDigestsStable),firestoreRead:true,firestoreWrites:Number(r&&r.firestoreWrites||0),operationalWrites:Number(r&&r.operationalWrites||0),networkWriteCandidates:Number(r&&r.networkWriteCandidates||0),runtimeExecuted:true,browserExecuted:true,hostingDeploy:false,functionsDeploy:false,rulesDeploy:false,production:false,mergeMain:false,visualReviewExecuted:false,approvalReadyForVisualReview:ok,containsPII:false,containsSecrets:false};
          fs.writeFileSync(path.join(d,'m5-runtime-533-control-summary.json'),JSON.stringify(out,null,2)+'\n','utf8');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Validar cierre esperado
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M5_RUNTIME_533_CLOSED_SUCCESS" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .snapshotBeforeOk==true and .snapshotAfterOk==true and .allCountsStable==true and .allDigestsStable==true and .firestoreWrites==0 and .operationalWrites==0 and .networkWriteCandidates==0 and .runtimeExecuted==true and .browserExecuted==true and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .visualReviewExecuted==false and .approvalReadyForVisualReview==true' "$ORBIT360_EVIDENCE_DIR/m5-runtime-533-control-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-533-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-readiness-533-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-525-browser-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-533-browser-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-533-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-533-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-533-control-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-533-control-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 runtime 5.0.33 failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.ok===true&&s.status==='M5_RUNTIME_533_CLOSED_SUCCESS'){state='success';description='M5 runtime 5.0.33 PASS; zero writes';}else if(s.failureStage){description=('M5 runtime failed: '+s.failureStage).slice(0,140);}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-533',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-${RUNNER_TEMP}/orbit360-m5-runtime-smoke-533-lab.json}"
