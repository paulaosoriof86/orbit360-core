name: Gravicentra I6.1 Preview Acceptance

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i6-1-bind-successor-preview.yml
      - artifacts/orbit360-recovery/release-control/I6_1_SUCCESSOR_PREVIEW_BIND_INTENT.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gravicentra-i6-1-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  INTENT: artifacts/orbit360-recovery/release-control/I6_1_SUCCESSOR_PREVIEW_BIND_INTENT.json
  TECH_RECEIPT: artifacts/orbit360-recovery/release-control/I6_1_SUCCESSOR_PREVIEW_TECHNICAL_PASS_20260915.json
  EVIDENCE_FILE: artifacts/orbit360-recovery/release-control/I6_1_ASEGURADORAS_PASSWORD_COPY_PREVIEW_ACCEPTANCE_20260915.json
  GUARD: tools/gravicentra-i6-control-plane-guard-v1.mjs

jobs:
  authenticated-preview-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/fase-a-clean-20260831
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact successful causal successor Preview in working tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),https=require('node:https'),cp=require('node:child_process');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const I=JSON.parse(fs.readFileSync(process.env.INTENT,'utf8'));
          const need=(x,c)=>{if(!x)throw new Error(c)};
          const get=url=>new Promise((resolve,reject)=>{https.get(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'User-Agent':'Gravicentra-I6.1','X-GitHub-Api-Version':'2022-11-28'}},r=>{let b='';r.on('data',d=>b+=d);r.on('end',()=>r.statusCode>=200&&r.statusCode<300?resolve(JSON.parse(b)):reject(new Error('GITHUB_HTTP_'+r.statusCode)));}).on('error',reject)});
          (async()=>{
            need(C.status==='PRODUCTION_ACCEPTED','I61_ACCEPT_PRODUCTION_BASELINE_INVALID');
            need(C.gateState?.gates?.I6?.status==='I6_0_BASELINE_FROZEN'&&C.gateState?.gates?.I6?.activeSubgate==='I6.1','I61_ACCEPT_NOT_ACTIVE');
            need(C.gateState?.lastFormallyCompletedMiniGate==='I6.0','I61_ACCEPT_I60_NOT_FROZEN');
            need(I.schemaVersion==='gravicentra-i6-1-successor-preview-bind-intent-v1'&&I.nonAuthoritative===true&&I.gate==='I6.1','I61_INTENT_INVALID');
            need(I.parentCertifiedSourceSha===C.certifiedCandidate?.sourceSha,'I61_INTENT_PARENT_MISMATCH');
            need(I.productionMutationAuthorized===false&&I.dataMutationAuthorized===false,'I61_INTENT_MUTATION_BOUNDARY_INVALID');
            need(cp.execFileSync('git',['show','-s','--format=%T',I.sourceSha],{encoding:'utf8'}).trim()===I.sourceTree,'I61_INTENT_SOURCE_TREE_MISMATCH');
            const run=await get('https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/runs/'+I.runId);
            need(run.name==='Gravicentra I6.1 Functional Successor Preview','I61_REMOTE_RUN_NAME_INVALID');
            need(run.status==='completed'&&run.conclusion==='success'&&run.head_sha===I.sourceSha,'I61_REMOTE_RUN_NOT_EXACT_SUCCESS');
            const arts=await get('https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/runs/'+I.runId+'/artifacts?per_page=100');
            const a=(arts.artifacts||[]).find(x=>x.id===I.artifactId&&x.name===I.artifactName);
            need(a&&!a.expired&&a.digest===I.artifactArchiveDigest,'I61_REMOTE_ARTIFACT_INVALID');
            need(I.readbackFileCount===202&&/^gi-i61-[0-9a-f]{12}-[0-9a-f]{12}$/.test(I.buildId),'I61_INTENT_BUILD_OR_READBACK_INVALID');
            const allowedProductFiles=['orbit360-platform/core/client-insurer-operational-directory-owner-v20260722.js','orbit360-platform/core/product-insurer-credential-provider-p0.js'];
            C.nextCandidate={gate:'I6.1',status:'PREVIEW_TECHNICAL_PASS_AWAITING_AUTHENTICATED_HUMAN_ACCEPTANCE',sourceSha:I.sourceSha,sourceTree:I.sourceTree,parentCertifiedSourceSha:I.parentCertifiedSourceSha,allowedProductFiles,buildId:I.buildId,previewUrl:I.previewUrl,hostedPayloadDigest:I.hostedPayloadDigest,bundleDigest:I.bundleDigest,runId:I.runId,artifactId:I.artifactId,artifactName:I.artifactName,artifactArchiveDigest:I.artifactArchiveDigest,readbackExact:true,readbackFileCount:I.readbackFileCount,productionMutationAuthorized:false,dataMutationAuthorized:false,augustDataTouched:false};
            C.i61SuccessorPreview={status:'TECHNICAL_PASS_AWAITING_AUTHENTICATED_HUMAN_ACCEPTANCE',rootCausesClosed:['DIRECT_PASSWORD_COPY_CONTROL_MISSING','I6_1_PREVIEW_HOST_NOT_ROUTED_TO_ISOLATED_CREDENTIAL_CALLABLE','LEGACY_CREDENTIAL_ENVELOPE_NORMALIZED_WITHOUT_DATA_MUTATION'],directPasswordCopyContract:true,combinedCredentialCopyPreserved:true,previewCredentialCallableRoutePass:true,sourceScopeFileCount:2,sourceSha:I.sourceSha,buildId:I.buildId,previewUrl:I.previewUrl,hostedPayloadDigest:I.hostedPayloadDigest,readbackExact:true,readbackFileCount:I.readbackFileCount,runId:I.runId,artifactId:I.artifactId,productionTouched:false,operationalWritesExecuted:0,augustDataTouched:false,nextRequiredProof:'AUTHENTICATED_PREVIEW_ACCEPTANCE_ON_EXACT_CAUSAL_SUCCESSOR'};
            C.nextAction='I6_1_AUTHENTICATED_HUMAN_PREVIEW_ACCEPTANCE';
            fs.writeFileSync(process.env.CONTROL,JSON.stringify(C,null,2)+'\n');
            const receipt={schemaVersion:'gravicentra-i6-1-successor-preview-technical-pass-v2',status:'TECHNICAL_PASS_AWAITING_AUTHENTICATED_HUMAN_ACCEPTANCE',product:'Gravicentra Insurance',gate:'I6.1',sourceSha:I.sourceSha,sourceTree:I.sourceTree,buildId:I.buildId,previewUrl:I.previewUrl,hostedPayloadDigest:I.hostedPayloadDigest,bundleDigest:I.bundleDigest,runId:I.runId,artifactId:I.artifactId,artifactName:I.artifactName,artifactArchiveDigest:I.artifactArchiveDigest,readbackExact:true,readbackFileCount:I.readbackFileCount,directPasswordCopyContract:true,combinedCredentialCopyPreserved:true,previewCredentialCallableRoutePass:true,legacyCredentialEnvelopeNormalization:true,productSourceFilesChanged:2,productionTouched:false,operationalWritesExecuted:0,augustDataTouched:false};
            fs.writeFileSync(process.env.TECH_RECEIPT,JSON.stringify(receipt,null,2)+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,[['SOURCE_SHA',I.sourceSha],['BUILD_ID',I.buildId],['PREVIEW_URL',I.previewUrl]].map(([k,v])=>k+'='+v).join('\n')+'\n');
            console.log('I61_CAUSAL_SUCCESSOR_BINDING=PASS');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          node "$GUARD" --mode=i6

      - name: Install isolated browser proof dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.4.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run authenticated role proof on exact causal Preview
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          I61_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/i61-authenticated-acceptance
        run: |
          set +e
          mkdir -p "$I61_AUTH_EVIDENCE_DIR"
          node tools/gravicentra-i6-1-aseguradoras-password-copy-ui.mjs
          TOOL_RC=$?
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const p=path.join(process.env.I61_AUTH_EVIDENCE_DIR,'i6-1-aseguradoras-password-copy-ui.json');
          const E=JSON.parse(fs.readFileSync(p,'utf8'));
          const summary={status:E.status,operationalWritesExecuted:E.operationalWritesExecuted,operationalWriteAttemptsObserved:E.operationalWriteAttemptsObserved,roles:Object.fromEntries(Object.entries(E.roles||{}).map(([k,v])=>[k,{pass:v.pass===true,error:v.error||null}]))};
          console.log(JSON.stringify(summary));
          const need=(x,c)=>{if(!x)throw new Error(c)};
          need(E.status==='PASS','I61_ACCEPT_BROWSER_PROOF_NOT_PASS');
          need(E.sourceSha===process.env.SOURCE_SHA&&E.buildId===process.env.BUILD_ID&&E.previewUrl===process.env.PREVIEW_URL,'I61_ACCEPT_RELEASE_BINDING_MISMATCH');
          for(const r of ['Dirección','SuperAdmin','AdminTenant','Operativo','Asesor']) need(E.roles?.[r]?.pass===true,'I61_ACCEPT_ROLE_FAIL:'+r);
          need(E.operationalWritesExecuted===0&&E.operationalWriteAttemptsObserved===0,'I61_ACCEPT_WRITES_DETECTED');
          need(E.roles?.Asesor?.evidence?.advisorRestricted===true,'I61_ACCEPT_ADVISOR_RESTRICTION_FAIL');
          for(const r of ['Dirección','SuperAdmin','AdminTenant','Operativo']){
            const x=E.roles?.[r]?.evidence||{};
            need(Number(x.passwordCopyResolvedCount)>0,'I61_ACCEPT_PASSWORD_COPY_NOT_PROVEN:'+r);
            need(Number(x.credentialCopyResolvedCount)>0,'I61_ACCEPT_CREDENTIAL_COPY_NOT_PROVEN:'+r);
            need(Number(x.revealResolvedCount)>0&&Number(x.rehiddenCount)>0,'I61_ACCEPT_REVEAL_REHIDE_NOT_PROVEN:'+r);
            need(x.bankCopyResolved===true,'I61_ACCEPT_BANK_COPY_REGRESSION:'+r);
          }
          console.log('I61_AUTHENTICATED_BROWSER_ACCEPTANCE=PASS');
          NODE
          VALID_RC=$?
          if [ "$TOOL_RC" -ne 0 ] || [ "$VALID_RC" -ne 0 ]; then exit 1; fi

      - name: Seal I6.1 Preview PASS and keep LIVE promotion closed
        env:
          I61_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/i61-authenticated-acceptance
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const evidencePath=path.join(process.env.I61_AUTH_EVIDENCE_DIR,'i6-1-aseguradoras-password-copy-ui.json');
          const E=JSON.parse(fs.readFileSync(evidencePath,'utf8'));
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const N=C.nextCandidate||{};
          const need=(x,c)=>{if(!x)throw new Error(c)};
          need(E.status==='PASS'&&E.operationalWritesExecuted===0&&E.operationalWriteAttemptsObserved===0,'I61_SEAL_EVIDENCE_INVALID');
          need(N.sourceSha===E.sourceSha&&N.buildId===E.buildId&&N.previewUrl===E.previewUrl,'I61_SEAL_BINDING_MISMATCH');
          const receipt={schemaVersion:'gravicentra-i6-1-preview-acceptance-v2',status:'I6_1_PRODUCT_SUCCESSOR_PREVIEW_PASS',product:'Gravicentra Insurance',gate:'I6.1',sourceSha:E.sourceSha,buildId:E.buildId,previewUrl:E.previewUrl,technicalRunId:N.runId,technicalArtifactId:N.artifactId,authenticatedAcceptanceRunId:Number(process.env.GITHUB_RUN_ID),rolesPass:['Dirección','SuperAdmin','AdminTenant','Operativo','Asesor'],directPasswordCopyPass:true,combinedCredentialCopyPass:true,revealRehidePass:true,bankCopyRegressionPass:true,advisorRestrictionPass:true,previewCredentialCallableRoutePass:true,operationalWritesExecuted:0,operationalWriteAttemptsObserved:0,productionTouched:false,dataTouched:false,augustDataTouched:false,livePromotionExecuted:false};
          fs.writeFileSync(process.env.EVIDENCE_FILE,JSON.stringify(receipt,null,2)+'\n');
          N.status='I6_1_PRODUCT_SUCCESSOR_PREVIEW_PASS';N.authenticatedAcceptanceRunId=Number(process.env.GITHUB_RUN_ID);N.authenticatedRolesPass=5;N.operationalWritesExecuted=0;C.nextCandidate=N;
          C.i61SuccessorPreview={...(C.i61SuccessorPreview||{}),status:'I6_1_PRODUCT_SUCCESSOR_PREVIEW_PASS',authenticatedBrowserAcceptance:true,authenticatedAcceptanceRunId:Number(process.env.GITHUB_RUN_ID),rolesPass:5,operationalWritesExecuted:0,productionTouched:false,dataTouched:false,augustDataTouched:false,nextRequiredProof:'EXPLICIT_PRODUCTION_PROMOTION_AUTHORIZATION_THEN_SAME_ARTIFACT_LIVE_PASS'};
          C.nextAction='AUTHORIZE_I6_1_SUCCESSOR_PRODUCTION_PROMOTION';
          fs.writeFileSync(process.env.CONTROL,JSON.stringify(C,null,2)+'\n');
          let g=fs.readFileSync(process.env.GUARD,'utf8');
          const oldNext="need(['I6_1_FUNCTIONAL_CLOSURE','I6_1_AUTHENTICATED_HUMAN_PREVIEW_ACCEPTANCE'].includes(C.nextAction)";
          const newNext="need(['I6_1_FUNCTIONAL_CLOSURE','I6_1_AUTHENTICATED_HUMAN_PREVIEW_ACCEPTANCE','AUTHORIZE_I6_1_SUCCESSOR_PRODUCTION_PROMOTION'].includes(C.nextAction)";
          if(g.includes(oldNext)) g=g.replace(oldNext,newNext);
          const oldStatus="need(successor.status==='PREVIEW_TECHNICAL_PASS_AWAITING_AUTHENTICATED_HUMAN_ACCEPTANCE','I6_1_SUCCESSOR_STATUS_INVALID');";
          const newStatus="need(['PREVIEW_TECHNICAL_PASS_AWAITING_AUTHENTICATED_HUMAN_ACCEPTANCE','I6_1_PRODUCT_SUCCESSOR_PREVIEW_PASS'].includes(successor.status),'I6_1_SUCCESSOR_STATUS_INVALID');";
          if(g.includes(oldStatus)) g=g.replace(oldStatus,newStatus);
          fs.writeFileSync(process.env.GUARD,g);
          NODE
          node --check "$GUARD"
          node "$GUARD" --mode=i6

      - name: Upload authenticated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-1-authenticated-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/i61-authenticated-acceptance
          if-no-files-found: warn
          retention-days: 30

      - name: Commit canonical Preview acceptance seal
        run: |
          set -euo pipefail
          git config user.name gravicentra-i6-1-bot
          git config user.email actions@users.noreply.github.com
          git add "$CONTROL" "$TECH_RECEIPT" "$EVIDENCE_FILE" "$GUARD"
          git diff --cached --quiet && { echo I61_ACCEPT_NO_CHANGES >&2; exit 1; }
          git commit -m "qa(i6.1): seal causal successor Preview PASS [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:recovery/fase-a-clean-20260831

      - name: Summary
        run: |
          {
            echo '## Gravicentra Insurance — I6.1 Preview acceptance'
            echo '- Causal successor bound: PASS'
            echo '- Authenticated roles: 5/5 PASS'
            echo '- Direct password copy: PASS'
            echo '- Combined credential copy: PASS'
            echo '- Reveal/rehide: PASS'
            echo '- Bank copy regression: PASS'
            echo '- Preview credential callable route: PASS'
            echo '- Operational writes: 0'
            echo '- Production touched: false'
            echo '- I6.1 Preview: PASS'
            echo '- LIVE promotion remains closed pending explicit authorization.'
          } >> "$GITHUB_STEP_SUMMARY"
