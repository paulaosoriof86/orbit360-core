# A&S G9 safety replacement on PR #153 (source only).
# Historical S5.12D mutating Hosting release is prohibited in this controlled source.
name: Siniestros S5.12D Public Resolver SOURCE ONLY

on:
  workflow_dispatch:
  push:
    branches:
      - ays/siniestros-s512d-public-resolver-lab-20261007
    paths:
      - 'functions/siniestros-public-resolver-s512d.js'
      - 'functions/siniestros-s512d-public-surface.test.js'
      - 'functions/bootstrap.js'
      - 'orbit360-platform/siniestros-asistencia-lab.html'
      - 'orbit360-platform/core/siniestros-s512d-public.js'
      - '.github/workflows/siniestros-s512d-public-resolver-lab.yml'

permissions:
  contents: read

jobs:
  public-resolver-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for synthetic tests only
        working-directory: functions
        run: npm ci
      - name: Test S5.12D contracts without Firebase writes
        shell: bash
        working-directory: functions
        run: |
          set -euo pipefail
          node --check siniestros-public-resolver-s512d.js
          node --check ../orbit360-platform/core/siniestros-s512d-public.js
          node --test siniestros-s512d-public-surface.test.js
          grep -q "require('./siniestros-public-resolver-s512d')" bootstrap.js
          grep -q "Primero seguridad" ../orbit360-platform/siniestros-asistencia-lab.html
          grep -q "Reportar no confirma cobertura" ../orbit360-platform/siniestros-asistencia-lab.html
      - name: Explicit no-release receipt
        shell: bash
        run: |
          set -euo pipefail
          echo 'G9_SINIESTROS_SOURCE_ONLY_PASS NO_FIREBASE_DEPLOY NO_HOSTING_MUTATION'
# Firebase LAB writes: DENIED. Owner must separately authorize the unified publisher.
