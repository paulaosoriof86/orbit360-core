name: Orbit360 sourcecheck v21 event-driven render observability

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-build-v21-event-driven-matrix-artifact-v20260807.mjs'
      - 'tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs'
      - 'tools/orbit360-test-v21-event-driven-render-source-v20260807.mjs'
      - 'tools/orbit360-test-v21-runtime-package-source-v20260807.mjs'
      - 'tools/orbit360-test-capture-watchdog-source-v20260806.mjs'
      - '.github/workflows/orbit360-sourcecheck-v21-event-driven-render-v20260807.yml'
      - '.github/workflows/orbit360-registered-relay-v21-event-driven-render-v20260807.yml'

permissions:
  contents: read

concurrency:
  group: orbit360-sourcecheck-v21-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  source-v21-event-driven-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve v21 historical or v22 successor mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const v21Frozen = r.requestVersion === '20260807.21-two-phase-runtime' && r.consumed === true && r.authorizationFrozen === true && r.allowedExecutions === 0 && r.replayAllowed === false;
          const v22Owner = fs.existsSync('tools/orbit360-build-v22-block1-matrix-artifact-v20260807.mjs');
          if (v21Frozen && v22Owner) {
            console.log('successor=true');
            console.error('PASS_V21_RETIRED_BY_FROZEN_REQUEST_AND_V22_OWNER');
          } else {
            console.log('successor=false');
          }
          NODE

      - name: Validate safe v22 succession
        if: steps.mode.outputs.successor == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-build-v21-event-driven-matrix-artifact-v20260807.mjs
          node --check tools/orbit360-build-v22-block1-matrix-artifact-v20260807.mjs
          node - <<'NODE'
          const fs=require('fs');
          const w=fs.readFileSync('tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs','utf8');
          if (!w.includes('buildV22MatrixArtifact') || !w.includes('void buildV21MatrixArtifact')) process.exit(41);
          console.log('PASS_V21_HISTORICAL_OWNER_RETAINED_NONBLOCKING');
          NODE

      - name: Verify historical v21 authorization boundary
        if: steps.mode.outputs.successor != 'true'
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE='68667075e00654a4df216f0ce6e7417f041fe837'
          git merge-base --is-ancestor "$AUTH_BASE" "${{ github.event.pull_request.head.sha }}"
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          if (!(r.requestVersion === '20260807.20-two-phase-runtime' && r.consumed === true && r.authorizationFrozen === true && r.allowedExecutions === 0 && r.replayAllowed === false)) process.exit(41);
          console.log('PASS_V20_REQUEST_FROZEN_BEFORE_V21_SOURCE');
          NODE

      - name: Historical v21 exact artifact gate
        if: steps.mode.outputs.successor != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-build-v21-event-driven-matrix-artifact-v20260807.mjs
          node --experimental-vm-modules tools/orbit360-test-v21-event-driven-render-source-v20260807.mjs

      - name: Assert source-only boundary
        shell: bash
        run: echo 'PASS_V21_SOURCE_GATE_SUCCESSION_SAFE_NO_SECRETS_FIREBASE_HOSTING_BROWSER_WRITES'
