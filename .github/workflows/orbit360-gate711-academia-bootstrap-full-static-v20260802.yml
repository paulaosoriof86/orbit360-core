name: Orbit 360 · Gate 7.11 · Academia bootstrap full static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-academia-bootstrap-full-static-v20260802.json'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    name: Gate 7.11 · bootstrap owner + readiness + router · cero runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar bootstrap, sello y router canónico
        run: |
          set -euo pipefail
          REQ=.github/orbit360-static-requests/gate711-academia-bootstrap-full-static-v20260802.json
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQ")"
          node --check tools/orbit360-probar-bootstrap-owner-academia-static-v20260802.mjs
          node --check tools/orbit360-validar-rootfix-static-readiness-gate711-v20260802.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs
          node tools/orbit360-probar-bootstrap-owner-academia-static-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_ACADEMIA_BOOTSTRAP_OWNER_STATIC_PASS" and .total==8 and .passed==8 and .failed==0' orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-owner-static-v20260802.json >/dev/null
          ORBIT360_GATE711_LIFECYCLE_FILE=tools/orbit360-validator-lifecycle-contract-gate711-academia-bootstrap-corrective-static-v20260802.json node tools/orbit360-validar-rootfix-static-readiness-gate711-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_ROOTFIX_STATIC_READINESS_PASS" and .total==14 and .passed==14 and .failed==0 and .manifest.contentDigest=="3d25a83218a4373513e1fff24ea9b12817d4c47be0fad08777e7f94867b3f676" and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .firestoreWrites==0 and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/gate711-rootfix-static-readiness-v20260802.json >/dev/null

          cp tools/orbit360-gate711-canonical-lifecycle-template-v20260802.json tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-v20260801.json
          cp .github/orbit360-templates/gate711-canonical-runtime-request-template-v20260802.json .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json
          tmp_lifecycle=$(mktemp); tmp_request=$(mktemp)
          jq '.status="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_AUTHORIZED" | .authorization.authorizedBy="STATIC_ROUTER_PROBE" | .authorization.authorizationRef="gate711_bootstrap_full_static_probe" | .authorization.explicit=true | .authorization.allowedExecutions=1 | .authorization.consumed=false' tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-v20260801.json > "$tmp_lifecycle"
          mv "$tmp_lifecycle" tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-v20260801.json
          jq '.authorizationRef="gate711_bootstrap_full_static_probe" | .approved=true | .allowedExecutions=1 | .consumed=false | .parentHead="STATIC_ROUTER_PROBE"' .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json > "$tmp_request"
          mv "$tmp_request" .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block7-canonical-runtime-cumulative-visual-lab-v20260801
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_READY" and .failed==0 and .checks[]|select(.id=="ACADEMIA_OWNER_CONNECTED")|.ok==true' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
          jq -n '{schemaVersion:"orbit360-gate711-academia-bootstrap-full-static-v1",gateId:"block7-canonical-runtime-cumulative-visual-lab-v20260801",status:"GATE711_ACADEMIA_BOOTSTRAP_FULL_STATIC_PASS",classification:"GO_STATIC_ACADEMIA_BOOTSTRAP_AND_CANONICAL_ROUTER",bootstrapOwnerChecks:"8/8",rootFixReadinessChecks:"14/14",canonicalRouter:"PASS",manifestDigest:"3d25a83218a4373513e1fff24ea9b12817d4c47be0fad08777e7f94867b3f676",secretAccess:false,firestoreRead:false,firestoreWrites:0,operationalWrites:0,runtimeExecuted:false,browserExecuted:false,reimportExecuted:false,deployExecuted:false,production:false,containsPII:false,containsValues:false,containsSecrets:false,ok:true}' > orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-full-static-v20260802.json
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-academia-bootstrap-full-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-owner-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-rootfix-static-readiness-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-full-static-v20260802.json
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let state='failure',description='Gate 7.11 Academia bootstrap static FAIL';
            try{const p=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-full-static-v20260802.json','utf8'));if(p.ok===true){state='success';description='Academia bootstrap 8/8; readiness 14/14; router PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-academia-bootstrap-full-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
