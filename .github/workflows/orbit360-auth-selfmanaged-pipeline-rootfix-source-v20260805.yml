name: Orbit 360 · Auth pipeline rootfix source-only

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'tools/orbit360-validar-gate-contracts-engine-auth-selfmanaged-credentials-runtime-v20260805.mjs'
      - 'tools/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs'
      - 'tools/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs'
      - 'tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs'
      - '.github/workflows/orbit360-auth-selfmanaged-credentials-runtime-v20260805.yml'
      - '.github/workflows/orbit360-auth-selfmanaged-pipeline-rootfix-source-v20260805.yml'

permissions:
  contents: write

concurrency:
  group: orbit360-auth-selfmanaged-pipeline-rootfix-source-v20260805
  cancel-in-progress: false

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validar sintaxis source-only
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-engine-auth-selfmanaged-credentials-runtime-v20260805.mjs
          node --check tools/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs
          node --check tools/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs
          node --check tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs

      - name: Probar invariantes del rootfix sin secretos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          node tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs | tee orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-pipeline-rootfix-source-sanitized-v20260805.json
          jq -e '.ok==true and .status=="PASS_AUTH_PIPELINE_ROOTFIX_SOURCE_ONLY" and .failed==0 and .secretsRead==false and .firebaseExecuted==false and .firestoreWrites==0 and .authWrites==0 and .deploys==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-pipeline-rootfix-source-sanitized-v20260805.json >/dev/null

      - name: Persistir evidencia sanitizada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-pipeline-rootfix-source-sanitized-v20260805.json
          if ! git diff --cached --quiet; then
            git commit -m 'auth: persist pipeline rootfix source-only evidence [skip ci]'
            git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
          fi
