name: Orbit 360 · Bootstrap Auth pipeline rootfix source-only

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['.github/workflows/orbit360-auth-selfmanaged-pipeline-rootfix-source-v20260805.yml']

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Instalar y verificar rootfix source-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-auth-rootfix"
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/orbit-auth-rootfix/bundle.tgz"
          tar -xzf "$RUNNER_TEMP/orbit-auth-rootfix/bundle.tgz" -C "$RUNNER_TEMP/orbit-auth-rootfix"
          cp "$RUNNER_TEMP/orbit-auth-rootfix/orbit360-validar-gate-contracts-engine-auth-selfmanaged-credentials-runtime-v20260805.mjs" tools/
          cp "$RUNNER_TEMP/orbit-auth-rootfix/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs" tools/
          cp "$RUNNER_TEMP/orbit-auth-rootfix/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs" tools/
          cp "$RUNNER_TEMP/orbit-auth-rootfix/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs" tools/
          cp "$RUNNER_TEMP/orbit-auth-rootfix/orbit360-auth-selfmanaged-credentials-runtime-v20260805.yml" .github/workflows/
          cp "$RUNNER_TEMP/orbit-auth-rootfix/orbit360-auth-selfmanaged-pipeline-rootfix-source-v20260805.yml" .github/workflows/
          chmod +x tools/orbit360-validar-gate-contracts-engine-auth-selfmanaged-credentials-runtime-v20260805.mjs tools/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs tools/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-auth-selfmanaged-credentials-runtime-v20260805.mjs
          node --check tools/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs
          node --check tools/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs
          node --check tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          node tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs | tee orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-pipeline-rootfix-source-sanitized-v20260805.json
          jq -e '.ok==true and .status=="PASS_AUTH_PIPELINE_ROOTFIX_SOURCE_ONLY" and .failed==0 and .secretsRead==false and .firebaseExecuted==false and .firestoreWrites==0 and .authWrites==0 and .deploys==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-pipeline-rootfix-source-sanitized-v20260805.json >/dev/null
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add tools/orbit360-validar-gate-contracts-engine-auth-selfmanaged-credentials-runtime-v20260805.mjs tools/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs tools/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs tools/orbit360-test-auth-selfmanaged-pipeline-rootfix-source-v20260805.mjs .github/workflows/orbit360-auth-selfmanaged-credentials-runtime-v20260805.yml .github/workflows/orbit360-auth-selfmanaged-pipeline-rootfix-source-v20260805.yml orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-pipeline-rootfix-source-sanitized-v20260805.json
          git diff --cached --check
          git commit -m 'auth: fix source pipeline trace and stale evidence [skip ci]'
          git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
