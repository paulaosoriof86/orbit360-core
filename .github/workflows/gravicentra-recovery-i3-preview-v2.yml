name: Gravicentra Recovery I3 Immutable Preview v2

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-recovery-i3-preview-v2.yml
      - tools/gravicentra-i3-preview-v2-package.mjs

permissions:
  contents: read

concurrency:
  group: gravicentra-recovery-i3-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 96f6962b8519a032c2f54b50d2796fa2545de1e4
  PROJECT_ID: ays-orbit-360-lab
  HOSTING_SITE: ays-orbit-360-lab
  TENANT_HINT: alianzas-soluciones
  PREVIEW_FUNCTION: orbit360ProductInsurerCredentialCommandPreview
  PREVIEW_REGION: us-east1
  PROD_FUNCTION: orbit360ProductInsurerCredentialCommand
  PROD_REGION: us-central1

jobs:
  immutable-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Recovery control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed against single release authority
        working-directory: control
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-release-lineage-guard.mjs --mode=candidate
      - name: Checkout fixed Recovery product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - id: auth
        name: Prove credential access to existing Firebase
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i3-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          candidates=[('FIREBASE_SERVICE_ACCOUNT',os.environ.get('SA_DEFAULT','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB',os.environ.get('SA_ORBIT360_LAB','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB',os.environ.get('SA_ORBIT_360_LAB',''))]
          rows=[]
          for i,(name,raw) in enumerate(candidates):
              if not raw.strip(): continue
              try: data=json.loads(raw)
              except Exception: continue
              if data.get('type')!='service_account' or not data.get('client_email') or not data.get('private_key'): continue
              p=Path(os.environ['ROOT'])/f'{i}.json'; p.write_text(json.dumps(data)); p.chmod(0o600); rows.append((name,str(p),str(data.get('project_id',''))))
          if not rows: raise SystemExit('NO_EXISTING_WELL_FORMED_SERVICE_ACCOUNT')
          (Path(os.environ['ROOT'])/'index.tsv').write_text('\n'.join('\t'.join(x) for x in rows)+'\n')
          PY
          SELECTED_NAME=''; SELECTED_FILE=''; SELECTED_OWNER=''
          while IFS=$'\t' read -r NAME FILE OWNER; do
            set +e
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; A=$?
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; B=$?
            set -e
            if [ "$A" -eq 0 ] && [ "$B" -eq 0 ]; then SELECTED_NAME="$NAME"; SELECTED_FILE="$FILE"; SELECTED_OWNER="$OWNER"; break; fi
          done < "$ROOT/index.tsv"
          test -n "$SELECTED_FILE" || { echo EXISTING_FIREBASE_ACCESS_NOT_PROVEN >&2; exit 42; }
          cp "$SELECTED_FILE" "$RUNNER_TEMP/gravicentra-i3-firebase-sa.json"; chmod 600 "$RUNNER_TEMP/gravicentra-i3-firebase-sa.json"
          echo "credential_source=$SELECTED_NAME" >> "$GITHUB_OUTPUT"
          echo "credential_file=$RUNNER_TEMP/gravicentra-i3-firebase-sa.json" >> "$GITHUB_OUTPUT"
          echo "credential_owner_project=$SELECTED_OWNER" >> "$GITHUB_OUTPUT"
      - id: build
        name: Materialize immutable frontend and backend source package
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          npx --yes firebase-tools@14.10.1 apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps.json"
          export APPS="$RUNNER_TEMP/apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path(os.environ['APPS']).read_text()); a=d.get('result') if isinstance(d,dict) else None
          if not isinstance(a,list): raise SystemExit('FIREBASE_WEB_APP_LIST_INVALID')
          web=[x for x in a if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1: raise SystemExit('FIREBASE_WEB_APP_CARDINALITY_NOT_ONE:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          npx --yes firebase-tools@14.10.1 apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config.json"
          node control/tools/gravicentra-i3-preview-v2-package.mjs source "$RUNNER_TEMP/gravicentra-i3-release-package" "$RUNNER_TEMP/public-config.json" > "$RUNNER_TEMP/package-output.json"
          export OUT="$RUNNER_TEMP/package-output.json"
          python3 - <<'PY'
          import json,os
          d=json.loads(open(os.environ['OUT']).read())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in d.items():
                  key=''.join(('_'+c.lower() if c.isupper() else c) for c in k).lstrip('_'); f.write(f'{key}={v}\n')
          PY
      - id: backend
        name: Deploy isolated Preview callable only; canonical production callable remains absent
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.10.1 functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/functions-before.json"
          export FJSON="$RUNNER_TEMP/functions-before.json" TARGET="$PROD_FUNCTION" REGION="$PROD_REGION"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['FJSON'])); target=os.environ['TARGET']; region=os.environ['REGION']; hits=[]
          def walk(v):
              if isinstance(v,dict):
                  s=json.dumps(v,sort_keys=True)
                  if target in s: hits.append(s)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d)
          if any(region in x for x in hits): raise SystemExit('PRODUCTION_CALLABLE_ALREADY_PRESENT_BEFORE_I5')
          PY
          cd "$RUNNER_TEMP/gravicentra-i3-release-package/bundle"
          echo 'preview_backend_attempted=true' >> "$GITHUB_OUTPUT"
          npx --yes firebase-tools@14.10.1 deploy --config firebase.backend.json --only "functions:$PREVIEW_FUNCTION" --project "$PROJECT_ID" --non-interactive --json 2>&1 | tee "$RUNNER_TEMP/backend-deploy.json"
          npx --yes firebase-tools@14.10.1 functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/functions-after.json"
          export FJSON="$RUNNER_TEMP/functions-after.json" PREVIEW="$PREVIEW_FUNCTION" PREGION="$PREVIEW_REGION" PROD="$PROD_FUNCTION" PRODREGION="$PROD_REGION"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['FJSON'])); s=json.dumps(d,sort_keys=True)
          if os.environ['PREVIEW'] not in s or os.environ['PREGION'] not in s: raise SystemExit('PREVIEW_CALLABLE_NOT_LISTED_AFTER_DEPLOY')
          if os.environ['PROD'] in s and os.environ['PRODREGION'] in s: raise SystemExit('PRODUCTION_CALLABLE_TOUCHED_BEFORE_I5')
          PY
          echo 'preview_backend_deployed=true' >> "$GITHUB_OUTPUT"
      - id: deploy
        name: Deploy exact frontend bundle to Firebase Hosting Preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gravicentra-i3-release-package/bundle"; CHANNEL_ID="gi-i3-${GITHUB_RUN_ID}"
          npx --yes firebase-tools@14.10.1 hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/hosting-deploy.json"
          export DEPLOY="$RUNNER_TEMP/hosting-deploy.json"
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['DEPLOY']).read(); urls=re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw); prod='https://'+os.environ['HOSTING_SITE']+'.web.app'; urls=[u.rstrip('/') for u in urls if u.rstrip('/')!=prod]
          if not urls: raise SystemExit('PREVIEW_URL_NOT_FOUND')
          print(urls[-1])
          PY
          )
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"; echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
      - id: readback
        name: Read back every hosted byte from same Preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/gravicentra-i3-release-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]; base=os.environ['PREVIEW_URL'].rstrip('/'); bad=[]
          for expected,rel in rows:
              req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?readback='+os.environ['EXPECTED_DIGEST'][:16],headers={'Accept-Encoding':'identity','Cache-Control':'no-cache','User-Agent':'Gravicentra-I3-v2'})
              with urllib.request.urlopen(req,timeout=30) as r: body=r.read()
              actual=hashlib.sha256(body).hexdigest()
              if actual!=expected: bad.append((rel,expected,actual))
          if bad: raise SystemExit('PREVIEW_BYTE_READBACK_MISMATCH:'+json.dumps(bad[:5]))
          with urllib.request.urlopen(urllib.request.Request(base+'/__recovery__/build.json?marker=1',headers={'Cache-Control':'no-cache'}),timeout=30) as r: marker=json.loads(r.read())
          if marker.get('sourceSha')!=os.environ['SOURCE_SHA'] or marker.get('buildId')!=os.environ['EXPECTED_BUILD_ID']: raise SystemExit('PREVIEW_BUILD_MARKER_MISMATCH')
          print('PREVIEW_READBACK_EXACT_PASS='+str(len(rows))); open(os.environ['GITHUB_OUTPUT'],'a').write('readback_exact=true\n')
          PY
      - name: Seal I3 evidence
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          CHANNEL_ID: ${{ steps.deploy.outputs.channel_id }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          HOSTED_FILE_COUNT: ${{ steps.build.outputs.hosted_file_count }}
          HOSTED_PAYLOAD_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
          BACKEND_FILE_COUNT: ${{ steps.build.outputs.backend_file_count }}
          BACKEND_SOURCE_DIGEST: ${{ steps.build.outputs.backend_source_digest }}
          BUNDLE_FILE_COUNT: ${{ steps.build.outputs.bundle_file_count }}
          BUNDLE_DIGEST: ${{ steps.build.outputs.bundle_digest }}
          CREDENTIAL_SOURCE: ${{ steps.auth.outputs.credential_source }}
          CREDENTIAL_OWNER_PROJECT: ${{ steps.auth.outputs.credential_owner_project }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/gravicentra-i3-release-package/evidence/i3-evidence.json"
          python3 - <<'PY'
          import json,os
          e={'schemaVersion':'gravicentra-recovery-i3-evidence-v2','status':'ARTIFACT_AND_PREVIEW_BACKEND_READBACK_EXACT_PASS','product':'Gravicentra Insurance','gate':'I3','sourceSha':os.environ['SOURCE_SHA'],'runnerCommit':os.environ['GITHUB_SHA'],'githubRunId':os.environ['GITHUB_RUN_ID'],'buildId':os.environ['BUILD_ID'],'firebaseProjectId':os.environ['PROJECT_ID'],'hostingSiteId':os.environ['HOSTING_SITE'],'hostedFileCount':int(os.environ['HOSTED_FILE_COUNT']),'hostedPayloadDigest':os.environ['HOSTED_PAYLOAD_DIGEST'],'backendFileCount':int(os.environ['BACKEND_FILE_COUNT']),'backendSourceDigest':os.environ['BACKEND_SOURCE_DIGEST'],'bundleFileCount':int(os.environ['BUNDLE_FILE_COUNT']),'bundleDigest':os.environ['BUNDLE_DIGEST'],'previewChannelId':os.environ['CHANNEL_ID'],'previewUrl':os.environ['PREVIEW_URL'],'previewBackendCallable':os.environ['PREVIEW_FUNCTION'],'previewBackendRegion':os.environ['PREVIEW_REGION'],'previewBackendAudit':'cloudlog','previewBackendOperationalWrites':False,'previewBackendImportEnabled':False,'productionBackendCallable':os.environ['PROD_FUNCTION'],'productionBackendRegion':os.environ['PROD_REGION'],'productionBackendTouched':False,'credentialSourceName':os.environ['CREDENTIAL_SOURCE'],'credentialOwnerProjectId':os.environ['CREDENTIAL_OWNER_PROJECT'],'sameFrontendArtifactPreviewToProductionRequired':True,'sameBackendSourcePackagePreviewToProductionRequired':True,'sourceMutatedAfterBuild':False,'productionTouched':False,'dataTouched':False,'writesExecuted':0,'readbackExact':True}
          open(os.environ['EVIDENCE'],'w').write(json.dumps(e,sort_keys=True)+'\n')
          PY
      - name: Roll back isolated Preview callable if I3 fails after backend deployment
        if: ${{ failure() && steps.backend.outputs.preview_backend_attempted == 'true' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.10.1 functions:delete "$PREVIEW_FUNCTION" --region "$PREVIEW_REGION" --project "$PROJECT_ID" --force --non-interactive || true
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: gravicentra-i3-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i3-release-package
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          echo '## Gravicentra Insurance — I3 immutable Preview v2' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: \`${{ steps.build.outputs.build_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview backend: \`$PREVIEW_FUNCTION@$PREVIEW_REGION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: ${{ steps.deploy.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Production canonical backend touched: false' >> "$GITHUB_STEP_SUMMARY"
          echo '- Operational data writes: 0' >> "$GITHUB_STEP_SUMMARY"
