name: Gravicentra Recovery I3 Immutable Preview v3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravicentra-recovery-i3-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ays-orbit-360-lab
  HOSTING_SITE: ays-orbit-360-lab
  TENANT_HINT: alianzas-soluciones

jobs:
  immutable-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Recovery control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 50
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: release
        name: Fail closed against canonical control plane
        working-directory: control
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-control-plane-guard-v2.mjs --mode=i3

      - name: Checkout fixed Recovery product source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Locked backend dependency preflight before Firebase access
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ steps.release.outputs.source_sha }}"
          ROOT="$RUNNER_TEMP/gravicentra-i3-backend-preflight"
          rm -rf "$ROOT"
          cp -R source/functions "$ROOT"
          cd "$ROOT"
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const root=lock.packages&&lock.packages[''];
          if(!root) throw new Error('BACKEND_LOCK_ROOT_MISSING');
          if(pkg.name!==root.name) throw new Error('BACKEND_PACKAGE_NAME_LOCK_DRIFT');
          if(String(pkg.engines&&pkg.engines.node)!==String(root.engines&&root.engines.node)) throw new Error('BACKEND_NODE_ENGINE_LOCK_DRIFT');
          for(const [name,spec] of Object.entries(pkg.dependencies||{})){
            if(!root.dependencies||root.dependencies[name]!==spec) throw new Error('BACKEND_DEPENDENCY_LOCK_DRIFT:'+name);
          }
          if(pkg.version!==root.version) console.warn('BACKEND_PACKAGE_VERSION_METADATA_DRIFT:'+pkg.version+':'+root.version);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const {createRequire}=require('node:module');
          const path=require('node:path');
          const req=createRequire(path.join(process.cwd(),'package.json'));
          for(const id of ['firebase-admin/app','firebase-functions/v2/https','@google-cloud/secret-manager']) req.resolve(id);
          console.log('BACKEND_LOCKED_DEPENDENCY_RESOLUTION=PASS');
          NODE
          npm run check

      - id: auth
        name: Prove credential access to existing Firebase Hosting
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i3-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          candidates=[('FIREBASE_SERVICE_ACCOUNT',os.environ.get('SA_DEFAULT','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB',os.environ.get('SA_ORBIT360_LAB','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB',os.environ.get('SA_ORBIT_360_LAB',''))]
          rows=[]
          for i,(name,raw) in enumerate(candidates):
              if not raw.strip(): continue
              try: data=json.loads(raw)
              except Exception: continue
              if data.get('type')!='service_account' or not data.get('client_email') or not data.get('private_key'): continue
              p=Path(os.environ['ROOT'])/f'{i}.json'; p.write_text(json.dumps(data)); p.chmod(0o600); rows.append((name,str(p),str(data.get('project_id',''))))
          if not rows: raise SystemExit('NO_EXISTING_WELL_FORMED_SERVICE_ACCOUNT')
          (Path(os.environ['ROOT'])/'index.tsv').write_text('\n'.join('\t'.join(x) for x in rows)+'\n')
          PY
          SELECTED_NAME=''; SELECTED_FILE=''; SELECTED_OWNER=''
          while IFS=$'\t' read -r NAME FILE OWNER; do
            set +e
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; A=$?
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; B=$?
            set -e
            if [ "$A" -eq 0 ] && [ "$B" -eq 0 ]; then SELECTED_NAME="$NAME"; SELECTED_FILE="$FILE"; SELECTED_OWNER="$OWNER"; break; fi
          done < "$ROOT/index.tsv"
          test -n "$SELECTED_FILE" || { echo EXISTING_FIREBASE_HOSTING_ACCESS_NOT_PROVEN >&2; exit 42; }
          cp "$SELECTED_FILE" "$RUNNER_TEMP/gravicentra-i3-firebase-sa.json"; chmod 600 "$RUNNER_TEMP/gravicentra-i3-firebase-sa.json"
          echo "credential_source=$SELECTED_NAME" >> "$GITHUB_OUTPUT"
          echo "credential_file=$RUNNER_TEMP/gravicentra-i3-firebase-sa.json" >> "$GITHUB_OUTPUT"
          echo "credential_owner_project=$SELECTED_OWNER" >> "$GITHUB_OUTPUT"

      - id: build
        name: Materialize immutable frontend and backend source package
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          npx --yes firebase-tools@14.10.1 apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps.json"
          export APPS="$RUNNER_TEMP/apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path(os.environ['APPS']).read_text()); a=d.get('result') if isinstance(d,dict) else None
          if not isinstance(a,list): raise SystemExit('FIREBASE_WEB_APP_LIST_INVALID')
          web=[x for x in a if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1: raise SystemExit('FIREBASE_WEB_APP_CARDINALITY_NOT_ONE:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          npx --yes firebase-tools@14.10.1 apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config.json"
          node control/tools/gravicentra-i3-preview-v2-package.mjs source "$RUNNER_TEMP/gravicentra-i3-release-package" "$RUNNER_TEMP/public-config.json" > "$RUNNER_TEMP/package-output.json"
          export OUT="$RUNNER_TEMP/package-output.json"
          python3 - <<'PY'
          import json,os
          d=json.loads(open(os.environ['OUT']).read())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in d.items():
                  key=''.join(('_'+c.lower() if c.isupper() else c) for c in k).lstrip('_'); f.write(f'{key}={v}\n')
          PY

      - id: deploy
        name: Deploy exact frontend bundle to isolated Firebase Hosting Preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gravicentra-i3-release-package/bundle"
          CHANNEL_ID="gi-i3-${GITHUB_RUN_ID}"
          npx --yes firebase-tools@14.10.1 hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/hosting-deploy.json"
          export DEPLOY="$RUNNER_TEMP/hosting-deploy.json"
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['DEPLOY']).read(); urls=re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw); prod='https://'+os.environ['HOSTING_SITE']+'.web.app'; urls=[u.rstrip('/') for u in urls if u.rstrip('/')!=prod]
          if not urls: raise SystemExit('PREVIEW_URL_NOT_FOUND')
          print(urls[-1])
          PY
          )
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - id: readback
        name: Read back every hosted byte from same Preview
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/gravicentra-i3-release-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]; base=os.environ['PREVIEW_URL'].rstrip('/'); bad=[]
          for expected,rel in rows:
              req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?readback='+os.environ['EXPECTED_DIGEST'][:16],headers={'Accept-Encoding':'identity','Cache-Control':'no-cache','User-Agent':'Gravicentra-I3-v3'})
              with urllib.request.urlopen(req,timeout=30) as r: body=r.read()
              actual=hashlib.sha256(body).hexdigest()
              if actual!=expected: bad.append((rel,expected,actual))
          if bad: raise SystemExit('PREVIEW_BYTE_READBACK_MISMATCH:'+json.dumps(bad[:5]))
          with urllib.request.urlopen(urllib.request.Request(base+'/__recovery__/build.json?marker=1',headers={'Cache-Control':'no-cache'}),timeout=30) as r: marker=json.loads(r.read())
          if marker.get('sourceSha')!=os.environ['SOURCE_SHA'] or marker.get('buildId')!=os.environ['EXPECTED_BUILD_ID']: raise SystemExit('PREVIEW_BUILD_MARKER_MISMATCH')
          print('PREVIEW_READBACK_EXACT_PASS='+str(len(rows))); open(os.environ['GITHUB_OUTPUT'],'a').write('readback_exact=true\n')
          PY

      - name: Seal I3 evidence
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          CHANNEL_ID: ${{ steps.deploy.outputs.channel_id }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          HOSTED_FILE_COUNT: ${{ steps.build.outputs.hosted_file_count }}
          HOSTED_PAYLOAD_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
          BACKEND_FILE_COUNT: ${{ steps.build.outputs.backend_file_count }}
          BACKEND_SOURCE_DIGEST: ${{ steps.build.outputs.backend_source_digest }}
          BUNDLE_FILE_COUNT: ${{ steps.build.outputs.bundle_file_count }}
          BUNDLE_DIGEST: ${{ steps.build.outputs.bundle_digest }}
          CREDENTIAL_SOURCE: ${{ steps.auth.outputs.credential_source }}
          CREDENTIAL_OWNER_PROJECT: ${{ steps.auth.outputs.credential_owner_project }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/gravicentra-i3-release-package/evidence/i3-evidence.json"
          python3 - <<'PY'
          import json,os
          e={'schemaVersion':'gravicentra-recovery-i3-evidence-v3','status':'ARTIFACT_READBACK_EXACT_PASS_BACKEND_SOURCE_PACKAGED','product':'Gravicentra Insurance','gate':'I3','sourceSha':os.environ['SOURCE_SHA'],'runnerCommit':os.environ['GITHUB_SHA'],'githubRunId':os.environ['GITHUB_RUN_ID'],'buildId':os.environ['BUILD_ID'],'firebaseProjectId':os.environ['PROJECT_ID'],'hostingSiteId':os.environ['HOSTING_SITE'],'hostedFileCount':int(os.environ['HOSTED_FILE_COUNT']),'hostedPayloadDigest':os.environ['HOSTED_PAYLOAD_DIGEST'],'backendFileCount':int(os.environ['BACKEND_FILE_COUNT']),'backendSourceDigest':os.environ['BACKEND_SOURCE_DIGEST'],'bundleFileCount':int(os.environ['BUNDLE_FILE_COUNT']),'bundleDigest':os.environ['BUNDLE_DIGEST'],'previewChannelId':os.environ['CHANNEL_ID'],'previewUrl':os.environ['PREVIEW_URL'],'backendDeploymentPerformedAtI3':False,'sharedBackendMutationPerformedAtI3':False,'aseguradorasCredentialRuntimeAtPreview':'OPEN_STRUCTURAL_BOUNDARY_NOT_CERTIFIED_BY_I3','credentialSourceName':os.environ['CREDENTIAL_SOURCE'],'credentialOwnerProjectId':os.environ['CREDENTIAL_OWNER_PROJECT'],'sameFrontendArtifactPreviewToProductionRequired':True,'sameBackendSourcePackageRequiredForI5':True,'sourceMutatedAfterBuild':False,'productionTouched':False,'dataTouched':False,'writesExecuted':0,'readbackExact':True}
          open(os.environ['EVIDENCE'],'w').write(json.dumps(e,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: gravicentra-i3-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i3-release-package
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo '## Gravicentra Insurance — I3 immutable Hosting Preview'
            echo "- Source from CONTROL_PLANE: \`${{ steps.release.outputs.source_sha }}\`"
            echo "- Build: \`${{ steps.build.outputs.build_id }}\`"
            echo "- Preview: ${{ steps.deploy.outputs.preview_url }}"
            echo "- Hosted digest: \`${{ steps.build.outputs.hosted_payload_digest }}\`"
            echo "- Backend source digest: \`${{ steps.build.outputs.backend_source_digest }}\`"
            echo '- Functions deployed in I3: false'
            echo '- Shared backend mutation: false'
            echo '- Production touched: false'
            echo '- Data touched: false'
            echo '- Writes executed: 0'
          } >> "$GITHUB_STEP_SUMMARY"
