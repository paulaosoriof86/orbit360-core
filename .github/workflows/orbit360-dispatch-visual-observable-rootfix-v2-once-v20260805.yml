name: Orbit 360 · Transporte PR aislado · visual v2

on:
  pull_request:
    types: [opened]
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-dispatch-visual-observable-rootfix-v2-once-v20260805.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-visual-v2-pr-transport-once
  cancel-in-progress: false

jobs:
  visual-v2:
    if: >-
      github.event.pull_request.head.ref == 'ays/dispatch-visual-v2-pr-20260805' &&
      github.event.pull_request.base.ref == 'ays/backend-tenant-lab-v99-20260703'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout transporte exclusivo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight y normalización antes de secretos
        id: preflight
        continue-on-error: true
        env:
          ORBIT360_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ORBIT360_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ORBIT360_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          chmod +x tools/orbit360-pr-transport-visual-v2-preflight-normalize-v20260805.sh
          tools/orbit360-pr-transport-visual-v2-preflight-normalize-v20260805.sh

      - name: Runtime solo con GO_GATE_CONTRACT
        id: runtime
        if: >-
          steps.preflight.outcome == 'success' &&
          steps.preflight.outputs.normalized == 'true' &&
          steps.preflight.outputs.go == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          chmod +x tools/orbit360-run-visual-observable-rootfix-v2-runtime-only-v20260805.sh
          GITHUB_REF_NAME='ays/backend-tenant-lab-v99-20260703' \
            tools/orbit360-run-visual-observable-rootfix-v2-runtime-only-v20260805.sh

      - name: Exigir cierre gobernante
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREFLIGHT_GO: ${{ steps.preflight.outputs.go }}
          NORMALIZED: ${{ steps.preflight.outputs.normalized }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL='orbit360-platform/runtime-gate-crm-v20260716/visual-observable-rootfix-v2-final-sanitized-v20260805.json'
          test "$NORMALIZED" = 'true'
          test -f "$FINAL"
          if [[ "$PREFLIGHT_OUTCOME" != 'success' || "$PREFLIGHT_GO" != 'true' ]]; then
            jq -e '.ok==false and .decision=="STOP_RETRY" and .authorizationConsumed==false and .secretAccessed==false and .hostingDeploys==0 and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .productionTouched==false and .mainTouched==false and .mergeExecuted==false' "$FINAL" >/dev/null
            exit 41
          fi
          test "$RUNTIME_OUTCOME" = 'success'
          jq -e '.ok==true and .stage=="PASS_VISUAL_OBSERVABLE_ROOTFIX_LIVE" and .decision=="PASS_VISUAL_POST_AUTH" and .classification=="PASS_VISUAL_POST_AUTH" and .checkpoint=="MATRIX_COMPLETE" and .preflightStatus=="GO_GATE_CONTRACT" and .authorizationConsumed==true and .hostingDeployAttempted==true and .hostingDeploys==1 and .hostingRollbackRequired==false and .precheckStage=="PASS_VISUAL_BROWSER_PRECHECK" and .matrixStage=="PASS_VISUAL_OBSERVABLE_ROOTFIX_MATRIX" and .snapshotIntegrity=="VERIFIED_UNCHANGED" and .totalRoleFailures==0 and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .functionsDeploys==0 and .rulesDeploys==0 and .reimports==0 and .productionTouched==false and .mainTouched==false and .mergeExecuted==false' "$FINAL" >/dev/null
