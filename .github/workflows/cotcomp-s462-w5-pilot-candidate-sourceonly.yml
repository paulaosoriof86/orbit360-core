name: CotComp S4.62 W5 recommended pilot candidate source-only

on:
  push:
    branches:
      - ays/cotcomp-s462-w5-pilot-candidate-20261001
    paths:
      - '.github/cotcomp-lab-intents/s462-w5-pilot-candidate-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s462-w5-pilot-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.62 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s462-w5-pilot-candidate-sourceonly.json
          jq -e '
            .authorization=="S462_W5_SOURCE_ONLY_PILOT_CANDIDATE" and
            .projectId=="ays-orbit-360-lab" and
            .stage=="W5" and
            .appDataReads==false and
            .appDataWrites==false and
            .realData==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA and S4.62 tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-w5-pilot-candidate-s462.js
          node --check cotcomp-w5-pilot-candidate-s462.test.js
          node --test cotcomp-w5-pilot-candidate-s462.test.js

      - name: Build and enforce S4.62 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s462/evidence"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./functions/cotcomp-w5-pilot-candidate-s462');
          const r=s.evaluateCandidate();
          const out={
            schemaVersion:'ays-cotcomp-s462-w5-pilot-candidate-receipt-v1.0',
            projectId:'ays-orbit-360-lab',
            stage:'W5',
            technicalRecommendationReady:r.technicalRecommendationReady,
            recommendedCandidate:r.recommendedCandidate,
            recommendedRationale:r.recommendedRationale,
            externalOrOwnerInputs:r.externalOrOwnerInputs,
            executionAllowed:r.executionAllowed,
            realDataAllowed:r.realDataAllowed,
            productionAllowed:r.productionAllowed,
            boundaries:{
              appDataReadsExecuted:0,
              appDataWritesExecuted:0,
              realDataTouched:false,
              productionTouched:false
            }
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s462/evidence/S462_W5_PILOT_CANDIDATE_RECEIPT.json',JSON.stringify(out,null,2));
          NODE
          R="$RUNNER_TEMP/s462/evidence/S462_W5_PILOT_CANDIDATE_RECEIPT.json"
          jq -e '
            .technicalRecommendationReady==true and
            .recommendedCandidate.ownerApprovalState=="PROPOSED_NOT_APPROVED" and
            .recommendedCandidate.country=="GT" and
            .recommendedCandidate.journeyId=="GT_AUTO_MOTO_HYBRID" and
            .recommendedCandidate.allowedStages==["W1","W2","W3","W4"] and
            .recommendedCandidate.maxQuoteCases==1 and
            .recommendedCandidate.maxDataSubjects==1 and
            .recommendedCandidate.maxExistingRecordsTouched==8 and
            .recommendedCandidate.successDisposition=="ROLLBACK_TO_BEFORE_STATE" and
            .recommendedCandidate.healthSensitiveDataAllowed==false and
            .recommendedCandidate.ownerW5RealDataAuthorization==false and
            .executionAllowed==false and
            .realDataAllowed==false and
            .productionAllowed==false and
            .boundaries.appDataReadsExecuted==0 and
            .boundaries.appDataWritesExecuted==0 and
            .boundaries.realDataTouched==false and
            .boundaries.productionTouched==false
          ' "$R" >/dev/null

      - name: Upload S4.62 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s462-w5-pilot-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/s462/evidence/S462_W5_PILOT_CANDIDATE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
