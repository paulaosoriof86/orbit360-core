name: Orbit 360 · Validar capture watchdog v11 · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-capture-watchdog-source-only:
    if: github.head_ref == 'ays/sourcefix-v11-capture-watchdog-stop-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact sourcefix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and synthetic capture watchdog
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-playwright-capture-watchdog-lib-v20260806.mjs
          node --check tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs
          node --check tools/orbit360-visual-runtime-rootfix-observable-matrix-v1-audited-20260805.mjs
          node --check tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs

      - name: Validate Playwright 1.55 patchability without browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { patchChromiumCaptureWatchdog } from './tools/orbit360-playwright-capture-watchdog-lib-v20260806.mjs';
          const before = chromium.launch;
          patchChromiumCaptureWatchdog({ chromium, evidencePath: '', hardTimeoutMs: 50 });
          if (typeof chromium.launch !== 'function' || chromium.launch === before || chromium.__orbit360CaptureWatchdogV20260806 !== true) process.exit(41);
          console.log(JSON.stringify({status:'PASS_PLAYWRIGHT_155_CAPTURE_PATCHABILITY',browserLaunched:false,ok:true}));
          NODE

      - name: Assert sourcefix, STOP and zero risk
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/capture-watchdog-source-test-sanitized-v20260806.json','utf8'));
          const request = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const lifecycle = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const overlay = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          const workflow = fs.readFileSync('.github/workflows/orbit360-claude-paquete-reconciliado-v1205.yml','utf8');
          const wrapper = fs.readFileSync('tools/orbit360-visual-runtime-rootfix-observable-matrix-v20260805.mjs','utf8');
          const ok =
            source.status === 'PASS_CAPTURE_WATCHDOG_SOURCE_ONLY' && source.failed === 0 && source.ok === true &&
            source.synthetic.timeoutContextCloseCalls === 0 && source.synthetic.timeoutBrowserCloseCalls === 0 && source.synthetic.pageStillUsable === true &&
            request.status === 'CONSUMED_STOP_RETRY_CAPTURE_CHECKPOINT_IDLE_TIMEOUT' && request.allowedExecutions === 0 && request.consumed === true && request.authorizationFrozen === true && request.replayAllowed === false &&
            lifecycle.status === 'STOP_RETRY_V11_CAPTURE_CHECKPOINT_IDLE_TIMEOUT' && lifecycle.stopRetryActive === true && lifecycle.allowedExecutions === 0 && lifecycle.authorizationFrozen === true &&
            overlay.status === 'STOP_RETRY_V11_CAPTURE_CHECKPOINT_IDLE_TIMEOUT' && overlay.stopRetryActive === true && overlay.runtimeAllowed === false && overlay.hostingAllowed === false &&
            workflow.includes('ORBIT360_EXPECTED_REQUEST_VERSION: NONE_PENDING_FRESH_AUTHORIZATION') && workflow.includes('detect-active-request') &&
            wrapper.includes('const CAPTURE_TIMEOUT_MS = 12000;') && wrapper.includes('fullPage: false') && wrapper.includes('blocking: false') &&
            source.secretAccess === false && source.firebaseAccess === false && source.browserExecuted === false && source.deployExecuted === false;
          if (!ok) process.exit(41);
          console.log(JSON.stringify({status:'PASS_V11_CAPTURE_WATCHDOG_SOURCE_ONLY',checks:source.passed,stopRetry:true,runtimeExecuted:false,secretsRead:false,deployExecuted:false,ok:true},null,2));
          NODE
