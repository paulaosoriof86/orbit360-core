name: Orbit 360 · Vehicles canonical dry-run
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['.github/workflows/orbit360-vehicles-canonical-dryrun-v20260730.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-vehicles-canonical-dryrun-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block8-vehicles-static-v20260730
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  HIST_ID: 1lHKV1BBQy3KeMAc-khTW_wL2sD1hyQVW
  HIST_SHA: 68904f19705cfa742bba11219725ce1f10de7912d82b88dc085f4119cc3204af
  DELTA_ID: 1wlCUk68rWVnKEgQSmaxmxsIw7WNo5WLI
  DELTA_SHA: dbd31e3436946ef65bb737068394e6ee5eed44dc4a2dd96fcf975d5b3995f1d2
  POL_ID: 1NXHACZ11815882AhoyGrQQCb9Amgbi95
  POL_SHA: b63c5d10be40fcd4039be1b7844cafb0bf45c2a9904dd47ad65443b5fb43a89f
  EXPECTED_TARGET_DIGEST: c5a5eb51b69eedef33588c6e3bb8bb3746ceac8bffc4a7a9181ebcbe4995682d
jobs:
  dryrun:
    name: Vehicles · private canonical normalization only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico antes de secrets/Drive
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .failed==0 and .vehiclePolicyRelationsCreate==1032 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Preparar parser XLSX aislado
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save xlsx@0.18.5 >/dev/null 2>&1
      - name: Descargar fuentes exactas en espacio efímero
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function token(sa){const now=Math.floor(Date.now()/1000),u=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/drive.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900}),s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url'),body=new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:u+'.'+s}),r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok||!j.access_token)throw new Error('ENVIRONMENT_FAILURE:OAUTH_'+r.status);return j.access_token;}
          async function get(t,id,expected,out){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true`,{headers:{authorization:`Bearer ${t}`}});if(!r.ok)throw new Error('ENVIRONMENT_FAILURE:DRIVE_'+r.status);const b=Buffer.from(await r.arrayBuffer());if(sha(b)!==expected)throw new Error('DATA_CONTRACT_FAILURE:SOURCE_HASH');fs.writeFileSync(out,b);}
          (async()=>{const sa=JSON.parse(process.env.SERVICE_ACCOUNT);if(sa.project_id!=='ays-orbit-360-lab')throw new Error('ENVIRONMENT_FAILURE:PROJECT_ID_MISMATCH');const t=await token(sa);await get(t,process.env.HIST_ID,process.env.HIST_SHA,'/tmp/autos.xlsx');await get(t,process.env.DELTA_ID,process.env.DELTA_SHA,'/tmp/autos-delta.xlsx');await get(t,process.env.POL_ID,process.env.POL_SHA,'/tmp/policies.xlsx');})().catch(e=>{console.error(String(e.message||e));process.exit(41);});
          NODE
      - name: Canonicalizar sin Firestore
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_VEHICLES_HIST_XLSX=/tmp/autos.xlsx \
          ORBIT360_VEHICLES_DELTA_XLSX=/tmp/autos-delta.xlsx \
          ORBIT360_POLICIES_XLSX=/tmp/policies.xlsx \
          ORBIT360_VEHICLES_PACKAGE=/tmp/vehicles-private.json \
          ORBIT360_VEHICLES_EVIDENCE="$EVIDENCE_DIR/vehicles-canonical-dryrun.json" \
          node tools/orbit360-vehicles-canonicalize-v20260730.mjs
          jq -e '.status=="CANONICAL_DRYRUN_PASS" and .ok==true and .metrics.rawRows==1060 and .metrics.canonicalSourceIdentities==1036 and .metrics.vehiclePolicyRelationsCreate==1032 and .metrics.qualityPending==60 and .metrics.excluded==4 and .metrics.unsafeNumberOnlyFallback==0 and .metrics.targetIdDigest==env.EXPECTED_TARGET_DIGEST and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/vehicles-canonical-dryrun.json" >/dev/null
          test -s /tmp/vehicles-private.json
          rm -f /tmp/vehicles-private.json /tmp/autos.xlsx /tmp/autos-delta.xlsx /tmp/policies.xlsx
      - name: Subir evidencia sanitizada únicamente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-vehicles-canonical-dryrun-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/vehicles-canonical-dryrun.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/vehicles-canonical-dryrun.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Vehicles canonical dry-run blocked';try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.status==='CANONICAL_DRYRUN_PASS'&&p.metrics.vehiclePolicyRelationsCreate===1032&&p.operationalWrites===0){state='success';description='Vehicles canonical dry-run PASS: 1032 relations, 4 excluded';}else if(p.classification){description=`Vehicles dry-run blocked: ${p.classification}`;}}catch(e){}await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/vehicles-canonical-dryrun',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
