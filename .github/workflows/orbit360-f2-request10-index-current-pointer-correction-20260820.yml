name: Orbit360 F2 Request10 Index Current Pointer Correction 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/f2-request10-index-current-pointer-correction-target-v20260820.json'
permissions:
  contents: write
concurrency:
  group: orbit360-f2-request10-index-current-pointer-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct current pointer duplicates only
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-request10-index-current-pointer-correction-v20260820.mjs
          node tools/orbit360-f2-request10-index-current-pointer-correction-v20260820.mjs
          jq -e '.ok==true and .status=="F2_REQUEST10_INDEX_CURRENT_POINTER_CORRECTION_PASS" and (.checks|to_entries|all(.value==true)) and .productMutation==false and .dataMutation==false and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .firestoreRead==false and .writes==0 and .deployExecuted==false and .productionTouched==false and .request11Created==false and .request11Authorized==false' orbit360-platform/runtime-gate-crm-v20260716/f2-request10-index-current-pointer-correction-v20260820.json >/dev/null
          git diff --check
          mapfile -t CHANGED < <(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "${CHANGED[@]}"
          test "${#CHANGED[@]}" = '2'
          test "${CHANGED[0]}" = 'orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json'
          test "${CHANGED[1]}" = 'orbit360-platform/runtime-gate-crm-v20260716/f2-request10-index-current-pointer-correction-v20260820.json'
      - name: Persist pointer correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-docsync-bot'
          git config user.email 'orbit360-docsync-bot@users.noreply.github.com'
          git add orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json orbit360-platform/runtime-gate-crm-v20260716/f2-request10-index-current-pointer-correction-v20260820.json
          git commit -m 'docs(f2): seal Request10 current index pointers'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
