name: Orbit 360 · M5 5.0.6 remediación estática

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-runtime-smoke-remediation-static-v20260729.yml'
      - 'tools/orbit360-m5-runtime-smoke-remediation-static-request-v20260729.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-smoke-remediation-static-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703

jobs:
  static-remediation:
    name: M5 · remediación estática · no secrets · no browser · no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolver modo sin capacidades sensibles
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/orbit360-m5-runtime-smoke-remediation-static-request-v20260729.json ]; then
            echo 'value=request' >> "$GITHUB_OUTPUT"
          else
            echo 'value=package' >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar rama, SHA y ausencia de entorno sensible
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${ORBIT360_LAB_LOGIN_PASSWORD:-}"

      - name: Validar sintaxis del paquete
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-runtime-smoke-remediation-static-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-remediation-static-contract-v20260729.cjs
          node --check tools/orbit360-test-academia-static-content-write-policy-v20260729.mjs
          node --check tools/orbit360-m5-release-candidate-readiness-v20260728.mjs
          node --check tools/orbit360-m5-runtime-smoke-browser-v20260729.mjs
          node --check orbit360-platform/core/academia-static-content-write-policy-v20260729.js
          node --check orbit360-platform/data/academia-v1230-operational-directory-v20260722.js

      - name: Preflight canónico sin secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          test "$(jq -r '.status' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json)" = 'GO_GATE_CONTRACT'
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then
            test "$(jq -r '.executionAuthorized' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json)" = 'true'
            test "$(jq -r '.activationMode' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json)" = 'immutable_request_present'
          else
            test "$(jq -r '.executionAuthorized' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json)" = 'false'
            test "$(jq -r '.activationMode' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json)" = 'package_without_request'
          fi

      - name: Ejecutar fixtures de Academia
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-test-academia-static-content-write-policy-v20260729.mjs
          jq -e '.ok == true and .failed == 0' orbit360-platform/runtime-gate-crm-v20260716/m5-academia-static-write-policy-test.json >/dev/null

      - name: Ejecutar contrato de remediación
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-remediation-static-contract-v20260729.cjs
          jq -e '.status == "M5_RUNTIME_SMOKE_REMEDIATION_STATIC_CONTRACT_PASS" and .failed == 0' orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-remediation-static-contract-summary.json >/dev/null

      - name: Calcular nueva RC y brecha LAB
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-v20260728.mjs
          jq -e '.ok == true and .status == "M5_RC_READY_LAB_DELIVERY_REQUIRED" and .releaseCandidate.criticalAssetCount == 42 and .remoteLab.assetsExpected == 25 and .approvalReadyForLabDelivery == true and .approvalReadyForRuntimeSmoke == false' orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json >/dev/null

      - name: Crear cierre sanitizado del run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then
            jq -n \
              --arg mode request \
              --arg run "$GITHUB_RUN_ID" \
              --arg sha "$GITHUB_SHA" \
              --arg rc "$(jq -r '.releaseCandidate.hash' orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json)" \
              --argjson matched "$(jq '.remoteLab.assetsMatched' orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json)" \
              --argjson mismatches "$(jq '.remoteLab.mismatchCount' orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json)" \
              '{schemaVersion:"orbit360-m5-runtime-smoke-remediation-static-run-v1",ok:true,status:"M5_RUNTIME_SMOKE_REMEDIATION_STATIC_CLOSED_NEW_RC_READY_FOR_LAB_DELIVERY",mode:$mode,runId:($run|tonumber),commit:$sha,releaseCandidateHash:$rc,criticalAssets:42,remoteAssetsExpected:25,remoteAssetsMatched:$matched,mismatchCount:$mismatches,secrets:false,firestoreRead:false,runtime:false,browser:false,deploy:false,operationalWrites:0,containsPII:false,containsSecrets:false}' \
              > orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-remediation-static-run.json
          else
            jq -n \
              --arg mode package \
              --arg run "$GITHUB_RUN_ID" \
              --arg sha "$GITHUB_SHA" \
              '{schemaVersion:"orbit360-m5-runtime-smoke-remediation-static-run-v1",ok:true,status:"M5_RUNTIME_SMOKE_REMEDIATION_STATIC_PACKAGE_PASS",mode:$mode,runId:($run|tonumber),commit:$sha,secrets:false,firestoreRead:false,runtime:false,browser:false,deploy:false,operationalWrites:0,containsPII:false,containsSecrets:false}' \
              > orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-remediation-static-run.json
          fi

      - name: Subir evidencia sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-smoke-remediation-${{ steps.mode.outputs.value }}-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-academia-static-write-policy-test.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-remediation-static-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-remediation-static-run.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'orbit360/m5-runtime-smoke-remediation-static',
              description: success ? 'M5 5.0.6 remediación estática verificada' : 'M5 5.0.6 remediación estática falló; STOP THE LINE',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
