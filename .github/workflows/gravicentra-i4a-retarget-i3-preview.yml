name: Gravicentra Release Lineage Guard

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i4a-retarget-i3-preview.yml
      - .github/workflows/gravicentra-recovery-i3-preview.yml
      - .github/workflows/gravicentra-recovery-i4a-public-browser.yml
      - .github/workflows/gravicentra-i4a-insurer-backend-boundary-readonly.yml
      - artifacts/orbit360-recovery/release-control/ACTIVE_RELEASE_LOCK.json
      - tools/gravicentra-release-lineage-guard.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravicentra-release-lineage-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-lineage-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on source/build/preview desynchronization
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-release-lineage-guard.mjs --mode=control-plane
      - name: Publish release-control result
        if: always()
        shell: bash
        run: |
          {
            echo '## Gravicentra Insurance — release lineage guard'
            echo '- Authority: `ACTIVE_RELEASE_LOCK.json`'
            echo '- Silent retarget: forbidden'
            echo '- Product drift after certified source: fail closed'
            echo '- Preview marker mismatch: fail closed'
            echo '- Production touched: false'
            echo '- Data touched: false'
          } >> "$GITHUB_STEP_SUMMARY"
