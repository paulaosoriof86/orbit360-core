name: Gravicentra S5.10a Lead Card Visual Hierarchy SOURCE ONLY

on:
  workflow_dispatch:
  push:
    branches:
      - ays/gravicentra-s510a-lead-card-visual-hierarchy-20261007
    paths:
      - 'orbit360-platform/core/ciclo.js'
      - 'functions/lead-card-summary-s510.test.js'
      - '.github/workflows/gravicentra-s510a-lead-card-visual-hierarchy-lab.yml'

permissions:
  contents: read

env:
jobs:
  lead-card-hierarchy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and regression QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check ../orbit360-platform/core/ciclo.js
          node --test lead-card-summary-s510.test.js
      - name: Verify expected visual hierarchy content in source only
        working-directory: functions
        run: |
          set -euo pipefail
          grep -q 'Origen y país' ../orbit360-platform/core/ciclo.js
          grep -q 'Sin próximo toque' ../orbit360-platform/core/ciclo.js
          grep -q 'Estado comercial' ../orbit360-platform/core/ciclo.js
          grep -q 'Prima por definir' ../orbit360-platform/core/ciclo.js
      - name: Release block receipt
        run: echo 'G12_S510A_SOURCE_ONLY_PASS NO_HOSTING_MUTATION NO_REAL_DATA NO_FIREBASE_ACCESS'
