name: Orbit 360 · Diagnóstico Auth source-only v6

# Workflow reutilizado después del STOP_RETRY v5.
# No contiene secretos, Firebase, Firestore, Auth, Functions ni deploy.

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-access-recovery-source-only-v6-20260805.json'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-auth-access-source-only-v6-20260805
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/auth-access-recovery-source-only-v6-20260805.json
  ORBIT360_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/auth-access-source-only-v6-sanitized-v20260805.json

jobs:
  validate-auth-diagnostic-v6:
    name: Request → root cause → actor parity → evidence persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout request exacto con historia completa
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar request source-only único
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-auth-access-recovery-source-only-request-v6" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .parentHead==$parent and
            .scope.validateActorAuthorizationParity==true and
            .scope.validateConditionalEvidencePersistence==true and
            .scope.validateOnboardingErrorCodePropagation==true and
            .scope.secrets==false and .scope.firebase==false and
            .scope.firestore==false and .scope.auth==false and
            .scope.functions==false and .scope.deploy==false and
            .scope.crm==false and .scope.production==false and
            .scope.main==false and .scope.merge==false
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - name: Validar propietarios corregidos
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-auth-access-actor-parity-precheck-v6-20260805.mjs
          node --check tools/orbit360-auth-access-evidence-safe-persist-v6-20260805.mjs
          node --check tools/orbit360-auth-access-recovery-lab-v20260805.mjs
          test -f orbit360-platform/runtime-gate-crm-v20260716/auth-access-v5-dual-rootcause-sanitized-v20260805.json
          jq -e '
            .primaryRootCause.classification=="FUNCTIONAL_DEFECT" and
            .secondaryRootCause.classification=="PIPELINE_MECHANISM_FAILURE" and
            .authorization.consumed==true and .authorization.rerunExecuted==false
          ' orbit360-platform/runtime-gate-crm-v20260716/auth-access-v5-dual-rootcause-sanitized-v20260805.json >/dev/null

      - name: Verificar ausencia de capacidades operativas
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/orbit360-auth-access-recovery-lab-v3-20260805.yml
          ! grep -F '${{ secrets.' "$FILE"
          ! grep -E 'firebase (deploy|functions:list)|GOOGLE_APPLICATION_CREDENTIALS|gcloud |playwright|firestore-admin' "$FILE"

      - name: Sellar evidencia source-only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ORBIT360_EVIDENCE" <<'JSON'
          {
            "schemaVersion": "orbit360-auth-access-source-only-v6-sanitized-v1",
            "stage": "AUTH_ACCESS_SOURCE_ONLY_V6_PASS",
            "decision": "GO_AUTH_DIAGNOSTIC_CONTROL_PLANE",
            "classification": "AUTH_ACCESS_DIAGNOSTIC_READY",
            "actorAuthorizationParityOwnerPresent": true,
            "conditionalEvidencePersisterPresent": true,
            "v5DualRootCausePresent": true,
            "secretAccess": false,
            "firebaseCommands": 0,
            "firestoreReads": 0,
            "firestoreWrites": 0,
            "authReads": 0,
            "authWrites": 0,
            "functionsDeploys": 0,
            "hostingDeploys": 0,
            "crmWrites": 0,
            "productionTouched": false,
            "mainTouched": false,
            "mergeExecuted": false,
            "containsPII": false,
            "containsSecrets": false,
            "ok": true
          }
          JSON

      - name: Persistir evidencia source-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add "$ORBIT360_EVIDENCE"
          git commit -m 'auth: persist source-only v6 diagnostic [skip ci]'
          git push origin "HEAD:$ORBIT360_BRANCH"

      - name: Publicar cierre sanitizado
        uses: actions/github-script@v7
        with:
          script: |
            const body='## AUTH Source-only v6 — PASS\n\nActor parity, error-code propagation and conditional evidence persistence validated with zero runtime capabilities.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});
