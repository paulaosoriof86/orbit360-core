name: Orbit 360 · Auth Access Source-only v4

# AUTH_ACCESS_SOURCE_ONLY_V4
# capabilities:
# secrets: false
# firestore: false
# auth: false
# functions: false
# hosting: false
# browser: false
# deploy: false
# rules: false
# production: false

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-access-recovery-source-only-v4-20260805.json'

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/auth-access-recovery-source-only-v4-20260805.json
  ORBIT360_GATE_ID: block-auth-access-recovery-source-only-v4-20260805
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-access-recovery-source-only-v4-20260805.json
  ORBIT360_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/auth-access-source-only-v4-sanitized-v20260805.json
  ORBIT360_CLOSURE: orbit360-platform/docs/CIERRE-AUTH-ACCESS-SOURCE-ONLY-V4-20260805.md

jobs:
  validate-auth-source-only-v4:
    name: Request → provenance → preflight → atomicity/idempotency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout request exacto con historia completa
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar request v4 único e inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-auth-access-recovery-source-only-request-v4" and
            .gateId=="block-auth-access-recovery-source-only-v4-20260805" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .parentHead==$parent and
            .scope.validateRequest==true and
            .scope.validateProvenance==true and
            .scope.validateCanonicalPreflight==true and
            .scope.validateAllowlists==true and
            .scope.validateAtomicity==true and
            .scope.validateIdempotency==true and
            .scope.validateRootFix==true and
            .scope.secrets==false and .scope.firebase==false and
            .scope.firestore==false and .scope.auth==false and
            .scope.functions==false and .scope.hosting==false and
            .scope.browser==false and .scope.deploy==false and
            .scope.rules==false and .scope.reimport==false and
            .scope.crm==false and .scope.production==false and
            .scope.main==false and .scope.merge==false
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - name: Validar sintaxis source-only
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-auth-access-config-repair-lab-v3-20260805.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-auth-access-recovery-source-only-v4-20260805.mjs
          node --check tools/orbit360-register-auth-access-gate-source-only-v4-20260805.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          git diff --check HEAD^

      - name: Registrar gate v4 únicamente en working tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-register-auth-access-gate-source-only-v4-20260805.mjs

      - name: Ejecutar preflight canónico source-only
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '
            .status=="GO_GATE_CONTRACT" and .contractVersion=="13.3.0" and
            .failed==0 and .ok==true and
            .executionAuthorized==false and .secretAccessAuthorized==false and
            .firestoreReadAuthorized==false and .writeAuthorized==false and
            .authWriteAuthorized==false and .runtimeAuthorized==false and
            .browserAuthorized==false and .deployAuthorized==false and
            .functionsDeployAuthorized==false and .hostingDeployAuthorized==false and
            .rulesDeployAuthorized==false and .productionAuthorized==false and
            .dataAccess==false and .secretAccess==false and
            .firestoreRead==false and .firestoreWrites==0 and
            .authReads==0 and .authWrites==0 and
            .runtimeExecuted==false and .browserExecuted==false and
            .deployExecuted==false and .productionTouched==false and
            .rootFixStrategy=="READ_ALL_VALIDATE_ALL_WRITE_ALL" and
            .priorRequestsVerified==3 and .futureRuntimeRequestAbsent==true
          ' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null

      - name: Sellar evidencia y consumir autorización source-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const preflightPath='orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json';
          const preflight=fs.existsSync(preflightPath)?JSON.parse(fs.readFileSync(preflightPath,'utf8')):null;
          const ok=preflight?.status==='GO_GATE_CONTRACT'&&preflight?.failed===0&&preflight?.ok===true;
          const evidence={
            schemaVersion:'orbit360-auth-access-source-only-v4-sanitized-v1',
            stage:ok?'AUTH_ACCESS_SOURCE_ONLY_V4_PASS':'STOP_RETRY_AUTH_ACCESS_SOURCE_ONLY_V4',
            decision:ok?'GO_SOURCE_ONLY_AUTH_V4_COMPOSITION':'STOP_RETRY',
            classification:ok?'AUTH_ACCESS_SOURCE_ONLY_V4_READY':(preflight?.classification||'PIPELINE_MECHANISM_FAILURE'),
            gateId:'block-auth-access-recovery-source-only-v4-20260805',
            requestCommit:process.env.GITHUB_SHA,
            checksTotal:preflight?.total??0,
            checksPassed:preflight?.passed??0,
            checksFailed:preflight?.failed??1,
            failedCheckIds:preflight?.failedCheckIds||['PREFLIGHT_NOT_GENERATED'],
            rootFixStrategy:'READ_ALL_VALIDATE_ALL_WRITE_ALL',
            priorRequestsImmutable:preflight?.priorRequestsVerified===3,
            futureRuntimeRequestAbsent:preflight?.futureRuntimeRequestAbsent===true,
            secretAccess:false,
            firebaseCommands:0,
            firestoreReads:0,
            firestoreWrites:0,
            authReads:0,
            authWrites:0,
            functionsDeploys:0,
            hostingDeploys:0,
            browserRuns:0,
            rulesDeploys:0,
            reimports:0,
            crmWrites:0,
            productionTouched:false,
            mainTouched:false,
            mergeExecuted:false,
            containsPII:false,
            containsSecrets:false,
            ok
          };
          fs.mkdirSync('orbit360-platform/runtime-gate-crm-v20260716',{recursive:true});
          fs.writeFileSync(process.env.ORBIT360_EVIDENCE,JSON.stringify(evidence,null,2)+'\n');
          const lifecycle=JSON.parse(fs.readFileSync(process.env.ORBIT360_LIFECYCLE,'utf8'));
          lifecycle.status=ok?'AUTH_ACCESS_RECOVERY_SOURCE_ONLY_V4_CONSUMED_PASS':'AUTH_ACCESS_RECOVERY_SOURCE_ONLY_V4_CONSUMED_STOP_RETRY';
          lifecycle.authorization.activeRequest=false;
          lifecycle.authorization.allowedExecutions=0;
          lifecycle.authorization.consumed=true;
          lifecycle.executionResult={stage:evidence.stage,decision:evidence.decision,classification:evidence.classification,ok};
          fs.writeFileSync(process.env.ORBIT360_LIFECYCLE,JSON.stringify(lifecycle,null,2)+'\n');
          fs.mkdirSync('orbit360-platform/docs',{recursive:true});
          fs.writeFileSync(process.env.ORBIT360_CLOSURE,`# CIERRE AUTH ACCESS SOURCE-ONLY v4\n\n\`\`\`text\n${evidence.stage}\n${evidence.classification}\n\`\`\`\n\n- checks: ${evidence.checksPassed}/${evidence.checksTotal}\n- estrategia transaccional: READ_ALL → VALIDATE_ALL → WRITE_ALL\n- requests v1/v2/v3 inmutables: ${evidence.priorRequestsImmutable}\n- futuro request runtime ausente: ${evidence.futureRuntimeRequestAbsent}\n- secretos/Firebase/Firestore/Auth/Functions/Hosting/navegador/deploy: 0\n- producción/main/merge: 0\n\nEl request v4 source-only queda consumido e inmutable.\n`);
          NODE

      - name: Persistir registro, evidencia y cierre sin tocar request
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs \
            tools/orbit360-validator-lifecycle-contract-auth-access-recovery-source-only-v4-20260805.json \
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json \
            "$ORBIT360_EVIDENCE" "$ORBIT360_CLOSURE"
          if ! git diff --cached --quiet; then
            git commit -m 'auth: persist source-only v4 validation [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Publicar artefacto source-only sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-access-source-only-v4-sanitized
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/auth-access-source-only-v4-sanitized-v20260805.json
            orbit360-platform/docs/CIERRE-AUTH-ACCESS-SOURCE-ONLY-V4-20260805.md
          if-no-files-found: error
          retention-days: 14

      - name: Comentar cierre sanitizado en PR 5
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=process.env.ORBIT360_EVIDENCE;
            const e=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{stage:'STOP_RETRY_EVIDENCE_MISSING',classification:'PIPELINE_MECHANISM_FAILURE',ok:false};
            const body=`## AUTH Access Source-only v4 — ${e.ok?'PASS':'STOP_RETRY'}\n\n\`\`\`text\n${e.stage}\n${e.classification}\nchecks: ${e.checksPassed||0}/${e.checksTotal||0}\nroot fix: READ_ALL → VALIDATE_ALL → WRITE_ALL\nsecretos/runtime/deploy: 0\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});

      - name: Exigir PASS source-only
        if: always()
        shell: bash
        run: jq -e '.ok==true and .stage=="AUTH_ACCESS_SOURCE_ONLY_V4_PASS" and .checksFailed==0' "$ORBIT360_EVIDENCE" >/dev/null
