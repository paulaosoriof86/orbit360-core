name: Orbit 360 · Planillas/Comisiones · receipt link resolver static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/planillas-comisiones-receipt-link-resolver-static-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-planillas-comisiones-receipt-link-resolver-static-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  TRIGGER_PATH: .github/orbit360-triggers/planillas-comisiones-receipt-link-resolver-static-v20260801.json
  EVIDENCE_PATH: orbit360-platform/runtime-gate-crm-v20260716/planillas-comisiones-receipt-link-resolver-static-v20260801.json
jobs:
  verify:
    name: Static receipt resolver · synthetic fixtures only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar alcance estático
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-planillas-comisiones-receipt-link-resolver-static-request-v1" and .approved==true and .syntheticOnly==true and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.writes==false and .capabilities.browser==false and .capabilities.deploy==false and .capabilities.production==false' "$TRIGGER_PATH" >/dev/null
          node --check orbit360-platform/core/planillas-comisiones-receipt-link-resolver-p0.js
          node --check tools/orbit360-test-planillas-comisiones-receipt-link-resolver-p0-v20260801.mjs
      - name: Comprobar ausencia de capacidades en código ejecutable
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='orbit360-platform/core/planillas-comisiones-receipt-link-resolver-p0.js';
          let source=fs.readFileSync(path,'utf8');
          source=source.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:])\/\/.*$/gm,'$1');
          const forbidden=[/firebase-admin/i,/\.collection\s*\(/,/\bfetch\s*\(/,/\bwindow\b/,/\bdocument\b/,/localStorage/i,/Orbit\.store/i];
          const hit=forbidden.find(pattern=>pattern.test(source));
          if(hit)throw new Error('STATIC_CAPABILITY_TOKEN:'+hit);
          NODE
      - name: Ejecutar auditoría sintética
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          node tools/orbit360-test-planillas-comisiones-receipt-link-resolver-p0-v20260801.mjs | tee "$EVIDENCE_PATH"
          jq -e '.status=="STATIC_RECEIPT_LINK_RESOLVER_PASS" and .checks==14 and .fixtures==6 and .realRowsUsed==0 and .writes==0 and .storeAccess==false and .firestoreAccess==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_PATH" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-planillas-comisiones-receipt-link-resolver-static-${{ github.run_id }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: ${{ env.EVIDENCE_PATH }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='Receipt link resolver static failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.status==='STATIC_RECEIPT_LINK_RESOLVER_PASS'&&p.checks===14&&p.writes===0){state='success';description='Receipt link resolver: 14/14 synthetic checks';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/planillas-receipt-link-resolver-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
