          set -euo pipefail
          node tools/orbit360-validar-fase-a-ops-leads-crm-validator-reconciliation-v20260812.mjs
          jq -e '.status=="PASS_FASE_A_OPS_LEADS_CRM_RELEASE_EVIDENCE_RECONCILED" and .classification=="VALIDATOR_STALE_CORRECTED_BY_EVIDENCE_REUSE" and .rootCause=="VALIDATOR_STALE_MOBILE_MENU_SELECTOR" and .opsLeadsCrmRouteChecksPassed==9 and .mobileMenuEvidenceReusedFromRun==31544331170 and .routerOwnerUnchanged==true and .indexOwnerUnchanged==true and .snapshotIntegrity=="VERIFIED_UNCHANGED" and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deploys==0 and .productionTouched==false and .browserReexecuted==false and .secretAccess==false and .firestoreRead==false and .requestReplay==false and .checksFailed==0 and .ok==true' orbit360-platform/runtime-gate-crm-v20260716/fase-a-ops-leads-crm-release-reconciled-sanitized-v20260812.json >/dev/null
