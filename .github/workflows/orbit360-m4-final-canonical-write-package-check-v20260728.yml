name: Orbit 360 · M4 final canonical write · PACKAGE_CHECK
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m4-final-canonical-write-package-check-v20260728.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m4-final-canonical-write-package-check
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block4-final-canonical-migration-write-v20260728
jobs:
  package-check:
    name: M4 · Final canonical write · static package check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2, persist-credentials: false}
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirmar ausencia de solicitud de escritura
        shell: bash
        run: |
          set -euo pipefail
          test ! -f tools/orbit360-m4-final-canonical-write-request-v20260728.json
      - name: Ejecutar preflight canónico en modo paquete
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="4.3.1" and .failed==0 and .activationMode=="package_without_request" and .executionAuthorized==false and .allowedExecutions==0 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Ejecutar fixtures del contrato
        run: node tools/orbit360-m4-final-canonical-write-contract-v20260728.cjs
      - name: Validar fixtures
        run: jq -e '.status=="PASS" and .failed==0 and .total>=28 and .validationMode=="executed_contract_fixtures" and .literalSourceInspection==false' orbit360-platform/runtime-gate-crm-v20260716/m4-final-canonical-write-contract-summary.json >/dev/null
      - name: Subir evidencia estática
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m4-final-canonical-write-package-check-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-final-canonical-write-contract-summary.json
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          state='success'; description='M4 4.3.1 package check passed'
          if [ "${{ job.status }}" != 'success' ]; then state='failure'; description='M4 4.3.1 package check failed'; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m4-final-canonical-write-package"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
