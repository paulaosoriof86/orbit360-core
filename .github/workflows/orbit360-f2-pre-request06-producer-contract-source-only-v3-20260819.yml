name: Orbit360 F2 Pre-Request06 Producer Contract Source Only V3 20260819
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/f2-pre-request06-producer-contract-source-only-v3-trigger-v20260819.json'
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: orbit360-f2-pre-request06-producer-contract-source-only-v3-20260819
  cancel-in-progress: false
env:
  TARGET_BRANCH: ays/backend-tenant-lab-v99-20260703
  GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  RUN_ID: '32272580947'
  ARTIFACT_NAME: orbit360-f2-rules01-postdeploy-probe-32272580947
  ARTIFACT_ID: '9372746151'
  ARTIFACT_DIGEST: sha256:c087ad3bae277f990c760eb04edcce96ef2746add36120040ba6da5f4d55a860
  SELFTEST: orbit360-platform/runtime-gate-crm-v20260716/f2-full-runtime-known-rootfixes-selftest-v20260819.json
  COMPOSITE: orbit360-platform/runtime-gate-crm-v20260716/f2-rules01-postdeploy-composite-evidence-v20260819.json
  ROOTFIX: orbit360-platform/runtime-gate-crm-v20260716/f2-full-runtime-cross-tenant-validator-stale-rootfix-source-only-v20260819.json
  POSTSYNC: orbit360-platform/runtime-gate-crm-v20260716/f2-pre-request06-postsync-source-only-v20260819.json
jobs:
  producer_contract_closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen branch and authorization boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          PR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/5")"
          test "$(printf '%s' "$PR"|jq -r '.state')" = open
          test "$(printf '%s' "$PR"|jq -r '.draft')" = true
          test "$(printf '%s' "$PR"|jq -r '.merged')" = false
          test "$(printf '%s' "$PR"|jq -r '.head.ref')" = "$TARGET_BRANCH"
          test "$(printf '%s' "$PR"|jq -r '.head.sha')" = "$GITHUB_SHA"
          test ! -e .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-20260818-06.json
          jq -e '.status=="CONSUMED_PASS" and .consumed==true and .allowedExecutions==0 and .replayAllowed==false and .terminal.runId==32272580947 and .terminal.crossTenantDenied==true and .terminal.integrityBeforeAfterPass==true' .github/orbit360-requests/f2-rules01-postdeploy-probe-readonly-v20260818-01.json >/dev/null
      - name: Apply shared-contract rootfix to full F2 runtime owners
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-full-runtime-cross-tenant-rootfix-v20260819.mjs
          node tools/orbit360-f2-full-runtime-cross-tenant-rootfix-v20260819.mjs | tee /tmp/rootfix.txt
          grep -F 'F2_FULL_RUNTIME_CROSS_TENANT_VALIDATOR_STALE_ROOTFIX_APPLIED' /tmp/rootfix.txt
          git diff --check
      - name: Source-audit every known prior F2 blocker
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          ORBIT360_F2_KNOWN_ROOTFIXES_EVIDENCE="$SELFTEST" node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          jq -e '.ok==true and .status=="F2_FULL_RUNTIME_KNOWN_ROOTFIXES_SOURCE_AUDIT_PASS" and .crossTenant.reservedIdAbsent==true and .crossTenant.sharedContractBound==true and .roleView.superAdminResolvesDirection==true and .roleView.adminTenantRejectedForDirection==true and .legalGate.detachQuietWindowRootfixBound==true and .requestLifecycle.dynamicRunbound==true and .requestLifecycle.ordinalCoupling==false and .pwa.buildsMatch==true and .auth.passwordSignInProviderPresent==true and .runtimeWorkflow.deployCommandPresent==false and .request06Created==false and .secretAccess==false' "$SELFTEST" >/dev/null
      - name: Self-test producer-derived evidence contract before reading artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-postdeploy-evidence-contract-v20260819.mjs
          node --check tools/orbit360-test-f2-postdeploy-evidence-contract-v20260819.mjs
          node tools/orbit360-test-f2-postdeploy-evidence-contract-v20260819.mjs | tee /tmp/evidence-contract.txt
          grep -F 'F2_POSTDEPLOY_EVIDENCE_PRODUCER_CONTRACT_SELFTEST_PASS' /tmp/evidence-contract.txt
      - name: Download existing postdeploy artifact once as immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(printf '%s' "$RUN"|jq -r '.status')" = completed
          test "$(printf '%s' "$RUN"|jq -r '.conclusion')" = success
          test "$(printf '%s' "$RUN"|jq -r '.run_attempt')" = 1
          ARTS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          MATCH="$(printf '%s' "$ARTS"|jq --arg name "$ARTIFACT_NAME" '[.artifacts[]|select(.name==$name)]')"
          test "$(printf '%s' "$MATCH"|jq 'length')" = 1
          test "$(printf '%s' "$MATCH"|jq -r '.[0].id')" = "$ARTIFACT_ID"
          test "$(printf '%s' "$MATCH"|jq -r '.[0].digest')" = "$ARTIFACT_DIGEST"
          rm -rf .tmp/f2 && mkdir -p .tmp/f2
          gh run download "$RUN_ID" -n "$ARTIFACT_NAME" -D .tmp/f2
          test -f .tmp/f2/f2-rules01-postdeploy-probe-terminal-run-32272580947.json
          test -f .tmp/f2/f2-rules01-cross-tenant-forced-server-run-32272580947.json
          test -f .tmp/f2/f2-integrity-before-after-v20260818.json
      - name: Assemble artifact through actual producer contract
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-f2-postdeploy-evidence-contract-v20260819.mjs \
            --terminal .tmp/f2/f2-rules01-postdeploy-probe-terminal-run-32272580947.json \
            --probe .tmp/f2/f2-rules01-cross-tenant-forced-server-run-32272580947.json \
            --integrity .tmp/f2/f2-integrity-before-after-v20260818.json \
            --out "$COMPOSITE"
          jq -e '.ok==true and .status=="F2_RULES01_POSTDEPLOY_COMPOSITE_EVIDENCE_PASS" and .evidenceContractVersion=="F2_POSTDEPLOY_EVIDENCE_PRODUCER_CONTRACT_V1" and .probe.serverForced==true and .probe.responseStatus==403 and .probe.responseErrorStatus=="PERMISSION_DENIED" and .probe.crossTenantDenied==true and .integrity.countsIdentical==true and .integrity.digestsIdentical==true and .writes.firestoreDocument==0 and .writes.auth==0 and .writes.membership==0 and .writes.data==0 and .forbiddenEffects.rulesRedeploy==false and .forbiddenEffects.production==false' "$COMPOSITE" >/dev/null
      - name: Synchronize live state from composite producer evidence
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-pre-request06-docsync-v2-20260819.mjs
          node tools/orbit360-f2-pre-request06-docsync-v2-20260819.mjs --composite "$COMPOSITE" | tee /tmp/docsync.txt
          grep -F 'F2_PRE_REQUEST06_DOCSYNC_V2_PREPARED' /tmp/docsync.txt
      - name: Mandatory canonical F2 gate after rootfixes and docsync
        shell: bash
        run: |
          set -euo pipefail
          rm -f orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          env -u ORBIT360_REQUEST_FILE -u ORBIT360_EXPECTED_REQUEST_VERSION node tools/orbit360-validar-gate-contracts-v20260717.mjs "$GATE_ID" | tee /tmp/gate.txt
          grep -F 'PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE' /tmp/gate.txt
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .stableBoundaryContract==true and .sourceClosed==true and .phaseStillF2==true and .nextActionBound==true and .indexBoundaryCurrent==true and .executionAuthorized==false and .secretAccessAuthorized==false and .firestoreReadAuthorized==false and .browserAuthorized==false and .deployAuthorized==false and .productionAuthorized==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Write sanitized rootfix and post-sync evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root={schemaVersion:'orbit360-f2-pre-request06-producer-contract-source-only-v3',ok:true,status:'F2_PRE_REQUEST06_KNOWN_ROOTFIXES_SOURCE_ONLY_PASS',classification:'PASS',rootCauseClosed:{classification:'VALIDATOR_STALE',code:'F2_FULL_RUNTIME_CROSS_TENANT_PROBE_STILL_USES_RESERVED_INVALID_DOCUMENT_ID_AFTER_RULES01_VALID_PATH_ROOTFIX',sharedContract:'F2_CROSS_TENANT_PROBE_VALID_PATH_V2'},pipelineRootCauseClosed:{classification:'PIPELINE_MECHANISM_FAILURE',code:'POSTDEPLOY_CLOSURE_INFERRED_ARTIFACT_SCHEMA_INSTEAD_OF_PRODUCER_CONTRACT',replacement:'F2_POSTDEPLOY_EVIDENCE_PRODUCER_CONTRACT_V1'},postdeployProof:{runId:32272580947,artifactId:9372746151,httpStatus:403,errorStatus:'PERMISSION_DENIED',crossTenantDenied:true,integrityBeforeAfterPass:true,replayed:false,rulesRedeployed:false},auditedKnownContracts:['authentication_product_browser_provider','legal_detach_quiet_window','role_view_direction_superadmin','actual_route_topology','cross_tenant_valid_path_v2','dynamic_runbound_lifecycle','pwa_service_worker_build_parity','exact_artifact_binding','zero_deploy_runtime_workflow'],request06Created:false,request06Authorized:false,browserExecuted:false,runtimeExecuted:false,secretAccess:false,firestoreRead:false,firestoreDocumentWrites:0,authWrites:0,membershipWrites:0,dataWrites:0,rulesDeploy:false,hostingDeploy:false,functionsDeploy:false,packageRebuild:false,publication:false,production:false,mainMerge:false,containsPII:false,containsSecrets:false,generatedAt:new Date().toISOString()};
          fs.mkdirSync(path.dirname(process.env.ROOTFIX),{recursive:true});fs.writeFileSync(process.env.ROOTFIX,JSON.stringify(root,null,2)+'\n');
          const post={schemaVersion:'orbit360-f2-pre-request06-postsync-source-only-v3',ok:true,status:'F2_PRE_REQUEST06_POSTSYNC_CANONICAL_GATE_PASS',classification:'SOURCE_CONTRACT_PASS',gateMarker:'PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE',evidenceContractVersion:'F2_POSTDEPLOY_EVIDENCE_PRODUCER_CONTRACT_V1',knownRootfixAuditPass:true,boundary:{requestVersion:'F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V1',requestOrdinal:6,request06Created:false,request06Authorized:false,candidateArtifactId:9345207863,successorPublished:false,productionOperationalDeclared:false},scope:{browser:false,runtime:false,secrets:false,firestoreRead:false,writes:0,rulesDeploy:false,hosting:false,functions:false,rebuild:false,publication:false,production:false},containsPII:false,containsSecrets:false,generatedAt:new Date().toISOString()};
          fs.writeFileSync(process.env.POSTSYNC,JSON.stringify(post,null,2)+'\n');
          NODE
          jq -e '.ok==true and .request06Created==false and .secretAccess==false and .firestoreDocumentWrites==0 and .rulesDeploy==false and .production==false' "$ROOTFIX" >/dev/null
          jq -e '.ok==true and .knownRootfixAuditPass==true and .boundary.requestOrdinal==6 and .boundary.request06Created==false and .boundary.successorPublished==false and .scope.writes==0 and .scope.production==false' "$POSTSYNC" >/dev/null
      - name: Retire invalid inferred-schema docsync owner
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/orbit360-f2-rules01-postdeploy-pass-docsync-v20260819.mjs
          rm -f orbit360-platform/tools/orbit360-f2-rules01-postdeploy-pass-docsync-v20260819.mjs
      - name: Persist one serialized source-only closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs \
                     tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs \
                     tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260818.mjs \
                     tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260818.json \
                     tools/orbit360-f2-rules01-postdeploy-pass-docsync-v20260819.mjs \
                     .github/workflows/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml \
                     orbit360-platform/tools/orbit360-f2-rules01-postdeploy-pass-docsync-v20260819.mjs \
                     orbit360-platform/docs/orbit360-live-state-v1.json \
                     orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json \
                     orbit360-platform/docs/CHECKPOINT-F2-PRE-REQUEST06-KNOWN-ROOTFIXES-PASS-20260819.md \
                     "$SELFTEST" "$COMPOSITE" "$ROOTFIX" "$POSTSYNC"
          git diff --cached --check
          git diff --cached --quiet && { echo PIPELINE_MECHANISM_FAILURE:NO_SERIALIZED_CLOSURE_DIFF; exit 41; }
          git commit -m '[skip ci] fix(f2): producer-contract pre-Request06 source PASS'
          REMOTE="$(git ls-remote origin "refs/heads/$TARGET_BRANCH"|awk '{print $1}')"
          test "$REMOTE" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
