name: Orbit 360 · Receipts/portfolio visual projection static 9.1.0
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-receipts-portfolio-visual-static-v910-20260731.yml'
      - 'orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js'
      - 'orbit360-platform/core/backend-lab-canonical-view-sync.js'
      - 'tools/orbit360-validator-lifecycle-contract-receipts-portfolio-static-v910-20260730.json'
      - 'orbit360-platform/core/importa-dryrun-p0.js'
      - 'orbit360-platform/core/importa-clientes-p0.js'
      - 'orbit360-platform/core/importa-clientes-p0-wire.js'
      - 'orbit360-platform/core/importa-polizas-p0.js'
      - 'orbit360-platform/core/importa-polizas-p0-wire.js'
      - 'orbit360-platform/core/importa-cartera-p0.js'
      - 'orbit360-platform/core/importa-cartera-p0-wire.js'
      - 'orbit360-platform/core/importa-identity-upsert-v20260731.js'
      - 'orbit360-platform/core/importa-identity-dryrun-wire-v20260731.js'
      - 'orbit360-platform/core/importa-identity-writer-wire-v20260731.js'
      - 'orbit360-platform/core/importa-transversal-p0-bootstrap-v20260731.js'
      - 'orbit360-platform/modules/policy-receipts-v1199-detail-guard.js'
      - 'orbit360-platform/modules/cliente360.js'
      - 'orbit360-platform/modules/polizas.js'
      - 'tools/orbit360-test-receipts-portfolio-visual-projection-v910.mjs'
      - 'tools/orbit360-test-client360-policy-vehicle-readmodel-v1199c-20260731.mjs'
      - 'tools/orbit360-test-human-visual-contract-v20260731.mjs'
      - 'tools/orbit360-human-review-visual-lab-v20260731.mjs'
      - 'tools/orbit360-test-importa-polizas-p0.mjs'
      - 'tools/orbit360-test-importa-polizas-legacy-defaults-guard-v20260730.mjs'
      - 'tools/orbit360-test-importa-cartera-p0.mjs'
      - 'tools/orbit360-test-importa-transversal-v20260731.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-visual-static-v910
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico 9.1.0
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block9-receipts-portfolio-static-v20260730
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .gatePhase=="AUTHORIZED_WRITE" and .requestExists==true and .failed==0 and .operationalWrites==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
          jq -e '.gateId=="block9-receipts-portfolio-static-v20260730" and .gateContractVersion=="9.1.0" and .transversalIdentityUpsert.required==true and .transversalIdentityUpsert.exactIdentityAction=="update_existing" and .transversalIdentityUpsert.probableIdentityAction=="hold_no_insert" and .exactDualAuthoritativePaymentMatchMayReconcile==true and .singleSourceAutoReconciliationAllowed==false and .policyPremiumPaymentSemantics.primaTotalInferenceFromPrimaNetaAllowed==false and .policyPremiumPaymentSemantics.paymentDimensions==["frecuencia","formaPago","conductoPago"]' tools/orbit360-validator-lifecycle-contract-receipts-portfolio-static-v910-20260730.json >/dev/null
      - name: Sintaxis
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js
          node --check orbit360-platform/core/backend-lab-canonical-view-sync.js
          node --check orbit360-platform/core/importa-dryrun-p0.js
          node --check orbit360-platform/core/importa-clientes-p0.js
          node --check orbit360-platform/core/importa-clientes-p0-wire.js
          node --check orbit360-platform/core/importa-polizas-p0.js
          node --check orbit360-platform/core/importa-polizas-p0-wire.js
          node --check orbit360-platform/core/importa-cartera-p0.js
          node --check orbit360-platform/core/importa-cartera-p0-wire.js
          node --check orbit360-platform/core/importa-identity-upsert-v20260731.js
          node --check orbit360-platform/core/importa-identity-dryrun-wire-v20260731.js
          node --check orbit360-platform/core/importa-identity-writer-wire-v20260731.js
          node --check orbit360-platform/core/importa-transversal-p0-bootstrap-v20260731.js
          node --check orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          node --check orbit360-platform/modules/cliente360.js
          node --check orbit360-platform/modules/polizas.js
          node --check tools/orbit360-test-receipts-portfolio-visual-projection-v910.mjs
          node --check tools/orbit360-test-client360-policy-vehicle-readmodel-v1199c-20260731.mjs
          node --check tools/orbit360-test-human-visual-contract-v20260731.mjs
          node --check tools/orbit360-human-review-visual-lab-v20260731.mjs
          node --check tools/orbit360-test-importa-polizas-p0.mjs
          node --check tools/orbit360-test-importa-polizas-legacy-defaults-guard-v20260730.mjs
          node --check tools/orbit360-test-importa-cartera-p0.mjs
          node --check tools/orbit360-test-importa-transversal-v20260731.mjs
      - name: Contrato visual static
        run: |
          set -euo pipefail
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          node tools/orbit360-test-receipts-portfolio-visual-projection-v910.mjs > orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-static-v910.json
          jq -e '.status=="VISUAL_PROJECTION_STATIC_READY" and .failed==0 and .firestoreWrites==0 and .operationalWrites==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-static-v910.json >/dev/null
          node tools/orbit360-test-client360-policy-vehicle-readmodel-v1199c-20260731.mjs > orbit360-platform/runtime-gate-crm-v20260716/client360-readmodel-static-v1199c.json
          jq -e '.ok==true and .indexedSummary==true and .synchronousClientShape==true and .fullPagePolicy==true and .fullPageVehicle==true and .noUndefinedNaN==true and .writes==0' orbit360-platform/runtime-gate-crm-v20260716/client360-readmodel-static-v1199c.json >/dev/null
          node tools/orbit360-test-human-visual-contract-v20260731.mjs > orbit360-platform/runtime-gate-crm-v20260716/human-visual-contract-v20260731.json
          jq -e '.status=="HUMAN_VISUAL_STATIC_READY" and .failed==0 and .firestoreWrites==0 and .deployExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/human-visual-contract-v20260731.json >/dev/null
      - name: Contrato transversal importador no regresión
        run: |
          set -euo pipefail
          node tools/orbit360-test-importa-polizas-p0.mjs > orbit360-platform/runtime-gate-crm-v20260716/importa-polizas-p0-v20260731.json
          jq -e '.status=="PASS" and .premiumInference==false and .paymentDimensionsSeparated==true' orbit360-platform/runtime-gate-crm-v20260716/importa-polizas-p0-v20260731.json >/dev/null
          node tools/orbit360-test-importa-polizas-legacy-defaults-guard-v20260730.mjs > orbit360-platform/runtime-gate-crm-v20260716/importa-polizas-legacy-guard-v20260731.json
          jq -e '.status=="PASS" and .premiumInferenceAllowed==false and .paymentDimensionsSeparated==true and .firestoreWrites==0 and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/importa-polizas-legacy-guard-v20260731.json >/dev/null
          node tools/orbit360-test-importa-cartera-p0.mjs > orbit360-platform/runtime-gate-crm-v20260716/importa-cartera-p0-v20260731.json
          jq -e '.status=="PASS" and .duplicateStatementUpdated==true and .dualSourceExactConciliated==true and .singleSourceNotConciliated==true and .firestoreWrites==0 and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/importa-cartera-p0-v20260731.json >/dev/null
          node tools/orbit360-test-importa-transversal-v20260731.mjs > orbit360-platform/runtime-gate-crm-v20260716/importa-transversal-v20260731.json
          jq -e '.status=="IMPORTA_TRANSVERSAL_IDEMPOTENCY_READY" and .exactUpdate==true and .probableHold==true and .premiumInference==false and .paymentDimensionsSeparated==true and .dualSourceReconciliation==true and .singleSourceAutoReconciliation==false and .dryRunMatchesWritePlan==true and .runtimeBootstrapActive==true and .firestoreWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/importa-transversal-v20260731.json >/dev/null
      - name: Evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-visual-static-v910-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-static-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/client360-readmodel-static-v1199c.json
            orbit360-platform/runtime-gate-crm-v20260716/human-visual-contract-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/importa-polizas-p0-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/importa-polizas-legacy-guard-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/importa-cartera-p0-v20260731.json
            orbit360-platform/runtime-gate-crm-v20260716/importa-transversal-v20260731.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-static-v910.json
          READMODEL: orbit360-platform/runtime-gate-crm-v20260716/client360-readmodel-static-v1199c.json
          HUMAN: orbit360-platform/runtime-gate-crm-v20260716/human-visual-contract-v20260731.json
          IMPORTA: orbit360-platform/runtime-gate-crm-v20260716/importa-transversal-v20260731.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Receipts/portfolio human visual static failed';
            try{
              const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));
              const r=JSON.parse(fs.readFileSync(process.env.READMODEL,'utf8'));
              const h=JSON.parse(fs.readFileSync(process.env.HUMAN,'utf8'));
              const i=JSON.parse(fs.readFileSync(process.env.IMPORTA,'utf8'));
              if(p.status==='VISUAL_PROJECTION_STATIC_READY'&&p.failed===0&&r.ok===true&&r.synchronousClientShape===true&&h.status==='HUMAN_VISUAL_STATIC_READY'&&h.failed===0&&i.status==='IMPORTA_TRANSVERSAL_IDEMPOTENCY_READY'&&i.exactUpdate===true&&i.probableHold===true){
                state='success';description='Human visual + transversal importer contract ready';
              }else if(h.failed){description=`Human visual blocked: ${h.failed} checks`;}
            }catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-visual-static-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
