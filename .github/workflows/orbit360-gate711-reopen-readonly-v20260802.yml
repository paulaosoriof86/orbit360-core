name: Orbit 360 · Gate 7.11 · reapertura read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/canonical-runtime-cumulative-visual-lab-reopen-final-v20260802.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-gate711-reopen-final-v20260802
  cancel-in-progress: false
env:
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-reopen-final-v20260802.json
  ORBIT360_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-reopen-v20260802.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  validate:
    name: Gate 7.11 · runtime canónico acumulativo · cero escrituras
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight canónico antes de secrets
        shell: bash
        run: bash tools/orbit360-run-gate711-reopen-readonly-v20260802.sh preflight
      - name: Instalar dependencias controladas
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 firebase@11 google-auth-library@9 playwright@1.52.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Ejecutar runtime read-only autorizado
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: bash tools/orbit360-run-gate711-reopen-readonly-v20260802.sh runtime
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-reopen-readonly-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-authorization-binding-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-legal-deferred-order-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-browser-identity-readonly-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-before-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-cumulative-visual-lab-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-after-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/visual-sanitized-v20260801/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-cumulative-visual-lab-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Gate 7.11 read-only failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_PASS'&&p.firestoreWrites===0&&p.operationalWrites===0&&p.writeGuard?.calls?.length===0&&p.production===false){state='success';description='Gate 7.11 PASS; zero writes and no production';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-reopen-readonly',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
