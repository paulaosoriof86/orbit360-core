name: Orbit 360 · Matriz visual corregida post-Auth · una vez v2

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - .github/workflows/orbit360-run-visual-matrix-corrected-post-auth-once-v2-20260806.yml

permissions:
  contents: write

concurrency:
  group: orbit360-visual-matrix-corrected-post-auth-278-v2-once
  cancel-in-progress: false

jobs:
  visual-matrix-corrected-post-auth:
    if: github.event.pull_request.head.ref == 'ays/run-visual-matrix-corrected-post-auth-278-v2-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout transporte exclusivo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar transporte y fijar request canónico nuevo
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW='.github/workflows/orbit360-run-visual-matrix-corrected-post-auth-once-v2-20260806.yml'
          REQUEST_SHA='75a50b2176aa4e333fb859169e76d81fb03ed542'
          RETIRED_REQUEST_SHA='ba993d061a2d55f1703ebaeb0bad2cd9ab8a98ad'
          BRANCH='ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$REQUEST_SHA" != "$RETIRED_REQUEST_SHA"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$WORKFLOW"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$REQUEST_SHA"
          git checkout --detach "$REQUEST_SHA"
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          test -f '.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json'

      - name: GO_GATE_CONTRACT sin secretos
        id: preflight
        shell: bash
        env:
          GITHUB_REF_NAME: ays/backend-tenant-lab-v99-20260703
        run: |
          set -euo pipefail
          bash tools/orbit360-preflight-visual-matrix-corrected-post-auth-once-v20260805.sh

      - name: Ejecutar Hosting LAB y matriz read-only
        if: steps.preflight.outputs.go == 'true'
        shell: bash
        env:
          GITHUB_REF_NAME: ays/backend-tenant-lab-v99-20260703
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          bash tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v20260805.sh

      - name: Publicar capturas acotadas privadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-visual-matrix-corrected-v2-${{ github.run_id }}
          path: orbit360-visual-matrix-corrected-artifacts/
          if-no-files-found: ignore
          retention-days: 7
