name: Orbit 360 · Recuperación controlada de acceso LAB

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-access-recovery-lab-v20260805.json'

permissions:
  contents: write
  statuses: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-auth-access-recovery-lab-v20260805
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/auth-access-recovery-lab-v20260805.json
  ORBIT360_GATE_ID: block-auth-access-recovery-lab-v20260805
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_REAL_TENANT_ID: alianzas-soluciones
  ORBIT360_FUNCTIONS_REGION: us-central1
  ORBIT360_FUNCTION: orbit360ProvisionTeamAccess
  ORBIT360_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/auth-access-recovery-sanitized-v20260805.json
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-access-recovery-lab-v20260805.json
  ORBIT360_PREVIEW_URL: https://ays-orbit-360-lab--orbit360-operational-block12-w8ibrr6w.web.app

jobs:
  recover-access:
    name: Gate → censo → onboarding Function → identidades reales → memberships → invitaciones
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout autorización exacta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar request único e inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-auth-access-recovery-request-v1" and
            .gateId=="block-auth-access-recovery-lab-v20260805" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and
            .parentHead==$parent and
            .scope.authCensusReadOnly==true and
            .scope.advisorCensusReadOnly==true and
            .scope.membershipCensusReadOnly==true and
            .scope.deployOnboardingFunctionOnlyIfAbsent==true and
            .scope.createOrLinkConfiguredRealUsers==true and
            .scope.syncMembershipRolesScopes==true and
            .scope.sendPasswordEstablishmentOrReset==true and
            .scope.verifyIdentityMembershipContract==true and
            .scope.rollbackOnFailure==true and
            .scope.syntheticUsers==false and .scope.syntheticMemberships==false and
            .scope.hardcodedUsers==false and .scope.temporaryPasswords==false and
            .scope.otherFunctions==false and .scope.hosting==false and .scope.rules==false and
            .scope.reimport==false and .scope.crmWrites==false and
            .scope.production==false and .scope.main==false and .scope.merge==false
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - name: Registrar gate canónico en working tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-register-auth-access-gate-v20260805.mjs

      - name: Gate contractual obligatorio antes de secretos
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '
            .status=="GO_GATE_CONTRACT" and .contractVersion=="13.0.0" and .failed==0 and
            .executionAuthorized==true and .secretAccessAuthorized==true and
            .firestoreReadAuthorized==true and .writeAuthorized==true and
            .authWriteAuthorized==true and .functionsDeployAuthorized==true and
            (.allowedFunctions|length)==1 and .allowedFunctions[0]=="orbit360ProvisionTeamAccess" and
            .hostingDeployAuthorized==false and .rulesDeployAuthorized==false and
            .productionAuthorized==false and .dataAccess==false and .secretAccess==false and
            .firestoreRead==false and .firestoreWrites==0 and .authReads==0 and .authWrites==0 and
            .runtimeExecuted==false and .deployExecuted==false
          ' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null

      - name: Persistir registro del gate sin disparar otro runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- tools/orbit360-validar-gate-contracts-v20260717.mjs; then
            git config user.name 'orbit360-gate-bot'
            git config user.email 'orbit360-gate-bot@users.noreply.github.com'
            git add tools/orbit360-validar-gate-contracts-v20260717.mjs
            git commit -m 'gate: register auth access recovery [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Resolver credencial LAB después del gate
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-auth-access-recovery-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_AUTH_PRIVATE_STATE=$RUNNER_TEMP/orbit360-auth-access-recovery-private.json" >> "$GITHUB_ENV"

      - name: Instalar runtime reproducible
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 google-auth-library@9 firebase-tools@15.25.1 >/dev/null
          npm --prefix functions ci --include=prod
          node --check functions/user-onboarding.js
          node --check functions/bootstrap.js

      - name: Censo read-only de Auth, asesores, memberships y CRM protegido
        id: census
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-access-recovery-lab-v20260805.mjs \
            --mode census \
            --private "$ORBIT360_AUTH_PRIVATE_STATE" \
            --sanitized "$ORBIT360_EVIDENCE"
          jq -e '.stage=="CENSUS_READ_ONLY_PASS" and .configuredTargets|length==3 and .firestoreWrites==0 and .authWrites==0 and .ok==true' "$ORBIT360_EVIDENCE" >/dev/null

      - name: Censar y desplegar exclusivamente onboarding si está ausente
        id: function
        shell: bash
        run: |
          set -euo pipefail
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-before.json"
          BEFORE_COUNT="$(grep -o "\"$ORBIT360_FUNCTION\"" "$RUNNER_TEMP/functions-before.json" | wc -l | tr -d ' ')"
          DEPLOYED=false
          if [ "$BEFORE_COUNT" = '0' ]; then
            npx firebase deploy --project "$ORBIT360_PROJECT_ID" --only "functions:$ORBIT360_FUNCTION" --non-interactive --force | tee "$RUNNER_TEMP/onboarding-function-deploy.log"
            DEPLOYED=true
          fi
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-after.json"
          AFTER_COUNT="$(grep -o "\"$ORBIT360_FUNCTION\"" "$RUNNER_TEMP/functions-after.json" | wc -l | tr -d ' ')"
          test "$AFTER_COUNT" -ge 1
          echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Crear o vincular identidades reales y enviar establecimiento de contraseña
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-access-recovery-lab-v20260805.mjs \
            --mode recover \
            --private "$ORBIT360_AUTH_PRIVATE_STATE" \
            --sanitized "$ORBIT360_EVIDENCE"
          jq -e '
            .stage=="AUTH_ACCESS_RECOVERY_PASS" and .ok==true and
            (.targets|length)==3 and .passwordEstablishmentEmailsSent==3 and
            .nonTargetAuthUnchanged==true and .nonTargetMembershipsUnchanged==true and
            .protectedCrmDataUnchanged==true and .temporaryPasswordsCreated==0 and
            .passwordsRead==0 and .actionLinksExposed==0 and .fullEmailsExposed==0 and
            .otherFunctionsDeployed==0 and .hostingDeploys==0 and .rulesDeploys==0 and
            .reimports==0 and .productionTouched==false and .mainTouched==false and .mergeExecuted==false
          ' "$ORBIT360_EVIDENCE" >/dev/null

      - name: Sellar lifecycle y cierre sanitizado
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        env:
          FUNCTION_DEPLOYED: ${{ steps.function.outputs.deployed }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lifecyclePath=process.env.ORBIT360_LIFECYCLE;
          const evidencePath=process.env.ORBIT360_EVIDENCE;
          const lifecycle=JSON.parse(fs.readFileSync(lifecyclePath,'utf8'));
          const evidence=fs.existsSync(evidencePath)?JSON.parse(fs.readFileSync(evidencePath,'utf8')):{stage:'STOP_RETRY_EVIDENCE_MISSING',ok:false,classification:'PIPELINE_MECHANISM_FAILURE'};
          lifecycle.status=evidence.ok?'AUTH_ACCESS_RECOVERY_CONSUMED_PASS':'AUTH_ACCESS_RECOVERY_CONSUMED_STOP_RETRY';
          lifecycle.authorization.activeRequest=false;
          lifecycle.authorization.allowedExecutions=0;
          lifecycle.authorization.consumed=true;
          lifecycle.authorization.replayAllowed=false;
          lifecycle.authorization.newExplicitAuthorizationRequiredAfterExecution=true;
          lifecycle.executionResult={stage:evidence.stage,decision:evidence.decision||'',classification:evidence.classification||'',ok:evidence.ok===true,functionDeployed:process.env.FUNCTION_DEPLOYED==='true'};
          fs.writeFileSync(lifecyclePath,JSON.stringify(lifecycle,null,2)+'\n','utf8');
          const closure=`# CIERRE — RECUPERACIÓN CONTROLADA DE ACCESO LAB\n\nFecha: 2026-08-05  \\nRC: \`RC-AYS-LAB-CANONICA-01\`  \\nGate: \`block-auth-access-recovery-lab-v20260805\`\n\n## Decisión\n\n\`\`\`text\n${evidence.stage||'UNKNOWN'}\n${evidence.decision||''}\n${evidence.classification||''}\n\`\`\`\n\n## Resultado sanitizado\n\n- targets: ${Array.isArray(evidence.targets)?evidence.targets.length:0}\n- Auth creados: ${evidence.authUsersCreated??0}\n- memberships creadas: ${evidence.membershipsCreated??0}\n- correos de establecimiento/recuperación enviados: ${evidence.passwordEstablishmentEmailsSent??evidence.emailsSentBeforeStop??0}\n- datos CRM protegidos sin cambio: ${evidence.protectedCrmDataUnchanged===true}\n- contraseñas temporales: 0\n- Hosting/Rules/reimportación/producción/main/merge: 0\n\nEl request permanece inmutable y la autorización quedó consumida.\n`;
          fs.writeFileSync('orbit360-platform/docs/CIERRE-AUTH-ACCESS-RECOVERY-LAB-20260805.md',closure,'utf8');
          NODE

      - name: Publicar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-auth-access-recovery-sanitized-v20260805
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/auth-access-recovery-sanitized-v20260805.json
            orbit360-platform/docs/CIERRE-AUTH-ACCESS-RECOVERY-LAB-20260805.md
          if-no-files-found: warn
          retention-days: 14

      - name: Persistir cierre sin modificar request
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-access-bot'
          git config user.email 'orbit360-access-bot@users.noreply.github.com'
          git add "$ORBIT360_LIFECYCLE" "$ORBIT360_EVIDENCE" orbit360-platform/docs/CIERRE-AUTH-ACCESS-RECOVERY-LAB-20260805.md orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          if ! git diff --cached --quiet; then
            git commit -m 'auth: persist access recovery result [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Comentar decisión en PR 5
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let e={stage:'STOP_RETRY_EVIDENCE_MISSING',classification:'PIPELINE_MECHANISM_FAILURE',ok:false};
            try{e=JSON.parse(fs.readFileSync(process.env.ORBIT360_EVIDENCE,'utf8'));}catch{}
            const pass=e.ok===true;
            const lines=[
              `## AUTH Access Recovery — ${pass?'PASS':'STOP_RETRY'}`,
              '',
              '```text',
              `stage: ${e.stage||''}`,
              `classification: ${e.classification||''}`,
              `targets: ${Array.isArray(e.targets)?e.targets.length:0}`,
              `Auth creados: ${e.authUsersCreated??0}`,
              `memberships creadas: ${e.membershipsCreated??0}`,
              `correos enviados: ${e.passwordEstablishmentEmailsSent??e.emailsSentBeforeStop??0}`,
              `CRM protegido sin cambios: ${e.protectedCrmDataUnchanged===true}`,
              `Hosting/Rules/reimportación/producción/main/merge: 0`,
              '```',
              '',
              pass?'Las identidades reales y memberships quedaron verificadas; cada persona debe establecer o recuperar su contraseña desde el correo recibido.':'Se aplicó STOP_RETRY. No se ejecutará un segundo intento con esta autorización.'
            ];
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body:lines.join('\n')});

      - name: Fallar workflow ante STOP_RETRY
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ORBIT360_EVIDENCE"
          jq -e '.ok==true and .stage=="AUTH_ACCESS_RECOVERY_PASS"' "$ORBIT360_EVIDENCE" >/dev/null
