name: Orbit 360 · Gate 7.11 · manifiesto acumulativo root fix · estático
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-cumulative-manifest-rootfix-static-v20260802.json'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    name: Gate 7.11 · único cambio visual = owner Academia
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout histórico completo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar trigger y derivar manifiesto
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=.github/orbit360-static-requests/gate711-cumulative-manifest-rootfix-static-v20260802.json
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST"
          jq -e '.schemaVersion=="orbit360-gate711-cumulative-manifest-rootfix-static-request-v1" and .approved==true and .allowedExecutions==1 and .consumed==false and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-derivar-cumulative-visual-manifest-academia-rootfix-v20260802.mjs
          node tools/orbit360-derivar-cumulative-visual-manifest-academia-rootfix-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_CUMULATIVE_VISUAL_MANIFEST_ROOTFIX_PASS" and .classification=="GO_STATIC_CUMULATIVE_VISUAL_MANIFEST_ROOTFIX" and .total==10 and .passed==10 and .failed==0 and .newManifest.trackedFileCount==309 and .newManifest.pathDigest=="517056dee1200503b2e7295a333cb804bc71271bbaa87847fa762da025f276f1" and .newManifest.indexDigest=="b57b6581ee02d2dde42a8a2c1272d57f19b7ad6809d13a1d25111f3d71a96074" and .newManifest.contentDigest!="83cc01dacf180b8ca9693df7117030228479992d6db4c59fab53def2e94acafd" and (.changedVisualPaths|length)==1 and .changedVisualPaths[0]=="orbit360-platform/data/academia-v1230-operational-directory-v20260722.js" and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .firestoreWrites==0 and .operationalWrites==0 and .deployExecuted==false and .production==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-cumulative-visual-manifest-academia-rootfix-v20260802.json >/dev/null
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-cumulative-manifest-rootfix-static-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/gate711-cumulative-visual-manifest-academia-rootfix-v20260802.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/gate711-cumulative-visual-manifest-academia-rootfix-v20260802.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Gate 7.11 cumulative manifest root fix failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='GATE711_CUMULATIVE_VISUAL_MANIFEST_ROOTFIX_PASS'&&p.changedVisualPaths?.length===1){state='success';description='Cumulative manifest root fix PASS; one visual owner changed';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-cumulative-manifest-rootfix-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
