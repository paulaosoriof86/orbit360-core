          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify request03 consumed and non-replayable
        shell: bash
        run: |
          set -euo pipefail
          R=.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-20260818-03.json
          jq -e '.status=="CONSUMED_STOP_RETRY" and .allowedExecutions==0 and .consumed==true and .authorizationFrozen==true and .replayAllowed==false and .runtimeRunId==32207049146 and .terminalArtifactId==9349486089 and .executionResult.canonicalGateGo==true and .executionResult.candidateArtifactVerified==true and .executionResult.integrityBeforeAfterPass==true and .executionResult.observedGateEvidence.accepted==1 and .executionResult.observedGateEvidence.remaining==0 and .executionResult.firestoreWrites==0 and .executionResult.authWrites==0 and .executionResult.operationalWrites==0' "$R" >/dev/null
      - name: Phase-aware helper deterministic regression proof
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-browser-blocking-gate-readiness-v20260730.mjs
          node --check tools/orbit360-test-browser-blocking-gate-readiness-phase-aware-v20260818.mjs
          node tools/orbit360-test-browser-blocking-gate-readiness-phase-aware-v20260818.mjs > "$EVIDENCE_DIR/f2-legal-readiness-phase-aware-selftest-v20260818.json"
          jq -e '.ok==true and .status=="F2_LEGAL_READINESS_PHASE_AWARE_SELFTEST_PASS" and .legacyFailureShapeReproduced.accepted==1 and .legacyFailureShapeReproduced.remaining==0 and .legacyFailureShapeReproduced.elapsedBeyondHardTimeout==true and .phaseAwareResult.ok==true and .phaseAwareResult.accepted==1 and .phaseAwareResult.remaining==0 and .phaseAwareResult.quietWindowSatisfied==true and .productMutation==false and .runtimeExecuted==false and .browserExecuted==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/f2-legal-readiness-phase-aware-selftest-v20260818.json" >/dev/null
      - name: Canonical source-only gate remains PASS
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          env -u ORBIT360_REQUEST_FILE ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
