          jq --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '. + {legalReadinessRootfixSourceRunId:$run,legalReadinessRootfixTriggerSha:$sha,legalReadinessRootfixStatus:"F2_LEGAL_READINESS_VALIDATOR_STALE_ROOTFIX_SOURCE_ONLY_PASS",request03Replayed:false,runtimeRunCreated:false}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$EVIDENCE_DIR/f2-legal-readiness-rootfix-source-only-v20260818.json"
      - name: Persist sanitized source-only evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-f2-legal-readiness-rootfix-bot'
          git config user.email 'orbit360-f2-legal-readiness-rootfix-bot@users.noreply.github.com'
          git add "$EVIDENCE_DIR/f2-legal-readiness-phase-aware-selftest-v20260818.json" "$EVIDENCE_DIR/f2-legal-readiness-rootfix-source-only-v20260818.json"
          git diff --cached --check
          git commit -m 'fix(f2): close legal readiness validator stale source-only [skip ci]'
          git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
