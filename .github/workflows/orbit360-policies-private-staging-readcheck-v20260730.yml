name: Orbit 360 · Policies private staging readcheck
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['.github/workflows/orbit360-policies-private-staging-readcheck-v20260730.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-private-staging-readcheck-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block7-policies-static-v20260730
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  DRIVE_FILE_ID: 1NXHACZ11815882AhoyGrQQCb9Amgbi95
  EXPECTED_FILE_SHA256: b63c5d10be40fcd4039be1b7844cafb0bf45c2a9904dd47ad65443b5fb43a89f
jobs:
  readcheck:
    name: Policies · private Drive staging read-only check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate estático antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .failed==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Descargar staging privado con cuenta de servicio y verificar hash
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{
            const sa=JSON.parse(process.env.SERVICE_ACCOUNT); if(sa.project_id!=='ays-orbit-360-lab') throw new Error('ENVIRONMENT_FAILURE:PROJECT_ID_MISMATCH');
            const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url'); const now=Math.floor(Date.now()/1000);
            const unsigned=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/drive.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});
            const sig=crypto.sign('RSA-SHA256',Buffer.from(unsigned),sa.private_key).toString('base64url');
            const body=new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+sig});
            const tokenResp=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body}); if(!tokenResp.ok) throw new Error('ENVIRONMENT_FAILURE:OAUTH_TOKEN_'+tokenResp.status);
            const token=(await tokenResp.json()).access_token; if(!token) throw new Error('ENVIRONMENT_FAILURE:OAUTH_TOKEN_EMPTY');
            const url=`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(process.env.DRIVE_FILE_ID)}?alt=media&supportsAllDrives=true`;
            const resp=await fetch(url,{headers:{authorization:`Bearer ${token}`}}); if(!resp.ok) throw new Error('ENVIRONMENT_FAILURE:DRIVE_READ_'+resp.status);
            const bytes=Buffer.from(await resp.arrayBuffer()),sha=crypto.createHash('sha256').update(bytes).digest('hex'); if(sha!==process.env.EXPECTED_FILE_SHA256) throw new Error('DATA_CONTRACT_FAILURE:STAGING_HASH_MISMATCH');
            const out={schemaVersion:'orbit360-private-staging-readcheck-v1',ok:true,driveFileIdHash:crypto.createHash('sha256').update(process.env.DRIVE_FILE_ID).digest('hex'),sha256:sha,bytes:bytes.length,serviceAccountEmailDigest:crypto.createHash('sha256').update(sa.client_email).digest('hex'),privateDriveRead:true,publicSharing:false,firestoreRead:false,firestoreWrites:0,operationalWrites:0,productionTouched:false,containsPII:false,containsSecrets:false};
            fs.mkdirSync(process.env.EVIDENCE_DIR,{recursive:true});fs.writeFileSync(process.env.EVIDENCE_DIR+'/policies-private-staging-readcheck.json',JSON.stringify(out,null,2)+'\n');
          })().catch(err=>{console.error(String(err&&err.message||err));process.exit(41);});
          NODE
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-private-staging-readcheck-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/policies-private-staging-readcheck.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK: orbit360-platform/runtime-gate-crm-v20260716/policies-private-staging-readcheck.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Private Drive staging readcheck failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.CHECK,'utf8'));if(p.ok===true&&p.privateDriveRead===true&&p.operationalWrites===0){state='success';description='Final private policy staging hash verified; zero operational writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-private-staging-readcheck',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
