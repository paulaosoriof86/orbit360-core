name: Orbit 360 · Gate 7.11 · compatibilidad router runtime

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-runtime-router-compat-run-v20260802.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-gate711-runtime-router-compat-v20260802
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 997fca628f95dd397dba347700a6bc644fe840f0
  REQUEST_FILE: .github/orbit360-static-requests/gate711-runtime-router-compat-run-v20260802.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  STATUS_CONTEXT: orbit360/gate711-runtime-router-compat

jobs:
  validate:
    name: Source-only · lifecycle vs router · sin credenciales
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publicar estado pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state pending --arg context "$STATUS_CONTEXT" --arg description "Compatibilidad lifecycle-router en ejecución" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status.json" >/dev/null

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar request y freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST_FILE")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST_FILE"
          jq -e '.schemaVersion=="orbit360-gate711-runtime-router-compat-request-v1" and .approved==true and .allowedExecutions==1 and .consumed==false and .priorRuntimeFailure.run==30772737476 and .priorRuntimeFailure.job==91562610825 and .priorRuntimeFailure.artifact==8841039787 and .priorRuntimeFailure.error=="CANONICAL_LIFECYCLE_REVISION_MISMATCH" and .priorRuntimeFailure.replayAllowed==false and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST_FILE" >/dev/null
          mapfile -t PRODUCT_DIFF < <(git diff --name-only "$PRODUCT_HEAD"..HEAD -- orbit360-platform/index.html orbit360-platform/modules orbit360-platform/core orbit360-platform/styles orbit360-platform/data)
          test "${#PRODUCT_DIFF[@]}" = '0'

      - name: Validar compatibilidad y package readiness
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate711-runtime-router-compat-v20260802.mjs
          node --check tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs
          node tools/orbit360-validar-gate711-runtime-router-compat-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_RUNTIME_ROUTER_COMPAT_PASS" and .classification=="GO_STATIC_RUNTIME_ROUTER_COMPAT" and .failed==0 and .priorRuntimeFailure.replayAllowed==false and .productFilesChanged==0 and .secretsAccessed==false and .firestoreReads==0 and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/gate711-runtime-router-compat-v20260802.json" >/dev/null
          node tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_RUNTIME_PACKAGE_READINESS_PASS" and .classification=="GO_STATIC_RUNTIME_PACKAGE_CRM_OPS_LEADS" and .total==38 and .passed==38 and .failed==0 and .packageInert==true and .authorizationActive==false and .secretsAccessed==false and .firestoreReads==0 and .firestoreWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/gate711-runtime-package-readiness-v20260802.json" >/dev/null

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate711-runtime-router-compat-v20260802
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-router-compat-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-package-readiness-v20260802.json
            tools/orbit360-gate711-release-critical-runtime-lifecycle-template-v20260802.json
            tools/orbit360-validar-gate711-runtime-router-compat-v20260802.mjs
          if-no-files-found: error
          retention-days: 14

      - name: Publicar estado final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then STATE=success; DESCRIPTION="Compatibilidad lifecycle-router PASS"; else STATE=failure; DESCRIPTION="Compatibilidad lifecycle-router FAIL / STOP_RETRY"; fi
          jq -n --arg state "$STATE" --arg context "$STATUS_CONTEXT" --arg description "$DESCRIPTION" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status-final.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status-final.json" >/dev/null
