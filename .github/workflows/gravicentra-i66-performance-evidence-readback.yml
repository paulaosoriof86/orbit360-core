# I6.6 read-only comparison of already-produced immutable Preview and LIVE reports.
name: Gravicentra I6.6 Preview vs LIVE Performance Evidence
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-performance-evidence-readback.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-sanitized-reports:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43123903063
          name: gi-i66-preview-performance-readonly
          github-token: ${{ github.token }}
          path: perf-preview
      - uses: actions/download-artifact@v4
        with:
          run-id: 43123902736
          name: gi-i66-live-performance-readonly
          github-token: ${{ github.token }}
          path: perf-live
      - name: Print read-only role-safe comparison with exact artifact provenance
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('perf-preview/gi-i66-preview-perf-summary.json','utf8'));
          const l=JSON.parse(fs.readFileSync('perf-live/gi-i66-live-perf-summary.json','utf8'));
          if(p.origin!=='https://ays-orbit-360-lab--gi-i66-rc-43123134271-5vsqe8fh.web.app'||
             l.origin!=='https://app.aysseguros.com'||
             p.status!=='PREVIEW_READONLY_MEASURED'||l.status!=='LIVE_READONLY_MEASURED'||
             p.auth.activation?.role!=='Operativo'||l.auth.activation?.role!=='Operativo'||
             p.firestoreWrites!==0||l.firestoreWrites!==0||p.paymentActions!==0||l.paymentActions!==0)
            throw Error('I66_PERFORMANCE_COMPARISON_PROVENANCE_OR_ROLE_DRIFT');
          const rows=l.routes.map(old=>{
            const now=p.routes.find(x=>x.route===old.route)||{};
            const lv=old.readyMs,pv=now.readyMs;
            return {route:old.route,liveMs:lv,previewMs:pv,
              improvementPct:lv&&pv!=null?Math.round((lv-pv)/lv*100):null,
              liveGetCalls:old.readStats?.get?.calls||0,previewGetCalls:now.readStats?.get?.calls||0,
              liveGetCostMs:old.readStats?.get?.totalMs||0,previewGetCostMs:now.readStats?.get?.totalMs||0};
          });
          const sample={
            comparison:'I66_APPROVED_SOURCE_867B0B0D75CF_READONLY',
            previewArtifactId:13901282950,
            previewArtifactSha256:'4ea8d37d0d3cc726cf8db8d031aef40bce8c0d7b94a0499eeaacfb37008d3f5a',
            expectedSource:'867b0b0d75cf236e65773b6aae090bab1d852f2b',
            auth:{liveActivateMs:l.auth.activation?.activateMs,previewActivateMs:p.auth.activation?.activateMs,
              livePageErrors:l.auth.pageErrors,previewPageErrors:p.auth.pageErrors,
              liveConsoleErrors:l.auth.consoleErrors,previewConsoleErrors:p.auth.consoleErrors},
            client360Detail:{liveMs:l.cliente360Detail?.detailMs,previewMs:p.cliente360Detail?.detailMs},
            mobile:{live:l.mobile,preview:p.mobile},
            globalTopbar:{liveFirstMs:l.globalTopbarSearch?.first?.timeMs,
              previewFirstMs:p.globalTopbarSearch?.first?.timeMs,
              liveSecondMs:l.globalTopbarSearch?.second?.timeMs,
              previewSecondMs:p.globalTopbarSearch?.second?.timeMs,
              liveProjectionCalls:l.globalTopbarTiming?.projection?.calls,
              previewProjectionCalls:p.globalTopbarTiming?.projection?.calls,
              previewEnter:p.globalTopbarKeyboard},
            routes:rows,
            cpuCloneCallers:{
              liveRenovaciones:l.cpuProfiles?.renovaciones?.cloneCallers?.slice(0,3),
              previewRenovaciones:p.cpuProfiles?.renovaciones?.cloneCallers?.slice(0,3),
              liveAseguradoras:l.cpuProfiles?.aseguradoras?.cloneCallers?.slice(0,3),
              previewAseguradoras:p.cpuProfiles?.aseguradoras?.cloneCallers?.slice(0,3)
            }
          };
          console.log('I66_PREVIEW_VS_LIVE_SANITIZED_PERFORMANCE='+JSON.stringify(sample));
          console.log('I66_PREVIEW_VS_LIVE_SOURCE_AND_READ_ONLY_PROVENANCE_PASS');
          if(p.auth.pageErrors!==0||p.mobile.menuOpen!==true)throw Error('I66_PREVIEW_BROWSER_P0_REGRESSION');
          if(!p.globalTopbarSearch?.ready||!l.globalTopbarSearch?.ready||
             p.globalTopbarSearch.first.timeMs>=2200||p.globalTopbarSearch.second.timeMs>=1000||
             p.globalTopbarTiming?.projection?.calls!==0||
             (p.auth.consoleErrors||0)>(l.auth.consoleErrors||0)||
             !p.globalTopbarKeyboard?.ready||!p.globalTopbarKeyboard?.activated||
             !p.globalTopbarKeyboard?.fieldCleared||!p.globalTopbarKeyboard?.dropdownClosed||
             !p.globalTopbarKeyboard?.defaultPrevented)
             throw Error('I66_APPROVED_GLOBAL_TOPBAR_ENTER_OR_PERFORMANCE_HOLD');
          console.log('I66_REAL_CHROME_GLOBAL_TOPBAR_ENTER_COLD_SEARCH_LATENCY_AND_NO_REPROJECTION_PASS');
          // The previously optimized Renovaciones is already LIVE. Compare
          // against that CURRENT baseline, never claim another 94% gain.
          for(const route of ['renovaciones','cobros','polizas','aseguradoras']){
            const r=rows.find(x=>x.route===route);
            if(!r||!Number.isFinite(r.previewMs)||!Number.isFinite(r.liveMs)||
               r.previewMs>Math.max(r.liveMs*3,r.liveMs+600))
              throw Error('I66_TARGETED_PREVIEW_SEVERE_PERFORMANCE_REGRESSION_'+route);
          }
          console.log('I66_TARGETED_CURRENT_LIVE_VS_PREVIEW_PERFORMANCE_NO_SEVERE_REGRESSION_PASS');
          console.log('I66_AUTH_INITIAL_ACTIVATION_SINGLE_SAMPLE_VARIANCE_HOLD='+String(p.auth.activation?.activateMs||''));
          console.log('I66_CONCILIACIONES_READINESS_UNCERTAIN_HOLD='+String(rows.find(x=>x.route==='conciliaciones')?.previewMs));
          NODE
