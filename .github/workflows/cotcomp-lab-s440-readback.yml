name: CotComp S4.40 LAB readback recovery

on:
  push:
    branches:
      - ays/cotcomp-lab-runtime-s440-20260930
    paths:
      - '.github/cotcomp-lab-intents/s440-readback.json'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_ENVIRONMENT: LAB
  COTCOMP_REGION: us-central1
  DEPLOYED_SOURCE_SHA: 17d599e884d5b834b73b9499d8cef177575d56f9
  SOURCE_ARTIFACT_ID: '11119533069'
  SOURCE_ARTIFACT_DIGEST: 9d50a9b8fca53a9971811f5cae663109e602ec028129c6dede8f5adcc539e838
  COTCOMP_OWNER_BLOB: 73e09a4404cb4298dc34c9c38e26ad1f960d3170

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify readback intent and deployed source identity
        shell: bash
        run: |
          set -euo pipefail
          INTENT=.github/cotcomp-lab-intents/s440-readback.json
          jq -e '
            .authorization == "READBACK_ALREADY_DEPLOYED_S440_LAB" and
            .projectId == "ays-orbit-360-lab" and
            .deployedSourceSha == "17d599e884d5b834b73b9499d8cef177575d56f9" and
            .deployRunId == 36763893708 and
            .writes == false and
            .realData == false and
            .production == false
          ' "$INTENT" >/dev/null
          git cat-file -e "$DEPLOYED_SOURCE_SHA^{commit}"
          test "$(git rev-parse "$DEPLOYED_SOURCE_SHA":functions/ops-leads-domain.js)" = "$COTCOMP_OWNER_BLOB"

      - name: Prepare Firebase LAB credentials
        shell: bash
        run: |
          set -euo pipefail
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/firebase-cotcomp-s440-readback.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.32.0
          firebase --version

      - name: Read back deployed function inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cotcomp-readback"
          firebase functions:list --project "$COTCOMP_PROJECT_ID" --json > "$RUNNER_TEMP/cotcomp-readback/functions-list.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/functions-list.json','utf8'));
          const expected=['cotcompValidateDraft','cotcompSubmitHandoff','cotcompFetchComparableProposals','cotcompSelectProposal'];
          const records={};
          function normName(s){ return String(s||'').split('/').pop(); }
          function walk(v){
            if(Array.isArray(v)){ for(const x of v) walk(x); return; }
            if(!v || typeof v!=='object') return;
            const candidates=[v.id,v.name,v.entryPoint,v.function,v.functionName].filter(Boolean);
            for(const cand of candidates){
              const n=normName(cand);
              if(expected.includes(n)){
                let region=v.region||v.regionId||v.location||v.locationId||null;
                const full=String(v.name||'');
                const m=full.match(/\/locations\/([^/]+)\/functions\//);
                if(!region && m) region=m[1];
                records[n]={
                  name:n,
                  region,
                  state:v.state||v.status||null,
                  platform:v.platform||v.generation||null,
                  runtime:v.runtime||v.runtimeId||null
                };
              }
            }
            for(const x of Object.values(v)) walk(x);
          }
          walk(raw);
          for(const n of expected){
            if(!records[n]) throw new Error('DEPLOYED_FUNCTION_NOT_FOUND:'+n);
            if(records[n].region && records[n].region!=='us-central1') throw new Error('REGION_MISMATCH:'+n+':'+records[n].region);
          }
          const found=Object.keys(records).sort();
          if(found.length!==4) throw new Error('COTCOMP_FUNCTION_COUNT_MISMATCH:'+found.join(','));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/function-readback.json',
            JSON.stringify({exact:true,expected,records},null,2));
          NODE

      - name: Verify deployed source security configuration
        shell: bash
        run: |
          set -euo pipefail
          git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-runtime-entry-s438.js" > "$RUNNER_TEMP/cotcomp-readback/runtime-entry-deployed.js"
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/runtime-entry-deployed.js','utf8');
          const expected=[
            ['cotcompValidateDraft',false],
            ['cotcompSubmitHandoff',true],
            ['cotcompFetchComparableProposals',false],
            ['cotcompSelectProposal',true]
          ];
          for(const [name,consume] of expected){
            const i=source.indexOf('const '+name+' = onCall');
            if(i<0) throw new Error('SOURCE_CALLABLE_MISSING:'+name);
            const block=source.slice(i,i+520);
            if(!block.includes('enforceAppCheck: true')) throw new Error('APP_CHECK_MISSING:'+name);
            if(!block.includes('consumeAppCheckToken: '+consume)) throw new Error('REPLAY_CONFIG_MISMATCH:'+name);
            if(!block.includes("region: 'us-central1'")) throw new Error('REGION_SOURCE_MISMATCH:'+name);
          }
          if(!source.includes('SYNTHETIC_PROOF_ONLY')) throw new Error('SYNTHETIC_ONLY_GATE_MISSING');
          if(/firebase-admin|firestore|cotcomp-persistence|ops-leads-domain/i.test(source)) throw new Error('FORBIDDEN_DATA_DEPENDENCY');
          NODE

      - name: Build S4.39 readback receipt
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git rev-parse "$DEPLOYED_SOURCE_SHA^{tree}")"
          BACKEND_DIGEST="$(
            {
              git show "$DEPLOYED_SOURCE_SHA:functions/bootstrap.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-runtime-entry-s438.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-callable-handlers.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-callable-policy.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-gateway-harness.js"
            } | sha256sum | awk '{print $1}'
          )"
          node <<'NODE'
          const fs=require('fs');
          const fnReadback=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/function-readback.json','utf8'));
          const readback={
            projectId:'ays-orbit-360-lab',
            environment:'LAB',
            region:'us-central1',
            functionNames:['cotcompValidateDraft','cotcompSubmitHandoff','cotcompFetchComparableProposals','cotcompSelectProposal'],
            appCheck:{
              cotcompValidateDraft:true,
              cotcompSubmitHandoff:true,
              cotcompFetchComparableProposals:true,
              cotcompSelectProposal:true
            },
            replayProtection:{
              cotcompValidateDraft:false,
              cotcompSubmitHandoff:true,
              cotcompFetchComparableProposals:false,
              cotcompSelectProposal:true
            },
            persistenceEnabled:false,
            writesExpected:0,
            syntheticOnly:true,
            productionTouched:false,
            dataTouched:false,
            writesExecuted:0
          };
          const receipt={
            sourceSha:process.env.DEPLOYED_SOURCE_SHA,
            sourceTree:process.env.SOURCE_TREE,
            runId:'36763893708',
            artifactId:process.env.SOURCE_ARTIFACT_ID,
            artifactDigest:process.env.SOURCE_ARTIFACT_DIGEST,
            backendSourceDigest:process.env.BACKEND_DIGEST,
            workflowOwnerBlob:process.env.COTCOMP_OWNER_BLOB,
            receiptPath:'github-actions/run/36763893708 + readback/'+process.env.GITHUB_RUN_ID,
            readback
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/s440-receipt-input.json',JSON.stringify(receipt,null,2));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/s440-readback-evidence.json',JSON.stringify({
            deployedSourceSha:process.env.DEPLOYED_SOURCE_SHA,
            deployRunId:36763893708,
            sourceArtifactId:process.env.SOURCE_ARTIFACT_ID,
            sourceArtifactDigest:process.env.SOURCE_ARTIFACT_DIGEST,
            backendSourceDigest:process.env.BACKEND_DIGEST,
            functionInventory:fnReadback,
            sourceSecurityConfigVerified:true,
            appDataWritesExecuted:0,
            realDataUsed:false,
            productionTouched:false,
            cleanupPolicyWarningObserved:true
          },null,2));
          NODE
        env:
          SOURCE_TREE: ${{ env.SOURCE_TREE }}
          BACKEND_DIGEST: ${{ env.BACKEND_DIGEST }}

      - name: Validate S4.39 contract against receipt
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git rev-parse "$DEPLOYED_SOURCE_SHA^{tree}")"
          BACKEND_DIGEST="$(
            {
              git show "$DEPLOYED_SOURCE_SHA:functions/bootstrap.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-runtime-entry-s438.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-callable-handlers.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-callable-policy.js"
              git show "$DEPLOYED_SOURCE_SHA:functions/cotcomp-gateway-harness.js"
            } | sha256sum | awk '{print $1}'
          )"
          export SOURCE_TREE BACKEND_DIGEST
          node <<'NODE'
          const fs=require('fs');
          const receipt=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/s440-receipt-input.json','utf8'));
          receipt.sourceTree=process.env.SOURCE_TREE;
          receipt.backendSourceDigest=process.env.BACKEND_DIGEST;
          const contract=require('./functions/cotcomp-lab-proof-receipt-s439');
          const state=contract.validateReceipt(receipt);
          if(!state.ok) throw new Error('S439_RECEIPT_INVALID:'+state.reasons.join(','));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/cotcomp-readback/s440-proof-receipt.json',JSON.stringify({
            ...receipt,
            contractValidation:{ok:true,reasons:[]},
            runtimeReadbackObserved:true,
            deployed:true,
            appDataWritesExecuted:0,
            realDataUsed:false,
            productionTouched:false
          },null,2));
          NODE

      - name: Upload readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s440-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/cotcomp-readback/
          if-no-files-found: error
          retention-days: 30
