name: Orbit 360 · Validar transporte base SHA v10 · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-runtime-transport-base-sha-source-only:
    if: github.head_ref == 'ays/sourcefix-v10-transport-base-ref-stop-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact sourcefix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and synthetic transport contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validate-runtime-transport-context-v20260806.mjs
          node --check tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs
          node --check tools/orbit360-test-preflight-portable-source-v20260806.mjs
          bash -n tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v4-transport-base-sha-v20260806.sh
          bash -n tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v3-cross-runner-v20260806.sh
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs

      - name: Assert sourcefix PASS and STOP boundaries
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/runtime-transport-base-sha-source-test-sanitized-v20260806.json', 'utf8'));
          const overlay = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json', 'utf8'));
          const lifecycle = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json', 'utf8'));
          const request = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json', 'utf8'));
          const ok =
            source.status === 'PASS_RUNTIME_TRANSPORT_BASE_SHA_SOURCE_ONLY' && source.failed === 0 && source.ok === true &&
            source.secretAccess === false && source.firebaseAccess === false && source.browserExecuted === false && source.deployExecuted === false && source.writes === 0 &&
            overlay.stopRetryActive === true && overlay.runtimeAllowed === false && overlay.hostingAllowed === false && overlay.requestReusable === false &&
            lifecycle.status === 'STOP_RETRY_V10_TRANSPORT_BASE_REF_MISMATCH' && lifecycle.allowedExecutions === 0 && lifecycle.authorizationFrozen === true && lifecycle.stopRetryActive === true &&
            lifecycle.protectedState.priorV6BackupRestoredBeforeRuntime === true && lifecycle.protectedState.hostingState === 'RESTORED_TO_VISUAL_MATRIX_CORRECTED_BACKUP_31116830824' &&
            request.status === 'CONSUMED_STOP_RETRY_TRANSPORT_BASE_REF_MISMATCH' && request.allowedExecutions === 0 && request.consumed === true && request.authorizationFrozen === true && request.replayAllowed === false;
          if (!ok) process.exit(41);
          console.log(JSON.stringify({status:source.status,total:source.total,passed:source.passed,failed:source.failed,stopRetry:true,runtimeExecuted:false,secretsRead:false,deployExecuted:false,ok:true}, null, 2));
          NODE
