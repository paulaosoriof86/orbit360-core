name: CotComp S4.73 vehicle risk identity catalog source-only

on:
  push:
    branches:
      - ays/cotcomp-s473-risk-identity-catalog-sourceonly-20261002
    paths:
      - '.github/cotcomp-lab-intents/s473-risk-identity-catalog-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s473-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.73 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s473-risk-identity-catalog-sourceonly.json
          jq -e '
            .authorization=="S473_RISK_IDENTITY_CATALOG_SOURCEONLY" and
            .projectId=="ays-orbit-360-lab" and
            .tenantId=="alianzas-soluciones" and
            .journeyId=="GT_AUTO_MOTO_HYBRID" and
            .appDataReads==false and
            .appDataWrites==false and
            .deployment==false and
            .providerOrRater==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.73 safeguards
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-vehicle-risk-identity-s473.js
          node --check cotcomp-vehicle-risk-identity-s473.test.js
          node --test cotcomp-vehicle-risk-identity-s473.test.js
          node --test cotcomp-real-quote-corpus-s471.test.js

      - name: Generate sanitized S4.73 receipt
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s473"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./cotcomp-vehicle-risk-identity-s473');
          const c=require('./cotcomp-real-quote-corpus-s471');
          const r=s.readiness();
          const cs=c.summary();
          if(!r.canonicalW5IdentityReady)throw new Error('S473_CANONICAL_W5_IDENTITY_NOT_READY');
          if(r.currentW5EvidenceCode!=='MATCHING_REAL_PROPOSAL_EVIDENCE_REQUIRED')throw new Error('S473_W5_EVIDENCE_TRUTH_INVALID');
          if(r.currentW5CorpusMatchCount!==0||cs.currentW5Clusters!==0)throw new Error('S473_STALE_W5_CORPUS_ASSOCIATION');
          if(!r.dropdownControlContractReady||!r.yearSeparated||r.primaryFreeTextBrandModelAllowed)throw new Error('S473_CONTROL_CONTRACT_INVALID');
          if(r.authoritativeVehicleCatalogReady||r.publicDropdownReleaseReady)throw new Error('S473_FALSE_CATALOG_RELEASE');
          if(r.releaseBlocker!=='AUTHORITATIVE_VEHICLE_CATALOG_REQUIRED')throw new Error('S473_RELEASE_BLOCKER_INVALID');
          if(r.appDataReads!==0||r.appDataWrites!==0||r.productionTouched||r.providerOrRaterCalls!==0)throw new Error('S473_BOUNDARY_INVALID');
          const receipt={
            schemaVersion:'ays-cotcomp-s473-risk-identity-catalog-sourceonly-receipt-v1.0',
            sourceSha:process.env.GITHUB_SHA,
            canonicalW5Risk:r.canonicalW5Risk,
            currentW5CorpusMatchCount:0,
            currentW5EvidenceCode:r.currentW5EvidenceCode,
            staleYarisW5MarkerRetired:true,
            corpusCurrentW5Clusters:0,
            dropdownControlContractReady:true,
            brandControl:'searchable-select',
            modelControl:'searchable-select',
            yearControl:'select',
            yearSeparated:true,
            primaryFreeTextBrandModelAllowed:false,
            backwardCompatibilityBridgeReady:true,
            evidenceFixtureCatalogReady:true,
            evidenceFixtureCatalogAuthoritative:false,
            authoritativeVehicleCatalogReady:false,
            publicDropdownReleaseReady:false,
            releaseBlocker:'AUTHORITATIVE_VEHICLE_CATALOG_REQUIRED',
            appDataReads:0,
            appDataWrites:0,
            deployment:false,
            providerOrRaterCalls:0,
            productionTouched:false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s473/S473_RISK_IDENTITY_CATALOG_SOURCEONLY_RECEIPT.json',JSON.stringify(receipt,null,2));
          NODE

      - name: Upload sanitized S4.73 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s473-risk-identity-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/s473/S473_RISK_IDENTITY_CATALOG_SOURCEONLY_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
