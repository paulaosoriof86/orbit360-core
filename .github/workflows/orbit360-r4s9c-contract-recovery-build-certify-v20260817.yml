name: Orbit360 R4S9C contract-only recovery build certify 20260817

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4s9c-contract-recovery-build-certify-v20260817.yml'
      - 'tools/orbit360-r4s9c-manifest-contract-gate-v20260817.mjs'
      - 'tools/orbit360-r4s9c-contract-recovery-builder-v20260817.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit360-r4s9c-contract-recovery-build-certify-v20260817
  cancel-in-progress: false

env:
  R4S8_ARTIFACT_ID: '9296206724'
  R4S8_INNER_NAME: 'orbit360-fase-a-product-r4s8-2427d94758c6.zip'
  R4S8_ZIP_SHA256: '265fcac34f436ddf28bba58dc63a9146301e49ded7e26faeac50adf86d5790da'
  R4S8_STATUS: 'FASE_A_PRODUCT_R4S8_MINIMAL_SUCCESSOR_CERTIFIED'
  R4S8_ARTIFACT_ZIP: '/tmp/r4s8-artifact.zip'
  R4S9_ARTIFACT_ID: '9299097141'
  R4S9_INNER_NAME: 'orbit360-fase-a-product-r4s9-861326906558.zip'
  R4S9_ZIP_SHA256: '9e8566fdc33f4f45b350fd3609c9ee02b22c49edd1d377bff334fc00df902180'
  R4S9_SOURCE_HEAD: '861326906558f03d9c8c2e7f34adfb4979a17d73'
  R4S9_STATUS: 'FASE_A_PRODUCT_R4S9_MINIMAL_SUCCESSOR_CERTIFIED'
  R4S9_ARTIFACT_ZIP: '/tmp/r4s9-artifact.zip'
  SUCCESSOR_STATUS: 'FASE_A_PRODUCT_R4S9C_CONTRACT_RECOVERY_CERTIFIED'
  SUCCESSOR_ZIP: 'orbit360-fase-a-product-r4s9c-contract-recovery-861326906558.zip'
  EVIDENCE_DIR: 'orbit360-platform/runtime-gate-crm-v20260716'

jobs:
  contract-recovery-source-package-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical gate before recovery
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Prove contract gate source-only catches every dropped field
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-r4s9c-manifest-contract-gate-v20260817.mjs
          node --check tools/orbit360-r4s9c-contract-recovery-builder-v20260817.mjs
          ORBIT360_R4S9C_GATE_OUT="$EVIDENCE_DIR/r4s9c-manifest-contract-gate-selftest-v20260817.json" \
            node tools/orbit360-r4s9c-manifest-contract-gate-v20260817.mjs --self-test
          jq -e '.ok==true and .status=="R4S9C_MANIFEST_CONTRACT_GATE_SELFTEST_PASS" and .classification=="DATA_CONTRACT_FAILURE_ROOTFIX_SOURCE_PROVEN" and .missingFieldProbesDetected==19 and .expectedMissingFieldProbeCount==19 and .allDroppedFieldsCovered==true and .invariantMutationProbesDetected==12 and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/r4s9c-manifest-contract-gate-selftest-v20260817.json" >/dev/null

      - name: Download exact durable R4S8 rector and R4S9 product base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R4S8_ARTIFACT_ID}/zip" \
            -o "$R4S8_ARTIFACT_ZIP"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R4S9_ARTIFACT_ID}/zip" \
            -o "$R4S9_ARTIFACT_ZIP"

      - name: Build contract-only successor and fully certify 194/194 product identity
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-r4s9c-contract-recovery-builder-v20260817.mjs
          jq -e '.ok==true and .status=="R4S9C_CONTRACT_RECOVERY_DURABLE_CERTIFIED" and .classification=="DATA_CONTRACT_FAILURE_ROOTFIX_CERTIFIED" and .manifestStatus==env.SUCCESSOR_STATUS and .sourceHead==env.R4S9_SOURCE_HEAD and .fileCount==194 and .productBaseArtifactId==9299097141 and .productBaseZipSha256==env.R4S9_ZIP_SHA256 and .rectorArtifactId==9296206724 and .productFilesByteIdentical==194 and .productDeltaCount==0 and .packageDeltaPaths==["orbit360-package-manifest.json"] and .restoredContractFieldCount==19 and .contractGatePass==true and .runtimeClosurePass==true and .baseFullyRehashed==true and .productBaseFullyRehashed==true and .packageReopened==true and .allProductFilesRehashed==true and .containsPrivateSecrets==false and .noLabRuntime==true and .noPrivateSecretMaterial==true and .writeAuthorized==false and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/r4s9c-contract-recovery-certification-v20260817.json" >/dev/null
          jq -e '.ok==true and .status=="R4S9C_STATIC_CONTRACT_RECOVERY_PASS" and .productFileCount==194 and .productFilesByteIdentical==194 and .productDeltaCount==0 and .packageDeltaCount==1 and .packageDeltaPaths==["orbit360-package-manifest.json"] and .contractFieldCount==19 and .contractGatePass==true and .runtimeClosurePass==true' "$EVIDENCE_DIR/r4s9-to-r4s9c-static-compare-v20260817.json" >/dev/null
          jq -e '.ok==true and .status=="R4S9C_MANIFEST_CONTRACT_GATE_PASS" and .requiredFieldCount==19 and (.missingFields|length)==0 and (.invariantMismatches|length)==0 and (.semanticErrors|length)==0 and .runtimeClosurePass==true' "$EVIDENCE_DIR/r4s9c-manifest-contract-gate-v20260817.json" >/dev/null

      - name: Canonical gate after recovery proof
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: orbit360-fase-a-product-r4s9c-contract-recovery-durable-${{ github.run_id }}
          path: ${{ env.SUCCESSOR_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s9c-contract-recovery-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s9c-manifest-contract-gate-selftest-v20260817.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s9c-manifest-contract-gate-v20260817.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s9c-contract-recovery-certification-v20260817.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s9-to-r4s9c-static-compare-v20260817.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s9c-successor-zip-sha256-v20260817.txt
          if-no-files-found: warn
          retention-days: 30
