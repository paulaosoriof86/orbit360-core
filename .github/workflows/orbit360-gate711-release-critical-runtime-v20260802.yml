name: Orbit 360 · Gate 7.11 · runtime crítico CRM Ops Leads

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/gate711-release-critical-runtime-v20260802.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-gate711-release-critical-runtime-v20260802
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block7-canonical-runtime-cumulative-visual-lab-v20260801
  ORBIT360_BASE_CONTRACT_VERSION: 7.11.0
  ORBIT360_SCOPE_REVISION: 7.11.1
  ORBIT360_PRODUCT_HEAD: 997fca628f95dd397dba347700a6bc644fe840f0
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/gate711-release-critical-runtime-v20260802.json
  ORBIT360_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-gate711-release-critical-runtime-v20260802.json
  ORBIT360_CANONICAL_REQUEST_FILE: .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json
  ORBIT360_CANONICAL_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-v20260801.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  STATUS_CONTEXT: orbit360/gate711-release-critical-runtime

jobs:
  validate:
    name: Una sesión · CRM Ops Leads · read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publicar estado observable pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state pending \
            --arg context "$STATUS_CONTEXT" \
            --arg description "Gate 7.11 CRM Ops Leads runtime en ejecución" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status.json"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d @"$RUNNER_TEMP/status.json" >/dev/null

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar autorización inmutable y freeze antes de secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$ORBIT360_LIFECYCLE_FILE"
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$ORBIT360_REQUEST_FILE")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          mapfile -t PRODUCT_DIFF < <(git diff --name-only "$ORBIT360_PRODUCT_HEAD"..HEAD -- \
            orbit360-platform/index.html \
            orbit360-platform/modules \
            orbit360-platform/core \
            orbit360-platform/styles \
            orbit360-platform/data)
          test "${#PRODUCT_DIFF[@]}" = '0'
          jq -e --arg gate "$ORBIT360_GATE_ID" --arg base "$ORBIT360_BASE_CONTRACT_VERSION" --arg scope "$ORBIT360_SCOPE_REVISION" --arg product "$ORBIT360_PRODUCT_HEAD" '
            .schemaVersion=="orbit360-canonical-runtime-cumulative-visual-lab-request-v1" and
            .gateId==$gate and
            .contractVersion==$base and
            .releaseCriticalScopeRevision==$scope and
            .authorizedProductHead==$product and
            .approved==true and
            .allowedExecutions==1 and
            .consumed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and
            .pullRequest==5 and
            .projectId=="ays-orbit-360-lab" and
            .tenantId=="alianzas-soluciones" and
            .canonicalSnapshotDigest=="19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b" and
            .staticClosureEvidence.run==30771933766 and
            .staticClosureEvidence.job==91560447718 and
            .staticClosureEvidence.artifact==8840787308 and
            .staticClosureEvidence.status=="GATE711_RELEASE_CRITICAL_STATIC_PASS" and
            .staticClosureEvidence.checks=="38/38" and
            .staticClosureEvidence.productFreeze=="PASS" and
            .staticClosureEvidence.academiaRuntimePrerequisite==false and
            .staticClosureEvidence.cloudPackageSent==false and
            .macroSequence.singleBrowserSession==true and
            .macroSequence.legalOnce==true and
            .macroSequence.focusedAcademiaRuntime==false and
            .scope.exactCheckoutLocalServe==true and
            .scope.snapshotBeforeAfter==true and
            .scope.browserWriteGuard==true and
            .scope.roles==3 and
            .scope.viewports==3 and
            .scope.routes==3 and
            .scope.sanitizedScreenshots==true and
            .scope.singleCumulativeVisualReview==true and
            .releaseCriticalScope.expectedSanitizedScreenshots==14 and
            .releaseCriticalScope.academiaContentCompletenessBlocksRelease==false and
            .identity.existingOnly==true and
            .identity.createUser==false and
            .identity.updateUser==false and
            .identity.customTokenEphemeral==true and
            .capabilities.secrets==true and
            .capabilities.firestoreRead==true and
            .capabilities.writes==false and
            .capabilities.runtime==true and
            .capabilities.browser==true and
            .capabilities.deploy==false and
            .capabilities.production==false and
            .stopRetryOnSameStageOrFamily==true
          ' "$ORBIT360_REQUEST_FILE" >/dev/null
          AUTH_REF="$(jq -r '.authorizationRef' "$ORBIT360_REQUEST_FILE")"
          test -n "$AUTH_REF"
          test "$AUTH_REF" != 'PENDING_NEW_EXPLICIT_AUTHORIZATION'
          jq -e --arg gate "$ORBIT360_GATE_ID" --arg base "$ORBIT360_BASE_CONTRACT_VERSION" --arg scope "$ORBIT360_SCOPE_REVISION" --arg product "$ORBIT360_PRODUCT_HEAD" --arg auth "$AUTH_REF" '
            .schemaVersion=="orbit360-validator-lifecycle-contract-v1" and
            .gateId==$gate and
            .gateContractVersion==$base and
            .releaseCriticalScopeRevision==$scope and
            .status=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_AUTHORIZED" and
            .sourceLock.productHead==$product and
            .executionProfile.phase=="LAB_RUNTIME_GATE" and
            .authorization.authorizationRef==$auth and
            .authorization.explicit==true and
            .authorization.allowedExecutions==1 and
            .authorization.consumed==false and
            .authorization.macroBlockWithoutMicroAuthorizations==true and
            .staticClosureEvidence.run==30771933766 and
            .staticClosureEvidence.status=="GATE711_RELEASE_CRITICAL_STATIC_PASS_CLOSED" and
            .scope.singleBrowserSession==true and
            .scope.legalOnce==true and
            .scope.focusedAcademiaRuntime==false and
            .scope.academiaContentCompletenessBlocksRelease==false and
            .guards.firestoreDataWritesAllowed==false and
            .guards.operationalWritesAllowed==0 and
            .guards.reimportAllowed==false and
            .guards.hostingDeployAllowed==false and
            .guards.previewDeployAllowed==false and
            .guards.productionAllowed==false and
            .guards.stopRetryOnSameStageOrFailureFamily==true
          ' "$ORBIT360_LIFECYCLE_FILE" >/dev/null

      - name: Gate contractual obligatorio antes de secrets
        shell: bash
        run: |
          set -euo pipefail
          cp "$ORBIT360_REQUEST_FILE" "$ORBIT360_CANONICAL_REQUEST_FILE"
          cp "$ORBIT360_LIFECYCLE_FILE" "$ORBIT360_CANONICAL_LIFECYCLE_FILE"
          cmp -s "$ORBIT360_REQUEST_FILE" "$ORBIT360_CANONICAL_REQUEST_FILE"
          cmp -s "$ORBIT360_LIFECYCLE_FILE" "$ORBIT360_CANONICAL_LIFECYCLE_FILE"
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs
          node --check tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs
          node --check tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_READY" and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .runtimeAuthorized==true and .browserAuthorized==true and .deployAuthorized==false and .productionAuthorized==false and .failed==0 and .operationalWrites==0' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_RELEASE_CRITICAL_STATIC_PASS" and .classification=="GO_STATIC_RELEASE_CRITICAL_CRM_OPS_LEADS" and .total==38 and .passed==38 and .failed==0 and .academiaRuntimePrerequisite==false and .cloudPackageSent==false and .firestoreReads==0 and .firestoreWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/gate711-release-critical-static-v20260802.json" >/dev/null

      - name: Instalar dependencias controladas
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 firebase@11 google-auth-library@9 playwright@1.52.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Resolver identidad de servicio LAB
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-gate711-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_PROJECT_ID=$ORBIT360_PROJECT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_TENANT_ID=$ORBIT360_TENANT_ID" >> "$GITHUB_ENV"

      - name: Preparar identidad existente read-only
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/orbit360-gate711-browser-token.txt"
          CONFIG_FILE="$GITHUB_WORKSPACE/orbit360-platform/core/auth-firebase.config.local.js"
          node tools/orbit360-preparar-identidad-browser-canonica-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="CANONICAL_BROWSER_EXISTING_IDENTITY_READY" and .classification=="GO_LAB_EXISTING_IDENTITY_READONLY" and .eligibleExistingIdentityCount==1 and .uidMatched==true and .emailMatched==true and .customTokenCreatedEphemeral==true and .authWrites==0 and .firestoreWrites==0 and .operationalWrites==0 and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/canonical-browser-identity-readonly-v20260801.json" >/dev/null
          test -s "$TOKEN_FILE"
          test -s "$CONFIG_FILE"
          echo "ORBIT360_CUSTOM_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_LOCAL_FIREBASE_CONFIG_FILE=$CONFIG_FILE" >> "$GITHUB_ENV"

      - name: Snapshot canónico inicial
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-revalidar-policies-full-canonical-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="POLICIES_FULL_CANONICAL_REVALIDATION_READONLY_PASS" and .digests.canonicalDigestSealed=="19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b" and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" >/dev/null
          cp "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" "$EVIDENCE_DIR/gate711-release-critical-before-v20260802.json"

      - name: Servir checkout exacto sin deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory orbit360-platform >"$RUNNER_TEMP/orbit360-http.log" 2>&1 &
          SERVER_PID=$!
          echo "ORBIT360_SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173/index.html" >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS "http://127.0.0.1:4173/index.html" >/dev/null
          echo "ORBIT360_BASE_URL=http://127.0.0.1:4173/index.html?orbitBackend=firestore-lab&tenant=alianzas-soluciones#/inicio" >> "$GITHUB_ENV"

      - name: Ejecutar una sola sesión CRM Ops Leads
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_RELEASE_CRITICAL_RUNTIME_PASS" and .classification=="GO_LAB_RELEASE_CRITICAL_CRM_OPS_LEADS" and .authMode=="existing_custom_token_readonly" and .checks.existingIdentity==true and .checks.legalOneClick==true and .checks.legalSettledBeforeWriteGuard==true and .checks.storeContract==true and .checks.dataset==true and .checks.singleReadOwner==true and .checks.roles==true and .checks.crmRoutes==true and .checks.ops==true and .checks.leads==true and .checks.advisorOpsRestricted==true and .checks.responsive==true and .checks.noTechnicalCopy==true and .checks.writeGuard==true and .checks.sanitizedScreenshots==true and .dataset.operational.clientes==430 and .dataset.operational.aseguradoras==30 and .dataset.operational.polizas==1373 and .dataset.operational.vehiculos==1032 and .dataset.operational.recibosEsperados==1294 and .dataset.operational.carteraPrimas==673 and .dataset.operational.cobros==5 and .dataset.operational.asesores==7 and ((.store.apiMissing|length)==0) and .store.singleReadOwner==true and .store.canonicalReadModel==true and ((.writeGuard.calls|length)==0) and ((.browserDiagnostics.pageErrors|length)==0) and ((.screenshots|length)==14) and .academia.focusedRuntimePrerequisite==false and .academia.contentCompletenessBlocksRelease==false and .cloudPackageSent==false and .firestoreWrites==0 and .operationalWrites==0 and .reimportExecuted==false and .hostingDeploy==false and .previewDeploy==false and .production==false and .containsPII==false and .containsDocumentIds==false and .containsValues==false and .containsSecrets==false' "$EVIDENCE_DIR/gate711-release-critical-runtime-v20260802.json" >/dev/null

      - name: Snapshot final y comparación exacta
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-revalidar-policies-full-canonical-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="POLICIES_FULL_CANONICAL_REVALIDATION_READONLY_PASS" and .digests.canonicalDigestSealed=="19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b" and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" >/dev/null
          cp "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" "$EVIDENCE_DIR/gate711-release-critical-after-v20260802.json"
          test "$(jq -r '.digests.sourceSnapshotDigest' "$EVIDENCE_DIR/gate711-release-critical-before-v20260802.json")" = "$(jq -r '.digests.sourceSnapshotDigest' "$EVIDENCE_DIR/gate711-release-critical-after-v20260802.json")"
          test "$(jq -r '.digests.targetSnapshotDigest' "$EVIDENCE_DIR/gate711-release-critical-before-v20260802.json")" = "$(jq -r '.digests.targetSnapshotDigest' "$EVIDENCE_DIR/gate711-release-critical-after-v20260802.json")"

      - name: Guardar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate711-release-critical-runtime-v20260802
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-release-critical-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-browser-identity-readonly-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-release-critical-before-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-release-critical-runtime-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-release-critical-after-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/visual-sanitized-gate711-release-critical-v20260802/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Limpiar archivos temporales
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${ORBIT360_SERVER_PID:-}" ]; then kill "$ORBIT360_SERVER_PID" 2>/dev/null || true; fi
          rm -f "${ORBIT360_TEMP_KEY_FILE:-}" "${ORBIT360_CUSTOM_TOKEN_FILE:-}" "${ORBIT360_LOCAL_FIREBASE_CONFIG_FILE:-}"

      - name: Publicar estado observable final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION="Gate 7.11 CRM Ops Leads runtime PASS"
          else
            STATE=failure
            DESCRIPTION="Gate 7.11 CRM Ops Leads runtime FAIL / STOP_RETRY"
          fi
          jq -n \
            --arg state "$STATE" \
            --arg context "$STATUS_CONTEXT" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status-final.json"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d @"$RUNNER_TEMP/status-final.json" >/dev/null
