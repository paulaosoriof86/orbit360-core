name: Orbit360 F2 Functional Defect Successor Promotion Source Only

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/orbit360-requests/f2-functional-defect-successor-promotion-*.json'

permissions:
  contents: write

concurrency:
  group: orbit360-f2-functional-defect-successor-promotion-ays
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate immutable source-only promotion request
        shell: bash
        run: |
          set -euo pipefail
          START_HEAD=$(git rev-parse HEAD)
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST="${CHANGED[0]}"
          case "$REQUEST" in .github/orbit360-requests/f2-functional-defect-successor-promotion-*.json) ;; *) exit 41;; esac
          jq -e '.schemaVersion=="orbit360-f2-functional-defect-successor-promotion-request-v1" and .approved==true and .sourceOnly==true and .runtime==false and .browser==false and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false and .expectedLedgerRevision==24 and .expectedPackageRevision==18 and .candidateEvidence=="orbit360-platform/runtime-gate-crm-v20260716/f2-successor-client-projection-rootfix-v20260820.json" and .containsPII==false and .containsSecrets==false' "$REQUEST" >/dev/null
          echo "START_HEAD=$START_HEAD" >> "$GITHUB_ENV"
          echo "LR=$(jq -r '.expectedLedgerRevision' "$REQUEST")" >> "$GITHUB_ENV"
          echo "PRV=$(jq -r '.expectedPackageRevision' "$REQUEST")" >> "$GITHUB_ENV"
          echo "EVIDENCE=$(jq -r '.candidateEvidence' "$REQUEST")" >> "$GITHUB_ENV"

      - name: Promote certified successor through revisioned source-only owner
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-f2-functional-defect-successor-promotion-v20260820.mjs
          node tools/orbit360-f2-functional-defect-successor-promotion-v20260820.mjs --expected-ledger "$LR" --expected-package "$PRV" --evidence "$EVIDENCE" | tee "$RUNNER_TEMP/promotion.json"
          jq -e '.ok==true and .status=="F2_FUNCTIONAL_DEFECT_SUCCESSOR_PROMOTED_SOURCE_ONLY" and .toLedgerRevision==25 and .toPackageRevision==19 and .candidateArtifactId==9433944723 and .authorizationGranted==false and .requestMaterialized==false and .runtimeAllowed==false and .writes==0' "$RUNNER_TEMP/promotion.json" >/dev/null

      - name: Project and validate complete control plane
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision 25
          node tools/orbit360-cp11-authorization-boundary-audit-v20260820.mjs | tee "$RUNNER_TEMP/cp11.json"
          jq -e '.ok==true and .candidateArtifactId==9433944723 and .ledgerRevision==25 and .packageRevision==19 and .authorized==false and .runtimeAllowed==false' "$RUNNER_TEMP/cp11.json" >/dev/null
          node tools/orbit360-control-plane-composite-invariant-v20260820.mjs | tee "$RUNNER_TEMP/composite.json"
          jq -e '.ok==true and .candidateArtifactId==9433944723 and .firstIncompleteStep=="F2-RUNTIME-AUTHORIZATION"' "$RUNNER_TEMP/composite.json" >/dev/null
          ORBIT360_CONTROL_PLANE_HEAD="$START_HEAD" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step F2-RUNTIME-AUTHORIZATION --expected-package-status CLOSED_PASS | tee "$RUNNER_TEMP/readback.json"
          jq -e '.ok==true and .ledgerRevision==25 and .packageRevision==19 and .firstIncompleteStep=="F2-RUNTIME-AUTHORIZATION"' "$RUNNER_TEMP/readback.json" >/dev/null
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          jq -n --argjson p "$(cat "$RUNNER_TEMP/promotion.json")" --argjson c "$(cat "$RUNNER_TEMP/cp11.json")" --argjson i "$(cat "$RUNNER_TEMP/composite.json")" --argjson r "$(cat "$RUNNER_TEMP/readback.json")" '{schemaVersion:"orbit360-f2-functional-defect-successor-promotion-evidence-v1",ok:true,status:"F2_FUNCTIONAL_DEFECT_SUCCESSOR_PROMOTION_SOURCEONLY_PASS",promotion:$p,cp11Audit:$c,composite:$i,independentReadback:$r,runtimeExecuted:false,browserExecuted:false,secretAccess:false,firestoreRead:false,writes:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > orbit360-platform/runtime-gate-crm-v20260716/f2-functional-defect-successor-promotion-v20260820.json

      - name: Commit one atomic source-only promotion with final CAS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-control-plane; git config user.email orbit360-control-plane@users.noreply.github.com
          git add \
            orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json \
            orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json \
            orbit360-platform/docs/orbit360-f2-runtime-authorization-boundary-v20260820.json \
            orbit360-platform/docs/orbit360-live-state-v1.json \
            orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json \
            orbit360-platform/docs/ORBIT360-PR5-CURRENT-STATE.md \
            orbit360-platform/docs/CHECKPOINT-CONTROL-PLANE-HARDENING-20260820.md \
            tools/orbit360-gate-contract-f2-productive-acceptance-v20260820.json \
            tools/orbit360-gate-contract-registry-v20260717.json \
            tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-source-v20260819.json \
            tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json \
            orbit360-platform/runtime-gate-crm-v20260716/f2-functional-defect-successor-promotion-v20260820.json
          git commit -m 'fix(control-plane): promote certified F2 functional rootfix successor'
          git fetch origin ays/backend-tenant-lab-v99-20260703
          test "$(git rev-parse origin/ays/backend-tenant-lab-v99-20260703)" = "$START_HEAD" || { echo FINAL_CAS_MISMATCH; exit 103; }
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
