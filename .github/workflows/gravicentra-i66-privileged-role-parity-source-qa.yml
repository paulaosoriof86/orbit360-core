      - tools/gravicentra-i6-6-cliente360-advisor-source-parity.test.cjs
      - tools/gravicentra-i6-6-privileged-role-portfolio-parity.test.cjs
      - tools/gravicentra-i6-6-privileged-role-writer-transaction.test.cjs
      - tools/gravicentra-i6-6-equipo-protected-role-defaults.test.cjs
      - artifacts/orbit360-recovery/release-control/I6_6_APPROVED_PRODUCT_DELTA_MANIFEST_20261110.json
      - .github/workflows/gravicentra-i66-current-exact-preview-cross-module-uat-20261119.yml
      - .github/workflows/gravicentra-i66-live-performance-readonly.yml
      - tools/gravicentra-i6-6-current-live-five-role-route-readonly.cjs
      - tools/gravicentra-i66-live-performance-readonly.mjs
