  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gi-i66-privileged-role-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-source-gate-no-production-writes:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source test with 5 roles, 12 domain writers and explicit negative boundaries
        run: |
          set -euo pipefail
          node --check tools/gravicentra-i6-6-delta-test-revisions.cjs
          node tools/gravicentra-i6-6-source-lineage-preview-transport.test.cjs
          node --test tools/gravicentra-i6-6-readonly-observer-authority.test.cjs tools/gravicentra-i6-6-five-role-assigned-selection.test.cjs tools/gravicentra-i6-6-performance-first-route-source-timeline.test.cjs tools/gravicentra-i6-6-six-existing-receipts-ui-readonly.test.cjs
          node --test tools/gravicentra-i6-6-composite-preview-admission.test.cjs tools/gravicentra-i6-6-workflow-candidate-resolution.test.cjs
          node --test tools/gravicentra-i66-composite-acceptance.test.cjs tools/gravicentra-i66-frontend-control.test.cjs tools/gravicentra-i66-frontend-promotion-transaction.test.cjs
          node --test tools/gravicentra-i6-6-financial-page-read-efficiency.test.cjs tools/gravicentra-i6-6-make-lead-ingress-release.test.cjs
          node --test tools/gravicentra-i6-6-direction-preview-i66-consent-scope.test.cjs tools/gravicentra-i6-6-direction-live-legal-acceptance.test.cjs
          node --test tools/gravicentra-i6-6-documented-terms-signed-check.test.cjs tools/gravicentra-i6-6-documented-premium-terms.test.cjs tools/gravicentra-i6-6-cobros-visible-snapshot-performance.test.cjs
          node --test tools/gravicentra-i6-6-import-source-preview.test.cjs
          node --test tools/gravicentra-i6-6-cobros-payment-failure-category.test.cjs tools/gravicentra-i6-6-operational-renewal-entry.test.cjs
          node --test tools/gravicentra-i6-6-ops-collaboration-owner.test.cjs
          node --test tools/gravicentra-i6-6-ops-leads-inbox-projection.test.cjs
          node --check functions/b4-003-scoped-access-boundary.js
          node --check functions/product-operational-domain.js
          node --check functions/product-ops-leads-domain.js
          node --check orbit360-platform/core/access-scope.js
          node --check orbit360-platform/modules/equipo.js
          node --check orbit360-platform/modules/cliente360.js
          node --check orbit360-platform/modules/crm-v1198-operational-bridge.js
          node --test tools/gravicentra-i6-6-crm-shadow-advisor-source.test.cjs
          node --test tools/gravicentra-i6-6-cliente360-advisor-source-parity.test.cjs
          node --test tools/gravicentra-i6-6-active-session-recovery.test.cjs tools/gravicentra-i66-auth-first-startup.test.cjs
          node --test tools/gravicentra-i6-6-management-default-and-client-country.test.cjs tools/gravicentra-i6-6-client-linked-deal-timeline.test.cjs tools/gravicentra-i6-6-management-catalog-client-projection.test.cjs
          node --test tools/gravicentra-i6-6-privileged-role-portfolio-parity.test.cjs \
            tools/gravicentra-i6-6-privileged-role-writer-transaction.test.cjs \
            tools/gravicentra-i6-6-equipo-protected-role-defaults.test.cjs
          node tools/gravicentra-b4-003-financial-role-scope-transversal.test.cjs
          node tools/gravicentra-b4-003-scoped-boundary.test.cjs
          node tools/gravicentra-b4-003-ops-leads-role-scopes.test.cjs
          node tools/gravicentra-b4-003-operational-write-security-regression.test.cjs > "$RUNNER_TEMP/gi-operational-regression.json"
          node tools/gravicentra-i6-6-payment-country-write-boundary.test.cjs
          node tools/gravicentra-i6-6-auth-session-write-coherence.test.cjs
          echo 'I66_PRIVILEGED_ROLE_SYNTHETIC_SOURCE_REGRESSION_PASS_NO_CUSTOMER_WRITES_NO_DEPLOY'
      - name: Canonical source blob and historic release guard without re-opening B4
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-6-delta-guard.mjs
          echo 'I66_APPROVED_ROLE_SOURCE_LINEAGE_GUARD_PASS_PREVIEW_AND_LIVE_STILL_PENDING'
      - name: Preserve source-only validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-role-parity-source-only-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-operational-regression.json
          if-no-files-found: warn
          retention-days: 14
  synthetic-chromium-detach-causal-no-production-writes:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831' && github.event_name == 'push' && contains(github.event.head_commit.message, 'I66_QA_DETACH_CAUSAL_CHECK')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      I66_SIX_REQUIRE_REAL_DOM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated runtime paths after runner allocation
        run: |
          set -euo pipefail
          {
            printf 'NODE_PATH=%s\n' "$RUNNER_TEMP/gi-i66-detach-deps/node_modules"
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/gi-i66-detach-browsers"
          } >> "$GITHUB_ENV"
      - name: Install pinned Chromium driver for isolated synthetic DOM proof
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gi-i66-detach-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0
          # Ubuntu runner already provides Chromium's native libraries. The
          # actual browser test below must still launch and execute; no skip.
          node "$RUNNER_TEMP/gi-i66-detach-deps/node_modules/playwright/cli.js" install chromium
      - name: Prove real DOM detach recovery and persistent failure without credentials or business data
        run: |
          set -euo pipefail
          node --test --test-name-pattern='real Chromium DOM' tools/gravicentra-i6-6-six-existing-receipts-ui-readonly.test.cjs | tee "$RUNNER_TEMP/gi-i66-detach-causal.tap"
      - name: Preserve real DOM causal test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-detach-causal-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-i66-detach-causal.tap
          if-no-files-found: warn
          retention-days: 14

# Frozen v17 QA: execute actual Chromium precheck-budget and detach regressions before immutable build.
