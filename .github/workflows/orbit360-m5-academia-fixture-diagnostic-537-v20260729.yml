name: Orbit 360 · M5 5.0.37 fixture diagnostic
run-name: M5 5.0.37 · diagnose static producer fixture · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-academia-fixture-diagnostic-537-trigger-v20260729.json'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar fixture aislado
        id: fixture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/orbit360-m5-academia-static-producer-inventory-537-fixture-v20260729.mjs 2>&1 | tee /tmp/fixture-537.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publicar diagnóstico observable
        if: always()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.fixture.outputs.exit_code }}
        with:
          script: |
            const ok=process.env.EXIT_CODE==='0';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'orbit360/m5-academia-fixture-diagnostic-537',description:ok?'Fixture 5.0.37 isolated PASS':'Fixture 5.0.37 isolated failure captured'});
