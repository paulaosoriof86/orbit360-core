name: Orbit360 F2 Request09 Index Nested Stale Correction 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/f2-request09-index-nested-stale-correction-20260820.json'
permissions:
  contents: write
concurrency:
  group: orbit360-f2-request09-index-nested-stale-correction-20260820
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inert correction boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = '.github/orbit360-requests/f2-request09-index-nested-stale-correction-20260820.json'
          jq -e '.schemaVersion=="orbit360-f2-request09-index-nested-stale-correction-request-v1" and .sourceOnly==true and .request09Consumed==true and .candidateArtifactId==9387820198 and .request10Authorized==false and .browser==false and .runtime==false and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false' "${CHANGED[0]}" >/dev/null
      - name: Correct nested current pointers and validate
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-correct-f2-request09-index-nested-stale-v20260820.mjs
          jq -e '.ok==true and .status=="F2_REQUEST09_INDEX_NESTED_STALE_CORRECTION_PASS" and .classification=="VALIDATOR_STALE_ROOTFIX" and .candidateArtifactId==9387820198 and .request09Consumed==true and .request09ReplayAllowed==false and .request10Authorized==false and (.checks|to_entries|all(.value==true)) and .productMutation==false and .runtimeExecuted==false and .writes==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/f2-request09-index-nested-stale-correction-v20260820.json >/dev/null
          git diff --check
      - name: Persist corrected index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-f2-docsync-bot'
          git config user.email 'orbit360-f2-docsync-bot@users.noreply.github.com'
          git add -- orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json orbit360-platform/runtime-gate-crm-v20260716/f2-request09-index-nested-stale-correction-v20260820.json
          git diff --cached --check
          git commit -m 'docs(f2): close Request09 nested index stale pointers [skip ci]'
          git fetch origin ays/backend-tenant-lab-v99-20260703
          git rebase origin/ays/backend-tenant-lab-v99-20260703
          test -z "$(git status --porcelain)"
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
