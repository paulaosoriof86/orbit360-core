name: Orbit360 F2 RULES01 Postdeploy Probe Run Observer 20260819
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f2-rules01-postdeploy-probe-run-observer-v20260819.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: orbit360-f2-rules01-postdeploy-probe-run-observer-v20260819
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: 7e346457ad178557123f7ea46bbbca3b632d505e
      TARGET_NAME: Orbit360 F2 RULES01 Postdeploy Probe Readonly 20260818
      TARGET_PATH: .github/workflows/orbit360-f2-rules01-postdeploy-probe-readonly-v20260818.yml
      OUT: orbit360-platform/runtime-gate-crm-v20260716/f2-rules01-postdeploy-probe-run-observer-v20260819.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - name: Observe exactly one target push run
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FOUND=''
          for i in $(seq 1 90); do
            RAW="$RUNNER_TEMP/runs.json"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100" > "$RAW"
            COUNT=$(jq --arg sha "$TARGET_SHA" --arg name "$TARGET_NAME" --arg path "$TARGET_PATH" '[.workflow_runs[] | select(.head_sha==$sha and .name==$name and .path==$path)] | length' "$RAW")
            if [ "$COUNT" -gt 1 ]; then echo "non-unique target run" >&2; exit 41; fi
            if [ "$COUNT" = '1' ]; then
              STATUS=$(jq -r --arg sha "$TARGET_SHA" --arg name "$TARGET_NAME" --arg path "$TARGET_PATH" '.workflow_runs[] | select(.head_sha==$sha and .name==$name and .path==$path) | .status' "$RAW")
              if [ "$STATUS" = 'completed' ]; then FOUND="$RAW"; break; fi
            fi
            sleep 2
          done
          test -n "$FOUND"
          mkdir -p "$(dirname "$OUT")"
          jq --arg sha "$TARGET_SHA" --arg name "$TARGET_NAME" --arg path "$TARGET_PATH" --arg observer "$GITHUB_RUN_ID" '
            [.workflow_runs[] | select(.head_sha==$sha and .name==$name and .path==$path)] as $r |
            {schemaVersion:"orbit360-f2-rules01-postdeploy-probe-run-observer-v1",ok:($r|length)==1,status:"TERMINAL_OBSERVED",uniquenessCount:($r|length),observerRunId:$observer,targetSha:$sha,targetWorkflowName:$name,run:{id:$r[0].id,status:$r[0].status,conclusion:$r[0].conclusion,run_attempt:$r[0].run_attempt,head_sha:$r[0].head_sha,head_branch:$r[0].head_branch,event:$r[0].event,name:$r[0].name,path:$r[0].path,created_at:$r[0].created_at,updated_at:$r[0].updated_at},secretAccess:false,firestoreRead:false,rulesDeploy:false,cloudMutation:false,containsPII:false,containsSecrets:false}' "$FOUND" > "$OUT"
          jq -e '.ok==true and .uniquenessCount==1 and .run.status=="completed" and .run.run_attempt==1' "$OUT" >/dev/null
      - name: Persist sanitized observer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-actions-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'docs(gate): persist postdeploy probe run observer [skip ci]'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
