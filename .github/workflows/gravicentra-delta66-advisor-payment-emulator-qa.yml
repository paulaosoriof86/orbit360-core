# No production credentials; writes go exclusively to local Firestore emulator.
name: Gravicentra I6.6 Advisor Payment Ops Notification Emulator QA

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-delta66-advisor-payment-emulator-qa.yml
      - tools/gravicentra-delta66-advisor-payment-emulator-functional.test.cjs
      - functions/cobros-reconciliation-domain.js
      - functions/notification-outbox-processor.js
      - functions/ops-advisor-inbox.js
      - artifacts/orbit360-recovery/release-control/I6_6_APPROVED_PRODUCT_DELTA_MANIFEST_20261110.json

permissions:
  contents: read

concurrency:
  group: gi-i66-advisor-emulator-recovery
  cancel-in-progress: false

jobs:
  synthetic-report-notifications:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source and tests before emulator
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-6-delta-guard.mjs
          node --check tools/gravicentra-delta66-advisor-payment-emulator-functional.test.cjs
          node --check functions/cobros-reconciliation-domain.js
          node --check functions/notification-outbox-processor.js
          node --check functions/ops-advisor-inbox.js
      - name: Install backend and pinned isolated Firestore emulator
        run: |
          set -euo pipefail
          (cd functions && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          npm install --prefix "$RUNNER_TEMP/gi-i66-advisor-qa-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-i66-advisor-qa-cli"
      - name: Positive GT CO reports and negative roles tenant country idempotency with real emulator
        env:
          GCLOUD_PROJECT: demo-gravicentra-i66-payments
          FIREBASE_PROJECT_ID: demo-gravicentra-i66-payments
          FIREBASE_CONFIG: '{"projectId":"demo-gravicentra-i66-payments"}'
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          CLI="$RUNNER_TEMP/gi-i66-advisor-qa-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          node "$CLI" emulators:exec --only firestore --project demo-gravicentra-i66-payments --non-interactive --config firebase.json "node tools/gravicentra-delta66-advisor-payment-emulator-functional.test.cjs"
          echo "I66_ADVISOR_PAYMENT_NO_REAL_FIRESTORE_WRITES=true"
