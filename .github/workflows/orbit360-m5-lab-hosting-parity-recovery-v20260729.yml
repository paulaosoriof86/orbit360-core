name: Orbit 360 · M5 Hosting LAB · recuperación paridad pública 25/25
# Ejecución efectiva después de corregir la detección de referencias reales a Secrets.
run-name: M5 5.0.7 · parity-only · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-lab-hosting-parity-recovery-v20260729.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-lab-hosting-parity-recovery-v20260729
  cancel-in-progress: false

env:
  EXPECTED_RC_HASH: b25bf2750548651a719526bc4dadf7662def2255876c4c2e5e32bdf90f93a091
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  public_parity_recovery:
    name: M5 · public parity only · no secrets · no deploy · no browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar alcance sin capacidades sensibles
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${ORBIT360_LAB_LOGIN_PASSWORD:-}"

      - name: Validar sintaxis y contrato de recuperación
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-m5-release-candidate-readiness-v20260728.mjs
          node --check tools/orbit360-m5-lab-hosting-parity-recovery-contract-v20260729.cjs
          node tools/orbit360-m5-lab-hosting-parity-recovery-contract-v20260729.cjs
          jq -e '.ok==true and .status=="M5_LAB_HOSTING_PARITY_RECOVERY_CONTRACT_PASS" and .failed==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==42 and .remoteAssetsExpected==25 and .secrets==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .deploy==false' "$EVIDENCE_DIR/m5-lab-hosting-parity-recovery-contract-summary.json" >/dev/null

      - name: Revalidar una vez la paridad pública
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in 1 2; do
            node tools/orbit360-m5-release-candidate-readiness-v20260728.mjs || true
            if jq -e '.ok==true and .status=="M5_RC_READY_FOR_RUNTIME_SMOKE" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==42 and .remoteLab.assetsExpected==25 and .remoteLab.assetsChecked==25 and .remoteLab.assetsMatched==25 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .writes.operationalWrites==0 and .firestoreRead==false and .browser==false and .runtime==false and .deploy==false and .rulesDeploy==false and .functionsDeploy==false and .productionTouched==false' "$EVIDENCE_DIR/m5-release-candidate-readiness-summary.json" >/dev/null; then
              verified=1
              break
            fi
            if [ "$attempt" = '1' ]; then sleep 8; fi
          done
          test "$verified" = '1'

      - name: Crear cierre sanitizado de paridad
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const d=process.env.EVIDENCE_DIR;
          const read=n=>{try{return JSON.parse(fs.readFileSync(path.join(d,n),'utf8'))}catch{return null}};
          const c=read('m5-lab-hosting-parity-recovery-contract-summary.json'),r=read('m5-release-candidate-readiness-summary.json');
          const ok=!!(c&&c.ok===true&&c.failed===0&&r&&r.ok===true&&r.status==='M5_RC_READY_FOR_RUNTIME_SMOKE'&&r.releaseCandidate?.hash===process.env.EXPECTED_RC_HASH&&r.releaseCandidate?.criticalAssetCount===42&&r.remoteLab?.assetsChecked===25&&r.remoteLab?.assetsMatched===25&&r.remoteLab?.mismatchCount===0&&r.remoteLab?.remoteParity===true);
          const out={schemaVersion:'orbit360-m5-lab-hosting-parity-recovery-summary-v1',generatedAt:new Date().toISOString(),ok,status:ok?'M5_LAB_HOSTING_DELIVERED_AND_25_OF_25_VERIFIED':'M5_LAB_HOSTING_PARITY_RECOVERY_FAILED',releaseCandidateHash:process.env.EXPECTED_RC_HASH,criticalAssets:r&&r.releaseCandidate?.criticalAssetCount||0,remoteAssetsExpected:r&&r.remoteLab?.assetsExpected||25,remoteAssetsChecked:r&&r.remoteLab?.assetsChecked||0,remoteAssetsMatched:r&&r.remoteLab?.assetsMatched||0,mismatchCount:(r&&r.remoteLab?.mismatchCount)??25,remoteParity:!!(r&&r.remoteLab?.remoteParity),hostingDeployPreviouslyExecuted:true,hostingDeployExecutions:1,redeployExecuted:false,secrets:false,firebaseIdentity:false,firestoreRead:false,firestoreWrites:0,operationalWrites:0,runtime:false,browser:false,deploy:false,functionsDeploy:false,rulesDeploy:false,production:false,mergeMain:false,policies:false,containsPII:false,containsSecrets:false,approvalReadyForRuntimeSmoke:ok,runtimeSmokeAuthorized:false,visualReviewAuthorized:false};
          fs.writeFileSync(path.join(d,'m5-lab-hosting-parity-recovery-summary.json'),JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Validar cierre 25/25 sin redeploy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M5_LAB_HOSTING_DELIVERED_AND_25_OF_25_VERIFIED" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==42 and .remoteAssetsExpected==25 and .remoteAssetsChecked==25 and .remoteAssetsMatched==25 and .mismatchCount==0 and .remoteParity==true and .hostingDeployPreviouslyExecuted==true and .hostingDeployExecutions==1 and .redeployExecuted==false and .secrets==false and .firebaseIdentity==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .deploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .policies==false and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/m5-lab-hosting-parity-recovery-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-lab-hosting-parity-recovery-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/m5-lab-hosting-parity-recovery-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-lab-hosting-parity-recovery-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-lab-hosting-parity-recovery-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 public parity recovery failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true&&s.remoteAssetsMatched===25&&s.redeployExecuted===false){state='success';description='M5 Hosting LAB parity 25/25; no redeploy';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-lab-hosting-parity-recovery',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
