name: Orbit360 R4S5 Client360 Deep Clone Rootfix Source 20260816

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'tools/orbit360-r4s5-client360-deep-clone-rootfix-apply-v20260816.mjs'
      - 'tools/orbit360-r4s5-client360-deep-clone-rootfix-gate-v20260816.mjs'
      - '.github/workflows/orbit360-r4s5-client360-deep-clone-rootfix-source-v20260816.yml'

permissions:
  contents: write

concurrency:
  group: orbit360-r4s5-client360-deep-clone-rootfix-source-v20260816
  cancel-in-progress: false

env:
  BRANCH: ays/backend-tenant-lab-v99-20260703
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  CORE: orbit360-platform/core/client-insurer-visual-contract-v20260720.js
  CLIENT360: orbit360-platform/modules/cliente360.js

jobs:
  source-rootfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical gate before source-only product correction
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Verify frozen runtime and exact pre-rootfix owners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          grep -F "ORBIT360_R4_CERTIFIED_SOURCE_ONLY: 'true'" .github/workflows/orbit360-r4-certified-product-readonly-smoke-v20260815.yml >/dev/null
          test "$(git hash-object "$CORE")" = "573f210b81a8e219e056fe82d3f79ad6622d83f8"
          test "$(git hash-object "$CLIENT360")" = "4834b696cf5335b2bce478248aed60d5b59a2de8"
          test "$(git show 5474a1a9af64c018e6dcc71b4ad0cdfe57ce0484:"$CORE" | sha256sum | awk '{print $1}')" = "ad6fa96614d4eefe29880fac26a1c349ae24940adc2d8ff75ad04d991595b067"
          test "$(sha256sum orbit360-platform/core/queries.js | awk '{print $1}')" = "b906c1d3382a9fad310695b0ce2c8e7f49a2bf99fe9b9ed674a8df7e0fcbbb7b"

      - name: Apply exactly two-file source rootfix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node tools/orbit360-r4s5-client360-deep-clone-rootfix-apply-v20260816.mjs | tee "$EVIDENCE_DIR/r4s5-client360-deep-clone-rootfix-apply-v20260816.json"
          node --check "$CORE"
          node --check "$CLIENT360"

      - name: Execute single source gate with representative deep-clone payload
        shell: bash
        run: |
          set -euo pipefail
          OUT="$EVIDENCE_DIR/r4s5-client360-deep-clone-rootfix-source-v20260816.json"
          ORBIT360_CLIENT360_DEEP_CLONE_GATE_OUT="$OUT" node tools/orbit360-r4s5-client360-deep-clone-rootfix-gate-v20260816.mjs
          jq -e '.ok==true and .status=="R4S5_CLIENT360_DEEP_CLONE_COMPOSITION_ROOTFIX_SOURCE_PASS" and .classification=="FUNCTIONAL_DEFECT_ROOTFIX_SOURCE_PROVEN" and .fixture.clientes==430 and .fixture.polizas==1375 and .fixture.cobros==1900 and .fixture.representativeNestedPayload==true and .semanticEqual==true and .renderedHtmlEqual==true and .projectedClientsEqual==true and .reduction.cloneRowsReductionPercent>60 and .reduction.cloneBytesReductionPercent>60 and .invalidation.polizasEmitRebuilt==true and .queriesSha256MatchesCertifiedR4S4==true and .protectedStoreModified==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .dataAccess==false and .deployExecuted==false and .productionTouched==false and .packageRebuilt==false and .containsPII==false and .containsSecrets==false' "$OUT" >/dev/null

      - name: Control product scope before commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- "$CORE" "$CLIENT360" orbit360-platform/data orbit360-platform/core/auth.js firestore.rules | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$CORE"
          test "${changed[1]}" = "$CLIENT360"
          git diff --quiet -- orbit360-platform/data orbit360-platform/core/auth.js firestore.rules
          cat > "$EVIDENCE_DIR/r4s5-client360-deep-clone-rootfix-scope-v20260816.json" <<JSON
          {
            "ok": true,
            "status": "SOURCE_ROOTFIX_SCOPE_PASS",
            "changedProductFiles": ["$CORE", "$CLIENT360"],
            "changedProductFileCount": 2,
            "protectedStoreModified": false,
            "authModified": false,
            "rulesModified": false,
            "browserExecuted": false,
            "runtimeExecuted": false,
            "deployExecuted": false,
            "productionTouched": false
          }
          JSON

      - name: Commit exact source rootfix to mandatory branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orbit360-source-gate"
          git config user.email "orbit360-source-gate@users.noreply.github.com"
          git add -- "$CORE" "$CLIENT360"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "$CORE"
          test "${staged[1]}" = "$CLIENT360"
          git commit -m "fix: bound client360 projection read batch source-only"
          ROOTFIX_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:$BRANCH"
          printf '{"rootfixCommit":"%s","branch":"%s","browserExecuted":false,"runtimeExecuted":false,"deployExecuted":false,"productionTouched":false}\n' "$ROOTFIX_COMMIT" "$BRANCH" > "$EVIDENCE_DIR/r4s5-client360-deep-clone-rootfix-commit-v20260816.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s5-client360-deep-clone-source-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s5-client360-deep-clone-rootfix-apply-v20260816.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s5-client360-deep-clone-rootfix-source-v20260816.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s5-client360-deep-clone-rootfix-scope-v20260816.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s5-client360-deep-clone-rootfix-commit-v20260816.json
          if-no-files-found: warn
          retention-days: 14
