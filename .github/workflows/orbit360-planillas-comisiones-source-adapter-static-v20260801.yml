name: Orbit 360 · Planillas/Comisiones · source adapter static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/planillas-comisiones-source-adapter-static-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-planillas-comisiones-source-adapter-static-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  TRIGGER_PATH: .github/orbit360-triggers/planillas-comisiones-source-adapter-static-v20260801.json
  EVIDENCE_PATH: orbit360-platform/runtime-gate-crm-v20260716/planillas-comisiones-source-adapter-static-v20260801.json
jobs:
  audit:
    name: Static source adapter · synthetic fixtures only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar contrato estático sin capacidades
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-planillas-comisiones-source-adapter-static-trigger-v1" and .mode=="STATIC_SYNTHETIC_SOURCE_ADAPTER_AUDIT" and .approved==true and .realRowsAllowed==false and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.writes==false and .capabilities.browser==false and .capabilities.deploy==false and .capabilities.production==false' "$TRIGGER_PATH" >/dev/null
          test -f orbit360-platform/core/planillas-comisiones-source-adapter-p0.js
          test -f tools/orbit360-test-planillas-comisiones-source-adapter-p0-v20260801.mjs
          node <<'NODE'
          const fs=require('fs');
          let source=fs.readFileSync('orbit360-platform/core/planillas-comisiones-source-adapter-p0.js','utf8');
          source=source.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|\s)\/\/.*$/gm,'$1');
          const prohibited=[
            ['Orbit.store',/Orbit\s*\.\s*store/],
            ['firebase-admin',/firebase-admin/],
            ['firebase namespace',/\bfirebase\s*\./],
            ['localStorage',/\blocalStorage\b/],
            ['network fetch',/\bfetch\s*\(/]
          ].filter(([,pattern])=>pattern.test(source));
          if(prohibited.length){console.error('PROHIBITED_STATIC_ACCESS_TOKENS:'+prohibited.map(x=>x[0]).join(','));process.exit(41);}
          NODE
      - name: Ejecutar auditoría sintética
        shell: bash
        run: |
          set -euo pipefail
          export ORBIT360_PLANILLAS_ADAPTER_EVIDENCE="$EVIDENCE_PATH"
          node --check orbit360-platform/core/planillas-comisiones-source-adapter-p0.js
          node --check tools/orbit360-test-planillas-comisiones-source-adapter-p0-v20260801.mjs
          node tools/orbit360-test-planillas-comisiones-source-adapter-p0-v20260801.mjs
          jq -e '.status=="STATIC_ADAPTER_PASS" and .classification=="GO_STATIC_SOURCE_ADAPTER" and .ok==true and .failed==0 and .fixtureType=="SYNTHETIC_ONLY" and .checks>=30 and .exactPeriodRequired==true and .explicitCountryRequired==true and .explicitCurrencyRequired==true and .netPremiumSeparated==true and .intermediaryAndSellerCommissionSeparated==true and .commissionRateInferred==false and .realRowsUsed==0 and .containsPII==false and .containsPolicyNumbers==false and .containsAmounts==false and .secretsRead==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .storeAccess==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_PATH" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-planillas-comisiones-source-adapter-static-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/planillas-comisiones-source-adapter-static-v20260801.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: ${{ env.EVIDENCE_PATH }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='Planillas source adapter static audit failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.status==='STATIC_ADAPTER_PASS'&&p.failed===0&&p.realRowsUsed===0&&p.operationalWrites===0){state='success';description=`Planillas source adapter PASS: ${p.passed}/${p.checks}; synthetic only`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/planillas-comisiones-source-adapter-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
