name: Gravicentra I6.6 Drive Document Functions LIVE Restoration
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-drive-document-live-restoration.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-drive-document-functions-live-only
  cancel-in-progress: false
jobs:
  restore-nine-document-functions:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT_ID: ays-orbit-360-lab
      SOURCE_R9: 586401bfbe1a80cfef2820982f432743af36b108
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed authority, source identity and no-financial-write guard
        run: |
          set -euo pipefail
          node --check functions/document-drive-domain.js
          node --check functions/bootstrap.js
          git cat-file -e "$SOURCE_R9^{commit}"
          git merge-base --is-ancestor "$SOURCE_R9" HEAD
          for file in functions/document-drive-domain.js functions/bootstrap.js functions/package.json functions/package-lock.json; do
            cmp -s "$file" <(git show "$SOURCE_R9:$file") || { echo "DOCUMENT_BACKEND_R9_SOURCE_DRIFT:$file"; exit 1; }
          done
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const pointer=require('./artifacts/orbit360-recovery/release-control/I6_6_LATEST_EXACT_LIVE_POINTER_20261113.json');
          const control=require('./artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json');
          const a=control.i66DriveDocumentLiveRestorationAuthorization20261113;
          const names=['orbit360DocumentDriveStatus','orbit360DocumentDriveUpload','orbit360DocumentDriveListFolder',
            'orbit360DocumentDriveReadDossier','orbit360DocumentDriveRead','orbit360DocumentDriveDownload',
            'orbit360DocumentDriveFinalize','orbit360DocumentDriveQuarantine','orbit360DocumentDriveBootstrap'];
          assert.equal(pointer.currentLiveSourceSha,process.env.SOURCE_R9);
          assert.equal(pointer.currentLiveHostingVersion,'sites/ays-orbit-360-lab/versions/1dd873081501d7fb');
          assert.equal(pointer.fullI66ProductionAccepted,false);
          assert.equal(a?.authorizedBy,'Paula Dirección');
          assert.equal(a?.purpose,'restore_missing_production_document_callables_only');
          assert.deepEqual(a?.functionNames,names);
          assert.equal(a?.region,'us-central1');
          assert.equal(a?.allowFinancialRecordWrites,false);
          assert.equal(a?.allowHostingPromotion,false);
          assert.equal(a?.allowFirestoreRulesChange,false);
          assert.equal(control.noHostingPromotion,true);
          assert.equal(control.forbidFirestoreRulesDataAuthWrites,true);
          assert.equal(control.currentExactHostingRelease.sourceSha,process.env.SOURCE_R9);
          console.log('DRIVE_R9_EXACT_SAME_BACKEND_AND_NINE_SCOPED_FUNCTIONS_AUTHORIZED');
          NODE
      - name: Authenticate pre-existing same-project service account and install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-drive-auth"
          python3 - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-drive-auth'
          found=[]
          for i,k in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:v=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError):continue
              if v.get('type')=='service_account' and v.get('project_id')=='ays-orbit-360-lab' and v.get('private_key'):
                  f=root/f'{i}.json';f.write_text(json.dumps(v));f.chmod(0o600);found.append(str(f))
          if not found:raise SystemExit('DRIVE_SAME_PROJECT_DEPLOY_CREDENTIAL_MISSING')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-drive-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-drive-cli"
          CLI="$RUNNER_TEMP/gi-drive-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-drive-functions-before.json" 2>/dev/null; then selected="$candidate"; break; fi
          done < "$RUNNER_TEMP/gi-drive-auth/candidates"
          test -n "$selected" || { echo DRIVE_CLI_AUTH_FAILED; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$selected" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund >/dev/null
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Inspect LIVE functions and required production secret without exposing credentials
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          gcloud secrets describe ORBIT360_DRIVE_OAUTH_CLIENT_PRODUCTION --project "$PROJECT_ID" --format='value(name)' >/dev/null
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const b=require(path.join(process.env.RUNNER_TEMP,'gi-drive-functions-before.json'));
          const rows=Array.isArray(b.result)?b.result:Array.isArray(b)?b:[];
          const target=['orbit360DocumentDriveStatus','orbit360DocumentDriveUpload','orbit360DocumentDriveListFolder',
            'orbit360DocumentDriveReadDossier','orbit360DocumentDriveRead','orbit360DocumentDriveDownload',
            'orbit360DocumentDriveFinalize','orbit360DocumentDriveQuarantine','orbit360DocumentDriveBootstrap'];
          const name=x=>String(x.entryPoint||x.id||x.name||'').split('/').pop();
          const missing=[];
          for(const fn of target){
            const matches=rows.filter(x=>name(x)===fn);
            assert.ok(matches.length<=1,'DRIVE_DUPLICATE_LIVE_FUNCTION:'+fn);
            if(!matches.length){missing.push(fn);continue;}
            const r=String(matches[0].region||matches[0].location||'');
            assert.equal(r,'us-central1','DRIVE_EXISTING_FUNCTION_REGION_DRIFT:'+fn);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'gi-drive-new-functions.txt'),missing.join('\n')+(missing.length?'\n':''));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'gi-drive-only.txt'),missing.map(fn=>'functions:'+fn).join(','));
          console.log('DRIVE_PREVIOUS_LIVE_FUNCTIONS='+String(target.length-missing.length));
          console.log('DRIVE_MISSING_FUNCTIONS_TO_DEPLOY='+String(missing.length));
          console.log('DRIVE_LIVE_NO_EXISTING_FUNCTION_WILL_BE_REDEPLOYED');
          NODE
      - name: Restore only missing LIVE document callables; verify and rollback on failure
        run: |
          set -euo pipefail
          completed=0;started=0
          rollback(){
            code=$?
            if test "$started" = 1 && test "$completed" != 1; then
              set +e
              failed=0
              while IFS= read -r fn; do
                test -n "$fn" || continue
                node "$FIREBASE_CLI_BIN" functions:delete "$fn" --region us-central1 --project "$PROJECT_ID" --force --non-interactive >/dev/null 2>&1 || failed=1
              done < "$RUNNER_TEMP/gi-drive-new-functions.txt"
              echo "DRIVE_NEW_FUNCTION_ONLY_ROLLBACK_FAILURES=$failed"
            fi
            exit "$code"
          }
          trap rollback EXIT
          ONLY=$(cat "$RUNNER_TEMP/gi-drive-only.txt")
          if test -n "$ONLY"; then
            started=1
            node "$FIREBASE_CLI_BIN" deploy --only "$ONLY" --config firebase.json --project "$PROJECT_ID" --non-interactive
          fi
          node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-drive-functions-after.json"
          node - <<'NODE'
          const assert=require('node:assert/strict'),path=require('node:path'),fs=require('node:fs');
          const a=require(path.join(process.env.RUNNER_TEMP,'gi-drive-functions-after.json'));
          const rows=Array.isArray(a.result)?a.result:Array.isArray(a)?a:[];
          const fn=['orbit360DocumentDriveStatus','orbit360DocumentDriveUpload','orbit360DocumentDriveListFolder',
            'orbit360DocumentDriveReadDossier','orbit360DocumentDriveRead','orbit360DocumentDriveDownload',
            'orbit360DocumentDriveFinalize','orbit360DocumentDriveQuarantine','orbit360DocumentDriveBootstrap'];
          const name=x=>String(x.entryPoint||x.id||x.name||'').split('/').pop();
          for(const n of fn){
            const hits=rows.filter(x=>name(x)===n);assert.equal(hits.length,1,'DRIVE_LIVE_FUNCTION_NOT_REGISTERED:'+n);
            assert.equal(String(hits[0].region||hits[0].location||''),'us-central1','DRIVE_LIVE_FUNCTION_WRONG_REGION:'+n);
          }
          console.log('DRIVE_ALL_NINE_LIVE_FUNCTIONS_REGISTERED_PASS');
          NODE
          for fn in orbit360DocumentDriveStatus orbit360DocumentDriveUpload orbit360DocumentDriveListFolder orbit360DocumentDriveReadDossier orbit360DocumentDriveRead orbit360DocumentDriveDownload orbit360DocumentDriveFinalize orbit360DocumentDriveQuarantine orbit360DocumentDriveBootstrap; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://us-central1-ays-orbit-360-lab.cloudfunctions.net/$fn")
            if test "$code" != 400; then
              echo "DRIVE_LIVE_FUNCTION_HTTP_INVALID:$fn:$code"
              exit 1
            fi
            echo "DRIVE_LIVE_FUNCTION_ROUTED:$fn:HTTP_$code"
          done
          completed=1
          echo 'DRIVE_NINE_DOCUMENT_FUNCTIONS_LIVE_ROUTING_PASS_NO_BUSINESS_WRITES_NO_HOSTING_CHANGE'
