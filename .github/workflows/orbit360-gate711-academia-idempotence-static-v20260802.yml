name: Orbit 360 · Gate 7.11 · Academia idempotente · estático
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-academia-idempotence-static-v20260802.json'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    name: Gate 7.11 · cero writes de Academia por cambio de rol
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar trigger y root fix
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=.github/orbit360-static-requests/gate711-academia-idempotence-static-v20260802.json
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST"
          jq -e '.schemaVersion=="orbit360-gate711-academia-idempotence-static-request-v1" and .approved==true and .allowedExecutions==1 and .consumed==false and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST" >/dev/null
          node --check orbit360-platform/data/academia-v1230-operational-directory-v20260722.js
          node --check tools/orbit360-validar-academia-operational-idempotence-gate711-v20260802.mjs
          node tools/orbit360-validar-academia-operational-idempotence-gate711-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_ACADEMIA_OPERATIONAL_IDEMPOTENCE_STATIC_PASS" and .classification=="GO_STATIC_ACADEMIA_OPERATIONAL_IDEMPOTENCE" and .total==16 and .passed==16 and .failed==0 and .synthetic.initialCalls==5 and .synthetic.secondApplyCalls==5 and .synthetic.afterThreeRoleChanges==5 and .synthetic.afterSameStoreEvent==5 and .synthetic.newStoreFirst==5 and .synthetic.newStoreSecond==5 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .firestoreWrites==0 and .operationalWrites==0 and .reimportExecuted==false and .deployExecuted==false and .production==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-operational-idempotence-static-v20260802.json >/dev/null
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-academia-idempotence-static-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-operational-idempotence-static-v20260802.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-operational-idempotence-static-v20260802.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Gate 7.11 Academia idempotence failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='GATE711_ACADEMIA_OPERATIONAL_IDEMPOTENCE_STATIC_PASS'&&p.synthetic?.afterThreeRoleChanges===p.synthetic?.secondApplyCalls){state='success';description='Academia role changes produce zero writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-academia-idempotence-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
