name: Gravicentra B4-003 E4 Reportes transversal regression

on:
  pull_request:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - orbit360-platform/core/assignable-advisor-roster-client.js
      - orbit360-platform/data/store-firestore-product-operational-p0.js
      - tests/goal-participation-isolated-routing.test.cjs
      - orbit360-platform/modules/cancelaciones.js
      - orbit360-platform/modules/reportes.js
      - orbit360-platform/modules/renovaciones.js
      - orbit360-platform/core/access-scope.js
      - orbit360-platform/core/tenant-access-policy-effective-p0.js
      - functions/b4-003-scoped-access-boundary.js
      - tools/gravicentra-b4-003-financial-role-scope-transversal.test.cjs
      - tools/gravicentra-b4-003-client-list-transversal-readonly.test.cjs
      - tools/gravicentra-b4-003-reportes-e4-transversal.test.cjs
      - tools/gravicentra-b4-003-renovaciones-qa-provenance.test.cjs
      - .github/workflows/gravicentra-b4-003-e4-reportes-transversal-ci.yml
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - orbit360-platform/core/assignable-advisor-roster-client.js
      - orbit360-platform/data/store-firestore-product-operational-p0.js
      - tests/goal-participation-isolated-routing.test.cjs
      - orbit360-platform/modules/cancelaciones.js
      - orbit360-platform/modules/reportes.js
      - orbit360-platform/modules/renovaciones.js
      - orbit360-platform/core/access-scope.js
      - orbit360-platform/core/tenant-access-policy-effective-p0.js
      - functions/b4-003-scoped-access-boundary.js
      - tools/gravicentra-b4-003-financial-role-scope-transversal.test.cjs
      - tools/gravicentra-b4-003-client-list-transversal-readonly.test.cjs
      - tools/gravicentra-b4-003-reportes-e4-transversal.test.cjs
      - tools/gravicentra-b4-003-renovaciones-qa-provenance.test.cjs
      - .github/workflows/gravicentra-b4-003-e4-reportes-transversal-ci.yml

permissions:
  contents: read

jobs:
  e4-source-and-cross-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact product source syntax
        run: |
          node --check orbit360-platform/modules/cancelaciones.js
          node --check orbit360-platform/modules/reportes.js
          node --check orbit360-platform/modules/renovaciones.js
      - name: B4-003 confirmed financial scope across role/country/collections
        run: |
          node --check orbit360-platform/core/access-scope.js
          node --check orbit360-platform/core/tenant-access-policy-effective-p0.js
          node --check functions/b4-003-scoped-access-boundary.js
          node --check tools/gravicentra-b4-003-financial-role-scope-transversal.test.cjs
          node tools/gravicentra-b4-003-financial-role-scope-transversal.test.cjs
          node tools/gravicentra-b4-003-effective-policy-quickcheck.cjs
          node tools/gravicentra-b4-003-scoped-boundary.test.cjs
          node tools/gravicentra-b4-003-scoped-related-reader.test.cjs
      - name: E4 all report types, GT/CO/TODOS, date and monetary lineage
        run: |
          node tools/gravicentra-b4-003-reportes-e4-transversal.test.cjs
          node tools/gravicentra-b4-003-renovaciones-qa-provenance.test.cjs
      - name: E4 backend routing and prior Preview isolation
        run: |
          node --check orbit360-platform/core/assignable-advisor-roster-client.js
          node --check orbit360-platform/data/store-firestore-product-operational-p0.js
          node tests/goal-participation-isolated-routing.test.cjs
      - name: Preserve Insights, Plantillas and transversal country authority
        run: |
          node tools/gravicentra-b4-003-insights-plantillas-country-no-seed.test.cjs
          node tools/gravicentra-b4-003-client-country-authority.test.cjs
          node tools/gravicentra-b4-003-client-list-transversal-readonly.test.cjs
          node tools/gravicentra-b4-003-cross-module-readback-contract.test.cjs
