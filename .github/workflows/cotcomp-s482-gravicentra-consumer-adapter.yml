name: CotComp S4.82 Gravicentra consumer adapter harness

on:
  push:
    branches:
      - ays/cotcomp-s482-gravicentra-consumer-adapter-harness-20261003
    paths:
      - '.github/cotcomp-lab-intents/s482-consumer-adapter-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s482-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.82 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s482-consumer-adapter-sourceonly.json
          jq -e '
            .authorization=="S482_SOURCE_ONLY_GRAVICENTRA_CONSUMER_ADAPTER" and
            .authority=="GRAVICENTRA" and
            .transport=="SYNTHETIC_ONLY" and
            .firebaseReads==false and
            .firebaseWrites==false and
            .providerOrRater==false and
            .production==false and
            .deploy==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.82 harness tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-gravicentra-authority-contract-s481.js
          node --check cotcomp-gravicentra-consumer-adapter-s482.js
          node --check cotcomp-gravicentra-consumer-adapter-s482.test.js
          node --test cotcomp-gravicentra-authority-contract-s481.test.js
          node --test cotcomp-gravicentra-consumer-adapter-s482.test.js

      - name: Build sanitized S4.82 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s482/evidence"
          node - <<'NODE' > "$RUNNER_TEMP/s482/evidence/S482_CONSUMER_ADAPTER_RECEIPT.json"
          const crypto=require('crypto');
          const payload={
            schemaVersion:'ays-cotcomp-s482-consumer-adapter-receipt-v1.0',
            authority:'GRAVICENTRA',
            transport:'SYNTHETIC_ONLY',
            manifestValidation:true,
            quoteRequestValidation:true,
            proposalProjectionValidation:true,
            comparisonFactValidation:true,
            explicitSelectionValidation:true,
            versionTransitionProof:true,
            existingProposalPinned:true,
            webRedeployForTariffChange:false,
            localFinancialCalculation:false,
            firebaseReads:0,
            firebaseWrites:0,
            providerOrRaterCalls:0,
            productionTouched:false,
            deployed:false
          };
          payload.receiptDigestSha256=crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          process.stdout.write(JSON.stringify(payload,null,2));
          NODE

      - name: Upload sanitized S4.82 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s482-gravicentra-consumer-adapter-${{ github.run_id }}
          path: ${{ runner.temp }}/s482/evidence/S482_CONSUMER_ADAPTER_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
