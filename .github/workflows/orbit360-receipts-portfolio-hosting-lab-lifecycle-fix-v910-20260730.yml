name: Orbit 360 · Recibos/Cartera 9.1.0 · Hosting LAB lifecycle fix once
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/receipts-portfolio-hosting-lab-lifecycle-fix-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-hosting-lab-lifecycle-fix-v910-20260730
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_REQUEST: .github/orbit360-requests/receipts-portfolio-hosting-lab-lifecycle-fix-v910-20260730.json
  ORBIT360_AUTHORIZED_HEAD: 46cb4d0b580f97b8f2b4cb614c4d29fc652335c1
  ORBIT360_PROJECTION_BLOB: 2e3e50cd5ea788a3c88fe09eb2c3f6b1c0a4b8db
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_CHANNEL_ID: orbit360-ays-lab
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  hosting_lifecycle_fix_once:
    name: Hosting LAB exacto + hydration + visual 9.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización, lineage y bridge exacto
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$ORBIT360_REQUEST"
          jq -e '.schemaVersion=="orbit360-hosting-lab-lifecycle-fix-authorization-v1" and .approved==true and .phrase=="AUTORIZO HOSTING LAB FIX PROYECCION RECIBOS CARTERA V910 20260730" and .branch==env.ORBIT360_BRANCH and .authorizedHead==env.ORBIT360_AUTHORIZED_HEAD and .projectionBlob==env.ORBIT360_PROJECTION_BLOB and .projectId==env.ORBIT360_PROJECT_ID and .channelId==env.ORBIT360_CHANNEL_ID and .sourceFix.run==30630611243 and .sourceFix.artifact==8793162582 and .scope.hostingLab==true and .scope.hydrationDiagnostic==true and .scope.browserVisual==true and .scope.rules==false and .scope.functions==false and .scope.storage==false and .scope.dataWrites==false and .scope.production==false and .scope.main==false and .scope.merge==false and .scope.cobros==false and .allowedDeployExecutions==1' "$ORBIT360_REQUEST" >/dev/null
          git merge-base --is-ancestor "$ORBIT360_AUTHORIZED_HEAD" HEAD
          bad="$(git diff --name-only "$ORBIT360_AUTHORIZED_HEAD"..HEAD | grep -Ev '^\.github/workflows/orbit360-receipts-portfolio-hosting-lab-lifecycle-fix-v910-20260730\.yml$|^\.github/orbit360-requests/receipts-portfolio-hosting-lab-lifecycle-fix-v910-20260730\.json$' || true)"
          test -z "$bad"
          test "$(git hash-object orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js)" = "$ORBIT360_PROJECTION_BLOB"
          grep -Fq "if(wrappedStore)return true;if(!Orbit.store||typeof Orbit.store.all!=='function')return false;" orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js
      - name: Gate canónico antes de secrets/deploy/browser
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-receipts-portfolio-hydration-diagnostic-v910-20260730.mjs
          node --check tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Confirmar causa raíz corregida antes del deploy
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js
          node tools/orbit360-test-receipts-portfolio-visual-projection-v910.mjs > "$EVIDENCE_DIR/projection-static-prehosting-v910.json"
          jq -e '.status=="VISUAL_PROJECTION_STATIC_READY" and .failed==0 and ([.checks[] | select(.id=="STORE_WRAP_IDEMPOTENT" or .id=="ATTACH_CAN_REUSE_WRAPPED_STORE") | .ok] | all)' "$EVIDENCE_DIR/projection-static-prehosting-v910.json" >/dev/null
          node tools/orbit360-test-receipts-portfolio-projection-lifecycle-v910-20260730.mjs > "$EVIDENCE_DIR/projection-lifecycle-prehosting-v910.json"
          jq -e '.ok==true and .status=="PROJECTION_LIFECYCLE_PASS" and .checks.ready==true and .checks.bothAttached==true and .checks.receiptCount==true and .checks.portfolioCount==true and .checks.baseStorePreserved==true' "$EVIDENCE_DIR/projection-lifecycle-prehosting-v910.json" >/dev/null
      - name: Instalar herramientas después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Resolver credencial técnica LAB
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-receipts-portfolio-hosting-lifecycle-fix-v910.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Deploy único Hosting LAB preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          firebase hosting:channel:deploy "$ORBIT360_CHANNEL_ID" --project "$ORBIT360_PROJECT_ID" --expires 7d --non-interactive --json > "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-deploy-v910.json"
          test -s "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-deploy-v910.json"
          jq -n --arg head "$GITHUB_SHA" --arg blob "$ORBIT360_PROJECTION_BLOB" '{schemaVersion:"orbit360-hosting-lab-lifecycle-fix-deploy-v1",contractVersion:"9.1.0",ok:true,status:"HOSTING_LAB_DEPLOY_PASS",sourceHead:$head,projectionBlob:$blob,hostingDeployExecutions:1,rulesDeployExecutions:0,functionsDeploy:false,storageDeploy:false,firestoreDataWrites:0,operationalWrites:0,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-deploy-summary-v910.json"
      - name: Verificar paridad remota de activos críticos
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'index.html'
            'core/backend-lab-init.js'
            'core/backend-lab-canonical-view-sync.js'
            'core/backend-lab-receipts-portfolio-projection-v910.js'
            'modules/cliente360.js'
            'modules/polizas.js'
          )
          pass=0
          for f in "${files[@]}"; do
            local_sha="$(sha256sum "orbit360-platform/$f" | awk '{print $1}')"
            tmp="${RUNNER_TEMP}/remote-$(basename "$f")"
            ok=false
            for i in $(seq 1 30); do
              if curl -fsSL --retry 2 "${ORBIT360_LAB_URL}/${f}?orbitV910fix=${GITHUB_SHA}-${i}" -o "$tmp"; then
                remote_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then ok=true; break; fi
              fi
              sleep 3
            done
            test "$ok" = true
            pass=$((pass+1))
          done
          jq -n --argjson pass "$pass" --arg blob "$ORBIT360_PROJECTION_BLOB" '{schemaVersion:"orbit360-hosting-lab-lifecycle-fix-parity-v1",contractVersion:"9.1.0",ok:($pass==6),criticalAssets:6,passed:$pass,failed:(6-$pass),projectionBlob:$blob,hostingLab:true,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-parity-v910.json"
          test "$pass" = '6'
      - name: Diagnóstico corto de hidratación 1293/673
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
          ORBIT360_DIAG_WAIT_MS: '15000'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-receipts-portfolio-hydration-diagnostic-v910-20260730.mjs
          jq -e '.ok==true and .status=="HYDRATION_DIAGNOSTIC_CAPTURED" and .labEntrypointBound==true and .state.counts.clientes==430 and .state.counts.aseguradoras==30 and .state.counts.asesores==7 and .state.counts.polizas==1373 and .state.counts.vehiculos==1032 and .state.counts.recibosEsperados==1293 and .state.counts.carteraPrimas==673 and .state.counts.cobros==0 and .state.counts.finmovs==0 and .state.storeProjection.ready==true and (.state.storeProjection.attached|sort)==(["carteraPrimas","recibosEsperados"]|sort) and .state.storeProjection.counts.recibosEsperados==1293 and .state.storeProjection.counts.carteraPrimas==673 and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/receipts-portfolio-hydration-diagnostic-v910.json" >/dev/null
      - name: Revisión visual automatizada LAB read-only
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          jq -e '.ok==true and .status=="VISUAL_LAB_PASS" and .contractVersion=="9.1.0" and .checks.labEntrypointBound==true and .counts.clientes==430 and .counts.aseguradoras==30 and .counts.asesores==7 and .counts.polizas==1373 and .counts.vehiculos==1032 and .counts.recibosEsperados==1293 and .counts.carteraPrimas==673 and .counts.cobros==0 and .counts.finmovs==0 and .checks.baseline==true and .checks.projectionReady==true and .checks.downstreamZero==true and .checks.activeCalendar==true and .checks.historicalExigible==true and .checks.paymentReportedPendingReconciliation==true and .checks.cobrosSeparated==true and .roleViews["Dirección"].rowsVisible>0 and .roleViews["Operativo"].rowsVisible>0 and .roleViews["Asesor"].rowsVisible>0 and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null
      - name: Cerrar evidencia sanitizada
        if: always()
        shell: bash
        run: |
          set +e
          DEPLOY=false; PARITY=false; HYDRATION=false; VISUAL=false
          jq -e '.ok==true and .status=="HOSTING_LAB_DEPLOY_PASS"' "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-deploy-summary-v910.json" >/dev/null 2>&1 && DEPLOY=true
          jq -e '.ok==true' "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-parity-v910.json" >/dev/null 2>&1 && PARITY=true
          jq -e '.ok==true and .state.counts.recibosEsperados==1293 and .state.counts.carteraPrimas==673 and .state.storeProjection.ready==true' "$EVIDENCE_DIR/receipts-portfolio-hydration-diagnostic-v910.json" >/dev/null 2>&1 && HYDRATION=true
          jq -e '.ok==true and .status=="VISUAL_LAB_PASS"' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null 2>&1 && VISUAL=true
          jq -n --argjson deploy "$DEPLOY" --argjson parity "$PARITY" --argjson hydration "$HYDRATION" --argjson visual "$VISUAL" '{schemaVersion:"orbit360-hosting-lab-lifecycle-fix-final-v1",contractVersion:"9.1.0",ok:($deploy and $parity and $hydration and $visual),status:(if ($deploy and $parity and $hydration and $visual) then "HOSTING_LAB_LIFECYCLE_FIX_AND_VISUAL_PASS" else "HOSTING_LAB_LIFECYCLE_FIX_OR_VISUAL_FAIL" end),hostingDeploy:$deploy,remoteParity:$parity,hydration1293_673:$hydration,visualLab:$visual,hostingDeployExecutions:(if $deploy then 1 else 0 end),rulesDeployExecutions:0,functionsDeploy:false,storageDeploy:false,firestoreDataWrites:0,operationalWrites:0,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-lifecycle-fix-final-v910.json"
      - name: Limpiar credencial temporal
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ]; then rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-hosting-lifecycle-fix-v910-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/projection-static-prehosting-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/projection-lifecycle-prehosting-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hosting-lab-lifecycle-fix-deploy-summary-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hosting-lab-lifecycle-fix-parity-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hydration-diagnostic-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-lab-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hosting-lab-lifecycle-fix-final-v910.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          FINAL: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hosting-lab-lifecycle-fix-final-v910.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Recibos/Cartera lifecycle Hosting LAB/visual failed';
            try{const x=JSON.parse(fs.readFileSync(process.env.FINAL,'utf8'));if(x.ok===true&&x.status==='HOSTING_LAB_LIFECYCLE_FIX_AND_VISUAL_PASS'){state='success';description='Recibos/Cartera lifecycle Hosting LAB + 1293/673 + visual PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-hosting-lifecycle-fix-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
