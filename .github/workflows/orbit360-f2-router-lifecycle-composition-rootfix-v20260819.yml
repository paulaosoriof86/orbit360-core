name: Orbit360 F2 Router Lifecycle Composition Rootfix 20260819
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/f2-router-lifecycle-composition-rootfix-runbound-*.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: orbit360-f2-router-lifecycle-composition-rootfix-20260819
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_CANDIDATE_ARTIFACT_ID: '9385306424'
jobs:
  rootfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable inert rootfix request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST_FILE="${CHANGED[0]}"
          case "$REQUEST_FILE" in .github/orbit360-requests/f2-router-lifecycle-composition-rootfix-runbound-*.json) ;; *) exit 41 ;; esac
          jq -e '.schemaVersion=="orbit360-f2-router-lifecycle-composition-rootfix-request-v1" and .requestVersion=="F2_ROUTER_LIFECYCLE_COMPOSITION_ROOTFIX_V1" and .gateId=="f2-productive-acceptance-exact-successor-v20260818" and .candidateArtifactId==9385306424 and .failedSourceRunId==32310148537 and .failedCode=="CANONICAL_LIFECYCLE_REVISION_MISMATCH" and .status=="INERT_ROOTFIX_ONCE" and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and .scope.secrets==false and .scope.firestoreRead==false and .scope.browser==false and .scope.runtime==false and .scope.writes==false and .scope.deploy==false and .scope.production==false and .containsPII==false and .containsSecrets==false' "$REQUEST_FILE" >/dev/null
          test "$(jq -r '.parentHead' "$REQUEST_FILE")" = "$(git rev-parse HEAD^)"
          node --check tools/orbit360-f2-router-lifecycle-composition-rootfix-v20260819.mjs
      - name: Apply profile-aware lifecycle composition and validate canonical gate
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-f2-router-lifecycle-composition-rootfix-v20260819.mjs | tee /tmp/f2-router-rootfix.json
          grep -F 'F2_ROUTER_LIFECYCLE_COMPOSITION_ROOTFIX_APPLIED_STATIC' /tmp/f2-router-rootfix.json >/dev/null
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          rm -f orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          cp orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json orbit360-platform/runtime-gate-crm-v20260716/f2-router-lifecycle-rootfix-preflight-run-${GITHUB_RUN_ID}.json
          jq -e '.ok==true and .status=="PASS_GATE_CONTRACT_SOURCE_F2_PRODUCTIVE_ACCEPTANCE" and .candidateArtifactId==9385306424 and .canonicalLifecycleComposition=="phase-capability-contract-v2-source-rebind" and .sourceRebindPending==true and .sourceBoundaryAccepted==true and .runtimeAuthorized==false and .browserAuthorized==false and .writeAuthorized==false and .productionAuthorized==false' orbit360-platform/runtime-gate-crm-v20260716/f2-router-lifecycle-rootfix-preflight-run-${GITHUB_RUN_ID}.json >/dev/null
          git diff --check
          test -z "$(git diff --name-only -- orbit360-platform/data orbit360-platform/core/auth.js firestore.rules .github/workflows || true)"
      - name: Commit validator registry and documentation rootfix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-f2-router-rootfix-bot'
          git config user.email 'orbit360-f2-router-rootfix-bot@users.noreply.github.com'
          git add \
            tools/orbit360-validar-gate-contracts-v20260717.mjs \
            tools/orbit360-gate-contract-registry-v20260717.json \
            orbit360-platform/docs/orbit360-live-state-v1.json \
            orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json \
            orbit360-platform/docs/ACADEMIA-DELTA-F2-VALIDATOR-STALE-REBIND-20260819.md \
            orbit360-platform/docs/CHECKPOINT-F2-SOURCE01-VALIDATOR-STALE-LIFECYCLE-COMPOSITION-20260819.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '6'
          git commit -m 'fix(f2): make lifecycle composition gate-profile-aware [skip ci]'
          git fetch origin "$ORBIT360_BRANCH"
          git rebase "origin/$ORBIT360_BRANCH"
          git push origin "HEAD:$ORBIT360_BRANCH"
      - name: Upload sanitized rootfix preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-f2-router-lifecycle-rootfix-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/f2-router-lifecycle-rootfix-preflight-run-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30
