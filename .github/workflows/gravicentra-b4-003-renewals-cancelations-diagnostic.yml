name: Gravicentra B4-003 Renewals Cancelations Diagnostic

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-renewals-cancelations-diagnostic.yml'
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  b4-003-readonly-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      RECEIPT: artifacts/orbit360-recovery/release-control/I6_5_B4_003_RENEWALS_CANCELATIONS_DIAGNOSTIC_20261003.json
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve B4-003 diagnostic mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const legacyRun=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_DIAGNOSTIC'
            && c.currentB4?.status==='B4_ACTIVE_B4_003_READONLY_DIAGNOSTIC'
            && c.currentB4?.activeFindingId==='B4-003'
            && c.currentB4?.noLive===true
            && c.currentB4?.noReimport===true;
          const followup=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_TARGETED_PAULA_VISUAL'
            && c.currentB4?.status==='B4_003_MACHINE_PASS_PENDING_PAULA_VISUAL'
            && c.currentB4?.activeFindingId==='B4-003'
            && c.currentB4?.noLive===true&&c.currentB4?.noReimport===true
            && c.currentB4?.productMutationAuthorized===false&&c.currentB4?.dataMutationAuthorized===false
            && c.currentB4?.livePromotionAuthorized===false
            && fs.existsSync('artifacts/orbit360-recovery/release-control/I6_5_B4_003_R20_LIFECYCLE_HUMAN_REJECTION_AND_STATIC_REPRO_20261008.json');
          const run=legacyRun||followup;
          const receiptPath=followup?'artifacts/orbit360-recovery/release-control/I6_5_B4_003_R20_LINEAGE_AUDIT_READONLY_20261008.json':process.env.RECEIPT;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'followup='+(followup?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'receipt_path='+receiptPath+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(run?'true':'false')+'\n');
          console.log('B4_003_DIAGNOSTIC_MODE='+(run?'RUN':'NOOP'));
          NODE

      - name: Governance preflight
        if: steps.mode.outputs.run == 'true'
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6

      - name: Install backend dependencies
        if: steps.mode.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd functions
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null

      - name: Prepare read-only service account
        if: steps.mode.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b4-003-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          for k in ['SA_ORBIT360_LAB','SA_ORBIT_360_LAB','SA_DEFAULT']:
              raw=os.environ.get(k,'')
              if not raw: continue
              try: d=json.loads(raw)
              except Exception: continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/'service-account.json'
                  p.write_text(json.dumps(d))
                  p.chmod(0o600)
                  print(str(p))
                  break
          else:
              raise SystemExit('B4_003_SERVICE_ACCOUNT_NOT_FOUND')
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ROOT/service-account.json" >> "$GITHUB_ENV"

      - name: Execute read-only renewals cancelations diagnostic
        if: steps.mode.outputs.run == 'true'
        env:
          B4_003_DIAGNOSTIC_OUT: ${{ runner.temp }}/b4-003-renewals-cancelations-diagnostic.json
          B4_003_RENEWAL_LINEAGE_FOLLOWUP: ${{ steps.mode.outputs.followup }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b4-003-renewals-cancelations-diagnostic.cjs
          test -s "$B4_003_DIAGNOSTIC_OUT"

      - name: Upload diagnostic evidence
        if: steps.mode.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-renewals-cancelations-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/b4-003-renewals-cancelations-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Freeze read-only diagnostic receipt
        if: steps.mode.outputs.run == 'true'
        env:
          B4_003_DIAGNOSTIC_OUT: ${{ runner.temp }}/b4-003-renewals-cancelations-diagnostic.json
        run: |
          set -euo pipefail
          cp "$B4_003_DIAGNOSTIC_OUT" "${{ steps.mode.outputs.receipt_path }}"
          git config user.name "gravicentra-release-bot"
          git config user.email "gravicentra-release-bot@users.noreply.github.com"
          git add "${{ steps.mode.outputs.receipt_path }}"
          if git diff --cached --quiet; then
            echo "B4_003_RECEIPT_UNCHANGED"
            exit 0
          fi
          git commit -m "diag(i6.5 B4-003): freeze renewals cancelations evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
