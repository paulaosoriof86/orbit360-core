name: Gravicentra B4-003 Authenticated UAT Successor Hosting Preview

on:
  push:
    branches: [fix/b4-003-uat-runtime-20261101]
    paths:
      - .github/workflows/gravicentra-b4-003-uat-successor-preview-20261101.yml

permissions:
  contents: read

concurrency:
  group: gi-b4003-goals-uat-successor-f598a65f
  cancel-in-progress: false

jobs:
  exact-hosting-only-lab-preview:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/fix/b4-003-uat-runtime-20261101' &&
      github.event.head_commit.message == 'build(i6.5 B4-003): isolated authenticated UAT successor Preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXACT_SOURCE_SHA: f598a65f7cdbbfe358ba54d71e48598aa6174107
      BASE_SHA: 0a25c5a2bf58bbe06537be42388b8530802f9c49
      PROJECT_ID: ays-orbit-360-lab
      HOSTING_SITE: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      RELEASE_GATE: I6.5-B4-003
      BUILD_PREFIX: gi-i65-b4
      ENVIRONMENT_REF: firebase-hosting-preview-i6-5-forensic-b4-003
      GRAVICENTRA_B4_003_SCOPED_PREVIEW: 'true'
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - name: Checkout exact source-only UAT repair commit
        uses: actions/checkout@v4
        with:
          ref: f598a65f7cdbbfe358ba54d71e48598aa6174107
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce source, safety boundary, and five UAT regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$EXACT_SOURCE_SHA" | sort)" = "$(printf '%s\n' orbit360-platform/modules/equipo-onboarding-v20260804-bridge.js orbit360-platform/modules/equipo.js orbit360-platform/modules/inicio.js tests/goal-participation-uat-regressions.test.cjs | sort)"
          test "$(git hash-object orbit360-platform/modules/equipo.js)" = '411b8200a29dedf734e1640576319ccb88fc5c1a'
          test "$(git hash-object orbit360-platform/modules/equipo-onboarding-v20260804-bridge.js)" = '7b0e5cee941f8289a32fc53d2081f1a381fb6974'
          test "$(git hash-object orbit360-platform/modules/inicio.js)" = '51eeabf680f219f50b4784a030aff8a5b55c9720'
          test "$(git hash-object tests/goal-participation-uat-regressions.test.cjs)" = 'eaabd90816631b199a440bd93115e5d829a13010'
          node --test tests/*.test.cjs
          node tools/gravicentra-b4-003-role-first-paint-and-team-regression.test.cjs
          node tools/gravicentra-b4-003-inicio-role-country-team.test.cjs
          node tools/gravicentra-b4-003-metas-atomic-ui.test.cjs

      - name: Snapshot both LIVE portals without changing them
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/live-before.sha256"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/domain-before.sha256"

      - name: Select existing LAB service account and pinned tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goals-uat-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'goals-uat-auth'
          paths=[]
          for n,k in enumerate(('SA_ORBIT360_LAB','SA_ORBIT_360_LAB','SA_DEFAULT')):
              try: value=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError): continue
              if value.get('type')=='service_account' and value.get('project_id')==os.environ['PROJECT_ID'] and value.get('private_key'):
                  p=root/f'{n}.json'
                  p.write_text(json.dumps(value),encoding='utf8')
                  p.chmod(0o600)
                  paths.append(str(p))
          if not paths: raise SystemExit('LAB_SERVICE_ACCOUNT_NOT_CONFIGURED')
          (root/'candidates').write_text('\n'.join(paths)+'\n',encoding='utf8')
          PY
          CLI_ROOT="$RUNNER_TEMP/goals-uat-cli"
          npm install --prefix "$CLI_ROOT" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CLI_ROOT"
          CLI="$CLI_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done < "$RUNNER_TEMP/goals-uat-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/goals-uat-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/goals-uat-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/goals-uat-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null

      - name: Resolve LAB public Firebase web config
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/goals-uat-apps.json"
          export APPS_FILE="$RUNNER_TEMP/goals-uat-apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          result=json.load(open(os.environ['APPS_FILE'])).get('result') or []
          web=[a for a in result if str(a.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1: raise SystemExit('LAB_WEB_APP_CARDINALITY_INVALID')
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/goals-uat-sdkconfig.json"

      - name: Build immutable Goals Preview package with isolated callable flag
        run: |
          set -euo pipefail
          export SOURCE_SHA="$EXACT_SOURCE_SHA"
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/goals-uat-branding.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/goals-uat-branding.json"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/goals-uat-package" "$RUNNER_TEMP/goals-uat-sdkconfig.json" > "$RUNNER_TEMP/goals-uat-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const site=process.env.RUNNER_TEMP+'/goals-uat-package/bundle/site';
          const config=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/goals-uat-package/bundle/firebase.json','utf8'));
          const build=JSON.parse(fs.readFileSync(site+'/__recovery__/build.json','utf8'));
          if(Object.keys(config).join(',')!=='hosting'||config.hosting.site!==process.env.HOSTING_SITE||config.hosting.public!=='site')throw Error('NOT_HOSTING_ONLY');
          if(build.sourceSha!==process.env.EXACT_SOURCE_SHA||build.gate!=='I6.5-B4-003')throw Error('SOURCE_BUILD_MISMATCH');
          for(const rel of ['modules/equipo.js','modules/equipo-onboarding-v20260804-bridge.js','modules/inicio.js']){
            if(!fs.readFileSync('orbit360-platform/'+rel).equals(fs.readFileSync(site+'/'+rel)))throw Error('PRODUCT_BYTES_DRIFT:'+rel);
          }
          const dest=site+'/product-runtime-config.js',source=fs.readFileSync(dest,'utf8'),context={window:{}};
          vm.runInNewContext(source,context,{timeout:1000});
          const publicCfg=context.window.__ORBIT360_PRODUCT_PUBLIC_CONFIG__;
          if(!publicCfg||publicCfg.enabled!==true||publicCfg.projectId!==process.env.PROJECT_ID||publicCfg.scopedReadPreviewCandidate!==true)throw Error('PREVIEW_PUBLIC_CONFIG_UNTRUSTED');
          const output={...publicCfg,goalParticipationPreviewCandidate:true};
          fs.writeFileSync(dest,'/* Goals UAT successor; isolated LAB Preview only. */\nwindow.__ORBIT360_PRODUCT_PUBLIC_CONFIG__ = Object.freeze('+JSON.stringify(output)+');\n');
          NODE

      - name: Deploy exactly one seven-day LAB Hosting Preview, not LIVE
        id: preview
        run: |
          set -euo pipefail
          CHANNEL_ID="gi-i65-b4-goals-f598a65f-${GITHUB_RUN_ID}"
          cd "$RUNNER_TEMP/goals-uat-package/bundle"
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/goals-uat-deploy.json" 2>&1
          export CHANNEL_ID
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['RUNNER_TEMP']+'/goals-uat-deploy.json',encoding='utf8').read()
          wanted='ays-orbit-360-lab--'+os.environ['CHANNEL_ID']
          urls=sorted(set(u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.(?:web\.app|firebaseapp\.com)',raw)))
          candidates=[u for u in urls if wanted in u]
          preferred=[u for u in candidates if u.endswith('.web.app')]
          if len(preferred)==1: print(preferred[0])
          elif len(candidates)==1: print(candidates[0])
          else:
              print('PREVIEW_URL_DISCOVERY_CANDIDATES='+repr(urls),file=__import__('sys').stderr)
              try:
                  parsed=__import__('json').loads(raw)
                  shape=list(parsed) if isinstance(parsed,dict) else [type(parsed).__name__]
              except (ValueError,TypeError): shape=['non_json',len(raw)]
              print('PREVIEW_URL_DISCOVERY_RAW_SHAPE='+repr(shape),file=__import__('sys').stderr)
              raise SystemExit('PREVIEW_URL_NOT_UNIQUE')
          PY
          )
          test -n "$PREVIEW_URL"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Confirm served bytes and no LIVE Hosting mutation
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/goals-uat-package/bundle/site"
          for rel in __recovery__/build.json product-runtime-config.js modules/equipo.js modules/equipo-onboarding-v20260804-bridge.js modules/inicio.js; do
            curl --fail --silent --show-error --location --retry 2 --max-time 30 "$PREVIEW_URL/$rel" > "$RUNNER_TEMP/served-$(basename "$rel")"
            cmp "$ROOT/$rel" "$RUNNER_TEMP/served-$(basename "$rel")"
          done
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum > "$RUNNER_TEMP/live-after.sha256"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://app.aysseguros.com/ | sha256sum > "$RUNNER_TEMP/domain-after.sha256"
          cmp "$RUNNER_TEMP/live-before.sha256" "$RUNNER_TEMP/live-after.sha256"
          cmp "$RUNNER_TEMP/domain-before.sha256" "$RUNNER_TEMP/domain-after.sha256"
          printf '%s\n' "B4-003 HOSTING-ONLY UAT SUCCESSOR PREVIEW PASS" "Pinned source: $EXACT_SOURCE_SHA" "Preview: $PREVIEW_URL" "Only Hosting channel was written. No Functions, shared Rules, Auth, IAM, data, or LIVE changes." "Seven advisors remain unclassified; authenticated UAT repeat and Control Plane successor guard pending; production NO-GO." >> "$GITHUB_STEP_SUMMARY"
