name: CotComp S5.07 Advisor Roster Read-only

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s507-real-customer-pilot-sourceonly-20261007
    paths:
      - 'functions/cotcomp-s507-advisor-roster-readonly.js'
      - '.github/workflows/cotcomp-s507-advisor-roster-readonly.yml'

permissions:
  contents: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab

jobs:
  advisor-roster-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Static read-only guard
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check cotcomp-s507-advisor-roster-readonly.js
          ! grep -Eq '\.(set|create|update|delete)\(' cotcomp-s507-advisor-roster-readonly.js
          ! grep -Eq '\.batch\(' cotcomp-s507-advisor-roster-readonly.js
      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s507-roster/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s507-roster/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Read sanitized advisor roster summary
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node cotcomp-s507-advisor-roster-readonly.js | tee "$RUNNER_TEMP/s507-roster/evidence/ADVISOR_ROSTER_READONLY.json"
          node - "$RUNNER_TEMP/s507-roster/evidence/ADVISOR_ROSTER_READONLY.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.readOnly!==true||r.containsCustomerData!==false||r.containsAdvisorPII!==false)process.exit(1);
          if(!Number.isInteger(r.recordsScanned)||!Number.isInteger(r.gtEligibleAdvisorCount))process.exit(1);
          NODE
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s507-advisor-roster-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/s507-roster/evidence/ADVISOR_ROSTER_READONLY.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s507-roster/firebase-service-account.json"
