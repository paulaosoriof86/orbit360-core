name: Gravicentra I4A Financial Query Constraint Readonly

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-financial-query-constraint-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
  SOURCE_SHA: 0a20a0ee8939c8fe4d2b0904ddf5fda383363434
  BUILD_ID: gi-i3-0a20a0ee8939-57f234755dc1

jobs:
  query-constraint-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts firebase-admin@13.4.0
      - name: Prove physical constraint compatibility
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          OUT_DIR: ${{ runner.temp }}/gravicentra-i4a-financial-constraint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {initializeApp,cert,deleteApp} from 'firebase-admin/app';
          import {getFirestore} from 'firebase-admin/firestore';
          const project=process.env.PROJECT_ID,tenant=process.env.TENANT_ID;
          function sa(){for(const raw of [process.env.SA_DEFAULT,process.env.SA_ORBIT360_LAB,process.env.SA_ORBIT_360_LAB].filter(Boolean)){try{const x=JSON.parse(raw);if(x?.type==='service_account'&&x?.project_id===project&&x?.client_email&&x?.private_key)return x;}catch{}}throw new Error('SERVICE_ACCOUNT_UNAVAILABLE');}
          const app=initializeApp({credential:cert(sa()),projectId:project},'gi-i4a-financial-constraint');const db=getFirestore(app);const ref=n=>db.collection('tenants').doc(tenant).collection('data').doc(n).collection('items');
          const out={schemaVersion:'gravicentra-i4a-financial-query-constraint-readonly-v1',gate:'I4A',sourceSha:process.env.SOURCE_SHA,buildId:process.env.BUILD_ID,productionTouched:false,dataTouched:false,writesExecuted:0,collections:{},decision:'',errors:[]};
          for(const n of ['recibosEsperados','carteraPrimas','cobros']){
            const all=await ref(n).get(); const byTenant=await ref(n).where('tenantId','==',tenant).get();
            let tenantIdPresent=0,tenantIdMatches=0,paisPresent=0,countryPresent=0,asesorIdPresent=0,advisorIdPresent=0,teamIdPresent=0;
            for(const d of all.docs){const r=d.data()||{};if(String(r.tenantId||'').trim())tenantIdPresent++;if(String(r.tenantId||'').trim()===tenant)tenantIdMatches++;if(String(r.pais||'').trim())paisPresent++;if(String(r.country||'').trim())countryPresent++;if(String(r.asesorId||'').trim())asesorIdPresent++;if(String(r.advisorId||'').trim())advisorIdPresent++;if(String(r.teamId||'').trim())teamIdPresent++;}
            out.collections[n]={total:all.size,tenantIdPresent,tenantIdMatches,tenantConstraintQueryCount:byTenant.size,paisPresent,countryPresent,asesorIdPresent,advisorIdPresent,teamIdPresent};
          }
          const r=out.collections.recibosEsperados,c=out.collections.carteraPrimas;
          out.checks={receiptsTenantConstraintEliminatesAll:r.total>0&&r.tenantConstraintQueryCount===0,portfolioTenantConstraintEliminatesAll:c.total>0&&c.tenantConstraintQueryCount===0};
          out.decision=out.checks.receiptsTenantConstraintEliminatesAll&&out.checks.portfolioTenantConstraintEliminatesAll?'ROOT_CAUSE_TENANT_CONSTRAINT_PHYSICALLY_INCOMPATIBLE':'CONSTRAINT_ROOT_CAUSE_NOT_PROVEN';
          fs.writeFileSync(process.env.OUT_DIR+'/financial-query-constraint-readonly.json',JSON.stringify(out,null,2)+'\n');console.log('FINANCIAL_CONSTRAINT_DECISION='+out.decision);console.log('FINANCIAL_CONSTRAINT_COLLECTIONS='+JSON.stringify(out.collections));
          await deleteApp(app);
          NODE
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-financial-constraint-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-financial-constraint
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
