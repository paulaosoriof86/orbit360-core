name: Orbit 360 · Block 12 · candidata visual aislada LAB

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/block12-go-lab-candidate-visible-v4.json'

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-block12-visual-layoutfree-reactivation-v20260804
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/block12-go-lab-candidate-visible-v4.json
  ORBIT360_GATE_ID: block12-operational-runtime-lab-v20260804
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_REAL_TENANT_ID: alianzas-soluciones
  ORBIT360_HOSTING_CHANNEL: orbit360-operational-block12
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_SOURCE_BASELINE: 548cffa50cddfd93ad2118f5a06e9bb420699bde
  ORBIT360_FUNCTIONS: orbit360OpsLeadsCommandLabV20260804,orbit360GetAdvisorOpsInboxLabV20260804,orbit360CobrosReconciliationCommandLabV20260804,orbit360RecurringInsuranceImportLabV20260804
  ORBIT360_RETENTION_CONTRACT_MARKERS: 'hostingPreviewKept:$retain functionsKept:$retain'
  # Requests retirados e inmutables:
  # .github/orbit360-requests/block12-operational-runtime-layoutfree-lab-v20260804.json
  # .github/orbit360-requests/block12-go-lab-candidate-visible-v3.json

jobs:
  lab-candidate-visible:
    name: Gate → 4 Functions → Hosting → 8 rutas aisladas → integridad
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout autorización exacta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar request único v4 y baseline congelado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" --arg baseline "$ORBIT360_SOURCE_BASELINE" '
            .schemaVersion=="orbit360-go-lab-candidate-visible-request-v3" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_GO_LAB_CANDIDATE_VISIBLE" and
            .sourceOnlyCompositionTest==false and .runtimeExecutionAuthorized==true and
            .approved==true and .allowedExecutions==1 and .replayAllowed==false and
            (.authorizationRef|type)=="string" and (.authorizationRef|length)>0 and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .sourceBaseline==$baseline and .parentHead==$parent and
            .previousRuntimeRunId==30962756387 and .previousFunctionalPassed==18 and .previousFunctionalFailed==0 and
            .previousVisualRunId==30971226259 and .previousVisualFailureClassification=="PIPELINE_MECHANISM_FAILURE" and
            .previousVisualFailureCode=="ROUTE_ASEGURADORAS_NAVIGATION_TIMEOUT" and
            .isolatedSyntheticRunId==30971707956 and .isolatedSyntheticStatus=="ISOLATED_ROUTES_SYNTHETIC_PASS" and
            .sourceOnlyCompositionRunId==30977179448 and .sourceOnlyCompositionStatus=="PASS_CANONICAL_PREFLIGHT_COMPOSITION" and
            .replacementMechanism=="ONE_ISOLATED_BROWSER_CONTEXT_AND_DIRECT_URL_PER_ROUTE" and
            .functionalReplayForbidden==true and .retainPreviewOnCaptureOnlyFailure==true and
            .projectId=="ays-orbit-360-lab" and .gateId=="block12-operational-runtime-lab-v20260804" and
            .contractVersion=="12.0.11" and
            .scope.syntheticTenant==false and .scope.syntheticAuthUsers==0 and .scope.syntheticMemberships==0 and
            .scope.functionalScenarioReplay==false and .scope.realTenantWrites==false and
            .scope.realDataReimport==false and .scope.rules==false and .scope.production==false and
            .scope.main==false and .scope.merge==false and (.scope.functionNames|length)==4 and
            (.scope.visualRoutes|length)==8 and .scope.readonlyIntegrityBeforeAfter==true
          ' "$ORBIT360_REQUEST_FILE" >/dev/null
          git cat-file -e "$ORBIT360_SOURCE_BASELINE^{commit}"
          git diff --quiet "$ORBIT360_SOURCE_BASELINE"..HEAD^ -- \
            orbit360-platform/index.html orbit360-platform/core orbit360-platform/modules \
            orbit360-platform/styles orbit360-platform/data functions firebase.json firestore.rules \
            tools/orbit360-block12-cumulative-visual-v20260804.mjs \
            tools/orbit360-block12-visual-readonly-integrity-v20260804.mjs

      - name: Gate contractual obligatorio antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="12.0.11" and .failed==0 and
            .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and
            .writeAuthorized==false and .authWriteAuthorized==false and .maximumSyntheticAuthUsers==0 and
            .maximumSyntheticMemberships==0 and .runtimeAuthorized==false and .visualOnlyAuthorized==true and
            .browserAuthorized==true and .functionsDeployAuthorized==true and .hostingPreviewAuthorized==true and
            .rulesDeployAuthorized==false and .productionAuthorized==false and .realTenantWritesAuthorized==false and
            .realDataReimportAuthorized==false and .secretAccess==false and .firestoreRead==false and
            .firestoreWrites==0 and .authWrites==0 and .runtimeExecuted==false and .browserExecuted==false and
            .deployExecuted==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Resolver identidad LAB después del gate
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-microblock25-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_BLOCK12_VISUAL_INTEGRITY_STATE=$RUNNER_TEMP/orbit360-microblock25-integrity-private.json" >> "$GITHUB_ENV"
          echo "ORBIT360_LOCAL_FIREBASE_CONFIG_FILE=$GITHUB_WORKSPACE/orbit360-platform/core/auth-firebase.config.local.js" >> "$GITHUB_ENV"

      - name: Instalar herramientas reproducibles
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 google-auth-library@9 playwright@1.52.0 ffmpeg-static@5.2.0 firebase-tools@15.25.1 >/dev/null
          npm --prefix functions ci --include=prod
          node tools/orbit360-validar-functions-runtime-dependencies-v20260804.mjs | tee "$RUNNER_TEMP/functions-runtime-pass.json"
          jq -e '.status=="FUNCTIONS_BOOTSTRAP_LOAD_PASS" and .ok==true' "$RUNNER_TEMP/functions-runtime-pass.json" >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module -e "import ffmpegPath from 'ffmpeg-static'; import fs from 'node:fs'; if(!ffmpegPath || !fs.existsSync(ffmpegPath)) process.exit(1);"

      - name: Preparar config, inventarios y snapshot before
        shell: bash
        run: |
          set -euo pipefail
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-before.json" || printf '{}\n' > "$RUNNER_TEMP/functions-before.json"
          npx firebase hosting:channel:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/channels-before.json" || printf '{}\n' > "$RUNNER_TEMP/channels-before.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { GoogleAuth } from 'google-auth-library';
          const project=process.env.ORBIT360_PROJECT_ID;
          const output=process.env.ORBIT360_LOCAL_FIREBASE_CONFIG_FILE;
          const google=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform.read-only']});
          const client=await google.getClient();
          const list=await client.request({url:`https://firebase.googleapis.com/v1beta1/projects/${project}/webApps`});
          const apps=[].concat(list.data?.apps||[]).filter(app=>String(app.state||'').toUpperCase()!=='DELETED').sort((a,b)=>String(a.appId||'').localeCompare(String(b.appId||'')));
          if(!apps.length) throw new Error('DATA_CONTRACT_FAILURE:WEB_APP_NOT_FOUND');
          const response=await client.request({url:`https://firebase.googleapis.com/v1beta1/${apps[0].name}/config`});
          const config=response.data||{};
          if(config.projectId!==project||!config.apiKey||!config.appId||!config.authDomain) throw new Error('DATA_CONTRACT_FAILURE:WEB_CONFIG_INCOMPLETE');
          fs.mkdirSync(path.dirname(output),{recursive:true});
          fs.writeFileSync(output,`window.ORBIT_FIREBASE_LAB_CONFIG=${JSON.stringify({apiKey:config.apiKey,authDomain:config.authDomain,projectId:config.projectId,storageBucket:config.storageBucket||'',messagingSenderId:config.messagingSenderId||'',appId:config.appId})};\nwindow.OrbitBackend=Object.assign({},window.OrbitBackend||{},{firebaseConfigSource:'management-api',firebaseConfigScope:'lab-only'});\n`,'utf8');
          NODE
          node tools/orbit360-block12-visual-readonly-integrity-v20260804.mjs before
          jq -e '.status=="VISUAL_READONLY_SNAPSHOT_BEFORE_PASS" and .firestoreWrites==0 and .authWrites==0 and .ok==true' "$ORBIT360_EVIDENCE_DIR/block12-visual-readonly-integrity.json" >/dev/null

      - name: Desplegar y verificar cuatro Functions allowlisted
        id: functions
        shell: bash
        run: |
          set +e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          ONLY=""
          for NAME in ${ORBIT360_FUNCTIONS//,/ }; do ONLY="${ONLY}${ONLY:+,}functions:${NAME}"; done
          npx firebase deploy --project "$ORBIT360_PROJECT_ID" --only "$ONLY" --non-interactive --force | tee "$RUNNER_TEMP/functions-deploy.log"
          CODE=${PIPESTATUS[0]}
          VERIFIED=0
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-after.json" || true
          if [ "$CODE" = 0 ]; then
            for NAME in ${ORBIT360_FUNCTIONS//,/ }; do grep -Fq "$NAME" "$RUNNER_TEMP/functions-after.json" && VERIFIED=$((VERIFIED+1)); done
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "verified_count=$VERIFIED" >> "$GITHUB_OUTPUT"
          test "$CODE" = 0 && test "$VERIFIED" = 4 && echo "deployed=true" >> "$GITHUB_OUTPUT" || echo "deployed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Desplegar Hosting preview LAB
        id: hosting
        if: always() && steps.functions.outputs.verified_count == '4'
        shell: bash
        run: |
          set +e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          LOG="$RUNNER_TEMP/hosting-channel.log"
          npx firebase hosting:channel:deploy "$ORBIT360_HOSTING_CHANNEL" --expires 7d --project "$ORBIT360_PROJECT_ID" --non-interactive | tee "$LOG"
          CODE=${PIPESTATUS[0]}
          URL="$(grep -Eo 'https://[-A-Za-z0-9.]+\.web\.app' "$LOG" | tail -1)"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = 0 ] && [ -n "$URL" ]; then
            echo "ORBIT360_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Verificar ocho rutas aisladas y directas
        id: visual
        if: always() && steps.hosting.outputs.deployed == 'true'
        shell: bash
        run: |
          set +e
          rm -rf "$ORBIT360_EVIDENCE_DIR/block12-cumulative-visual" "$ORBIT360_EVIDENCE_DIR/block12-cumulative-visual-sanitized.json"
          timeout --signal=TERM --kill-after=15s 240s node tools/orbit360-block12-cumulative-visual-v20260804.mjs
          CODE=$?
          pkill -TERM -f 'headless_shell|chrome-linux|chromium' 2>/dev/null || true
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Confirmar snapshot after e integridad
        id: integrity
        if: always()
        shell: bash
        run: |
          set +e
          CODE=97
          if [ -n "${ORBIT360_BLOCK12_VISUAL_INTEGRITY_STATE:-}" ] && [ -f "$ORBIT360_BLOCK12_VISUAL_INTEGRITY_STATE" ]; then
            node tools/orbit360-block12-visual-readonly-integrity-v20260804.mjs after
            CODE=$?
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Consolidar decisión observada y aplicar retención segura
        id: decision
        if: always()
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.hosting.outputs.url }}
          FUNCTIONS_VERIFIED: ${{ steps.functions.outputs.verified_count }}
          FUNCTIONS_ATTEMPTED: ${{ steps.functions.outputs.attempted }}
          HOSTING_ATTEMPTED: ${{ steps.hosting.outputs.attempted }}
          HOSTING_DEPLOYED: ${{ steps.hosting.outputs.deployed }}
          VISUAL_EXIT: ${{ steps.visual.outputs.exit_code }}
          INTEGRITY_EXIT: ${{ steps.integrity.outputs.exit_code }}
        run: |
          set -euo pipefail
          VISUAL="$ORBIT360_EVIDENCE_DIR/block12-cumulative-visual-sanitized.json"
          INTEGRITY="$ORBIT360_EVIDENCE_DIR/block12-visual-readonly-integrity.json"
          VISUAL_OK=false
          INTEGRITY_OK=false
          test -f "$VISUAL" && VISUAL_OK="$(jq -r '(.schemaVersion=="orbit360-block12-cumulative-visual-v6" and .status=="CUMULATIVE_VISUAL_LAB_PASS" and .classification=="GO_LAB_CUMULATIVE_VISUAL_EVIDENCE_READY" and .navigationMechanism=="one-isolated-browser-context-and-direct-url-per-route" and .inPageHashNavigationUsed==false and .captureEngine=="isolated-context-direct-url-video-plus-ffmpeg-static-frame" and .layoutDependentTextReadUsed==false and .screenshotApisUsed==false and .cdpScreenshotUsed==false and .customTokenEphemeralPerRoute==true and .routeCount==8 and .authWrites==0 and .firestoreWrites==0 and .realTenantWrites==0 and .ok==true and ([.routes[] | select(.isolatedContext!=true or .directRouteUrlConfirmed!=true or .signInResolved!=true or (.frameBytes // 0)<=1000 or (.videoBytes // 0)<=1000 or (.pageErrors|length)>0)] | length)==0 and (.pageErrors|length)==0)' "$VISUAL")"
          test -f "$INTEGRITY" && INTEGRITY_OK="$(jq -r '(.status=="VISUAL_READONLY_INTEGRITY_PASS" and .unchanged==true and .firestoreWrites==0 and .authWrites==0 and .ok==true)' "$INTEGRITY")"
          FUNCTIONS_OK=false
          HOSTING_OK=false
          PRODUCT_OK=false
          PASS=false
          RETAIN=false
          [ "${FUNCTIONS_VERIFIED:-0}" = 4 ] && FUNCTIONS_OK=true
          [ "${HOSTING_DEPLOYED:-false}" = true ] && [ -n "${PREVIEW_URL:-}" ] && HOSTING_OK=true
          [ "$FUNCTIONS_OK" = true ] && [ "$HOSTING_OK" = true ] && [ "$INTEGRITY_OK" = true ] && PRODUCT_OK=true
          [ "$PRODUCT_OK" = true ] && [ "$VISUAL_OK" = true ] && [ "${VISUAL_EXIT:-99}" = 0 ] && [ "${INTEGRITY_EXIT:-99}" = 0 ] && PASS=true
          [ "$PRODUCT_OK" = true ] && RETAIN=true

          if [ "$RETAIN" != true ]; then
            if [ "${FUNCTIONS_ATTEMPTED:-false}" = true ]; then
              for NAME in ${ORBIT360_FUNCTIONS//,/ }; do
                if ! grep -Fq "$NAME" "$RUNNER_TEMP/functions-before.json" 2>/dev/null; then
                  npx firebase functions:delete "$NAME" --region us-central1 --project "$ORBIT360_PROJECT_ID" --force || true
                fi
              done
            fi
            if [ "${HOSTING_ATTEMPTED:-false}" = true ] && ! grep -Fq "$ORBIT360_HOSTING_CHANNEL" "$RUNNER_TEMP/channels-before.json" 2>/dev/null; then
              npx firebase hosting:channel:delete "$ORBIT360_HOSTING_CHANNEL" --project "$ORBIT360_PROJECT_ID" --force || true
            fi
          fi

          DECISION='STOP_LAB_CANDIDATE_REACTIVATION_ROLLED_BACK'
          CLASSIFICATION='PIPELINE_OR_INTEGRITY_FAILURE'
          if [ "$PASS" = true ]; then
            DECISION='GO_LAB_CANDIDATE_VISIBLE'
            CLASSIFICATION='GO_LAB_PENDING_MANUAL_FRAME_REVIEW'
          elif [ "$RETAIN" = true ]; then
            DECISION='STOP_VISUAL_EVIDENCE_PREVIEW_RETAINED'
            CLASSIFICATION='PIPELINE_MECHANISM_FAILURE'
          fi

          REQUEST_COMMIT="$(git rev-parse HEAD)" \
          DEPLOYED_SOURCE_HEAD="$(git rev-parse HEAD^)" \
          SOURCE_BASELINE="$ORBIT360_SOURCE_BASELINE" \
          DECISION="$DECISION" CLASSIFICATION="$CLASSIFICATION" \
          PREVIEW_URL="${PREVIEW_URL:-}" PREVIEW_RETAINED="$RETAIN" \
          FUNCTIONS_EXPECTED='4' FUNCTIONS_VERIFIED="${FUNCTIONS_VERIFIED:-0}" \
          FUNCTIONS_DEPLOY_ATTEMPTED="${FUNCTIONS_ATTEMPTED:-false}" FUNCTIONS_KEPT="$RETAIN" \
          HOSTING_DEPLOY_ATTEMPTED="${HOSTING_ATTEMPTED:-false}" \
          PRODUCT_AND_INTEGRITY_PASS="$PRODUCT_OK" VISUAL_EVIDENCE_PASS="$VISUAL_OK" INTEGRITY_PASS="$INTEGRITY_OK" \
          MANUAL_FRAME_REVIEW_REQUIRED="$PASS" VISUAL_EXIT_CODE="${VISUAL_EXIT:-99}" INTEGRITY_EXIT_CODE="${INTEGRITY_EXIT:-99}" \
          AUTHORIZATION_CONSUMED='true' ALLOWED_EXECUTIONS_REMAINING='0' OK="$PASS" \
          node tools/orbit360-build-go-lab-candidate-visible-decision-v20260805.mjs

          jq -e --arg decision "$DECISION" --argjson pass "$PASS" --argjson retain "$RETAIN" --argjson observed "${FUNCTIONS_VERIFIED:-0}" '
            .schemaVersion=="orbit360-go-lab-candidate-visible-decision-v2" and
            .decision==$decision and .ok==$pass and
            .functionsExpected==4 and .functionsVerified==$observed and .observedCountersOnly==true and
            .functionsKept==$retain and .hostingPreviewKept==$retain and
            .rulesDeployed==false and .realTenantWrites==0 and .authWrites==0 and
            .realDataReimported==false and .productionTouched==false and .mainTouched==false and .mergeExecuted==false
          ' "$ORBIT360_EVIDENCE_DIR/go-lab-candidate-visible-decision-v20260804.json" >/dev/null
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "preview_url=$(if [ "$RETAIN" = true ]; then printf '%s' "${PREVIEW_URL:-}"; fi)" >> "$GITHUB_OUTPUT"
          [ "$PASS" = true ] || exit 45

      - name: Publicar evidencias sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-go-lab-candidate-visible-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-cumulative-visual-sanitized.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-cumulative-visual/*.png
            orbit360-platform/runtime-gate-crm-v20260716/block12-visual-readonly-integrity.json
            orbit360-platform/runtime-gate-crm-v20260716/go-lab-candidate-visible-decision-v20260804.json
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar cierre sanitizado en PR 5
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.decision.outputs.decision }}
          PREVIEW_URL: ${{ steps.decision.outputs.preview_url }}
          FUNCTIONS_VERIFIED: ${{ steps.functions.outputs.verified_count }}
          VISUAL_EXIT: ${{ steps.visual.outputs.exit_code }}
          INTEGRITY_EXIT: ${{ steps.integrity.outputs.exit_code }}
        run: |
          set -euo pipefail
          BODY="## RC-AYS-LAB-CANONICA-01 · Microbloque visual v4 · run ${GITHUB_RUN_ID}\n\n- Decisión: \`${DECISION:-NO_DECISION}\`\n- Functions allowlisted verificadas: \`${FUNCTIONS_VERIFIED:-0}/4\`\n- Visual exit: \`${VISUAL_EXIT:-no-ejecutado}\`\n- Integridad exit: \`${INTEGRITY_EXIT:-no-ejecutado}\`\n- URL LAB retenida: ${PREVIEW_URL:-no}\n- Repetición de 18 escenarios: no\n- Rules, reimportación, producción, main o merge: no"
          gh api "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="$BODY" >/dev/null
