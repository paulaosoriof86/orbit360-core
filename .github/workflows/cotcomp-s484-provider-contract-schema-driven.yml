name: CotComp S4.84 Gravicentra provider contract schema-driven consumer

on:
  push:
    branches:
      - ays/cotcomp-s484-provider-contract-schema-driven-sourceonly-20261003
    paths:
      - '.github/cotcomp-lab-intents/s484-provider-contract-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s484-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.84 source-only authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s484-provider-contract-sourceonly.json
          jq -e '
            .authorization=="S484_SOURCE_ONLY_PROVIDER_CONTRACT_SCHEMA_DRIVEN" and
            .providerContractVersion=="gravicentra-quote-authority-v1" and
            .authority=="GRAVICENTRA" and
            .transport=="FIXTURE_SOURCE_ONLY" and
            .schemaDriven==true and
            .multiproduct==true and
            .providerDeploymentAuthorized==false and
            .cotcompRealTransportAuthorized==false and
            .firebaseReads==false and
            .firebaseWrites==false and
            .providerOrRater==false and
            .production==false and
            .deploy==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated CotComp QA plus S4.81/S4.82/S4.84 contract tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-gravicentra-authority-contract-s481.js
          node --check cotcomp-gravicentra-consumer-adapter-s482.js
          node --check cotcomp-gravicentra-provider-contract-s484.js
          node --check cotcomp-gravicentra-provider-contract-s484.test.js
          node --test cotcomp-gravicentra-authority-contract-s481.test.js
          node --test cotcomp-gravicentra-consumer-adapter-s482.test.js
          node --test cotcomp-gravicentra-provider-contract-s484.test.js

      - name: Build sanitized S4.84 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s484/evidence"
          node - <<'NODE' > "$RUNNER_TEMP/s484/evidence/S484_PROVIDER_CONTRACT_SCHEMA_DRIVEN_RECEIPT.json"
          const crypto=require('crypto');
          const S=require('./functions/cotcomp-gravicentra-provider-contract-s484');
          const policy=S.sourceOnlyPolicy();
          const payload={
            schemaVersion:'ays-cotcomp-s484-provider-contract-receipt-v1.0',
            providerContractVersion:S.PROVIDER_CONTRACT_VERSION,
            authority:S.AUTHORITY,
            schemaDriven:policy.schemaDriven,
            multiproduct:policy.multiproduct,
            localTariffEngine:policy.localTariffEngine,
            localFinancialRecalculation:policy.localFinancialRecalculation,
            localTaxOrFinanceDefaults:policy.localTaxOrFinanceDefaults,
            missingImpliesNotCovered:policy.missingImpliesNotCovered,
            directBrowserProviderCalls:policy.directBrowserProviderCalls,
            duplicatedKnowledgeBase:policy.duplicatedKnowledgeBase,
            providerDeploymentAuthorized:policy.providerDeploymentAuthorized,
            cotcompRealTransportAuthorized:policy.cotcompRealTransportAuthorized,
            realTransport:policy.realTransport,
            firebaseReads:0,
            firebaseWrites:0,
            providerOrRaterCalls:0,
            productionTouched:false,
            deployed:false
          };
          payload.receiptDigestSha256=crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          process.stdout.write(JSON.stringify(payload,null,2));
          NODE

      - name: Upload sanitized S4.84 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s484-provider-contract-schema-driven-${{ github.run_id }}
          path: ${{ runner.temp }}/s484/evidence/S484_PROVIDER_CONTRACT_SCHEMA_DRIVEN_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
