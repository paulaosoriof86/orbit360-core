name: Orbit 360 · M5 Hosting LAB delivery 5.0.41
run-name: M5 5.0.41 · one-shot Hosting LAB · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-hosting-request-541-v20260730.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-hosting-delivery-541-v20260730
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  EXPECTED_RC_HASH: 9bd2c847a2884be900283f86802dbbd0390ae5bc6ccc17b3a5cf4d389c78a4ee
  EXPECTED_PROJECT_ID: ays-orbit-360-lab
  EXPECTED_CHANNEL: orbit360-ays-lab
  AUTH_FILE: tools/orbit360-m5-hosting-authorization-541-v20260730.json
  REQUEST_FILE: tools/orbit360-m5-hosting-request-541-v20260730.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  delivery:
    name: M5 · exactly one Hosting LAB delivery 5.0.41
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar request inmutable y primer intento
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test -f "$REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '.schemaVersion=="orbit360-m5-hosting-request-541-v1" and .authorizedParentCommit==$parent and .releaseCandidateHash==env.EXPECTED_RC_HASH and .allowedExecutions==1 and .hostingLabDeliveryAuthorized==true and .target.projectId==env.EXPECTED_PROJECT_ID and .target.channel==env.EXPECTED_CHANNEL and .runtime==false and .firestoreRead==false and .firestoreWrites==0 and .functionsDeploy==false and .rulesDeploy==false and .production==false and .main==false and .merge==false and .polizas==false and .immutableRequest==true' "$REQUEST_FILE" >/dev/null
      - name: Preflight canónico antes de secretos y deploy
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_ACADEMIA_LEGACY_SEED_MARKER_540_STATIC_PASS" and .contractVersion=="5.0.40" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==46 and .remoteAssetsExpected==29 and .remoteAssetsMatched==25 and .mismatchCount==4 and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Confirmar autorización y paridad previa 25/29
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.explicitAuthorization==true and .hostingLabDeliveryAuthorized==true and .allowedHostingExecutions==1 and .authorizationConsumed==false and .releaseCandidateHash==env.EXPECTED_RC_HASH and .target.projectId==env.EXPECTED_PROJECT_ID and .target.channel==env.EXPECTED_CHANNEL and .immutableAfterCreation==true' "$AUTH_FILE" >/dev/null
          node tools/orbit360-m5-release-candidate-readiness-540-v20260730.mjs
          cp "$EVIDENCE_DIR/m5-release-candidate-readiness-540-summary.json" "$EVIDENCE_DIR/m5-hosting-readiness-541-before.json"
          jq -e '.ok==true and .status=="M5_RC_540_STATIC_REMEDIATION_READY_LAB_DELIVERY_REQUIRED" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .remoteLab.assetsExpected==29 and .remoteLab.assetsMatched==25 and .remoteLab.mismatchCount==4 and .remoteLab.expectedFourPendingLegacySeedMarkerAssets==true and .approvalReadyForLabDelivery==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false' "$EVIDENCE_DIR/m5-hosting-readiness-541-before.json" >/dev/null
      - name: Instalar Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@latest
      - name: Resolver identidad LAB después del preflight
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m5-hosting-541-lab.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$EXPECTED_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Ejecutar único Hosting LAB 5.0.41
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "$EXPECTED_CHANNEL" --project "$EXPECTED_PROJECT_ID" --config firebase.json --expires 7d --non-interactive --json > "$EVIDENCE_DIR/m5-hosting-deploy-541-raw.json"
      - name: Verificar paridad posterior 29/29
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-540-v20260730.mjs
          cp "$EVIDENCE_DIR/m5-release-candidate-readiness-540-summary.json" "$EVIDENCE_DIR/m5-hosting-readiness-541-after.json"
          jq -e '.ok==true and .status=="M5_RC_540_READY_FOR_RUNTIME_AFTER_HOSTING" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .remoteLab.assetsExpected==29 and .remoteLab.assetsMatched==29 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .approvalReadyForRuntimeSmoke==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false' "$EVIDENCE_DIR/m5-hosting-readiness-541-after.json" >/dev/null
      - name: Crear cierre sanitizado
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const d=process.env.EVIDENCE_DIR;
          const b=JSON.parse(fs.readFileSync(path.join(d,'m5-hosting-readiness-541-before.json'),'utf8'));
          const a=JSON.parse(fs.readFileSync(path.join(d,'m5-hosting-readiness-541-after.json'),'utf8'));
          const out={schemaVersion:'orbit360-m5-hosting-delivery-541-summary-v1',generatedAt:new Date().toISOString(),ok:true,status:'M5_HOSTING_541_DELIVERED_AND_29_OF_29_VERIFIED',gateId:process.env.ORBIT360_GATE_ID,contractVersion:'5.0.41',candidateContractVersion:'5.0.40',releaseCandidateHash:process.env.EXPECTED_RC_HASH,projectId:process.env.EXPECTED_PROJECT_ID,channel:process.env.EXPECTED_CHANNEL,beforeAssetsMatched:b.remoteLab.assetsMatched,beforeMismatchCount:b.remoteLab.mismatchCount,afterAssetsMatched:a.remoteLab.assetsMatched,afterMismatchCount:a.remoteLab.mismatchCount,afterRemoteParity:a.remoteLab.remoteParity,hostingDeployExecuted:true,hostingDeployExecutions:1,secretsUsed:true,firestoreRead:false,firestoreWrites:0,operationalWrites:0,browser:false,runtime:false,functionsDeploy:false,rulesDeploy:false,production:false,main:false,merge:false,polizas:false,visualReviewExecuted:false,approvalReadyForRuntimeAuthorization:true,containsPII:false,containsSecrets:false};
          fs.writeFileSync(path.join(d,'m5-hosting-delivery-541-summary.json'),JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-hosting-delivery-541-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-hosting-readiness-541-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-hosting-readiness-541-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-hosting-delivery-541-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 Hosting 5.0.41 delivery failed';
            try{const p=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/m5-hosting-delivery-541-summary.json','utf8'));if(p.ok===true&&p.status==='M5_HOSTING_541_DELIVERED_AND_29_OF_29_VERIFIED'&&p.afterAssetsMatched===29&&p.hostingDeployExecutions===1){state='success';description='M5 Hosting 5.0.41 PASS; 29/29 verified';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-hosting-delivery-541',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
