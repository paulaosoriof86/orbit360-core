name: CotComp S5.01 Real Channels + Hero Cleanup LAB

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s501-real-channels-hero-cleanup-lab-20261005
    paths:
      - 'functions/cotcomp-owner-review-s501.js'
      - 'functions/cotcomp-owner-review-s501.test.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/cotcomp-s501-real-channels-hero-cleanup-lab.yml'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_FUNCTION: cotcompOwnerReviewS501
  COTCOMP_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompOwnerReviewS501

jobs:
  s501-real-channels-hero-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deny boundaries and real-channel source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "production:false" functions/cotcomp-owner-review-s501.js
          grep -q "writes:false" functions/cotcomp-owner-review-s501.js
          grep -q "automaticInternalNotification:false" functions/cotcomp-owner-review-s501.js
          grep -q "50256149048" functions/cotcomp-owner-review-s501.js
          grep -q "573138340897" functions/cotcomp-owner-review-s501.js
          grep -q "info@aysseguros.com" functions/cotcomp-owner-review-s501.js

      - name: Run S5.00 + S5.01 QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check cotcomp-owner-review-s500.js
          node --test cotcomp-owner-review-s500.test.js
          node --check cotcomp-owner-review-s501.js
          node --check cotcomp-owner-review-s501.test.js
          node --test cotcomp-owner-review-s501.test.js

      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s501/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s501/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S5.01 to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$COTCOMP_FUNCTION" --project "$COTCOMP_PROJECT_ID" --non-interactive --force

      - name: Physical readback
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/s501/evidence"
          CODE="$(curl -sS -o "$E/page.html" -w '%{http_code}' "$COTCOMP_URL")"
          test "$CODE" = "200"
          grep -q 'S5.01 — Owner feedback' "$E/page.html" || grep -q 'S5.01' "$E/page.html"
          grep -q 'Continuar por WhatsApp' "$E/page.html"
          grep -q 'Continuar por correo' "$E/page.html"
          grep -q '50256149048' "$E/page.html"
          grep -q '573138340897' "$E/page.html"
          grep -q 'info@aysseguros.com' "$E/page.html"
          grep -q 'cc-combo-fallback-link{display:none!important}' "$E/page.html"
          POST_CODE="$(curl -sS -o "$E/post.txt" -w '%{http_code}' -X POST "$COTCOMP_URL")"
          test "$POST_CODE" = "405"
          node - "$E/S501_RECEIPT.json" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({
            schemaVersion:'ays-cotcomp-s501-receipt-v1.0',
            functionUrl:process.env.COTCOMP_URL,
            heroSimplified:true,
            persistentFallbackHidden:true,
            whatsappGt:true,
            whatsappCo:true,
            email:true,
            automaticInternalNotification:false,
            productionTouched:false,
            writes:false
          },null,2));
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s501-real-channels-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s501/evidence/S501_RECEIPT.json
            ${{ runner.temp }}/s501/evidence/page.html
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s501/firebase-service-account.json"
