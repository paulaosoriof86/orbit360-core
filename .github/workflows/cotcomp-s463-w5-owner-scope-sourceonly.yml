name: CotComp S4.63 W5 Owner scope approval source-only

on:
  push:
    branches:
      - ays/cotcomp-s463-w5-owner-scope-approval-20261001
    paths:
      - '.github/cotcomp-lab-intents/s463-w5-owner-scope-approval.json'

permissions:
  contents: read
  actions: read

jobs:
  s463-w5-owner-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.63 intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s463-w5-owner-scope-approval.json
          jq -e '
            .authorization=="S463_W5_OWNER_SCOPE_APPROVAL_SOURCE_ONLY" and
            .projectId=="ays-orbit-360-lab" and
            .stage=="W5" and
            .appDataReads==false and
            .appDataWrites==false and
            .realData==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA and S4.63 tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-w5-owner-scope-approval-s463.js
          node --check cotcomp-w5-owner-scope-approval-s463.test.js
          node --test cotcomp-w5-owner-scope-approval-s463.test.js

      - name: Build and enforce S4.63 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s463/evidence"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./functions/cotcomp-w5-owner-scope-approval-s463');
          const r=s.evaluate();
          const out={
            schemaVersion:'ays-cotcomp-s463-w5-owner-scope-approval-receipt-v1.0',
            projectId:'ays-orbit-360-lab',
            stage:'W5',
            ownerScopeApproved:r.ownerScopeApproved,
            ownerSuccessDispositionApproved:r.ownerSuccessDispositionApproved,
            approvedScope:r.approvedScope,
            closedGates:r.closedGates,
            remainingBlockers:r.remainingBlockers,
            executionBindingsReady:r.executionBindingsReady,
            executionAllowed:r.executionAllowed,
            realDataAllowed:r.realDataAllowed,
            productionAllowed:r.productionAllowed,
            boundaries:{
              appDataReadsExecuted:0,
              appDataWritesExecuted:0,
              realDataTouched:false,
              productionTouched:false
            }
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s463/evidence/S463_W5_OWNER_SCOPE_APPROVAL_RECEIPT.json',JSON.stringify(out,null,2));
          NODE
          R="$RUNNER_TEMP/s463/evidence/S463_W5_OWNER_SCOPE_APPROVAL_RECEIPT.json"
          jq -e '
            .ownerScopeApproved==true and
            .ownerSuccessDispositionApproved==true and
            .approvedScope.country=="GT" and
            .approvedScope.journeyId=="GT_AUTO_MOTO_HYBRID" and
            .approvedScope.allowedStages==["W1","W2","W3","W4"] and
            .approvedScope.maxQuoteCases==1 and
            .approvedScope.maxDataSubjects==1 and
            .approvedScope.maxExistingRecordsTouched==8 and
            .approvedScope.allowedExecutions==1 and
            .approvedScope.successDisposition=="ROLLBACK_TO_BEFORE_STATE" and
            .approvedScope.realDataExecutionAuthorized==false and
            .approvedScope.finalW5Authorization==false and
            .executionBindingsReady==false and
            .executionAllowed==false and
            .realDataAllowed==false and
            .productionAllowed==false and
            .remainingBlockers==[
              "FORMAL_LEGAL_VALIDATION_REQUIRED",
              "W5_CASE_SELECTOR_COMMITMENT_REQUIRED",
              "W5_ACTOR_SELECTOR_COMMITMENT_REQUIRED",
              "W5_CONSENT_EVIDENCE_COMMITMENT_REQUIRED",
              "OWNER_W5_REAL_DATA_AUTHORIZATION_REQUIRED"
            ] and
            .boundaries.appDataReadsExecuted==0 and
            .boundaries.appDataWritesExecuted==0 and
            .boundaries.realDataTouched==false and
            .boundaries.productionTouched==false
          ' "$R" >/dev/null

      - name: Upload S4.63 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s463-w5-owner-scope-${{ github.run_id }}
          path: ${{ runner.temp }}/s463/evidence/S463_W5_OWNER_SCOPE_APPROVAL_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
