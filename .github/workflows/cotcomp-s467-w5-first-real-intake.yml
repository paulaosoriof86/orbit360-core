# G12 controlled source-only hold: no real data, no Firebase access, no Hosting publish.
name: CotComp S4.67 W5 First Real Intake SOURCE ONLY HOLD
on:
  push:
    branches:
      - ays/cotcomp-s467-w5-first-real-intake-20261001
    paths:
      - '.github/cotcomp-lab-intents/s467-w5-first-real-intake-authorized.json'
      - '.github/workflows/cotcomp-s467-w5-first-real-intake.yml'
permissions:
  contents: read
jobs:
  s467-contract-sourceonly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify S4.67 authorization intent and exact source parent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s467-w5-first-real-intake-authorized.json
          test "$(git hash-object "$I")" = "b0cb9fa5e5430b7a0400473ec6370fc56b5bab87"
          jq -e '
            .authorization=="S467_W5_FIRST_REAL_INTAKE_READINESS" and
            .authorizedSourceParent=="b5156a9b0b232df58aafdc168b91503087d17ab6" and
            .projectId=="ays-orbit-360-lab" and
            .tenantId=="alianzas-soluciones" and
            .country=="GT" and
            .journeyId=="GT_AUTO_MOTO_HYBRID" and
            .maxQuoteCases==1 and
            .maxDataSubjects==1 and
            .singleUse==true and
            .generalPersistenceRelease==false and
            .appCheckRequired==true and
            .healthSensitiveData==false and
            .providerOrRaterCalls==false and
            .production==false and
            .issuance==false and
            .binding==false and
            .payment==false
          ' "$I" >/dev/null
      - name: Local S4.67 functional contract tests without cloud access
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check cotcomp-w5-first-real-intake-s467.js
          node --check cotcomp-w5-first-real-intake-s467.test.js
          node --test cotcomp-w5-first-real-intake-s467.test.js
      - name: Explicit no real-data no-deploy receipt
        run: echo 'G12_S467_SOURCE_ONLY_HOLD NO_HOSTING_MUTATION NO_FUNCTION_DEPLOY NO_FIRESTORE_WRITES NO_REAL_DATA NO_APPCHECK_EXCHANGE'
# Frozen S4.67 original one-shot authorization is a source constraint only; not an execution permission.
