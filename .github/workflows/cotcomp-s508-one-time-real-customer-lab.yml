name: CotComp S5.08 One-time Real-Customer LAB Intake

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s508-one-time-real-customer-lab-20261007
    paths:
      - 'functions/cotcomp-real-customer-pilot-s508.js'
      - 'functions/cotcomp-s508-private-page.js'
      - 'functions/cotcomp-real-customer-pilot-s508.test.js'
      - 'functions/cotcomp-s508-state-readonly.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/cotcomp-s508-one-time-real-customer-lab.yml'

permissions:
  contents: read
  actions: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab
  S508_FUNCTION: cotcompRealCustomerPilotS508
  S508_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompRealCustomerPilotS508

jobs:
  deploy-private-one-time-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Source and contract QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check cotcomp-real-customer-pilot-s508.js
          node --check cotcomp-s508-private-page.js
          node --check cotcomp-s508-state-readonly.js
          node --test cotcomp-real-customer-pilot-s508.test.js
          grep -q "PROJECT_ID='ays-orbit-360-lab'" cotcomp-real-customer-pilot-s508.js
          grep -q "RETENTION='RETAIN_IF_VALID_BUSINESS_RECORD'" cotcomp-real-customer-pilot-s508.js
          grep -q "marketingConsent:false" cotcomp-real-customer-pilot-s508.js
          ! grep -q "sk-" cotcomp-real-customer-pilot-s508.js
      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s508/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s508/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.0
      - name: Deploy only S5.08 endpoint to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$S508_FUNCTION" --project "$GCLOUD_PROJECT" --non-interactive --force
      - name: GET private intake surface
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o "$RUNNER_TEMP/s508/evidence/page.html" -w '%{http_code}' "$S508_URL")"
          test "$CODE" = "200"
          grep -q "Solicitud privada de asesoría" "$RUNNER_TEMP/s508/evidence/page.html"
          grep -q "Paula Osorio" "$RUNNER_TEMP/s508/evidence/page.html"
          grep -q "Marketing está desactivado" "$RUNNER_TEMP/s508/evidence/page.html"
          grep -q "12 meses" "$RUNNER_TEMP/s508/evidence/page.html"
      - name: Invalid capability must be denied without consuming intake
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"brand":"Synthetic","lineModel":"QA","name":"Synthetic QA","whatsapp":"+502 5555 0000","email":"synthetic@example.invalid","note":"synthetic only","adultConfirmed":true,"requestManagementConsent":true}'
          CODE="$(curl -sS -o "$RUNNER_TEMP/s508/evidence/invalid.json" -w '%{http_code}' -X POST "$S508_URL" -H 'Content-Type: application/json' -H 'X-Ays-Pilot-Capability: invalid-capability' --data "$BODY")"
          test "$CODE" = "403"
      - name: Verify one-time state remains unused
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node cotcomp-s508-state-readonly.js | tee "$RUNNER_TEMP/s508/evidence/state.json"
          node - "$RUNNER_TEMP/s508/evidence/state.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.used!==false||r.processing!==false||r.containsPii!==false)process.exit(1);
          NODE
      - name: Build sanitized deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/s508/evidence/state.json" <<'NODE' > "$RUNNER_TEMP/s508/evidence/receipt.json"
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({
            schemaVersion:'ays-cotcomp-s508-deployment-receipt-v1',
            projectId:'ays-orbit-360-lab',
            functionName:'cotcompRealCustomerPilotS508',
            privateOneTimeIntakeDeployed:true,
            realParticipantSubmissionExecuted:false,
            stateUsed:state.used===true,
            productionTouched:false,
            providerRaterUsed:false,
            issuance:false,binding:false,payment:false
          },null,2));
          NODE
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s508-private-one-time-intake-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s508/evidence/invalid.json
            ${{ runner.temp }}/s508/evidence/state.json
            ${{ runner.temp }}/s508/evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/s508/firebase-service-account.json"