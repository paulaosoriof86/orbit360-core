name: Orbit360 Actions Push Pulse 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/actions-push-pulse-20260818.json'
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run and persist F2 Request11 validator-stale rootfix controls
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_PRE='orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json'
          PRE_BACKUP="$RUNNER_TEMP/preflight-sanitizado.before"
          PRE_EXISTED=false
          if [ -f "$CANONICAL_PRE" ]; then cp "$CANONICAL_PRE" "$PRE_BACKUP"; PRE_EXISTED=true; fi
          node --check tools/orbit360-f2-validator-stale-rootfix-sourceonly-v20260820.mjs
          set +e
          node tools/orbit360-f2-validator-stale-rootfix-sourceonly-v20260820.mjs
          CODE=$?
          set -e
          EVID='orbit360-platform/runtime-gate-crm-v20260716/f2-request11-validator-stale-rootfix-sourceonly-v20260820.json'
          PRE='orbit360-platform/runtime-gate-crm-v20260716/f2-request11-rootfix-source-preflight-v20260820.json'
          SYN='orbit360-platform/runtime-gate-crm-v20260716/f2-request12-synthetic-selftest-v20260820.json'
          test -f "$EVID"
          if [ "$PRE_EXISTED" = true ]; then cp "$PRE_BACKUP" "$CANONICAL_PRE"; else rm -f "$CANONICAL_PRE"; fi
          test -z "$(git status --short | awk '{print $2}' | grep -E '^\.github/orbit360-(requests|authorizations)/f2-productive-acceptance-runtime-browser-readonly-request12|^tools/orbit360-validar-gate-contracts-v20260717\.mjs$' || true)"
          git config user.name 'orbit360-sourceonly-bot'
          git config user.email 'orbit360-sourceonly-bot@users.noreply.github.com'
          git add "$EVID" "$PRE" "$SYN" 2>/dev/null || true
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'test(f2): persist Request11 rootfix source-only controls [skip ci]'
            git pull --rebase origin ays/backend-tenant-lab-v99-20260703
            git push origin HEAD:ays/backend-tenant-lab-v99-20260703
          fi
          exit "$CODE"
