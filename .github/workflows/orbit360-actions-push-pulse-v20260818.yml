            printf '%s' "$MATCHES" | jq --arg trigger "$GITHUB_SHA" '{schemaVersion:"orbit360-f2-request12-runtime-dispatch-probe-v1",ok:true,status:"F2_REQUEST12_RUNTIME_PUSH_RUN_FOUND",classification:"OBSERVATION_PASS",triggerSha:$trigger,targetSha:.[0].head_sha,uniquenessCount:length,run:{id:.[0].id,run_attempt:.[0].run_attempt,status:.[0].status,conclusion:.[0].conclusion,event:.[0].event,created_at:.[0].created_at,run_started_at:.[0].run_started_at,updated_at:.[0].updated_at,html_url:.[0].html_url},request12Replay:false,browserExecutedByProbe:false,runtimeExecutedByProbe:false,secretAccessByProbe:false,writesByProbe:0,deployByProbe:false,productionTouchedByProbe:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          elif [ "$COUNT" = '0' ]; then
            jq -n --arg trigger "$GITHUB_SHA" --arg target "$TARGET_SHA" '{schemaVersion:"orbit360-f2-request12-runtime-dispatch-probe-v1",ok:false,status:"F2_REQUEST12_RUNTIME_PUSH_RUN_NOT_FOUND",classification:"PIPELINE_MECHANISM_FAILURE",triggerSha:$trigger,targetSha:$target,uniquenessCount:0,request12Replay:false,browserExecutedByProbe:false,runtimeExecutedByProbe:false,secretAccessByProbe:false,writesByProbe:0,deployByProbe:false,productionTouchedByProbe:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          else
            printf '%s' "$MATCHES" | jq --arg trigger "$GITHUB_SHA" '{schemaVersion:"orbit360-f2-request12-runtime-dispatch-probe-v1",ok:false,status:"F2_REQUEST12_MULTIPLE_RUNTIME_PUSH_RUNS_FOUND",classification:"PIPELINE_MECHANISM_FAILURE",triggerSha:$trigger,targetSha:.[0].head_sha,uniquenessCount:length,runs:[.[]|{id,run_attempt,status,conclusion,created_at,updated_at}],request12Replay:false,browserExecutedByProbe:false,runtimeExecutedByProbe:false,secretAccessByProbe:false,writesByProbe:0,deployByProbe:false,productionTouchedByProbe:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          fi
          git config user.name 'orbit360-actions-pulse-bot'
          git config user.email 'orbit360-actions-pulse-bot@users.noreply.github.com'
          git add "$EVIDENCE"
