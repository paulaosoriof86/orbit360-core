name: Portal P-01 S5.11F Customer Shell LAB

on:
  workflow_dispatch:
  push:
    branches:
      - ays/portal-p01-s511f-customer-shell-lab-20261007
    paths:
      - 'orbit360-platform/portal-p01-lab.html'
      - 'orbit360-platform/core/portal-p01-s511f.js'
      - 'functions/portal-p01-s511f-shell.test.js'
      - '.github/workflows/portal-p01-s511f-customer-shell-lab.yml'

permissions:
  contents: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab
  LAB_HOST: https://ays-orbit-360-lab.web.app

jobs:
  customer-shell-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check ../orbit360-platform/core/portal-p01-s511f.js
          node --test portal-p01-s511f-shell.test.js
          grep -q "portalP01ReadOnlyS511E" ../orbit360-platform/core/portal-p01-s511f.js
          grep -q "READ-ONLY" ../orbit360-platform/portal-p01-lab.html
          grep -q "Verifica tu correo" ../orbit360-platform/portal-p01-lab.html
          grep -q "Restablecer contraseña" ../orbit360-platform/portal-p01-lab.html
      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s511f-firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.0
      - name: Deploy LAB hosting only
        shell: bash
        run: firebase deploy --only hosting --project "$GCLOUD_PROJECT" --non-interactive --force
      - name: Hosted readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s511f/evidence"
          curl -fsSL "$LAB_HOST/portal-p01-lab.html" -o "$RUNNER_TEMP/s511f/evidence/portal.html"
          curl -fsSL "$LAB_HOST/core/portal-p01-s511f.js" -o "$RUNNER_TEMP/s511f/evidence/portal.js"
          grep -q "Portal P-01 · LAB · READ-ONLY" "$RUNNER_TEMP/s511f/evidence/portal.html"
          grep -q "portalP01ReadOnlyS511E" "$RUNNER_TEMP/s511f/evidence/portal.js"
          grep -q "state-unverified" "$RUNNER_TEMP/s511f/evidence/portal.html"
          grep -q "state-noaccess" "$RUNNER_TEMP/s511f/evidence/portal.html"
          grep -q "state-error" "$RUNNER_TEMP/s511f/evidence/portal.html"
      - name: Build sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/s511f/evidence/receipt.json"
          console.log(JSON.stringify({
            schemaVersion:'ays-portal-p01-s511f-shell-v1',
            labHostingDeployed:true,
            readOnly:true,
            loginState:true,
            unverifiedEmailState:true,
            noAccessState:true,
            technicalErrorState:true,
            accountSwitcher:true,
            policiesProjection:true,
            documentMetadataProjection:true,
            resetPasswordAction:true,
            logoutAction:true,
            writesAdvertised:false,
            productionTouched:false
          },null,2));
          NODE
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: portal-p01-s511f-customer-shell-${{ github.run_id }}
          path: ${{ runner.temp }}/s511f/evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/s511f-firebase-service-account.json"