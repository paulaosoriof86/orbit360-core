        with:
          node-version: '22'
      - name: Gate B1 R10 read-only root-cause diagnostic
        id: gate
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('fs'),c=JSON.parse(fs.readFileSync(process.env.CONTROL)),b=JSON.parse(fs.readFileSync(process.env.B1_LOCK)),d=b.r10ReadOnlyDiagnostic||{};
          const run=c.i65ForensicRemediationPlan?.currentBlock==='B1'&&c.nextAction==='I6_5_FORENSIC_REMEDIATION_B1_R3_ROOT_CAUSE'&&b.status==='VISUAL_REJECTED_R3_PERFORMANCE_AND_UNIVERSE_ROOT_CAUSE_REQUIRED'&&d.status==='AUTHORIZED_PENDING_RUN';
          if(run&&(d.boundaries?.readOnly!==true||d.boundaries?.dataWrites!==0||d.boundaries?.productMutationAuthorized!==false||d.boundaries?.reimportAuthorized!==false||d.boundaries?.livePromotionAuthorized!==false))throw Error('B1_R10_BOUNDARY_INVALID');
