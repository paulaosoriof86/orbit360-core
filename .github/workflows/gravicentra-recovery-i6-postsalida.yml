      - '.github/i6-ephemeral/i64-apply-envelope.part01'
      - '.github/i6-ephemeral/i64-apply-envelope.part02'
      - '.github/i6-ephemeral/i64-apply-envelope.part03'
      - '.github/i6-ephemeral/i64-apply-envelope.part04'
      - 'tools/gravicentra-certified-live-binding-check.mjs'
      - 'orbit360-platform/core/tenant-access-policy-contract-p0.js'
      - 'orbit360-platform/core/access-scope.js'
      - 'orbit360-platform/modules/cliente360.js'
      - 'orbit360-platform/modules/polizas.js'
      - 'orbit360-platform/modules/policy-receipts-v1199-bridge.js'
      - 'orbit360-platform/modules/policy-receipts-v1199-detail-guard.js'
      - 'orbit360-platform/modules/aseguradoras.js'
      - 'orbit360-platform/data/store-firestore-product-operational-p0.js'
      - 'orbit360-platform/core/pwa.js'
      - 'artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B1_EXECUTION_LOCK_20260919.json'
      - 'tools/gravicentra-i6-5-b1-functional.mjs'
      - 'tools/gravicentra-i6-5-b1-advisor-identity-readonly.mjs'
      - 'tools/gravicentra-i6-5-b1-equipo-runtime-readonly.mjs'
      - 'tools/gravicentra-i6-5-b1-r6-directed-readonly.mjs'
      - 'tools/gravicentra-i6-5-b1-r7-auth-team-readonly.mjs'
      - 'tools/gravicentra-i6-5-b1-r7-bootstrap-readonly.mjs'
      - 'tools/gravicentra-i6-5-b1-r8-access-email-readonly.mjs'
      - 'tools/gravicentra-i6-5-b1-r10-rootcause-readonly.mjs'
