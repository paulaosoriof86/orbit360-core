        run: |
          python3 - <<'PY'
          import json,os,urllib.request,time
          u=os.environ['TARGET_URL'].rstrip('/')+'/__recovery__/build.json?r10='+str(time.time())
          with urllib.request.urlopen(u,timeout=30) as z:d=json.loads(z.read())
          if d.get('sourceSha')!=os.environ['EXPECTED_SOURCE'] or d.get('buildId')!=os.environ['EXPECTED_BUILD']:raise SystemExit('B1_R10_PREVIEW_DRIFT:'+str(d))
