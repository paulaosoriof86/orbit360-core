name: Gravicentra I6 Post-Salida
# I6.2 authoritative DATA_UPDATE executor — Evergreen V5.
# Same approved operational write chain; encrypted ephemeral source bridge only.
# Resume I6.2 after causal executor role-selector correction.
# Resume I6.2 physical seal with the role harness aligned to the active contract.
# Resume I6.2 seal from physically passed APPLY/readback/functional/role evidence.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
  PRODUCTION_URL: https://ays-orbit-360-lab.web.app

jobs:
  i62-deterministic-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical I6 governance preflight
        run: node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
      - name: Bind exact I6.2 V5 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          const s=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json','utf8'));
          const need=(x,m)=>{if(!x)throw new Error(m)};
          need(c.status==='PRODUCTION_ACCEPTED','I62_BASELINE');
          need(c.gateState?.gates?.I6?.status==='I6_2_DATA_UPDATE_V5_ACTIVE','I62_GATE');
          need(c.gateState?.gates?.I6?.activeSubgate==='I6.2','I62_SUBGATE');
          need(c.i6Execution?.authorized===true,'I62_I6_NOT_AUTHORIZED');
          need(c.i6Execution?.dataUpdateMode==='EVERGREEN_V5_DELTA_FIRST','I62_V5_NOT_ACTIVE');
          need(c.i6Execution?.perBlockApplyRequiresExplicitAuthorization===false,'I62_APPLY_POLICY');
          need(s.status==='PINNED_FOR_V5_DELTA','I62_SOURCE_NOT_PINNED');
          need(s.source?.sha256==='f2e57fa72ff1b94b110b5037038c6c47fbc727c513f9eebd2348d7f4f2244083','I62_SOURCE_SHA');
          console.log('I62_AUTHORITY=PASS');
          NODE
      - name: Install execution dependencies
        run: |
          npm install --no-save --package-lock=false firebase-admin@13.10.0 @google-cloud/secret-manager@6.1.0 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Resume physically passed APPLY and readback evidence
        uses: actions/download-artifact@v4
        with:
          name: gravicentra-i6-2-apply-evidence-35300483580
          path: ${{ runner.temp }}/gravicentra-i62-evidence
          github-token: ${{ github.token }}
          repository: paulaosoriof86/orbit360-core
          run-id: 35300483580
      - name: Bind prior physical PASS without repeating writes
        env:
          I62_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i62-evidence
        run: |
          test "$(jq -r .status "$I62_EVIDENCE_DIR/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .apply.operationalMutations "$I62_EVIDENCE_DIR/i62-apply-readback-functional.json")" = 14
          test "$(jq -r .apply.credentialUpdates "$I62_EVIDENCE_DIR/i62-apply-readback-functional.json")" = 3
          test "$(jq -r .readback.status "$I62_EVIDENCE_DIR/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .functional.status "$I62_EVIDENCE_DIR/i62-apply-readback-functional.json")" = PASS
      - name: Bind physically passed LIVE authenticated role regression
        env:
          I62_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i62-evidence
        run: test "$(jq -r .status "$I62_EVIDENCE_DIR/live-auth/i4a-authenticated-browser.json")" = AUTH_BROWSER_PASS
      - name: Seal physical I6.2 evidence
        shell: bash
        env:
          I62_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i62-evidence
        run: |
          set -euo pipefail
          E="$I62_EVIDENCE_DIR"
          test "$(jq -r .status "$E/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .readback.status "$E/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .functional.status "$E/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .apply.operationalMutations "$E/i62-apply-readback-functional.json")" = 14
          test "$(jq -r .apply.credentialUpdates "$E/i62-apply-readback-functional.json")" = 3
          test "$(jq -r .status "$E/live-auth/i4a-authenticated-browser.json")" = AUTH_BROWSER_PASS
          printf '{"schema":"GRAVICENTRA_I6_2_PHYSICAL_SEAL_V1","gate":"I6.2","status":"I6_2_DIRECTORIO_LIVE_PASS","sourceSha256":"f2e57fa72ff1b94b110b5037038c6c47fbc727c513f9eebd2348d7f4f2244083","operationalMutations":14,"credentialUpdates":3,"readback":"PASS","functional":"PASS","roleRegression":"PASS","containsSecrets":false}\n' > "$E/i62-physical-seal.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gravicentra-i6-2-apply-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i62-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
