        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cpPath=process.env.CONTROL,lockPath=process.env.B2_LOCK,proofPath=process.env.RUNNER_TEMP+'/b2-authenticated-preview.json';
          const c=JSON.parse(fs.readFileSync(cpPath)),b=JSON.parse(fs.readFileSync(lockPath)),e=JSON.parse(fs.readFileSync(proofPath));
          if(e.status!=='PASS'||e.cleanup?.clientAbsent!==true||e.cleanup?.insurerAbsent!==true||e.cleanup?.assetAbsent!==true||e.scope?.asesor?.leakCount!==0||e.crud?.cobros!==0||e.renewal?.cobros!==0)throw Error('B2_AUTH_EVIDENCE_NOT_CLEAN_PASS');
          b.status='PREVIEW_AUTHENTICATED_PASS_PENDING_PAULA_VISUAL';
          b.authenticatedPreviewProof={
            ...(b.authenticatedPreviewProof||{}),
            status:'PASS',
            runId:Number(process.env.GITHUB_RUN_ID),
            exactPreviewUrl:b.preview.url,
            exactPreviewBuildId:b.preview.buildId,
            exactPreviewSourceSha:b.preview.sourceSha,
            exactPreviewArtifactId:b.preview.artifactId,
            scope:{
              operativo:e.scope.operativo?.scope||'',
              asesor:e.scope.asesor?.scope||'',
              asesorLeakCount:e.scope.asesor?.leakCount,
              operativoCounts:e.scope.operativo?.counts||{},
              asesorCounts:e.scope.asesor?.counts||{}
            },
            crud:e.crud,
            renewal:e.renewal,
            cleanup:e.cleanup,
            syntheticWrites:e.writes?.synthetic||0,
            cleanupWrites:e.writes?.cleanup||0
          };
