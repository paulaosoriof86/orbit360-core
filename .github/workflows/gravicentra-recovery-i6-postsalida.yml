          b.carryForward.activeRoleScopeVisualSpotCheck='AUTHENTICATED_RUNTIME_PASS_VISUAL_CONFIRMATION_PENDING';
          fs.writeFileSync(lockPath,JSON.stringify(b,null,2)+'\n');
          c.i65ForensicRemediationPlan.b2={
            ...(c.i65ForensicRemediationPlan.b2||{}),
            status:b.status,
            authenticatedPreviewPass:true,
            authenticatedPreviewRunId:Number(process.env.GITHUB_RUN_ID),
            activeRoleScopeRuntimePass:true,
            clientCreateEditRuntimePass:true,
            policyVehicleRuntimePass:true,
            renewalRuntimePass:true,
            zeroConfirmedCobroWithoutEvidence:true,
            syntheticCleanupPass:true,
            livePromoted:false
          };
          c.i65ForensicRemediationPlan.mechanismSyncStatus='B2_AUTHENTICATED_PREVIEW_PASS_PENDING_VISUAL';
          fs.writeFileSync(cpPath,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$B2_LOCK"
          BLOB=$(git hash-object "$B2_LOCK");export BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.CONTROL,c=JSON.parse(fs.readFileSync(p));
          c.i65ForensicRemediationPlan.b2ExecutionLockBlobSha=process.env.BLOB;
