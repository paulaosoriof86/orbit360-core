          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL)),r=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          const run=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B2_VISUAL'
            && c.i65ForensicRemediationPlan?.currentBlock==='B2'
            && r.authorization?.decision==='AUTHORIZED'
