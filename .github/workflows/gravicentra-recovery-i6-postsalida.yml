      - name: Exact B3-004 Hosting Preview readback
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/b3-004-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/')
          for attempt in range(1,9):
              bad=[]
              for want,rel in rows:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?b3004='+str(attempt)+'-'+str(int(time.time())),headers={'Accept-Encoding':'identity','Cache-Control':'no-cache, no-store'}),timeout=30) as z: got=hashlib.sha256(z.read()).hexdigest()
                  except Exception as e: got=type(e).__name__
                  if got!=want: bad.append(rel)
              with urllib.request.urlopen(base+'/__recovery__/build.json?b3004='+str(time.time()),timeout=30) as z: marker=json.loads(z.read())
              if not bad and marker.get('sourceSha')==os.environ['GITHUB_SHA'] and marker.get('buildId')==os.environ['EXPECTED_BUILD_ID']: break
              if attempt==8: raise SystemExit('B3_004_READBACK:'+str(bad[:5])+':'+str(marker))
              time.sleep(3)
          print('B3_004_HOSTING_READBACK=PASS')
          PY
