          FINDINGS_BLOB=$(git hash-object "$FINDINGS"); export FINDINGS_BLOB
          RECEIPT_BLOB=$(git hash-object "$FINAL_CLEANUP_RECEIPT"); export RECEIPT_BLOB
          node - <<'NODE'
