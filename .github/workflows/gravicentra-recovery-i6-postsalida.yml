name: Gravicentra I6 Post-Salida

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
      - 'artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json'
      - 'artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json'
      - 'artifacts/orbit360-recovery/release-control/I6_DATA_UPDATE_EXECUTION_DISCIPLINE_LOCK_20260917.json'
      - 'artifacts/orbit360-recovery/release-control/POSTPROD_DATA_UPDATE_OPERATING_PLAN_LOCK_20260917.json'
      - 'artifacts/orbit360-recovery/project-sources-v2/v5/**'
      - '.github/workflows/gravicentra-recovery-i6-postsalida.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-i6-postsalida-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  REGISTRY: artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json
  SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json
  I62_PUBLIC_KEY_B64: 

jobs:
  i62-live-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical I6.2 authority and approved mechanism binding
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const R=JSON.parse(fs.readFileSync(process.env.REGISTRY,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const need=(x,c)=>{if(!x)throw new Error(c)};
          need(C.status==='PRODUCTION_ACCEPTED','I62_PRODUCTION_BASELINE_NOT_ACCEPTED');
          need(C.gateState?.gates?.I6?.status==='I6_2_DATA_UPDATE_V5_ACTIVE','I62_GATE_NOT_ACTIVE');
          need(C.gateState?.gates?.I6?.activeSubgate==='I6.2','I62_SUBGATE_NOT_ACTIVE');
          need(C.i6Execution?.dataUpdateMode==='EVERGREEN_V5_DELTA_FIRST','I62_V5_DELTA_MODE_REQUIRED');
          need(C.i6Execution?.dataMutationAuthorized===false,'I62_READBACK_DATA_MUTATION_MUST_BE_FALSE');
          need(C.i6Execution?.sourceDataApplyAuthorized===false,'I62_READBACK_SOURCE_APPLY_MUST_BE_FALSE');
          need(C.i6Execution?.productMutationAuthorized===false,'I62_PRODUCT_MUTATION_MUST_BE_FALSE');
          need(S.status==='PINNED_FOR_V5_DELTA','I62_SOURCE_NOT_PINNED_FOR_V5_DELTA');
          need(S.source?.sha256===C.postproductionDataUpdateControl?.sourceSha256,'I62_SOURCE_FINGERPRINT_MISMATCH');
          need(R.modules?.ASEGURADORAS_OPERATIONAL_DIRECTORY?.mechanismStatus==='APPROVED_WRITE_MECHANISM_REUSE_REQUIRED','I62_APPROVED_WRITE_MECHANISM_NOT_BOUND');
          need(R.modules?.ASEGURADORAS_OPERATIONAL_DIRECTORY?.operationalCollection==='aseguradoras','I62_OPERATIONAL_COLLECTION_MISMATCH');
          console.log('I6_2_DATA_UPDATE_V5_ACTIVE=true');
          console.log('PINNED_FOR_V5_DELTA=true');
          console.log('APPROVED_WRITE_MECHANISM_REUSE_REQUIRED=true');
          console.log('dataMutationAuthorized=false');
          console.log('sourceDataApplyAuthorized=false');
          console.log('I6_2_WRITES_EXECUTED=0');
          NODE

      - name: Install read-only LIVE readback dependency
        run: npm install --no-save --package-lock=false firebase-admin@13.10.0 >/dev/null

      - name: Encrypted exact LIVE readback with zero writes
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/i6-2-live-readback"
          mkdir -p "$OUT"
          export OUT
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const need=(x,c)=>{if(!x)throw new Error(c)};
          const parseSA=()=>{
            for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){
              try{const x=JSON.parse(process.env[k]||'');if(x?.type==='service_account'&&x?.project_id===process.env.PROJECT_ID&&x?.client_email&&x?.private_key)return x;}catch{}
            }
            throw new Error('I62_EXISTING_SERVICE_ACCOUNT_NOT_AVAILABLE');
          };
          const canon=v=>{
            if(v===null||v===undefined)return v===undefined?null:v;
            if(typeof v!=='object')return v;
            if(typeof v.toDate==='function'){try{return {$timestamp:v.toDate().toISOString()};}catch{}}
            if(typeof v.path==='string'&&v.firestore)return {$ref:v.path};
            if(Number.isFinite(v.latitude)&&Number.isFinite(v.longitude))return {$geo:[v.latitude,v.longitude]};
            if(Array.isArray(v))return v.map(canon);
            const o={};for(const k of Object.keys(v).sort())o[k]=canon(v[k]);return o;
          };
          const countSensitiveKeys=v=>{
            let n=0,refs=0;
            const walk=x=>{
              if(!x||typeof x!=='object')return;
              if(Array.isArray(x)){for(const y of x)walk(y);return;}
              for(const [k,y] of Object.entries(x)){
                if(/^(password|pass|contrasena|contraseña|clave|secret|token|credentialvalue)$/i.test(k)&&String(y??'').length)n++;
                if(/^credentialref$/i.test(k)&&String(y??'').length)refs++;
                walk(y);
              }
            };
            walk(v);return {sensitiveValueFieldCount:n,credentialRefCount:refs};
          };
          const encrypt=(plain,pem)=>{
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12);
            const cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const ciphertext=Buffer.concat([cipher.update(plain),cipher.final()]);
            const tag=cipher.getAuthTag();
            const wrappedKey=crypto.publicEncrypt({key:pem,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},key);
            return {schema:'GRAVICENTRA_I6_2_ENCRYPTED_READBACK_V1',algorithm:'AES-256-GCM+RSA-OAEP-SHA256',wrappedKey:wrappedKey.toString('base64'),iv:iv.toString('base64'),tag:tag.toString('base64'),ciphertext:ciphertext.toString('base64')};
          };
          (async()=>{
            const app=initializeApp({credential:cert(parseSA()),projectId:process.env.PROJECT_ID},'gravicentra-i62-readback');
            try{
              const db=getFirestore(app);
              const ref=db.collection('tenants').doc(process.env.TENANT_ID).collection('data').doc('aseguradoras').collection('items');
              const snap=await ref.get();
              const docs=snap.docs.map(d=>({id:d.id,data:canon(d.data()||{})})).sort((a,b)=>a.id.localeCompare(b.id));
              need(docs.length>0,'I62_LIVE_READBACK_EMPTY');
              const exact={schema:'GRAVICENTRA_I6_2_EXACT_LIVE_READBACK_V1',projectId:process.env.PROJECT_ID,tenantId:process.env.TENANT_ID,collectionPath:`tenants/${process.env.TENANT_ID}/data/aseguradoras/items`,capturedAt:new Date().toISOString(),writesExecuted:0,documents:docs};
              const plain=Buffer.from(JSON.stringify(exact),'utf8');
              const publicPem=Buffer.from(process.env.I62_PUBLIC_KEY_B64,'base64').toString('utf8');
              const envelope=encrypt(plain,publicPem);
              const encryptedPath=process.env.OUT+'/i6-2-live-readback.encrypted.json';
              fs.writeFileSync(encryptedPath,JSON.stringify(envelope,null,2)+'\n');
              const counts=countSensitiveKeys(exact);
              const source=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
              const summary={schema:'GRAVICENTRA_I6_2_LIVE_READBACK_SUMMARY_V1',status:'READBACK_PASS',gate:'I6.2',module:'ASEGURADORAS_OPERATIONAL_DIRECTORY',sourceSha256:source.source.sha256,collectionPath:exact.collectionPath,documentCount:docs.length,writesExecuted:0,plaintextOperationalValuesInEvidence:false,exactReadbackEncrypted:true,plaintextSha256:crypto.createHash('sha256').update(plain).digest('hex'),encryptedFileSha256:crypto.createHash('sha256').update(fs.readFileSync(encryptedPath)).digest('hex'),...counts};
              fs.writeFileSync(process.env.OUT+'/i6-2-live-readback-summary.json',JSON.stringify(summary,null,2)+'\n');
              console.log('I62_LIVE_READBACK=PASS');
              console.log('I62_DOCUMENT_COUNT='+docs.length);
              console.log('I6_2_WRITES_EXECUTED=0');
              console.log('I62_PLAINTEXT_OPERATIONAL_VALUES_IN_EVIDENCE=false');
            }finally{await deleteApp(app).catch(()=>{});}
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Verify readback evidence is encrypted and zero-write
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/i6-2-live-readback/i6-2-live-readback-summary.json"
          test "$(jq -r .status "$E")" = READBACK_PASS
          test "$(jq -r .writesExecuted "$E")" = 0
          test "$(jq -r .plaintextOperationalValuesInEvidence "$E")" = false
          test "$(jq -r .exactReadbackEncrypted "$E")" = true
          test "$(jq -r .sourceSha256 "$E")" = "$(jq -r .source.sha256 "$SOURCE_INTAKE")"
          echo I62_READBACK_INTEGRITY=PASS
          echo I6_2_WRITES_EXECUTED=0

      - uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-2-live-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/i6-2-live-readback
          if-no-files-found: error
          retention-days: 7

      - name: I6.2 readback checkpoint
        run: |
          echo 'I6.2 remains DATA_UPDATE only.'
          echo 'No product source, Hosting, backend deployment, Firestore mutation, credential mutation, or August apply was executed.'
          echo 'Next material step after physical artifact verification: deterministic diff against the pinned workbook using the approved write chain.'
          echo 'I6_2_WRITES_EXECUTED=0'
