          b.acceptance={...(b.acceptance||{}),paulaVisual:true,humanTargetedUatPass:true,r102HumanRetestPass:true,finalSyntheticCleanupPass:true,b2OverallAccepted:true};
          b.boundaries={...(b.boundaries||{}),advanceToB3Authorized:true,finalSyntheticCleanupAuthorized:false,liveHostingPromotionAuthorized:false,reimportAuthorized:false};
          b.paulaVisualDecision='B2_ACCEPTED_TARGETED_HUMAN_UAT_AND_CLEANUP_PASS';
