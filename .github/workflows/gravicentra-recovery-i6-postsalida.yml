          node --check orbit360-platform/data/tenant-public-branding-index.js
          node --check orbit360-platform/core/public-tenant-branding.js
          grep -Fq "tenant-public-branding-index.js" orbit360-platform/index.html
          grep -Fq "core/user-onboarding.js" orbit360-platform/index.html
          grep -Fq "equipo-onboarding-v20260804-bridge.js" orbit360-platform/index.html
          grep -Fq "Alianzas & Soluciones" orbit360-platform/data/tenant-public-branding-index.js
          grep -Fq "user-approved-logo-bolita-2025" orbit360-platform/data/tenant-public-branding-index.js
