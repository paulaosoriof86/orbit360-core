          if(ev.status!=='PASS'||ev.after?.clients!==0||ev.after?.policies!==0)throw Error('B2_CLEANUP_EVIDENCE_INVALID');
          b.orphanSyntheticCleanup={...(b.orphanSyntheticCleanup||{}),status:'PASS',runId:Number(process.env.GITHUB_RUN_ID),before:ev.before,deleted:ev.deleted,after:ev.after};
          fs.writeFileSync(lockPath,JSON.stringify(b,null,2)+'\n');
          c.i65ForensicRemediationPlan.b2={...(c.i65ForensicRemediationPlan.b2||{}),orphanSyntheticCleanup:'PASS',orphanSyntheticCleanupRunId:Number(process.env.GITHUB_RUN_ID)};
          fs.writeFileSync(cpPath,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$B2_LOCK"
          BLOB=$(git hash-object "$B2_LOCK");export BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.CONTROL,c=JSON.parse(fs.readFileSync(p));c.i65ForensicRemediationPlan.b2ExecutionLockBlobSha=process.env.BLOB;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$CONTROL"
          git config user.name gravicentra-recovery-bot
          git config user.email gravicentra-recovery-bot@users.noreply.github.com
          git commit -m "freeze(i6.5): B2 synthetic cleanup verified"
          git push origin "HEAD:$GITHUB_REF_NAME"

