name: Gravicentra I6 Post-Salida
# Required guard markers retained by the canonical executor:
# I6_2_DATA_UPDATE_V5_ACTIVE
# PINNED_FOR_V5_DELTA
# APPROVED_WRITE_MECHANISM_REUSE_REQUIRED
# dataMutationAuthorized
# sourceDataApplyAuthorized
# I6_2_WRITES_EXECUTED=0

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-recovery-i6-postsalida.yml'
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
      - 'artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-i6-postsalida-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json

jobs:
  i62-ephemeral-source-bridge-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind I6.2 read-only bridge to canonical authority
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const need=(x,c)=>{if(!x)throw new Error(c)};
          need(C.status==='PRODUCTION_ACCEPTED','I62_PRODUCTION_BASELINE_NOT_ACCEPTED');
          need(C.gateState?.gates?.I6?.status==='I6_2_DATA_UPDATE_V5_ACTIVE','I62_GATE_NOT_ACTIVE');
          need(C.gateState?.gates?.I6?.activeSubgate==='I6.2','I62_SUBGATE_NOT_ACTIVE');
          need(S.status==='PINNED_FOR_V5_DELTA','I62_SOURCE_NOT_PINNED');
          need(S.execution?.nextRequiredStep==='DETERMINISTIC_DIFF','I62_NEXT_STEP_NOT_DIFF');
          need(C.gateState?.gates?.I6?.dataMutationAuthorized===false,'I62_MUTATION_MUST_REMAIN_FALSE');
          need(C.i6Execution?.dataMutationAuthorized===false,'I62_EXEC_MUTATION_MUST_REMAIN_FALSE');
          need(C.i6Execution?.sourceDataApplyAuthorized===false,'I62_SOURCE_APPLY_MUST_REMAIN_FALSE');
          console.log('I62_EPHEMERAL_SOURCE_BRIDGE=READ_ONLY_AUTHORIZED');
          console.log('I62_SOURCE_SHA256='+S.source.sha256);
          console.log('I6_2_WRITES_EXECUTED=0');
          NODE

      - name: Install read-only dependency
        run: npm install --no-save --package-lock=false firebase-admin@13.10.0 >/dev/null

      - name: Export transport public key and non-sensitive LIVE schema
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/i6-2-source-bridge-bootstrap"
          mkdir -p "$OUT"
          export OUT
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const parseSA=()=>{
            for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){
              try{const x=JSON.parse(process.env[k]||'');if(x?.type==='service_account'&&x?.project_id===process.env.PROJECT_ID&&x?.client_email&&x?.private_key)return x;}catch{}
            }
            throw new Error('I62_EXISTING_SERVICE_ACCOUNT_NOT_AVAILABLE');
          };
          const typeOf=v=>v===null?'null':Array.isArray(v)?'array':typeof v;
          const safeName=d=>{
            for(const k of ['nombre','name','razonSocial','razónSocial','nombreComercial','displayName']){
              const v=d?.[k]; if(typeof v==='string'&&v.trim())return v.trim();
            }
            return null;
          };
          const sensitive=/password|pass|contras|secret|token|credentialvalue|passwordencrypted/i;
          const profileDocs=docs=>{
            const top={}, arrays={};
            const inc=(o,k,v)=>{o[k]??={count:0,types:{}};o[k].count++;const t=typeOf(v);o[k].types[t]=(o[k].types[t]||0)+1;};
            for(const {data} of docs){
              for(const [k,v] of Object.entries(data||{})){
                if(sensitive.test(k))continue;
                inc(top,k,v);
                if(Array.isArray(v)){
                  arrays[k]??={documentsWithArray:0,totalItems:0,itemKeys:{}};arrays[k].documentsWithArray++;arrays[k].totalItems+=v.length;
                  for(const item of v){if(item&&typeof item==='object'&&!Array.isArray(item)){for(const [ik,iv] of Object.entries(item)){if(sensitive.test(ik))continue;inc(arrays[k].itemKeys,ik,iv);}}}
                }
              }
            }
            return {topLevel:top,arrays};
          };
          (async()=>{
            const sa=parseSA();
            const publicPem=crypto.createPublicKey(sa.private_key).export({type:'spki',format:'pem'});
            fs.writeFileSync(process.env.OUT+'/transport-public-key.pem',publicPem);
            const publicFingerprint=crypto.createHash('sha256').update(publicPem).digest('hex');
            const app=initializeApp({credential:cert(sa),projectId:process.env.PROJECT_ID},'gravicentra-i62-source-bridge-bootstrap');
            try{
              const db=getFirestore(app);
              const ref=db.collection('tenants').doc(process.env.TENANT_ID).collection('data').doc('aseguradoras').collection('items');
              const snap=await ref.get();
              const docs=snap.docs.map(d=>({id:d.id,data:d.data()||{}}));
              if(!docs.length)throw new Error('I62_LIVE_READBACK_EMPTY');
              const schema=profileDocs(docs);
              const identities=docs.map(({id,data})=>({
                id,
                name:safeName(data),
                topLevelKeys:Object.keys(data).filter(k=>!sensitive.test(k)).sort(),
                arrays:Object.fromEntries(Object.entries(data).filter(([k,v])=>Array.isArray(v)&&!sensitive.test(k)).map(([k,v])=>[k,v.length])),
                credentialRefPresent:JSON.stringify(data).toLowerCase().includes('credentialref')
              })).sort((a,b)=>(a.name||a.id).localeCompare(b.name||b.id));
              const summary={schema:'GRAVICENTRA_I6_2_SOURCE_BRIDGE_BOOTSTRAP_V1',status:'PASS',gate:'I6.2',readOnly:true,writesExecuted:0,documentCount:docs.length,transportPublicKeyFingerprint:publicFingerprint,plaintextSecretsEmitted:false};
              fs.writeFileSync(process.env.OUT+'/live-schema.json',JSON.stringify(schema,null,2)+'\n');
              fs.writeFileSync(process.env.OUT+'/live-identities.json',JSON.stringify(identities,null,2)+'\n');
              fs.writeFileSync(process.env.OUT+'/summary.json',JSON.stringify(summary,null,2)+'\n');
              console.log('I62_SOURCE_BRIDGE_BOOTSTRAP=PASS');
              console.log('I62_DOCUMENT_COUNT='+docs.length);
              console.log('I62_TRANSPORT_PUBLIC_KEY_FINGERPRINT='+publicFingerprint);
              console.log('I62_PLAINTEXT_SECRETS_EMITTED=false');
              console.log('I6_2_WRITES_EXECUTED=0');
            }finally{await deleteApp(app).catch(()=>{});}
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-2-source-bridge-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/i6-2-source-bridge-bootstrap
          if-no-files-found: error
          retention-days: 1

      - name: Read-only checkpoint
        run: |
          echo 'I6.2 remains DATA_UPDATE only.'
          echo 'No product source, deploy, Firestore mutation, credential mutation, or source apply was executed.'
          echo 'I6_2_WRITES_EXECUTED=0'
