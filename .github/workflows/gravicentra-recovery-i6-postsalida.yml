name: Gravicentra I6 Post-Salida
# I6.3 Clientes secure apply-bridge key publication after LIVE readback PASS.
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
      - 'artifacts/orbit360-recovery/release-control/I6_3_CLIENTES_SOURCE_INTAKE_20260918.json'
      - 'tools/gravicentra-i6-control-plane-guard-v1.mjs'
      - '.github/workflows/gravicentra-recovery-i6-postsalida.yml'
permissions:
  contents: read
  actions: read
env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
jobs:
  i63-secure-bridge-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical I6.3 readback-pass authority
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          const s=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_3_CLIENTES_SOURCE_INTAKE_20260918.json','utf8'));
          if(c.nextAction!=='I6_3_DETERMINISTIC_DIFF'||s.execution?.cursorState!=='LIVE_READBACK_PASS'||s.execution?.readbackRunId!==35306248860)throw new Error('I63_READBACK_PASS_NOT_BOUND');
          console.log('I63_READBACK_PASS_BOUND=true');
          NODE
      - name: Publish service-account public key for encrypted ephemeral apply bridge
        run: |
          node - <<'NODE'
          const crypto=require('node:crypto');
          let sa=null;
          for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){try{const x=JSON.parse(process.env[k]||'');if(x?.type==='service_account'&&x?.project_id===process.env.PROJECT_ID&&x?.private_key){sa=x;break;}}catch{}}
          if(!sa)throw new Error('I63_SERVICE_ACCOUNT_NOT_AVAILABLE');
          const pub=crypto.createPublicKey(sa.private_key).export({type:'spki',format:'pem'});
          console.log('I63_APPLY_PUBLIC_KEY_B64='+Buffer.from(pub).toString('base64'));
          NODE
