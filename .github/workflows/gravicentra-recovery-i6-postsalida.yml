  i65-b2-authenticated-preview:
    needs: i65-forensic-b2-preview
    # The technical Preview job may materialize its certified lock in a branch-tip
    # governance commit even when that job concludes failure at the final push/freeze
    # boundary. Always enter this dependent job, then let its fail-closed gate decide
    # from the freshly checked-out branch tip whether authenticated proof is authorized.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      B2_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B2_EXECUTION_LOCK_20260920.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate authenticated B2 Preview proof
        id: mode
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync(process.env.CONTROL)),b=JSON.parse(fs.readFileSync(process.env.B2_LOCK));
          const q=b.authenticatedPreviewProof||{},x=q.boundaries||{},p=b.preview||{},cleanup=b.orphanSyntheticCleanup||{};
          const run=b.status==='PREVIEW_TECHNICAL_PASS_PENDING_PAULA_VISUAL'
            && c.nextAction==='I6_5_FORENSIC_REMEDIATION_B2_VISUAL'
            && c.i65ForensicRemediationPlan?.currentBlock==='B2'
            && q.status==='AUTHORIZED_PENDING_RUN'
            && cleanup.status==='PASS';
          if(run){
            if(!x.syntheticQaWritesAuthorized||!x.syntheticQaOnly||!x.cleanupMandatory||x.businessDataMutationAuthorized!==false||x.reimportAuthorized!==false||x.emailSendAuthorized!==false||x.liveHostingPromotionAuthorized!==false||x.productSourceMutationAuthorized!==false)throw Error('B2_AUTH_PROOF_BOUNDARY_INVALID');
            if(!p.url||p.exactReadback!==true||p.functionalPass!==true||p.livePromoted!==false)throw Error('B2_AUTH_PREVIEW_NOT_CERTIFIED');
            if(q.exactPreviewSourceSha!==p.sourceSha||q.exactPreviewBuildId!==p.buildId||q.exactPreviewArtifactId!==p.artifactId||q.exactPreviewUrl!==p.url)throw Error('B2_AUTH_PREVIEW_BINDING_DRIFT');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(run?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'target='+(p.url||'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build='+(p.buildId||'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'source='+(p.sourceSha||'')+'\n');
          console.log('B2_AUTHENTICATED_MODE='+(run?'RUN':'NOOP'));
          NODE
      - name: Assert LIVE unchanged before authenticated proof
        if: steps.mode.outputs.run == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs
      - name: Validate exact frozen Preview marker
        if: steps.mode.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.mode.outputs.target }}
          EXPECTED_BUILD_ID: ${{ steps.mode.outputs.build }}
          EXPECTED_SOURCE_SHA: ${{ steps.mode.outputs.source }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,time
          url=os.environ['TARGET_URL'].rstrip('/')+'/__recovery__/build.json?b2auth='+str(time.time())
          with urllib.request.urlopen(url,timeout=30) as z:d=json.loads(z.read())
          if d.get('buildId')!=os.environ['EXPECTED_BUILD_ID'] or d.get('sourceSha')!=os.environ['EXPECTED_SOURCE_SHA']:
