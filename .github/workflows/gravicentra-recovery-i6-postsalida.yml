          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(run?'true':'false')+'\n');
          console.log('B2_GOOGLE_PROVIDER_REMEDIATION_MODE='+(run?'RUN':'NOOP'));
          NODE
      - name: Install Google auth dependency
        if: steps.mode.outputs.run == 'true'
        run: npm install --no-save --package-lock=false google-auth-library@9.15.1 >/dev/null
      - name: Read, enable existing google.com provider, and read back
        id: apply
        if: steps.mode.outputs.run == 'true'
        env:
          OUT: ${{ runner.temp }}/b2-google-provider-remediation.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const {GoogleAuth}=require('google-auth-library');
          let sa=null;
          for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){
            try{const x=JSON.parse(process.env[k]||'');if(x?.type==='service_account'&&x?.project_id===process.env.PROJECT_ID&&x?.private_key&&x?.client_email){sa=x;break;}}catch{}
          }
          if(!sa)throw new Error('B2_GOOGLE_PROVIDER_NO_SERVICE_ACCOUNT');
          const safe=x=>({name:String(x?.name||''),enabled:x?.enabled===true,clientIdPresent:!!String(x?.clientId||'').trim(),clientSecretPresent:!!String(x?.clientSecret||'').trim()});
          (async()=>{
            const auth=new GoogleAuth({credentials:sa,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const token=await auth.getAccessToken();
            const url='https://identitytoolkit.googleapis.com/v2/projects/'+encodeURIComponent(process.env.PROJECT_ID)+'/defaultSupportedIdpConfigs/google.com';
            const get=async()=>{const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});const body=await r.json().catch(()=>({}));return {r,body};};
            let g=await get();
            let mutationExecuted=false,providerConfigCreated=false;
            let before=g.r.status===404?{name:'',enabled:false,clientIdPresent:false,clientSecretPresent:false}:safe(g.body);
            if(g.r.status===404){
              const collection='https://identitytoolkit.googleapis.com/admin/v2/projects/'+encodeURIComponent(process.env.PROJECT_ID)+'/defaultSupportedIdpConfigs?idpId=google.com';
              const createBody={name:'projects/'+process.env.PROJECT_ID+'/defaultSupportedIdpConfigs/google.com',enabled:true};
              const p=await fetch(collection,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(createBody)});
              const pb=await p.json().catch(()=>({}));
              if(!p.ok){
                const evidence={status:'FAIL_CLOSED',projectId:process.env.PROJECT_ID,providerId:'google.com',stage:'CREATE_PROVIDER_CONFIG',httpStatus:p.status,before,createNewOAuthClient:false,clientCredentialsChanged:false,realDataWrites:0,liveHostingPromotion:false,b3Opened:false,reimport:false};
                fs.writeFileSync(process.env.OUT,JSON.stringify(evidence,null,2)+'\n');
                throw new Error('B2_GOOGLE_PROVIDER_CREATE_HTTP_'+p.status);
              }
              mutationExecuted=true;providerConfigCreated=true;
              g=await get();
            }
            if(!g.r.ok){
              const evidence={status:'FAIL_CLOSED',projectId:process.env.PROJECT_ID,providerId:'google.com',stage:'READ_PROVIDER_CONFIG',httpStatus:g.r.status,before,providerConfigCreated,realDataWrites:0,liveHostingPromotion:false,b3Opened:false,reimport:false};
              fs.writeFileSync(process.env.OUT,JSON.stringify(evidence,null,2)+'\n');
              throw new Error('B2_GOOGLE_PROVIDER_READ_HTTP_'+g.r.status);
            }
            if(g.body.enabled!==true){
              before=safe(g.body);
              const patch={...g.body,enabled:true};
              const p=await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(patch)});
              const pb=await p.json().catch(()=>({}));
              if(!p.ok){
                const evidence={status:'FAIL_CLOSED',projectId:process.env.PROJECT_ID,providerId:'google.com',stage:'ENABLE_PROVIDER_CONFIG',httpStatus:p.status,before,providerConfigCreated,realDataWrites:0,liveHostingPromotion:false,b3Opened:false,reimport:false};
                fs.writeFileSync(process.env.OUT,JSON.stringify(evidence,null,2)+'\n');
                throw new Error('B2_GOOGLE_PROVIDER_PATCH_HTTP_'+p.status);
              }
              mutationExecuted=true;
            }
            g=await get();
            if(!g.r.ok)throw new Error('B2_GOOGLE_PROVIDER_POST_READ_HTTP_'+g.r.status);
            const after=safe(g.body);
            if(after.enabled!==true)throw new Error('B2_GOOGLE_PROVIDER_POST_READBACK_NOT_ENABLED');
            const evidence={status:'PASS',projectId:process.env.PROJECT_ID,providerId:'google.com',before,after,mutationExecuted,providerConfigCreated,createNewOAuthClient:false,clientCredentialsChanged:false,realDataWrites:0,liveHostingPromotion:false,b3Opened:false,reimport:false};
            fs.writeFileSync(process.env.OUT,JSON.stringify(evidence,null,2)+'\n');
            console.log(JSON.stringify(evidence));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload Google provider remediation evidence
        if: always() && steps.mode.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-b2-google-provider-${{ github.run_id }}
          path: ${{ runner.temp }}/b2-google-provider-remediation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Freeze Google provider readback
        if: steps.mode.outputs.run == 'true' && steps.apply.conclusion == 'success'
        run: |
          set -euo pipefail
          git fetch origin recovery/fase-a-clean-20260831
          git reset --hard origin/recovery/fase-a-clean-20260831
          export EVIDENCE="$RUNNER_TEMP/b2-google-provider-remediation.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rp=process.env.RECEIPT,cp=process.env.CONTROL;
          const r=JSON.parse(fs.readFileSync(rp)),c=JSON.parse(fs.readFileSync(cp)),e=JSON.parse(fs.readFileSync(process.env.EVIDENCE));
          if(e.status!=='PASS'||e.after?.enabled!==true)throw new Error('B2_GOOGLE_PROVIDER_FREEZE_EVIDENCE_INVALID');
          if(!['AUTHORIZED_PENDING_APPLY','MANUAL_ENABLEMENT_REPORTED_PENDING_READBACK'].includes(r.authorization?.status))throw new Error('B2_GOOGLE_PROVIDER_AUTHORIZATION_CURSOR_CHANGED');
          r.authorization.status='APPLIED_READBACK_PASS';
          r.firebaseGoogleProviderRemediation={status:'READBACK_PASS',runId:Number(process.env.GITHUB_RUN_ID),projectId:e.projectId,providerId:e.providerId,before:e.before,after:e.after,mutationExecuted:e.mutationExecuted,permanentFixturePreflightInstalled:true};
          r.governance.firebaseAuthConfigurationChanged=e.mutationExecuted===true;
