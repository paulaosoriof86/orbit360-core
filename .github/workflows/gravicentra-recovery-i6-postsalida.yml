      - name: Deploy exact B3-004 package to isolated Hosting Preview
        if: steps.gate.outputs.run == 'true'
        id: preview
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/b3-004-package/bundle"
          CHANNEL_ID="gi-b3004-$GITHUB_RUN_ID"
          deploy_channel() {
            set +e
