        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          HOSTED_FILE_COUNT: ${{ steps.build.outputs.hosted_file_count }}
          HOSTED_PAYLOAD_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
          BACKEND_FILE_COUNT: ${{ steps.build.outputs.backend_file_count }}
          BACKEND_SOURCE_DIGEST: ${{ steps.build.outputs.backend_source_digest }}
          BUNDLE_FILE_COUNT: ${{ steps.build.outputs.bundle_file_count }}
          BUNDLE_DIGEST: ${{ steps.build.outputs.bundle_digest }}
          PREVIEW_CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ROLLBACK_CHANNEL_ID: ${{ steps.promote.outputs.rollback_channel }}
          ARTIFACT_ID: ${{ steps.buildart.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.buildart.outputs.artifact-digest }}
          LIVE_EVIDENCE_ARTIFACT_ID: ${{ steps.liveart.outputs.artifact-id }}
          LIVE_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.liveart.outputs.artifact-digest }}
          BLOCK_B_FREEZE: artifacts/orbit360-recovery/release-control/I6_5_BLOCK_B_HYDRATION_LIVE_FREEZE_20260918.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const L=JSON.parse(fs.readFileSync(process.env.LEDGER,'utf8'));
          const R=JSON.parse(fs.readFileSync(process.env.REGISTRY,'utf8'));
          const live=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i65-live-functional.json','utf8'));
          const h=C.i65HydrationDefect||{};
          if(h.status!=='I6_5_HYDRATION_CODE_DEFECT_CANDIDATE_PENDING_BUILD')throw new Error('I65_HYDRATION_SEAL_STATE_INVALID');
          if(live.status!=='PASS'||live.owner?.alias!==true||live.owner?.ready!==true||live.owner?.directFirestoreListeners!==0||live.owner?.parallelCache!==false)throw new Error('I65_HYDRATION_OWNER_PROOF_INVALID');
          const confirmed=live.owner?.serverConfirmedCollections||[],required=live.owner?.requiredStartupCollections||[];
          for(const name of ['vehiculos','recibosEsperados','carteraPrimas']){
            if(!confirmed.includes(name)||!required.includes(name))throw new Error('I65_HYDRATION_COLLECTION_NOT_REQUIRED_CONFIRMED:'+name);
          }
          if(Number(live.counts?.recibosEsperados)!==Number(live.directCounts?.recibosEsperados)||Number(live.counts?.carteraPrimas)!==Number(live.directCounts?.carteraPrimas)||Number(live.counts?.recibosEsperados)<=0||Number(live.counts?.carteraPrimas)<=0)throw new Error('I65_HYDRATION_COUNT_PROOF_INVALID');
          if(live.sample?.hasReceipt!==true||live.sample?.receiptDetailOwner!=='v920'||live.sample?.clientUi?.owner!=='v920')throw new Error('I65_HYDRATION_REAL_SAMPLE_PROOF_INVALID');
          if(live.i64Sentinels?.policies!==1414||live.i64Sentinels?.renewals!==11||live.i64Sentinels?.historical!==1191)throw new Error('I65_HYDRATION_I64_SENTINEL_INVALID');
          if(live.writes!==0)throw new Error('I65_HYDRATION_WRITES_NONZERO');
          const old=JSON.parse(JSON.stringify(C.certifiedCandidate||{}));
          if(old.sourceSha!==h.previousCertifiedSourceSha||old.buildId!==h.previousCertifiedBuildId||Number(old.artifactId)!==Number(h.previousCertifiedArtifactId))throw new Error('I65_HYDRATION_CERTIFIED_PARENT_DRIFT');
          const release={
            sourceSha:process.env.GITHUB_SHA,
            sourceTree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            i3RunId:Number(process.env.GITHUB_RUN_ID),i3Conclusion:'success',runnerCommit:process.env.GITHUB_SHA,
            buildId:process.env.BUILD_ID,artifactId:Number(process.env.ARTIFACT_ID),
            artifactName:'gravicentra-i6-5-hydration-code-defect-build-'+process.env.GITHUB_RUN_ID,artifactArchiveDigest:process.env.ARTIFACT_DIGEST,
            previewChannelId:process.env.PREVIEW_CHANNEL_ID,previewUrl:process.env.PREVIEW_URL,
            hostedFileCount:Number(process.env.HOSTED_FILE_COUNT),hostedPayloadDigest:process.env.HOSTED_PAYLOAD_DIGEST,
            backendFileCount:Number(process.env.BACKEND_FILE_COUNT),backendSourceDigest:process.env.BACKEND_SOURCE_DIGEST,
            bundleFileCount:Number(process.env.BUNDLE_FILE_COUNT),bundleDigest:process.env.BUNDLE_DIGEST,
            readbackExact:true,readbackFileCount:Number(process.env.HOSTED_FILE_COUNT),
            sameFrontendArtifactPreviewToProductionRequired:true,sameBackendSourcePackageRequiredForI5:false,sourceMutatedAfterBuild:false,
            productionUrl:process.env.PRODUCTION_URL,promotedLiveRunId:Number(process.env.GITHUB_RUN_ID)
          };
          C.preI65HydrationCertifiedCandidate=old;
          C.certifiedCandidate=release;
          C.i65HydrationDefect={...h,
            status:'I6_5_HYDRATION_CODE_DEFECT_SUCCESSOR_LIVE_PASS',
            sourceSha:release.sourceSha,sourceTree:release.sourceTree,buildId:release.buildId,artifactId:release.artifactId,artifactDigest:release.artifactArchiveDigest,
            previewChannelId:release.previewChannelId,previewUrl:release.previewUrl,liveRunId:Number(process.env.GITHUB_RUN_ID),
            productionUrl:process.env.PRODUCTION_URL,productionReadbackExact:true,functionalPass:true,
            hydrationContractVersion:'fase-a-i2-20260918.4-receipts-portfolio-required',
            receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0),
            directReceiptCount:Number(live.directCounts?.recibosEsperados||0),directPortfolioCount:Number(live.directCounts?.carteraPrimas||0),
            canonicalOwner:'receiptsPortfolioProjectionV920',serverConfirmedRequiredCollections:['vehiculos','recibosEsperados','carteraPrimas'],
            rollbackChannelId:process.env.ROLLBACK_CHANNEL_ID,
            liveEvidenceArtifactId:Number(process.env.LIVE_EVIDENCE_ARTIFACT_ID),liveEvidenceArtifactDigest:process.env.LIVE_EVIDENCE_ARTIFACT_DIGEST,
            operationalWrites:0,dataMutationAuthorized:false,reimportAuthorized:false,cobrosWritesAuthorized:false,receiptsWritesAuthorized:false,carteraWritesAuthorized:false,
            acceptanceReceiptPath:process.env.BLOCK_B_FREEZE,nextRequiredStep:'I6_5_DETERMINISTIC_DIFF'
          };
          C.i6Execution.productMutationAuthorized=false;
          C.i6Execution.dataMutationAuthorized=false;
          C.i6Execution.sourceDataApplyAuthorized=false;
          C.i6Execution.activeModuleStatus='LIVE_READBACK_PASS';
          C.i6Execution.i6_5={...(C.i6Execution.i6_5||{}),status:'LIVE_READBACK_PASS',hydrationCodeDefectStatus:'I6_5_HYDRATION_CODE_DEFECT_SUCCESSOR_LIVE_PASS',writes:0,canonicalLiveCounts:{...(C.i6Execution.i6_5?.canonicalLiveCounts||{}),recibosEsperados:Number(live.counts?.recibosEsperados||0),carteraPrimas:Number(live.counts?.carteraPrimas||0)},nextRequiredStep:'DETERMINISTIC_DIFF'};
          C.nextAction='I6_5_DETERMINISTIC_DIFF';
          C.postproductionDataUpdateControl.executionCursor='LIVE_READBACK_PASS';
          C.postproductionDataUpdateControl.nextRequiredStep='DETERMINISTIC_DIFF';
          C.i65MiniClosurePlan={...(C.i65MiniClosurePlan||{}),blockBStatus:'READ_PATH_HYDRATION_LIVE_PASS',blockCStatus:'READY_FOR_DETERMINISTIC_DIFF',nextMaterialCursor:'DETERMINISTIC_DIFF',blockBFreezePath:process.env.BLOCK_B_FREEZE};

          S.status='PINNED_FOR_V5_DELTA';
          S.execution.cursorState='LIVE_READBACK_PASS';
          S.execution.nextRequiredStep='DETERMINISTIC_DIFF';
          S.execution.writeApplied=false;S.execution.writes=0;
          S.execution.hydrationCodeDefect={status:'I6_5_HYDRATION_CODE_DEFECT_SUCCESSOR_LIVE_PASS',runId:Number(process.env.GITHUB_RUN_ID),sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,operationalWrites:0,receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0)};
          fs.writeFileSync(process.env.SOURCE_INTAKE,JSON.stringify(S,null,2)+'\n');

          R.modules.RECIBOS_CARTERA.sourceState='CURRENT_SOURCE_PINNED';
          R.modules.RECIBOS_CARTERA.resumeCursor='LIVE_READBACK_PASS';
          R.modules.RECIBOS_CARTERA.nextMaterialStep='DETERMINISTIC_DIFF';
          R.modules.RECIBOS_CARTERA.dataWritesAuthorized=false;
          R.modules.RECIBOS_CARTERA.cobrosWritesAuthorized=false;
          R.modules.RECIBOS_CARTERA.hydrationCodeDefectStatus='I6_5_HYDRATION_CODE_DEFECT_SUCCESSOR_LIVE_PASS';
          R.modules.RECIBOS_CARTERA.liveHydration={runId:Number(process.env.GITHUB_RUN_ID),sourceSha:release.sourceSha,buildId:release.buildId,receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0),requiredServerConfirmed:['vehiculos','recibosEsperados','carteraPrimas'],writes:0};
          fs.writeFileSync(process.env.REGISTRY,JSON.stringify(R,null,2)+'\n');

          const freeze={
            schema:'GRAVICENTRA_I6_5_BLOCK_B_HYDRATION_LIVE_FREEZE_V1',status:'LIVE_PASS',date:'2026-09-18',
            gate:'I6.5',block:'B_READ_PATH_COMPOSITION_RECIBOS_CARTERA',sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,runId:Number(process.env.GITHUB_RUN_ID),
            rootCause:'recibosEsperados/carteraPrimas/vehiculos were deferred optional product hydration while Cliente360/Polizas depended on them; V920 could become visually ready before those snapshots attached/server-confirmed.',
            fix:'Promote vehiculos, recibosEsperados and carteraPrimas to required startup hydration and make I6.5 proof compare runtime counts against direct canonical Firestore counts.',
            hydrationContractVersion:'fase-a-i2-20260918.4-receipts-portfolio-required',receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0),
            directReceiptCount:Number(live.directCounts?.recibosEsperados||0),directPortfolioCount:Number(live.directCounts?.carteraPrimas||0),
