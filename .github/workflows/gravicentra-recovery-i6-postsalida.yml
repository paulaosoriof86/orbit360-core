          fs.writeFileSync(rp,JSON.stringify(r,null,2)+'\n');
          c.i65ForensicRemediationPlan.b2={...(c.i65ForensicRemediationPlan.b2||{}),googleAuthProvider:{status:'READBACK_PASS',providerId:'google.com',enabled:true,runId:Number(process.env.GITHUB_RUN_ID),permanentFixturePreflightInstalled:true},humanDriveOAuthProofPending:true};
          fs.writeFileSync(cp,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$RECEIPT" "$CONTROL"
          git config user.name gravicentra-recovery-bot
          git config user.email gravicentra-recovery-bot@users.noreply.github.com
          git commit -m "freeze(i6.5): Google Auth provider enabled with readback"
          git push origin "HEAD:$GITHUB_REF_NAME"


