          node - <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync(process.env.CONTROL)),b=JSON.parse(fs.readFileSync(process.env.B2_LOCK)),q=b.orphanSyntheticCleanup||{},x=q.boundaries||{};
          const run=c.i65ForensicRemediationPlan?.currentBlock==='B2'&&q.status==='AUTHORIZED_PENDING_RUN'&&Number(q.orphanRunId)>0;
          if(run&&(x.deleteOnlyMatchingSyntheticRows!==true||x.businessDataMutationAuthorized!==false||x.reimportAuthorized!==false||x.livePromotionAuthorized!==false||x.emailSendAuthorized!==false))throw Error('B2_CLEANUP_BOUNDARY_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(run?'true':'false')+'\n');
