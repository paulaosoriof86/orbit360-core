          L.releaseBinding={sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,artifactArchiveDigest:release.artifactArchiveDigest,previewChannelId:release.previewChannelId};
          L.i65HydrationAcceptance={status:'I6_5_HYDRATION_CODE_DEFECT_SUCCESSOR_LIVE_PASS',sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,liveRunId:Number(process.env.GITHUB_RUN_ID),hydrationContractVersion:'fase-a-i2-20260918.4-receipts-portfolio-required',canonicalOwner:'receiptsPortfolioProjectionV920',receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0),serverConfirmedRequiredCollections:['vehiculos','recibosEsperados','carteraPrimas'],i64SentinelsPreserved:true,operationalWrites:0};
          fs.writeFileSync(process.env.LEDGER,JSON.stringify(L,null,2)+'\n');
          C.capabilityStatusAuthority.latestBlobSha=cp.execFileSync('git',['hash-object',process.env.LEDGER],{encoding:'utf8'}).trim();
