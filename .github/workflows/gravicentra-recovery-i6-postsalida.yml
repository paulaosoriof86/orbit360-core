          import hashlib,json,os,time,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()];base=os.environ['TARGET_URL'].rstrip('/')
