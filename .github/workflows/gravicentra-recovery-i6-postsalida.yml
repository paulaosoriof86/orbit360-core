name: Gravicentra I6 Post-Salida

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-recovery-i6-postsalida.yml'
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
      - 'artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-i6-postsalida-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json

jobs:
  i62-cursor-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      I62_PRIVATE_KEY_B64: ${{ secrets.I62_READBACK_PRIVATE_KEY_B64 }}
      I62_PRIVATE_KEY_PEM: ${{ secrets.I62_READBACK_PRIVATE_KEY_PEM }}
      GRAVICENTRA_I62_PRIVATE_KEY_B64: ${{ secrets.GRAVICENTRA_I62_READBACK_PRIVATE_KEY_B64 }}
      GRAVICENTRA_I62_PRIVATE_KEY_PEM: ${{ secrets.GRAVICENTRA_I62_READBACK_PRIVATE_KEY_PEM }}
      GRAVICENTRA_I6_2_PRIVATE_KEY_B64: ${{ secrets.GRAVICENTRA_I6_2_READBACK_PRIVATE_KEY_B64 }}
      GRAVICENTRA_I6_2_PRIVATE_KEY_PEM: ${{ secrets.GRAVICENTRA_I6_2_READBACK_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resume strictly from canonical I6.2 cursor
        id: cursor
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const need=(x,c)=>{if(!x)throw new Error(c)};
          need(C.gateState?.gates?.I6?.activeSubgate==='I6.2','I62_SUBGATE_NOT_ACTIVE');
          need(S.status==='PINNED_FOR_V5_DELTA','I62_SOURCE_NOT_PINNED');
          need(S.execution?.cursorState==='LIVE_READBACK_PASS','I62_CURSOR_NOT_LIVE_READBACK_PASS');
          need(S.execution?.nextRequiredStep==='DETERMINISTIC_DIFF','I62_NEXT_STEP_NOT_DETERMINISTIC_DIFF');
          need(C.nextAction==='I6_2_DETERMINISTIC_DIFF','I62_CONTROL_NEXT_ACTION_MISMATCH');
          need(Number.isInteger(S.execution?.readbackRunId)&&S.execution.readbackRunId>0,'I62_READBACK_RUN_ID_MISSING');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`readback_run_id=${S.execution.readbackRunId}\n`);
          console.log('I62_CURSOR=LIVE_READBACK_PASS');
          console.log('I62_NEXT_REQUIRED_STEP=DETERMINISTIC_DIFF');
          console.log('I6_2_WRITES_EXECUTED=0');
          NODE

      - name: Download the already-authorized encrypted readback artifact
        uses: actions/download-artifact@v4
        with:
          name: gravicentra-i6-2-live-readback-${{ steps.cursor.outputs.readback_run_id }}
          run-id: ${{ steps.cursor.outputs.readback_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/i62-existing-readback

      - name: Verify and decrypt existing readback inside executor boundary
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/i62-private" "$RUNNER_TEMP/i62-hold"
          chmod 700 "$RUNNER_TEMP/i62-private"
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const root=process.env.RUNNER_TEMP+'/i62-existing-readback';
          const privDir=process.env.RUNNER_TEMP+'/i62-private';
          const holdDir=process.env.RUNNER_TEMP+'/i62-hold';
          const intake=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const find=(pred)=>{
            const stack=[root];
            while(stack.length){const d=stack.pop();for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())stack.push(p);else if(pred(n))return p;}}
            return null;
          };
          const encPath=find(n=>n==='i6-2-live-readback.encrypted.json'||n.endsWith('.encrypted.json'));
          const sumPath=find(n=>n==='i6-2-live-readback-summary.json'||n.endsWith('-summary.json'));
          if(!encPath||!sumPath) throw new Error('I62_EXISTING_READBACK_ARTIFACT_FILES_MISSING');
          const summary=JSON.parse(fs.readFileSync(sumPath,'utf8'));
          const encBytes=fs.readFileSync(encPath);
          const encHash=crypto.createHash('sha256').update(encBytes).digest('hex');
          if(summary.encryptedFileSha256!==encHash) throw new Error('I62_EXISTING_READBACK_CIPHERTEXT_HASH_MISMATCH');
          if(summary.sourceSha256!==intake.source.sha256) throw new Error('I62_EXISTING_READBACK_SOURCE_BINDING_MISMATCH');
          if(summary.writesExecuted!==0) throw new Error('I62_EXISTING_READBACK_NOT_ZERO_WRITE');
          const candidates=[
            process.env.I62_PRIVATE_KEY_PEM,
            process.env.GRAVICENTRA_I62_PRIVATE_KEY_PEM,
            process.env.GRAVICENTRA_I6_2_PRIVATE_KEY_PEM,
            process.env.I62_PRIVATE_KEY_B64?Buffer.from(process.env.I62_PRIVATE_KEY_B64,'base64').toString('utf8'):'',
            process.env.GRAVICENTRA_I62_PRIVATE_KEY_B64?Buffer.from(process.env.GRAVICENTRA_I62_PRIVATE_KEY_B64,'base64').toString('utf8'):'',
            process.env.GRAVICENTRA_I6_2_PRIVATE_KEY_B64?Buffer.from(process.env.GRAVICENTRA_I6_2_PRIVATE_KEY_B64,'base64').toString('utf8'):''
          ].filter(Boolean);
          if(!candidates.length){
            const hold={
              schema:'GRAVICENTRA_I6_2_HOLD_V1',
              gate:'I6.2',
              cursor:'LIVE_READBACK_PASS',
              attemptedStep:'DETERMINISTIC_DIFF',
              holdCode:'HOLD_I6_2_EXISTING_READBACK_PRIVATE_KEY_UNAVAILABLE',
              readbackRunId:intake.execution.readbackRunId,
              readbackArtifactVerified:true,
              ciphertextHashVerified:true,
              sourceBindingVerified:true,
              writesExecuted:0,
              productionMutation:false,
              secretValuesExposed:false,
              detail:'The authorized readback is encrypted with RSA-OAEP and no matching private-key material is available to the executor under the supported I6.2 secret bindings. A fresh readback was not substituted.'
            };
            fs.writeFileSync(holdDir+'/hold.json',JSON.stringify(hold,null,2)+'\n');
            console.error(hold.holdCode);
            process.exit(78);
          }
          const env=JSON.parse(encBytes.toString('utf8'));
          let plain=null,lastErr=null;
          for(const privateKey of candidates){
            try{
              const key=crypto.privateDecrypt({key:privateKey,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},Buffer.from(env.wrappedKey,'base64'));
              const decipher=crypto.createDecipheriv('aes-256-gcm',key,Buffer.from(env.iv,'base64'));
              decipher.setAuthTag(Buffer.from(env.tag,'base64'));
              plain=Buffer.concat([decipher.update(Buffer.from(env.ciphertext,'base64')),decipher.final()]);
              break;
            }catch(e){lastErr=e;}
          }
          if(!plain){
            const hold={schema:'GRAVICENTRA_I6_2_HOLD_V1',gate:'I6.2',cursor:'LIVE_READBACK_PASS',attemptedStep:'DETERMINISTIC_DIFF',holdCode:'HOLD_I6_2_EXISTING_READBACK_PRIVATE_KEY_MISMATCH',readbackRunId:intake.execution.readbackRunId,readbackArtifactVerified:true,ciphertextHashVerified:true,sourceBindingVerified:true,writesExecuted:0,productionMutation:false,secretValuesExposed:false,detail:'Private-key material was present but none could decrypt the authorized RSA-OAEP envelope. A fresh readback was not substituted.'};
            fs.writeFileSync(holdDir+'/hold.json',JSON.stringify(hold,null,2)+'\n');
            console.error(hold.holdCode);
            process.exit(79);
          }
          const plainHash=crypto.createHash('sha256').update(plain).digest('hex');
          if(summary.plaintextSha256!==plainHash) throw new Error('I62_EXISTING_READBACK_PLAINTEXT_HASH_MISMATCH');
          const exact=JSON.parse(plain.toString('utf8'));
          if(exact.writesExecuted!==0) throw new Error('I62_EXISTING_READBACK_PLAINTEXT_NOT_ZERO_WRITE');
          fs.writeFileSync(privDir+'/readback.json',plain,{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'decrypted=true\n');
          console.log('I62_EXISTING_READBACK_DECRYPTED=PASS');
          console.log('I62_EXISTING_READBACK_DOCUMENT_COUNT='+exact.documents.length);
          console.log('I6_2_WRITES_EXECUTED=0');
          NODE

      - name: Deterministic diff continuation gate
        if: steps.decrypt.outputs.decrypted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'I62_EXISTING_READBACK_ACCESS=PASS'
          echo 'I62_DETERMINISTIC_DIFF_INPUT_READY=true'
          echo 'I6_2_WRITES_EXECUTED=0'
          echo 'HOLD_I6_2_SOURCE_DELTA_EXECUTOR_REQUIRES_PINNED_SOURCE_TRANSPORT'
          exit 80

      - name: Publish non-secret HOLD evidence when fail-closed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-2-diff-hold-${{ github.run_id }}
          path: ${{ runner.temp }}/i62-hold
          if-no-files-found: ignore
          retention-days: 14

      - name: Guarantee private plaintext cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/i62-private" || true
          echo 'I62_PRIVATE_PLAINTEXT_CLEANUP=ATTEMPTED'
