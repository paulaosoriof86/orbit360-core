name: Gravicentra I6 Post-Salida
# I6.2 authoritative DATA_UPDATE executor — Evergreen V5.
# Same approved operational write chain; encrypted ephemeral source bridge only.
# Resume I6.2 after causal executor role-selector correction.
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-recovery-i6-postsalida.yml'

permissions:
  contents: read
  actions: read

env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
  PRODUCTION_URL: https://ays-orbit-360-lab.web.app

jobs:
  i62-deterministic-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind exact I6.2 V5 authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          const s=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json','utf8'));
          const need=(x,m)=>{if(!x)throw new Error(m)};
          need(c.status==='PRODUCTION_ACCEPTED','I62_BASELINE');
          need(c.gateState?.gates?.I6?.status==='I6_2_DATA_UPDATE_V5_ACTIVE','I62_GATE');
          need(c.gateState?.gates?.I6?.activeSubgate==='I6.2','I62_SUBGATE');
          need(c.i6Execution?.authorized===true,'I62_I6_NOT_AUTHORIZED');
          need(c.i6Execution?.dataUpdateMode==='EVERGREEN_V5_DELTA_FIRST','I62_V5_NOT_ACTIVE');
          need(c.i6Execution?.perBlockApplyRequiresExplicitAuthorization===false,'I62_APPLY_POLICY');
          need(s.status==='PINNED_FOR_V5_DELTA','I62_SOURCE_NOT_PINNED');
          need(s.source?.sha256==='f2e57fa72ff1b94b110b5037038c6c47fbc727c513f9eebd2348d7f4f2244083','I62_SOURCE_SHA');
          console.log('I62_AUTHORITY=PASS');
          NODE
      - name: Install execution dependencies
        run: |
          npm install --no-save --package-lock=false firebase-admin@13.10.0 @google-cloud/secret-manager@6.1.0 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnose privileged actor availability safely
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app');
          const {getAuth}=require('firebase-admin/auth');
          const {getFirestore}=require('firebase-admin/firestore');
          const clean=v=>String(v==null?'':v).trim();
          const canon=v=>{const k=clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');return ({direccion:'direccion',superadmin:'superadmin',super_admin:'super_admin',admintenant:'admintenant',admin_tenant:'admin_tenant',admin:'admin',operativo:'operativo'})[k]||k;};
          const roles=m=>[...new Set([].concat(m?.roles||[],m?.rolesAsignados||[],m?.assignedRoles||[],m?.rolesDisponibles||[],m?.role||[],m?.rol||[],m?.defaultRole||[],m?.rolDefault||[],m?.roleDefault||[]).map(canon).filter(Boolean))];
          const sa=(()=>{for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){try{const x=JSON.parse(process.env[k]||'');if(x?.type==='service_account'&&x?.project_id===process.env.PROJECT_ID&&x?.client_email&&x?.private_key)return x;}catch{}}throw Error('NO_SA')})();
          const app=initializeApp({credential:cert(sa),projectId:process.env.PROJECT_ID},'i62-actor-diagnostic');
          (async()=>{try{const db=getFirestore(app),auth=getAuth(app),snap=await db.collection('tenants').doc(process.env.TENANT_ID).collection('members').get(),listed=await auth.listUsers(1000),users=new Map(listed.users.map(u=>[u.uid,u]));const out={activeMembers:0,privilegedMembers:0,privilegedAuthUsers:0,privilegedEnabled:0,privilegedVerified:0,roles:{}};for(const d of snap.docs){const m=d.data()||{},state=canon(m.status||m.estado||'active');if(m.active===false||m.activo===false||['inactive','inactivo','blocked','bloqueado','suspended','suspendido'].includes(state))continue;out.activeMembers++;const rs=roles(m),priv=rs.filter(r=>['direccion','superadmin','super_admin','admintenant','admin_tenant','admin','operativo'].includes(r));if(!priv.length)continue;out.privilegedMembers++;for(const r of priv)out.roles[r]=(out.roles[r]||0)+1;const uid=clean(m.uid||d.id),u=users.get(uid);if(u){out.privilegedAuthUsers++;if(!u.disabled)out.privilegedEnabled++;if(!u.disabled&&u.emailVerified===true)out.privilegedVerified++;}}console.log('I62_ACTOR_DIAGNOSTIC='+JSON.stringify(out));}finally{await deleteApp(app).catch(()=>{});}})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Apply deterministic delta, read back and prove updated values
        env:
          I62_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i62-evidence
        run: node tools/gravicentra-i6-2-delta-executor-ephemeral.mjs
      - name: LIVE authenticated role regression after data update
        env:
          PREVIEW_URL: ${{ env.PRODUCTION_URL }}
          I4A_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i62-evidence/live-auth
        run: node tools/gravicentra-i4a-authenticated-browser-v2.mjs
      - name: Seal physical I6.2 evidence
        shell: bash
        run: |
          set -euo pipefail
          E="$I62_EVIDENCE_DIR"
          test "$(jq -r .status "$E/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .readback.status "$E/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .functional.status "$E/i62-apply-readback-functional.json")" = PASS
          test "$(jq -r .apply.operationalMutations "$E/i62-apply-readback-functional.json")" = 14
          test "$(jq -r .apply.credentialUpdates "$E/i62-apply-readback-functional.json")" = 3
          test "$(jq -r .status "$E/live-auth/i4a-authenticated-browser.json")" = AUTH_BROWSER_PASS
          printf '{"schema":"GRAVICENTRA_I6_2_PHYSICAL_SEAL_V1","gate":"I6.2","status":"I6_2_DIRECTORIO_LIVE_PASS","sourceSha256":"f2e57fa72ff1b94b110b5037038c6c47fbc727c513f9eebd2348d7f4f2244083","operationalMutations":14,"credentialUpdates":3,"readback":"PASS","functional":"PASS","roleRegression":"PASS","containsSecrets":false}\n' > "$E/i62-physical-seal.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gravicentra-i6-2-apply-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i62-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
