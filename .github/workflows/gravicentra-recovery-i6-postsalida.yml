          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8')),d=c.i65OperationalClosureDefect||{};
          const mode=d.status==='I6_5_OPERATIONAL_CLOSURE_CODE_DEFECT_CANDIDATE_PENDING_BUILD'?'release':'noop';
          if(mode==='release'){
            if(c.nextAction!=='I6_5_OPERATIONAL_CLOSURE_SUCCESSOR_RELEASE')throw new Error('I65_OPERATIONAL_RELEASE_ACTION_INVALID');
