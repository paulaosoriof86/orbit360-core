          out.checks.secretStatus=secret?.status||null;
          out.checks.secretBindings=secret?.after||null;
          if(process.env.ACCESS_PREFLIGHT_CONCLUSION!=='success'||access?.status!=='PASS')out.errors.push('ACCESS_AUTHORITY_PREFLIGHT_FAILED');
          if(process.env.SECRET_PREFLIGHT_CONCLUSION!=='success'||secret?.status!=='PASS')out.errors.push('PREVIEW_SECRET_PREFLIGHT_FAILED');
          const required=['roles/secretmanager.viewer','roles/secretmanager.secretAccessor','roles/secretmanager.secretVersionAdder'];
          if(secret&&!required.every(r=>secret.after?.[r]===true))out.errors.push('PREVIEW_SECRET_IAM_INCOMPLETE');
          try{require.resolve('firebase-admin');out.checks.firebaseAdmin=true;}catch{out.errors.push('FIREBASE_ADMIN_PACKAGE_MISSING');}
          try{require.resolve('playwright');out.checks.playwright=true;}catch{out.errors.push('PLAYWRIGHT_PACKAGE_MISSING');}
          try{require.resolve('@google-cloud/secret-manager');out.checks.secretManagerPackage=true;}catch{out.errors.push('SECRET_MANAGER_PACKAGE_MISSING');}
          out.status=out.errors.length?'FAIL':'PASS';
          fs.writeFileSync(process.env.B2_AUTH_PREFLIGHT_FILE,JSON.stringify(out,null,2)+'\n');
          console.log('B2_AUTH_INFRA_PREFLIGHT='+out.status+' '+JSON.stringify({errors:out.errors,checks:out.checks}));
          if(out.errors.length)process.exit(1);
          NODE

      - name: Execute authenticated reversible B2 Preview proof
        id: proof
        if: steps.mode.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.mode.outputs.target }}
          B2_AUTH_PROOF_FILE: ${{ runner.temp }}/b2-authenticated-preview.json
        run: node tools/gravicentra-i6-5-b2-authenticated-preview.mjs
      - name: Capture R84 callable Cloud Run and Functions diagnostics
        if: ${{ failure() && steps.mode.outputs.run == 'true' }}
        continue-on-error: true
        env:
          B2_R84_CLOUD_DIAG_FILE: ${{ runner.temp }}/b2-r84-cloud-diagnostic.json
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const {GoogleAuth}=require('google-auth-library');
          const PROJECT=String(process.env.PROJECT_ID||'ays-orbit-360-lab').trim();
          const REGION='us-east1';
          const FUNCTION='orbit360DocumentDriveStatusPreview';
          const SERVICE='orbit360documentdrivestatuspreview';
          function sa(){
            for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){
              try{
                const x=JSON.parse(process.env[k]||'');
                if(x?.type==='service_account'&&x?.project_id===PROJECT&&x?.client_email&&x?.private_key)return x;
              }catch{}
            }
            throw new Error('B2_R84_CLOUD_DIAG_SERVICE_ACCOUNT');
          }
          function safe(v){
            const s=JSON.stringify(v);
            return JSON.parse(s.replace(/ya29\.[A-Za-z0-9._-]+/g,'[REDACTED_TOKEN]').replace(/"refreshToken"\s*:\s*"[^"]+"/g,'"refreshToken":"[REDACTED]"'));
          }
          (async()=>{
            const creds=sa();
            const auth=new GoogleAuth({projectId:PROJECT,credentials:{client_email:creds.client_email,private_key:creds.private_key},scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            const out={schema:'GRAVICENTRA_B2_R84_CLOUD_DIAGNOSTIC_V1',projectId:PROJECT,region:REGION,functionName:FUNCTION,serviceName:SERVICE,capturedAt:new Date().toISOString(),function:null,service:null,entries:[],errors:[]};
            for(const [key,url] of [
              ['function','https://cloudfunctions.googleapis.com/v2/projects/'+PROJECT+'/locations/'+REGION+'/functions/'+FUNCTION],
              ['service','https://run.googleapis.com/v2/projects/'+PROJECT+'/locations/'+REGION+'/services/'+SERVICE]
            ]){
              try{const r=await client.request({url});out[key]=safe(r.data);}
              catch(e){out.errors.push(key+':'+String(e?.response?.status||e?.code||'')+':'+String(e?.message||e));}
            }
            const since=new Date(Date.now()-20*60*1000).toISOString();
            const filter='timestamp>="'+since+'" AND ((resource.type="cloud_run_revision" AND resource.labels.service_name="'+SERVICE+'") OR (resource.type="cloud_function" AND resource.labels.function_name="'+FUNCTION+'"))';
            try{
              const r=await client.request({url:'https://logging.googleapis.com/v2/entries:list',method:'POST',data:{resourceNames:['projects/'+PROJECT],filter,orderBy:'timestamp desc',pageSize:100}});
              out.entries=safe((r.data&&r.data.entries)||[]);
            }catch(e){out.errors.push('logging:'+String(e?.response?.status||e?.code||'')+':'+String(e?.message||e));}
            fs.writeFileSync(process.env.B2_R84_CLOUD_DIAG_FILE,JSON.stringify(out,null,2)+'\n');
            const summary={
              functionServiceAccount:out.function?.serviceConfig?.serviceAccountEmail||null,
              functionUri:out.function?.serviceConfig?.uri||null,
              serviceAccount:out.service?.template?.serviceAccount||null,
              latestReadyRevision:out.service?.latestReadyRevision||null,
              entryCount:out.entries.length,
              errors:out.errors,
              top:out.entries.slice(0,12).map(e=>({timestamp:e.timestamp,severity:e.severity,revision:e.resource?.labels?.revision_name||null,text:e.textPayload||e.jsonPayload?.message||e.jsonPayload?.error||e.protoPayload?.status?.message||null}))
            };
            console.log('B2_R84_CLOUD_DIAGNOSTIC='+JSON.stringify(summary));
          })().catch(e=>{console.error('B2_R84_CLOUD_DIAGNOSTIC_FATAL='+String(e?.stack||e));process.exitCode=1;});
          NODE
      - name: Upload authenticated B2 evidence
        if: always() && steps.mode.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-b2-authenticated-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b2-authenticated-preview.json
            ${{ runner.temp }}/b2-access-config-recovery.json
            ${{ runner.temp }}/b2-preview-secret-iam.json
            ${{ runner.temp }}/b2-auth-infrastructure-preflight.json
            ${{ runner.temp }}/b2-r84-cloud-diagnostic.json
            ${{ runner.temp }}/b2-visual/*
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      - name: Freeze authenticated B2 Preview pass
        if: steps.mode.outputs.run == 'true' && steps.proof.conclusion == 'success'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cpPath=process.env.CONTROL,lockPath=process.env.B2_LOCK,proofPath=process.env.RUNNER_TEMP+'/b2-authenticated-preview.json';
          const c=JSON.parse(fs.readFileSync(cpPath)),b=JSON.parse(fs.readFileSync(lockPath)),e=JSON.parse(fs.readFileSync(proofPath));
          if(e.status!=='PASS'||e.cleanup?.clientAbsent!==true||e.cleanup?.insurerFixturePreserved!==true||e.cleanup?.userFixturePreserved!==true||e.cleanup?.assetFixturePreserved!==true||e.humanFixtures?.status!=='READY_FOR_TARGETED_HUMAN_UAT'||e.accessConfigRoundtrip?.saveOk!==true||e.accessConfigRoundtrip?.getOk!==true||e.accessConfigRoundtrip?.previewIsolated!==true||e.directionDocumentAuth?.direction?.status?.available!==true||e.directionDocumentAuth?.operativoRestored?.status?.available!==true||e.scope?.asesor?.leakCount!==0||e.crud?.cobros!==0||e.renewal?.cobros!==0||e.crud?.vehiclePolicyContext!==true||e.crud?.individualReceiptEditReadback!==true||e.crud?.individualReceiptPortfolioSync!==true||e.crud?.reportedPaymentVisible!==true||e.crud?.reportedPaymentDoesNotFabricateCobro!==true)throw Error('B2_AUTH_EVIDENCE_NOT_CLEAN_PASS');
          b.status='PREVIEW_AUTHENTICATED_PASS_PENDING_PAULA_VISUAL';
          b.authenticatedPreviewProof={
            ...(b.authenticatedPreviewProof||{}),
            status:'PASS',
            runId:Number(process.env.GITHUB_RUN_ID),
            exactPreviewUrl:b.preview.url,
            exactPreviewBuildId:b.preview.buildId,
            exactPreviewSourceSha:b.preview.sourceSha,
            exactPreviewArtifactId:b.preview.artifactId,
            scope:{
              operativo:e.scope.operativo?.scope||'',
              asesor:e.scope.asesor?.scope||'',
              asesorLeakCount:e.scope.asesor?.leakCount,
              operativoCounts:e.scope.operativo?.counts||{},
              asesorCounts:e.scope.asesor?.counts||{}
            },
            crud:e.crud,
            renewal:e.renewal,
            cleanup:e.cleanup,
            accessConfigRoundtrip:e.accessConfigRoundtrip,
            directionDocumentAuth:e.directionDocumentAuth,
            humanFixtures:e.humanFixtures,
            syntheticWrites:e.writes?.synthetic||0,
            cleanupWrites:e.writes?.cleanup||0
          };
          b.acceptance.clientCreateEditRefreshReadback=true;
          b.acceptance.policyCreateEditRefreshReadback=true;
          b.acceptance.sellerAdvisorCreateEdit=true;
          b.acceptance.renewalReceiptsPortfolioZeroCobro=true;
          b.acceptance.vehicleCreateEdit=true;
          b.acceptance.singleReceiptProjection=true;
          b.acceptance.dirtyFormsProtected=true;
          b.acceptance.previewExact=true;
          b.acceptance.functionalPass=true;
          b.acceptance.r96AccessPreviewServerReadback=true;
          b.acceptance.r97DirectionDocumentAuthorization=true;
          b.acceptance.finalHumanUserInsurerFixturesReady=true;
          b.acceptance.paulaVisual=false;
          b.carryForward.activeRoleScopeVisualSpotCheck='AUTHENTICATED_RUNTIME_PASS_VISUAL_CONFIRMATION_PENDING';
          fs.writeFileSync(lockPath,JSON.stringify(b,null,2)+'\n');
          c.i65ForensicRemediationPlan.b2={
            ...(c.i65ForensicRemediationPlan.b2||{}),
            status:b.status,
            authenticatedPreviewPass:true,
            authenticatedPreviewRunId:Number(process.env.GITHUB_RUN_ID),
            activeRoleScopeRuntimePass:true,
            clientCreateEditRuntimePass:true,
            policyVehicleRuntimePass:true,
            renewalRuntimePass:true,
            zeroConfirmedCobroWithoutEvidence:true,
            syntheticCleanupPass:true,
            r96AccessPreviewServerReadback:true,
            r97DirectionDocumentAuthorization:true,
            humanFixtures:e.humanFixtures,
            livePromoted:false
          };
          c.i65ForensicRemediationPlan.mechanismSyncStatus='B2_AUTHENTICATED_PREVIEW_PASS_PENDING_VISUAL';
          fs.writeFileSync(cpPath,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$B2_LOCK"
          BLOB=$(git hash-object "$B2_LOCK");export BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.CONTROL,c=JSON.parse(fs.readFileSync(p));
          c.i65ForensicRemediationPlan.b2ExecutionLockBlobSha=process.env.BLOB;
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$CONTROL"
          git config user.name gravicentra-recovery-bot
          git config user.email gravicentra-recovery-bot@users.noreply.github.com
          git commit -m "freeze(i6.5): B2 authenticated Preview pass pending visual"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Authenticated B2 failure remains fail-closed
        if: ${{ failure() && steps.mode.outputs.run == 'true' }}
        continue-on-error: true
        run: echo "B2_AUTHENTICATED_PROOF_FAILED_NO_LIVE_NO_REIMPORT_CLEANUP_REQUIRED"


  i65-b2-synthetic-cleanup:
