permissions:
  contents: write
  actions: read

concurrency:
  group: gravicentra-i6-postsalida-${{ github.ref }}
  cancel-in-progress: ${{ contains(github.event.head_commit.message || '', 'cancel duplicate B2 auth proof') }}

env:
  PROJECT_ID: ays-orbit-360-lab
  HOSTING_SITE: ays-orbit-360-lab
  TENANT_HINT: alianzas-soluciones
  PRODUCTION_URL: https://ays-orbit-360-lab.web.app
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_4_POLIZAS_RIESGOS_SOURCE_INTAKE_20260918.json
  LEDGER: artifacts/orbit360-recovery/release-control/CAPABILITY_STATUS_LEDGER.json

jobs:
  i64-code-defect-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate and causal boundary
        id: mode
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8')),d=c.i64CodeDefect||{};
          const mode=d.status==='I6_4_CODE_DEFECT_CANDIDATE_PENDING_BUILD'?'release':'noop';
          if(mode==='release'){
            if(c.nextAction!=='I6_4_CODE_DEFECT_SUCCESSOR_RELEASE')throw new Error('I64_RELEASE_ACTION_INVALID');
            if(c.i6Execution?.productMutationAuthorized!==true)throw new Error('I64_RELEASE_PRODUCT_AUTH_MISSING');
            if(d.classification!=='CODE_DEFECT'||d.dataMutationAuthorized!==false||d.reimportAuthorized!==false)throw new Error('I64_RELEASE_BOUNDARY_INVALID');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'mode='+mode+'\n');
          console.log('I64_MODE='+mode);
          NODE

      - name: Assert LIVE equals latest certified candidate
        env:
          LIVE_BINDING_ATTEMPTS: 12
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: No-op after technical seal
        if: steps.mode.outputs.mode == 'noop'
        run: node tools/gravicentra-governance-preflight-v1.mjs --mode=i6

      - name: Source contracts
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          node --check orbit360-platform/modules/cliente360.js
          node --check orbit360-platform/modules/polizas.js
          node --check orbit360-platform/modules/policy-receipts-v1199-bridge.js
          node --check orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          node --check orbit360-platform/core/pwa.js
          node --check tools/gravicentra-i6-1-preview-package.mjs
          node --check tools/gravicentra-i6-4-code-defect-functional.mjs
          node --check tools/gravicentra-i6-4-code-defect-contract.mjs
          node tools/gravicentra-i6-4-code-defect-contract.mjs
          grep -Fq "Prima neta vigente" orbit360-platform/modules/cliente360.js
          grep -Fq "no se suman GTQ y COP" orbit360-platform/modules/polizas.js
          grep -Fq "Renovabilidad pendiente de validar" orbit360-platform/modules/cliente360.js
          grep -Fq "Renovabilidad pendiente de validar" orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          grep -Fq "kpiOwnerDelegated:true" orbit360-platform/modules/policy-receipts-v1199-bridge.js
          grep -Fq "checkBuildFreshness" orbit360-platform/core/pwa.js
          grep -Fq "bindBuildAssetsInIndex" tools/gravicentra-i6-1-preview-package.mjs

      - name: Install runtime proof dependencies
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.4.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Select existing Firebase authority
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/i64-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key') and d.get('client_email'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json';p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('I64_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL=''
          while read -r F; do
            if GOOGLE_APPLICATION_CREDENTIALS="$F" npx --yes firebase-tools@14.10.1 hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then SEL="$F"; break; fi
          done < "$ROOT/files"
          test -n "$SEL" || { echo I64_FIREBASE_AUTH_NOT_PROVEN >&2; exit 42; }
          cp "$SEL" "$RUNNER_TEMP/i64-sa.json"
          chmod 600 "$RUNNER_TEMP/i64-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/i64-sa.json" >> "$GITHUB_ENV"

      - name: Materialize immutable package once
        if: steps.mode.outputs.mode == 'release'
        id: build
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps.json"
          export APPS="$RUNNER_TEMP/apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['APPS']));a=d.get('result') if isinstance(d,dict) else None
          if not isinstance(a,list):raise SystemExit('I64_WEB_APP_LIST_INVALID')
          web=[x for x in a if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1:raise SystemExit('I64_WEB_APP_CARDINALITY:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config.json"
          export SOURCE_SHA="$GITHUB_SHA"
          export RELEASE_GATE="I6.4"
          export BUILD_PREFIX="gi-i64"
          export ENVIRONMENT_REF="firebase-hosting-preview-i6-4-code-defect"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/i64-package" "$RUNNER_TEMP/public-config.json" > "$RUNNER_TEMP/package-output.json"
          cat "$RUNNER_TEMP/package-output.json"
          BUILD_ID=$(node -e "const d=require(process.env.RUNNER_TEMP+'/package-output.json');process.stdout.write(d.buildId)")
          grep -Fq "var RUNTIME_BUILD = '$BUILD_ID';" "$RUNNER_TEMP/i64-package/bundle/site/core/pwa.js"
          grep -Fq "var BUILD = '$BUILD_ID';" "$RUNNER_TEMP/i64-package/bundle/site/sw.js"
          grep -Fq "var CACHE = 'orbit360-$BUILD_ID';" "$RUNNER_TEMP/i64-package/bundle/site/sw.js"
          export I64_FIREBASE_JSON="$RUNNER_TEMP/i64-package/bundle/firebase.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['I64_FIREBASE_JSON']))
          hs=d.get('hosting',{}).get('headers',[])
          by={x.get('source'):x.get('headers',[]) for x in hs}
          for src in ['/index.html','/product-runtime-config.js','/__recovery__/build.json','/sw.js']:
              vals=' '.join(h.get('value','') for h in by.get(src,[]))
              if 'no-store' not in vals or 'must-revalidate' not in vals: raise SystemExit('I64_FRESHNESS_HEADER_MISSING:'+src)
          PY
          node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/package-output.json','utf8'));
          const m={build_id:d.buildId,hosted_file_count:d.hostedFileCount,hosted_payload_digest:d.hostedPayloadDigest,backend_file_count:d.backendFileCount,backend_source_digest:d.backendSourceDigest,bundle_file_count:d.bundleFileCount,bundle_digest:d.bundleDigest};
          for(const [k,v] of Object.entries(m))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\n');
          NODE

      - name: Deploy exact package to isolated Preview
        if: steps.mode.outputs.mode == 'release'
        id: preview
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/i64-package/bundle"
          CHANNEL_ID="gi-i64-$GITHUB_RUN_ID"
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/preview.json"
          export DEPLOY="$RUNNER_TEMP/preview.json"
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['DEPLOY']).read();prod='https://'+os.environ['HOSTING_SITE']+'.web.app'
          urls=[u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.rstrip('/')!=prod]
          if not urls:raise SystemExit('I64_PREVIEW_URL_NOT_FOUND')
          print(urls[-1])
          PY
          )
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Exact Preview readback
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/i64-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.error,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/');bad=[]
          def read_with_preview_settle(req, attempts=8):
              last=None
              for n in range(attempts):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:return r.read()
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code not in (404,429,500,502,503,504) or n==attempts-1:raise
                  except urllib.error.URLError as e:
                      last=e
                      if n==attempts-1:raise
                  time.sleep(2)
              raise last
          for want,rel in rows:
              req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?i64='+os.environ['EXPECTED_DIGEST'][:16],headers={'Accept-Encoding':'identity','Cache-Control':'no-cache'})
              got=hashlib.sha256(read_with_preview_settle(req)).hexdigest()
              if got!=want:bad.append((rel,want,got))
          if bad:raise SystemExit('I64_PREVIEW_READBACK_MISMATCH:'+json.dumps(bad[:3]))
          m=json.loads(read_with_preview_settle(urllib.request.Request(base+'/__recovery__/build.json?i64=1',headers={'Cache-Control':'no-cache'})))
          if m.get('sourceSha')!=os.environ['GITHUB_SHA'] or m.get('buildId')!=os.environ['EXPECTED_BUILD_ID'] or m.get('gate')!='I6.4':raise SystemExit('I64_PREVIEW_MARKER_MISMATCH')
          print('I64_PREVIEW_READBACK='+str(len(rows)))
          PY

      - name: Preview I6.4 code-defect proof
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          I64_PROOF_STAGE: preview
          I64_PROOF_FILE: ${{ runner.temp }}/i64-package/evidence/i64-code-defect-preview-functional.json
        run: node tools/gravicentra-i6-4-code-defect-functional.mjs

      - name: Upload immutable build artifact before promotion
        if: steps.mode.outputs.mode == 'release'
        id: buildart
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-4-code-defect-build-${{ github.run_id }}
          path: ${{ runner.temp }}/i64-package
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Create rollback and promote exact Preview channel
        if: steps.mode.outputs.mode == 'release'
        id: promote
        run: |
          set -euo pipefail
          RB="gi-i64-rb-$GITHUB_RUN_ID"
          npx --yes firebase-tools@14.10.1 hosting:clone "$HOSTING_SITE:live" "$HOSTING_SITE:$RB" --project "$PROJECT_ID" --non-interactive
          echo "rollback_channel=$RB" >> "$GITHUB_OUTPUT"
          npx --yes firebase-tools@14.10.1 hosting:clone "$HOSTING_SITE:${{ steps.preview.outputs.channel_id }}" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo I64_SAME_ARTIFACT_PROMOTION=PASS

      - name: Exact LIVE readback
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/i64-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/')
          last_bad=[];last_marker=None
          for attempt in range(1,13):
              bad=[]
              stamp=str(attempt)+'-'+str(int(time.time()))
              for want,rel in rows:
                  try:
                      req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?i64live='+os.environ['EXPECTED_DIGEST'][:16]+'-'+stamp,headers={'Accept-Encoding':'identity','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=30) as rr:got=hashlib.sha256(rr.read()).hexdigest()
                  except Exception as e:
                      got='HTTP_ERROR:'+type(e).__name__
                  if got!=want:bad.append((rel,want,got))
              marker=None
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/__recovery__/build.json?i64live='+stamp,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'}),timeout=30) as rr:marker=json.loads(rr.read())
              except Exception as e:
                  marker={'error':type(e).__name__}
              marker_ok=marker.get('sourceSha')==os.environ['GITHUB_SHA'] and marker.get('buildId')==os.environ['EXPECTED_BUILD_ID'] and marker.get('gate')=='I6.4'
              if not bad and marker_ok:
                  print('I64_LIVE_READBACK='+str(len(rows)))
                  print('I64_LIVE_PROPAGATION_ATTEMPT='+str(attempt))
                  break
              last_bad=bad;last_marker=marker
              if attempt<12:time.sleep(5)
          else:
              raise SystemExit('I64_LIVE_READBACK_MISMATCH:'+json.dumps({'bad':last_bad[:3],'marker':last_marker},ensure_ascii=False))
          PY

      - name: LIVE I6.4 code-defect proof
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          I64_PROOF_STAGE: live
          I64_PROOF_FILE: ${{ runner.temp }}/i64-live-functional.json
        run: node tools/gravicentra-i6-4-code-defect-functional.mjs

      - name: Upload LIVE evidence
        if: steps.mode.outputs.mode == 'release'
        id: liveart
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-4-code-defect-live-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/i64-live-functional.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Seal technical LIVE pending Paula visual
        if: steps.mode.outputs.mode == 'release'
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          HOSTED_FILE_COUNT: ${{ steps.build.outputs.hosted_file_count }}
          HOSTED_PAYLOAD_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
          BACKEND_FILE_COUNT: ${{ steps.build.outputs.backend_file_count }}
          BACKEND_SOURCE_DIGEST: ${{ steps.build.outputs.backend_source_digest }}
          BUNDLE_FILE_COUNT: ${{ steps.build.outputs.bundle_file_count }}
          BUNDLE_DIGEST: ${{ steps.build.outputs.bundle_digest }}
          PREVIEW_CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ROLLBACK_CHANNEL_ID: ${{ steps.promote.outputs.rollback_channel }}
          ARTIFACT_ID: ${{ steps.buildart.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.buildart.outputs.artifact-digest }}
          LIVE_EVIDENCE_ARTIFACT_ID: ${{ steps.liveart.outputs.artifact-id }}
          LIVE_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.liveart.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const L=JSON.parse(fs.readFileSync(process.env.LEDGER,'utf8'));
          const live=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i64-live-functional.json','utf8'));
          if(live.status!=='PASS'||live.policies?.count!==1414||live.kpis?.multiCurrency?.status!=='PASS'||live.kpis?.renewals45?.status!=='PASS'||live.kpis?.renewals45?.canonicalMatch!==true||live.kpis?.historicalNoPortfolio?.count!==1191||live.kpis?.stableAfterRerender!==true||live.renewability?.status!=='PASS'||live.release?.assetBindingPass!==true||live.release?.buildFreshnessPass!==true||live.composition?.singlePolicyKpiOwner!==true||live.composition?.kpiStableAfterRerender!==true)throw new Error('I64_SEAL_LIVE_PROOF_INVALID');
          const old=JSON.parse(JSON.stringify(C.certifiedCandidate||{}));
          const release={
            sourceSha:process.env.GITHUB_SHA,
            sourceTree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            i3RunId:Number(process.env.GITHUB_RUN_ID),i3Conclusion:'success',runnerCommit:process.env.GITHUB_SHA,
            buildId:process.env.BUILD_ID,artifactId:Number(process.env.ARTIFACT_ID),
            artifactName:'gravicentra-i6-4-code-defect-build-'+process.env.GITHUB_RUN_ID,artifactArchiveDigest:process.env.ARTIFACT_DIGEST,
            previewChannelId:process.env.PREVIEW_CHANNEL_ID,previewUrl:process.env.PREVIEW_URL,
            hostedFileCount:Number(process.env.HOSTED_FILE_COUNT),hostedPayloadDigest:process.env.HOSTED_PAYLOAD_DIGEST,
            backendFileCount:Number(process.env.BACKEND_FILE_COUNT),backendSourceDigest:process.env.BACKEND_SOURCE_DIGEST,
            bundleFileCount:Number(process.env.BUNDLE_FILE_COUNT),bundleDigest:process.env.BUNDLE_DIGEST,
            readbackExact:true,readbackFileCount:Number(process.env.HOSTED_FILE_COUNT),
            sameFrontendArtifactPreviewToProductionRequired:true,sameBackendSourcePackageRequiredForI5:false,sourceMutatedAfterBuild:false,
            productionUrl:process.env.PRODUCTION_URL,promotedLiveRunId:Number(process.env.GITHUB_RUN_ID)
          };
          C.preI64CertifiedCandidate=C.preI64CertifiedCandidate||old;
          C.certifiedCandidate=release;
          C.i64CodeDefect={...(C.i64CodeDefect||{}),
            status:'I6_4_CODE_DEFECT_SUCCESSOR_LIVE_PASS_PENDING_PAULA_VISUAL',
            sourceSha:release.sourceSha,sourceTree:release.sourceTree,buildId:release.buildId,artifactId:release.artifactId,artifactDigest:release.artifactArchiveDigest,
            previewChannelId:release.previewChannelId,previewUrl:release.previewUrl,liveRunId:Number(process.env.GITHUB_RUN_ID),
            productionUrl:process.env.PRODUCTION_URL,productionReadbackExact:true,functionalPass:true,policyCount:live.policies.count,
            kpiSeparatedByCurrency:true,kpiAmounts:live.kpis.multiCurrency.amounts,renewals45Count:live.kpis.renewals45.count,
            historicalNoPortfolioCount:live.kpis.historicalNoPortfolio.count,renewabilityUnknownDisplay:live.renewability.display,
            rollbackChannelId:process.env.ROLLBACK_CHANNEL_ID,
            liveEvidenceArtifactId:Number(process.env.LIVE_EVIDENCE_ARTIFACT_ID),liveEvidenceArtifactDigest:process.env.LIVE_EVIDENCE_ARTIFACT_DIGEST,
            dataMutationAuthorized:false,reimportAuthorized:false
          };
          C.i64CodeFindings.status='TECHNICAL_LIVE_PASS_PENDING_PAULA_VISUAL';
          C.i6Execution.i6_4.codeFindingsStatus='TECHNICAL_LIVE_PASS_PENDING_PAULA_VISUAL';
          C.i6Execution.productMutationAuthorized=false;
          C.i6Execution.activeModuleStatus='PENDING_USER_VISUAL';
          C.nextAction='I6_4_USER_VISUAL_REFRESH_CHECK';
          C.postproductionDataUpdateControl.executionCursor='PENDING_USER_VISUAL';
          C.postproductionDataUpdateControl.nextRequiredStep='USER_VISUAL_REFRESH_CHECK';

          S.execution.cursorState='PENDING_USER_VISUAL';
          S.execution.nextRequiredStep='USER_VISUAL_REFRESH_CHECK';
          S.execution.liveVisualConfirmed=false;
          S.execution.codeDefect={...(S.execution.codeDefect||{}),status:'TECHNICAL_LIVE_PASS_PENDING_PAULA_VISUAL'};
          S.execution.codeDefect.releaseRunId=Number(process.env.GITHUB_RUN_ID);
          S.execution.codeDefect.policyCount=live.policies.count;
          S.execution.codeDefect.kpiAmounts=live.kpis.multiCurrency.amounts;
          S.execution.codeDefect.renewals45Count=live.kpis.renewals45.count;
          S.execution.codeDefect.historicalNoPortfolioCount=live.kpis.historicalNoPortfolio.count;
          S.execution.codeDefect.renewabilityUnknownDisplay=live.renewability.display;
          fs.writeFileSync(process.env.SOURCE_INTAKE,JSON.stringify(S,null,2)+'\n');
          const sourceBlob=cp.execFileSync('git',['hash-object',process.env.SOURCE_INTAKE],{encoding:'utf8'}).trim();
          C.i6Execution.activeSourceIntakeBlobSha=sourceBlob;
          C.postproductionDataUpdateControl.activeSourceIntakeBlobSha=sourceBlob;

          L.releaseBinding={
            sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,
            artifactArchiveDigest:release.artifactArchiveDigest,previewChannelId:release.previewChannelId
          };
          L.i64LiveAcceptance={
            status:'TECHNICAL_LIVE_PASS_PENDING_PAULA_VISUAL',sourceSha:release.sourceSha,buildId:release.buildId,
            artifactId:release.artifactId,liveRunId:Number(process.env.GITHUB_RUN_ID),policies:1414,
            kpis:['PRIMA_NETA_VIGENTE_BY_CURRENCY','RENEWALS_45D','HISTORICAL_NO_PORTFOLIO'],renewabilityTriState:true,unaffectedCapabilitiesPreserved:true
          };
          const cap=(L.capabilities||[]).find(x=>x.id==='POLIZAS_PRIMARY_RUNTIME');
          if(cap){
            cap.liveAcceptance=cap.liveAcceptance||{status:'LATEST_APPROVED_VERSION_LIVE_PASS',evidence:[]};
            cap.liveAcceptance.evidence=cap.liveAcceptance.evidence||[];
            cap.liveAcceptance.evidence.push({
              runId:Number(process.env.GITHUB_RUN_ID),artifactId:release.artifactId,artifactDigest:release.artifactArchiveDigest,
              evidence:'I6.4 causal successor technical LIVE proof: policy KPIs separated by currency, temporal 45-day renewals, complete historical/no-portfolio semantics, and tri-state renewability display. Paula visual acceptance pending.'
            });
          }
          fs.writeFileSync(process.env.LEDGER,JSON.stringify(L,null,2)+'\n');
          fs.writeFileSync(process.env.CONTROL,JSON.stringify(C,null,2)+'\n');
          NODE
          git config user.name "gravicentra-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$CONTROL" "$SOURCE_INTAKE" "$LEDGER"
          git commit -m "recovery(i6.4): seal policy code defects technical LIVE pending Paula visual"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          git push origin HEAD:recovery/fase-a-clean-20260831

      - name: Roll back LIVE on post-promotion failure
        if: failure() && steps.promote.outputs.promoted == 'true'
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.10.1 hosting:clone "$HOSTING_SITE:${{ steps.promote.outputs.rollback_channel }}" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive
          echo I64_AUTOMATIC_ROLLBACK=PASS


  i65-sync-code-defect-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_5_RECIBOS_CARTERA_SOURCE_INTAKE_20260918.json
      REGISTRY: artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate and causal boundary
        id: mode
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8')),d=c.i65SyncCodeDefect||{};
          const mode=d.status==='I6_5_SYNC_CODE_DEFECT_CANDIDATE_PENDING_BUILD'?'release':'noop';
          if(mode==='release'){
            if(c.nextAction!=='I6_5_SYNC_CODE_DEFECT_SUCCESSOR_RELEASE')throw new Error('I65_RELEASE_ACTION_INVALID');
            if(c.i6Execution?.productMutationAuthorized!==true)throw new Error('I65_RELEASE_PRODUCT_AUTH_MISSING');
            if(d.classification!=='CODE_DEFECT'||d.dataMutationAuthorized!==false||d.reimportAuthorized!==false)throw new Error('I65_RELEASE_BOUNDARY_INVALID');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'mode='+mode+'\n');
          console.log('I65_MODE='+mode);
          NODE

      - name: Assert LIVE equals latest certified candidate
        env:
          LIVE_BINDING_ATTEMPTS: 12
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: No-op after technical seal
        if: steps.mode.outputs.mode == 'noop'
        run: node tools/gravicentra-governance-preflight-v1.mjs --mode=i6

      - name: Source contracts
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js
          node --check orbit360-platform/modules/polizas.js
          node --check orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          node --check orbit360-platform/core/pwa.js
          node --check tools/gravicentra-i6-1-preview-package.mjs
          node --check tools/gravicentra-i6-5-sync-functional.mjs
          node --check tools/gravicentra-i6-5-sync-contract.mjs
          node tools/gravicentra-i6-5-sync-contract.mjs
          grep -Fq "backend-lab-receipts-portfolio-native-bridge-v20260801.js?v=20260918-i65" orbit360-platform/index.html
          grep -Fq "receiptsPortfolioProjection=Orbit.receiptsPortfolioProjectionV920" orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js
          grep -Fq "Orbit.receiptsPortfolioProjection" orbit360-platform/modules/polizas.js
          grep -Fq "Orbit.receiptsPortfolioProjection" orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          grep -Fq "checkBuildFreshness" orbit360-platform/core/pwa.js
          grep -Fq "bindBuildAssetsInIndex" tools/gravicentra-i6-1-preview-package.mjs

      - name: Install runtime proof dependencies
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.4.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Select existing Firebase authority
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/i65-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key') and d.get('client_email'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json';p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('I65_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL=''
          while read -r F; do
            if GOOGLE_APPLICATION_CREDENTIALS="$F" npx --yes firebase-tools@14.10.1 hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then SEL="$F"; break; fi
          done < "$ROOT/files"
          test -n "$SEL" || { echo I65_FIREBASE_AUTH_NOT_PROVEN >&2; exit 42; }
          cp "$SEL" "$RUNNER_TEMP/i65-sa.json"
          chmod 600 "$RUNNER_TEMP/i65-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/i65-sa.json" >> "$GITHUB_ENV"

      - name: Materialize immutable package once
        if: steps.mode.outputs.mode == 'release'
        id: build
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps.json"
          export APPS="$RUNNER_TEMP/apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['APPS']));a=d.get('result') if isinstance(d,dict) else None
          if not isinstance(a,list):raise SystemExit('I65_WEB_APP_LIST_INVALID')
          web=[x for x in a if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1:raise SystemExit('I65_WEB_APP_CARDINALITY:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config.json"
          export SOURCE_SHA="$GITHUB_SHA"
          export RELEASE_GATE="I6.5"
          export BUILD_PREFIX="gi-i65"
          export ENVIRONMENT_REF="firebase-hosting-preview-i6-5-code-defect"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/i65-package" "$RUNNER_TEMP/public-config.json" > "$RUNNER_TEMP/package-output.json"
          cat "$RUNNER_TEMP/package-output.json"
          BUILD_ID=$(node -e "const d=require(process.env.RUNNER_TEMP+'/package-output.json');process.stdout.write(d.buildId)")
          grep -Fq "var RUNTIME_BUILD = '$BUILD_ID';" "$RUNNER_TEMP/i65-package/bundle/site/core/pwa.js"
          grep -Fq "var BUILD = '$BUILD_ID';" "$RUNNER_TEMP/i65-package/bundle/site/sw.js"
          grep -Fq "var CACHE = 'orbit360-$BUILD_ID';" "$RUNNER_TEMP/i65-package/bundle/site/sw.js"
          export I65_FIREBASE_JSON="$RUNNER_TEMP/i65-package/bundle/firebase.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['I65_FIREBASE_JSON']))
          hs=d.get('hosting',{}).get('headers',[])
          by={x.get('source'):x.get('headers',[]) for x in hs}
          for src in ['/index.html','/product-runtime-config.js','/__recovery__/build.json','/sw.js']:
              vals=' '.join(h.get('value','') for h in by.get(src,[]))
              if 'no-store' not in vals or 'must-revalidate' not in vals: raise SystemExit('I65_FRESHNESS_HEADER_MISSING:'+src)
          PY
          node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/package-output.json','utf8'));
          const m={build_id:d.buildId,hosted_file_count:d.hostedFileCount,hosted_payload_digest:d.hostedPayloadDigest,backend_file_count:d.backendFileCount,backend_source_digest:d.backendSourceDigest,bundle_file_count:d.bundleFileCount,bundle_digest:d.bundleDigest};
          for(const [k,v] of Object.entries(m))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\n');
          NODE

      - name: Deploy exact package to isolated Preview
        if: steps.mode.outputs.mode == 'release'
        id: preview
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/i65-package/bundle"
          CHANNEL_ID="gi-i65-35376440434"
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/preview.json"
          export DEPLOY="$RUNNER_TEMP/preview.json"
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['DEPLOY']).read();prod='https://'+os.environ['HOSTING_SITE']+'.web.app'
          urls=[u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.rstrip('/')!=prod]
          if not urls:raise SystemExit('I65_PREVIEW_URL_NOT_FOUND')
          print(urls[-1])
          PY
          )
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Exact Preview readback
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/i65-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.error,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/')
          last_bad=[];last_marker=None
          def read_once(req):
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          for attempt in range(1,9):
              bad=[];stamp=str(attempt)+'-'+str(int(time.time()))
              for want,rel in rows:
                  try:
                      req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?i65='+os.environ['EXPECTED_DIGEST'][:16]+'-'+stamp,headers={'Accept-Encoding':'identity','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
                      got=hashlib.sha256(read_once(req)).hexdigest()
                  except (urllib.error.HTTPError,urllib.error.URLError) as e:
                      got='HTTP_ERROR:'+type(e).__name__
                  if got!=want:bad.append((rel,want,got))
              marker=None
              try:
                  marker=json.loads(read_once(urllib.request.Request(base+'/__recovery__/build.json?i65='+stamp,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})))
              except Exception as e:
                  marker={'error':type(e).__name__}
              marker_ok=marker.get('sourceSha')==os.environ['GITHUB_SHA'] and marker.get('buildId')==os.environ['EXPECTED_BUILD_ID'] and marker.get('gate')=='I6.5'
              if not bad and marker_ok:
                  print('I65_PREVIEW_READBACK='+str(len(rows)))
                  print('I65_PREVIEW_PROPAGATION_ATTEMPT='+str(attempt))
                  break
              last_bad=bad;last_marker=marker
              if attempt<8:time.sleep(3)
          else:
              raise SystemExit('I65_PREVIEW_READBACK_MISMATCH:'+json.dumps({'bad':last_bad[:3],'marker':last_marker},ensure_ascii=False))
          PY

      - name: Preview I6.5 code-defect proof
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          I65_PROOF_STAGE: preview
          I65_PROOF_FILE: ${{ runner.temp }}/i65-package/evidence/i65-code-defect-preview-functional.json
        run: node tools/gravicentra-i6-5-sync-functional.mjs

      - name: Upload immutable build artifact before promotion
        if: steps.mode.outputs.mode == 'release'
        id: buildart
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-code-defect-build-${{ github.run_id }}
          path: ${{ runner.temp }}/i65-package
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Bind rollback to previous certified artifact and promote exact Preview channel
        if: steps.mode.outputs.mode == 'release'
        id: promote
        run: |
          set -euo pipefail
          RB=$(node -e "const c=require('./'+process.env.CONTROL);process.stdout.write(String(c.certifiedCandidate?.previewChannelId||''))")
          test -n "$RB" || { echo I65_PREVIOUS_CERTIFIED_PREVIEW_CHANNEL_MISSING >&2; exit 43; }
          echo "rollback_channel=$RB" >> "$GITHUB_OUTPUT"
          npx --yes firebase-tools@14.10.1 hosting:channel:list --site "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/i65-channels.json"
          export RB
          node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i65-channels.json','utf8'));
          const raw=JSON.stringify(d);
          if(!raw.includes(process.env.RB))throw new Error('I65_PREVIOUS_CERTIFIED_PREVIEW_CHANNEL_NOT_FOUND');
          NODE
          npx --yes firebase-tools@14.10.1 hosting:clone "$HOSTING_SITE:${{ steps.preview.outputs.channel_id }}" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo I65_SAME_ARTIFACT_PROMOTION=PASS

      - name: Exact LIVE readback
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/i65-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/')
          last_bad=[];last_marker=None
          for attempt in range(1,13):
              bad=[]
              stamp=str(attempt)+'-'+str(int(time.time()))
              for want,rel in rows:
                  try:
                      req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?i65live='+os.environ['EXPECTED_DIGEST'][:16]+'-'+stamp,headers={'Accept-Encoding':'identity','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=30) as rr:got=hashlib.sha256(rr.read()).hexdigest()
                  except Exception as e:
                      got='HTTP_ERROR:'+type(e).__name__
                  if got!=want:bad.append((rel,want,got))
              marker=None
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/__recovery__/build.json?i65live='+stamp,headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'}),timeout=30) as rr:marker=json.loads(rr.read())
              except Exception as e:
                  marker={'error':type(e).__name__}
              marker_ok=marker.get('sourceSha')==os.environ['GITHUB_SHA'] and marker.get('buildId')==os.environ['EXPECTED_BUILD_ID'] and marker.get('gate')=='I6.5'
              if not bad and marker_ok:
                  print('I65_LIVE_READBACK='+str(len(rows)))
                  print('I65_LIVE_PROPAGATION_ATTEMPT='+str(attempt))
                  break
              last_bad=bad;last_marker=marker
              if attempt<12:time.sleep(5)
          else:
              raise SystemExit('I65_LIVE_READBACK_MISMATCH:'+json.dumps({'bad':last_bad[:3],'marker':last_marker},ensure_ascii=False))
          PY

      - name: LIVE I6.5 code-defect proof
        if: steps.mode.outputs.mode == 'release'
        env:
          TARGET_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          I65_PROOF_STAGE: live
          I65_PROOF_FILE: ${{ runner.temp }}/i65-live-functional.json
        run: node tools/gravicentra-i6-5-sync-functional.mjs

      - name: Upload LIVE evidence
        if: steps.mode.outputs.mode == 'release'
        id: liveart
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-code-defect-live-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/i65-live-functional.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Seal I6.5 synchronized read path LIVE
        if: steps.mode.outputs.mode == 'release'
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          HOSTED_FILE_COUNT: ${{ steps.build.outputs.hosted_file_count }}
          HOSTED_PAYLOAD_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
          BACKEND_FILE_COUNT: ${{ steps.build.outputs.backend_file_count }}
          BACKEND_SOURCE_DIGEST: ${{ steps.build.outputs.backend_source_digest }}
          BUNDLE_FILE_COUNT: ${{ steps.build.outputs.bundle_file_count }}
          BUNDLE_DIGEST: ${{ steps.build.outputs.bundle_digest }}
          PREVIEW_CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ROLLBACK_CHANNEL_ID: ${{ steps.promote.outputs.rollback_channel }}
          ARTIFACT_ID: ${{ steps.buildart.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.buildart.outputs.artifact-digest }}
          LIVE_EVIDENCE_ARTIFACT_ID: ${{ steps.liveart.outputs.artifact-id }}
          LIVE_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.liveart.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const L=JSON.parse(fs.readFileSync(process.env.LEDGER,'utf8'));
          const R=JSON.parse(fs.readFileSync(process.env.REGISTRY,'utf8'));
          const live=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i65-live-functional.json','utf8'));
          if(live.status!=='PASS'||live.owner?.alias!==true||live.owner?.ready!==true||live.owner?.directFirestoreListeners!==0||live.owner?.parallelCache!==false)throw new Error('I65_SEAL_OWNER_PROOF_INVALID');
          if(live.i64Sentinels?.policies!==1414||live.i64Sentinels?.renewals!==11||live.i64Sentinels?.historical!==1191)throw new Error('I65_SEAL_I64_SENTINEL_INVALID');
          if(live.writes!==0)throw new Error('I65_SEAL_WRITES_NONZERO');
          const old=JSON.parse(JSON.stringify(C.certifiedCandidate||{}));
          if(old.sourceSha!==(C.i65SyncCodeDefect||{}).previousCertifiedSourceSha)throw new Error('I65_CERTIFIED_PARENT_DRIFT');
          const release={
            sourceSha:process.env.GITHUB_SHA,
            sourceTree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            i3RunId:Number(process.env.GITHUB_RUN_ID),i3Conclusion:'success',runnerCommit:process.env.GITHUB_SHA,
            buildId:process.env.BUILD_ID,artifactId:Number(process.env.ARTIFACT_ID),
            artifactName:'gravicentra-i6-5-sync-code-defect-build-'+process.env.GITHUB_RUN_ID,artifactArchiveDigest:process.env.ARTIFACT_DIGEST,
            previewChannelId:process.env.PREVIEW_CHANNEL_ID,previewUrl:process.env.PREVIEW_URL,
            hostedFileCount:Number(process.env.HOSTED_FILE_COUNT),hostedPayloadDigest:process.env.HOSTED_PAYLOAD_DIGEST,
            backendFileCount:Number(process.env.BACKEND_FILE_COUNT),backendSourceDigest:process.env.BACKEND_SOURCE_DIGEST,
            bundleFileCount:Number(process.env.BUNDLE_FILE_COUNT),bundleDigest:process.env.BUNDLE_DIGEST,
            readbackExact:true,readbackFileCount:Number(process.env.HOSTED_FILE_COUNT),
            sameFrontendArtifactPreviewToProductionRequired:true,sameBackendSourcePackageRequiredForI5:false,sourceMutatedAfterBuild:false,
            productionUrl:process.env.PRODUCTION_URL,promotedLiveRunId:Number(process.env.GITHUB_RUN_ID)
          };
          C.preI65CertifiedCandidate=C.preI65CertifiedCandidate||old;
          C.certifiedCandidate=release;
          C.i65SyncCodeDefect={...(C.i65SyncCodeDefect||{}),
            status:'I6_5_SYNC_CODE_DEFECT_SUCCESSOR_LIVE_PASS',
            sourceSha:release.sourceSha,sourceTree:release.sourceTree,buildId:release.buildId,artifactId:release.artifactId,artifactDigest:release.artifactArchiveDigest,
            previewChannelId:release.previewChannelId,previewUrl:release.previewUrl,liveRunId:Number(process.env.GITHUB_RUN_ID),
            productionUrl:process.env.PRODUCTION_URL,productionReadbackExact:true,functionalPass:true,
            receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0),
            canonicalOwner:'receiptsPortfolioProjectionV920',singleReadOwner:true,i64SentinelsPreserved:true,
            rollbackChannelId:process.env.ROLLBACK_CHANNEL_ID,
            liveEvidenceArtifactId:Number(process.env.LIVE_EVIDENCE_ARTIFACT_ID),liveEvidenceArtifactDigest:process.env.LIVE_EVIDENCE_ARTIFACT_DIGEST,
            operationalWrites:0,dataMutationAuthorized:false,reimportAuthorized:false,cobrosWritesAuthorized:false,receiptsWritesAuthorized:false,carteraWritesAuthorized:false
          };
          C.i6Execution.productMutationAuthorized=false;
          C.i6Execution.dataMutationAuthorized=false;
          C.i6Execution.sourceDataApplyAuthorized=false;
          C.i6Execution.activeModuleStatus='SOURCE_PINNED';
          C.i6Execution.i6_5={...(C.i6Execution.i6_5||{}),status:'SOURCE_PINNED',syncCodeDefectStatus:'I6_5_SYNC_CODE_DEFECT_SUCCESSOR_LIVE_PASS',writes:0,nextRequiredStep:'LIVE_READBACK_CURRENT_STATE'};
          C.nextAction='I6_5_LIVE_READBACK_CURRENT_STATE';
          C.postproductionDataUpdateControl.executionCursor='SOURCE_PINNED';
          C.postproductionDataUpdateControl.nextRequiredStep='LIVE_READBACK_CURRENT_STATE';

          S.status='PINNED_FOR_V5_DELTA';
          S.execution.cursorState='SOURCE_PINNED';
          S.execution.nextRequiredStep='LIVE_READBACK_CURRENT_STATE';
          S.execution.writeApplied=false;S.execution.writes=0;
          S.execution.syncCodeDefect={status:'I6_5_SYNC_CODE_DEFECT_SUCCESSOR_LIVE_PASS',runId:Number(process.env.GITHUB_RUN_ID),sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,operationalWrites:0};
          fs.writeFileSync(process.env.SOURCE_INTAKE,JSON.stringify(S,null,2)+'\n');

          R.modules.RECIBOS_CARTERA.sourceState='CURRENT_SOURCE_PINNED';
          R.modules.RECIBOS_CARTERA.resumeCursor='SOURCE_PINNED';
          R.modules.RECIBOS_CARTERA.nextMaterialStep='LIVE_READBACK_CURRENT_STATE';
          R.modules.RECIBOS_CARTERA.dataWritesAuthorized=false;
          R.modules.RECIBOS_CARTERA.cobrosWritesAuthorized=false;
          R.modules.RECIBOS_CARTERA.syncCodeDefectStatus='I6_5_SYNC_CODE_DEFECT_SUCCESSOR_LIVE_PASS';
          fs.writeFileSync(process.env.REGISTRY,JSON.stringify(R,null,2)+'\n');

          const sourceBlob=cp.execFileSync('git',['hash-object',process.env.SOURCE_INTAKE],{encoding:'utf8'}).trim();
          const registryBlob=cp.execFileSync('git',['hash-object',process.env.REGISTRY],{encoding:'utf8'}).trim();
          C.i6Execution.activeSourceIntakeBlobSha=sourceBlob;
          C.postproductionDataUpdateControl.activeSourceIntakeBlobSha=sourceBlob;
          C.i6Execution.mechanismRegistryBlobSha=registryBlob;
          C.postproductionDataUpdateControl.mechanismRegistryBlobSha=registryBlob;

          L.releaseBinding={sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,artifactArchiveDigest:release.artifactArchiveDigest,previewChannelId:release.previewChannelId};
          L.i65SyncAcceptance={status:'I6_5_SYNC_CODE_DEFECT_SUCCESSOR_LIVE_PASS',sourceSha:release.sourceSha,buildId:release.buildId,artifactId:release.artifactId,liveRunId:Number(process.env.GITHUB_RUN_ID),canonicalOwner:'receiptsPortfolioProjectionV920',receiptCount:Number(live.counts?.recibosEsperados||0),portfolioCount:Number(live.counts?.carteraPrimas||0),i64SentinelsPreserved:true,operationalWrites:0};
          fs.writeFileSync(process.env.LEDGER,JSON.stringify(L,null,2)+'\n');
          fs.writeFileSync(process.env.CONTROL,JSON.stringify(C,null,2)+'\n');
          NODE
          git config user.name "gravicentra-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$CONTROL" "$SOURCE_INTAKE" "$LEDGER" "$REGISTRY"
          git commit -m "recovery(i6.5): certify synchronized receipts read path LIVE"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          git push origin HEAD:recovery/fase-a-clean-20260831

      - name: Roll back LIVE on post-promotion failure
        if: failure() && steps.promote.outputs.promoted == 'true'
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.10.1 hosting:clone "$HOSTING_SITE:${{ steps.promote.outputs.rollback_channel }}" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive
          echo I65_AUTOMATIC_ROLLBACK=PASS


  i65-hydration-code-defect-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_5_RECIBOS_CARTERA_SOURCE_INTAKE_20260918.json
      REGISTRY: artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate and causal boundary
        id: mode
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8')),d=c.i65HydrationDefect||{};
          const mode=d.status==='I6_5_HYDRATION_CODE_DEFECT_CANDIDATE_PENDING_BUILD'?'release':'noop';
          if(mode==='release'){
            if(c.nextAction!=='I6_5_HYDRATION_CODE_DEFECT_SUCCESSOR_RELEASE')throw new Error('I65_HYDRATION_RELEASE_ACTION_INVALID');
            if(c.i6Execution?.productMutationAuthorized!==true)throw new Error('I65_HYDRATION_PRODUCT_AUTH_MISSING');
            if(d.classification!=='CODE_DEFECT'||d.dataMutationAuthorized!==false||d.reimportAuthorized!==false||d.cobrosWritesAuthorized!==false)throw new Error('I65_HYDRATION_BOUNDARY_INVALID');
            if(c.postproductionDataUpdateControl?.executionCursor!=='LIVE_READBACK_PASS')throw new Error('I65_HYDRATION_CURSOR_INVALID');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'mode='+mode+'\n');
          console.log('I65_HYDRATION_MODE='+mode);
          NODE

      - name: Assert LIVE equals latest certified candidate
        env:
          LIVE_BINDING_ATTEMPTS: 12
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: No-op after technical seal
        if: steps.mode.outputs.mode == 'noop'
        run: node tools/gravicentra-governance-preflight-v1.mjs --mode=i6

      - name: Source contracts
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js
          node --check orbit360-platform/modules/polizas.js
          node --check orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          node --check orbit360-platform/core/pwa.js
          node --check tools/gravicentra-i6-1-preview-package.mjs
          node --check tools/gravicentra-i6-5-sync-functional.mjs
          node --check tools/gravicentra-i6-5-sync-contract.mjs
          node tools/gravicentra-i6-5-sync-contract.mjs
          grep -Fq "backend-lab-receipts-portfolio-native-bridge-v20260801.js?v=20260918-i65" orbit360-platform/index.html
          grep -Fq "receiptsPortfolioProjection=Orbit.receiptsPortfolioProjectionV920" orbit360-platform/core/backend-lab-receipts-portfolio-native-bridge-v20260801.js
          grep -Fq "Orbit.receiptsPortfolioProjection" orbit360-platform/modules/polizas.js
          grep -Fq "Orbit.receiptsPortfolioProjection" orbit360-platform/modules/policy-receipts-v1199-detail-guard.js
          grep -Fq "checkBuildFreshness" orbit360-platform/core/pwa.js
          grep -Fq "bindBuildAssetsInIndex" tools/gravicentra-i6-1-preview-package.mjs
          grep -Fq "fase-a-i2-20260918.4-receipts-portfolio-required" orbit360-platform/product-runtime-config.js
          grep -Fq "requiredCollections: Object.freeze(['clientes','polizas','cobros','aseguradoras','vehiculos','recibosEsperados','carteraPrimas'])" orbit360-platform/product-runtime-config.js
          grep -Fq "fase-a-i2-20260918.4-receipts-portfolio-required" tools/gravicentra-i6-1-preview-package.mjs
          grep -Fq "requiredCollections:['clientes','polizas','cobros','aseguradoras','vehiculos','recibosEsperados','carteraPrimas']" tools/gravicentra-i6-1-preview-package.mjs

      - name: Install runtime proof dependencies
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.4.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Select existing Firebase authority
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/i65-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key') and d.get('client_email'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json';p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('I65_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL=''
          while read -r F; do
            if GOOGLE_APPLICATION_CREDENTIALS="$F" npx --yes firebase-tools@14.10.1 hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then SEL="$F"; break; fi
          done < "$ROOT/files"
          test -n "$SEL" || { echo I65_FIREBASE_AUTH_NOT_PROVEN >&2; exit 42; }
          cp "$SEL" "$RUNNER_TEMP/i65-sa.json"
          chmod 600 "$RUNNER_TEMP/i65-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/i65-sa.json" >> "$GITHUB_ENV"

      - name: Materialize immutable package once
        if: steps.mode.outputs.mode == 'release'
        id: build
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps.json"
          export APPS="$RUNNER_TEMP/apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['APPS']));a=d.get('result') if isinstance(d,dict) else None
          if not isinstance(a,list):raise SystemExit('I65_WEB_APP_LIST_INVALID')
          web=[x for x in a if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1:raise SystemExit('I65_WEB_APP_CARDINALITY:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config.json"
          export SOURCE_SHA="$GITHUB_SHA"
          export RELEASE_GATE="I6.5"
          export BUILD_PREFIX="gi-i65"
          export ENVIRONMENT_REF="firebase-hosting-preview-i6-5-hydration-defect"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/i65-package" "$RUNNER_TEMP/public-config.json" > "$RUNNER_TEMP/package-output.json"
          cat "$RUNNER_TEMP/package-output.json"
          BUILD_ID=$(node -e "const d=require(process.env.RUNNER_TEMP+'/package-output.json');process.stdout.write(d.buildId)")
          grep -Fq "var RUNTIME_BUILD = '$BUILD_ID';" "$RUNNER_TEMP/i65-package/bundle/site/core/pwa.js"
          grep -Fq "var BUILD = '$BUILD_ID';" "$RUNNER_TEMP/i65-package/bundle/site/sw.js"
          grep -Fq "var CACHE = 'orbit360-$BUILD_ID';" "$RUNNER_TEMP/i65-package/bundle/site/sw.js"
          export I65_FIREBASE_JSON="$RUNNER_TEMP/i65-package/bundle/firebase.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['I65_FIREBASE_JSON']))
          hs=d.get('hosting',{}).get('headers',[])
          by={x.get('source'):x.get('headers',[]) for x in hs}
          for src in ['/index.html','/product-runtime-config.js','/__recovery__/build.json','/sw.js']:
              vals=' '.join(h.get('value','') for h in by.get(src,[]))
              if 'no-store' not in vals or 'must-revalidate' not in vals: raise SystemExit('I65_FRESHNESS_HEADER_MISSING:'+src)
          PY
          node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/package-output.json','utf8'));
          const m={build_id:d.buildId,hosted_file_count:d.hostedFileCount,hosted_payload_digest:d.hostedPayloadDigest,backend_file_count:d.backendFileCount,backend_source_digest:d.backendSourceDigest,bundle_file_count:d.bundleFileCount,bundle_digest:d.bundleDigest};
          for(const [k,v] of Object.entries(m))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\n');
          NODE

      - name: Deploy exact package to isolated Preview
        if: steps.mode.outputs.mode == 'release'
        id: preview
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/i65-package/bundle"
          npx --yes firebase-tools@14.10.1 hosting:channel:list --site "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/i65-preview-channels.json"
          export CHANNELS_JSON="$RUNNER_TEMP/i65-preview-channels.json"
          node - <<'NODE' > "$RUNNER_TEMP/i65-preview-channel-candidates.txt"
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.CHANNELS_JSON,'utf8')),ids=new Set();
          function walk(v,k){
            if(v==null)return;
            if(typeof v==='string'){
              const m=v.match(/\/channels\/([^/]+)$/);if(m)ids.add(m[1]);
              if((k==='channelId'||k==='id')&&/^[a-z0-9-]+$/i.test(v)&&v!=='live')ids.add(v);
              return;
            }
            if(Array.isArray(v)){for(const x of v)walk(x,'');return;}
            if(typeof v==='object')for(const [kk,x] of Object.entries(v))walk(x,kk);
          }
          walk(d,'');
          for(const id of [...ids].filter(x=>x&&x!=='live').sort())console.log(id);
          NODE
          CHANNEL_ID=''
          while IFS= read -r CANDIDATE; do
            test -n "$CANDIDATE" || continue
            if ! git -C "$GITHUB_WORKSPACE" grep -F -q -- "$CANDIDATE"; then
              CHANNEL_ID="$CANDIDATE"
              break
            fi
          done < "$RUNNER_TEMP/i65-preview-channel-candidates.txt"
          test -n "$CHANNEL_ID" || { echo I65_NO_UNREFERENCED_PREVIEW_CHANNEL_AVAILABLE >&2; cat "$RUNNER_TEMP/i65-preview-channel-candidates.txt" >&2; exit 44; }
          echo "I65_REUSING_UNREFERENCED_PREVIEW_CHANNEL=$CHANNEL_ID"
          set +e
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/preview.json" 2> "$RUNNER_TEMP/preview.err"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
