name: Gravicentra I6 Post-Salida
# I6.3 Clientes authoritative DATA_UPDATE readback — Evergreen V5.
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
      - 'artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json'
      - 'artifacts/orbit360-recovery/release-control/I6_3_CLIENTES_SOURCE_INTAKE_20260918.json'
      - 'tools/gravicentra-i6-control-plane-guard-v1.mjs'
      - '.github/workflows/gravicentra-recovery-i6-postsalida.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: gravicentra-i6-postsalida-${{ github.ref }}
  cancel-in-progress: false
env:
  PROJECT_ID: ays-orbit-360-lab
  TENANT_ID: alianzas-soluciones
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  REGISTRY: artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json
  SOURCE_INTAKE: artifacts/orbit360-recovery/release-control/I6_3_CLIENTES_SOURCE_INTAKE_20260918.json
  I63_PUBLIC_KEY_B64: 
jobs:
  i63-live-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical I6.3 authority and source binding
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const R=JSON.parse(fs.readFileSync(process.env.REGISTRY,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8'));
          const need=(x,c)=>{if(!x)throw new Error(c)};
          need(C.status==='PRODUCTION_ACCEPTED','I63_PRODUCTION_BASELINE_NOT_ACCEPTED');
          need(C.gateState?.gates?.I6?.status==='I6_3_DATA_UPDATE_V5_ACTIVE','I63_GATE_NOT_ACTIVE');
          need(C.gateState?.gates?.I6?.activeSubgate==='I6.3','I63_SUBGATE_NOT_ACTIVE');
          need(C.i6Execution?.dataMutationAuthorized===false,'I63_READBACK_DATA_MUTATION_MUST_BE_FALSE');
          need(C.i6Execution?.sourceDataApplyAuthorized===false,'I63_READBACK_SOURCE_APPLY_MUST_BE_FALSE');
          need(C.i6Execution?.productMutationAuthorized===false,'I63_PRODUCT_MUTATION_MUST_BE_FALSE');
          need(S.status==='PINNED_FOR_V5_DELTA'&&S.module==='CLIENTES','I63_SOURCE_NOT_PINNED');
          need(S.source?.sha256==='4f0a1307605ad5dcc947355dbbc98a50b510358e5f6a9835b75d02e45f5a8c7c','I63_SOURCE_SHA_MISMATCH');
          need(R.modules?.CLIENTES?.sourceState==='CURRENT_SOURCE_PINNED','I63_REGISTRY_SOURCE_NOT_PINNED');
          console.log('I63_AUTHORITY=PASS');
          console.log('I6_3_WRITES_EXECUTED=0');
          NODE
      - name: Install LIVE readback dependency
        run: npm install --no-save --package-lock=false firebase-admin@13.10.0 >/dev/null
      - name: Encrypted exact LIVE clientes readback with zero writes
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/i6-3-live-readback"
          mkdir -p "$OUT"
          export OUT
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const need=(x,c)=>{if(!x)throw new Error(c)};
          const parseSA=()=>{for(const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']){try{const x=JSON.parse(process.env[k]||'');if(x?.type==='service_account'&&x?.project_id===process.env.PROJECT_ID&&x?.client_email&&x?.private_key)return x;}catch{}}throw new Error('I63_EXISTING_SERVICE_ACCOUNT_NOT_AVAILABLE');};
          const canon=v=>{if(v===undefined)return null;if(v===null)return null;if(typeof v!=='object')return v;if(typeof v.toDate==='function'){try{return {$timestamp:v.toDate().toISOString()};}catch{}}if(typeof v.path==='string'&&v.firestore)return {$ref:v.path};if(Number.isFinite(v.latitude)&&Number.isFinite(v.longitude))return {$geo:[v.latitude,v.longitude]};if(Array.isArray(v))return v.map(canon);const o={};for(const k of Object.keys(v).sort())o[k]=canon(v[k]);return o;};
          const encrypt=(plain,pem)=>{const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);const ciphertext=Buffer.concat([cipher.update(plain),cipher.final()]),tag=cipher.getAuthTag(),wrappedKey=crypto.publicEncrypt({key:pem,oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},key);return {schema:'GRAVICENTRA_I6_3_ENCRYPTED_READBACK_V1',algorithm:'AES-256-GCM+RSA-OAEP-SHA256',wrappedKey:wrappedKey.toString('base64'),iv:iv.toString('base64'),tag:tag.toString('base64'),ciphertext:ciphertext.toString('base64')};};
          (async()=>{const app=initializeApp({credential:cert(parseSA()),projectId:process.env.PROJECT_ID},'gravicentra-i63-readback');try{const db=getFirestore(app),ref=db.collection('tenants').doc(process.env.TENANT_ID).collection('data').doc('clientes').collection('items'),snap=await ref.get(),docs=snap.docs.map(d=>({id:d.id,data:canon(d.data()||{})})).sort((a,b)=>a.id.localeCompare(b.id));need(docs.length>0,'I63_LIVE_READBACK_EMPTY');const exact={schema:'GRAVICENTRA_I6_3_EXACT_LIVE_READBACK_V1',projectId:process.env.PROJECT_ID,tenantId:process.env.TENANT_ID,collectionPath:`tenants/${process.env.TENANT_ID}/data/clientes/items`,capturedAt:new Date().toISOString(),writesExecuted:0,documents:docs};const plain=Buffer.from(JSON.stringify(exact),'utf8'),pem=Buffer.from(process.env.I63_PUBLIC_KEY_B64,'base64').toString('utf8'),env=encrypt(plain,pem),enc=process.env.OUT+'/i6-3-live-readback.encrypted.json';fs.writeFileSync(enc,JSON.stringify(env,null,2)+'\n');const S=JSON.parse(fs.readFileSync(process.env.SOURCE_INTAKE,'utf8')),summary={schema:'GRAVICENTRA_I6_3_LIVE_READBACK_SUMMARY_V1',status:'READBACK_PASS',gate:'I6.3',module:'CLIENTES',sourceSha256:S.source.sha256,collectionPath:exact.collectionPath,documentCount:docs.length,writesExecuted:0,plaintextOperationalValuesInEvidence:false,exactReadbackEncrypted:true,plaintextSha256:crypto.createHash('sha256').update(plain).digest('hex'),encryptedFileSha256:crypto.createHash('sha256').update(fs.readFileSync(enc)).digest('hex')};fs.writeFileSync(process.env.OUT+'/i6-3-live-readback-summary.json',JSON.stringify(summary,null,2)+'\n');console.log('I63_LIVE_READBACK=PASS');console.log('I63_DOCUMENT_COUNT='+docs.length);console.log('I6_3_WRITES_EXECUTED=0');}finally{await deleteApp(app).catch(()=>{});}})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Verify readback evidence is encrypted and zero-write
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/i6-3-live-readback/i6-3-live-readback-summary.json"
          test "$(jq -r .status "$E")" = READBACK_PASS
          test "$(jq -r .writesExecuted "$E")" = 0
          test "$(jq -r .plaintextOperationalValuesInEvidence "$E")" = false
          test "$(jq -r .sourceSha256 "$E")" = "$(jq -r .source.sha256 "$SOURCE_INTAKE")"
          echo I63_READBACK_INTEGRITY=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-3-live-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/i6-3-live-readback
          if-no-files-found: error
          retention-days: 7
