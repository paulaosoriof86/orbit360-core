  i65-b2-synthetic-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      B2_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B2_EXECUTION_LOCK_20260920.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate timed-out B2 synthetic cleanup
        id: mode
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync(process.env.CONTROL)),b=JSON.parse(fs.readFileSync(process.env.B2_LOCK)),q=b.orphanSyntheticCleanup||{},x=q.boundaries||{};
          const run=c.i65ForensicRemediationPlan?.currentBlock==='B2'&&q.status==='AUTHORIZED_PENDING_RUN'&&Number(q.orphanRunId)>0;
          if(run&&(x.deleteOnlyMatchingSyntheticRows!==true||x.businessDataMutationAuthorized!==false||x.reimportAuthorized!==false||x.livePromotionAuthorized!==false||x.emailSendAuthorized!==false))throw Error('B2_CLEANUP_BOUNDARY_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(run?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'orphan='+(q.orphanRunId||'')+'\n');
          NODE
      - name: Assert LIVE unchanged before cleanup
        if: steps.mode.outputs.run == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs
      - name: Install cleanup dependency
        if: steps.mode.outputs.run == 'true'
        run: npm install --no-save --package-lock=false firebase-admin@13.4.0 >/dev/null
      - name: Execute exact-marker synthetic cleanup
        id: cleanup
        if: steps.mode.outputs.run == 'true'
        env:
          B2_ORPHAN_RUN: ${{ steps.mode.outputs.orphan }}
          B2_CLEANUP_OUT: ${{ runner.temp }}/b2-synthetic-cleanup.json
        run: node tools/gravicentra-i6-5-b2-synthetic-cleanup.mjs
      - name: Upload cleanup evidence
        if: always() && steps.mode.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-b2-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/b2-synthetic-cleanup.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Freeze cleanup verification
        if: steps.mode.outputs.run == 'true' && steps.cleanup.conclusion == 'success'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cpPath=process.env.CONTROL,lockPath=process.env.B2_LOCK,ev=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/b2-synthetic-cleanup.json')),c=JSON.parse(fs.readFileSync(cpPath)),b=JSON.parse(fs.readFileSync(lockPath));
          if(ev.status!=='PASS'||ev.after?.clients!==0||ev.after?.policies!==0)throw Error('B2_CLEANUP_EVIDENCE_INVALID');
          b.orphanSyntheticCleanup={...(b.orphanSyntheticCleanup||{}),status:'PASS',runId:Number(process.env.GITHUB_RUN_ID),before:ev.before,deleted:ev.deleted,after:ev.after};
          fs.writeFileSync(lockPath,JSON.stringify(b,null,2)+'\n');
          c.i65ForensicRemediationPlan.b2={...(c.i65ForensicRemediationPlan.b2||{}),orphanSyntheticCleanup:'PASS',orphanSyntheticCleanupRunId:Number(process.env.GITHUB_RUN_ID)};
          fs.writeFileSync(cpPath,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$B2_LOCK"
          BLOB=$(git hash-object "$B2_LOCK");export BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.CONTROL,c=JSON.parse(fs.readFileSync(p));c.i65ForensicRemediationPlan.b2ExecutionLockBlobSha=process.env.BLOB;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          git add "$CONTROL"
          git config user.name gravicentra-recovery-bot
          git config user.email gravicentra-recovery-bot@users.noreply.github.com
          git commit -m "freeze(i6.5): B2 synthetic cleanup verified"
          git push origin "HEAD:$GITHUB_REF_NAME"

  i65-b1-r10-rootcause-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      B1_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B1_EXECUTION_LOCK_20260919.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate B1 R10 read-only root-cause diagnostic
        id: gate
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('fs'),c=JSON.parse(fs.readFileSync(process.env.CONTROL)),b=JSON.parse(fs.readFileSync(process.env.B1_LOCK)),d=b.r10ReadOnlyDiagnostic||{};
          const run=c.i65ForensicRemediationPlan?.currentBlock==='B1'&&c.nextAction==='I6_5_FORENSIC_REMEDIATION_B1_R3_ROOT_CAUSE'&&b.status==='VISUAL_REJECTED_R3_PERFORMANCE_AND_UNIVERSE_ROOT_CAUSE_REQUIRED'&&d.status==='AUTHORIZED_PENDING_RUN';
          if(run&&(d.boundaries?.readOnly!==true||d.boundaries?.dataWrites!==0||d.boundaries?.productMutationAuthorized!==false||d.boundaries?.reimportAuthorized!==false||d.boundaries?.livePromotionAuthorized!==false))throw Error('B1_R10_BOUNDARY_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(run?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'target='+(d.exactPreview?.url||'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'source='+(d.exactPreview?.sourceSha||'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build='+(d.exactPreview?.buildId||'')+'\n');
          NODE
      - name: Assert LIVE unchanged
        if: steps.gate.outputs.run == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs
      - name: Validate exact B1 Preview marker
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.gate.outputs.target }}
          EXPECTED_SOURCE: ${{ steps.gate.outputs.source }}
          EXPECTED_BUILD: ${{ steps.gate.outputs.build }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,time
          u=os.environ['TARGET_URL'].rstrip('/')+'/__recovery__/build.json?r10='+str(time.time())
          with urllib.request.urlopen(u,timeout=30) as z:d=json.loads(z.read())
          if d.get('sourceSha')!=os.environ['EXPECTED_SOURCE'] or d.get('buildId')!=os.environ['EXPECTED_BUILD']:raise SystemExit('B1_R10_PREVIEW_DRIFT:'+str(d))
          print('B1_R10_PREVIEW_MARKER=PASS')
          PY
      - name: Install read-only diagnostic dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Execute B1 R10 read-only diagnostic
        id: diag
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.gate.outputs.target }}
          B1_R10_OUT: ${{ runner.temp }}/b1-r10-rootcause-readonly.json
        run: node tools/gravicentra-i6-5-b1-r10-rootcause-readonly.mjs | tee "${{ runner.temp }}/b1-r10-rootcause-readonly.log"
      - name: Upload B1 R10 evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-b1-r10-rootcause-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b1-r10-rootcause-readonly.json
            ${{ runner.temp }}/b1-r10-rootcause-readonly.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

