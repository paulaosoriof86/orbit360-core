name: cotcomp-source-only-qa

on:
  push:
    branches:
      - ays/cotcomp-public-bridge-s47-20260929

permissions:
  contents: read

jobs:
  source-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Full CotComp syntax check
        working-directory: functions
        run: npm run check

      - name: Full CotComp contract suite
        working-directory: functions
        run: npm run test:cotcomp
