name: cotcomp-source-only-qa

on:
  push:
    branches:
      - ays/cotcomp-public-bridge-s47-20260929

permissions:
  contents: read

jobs:
  source-only-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: functions
        run: |
          node --check cotcomp-contracts.js
          node --check cotcomp-validator.js
          node --check cotcomp-proposal-contracts.js
          node --check cotcomp-public-bridge.js
          node --check cotcomp-public-bridge.test.js
          node --check cotcomp-transport-contract.js
          node --check cotcomp-transport-contract.test.js
          node --check cotcomp-gateway-harness.js
          node --check cotcomp-gateway-harness.test.js
      - name: Contract tests
        working-directory: functions
        run: |
          node --test \
            cotcomp-validator.test.js \
            cotcomp-proposal-contracts.test.js \
            cotcomp-public-bridge.test.js \
            cotcomp-transport-contract.test.js \
            cotcomp-gateway-harness.test.js
