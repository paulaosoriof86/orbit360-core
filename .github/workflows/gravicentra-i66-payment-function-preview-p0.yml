# I6.6 invoice date: exact synthetic-only payment source to existing Preview callable.
# No LIVE Hosting/Functions, real client writes, Rules/Auth or new Firebase.
name: Gravicentra I6.6 Payment Function Exact Preview P0
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-payment-function-preview-p0.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-payment-function-preview-p0
  cancel-in-progress: false
jobs:
  scoped-preview:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROJECT_ID: ays-orbit-360-lab
      SOURCE_SHA: 586401bfbe1a80cfef2820982f432743af36b108
      ARTIFACT_RUN: '43463160506'
      ARTIFACT_ID: '14057935092'
      ARTIFACT_DIGEST: sha256:1621f236b9d1b9e49ea42fc53e338a695d5872080361ada2a84183fa7d52207f
      POLICY_UAT_RUN: '43465087494'
      ADVISOR_CENSUS_RUN: '43465811712'
      PREVIEW_URL: https://ays-orbit-360-lab--gi-i66-rc-42868854629-abj14q6n.web.app
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard current owner approval and immutable SHA, artifact, QA, no LIVE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-6-payment-replay-ledger-guard.test.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{execFileSync}=require('node:child_process');
          (async()=>{
            const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json'));
            assert.equal(c.status,'PAYMENT_INVOICE_BACKEND_PREVIEW_AUTHORIZED');
            assert.equal(c.backendFunctionPreviewOnly,true);
            assert.equal(c.forbidBackendFunctionDeploy,false);
            assert.equal(c.forbidBackendLiveFunctionDeploy,true);
            assert.equal(c.forbidFirestoreRulesDataAuthWrites,true);
            assert.equal(c.livePromotionAuthorized,false);
            assert.equal(c.previewApproved,false);
            const gate=c.i66PaymentInvoicePreviewRelease20261113||{};
            assert.equal(gate.status,'SIGNED_POLICY_AND_CLIENT360_PREVIEW_PASS_PAYMENT_BACKEND_PREVIEW_ONLY');
            assert.equal(gate.singleAllowedFunction,'orbit360CobrosReconciliationCommandPreview');
            assert.equal(gate.singleAllowedRegion,'us-central1');
            assert.equal(gate.syntheticOnly,true);
            assert.equal(gate.forbidLiveFunctionOrHostingDeployment,true);
            assert.equal(gate.forbidRealFinancialWrites,true);
            assert.equal(gate.requireLiveFunctionRevisionBeforeAfterIdentity,true);
            assert.equal(gate.requireExactBackendBlobInArtifact,true);
            for(const [k,v] of [['approvedSourceSha',process.env.SOURCE_SHA],['immutableHostingPreviewBuildRunId',Number(process.env.ARTIFACT_RUN)],['immutableArtifactId',Number(process.env.ARTIFACT_ID)],['immutableArtifactDigest',process.env.ARTIFACT_DIGEST],['existingHostingPreviewUrl',process.env.PREVIEW_URL],['signedTwoRolesPolicyClient360UatRunId',Number(process.env.POLICY_UAT_RUN)]])assert.equal(gate[k],v,k);
            const h={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'GI-I66-Payment-Preview'};
            const base='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const [q,g,b,a]=await Promise.all([
              fetch(base+'runs/'+process.env.POLICY_UAT_RUN,{headers:h}).then(r=>r.json()),
              fetch(base+'runs/'+process.env.ADVISOR_CENSUS_RUN,{headers:h}).then(r=>r.json()),
              fetch(base+'runs/'+process.env.ARTIFACT_RUN,{headers:h}).then(r=>r.json()),
              fetch(base+'artifacts/'+process.env.ARTIFACT_ID,{headers:h}).then(r=>r.json())
            ]);
            for(const [kind,r] of [['POLICY_UAT',q],['ADVISOR_CENSUS',g],['BUILD',b]]){assert.equal(r.conclusion,'success',kind);}
            for(const [kind,r] of [['POLICY_UAT',q],['ADVISOR_CENSUS',g]]){
              assert.match(String(r.head_sha||''),/^[0-9a-f]{40}$/);
              const drift=execFileSync('git',['diff','--name-only',process.env.SOURCE_SHA,r.head_sha,'--','functions/','orbit360-platform/'],{encoding:'utf8'}).trim();
              assert.equal(drift,'',kind+' product source drift');
            }
            assert.equal(b.head_sha,process.env.SOURCE_SHA,'BUILD source');
            assert.equal(a.digest,process.env.ARTIFACT_DIGEST);
            assert.equal(a.workflow_run.id,Number(process.env.ARTIFACT_RUN));
            assert.equal(a.expired,false);
            console.log('I66_CARLOS_PAYMENT_PREVIEW_OWNER_CURRENT_ARTIFACT_AND_QA_PIN_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 14057935092
          run-id: 43463160506
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/payment-packet-download
      - name: Verify one original immutable TAR, backend source and published Hosting Preview marker
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/payment-packet-download"
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz | wc -l)" -eq 1
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 | wc -l)" -eq 1
          TAR=$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz -print -quit)
          SUM=$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 -print -quit)
          test "$(sha256sum "$TAR" | awk '{print $1}')" = "$(awk '{print $1}' "$SUM")"
          mkdir -p "$RUNNER_TEMP/payment-packet"
          tar -xzf "$TAR" -C "$RUNNER_TEMP/payment-packet" --no-same-owner
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const b=process.env.RUNNER_TEMP+'/payment-packet/bundle/';
          const m=JSON.parse(fs.readFileSync(b+'site/__recovery__/build.json'));
          assert.equal(m.sourceSha,process.env.SOURCE_SHA);assert.equal(m.gate,'I6.6');
          const packed=fs.readFileSync(b+'backend/cobros-reconciliation-domain.js');
          const source=execFileSync('git',['show',process.env.SOURCE_SHA+':functions/cobros-reconciliation-domain.js']);
          assert(packed.equals(source),'payment function source bytes drift');
          assert(packed.includes('PAYMENT_ALREADY_APPLIED')&&packed.includes('PAYMENT_ACTIVE_PORTFOLIO_REQUIRED')&&packed.includes('PAYMENT_COUNTRY_OUTSIDE_MEMBERSHIP'));
          assert(packed.includes('invoiceDate')&&packed.includes('confirmedReceipt.invoiceDate'),'invoice date persisted/readback marker missing');
          for(const marker of ['PREVIEW_PAYMENT_SYNTHETIC_RELATION_REQUIRED','previewReconciliationRequests','previewReconciliationEvents'])assert(packed.includes(marker));
          assert(fs.existsSync(b+'backend/index.js')&&fs.existsSync(b+'backend/package-lock.json'));
          console.log('I66_PAYMENT_PREVIEW_EXACT_BACKEND_MARKER_AND_THREE_GUARDS_PASS');
          NODE
          curl -fsSL --max-time 25 "$PREVIEW_URL/__recovery__/build.json" -o "$RUNNER_TEMP/payment-preview-marker.json"
          cmp "$RUNNER_TEMP/payment-packet/bundle/site/__recovery__/build.json" "$RUNNER_TEMP/payment-preview-marker.json"
          echo 'I66_PAYMENT_HOSTING_PREVIEW_SAME_SOURCE_MARKER_PASS'
      - name: Select only configured Firebase LAB authority and CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payment-preview-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'payment-preview-auth';found=[]
          for i,key in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try: a=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError):continue
              if a.get('type')=='service_account' and a.get('project_id')==os.environ['PROJECT_ID'] and a.get('private_key'):
                  p=root/f'{i}.json';p.write_text(json.dumps(a));p.chmod(0o600);found.append(str(p))
          if not found:raise SystemExit('I66_PAYMENT_PREVIEW_CREDENTIAL_NOT_CONFIGURED')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/payment-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/payment-cli"
          CLI="$RUNNER_TEMP/payment-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          SEL=''
          while IFS= read -r c;do
            if GOOGLE_APPLICATION_CREDENTIALS="$c" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/payment-functions-before.json" 2>/dev/null;then SEL="$c";break;fi
          done < "$RUNNER_TEMP/payment-preview-auth/candidates"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/payment-preview-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/payment-preview-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/payment-preview-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Capture read-only LIVE Function revision and both LIVE Hosting fingerprints
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          gcloud functions describe orbit360CobrosReconciliationCommand --gen2 --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-fn-before.json"
          node - <<'NODE'
          const fs=require('node:fs'),r=process.env.RUNNER_TEMP,o=JSON.parse(fs.readFileSync(r+'/payment-live-fn-before.json'));
          const full=String(o.serviceConfig?.service||''),name=full.split('/').pop();
          if(!full.includes('/locations/us-central1/services/')||!/^[a-z][a-z0-9-]+$/.test(name))throw Error('LIVE_PAYMENT_SERVICE_RESOLUTION_HOLD');
          fs.writeFileSync(r+'/payment-live-service-name',name);
          NODE
          SERVICE=$(< "$RUNNER_TEMP/payment-live-service-name")
          gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-run-before.json"
          curl -fsSL --max-time 25 'https://ays-orbit-360-lab.web.app/' | sha256sum > "$RUNNER_TEMP/payment-live-hosting-before.sha"
          curl -fsSL --max-time 25 'https://app.aysseguros.com/' | sha256sum > "$RUNNER_TEMP/payment-live-app-before.sha"
          echo 'I66_PAYMENT_LIVE_FUNCTION_AND_TWO_HOSTS_READONLY_BASELINE_PASS'
      - name: Deploy exact backend artifact to ONLY guarded Preview callable; no LIVE
        run: |
          set -euo pipefail
          FROOT="$RUNNER_TEMP/payment-functions";mkdir -p "$FROOT"
          cp -a "$RUNNER_TEMP/payment-packet/bundle/backend" "$FROOT/backend"
          (cd "$FROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"backend"}}\n' > "$FROOT/firebase.json"
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360CobrosReconciliationCommandPreview --config "$FROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          gcloud functions describe orbit360CobrosReconciliationCommandPreview --gen2 --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-preview-fn-after.json"
          node - <<'NODE'
          const fs=require('node:fs'),o=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/payment-preview-fn-after.json'));
          if(!['ACTIVE','READY'].includes(String(o.state||'').toUpperCase())||!String(o.serviceConfig?.uri||'').startsWith('https://'))throw Error('I66_PAYMENT_PREVIEW_FUNCTION_NOT_ACTIVE');
          console.log('I66_PAYMENT_PREVIEW_FUNCTION_ACTIVE_NO_CLIENT_WRITES');
          NODE
          STATUS=$(curl -sS --max-time 25 -o "$RUNNER_TEMP/payment-preview-unauth.json" -w '%{http_code}' -X POST 'https://us-central1-ays-orbit-360-lab.cloudfunctions.net/orbit360CobrosReconciliationCommandPreview' -H 'Content-Type: application/json' --data '{"data":{"tenantId":"alianzas-soluciones","operation":"apply_payment","payload":{"receiptId":"b3005qa_probe"}}}')
          test "$STATUS" = 401
          grep -q 'UNAUTHENTICATED' "$RUNNER_TEMP/payment-preview-unauth.json"
          echo 'I66_PAYMENT_PREVIEW_FUNCTION_AUTH_GUARD_401_PASS'
      - name: Verify LIVE backend revision and both host fingerprints are unchanged
        run: |
          set -euo pipefail
          SERVICE=$(< "$RUNNER_TEMP/payment-live-service-name")
          gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-run-after.json"
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),r=process.env.RUNNER_TEMP;
          const before=JSON.parse(fs.readFileSync(r+'/payment-live-run-before.json'));
          const after=JSON.parse(fs.readFileSync(r+'/payment-live-run-after.json'));
          const traffic=a=>(a.status?.traffic||a.traffic||[]).map(t=>({revision:t.revisionName||t.revision,percent:t.percent})).sort((x,y)=>String(x.revision).localeCompare(String(y.revision)));
          assert.deepEqual(traffic(after),traffic(before),'LIVE_PAYMENT_FUNCTION_TRAFFIC_DRIFT');
          console.log('I66_PAYMENT_LIVE_FUNCTION_REVISION_TRAFFIC_UNCHANGED_PASS');
          NODE
          curl -fsSL --max-time 25 'https://ays-orbit-360-lab.web.app/' | sha256sum > "$RUNNER_TEMP/payment-live-hosting-after.sha"
          curl -fsSL --max-time 25 'https://app.aysseguros.com/' | sha256sum > "$RUNNER_TEMP/payment-live-app-after.sha"
          cmp "$RUNNER_TEMP/payment-live-hosting-before.sha" "$RUNNER_TEMP/payment-live-hosting-after.sha"
          cmp "$RUNNER_TEMP/payment-live-app-before.sha" "$RUNNER_TEMP/payment-live-app-after.sha"
          echo 'I66_PAYMENT_BOTH_LIVE_HOSTS_UNCHANGED_PASS'
          echo 'I66_PAYMENT_CLIENT_BILLING_WRITES=0'
      - name: Install authenticated synthetic Preview UAT dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Real signed Carlos and Paula apply and reconcile synthetic receipts without LIVE writes
        env:
          I66_PREVIEW_ORIGIN: ${{ env.PREVIEW_URL }}
        run: node tools/gravicentra-i6-6-carlos-payment-signed-synthetic-preview-uat.cjs
      - name: Retain scoped Preview proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-payment-preview-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/payment-preview-fn-after.json
            ${{ runner.temp }}/payment-live-fn-before.json
            ${{ runner.temp }}/payment-live-run-before.json
            ${{ runner.temp }}/payment-live-run-after.json
          if-no-files-found: warn
          retention-days: 21
