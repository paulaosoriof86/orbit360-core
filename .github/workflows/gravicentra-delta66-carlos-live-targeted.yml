# I6.6 Carlos P0: exact source for both operational LIVE writers and Hosting,
# preserving payment LIVE backend, with prior function/Hosting rollback.
name: Gravicentra I6.6 Carlos Ops Policies Exact LIVE Transport
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-delta66-carlos-live-targeted.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-carlos-prod-targeted
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT_ID: ays-orbit-360-lab
      SITE: ays-orbit-360-lab
      I66_CARLOS_SOURCE_SHA: 1dd675ed59ac51fd122915ca8056f85f82fa12d6
      I66_CARLOS_ARTIFACT_ID: '13984026378'
      I66_CARLOS_ARTIFACT_DIGEST: sha256:f51907a610ca467b7bf840652a3f3e9983a7f9913f5d279e01fa34a539123dbc
      I66_CARLOS_PREVIEW_CHANNEL: gi-i66-rc-43305281214
      I66_CARLOS_PREVIEW_URL: https://ays-orbit-360-lab--gi-i66-rc-43305281214-hr641g40.web.app
      I66_CARLOS_PREVIEW_FUNCTION_RUN: '43300939205'
      I66_CARLOS_EMULATOR_RUN: '43305281266'
      I66_CARLOS_SIGNED_OPS_UAT: '43301759098'
      I66_CARLOS_SIGNED_PAYMENT_UAT: '43306217923'
      I66_CARLOS_PAYMENT_LIVE_RUN: '43307238568'
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify one exact package and signed real Carlos/Paula Preview and payment LIVE prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git cat-file -e "$I66_CARLOS_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$I66_CARLOS_SOURCE_SHA" HEAD
          test -z "$(git diff --name-only "$I66_CARLOS_SOURCE_SHA" HEAD -- orbit360-platform functions firebase.json firestore.rules storage.rules)"
          node --check tools/gravicentra-i6-6-carlos-live-exact-transport.mjs
          node tools/gravicentra-i6-6-carlos-ops-tasks-transversal.test.cjs
          node tools/gravicentra-i6-6-carlos-preview-synthetic-write-gate.test.cjs
          node tools/gravicentra-i6-6-carlos-payment-preview-synthetic-gate.test.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          (async()=>{
            const fs=require('node:fs');
            const control=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json'));
            const gate=control.carlosOpsLiveAuthorization20261112||{};
            assert.equal(gate.status,'EXACT_TWO_WRITERS_AND_HOSTING_AUTHORIZED_AFTER_SIGNED_PREVIEW');
            assert.equal(gate.sourceSha,process.env.I66_CARLOS_SOURCE_SHA);
            assert.equal(gate.artifactId,Number(process.env.I66_CARLOS_ARTIFACT_ID));
            assert.equal(gate.paymentLiveRunId,Number(process.env.I66_CARLOS_PAYMENT_LIVE_RUN));
            assert.equal(gate.signedOpsPreviewRunId,Number(process.env.I66_CARLOS_SIGNED_OPS_UAT));
            assert.equal(gate.signedPaymentPreviewRunId,Number(process.env.I66_CARLOS_SIGNED_PAYMENT_UAT));
            assert.equal(gate.noOtherFunctionRulesAuthOrFinancialWrites,true);
            assert.equal(gate.automaticRollbackIfAnyBackendOrDualOriginReadbackFails,true);
            assert.equal(JSON.stringify(gate.targetLiveFunctions),JSON.stringify(['orbit360ProductOperationalCommand','orbit360OpsLeadsCommand']));
            assert.equal(gate.targetRegion,'us-central1');
            assert.equal(gate.artifactDigest,process.env.I66_CARLOS_ARTIFACT_DIGEST);
            assert.equal(gate.previewChannel,process.env.I66_CARLOS_PREVIEW_CHANNEL);
            assert.equal(control.status,'CARLOS_OPS_HOSTING_LIVE_PROMOTION_AUTHORIZED');
            assert.equal(control.forbidFirestoreRulesDataAuthWrites,true);
            const H={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'GI-I66-Carlos-Live'};
            const U='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const ids=[process.env.I66_CARLOS_EMULATOR_RUN,process.env.I66_CARLOS_PREVIEW_FUNCTION_RUN,'43305281214',process.env.I66_CARLOS_SIGNED_OPS_UAT,process.env.I66_CARLOS_SIGNED_PAYMENT_UAT,process.env.I66_CARLOS_PAYMENT_LIVE_RUN];
            const [qa,stage,build,ops,payment,live]=await Promise.all(ids.map(id=>fetch(U+'runs/'+id,{headers:H}).then(r=>r.json())));
            for(const [name,r] of [['QA',qa],['THREE_PREVIEW_FUNCTIONS',stage],['PACKAGE',build],['SIGNED_OPS',ops],['SIGNED_PAYMENT',payment],['PAYMENT_LIVE',live]])assert.equal(r.conclusion,'success',name);
            assert.equal(qa.head_sha,process.env.I66_CARLOS_SOURCE_SHA,'CARLOS_QA_SOURCE_PROOF_DRIFT');
            assert.equal(build.head_sha,process.env.I66_CARLOS_SOURCE_SHA,'CARLOS_IMMUTABLE_PACKAGE_NOT_GREEN');
            for(const x of [stage,ops])assert.equal(execFileSync('git',['merge-base','--is-ancestor',x.head_sha,process.env.I66_CARLOS_SOURCE_SHA]).length,0);
            assert.equal(build.head_sha,process.env.I66_CARLOS_SOURCE_SHA,'CARLOS_ORIGINAL_SOURCE_DRIFT');
            const art=await fetch(U+'artifacts/'+process.env.I66_CARLOS_ARTIFACT_ID,{headers:H}).then(r=>r.json());
            assert.equal(art.digest,process.env.I66_CARLOS_ARTIFACT_DIGEST,'CARLOS_ZIP_DIGEST_DRIFT');
            assert.equal(art.workflow_run.id,43305281214,'CARLOS_PACKAGE_RUN_DRIFT');
            assert.equal(art.expired,false,'CARLOS_ARTIFACT_EXPIRED');
            const drift=execFileSync('git',['diff','--name-only','b86cad550fadc050e8574678f02f3097caa8b5bd',process.env.I66_CARLOS_SOURCE_SHA,'--','orbit360-platform','functions'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
            assert.deepEqual(drift,['functions/cobros-reconciliation-domain.js','orbit360-platform/core/product-runtime-browser-providers-p0.js'].sort(),'CARLOS_SIGNED_PREVIEW_OWNER_DRIFT');
            console.log('I66_CARLOS_TWO_REAL_SIGNED_PREVIEW_FUNCTIONS_PAYMENT_LIVE_AND_ONE_ARTIFACT_PREREQUISITES_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13984026378
          run-id: 43305281214
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/carlos-live-archive
      - name: Verify one byte-exact TAR and backend/frontend owner contents
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/carlos-live-archive"
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz | wc -l)" -eq 1
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 | wc -l)" -eq 1
          TAR="$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz -print -quit)"
          SUM="$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 -print -quit)"
          test "$(dirname "$TAR")" = "$(dirname "$SUM")"
          test "$(sha256sum "$TAR" | awk '{print $1}')" = "$(awk '{print $1}' "$SUM")"
          mkdir -p "$RUNNER_TEMP/carlos-live-packet"
          tar -xzf "$TAR" -C "$RUNNER_TEMP/carlos-live-packet" --no-same-owner
          echo "I66_PACKAGE_ROOT=$RUNNER_TEMP/carlos-live-packet" >> "$GITHUB_ENV"
          export CARLOS_LIVE_PKT="$RUNNER_TEMP/carlos-live-packet"
          node - <<'NODE'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process'),root=process.env.CARLOS_LIVE_PKT;
          const p=root+'/bundle/',m=JSON.parse(fs.readFileSync(p+'site/__recovery__/build.json'));
          if(m.sourceSha!==process.env.I66_CARLOS_SOURCE_SHA||m.gate!=='I6.6'||m.buildId!=='gi-i66-1dd675ed59ac-57f234755dc1')throw Error('CARLOS_PACKET_MARKER_DRIFT');
          for(const [target,source] of [
            ['backend/product-operational-domain.js','functions/product-operational-domain.js'],
            ['backend/product-ops-leads-domain.js','functions/product-ops-leads-domain.js'],
            ['site/modules/ops.js','orbit360-platform/modules/ops.js'],
            ['site/core/product-runtime-browser-providers-p0.js','orbit360-platform/core/product-runtime-browser-providers-p0.js'],
            ['site/core/policy-receipts-engine.js','orbit360-platform/core/policy-receipts-engine.js'],
            ['site/modules/policy-receipts-v1199-bridge.js','orbit360-platform/modules/policy-receipts-v1199-bridge.js'],
            ['site/data/store-firestore-product-operational-p0.js','orbit360-platform/data/store-firestore-product-operational-p0.js']
          ])if(!fs.readFileSync(p+target).equals(execFileSync('git',['show',process.env.I66_CARLOS_SOURCE_SHA+':'+source])))
            throw Error('CARLOS_BACKEND_OR_SITE_SOURCE_MISMATCH:'+source);
          if(!fs.existsSync(p+'backend/bootstrap.js')||!fs.existsSync(p+'backend/package-lock.json')||!fs.existsSync(root+'/evidence/site-manifest.sha256'))throw Error('CARLOS_PACKET_INCOMPLETE');
          console.log('I66_CARLOS_PACKAGE_BUILD_AND_PRODUCT_OWNERS_EXACT_PASS');
          NODE
      - name: Select only configured same-project LAB credential, pin CLI and GoogleAuth dependency
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/carlos-live-auth"
          python3 - <<'PY'
          import os,json,pathlib
          b=pathlib.Path(os.environ['RUNNER_TEMP'])/'carlos-live-auth';found=[]
          for i,k in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:d=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError):continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  f=b/f'{i}.json';f.write_text(json.dumps(d));f.chmod(0o600);found.append(str(f))
          if not found:raise SystemExit('I66_CARLOS_CONFIGURED_LAB_AUTH_MISSING')
          (b/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/carlos-live-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/carlos-live-cli"
          CLI="$RUNNER_TEMP/carlos-live-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          SEL=''
          while IFS= read -r c;do
            if GOOGLE_APPLICATION_CREDENTIALS="$c" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/carlos-live-functions-before.json" 2>/dev/null;then SEL="$c";break;fi
          done < "$RUNNER_TEMP/carlos-live-auth/candidates"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/carlos-live-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/carlos-live-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/carlos-live-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund google-auth-library@10.9.1 >/dev/null
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Snapshot two existing LIVE operational revisions and recoverable Hosting release
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          : > "$RUNNER_TEMP/carlos-live-two-old-revisions.tsv"
          for FN in orbit360ProductOperationalCommand orbit360OpsLeadsCommand;do
            export FN
            gcloud functions describe "$FN" --gen2 --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/carlos-live-fn-before-$FN.json"
            SERVICE="$(node - <<'NODE'
          const f=require(process.env.RUNNER_TEMP+'/carlos-live-fn-before-'+process.env.FN+'.json');
          const full=String(f.serviceConfig?.service||''),s=full.split('/').pop();
          if(!full.includes('/locations/us-central1/services/')||!/^[a-z][a-z0-9-]+$/.test(s))throw Error('CARLOS_EXISTING_LIVE_FUNCTION_NOT_SCOPED');
          process.stdout.write(s);
          NODE
            )"
            export SERVICE
            gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/carlos-live-run-before-$FN.json"
            REV="$(node - <<'NODE'
          const f=require(process.env.RUNNER_TEMP+'/carlos-live-run-before-'+process.env.FN+'.json');
          const p=(f.status?.traffic||f.traffic||[]).filter(x=>Number(x.percent)===100);
          const s=String(p[0]?.revisionName||p[0]?.revision||'');
          if(p.length!==1||!s.startsWith(process.env.SERVICE+'-'))throw Error('CARLOS_PREVIOUS_100_PERCENT_REVISION_AMBIGUOUS');
          process.stdout.write(s);
          NODE
            )"
            printf '%s|%s|%s\n' "$FN" "$SERVICE" "$REV" >> "$RUNNER_TEMP/carlos-live-two-old-revisions.tsv"
          done
          test "$(wc -l < "$RUNNER_TEMP/carlos-live-two-old-revisions.tsv")" -eq 2
          RB="gi-i66-carlosrb-$GITHUB_RUN_ID"
          node "$FIREBASE_CLI_BIN" hosting:clone "$SITE:live" "$SITE:$RB" --project "$PROJECT_ID" --non-interactive
          echo "I66_CARLOS_ROLLBACK_CHANNEL=$RB" >> "$GITHUB_ENV"
          FROOT="$RUNNER_TEMP/carlos-live-functions";mkdir -p "$FROOT"
          cp -a "$I66_PACKAGE_ROOT/bundle/backend" "$FROOT/backend"
          (cd "$FROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"backend"}}\n' > "$FROOT/firebase.json"
          echo "I66_CARLOS_TWO_FUNCTION_REVISIONS_AND_HOSTING_BACKUP_READY"
      - name: Promote exact Ops/Leads and ProductOperational writers, then identical Hosting with rollback
        run: |
          set -euo pipefail
          completed=0;deployment_started=0
          rollback(){
            code=$?
            if test "$completed" != 1 && test "$deployment_started" = 1;then
              set +e
              failed=0
              while IFS='|' read -r fn service oldrev;do
                gcloud run services update-traffic "$service" --region us-central1 --project "$PROJECT_ID" --to-revisions="$oldrev=100" --quiet || failed=1
              done < "$RUNNER_TEMP/carlos-live-two-old-revisions.tsv"
              node "$FIREBASE_CLI_BIN" hosting:clone "$SITE:$I66_CARLOS_ROLLBACK_CHANNEL" "$SITE:live" --project "$PROJECT_ID" --non-interactive || failed=1
              echo "I66_CARLOS_AUTO_ROLLBACK_ERRORS=$failed"
              if test "$failed" != 0;then echo 'I66_CARLOS_CRITICAL_ROLLBACK_UNCONFIRMED';fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          deployment_started=1
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360ProductOperationalCommand,functions:orbit360OpsLeadsCommand --config "$RUNNER_TEMP/carlos-live-functions/firebase.json" --project "$PROJECT_ID" --non-interactive
          # Firebase's update operation may complete while a second-generation
          # Cloud Run service still routes its old revision. Explicitly promote
          # each new revision (as the payment LIVE gate already does) and verify
          # 100% before making the corresponding UI available on LIVE.
          while IFS='|' read -r FN SERVICE OLD_REV;do
            gcloud run services update-traffic "$SERVICE" --region us-central1 --project "$PROJECT_ID" --to-latest --quiet
            echo "I66_CARLOS_LIVE_NEW_REVISION_TRAFFIC_PROMOTED $FN"
          done < "$RUNNER_TEMP/carlos-live-two-old-revisions.tsv"
          while IFS='|' read -r FN SERVICE OLD_REV;do
            export FN SERVICE OLD_REV
            gcloud functions describe "$FN" --gen2 --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/carlos-live-fn-after-$FN.json"
            gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/carlos-live-run-after-$FN.json"
            node - <<'NODE'
          const f=require(process.env.RUNNER_TEMP+'/carlos-live-fn-after-'+process.env.FN+'.json');
          const r=require(process.env.RUNNER_TEMP+'/carlos-live-run-after-'+process.env.FN+'.json');
          const revision=String(f.serviceConfig?.revision||'');
          const traffic=(r.status?.traffic||r.traffic||[]).filter(x=>Number(x.percent)>0);
          if(!['ACTIVE','READY'].includes(String(f.state||'').toUpperCase())||
              !String(f.serviceConfig?.uri||'').startsWith('https://')||
              revision===process.env.OLD_REV||traffic.length!==1||Number(traffic[0].percent)!==100||
              String(traffic[0].revisionName||traffic[0].revision)!==revision){
            console.error('I66_CARLOS_TRAFFIC_DIAGNOSTIC '+JSON.stringify({fn:process.env.FN,oldRevision:process.env.OLD_REV,revision,traffic:traffic.map(x=>({revision:String(x.revisionName||x.revision||''),percent:Number(x.percent)})),state:String(f.state||'')}));
            throw Error('CARLOS_TWO_LIVE_FUNCTIONS_REVISION_OR_TRAFFIC_NOT_ACCEPTED:'+process.env.FN);
          }
          console.log('I66_CARLOS_EXACT_LIVE_NEW_REVISION_100_PERCENT_PASS '+process.env.FN);
          NODE
          done < "$RUNNER_TEMP/carlos-live-two-old-revisions.tsv"
          node tools/gravicentra-i6-6-carlos-live-exact-transport.mjs
          STATUS=$(curl -sS --max-time 25 -o "$RUNNER_TEMP/carlos-live-unauth.json" -w '%{http_code}' -X POST 'https://us-central1-ays-orbit-360-lab.cloudfunctions.net/orbit360OpsLeadsCommand' -H 'Content-Type: application/json' --data '{"data":{"tenantId":"alianzas-soluciones","operation":"create_management"}}')
          test "$STATUS" = 401
          grep -q 'UNAUTHENTICATED' "$RUNNER_TEMP/carlos-live-unauth.json"
          echo 'I66_CARLOS_LIVE_OPS_AUTH_GUARD_401_PASS'
          completed=1
          trap - EXIT
          echo 'I66_CARLOS_TWO_WRITERS_AND_DUAL_ORIGIN_SAME_ARTIFACT_LIVE_PASS'
      - name: Upload immutable non-PII readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-carlos-live-exact-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/i66-carlos-live-exact-readback.json
          retention-days: 30
          if-no-files-found: warn
