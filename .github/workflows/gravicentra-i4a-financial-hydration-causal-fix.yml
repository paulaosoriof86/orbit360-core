name: Gravicentra I4A Financial Hydration Causal Fix

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-financial-hydration-causal-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-financial-hydration-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical-path tenant authority and relational scope constraints
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "recovery/fase-a-clean-20260831"
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != expected: raise SystemExit(f'PATCH_PRECONDITION_FAIL:{path}:expected={expected}:actual={count}:{old[:100]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          policy='orbit360-platform/core/tenant-access-policy-product-p0.js'
          replace_exact(policy,
              "  var QUERY_FIELD_ALIASES = Object.freeze({ country: 'pais' });",
              "  var QUERY_FIELD_ALIASES = Object.freeze({ country: 'pais', advisorId: 'asesorId', teamId: 'equipoId' });\n  var RELATION_SCOPED_COLLECTIONS = Object.freeze({ recibosEsperados: true, carteraPrimas: true, cobros: true });")
          replace_exact(policy,
              "  function translateQueryProposal(proposal) {\n    var out = Object.assign({}, proposal || {});\n    out.constraints = (Array.isArray(out.constraints) ? out.constraints : []).map(function (constraint) {\n      var row = Object.assign({}, constraint || {});\n      if (QUERY_FIELD_ALIASES[row.field]) row.field = QUERY_FIELD_ALIASES[row.field];\n      return row;\n    });\n    out.productPhysicalFieldAliasesApplied = true;\n    return out;\n  }",
              "  function translateQueryProposal(proposal, collection) {\n    var out = Object.assign({}, proposal || {});\n    var relationScoped = RELATION_SCOPED_COLLECTIONS[String(collection || '')] === true;\n    out.constraints = (Array.isArray(out.constraints) ? out.constraints : []).map(function (constraint) {\n      var row = Object.assign({}, constraint || {});\n      if (relationScoped) {\n        if (row.field === 'country' || row.field === 'pais') row.field = '__relation_country__';\n        else if (row.field === 'advisorId' || row.field === 'asesorId') row.field = '__relation_advisor__';\n        else if (row.field === 'teamId' || row.field === 'equipoId') row.field = '__relation_team__';\n      } else if (QUERY_FIELD_ALIASES[row.field]) row.field = QUERY_FIELD_ALIASES[row.field];\n      return row;\n    });\n    out.productPhysicalFieldAliasesApplied = true;\n    out.relationScopedCollection = relationScoped;\n    out.relationConstraintsFailClosed = relationScoped;\n    return out;\n  }")
          replace_exact(policy,
              "    return translateQueryProposal(owner.queryConstraints(collection, canonicalMembership(membership), context));",
              "    return translateQueryProposal(owner.queryConstraints(collection, canonicalMembership(membership), context), collection);")

          planner='orbit360-platform/core/product-query-planner-contract-p0.js'
          replace_exact(planner,
              "    if (scope === 'own' && !constraints.some(function (item) { return item.field === 'advisorId' && item.op === '==' && item.value === normalizedMembership.advisorId; })) {\n      errors.push('scope_own_sin_constraint_asesor');\n    }\n    if (scope === 'team' && !constraints.some(function (item) { return item.field === 'teamId' && item.op === '==' && item.value === normalizedMembership.teamId; })) {\n      errors.push('scope_team_sin_constraint_equipo');\n    }",
              "    if (scope === 'own' && !constraints.some(function (item) { return (item.field === 'advisorId' || item.field === 'asesorId' || item.field === '__relation_advisor__') && item.op === '==' && item.value === normalizedMembership.advisorId; })) {\n      errors.push('scope_own_sin_constraint_asesor');\n    }\n    if (scope === 'team' && !constraints.some(function (item) { return (item.field === 'teamId' || item.field === 'equipoId' || item.field === '__relation_team__') && item.op === '==' && item.value === normalizedMembership.teamId; })) {\n      errors.push('scope_team_sin_constraint_equipo');\n    }")
          replace_exact(planner,
              "      indexHint: constraints.filter(function (item) { return item.field !== '__deny__'; }).map(function (item) {",
              "      indexHint: constraints.filter(function (item) { return item.field !== '__deny__' && item.field !== 'tenantId' && String(item.field || '').indexOf('__relation_') !== 0; }).map(function (item) {")
          replace_exact(planner,
              "        noClientSideTenantFiltering: true",
              "        noClientSideTenantFiltering: true,\n        tenantIsolationAuthority: 'canonical_path',\n        relationConstraintsFailClosed: true")

          store='orbit360-platform/data/store-firestore-product-readonly-p0.js'
          replace_exact(store,
              "    function applyConstraint(ref, constraint) { if (!constraint || constraint.field === '__deny__') return ref; if (ref && typeof ref.where === 'function') return ref.where(constraint.field, constraint.op, constraint.value); if (typeof deps.query === 'function' && typeof deps.where === 'function') return deps.query(ref, deps.where(constraint.field, constraint.op, constraint.value)); throw new Error('query_constraint_api_unavailable'); }",
              "    function applyConstraint(ref, constraint) { if (!constraint || constraint.field === '__deny__') return ref; if (constraint.field === 'tenantId') return ref; if (String(constraint.field || '').indexOf('__relation_') === 0) return ref; if (ref && typeof ref.where === 'function') return ref.where(constraint.field, constraint.op, constraint.value); if (typeof deps.query === 'function' && typeof deps.where === 'function') return deps.query(ref, deps.where(constraint.field, constraint.op, constraint.value)); throw new Error('query_constraint_api_unavailable'); }")
          replace_exact(store,
              "    function all(collection) { return (cache[collection] || []).map(clone); }",
              "    function relationPolicy(row) { var pid = text(row && (row.polizaId || row.policyId)); if (!pid) return null; return (cache.polizas || []).find(function (p) { return text(rowId(p)) === pid; }) || null; }\n    function relationClient(row, policy) { var cid = text(row && row.clienteId) || text(policy && policy.clienteId); if (!cid) return null; return (cache.clientes || []).find(function (c) { return text(rowId(c)) === cid; }) || null; }\n    function relationValue(kind, row) { var policy = relationPolicy(row), client = relationClient(row, policy); if (kind === 'country') return text(row && (row.pais || row.country)) || text(policy && (policy.pais || policy.country)) || text(client && (client.pais || client.country)); if (kind === 'advisor') return text(row && (row.asesorId || row.advisorId || row.ownerAdvisorId)) || text(policy && (policy.asesorId || policy.advisorId || policy.ownerAdvisorId)) || text(client && (client.asesorId || client.advisorId || client.ownerAdvisorId)); if (kind === 'team') return text(row && (row.equipoId || row.teamId)) || text(policy && (policy.equipoId || policy.teamId)) || text(client && (client.equipoId || client.teamId)); return ''; }\n    function relationConstraintMatches(row, constraint) { var field = text(constraint && constraint.field), kind = field === '__relation_country__' ? 'country' : field === '__relation_advisor__' ? 'advisor' : field === '__relation_team__' ? 'team' : ''; if (!kind) return true; var value = relationValue(kind, row); if (!value) return false; if (constraint.op === '==') return value === text(constraint.value); if (constraint.op === 'in') return Array.isArray(constraint.value) && constraint.value.map(text).indexOf(value) >= 0; if (constraint.op === 'array-contains') return Array.isArray(value) && value.indexOf(constraint.value) >= 0; return false; }\n    function logicalRows(collection) { var source = cache[collection] || [], plan = state.queryPlans[collection] || {}, constraints = (plan.constraints || []).filter(function (item) { return String(item && item.field || '').indexOf('__relation_') === 0; }); if (!constraints.length) return source; return source.filter(function (row) { return constraints.every(function (constraint) { return relationConstraintMatches(row, constraint); }); }); }\n    function all(collection) { return logicalRows(collection).map(clone); }")

          ptxt=Path(policy).read_text(encoding='utf-8'); qtxt=Path(planner).read_text(encoding='utf-8'); stxt=Path(store).read_text(encoding='utf-8')
          if "__relation_country__" not in ptxt or "__relation_advisor__" not in ptxt or "__relation_team__" not in ptxt: raise SystemExit('RELATION_POLICY_PATCH_MISSING')
          if "tenantIsolationAuthority: 'canonical_path'" not in qtxt: raise SystemExit('PLANNER_CANONICAL_PATH_GUARD_MISSING')
          if "constraint.field === 'tenantId') return ref" not in stxt or 'function logicalRows(collection)' not in stxt: raise SystemExit('STORE_RELATION_PATCH_MISSING')
          PY
      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/tenant-access-policy-product-p0.js
          node --check orbit360-platform/core/product-query-planner-contract-p0.js
          node --check orbit360-platform/data/store-firestore-product-readonly-p0.js
          git diff --check
          test "$(git diff --name-only | sort)" = $'orbit360-platform/core/product-query-planner-contract-p0.js\norbit360-platform/core/tenant-access-policy-product-p0.js\norbit360-platform/data/store-firestore-product-readonly-p0.js'
      - name: Commit causal hydration source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit360-platform/core/tenant-access-policy-product-p0.js orbit360-platform/core/product-query-planner-contract-p0.js orbit360-platform/data/store-firestore-product-readonly-p0.js
          git commit -m "fix(i4a): hydrate relation-backed financial domains"
          git push origin HEAD:recovery/fase-a-clean-20260831
          echo "PRODUCT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCT_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_TOUCHED=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'DATA_TOUCHED=false' >> "$GITHUB_STEP_SUMMARY"
