name: Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-*.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: orbit360-f2-productive-acceptance-${{ github.sha }}
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: f2-productive-acceptance-exact-successor-v20260818
  ORBIT360_EXPECTED_REQUEST_VERSION: F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_V1
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_EMAIL_HASH: 9b663847979724e9491e1c655da32a7cb17a5f6ed26dba352de1eb811254b23f
  ORBIT360_TARGET_ADVISOR_ID: ase-paula-osorio
  ORBIT360_CANDIDATE_ARTIFACT_ID: '9385306424'
  ORBIT360_CANDIDATE_ZIP_NAME: orbit360-fase-a-product-f2-request06-rootfix-successor-b94b2ae86d26.zip
  ORBIT360_CANDIDATE_ZIP_SHA256: 81a96f476fd0fdfd814b3f047951ce653fd324bef8a6d96d6ee6fe44dd7bdcf4
  ORBIT360_CANDIDATE_MANIFEST_SHA256: cc6170121ed61fd6d9cde867dfcae8a3dd23d29777c6ee28c240d70e49843eef
  ORBIT360_CANDIDATE_SOURCE_HEAD: b94b2ae86d26586a68d33be9edba8715e956b02e
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  f2_productive_acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable F2 request and source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST_FILE="${CHANGED[0]}"
          case "$REQUEST_FILE" in .github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-*.json) ;; *) echo 'PIPELINE_MECHANISM_FAILURE:F2_REQUEST_PATH_INVALID' >&2; exit 41 ;; esac
          test "$(jq -r '.requestVersion' "$REQUEST_FILE")" = "$ORBIT360_EXPECTED_REQUEST_VERSION"
          test "$(jq -r '.parentHead' "$REQUEST_FILE")" = "$(git rev-parse HEAD^)"
          test "$(jq -r '.candidateArtifactId' "$REQUEST_FILE")" = "$ORBIT360_CANDIDATE_ARTIFACT_ID"
          test "$(jq -r '.candidateZipSha256' "$REQUEST_FILE")" = "$ORBIT360_CANDIDATE_ZIP_SHA256"
          test "$(jq -r '.candidateManifestSha256' "$REQUEST_FILE")" = "$ORBIT360_CANDIDATE_MANIFEST_SHA256"
          test "$(jq -r '.candidateSourceHead' "$REQUEST_FILE")" = "$ORBIT360_CANDIDATE_SOURCE_HEAD"
          node --check tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-f2-productive-acceptance-v20260819.mjs
          node --check tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs
          node --check tools/orbit360-f2-cross-tenant-probe-contract-v20260818.mjs
          node --check tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node tools/orbit360-test-f2-full-runtime-known-rootfixes-v20260819.mjs
          node --check tools/orbit360-f2-data-integrity-readonly-v20260818.mjs
          node --check tools/orbit360-f2-compare-integrity-v20260818.mjs
          echo "ORBIT360_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_F2_FINAL=$EVIDENCE_DIR/f2-final-run-${GITHUB_RUN_ID}.json" >> "$GITHUB_ENV"
      - name: Register F2 runtime lifecycle in working tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-register-f2-productive-acceptance-runtime-v20260819.mjs
          grep -F 'orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json' tools/orbit360-validar-gate-contracts-v20260717.mjs >/dev/null
          git diff --check
      - name: Mandatory canonical F2 gate before artifact or provider/browser
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$EVIDENCE_DIR/preflight-sanitizado.json"
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq --arg run "$GITHUB_RUN_ID" '. + {runId:$run,evidenceFreshness:"current-run-only"}' "$EVIDENCE_DIR/preflight-sanitizado.json" > "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          jq -e --arg run "$GITHUB_RUN_ID" --argjson artifact "$ORBIT360_CANDIDATE_ARTIFACT_ID" '.ok==true and .status=="GO_GATE_CONTRACT" and .classification=="GO_F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY" and .runId==$run and .candidateArtifactId==$artifact and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .customTokenMintAuthorized==true and .runtimeAuthorized==true and .browserAuthorized==true and .writeAuthorized==false and .authWriteAuthorized==false and .membershipWriteAuthorized==false and .dataWriteAuthorized==false and .packageRebuildAuthorized==false and .deployAuthorized==false and .publicationAuthorized==false and .productionAuthorized==false' "$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json" >/dev/null
      - name: Download and fully verify exact F2 candidate after GO
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUTER="$RUNNER_TEMP/f2-artifact-outer.zip"; OUTER_DIR="$RUNNER_TEMP/f2-outer"; CANDIDATE_DIR="$RUNNER_TEMP/f2-candidate"
          rm -rf "$OUTER" "$OUTER_DIR" "$CANDIDATE_DIR"; mkdir -p "$OUTER_DIR" "$CANDIDATE_DIR"
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORBIT360_CANDIDATE_ARTIFACT_ID}/zip" -o "$OUTER"
          unzip -q "$OUTER" -d "$OUTER_DIR"
          mapfile -t FILES < <(find "$OUTER_DIR" -maxdepth 1 -type f -printf '%f\n' | sort); test "${#FILES[@]}" = '1'; test "${FILES[0]}" = "$ORBIT360_CANDIDATE_ZIP_NAME"
          INNER="$OUTER_DIR/$ORBIT360_CANDIDATE_ZIP_NAME"; test "$(sha256sum "$INNER" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_ZIP_SHA256"
          unzip -q "$INNER" -d "$CANDIDATE_DIR"; test "$(sha256sum "$CANDIDATE_DIR/orbit360-package-manifest.json" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_MANIFEST_SHA256"
          ORBIT360_F2_CANDIDATE_DIR="$CANDIDATE_DIR" ORBIT360_F2_CANDIDATE_SOURCE_EVIDENCE="$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" node tools/orbit360-f2-exact-candidate-source-validator-v20260819.mjs
          jq -e '.ok==true and .status=="F2_EXACT_CANDIDATE_SOURCE_VALIDATION_PASS" and .candidateArtifactId==9385306424 and .fullRehashPass==true and .inicioFiniteRootfixPass==true' "$EVIDENCE_DIR/f2-candidate-source-run-${GITHUB_RUN_ID}.json" >/dev/null
          echo "ORBIT360_F2_CANDIDATE_DIR=$CANDIDATE_DIR" >> "$GITHUB_ENV"
      - name: Install authorized runtime dependencies after F2 GO
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0 >/dev/null
          BROWSER_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_EXECUTABLE"
          echo "ORBIT360_SYSTEM_BROWSER_EXECUTABLE=$BROWSER_EXECUTABLE" >> "$GITHUB_ENV"
      - name: Bind provider after F2 GO
        if: steps.gate.outcome == 'success'
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          SA_FILE="$RUNNER_TEMP/orbit360-f2-service-account.json"; printf '%s' "$SERVICE_ACCOUNT" > "$SA_FILE"; chmod 600 "$SA_FILE"
          jq -e '.type=="service_account" and (.project_id|length)>0 and (.client_email|length)>0 and (.private_key|length)>0' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"
      - name: Resolve exact protected F2 smoke identity read-only
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_SMOKE_IDENTITY_EVIDENCE="$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" ORBIT360_SMOKE_RUN_ID="$GITHUB_RUN_ID" ORBIT360_SMOKE_TARGET_EMAIL_HASH="$ORBIT360_TARGET_EMAIL_HASH" ORBIT360_SMOKE_TARGET_ADVISOR_ID="$ORBIT360_TARGET_ADVISOR_ID" node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .targetBindingRequested==true and .targetEmailHashMatches==true and .targetAdvisorMatches==true and .targetIdentityMatches==true and .requiredRolesPresent==true and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/f2-identity-run-${GITHUB_RUN_ID}.json" >/dev/null
      - name: F2 integrity snapshot before browser
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-f2-data-integrity-readonly-v20260818.mjs before
          jq -e '.ok==true and .status=="F2_DATA_INTEGRITY_SNAPSHOT_PASS" and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/f2-data-integrity-before-v20260818.json" >/dev/null
      - name: Serve exact F2 candidate on runner loopback
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$ORBIT360_F2_CANDIDATE_DIR" > "$RUNNER_TEMP/f2-http.log" 2>&1 & echo $! > "$RUNNER_TEMP/f2-http.pid"
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/orbit360-package-manifest.json >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/orbit360-package-manifest.json >/dev/null
          echo "ORBIT360_F2_URL=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
      - name: Execute F2 complete browser acceptance
        id: browser
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set +e
          ORBIT360_F2_OUT="$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json" node tools/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.mjs
          CODE=$?; echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"; exit 0
      - name: F2 integrity snapshot after browser and compare
        id: integrity
        if: always() && steps.gate.outcome == 'success'
        shell: bash
        run: |
          set +e
          node tools/orbit360-f2-data-integrity-readonly-v20260818.mjs after
          A=$?
          if [ "$A" -eq 0 ]; then node tools/orbit360-f2-compare-integrity-v20260818.mjs; B=$?; else B=41; fi
          echo "exit_code=$B" >> "$GITHUB_OUTPUT"; exit 0
      - name: Build sanitized F2 terminal evidence
        if: always()
        env:
          BROWSER_CODE: ${{ steps.browser.outputs.exit_code }}
          INTEGRITY_CODE: ${{ steps.integrity.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          B="$EVIDENCE_DIR/f2-browser-run-${GITHUB_RUN_ID}.json"; I="$EVIDENCE_DIR/f2-integrity-before-after-v20260818.json"; P="$EVIDENCE_DIR/f2-runtime-preflight-run-${GITHUB_RUN_ID}.json"
          if [ "${BROWSER_CODE:-41}" = '0' ] && [ "${INTEGRITY_CODE:-41}" = '0' ] && jq -e '.ok==true and .status=="F2_PRODUCTIVE_ACCEPTANCE_RUNTIME_BROWSER_READONLY_PASS" and .crossTenantDenied==true and .runtime.ready==true and .runtime.writeEnabled==false and .localWriteGuard.blocked==true and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and (.writeSignals|length)==0 and (.pageErrors|length)==0 and (.consoleErrors|length)==0' "$B" >/dev/null && jq -e '.ok==true and .status=="F2_INTEGRITY_BEFORE_AFTER_PASS" and .countsIdentical==true and .digestsIdentical==true' "$I" >/dev/null; then
            jq -n --arg run "$GITHUB_RUN_ID" --arg request "$ORBIT360_REQUEST_FILE" '{schemaVersion:"orbit360-f2-terminal-v1",ok:true,status:"F2_PRODUCTIVE_ACCEPTANCE_PASS",classification:"PASS",runId:$run,request:$request,candidateArtifactId:9385306424,sourceOnlyPreflightPass:true,browserMatrixPass:true,integrityBeforeAfterPass:true,zeroCrossTenant:true,zeroUnexpectedWrites:true,legalIdempotent:true,serviceWorkerCachePass:true,firestoreWrites:0,authWrites:0,operationalWrites:0,packageRebuilt:false,deployExecuted:false,publicationExecuted:false,productionHostingTouched:false,containsPII:false,containsSecrets:false}' > "$ORBIT360_F2_FINAL"
          else
            jq -n --arg run "$GITHUB_RUN_ID" --arg request "$ORBIT360_REQUEST_FILE" --arg b "${BROWSER_CODE:-missing}" --arg i "${INTEGRITY_CODE:-missing}" '{schemaVersion:"orbit360-f2-terminal-v1",ok:false,status:"F2_PRODUCTIVE_ACCEPTANCE_FAIL",classification:"FUNCTIONAL_DEFECT_OR_PIPELINE_FAILURE_REQUIRES_ROOT_CAUSE",runId:$run,request:$request,browserCode:$b,integrityCode:$i,candidateArtifactId:9385306424,firestoreWrites:0,authWrites:0,operationalWrites:0,packageRebuilt:false,deployExecuted:false,publicationExecuted:false,productionHostingTouched:false,containsPII:false,containsSecrets:false}' > "$ORBIT360_F2_FINAL"
            exit 41
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-f2-productive-acceptance-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/f2-runtime-preflight-run-${{ github.run_id }}.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-candidate-source-run-${{ github.run_id }}.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-identity-run-${{ github.run_id }}.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-data-integrity-before-v20260818.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-browser-run-${{ github.run_id }}.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-data-integrity-after-v20260818.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-integrity-before-after-v20260818.json
            orbit360-platform/runtime-gate-crm-v20260716/f2-final-run-${{ github.run_id }}.json
          retention-days: 14