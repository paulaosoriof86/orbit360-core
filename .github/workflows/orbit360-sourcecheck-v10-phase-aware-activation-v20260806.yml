name: Orbit 360 · Validar activación v10 fase-aware · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-v10-activation-source-only:
    if: github.head_ref == 'ays/runtime-v10-activation-source-only-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact activation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and phase-aware source suite
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node --check tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-visual-matrix-corrected-post-auth-lab-v20260805.mjs
          bash -n tools/orbit360-preflight-visual-matrix-runtime-relay-v8-v20260806.sh
          bash -n tools/orbit360-restore-visual-matrix-v6-backup-before-runtime-v20260806.sh
          bash -n tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v3-cross-runner-v20260806.sh
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs

      - name: Assert v10 activation and zero risk
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const overlay = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json', 'utf8'));
          const lifecycle = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json', 'utf8'));
          const evidence = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/preflight-portable-source-test-sanitized-v20260806.json', 'utf8'));
          const ok =
            overlay.requestVersion === '20260806.10-phase-aware-runtime' &&
            overlay.stopRetryActive === false &&
            overlay.runtimeAllowed === true &&
            overlay.runtimeAllowedOnlyWithFreshExclusiveRequest === true &&
            overlay.requestReusable === false &&
            overlay.productionAllowed === false && overlay.writesAllowed === false &&
            lifecycle.status === 'AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST' &&
            lifecycle.currentPhase === 'VISUAL_MATRIX_CORRECTED_POST_AUTH_LAB_EXECUTION' &&
            lifecycle.authorizationReserved === true && lifecycle.allowedExecutions === 1 &&
            lifecycle.requestConsumed === false && lifecycle.replayAllowed === false &&
            lifecycle.hostingDeploysMaximum === 1 &&
            lifecycle.writeAuthorized === false && lifecycle.productionAuthorized === false &&
            evidence.status === 'PASS_SOURCE_ONLY_PHASE_AWARE_PREFLIGHT_VALIDATOR' &&
            evidence.observedLifecyclePhase === 'AUTHORIZED_FRESH_REQUEST_ONLY' &&
            evidence.failed === 0 && evidence.ok === true &&
            evidence.secretsRead === false && evidence.firebaseAccess === false &&
            evidence.firestoreWrites === 0 && evidence.authWrites === 0 &&
            evidence.operationalWrites === 0 && evidence.browserExecuted === false &&
            evidence.deployExecuted === false && evidence.productionTouched === false;
          if (!ok) process.exit(41);
          console.log(JSON.stringify({status:'PASS_V10_PHASE_AWARE_ACTIVATION_SOURCE_ONLY',sourceChecks:evidence.passed,failed:0,runtimeExecuted:false,secretsRead:false,deployExecuted:false,ok:true}, null, 2));
          NODE
