name: Orbit360 F2 Request11 Authorization Reconcile Source Only 20260820
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/f2-request11-authorization-reconcile-target-v20260820.json'
permissions:
  contents: write
concurrency:
  group: orbit360-f2-request11-authorization-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-only authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          TARGET='.github/orbit360-observers/f2-request11-authorization-reconcile-target-v20260820.json'
          test -f "$TARGET"
          jq -e '.schemaVersion=="orbit360-f2-request11-authorization-reconcile-target-v1" and .approvedAuthorizationAlreadyExists==true and .requestOrdinal==11 and .candidateArtifactId==9387820198 and .candidateSourceHead=="fc46bd85783d8b4d524cbeb0fee54ee9a2c774af" and .productMutation==false and .dataMutation==false and .runtime==false and .browser==false and .secretAccess==false and .deploy==false and .production==false' "$TARGET" >/dev/null
          node --check tools/orbit360-sync-f2-request11-authorization-v20260820.mjs
          node --check tools/orbit360-f2-request11-authorization-documentation-invariant-v20260820.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
      - name: Apply complete reconciliation and persistence
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-sync-f2-request11-authorization-v20260820.mjs
          ORBIT360_F2_INVARIANT_OUT='orbit360-platform/runtime-gate-crm-v20260716/f2-request11-authorization-documentation-invariant-source-v20260820.json' node tools/orbit360-f2-request11-authorization-documentation-invariant-v20260820.mjs
          git diff --check
          node - <<'NODE'
          const cp=require('child_process');
          const changed=cp.execSync('git status --short',{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).map(x=>x.trim().replace(/^..\s*/,''));
          const forbidden=changed.filter(p=>/^orbit360-platform\/(core|modules|data|styles)\//.test(p)||p==='orbit360-platform/index.html'||p==='firestore.rules'||p.startsWith('functions/'));
          if(forbidden.length){console.error({forbidden});process.exit(41)}
          const required=[
            '.github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-request11-v20260820.json',
            '.github/workflows/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml',
            'orbit360-platform/docs/ACADEMIA-ACTUALIZACION-F2-AUTHORIZATION-PERSISTENCE-INVARIANT-20260820.md',
            'orbit360-platform/docs/CHECKPOINT-F2-REQUEST11-AUTHORIZATION-PERSISTED-MATERIALIZATION-PENDING-20260820.md',
            'orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json',
            'orbit360-platform/docs/orbit360-live-state-v1.json',
            'orbit360-platform/runtime-gate-crm-v20260716/f2-request11-authorization-documentation-invariant-source-v20260820.json',
            'tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json'
          ];
          const missing=required.filter(x=>!changed.includes(x));if(missing.length){console.error({changed,missing});process.exit(41)}
          console.log(JSON.stringify({ok:true,status:'F2_REQUEST11_RECONCILIATION_CHANGESET_PASS',changed},null,2));
          NODE
      - name: Persist reconciled control-plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-docsync-bot'
          git config user.email 'orbit360-docsync-bot@users.noreply.github.com'
          git add .github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-request11-v20260820.json .github/workflows/orbit360-f2-productive-acceptance-runtime-browser-readonly-v20260818.yml orbit360-platform/docs/ACADEMIA-ACTUALIZACION-F2-AUTHORIZATION-PERSISTENCE-INVARIANT-20260820.md orbit360-platform/docs/CHECKPOINT-F2-REQUEST11-AUTHORIZATION-PERSISTED-MATERIALIZATION-PENDING-20260820.md orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json orbit360-platform/docs/orbit360-live-state-v1.json orbit360-platform/runtime-gate-crm-v20260716/f2-request11-authorization-documentation-invariant-source-v20260820.json tools/orbit360-validator-lifecycle-contract-f2-productive-acceptance-runtime-v20260819.json
          git commit -m 'control(f2): persist Request11 authorization and enforce state invariant'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          ORBIT360_F2_INVARIANT_OUT="$RUNNER_TEMP/f2-request11-readback-invariant.json" node tools/orbit360-f2-request11-authorization-documentation-invariant-v20260820.mjs
          jq -e '.ok==true and .status=="F2_REQUEST11_AUTHORIZATION_DOCUMENTATION_INVARIANT_PASS"' "$RUNNER_TEMP/f2-request11-readback-invariant.json" >/dev/null
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
