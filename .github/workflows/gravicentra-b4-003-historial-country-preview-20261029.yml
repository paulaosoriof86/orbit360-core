name: Gravicentra I6.5 B4-003 Historial Country Scoped Preview 20261029

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-b4-003-historial-country-preview-20261029.yml

permissions:
  contents: read

concurrency:
  group: gi-b4003-historial-country-preview-20261029
  cancel-in-progress: false

jobs:
  exact-preview-hosting-only:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      github.event.head_commit.message == 'build(i6.5): isolated Historial country QA Preview only'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROJECT_ID: ays-orbit-360-lab
      HOSTING_SITE: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      GRAVICENTRA_B4_003_SCOPED_PREVIEW: 'true'
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze exact ancestry, target, and read-only source tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5441f8d510b937ef0a9ebe46a4485d93cc3c142e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/gravicentra-b4-003-historial-country-preview-20261029.yml'
          test "$(git hash-object orbit360-platform/modules/historial.js)" = '7dfef4b69a9dafffafde5f6f627f81ad27a33c37'
          node --check orbit360-platform/modules/historial.js
          node tools/gravicentra-b4-003-historial-country-selection.test.cjs
          node tools/gravicentra-b4-003-role-context-recovery.test.cjs
          node tools/gravicentra-b4-003-scoped-related-reader.test.cjs
          node tools/gravicentra-b4-003-protected-hydration.test.cjs

      - name: Record LIVE bytes before Preview
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum | cut -d ' ' -f1 > "$RUNNER_TEMP/live-before.sha256"

      - name: Resolve existing LAB service account and pinned Firebase CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hist-country-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'hist-country-auth'
          paths=[]
          for n,k in enumerate(('SA_ORBIT360_LAB','SA_ORBIT_360_LAB','SA_DEFAULT')):
              try: value=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError): continue
              if value.get('type')=='service_account' and value.get('project_id')==os.environ['PROJECT_ID'] and value.get('private_key'):
                  p=root/f'{n}.json'
                  p.write_text(json.dumps(value),encoding='utf8')
                  p.chmod(0o600)
                  paths.append(str(p))
          if not paths: raise SystemExit('HIST_COUNTRY_LAB_ACCOUNT_NOT_CONFIGURED')
          (root/'candidates').write_text('\n'.join(paths)+'\n',encoding='utf8')
          PY
          CLI_ROOT="$RUNNER_TEMP/hist-country-cli"
          npm install --prefix "$CLI_ROOT" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CLI_ROOT"
          CLI="$CLI_ROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r candidate; do
            if GOOGLE_APPLICATION_CREDENTIALS="$candidate" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done < "$RUNNER_TEMP/hist-country-auth/candidates"
          test -n "$selected"
          cp "$selected" "$RUNNER_TEMP/hist-country-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/hist-country-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/hist-country-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null

      - name: Obtain public SDK configuration from exact LAB project
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/hist-country-apps.json"
          export APPS_FILE="$RUNNER_TEMP/hist-country-apps.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          result=json.load(open(os.environ['APPS_FILE'])).get('result') or []
          web=[app for app in result if str(app.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1: raise SystemExit('HIST_COUNTRY_WEB_APP_CARDINALITY_INVALID')
          print(web[0].get('appId',''))
          PY
          )
          test -n "$APP_ID"
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/hist-country-sdkconfig.json"

      - name: Build canonical Hosting-only LAB bundle
        run: |
          set -euo pipefail
          export SOURCE_SHA="$GITHUB_SHA"
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/hist-country-branding.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/hist-country-branding.json"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/hist-country-package" "$RUNNER_TEMP/hist-country-sdkconfig.json" > "$RUNNER_TEMP/hist-country-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const root=process.env.RUNNER_TEMP+'/hist-country-package/bundle';
          const config=JSON.parse(fs.readFileSync(root+'/firebase.json','utf8'));
          const meta=JSON.parse(fs.readFileSync(root+'/site/__recovery__/build.json','utf8'));
          const source=fs.readFileSync('orbit360-platform/modules/historial.js');
          const packaged=fs.readFileSync(root+'/site/modules/historial.js');
          if(Object.keys(config).join(',')!=='hosting'||config.hosting.site!=='ays-orbit-360-lab'||config.hosting.public!=='site')throw Error('HOSTING_ONLY_EXPECTED');
          if(meta.sourceSha!==process.env.GITHUB_SHA||!source.equals(packaged))throw Error('HISTORIAL_SOURCE_MISMATCH');
          if(!String(packaged).includes('function visibleActivities()'))throw Error('COUNTRY_FILTER_NOT_IN_BUNDLE');
          NODE

      - name: Publish one isolated seven-day Hosting Preview, no LIVE or functions
        id: preview
        run: |
          set -euo pipefail
          CHANNEL_ID="gi-i65-hco-$GITHUB_RUN_ID"
          cd "$RUNNER_TEMP/hist-country-package/bundle"
          node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/hist-country-deploy.json" 2>&1
          export CHANNEL_ID
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['RUNNER_TEMP']+'/hist-country-deploy.json',encoding='utf8').read()
          prefix='https://ays-orbit-360-lab--'+os.environ['CHANNEL_ID']+'-'
          urls=sorted(set(u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.startswith(prefix)))
          if len(urls)!=1: raise SystemExit('HIST_COUNTRY_PREVIEW_URL_NOT_UNIQUE')
          print(urls[0])
          PY
          )
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL_ID" >> "$GITHUB_OUTPUT"

      - name: Confirm served byte identity and LIVE unchanged
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 "$PREVIEW_URL/modules/historial.js" > "$RUNNER_TEMP/hist-country-served.js"
          cmp orbit360-platform/modules/historial.js "$RUNNER_TEMP/hist-country-served.js"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 https://ays-orbit-360-lab.web.app/ | sha256sum | cut -d ' ' -f1 > "$RUNNER_TEMP/live-after.sha256"
          cmp "$RUNNER_TEMP/live-before.sha256" "$RUNNER_TEMP/live-after.sha256"
          printf '%s\n' "Historial GT/CO/TODOS Preview source readback PASS" "LIVE Hosting unchanged; no functions, Rules, IAM, Auth, or data changes" "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
