name: Orbit360 R4S6 Client Projection Consecutive Read Rootfix Source 20260817

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4s6-client-projection-consecutive-read-rootfix-source-v20260817.yml'

permissions:
  contents: write

concurrency:
  group: orbit360-r4s6-client-projection-consecutive-read-rootfix-source-v20260817
  cancel-in-progress: false

env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  OWNER: orbit360-platform/core/client-insurer-visual-contract-v20260720.js
  MODULE: orbit360-platform/modules/cliente360.js
  PROTECTED_STORE: orbit360-platform/data/store-firestore-product-readonly-p0.js
  BRANCH: ays/backend-tenant-lab-v99-20260703

jobs:
  rootfix-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical gate before source correction
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Confirm complete root cause before changing product
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-r4s6-client-projection-consecutive-read-rootfix-gate-v20260817.mjs --diagnose
          jq -e '.ok==true and .status=="R4S6_CLIENT_PROJECTION_ROOT_CAUSE_DIAGNOSIS_SOURCE_PASS" and .diagnosis.roleScopeReadsClients==true and .diagnosis.cliente360UsesReadBatch==true and .diagnosis.batchDirectlyNativeReadsClients==true and .diagnosis.projectedAllNativeReadsBeforeClientBranch==true and .diagnosis.enhancerReadsClientsAgain==true and .tripleReadReproduced==true and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .dataAccess==false' "$EVIDENCE_DIR/r4s6-client-projection-consecutive-read-rootfix-source-v20260817.json" >/dev/null

      - name: Apply rootfix only to projection owner
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-r4s6-client-projection-consecutive-read-rootfix-gate-v20260817.mjs --apply
          node --check "$OWNER"
          test "$(git diff --name-only | sed '/^$/d' | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$OWNER"
          git diff --exit-code -- "$MODULE" "$PROTECTED_STORE"

      - name: Verify representative consecutive-read rootfix source-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-r4s6-client-projection-consecutive-read-rootfix-gate-v20260817.mjs --verify
          jq -e '.ok==true and .status=="R4S6_CLIENT_PROJECTION_CONSECUTIVE_READ_ROOTFIX_SOURCE_PASS" and .semanticEqual==true and .countsEqual==true and .topLevelIsolation==true and .reduction.callReductionPct>=60 and .reduction.rowReductionPct>=60 and .reduction.byteReductionPct>=60 and .candidate.projection.clientProjection.builds==1 and .candidate.projection.clientProjection.hits>=4 and .invalidation.pass==true and .protectedStoreModified==false and .moduleModified==false and .browserExecuted==false and .runtimeExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/r4s6-client-projection-consecutive-read-rootfix-source-v20260817.json" >/dev/null

      - name: Re-run canonical gate after source proof
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Commit exact proven owner delta to mandatory branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orbit360-source-gate"
          git config user.email "actions@users.noreply.github.com"
          git add "$OWNER"
          test "$(git diff --cached --name-only | sed '/^$/d' | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$OWNER"
          git commit -m "fix: cache consecutive projected client reads source-only"
          git push origin "HEAD:$BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s6-client-projection-rootfix-source-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s6-client-projection-consecutive-read-rootfix-source-v20260817.json
          if-no-files-found: warn
          retention-days: 14
