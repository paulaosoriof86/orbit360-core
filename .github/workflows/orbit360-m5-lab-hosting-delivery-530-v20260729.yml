name: Orbit 360 · M5 Hosting LAB delivery · post-5.0.29
run-name: M5 5.0.30 · package or one Hosting LAB delivery · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-lab-hosting-delivery-530-v20260729.yml'
      - 'tools/orbit360-m5-lab-hosting-delivery-request-530-v20260729.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-lab-hosting-delivery-530-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m5-lab-hosting-delivery-request-530-v20260729.json
  EXPECTED_FIREBASE_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_HOSTING_CHANNEL: orbit360-ays-lab
  ORBIT360_HOSTING_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  hosting_lab_delivery:
    name: M5 · schema-driven package or one Hosting LAB delivery · verify 26/26
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolver modo controlado
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ORBIT360_REQUEST_FILE" ]; then echo 'value=request' >> "$GITHUB_OUTPUT"; else echo 'value=package' >> "$GITHUB_OUTPUT"; fi

      - name: Verificar rama SHA y primer intento
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Preflight canónico antes de cualquier secreto o deploy
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-lab-hosting-delivery-530-v20260729.mjs
          node --check tools/orbit360-m5-lab-hosting-delivery-contract-530-v20260729.cjs
          node --check tools/orbit360-m5-release-candidate-readiness-530-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.30" and .executionPhase=="M5_LAB_HOSTING_DELIVERY" and .failed==0 and .criticalAssets==43 and .remoteAssetsExpected==26 and (.releaseCandidateHash|type)=="string" and (.releaseCandidateHash|length)==64 and .capabilityProfile.secrets==true and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==true and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .dataAccess==false and .secretAccess==false and .operationalWrites==0 and .deployExecuted==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then
            jq -e '.executionAuthorized==true and .allowedExecutions==1 and .activationMode=="immutable_request_present"' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          else
            jq -e '.executionAuthorized==false and .allowedExecutions==0 and .activationMode=="package_without_request"' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          fi
          RC_HASH="$(jq -r '.releaseCandidateHash' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json")"
          echo "EXPECTED_RC_HASH=$RC_HASH" >> "$GITHUB_ENV"

      - name: Verificar contrato local 43/26
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-lab-hosting-delivery-contract-530-v20260729.cjs
          jq -e '.ok==true and .status=="M5_LAB_HOSTING_530_CONTRACT_PASS" and .failed==0 and .passed==.total and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssets==26 and .hostingDeploy==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeSmoke==false and .browser==false and .functionsDeploy==false and .rulesDeploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-lab-hosting-delivery-530-contract-summary.json" >/dev/null

      - name: Medir paridad pública antes de cualquier deploy
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-530-v20260729.mjs
          cp "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-summary.json" "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-before.json"
          jq -e '.ok==true and (.status=="M5_RC_READY_LAB_DELIVERY_REQUIRED" or .status=="M5_RC_READY_FOR_RUNTIME_SMOKE") and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==43 and .releaseCandidate.multirolContractBound==true and .remoteLab.assetsExpected==26 and .remoteLab.assetsChecked==26 and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-before.json" >/dev/null
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then
            jq -e '.status=="M5_RC_READY_LAB_DELIVERY_REQUIRED" and .remoteLab.remoteParity==false and .remoteLab.mismatchCount>=1' "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-before.json" >/dev/null
          fi

      - name: Validar solicitud inmutable sin secretos
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m5-lab-hosting-delivery-request-530-v1'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='5.0.30')bad.push('schema');
          if(r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent||r.allowedExecutions!==1||r.hostingLabDelivery!==true)bad.push('binding');
          if(r.releaseCandidateHash!==process.env.EXPECTED_RC_HASH||r.criticalAssets!==43||r.remoteAssetsExpected!==26)bad.push('candidate');
          if(r.projectId!==process.env.EXPECTED_FIREBASE_PROJECT_ID||r.channel!==process.env.ORBIT360_HOSTING_CHANNEL||r.canonicalUrl!==process.env.ORBIT360_HOSTING_URL)bad.push('target');
          if(r.secrets!==true||r.deploy!==true||r.hostingOnly!==true||r.firestoreRead!==false||r.firestoreWrite!==false||r.operationalWrites!==false||r.browser!==false||r.runtimeSmoke!==false||r.functionsDeploy!==false||r.rulesDeploy!==false||r.production!==false||r.mergeMain!==false||r.policies!==false||r.pólizas!==false||r.visualReview!==false||r.containsPII!==false||r.containsSecrets!==false)bad.push('capabilities');
          if(bad.length)throw new Error('M5_HOSTING_530_REQUEST_INVALID:'+bad.join(','));
          console.log('M5_HOSTING_530_REQUEST_BOUND_OK');
          NODE

      - name: Resolver identidad exclusiva de Hosting LAB después del preflight
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m5-hosting-lab-530.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$EXPECTED_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Instalar Firebase CLI
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-tools@14
          npx firebase --version

      - name: Publicar exclusivamente Hosting LAB una vez
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          npx firebase hosting:channel:deploy "$ORBIT360_HOSTING_CHANNEL" --project "$EXPECTED_FIREBASE_PROJECT_ID" --config firebase.json --expires 7d --non-interactive --json > "$ORBIT360_EVIDENCE_DIR/m5-lab-hosting-530-deploy-output.json"
          jq -e 'type=="object"' "$ORBIT360_EVIDENCE_DIR/m5-lab-hosting-530-deploy-output.json" >/dev/null

      - name: Revalidar candidata pública 26/26
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in 1 2; do
            node tools/orbit360-m5-release-candidate-readiness-530-v20260729.mjs || true
            if jq -e '.ok==true and .status=="M5_RC_READY_FOR_RUNTIME_SMOKE" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==43 and .releaseCandidate.multirolContractBound==true and .remoteLab.assetsExpected==26 and .remoteLab.assetsChecked==26 and .remoteLab.assetsMatched==26 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-summary.json" >/dev/null; then verified=1; break; fi
            if [ "$attempt" = '1' ]; then sleep 8; fi
          done
          cp "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-summary.json" "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-530-after.json"
          test "$verified" = '1'

      - name: Crear cierre sanitizado
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.env.ORBIT360_EVIDENCE_DIR,mode='${{ steps.mode.outputs.value }}';
          const read=name=>{try{return JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'))}catch{return null}};
          const p=read('preflight-sanitizado.json'),c=read('m5-lab-hosting-delivery-530-contract-summary.json'),before=read('m5-release-candidate-readiness-530-before.json'),after=read('m5-release-candidate-readiness-530-after.json'),dep=read('m5-lab-hosting-530-deploy-output.json');
          const hash=(c&&c.releaseCandidateHash)||(p&&p.releaseCandidateHash)||'';
          const packageOk=!!(p&&p.status==='GO_GATE_CONTRACT'&&p.failed===0&&p.activationMode==='package_without_request'&&c&&c.status==='M5_LAB_HOSTING_530_CONTRACT_PASS'&&c.failed===0&&before&&before.ok===true&&before.releaseCandidate?.hash===hash&&before.remoteLab?.assetsExpected===26&&before.remoteLab?.assetsChecked===26);
          const deliveryOk=!!(p&&p.status==='GO_GATE_CONTRACT'&&p.failed===0&&p.executionAuthorized===true&&c&&c.status==='M5_LAB_HOSTING_530_CONTRACT_PASS'&&c.failed===0&&before&&before.status==='M5_RC_READY_LAB_DELIVERY_REQUIRED'&&after&&after.status==='M5_RC_READY_FOR_RUNTIME_SMOKE'&&after.releaseCandidate?.hash===hash&&after.remoteLab?.assetsMatched===26&&after.remoteLab?.mismatchCount===0&&after.remoteLab?.remoteParity===true&&dep);
          const alreadyParity=mode==='package'&&packageOk&&before.remoteLab?.remoteParity===true;
          const ok=mode==='request'?deliveryOk:packageOk;
          const status=mode==='request'?(ok?'M5_LAB_HOSTING_530_DELIVERED_AND_26_OF_26_VERIFIED':'M5_LAB_HOSTING_530_DELIVERY_FAILED'):(ok?(alreadyParity?'M5_LAB_HOSTING_530_PACKAGE_ALREADY_PARITY':'M5_LAB_HOSTING_530_PACKAGE_PASS'):'M5_LAB_HOSTING_530_PACKAGE_FAIL');
          const out={schemaVersion:'orbit360-m5-lab-hosting-delivery-530-summary-v1',generatedAt:new Date().toISOString(),ok,status,mode,gateId:process.env.ORBIT360_GATE_ID,contractVersion:'5.0.30',releaseCandidateHash:hash,projectId:process.env.EXPECTED_FIREBASE_PROJECT_ID,channel:process.env.ORBIT360_HOSTING_CHANNEL,canonicalUrl:process.env.ORBIT360_HOSTING_URL,canonicalPreflight:p&&p.status||'NOT_RUN',preflightPassed:p&&p.passed||0,preflightTotal:p&&p.total||0,contractStatus:c&&c.status||'NOT_RUN',contractPassed:c&&c.passed||0,contractTotal:c&&c.total||0,criticalAssets:43,remoteAssetsExpected:26,beforeAssetsMatched:before&&before.remoteLab?.assetsMatched||0,beforeMismatchCount:before&&before.remoteLab?.mismatchCount??26,beforeMismatchPaths:before&&before.remoteLab?.mismatchPaths||[],beforeRemoteParity:!!(before&&before.remoteLab?.remoteParity),afterAssetsMatched:after&&after.remoteLab?.assetsMatched||0,afterMismatchCount:after&&after.remoteLab?.mismatchCount??26,afterRemoteParity:!!(after&&after.remoteLab?.remoteParity),hostingDeployExecuted:!!dep,hostingDeployExecutions:dep?1:0,secretsUsed:!!dep,firestoreRead:false,firestoreWrites:0,operationalWrites:0,runtimeSmoke:false,browser:false,functionsDeploy:false,rulesDeploy:false,production:false,mergeMain:false,policies:false,pólizas:false,visualReview:false,containsPII:false,containsSecrets:false,approvalReadyForRuntimeSmoke:mode==='request'&&ok,runtimeSmokeAuthorized:false};
          fs.writeFileSync(path.join(dir,'m5-lab-hosting-delivery-530-summary.json'),JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Validar cierre esperado
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then
            jq -e '.ok==true and .status=="M5_LAB_HOSTING_530_DELIVERED_AND_26_OF_26_VERIFIED" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssetsExpected==26 and .afterAssetsMatched==26 and .afterMismatchCount==0 and .afterRemoteParity==true and .hostingDeployExecuted==true and .hostingDeployExecutions==1 and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeSmoke==false and .browser==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .policies==false and .pólizas==false and .visualReview==false and .containsPII==false and .containsSecrets==false' "$ORBIT360_EVIDENCE_DIR/m5-lab-hosting-delivery-530-summary.json" >/dev/null
          else
            jq -e '.ok==true and (.status=="M5_LAB_HOSTING_530_PACKAGE_PASS" or .status=="M5_LAB_HOSTING_530_PACKAGE_ALREADY_PARITY") and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==43 and .remoteAssetsExpected==26 and .hostingDeployExecuted==false and .hostingDeployExecutions==0 and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeSmoke==false and .browser==false' "$ORBIT360_EVIDENCE_DIR/m5-lab-hosting-delivery-530-summary.json" >/dev/null
          fi

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-lab-hosting-530-${{ steps.mode.outputs.value }}-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-lab-hosting-delivery-530-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest-530.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-530-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-530-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-lab-hosting-delivery-530-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-lab-hosting-delivery-530-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.30 Hosting LAB failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true){state='success';description=s.mode==='request'?'M5 Hosting LAB delivered; parity 26/26':(s.status==='M5_LAB_HOSTING_530_PACKAGE_ALREADY_PARITY'?'M5 package: LAB already 26/26':'M5 Hosting LAB package verified');}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-lab-hosting-delivery-530',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-${RUNNER_TEMP}/orbit360-m5-hosting-lab-530.json}"
