name: CotComp S4.42 SubmitHandoff read-only diagnostic

on:
  push:
    branches:
      - ays/cotcomp-public-bridge-s47-20260929
    paths:
      - '.github/cotcomp-lab-intents/s442-submit-diagnostic.json'

permissions:
  contents: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify read-only diagnostic intent
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .authorization == "READ_ONLY_S442_SUBMIT_DIAGNOSTIC" and
            .projectId == "ays-orbit-360-lab" and
            .configWrites == false and
            .appDataWrites == false and
            .deploy == false and
            .production == false
          ' .github/cotcomp-lab-intents/s442-submit-diagnostic.json >/dev/null

      - name: Prepare LAB credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s442diag"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s442diag/firebase.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          test "$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Read CotComp SubmitHandoff logs
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.32.0
          set +e
          firebase functions:log             --project "$COTCOMP_PROJECT_ID"             --only cotcompSubmitHandoff             --lines 100 > "$RUNNER_TEMP/s442diag/raw.log" 2>&1
          STATUS=$?
          set -e
          node <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/s442diag/raw.log';
          let s=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'';
          s=s
            .replace(/[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}/g,'[REDACTED_JWT]')
            .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/gi,'[REDACTED_UUID]')
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,'[REDACTED_EMAIL]')
            .replace(/\+?\d[\d\s().-]{7,}\d/g,'[REDACTED_PHONE]');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s442diag/S442_SUBMIT_DIAGNOSTIC_SANITIZED.log',s);
          NODE
          rm -f "$RUNNER_TEMP/s442diag/raw.log"
          echo "firebase_log_exit=$STATUS" > "$RUNNER_TEMP/s442diag/status.txt"

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s442-submit-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s442diag/S442_SUBMIT_DIAGNOSTIC_SANITIZED.log
            ${{ runner.temp }}/s442diag/status.txt
          if-no-files-found: error
          retention-days: 14
