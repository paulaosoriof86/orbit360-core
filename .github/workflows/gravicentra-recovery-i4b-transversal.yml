name: Gravicentra Recovery I4B Transversal Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-recovery-i4b-transversal.yml
      - tools/gravicentra-i4b-transversal-v2.mjs

permissions:
  contents: read

concurrency:
  group: gravicentra-recovery-i4b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  i4b-authoritative:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout authoritative Recovery tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fail closed on canonical governance plus I4B authority on the same HEAD
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          test "$(jq -r '.status' artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json)" = "I4B_IN_PROGRESS"
          node --check tools/gravicentra-governance-preflight-v1.mjs
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i4b
          node --check tools/gravicentra-i4b-transversal-v2.mjs

      - name: Install I4B browser dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - id: matrix
        name: Execute complete fail-at-end role x viewport x module relationship matrix
        env:
          I4B_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4b-evidence
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set +e
          mkdir -p "$I4B_EVIDENCE_DIR"
          node tools/gravicentra-i4b-transversal-v2.mjs
          RC=$?
          set -e
          echo "matrix_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "I4B_MATRIX_EXECUTION_RC=$RC"
          exit 0

      - name: Preserve complete I4B evidence before adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4b-transversal-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4b-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Assert no deployment path exists in I4B executor
        if: always()
        run: |
          set -euo pipefail
          ! grep -Eiq 'firebase[.]cmd[[:space:]]+deploy|firebase[[:space:]]+deploy' .github/workflows/gravicentra-recovery-i4b-transversal.yml
          echo productionTouched=false
          echo dataTouched=false
          echo writesExecuted=0

      - name: Fail closed once after all independent I4B checks were collected
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/gravicentra-i4b-evidence/i4b-transversal-matrix-v2.json
        run: |
          set -euo pipefail
          test -f "$EVIDENCE"
          test "$(jq -r '.schemaVersion' "$EVIDENCE")" = "gravicentra-i4b-transversal-matrix-v2"
          test "$(jq -r '.gate' "$EVIDENCE")" = "I4B"
          test "$(jq -r '.failAtEnd' "$EVIDENCE")" = "true"
          test "$(jq -r '.expectedContextCount' "$EVIDENCE")" = "15"
          test "$(jq -r '.productionTouched' "$EVIDENCE")" = "false"
          test "$(jq -r '.dataTouched' "$EVIDENCE")" = "false"
          test "$(jq -r '.writesExecuted' "$EVIDENCE")" = "0"
          test "$(jq -r '.sourceSha' "$EVIDENCE")" = "$SOURCE_SHA"
          test "$(jq -r '.buildId' "$EVIDENCE")" = "$BUILD_ID"
          test "$(jq -r '.previewUrl' "$EVIDENCE")" = "$PREVIEW_URL"
          test "$(jq -r '.status' "$EVIDENCE")" = "I4B_MATRIX_PASS"
          test "$(jq -r '.contextsPass' "$EVIDENCE")" = "15"
          test "$(jq -r '.contextsFail' "$EVIDENCE")" = "0"
          test "$(jq -r '.uniqueFailures | length' "$EVIDENCE")" = "0"
          echo I4B_TRANSVERSAL_MATRIX=PHYSICAL_PASS_PENDING_GOVERNANCE_SEAL
