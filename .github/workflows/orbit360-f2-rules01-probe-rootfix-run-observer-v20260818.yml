name: Orbit360 F2 RULES01 Probe Rootfix Run Observer 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f2-rules01-probe-rootfix-run-observer-v20260818.yml'
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      TARGET_SHA: 702c3fd8873d5a5db503a694ad4ac5131b90c803
      TARGET_WORKFLOW_NAME: Orbit360 F2 RULES01 Probe Validator Rootfix Source Only 20260818
      EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/f2-rules01-probe-rootfix-run-observer-v20260818.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - name: Observe exact rootfix run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESP="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
          FOUND="$(printf '%s' "$RESP" | jq --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '[.workflow_runs[] | select(.head_sha==$sha and .name==$name and .event=="push")]')"
          COUNT="$(printf '%s' "$FOUND" | jq 'length')"
          if [ "$COUNT" -eq 1 ]; then
            printf '%s' "$FOUND" | jq --arg observer "$GITHUB_RUN_ID" --arg target "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '{schemaVersion:"orbit360-f2-rules01-probe-rootfix-run-observer-v1",ok:(length==1 and .[0].status=="completed"),status:(if length==1 and .[0].status=="completed" then "TERMINAL_OBSERVED" else "NON_TERMINAL" end),uniquenessCount:length,observerRunId:$observer,targetSha:$target,targetWorkflowName:$name,run:(.[0]|{id,status,conclusion,run_attempt,head_sha,head_branch,event,name,path,created_at,updated_at}),secretAccess:false,firestoreRead:false,rulesDeploy:false,cloudMutation:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          else
            jq -n --arg observer "$GITHUB_RUN_ID" --arg target "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" --argjson count "$COUNT" '{schemaVersion:"orbit360-f2-rules01-probe-rootfix-run-observer-v1",ok:false,status:"TARGET_RUN_NOT_UNIQUE",uniquenessCount:$count,observerRunId:$observer,targetSha:$target,targetWorkflowName:$name,secretAccess:false,firestoreRead:false,rulesDeploy:false,cloudMutation:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          fi
          cat "$EVIDENCE"
      - name: Persist observer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-actions-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$EVIDENCE"
          git commit -m 'docs(gate): persist RULES01 probe rootfix observer [skip ci]'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
