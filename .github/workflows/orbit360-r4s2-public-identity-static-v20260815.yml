name: Orbit360 R4S2 Public Identity Static 20260815

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4s2-public-identity-static-v20260815.yml'

permissions:
  contents: read

concurrency:
  group: orbit360-r4s2-public-identity-static-v20260815
  cancel-in-progress: false

env:
  TARGET: https://app.aysseguros.com
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_INDEX_SHA: 125b24a3fc215a368a7183a107cd55eb5a6332fc8a7f8354ed94e3169340ec4e
  EXPECTED_MANIFEST_SHA: 444d6eaa85c782cf4b3c34961159bebad0b3cf67ea6b76de163ec68fbe0b5a6a
  EXPECTED_ACCESS_SHA: 8976ab8032f210a0f93d79f4ace037ec3b3e8fe8c1ac9e1f5a0eadd8d134fb3f
  EXPECTED_AUTH_SHA: d0bb399fe0e1dd102a03950673044eda5bc8d181e4e98cf477d22d141aa7b3a8
  EXPECTED_QUERIES_SHA: 1a37503507cd87be00314076e2ccf1b61d29cfbed9d3961486ade96fbab40051
  EXPECTED_OWNER_SHA: 3323f09b812d6e3accc8cd151fe28ec3fab2fffa6c41ad622a2f8a147046887b

jobs:
  static-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical gate before any production observation
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Verify exact public R4S2 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r4s2-public" "$EVIDENCE_DIR"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142.0.0.0 Safari/537.36'
          fetch_exact() {
            local rel="$1" out="$2"
            curl --http1.1 -L --fail --silent --show-error --connect-timeout 15 --max-time 45 \
              -A "$UA" -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
              "$TARGET/$rel?orbit360_r4s2_verify=${GITHUB_RUN_ID}" -o "$out"
          }
          fetch_exact 'index.html' "$RUNNER_TEMP/r4s2-public/index.html"
          fetch_exact 'orbit360-package-manifest.json' "$RUNNER_TEMP/r4s2-public/manifest.json"
          fetch_exact 'core/access-scope.js' "$RUNNER_TEMP/r4s2-public/access-scope.js"
          fetch_exact 'core/auth-product-runtime-p0.js' "$RUNNER_TEMP/r4s2-public/auth-product-runtime-p0.js"
          fetch_exact 'core/queries.js' "$RUNNER_TEMP/r4s2-public/queries.js"
          fetch_exact 'modules/policy-receipts-v1199-detail-guard.js' "$RUNNER_TEMP/r4s2-public/policy-receipts-v1199-detail-guard.js"

          INDEX_SHA=$(sha256sum "$RUNNER_TEMP/r4s2-public/index.html" | awk '{print $1}')
          MANIFEST_SHA=$(sha256sum "$RUNNER_TEMP/r4s2-public/manifest.json" | awk '{print $1}')
          ACCESS_SHA=$(sha256sum "$RUNNER_TEMP/r4s2-public/access-scope.js" | awk '{print $1}')
          AUTH_SHA=$(sha256sum "$RUNNER_TEMP/r4s2-public/auth-product-runtime-p0.js" | awk '{print $1}')
          QUERIES_SHA=$(sha256sum "$RUNNER_TEMP/r4s2-public/queries.js" | awk '{print $1}')
          OWNER_SHA=$(sha256sum "$RUNNER_TEMP/r4s2-public/policy-receipts-v1199-detail-guard.js" | awk '{print $1}')
          MANIFEST_STATUS=$(jq -r '.status // "UNKNOWN"' "$RUNNER_TEMP/r4s2-public/manifest.json" 2>/dev/null || printf 'INVALID_JSON')
          MANIFEST_SOURCE=$(jq -r '.sourceHead // "UNKNOWN"' "$RUNNER_TEMP/r4s2-public/manifest.json" 2>/dev/null || printf 'INVALID_JSON')
          FILE_COUNT=$(jq -r '.fileCount // -1' "$RUNNER_TEMP/r4s2-public/manifest.json" 2>/dev/null || printf -- '-1')

          CLASSIFICATION='ENVIRONMENT_FAILURE/R4S2_PUBLIC_IDENTITY_MISMATCH'
          STATUS='R4S2_PUBLIC_IDENTITY_STATIC_FAIL'
          OK=false
          if [ "$MANIFEST_STATUS" = 'FASE_A_PRODUCT_R4S1_MINIMAL_SUCCESSOR_CERTIFIED' ]; then
            CLASSIFICATION='ENVIRONMENT_FAILURE/R4S2_NOT_PUBLISHED_R4S1_STILL_LIVE'
          fi
          if [ "$INDEX_SHA" = "$EXPECTED_INDEX_SHA" ] && \
             [ "$MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA" ] && \
             [ "$ACCESS_SHA" = "$EXPECTED_ACCESS_SHA" ] && \
             [ "$AUTH_SHA" = "$EXPECTED_AUTH_SHA" ] && \
             [ "$QUERIES_SHA" = "$EXPECTED_QUERIES_SHA" ] && \
             [ "$OWNER_SHA" = "$EXPECTED_OWNER_SHA" ] && \
             [ "$MANIFEST_STATUS" = 'FASE_A_PRODUCT_R4S2_MINIMAL_SUCCESSOR_CERTIFIED' ] && \
             [ "$MANIFEST_SOURCE" = '47249fd4d6032a2f4c09f6fbd3460d3804c199da' ] && \
             [ "$FILE_COUNT" = '194' ]; then
            CLASSIFICATION='PASS'
            STATUS='R4S2_PUBLIC_IDENTITY_STATIC_PASS'
            OK=true
          fi

          jq -n \
            --argjson ok "$OK" \
            --arg status "$STATUS" \
            --arg classification "$CLASSIFICATION" \
            --arg manifestStatus "$MANIFEST_STATUS" \
            --arg manifestSourceHead "$MANIFEST_SOURCE" \
            --argjson fileCount "$FILE_COUNT" \
            --arg indexSha "$INDEX_SHA" \
            --arg manifestSha "$MANIFEST_SHA" \
            --arg accessSha "$ACCESS_SHA" \
            --arg authSha "$AUTH_SHA" \
            --arg queriesSha "$QUERIES_SHA" \
            --arg ownerSha "$OWNER_SHA" \
            '{ok:$ok,status:$status,classification:$classification,target:"https://app.aysseguros.com",manifestStatus:$manifestStatus,manifestSourceHead:$manifestSourceHead,fileCount:$fileCount,indexSha256:$indexSha,manifestSha256:$manifestSha,accessScopeSha256:$accessSha,authProductSha256:$authSha,queriesSha256:$queriesSha,policyReceiptsOwnerSha256:$ownerSha,expected:{manifestStatus:"FASE_A_PRODUCT_R4S2_MINIMAL_SUCCESSOR_CERTIFIED",sourceHead:"47249fd4d6032a2f4c09f6fbd3460d3804c199da",fileCount:194,indexSha256:env.EXPECTED_INDEX_SHA,manifestSha256:env.EXPECTED_MANIFEST_SHA,accessScopeSha256:env.EXPECTED_ACCESS_SHA,authProductSha256:env.EXPECTED_AUTH_SHA,queriesSha256:env.EXPECTED_QUERIES_SHA,policyReceiptsOwnerSha256:env.EXPECTED_OWNER_SHA},secretAccess:false,dataAccess:false,runtimeExecuted:false,browserExecuted:false,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,packageRebuilt:false,productionMutation:false,containsPII:false,containsSecrets:false}' \
            > "$EVIDENCE_DIR/r4s2-public-identity-static-v20260815.json"

          jq -e '.ok==true and .status=="R4S2_PUBLIC_IDENTITY_STATIC_PASS" and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .productionMutation==false' "$EVIDENCE_DIR/r4s2-public-identity-static-v20260815.json" >/dev/null
          jq -e '.schemaVersion=="orbit360-fase-a-product-package-manifest-v1" and .status=="FASE_A_PRODUCT_R4S2_MINIMAL_SUCCESSOR_CERTIFIED" and .sourceHead=="47249fd4d6032a2f4c09f6fbd3460d3804c199da" and .fileCount==194 and .unchangedFileCount==192 and (.deltaFiles==["core/queries.js","modules/policy-receipts-v1199-detail-guard.js"]) and ([.files[]|select(.path=="core/queries.js" and .bytes==7722 and .sha256=="1a37503507cd87be00314076e2ccf1b61d29cfbed9d3961486ade96fbab40051")]|length)==1 and ([.files[]|select(.path=="modules/policy-receipts-v1199-detail-guard.js" and .bytes==28706 and .sha256=="3323f09b812d6e3accc8cd151fe28ec3fab2fffa6c41ad622a2f8a147046887b")]|length)==1' "$RUNNER_TEMP/r4s2-public/manifest.json" >/dev/null
      - name: Canonical gate after exact public identity PASS
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s2-public-identity-static-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s2-public-identity-static-v20260815.json
          if-no-files-found: warn
          retention-days: 14
