name: Orbit360 Current Documentation Coherence 20260820

on:
  pull_request:
    branches: [main]
    paths:
      - 'orbit360-platform/docs/orbit360-live-state-v1.json'
      - 'orbit360-platform/docs/ORBIT360-CURRENT-DOCUMENTATION-INDEX-v1.json'
      - 'orbit360-platform/docs/CHECKPOINT-F2-REQUEST12-CONSUMED-ROOTCAUSE-REOPENED-DOCSYNC-HARDENED-20260820.md'
      - '.github/orbit360-requests/f2-productive-acceptance-runtime-browser-readonly-runbound-*.json'
      - '.github/orbit360-authorizations/f2-productive-acceptance-runtime-browser-readonly-request*.json'
      - 'tools/orbit360-validar-current-documentation-coherence-v20260820.mjs'
      - '.github/workflows/orbit360-current-documentation-coherence-v20260820.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate current documentation coherence
        run: node tools/orbit360-validar-current-documentation-coherence-v20260820.mjs
