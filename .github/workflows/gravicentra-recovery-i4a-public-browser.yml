name: Gravicentra Recovery I4A Browser QA

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-recovery-i4a-public-browser.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: d8e5ce337af95761304721de8af2754b7c1d1c41
  BUILD_ID: gi-i3-d8e5ce337af9-57f234755dc1
  PREVIEW_URL: https://ays-orbit-360-lab--gi-i3-33683360570-d4hmi456.web.app

jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout QA executor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium QA dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Execute public browser smoke against exact Preview
        env:
          I4A_PUBLIC_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-public-evidence
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-i4a-public-browser.mjs
      - name: Publish evidence summary
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/gravicentra-i4a-public-evidence/i4a-public-browser.json
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Gravicentra Insurance — I4A public browser'
            echo "- Source under test: \`$SOURCE_SHA\`"
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Preview: $PREVIEW_URL"
            if [ -f "$EVIDENCE" ]; then
              echo "- Status: \`$(jq -r '.status' "$EVIDENCE")\`"
              echo "- DOMContentLoaded ms: \`$(jq -r '.checks.domContentLoadedMs // "n/a"' "$EVIDENCE")\`"
              echo "- Login visible ms: \`$(jq -r '.checks.loginVisibleMs // "n/a"' "$EVIDENCE")\`"
              echo "- Heartbeat ms: \`$(jq -r '.checks.heartbeatMs // "n/a"' "$EVIDENCE")\`"
              echo "- Authenticated: \`$(jq -r '.authenticated' "$EVIDENCE")\`"
              echo "- Production touched: \`$(jq -r '.productionTouched' "$EVIDENCE")\`"
              echo "- Data touched: \`$(jq -r '.dataTouched' "$EVIDENCE")\`"
            else
              echo '- Status: `NO_EVIDENCE_FAIL_CLOSED`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-public-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-public-evidence
          if-no-files-found: warn
          retention-days: 30

  authenticated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout QA executor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Execute authenticated browser QA against exact Preview
        env:
          I4A_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-auth-evidence
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-i4a-authenticated-browser.mjs
      - name: Publish authenticated evidence summary
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/gravicentra-i4a-auth-evidence/i4a-authenticated-browser.json
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Gravicentra Insurance — I4A authenticated browser'
            echo "- Source under test: \`$SOURCE_SHA\`"
            echo "- Build ID: \`$BUILD_ID\`"
            if [ -f "$EVIDENCE" ]; then
              echo "- Status: \`$(jq -r '.status' "$EVIDENCE")\`"
              echo "- Roles available: \`$(jq -r '.coverage.availableRoles | join(",")' "$EVIDENCE")\`"
              echo "- Writes executed: \`$(jq -r '.writesExecuted' "$EVIDENCE")\`"
              echo "- User identities recorded: \`$(jq -r '.userIdentitiesRecorded' "$EVIDENCE")\`"
              echo "- Tokens recorded: \`$(jq -r '.tokensRecorded' "$EVIDENCE")\`"
              echo "- Production touched: \`$(jq -r '.productionTouched' "$EVIDENCE")\`"
              echo "- Data touched: \`$(jq -r '.dataTouched' "$EVIDENCE")\`"
            else
              echo '- Status: `NO_EVIDENCE_FAIL_CLOSED`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-authenticated-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-auth-evidence
          if-no-files-found: warn
          retention-days: 30
