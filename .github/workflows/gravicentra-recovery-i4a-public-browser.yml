name: Gravicentra Recovery I4A Authoritative Preview QA

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - artifacts/orbit360-recovery/release-control/I4A_EXECUTION_INTENT.json

permissions:
  contents: read

concurrency:
  group: gravicentra-recovery-i4a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  i4a-authoritative:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Recovery control plane and committed QA harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: release
        name: Fail closed against canonical CONTROL_PLANE
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-control-plane-guard-v2.mjs --mode=i4a
          node --check tools/gravicentra-i4a-public-browser.mjs
          node --check tools/gravicentra-i4a-bootstrap-diagnostic.mjs
          node --check tools/gravicentra-i4a-runtime-boundary-diagnostic.mjs
          node --check tools/gravicentra-i4a-authenticated-browser-v2.mjs
          node --check tools/gravicentra-i4a-auth-adjudicator-v1.mjs

      - name: Validate non-authoritative execution intent when push-triggered
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='artifacts/orbit360-recovery/release-control/I4A_EXECUTION_INTENT.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const need=(ok,code)=>{if(!ok)throw new Error(code);};
          need(x.schemaVersion==='gravicentra-execution-intent-v1','I4A_INTENT_SCHEMA_INVALID');
          need(x.nonAuthoritative===true,'I4A_INTENT_MUST_BE_NON_AUTHORITATIVE');
          need(x.gate==='I4A','I4A_INTENT_GATE_INVALID');
          need(x.controlPlaneStatusExpected==='I4A_IN_PROGRESS','I4A_INTENT_CONTROL_STATUS_INVALID');
          need(x.certifiedSourceSha===process.env.SOURCE_SHA,'I4A_INTENT_SOURCE_MISMATCH');
          need(x.buildId===process.env.BUILD_ID,'I4A_INTENT_BUILD_MISMATCH');
          need(x.previewUrl===process.env.PREVIEW_URL,'I4A_INTENT_PREVIEW_MISMATCH');
          console.log('I4A_EXECUTION_INTENT=VALID_NON_AUTHORITATIVE_TRIGGER');
          NODE

      - name: Seal committed QA harness identity
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i4a-evidence"
          mkdir -p "$ROOT/meta" "$ROOT/public" "$ROOT/bootstrap" "$ROOT/boundary" "$ROOT/auth"
          HARNESS_BLOB=$(git hash-object tools/gravicentra-i4a-authenticated-browser-v2.mjs)
          ADJUDICATOR_BLOB=$(git hash-object tools/gravicentra-i4a-auth-adjudicator-v1.mjs)
          echo "I4A_HARNESS_BLOB_SHA=$HARNESS_BLOB" >> "$GITHUB_ENV"
          echo "I4A_ADJUDICATOR_BLOB_SHA=$ADJUDICATOR_BLOB" >> "$GITHUB_ENV"
          cp tools/gravicentra-i4a-authenticated-browser-v2.mjs "$ROOT/meta/gravicentra-i4a-authenticated-browser-v2.mjs"
          cp tools/gravicentra-i4a-auth-adjudicator-v1.mjs "$ROOT/meta/gravicentra-i4a-auth-adjudicator-v1.mjs"
          printf '%s\n' "$GITHUB_SHA" > "$ROOT/meta/control-plane-commit.txt"
          printf '%s\n' "$HARNESS_BLOB" > "$ROOT/meta/authenticated-harness-blob.txt"
          printf '%s\n' "$ADJUDICATOR_BLOB" > "$ROOT/meta/auth-adjudicator-blob.txt"
          printf '%s\n' "$SOURCE_SHA" > "$ROOT/meta/source-sha.txt"
          printf '%s\n' "$BUILD_ID" > "$ROOT/meta/build-id.txt"
          printf '%s\n' "$PREVIEW_URL" > "$ROOT/meta/preview-url.txt"

      - name: Install I4A dependencies once
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - id: public
        name: Execute public Preview smoke without short-circuiting later evidence
        env:
          I4A_PUBLIC_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-evidence/public
        run: |
          set +e
          node tools/gravicentra-i4a-public-browser.mjs
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - id: bootstrap
        name: Execute sanitized role hydration diagnostic
        env:
          I4A_DIAG_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-evidence/bootstrap
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set +e
          node tools/gravicentra-i4a-bootstrap-diagnostic.mjs
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - id: boundary
        name: Execute sanitized runtime boundary diagnostic
        env:
          I4A_BOUNDARY_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-evidence/boundary
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set +e
          node tools/gravicentra-i4a-runtime-boundary-diagnostic.mjs
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - id: auth
        name: Execute committed authenticated module discriminants
        env:
          I4A_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-evidence/auth
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set +e
          node tools/gravicentra-i4a-authenticated-browser-v2.mjs
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - id: adjudicated
        name: Adjudicate only frozen-contract-safe transient validator findings
        if: always()
        env:
          I4A_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-evidence/auth
        run: |
          set +e
          node tools/gravicentra-i4a-auth-adjudicator-v1.mjs
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seal consolidated I4A execution manifest
        if: always()
        env:
          PUBLIC_RC: ${{ steps.public.outputs.rc }}
          BOOTSTRAP_RC: ${{ steps.bootstrap.outputs.rc }}
          BOUNDARY_RC: ${{ steps.boundary.outputs.rc }}
          AUTH_RAW_RC: ${{ steps.auth.outputs.rc }}
          AUTH_ADJUDICATED_RC: ${{ steps.adjudicated.outputs.rc }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i4a-evidence"; export ROOT
          python3 - <<'PY'
          import json,os
          root=os.environ['ROOT']
          def rc(name):
              try:return int(os.environ.get(name,'99'))
              except:return 99
          manifest={
            'schemaVersion':'gravicentra-i4a-consolidated-execution-v2',
            'gate':'I4A','controlPlaneCommit':os.environ['GITHUB_SHA'],
            'sourceSha':os.environ['SOURCE_SHA'],'buildId':os.environ['BUILD_ID'],'previewUrl':os.environ['PREVIEW_URL'],
            'qaHarnessBlobSha':os.environ['I4A_HARNESS_BLOB_SHA'],'qaAdjudicatorBlobSha':os.environ['I4A_ADJUDICATOR_BLOB_SHA'],'qaHarnessPatchedAtRuntime':False,
            'results':{'public':rc('PUBLIC_RC'),'bootstrap':rc('BOOTSTRAP_RC'),'boundary':rc('BOUNDARY_RC'),'authenticatedRaw':rc('AUTH_RAW_RC'),'authenticatedAdjudicated':rc('AUTH_ADJUDICATED_RC')},
            'productionTouched':False,'dataTouched':False,'writesExpected':0
          }
          manifest['authoritativePass']=all(manifest['results'][k]==0 for k in ['public','bootstrap','boundary','authenticatedAdjudicated'])
          p=os.path.join(root,'i4a-execution-manifest.json')
          open(p,'w').write(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('I4A_CONSOLIDATED_PROBES='+json.dumps(manifest['results'],sort_keys=True))
          PY

      - name: Publish consolidated summary
        if: always()
        env:
          MANIFEST: ${{ runner.temp }}/gravicentra-i4a-evidence/i4a-execution-manifest.json
        run: |
          {
            echo '## Gravicentra Insurance — I4A authoritative Preview QA'
            echo "- Source from CONTROL_PLANE: \`$SOURCE_SHA\`"
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Preview: $PREVIEW_URL"
            echo "- QA harness blob: \`$I4A_HARNESS_BLOB_SHA\`"
            echo "- QA adjudicator blob: \`$I4A_ADJUDICATOR_BLOB_SHA\`"
            echo '- Runtime QA self-patch: `false`'
            if [ -f "$MANIFEST" ]; then
              echo "- Public rc: \`$(jq -r '.results.public' "$MANIFEST")\`"
              echo "- Bootstrap rc: \`$(jq -r '.results.bootstrap' "$MANIFEST")\`"
              echo "- Boundary rc: \`$(jq -r '.results.boundary' "$MANIFEST")\`"
              echo "- Authenticated raw rc: \`$(jq -r '.results.authenticatedRaw' "$MANIFEST")\`"
              echo "- Authenticated adjudicated rc: \`$(jq -r '.results.authenticatedAdjudicated' "$MANIFEST")\`"
            fi
            echo '- Production touched by executor: `false`'
            echo '- Data writes by executor: `0`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve all I4A evidence in one artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-authoritative-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed only after all probe evidence was collected
        if: always()
        env:
          PUBLIC_RC: ${{ steps.public.outputs.rc }}
          BOOTSTRAP_RC: ${{ steps.bootstrap.outputs.rc }}
          BOUNDARY_RC: ${{ steps.boundary.outputs.rc }}
          AUTH_ADJUDICATED_RC: ${{ steps.adjudicated.outputs.rc }}
        run: |
          set -euo pipefail
          test "${PUBLIC_RC:-99}" = 0
          test "${BOOTSTRAP_RC:-99}" = 0
          test "${BOUNDARY_RC:-99}" = 0
          test "${AUTH_ADJUDICATED_RC:-99}" = 0
          echo I4A_AUTHORITATIVE_EXECUTOR=PASS
