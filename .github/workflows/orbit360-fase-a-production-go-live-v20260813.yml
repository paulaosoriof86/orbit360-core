name: Orbit360 Fase A Production Go Live 20260813

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-fase-a-production-go-live-v20260813.yml'
      - '.github/orbit360-resume/fase-a-go-live-production-20260813-validator-stale.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-fase-a-production-go-live-v20260813
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_SOURCE_HEAD: 3a61564d102e45a871b249ae96f93c3836906f1d
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/fase-a-go-live-production-20260812-authorization.json
  ORBIT360_RESUME_FILE: .github/orbit360-resume/fase-a-go-live-production-20260813-validator-stale.json
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_PRODUCT_URL: https://ays-orbit-360-lab.web.app
  ORBIT360_PRODUCT_ARTIFACT: orbit360-artifacts/fase-a-product
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  source_preflight:
    if: contains(github.event.head_commit.message, 'bind current Fase A production baseline')
    name: Source-only validation of current Fase A production macro
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete production control-plane source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          git merge-base --is-ancestor "$ORBIT360_SOURCE_HEAD" HEAD
          node --check tools/orbit360-fase-a-production-request-resume-guard-v20260813.mjs
          node --check tools/orbit360-fase-a-hosting-release-helper-v20260813.mjs
          node --check tools/orbit360-fase-a-product-data-snapshot-readonly-v20260813.mjs
          node --check tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          node --check tools/orbit360-fase-a-product-browser-smoke-v20260813.mjs
          node --check tools/orbit360-fase-a-product-integrity-v20260813.mjs
          node --check tools/orbit360-fase-a-production-finalize-v20260813.mjs
      - name: Canonical source gate in isolated source context
        shell: bash
        run: |
          set -euo pipefail
          env -u ORBIT360_REQUEST_FILE ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_FASE_A_OPS_LEADS_CRM" and .failed==0 and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .ok==true' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Validate exact current deployable artifact and stale-baseline removal
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.hosting.public' firebase.product-go-live.json)" = "$ORBIT360_PRODUCT_ARTIFACT"
          for f in index.html product-runtime-config.js core/auth-product-runtime-p0.js core/backend-product-readonly-bootstrap-p0.js data/store-firestore-product-readonly-p0.js modules/cliente360.js modules/aseguradoras.js modules/ops.js modules/leads.js; do test -f "$ORBIT360_PRODUCT_ARTIFACT/$f"; done
          ! grep -Eqi 'backend-lab-|store-firestore-lab|__ORBIT_LAB_SAFE_MODE__|orbitBackend=firestore-lab' "$ORBIT360_PRODUCT_ARTIFACT/index.html"
          grep -q 'clientes:430' tools/orbit360-fase-a-product-data-snapshot-readonly-v20260813.mjs
          grep -q 'aseguradoras:30' tools/orbit360-fase-a-product-data-snapshot-readonly-v20260813.mjs
          grep -q 'minimumMemberships:7' tools/orbit360-fase-a-product-data-snapshot-readonly-v20260813.mjs
          grep -q 'clientes:430' tools/orbit360-fase-a-product-browser-smoke-v20260813.mjs
          grep -q 'aseguradoras:30' tools/orbit360-fase-a-product-browser-smoke-v20260813.mjs
          mkdir -p "$EVIDENCE_DIR"
          jq -n --arg source "$ORBIT360_SOURCE_HEAD" --arg head "$GITHUB_SHA" '{ok:true,status:"FASE_A_CURRENT_PRODUCTION_BASELINE_SOURCE_PASS",sourceHead:$source,controlPlaneHead:$head,currentOperationalBaseline:{clientes:430,aseguradoras:30,asesores:7,minimumMemberships:7},secretAccess:false,browserExecuted:false,deployExecuted:false,productionTouched:false}' > "$EVIDENCE_DIR/fase-a-production-macro-source-v20260813.json"
      - uses: actions/upload-artifact@v4
        with:
          name: orbit360-fase-a-production-current-baseline-source-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-production-macro-source-v20260813.json
          retention-days: 14

  production_go_live:
    if: contains(github.event.head_commit.message, 'resume Fase A go-live after current baseline closure')
    name: Backup · single Hosting deploy · current live browser · integrity · rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable request and resume evidence before secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          node tools/orbit360-fase-a-production-request-resume-guard-v20260813.mjs
      - name: Canonical Fase A source closure gate
        shell: bash
        run: |
          set -euo pipefail
          env -u ORBIT360_REQUEST_FILE ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_FASE_A_OPS_LEADS_CRM" and .failed==0 and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .ok==true' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          test "$(jq -r '.hosting.public' firebase.product-go-live.json)" = "$ORBIT360_PRODUCT_ARTIFACT"
          ! grep -Eqi 'backend-lab-|store-firestore-lab|__ORBIT_LAB_SAFE_MODE__|orbitBackend=firestore-lab' "$ORBIT360_PRODUCT_ARTIFACT/index.html"
      - name: Install runtime tools after gate PASS
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Bind existing production identity and credentials
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_EXISTING_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_EXISTING_LOGIN_PASSWORD} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-fase-a-product.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PRODUCT_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_SMOKE_PASSWORD=$ORBIT360_EXISTING_LOGIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Current production baseline snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-fase-a-product-data-snapshot-readonly-v20260813.mjs before
          jq -e '.ok==true and .counts.clientes==430 and .counts.aseguradoras==30 and .counts.asesoresFuente==7 and .counts.memberships>=7 and .counts.config==1 and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/fase-a-product-data-before-v20260813.json" >/dev/null
      - name: Resolve one eligible existing smoke identity read-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .requiredRolesPresent==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-smoke-identity-summary.json" >/dev/null
      - name: Backup current Hosting release
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-fase-a-hosting-release-helper-v20260813.mjs before
          jq -e '.ok==true and .checks.hostingReadable==true and .checks.currentReleaseAvailable==true and .checks.rollbackAnchorAvailable==true and .checks.publicReachable==true and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/fase-a-product-hosting-before-v20260813.json" >/dev/null
      - name: Execute single authorized Hosting deploy
        id: deploy
        shell: bash
        run: |
          set +e
          firebase deploy --only hosting --project "$ORBIT360_PRODUCT_PROJECT_ID" --config firebase.product-go-live.json --non-interactive --json > "$EVIDENCE_DIR/fase-a-product-deploy-raw-v20260813.json" 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify exact deployed artifact hashes
        id: hosting_smoke
        if: steps.deploy.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node tools/orbit360-fase-a-hosting-release-helper-v20260813.mjs smoke
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Execute current real browser smoke in three role views
        id: browser
        if: steps.deploy.outputs.exit_code == '0' && steps.hosting_smoke.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          node tools/orbit360-fase-a-product-browser-smoke-v20260813.mjs
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Snapshot current data after deploy
        id: snapshot_after
        if: steps.deploy.outcome != 'skipped'
        shell: bash
        run: |
          set +e
          node tools/orbit360-fase-a-product-data-snapshot-readonly-v20260813.mjs after
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify before-after integrity
        id: integrity
        if: steps.deploy.outcome != 'skipped'
        shell: bash
        run: |
          set +e
          node tools/orbit360-fase-a-product-integrity-v20260813.mjs
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Exact rollback on any forward failure
        id: rollback
        if: always() && steps.deploy.outcome != 'skipped' && (steps.deploy.outputs.exit_code != '0' || steps.hosting_smoke.outputs.exit_code != '0' || steps.browser.outputs.exit_code != '0' || steps.snapshot_after.outputs.exit_code != '0' || steps.integrity.outputs.exit_code != '0')
        shell: bash
        run: |
          set +e
          node tools/orbit360-fase-a-hosting-release-helper-v20260813.mjs rollback
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Close observable one-shot decision
        if: always()
        env:
          DEPLOY_CODE: ${{ steps.deploy.outputs.exit_code }}
          HOSTING_CODE: ${{ steps.hosting_smoke.outputs.exit_code }}
          BROWSER_CODE: ${{ steps.browser.outputs.exit_code }}
          SNAPSHOT_CODE: ${{ steps.snapshot_after.outputs.exit_code }}
          INTEGRITY_CODE: ${{ steps.integrity.outputs.exit_code }}
          ROLLBACK_CODE: ${{ steps.rollback.outputs.exit_code }}
        shell: bash
        run: node tools/orbit360-fase-a-production-finalize-v20260813.mjs
      - name: Upload sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-fase-a-production-go-live-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-data-before-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/m6-product-smoke-identity-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-hosting-before-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-hosting-smoke-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-browser-smoke-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-data-after-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-integrity-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-product-hosting-rollback-v20260813.json
            orbit360-platform/runtime-gate-crm-v20260716/fase-a-production-go-live-final-v20260813.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish observable commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let state='failure',description='Fase A production go-live without final evidence';
            try{const f=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/fase-a-production-go-live-final-v20260813.json','utf8'));if(f.decision==='GO_LIVE_PASS'){state='success';description='Orbit360 Fase A production live · browser and integrity PASS';}else description=`Orbit360 Fase A: ${f.decision}`;}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/fase-a-production-go-live-20260813',description:description.slice(0,140),target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Cleanup temporary credential file
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Require production PASS
        if: always()
        shell: bash
        run: jq -e '.decision=="GO_LIVE_PASS" and .productionMaintained==true and .rollbackExecuted==false and .deployCount==1 and .ok==true' "$EVIDENCE_DIR/fase-a-production-go-live-final-v20260813.json" >/dev/null
