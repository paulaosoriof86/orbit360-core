name: Orbit 360 · Validar transición lifecycle y consumo STOP · source-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-lifecycle-transition-stop-consumption:
    if: github.head_ref == 'ays/sourcefix-v13-lifecycle-transition-and-stop-consumption-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact sourcefix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate two phase control-plane source-only
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs
          node --check tools/orbit360-transition-visual-matrix-lifecycle-source-to-runtime-v20260807.mjs
          node --check tools/orbit360-consume-visual-matrix-request-on-stop-v20260807.mjs
          node --check tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node --check tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node tools/orbit360-test-request-lifecycle-baseline-contract-v20260806.mjs
          node tools/orbit360-test-preflight-portable-source-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs
          node tools/orbit360-test-capture-watchdog-source-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs

      - name: Assert live control-plane remains STOP and rootfix is aligned
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          const lifecycle = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const overlay = JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          const workflow = fs.readFileSync('.github/workflows/orbit360-claude-paquete-reconciliado-v1205.yml','utf8');
          const router = fs.readFileSync('tools/orbit360-validar-gate-contracts-v20260717.mjs','utf8');
          const engine = fs.readFileSync('tools/orbit360-validar-gate-contracts-engine-visual-matrix-corrected-post-auth-lab-v20260805.mjs','utf8');
          const guard = fs.readFileSync('tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs','utf8');
          const baseline = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/request-lifecycle-baseline-contract-source-test-sanitized-v20260806.json','utf8'));
          const phase = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/preflight-portable-source-test-sanitized-v20260806.json','utf8'));
          const RUNTIME_PHASE = 'VISUAL_MATRIX_CORRECTED_POST_AUTH_LAB_EXECUTION';
          const RUNTIME_STATUS = 'AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST';
          const ok =
            request.consumed === true && request.allowedExecutions === 0 && request.authorizationFrozen === true && request.replayAllowed === false &&
            lifecycle.stopRetryActive === true && lifecycle.allowedExecutions === 0 && lifecycle.executionAuthorized === false &&
            overlay.stopRetryActive === true && overlay.runtimeAllowed === false && overlay.hostingAllowed === false &&
            workflow.includes('ORBIT360_EXPECTED_REQUEST_VERSION: NONE_PENDING_FRESH_AUTHORIZATION') &&
            router.includes(RUNTIME_PHASE) && engine.includes(RUNTIME_PHASE) && engine.includes(RUNTIME_STATUS) && guard.includes(RUNTIME_PHASE) && guard.includes(RUNTIME_STATUS) &&
            baseline.status === 'PASS_REQUEST_LIFECYCLE_BASELINE_CONTRACT_SOURCE_ONLY' && baseline.failed === 0 && baseline.ok === true && baseline.runtimePendingLifecycleRequired === true && baseline.sourceOnlyLifecycleAcceptedForRuntime === false &&
            phase.status === 'PASS_SOURCE_ONLY_TWO_PHASE_LIFECYCLE_PREFLIGHT_VALIDATOR' && phase.failed === 0 && phase.ok === true;
          if (!ok) process.exit(41);
          console.log(JSON.stringify({
            status:'PASS_TWO_PHASE_LIFECYCLE_AND_STOP_CONSUMPTION_SOURCE_ONLY',
            requestLifecycleChecks:baseline.passed,
            preflightChecks:phase.passed,
            liveRequestConsumed:true,
            liveRelayFailClosed:true,
            runtimeExecuted:false,
            secretsRead:false,
            firebaseAccess:false,
            browserExecuted:false,
            hostingTouched:false,
            deployExecuted:false,
            writes:0,
            ok:true
          },null,2));
          NODE
