          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_EXECUTED: ${{ steps.rollback.outputs.executed }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='orbit360-platform/runtime-gate-crm-v20260716/';const read=n=>{try{return JSON.parse(fs.readFileSync(p+n,'utf8'))}catch{return null}};const pre=read('preflight-sanitizado.json'),cfg=read('m6-product-runtime-config-summary.json'),id=read('m6-product-smoke-identity-summary.json'),before=read('m6-product-data-before.json'),after=read('m6-product-data-after.json'),smoke=read('m6-product-browser-smoke-summary.json'),integrity=read('m6-product-integrity-summary.json');const outcomes={deploy:process.env.DEPLOY_OUTCOME||'',browser:process.env.BROWSER_OUTCOME||'',snapshotAfter:process.env.SNAPSHOT_OUTCOME||'',integrity:process.env.INTEGRITY_OUTCOME||'',rollback:process.env.ROLLBACK_OUTCOME||''};const deployAttempted=outcomes.deploy&&outcomes.deploy!=='skipped';const rollbackExecuted=process.env.ROLLBACK_EXECUTED==='true';const rollbackSucceeded=rollbackExecuted&&outcomes.rollback==='success';const ok=Boolean(pre&&pre.status==='GO_GATE_CONTRACT'&&pre.contractVersion==='6.1.2'&&cfg&&cfg.ok&&id&&id.ok&&before&&before.ok&&after&&after.ok&&smoke&&smoke.ok&&integrity&&integrity.ok&&outcomes.deploy==='success'&&outcomes.browser==='success'&&outcomes.snapshotAfter==='success'&&outcomes.integrity==='success'&&!rollbackExecuted);const status=ok?'M6_CORRECTIVE_GO_LIVE_PASS':(rollbackSucceeded?'M6_CORRECTIVE_GO_LIVE_ROLLED_BACK':'M6_CORRECTIVE_GO_LIVE_STOPPED');const out={schemaVersion:'orbit360-m6-go-live-summary-v2',generatedAt:new Date().toISOString(),ok,status,gateId:'block6-go-live-product-v20260730',contractVersion:'6.1.2',originalFailedRunId:30516109429,rootCauseDiagnosticRunId:30516599013,rootCauseClassification:'ENVIRONMENT_FAILURE',storageDeferredFailClosed:true,storageRulesApplied:false,storageActive:false,createStorageBucket:false,projectIdentityMatches:Boolean(cfg&&cfg.projectIdentityMatches),webConfigDerivedReadOnly:Boolean(cfg&&cfg.webConfigDerivedReadOnly),baselineBefore:before&&before.counts||null,baselineAfter:after&&after.counts||nul