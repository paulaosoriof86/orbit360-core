name: Orbit 360 · M6 corrective product go-live · 6.1.2
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m6-corrective-go-live-request-v20260730.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m6-product-go-live-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block6-go-live-product-v20260730
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m6-corrective-go-live-request-v20260730.json
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_PRODUCT_URL: https://ays-orbit-360-lab.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  go_live:
    name: M6 · corrective go-live · Firestore read-only + Hosting · Storage deferred
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar request correctivo inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$ORBIT360_REQUEST_FILE"
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();const bad=[];
          if(r.schemaVersion!=='orbit360-m6-corrective-go-live-request-v1'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='6.1.2')bad.push('schema');
          if(r.branch!==process.env.ORBIT360_BRANCH||r.correctiveBaseCommit!==parent)bad.push('binding');
          if(r.authorizationBasis!=='user_authorized_m6_product_go_live_single_block_20260730'||r.riskExpanded!==false||r.correctiveExecutionAllowed!==true||r.allowedCorrectiveExecutions!==1||r.originalFailedRunId!==30516109429||r.rootCauseDiagnosticRunId!==30516599013)bad.push('authorization');
          if(r.target?.projectId!==process.env.ORBIT360_PRODUCT_PROJECT_ID||r.target?.tenantId!==process.env.ORBIT360_PRODUCT_TENANT_ID||r.target?.liveUrl!==process.env.ORBIT360_PRODUCT_URL)bad.push('target');
          if(r.firestoreDataWrites!==false||r.hostingDeploy!==true||r.firestoreRulesDeploy!==true||r.storageRulesDeploy!==false||r.storageDeferredFailClosed!==true||r.createStorageBucket!==false||r.runtime!==true||r.browser!==true||r.production!==true||r.rollbackOnFailure!==true||r.functionsDeploy!==false||r.main!==false||r.merge!==false||r.polizas!==false)bad.push('scope');
          if(bad.length)throw new Error('M6_CORRECTIVE_REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico 6.1.2 antes de secretos o deploy
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m6-corrective-go-live-v2-v20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="6.1.2" and .executionPhase=="M6_PRODUCT_GO_LIVE_CORRECTIVE_EXECUTION" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .rootCauseDiagnosticRunId==30516599013 and .rootCauseClassification=="ENVIRONMENT_FAILURE" and .storageDeferredFailClosed==true and .createStorageBucket==false and .storageRulesDeploy==false and .riskExpanded==false and .secondDeployStageFailureStopsRetries==true and .capabilityProfile.writes==false and .capabilityProfile.rulesDeploy==true and .capabilityProfile.production==true and .secretAccess==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
