        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_after.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "executed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f "${RUNNER_TEMP}/m6-deploy-attempted" ]; then exit 0; fi
          if [ "$DEPLOY_OUTCOME" = success ] && [ "$BROWSER_OUTCOME" = success ] && [ "$SNAPSHOT_OUTCOME" = success ] && [ "$INTEGRITY_OUTCOME" = success ]; then exit 0; fi
