          ! grep -Eq 'backend-lab-loader|store-firestore-lab|data/seed.js|admin@demo.com|orbit.lab@demo.com|demo123' orbit360-platform/index.html
          grep -q 'auth-product-runtime-p0.js' orbit360-platform/index.html
          grep -q 'Orbit.productAppP0.init();' orbit360-platform/index.html
      - name: Ejecutar último intento de deploy M6
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/m6-deploy-attempted"
          firebase deploy --only firestore:rules,hosting --project "$ORBIT360_PRODUCT_PROJECT_ID" --config firebase.product-go-live.json --non-interactive --json > "$EVIDENCE_DIR/m6-product-deploy-raw.json"
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$ORBIT360_PRODUCT_URL/?m6=612-${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/m6-live-index.html"
          grep -q 'auth-product-runtime-p0.js' "${RUNNER_TEMP}/m6-live-index.html"
          ! grep -Eq 'backend-lab-loader|store-firestore-lab|data/seed.js|admin@demo.com|orbit.lab@demo.com|demo123' "${RUNNER_TEMP}/m6-live-index.html"
      - name: Smoke productivo tres vistas
        id: browser
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node tools/orbit360-m6-product-browser-smoke-v20260730.mjs
          jq -e '.ok==true and .contractVersion=="6.1.2" and .storageDeferredFailClosed==true and .runtime.ready==true and .runtime.noFallback==true and .runtime.writeEnabled==false and .runtime.clients==414 and .runtime.insurers==26 and .runtime.advisorBound==true and .checks.writeGuard==true and .checks.roles==true and ((.networkWriteCandidates|length)==0)' "$EVIDENCE_DIR/m6-product-browser-smoke-summary.json" >/dev/null
      - name: Snapshot productivo read-only después
        id: snapshot_after
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node tools/orbit360-m6-product-data-snapshot-readonly-v20260730.mjs after
          jq -e '.ok==true and .advisorSourceOnly==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-data-after.json" >/dev/null
      - name: Verificar integridad before/after
        id: integrity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='orbit360-platform/runtime-gate-crm-v20260716/';const read=n=>{try{return JSON.parse(fs.readFileSync(p+n,'utf8'))}catch{return null}};const a=read('m6-product-data-before.json'),b=read('m6-product-data-after.json'),s=read('m6-product-browser-smoke-summary.json');const keys=['clientes','aseguradoras','asesoresFuente','memberships','config'];const countsStable=keys.every(k=>a&&b&&a.counts&&b.counts&&a.counts[k]===b.counts[k]);const digestsStable=keys.every(k=>a&&b&&a.digests&&b.digests&&a.digests[k]===b.digests[k]);const ok=Boolean(a&&a.ok&&b&&b.ok&&countsStable&&digestsStable&&s&&s.ok===true&&s.networkWriteCandidates.length===0);const out={ok,status:ok?'M6_PRODUCT_INTEGRITY_PASS':'M6_PRODUCT_INTEGRITY_FAIL',countsStable,digestsStable,advisorSourceOnly:true,storageDeferredFailClosed:true,firestoreWrites:0,operationalWrites:0,containsPII:false,containsSecrets:false};fs.writeFileSync(p+'m6-product-integrity-summary.json',JSON.stringify(out,null,2)+'\n');if(!ok)process.exit(41);
          NODE
      - name: Rollback automático si el deploy comenzó y el cierre falla
        id: rollback
