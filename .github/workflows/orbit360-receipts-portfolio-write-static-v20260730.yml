name: Orbit 360 · Receipts/portfolio 9.0.0 static · historical retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical_guard:
    name: Receipts/portfolio · historical 9.0.0 retirement guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirmar reemplazo por 9.1.0 WRITE_PASS sin reabrir autorización
        shell: bash
        run: |
          set -euo pipefail
          test -f orbit360-platform/docs/CIERRE-WRITE-RECIBOS-CARTERA-AYS-V910-20260730.md
          grep -Fq '`WRITE_PASS`' orbit360-platform/docs/CIERRE-WRITE-RECIBOS-CARTERA-AYS-V910-20260730.md
          grep -Fq 'recibosEsperados: 1293' orbit360-platform/docs/CIERRE-WRITE-RECIBOS-CARTERA-AYS-V910-20260730.md
          grep -Fq 'carteraPrimas: 673' orbit360-platform/docs/CIERRE-WRITE-RECIBOS-CARTERA-AYS-V910-20260730.md
          test -f orbit360-platform/docs/CIERRE-RECALC-CARTERA-HISTORICA-EXIGIBLE-AYS-20260730.md
          grep -Fq '9.0.0 queda congelado' orbit360-platform/docs/CIERRE-RECALC-CARTERA-HISTORICA-EXIGIBLE-AYS-20260730.md
          echo 'RECEIPTS_900_RETIRED_REPLACED_BY_910_WRITE_PASS'
