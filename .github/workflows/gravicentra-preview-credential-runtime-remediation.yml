name: Gravicentra I4A Preview Credential Runtime Remediation

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - artifacts/orbit360-recovery/release-control/I4A_PREVIEW_FUNCTION_REMEDIATION_INTENT.json

permissions:
  contents: read

concurrency:
  group: gravicentra-recovery-i4a-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ays-orbit-360-lab

jobs:
  preview-credential-runtime-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Recovery control plane with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: release
        name: Fail closed on I4A causal Preview-only authorization
        working-directory: control
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-control-plane-guard-v2.mjs --mode=i4a
          node tools/gravicentra-i4a-preview-function-remediation-guard-v1.mjs

      - name: Checkout exact certified product source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact certified backend bytes and Preview-only contract
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          export FUNCTIONS_ROOT="$GITHUB_WORKSPACE/source/functions"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const root=process.env.FUNCTIONS_ROOT, expected=process.env.BACKEND_SOURCE_DIGEST;
          const files=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.name==='node_modules'||e.name==='.git'||e.name.endsWith('.local'))continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.isFile())files.push(p);}}
          walk(root);files.sort();
          const rows=files.map(p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'  '+path.relative(root,p).split(path.sep).join('/'));
          const text=rows.join('\n')+'\n',digest=crypto.createHash('sha256').update(text).digest('hex');
          if(files.length!==17)throw new Error('CERTIFIED_BACKEND_FILE_COUNT_DRIFT:'+files.length);
          if(digest!==expected)throw new Error('CERTIFIED_BACKEND_DIGEST_DRIFT:'+digest);
          const pkg=JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8'));
          if(pkg.main!=='bootstrap.js')throw new Error('CERTIFIED_BACKEND_ENTRYPOINT_DRIFT');
          const boot=fs.readFileSync(path.join(root,'bootstrap.js'),'utf8');
          if(!boot.includes("require('./product-insurer-credentials')"))throw new Error('CERTIFIED_BACKEND_BOOTSTRAP_MISSING_CREDENTIAL_MODULE');
          const src=fs.readFileSync(path.join(root,'product-insurer-credentials.js'),'utf8');
          for(const token of ['orbit360ProductInsurerCredentialCommandPreview','us-east1','cloudlog',"auditMode==='cloudlog'&&op==='import'",'writesOperationalData:false','importEnabled:false'])if(!src.includes(token))throw new Error('PREVIEW_CONTRACT_TOKEN_MISSING:'+token);
          console.log('CERTIFIED_BACKEND_DIGEST=PASS:'+digest);
          console.log('CERTIFIED_BACKEND_FILE_COUNT='+files.length);
          console.log('PREVIEW_IMPORT_DISABLED_CONTRACT=PASS');
          NODE

      - name: Install locked certified backend dependencies
        working-directory: source/functions
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - id: auth
        name: Select existing Firebase credential with Functions and Extensions visibility
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          AUTH_MATRIX: ${{ runner.temp }}/preview-function-auth-matrix.tsv
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i4a-preview-function-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          candidates=[('FIREBASE_SERVICE_ACCOUNT',os.environ.get('SA_DEFAULT','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB',os.environ.get('SA_ORBIT360_LAB','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB',os.environ.get('SA_ORBIT_360_LAB',''))]
          rows=[]
          for i,(name,raw) in enumerate(candidates):
              if not raw.strip(): continue
              try: data=json.loads(raw)
              except Exception: continue
              if data.get('type')!='service_account' or data.get('project_id')!=os.environ['PROJECT_ID'] or not data.get('client_email') or not data.get('private_key'): continue
              p=Path(os.environ['ROOT'])/f'{i}.json'; p.write_text(json.dumps(data)); p.chmod(0o600); rows.append((name,str(p)))
          if not rows: raise SystemExit('NO_EXISTING_WELL_FORMED_PROJECT_SERVICE_ACCOUNT')
          (Path(os.environ['ROOT'])/'index.tsv').write_text('\n'.join('\t'.join(x) for x in rows)+'\n')
          PY
          printf 'credential\tfunctions_list_rc\textensions_list_rc\n' > "$AUTH_MATRIX"
          SELECTED_NAME=''; SELECTED_FILE=''
          while IFS=$'\t' read -r NAME FILE; do
            set +e
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 functions:list --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1
            FUNC_RC=$?
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 ext:list --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1
            EXT_RC=$?
            set -e
            printf '%s\t%s\t%s\n' "$NAME" "$FUNC_RC" "$EXT_RC" >> "$AUTH_MATRIX"
            if [ "$FUNC_RC" -eq 0 ] && [ "$EXT_RC" -eq 0 ]; then SELECTED_NAME="$NAME"; SELECTED_FILE="$FILE"; break; fi
          done < "$ROOT/index.tsv"
          cat "$AUTH_MATRIX"
          test -n "$SELECTED_FILE" || { echo EXISTING_FIREBASE_FUNCTIONS_AND_EXTENSIONS_VISIBILITY_NOT_PROVEN >&2; exit 43; }
          cp "$SELECTED_FILE" "$RUNNER_TEMP/gravicentra-i4a-preview-function-sa.json"; chmod 600 "$RUNNER_TEMP/gravicentra-i4a-preview-function-sa.json"
          echo "credential_source=$SELECTED_NAME" >> "$GITHUB_OUTPUT"
          echo "credential_file=$RUNNER_TEMP/gravicentra-i4a-preview-function-sa.json" >> "$GITHUB_OUTPUT"

      - id: before
        name: Prove target absent and seal canonical production callable before-state
        working-directory: source/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
          EVIDENCE_FILE: ${{ runner.temp }}/preview-function-before.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const project=process.env.PROJECT_ID,target=process.env.TARGET_FUNCTION,region=process.env.TARGET_REGION;
            async function get(url,headers){const r=await fetch(url,{headers});const j=await r.json().catch(()=>({}));return {httpStatus:r.status,name:String(j.name||''),state:String(j.state||''),entryPoint:String(j.buildConfig?.entryPoint||''),updateTime:String(j.updateTime||''),uriConfigured:!!j.serviceConfig?.uri,error:String(j.error?.message||j.message||'').slice(0,240)};}
            const auth=new GoogleAuth({keyFile:process.env.GOOGLE_APPLICATION_CREDENTIALS,scopes:['https://www.googleapis.com/auth/cloud-platform']});const client=await auth.getClient(),headers=await client.getRequestHeaders();
            const preview=await get(`https://cloudfunctions.googleapis.com/v2/projects/${project}/locations/${region}/functions/${target}`,headers);
            const prod=await get(`https://cloudfunctions.googleapis.com/v2/projects/${project}/locations/us-central1/functions/orbit360ProductInsurerCredentialCommand`,headers);
            if(preview.httpStatus!==404)throw new Error('PREVIEW_FUNCTION_NO_LONGER_ABSENT:'+preview.httpStatus);
            const out={targetBefore:preview,canonicalProductionBefore:prod};fs.writeFileSync(process.env.EVIDENCE_FILE,JSON.stringify(out,null,2)+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'canonical_prod_http='+prod.httpStatus+'\ncanonical_prod_update_time='+prod.updateTime+'\n');
            console.log('PREVIEW_FUNCTION_BEFORE_HTTP=404');console.log('CANONICAL_PRODUCTION_BEFORE_HTTP='+prod.httpStatus);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - id: deploy
        name: Deploy only the certified Preview credential callable
        working-directory: source
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
        run: |
          set -euo pipefail
          test "$TARGET_FUNCTION" = "orbit360ProductInsurerCredentialCommandPreview"
          test "$TARGET_REGION" = "us-east1"
          npx --yes firebase-tools@14.10.1 deploy --only functions:orbit360ProductInsurerCredentialCommandPreview --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/preview-function-deploy.json"
          echo 'PREVIEW_ONLY_FUNCTION_DEPLOY_COMMAND=PASS'

      - id: readback
        name: Read back exact Preview function and prove canonical production callable unchanged
        working-directory: source/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credential_file }}
          BEFORE_FILE: ${{ runner.temp }}/preview-function-before.json
          EVIDENCE_FILE: ${{ runner.temp }}/preview-function-after.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const project=process.env.PROJECT_ID,target=process.env.TARGET_FUNCTION,region=process.env.TARGET_REGION,before=JSON.parse(fs.readFileSync(process.env.BEFORE_FILE,'utf8'));
            async function get(url,headers){const r=await fetch(url,{headers});const j=await r.json().catch(()=>({}));return {httpStatus:r.status,name:String(j.name||''),state:String(j.state||''),entryPoint:String(j.buildConfig?.entryPoint||''),updateTime:String(j.updateTime||''),uriConfigured:!!j.serviceConfig?.uri,error:String(j.error?.message||j.message||'').slice(0,240)};}
            const auth=new GoogleAuth({keyFile:process.env.GOOGLE_APPLICATION_CREDENTIALS,scopes:['https://www.googleapis.com/auth/cloud-platform']});const client=await auth.getClient(),headers=await client.getRequestHeaders();
            const preview=await get(`https://cloudfunctions.googleapis.com/v2/projects/${project}/locations/${region}/functions/${target}`,headers);
            const run=await get(`https://run.googleapis.com/v2/projects/${project}/locations/${region}/services/${target.toLowerCase()}`,headers);
            const prod=await get(`https://cloudfunctions.googleapis.com/v2/projects/${project}/locations/us-central1/functions/orbit360ProductInsurerCredentialCommand`,headers);
            if(preview.httpStatus!==200)throw new Error('PREVIEW_FUNCTION_READBACK_HTTP:'+preview.httpStatus);
            if(preview.state!=='ACTIVE')throw new Error('PREVIEW_FUNCTION_NOT_ACTIVE:'+preview.state);
            if(preview.entryPoint!==target)throw new Error('PREVIEW_FUNCTION_ENTRYPOINT_MISMATCH:'+preview.entryPoint);
            if(run.httpStatus!==200)throw new Error('PREVIEW_RUN_SERVICE_READBACK_HTTP:'+run.httpStatus);
            const b=before.canonicalProductionBefore||{};
            if(prod.httpStatus!==b.httpStatus||prod.updateTime!==b.updateTime||prod.entryPoint!==b.entryPoint)throw new Error('CANONICAL_PRODUCTION_CALLABLE_CHANGED');
            const out={targetAfter:preview,runAfter:run,canonicalProductionAfter:prod,certifiedSourceSha:process.env.SOURCE_SHA,certifiedBackendSourceDigest:process.env.BACKEND_SOURCE_DIGEST,productionTouched:false,dataTouched:false,operationalWrites:0};fs.writeFileSync(process.env.EVIDENCE_FILE,JSON.stringify(out,null,2)+'\n');
            console.log('PREVIEW_FUNCTION_READBACK=PASS');console.log('PREVIEW_FUNCTION_STATE='+preview.state);console.log('PREVIEW_FUNCTION_ENTRYPOINT='+preview.entryPoint);console.log('PREVIEW_RUN_SERVICE_HTTP='+run.httpStatus);console.log('CANONICAL_PRODUCTION_CALLABLE_UNCHANGED=PASS');console.log('OPERATIONAL_WRITES=0');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Preserve Preview remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-preview-function-remediation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/preview-function-auth-matrix.tsv
            ${{ runner.temp }}/preview-function-before.json
            ${{ runner.temp }}/preview-function-after.json
            ${{ runner.temp }}/preview-function-deploy.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo '## Gravicentra Insurance — I4A Preview-only credential runtime remediation'
            echo "- Certified source: \`$SOURCE_SHA\`"
            echo "- Certified backend digest: \`$BACKEND_SOURCE_DIGEST\`"
            echo "- Target: \`$TARGET_FUNCTION@$TARGET_REGION\`"
            echo '- Hosting mutation: `false`'
            echo '- Canonical production callable mutation: `false`'
            echo '- Firestore/Storage rules mutation: `false`'
            echo '- Operational data writes: `0`'
          } >> "$GITHUB_STEP_SUMMARY"
