name: Orbit 360 · Recibos/Cartera 9.1.0 · projection lifecycle fix
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/receipts-portfolio-projection-lifecycle-fix-v910-20260730.json'
permissions:
  contents: write
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-projection-lifecycle-fix-v910-20260730
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_PROJECTION: orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js
  ORBIT360_SOURCE_BLOB: f206d40fa59210db02ad5a7989be85d3dff346df
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar causa raíz y fuente exacta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$(git hash-object "$ORBIT360_PROJECTION")" = "$ORBIT360_SOURCE_BLOB"
          jq -e '.schemaVersion=="orbit360-projection-lifecycle-fix-trigger-v1" and .classification=="FUNCTIONAL_DEFECT" and .sourceDiagnosticRun==30630222364 and .observedBaseCounts.clientes==430 and .observedBaseCounts.polizas==1373 and .observedBaseCounts.vehiculos==1032 and .observedProjectionCounts.recibosEsperados==0 and .observedProjectionCounts.carteraPrimas==0 and .observedProjectionAttached==0 and .rootCause=="PROJECTION_WRAPSTORE_NON_IDEMPOTENT_BLOCKS_ATTACH_AFTER_BOOT_WRAP" and .hostingDeploy==false and .rulesDeploy==false and .dataWrites==false' .github/orbit360-triggers/receipts-portfolio-projection-lifecycle-fix-v910-20260730.json >/dev/null
      - name: Gate canónico antes de modificar código
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .dataAccess==false and .firestoreRead==false and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Confirmar reproducción sintética pre-fix
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/orbit360-test-receipts-portfolio-projection-lifecycle-v910-20260730.mjs > "$EVIDENCE_DIR/projection-lifecycle-before-v910.json"
          code=$?
          set -e
          test "$code" = '41'
          jq -e '.ok==false and .status=="FUNCTIONAL_DEFECT" and .checks.ready==false and .checks.bothAttached==false' "$EVIDENCE_DIR/projection-lifecycle-before-v910.json" >/dev/null
      - name: Aplicar corrección focal idempotente
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('orbit360-platform/core/backend-lab-receipts-portfolio-projection-v910.js')
          s=p.read_text(encoding='utf-8')
          old="if(wrappedStore||!Orbit.store||typeof Orbit.store.all!=='function')return false;"
          new="if(wrappedStore)return true;if(!Orbit.store||typeof Orbit.store.all!=='function')return false;"
          if s.count(old)!=1:
              raise SystemExit('PROJECTION_LIFECYCLE_PATCH_ANCHOR_INVALID')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check -- "$ORBIT360_PROJECTION"
          git add "$ORBIT360_PROJECTION"
          test "$(git diff --cached --name-only)" = "$ORBIT360_PROJECTION"
      - name: Validar sintaxis, contrato y lifecycle post-fix
        shell: bash
        run: |
          set -euo pipefail
          node --check "$ORBIT360_PROJECTION"
          node tools/orbit360-test-receipts-portfolio-visual-projection-v910.mjs > "$EVIDENCE_DIR/projection-static-after-v910.json"
          jq -e '.status=="VISUAL_PROJECTION_STATIC_READY" and .failed==0 and any(.checks[]; .id=="STORE_WRAP_IDEMPOTENT" and .ok==true) and any(.checks[]; .id=="ATTACH_CAN_REUSE_WRAPPED_STORE" and .ok==true)' "$EVIDENCE_DIR/projection-static-after-v910.json" >/dev/null
          node tools/orbit360-test-receipts-portfolio-projection-lifecycle-v910-20260730.mjs > "$EVIDENCE_DIR/projection-lifecycle-after-v910.json"
          jq -e '.ok==true and .status=="PROJECTION_LIFECYCLE_PASS" and .checks.ready==true and .checks.bothAttached==true and .checks.receiptCount==true and .checks.portfolioCount==true and .checks.baseStorePreserved==true' "$EVIDENCE_DIR/projection-lifecycle-after-v910.json" >/dev/null
      - name: Registrar corrección sin deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git diff --cached --name-only)" = "$ORBIT360_PROJECTION"
          git diff --cached --check
          git commit -m 'fix(receipts): make LAB projection store wrap idempotent 9.1.0'
          git push origin "HEAD:$ORBIT360_BRANCH"
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-projection-lifecycle-fix-v910-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/projection-lifecycle-before-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/projection-static-after-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/projection-lifecycle-after-v910.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          AFTER: orbit360-platform/runtime-gate-crm-v20260716/projection-lifecycle-after-v910.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Projection lifecycle fix failed';
            try{const a=JSON.parse(fs.readFileSync(process.env.AFTER,'utf8'));if(a.ok===true&&a.status==='PROJECTION_LIFECYCLE_PASS'){state='success';description='Projection lifecycle root cause fixed; no deploy';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-projection-lifecycle-fix-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
