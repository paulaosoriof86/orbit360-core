name: CotComp S5.08 Real Pilot Sanitized Readback

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s508-one-time-real-customer-lab-20261007
    paths:
      - 'functions/cotcomp-s508-real-readback.js'
      - '.github/workflows/cotcomp-s508-real-readback.yml'

permissions:
  contents: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Static read-only guard
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check cotcomp-s508-real-readback.js
          ! grep -Eq '\.(set|create|update|delete)\(' cotcomp-s508-real-readback.js
          ! grep -Eq '\.batch\(' cotcomp-s508-real-readback.js
      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s508-readback/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s508-readback/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Real pilot sanitized readback
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node cotcomp-s508-real-readback.js | tee "$RUNNER_TEMP/s508-readback/evidence/REAL_READBACK.json"
          node - "$RUNNER_TEMP/s508-readback/evidence/REAL_READBACK.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const mustTrue=[
            'stateExists','stateUsed','businessExists','requestExists','eventExists','outboxExists',
            'businessAssignedToPaula','leadsVisible','requestManagementConsent','consentVersionMatches',
            'privacyNoticeVersionMatches','marketingConsentFalse','adultConfirmed','retentionB1',
            'contactChannelPresent','vehicleContextPresent','advisorTargetedOutbox','temporaryServiceActorAbsent'
          ];
          for(const k of mustTrue)if(r[k]!==true){console.error('FAIL',k,r[k]);process.exit(1);}
          if(r.stage!=='nuevo'||r.origin!=='Web CotComp')process.exit(1);
          if(r.productionTouched!==false||r.providerRaterUsed!==false||r.issued!==false||r.bound!==false||r.paid!==false)process.exit(1);
          if(r.containsParticipantPii!==false)process.exit(1);
          NODE
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s508-real-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/s508-readback/evidence/REAL_READBACK.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/s508-readback/firebase-service-account.json"