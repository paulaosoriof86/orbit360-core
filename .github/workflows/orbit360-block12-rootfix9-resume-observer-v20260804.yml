name: Orbit 360 · Block 12 rootfix 9 resume · observador

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/block12-rootfix9-resume-observer-v20260804.json'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verificar alcance read-only
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='.github/orbit360-requests/block12-rootfix9-resume-observer-v20260804.json'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = 1
          test "${CHANGED[0]}" = "$REQUEST"
          jq -e '.status=="AUTHORIZED_READ_ONLY" and .targetWorkflow=="orbit360-block12-operational-runtime-lab-rootfix9-resume-v20260804.yml" and .targetHeadSha=="7f62c76ca55d2a071fa72ea5d345015b1db623a8" and .firebase==false and .secrets==false and .writes==false and .deploy==false' "$REQUEST" >/dev/null
      - name: Consultar run objetivo
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/orbit360-block12-operational-runtime-lab-rootfix9-resume-v20260804.yml/runs" -f branch='ays/backend-tenant-lab-v99-20260703' -f event='push' -f per_page='20' > "$RUNNER_TEMP/runs.json"
          RUN_ID="$(jq -r '[.workflow_runs[] | select(.head_sha=="7f62c76ca55d2a071fa72ea5d345015b1db623a8")][0].id // empty' "$RUNNER_TEMP/runs.json")"
          test -n "$RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          STATUS="$(jq -r '.status' "$RUNNER_TEMP/run.json")"
          CONCLUSION="$(jq -r '.conclusion // ""' "$RUNNER_TEMP/run.json")"
          ACTIVE="$(jq -r '[.jobs[].steps[]? | select(.status=="in_progress")][0].name // empty' "$RUNNER_TEMP/jobs.json")"
          if [ -z "$ACTIVE" ]; then ACTIVE="$(jq -r '[.jobs[].steps[]? | select(.status=="completed")][-1].name // "sin paso observable"' "$RUNNER_TEMP/jobs.json")"; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
      - name: Publicar estado en PR 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="## Block 12 rootfix 9 · observador read-only\n\n- Run: \`${{ steps.inspect.outputs.run_id }}\`\n- Estado: \`${{ steps.inspect.outputs.status }}\`\n- Conclusión: \`${{ steps.inspect.outputs.conclusion }}\`\n- Paso observable: \`${{ steps.inspect.outputs.active }}\`\n- Firebase/escrituras/deploy del observador: no" >/dev/null
