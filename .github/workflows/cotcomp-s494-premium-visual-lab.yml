name: CotComp S4.94 premium visual polish LAB

on:
  push:
    branches:
      - ays/cotcomp-s494-premium-visual-polish-lab-20261004
    paths:
      - '.github/cotcomp-lab-intents/s494-premium-visual-lab-authorized.json'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_FUNCTION: cotcompPremiumVisualPreviewS494
  COTCOMP_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompPremiumVisualPreviewS494

jobs:
  s494-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.94 authorization intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s494-premium-visual-lab-authorized.json
          jq -e '
            .authorization=="S494_DEPLOY_PREMIUM_VISUAL_POLISH" and
            .projectId=="ays-orbit-360-lab" and
            .functionName=="cotcompPremiumVisualPreviewS494" and
            .ownerVisualSha=="3468546cb5d1c0cd7e2191980b306d462ea0b0304da0260167ec06c294aaa10e" and
            .heroSha=="a80c5458137e2914a6e8d43f8212ea1997ea5d8ba8d4a44136c36ef28cb927bd" and
            .productSceneSpriteSha=="4209a06de9b030c0f81d5b004fbf995018f8b050418c22913daaf1f73ead4800" and
            .productFamilyCount==7 and
            .photographicProductScenes==true and
            .dimensionalColorIcons==true and
            .readabilityPolish==true and
            .fixtureOnly==true and
            .providerDeploymentAuthorized==false and
            .cotcompRealTransportAuthorized==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.94 safeguards
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-premium-visual-preview-s494.js
          node --check cotcomp-premium-visual-preview-s494.test.js
          node --test cotcomp-product-family-completeness-preview-s486.test.js
          node --test cotcomp-premium-visual-preview-s494.test.js

      - name: Prepare LAB deployment credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s494/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s494/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S4.94 preview to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$COTCOMP_FUNCTION" --project "$COTCOMP_PROJECT_ID" --non-interactive --force

      - name: Physically verify S4.94 premium visual polish
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/s494/evidence"
          CODE="$(curl -sS -o "$E/page.html" -w '%{http_code}' "$COTCOMP_URL")"
          test "$CODE" = "200"

          grep -q 'class="site-header"' "$E/page.html"
          grep -q 'class="hero-media"' "$E/page.html"
          grep -q 'Equipo A&amp;S en asesoría' "$E/page.html"
          grep -q 'Cotiza y compara <em>con criterio</em>' "$E/page.html"
          grep -q 'class="workspace"' "$E/page.html"
          grep -q 'class="icon3d icon3d-' "$E/page.html"
          grep -q 'icon3d-vehicle' "$E/page.html"
          grep -q 'icon3d-health' "$E/page.html"
          grep -q 'icon3d-cargo' "$E/page.html"
          grep -q 'scene-copy' "$E/page.html"
          grep -q 'product-scene photo-scene' "$E/page.html"
          grep -q 'visual-note,.handnote{display:none!important}' "$E/page.html"
          grep -q 'font-size:18px' "$E/page.html"
          grep -q 'font-size:14.5px' "$E/page.html"
          grep -q 'TOYOTA' "$E/page.html"
          grep -q 'RAV4 2WD' "$E/page.html"
          grep -q '2023' "$E/page.html"
          grep -q 'Aseguradora A' "$E/page.html"
          grep -q 'Aseguradora B' "$E/page.html"
          grep -q 'Aseguradora C' "$E/page.html"
          grep -q 'Recomendación A&amp;S' "$E/page.html"
          grep -q 'Datos de alternativas y precios son ilustrativos; no constituyen oferta' "$E/page.html"
          grep -q 'Gravicentra sigue siendo la autoridad' "$E/page.html"
          ! grep -q 'class="sidebar"' "$E/page.html"
          ! grep -q 'class="generic-art"' "$E/page.html"
          ! grep -q 'calculatePremium(' "$E/page.html"
          ! grep -q 'getFirestore' "$E/page.html"

          POST_CODE="$(curl -sS -o "$E/post.txt" -w '%{http_code}' -X POST "$COTCOMP_URL")"
          test "$POST_CODE" = "405"

          jq -n --arg url "$COTCOMP_URL" '{
            schemaVersion:"ays-cotcomp-s494-premium-visual-physical-receipt-v1.0",
            functionUrl:$url,
            deployed:true,
            ownerVisualSha:"3468546cb5d1c0cd7e2191980b306d462ea0b0304da0260167ec06c294aaa10e",
            heroSha:"a80c5458137e2914a6e8d43f8212ea1997ea5d8ba8d4a44136c36ef28cb927bd",
            productSceneSpriteSha:"4209a06de9b030c0f81d5b004fbf995018f8b050418c22913daaf1f73ead4800",
            photographicHero:true,
            photographicProductScenes:true,
            dimensionalColorIcons:true,
            readabilityPolish:true,
            productFamilyCount:7,
            comparativeFrontend:true,
            recommendationPanel:true,
            fixtureOnly:true,
            providerDeploymentAuthorized:false,
            cotcompRealTransportAuthorized:false,
            productionTouched:false
          }' > "$E/S494_PREMIUM_VISUAL_PHYSICAL_RECEIPT.json"

      - name: Upload sanitized S4.94 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s494-premium-visual-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s494/evidence/S494_PREMIUM_VISUAL_PHYSICAL_RECEIPT.json
            ${{ runner.temp }}/s494/evidence/page.html
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s494/firebase-service-account.json"
