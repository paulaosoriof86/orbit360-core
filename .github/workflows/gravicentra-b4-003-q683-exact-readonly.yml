name: B4-003 exact QA read-only (Q683.20)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b4-003-exact-q683-readonly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  read-exact-qa:
    name: Read only exact synthetic QA relations
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Firebase Admin in runner temp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b4-003-q683-read"
          npm install --prefix "$RUNNER_TEMP/b4-003-q683-read" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null

      - name: Read only the exact QA case
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/b4-003-q683-read/node_modules" node <<'NODE'
          'use strict';
          const admin = require('firebase-admin');
          const TENANT = 'alianzas-soluciones';
          const PROJECT = 'ays-orbit-360-lab';
          const POLICY = 'b4003qa_policy_renewwrite_38102224750';
          const RECEIPT = 'cob_b4003qa_policy_renewwrite_38102224750_001';
          const EXPECTED_DUE = '2026-10-26';
          const EXPECTED_CURRENCY = 'GTQ';
          const MAX_MATCHES = 5;
          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '{}');
          if (credentials.type !== 'service_account' ||
              credentials.project_id !== PROJECT ||
              !credentials.private_key || !credentials.client_email) {
            throw new Error('B4_003_Q683_READ_CREDENTIAL_INVALID');
          }
          admin.initializeApp({credential: admin.credential.cert(credentials), projectId: PROJECT});
          const db = admin.firestore();
          const base = 'tenants/' + TENANT + '/data';
          const scalar = v => {
            if (v == null || ['string','number','boolean'].includes(typeof v)) return v;
            if (v instanceof Date) return v.toISOString();
            if (typeof v.toDate === 'function') return v.toDate().toISOString();
            return undefined;
          };
          const fields = [
            'reciboId','receiptId','polizaId','policyId','clienteId','clientId',
            'monto','saldo','prima','primaTotal','montoTotal','moneda','currency',
            'vence','fechaVencimiento','fechaLimite','dueDate',
            'estado','estadoCartera','estadoOperativo','exigibilidad','carteraActiva',
            'fechaCorte','corte','cutoffDate','source','sourceSystem','fuente','origen','procedencia',
            'paymentState','applicationState','inferredPaid','paidInferred','pagoReportado',
            'fechaPago','paidDate','conciliado','conciliadoPago','cobroId',
            'pagoConfirmado','pagoVerificado','conciliacionEstado','estadoConciliacion'
          ];
          const safeDoc = snap => {
            const raw = snap.data() || {}, out = {documentId: snap.id};
            for (const key of fields) {
              if (!Object.prototype.hasOwnProperty.call(raw,key)) continue;
              const val = scalar(raw[key]);
              if (val !== undefined) out[key] = val;
              else if (raw[key] && typeof raw[key] === 'object') out[key+'Present'] = true;
            }
            return out;
          };
          const queryExact = async (collection, fieldsToMatch, value) => {
            const ref = db.collection(base + '/' + collection + '/items');
            const results = new Map();
            for (const field of fieldsToMatch) {
              const snap = await ref.where(field,'==',value).limit(MAX_MATCHES).get();
              for (const doc of snap.docs) results.set(doc.id,doc);
            }
            return [...results.values()].map(safeDoc);
          };
          (async()=>{
            const policyRef=db.doc(base + '/polizas/items/' + POLICY);
            const policySnap=await policyRef.get();
            if(!policySnap.exists) throw new Error('B4_003_Q683_POLICY_NOT_FOUND');
            const policy=policySnap.data()||{};
            const clientId=String(policy.clienteId||'');
            if(!clientId) throw new Error('B4_003_Q683_POLICY_CLIENT_RELATION_MISSING');
            const clientSnap=await db.doc(base + '/clientes/items/' + clientId).get();
            const client=clientSnap.exists?(clientSnap.data()||{}):{};
            const portfolio=await queryExact('carteraPrimas',['reciboId','receiptId'],RECEIPT);
            const expectedDirect=await db.doc(base + '/recibosEsperados/items/' + RECEIPT).get();
            const expectedByAlias=await queryExact('recibosEsperados',['id','reciboId','receiptId'],RECEIPT);
            const expectedMap=new Map(expectedByAlias.map(x=>[x.documentId,x]));
            if(expectedDirect.exists) expectedMap.set(expectedDirect.id,safeDoc(expectedDirect));
            const cobros=await queryExact('cobros',['reciboId','receiptId'],RECEIPT);
            const finmovs=await queryExact('finmovs',['reciboId','receiptId'],RECEIPT);
            const policyCountry=String(policy.pais||policy.country||'').toUpperCase();
            const policyCurrency=String(policy.moneda||policy.divisa||'').toUpperCase();
            const relOk=row=>String(row.polizaId||row.policyId||'')===POLICY &&
              ((!row.clienteId&&!row.clientId) || String(row.clienteId||row.clientId)===clientId);
            const result={
              status:portfolio.length===1?'ONE_PORTFOLIO_MATCH':portfolio.length===0?'NO_PORTFOLIO_MATCH':'MULTIPLE_PORTFOLIO_MATCHES',
              readOnly:true,
              observedAt:new Date().toISOString(),
              expected:{tenantId:TENANT,policyId:POLICY,reciboId:RECEIPT,dueDate:EXPECTED_DUE,currency:EXPECTED_CURRENCY},
              canonical:{policyExists:policySnap.exists,policyId:POLICY,clientId,clientExists:clientSnap.exists,
                tenantMatch:(!policy.tenantId||policy.tenantId===TENANT)&&(!client.tenantId||client.tenantId===TENANT),
                country:policyCountry,currency:policyCurrency},
              carteraPrimas:{count:portfolio.length,unique:portfolio.length===1,
                relationshipMatches:portfolio.map(relOk),rows:portfolio},
              recibosEsperados:{count:expectedMap.size,rows:[...expectedMap.values()]},
              paymentEvidence:{cobros:cobros.map(x=>({
                documentId:x.documentId,reciboId:x.reciboId||x.receiptId||null,
                estado:x.estado||null,paymentState:x.paymentState||null,applicationState:x.applicationState||null,
                monto:x.monto??null,moneda:x.moneda||x.currency||null,fechaPago:x.fechaPago||x.paidDate||null,
                conciliado:x.conciliado??null,conciliadoPago:x.conciliadoPago??null
              })),finmovs:finmovs.map(x=>({
                documentId:x.documentId,reciboId:x.reciboId||x.receiptId||null,
                polizaId:x.polizaId||x.policyId||null,estado:x.estado||null,
                conciliacionEstado:x.conciliacionEstado||x.estadoConciliacion||null,
                fechaCorte:x.fechaCorte||x.corte||null,moneda:x.moneda||x.currency||null,
                monto:x.monto??null,conciliado:x.conciliado??null
              }))},
              adjudicationInputs:{expectedDueDate:EXPECTED_DUE,portfolioDueDates:portfolio.map(x=>x.vence||x.fechaVencimiento||x.fechaLimite||x.dueDate||null),
                expectedReceiptDueDates:[...expectedMap.values()].map(x=>x.vence||x.fechaVencimiento||x.fechaLimite||x.dueDate||null),
                currentCutoffDate:new Date().toISOString().slice(0,10)}
            };
            if(!clientSnap.exists) result.status='CANONICAL_CLIENT_MISSING';
            if(portfolio.some(x=>!relOk(x))) result.status='RELATIONSHIP_MISMATCH';
            process.stdout.write('B4_003_Q683_READONLY_RESULT='+JSON.stringify(result)+'\n');
            await admin.app().delete();
          })().catch(async error=>{
            process.stderr.write(String(error&&error.message||error).slice(0,180)+'\n');
            try{await admin.app().delete();}catch(_){}
            process.exitCode=1;
          });
          NODE
