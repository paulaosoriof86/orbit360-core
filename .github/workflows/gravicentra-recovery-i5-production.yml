name: Gravicentra Recovery I5 Production Promotion
# I5_NO_REBUILD=true
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: gravicentra-recovery-i5-${{ github.ref }}
  cancel-in-progress: false
env:
  PROJECT_ID: ays-orbit-360-lab
  HOSTING_SITE: ays-orbit-360-lab
  PRODUCTION_URL: https://ays-orbit-360-lab.web.app
  PRIOR_RB: gi-i5-rb-34725195736
  PRIOR_SYNTHETIC_ID: asg976529
jobs:
  i5-authoritative:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: release
        name: Authority and release binding
        run: |
          set -euo pipefail; test "$GITHUB_REF_NAME" = recovery/fase-a-clean-20260831
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i5
          node - <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json')),i=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I5_EXECUTION_INTENT.json')),n=(x,m)=>{if(!x)throw Error(m)},x=c.certifiedCandidate||{},a=c.i5Execution||{},t=i.promotionPlan?.backend?.targets||[];
          n(c.status==='I5_IN_PROGRESS','I5_STATUS');n(x.sourceSha==='16f174d087024085eff18079c486f717ef98d691','I5_SOURCE');n(x.buildId==='gi-i3-16f174d08702-57f234755dc1','I5_BUILD');n(+x.artifactId===10183074943,'I5_ARTIFACT');n(x.sameFrontendArtifactPreviewToProductionRequired&&x.sameBackendSourcePackageRequiredForI5&&!x.sourceMutatedAfterBuild,'I5_BINDING');n(a.productionDeployAuthorized&&a.controlledWritesAuthorized&&a.rollbackPrepared,'I5_AUTH');n(t.length===6&&new Set(t).size===6,'I5_TARGETS');
          const e={SOURCE_SHA:x.sourceSha,BUILD_ID:x.buildId,I3_RUN_ID:String(x.i3RunId),I3_ARTIFACT_ID:String(x.artifactId),I3_ARTIFACT_NAME:x.artifactName,EXPECTED_HOSTED_PAYLOAD_DIGEST:x.hostedPayloadDigest,EXPECTED_BACKEND_SOURCE_DIGEST:x.backendSourceDigest,PREVIEW_CHANNEL_ID:x.previewChannelId,I5_FUNCTION_TARGETS:t.join(','),I5_PRODUCTION_DEPLOY_AUTHORIZED:'true',I5_CONTROLLED_WRITES_AUTHORIZED:'true'};for(const[k,v]of Object.entries(e))fs.appendFileSync(process.env.GITHUB_ENV,`${k}=${v}\n`);fs.appendFileSync(process.env.GITHUB_OUTPUT,'deploy_authorized=true\n');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.I3_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/i5-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.I3_RUN_ID }}
      - name: Recover prior failed I5 residue, prove baseline, then promote exact candidate
        run: |
          set -euo pipefail; E="$RUNNER_TEMP/gravicentra-i5-evidence";mkdir -p "$E"
          ROOT="$RUNNER_TEMP/i5-artifact"; EV=$(find "$ROOT" -name i3-evidence.json -print -quit); SITE=$(find "$ROOT" -name site-manifest.sha256 -print -quit); BM=$(find "$ROOT" -name backend-manifest.sha256 -print -quit); B=$(find "$ROOT" -type d -name bundle -print -quit)
          test "$(jq -r .sourceSha "$EV")" = "$SOURCE_SHA";test "$(jq -r .buildId "$EV")" = "$BUILD_ID";test "$(jq -r .hostedPayloadDigest "$EV")" = "$EXPECTED_HOSTED_PAYLOAD_DIGEST";test "$(jq -r .backendSourceDigest "$EV")" = "$EXPECTED_BACKEND_SOURCE_DIGEST";(cd "$B/backend"&&sha256sum -c "$BM")
          echo "I5_BUNDLE=$B" >> "$GITHUB_ENV";echo "I5_SITE_MANIFEST=$SITE" >> "$GITHUB_ENV";echo "I5_BACKEND_MANIFEST=$BM" >> "$GITHUB_ENV"
          CROOT="$RUNNER_TEMP/firebase-cli";npm install --prefix "$CROOT" --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null;node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CROOT";CLI="$CROOT/node_modules/firebase-tools/lib/bin/firebase.js";echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          A="$RUNNER_TEMP/i5-auth";mkdir -p "$A";export A;python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
            try:d=json.loads(os.environ.get(k,''))
            except:continue
            if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
              p=pathlib.Path(os.environ['A'])/f'{i}.json';p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('NO_SA')
          pathlib.Path(os.environ['A']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL='';while read -r F;do if GOOGLE_APPLICATION_CREDENTIALS="$F" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1;then SEL="$F";break;fi;done<"$A/files";test -n "$SEL";cp "$SEL" "$RUNNER_TEMP/i5-sa.json";chmod 600 "$RUNNER_TEMP/i5-sa.json";export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/i5-sa.json";echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"
          node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/start.json"
          export START="$RUNNER_TEMP/start.json"; REC=$(node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.START)),a=Array.isArray(r.result)?r.result:r,n=new Set(a.flatMap(x=>[x.entryPoint,x.id||x.name].map(String))),t=process.env.I5_FUNCTION_TARGETS.split(','),b=['orbit360BankAccountStatus','orbit360CobrosReconciliationCommandLabV20260804','orbit360CopyInsurerBankAccount','orbit360CopyInsurerCredential','orbit360CredentialStatus','orbit360GetAdvisorOpsInboxLabV20260804','orbit360ImportInsurerBankAccounts','orbit360ImportInsurerCredentials','orbit360OpsLeadsCommandLabV20260804','orbit360ProductInsurerCredentialCommandPreview','orbit360ProvisionTeamAccess','orbit360RecurringInsuranceImportLabV20260804','orbit360RevealInsurerBankAccount','orbit360RevealInsurerCredential'];if(!b.every(x=>n.has(x)))throw Error('BASELINE_MISSING');const p=t.filter(x=>n.has(x));if(p.length===0&&a.length===14)console.log('false');else if(p.length===6&&a.length===20)console.log('true');else throw Error('UNEXPECTED_TOPOLOGY:'+a.length+':'+p.join(','));
          NODE
          )
          if test "$REC" = true;then
            npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null;npx playwright install --with-deps chromium >/dev/null;mkdir -p "$E/prior-recovery-cleanup";printf '{"syntheticInsurerId":"%s"}\n' "$PRIOR_SYNTHETIC_ID" > "$RUNNER_TEMP/prior.json"
            set +e;I5_CONTROLLED_WRITE_EVIDENCE="$RUNNER_TEMP/prior.json" I5_RESIDUAL_CLEANUP_EVIDENCE_DIR="$E/prior-recovery-cleanup" I5_EMERGENCY_CLEANUP_AUTHORIZED=true node tools/gravicentra-i5-residual-cleanup-v1.mjs --execute;CR=$?;set -e
            node "$CLI" hosting:channel:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/ch.json";grep -Fq "$PRIOR_RB" "$RUNNER_TEMP/ch.json";node "$CLI" hosting:clone "$HOSTING_SITE:$PRIOR_RB" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive
            for FN in $(echo "$I5_FUNCTION_TARGETS"|tr ',' ' ');do node "$CLI" functions:delete "$FN" --region us-central1 --project "$PROJECT_ID" --force;done
            test "$CR" -eq 0;test "$(jq -r .finalAbsent "$E/prior-recovery-cleanup/i5-residual-cleanup.json")" = true
          fi
          node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/base.json";export BASE="$RUNNER_TEMP/base.json";node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.BASE)),a=Array.isArray(r.result)?r.result:r,n=new Set(a.flatMap(x=>[x.entryPoint,x.id||x.name].map(String)));if(a.length!==14||process.env.I5_FUNCTION_TARGETS.split(',').some(x=>n.has(x)))throw Error('BASELINE_NOT_RECOVERED');
          NODE
          node "$CLI" hosting:channel:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/ch2.json";grep -Fq "$PREVIEW_CHANNEL_ID" "$RUNNER_TEMP/ch2.json";node --check tools/gravicentra-i5-controlled-writes-v1.mjs;node --check tools/gravicentra-i5-residual-cleanup-v1.mjs;node --check tools/gravicentra-i4a-authenticated-browser-v2.mjs;node --check tools/gravicentra-i4b-transversal-v2.mjs
          RB="gi-i5-rb-${GITHUB_RUN_ID}";node "$CLI" hosting:clone "$HOSTING_SITE:live" "$HOSTING_SITE:$RB" --project "$PROJECT_ID" --non-interactive;echo "I5_ROLLBACK_CHANNEL_ID=$RB" >> "$GITHUB_ENV"
          FROOT="$RUNNER_TEMP/functions";mkdir -p "$FROOT";cp -a "$B/backend" "$FROOT/backend";(cd "$FROOT/backend"&&sha256sum -c "$BM"&&npm ci --ignore-scripts --no-audit --no-fund >/dev/null);echo '{"functions":{"source":"backend"}}' > "$FROOT/firebase.json";ONLY="functions:$(echo "$I5_FUNCTION_TARGETS"|sed 's/,/,functions:/g')";node "$CLI" deploy --only "$ONLY" --config "$FROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/after.json";export AFTER="$RUNNER_TEMP/after.json";node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.AFTER)),a=Array.isArray(r.result)?r.result:r,n=new Set(a.flatMap(x=>[x.entryPoint,x.id||x.name].map(String)));if(a.length!==20||process.env.I5_FUNCTION_TARGETS.split(',').some(x=>!n.has(x)))throw Error('POSTDEPLOY_TOPOLOGY');
          NODE
          node "$CLI" hosting:clone "$HOSTING_SITE:$PREVIEW_CHANNEL_ID" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive
          export SITE E;python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['SITE']).read().splitlines() if x.strip()];base=os.environ['PRODUCTION_URL'].rstrip('/');bad=[]
          for want,rel in rows:
            q=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?i5='+os.environ['EXPECTED_HOSTED_PAYLOAD_DIGEST'][:12],headers={'Accept-Encoding':'identity','Cache-Control':'no-cache'})
            with urllib.request.urlopen(q,timeout=30) as z:got=hashlib.sha256(z.read()).hexdigest()
            if got!=want:bad.append(rel)
          if bad:raise SystemExit('READBACK:'+str(bad[:5]))
          with urllib.request.urlopen(base+'/__recovery__/build.json?i5=1',timeout=30) as z:m=json.loads(z.read())
          if m.get('sourceSha')!=os.environ['SOURCE_SHA'] or m.get('buildId')!=os.environ['BUILD_ID']:raise SystemExit('BUILD_MARKER')
          open(os.environ['E']+'/i5-production-hosted-readback.json','w').write(json.dumps({'status':'PASS','readbackExact':True,'fileCount':len(rows),'sourceSha':os.environ['SOURCE_SHA'],'buildId':os.environ['BUILD_ID']},indent=2)+'\n')
          PY
      - name: Install LIVE QA dependencies
        run: npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: LIVE public login startup shell proof
        env: {PREVIEW_URL: "${{ env.PRODUCTION_URL }}", I4A_PUBLIC_EVIDENCE_DIR: "${{ runner.temp }}/gravicentra-i5-evidence/live-public"}
        run: node tools/gravicentra-i4a-public-browser.mjs
      - name: LIVE authenticated module-by-module proof
        env: {PREVIEW_URL: "${{ env.PRODUCTION_URL }}", I4A_AUTH_EVIDENCE_DIR: "${{ runner.temp }}/gravicentra-i5-evidence/live-auth"}
        run: node tools/gravicentra-i4a-authenticated-browser-v2.mjs
      - name: LIVE transversal matrix before writes
        env: {PREVIEW_URL: "${{ env.PRODUCTION_URL }}", I4B_EVIDENCE_DIR: "${{ runner.temp }}/gravicentra-i5-evidence/live-matrix-before-write"}
        run: node tools/gravicentra-i4b-transversal-v2.mjs
      - name: Adjudicate read-only LIVE acceptance
        run: test "$(jq -r .status "$RUNNER_TEMP/gravicentra-i5-evidence/live-public/i4a-public-browser.json")" = PUBLIC_BROWSER_PASS && test "$(jq -r .status "$RUNNER_TEMP/gravicentra-i5-evidence/live-auth/i4a-authenticated-browser.json")" = AUTH_BROWSER_PASS && test "$(jq -r .status "$RUNNER_TEMP/gravicentra-i5-evidence/live-matrix-before-write/i4b-transversal-matrix-v2.json")" = I4B_MATRIX_PASS && test "$(jq -r .contextsPass "$RUNNER_TEMP/gravicentra-i5-evidence/live-matrix-before-write/i4b-transversal-matrix-v2.json")" = 15
      - name: Execute approved controlled synthetic write roundtrip
        env: {I5_EVIDENCE_DIR: "${{ runner.temp }}/gravicentra-i5-evidence/controlled-write", I5_EXECUTION_NONCE: GI-I5-CONTROLLED-WRITE-V1}
        run: node tools/gravicentra-i5-controlled-writes-v1.mjs --execute
      - name: LIVE transversal matrix after write cleanup
        env: {PREVIEW_URL: "${{ env.PRODUCTION_URL }}", I4B_EVIDENCE_DIR: "${{ runner.temp }}/gravicentra-i5-evidence/live-matrix-after-write"}
        run: node tools/gravicentra-i4b-transversal-v2.mjs
      - name: Seal physical I5 LIVE acceptance
        run: |
          E="$RUNNER_TEMP/gravicentra-i5-evidence";test "$(jq -r .status "$E/i5-production-hosted-readback.json")" = PASS;test "$(jq -r .status "$E/controlled-write/i5-controlled-writes.json")" = PASS;test "$(jq -r .writesExecuted "$E/controlled-write/i5-controlled-writes.json")" = 3;test "$(jq -r .finalAbsenceReload "$E/controlled-write/i5-controlled-writes.json")" = true;test "$(jq -r .status "$E/live-matrix-after-write/i4b-transversal-matrix-v2.json")" = I4B_MATRIX_PASS;test "$(jq -r .contextsPass "$E/live-matrix-after-write/i4b-transversal-matrix-v2.json")" = 15
          printf '{"schemaVersion":"gravicentra-i5-live-acceptance-v1","gate":"I5","status":"I5_LIVE_ACCEPTANCE_PASS","sourceSha":"%s","buildId":"%s","artifactId":%s,"productionReadbackExact":true,"automatedLiveTestsBeforeHumanVisual":true,"controlledWritesExecuted":3,"syntheticFinalAbsent":true,"augustDataTouched":false,"productionAcceptedPendingGovernanceSeal":true}\n' "$SOURCE_SHA" "$BUILD_ID" "$I3_ARTIFACT_ID" > "$E/i5-live-acceptance.json"
      - name: Emergency same-owner cleanup before rollback
        if: ${{ failure() && steps.release.outputs.deploy_authorized == 'true' }}
        continue-on-error: true
        env: {I5_CONTROLLED_WRITE_EVIDENCE: "${{ runner.temp }}/gravicentra-i5-evidence/controlled-write/i5-controlled-writes.json", I5_RESIDUAL_CLEANUP_EVIDENCE_DIR: "${{ runner.temp }}/gravicentra-i5-evidence/rollback-cleanup", I5_EMERGENCY_CLEANUP_AUTHORIZED: 'true'}
        run: mkdir -p "$I5_RESIDUAL_CLEANUP_EVIDENCE_DIR"; if test -f "$I5_CONTROLLED_WRITE_EVIDENCE";then npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null;npx playwright install chromium >/dev/null;node tools/gravicentra-i5-residual-cleanup-v1.mjs --execute;else echo '{"finalAbsent":true,"status":"NO_EVIDENCE"}' > "$I5_RESIDUAL_CLEANUP_EVIDENCE_DIR/i5-residual-cleanup.json";fi
      - name: Automatic infrastructure rollback on any I5 failure
        if: ${{ failure() && steps.release.outputs.deploy_authorized == 'true' }}
        run: |
          set -euo pipefail;E="$RUNNER_TEMP/gravicentra-i5-evidence";RESTORED=false;if test -n "${I5_ROLLBACK_CHANNEL_ID:-}";then node "$FIREBASE_CLI_BIN" hosting:clone "$HOSTING_SITE:$I5_ROLLBACK_CHANNEL_ID" "$HOSTING_SITE:live" --project "$PROJECT_ID" --non-interactive;RESTORED=true;fi;node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/rbb.json";export RBB="$RUNNER_TEMP/rbb.json";node - <<'NODE' > "$RUNNER_TEMP/present"
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.RBB)),a=Array.isArray(r.result)?r.result:r,n=new Set(a.flatMap(x=>[x.entryPoint,x.id||x.name].map(String)));for(const x of process.env.I5_FUNCTION_TARGETS.split(','))if(n.has(x))console.log(x);
          NODE
          while read -r FN;do test -z "$FN"||node "$FIREBASE_CLI_BIN" functions:delete "$FN" --region us-central1 --project "$PROJECT_ID" --force;done<"$RUNNER_TEMP/present";node "$FIREBASE_CLI_BIN" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/rba.json";export RBA="$RUNNER_TEMP/rba.json";node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.RBA)),a=Array.isArray(r.result)?r.result:r,n=new Set(a.flatMap(x=>[x.entryPoint,x.id||x.name].map(String)));if(a.length!==14||process.env.I5_FUNCTION_TARGETS.split(',').some(x=>n.has(x)))throw Error('ROLLBACK_NOT_BASELINE');
          NODE
          mkdir -p "$E";printf '{"status":"PASS","hostingPreviousLiveRestored":%s,"newBackendTargetsRemoved":true}\n' "$RESTORED" > "$E/i5-automatic-rollback.json";if test -f "$E/rollback-cleanup/i5-residual-cleanup.json";then test "$(jq -r .finalAbsent "$E/rollback-cleanup/i5-residual-cleanup.json")" = true;fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "gravicentra-i5-evidence-${{ github.run_id }}", path: "${{ runner.temp }}/gravicentra-i5-evidence", include-hidden-files: true, if-no-files-found: error, retention-days: 90}
