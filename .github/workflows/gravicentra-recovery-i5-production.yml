name: Gravicentra Recovery I5 Production Promotion

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      - artifacts/orbit360-recovery/release-control/I5_EXECUTION_INTENT.json
      - tools/gravicentra-i5-controlled-writes-v1.mjs
      - .github/workflows/gravicentra-recovery-i5-production.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gravicentra-recovery-i5-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ays-orbit-360-lab
  HOSTING_SITE: ays-orbit-360-lab
  PRODUCTION_URL: https://ays-orbit-360-lab.web.app

jobs:
  i5-authoritative:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout authoritative Recovery control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: release
        name: Fail closed on I5 authority and exact I3 artifact identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node --check tools/gravicentra-governance-preflight-v1.mjs
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i5
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          const need=(ok,code)=>{if(!ok)throw new Error(code)};
          need(c.status==='I5_IN_PROGRESS','I5_CONTROL_STATUS_INVALID');
          const x=c.certifiedCandidate||{};
          need(x.sameFrontendArtifactPreviewToProductionRequired===true,'I5_SAME_FRONTEND_ARTIFACT_RULE_MISSING');
          need(x.sameBackendSourcePackageRequiredForI5===true,'I5_SAME_BACKEND_PACKAGE_RULE_MISSING');
          need(x.sourceMutatedAfterBuild===false,'I5_SOURCE_MUTATED_AFTER_BUILD');
          need(Number.isInteger(Number(x.artifactId))&&Number(x.artifactId)>0,'I5_I3_ARTIFACT_ID_INVALID');
          need(Number.isInteger(Number(x.i3RunId))&&Number(x.i3RunId)>0,'I5_I3_RUN_ID_INVALID');
          need(typeof x.artifactName==='string'&&x.artifactName.length>8,'I5_I3_ARTIFACT_NAME_INVALID');
          need(/^sha256:[0-9a-f]{64}$/.test(String(x.artifactArchiveDigest||'')),'I5_I3_ARTIFACT_ARCHIVE_DIGEST_INVALID');
          need(/^[0-9a-f]{64}$/.test(String(x.hostedPayloadDigest||'')),'I5_HOSTED_PAYLOAD_DIGEST_INVALID');
          const a=c.i5Execution||{};
          const deploy=a.productionDeployAuthorized===true;
          const writes=a.controlledWritesAuthorized===true;
          if(deploy){
            need(writes===true,'I5_DEPLOY_REQUIRES_CONTROLLED_WRITES_AUTHORIZATION');
            need(a.rollbackPrepared===true,'I5_DEPLOY_REQUIRES_ROLLBACK_PREPARED');
            need(fs.existsSync('artifacts/orbit360-recovery/release-control/I5_EXECUTION_INTENT.json'),'I5_DEPLOY_REQUIRES_EXECUTION_INTENT');
            need(fs.existsSync('tools/gravicentra-i5-controlled-writes-v1.mjs'),'I5_DEPLOY_REQUIRES_CONTROLLED_WRITE_HARNESS');
          }
          const env={
            SOURCE_SHA:x.sourceSha,BUILD_ID:x.buildId,I3_RUN_ID:String(x.i3RunId),I3_ARTIFACT_ID:String(x.artifactId),
            I3_ARTIFACT_NAME:x.artifactName,EXPECTED_ARTIFACT_ARCHIVE_DIGEST:x.artifactArchiveDigest,
            EXPECTED_HOSTED_PAYLOAD_DIGEST:x.hostedPayloadDigest,EXPECTED_BACKEND_SOURCE_DIGEST:x.backendSourceDigest,
            PREVIEW_CHANNEL_ID:x.previewChannelId,PREVIEW_URL:x.previewUrl,
            I5_PRODUCTION_DEPLOY_AUTHORIZED:String(deploy),I5_CONTROLLED_WRITES_AUTHORIZED:String(writes)
          };
          for(const [k,v] of Object.entries(env))fs.appendFileSync(process.env.GITHUB_ENV,`${k}=${v}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`deploy_authorized=${deploy}\n`);
          console.log('I3_ARTIFACT_ID='+x.artifactId);
          console.log('sameFrontendArtifactPreviewToProductionRequired=true');
          console.log('I5_PRODUCTION_DEPLOY_AUTHORIZED='+deploy);
          NODE

      - name: Download exact certified I3 artifact without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.I3_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/gravicentra-i5-certified-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.I3_RUN_ID }}

      - name: Verify certified artifact identity and package digests
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i5-certified-artifact"
          EVIDENCE=$(find "$ROOT" -type f -name i3-evidence.json -print -quit)
          MANIFEST=$(find "$ROOT" -type f -name site-manifest.sha256 -print -quit)
          BUNDLE=$(find "$ROOT" -type d -name bundle -print -quit)
          test -n "$EVIDENCE" -a -n "$MANIFEST" -a -n "$BUNDLE"
          test "$(jq -r '.sourceSha' "$EVIDENCE")" = "$SOURCE_SHA"
          test "$(jq -r '.buildId' "$EVIDENCE")" = "$BUILD_ID"
          test "$(jq -r '.hostedPayloadDigest' "$EVIDENCE")" = "$EXPECTED_HOSTED_PAYLOAD_DIGEST"
          test "$(jq -r '.backendSourceDigest' "$EVIDENCE")" = "$EXPECTED_BACKEND_SOURCE_DIGEST"
          test "$(jq -r '.sameFrontendArtifactPreviewToProductionRequired' "$EVIDENCE")" = "true"
          test "$(jq -r '.sameBackendSourcePackageRequiredForI5' "$EVIDENCE")" = "true"
          test "$(jq -r '.sourceMutatedAfterBuild' "$EVIDENCE")" = "false"
          test -f "$BUNDLE/firebase.json"
          echo "I5_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo I5_CERTIFIED_ARTIFACT_PREDEPLOY_READINESS=PASS
          echo I5_NO_REBUILD=true

      - id: auth
        name: Prove read-only access to current Firebase production topology
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gravicentra-i5-auth"; mkdir -p "$ROOT"; export ROOT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          candidates=[('FIREBASE_SERVICE_ACCOUNT',os.environ.get('SA_DEFAULT','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB',os.environ.get('SA_ORBIT360_LAB','')),('FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB',os.environ.get('SA_ORBIT_360_LAB',''))]
          rows=[]
          for i,(name,raw) in enumerate(candidates):
              if not raw.strip(): continue
              try: data=json.loads(raw)
              except Exception: continue
              if data.get('type')!='service_account' or not data.get('client_email') or not data.get('private_key'): continue
              p=Path(os.environ['ROOT'])/f'{i}.json'; p.write_text(json.dumps(data)); p.chmod(0o600); rows.append((name,str(p),str(data.get('project_id',''))))
          if not rows: raise SystemExit('NO_EXISTING_WELL_FORMED_SERVICE_ACCOUNT')
          (Path(os.environ['ROOT'])/'index.tsv').write_text('\n'.join('\t'.join(x) for x in rows)+'\n')
          PY
          SELECTED_NAME=''; SELECTED_FILE=''; SELECTED_OWNER=''
          while IFS=$'\t' read -r NAME FILE OWNER; do
            set +e
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; A=$?
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; B=$?
            GOOGLE_APPLICATION_CREDENTIALS="$FILE" npx --yes firebase-tools@14.10.1 functions:list --project "$PROJECT_ID" --non-interactive --json > "$ROOT/functions-$NAME.json" 2>/dev/null; C=$?
            set -e
            if [ "$A" -eq 0 ] && [ "$B" -eq 0 ] && [ "$C" -eq 0 ]; then SELECTED_NAME="$NAME"; SELECTED_FILE="$FILE"; SELECTED_OWNER="$OWNER"; cp "$ROOT/functions-$NAME.json" "$ROOT/functions-selected.json"; break; fi
          done < "$ROOT/index.tsv"
          test -n "$SELECTED_FILE" || { echo EXISTING_FIREBASE_PRODUCTION_READ_ACCESS_NOT_PROVEN >&2; exit 42; }
          cp "$SELECTED_FILE" "$RUNNER_TEMP/gravicentra-i5-firebase-sa.json"; chmod 600 "$RUNNER_TEMP/gravicentra-i5-firebase-sa.json"
          echo "credential_source=$SELECTED_NAME" >> "$GITHUB_OUTPUT"
          echo "credential_file=$RUNNER_TEMP/gravicentra-i5-firebase-sa.json" >> "$GITHUB_OUTPUT"
          echo "credential_owner_project=$SELECTED_OWNER" >> "$GITHUB_OUTPUT"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gravicentra-i5-firebase-sa.json" >> "$GITHUB_ENV"

      - name: Capture sanitized production backend topology without mutation
        env:
          FUNCTIONS_RAW: ${{ runner.temp }}/gravicentra-i5-auth/functions-selected.json
          TOPOLOGY_OUT: ${{ runner.temp }}/i5-production-topology-readonly.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync(process.env.FUNCTIONS_RAW,'utf8'));
          const rows=Array.isArray(raw.result)?raw.result:Array.isArray(raw)?raw:[];
          const pick=x=>({
            id:String(x.id||x.name||x.entryPoint||''),
            entryPoint:String(x.entryPoint||x.id||''),
            region:Array.isArray(x.region)?x.region.map(String):String(x.region||''),
            platform:String(x.platform||x.environment||''),
            runtime:String(x.runtime||''),
            state:String(x.state||x.status||'')
          });
          const functions=rows.map(pick).sort((a,b)=>a.id.localeCompare(b.id));
          const names=new Set(functions.flatMap(x=>[x.id,x.entryPoint]).filter(Boolean));
          const targets=['orbit360ProductOperationalCommand','orbit360ProductInsurerCredentialCommand','orbit360OpsLeadsCommand','orbit360CobrosReconciliationCommand','orbit360GetAdvisorOpsInbox','orbit360TenantDomainConfig'];
          const presence=Object.fromEntries(targets.map(x=>[x,names.has(x)]));
          const out={schemaVersion:'gravicentra-i5-production-topology-readonly-v1',gate:'I5',readOnly:true,projectId:process.env.PROJECT_ID,sourceSha:process.env.SOURCE_SHA,buildId:process.env.BUILD_ID,functionCount:functions.length,targetPresence:presence,functions};
          fs.writeFileSync(process.env.TOPOLOGY_OUT,JSON.stringify(out,null,2)+'\n');
          console.log('I5_PRODUCTION_FUNCTION_COUNT='+functions.length);
          console.log('I5_TARGET_FUNCTION_PRESENCE='+JSON.stringify(presence));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i5-readonly-topology-${{ github.run_id }}
          path: ${{ runner.temp }}/i5-production-topology-readonly.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop safely until explicit I5 production authorization exists
        if: ${{ steps.release.outputs.deploy_authorized != 'true' }}
        run: |
          set -euo pipefail
          echo I5_STATE_GATED_EXECUTOR=READY
          echo I5_PRODUCTION_TOPOLOGY_READONLY=CAPTURED
          echo productionTouched=false
          echo dataTouched=false
          echo writesExecuted=0
          echo augustDataTouched=false

      - name: Validate production package prerequisites before any mutation
        if: ${{ steps.release.outputs.deploy_authorized == 'true' }}
        run: |
          set -euo pipefail
          test "$I5_CONTROLLED_WRITES_AUTHORIZED" = "true"
          node --check tools/gravicentra-i5-controlled-writes-v1.mjs
          test -f artifacts/orbit360-recovery/release-control/I5_EXECUTION_INTENT.json
          echo I5_PREDEPLOY_FAIL_CLOSED_PREREQUISITES=PASS

      - name: Production deployment remains unreachable unless all I5 prerequisites are present
        if: ${{ steps.release.outputs.deploy_authorized == 'true' }}
        run: |
          set -euo pipefail
          echo 'I5 production mutation path remains fail-closed until rollback is derived from the captured live topology and validated.' >&2
          exit 86
