name: Gravicentra B4-003 R18 Readonly Forensic

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-readonly-diagnostic.yml'
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'
      - 'tools/gravicentra-i6-5-b4-003-r18-readonly-forensic.mjs'
      - 'tools/gravicentra-b4-003-one-pass-readonly-integrity.cjs'
      - 'artifacts/orbit360-recovery/release-control/I6_5_B4_003_INTEGRAL_AUDIT_REQUEST_20261016.json'
      - 'tools/gravicentra-b4-003-integral-readonly-audit.cjs'
      - 'tools/gravicentra-b4-003-auth-activation-readonly.cjs'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  b4-003-readonly-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      B4_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B4_EXECUTION_LOCK_20261002.json
      RECEIPT: artifacts/orbit360-recovery/release-control/I6_5_B4_003_R18_AUTHENTICATED_READONLY_FORENSIC_RESULT_20261005.json
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact B4-003 diagnostic head
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          CANDIDATE_SOURCE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SOURCE_SHA=$CANDIDATE_SOURCE_SHA" >> "$GITHUB_ENV"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const l=JSON.parse(fs.readFileSync(process.env.B4_LOCK,'utf8'));
          const ok=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R18_AUTHENTICATED_HARNESS_READBACK'
            && c.currentB4?.status==='B4_003_R18_AUTHENTICATED_READONLY_DIAGNOSTIC'
            && c.currentB4?.activeFindingId==='B4-003'
            && l.status==='B4_003_R18_AUTHENTICATED_READONLY_DIAGNOSTIC'
            && l.activeFinding?.id==='B4-003'
            && l.boundaries?.businessWritesAuthorized===false
            && l.boundaries?.productMutationAuthorized===false
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const integrity=c.b4003OnePassOpsLeadsSourceRepair?.status==='SOURCE_STAGED_QA_PENDING_NOT_ACCEPTED'
            && c.currentB4?.status==='B4_003_MACHINE_PASS_PENDING_PAULA_VISUAL'
            && c.b4003SecurityReleaseHold?.status==='ACTIVE_FAIL_CLOSED_UNAUTHORIZED_BROWSER_FIRESTORE_READ_WRITE'
            && c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_TARGETED_PAULA_VISUAL'
            && l.activeFinding?.id==='B4-003'
            && l.boundaries?.businessWritesAuthorized===false
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false
            && require('node:child_process').execFileSync('git',['log','-1','--format=%s'],{encoding:'utf8'}).trim()==='audit(i6.5 B4-003): execute bounded operational relation readback';
          const diagSubject='audit(i6.5 B4-003): post-auth cloud logging and membership readback';
          const currentSubject=require('node:child_process').execFileSync('git',['log','-1','--format=%s'],{encoding:'utf8'}).trim();
          const login=c.b4003LoginStartupScopedRepair20261019||{}, proof=login.previewProof||{};
          const authReadonly=currentSubject===diagSubject
            && c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_TARGETED_PAULA_VISUAL'
            && c.currentB4?.status==='B4_003_MACHINE_PASS_PENDING_PAULA_VISUAL'
            && c.b4003SecurityReleaseHold?.status==='ACTIVE_FAIL_CLOSED_UNAUTHORIZED_BROWSER_FIRESTORE_READ_WRITE'
            && login.status==='TECHNICAL_PREVIEW_PASS_AUTHENTICATED_UAT_HOLD'
            && proof.status===login.status
            && proof.runId===39324152069
            && proof.sourceSha==='125a3f314cb23aa128951ad714c95f143de64abb'
            && proof.authenticatedPositiveNegativeAccepted===false
            && l.activeFinding?.id==='B4-003'
            && l.boundaries?.productMutationAuthorized===false
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.configWritesAuthorized===false
            && l.boundaries?.businessWritesAuthorized===false
            && l.boundaries?.realOperationalWritesAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false
            && c.b4003ProtectedPreviewAuthorization?.realUserImpersonationAuthorized===false
            && c.b4003SecurityReleaseHold?.firestoreRulesDeployAuthorized===false;
          if(currentSubject===diagSubject&&!authReadonly)
            throw Error('B4_003_POST_AUTH_READONLY_DIAGNOSTIC_SCOPE_DENIED');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'auth_readonly='+(authReadonly?'true':'false')+'\n');
          console.log('B4_003_AUTH_OBSERVABILITY='+(authReadonly?'READ_ONLY_NO_IMPERSONATION':'NOOP'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'integrity='+(integrity?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(ok?'true':'false')+'\n');
          const url=c.currentB4?.previewUrl||c.i65ForensicRemediationPlan?.b4?.previewUrl||'';
          if(!url)throw Error('B4_003_ACCEPTED_PREVIEW_URL_MISSING');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'preview_url='+url+'\n');
          console.log('B4_003_DIAGNOSTIC_MODE='+(ok?'RUN':'NOOP'));
          NODE

      - name: Assert LIVE unchanged for release-bound R18 path
        if: steps.gate.outputs.run == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: Capture LIVE drift as blocker for strictly read-only diagnostic
        if: steps.gate.outputs.integrity == 'true'
        env:
          LIVE_BINDING_ATTEMPTS: '1'
        run: |
          set +e
          node tools/gravicentra-certified-live-binding-check.mjs > "$RUNNER_TEMP/b4-003-live-binding-check.log" 2>&1
          RC=$?
          set -e
          if [ "$RC" = '0' ]; then
            echo 'LIVE_BINDING_AUDIT=PASS'
            printf '{"status":"LIVE_BINDING_PASS","productionReleaseAcceptedByThisAudit":false}\n' > "$RUNNER_TEMP/b4-003-live-binding-status.json"
          else
            echo 'LIVE_BINDING_AUDIT=DRIFT_BLOCKS_RELEASE_READONLY_AUDIT_CONTINUES'
            printf '{"status":"LIVE_BINDING_MISMATCH_RELEASE_BLOCKED","reason":"CERTIFIED_BUILD_MARKER_UNAVAILABLE_OR_MISMATCH","productionReleaseAcceptedByThisAudit":false}\n' > "$RUNNER_TEMP/b4-003-live-binding-status.json"
          fi

      - name: Prepare read-only Firebase and browser
        if: steps.gate.outputs.run == 'true' || steps.gate.outputs.integrity == 'true' || steps.gate.outputs.auth_readonly == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b4-003-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          for i,k in enumerate(['SA_ORBIT360_LAB','SA_ORBIT_360_LAB','SA_DEFAULT']):
              raw=os.environ.get(k,'')
              if not raw: continue
              try: d=json.loads(raw)
              except Exception: continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/'service-account.json'
                  p.write_text(json.dumps(d))
                  p.chmod(0o600)
                  print(str(p))
                  break
          else:
              raise SystemExit('B4_003_SERVICE_ACCOUNT_NOT_FOUND')
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ROOT/service-account.json" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false firebase-admin@13.4.0 >/dev/null
          if [ "${{ steps.gate.outputs.run }}" = 'true' ]; then npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null; npx playwright install --with-deps chromium >/dev/null; fi

      # B4-003 existing forensic executor: targeted auth observability only.
      # Never mint real-member credentials or deploy Firestore Rules/LIVE.
      - name: B4-003 post-auth log and membership readback (no writes)
        if: steps.gate.outputs.auth_readonly == 'true'
        env:
          B4_003_AUTH_OBSERVABILITY_OUT: ${{ runner.temp }}/b4-003-auth-observability.json
        run: |
          set -euo pipefail
          node --check tools/gravicentra-b4-003-auth-activation-readonly.cjs
          node tools/gravicentra-b4-003-auth-activation-readonly.cjs
          test -s "$B4_003_AUTH_OBSERVABILITY_OUT"

      - name: Preserve B4-003 post-auth read-only observability
        if: always() && steps.gate.outputs.auth_readonly == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-auth-observability-${{ github.run_id }}
          path: ${{ runner.temp }}/b4-003-auth-observability.json
          if-no-files-found: warn
          retention-days: 30

      - name: Read-only operational integrity within B4-003
        if: steps.gate.outputs.integrity == 'true'
        env:
          B4_003_ONEPASS_OUT: ${{ runner.temp }}/b4-003-onepass-readonly.json
        run: |
          set -euo pipefail
          node --check tools/gravicentra-b4-003-one-pass-readonly-integrity.cjs
          node tools/gravicentra-b4-003-one-pass-readonly-integrity.cjs
          test -s "$B4_003_ONEPASS_OUT"

      - name: Preserve operational integrity evidence
        if: steps.gate.outputs.integrity == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-onepass-integrity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b4-003-onepass-readonly.json
            ${{ runner.temp }}/b4-003-live-binding-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Execute B4-003 R18 read-only forensic
        if: steps.gate.outputs.run == 'true'
        env:
          B4_PREVIEW_URL: ${{ steps.gate.outputs.preview_url }}
          B4_003_DIAGNOSTIC_OUT: ${{ runner.temp }}/b4-003-diagnostic.json
          B4_003_R18_FORENSIC_OUT: ${{ runner.temp }}/b4-003-diagnostic.json
          FORENSIC_REFERENCE_DATE: 2026-10-05
          R18_TARGET_POLICY_NUMBER: "1003687"
        run: |
          set -euo pipefail
          node --check tools/gravicentra-i6-5-b4-003-r18-readonly-forensic.mjs
          node tools/gravicentra-i6-5-b4-003-r18-readonly-forensic.mjs
          test -s "$B4_003_DIAGNOSTIC_OUT"

      - name: Upload B4-003 diagnostic evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-readonly-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/b4-003-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Freeze B4-003 read-only diagnostic
        if: steps.gate.outputs.run == 'true'
        env:
          B4_003_DIAGNOSTIC_OUT: ${{ runner.temp }}/b4-003-diagnostic.json
        run: |
          set -euo pipefail
          cp "$B4_003_DIAGNOSTIC_OUT" "$RECEIPT"
          git config user.name "gravicentra-release-bot"
          git config user.email "gravicentra-release-bot@users.noreply.github.com"
          git add "$RECEIPT"
          if git diff --cached --quiet; then
            echo "B4_003_RECEIPT_UNCHANGED"
            exit 0
          fi
          git commit -m "diag(i6.5 B4-003): freeze R18 authenticated forensic evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"

  b4-003-integral-readonly-complement:
    needs: b4-003-readonly-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      AUDIT_REQUEST: artifacts/orbit360-recovery/release-control/I6_5_B4_003_INTEGRAL_AUDIT_REQUEST_20261016.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify typed read-only audit request on canonical authority
        id: integral
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p=process.env.AUDIT_REQUEST;
          const request=JSON.parse(fs.readFileSync(p));
          const changed=cp.execFileSync('git',['diff-tree','--no-commit-id','--name-only','-r','HEAD'],{encoding:'utf8'}).trim().split('\n');
          const requested=process.env.GITHUB_EVENT_NAME==='workflow_dispatch'||changed.includes(p);
          const blob=cp.execFileSync('git',['hash-object','artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'],{encoding:'utf8'}).trim();
          if(requested&&(request.controlPlaneBlob!==blob||request.mode!=='READ_ONLY_AUDIT_NO_ACCEPTANCE'||request.dataWrites!==false||request.productWrites!==false||request.deploy!==false))throw Error('INTEGRAL_AUDIT_AUTHORITY_MISMATCH');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(requested?'true':'false')+'\n');
          NODE
      - name: Prepare existing authorized credential for reads only
        if: steps.integral.outputs.run == 'true'
        env:
          SA_A: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_B: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_C: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib
          for name in ['SA_A','SA_B','SA_C']:
              try: d=json.loads(os.environ.get(name,''))
              except: continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-integral-readonly-credential.json'
                  p.write_text(json.dumps(d)); p.chmod(0o600)
                  with open(os.environ['GITHUB_ENV'],'a') as f: f.write('GOOGLE_APPLICATION_CREDENTIALS='+str(p)+'\n')
                  break
          else: raise SystemExit('INTEGRAL_AUDIT_EXISTING_CREDENTIAL_UNAVAILABLE')
          PY
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Read-only integral evidence no product acceptance
        if: steps.integral.outputs.run == 'true'
        env:
          INTEGRAL_AUDIT_OUT: ${{ runner.temp }}/gi-integral-readonly-evidence
        run: |
          set -euo pipefail
          node --check tools/gravicentra-b4-003-integral-readonly-audit.cjs
          node tools/gravicentra-b4-003-integral-readonly-audit.cjs
      - name: Preserve evidence including incomplete sections
        if: always() && steps.integral.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-b4-003-integral-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-integral-readonly-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Remove transient credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gi-integral-readonly-credential.json"
