name: Orbit360 F1.4D Run Observer 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f1-4d-run-observer-v20260818.yml'
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      TARGET_SHA: 45c85e6ed6e992b490262f5abf12cce94d7a13c4
      TARGET_PATH: .github/workflows/orbit360-f1-4d-single-successor-runtime-browser-readonly-v20260818.yml
      OUT: orbit360-platform/runtime-gate-crm-v20260716/f1-4d-run-observer-v20260818.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Locate existing F1.4D run only
        env:
          GH_TOKEN_OBSERVER: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          RUN=''
          for i in $(seq 1 15); do
            JSON=$(curl -L --fail --silent --retry 2 -H "Authorization: Bearer $GH_TOKEN_OBSERVER" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${TARGET_SHA}&per_page=100")
            RUN=$(printf '%s' "$JSON" | jq -c --arg path "$TARGET_PATH" --arg sha "$TARGET_SHA" '[.workflow_runs[]|select(.path==$path and .head_sha==$sha)]|sort_by(.created_at)|last // empty')
            [ -n "$RUN" ] && break
            sleep 2
          done
          [ -n "$RUN" ]
          printf '%s' "$RUN" | jq --arg target "$TARGET_SHA" '{schemaVersion:"orbit360-f1-4d-run-observer-v1",ok:true,status:"F1_4D_RUN_DISCOVERED",classification:"OBSERVATION_ONLY",requestCommit:$target,runId:(.id|tostring),runStatus:.status,runConclusion:(.conclusion//""),runAttempt:.run_attempt,rerunExecuted:(.run_attempt>1),observerRuntimeExecuted:false,observerBrowserExecuted:false,observerSecretAccess:false,observerDataAccess:false,observerFirestoreWrites:0,observerAuthWrites:0,observerOperationalWrites:0,observerDeployExecuted:false,observerProductionTouched:false,containsPII:false,containsSecrets:false}' > "$OUT"
      - name: Persist observer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'test(f1.4d): persist runtime run discovery'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
