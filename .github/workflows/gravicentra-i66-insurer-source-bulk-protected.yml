name: Gravicentra I6.6 Insurer Source Bulk Protected
on:
  workflow_dispatch:
    inputs:
      source_manifest:
        description: Insurer-pinned I6.6 source manifest within the existing recovery branch
        required: true
        type: string
        default: artifacts/orbit360-recovery/source-batches/I6_6_SOURCE_BULK_20261120_MULTI_302.json
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-insurer-source-bulk-protected.yml
      - tools/gravicentra-i66-issued-renewal*.cjs
      - tools/gravicentra-i66-source-bulk-plan.cjs
      - tools/gravicentra-i66-source-bulk-apply.cjs
      - tools/gravicentra-i66-source-bulk-live.cjs
      - tools/gravicentra-i66-source-bulk-plan.test.cjs
      - tools/gravicentra-i66-source-bulk-apply.test.cjs
      - artifacts/orbit360-recovery/source-batches/I6_6_SOURCE_BULK_*.json
permissions:
  contents: read
concurrency:
  group: gravicentra-i66-source-bulk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GCLOUD_PROJECT: ays-orbit-360-lab
  GI_I66_BULK_SOURCE_MANIFEST: ${{ inputs.source_manifest || 'artifacts/orbit360-recovery/source-batches/I6_6_SOURCE_BULK_20261120_MULTI_302.json' }}
  SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
  SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
  SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
jobs:
  preflight:
    if: >
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'I66_SOURCE_BULK_READY') ||
      contains(github.event.head_commit.message, 'I66_REFRESH_PINNED_SOURCE'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.judge.outputs.ready }}
      issued_ready: ${{ steps.issued.outputs.eligible }}
      issued_before: ${{ steps.issued.outputs.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source adapter, isolated exceptions and payment-preservation tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GCLOUD_PROJECT" = ays-orbit-360-lab
          node --check tools/gravicentra-i66-source-bulk-plan.cjs
          node --check tools/gravicentra-i66-source-bulk-apply.cjs
          node --check tools/gravicentra-i66-source-bulk-live.cjs
          node tools/gravicentra-i66-source-bulk-plan.test.cjs
          node tools/gravicentra-i66-source-bulk-apply.test.cjs
      - name: Select configured Firebase service account for bounded read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gi-i66-source-bulk" --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/gi-i66-source-bulk/node_modules" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-bulk-existing.json'
          for key in ('SA_LAB','SA_LAB_ALT','SA_DEFAULT'):
              try: value=json.loads(os.environ.get(key,''))
              except (TypeError,ValueError): continue
              if value.get('type')!='service_account' or value.get('project_id')!='ays-orbit-360-lab' or not value.get('private_key'): continue
              out.write_text(json.dumps(value),encoding='utf8');out.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as env: env.write('GOOGLE_APPLICATION_CREDENTIALS='+str(out)+'\n')
              print('I66_BULK_EXISTING_FIREBASE_IDENTITY_PASS');break
          else: raise SystemExit('I66_BULK_FIREBASE_IDENTITY_MISSING')
          PY
      - name: Compute unique pending receipt and cartera source differences with zero writes
        shell: bash
        env:
          GI_I66_BULK_MODE: preflight
          GI_I66_BULK_PLAN_OUT: ${{ runner.temp }}/gi-i66-bulk-plan.json
          GI_I66_BULK_REPORT_OUT: ${{ runner.temp }}/gi-i66-bulk-preflight.json
        run: |
          set -euo pipefail
          node tools/gravicentra-i66-source-bulk-live.cjs
      - name: Verify documentary successor without writes on the frozen D02 authority
        id: issued
        if: contains(github.event.head_commit.message, 'I66_D02_ISSUED_CAS')
        run: |
          node --test tools/gravicentra-i66-issued-renewal-cas.test.cjs
          node tools/gravicentra-i66-issued-renewal-protected.cjs preflight
      - id: judge
        name: Verify exact counts before protected financial writes
        shell: bash
        env:
          GI_I66_BULK_PLAN_OUT: ${{ runner.temp }}/gi-i66-bulk-plan.json
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync(process.env.GI_I66_BULK_PLAN_OUT,'utf8'));
          assert.equal(p.status,'BULK_SOURCE_PREFLIGHT_ONLY_NO_WRITES');
          assert.equal(p.writes,0);
          assert.ok(p.inputRows>=1&&p.inputRows<=5000);
          assert.equal(p.inputRows,p.readyCount+p.unchangedCount+p.exceptionCount);
          assert.ok(p.chunks.every(c=>c.count<=250));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+(p.readyCount>0?'true':'false')+'\n');
          console.log('I66_BULK_PROTECTED_PREFLIGHT_PASS input='+p.inputRows+' ready='+p.readyCount+
            ' unchanged='+p.unchangedCount+' exceptions='+p.exceptionCount+' chunks='+p.chunks.length+' ZERO_WRITES');
          JS
      - name: Preserve immutable plan and private actionable exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-source-bulk-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gi-i66-bulk-plan.json
            ${{ runner.temp }}/gi-i66-bulk-preflight.json
          if-no-files-found: ignore
          retention-days: 14
  protected-source-bulk-live:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: gravicentra-live-data-writes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: gi-i66-source-bulk-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/i66-source-bulk-plan
      - name: Recheck source and negative tests inside protected review gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/recovery/fase-a-clean-20260831
          test "$GITHUB_REPOSITORY" = paulaosoriof86/orbit360-core
          test "$GCLOUD_PROJECT" = ays-orbit-360-lab
          node tools/gravicentra-i66-source-bulk-plan.test.cjs
          node tools/gravicentra-i66-source-bulk-apply.test.cjs
      - name: Select the same authorized Firebase project for protected CAS writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gi-i66-source-bulk" --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/gi-i66-source-bulk/node_modules" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-bulk-existing.json'
          for key in ('SA_LAB','SA_LAB_ALT','SA_DEFAULT'):
              try: value=json.loads(os.environ.get(key,''))
              except (TypeError,ValueError): continue
              if value.get('type')!='service_account' or value.get('project_id')!='ays-orbit-360-lab' or not value.get('private_key'): continue
              out.write_text(json.dumps(value),encoding='utf8');out.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as env: env.write('GOOGLE_APPLICATION_CREDENTIALS='+str(out)+'\n')
              print('I66_BULK_PROTECTED_EXISTING_FIREBASE_IDENTITY_PASS');break
          else: raise SystemExit('I66_BULK_PROTECTED_FIREBASE_IDENTITY_MISSING')
          PY
      - name: Apply only exact preimage-pinned pending source corrections, audit and read back
        shell: bash
        env:
          GI_I66_BULK_MODE: apply
          GI_I66_BULK_PROTECTED_ENV: gravicentra-live-data-writes
          GI_I66_BULK_PLAN_IN: ${{ runner.temp }}/i66-source-bulk-plan/gi-i66-bulk-plan.json
          GI_I66_BULK_REPORT_OUT: ${{ runner.temp }}/gi-i66-bulk-live.json
        run: |
          set -euo pipefail
          node tools/gravicentra-i66-source-bulk-live.cjs
      - name: Preserve receipt and cartera before-after readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-source-bulk-live-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-i66-bulk-live.json
          if-no-files-found: ignore
          retention-days: 90

  protected-issued-documentary-successor:
    needs: preflight
    if: needs.preflight.outputs.issued_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: gravicentra-i66-d02-issued-documentary-successor
      cancel-in-progress: false
    environment: gravicentra-live-data-writes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the same authorized Firebase project for protected CAS writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gi-i66-source-bulk" --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/gi-i66-source-bulk/node_modules" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-bulk-existing.json'
          for key in ('SA_LAB','SA_LAB_ALT','SA_DEFAULT'):
              try: value=json.loads(os.environ.get(key,''))
              except (TypeError,ValueError): continue
              if value.get('type')!='service_account' or value.get('project_id')!='ays-orbit-360-lab' or not value.get('private_key'): continue
              out.write_text(json.dumps(value),encoding='utf8');out.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as env: env.write('GOOGLE_APPLICATION_CREDENTIALS='+str(out)+'\n')
              print('I66_BULK_PROTECTED_EXISTING_FIREBASE_IDENTITY_PASS');break
          else: raise SystemExit('I66_BULK_PROTECTED_FIREBASE_IDENTITY_MISSING')
          PY
      - name: Commit exact D02 issue, original links, one receipt and portfolio atomically with protected preimage
        env:
          GI_I66_BULK_PROTECTED_ENV: gravicentra-live-data-writes
          I66_D02_EXPECTED_BEFORE: ${{ needs.preflight.outputs.issued_before }}
        run: |
          node --test tools/gravicentra-i66-issued-renewal-cas.test.cjs
          node tools/gravicentra-i66-issued-renewal-protected.cjs apply
