name: Gravicentra I4A Postfix Readonly Validation

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-postfix-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravicentra-i4a-postfix-readonly-${{ github.ref }}
  cancel-in-progress: false

env:
  PREVIEW_URL: https://ays-orbit-360-lab--gi-i3-34139734779-j3clvpf2.web.app
  SOURCE_SHA: 4dbf4f157b95f61ffa563ecd0cfba7303d7b55c7
  BUILD_ID: gi-i3-4dbf4f157b95-57f234755dc1

jobs:
  postfix-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Recovery instrumentation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install read-only diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute post-fix causal regression probe
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          I4A_POSTFIX_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-postfix-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$I4A_POSTFIX_EVIDENCE_DIR"
          node tools/gravicentra-i4a-postfix-readonly-validation.mjs

      - name: Publish post-fix status
        if: always()
        shell: bash
        run: |
          {
            echo '## Gravicentra Insurance — I4A postfix read-only'
            echo "- Preview: $PREVIEW_URL"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Build: \`$BUILD_ID\`"
            echo '- Production touched: false'
            echo '- Data touched: false'
            echo '- Writes executed: 0'
            if [ -f "$RUNNER_TEMP/gravicentra-i4a-postfix-evidence/i4a-postfix-readonly.json" ]; then
              node -e "const x=require(process.env.RUNNER_TEMP+'/gravicentra-i4a-postfix-evidence/i4a-postfix-readonly.json'); console.log('- Status: `'+x.status+'`'); console.log('- Checks: `'+JSON.stringify(x.checks)+'`'); console.log('- Errors: `'+JSON.stringify(x.errors)+'`');" 
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve post-fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-postfix-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-postfix-evidence
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
