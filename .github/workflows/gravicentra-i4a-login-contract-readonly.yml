name: Gravicentra I4A Login Contract Readonly

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-login-contract-readonly.yml
      - tools/gravicentra-i4a-login-contract-readonly.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 4dbf4f157b95f61ffa563ecd0cfba7303d7b55c7
  BUILD_ID: gi-i3-4dbf4f157b95-57f234755dc1
  PREVIEW_URL: https://ays-orbit-360-lab--gi-i3-34139734779-j3clvpf2.web.app

jobs:
  login-contract-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only QA dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Execute Login lifecycle and responsive contract
        env:
          I4A_LOGIN_EVIDENCE_DIR: ${{ runner.temp }}/gravicentra-i4a-login-contract
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
        run: node tools/gravicentra-i4a-login-contract-readonly.mjs
      - name: Publish Login contract summary
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/gravicentra-i4a-login-contract/i4a-login-contract.json
        run: |
          set -euo pipefail
          {
            echo '## Gravicentra Insurance — I4A Login contract'
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Build: \`$BUILD_ID\`"
            if [ -f "$EVIDENCE" ]; then
              echo "- Status: \`$(jq -r '.status' "$EVIDENCE")\`"
              echo "- Responsive: \`$(jq -c '.checks.responsive // [] | map({name,pass})' "$EVIDENCE")\`"
              echo "- Activation: \`$(jq -c '.checks.activation // {}' "$EVIDENCE")\`"
              echo "- Reload: \`$(jq -c '.checks.reload // {}' "$EVIDENCE")\`"
              echo "- Logout: \`$(jq -c '.checks.logout // {}' "$EVIDENCE")\`"
              echo "- Writes: \`$(jq -r '.writesExecuted' "$EVIDENCE")\`"
            else
              echo '- Status: `NO_EVIDENCE_FAIL_CLOSED`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Login contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-login-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-login-contract
          if-no-files-found: error
          retention-days: 30
