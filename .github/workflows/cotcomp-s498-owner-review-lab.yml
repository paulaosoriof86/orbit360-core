name: CotComp S4.98 Owner Review LAB

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s496b-frontend-recovery-lab-20261004
    paths:
      - 'functions/cotcomp-owner-review-s498.js'
      - 'functions/cotcomp-owner-review-s498.test.js'
      - 'functions/bootstrap.js'
      - 'functions/cotcomp-clean-parent-s497.js'
      - 'functions/cotcomp-s497-*'
      - 'docs/cotcomp/S497_INTERNAL_MANUAL_VISUAL_AUDIT_OWNER_REVIEW_READINESS_2026-10-04.md'
      - '.github/workflows/cotcomp-s498-owner-review-lab.yml'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_FUNCTION: cotcompOwnerReviewS498
  COTCOMP_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompOwnerReviewS498
  CATALOG_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompVehicleCatalogS479

jobs:
  owner-review-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Owner-review authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/cotcomp/S497_INTERNAL_MANUAL_VISUAL_AUDIT_OWNER_REVIEW_READINESS_2026-10-04.md
          grep -q 'PASS FOR OWNER REVIEW CANDIDATE' docs/cotcomp/S497_INTERNAL_MANUAL_VISUAL_AUDIT_OWNER_REVIEW_READINESS_2026-10-04.md
          grep -q "ownerReviewUrlAuthorized:true" functions/cotcomp-owner-review-s498.js
          grep -q "providerDeploymentAuthorized:false" functions/cotcomp-owner-review-s498.js
          grep -q "cotcompRealTransportAuthorized:false" functions/cotcomp-owner-review-s498.js
          grep -q "production:false" functions/cotcomp-owner-review-s498.js

      - name: Run S4.97 + S4.98 source QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:cotcomp:s497
          npm run test:cotcomp:s497
          node --check cotcomp-owner-review-s498.js
          node --check cotcomp-owner-review-s498.test.js
          node --test cotcomp-owner-review-s498.test.js

      - name: Prepare LAB deployment credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s498/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s498/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S4.98 Owner Review to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$COTCOMP_FUNCTION" --project "$COTCOMP_PROJECT_ID" --non-interactive --force

      - name: Physical readback and boundary proof
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/s498/evidence"
          CODE="$(curl -sS -o "$E/page.html" -w '%{http_code}' "$COTCOMP_URL")"
          test "$CODE" = "200"
          grep -q 'OWNER_REVIEW_LAB_ONLY' "$E/page.html"
          grep -q 'ays-owner-review-authorized" content="true"' "$E/page.html"
          grep -q 'Cotiza y compara' "$E/page.html"
          grep -q 'data-vehicle-combo="brand"' "$E/page.html"
          grep -q 'data-vehicle-combo="model"' "$E/page.html"
          grep -q 'Vista de revisión Owner en LAB' "$E/page.html"
          ! grep -q 'Este artefacto no está autorizado para URL de Owner Review' "$E/page.html"
          POST_CODE="$(curl -sS -o "$E/post.txt" -w '%{http_code}' -X POST "$COTCOMP_URL")"
          test "$POST_CODE" = "405"

          CAT_CODE="$(curl -sS -o "$E/catalog-meta.json" -w '%{http_code}' "$CATALOG_URL?op=meta")"
          test "$CAT_CODE" = "200"
          node - "$E/catalog-meta.json" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.ok!==true || j.labOnly!==true || j.appDataSource!==false || j.providerEligibilityEmbedded!==false) process.exit(1);
          NODE

          node - "$E/S498_OWNER_REVIEW_LAB_RECEIPT.json" <<'NODE'
          const fs=require('fs');
          const out=process.argv[2];
          fs.writeFileSync(out,JSON.stringify({
            schemaVersion:'ays-cotcomp-s498-owner-review-lab-receipt-v1.0',
            functionUrl:process.env.COTCOMP_URL,
            projectId:process.env.COTCOMP_PROJECT_ID,
            ownerReviewUrlAuthorized:true,
            internalManualVisualAuditPassed:true,
            vehicleCatalogPhysicalReadback:true,
            providerDeploymentAuthorized:false,
            cotcompRealTransportAuthorized:false,
            productionTouched:false,
            writes:false
          },null,2));
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s498-owner-review-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s498/evidence/S498_OWNER_REVIEW_LAB_RECEIPT.json
            ${{ runner.temp }}/s498/evidence/page.html
            ${{ runner.temp }}/s498/evidence/catalog-meta.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s498/firebase-service-account.json"
