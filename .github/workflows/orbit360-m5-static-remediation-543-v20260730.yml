name: Orbit 360 · M5 root-cause static remediation · 5.0.43
run-name: M5 5.0.43 · portal Academia owner static remediation · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-static-remediation-543-request-v20260730.json'

permissions:
  contents: read
  statuses: write

jobs:
  static_remediation:
    name: M5 · 5.0.43 · zero-capability root-cause validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar request y sintaxis
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f tools/orbit360-m5-static-remediation-543-request-v20260730.json
          node --check orbit360-platform/modules/portal-v1142-copyfix.js
          node --check tools/orbit360-m5-release-candidate-readiness-543-v20260730.mjs
      - name: Ejecutar readiness estático 5.0.43
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-543-v20260730.mjs
          jq -e '.ok==true and .status=="M5_RC_543_STATIC_REMEDIATION_READY_LAB_DELIVERY_REQUIRED" and .releaseCandidate.criticalAssetCount==47 and .releaseCandidate.portalOwnerIncluded==true and .releaseCandidate.portalStaticCourseVersion==150 and .releaseCandidate.strictPolicyPreserved==true and .remoteLab.assetsExpected==30 and .remoteLab.assetsMatched==29 and .remoteLab.mismatchCount==1 and .remoteLab.mismatchPaths==["modules/portal-v1142-copyfix.js"] and .remoteLab.expectedPortalOwnerPending==true and .approvalReadyForLabDelivery==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .production==false' orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-543-summary.json >/dev/null
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-static-remediation-543-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-543-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest-543.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-543-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.43 static remediation failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.ok===true&&s.approvalReadyForLabDelivery===true){state='success';description='M5 5.0.43 root cause fixed; LAB delivery required';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-static-remediation-543',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
