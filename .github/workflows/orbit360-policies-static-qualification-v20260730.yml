name: Orbit 360 · Policies static qualification 7.0.1 · historical
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical_guard:
    name: Policies · historical WRITE_PASS closure guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirmar cierre histórico sin reabrir prewrite
        shell: bash
        run: |
          set -euo pipefail
          test -f orbit360-platform/docs/CIERRE-WRITE-POLIZAS-AYS-20260730.md
          grep -Fq 'Estado: `WRITE_PASS`' orbit360-platform/docs/CIERRE-WRITE-POLIZAS-AYS-20260730.md
          grep -Fq 'polizas: 1373' orbit360-platform/docs/CIERRE-WRITE-POLIZAS-AYS-20260730.md
          grep -Fq 'La autorización macro' orbit360-platform/docs/CIERRE-WRITE-POLIZAS-AYS-20260730.md
          echo 'HISTORICAL_POLICIES_STATIC_RETIRED_AFTER_WRITE_PASS'
