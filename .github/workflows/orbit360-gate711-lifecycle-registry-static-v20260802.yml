name: Orbit 360 · Gate 7.11 · lifecycle registry · estático
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-lifecycle-registry-static-v20260802.json'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    name: Gate 7.11 · registro lifecycle activo · cero runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout histórico completo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar registro, lifecycle y readiness
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=.github/orbit360-static-requests/gate711-lifecycle-registry-static-v20260802.json
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST"
          jq -e '.schemaVersion=="orbit360-gate711-lifecycle-registry-static-request-v1" and .approved==true and .allowedExecutions==1 and .consumed==false and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-validar-rootfix-static-readiness-gate711-v20260802.mjs
          jq -e '.schemaVersion=="orbit360-gate711-rootfix-lifecycle-registry-v1" and .activeLifecycleFile=="tools/orbit360-validator-lifecycle-contract-gate711-macro-readonly-v20260802.json" and .authorizationRef=="user_authorizes_single_macro_readonly_rootfix_then_gate711_20260802T1437-0600" and .writesAllowed==false and .deployAllowed==false and .productionAllowed==false' tools/orbit360-gate711-rootfix-lifecycle-registry-v20260802.json >/dev/null
          ORBIT360_GATE711_LIFECYCLE_FILE=tools/orbit360-validator-lifecycle-contract-gate711-macro-readonly-v20260802.json node tools/orbit360-validar-rootfix-static-readiness-gate711-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_ROOTFIX_STATIC_READINESS_PASS" and .classification=="GO_STATIC_ROOTFIX_READINESS" and .total==12 and .passed==12 and .failed==0 and .lifecycleRegistry.activeLifecycleFile=="tools/orbit360-validator-lifecycle-contract-gate711-macro-readonly-v20260802.json" and .lifecycleRegistry.authorizationRef=="user_authorizes_single_macro_readonly_rootfix_then_gate711_20260802T1437-0600" and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .firestoreWrites==0 and .operationalWrites==0 and .deployExecuted==false and .production==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-rootfix-static-readiness-v20260802.json >/dev/null
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-lifecycle-registry-static-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/gate711-rootfix-static-readiness-v20260802.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/gate711-rootfix-static-readiness-v20260802.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Gate 7.11 lifecycle registry static failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='GATE711_ROOTFIX_STATIC_READINESS_PASS'&&p.failed===0){state='success';description='Gate 7.11 lifecycle registry static PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-lifecycle-registry-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
