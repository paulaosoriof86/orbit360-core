name: Orbit 360 · Cobros · source intake static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/cobros-source-intake-static-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-cobros-source-intake-static-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  TRIGGER: .github/orbit360-triggers/cobros-source-intake-static-v20260801.json
  EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/cobros-source-intake-static-v20260801.json
jobs:
  source_intake_static:
    name: Gate 10.1 · engine, manifests and source boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar trigger y lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-cobros-source-intake-static-trigger-v1" and .approved==true and .gateId=="block10.1-cobros-source-intake-static-v20260801" and .contractVersion=="10.1.0" and .branch==env.ORBIT360_BRANCH and .scope.static==true and .scope.payloads==false and .scope.browser==false and .scope.secrets==false and .scope.firestoreRead==false and .scope.writes==false and .scope.deploy==false and .scope.production==false' "$TRIGGER" >/dev/null
          AUTHORIZED_HEAD="$(jq -r '.authorizedHead' "$TRIGGER")"
          test -n "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$AUTHORIZED_HEAD" HEAD
          bad="$(git diff --name-only "$AUTHORIZED_HEAD"..HEAD | grep -Ev '^\.github/orbit360-triggers/cobros-source-intake-static-v20260801\.json$' || true)"
          test -z "$bad"
      - name: Gate predecessor Cobros read-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-cobros-conciliacion-readonly-v20260801.mjs
          jq -e '.status=="GO_GATE_CONTRACT" and .domainStatus=="COBROS_CONCILIACION_READONLY_STATIC_READY" and .contractVersion=="10.0.0" and .failed==0 and .cobrosWrites==0 and .finmovsWrites==0' orbit360-platform/runtime-gate-crm-v20260716/cobros-conciliacion-readonly-static-v20260801.json >/dev/null
      - name: Gate source intake 10.1
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/importa-cobros-conciliacion-p0.js
          node --check tools/orbit360-test-importa-cobros-conciliacion-p0-v20260801.mjs
          node --check tools/orbit360-validar-manifest-cobros-fuente-ays-v20260801.mjs
          node --check tools/orbit360-test-validar-manifest-cobros-fuente-ays-v20260801.mjs
          node --check tools/orbit360-validar-cobros-source-intake-static-v20260801.mjs
          node tools/orbit360-validar-cobros-source-intake-static-v20260801.mjs
          jq -e '.status=="GO_GATE_CONTRACT" and .domainStatus=="COBROS_SOURCE_INTAKE_STATIC_READY" and .contractVersion=="10.1.0" and .failed==0 and .engineResult.status=="COBROS_SOURCE_DRYRUN_ENGINE_PASS" and .manifestResult.status=="COBROS_SOURCE_MANIFEST_VALIDATOR_PASS" and .registryStatus=="OPEN_PENDING_MORE_FILES" and .realPayloadsRequired==true and .cobrosWrites==0 and .finmovsWrites==0 and .firestoreWrites==0 and .operationalWrites==0 and .secretsRead==false and .firestoreRead==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE" >/dev/null
      - name: Subir evidencia sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-cobros-source-intake-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/cobros-conciliacion-readonly-static-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/cobros-source-intake-static-v20260801.json
          if-no-files-found: error
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: ${{ env.EVIDENCE }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='Cobros source intake static blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.status==='GO_GATE_CONTRACT'&&p.domainStatus==='COBROS_SOURCE_INTAKE_STATIC_READY'&&p.failed===0){state='success';description='Cobros source intake static PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/cobros-source-intake-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
