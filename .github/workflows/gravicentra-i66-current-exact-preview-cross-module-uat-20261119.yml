name: Gravicentra I6.6 Current Exact Preview Signed Cross-Module UAT
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-current-exact-preview-cross-module-uat-20261119.yml
      - tools/gravicentra-i6-6-carlos-client-edit-signed-synthetic-uat.cjs
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-current-exact-preview-crossmodule-qa
  cancel-in-progress: false
jobs:
  signed-preview:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      I66_VERIFY_CORADO_QUEUE: '1'
      I66_VERIFY_COLLABORATION_ROUNDTRIP: '1'
      I66_PREVIEW_ORIGIN: https://ays-orbit-360-lab--gi-i66-rc-44826594717-x8drvh8s.web.app
      I66_SIGNED_QA_CHANNEL_ID: gi-i66-rc-44826594717
      I66_SOURCE_SHA: f1eb5bc6397f0b159079be516a521dd7b1e5d9ba
      EXPECTED_BUILD_RUN: '44826594717'
      EXPECTED_ARTIFACT_ID: '14674736714'
      EXPECTED_ARTIFACT_DIGEST: sha256:e55fcc674a6cc493cdedff27672d082222db3dd7134354559788364b6ae23713
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin previously certified immutable artifact and existing LIVE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$I66_SOURCE_SHA" HEAD
          test -z "$(git diff --name-only "$I66_SOURCE_SHA" HEAD -- orbit360-platform functions firebase.json firestore.rules storage.rules)"
          node --check tools/gravicentra-i6-6-carlos-real-signed-synthetic-preview-uat.cjs
          node --check tools/gravicentra-i66-carlos-paula-signed-direct-renewal-preview-hydration-readonly.cjs
          node --check tools/gravicentra-i6-6-carlos-payment-signed-synthetic-preview-uat.cjs
          node --check tools/gravicentra-i6-6-carlos-german-assignment-roster-readonly.cjs
          node --check tools/gravicentra-i6-6-carlos-client-edit-signed-synthetic-uat.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const h={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'GI-I66-Current-Operational-QA'};
            const base='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const [run,artifact,preview,live]=await Promise.all([
              fetch(base+'runs/'+process.env.EXPECTED_BUILD_RUN,{headers:h}).then(x=>x.json()),
              fetch(base+'artifacts/'+process.env.EXPECTED_ARTIFACT_ID,{headers:h}).then(x=>x.json()),
              fetch(process.env.I66_PREVIEW_ORIGIN+'/__recovery__/build.json',{headers:{'cache-control':'no-cache'}}).then(x=>x.json()),
              fetch('https://app.aysseguros.com/__recovery__/build.json',{headers:{'cache-control':'no-cache'}}).then(x=>x.json())
            ]);
            assert.equal(run.conclusion,'success','IMMUTABLE_BUILD_NOT_ACCEPTED');
            assert.equal(run.head_sha,process.env.I66_SOURCE_SHA,'BUILD_SOURCE_MISMATCH');
            assert.equal(artifact.workflow_run?.id,run.id,'ARTIFACT_WRONG_RUN');
            assert.equal(artifact.digest,process.env.EXPECTED_ARTIFACT_DIGEST,'ARTIFACT_DIGEST_DRIFT');
            assert.equal(artifact.expired,false,'ARTIFACT_EXPIRED');
            assert.equal(preview.sourceSha,process.env.I66_SOURCE_SHA,'PREVIEW_SOURCE_DRIFT');
            assert.match(String(live.sourceSha||''),/^[0-9a-f]{40}$/,'LIVE_BUILD_MARKER_MISSING');
            // The approved source is now the current LIVE; a retired importer marker is not authority.
            assert.equal(live.sourceSha,process.env.I66_SOURCE_SHA,'LIVE_CERTIFIED_SOURCE_DRIFT');
            console.log('I66_NO_LIVE_ACCEPTANCE_CLAIM_FROM_THIS_PREVIEW_UAT');
            console.log('I66_EXACT_PREVIEW_PACKAGE_PASS_CURRENT_LIVE_PROVENANCE_SEPARATE_HOLD');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          NODE
      - name: Owner contract and anti-regression source tests
        run: |
          set -euo pipefail
          node --test tools/gravicentra-i6-6-manual-policy-capture-p0.test.cjs tools/gravicentra-i6-6-ops-activity-direct-vehicle-endorsement.test.cjs tools/gravicentra-i6-6-documented-premium-terms.test.cjs
          node --test tools/gravicentra-i6-6-operational-renewal-entry.test.cjs tools/gravicentra-i6-6-carlos-ops-tasks-transversal.test.cjs tools/gravicentra-i6-6-cliente360-advisor-source-parity.test.cjs tools/gravicentra-i6-6-crm-shadow-advisor-source.test.cjs tools/gravicentra-i6-6-client-edit-activity-country-persistence.test.cjs
      - name: Check renewal and payment behavior against the bytes served by this Preview
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gi-i66-hosted-check"
          mkdir -p "$proof/tools" "$proof/orbit360-platform/modules"
          for module in cobros.js issuance-endosos-v1201-bridge.js renewals-v1200-operational-bridge.js cliente360.js; do
            curl --fail --silent --show-error --max-time 30 "$I66_PREVIEW_ORIGIN/modules/$module" -o "$proof/orbit360-platform/modules/$module"
            cmp "$proof/orbit360-platform/modules/$module" "orbit360-platform/modules/$module"
          done
          cp tools/gravicentra-i6-6-operational-renewal-entry.test.cjs tools/gravicentra-i6-6-cobros-payment-failure-category.test.cjs "$proof/tools/"
          node --test "$proof"/tools/*.test.cjs
          # The actual hosted Cobros source must tolerate rejected optional
          # uploads without suppressing the authorized payment command.
          I66_HOSTED_COBROS="$proof/orbit360-platform/modules/cobros.js" node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync(process.env.I66_HOSTED_COBROS,'utf8');
          const start=src.indexOf('        // Payment is the primary, server-owned transaction.');
          const end=src.indexOf('        const applied=await domain.applyPayment(',start);
          assert.ok(start>=0&&end>start,'HOSTED_OPTIONAL_DOCUMENT_PAYMENT_OWNER_NOT_FOUND');
          const code=src.slice(start,end);
          const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;
          const fn=new AsyncFunction('supportFile','invoiceFile','uploadPaymentDocument','c','receipt','state','console',
            code+'return {supportRef,invoiceRef,pendingEvidence};');
          (async()=>{
            const q={id:'qa_only_receipt'},state={textContent:''};
            const fail=await fn({name:'support.pdf'},{name:'invoice.pdf'},
              async()=>{throw Error('QA_GOOGLE_DRIVE_UNAVAILABLE')},{},q,state,{warn(){}});
            assert.deepEqual(fail.pendingEvidence,['comprobante del cliente','factura de la aseguradora']);
            assert.equal(fail.supportRef,'');assert.equal(fail.invoiceRef,'');
            assert.match(state.textContent,/Se registrará el pago sin ese archivo/);
            const ok=await fn({name:'support.pdf'},{name:'invoice.pdf'},
              async(_file,kind)=>'QA_DOC_REF_'+kind,{},q,{textContent:''},{warn(){}});
            assert.equal(ok.supportRef,'QA_DOC_REF_payment_support');
            assert.equal(ok.invoiceRef,'QA_DOC_REF_insurer_invoice');
            assert.deepEqual(ok.pendingEvidence,[]);
            assert.ok(src.includes("applicationDate:pm.querySelector('#pm-app').value") &&
              src.includes("invoiceNumber:pm.querySelector('#pm-invoice-number').value") &&
              src.includes("invoiceDocumentRef:invoiceRef"));
            console.log('I66_HOSTED_OPTIONAL_DOCUMENT_FAILURE_DOES_NOT_BLOCK_PAYMENT_AND_ONE_STEP_INVOICE_FIELDS_PASS_ZERO_WRITES');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          NODE
      - name: Check import source review against the exact bytes served by Preview
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gi-i66-hosted-import"
          mkdir -p "$proof/orbit360-platform/core" "$proof/tools"
          curl --fail --silent --show-error --max-time 30 "$I66_PREVIEW_ORIGIN/core/importa.js" -o "$proof/orbit360-platform/core/importa.js"
          cmp "$proof/orbit360-platform/core/importa.js" orbit360-platform/core/importa.js
          cp tools/gravicentra-i6-6-import-source-preview.test.cjs "$proof/tools/"
          node --test "$proof/tools/gravicentra-i6-6-import-source-preview.test.cjs"
      - name: Install signed browser dependencies without source changes
        id: browser_setup
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Carlos and Dirección signed actual Editar Cliente phone/advisor/atomic country activity durable write reload and cleanup
        env:
          I66_SIGNED_CLIENT_EDIT_ORIGIN: https://ays-orbit-360-lab--gi-i66-rc-44826594717-x8drvh8s.web.app
          I66_SIGNED_CLIENT_EDIT_SOURCE: f1eb5bc6397f0b159079be516a521dd7b1e5d9ba
        run: node tools/gravicentra-i6-6-carlos-client-edit-signed-synthetic-uat.cjs
      - name: Real-role signed Preview Ops Leads Tasks transactional writes and restoration
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: node tools/gravicentra-i6-6-carlos-real-signed-synthetic-preview-uat.cjs
      - name: Real-role signed Preview direct-renewal hydration (read-only)
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: node tools/gravicentra-i66-carlos-paula-signed-direct-renewal-preview-hydration-readonly.cjs
      - name: Real-role signed Preview payment receipt-carrier synthetic UAT and restoration
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: node tools/gravicentra-i6-6-carlos-payment-signed-synthetic-preview-uat.cjs
      - name: Carlos Operativo signed roster in actual Editar Cliente, Nuevo Cliente, Nueva Póliza and Ops; LIVE untouched
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: node tools/gravicentra-i6-6-carlos-german-assignment-roster-readonly.cjs
      - name: Read the restored LIVE roster and Corado handback before considering promotion
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          I66_PROVE_LIVE_NEW_CLIENT: ${{ env.I66_SOURCE_SHA }}
        run: node tools/gravicentra-i6-6-carlos-german-assignment-roster-readonly.cjs

  signed-live-functional-regression:
    # Scoped controlled QA only: no new deployment, changes to actual business
    # policy/insurer/payments, service account permissions or legal consent.
    needs: signed-preview
    if: ${{ github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831' && needs.signed-preview.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      I66_LIVE_ORIGIN: https://app.aysseguros.com
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact current I6.6 LIVE source, transport, readback, scope and rollback boundary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const cp=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'));
          const tr=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json'));
          const r=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_DIRECT_PAYMENT_OPTIONAL_DOCUMENT_LIVE_READBACK_20261120.json'));
          const c=cp.i66LatestPhysicalFrontendLive20261120||{};
          assert.equal(cp.currentExecutionDecisionPointer,'i66LatestPhysicalFrontendLive20261120');
          assert.equal(c.sourceSha,r.sourceSha);
          assert.equal(c.sourceSha,tr.currentPhysicalHostingRelease.sourceSha);
          assert.equal(c.buildId,r.buildId);
          assert.equal(c.artifactDigest,r.artifactDigest);
          assert.equal(c.hostedFilesEachOrigin,224);
          assert.equal(r.liveCloneRunResult,'SUCCESS');
          assert.equal(r.fullI66ProductionAccepted,false);
          assert.equal(r.dataWrites,0);
          assert.equal(tr.paymentDirectOptionalDocumentPreviewRequest20261120.consumedBySignedLiveRunId,r.liveCloneRunId);
          assert.ok(cp.i66OperationalExactLiveAcceptance20261117?.fullI66ProductionAccepted===false);
          fs.appendFileSync(process.env.GITHUB_ENV,'I66_APPROVED_LIVE_SOURCE_SHA='+c.sourceSha+'\n');
          console.log('I66_LIVE_REGRESSION_GUARD_SOURCE_AND_BACKEND_HISTORICAL_BOUNDARY=PASS');
          NODE
          git merge-base --is-ancestor "$I66_APPROVED_LIVE_SOURCE_SHA" HEAD
          test -z "$(git diff --name-only "$I66_APPROVED_LIVE_SOURCE_SHA" HEAD -- orbit360-platform functions firestore.rules storage.rules firebase.json)"
          node --check tools/gravicentra-i6-6-carlos-paula-live-direct-renewal-synthetic-uat.cjs
          node --check tools/gravicentra-i6-6-carlos-paula-live-insurer-synthetic-write-uat.cjs
      - name: Install pinned signed browser QA dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Operativo and Dirección LIVE issued-renewal synthetic write/readback/reload/replay/restore
        run: node tools/gravicentra-i6-6-carlos-paula-live-direct-renewal-synthetic-uat.cjs
      - name: Operativo and Dirección LIVE insurer directory account CRUD permission/reload/restore
        run: node tools/gravicentra-i6-6-carlos-paula-live-insurer-synthetic-write-uat.cjs
      - name: Explicit scoped QA disposition
        if: success()
        run: |
          echo 'I66_CURRENT_EXACT_LIVE_SYNTHETIC_RENEWAL_AND_INSURER_PASS_REAL_BUSINESS_ISSUANCE_AND_DRIVE_DOCUMENTS_STILL_HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo 'I66_LIVE_SYNTHETIC_RECORDS_FULLY_RESTORED_BY_EACH_DRIVER; NO_NEW_LIVE_BUILD_OR_DEPLOY' >> "$GITHUB_STEP_SUMMARY"
