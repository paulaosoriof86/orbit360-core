name: Orbit 360 · Critical route control-plane · source-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-control-plane-route-critical-source-v20260810.yml'
      - 'tools/orbit360-validar-gate-contracts-v20260717.mjs'
      - 'tools/orbit360-validar-gate-contracts-legacy-v20260717.mjs'
      - 'tools/orbit360-validator-lifecycle-block1-two-client-cloud-audit-v33-v20260807.json'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-v33-v20260807.mjs'
      - 'tools/orbit360-validator-lifecycle-contract-policies-static-v20260730.json'
      - 'tools/orbit360-validar-gate-contracts-engine-policies-static-v20260730.mjs'
      - 'tools/orbit360-validator-lifecycle-contract-vehicles-static-v20260730.json'
      - 'tools/orbit360-validar-gate-contracts-engine-vehicles-static-v20260730.mjs'
      - 'tools/orbit360-validator-lifecycle-contract-receipts-portfolio-static-v910-20260730.json'
      - 'tools/orbit360-validar-gate-contracts-engine-receipts-portfolio-static-v910-20260730.mjs'
      - 'tools/orbit360-test-receipts-portfolio-controlled-write-static-v910-20260730.mjs'
      - 'orbit360-platform/docs/CIERRE-WRITE-POLIZAS-AYS-20260730.md'
      - 'orbit360-platform/docs/CIERRE-WRITE-VEHICULOS-AYS-20260730.md'
      - 'orbit360-platform/docs/CIERRE-WRITE-RECIBOS-CARTERA-AYS-V910-20260730.md'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-control-plane-route-critical-source-v20260810
  cancel-in-progress: false
env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  source_only:
    name: Block1 v33 → Policies → Vehicles → Receipts · no capabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis de control-plane
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-legacy-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-v33-v20260807.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-policies-static-v20260730.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-vehicles-static-v20260730.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-receipts-portfolio-static-v910-20260730.mjs
      - name: Block1 v33 · source-only
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION \
            node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          cp "$EVIDENCE_DIR/preflight-sanitizado.json" /tmp/block1-v33.json
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="1.0.41" and .failed==0 and .secretAccess==false and .firestoreRead==false and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' /tmp/block1-v33.json >/dev/null
      - name: Policies 7.0.1 · closed reusable
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block7-policies-static-v20260730
          cp "$EVIDENCE_DIR/preflight-sanitizado.json" /tmp/policies.json
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="POLICIES_WRITE_CLOSED_REUSABLE" and .contractVersion=="7.0.1" and .writeClosed==true and .operationalCount==1373 and .operationalWrites==0 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .deployExecuted==false and .productionTouched==false' /tmp/policies.json >/dev/null
      - name: Vehicles 8.0.1 · closed reusable
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block8-vehicles-static-v20260730
          cp "$EVIDENCE_DIR/preflight-sanitizado.json" /tmp/vehicles.json
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="VEHICLES_WRITE_CLOSED_REUSABLE" and .contractVersion=="8.0.1" and .writeClosed==true and .vehiclePolicyRelationsCreate==1032 and .operationalCount==1032 and .operationalWrites==0 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .deployExecuted==false and .productionTouched==false' /tmp/vehicles.json >/dev/null
      - name: Receipts 9.1.0 · closed reusable
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block9-receipts-portfolio-static-v20260730
          cp "$EVIDENCE_DIR/preflight-sanitizado.json" /tmp/receipts.json
          node tools/orbit360-test-receipts-portfolio-controlled-write-static-v910-20260730.mjs > /tmp/receipts-test.json
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="RECEIPTS_PORTFOLIO_WRITE_CLOSED_REUSABLE" and .contractVersion=="9.1.0" and .writeClosed==true and .requestState=="HISTORICAL_CONSUMED_EVIDENCE" and .receiptsExpected==1293 and .portfolioPending==673 and .operationalWrites==0 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .deployExecuted==false and .productionTouched==false' /tmp/receipts.json >/dev/null
          jq -e '.status=="STATIC_WRITE_CLOSED" and .failed==0 and .requestState=="HISTORICAL_CONSUMED_EVIDENCE"' /tmp/receipts-test.json >/dev/null
      - name: Sellar evidencia acumulativa source-only
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --slurpfile b /tmp/block1-v33.json \
            --slurpfile p /tmp/policies.json \
            --slurpfile v /tmp/vehicles.json \
            --slurpfile r /tmp/receipts.json \
            '{schemaVersion:"orbit360-critical-route-control-plane-source-v1",ok:true,status:"GO_CRITICAL_ROUTE_CONTROL_PLANE_SOURCE",head:$sha,gates:{block1:$b[0].status,policies:$p[0].classification,vehicles:$v[0].classification,receipts:$r[0].classification},counts:{policies:$p[0].operationalCount,vehicles:$v[0].operationalCount,receipts:$r[0].receiptsExpected,portfolio:$r[0].portfolioPending},secretAccess:false,firestoreRead:false,operationalWrites:0,runtimeExecuted:false,browserExecuted:false,deployExecuted:false,productionTouched:false}' \
            > "$EVIDENCE_DIR/control-plane-route-critical-source-v20260810.json"
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/control-plane-route-critical-source-v20260810.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Critical route source control-plane blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='GO_CRITICAL_ROUTE_CONTROL_PLANE_SOURCE'&&p.operationalWrites===0){state='success';description='Critical route control-plane SOURCE PASS; zero capabilities';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/control-plane-route-critical-source',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-control-plane-route-critical-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/control-plane-route-critical-source-v20260810.json
          if-no-files-found: warn
          retention-days: 30
