# I6.6 one-purpose, read-only inventory/dry-run. Never writes Firestore.
# All operational source authority remains the canonical I6.6 ledger/checkpoint.
name: Gravicentra I6.6 Maria 10 source LIVE READ ONLY

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i66-maria-10-source-live-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gi-i66-maria-source-readonly
  cancel-in-progress: false

jobs:
  inspect-ten-receipts-only:
    if: github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: ays-orbit-360-lab
      GCLOUD_PROJECT: ays-orbit-360-lab
      FIREBASE_PROJECT_ID: ays-orbit-360-lab
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exact recovery and read-only boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: recovery/fase-a-clean-20260831

      - name: Guard source checkpoint and extract unchanged runner/fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          echo "GI_I66_REPORT_PATH=$RUNNER_TEMP/gi-i66-maria-ten-receipts-before.json" >> "$GITHUB_ENV"
          test "$PROJECT_ID" = "ays-orbit-360-lab"
          test -z "${FIRESTORE_EMULATOR_HOST:-}"
          SRC=artifacts/orbit360-recovery/release-control/i6-6-p0-checkpoints/I66_UNIVERSALES_MARIA_10_PATCH_ONLY_NOT_APPLIED_20261110.tar.gz.b64.md
          test "$(git hash-object "$SRC")" = "0938c08daa1238b77007eb785ab5bd955dfac3ab"
          mkdir -p "$RUNNER_TEMP/gi-i66-maria-source"
          awk '/^```base64$/{on=1;next} /^```$/{on=0} on{print}' "$SRC" | base64 --decode > "$RUNNER_TEMP/gi-i66-maria-source/bundle.tar.gz"
          test "$(tar -tzf "$RUNNER_TEMP/gi-i66-maria-source/bundle.tar.gz" | grep -Ec '(^/|(^|/)\.\.(/|$))' || true)" = 0
          tar -xzf "$RUNNER_TEMP/gi-i66-maria-source/bundle.tar.gz" --no-same-owner -C "$RUNNER_TEMP/gi-i66-maria-source"
          FIXTURE=$(find "$RUNNER_TEMP/gi-i66-maria-source" -type f -name 'i66_universales_maria_source_PATCH_ONLY_NOT_APPLIED.json' -print -quit)
          RUNNER=$(find "$RUNNER_TEMP/gi-i66-maria-source" -type f -name 'gravicentra-i66-universales-source-patch-guarded.NOT_APPLIED.cjs' -print -quit)
          test -n "$FIXTURE" && test -n "$RUNNER"
          node --check "$RUNNER"
          node - "$FIXTURE" <<'JS'
          const fs=require('fs'),f=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(f.projectId!=='ays-orbit-360-lab'||f.status!=='NOT_APPLIED'||f.rows.length!==10||new Set(f.rows.map(x=>x.receiptId)).size!==10)throw Error('SOURCE_FIXTURE_BOUNDARY_INVALID');
          console.log('I66_MARIA_ARCHIVED_SOURCE_GUARD=PASS_10');
          JS
          echo "GI_I66_FIXTURE_PATH=$FIXTURE" >> "$GITHUB_ENV"
          echo "GI_I66_RUNNER_PATH=$RUNNER" >> "$GITHUB_ENV"

      - name: Install pinned Firebase Admin dependency for read-only queries
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gi-i66-maria-admin" --no-audit --no-fund --ignore-scripts firebase-admin@13.4.0 >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/gi-i66-maria-admin/node_modules" >> "$GITHUB_ENV"

      - name: Resolve existing exact project service account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-maria-auth"
          chmod 700 "$RUNNER_TEMP/gi-i66-maria-auth"
          python3 - <<'PY'
          import json,os,pathlib
          target='ays-orbit-360-lab'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-maria-auth'/'existing-lab.json'
          for key in ('SA_LAB','SA_LAB_ALT','SA_DEFAULT'):
              try: obj=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError):continue
              if obj.get('type')!='service_account' or obj.get('project_id')!=target or not obj.get('private_key'):continue
              p.write_text(json.dumps(obj),encoding='utf-8')
              p.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as output:output.write('GOOGLE_APPLICATION_CREDENTIALS='+str(p)+'\n')
              print('I66_MARIA_EXACT_LAB_CREDENTIAL_PROJECT_GUARD_PASS')
              break
          else:raise SystemExit('I66_MARIA_EXACT_LAB_CREDENTIAL_UNAVAILABLE')
          PY

      - name: Remap exact LIVE ids and dry-run source numbers with independent due-date HOLD; NO writes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          'use strict';
          const fs=require('fs');
          const crypto=require('crypto');
          const {getApps,initializeApp}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const sha=v=>crypto.createHash('sha256').update(typeof v==='string'?v:JSON.stringify(v)).digest('hex');
          const str=x=>String(x===null||x===undefined?'':x).trim();
          const pad=i=>String(i).padStart(3,'0');
          const stable=v=>{
            if(v===null||typeof v!=='object')return v;
            if(typeof v.toJSON==='function')return stable(v.toJSON());
            if(Array.isArray(v))return v.map(stable);
            return Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])]));
          };
          const snapshotHash=x=>sha(JSON.stringify(stable(x)));
          const reportPath=process.env.GI_I66_REPORT_PATH;
          const sourcePath='artifacts/orbit360-recovery/release-control/I6_6_COBROS_CONCILIACION_SOURCE_INTAKE_20261110.json';
          (async()=>{
            if(process.env.PROJECT_ID!=='ays-orbit-360-lab'||process.env.GCLOUD_PROJECT!=='ays-orbit-360-lab'||process.env.FIRESTORE_EMULATOR_HOST)throw Error('PROJECT_OR_EMULATOR_HOLD');
            const archived=JSON.parse(fs.readFileSync(process.env.GI_I66_FIXTURE_PATH,'utf8'));
            const ledger=JSON.parse(fs.readFileSync(sourcePath,'utf8'));
            const checkpoint=ledger.i66UniversalesBatchCheckpoint20261110||{};
            const nums=checkpoint.insurerReceiptNumbers||[];
            if(archived.projectId!=='ays-orbit-360-lab'||archived.status!=='NOT_APPLIED'||archived.rows.length!==10||checkpoint.recordCount!==10||nums.length!==10)throw Error('SOURCE_10_FIXTURE_HOLD');
            if(archived.policyId!=='pol_mwajp407_fizii'||archived.policyNumber!=='04-15-01-000603-0'||checkpoint.policyNumber!==archived.policyNumber||archived.clientId!=='cli_mwafruvk')throw Error('ORIGINAL_SOURCE_IDENTITY_HOLD');
            if(checkpoint.archive?.blobSha!=='0938c08daa1238b77007eb785ab5bd955dfac3ab')throw Error('SOURCE_ARCHIVE_SHA_HOLD');
            for(let i=0;i<10;i++){
              if(str(archived.rows[i].receiptId)!=='cob_pol_mwajp407_fizii_'+pad(i+3)||str(nums[i])!==String(39460328+i))throw Error('ARCHIVED_SOURCE_SEQUENCE_HOLD');
            }
            const db=getFirestore(getApps()[0]||initializeApp({projectId:'ays-orbit-360-lab'}));
            const tenantDocs=await db.collection('tenants').listDocuments();
            if(!tenantDocs.length||tenantDocs.length>300)throw Error('TENANT_LIST_BOUNDARY_HOLD');
            const eligible=new Map();
            for(const tenant of tenantDocs){
              const policies=tenant.collection('data').doc('polizas').collection('items');
              for(const key of ['numero','numeroPoliza','numero_poliza']){
                const q=await policies.where(key,'==',archived.policyNumber).limit(3).get();
                for(const d of q.docs){
                  const p=d.data()||{};
                  if(d.id==='pol_mwajp407'&&str(p.id)==='pol_mwajp407'&&str(p.clienteId)===archived.clientId&&str(p.pais).toUpperCase()==='GT'&&(!p.tenantId||p.tenantId===tenant.id)){
                    eligible.set(tenant.id+'/'+d.id,{tenantId:tenant.id,policyId:d.id,policy:p});
                  }
                }
              }
            }
            if(eligible.size!==1)throw Error('EXACT_LIVE_POLICY_NOT_UNIQUE_HOLD_'+eligible.size);
            const target=[...eligible.values()][0];
            const base=db.collection('tenants').doc(target.tenantId).collection('data').doc('recibosEsperados').collection('items');
            const allBefore=[];
            for(let seq=1;seq<=12;seq++){
              const receiptId='cob_pol_mwajp407_'+pad(seq);
              const d=await base.doc(receiptId).get();
              if(!d.exists)throw Error('MISSING_LIVE_RECEIPT_SEQUENCE_HOLD_'+seq);
              const data=d.data()||{};
              if(data.id&&data.id!==receiptId)throw Error('LIVE_RECEIPT_ROW_ID_HOLD_'+seq);
              allBefore.push({id:d.id,...data});
            }
            if(allBefore.length!==12)throw Error('NOT_12_LIVE_RECEIPTS_HOLD');
            const issues=[];
            const proposedNumbers=[];
            const contractDateDiff=[];
            const preserveFields=['serie','secuencia','cuota','monto','montoTotal','primaTotal','vence','fechaLimite','estado','estadoPago','fechaPago','pagado','conciliado','polizaId'];
            for(let i=0;i<12;i++){
              const seq=i+1,r=allBefore[i];
              if(str(r.polizaId)!=='pol_mwajp407'||Number(r.secuencia)!==seq||str(r.cuota)!==seq+'/12')issues.push('RECEIPT_RELATION_OR_SERIES_'+seq);
              if(Number(r.monto).toFixed(2)!=='952.56')issues.push('AMOUNT_NOT_952_56_'+seq);
              if(seq<3)continue;
              const sourceNumber=nums[seq-3];
              const beforeNumber=str(r.numeroReciboFuente);
              if(beforeNumber&&beforeNumber!==sourceNumber)issues.push('SOURCE_NUMBER_CONFLICT_'+seq);
              if(r.pagado===true||r.conciliado===true||r.fechaPago||r.estadoPago&&str(r.estadoPago).toLowerCase().includes('pagad'))issues.push('PAYMENT_FIELD_CONFLICT_'+seq);
              if(str(r.estado).toLowerCase()!=='pendiente')issues.push('NON_PENDING_RECEIPT_'+seq);
              proposedNumbers.push({sequence:seq,receiptId:r.id,changeOnly:'numeroReciboFuente',before:beforeNumber||null,after:sourceNumber,requiresPatch:beforeNumber!==sourceNumber,preserveFields});
              const insurerDate=new Date(Date.UTC(2026,11+seq-3,1)).toISOString().slice(0,10);
              const liveDate=str(r.vence);
              if(liveDate!==insurerDate){
                contractDateDiff.push({sequence:seq,receiptId:r.id,insurerContractualDueDate:insurerDate,liveContractualDueDate:liveDate,liveOperationalLimit:str(r.fechaLimite),separateAction:'REVIEW_DATE_ENGINE_NO_DATE_WRITE'});
              }
            }
            for(const candidate of proposedNumbers){
              const q=await base.where('numeroReciboFuente','==',candidate.after).limit(3).get();
              if(q.docs.some(d=>d.id!==candidate.receiptId))issues.push('DUPLICATE_SOURCE_NUMBER_'+candidate.sequence);
              if(q.docs.length>1)issues.push('SOURCE_NUMBER_NON_UNIQUE_'+candidate.sequence);
            }
            const allAfter=[];
            for(let seq=1;seq<=12;seq++){
              const receiptId='cob_pol_mwajp407_'+pad(seq);
              const d=await base.doc(receiptId).get();
              if(!d.exists)throw Error('CONCURRENT_DELETE_HOLD_'+seq);
              allAfter.push({id:d.id,...(d.data()||{})});
            }
            // Read linked operational portfolio in the SAME tenant, without writes.
            const portfolioCol=db.collection('tenants').doc(target.tenantId).collection('data').doc('carteraPrimas').collection('items');
            const portfolioQuery=await portfolioCol.where('polizaId','==',target.policyId).limit(40).get();
            const portfolioBefore=portfolioQuery.docs.map(d=>({id:d.id,...(d.data()||{})})).sort((a,b)=>a.id.localeCompare(b.id));
            const portfolioAfter=[];
            for(const row of portfolioBefore){
            const d=await portfolioCol.doc(row.id).get();
            if(!d.exists)issues.push('PORTFOLIO_CONCURRENT_DELETE_'+row.id.slice(-4));
            else portfolioAfter.push({id:d.id,...(d.data()||{})});
            }
            portfolioAfter.sort((a,b)=>a.id.localeCompare(b.id));
            const portfolioBeforeDigest=snapshotHash(portfolioBefore);
            const portfolioAfterDigest=snapshotHash(portfolioAfter);
            if(portfolioBeforeDigest!==portfolioAfterDigest)issues.push('PORTFOLIO_CONCURRENT_CHANGE');
            const portfolioSafe=portfolioBefore.map(x=>({id:x.id,reciboId:x.reciboId||null,polizaId:x.polizaId||null,
            vence:x.vence||null,fechaLimite:x.fechaLimite||null,fechaVencimiento:x.fechaVencimiento||null,
            estado:x.estado||null,estadoOperativo:x.estadoOperativo||null,carteraActiva:x.carteraActiva===true,
            monto:x.monto??null,primaTotal:x.primaTotal??null}));
            const operationalLimitDiff=[];
            const plus15=day=>{const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+15);return d.toISOString().slice(0,10)};
            for(const diff of contractDateDiff){
            const receipt=allBefore.find(r=>r.id===diff.receiptId);
            const newLimit=plus15(diff.insurerContractualDueDate);
            if(str(receipt.fechaLimite)!==plus15(str(receipt.vence)))issues.push('ORIGINAL_LIMIT_NOT_PLUS_15_'+diff.sequence);
            if(str(receipt.fechaLimite)!==newLimit)operationalLimitDiff.push({sequence:diff.sequence,receiptId:diff.receiptId,
            field:'fechaLimite',before:str(receipt.fechaLimite),after:newLimit,
            contractRule:'UTC_PLUS_15_CALENDAR_DAYS',noWrite:true});
            }
            const portfolioLinkDiff=[];
            for(const diff of contractDateDiff){
            const matches=portfolioSafe.filter(x=>x.reciboId===diff.receiptId);
            if(matches.length!==1){issues.push('PORTFOLIO_LINK_NOT_ONE_'+diff.sequence);continue;}
            const car=matches[0],newDue=diff.insurerContractualDueDate,newLimit=plus15(newDue);
            portfolioLinkDiff.push({sequence:diff.sequence,id:car.id,reciboId:car.reciboId,
            fieldPatchPreview:{vence:{before:car.vence,after:newDue},
            fechaLimite:{before:car.fechaLimite,after:newLimit},
            fechaVencimiento:{before:car.fechaVencimiento,after:newLimit}},
            stateReadOnly:{estado:car.estado,estadoOperativo:car.estadoOperativo,carteraActiva:car.carteraActiva},
            noWrite:true});
            }
            const beforeDigest=snapshotHash({policy:target.policy,receipts:allBefore});
            const afterReReadDigest=snapshotHash({policy:target.policy,receipts:allAfter});
            if(beforeDigest!==afterReReadDigest)issues.push('CONCURRENT_RECEIPT_CHANGE');
            const policyAgain=await db.collection('tenants').doc(target.tenantId).collection('data').doc('polizas').collection('items').doc(target.policyId).get();
            if(!policyAgain.exists||snapshotHash(policyAgain.data()||{})!==snapshotHash(target.policy))issues.push('CONCURRENT_POLICY_CHANGE');
            const cleanReport={
              schemaVersion:'gi.i66.universales.remap.10_numbers_and_contractual_due.READONLY.v1',
              dateGuatemala:'2026-11-10',projectId:'ays-orbit-360-lab',
              authorityLedger:sourcePath,sourceArchiveBlob:'0938c08daa1238b77007eb785ab5bd955dfac3ab',
              insurerAgingDate:'2026-11-09',insurerAgingPdfSha256:'f7bd1833a1573d4d0a1e6b494b71383aa1209f0b9afec3f06972a31213f1bd4b',
              oldArchivedPolicyId:archived.policyId,livePolicyId:target.policyId,
              tenantIdHash:sha(target.tenantId).slice(0,12),livePolicyUniqueCount:eligible.size,
              receiptCount:12,sourceNumberCount:proposedNumbers.length,
              portfolioCount:portfolioBefore.length,portfolioBeforeDigest,portfolioAfterDigest,
              portfolioRows:portfolioSafe,portfolioConcurrentReadbackMatch:portfolioBeforeDigest===portfolioAfterDigest,
              beforeDigest,afterReReadDigest,concurrentReadbackMatch:beforeDigest===afterReReadDigest,
              independentDiffs:{
                numbersOnly:{field:'numeroReciboFuente',expectedCount:10,patchCount:proposedNumbers.filter(x=>x.requiresPatch).length,rows:proposedNumbers},
                contractualDueDates:{field:'vence',source:'Universales aging 2026-11-09; first of month',mismatchCount:contractDateDiff.length,rows:contractDateDiff,noDateWrites:true},
                operationalDeadlines:{field:'fechaLimite',keptSeparate:true,ruleVerifiedInLive:'PLUS_15_CALENDAR_DAYS',patchPreviewCount:operationalLimitDiff.length,rows:operationalLimitDiff,writeCount:0},
                portfolioDerivedDates:{collection:'carteraPrimas',patchPreviewCount:portfolioLinkDiff.length,rows:portfolioLinkDiff,writeCount:0}
              },
              anomalies:issues,
              status:issues.length?'HOLD_STRICT_READONLY_GUARD':'READ_ONLY_NUMBERS_DRY_RUN_PASS_DATE_RECONCILIATION_HOLD',
              applied:false,liveDataWrites:0,livePaymentWrites:0,liveDateWrites:0,liveReceiptCreates:0,
              futureApplyContract:'EXACT_TENANT_AND_12_RECEIPT_CAS_BEFORE_DIGEST_RECHECK_SOURCE_NUMBER_ONLY'
            };
            fs.writeFileSync(reportPath,JSON.stringify(cleanReport,null,2)+'\n',{mode:0o600});
            console.log('I66_MARIA_REMAP_POLICY_FOUND_COUNT='+eligible.size);
            console.log('I66_MARIA_REMAP_LIVE_RECEIPTS='+allBefore.length);
            console.log('I66_MARIA_REMAP_SOURCE_NUMBERS='+proposedNumbers.length);
            console.log('I66_MARIA_REMAP_NUMBERS_ONLY_PATCH_COUNT='+proposedNumbers.filter(x=>x.requiresPatch).length);
            console.log('I66_MARIA_REMAP_DATE_MISMATCH_COUNT='+contractDateDiff.length);
            console.log('I66_MARIA_REMAP_DATE_MISMATCH_SEQUENCES='+contractDateDiff.map(x=>x.sequence).join(','));
            console.log('I66_MARIA_REMAP_BEFORE_DIGEST='+beforeDigest);
            console.log('I66_MARIA_REMAP_AFTER_REREAD_DIGEST='+afterReReadDigest);
            console.log('I66_MARIA_REMAP_CAR_PORTFOLIO_COUNT='+portfolioBefore.length);
            console.log('I66_MARIA_REMAP_CAR_PORTFOLIO_DIGEST='+portfolioBeforeDigest);
            console.log('I66_MARIA_REMAP_CAR_PORTFOLIO_REREAD_DIGEST='+portfolioAfterDigest);
            console.log('I66_MARIA_REMAP_CAR_PORTFOLIO_SAFE_SUMMARY='+JSON.stringify(portfolioSafe));
            console.log('I66_MARIA_REMAP_OPERATIONAL_PLUS15_DIFF='+operationalLimitDiff.length);
            console.log('I66_MARIA_REMAP_CAR_LINKED_DATE_DIFF='+portfolioLinkDiff.length);
            console.log('I66_MARIA_REMAP_GUARD_ANOMALY_COUNT='+issues.length);
            console.log('I66_MARIA_REMAP_STATUS='+cleanReport.status);
            console.log('I66_MARIA_REMAP_DATA_WRITES=0');
            if(issues.length)throw Error('STRICT_DATA_GUARD_HOLD_'+issues.join('_').slice(0,120));
          })().catch(e=>{console.error('I66_MARIA_REMAP_READONLY_HOLD='+String(e.message||e).slice(0,150));process.exitCode=1});
          JS

      - name: Preserve exact sanitized before-snapshot evidence even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-maria-ten-receipts-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-i66-maria-ten-receipts-before.json
          if-no-files-found: warn
          retention-days: 30
