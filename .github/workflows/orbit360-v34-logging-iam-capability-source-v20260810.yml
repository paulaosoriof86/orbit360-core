name: Orbit360 v34 logging IAM capability source-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-v34-logging-iam-capability-source-v20260810.yml'
      - 'tools/orbit360-validator-lifecycle-block1-logging-iam-capability-v34-v20260810.json'
      - 'tools/orbit360-gate-contract-registry-extension-block1-v34-logging-iam-v20260810.json'
      - 'tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs'
      - 'tools/orbit360-validar-gate-contracts-v20260717.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-v34-logging-iam-capability-source-v20260810
  cancel-in-progress: false
env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  V34_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v34-logging-iam-capability-source-sanitized-v20260810.json
jobs:
  source:
    name: v34 · logging IAM capability · source-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical Block1 gate before diagnostic preparation
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit \
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION \
            node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .failed==0 and .requestState=="FROZEN_HISTORICAL_CONSUMED" and .executionAuthorized==false and .secretAccessAuthorized==false and .writesAuthorized==0' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Validate lifecycle and registry
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
          node <<'NODE'
          const fs=require('fs');
          const l=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-block1-logging-iam-capability-v34-v20260810.json','utf8'));
          const r=JSON.parse(fs.readFileSync('tools/orbit360-gate-contract-registry-extension-block1-v34-logging-iam-v20260810.json','utf8'));
          const required=['logging.logEntries.list','logging.privateLogEntries.list'];
          const same=a=>Array.isArray(a)&&required.every(x=>a.includes(x))&&a.length===2;
          if(l.gateId!=='block1-client360-insurers-lab-v20260717'||l.gateContractVersion!=='1.0.41')throw new Error('V34_GATE_CONTRACT_MISMATCH');
          if(l.currentPhase!=='SOURCE_ONLY_LOGGING_IAM_CAPABILITY_V34'||l.executionAuthorized!==false)throw new Error('V34_SOURCE_PHASE_INVALID');
          if(!same(l.diagnosticContract?.permissions)||!same(r.requiredPermissions))throw new Error('V34_PERMISSION_SET_INVALID');
          if(l.diagnosticContract?.modifiesIam!==false||l.diagnosticContract?.readsAuditLogEntries!==false||l.diagnosticContract?.readsTargetClientData!==false)throw new Error('V34_SOURCE_CAPABILITY_INVALID');
          if(r.runtimeDiagnosticAuthorized!==false||r.runtimeRequestPresent!==false||r.iamGrantAuthorized!==false)throw new Error('V34_AUTHORIZATION_MUST_BE_ABSENT');
          NODE
      - name: Execute source-only probe path
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_SOURCE_ONLY=1 ORBIT360_V34_EVIDENCE="$V34_EVIDENCE" node tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
          jq -e '.decision=="SOURCE_ONLY_READY" and .networkAccess==false and .secretAccess==false and .requiredPermissions==["logging.logEntries.list","logging.privateLogEntries.list"] and .iamWrites==0 and .operationalWrites==0 and .firestoreReads==0 and .auditLogEntriesRead==false and .containsPII==false and .containsSecrets==false' "$V34_EVIDENCE" >/dev/null
      - name: Static no-IAM-write boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'setIamPolicy|roles/logging\.|roles/iam\.|firebase deploy|gcloud .* add-iam-policy-binding' tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
          grep -Fq 'projects/${encodeURIComponent(PROJECT_ID)}:testIamPermissions' tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
          grep -Fq "https://www.googleapis.com/auth/cloud-platform.read-only" tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v34-logging-iam-capability-source-sanitized-v20260810.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='v34 logging IAM source preparation blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.decision==='SOURCE_ONLY_READY'&&p.iamWrites===0){state='success';description='v34 logging IAM SOURCE PASS; no IAM/data access';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/v34-logging-iam-source',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Upload sanitized source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-v34-logging-iam-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/v34-logging-iam-capability-source-sanitized-v20260810.json
          if-no-files-found: warn
          retention-days: 30
