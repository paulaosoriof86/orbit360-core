name: Orbit 360 · Gate 7.11 · Academia bootstrap manifest · static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-academia-bootstrap-manifest-diagnostic-static-v20260802.json'
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    name: Gate 7.11 · manifest bootstrap Academia · cero runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar manifest real
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' .github/orbit360-static-requests/gate711-academia-bootstrap-manifest-diagnostic-static-v20260802.json)"
          node --check tools/orbit360-diagnosticar-manifest-academia-bootstrap-v20260802.mjs
          node tools/orbit360-diagnosticar-manifest-academia-bootstrap-v20260802.mjs
      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-gate711-academia-bootstrap-manifest-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-manifest-diagnostic-v20260802.json
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let state='failure',description='Manifest Academia bootstrap FAIL';
            try{const p=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/gate711-academia-bootstrap-manifest-diagnostic-v20260802.json','utf8'));if(p.ok===true){state='success';description='Manifest Academia bootstrap PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/gate711-academia-bootstrap-manifest-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
