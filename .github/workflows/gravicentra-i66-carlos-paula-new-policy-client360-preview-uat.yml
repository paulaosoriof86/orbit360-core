name: Gravicentra I6.6 New Policy Cliente360 Carlos Paula Preview UAT
on:
  workflow_dispatch:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-carlos-paula-new-policy-client360-preview-uat.yml
      - tools/gravicentra-i6-6-carlos-paula-new-policy-client360-preview-uat.cjs
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-newpolicy-client360-preview-signed-uat
  cancel-in-progress: false
jobs:
  signed-preview-create:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      I66_PREVIEW_ORIGIN: https://ays-orbit-360-lab--gi-i66-rc-42868854629-abj14q6n.web.app
      I66_PREVIEW_SOURCE_SHA: 586401bfbe1a80cfef2820982f432743af36b108
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact signed Preview and no subsequent product changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$I66_PREVIEW_SOURCE_SHA" HEAD
          test -z "$(git diff --name-only "$I66_PREVIEW_SOURCE_SHA" HEAD -- orbit360-platform functions firebase.json firestore.rules storage.rules)"
          node --check tools/gravicentra-i6-6-carlos-paula-new-policy-client360-preview-uat.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const r=await fetch('https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/runs/43463160506',{
              headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json',
                'User-Agent':'GI-I66-New-Policy-Preview-QA'}}).then(x=>x.json());
            assert.equal(r.conclusion,'success','QA_PREVIEW_BUILD_NOT_SIGNED');
            assert.equal(r.head_sha,process.env.I66_PREVIEW_SOURCE_SHA,'QA_PREVIEW_ARTIFACT_SOURCE_DRIFT');
            const b=await fetch(process.env.I66_PREVIEW_ORIGIN+'/__recovery__/build.json',
              {headers:{'cache-control':'no-cache'}}).then(x=>x.json());
            assert.equal(b.sourceSha,process.env.I66_PREVIEW_SOURCE_SHA,'QA_PREVIEW_HOST_SOURCE_DRIFT');
            console.log('I66_NEW_POLICY_PREVIEW_EXACT_ARTIFACT_AND_ORIGIN_PASS');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1;});
          NODE
      - name: Install bounded signed browser and Firebase runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Verify Carlos and Paula synthetic policy, receipts, vehicle, roster and Cliente360 reload
        run: node tools/gravicentra-i6-6-carlos-paula-new-policy-client360-preview-uat.cjs
