name: Orbit 360 · Pólizas · dependencias de padres HOLD read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/policies-hold-parent-dependency-diagnostic-readonly-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-hold-parent-dependency-diagnostic-readonly-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block7-policies-hold-parent-dependency-diagnostic-readonly-v20260801
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/policies-hold-parent-dependency-diagnostic-readonly-v20260801.json
  ORBIT360_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-policies-hold-parent-dependency-diagnostic-readonly-v20260801.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  diagnose:
    name: Pólizas · dependencias de padres HOLD · read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización y límites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-policies-hold-parent-dependency-diagnostic-request-v1" and .gateId=="block7-policies-hold-parent-dependency-diagnostic-readonly-v20260801" and .contractVersion=="7.7.0" and .approved==true and .allowedExecutions==1 and .consumed==false and .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and .scope.heldClients==16 and .scope.heldInsurers==4 and .scope.countAffectedPolicies==true and .scope.measureIntersection==true and .scope.traceVehicles==true and .scope.traceReceipts==true and .scope.tracePortfolio==true and .scope.traceCollections==true and .scope.compareStrategies==true and .capabilities.firestoreRead==true and .capabilities.writes==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.preview==false and .capabilities.deploy==false and .capabilities.production==false' "$ORBIT360_REQUEST_FILE" >/dev/null
          jq -e '.status=="POLICIES_HOLD_PARENT_DEPENDENCY_DIAGNOSTIC_READONLY_AUTHORIZED" and .executionProfile.phase=="LAB_DATA_CONTRACT_REPAIR_DRYRUN" and .authorization.allowedExecutions==1 and .authorization.consumed==false and .guards.firestoreDataWritesAllowed==false and .guards.operationalWritesAllowed==0 and .guards.reopenFrozenGateAllowed==false and .guards.browserAllowed==false and .guards.previewAllowed==false and .guards.productionAllowed==false' "$ORBIT360_LIFECYCLE_FILE" >/dev/null
      - name: Gate canónico antes de secrets y Firestore
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-policies-hold-parent-dependency-diagnostic-readonly-v20260801.mjs
          node --check tools/orbit360-diagnosticar-policies-hold-parent-dependencies-readonly-v20260801.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="POLICIES_HOLD_PARENT_DEPENDENCY_DIAGNOSTIC_READONLY_READY" and .executionAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .frozenGateReopenAuthorized==false and .frontendAdaptationAuthorized==false and .browserAuthorized==false and .previewAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .failed==0 and .operationalWrites==0' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Instalar dependencia aislada
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 >/dev/null
      - name: Resolver identidad LAB
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-policies-hold-parent-dependency.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_PROJECT_ID=$ORBIT360_PROJECT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_TENANT_ID=$ORBIT360_TENANT_ID" >> "$GITHUB_ENV"
      - name: Ejecutar diagnóstico de dependencias
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-diagnosticar-policies-hold-parent-dependencies-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="POLICIES_HOLD_PARENT_DEPENDENCY_DIAGNOSTIC_READONLY_PASS" and .classification=="GO_LAB_HOLD_PARENT_DEPENDENCY_DIAGNOSED" and .summary.sourceTotal==4837 and .summary.targetTotal==4822 and .summary.heldClients==16 and .summary.heldInsurers==4 and .summary.affectedPolicies>0 and .summary.sourceAndTargetDigestsMatched==true and .summary.evidenceComplete==true and .affectedPolicies.exactTargetParity==1373 and .affectedPolicies.relationBlocked==0 and .heldParents.total==20 and .heldParents.allPreserveRequiresValidation==true and .cumulativeVisualGuard.manifestMatches==true and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0 and .frontendAdapted==false and .browserExecuted==false and .previewExecuted==false and .deployExecuted==false and .productionTouched==false and .containsPII==false and .containsDocumentIds==false and .containsValues==false and .containsSecrets==false' "$EVIDENCE_DIR/policies-hold-parent-dependency-diagnostic-readonly-v20260801.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-hold-parent-dependency-diagnostic-readonly-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/policies-hold-parent-dependency-diagnostic-readonly-v20260801.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/policies-hold-parent-dependency-diagnostic-readonly-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='HOLD parent dependency diagnostic failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='POLICIES_HOLD_PARENT_DEPENDENCY_DIAGNOSTIC_READONLY_PASS'&&p.firestoreWrites===0&&p.summary?.evidenceComplete===true){state='success';description='HOLD parent dependency diagnostic PASS; zero writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-hold-parent-dependency-diagnostic-readonly',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
