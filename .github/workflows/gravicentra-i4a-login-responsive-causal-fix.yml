name: Gravicentra I4A Login Responsive Causal Fix

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-login-responsive-causal-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-login-responsive-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/fase-a-clean-20260831
          fetch-depth: 0
      - name: Patch only Login mobile sizing boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('orbit360-platform/styles/infra.css')
          s=p.read_text(encoding='utf-8')
          marker='''@media(max-width:860px){\n  .lg-left{display:none}\n}\n'''
          patch='''@media(max-width:860px){\n  .lg-left{display:none}\n}\n\n/* I4A Login responsive causal fix — prevent nowrap eyebrow from expanding the form beyond narrow viewports. */\n@media(max-width:480px){\n  .lg-right{min-width:0;padding-left:18px;padding-right:18px}\n  .lg-card{min-width:0;max-width:100%}\n  .lg-box{max-width:100%}\n  .lg-box .lg-eyebrow{white-space:normal;max-width:100%;overflow-wrap:anywhere}\n}\n'''
          if 'I4A Login responsive causal fix' in s:
              raise SystemExit('LOGIN_RESPONSIVE_FIX_ALREADY_PRESENT')
          if s.count(marker)!=1:
              raise SystemExit('LOGIN_RESPONSIVE_FIX_ANCHOR_CARDINALITY_'+str(s.count(marker)))
          p.write_text(s.replace(marker,patch,1),encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "orbit360-platform/styles/infra.css"
          grep -Fq 'I4A Login responsive causal fix' orbit360-platform/styles/infra.css
          grep -Fq '.lg-box .lg-eyebrow{white-space:normal;max-width:100%;overflow-wrap:anywhere}' orbit360-platform/styles/infra.css
      - name: Commit causal source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbit360-platform/styles/infra.css
          git commit -m 'fix(i4a): keep Login form inside mobile viewport'
          git push origin HEAD:recovery/fase-a-clean-20260831
