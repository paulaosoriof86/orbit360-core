name: Orbit 360 · Validación portable Windows · source-only

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - tools/orbit360-source-canary-windows-v20260806.txt

permissions:
  contents: read

concurrency:
  group: orbit360-portable-source-windows-v20260806
  cancel-in-progress: false

jobs:
  portable-source-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate portable signal-safe and cross-runner source
        shell: bash
        env:
          RUNNER_OS: Windows
        run: |
          set -euo pipefail
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const signal = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-timeout-signal-safe-source-test-sanitized-v20260806.json', 'utf8'));
          const cross = JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-cross-runner-source-test-sanitized-v20260806.json', 'utf8'));
          if (!(signal.ok === true && signal.total === 48 && signal.passed === 48 && signal.failed === 0)) process.exit(42);
          if (!(cross.ok === true && cross.total === 24 && cross.passed === 24 && cross.failed === 0)) process.exit(42);
          console.log(JSON.stringify({
            status: 'PASS_PORTABLE_SOURCE_WINDOWS',
            signalSafe: `${signal.passed}/${signal.total}`,
            crossRunner: `${cross.passed}/${cross.total}`,
            compatibilityApplied: signal.compatibilityApplied === true,
            secretsRead: false,
            firebaseAccess: false,
            browserExecuted: false,
            deployExecuted: false,
            productionTouched: false,
            ok: true
          }, null, 2));
          NODE
