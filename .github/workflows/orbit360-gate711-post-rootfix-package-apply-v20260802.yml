name: Orbit 360 · Gate 7.11 · apply paquete post root fix

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/gate711-post-rootfix-package-apply-v20260802.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: orbit360-gate711-post-rootfix-package-apply-v20260802
  cancel-in-progress: false

env:
  BRANCH: ays/backend-tenant-lab-v99-20260703
  PRODUCT_HEAD: 267f7231b46d65b80c167f54567a67503b6a6793
  REQUEST_FILE: .github/orbit360-requests/gate711-post-rootfix-package-apply-v20260802.json
  STATUS_CONTEXT: orbit360/gate711-post-rootfix-package

jobs:
  apply:
    name: Source-only · contratos y validadores · producto congelado
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publicar estado pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state pending --arg context "$STATUS_CONTEXT" --arg description "Gate 7.11 aplicando paquete post root fix" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status.json" >/dev/null

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar request y producto congelado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST_FILE")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST_FILE"
          jq -e --arg product "$PRODUCT_HEAD" '.schemaVersion=="orbit360-gate711-post-rootfix-package-apply-request-v1" and .productHead==$product and .approved==true and .allowedExecutions==1 and .consumed==false and .rootFixRun==30775623141 and .manifestRun==30775729377 and .localTransformationValidated==true and .allowedFiles==[".github/orbit360-templates/gate711-release-critical-runtime-request-template-v20260802.json",".github/workflows/orbit360-gate711-release-critical-runtime-v20260802.yml","tools/orbit360-cumulative-visual-candidate-contract-v20260801.json","tools/orbit360-gate711-release-critical-runtime-lifecycle-template-v20260802.json","tools/orbit360-gate711-release-critical-scope-v20260802.json","tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs","tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs","tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs","tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs","tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs"] and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST_FILE" >/dev/null
          mapfile -t PRODUCT_DIFF < <(git diff --name-only "$PRODUCT_HEAD"..HEAD -- orbit360-platform/index.html orbit360-platform/modules orbit360-platform/core orbit360-platform/styles orbit360-platform/data)
          test "${#PRODUCT_DIFF[@]}" = '0'

      - name: Aplicar transformación validada
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/orbit360-aplicar-paquete-post-rootfix-v20260802.py

      - name: Validar contratos, sintaxis y semántica
        shell: bash
        run: |
          set -euo pipefail
          jq empty tools/orbit360-cumulative-visual-candidate-contract-v20260801.json
          jq empty tools/orbit360-gate711-release-critical-scope-v20260802.json
          jq empty .github/orbit360-templates/gate711-release-critical-runtime-request-template-v20260802.json
          jq empty tools/orbit360-gate711-release-critical-runtime-lifecycle-template-v20260802.json
          node --check tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
          node --check tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs
          node --check tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs
          node --check tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs
          grep -Fq '267f7231b46d65b80c167f54567a67503b6a6793' tools/orbit360-gate711-release-critical-scope-v20260802.json
          grep -Fq '3dc0b2c699bde118d944e9304c725748b49c56619da8acf8040a36fdab37b06e' tools/orbit360-cumulative-visual-candidate-contract-v20260801.json
          grep -Fq 'aa40982bffd5a453c56dd07e2aa75745128890cb81fa940c2dac6e051fa2e9d6' tools/orbit360-cumulative-visual-candidate-contract-v20260801.json
          grep -Fq 'expectedScreenshotCount === 13' tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
          grep -Fq 'guardState.immutableUnwrapped === 0' tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
          grep -Fq "guardState.conciliacionesMode === 'self_guarded_readonly'" tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
          grep -Fq '.guardRegistry.immutableUnwrapped==0' .github/workflows/orbit360-gate711-release-critical-runtime-v20260802.yml
          grep -Fq '((.screenshots|length)==13)' .github/workflows/orbit360-gate711-release-critical-runtime-v20260802.yml

      - name: Ejecutar validadores source-only integrados
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_RELEASE_CRITICAL_STATIC_PASS" and .productHead=="267f7231b46d65b80c167f54567a67503b6a6793" and .total==38 and .passed==38 and .failed==0 and .firestoreReads==0 and .firestoreWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-release-critical-static-v20260802.json >/dev/null
          node tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_RUNTIME_PACKAGE_READINESS_PASS" and .productHead=="267f7231b46d65b80c167f54567a67503b6a6793" and .total==38 and .passed==38 and .failed==0 and .secretsAccessed==false and .firestoreReads==0 and .firestoreWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-package-readiness-v20260802.json >/dev/null
          node tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs
          jq -e '.ok==true and .status=="GATE711_RUNTIME_CHAIN_STATIC_PASS" and .productHead=="267f7231b46d65b80c167f54567a67503b6a6793" and .total==56 and .passed==56 and .failed==0 and .secretsAccessed==false and .firestoreReads==0 and .firestoreWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-chain-static-v20260802-v2.json >/dev/null

      - name: Verificar alcance exacto
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t DIFF < <(git diff --name-only | sort)
          test "${#DIFF[@]}" = '10'
          printf '%s\n' "${DIFF[@]}" > "$RUNNER_TEMP/diff.txt"
          printf '%s\n' \
            .github/orbit360-templates/gate711-release-critical-runtime-request-template-v20260802.json \
            .github/workflows/orbit360-gate711-release-critical-runtime-v20260802.yml \
            tools/orbit360-cumulative-visual-candidate-contract-v20260801.json \
            tools/orbit360-gate711-release-critical-runtime-lifecycle-template-v20260802.json \
            tools/orbit360-gate711-release-critical-scope-v20260802.json \
            tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs \
            tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs \
            tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs \
            tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs \
            tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs | sort > "$RUNNER_TEMP/expected.txt"
          cmp -s "$RUNNER_TEMP/diff.txt" "$RUNNER_TEMP/expected.txt"

      - name: Crear commit incremental
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-gate-bot'
          git config user.email 'orbit360-gate-bot@users.noreply.github.com'
          git add .github/orbit360-templates/gate711-release-critical-runtime-request-template-v20260802.json .github/workflows/orbit360-gate711-release-critical-runtime-v20260802.yml tools/orbit360-cumulative-visual-candidate-contract-v20260801.json tools/orbit360-gate711-release-critical-runtime-lifecycle-template-v20260802.json tools/orbit360-gate711-release-critical-scope-v20260802.json tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs tools/orbit360-validar-gate711-release-critical-static-v20260802.mjs tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs tools/orbit360-validar-gate711-runtime-package-readiness-v20260802.mjs
          git commit -m 'chore(gate711): sellar paquete post root fix de guards'
          git rev-parse HEAD > "$RUNNER_TEMP/package-commit.txt"
          git push origin "HEAD:$BRANCH"

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate711-post-rootfix-package-apply-v20260802
          path: |
            ${{ runner.temp }}/package-commit.txt
            ${{ runner.temp }}/diff.txt
            orbit360-platform/runtime-gate-crm-v20260716/gate711-release-critical-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-package-readiness-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-chain-static-v20260802-v2.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar estado final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then STATE=success; DESCRIPTION="Gate 7.11 paquete post root fix PASS"; else STATE=failure; DESCRIPTION="Gate 7.11 paquete post root fix FAIL / STOP_RETRY"; fi
          jq -n --arg state "$STATE" --arg context "$STATUS_CONTEXT" --arg description "$DESCRIPTION" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status-final.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status-final.json" >/dev/null
