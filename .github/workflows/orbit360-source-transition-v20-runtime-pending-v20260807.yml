name: Orbit360 source transition v20 exact artifact to runtime-pending

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/orbit360-requests/v20-source-transition-marker.json'

permissions:
  contents: write

concurrency:
  group: orbit360-source-transition-v20
  cancel-in-progress: false

jobs:
  source-transition-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact authorization base and source evidence
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = 'a3e833b8f162f0313dda19f9bd2cf1730ad9871c'
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/v20-native-matrix-artifact-source-sanitized-v20260807.json','utf8'));
          const m=JSON.parse(fs.readFileSync('.github/orbit360-requests/v20-source-transition-marker.json','utf8'));
          if (!(e.status==='PASS_V20_NATIVE_MATRIX_ARTIFACT_SOURCE_ONLY' && e.finalPackageStatus==='PASS' && e.finalPackageRunId===31207941202 && e.ok===true)) process.exit(41);
          if (!(m.requestVersion==='20260807.20-two-phase-runtime' && m.authorizedSourceHead==='a3e833b8f162f0313dda19f9bd2cf1730ad9871c' && m.oneShot===true)) process.exit(41);
          console.log('PASS_V20_SOURCE_EVIDENCE_BOUND_TO_TRANSITION');
          NODE

      - name: Activate source stage without runtime capabilities
        shell: bash
        run: node tools/orbit360-activate-v20-source-stage-v20260807.mjs

      - name: Explicit source to runtime-pending transition
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-transition-visual-matrix-lifecycle-source-to-runtime-v20260807.mjs \
            tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json \
            tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json \
            .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json \
            20260807.20-two-phase-runtime

      - name: Validate runtime-pending state remains source-safe
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const l=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json','utf8'));
          const o=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json','utf8'));
          const r=JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          if (!(l.status==='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST' && l.expectedRequestVersion==='20260807.20-two-phase-runtime' && l.allowedExecutions===1 && l.executionAuthorized===true && l.writeAuthorized===false && l.productionAuthorized===false)) process.exit(41);
          if (!(o.status==='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST' && o.expectedNextRequestVersion==='20260807.20-two-phase-runtime' && o.writesAllowed===false && o.productionAllowed===false)) process.exit(41);
          if (!(r.requestVersion==='20260807.19-two-phase-runtime' && r.consumed===true && r.authorizationFrozen===true && r.allowedExecutions===0 && r.replayAllowed===false)) process.exit(41);
          const ev={schemaVersion:'orbit360-v20-source-to-runtime-pending-v1',status:'PASS_V20_SOURCE_TO_RUNTIME_PENDING',requestVersion:'20260807.20-two-phase-runtime',sourceEvidenceRunId:31207941202,lifecycleStatus:l.status,lifecyclePhase:l.currentPhase,priorRequestVersion:r.requestVersion,priorRequestConsumed:true,priorRequestFrozen:true,secretAccess:false,firebaseAccess:false,hostingTouched:false,browserExecuted:false,deployExecuted:false,firestoreWrites:0,authWrites:0,operationalWrites:0,productionTouched:false,containsPII:false,containsSecrets:false,ok:true};
          fs.writeFileSync('orbit360-platform/runtime-gate-crm-v20260716/v20-source-to-runtime-pending-transition-sanitized-v20260807.json',JSON.stringify(ev,null,2)+'\n');
          console.log(JSON.stringify(ev,null,2));
          NODE

      - name: Persist transition on source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json
          git add tools/orbit360-validator-lifecycle-overlay-visual-matrix-v8-stop-preflight-v20260806.json
          git add orbit360-platform/runtime-gate-crm-v20260716/v20-source-to-runtime-pending-transition-sanitized-v20260807.json
          git commit -m 'source v20: transition exact artifact package to runtime-pending [skip ci]'
          git push origin HEAD:${{ github.head_ref }}

      - name: Assert zero runtime effects
        shell: bash
        run: echo 'PASS_V20_TRANSITION_ZERO_SECRETS_FIREBASE_HOSTING_BROWSER_WRITES'
