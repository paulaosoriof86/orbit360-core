name: Gravicentra Release Lock Guard

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - artifacts/orbit360-recovery/release-control/RECOVERY_STATE.json
      - artifacts/orbit360-recovery/release-control/ACTIVE_RELEASE_LOCK.json
      - tools/gravicentra-release-lineage-guard.mjs
      - tools/gravicentra-i3-preview-v2-package.mjs
      - .github/workflows/gravicentra-release-lock-sync.yml
      - .github/workflows/gravicentra-recovery-i3-preview-v2.yml
      - .github/workflows/gravicentra-recovery-i4a-public-browser.yml
      - .github/workflows/gravicentra-i4a-insurer-backend-boundary-readonly.yml

permissions:
  contents: read

concurrency:
  group: gravicentra-release-lock-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout Recovery control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on state, release-lock or executor desynchronization
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node tools/gravicentra-release-lineage-guard.mjs --mode=control-plane
          node --check tools/gravicentra-release-lineage-guard.mjs
          node --check tools/gravicentra-i3-preview-v2-package.mjs
          git diff --exit-code
          {
            echo '## Gravicentra Insurance — recovery control guard'
            echo '- Live gate state: `RECOVERY_STATE.json`'
            echo '- Release identity: `ACTIVE_RELEASE_LOCK.json`'
            echo '- I3 candidate source: derived from lock, never hardcoded'
            echo '- Shared backend mutation before I5: forbidden'
            echo '- Candidate/I3 mismatch: fail closed'
            echo '- Certified/I4A mismatch: fail closed'
            echo '- Silent retarget: forbidden'
            echo '- Production touched: false'
            echo '- Data touched: false'
          } >> "$GITHUB_STEP_SUMMARY"
