name: Gravicentra Control Plane Guard v5
# B4-003 anti-drift: governance runs for EVERY canonical commit; no path-filter bypass.
# This is read-only CI. Preview/production transport remains separate and source-digest bound.

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831

permissions:
  contents: read

concurrency:
  group: gravicentra-control-plane-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout Recovery control plane with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed through canonical shared governance preflight
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node --check tools/gravicentra-governance-preflight-v1.mjs
          node --check functions/b4-003-scoped-access-boundary.js
          node tools/gravicentra-b4-003-scoped-boundary.test.cjs
          node --check tools/gravicentra-b4-003-operational-write-security-regression.test.cjs
          node tools/gravicentra-b4-003-operational-write-security-regression.test.cjs
          node --check functions/b4-003-scoped-policy-reader.js
          node --check functions/b4-003-scoped-policy-callable.js
          node --check functions/b4-003-scoped-bootstrap-reader.js
          node tools/gravicentra-b4-003-scoped-bootstrap-reader.test.cjs
          node tools/gravicentra-b4-003-scoped-policy-reader.test.cjs
          node --check functions/b4-003-scoped-related-reader.js
          node tools/gravicentra-b4-003-scoped-related-reader.test.cjs
          node tools/gravicentra-b4-003-security-release-barrier.test.cjs
          node tools/gravicentra-b4-003-secure-hydration-release-check.cjs
          node --check orbit360-platform/core/product-runtime-browser-providers-p0.js
          node --check orbit360-platform/core/backend-product-readonly-bootstrap-p0.js
          node --check orbit360-platform/data/store-firestore-product-readonly-p0.js
          node --check orbit360-platform/core/product-app-p0.js
          node tools/gravicentra-b4-003-protected-hydration.test.cjs
          node tools/gravicentra-b4-003-finance-partial-render.test.cjs
          node tools/gravicentra-b4-003-auth-terminal.test.cjs
          node --check orbit360-platform/data/store-firestore-product-readonly-p0.js
          node tools/gravicentra-b4-003-relation-cache-accessors.test.cjs
          node --check orbit360-platform/core/access-scope.js
          node tools/gravicentra-b4-003-front-scope-quickcheck.cjs
          node --check orbit360-platform/modules/inicio.js
          node tools/gravicentra-b4-003-inicio-personal-recaudo.test.cjs
          node tools/gravicentra-b4-003-human-ux-copy-layout.test.cjs
          node tools/gravicentra-b4-003-uat5-display-contract.test.cjs
          node --check functions/product-ops-leads-domain.js
          node --check functions/ops-advisor-inbox.js
          node tools/gravicentra-b4-003-ops-leads-role-scopes.test.cjs
          node --check functions/assignable-advisor-roster.js
          node tools/gravicentra-b4-003-inicio-role-country-team.test.cjs
          node --check functions/product-ops-leads-domain.js
          node tools/gravicentra-b4-003-ops-leads-human-actor.test.cjs
          node --check orbit360-platform/core/ciclo.js
          node --check orbit360-platform/modules/comparativo.js
          node --check orbit360-platform/modules/issuance-endosos-v1201-bridge.js
          node tools/gravicentra-b4-003-modal-catalog-docs-guard.cjs
          node tools/gravicentra-governance-preflight-v1.mjs --mode=governance
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          const accepted=c.environmentState?.productionAccepted===true;
          console.log('## Gravicentra Insurance — canonical control plane v5');
          console.log('- Mutable operational authority: `CONTROL_PLANE.json` only');
          console.log('- Canonical governance preflight: `tools/gravicentra-governance-preflight-v1.mjs`');
          console.log('- Central guard and active gate executor consume the SAME preflight on the SAME HEAD');
          console.log('- Approved lineage authority: `CAPABILITY_LINEAGE_LOCK.json`');
          console.log('- Capability status: derived ledger, release-bound, non-authoritative for gate/release identity');
          console.log('- Active gate MUST have one physical state-gated executor before the Control Plane can remain valid');
          console.log('- Gate transition and execution plane are mechanically coupled for the active gate');
          console.log('- I4A proof registry: derived monotonic receipts; cannot govern gate/release identity');
          console.log('- PASS evidence: monotonic within the certified release; causal source delta required to invalidate');
          console.log('- I4A execution: `OPEN_PROOFS_ONLY`; sealed PASS proofs cannot be rerun accidentally');
          console.log('- I4A gate seal: historical atomic Control Plane + capability ledger + proof registry commit');
          console.log('- Evidence accumulation freeze: `MECHANISM_FREEZE_V4_20260910.md`');
          console.log('- Post-I5 seal contract: `MECHANISM_FREEZE_V5_POST_I5_20260912.md`');
          console.log(`- Project Sources: ${c.projectSources?.activePackage||''} (v${c.projectSources?.activeVersion||''}) with Git blob integrity enforced`);
          console.log('- I2/I3 re-entry: only on proven product source change');
          console.log('- Conversations/snapshots as operational authority: forbidden');
          console.log('- QA runtime self-patch: forbidden');
          console.log(`- Control status: ${c.status}`);
          console.log(`- Production accepted: ${accepted}`);
          console.log(`- Production touched by recovery: ${c.environmentState?.productionTouchedByRecovery===true}`);
          console.log(`- Controlled data touched by I5: ${c.environmentState?.dataTouchedByRecovery===true}`);
          console.log(`- August refresh: ${c.environmentState?.augustRefresh||''}`);
          console.log(`- I6 status: ${c.gateState?.gates?.I6?.status||''}`);
          console.log(`- I6 authorized: ${c.i6Execution?.authorized===true}`);
          console.log(`- Static source update required: ${c.projectSources?.staticSourceUpdateRequired===true}`);
          console.log(`- Next frozen iteration: ${c.gateState?.nextFrozenIteration||''}`);
          NODE


  b4003-firestore-emulator:
    # Isolated security test within the existing B4 governance flow, no production credentials.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'test(i6.5 B4-003 security-emulator)') || startsWith(github.event.head_commit.message, 'fix(b4003)'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install isolated emulator test dependencies
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts firebase-tools@14.0.0 firebase@12.0.0 @firebase/rules-unit-testing@5.0.0 firebase-admin@13.0.0
      - name: Validate candidate rules against authenticated synthetic Firestore emulator
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'),p=require('node:path');fs.writeFileSync(p.join(process.env.RUNNER_TEMP,'gi-b4003-emulator.json'),JSON.stringify({firestore:{rules:p.resolve('firestore.b4-003-scoped-candidate.rules')},emulators:{firestore:{host:'127.0.0.1',port:8187},ui:{enabled:false}}}));"
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-gravicentra-b4003-security --config "$RUNNER_TEMP/gi-b4003-emulator.json" "node tools/gravicentra-b4-003-firestore-emulator.test.cjs"

  live-hosting-availability-readonly:
    # New read-only probe inside the existing authoritative guard; no deploy, tokens, or data writes.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify active generation against its physical receipt and file counts
        run: node --test tools/gravicentra-i66-frontend-control.test.cjs
      - name: Probe DNS TLS HTTPS both LIVE origins and exact build, fail closed
        run: |
          python3 - <<'PY'
          import json, os, socket, ssl, urllib.request, urllib.error, time
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          cp=json.loads(Path('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json').read_text())
          tr=json.loads(Path('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json').read_text())
          # The mutable Control Plane pointer, not an archived release alias,
          # determines exactly which immutable frontend LIVE should serve.
          latest_key=cp.get('currentExecutionDecisionPointer')
          if not isinstance(latest_key,str) or not latest_key.startswith('i66') or latest_key not in cp:
            raise SystemExit('I66_LIVE_ACTIVE_POINTER_MISSING_OR_INVALID')
          latest=cp[latest_key]
          if not isinstance(latest,dict) or not latest.get('sourceSha') or not latest.get('buildId'):
            raise SystemExit('I66_LIVE_ACTIVE_RELEASE_MISSING')
          expected=latest.get('sourceSha')
          expected_build=latest.get('buildId')
          report={'checkedAtUtc':datetime.now(timezone.utc).isoformat(),'gate':cp['gateState']['gates']['I6'].get('activeSubgate'),'activeReleasePointer':latest_key,'activeGeneration':latest.get('generation'),'expectedSource':expected,'expectedBuild':expected_build,'checks':[],'readOnly':True}
          urls=[('CUSTOM','https://app.aysseguros.com/'),('CUSTOM_MARKER','https://app.aysseguros.com/__recovery__/build.json'),('FIREBASE','https://ays-orbit-360-lab.web.app/'),('FIREBASE_MARKER','https://ays-orbit-360-lab.web.app/__recovery__/build.json')]
          for label,url in urls:
            data={'label':label,'url':url,'status':None,'dns':[],'error':None,'sourceSha':None,'buildId':None,'elapsedMs':None}
            hostname=urlsplit(url).hostname
            try:
              data['dns']=sorted(set(x[4][0] for x in socket.getaddrinfo(hostname,443,type=socket.SOCK_STREAM)))[:10]
            except Exception as exc:
              data['error']='DNS:'+type(exc).__name__+':'+str(exc)[:140]
            if data['dns']:
              start=time.monotonic()
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Gravicentra-I66-LIVE-Availability-ReadOnly/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=16,context=ssl.create_default_context()) as response:
                  data['status']=response.status
                  body=response.read(262144)
                  data['elapsedMs']=round((time.monotonic()-start)*1000)
                  if label.endswith('_MARKER'):
                    marker=json.loads(body.decode('utf-8'))
                    data['sourceSha']=marker.get('sourceSha')
                    data['buildId']=marker.get('buildId')
              except urllib.error.HTTPError as exc:
                data['status']=exc.code
                data['error']='HTTP:'+str(exc.code)
              except Exception as exc:
                data['error']=type(exc).__name__+':'+str(exc)[:180]
            report['checks'].append(data)
          by={r['label']:r for r in report['checks']}
          signed=tr.get('latestSignedPhysicalFrontendLivePointer20261122',{})
          physical=tr.get('currentPhysicalHostingRelease',{})
          files=latest.get('hostedFilesEachOrigin')
          signed_matches=(not latest.get('generation') or (signed==latest and tr.get('frontendReleaseSequence')==latest['generation']))
          control_ok=(bool(expected) and type(files) is int and files>0 and physical.get('readbackEachOrigin')==files and signed_matches and physical.get('sourceSha')==expected and physical.get('buildId')==expected_build and physical.get('artifactDigest')==latest.get('artifactDigest'))
          report['signedFilesEachOrigin']=files
          root_ok=all(by[n]['status']==200 for n in ('CUSTOM','FIREBASE'))
          markers_ok=all(by[n]['status']==200 and by[n]['sourceSha']==expected and by[n]['buildId']==expected_build for n in ('CUSTOM_MARKER','FIREBASE_MARKER'))
          report['result']='PASS' if control_ok and root_ok and markers_ok else 'HOLD'
          report['controlPlaneTransportAgree']=control_ok
          report['bothAnonymousHome200']=root_ok
          report['bothMarkersExact']=markers_ok
          report['possibleScope']='CUSTOM_DOMAIN' if by['FIREBASE_MARKER']['status']==200 and by['CUSTOM_MARKER']['status']!=200 else 'BOTH_ORIGINS_OR_EDGE' if by['FIREBASE_MARKER']['status']!=200 and by['CUSTOM_MARKER']['status']!=200 else 'LIVE_MARKER_OR_ROOT_DRIFT' if not (root_ok and markers_ok) else 'NONE'
          out=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'gi-i66-live-availability.json'
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('GRAVICENTRA_LIVE_AVAILABILITY='+json.dumps(report,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as w:
            w.write('### I6.6 LIVE availability / no writes\n')
            w.write('Result **'+report['result']+'**; differential **'+report['possibleScope']+'**; Control Plane/transport match: '+str(control_ok)+'\n')
            for row in report['checks']:
              w.write('- '+row['label']+': HTTP '+str(row['status'])+' DNS '+str(row['dns'])+' '+str(row['error'] or '')+' build '+str(row['buildId'] or '')+'\n')
          if report['result']!='PASS': raise SystemExit('I66_LIVE_PUBLIC_AVAILABILITY_HOLD')
          PY
      - name: Persist public availability diagnosis even if it fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-live-availability-${{ github.run_id }}
          path: ${{ runner.temp }}/gi-i66-live-availability.json
          if-no-files-found: warn
