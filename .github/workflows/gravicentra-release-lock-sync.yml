name: Gravicentra Control Plane Guard v2

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      - artifacts/orbit360-recovery/release-control/CAPABILITY_LINEAGE_LOCK.json
      - artifacts/orbit360-recovery/release-control/PLAN_TRABAJO_CONGELADO_V2.md
      - artifacts/orbit360-recovery/release-control/RECOVERY_STATE.json
      - artifacts/orbit360-recovery/release-control/ACTIVE_RELEASE_LOCK.json
      - artifacts/orbit360-recovery/release-control/I4A_PREVIEW_FUNCTION_REMEDIATION_INTENT.json
      - artifacts/orbit360-recovery/project-sources-v2/**
      - tools/gravicentra-control-plane-guard-v2.mjs
      - tools/gravicentra-mechanism-invariant-v1.mjs
      - tools/gravicentra-evergreen-sources-invariant-v1.mjs
      - tools/gravicentra-i4a-preview-function-remediation-guard-v1.mjs
      - tools/gravicentra-i4a-preview-remediation-invariant-v1.mjs
      - tools/gravicentra-release-lineage-guard.mjs
      - tools/gravicentra-i4a-authenticated-browser-v2.mjs
      - .github/workflows/gravicentra-release-lock-sync.yml
      - .github/workflows/gravicentra-recovery-i2-source-contract.yml
      - .github/workflows/gravicentra-recovery-i3-preview-v2.yml
      - .github/workflows/gravicentra-recovery-i4a-public-browser.yml
      - .github/workflows/gravicentra-preview-credential-runtime-remediation.yml

permissions:
  contents: read

concurrency:
  group: gravicentra-control-plane-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout Recovery control plane with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on canonical control-plane, mechanism or documentation desynchronization
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "recovery/fase-a-clean-20260831"
          node --check tools/gravicentra-control-plane-guard-v2.mjs
          node --check tools/gravicentra-mechanism-invariant-v1.mjs
          node --check tools/gravicentra-evergreen-sources-invariant-v1.mjs
          node --check tools/gravicentra-i4a-authenticated-browser-v2.mjs
          node --check tools/gravicentra-i4a-preview-function-remediation-guard-v1.mjs
          node --check tools/gravicentra-i4a-preview-remediation-invariant-v1.mjs
          node tools/gravicentra-control-plane-guard-v2.mjs --mode=governance
          node tools/gravicentra-mechanism-invariant-v1.mjs
          node tools/gravicentra-evergreen-sources-invariant-v1.mjs
          node tools/gravicentra-i4a-preview-remediation-invariant-v1.mjs
          git diff --exit-code
          {
            echo '## Gravicentra Insurance — canonical control plane v2'
            echo '- Mutable operational authority: `CONTROL_PLANE.json` only'
            echo '- Approved lineage authority: `CAPABILITY_LINEAGE_LOCK.json`'
            echo '- Frozen plan: `PLAN_TRABAJO_CONGELADO_V2.md`'
            echo '- Project Sources: evergreen manifest + blob integrity enforced'
            echo '- Complete ancestry checkout: `fetch-depth: 0`'
            echo '- Split state/release authorities: deprecated and mechanically blocked'
            echo '- Conversations/snapshots as operational authority: forbidden'
            echo '- Release identity hardcodes in workflows: forbidden'
            echo '- Gate executors I2/I3/I4A: state-gated and manual'
            echo '- I4A parallel executors: forbidden'
            echo '- I4A Preview remediation: scoped intent, same I4A concurrency, exact single callable only'
            echo '- QA runtime self-patch: forbidden'
            echo '- Lineage rediscovery after I1: forbidden without causal exception'
            echo '- Product-source drift: fail closed'
            echo '- Production touched: false'
            echo '- Data touched: false'
          } >> "$GITHUB_STEP_SUMMARY"
