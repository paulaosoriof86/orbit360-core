              historyUsesActivities,historyRequested,activitySourceCount:report.sourceCounts.actividades,
              historyHydrationMissing:historyUsesActivities&&!historyRequested&&report.sourceCounts.actividades>0};
            report.status=hostedGap.length||report.protectedOperationalBlockers.historyHydrationMissing
              ?'HOLD_PROTECTED_READ_COVERAGE_REAL_DATA_NOT_CAPABILITY_PASS'
              :'SOURCE_READBACK_ONLY_NOT_FUNCTIONAL_PASS';
            fs.writeFileSync(process.env.FINANCE_EVIDENCE_OUT,JSON.stringify(report,null,2)+'\n');
            console.log('B4_003_EXACT_FINANCE_READBACK='+JSON.stringify(report));
            if(report.status.startsWith('HOLD_'))process.exitCode=1;
          })().catch(e=>{console.error('B4_003_FINANCE_READBACK_FAIL:'+String(e.message||e));process.exitCode=1;});
          NODE

      - name: Preserve B4-003 finance source readback evidence
        if: always() && steps.gate.outputs.finance_source_readonly == 'true'
