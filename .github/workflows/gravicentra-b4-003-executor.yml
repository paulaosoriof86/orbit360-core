name: Gravicentra B4-003 Renewals Cancelations Preview

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-executor.yml'
      - 'tools/gravicentra-i6-5-b4-003-preview-proof.mjs'
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'

permissions:
  contents: write

concurrency:
  group: gravicentra-b4-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  b4-003-renewals-cancelations-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      HOSTING_SITE: ays-orbit-360-lab
      CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      B4_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B4_EXECUTION_LOCK_20261002.json
      FINDINGS: artifacts/orbit360-recovery/release-control/I6_FINDINGS_LEDGER_20260924.json
      COMPOSITION: artifacts/orbit360-recovery/release-control/I6_CANONICAL_ACCUMULATIVE_COMPOSITION_LOCK_20260924.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact B4-003 candidate head
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          CANDIDATE_SOURCE_SHA=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$CANDIDATE_SOURCE_SHA" = "$REMOTE"
          echo "CANDIDATE_SOURCE_SHA=$CANDIDATE_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Gate exact B4-003 Preview
        id: gate
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const l=JSON.parse(fs.readFileSync(process.env.B4_LOCK,'utf8'));
          const ok=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_CONTRACT_AND_EXACT_PREVIEW'
            && /^B4_003_SOURCE_FIXED_R5_/.test(String(c.currentB4?.status||''))
            && /^B4_003_SOURCE_FIXED_R5_/.test(String(c.i65ForensicRemediationPlan?.b4?.status||''))
            && /^B4_003_SOURCE_FIXED_R5_/.test(String(l.status||''))
            && l.activeFinding?.id==='B4-003'
            && l.boundaries?.businessWritesAuthorized===false
            && l.boundaries?.syntheticQaWritesAuthorized===true
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(ok?'true':'false')+'\n');
          console.log('B4_003_PREVIEW_MODE='+(ok?'RUN':'NOOP'));
          NODE

      - name: Assert LIVE unchanged
        if: steps.gate.outputs.run == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: Validate B4-003 contract and syntax
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          node --check tools/gravicentra-i6-5-b4-003-contract.mjs
          node --check tools/gravicentra-i6-5-b4-003-preview-proof.mjs
          node --check orbit360-platform/modules/renovaciones.js
          node --check orbit360-platform/modules/renewals-v1200-operational-bridge.js
          node --check orbit360-platform/modules/renewals-v1200-permission-guard.js
          node --check orbit360-platform/modules/renewals-v1201-issued-filter.js
          node --check orbit360-platform/modules/cancelaciones.js
          cd functions
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npm run check
          cd ..
          node tools/gravicentra-i6-5-b4-003-contract.mjs | tee "$RUNNER_TEMP/b4-003-contract.json"

      - name: Prepare Firebase and browser dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b4-003-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json'
                  p.write_text(json.dumps(d))
                  p.chmod(0o600)
                  rows.append(str(p))
          if not rows:raise SystemExit('B4_003_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          CROOT="$RUNNER_TEMP/b4-003-firebase-cli"
          npm install --prefix "$CROOT" --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$CROOT"
          CLI="$CROOT/node_modules/firebase-tools/lib/bin/firebase.js"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
          SEL=''
          while read -r F; do
            if GOOGLE_APPLICATION_CREDENTIALS="$F" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then SEL="$F"; break; fi
          done < "$ROOT/files"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/b4-003-sa.json"
          chmod 600 "$RUNNER_TEMP/b4-003-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/b4-003-sa.json" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Resolve public web config
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          node "$FIREBASE_CLI_BIN" apps:list WEB --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/apps-b4-003.json"
          export APPS="$RUNNER_TEMP/apps-b4-003.json"
          APP_ID=$(python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['APPS']));a=d.get('result') if isinstance(d,dict) else None
          web=[x for x in (a or []) if str(x.get('platform','')).upper() in ('WEB','PLATFORM_WEB','')]
          if len(web)!=1:raise SystemExit('B4_003_WEB_APP_CARDINALITY:'+str(len(web)))
          print(web[0].get('appId',''))
          PY
          )
          node "$FIREBASE_CLI_BIN" apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/public-config-b4-003.json"
          echo "PUBLIC_CONFIG_FILE=$RUNNER_TEMP/public-config-b4-003.json" >> "$GITHUB_ENV"

      - name: Materialize immutable B4-003 package
        if: steps.gate.outputs.run == 'true'
        id: build
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b1-branding-snapshot.mjs "$RUNNER_TEMP/b4-003-branding-snapshot.json"
          export TENANT_BRANDING_SNAPSHOT_FILE="$RUNNER_TEMP/b4-003-branding-snapshot.json"
          export SOURCE_SHA="$CANDIDATE_SOURCE_SHA"
          export RELEASE_GATE="I6.5-B4-003"
          export BUILD_PREFIX="gi-i65-b4"
          export ENVIRONMENT_REF="firebase-hosting-preview-i6-5-forensic-b4-003"
          node tools/gravicentra-i6-1-preview-package.mjs . "$RUNNER_TEMP/b4-003-package" "$PUBLIC_CONFIG_FILE" > "$RUNNER_TEMP/b4-003-package-output.json"
          node - <<'NODE'
          const fs=require('node:fs'),d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/b4-003-package-output.json'));
          for(const [k,v] of Object.entries({build_id:d.buildId,hosted_payload_digest:d.hostedPayloadDigest,backend_source_digest:d.backendSourceDigest,bundle_digest:d.bundleDigest}))fs.appendFileSync(process.env.GITHUB_OUTPUT,k+'='+v+'\n');
          NODE

      - name: Deploy exact B4-003 Preview write backends
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          FROOT="$RUNNER_TEMP/b4-003-functions"
          rm -rf "$FROOT"; mkdir -p "$FROOT"
          cp -a "$RUNNER_TEMP/b4-003-package/bundle/backend" "$FROOT/backend"
          (cd "$FROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          echo '{"functions":{"source":"backend"}}' > "$FROOT/firebase.json"
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360ProductOperationalCommandPreview,functions:orbit360OpsLeadsCommandPreview --config "$FROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          printf '{"status":"DEPLOYED_EXACT_PREVIEW_ONLY","sourceSha":"%s","backendSourceDigest":"%s","functions":["orbit360ProductOperationalCommandPreview","orbit360OpsLeadsCommandPreview"],"productionFunctionsDeployed":false,"realBusinessWritesAuthorized":false}\n' "$CANDIDATE_SOURCE_SHA" "${{ steps.build.outputs.backend_source_digest }}" > "$RUNNER_TEMP/b4-003-package/evidence/b4-003-preview-backend-binding.json"

      - name: Deploy exact package to isolated Preview
        if: steps.gate.outputs.run == 'true'
        id: preview
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/b4-003-package/bundle"
          CHANNEL_ID="gi-i65-b4-$GITHUB_RUN_ID"
          deploy_channel() {
            set +e
            node "$FIREBASE_CLI_BIN" hosting:channel:deploy "$CHANNEL_ID" --config firebase.json --project "$PROJECT_ID" --expires 7d --non-interactive --json > "$RUNNER_TEMP/b4-003-preview.json" 2>&1
            RC=$?; set -e; cat "$RUNNER_TEMP/b4-003-preview.json"; return "$RC"
          }
          if ! deploy_channel; then
            if grep -Fq "channel quota reached" "$RUNNER_TEMP/b4-003-preview.json"; then
              node "$GITHUB_WORKSPACE/tools/gravicentra-preview-channel-gc.mjs" "$FIREBASE_CLI_BIN" "$PROJECT_ID" "$CHANNEL_ID" "$GITHUB_WORKSPACE" "gi-"
              deploy_channel
            else exit 1; fi
          fi
          export DEPLOY="$RUNNER_TEMP/b4-003-preview.json"
          PREVIEW_URL=$(python3 - <<'PY'
          import os,re
          raw=open(os.environ['DEPLOY']).read();prod='https://'+os.environ['HOSTING_SITE']+'.web.app'
          urls=[u.rstrip('/') for u in re.findall(r'https://[A-Za-z0-9._-]+\.web\.app',raw) if u.rstrip('/')!=prod]
          if not urls:raise SystemExit('B4_003_PREVIEW_URL_NOT_FOUND')
          print(urls[-1])
          PY
          )
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Exact Hosting Preview readback
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          set -euo pipefail
          export MANIFEST="$RUNNER_TEMP/b4-003-package/evidence/site-manifest.sha256"
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.parse,urllib.request
          rows=[tuple(x.split('  ',1)) for x in open(os.environ['MANIFEST']).read().splitlines() if x.strip()]
          base=os.environ['TARGET_URL'].rstrip('/')
          for attempt in range(1,9):
              bad=[]
              for want,rel in rows:
                  try:
                      req=urllib.request.Request(base+'/'+urllib.parse.quote(rel,safe='/')+'?b4003='+str(attempt)+'-'+str(int(time.time())),headers={'Accept-Encoding':'identity','Cache-Control':'no-cache, no-store'})
                      with urllib.request.urlopen(req,timeout=30) as z:got=hashlib.sha256(z.read()).hexdigest()
                  except Exception as e:got=type(e).__name__
                  if got!=want:bad.append(rel)
              with urllib.request.urlopen(base+'/__recovery__/build.json?b4003='+str(time.time()),timeout=30) as z:marker=json.loads(z.read())
              if not bad and marker.get('sourceSha')==os.environ['CANDIDATE_SOURCE_SHA'] and marker.get('buildId')==os.environ['EXPECTED_BUILD_ID']:break
              if attempt==8:raise SystemExit('B4_003_READBACK:'+str(bad[:5])+':'+str(marker))
              time.sleep(3)
          print('B4_003_HOSTING_READBACK=PASS')
          PY

      - name: Durable renewals cancelations browser proof
        if: steps.gate.outputs.run == 'true'
        env:
          B4_003_PROOF_OUT: ${{ runner.temp }}/b4-003-preview-proof.json
          B4_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b4-003-preview-proof.mjs
          node -e "const x=require(process.env.B4_003_PROOF_OUT),a=x.assertions||{};if(x.status!=='PASS'||a.noDelayedRenewalRenderMutation!==true||a.renewalCampaignDurableReadback!==true||a.cancelationDurableReadback!==true||a.recoveryLinkagePreserved!==true||a.recoveryIdempotentRetry!==true||a.previewGeneralWriteIsolation!==true||a.cancellationProjectionConsistent!==true||a.qaResidueReadOnlyAdjudicated!==true||a.cleanupComplete!==true||x.syntheticFinalAbsent!==true)process.exit(1);console.log('B4_003_PREVIEW_PROOF=PASS')"

      - name: Adjudicate and clean exact historical B2 QA residue
        if: steps.gate.outputs.run == 'true'
        env:
          B4_003_PROOF: ${{ runner.temp }}/b4-003-preview-proof.json
          B4_003_QA_CLEANUP: ${{ runner.temp }}/b4-003-qa-residue-cleanup.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const {initializeApp,applicationDefault,getApps}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          (async()=>{
            const proof=JSON.parse(fs.readFileSync(process.env.B4_003_PROOF,'utf8'));
            const q=proof.qaResidue||{},ids=['pol_mulsmxsk','pol_mulssmuz','pol_mulsxofx'];
            const safe=q.classification==='PROVEN_B2_QA_LINEAGE_NO_DEPENDENTS'&&q.patternConsistent===true&&q.parentsAbsent===true&&q.noDependents===true;
            if(!safe){
              const before=(q.rows||[]).filter(x=>ids.includes(x.id)).map(x=>({id:x.id,exists:x.exists===true,numero:x.numero||'',renuevaDe:x.renuevaDe||'',dependentTotal:Number(x.dependentTotal||0),dependents:x.dependents||{}}));
              if(before.length!==ids.length||before.some(x=>x.exists!==true))throw Error('B4_003_QA_RESIDUE_ADJUDICATION_INCOMPLETE');
              const authority={status:'CONDITIONAL_FAIL_CLOSED_NO_DELETE',exactPolicyIds:ids,proofClassification:q.classification,prerequisiteSatisfied:false,operationalBusinessWrite:false};
              const after=before.map(x=>({id:x.id,exists:true,deleted:false}));
              fs.writeFileSync(process.env.B4_003_QA_CLEANUP,JSON.stringify({schema:'GRAVICENTRA_I6_5_B4_003_B2_QA_RESIDUE_ADJUDICATION_V1',recordedAt:new Date().toISOString(),status:'NOT_DELETED_FAIL_CLOSED',authority,before,after,deletedCount:0,dependentTotal:before.reduce((s,x)=>s+x.dependentTotal,0),realOperationalRowsDeleted:0,reimport:false,live:false},null,2)+'\n');
              console.log('B4_003_QA_RESIDUE_FAIL_CLOSED_NO_DELETE=PASS');
              return;
            }
            const app=getApps()[0]||initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT_ID});
            const db=getFirestore(app),base=db.collection('tenants').doc(process.env.TENANT_HINT).collection('data').doc('polizas').collection('items');
            const before=[];
            for(const id of ids){const s=await base.doc(id).get();if(!s.exists)throw Error('B4_003_QA_RESIDUE_EXPECTED_ROW_MISSING:'+id);before.push({id,numero:s.data().numero||'',renuevaDe:s.data().renuevaDe||''});}
            const authority={status:'AUTHORIZED_BY_CONDITIONAL_CONTROL',exactPolicyIds:ids,proofClassification:q.classification,operationalBusinessWrite:false};
            for(const id of ids)await base.doc(id).delete();
            const after=[];for(const id of ids)after.push({id,exists:(await base.doc(id).get()).exists});
            if(after.some(x=>x.exists))throw Error('B4_003_QA_RESIDUE_CLEANUP_READBACK_FAILED');
            fs.writeFileSync(process.env.B4_003_QA_CLEANUP,JSON.stringify({schema:'GRAVICENTRA_I6_5_B4_003_B2_QA_RESIDUE_CLEANUP_V1',recordedAt:new Date().toISOString(),status:'PASS',authority,before,after,deletedCount:ids.length,realOperationalRowsDeleted:0,reimport:false,live:false},null,2)+'\n');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1);});
          NODE

      - name: Upload immutable package and proof
        if: steps.gate.outputs.run == 'true'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i6-5-b4-003-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b4-003-package
            ${{ runner.temp }}/b4-003-preview-proof.json
            ${{ runner.temp }}/b4-003-contract.json
            ${{ runner.temp }}/b4-003-qa-residue-cleanup.json
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Freeze B4-003 machine pass pending Paula visual
        if: steps.gate.outputs.run == 'true'
        env:
          B4_BUILD_ID: ${{ steps.build.outputs.build_id }}
          B4_PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          B4_CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
          B4_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          B4_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          B4_HOSTED_PAYLOAD_DIGEST: ${{ steps.build.outputs.hosted_payload_digest }}
          B4_BACKEND_SOURCE_DIGEST: ${{ steps.build.outputs.backend_source_digest }}
          B4_BUNDLE_DIGEST: ${{ steps.build.outputs.bundle_digest }}
          B4_PROOF: ${{ runner.temp }}/b4-003-preview-proof.json
          B4_QA_CLEANUP: ${{ runner.temp }}/b4-003-qa-residue-cleanup.json
        run: |
          set -euo pipefail
          RECEIPT="artifacts/orbit360-recovery/release-control/I6_5_B4_003_MACHINE_PASS_20261003.json"
          QA_RECEIPT="artifacts/orbit360-recovery/release-control/I6_5_B4_003_B2_QA_RESIDUE_ADJUDICATION_20261003.json"
          export RECEIPT QA_RECEIPT
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$REMOTE" = "$CANDIDATE_SOURCE_SHA"
          cp "$B4_QA_CLEANUP" "$QA_RECEIPT"
          QA_BLOB=$(git hash-object "$QA_RECEIPT"); export QA_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=JSON.parse(fs.readFileSync(process.env.B4_PROOF,'utf8')),q=JSON.parse(fs.readFileSync(process.env.B4_QA_CLEANUP,'utf8'));
          const safe=p.qaResidue?.classification==='PROVEN_B2_QA_LINEAGE_NO_DEPENDENTS';
          const adjudicated=(safe&&q.status==='PASS'&&q.deletedCount===3)||(!safe&&q.status==='NOT_DELETED_FAIL_CLOSED'&&q.deletedCount===0);
          if(p.status!=='PASS'||p.syntheticFinalAbsent!==true||!adjudicated)throw Error('B4_003_PROOF_NOT_PASS');
          const rr={schema:'GRAVICENTRA_I6_5_B4_003_MACHINE_PASS_V1',recordedAt:new Date().toISOString(),status:'MACHINE_PASS_PENDING_PAULA_VISUAL',findingId:'B4-003',sourceSha:process.env.CANDIDATE_SOURCE_SHA,buildId:process.env.B4_BUILD_ID,previewUrl:process.env.B4_PREVIEW_URL,channelId:process.env.B4_CHANNEL_ID,runId:Number(process.env.GITHUB_RUN_ID),artifactId:Number(process.env.B4_ARTIFACT_ID),artifactDigest:process.env.B4_ARTIFACT_DIGEST||'',hostedPayloadDigest:process.env.B4_HOSTED_PAYLOAD_DIGEST||'',backendSourceDigest:process.env.B4_BACKEND_SOURCE_DIGEST||'',bundleDigest:process.env.B4_BUNDLE_DIGEST||'',exactHostingReadback:true,assertions:p.assertions,renewalRenderStability:p.renewalRenderStability,qaResidue:p.qaResidue,qaResidueDisposition:q.status,qaResidueDeletedCount:q.deletedCount,qaResidueAdjudicationReceiptPath:process.env.QA_RECEIPT,qaResidueAdjudicationReceiptBlobSha:process.env.QA_BLOB,syntheticQaWrites:p.syntheticWrites||0,cleanupWrites:p.cleanupWrites||0,syntheticFinalAbsent:p.syntheticFinalAbsent===true,pageErrors:p.pageErrors||[],consoleErrors:p.consoleErrors||[],operationalBusinessWrites:0,reimport:false,livePromoted:false,nextAction:'B4_003_TARGETED_PAULA_VISUAL'};
          fs.writeFileSync(process.env.RECEIPT,JSON.stringify(rr,null,2)+'\n');
          NODE
          RECEIPT_BLOB=$(git hash-object "$RECEIPT"); export RECEIPT_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.COMPOSITION,o=JSON.parse(fs.readFileSync(p,'utf8'));
          o.activeFindingId='B4-003';o.activeBlock='B4';o.currentBlock='B4';
          o.b4003MachinePass={status:'MACHINE_PASS_PENDING_PAULA_VISUAL',path:process.env.RECEIPT,blobSha:process.env.RECEIPT_BLOB,sourceSha:process.env.CANDIDATE_SOURCE_SHA,buildId:process.env.B4_BUILD_ID,previewUrl:process.env.B4_PREVIEW_URL,runId:Number(process.env.GITHUB_RUN_ID),artifactId:Number(process.env.B4_ARTIFACT_ID),artifactDigest:process.env.B4_ARTIFACT_DIGEST||'',operationalBusinessWrites:0,syntheticFinalAbsent:true,qaResidueAdjudicationBlobSha:process.env.QA_BLOB};
          o.b4Execution={...(o.b4Execution||{}),status:'B4_003_MACHINE_PASS_PENDING_PAULA_VISUAL',activeFindingId:'B4-003',sourceSha:process.env.CANDIDATE_SOURCE_SHA,buildId:process.env.B4_BUILD_ID,previewUrl:process.env.B4_PREVIEW_URL,runId:Number(process.env.GITHUB_RUN_ID),artifactId:Number(process.env.B4_ARTIFACT_ID),artifactDigest:process.env.B4_ARTIFACT_DIGEST||'',noLive:true,noReimport:true,nextAction:'B4_003_TARGETED_PAULA_VISUAL'};
          fs.writeFileSync(p,JSON.stringify(o,null,2)+'\n');
          NODE
          COMPOSITION_BLOB=$(git hash-object "$COMPOSITION"); export COMPOSITION_BLOB
          node - <<'NODE'
          const fs=require('node:fs'),p=process.env.FINDINGS,o=JSON.parse(fs.readFileSync(p,'utf8'));
          const f=(o.findings||[]).find(x=>x.id==='B4-003'),n=(o.findings||[]).find(x=>x.id==='B4-004');if(!f||!n)throw Error('B4_FINDING_MISSING');
