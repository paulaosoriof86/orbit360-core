      - name: Prepare B4-003 exact finance source readback
        if: steps.gate.outputs.finance_source_readonly == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'b4003-finance-source-readonly-sa.json'
          account=None
          for key in ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']:
              try: item=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError): continue
              if item.get('type')=='service_account' and item.get('project_id')==os.environ['PROJECT_ID'] and item.get('private_key'):
                  account=item;break
          if not account: raise SystemExit('B4_003_FINANCE_SOURCE_SERVICE_ACCOUNT_UNAVAILABLE')
          out.write_text(json.dumps(account),encoding='utf-8')
          os.chmod(out,0o600)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('GOOGLE_APPLICATION_CREDENTIALS='+str(out)+'\n')
          print('B4_003_FINANCE_SOURCE_READONLY_ACCOUNT_SELECTED')
