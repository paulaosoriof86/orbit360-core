        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'b4003-finance-source-readonly-sa.json'
          account=None
          for key in ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']:
