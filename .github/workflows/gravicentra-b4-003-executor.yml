      - name: Real Chromium login and responsive public smoke
        if: steps.gate.outputs.public_smoke == 'true'
        env:
          B4_PUBLIC_PREVIEW: ${{ steps.gate.outputs.public_smoke_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const {chromium}=require('playwright');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const bound=c.b4003MetasHistorialLatestTechnicalPreview;
          const target=process.env.B4_PUBLIC_PREVIEW;
          if(target!==bound.previewUrl)throw Error('B4_003_PUBLIC_BROWSER_URL_NOT_BOUND');
          const dir=path.join(process.env.RUNNER_TEMP,'b4-003-public-browser');
          fs.mkdirSync(dir,{recursive:true});
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const cases=[],globalErrors=[];
            try{
              for(const width of [1440,390,320]){
                const ctx=await browser.newContext({viewport:{width,height:860},serviceWorkers:'block'});
                const page=await ctx.newPage(),errors=[],http=[];
                page.on('pageerror',e=>errors.push(String(e.message).slice(0,230)));
                page.on('response',r=>{
                  if(r.status()>=400&&r.url().startsWith(target+'/'))http.push({status:r.status(),path:new URL(r.url()).pathname.slice(0,140)});
                });
                await page.goto(target+'/#/historial',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2800);
                const v=await page.evaluate(()=>({
                  title:document.title,bodyChars:(document.body?.innerText||'').trim().length,
                  bodyText:(document.body?.innerText||'').trim().slice(0,600),
                  htmlWidth:document.documentElement.scrollWidth,viewport:innerWidth,
                  hash:location.hash,inputs:document.querySelectorAll('input').length,
                  passwordInputs:document.querySelectorAll('input[type=password]').length
                }));
                await page.screenshot({path:path.join(dir,'public-'+width+'.png'),fullPage:true});
                const result={width,bodyChars:v.bodyChars,hasVisibleContent:v.bodyChars>35,
                  title:v.title,brand:/gravicentra/i.test(v.title+' '+v.bodyText),
                  route:v.hash,loginFields:v.inputs,passwordFields:v.passwordInputs,
                  horizontalOverflow:v.htmlWidth>v.viewport+4,pageErrors:errors,httpErrors:http};
                cases.push(result);
                if(!result.hasVisibleContent||!result.brand||errors.length||http.some(x=>x.status===404)||result.horizontalOverflow)
                  globalErrors.push('PUBLIC_BROWSER_FAILED_'+width);
                await ctx.close();
              }
            }finally{await browser.close();}
            const result={schema:'GRAVICENTRA_B4003_PUBLIC_REAL_CHROMIUM_SMOKE_V1',
              previewUrl:target,sourceSha:bound.sourceSha,buildId:bound.buildId,
              status:globalErrors.length?'FAIL':'PUBLIC_LOGIN_RENDER_PASS_AUTHENTICATED_UAT_PENDING',
              cases,errors:globalErrors,authenticated:false,operationalWrites:0,
              firestoreRulesDeployed:false,livePromotion:false};
            fs.writeFileSync(path.join(dir,'proof.json'),JSON.stringify(result,null,2)+'\n');
            console.log('B4_003_PUBLIC_BROWSER_PROOF='+JSON.stringify(result));
            if(globalErrors.length)process.exitCode=1;
          })().catch(e=>{console.error('B4_003_PUBLIC_BROWSER_FAILURE:'+String(e.message||e));process.exitCode=1;});
