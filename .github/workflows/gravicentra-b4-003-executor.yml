      - name: Read effective live Firestore Rules release without writes
        if: steps.gate.outputs.r26_rules_readonly == 'true'
        env:
          R26_RULES_OUT: ${{ runner.temp }}/r26-rules-live-readback.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {GoogleAuth}=require('google-auth-library');
          const sha=s=>crypto.createHash('sha256').update(String(s||''),'utf8').digest('hex');
          const project=process.env.PROJECT_ID,base='https://firebaserules.googleapis.com/v1/';
          const result={schema:'GRAVICENTRA_B4_003_R26_EFFECTIVE_FIRESTORE_RULES_READONLY_V1',
            status:'INIT',project,gate:'I6.5/B4-003',readOnly:true,
            businessWrites:0,sourceMutations:0,ruleMutations:0,deploys:0,
            productionPromotion:false,p0Closed:false,
            gitSourceSha:process.env.GITHUB_SHA,
            localCandidateRules:{
              productReadOnlySha256:sha(fs.readFileSync('firestore.product-readonly.rules','utf8')),
              legacySha256:sha(fs.readFileSync('firestore.rules','utf8'))
            }};
          (async()=>{
            try{
              const client=await new GoogleAuth({scopes:['https://www.googleapis.com/auth/firebase.readonly']}).getClient();
              const release=(await client.request({url:base+'projects/'+project+'/releases/cloud.firestore'})).data;
              if(!/^projects\/[a-z0-9-]+\/rulesets\/[^/]+$/.test(String(release.rulesetName||'')))
                throw Error('R26_RULESET_RESOURCE_INVALID');
              const rules=(await client.request({url:base+release.rulesetName})).data;
              const files=rules.source?.files||[];
              if(!files.length||files.some(f=>typeof f.content!=='string'))throw Error('R26_RULESET_SOURCE_EMPTY');
              const body=files.map(f=>f.content).join('\n');
              const productRules=fs.readFileSync('firestore.product-readonly.rules','utf8');
              const legacyRules=fs.readFileSync('firestore.rules','utf8');
              const dataRuleSection=body.match(/match\s+\/tenants\/\{tenantId\}\/data\/\{collection\}\/items\/\{documentId\}\s*\{([\s\S]*?)\n\s*\}/);
              const memberOnly=dataRuleSection
                ?/allow\s+read\s*:\s*if\s+activeMembership\(tenantId\)\s*;/.test(dataRuleSection[1]):false;
              result.status='LIVE_FIRESTORE_RULESET_READBACK_COMPLETE_UNDER_REVIEW';
              result.release={name:release.name,rulesetName:release.rulesetName,updateTime:release.updateTime||''};
              result.files=files.map(f=>({name:f.name,sha256:sha(f.content),bytes:f.content.length}));
              result.rulesSha256=sha(body);
              result.exactProductRulesMatch=files.length===1&&files[0].content===productRules;
              result.exactLegacyRulesMatch=files.length===1&&files[0].content===legacyRules;
              result.hasCanonicalDataMatch=!!dataRuleSection;
              result.sourceHasMembershipOnlyDataRead=memberOnly;
              // The August legacy ruleset grants recursive read AND write on all
              // tenant data for any member document, without status/role/scope
              // checking. Readback must fail closed, not certify the rules audit.
              const broadLegacyDataGrant=result.exactLegacyRulesMatch
                && legacyRules.includes('match /tenants/{tenantId}/data/{document=**}')
                && legacyRules.includes('allow read, write: if isTenantMember(tenantId);');
              const broadLegacyTenantGrant=result.exactLegacyRulesMatch
                && legacyRules.includes('match /tenantId/{tenantId}/{document=**}')
                && legacyRules.split('allow read, write: if isTenantMember(tenantId);').length-1>=2;
              result.recursiveDataReadWriteAllowedToTenantMembers=broadLegacyDataGrant;
              result.legacyTenantReadWriteAllowedToTenantMembers=broadLegacyTenantGrant;
              result.memberAuthorizationDoesNotCheckActiveStatus=broadLegacyDataGrant
                && legacyRules.includes('&& exists(memberPath(tenantId));');
              result.directForeignPolicyReadProof={runId:38415321605,
                result:'NEGATIVE_TEST_FAILED_FOREIGN_POLICY_SERVER_GET_ALLOWED',
                actors:['operativo:GT','operativo:CO','asesor:GT']};
              result.rowLevelScopeVerified=false;
              result.securityPass=false;
              result.additionalNegativeActorTestRequired=false;
              result.classification=(broadLegacyDataGrant&&broadLegacyTenantGrant)
                ?'ACTIVE_LEGACY_MEMBER_WIDE_READ_WRITE_SECURITY_BLOCKER'
                :'EFFECTIVE_RULES_NOT_CERTIFIED_ROLE_SCOPE_BLOCKER';
              result.status='SECURITY_BLOCKER_CONFIRMED_FAIL_CLOSED';
            }catch(e){
              result.status='LIVE_RULES_READBACK_BLOCKED_FAIL_CLOSED';
              result.blockerCode=String(e?.code||e?.response?.status||'UNKNOWN');
              result.blockerClass=String(e?.message||'READ_FAILED').replace(/[\r\n]/g,' ').slice(0,230);
            }
            fs.writeFileSync(process.env.R26_RULES_OUT,JSON.stringify(result,null,2)+'\n');
            console.log('R26_EFFECTIVE_RULES_READBACK='+JSON.stringify({
              status:result.status,classification:result.classification||'BLOCKED',
              exactProductRulesMatch:result.exactProductRulesMatch===true,
              membershipOnlyDataRead:result.sourceHasMembershipOnlyDataRead===true,
              rulesSha256:result.rulesSha256||'',blockerCode:result.blockerCode||''}));
            if(result.securityPass!==true)
              process.exitCode=1;
          })().catch(e=>{console.error('R26_RULES_READONLY_UNEXPECTED:'+String(e.message||e));process.exitCode=1;});
          NODE

