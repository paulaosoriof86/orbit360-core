name: Gravicentra B4-003 R20 Exact Preview
# R20 insurer draft source fix: rerun exact Preview after remote-head freeze lease mismatch.
# R19 inbox product-canonical read-owner rootfix retrigger.
# R19 mobile policy-search visibility rootfix retrigger.
# R19 synthetic-child Preview-write retrigger after fail-closed lineage rootfix.
# R19 taxonomy-preservation source-rootfix retrigger; product bridge bound in canonical composition.
# R13 scheduling-only retrigger after shared B4-003 concurrency collision; product source unchanged.
# R13P2 scheduling-only retrigger after Pólizas runtime rootfix; product source unchanged by this line.
# R13P3 scheduling-only retrigger after lazy-search contract alignment; product source unchanged.

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-b4-003-executor.yml'
      - 'tools/gravicentra-i6-5-b4-003-preview-proof.mjs'
      - 'tools/gravicentra-i6-5-b4-003-renewals-priority-preview-proof.mjs'
      - 'tools/gravicentra-i6-5-b4-003-contract.mjs'
      - 'tools/gravicentra-i6-5-b4-003-knowledge-contract.mjs'
      - 'tools/gravicentra-i6-5-b4-003-renewal-deterministic-apply.mjs'
      - 'tools/gravicentra-i6-5-b4-003-r20-renewability-rule.mjs'
      - 'tools/gravicentra-i6-5-b4-003-r20-country-backfill-dryrun.mjs'
      - 'tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-dryrun.mjs'
      - 'tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-apply.mjs'
      - 'tools/gravicentra-live-preexisting-drift-snapshot.mjs'
      - 'tools/gravicentra-quote-authority-contract-v1.mjs'
      - 'orbit360-platform/core/quote-authority-contract-v1.js'
      - 'artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json'

permissions:
  contents: write

concurrency:
  # Preview must not compete with the two read-only B4-003 diagnostics for the single pending slot.
  # Diagnostics keep their own serialization; the exact Preview has an independent queue.
  group: gravicentra-b4-003-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b4-003-renewals-cancelations-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      PROJECT_ID: ays-orbit-360-lab
      TENANT_HINT: alianzas-soluciones
      HOSTING_SITE: ays-orbit-360-lab
      CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
      B4_LOCK: artifacts/orbit360-recovery/release-control/I6_5_FORENSIC_B4_EXECUTION_LOCK_20261002.json
      FINDINGS: artifacts/orbit360-recovery/release-control/I6_FINDINGS_LEDGER_20260924.json
      COMPOSITION: artifacts/orbit360-recovery/release-control/I6_CANONICAL_ACCUMULATIVE_COMPOSITION_LOCK_20260924.json
      CARRY: artifacts/orbit360-recovery/release-control/I6_5_OPEN_FINDINGS_CARRY_FORWARD_REGISTER_20261003.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact B4-003 candidate head
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          CANDIDATE_SOURCE_SHA=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')
          test "$CANDIDATE_SOURCE_SHA" = "$REMOTE"
          echo "CANDIDATE_SOURCE_SHA=$CANDIDATE_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Gate exact B4-003 Preview
        id: gate
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=i6
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const l=JSON.parse(fs.readFileSync(process.env.B4_LOCK,'utf8'));
          const sourceFixed=v=>String(v||'')==='B4_003_SOURCE_FIXED_R19_PENDING_CONTRACT_AND_EXACT_PREVIEW';
          const sourceFixedR20=v=>String(v||'')==='B4_003_SOURCE_FIXED_R20_PENDING_CONTRACT_AND_EXACT_PREVIEW';
          const r19Preview=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R19_CONTRACT_AND_EXACT_PREVIEW'
            && sourceFixed(c.currentB4?.status)&&sourceFixed(c.i65ForensicRemediationPlan?.b4?.status)&&sourceFixed(l.status);
          const r20Preview=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_CONTRACT_AND_EXACT_PREVIEW'
            && sourceFixedR20(c.currentB4?.status)&&sourceFixedR20(c.i65ForensicRemediationPlan?.b4?.status)&&sourceFixedR20(l.status);
          const r23Preview=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R23_CONTRACT_AND_EXACT_PREVIEW'
            && c.currentB4?.status==='B4_003_R23_SOURCE_STAGED_PENDING_PREVIEW'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_R23_SOURCE_STAGED_PENDING_PREVIEW'
            && l.status==='B4_003_R23_SOURCE_STAGED_PENDING_PREVIEW'
            && l.r23CausalAuthorization?.status==='SCOPED_R23_SOURCE_MUTATION_APPROVED_WITHIN_B4_003'
            && l.r23InicioProgress?.authProofExecuted===false;
          const previewOk=(r19Preview||r20Preview||r23Preview)
            && l.activeFinding?.id==='B4-003'
            && l.boundaries?.businessWritesAuthorized===false
            && l.boundaries?.syntheticQaWritesAuthorized===true
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const secondReviewDryRun=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_SECOND_REVIEW_SINGLE_CUMULATIVE_SOURCE_FIX'
            && c.currentB4?.status==='B4_003_R20_SECOND_REVIEW_CAUSES_DEMONSTRATED_SOURCE_FIX_AUTHORIZED'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_R20_SECOND_REVIEW_CAUSES_DEMONSTRATED_SOURCE_FIX_AUTHORIZED'
            && l.status==='B4_003_R20_SECOND_REVIEW_CAUSES_DEMONSTRATED_SOURCE_FIX_AUTHORIZED'
            && l.activeFinding?.id==='B4-003'
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const r20DryRun=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_RENEWABILITY_DRY_RUN_AND_SOURCE_FIX'
            && c.currentB4?.status==='B4_003_R20_CAUSES_DEMONSTRATED_SOURCE_FIX_AUTHORIZED_DATA_READONLY'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_R20_CAUSES_DEMONSTRATED_SOURCE_FIX_AUTHORIZED_DATA_READONLY'
            && l.status==='B4_003_R20_CAUSES_DEMONSTRATED_SOURCE_FIX_AUTHORIZED_DATA_READONLY'
            && l.activeFinding?.id==='B4-003'
            && l.r20Diagnostic?.status==='FROZEN_SOURCE_FIX_AUTHORIZED'
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const a=l.renewalDeterministicApplyAuthorization||{};
          const applyOk=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_RENEWAL_DETERMINISTIC_APPLY'
            && c.currentB4?.status==='B4_003_RENEWAL_DATA_APPLY_AUTHORIZED'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_RENEWAL_DATA_APPLY_AUTHORIZED'
            && l.status==='B4_003_RENEWAL_DATA_APPLY_AUTHORIZED'
            && l.activeFinding?.id==='B4-003'
            && a.status==='AUTHORIZED_PENDING_APPLY'
            && a.sourceSha256==='1505902788fb6e71d56cb751d64cd721f6d1930d0c90bcfd890c1a129b5041f3'
            && a.maxWrites===4
            && Array.isArray(a.exactPolicyIds)&&a.exactPolicyIds.length===4
            && l.boundaries?.dataMutationAuthorized===true
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const r20a=l.r20RenewabilityApplyAuthorization||{};
          const r20Apply=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_RENEWABILITY_APPLY'
            && c.currentB4?.status==='B4_003_R20_RENEWABILITY_APPLY_AUTHORIZED'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_R20_RENEWABILITY_APPLY_AUTHORIZED'
            && l.status==='B4_003_R20_RENEWABILITY_APPLY_AUTHORIZED'
            && l.activeFinding?.id==='B4-003'
            && r20a.status==='AUTHORIZED_PENDING_APPLY'
            && r20a.ruleId==='PAULA_R20_RENEWABILITY_RULE_20261006'
            && Number(r20a.maxWrites)===1415
            && l.boundaries?.dataMutationAuthorized===true
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const r20c=l.r20RenewalCutoffApplyAuthorization||{};
          const r20CutoffApply=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_R20_RENEWAL_CUTOFF_APPLY'
            && c.currentB4?.status==='B4_003_R20_RENEWAL_CUTOFF_APPLY_AUTHORIZED'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_R20_RENEWAL_CUTOFF_APPLY_AUTHORIZED'
            && l.status==='B4_003_R20_RENEWAL_CUTOFF_APPLY_AUTHORIZED'
            && l.activeFinding?.id==='B4-003'
            && r20c.status==='AUTHORIZED_PENDING_APPLY'
            && r20c.ruleId==='PAULA_EXPIRED_CUTOFF_20261007'
            && r20c.targetDigest==='744f6f26139f272fa3a26ab35e889a9d011833e802d1495286147734ec7b4d1d'
            && Number(r20c.maxWrites)===583
            && Number(r20c.recentCount)===24
            && l.boundaries?.renewalCutoffDataMutationAuthorized===true
            && l.boundaries?.dataMutationAuthorized===true
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          const rp=l.renewalsPriorityPreviewAuthorization||{};
          const renewalsPreview=c.nextAction==='I6_5_FORENSIC_REMEDIATION_B4_003_RENEWALS_PRIORITY_EXACT_PREVIEW'
            && c.currentB4?.status==='B4_003_RENEWALS_PRIORITY_EXACT_PREVIEW_AUTHORIZED'
            && c.i65ForensicRemediationPlan?.b4?.status==='B4_003_RENEWALS_PRIORITY_EXACT_PREVIEW_AUTHORIZED'
            && l.status==='B4_003_RENEWALS_PRIORITY_EXACT_PREVIEW_AUTHORIZED'
            && l.activeFinding?.id==='B4-003'
            && rp.status==='AUTHORIZED_PENDING_PREVIEW'
            && rp.decisionPackBlobSha==='43f2c791861a7f5489e34253728acb60c6313f18'
            && rp.authorizationBlobSha==='fc12772894e08c80757b53abdcb6cdc31ab7fad8'
            && l.boundaries?.productMutationAuthorized===false
            && l.boundaries?.businessWritesAuthorized===false
            && l.boundaries?.syntheticQaWritesAuthorized===false
            && l.boundaries?.dataMutationAuthorized===false
            && l.boundaries?.buildDispatchAuthorized===true
            && l.boundaries?.previewMutationAuthorized===true
            && l.boundaries?.functionDeploymentAuthorized===true
            && l.boundaries?.providerDeploymentAuthorized===true
            && l.boundaries?.reimportAuthorized===false
            && l.boundaries?.livePromotionAuthorized===false;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'renewals_preview='+(renewalsPreview?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(previewOk?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'apply='+(applyOk?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'r20_dryrun='+(r20DryRun?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'r20_apply='+(r20Apply?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'r20_cutoff_apply='+(r20CutoffApply?'true':'false')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'r20_second_dryrun='+(secondReviewDryRun?'true':'false')+'\n');
          console.log('B4_003_PREVIEW_MODE='+(previewOk?'RUN':'NOOP')+' RENEWALS_PRIORITY_PREVIEW='+(renewalsPreview?'RUN':'NOOP')+' APPLY_MODE='+(applyOk?'RUN':'NOOP')+' R20_DRYRUN_MODE='+(r20DryRun?'RUN':'NOOP')+' R20_APPLY_MODE='+(r20Apply?'RUN':'NOOP')+' R20_CUTOFF_APPLY='+(r20CutoffApply?'RUN':'NOOP')+' R20_SECOND_DRYRUN='+(secondReviewDryRun?'RUN':'NOOP'));
          NODE


      - name: Snapshot preexisting LIVE binding before second R20 review dry-runs
        if: steps.gate.outputs.r20_second_dryrun == 'true'
        env:
          LIVE_DRIFT_OUT: ${{ runner.temp }}/b4-003-r20-live-before.json
        run: node tools/gravicentra-live-preexisting-drift-snapshot.mjs --mode=snapshot

      - name: Prepare second R20 review read-only dry-runs and source syntax checks
        if: steps.gate.outputs.r20_second_dryrun == 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b4-003-r20-second-dryrun-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json'
                  p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('B4_003_R20_SECOND_DRYRUN_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL=$(head -n1 "$ROOT/files")
          cp "$SEL" "$RUNNER_TEMP/b4-003-r20-second-dryrun-sa.json"
          chmod 600 "$RUNNER_TEMP/b4-003-r20-second-dryrun-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/b4-003-r20-second-dryrun-sa.json" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false firebase-admin@13.4.0 >/dev/null
          node --check tools/gravicentra-i6-5-b4-003-r20-country-backfill-dryrun.mjs
          node --check tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-dryrun.mjs
          node --check orbit360-platform/core/product-app-p0.js
          node --check orbit360-platform/core/ciclo.js
          node --check orbit360-platform/modules/ops.js
          node --check orbit360-platform/modules/leads.js
          node --check orbit360-platform/core/importa.js
          node --check orbit360-platform/core/product-drive-document-provider-p0.js
          node --check orbit360-platform/modules/aseguradoras.js
          node --check orbit360-platform/modules/calidad.js
          node --check orbit360-platform/modules/configuracion.js
          node --check orbit360-platform/core/config.js

      - name: Execute second R20 review read-only data dry-runs
        if: steps.gate.outputs.r20_second_dryrun == 'true'
        env:
          R20_COUNTRY_BACKFILL_RESULT: ${{ runner.temp }}/b4-003-r20-country-backfill-dryrun.json
          R20_RENEWAL_CUTOFF_RESULT: ${{ runner.temp }}/b4-003-r20-renewal-cutoff-dryrun.json
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b4-003-r20-country-backfill-dryrun.mjs
          node tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-dryrun.mjs

      - name: Verify LIVE remained byte-stable during second R20 review dry-runs
        if: steps.gate.outputs.r20_second_dryrun == 'true'
        env:
          LIVE_DRIFT_BEFORE: ${{ runner.temp }}/b4-003-r20-live-before.json
          LIVE_DRIFT_OUT: ${{ runner.temp }}/b4-003-r20-live-after.json
        run: node tools/gravicentra-live-preexisting-drift-snapshot.mjs --mode=compare

      - name: Upload second R20 review dry-run evidence
        if: always() && steps.gate.outputs.r20_second_dryrun == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: b4-003-r20-second-review-dryruns-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b4-003-r20-country-backfill-dryrun.json
            ${{ runner.temp }}/b4-003-r20-renewal-cutoff-dryrun.json
            ${{ runner.temp }}/b4-003-r20-live-before.json
            ${{ runner.temp }}/b4-003-r20-live-after.json
          if-no-files-found: error
          retention-days: 14

      - name: Snapshot preexisting LIVE binding before authorized B-02 cutoff apply
        if: steps.gate.outputs.r20_cutoff_apply == 'true'
        env:
          LIVE_DRIFT_OUT: ${{ runner.temp }}/b4-003-b02-live-before.json
        run: node tools/gravicentra-live-preexisting-drift-snapshot.mjs --mode=snapshot

      - name: Prepare authorized B-02 renewal cutoff apply
        if: steps.gate.outputs.r20_cutoff_apply == 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b4-003-b02-cutoff-apply-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json'
                  p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('B4_003_B02_CUTOFF_APPLY_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL=$(head -n1 "$ROOT/files")
          cp "$SEL" "$RUNNER_TEMP/b4-003-b02-cutoff-apply-sa.json"
          chmod 600 "$RUNNER_TEMP/b4-003-b02-cutoff-apply-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/b4-003-b02-cutoff-apply-sa.json" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false firebase-admin@13.4.0 >/dev/null
          node --check tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-apply.mjs

      - name: Apply exact B-02 historical renewal disposition
        if: steps.gate.outputs.r20_cutoff_apply == 'true'
        env:
          R20_RENEWAL_CUTOFF_APPLY_RESULT: ${{ runner.temp }}/b4-003-b02-renewal-cutoff-apply.json
          R20_RENEWAL_CUTOFF_ROLLBACK: ${{ runner.temp }}/b4-003-b02-renewal-cutoff-rollback.private.json
          R20_RENEWAL_CUTOFF_AUTH: artifacts/orbit360-recovery/release-control/I6_5_B4_003_B02_RENEWAL_CUTOFF_APPLY_AUTH_20261008.json
        run: |
          set -euo pipefail
          node tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-apply.mjs --mode=apply

      - name: Roll back B-02 cutoff disposition on failure
        if: failure() && steps.gate.outputs.r20_cutoff_apply == 'true'
        env:
          R20_RENEWAL_CUTOFF_APPLY_RESULT: ${{ runner.temp }}/b4-003-b02-renewal-cutoff-rollback-result.json
          R20_RENEWAL_CUTOFF_ROLLBACK: ${{ runner.temp }}/b4-003-b02-renewal-cutoff-rollback.private.json
        run: |
          if [ -f "$R20_RENEWAL_CUTOFF_ROLLBACK" ]; then
            node tools/gravicentra-i6-5-b4-003-r20-renewal-cutoff-apply.mjs --mode=rollback || true
          fi
          echo "B4_003_B02_CUTOFF_APPLY_FAILED_FAIL_CLOSED"

      - name: Verify LIVE remained byte-stable during B-02 cutoff apply
        if: always() && steps.gate.outputs.r20_cutoff_apply == 'true'
        env:
          LIVE_DRIFT_BEFORE: ${{ runner.temp }}/b4-003-b02-live-before.json
          LIVE_DRIFT_OUT: ${{ runner.temp }}/b4-003-b02-live-after.json
        run: node tools/gravicentra-live-preexisting-drift-snapshot.mjs --mode=compare

      - name: Upload B-02 cutoff apply evidence
        if: always() && steps.gate.outputs.r20_cutoff_apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: b4-003-b02-renewal-cutoff-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b4-003-b02-renewal-cutoff-apply.json
            ${{ runner.temp }}/b4-003-b02-renewal-cutoff-rollback-result.json
            ${{ runner.temp }}/b4-003-b02-live-before.json
            ${{ runner.temp }}/b4-003-b02-live-after.json
          if-no-files-found: warn
          retention-days: 14

      - name: Assert LIVE unchanged before R20 renewability dry-run
        if: steps.gate.outputs.r20_dryrun == 'true'
        run: node tools/gravicentra-certified-live-binding-check.mjs

      - name: Prepare read-only R20 renewability dry-run
        if: steps.gate.outputs.r20_dryrun == 'true'
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b4-003-r20-renewability-auth"
          mkdir -p "$ROOT"
          export ROOT
          python3 - <<'PY'
          import json,os,pathlib
          rows=[]
          for i,k in enumerate(['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']):
              try:d=json.loads(os.environ.get(k,''))
              except:continue
              if d.get('type')=='service_account' and d.get('project_id')=='ays-orbit-360-lab' and d.get('private_key'):
                  p=pathlib.Path(os.environ['ROOT'])/f'{i}.json'
                  p.write_text(json.dumps(d));p.chmod(0o600);rows.append(str(p))
          if not rows:raise SystemExit('B4_003_R20_DRYRUN_NO_SERVICE_ACCOUNT')
          pathlib.Path(os.environ['ROOT']+'/files').write_text('\n'.join(rows)+'\n')
          PY
          SEL=$(head -n1 "$ROOT/files")
          cp "$SEL" "$RUNNER_TEMP/b4-003-r20-renewability-sa.json"
          chmod 600 "$RUNNER_TEMP/b4-003-r20-renewability-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/b4-003-r20-renewability-sa.json" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false firebase-admin@13.4.0 >/dev/null
