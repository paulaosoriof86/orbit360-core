          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null

      - name: B4-003 exact GT CO finance and protected collection readback
        if: steps.gate.outputs.finance_source_readonly == 'true'
        env:
          FINANCE_EXACT_PREVIEW: ${{ steps.gate.outputs.finance_exact_preview }}
          FINANCE_EVIDENCE_OUT: ${{ runner.temp }}/b4-003-finance-source-readonly.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const {initializeApp,applicationDefault}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const cp=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const exact=cp.b4003FunctionalContractRestore20261014.newExactPreviewProof;
          const fail=m=>{throw Error(m);};
          const confCtx={window:{}};
          vm.runInNewContext(fs.readFileSync('orbit360-platform/product-runtime-config.js','utf8'),confCtx,{timeout:1000});
          const config=confCtx.window.__ORBIT360_PRODUCT_PUBLIC_CONFIG__;
          const required=Array.from(config.requiredCollections),optional=Array.from(config.optionalCollections);
          const related=fs.readFileSync('functions/b4-003-scoped-related-reader.js','utf8');
          const policyReader=fs.readFileSync('functions/b4-003-scoped-policy-callable.js','utf8');
          const protectedStore=fs.readFileSync('orbit360-platform/data/store-firestore-product-readonly-p0.js','utf8');
          const names=[...required,...optional].filter((x,i,a)=>a.indexOf(x)===i);
          const relatedCollectionList=(related.match(/const collections=new Set\(\[[^;]+\]\)/)||[])[0]||'';
          const isCovered=name=>['polizas','aseguradoras','asesores'].includes(name)
            ||relatedCollectionList.includes("'"+name+"'");
          const unsupported=names.filter(x=>!isCovered(x));
          if(!policyReader.includes('readScopedRelatedList')||!protectedStore.includes('PROTECTED_READ_COLLECTION_UNSUPPORTED_'))
            fail('B4_003_PROTECTED_SOURCE_OWNER_NOT_FOUND');
          const report={schema:'GRAVICENTRA_B4003_EXACT_FINANCE_SOURCE_COVERAGE_READONLY_V1',
            headSha:process.env.CANDIDATE_SOURCE_SHA,gate:'I6.5/B4-003',preview:process.env.FINANCE_EXACT_PREVIEW,
            sourceSha:exact.sourceSha,buildId:exact.buildId,readOnly:true,realBusinessWrites:0,
            impersonation:false,firestoreRulesChanged:false,deploys:0,
            requiredCount:required.length,optionalCount:optional.length,unsupportedCollections:unsupported,
            requiredUnsupported:required.filter(x=>unsupported.includes(x)),sourceCounts:{},relations:{}};
          (async()=>{
            if(process.env.FINANCE_EXACT_PREVIEW!==exact.previewUrl)fail('B4_003_FINANCE_PREVIEW_MISMATCH');
            const markerResponse=await fetch(exact.previewUrl+'/__recovery__/build.json',{signal:AbortSignal.timeout(15000)});
            if(!markerResponse.ok)fail('B4_003_FINANCE_PREVIEW_MARKER_HTTP_'+markerResponse.status);
            const marker=await markerResponse.json();
            if(marker.sourceSha!==exact.sourceSha||marker.buildId!==exact.buildId)
              fail('B4_003_FINANCE_PREVIEW_MARKER_MISMATCH');
            report.markerExact=true;
            const configReply=await fetch(exact.previewUrl+'/product-runtime-config.js',{signal:AbortSignal.timeout(15000)});
            if(!configReply.ok)fail('B4_003_PREVIEW_PUBLIC_CONFIG_HTTP_'+configReply.status);
            const liveConfigCtx={window:{}};
            vm.runInNewContext(await configReply.text(),liveConfigCtx,{timeout:1500});
            const hosted=liveConfigCtx.window.__ORBIT360_PRODUCT_PUBLIC_CONFIG__||{};
            if(hosted.sourceSha!==exact.sourceSha||hosted.buildId!==exact.buildId||
               hosted.scopedReadPreviewCandidate!==true)
              fail('B4_003_HOSTED_CONFIG_RELEASE_IDENTITY_MISMATCH');
            const effectiveRequired=Array.from(hosted.requiredCollections||[]);
            const effectiveOptional=Array.from(hosted.optionalCollections||[]);
            const effectiveConfigured=[...new Set([...effectiveRequired,...effectiveOptional])];
            report.hostedCollectionAuthority={required:effectiveRequired,optional:effectiveOptional,
              unsupported:effectiveConfigured.filter(k=>!isCovered(k)),
              staticOnly:names.filter(k=>!effectiveConfigured.includes(k)),
              missingFromStatic:effectiveConfigured.filter(k=>!names.includes(k))};
            const db=getFirestore(initializeApp({credential:applicationDefault(),projectId:process.env.PROJECT_ID}));
            const tenant=db.collection('tenants').doc(process.env.TENANT_HINT);
            const collection=k=>tenant.collection('data').doc(k).collection('items');
            const tracked=[...new Set([...names,'actividades'])];
            const counts=await Promise.all(tracked.map(async k=>{
              const snap=await collection(k).count().get();
              return [k,snap.data().count];
            }));
            for(const [k,n] of counts){if(!Number.isInteger(n)||n<0)fail('B4_003_COUNT_INVALID_'+k);report.sourceCounts[k]=n;}
            const subset=['clientes','polizas','recibosEsperados','carteraPrimas','cobros','vehiculos'];
            if(subset.some(k=>report.sourceCounts[k]>20000))fail('B4_003_RELATION_SOURCE_BOUND_REACHED');
            const snapshots=await Promise.all(subset.map(async k=>{
              const cols=k==='clientes'?['pais','country']:
                k==='polizas'?['pais','country','clienteId','asesorId']:
                ['polizaId','policyId','clienteId','clientId','pais','country'];
              return [k,await collection(k).select(...cols).get()];
            }));
            const by=Object.fromEntries(snapshots.map(([k,s])=>[k,s]));
            const clients=new Map(by.clientes.docs.map(d=>[d.id,d.data()||{}]));
            const policies=new Map(by.polizas.docs.map(d=>[d.id,d.data()||{}]));
            const country=v=>String(v||'').trim().toUpperCase();
            const policyCountries={GT:0,CO:0,unknown:0},crossCountry={GTClientCOPolicy:0,COClientGTPolicy:0};
            for(const p of policies.values()){
              const k=country(p.pais||p.country);if(k==='GT'||k==='CO')policyCountries[k]++;else policyCountries.unknown++;
              const c=clients.get(String(p.clienteId||'')),cc=country(c?.pais||c?.country);
              if(cc==='GT'&&k==='CO')crossCountry.GTClientCOPolicy++;
              if(cc==='CO'&&k==='GT')crossCountry.COClientGTPolicy++;
            }
            const children={};
            for(const k of subset.filter(x=>!['clientes','polizas'].includes(x))){
              let linked=0,missingPolicy=0,withoutAnchor=0,explicitCountryConflict=0,linkedGT=0,linkedCO=0;
              for(const d of by[k].docs){
                const r=d.data()||{},id=String(r.polizaId||r.policyId||'');
                if(!id){withoutAnchor++;continue;}
                const p=policies.get(id);if(!p){missingPolicy++;continue;}
                linked++;
                const pc=country(p.pais||p.country),rc=country(r.pais||r.country);
                if(pc==='GT')linkedGT++;if(pc==='CO')linkedCO++;
                if(pc&&rc&&pc!==rc)explicitCountryConflict++;
              }
              children[k]={rows:by[k].size,linked,missingPolicy,withoutAnchor,explicitCountryConflict,linkedGT,linkedCO};
            }
            // Historial read contract — aggregate attributes only, no event text
            // and no user identifiers in the artifact. Never infer permissions.
            const asnap=await collection('actividades')
              .select('pais','country','polizaId','policyId','clienteId','clientId',
                'asesorId','advisorId','ownerAdvisorId','tenantId').get();
            const events={count:asnap.size,countryExplicit:0,countryFromPolicy:0,
              countryFromClient:0,countryUnknown:0,countryConflict:0,
              policyMatched:0,clientMatched:0,unresolvedParent:0,
              advisorExplicit:0,advisorFromPolicy:0,advisorFromClient:0,advisorMissing:0,
              matchedGT:0,matchedCO:0,tenantMismatch:0};
            for(const doc of asnap.docs){
              const row=doc.data()||{},p=policies.get(String(row.polizaId||row.policyId||'')),
                c=clients.get(String(row.clienteId||row.clientId||p?.clienteId||''));
              if(p)events.policyMatched++;if(c)events.clientMatched++;
              if(!p&&!c)events.unresolvedParent++;
              const explicit=country(row.pais||row.country),
                fromPolicy=country(p?.pais||p?.country),
                fromClient=country(c?.pais||c?.country);
              if(explicit)events.countryExplicit++;
              else if(fromPolicy)events.countryFromPolicy++;
              else if(fromClient)events.countryFromClient++;
              else events.countryUnknown++;
              const canonical=fromPolicy||fromClient||explicit;
              if(explicit&&canonical&&explicit!==canonical)events.countryConflict++;
              if(canonical==='GT')events.matchedGT++;
              if(canonical==='CO')events.matchedCO++;
              if(row.tenantId&&row.tenantId!==process.env.TENANT_HINT)events.tenantMismatch++;
              if(row.asesorId||row.advisorId||row.ownerAdvisorId)events.advisorExplicit++;
              else if(p?.asesorId)events.advisorFromPolicy++;
              else if(c?.asesorId)events.advisorFromClient++;
              else events.advisorMissing++;
            }
            report.activityRelationshipProfile=events;
            report.relations={policiesByCountry:policyCountries,crossCountryPolicyClient:crossCountry,children};
            const hostedGap=report.hostedCollectionAuthority.unsupported.filter(k=>report.sourceCounts[k]>0);
            const historyCode=fs.readFileSync('orbit360-platform/modules/historial.js','utf8');
            const historyUsesActivities=historyCode.includes("S().all('actividades')");
            const historyRequested=report.hostedCollectionAuthority.required.includes('actividades')||
              report.hostedCollectionAuthority.optional.includes('actividades');
            report.protectedOperationalBlockers={hostedUncoveredWithRealRows:hostedGap,
              historyUsesActivities,historyRequested,activitySourceCount:report.sourceCounts.actividades,
              historyHydrationMissing:historyUsesActivities&&!historyRequested&&report.sourceCounts.actividades>0};
