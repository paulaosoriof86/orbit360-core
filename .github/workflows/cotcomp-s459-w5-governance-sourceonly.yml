name: CotComp S4.59 W5 governance reconciliation source-only

on:
  push:
    branches:
      - ays/cotcomp-s459-w5-governance-reconcile-20261001
    paths:
      - '.github/cotcomp-lab-intents/s459-w5-governance-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s459-w5-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.59 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s459-w5-governance-sourceonly.json
          jq -e '
            .authorization=="S459_W5_SOURCE_ONLY_GOVERNANCE_RECONCILIATION" and
            .projectId=="ays-orbit-360-lab" and
            .stage=="W5" and
            .appDataReads==false and
            .appDataWrites==false and
            .realData==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA and S4.59 tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-w5-governance-reconcile-s459.js
          node --check cotcomp-w5-governance-reconcile-s459.test.js
          node --test cotcomp-w5-governance-reconcile-s459.test.js

      - name: Build and enforce S4.59 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s459/evidence"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./functions/cotcomp-w5-governance-reconcile-s459');
          const r=s.evaluate();
          const out={
            schemaVersion:'ays-cotcomp-s459-w5-governance-reconciliation-receipt-v1.0',
            projectId:'ays-orbit-360-lab',
            stage:'W5',
            sourceReconciliationPass:r.sourceReconciliationPass,
            ownerNoCounselException:r.ownerNoCounselException,
            legalEvidence:r.legalEvidence,
            technicalW5Ready:r.technicalW5Ready,
            realDataPilotExecutionAllowed:r.realDataPilotExecutionAllowed,
            noCounselExceptionCanAuthorizeW5RealData:r.noCounselExceptionCanAuthorizeW5RealData,
            remainingBlockers:r.remainingBlockers,
            boundaries:{
              appDataReadsExecuted:0,
              appDataWritesExecuted:0,
              realDataTouched:false,
              productionTouched:false
            }
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s459/evidence/S459_W5_GOVERNANCE_RECONCILIATION_RECEIPT.json',JSON.stringify(out,null,2));
          NODE
          R="$RUNNER_TEMP/s459/evidence/S459_W5_GOVERNANCE_RECONCILIATION_RECEIPT.json"
          jq -e '
            .sourceReconciliationPass==true and
            .ownerNoCounselException.legalComplianceVerified==false and
            .ownerNoCounselException.realDataWritesAllowed==false and
            .ownerNoCounselException.productionReleaseAllowed==false and
            .legalEvidence.gtLegalPacketPresent==false and
            .legalEvidence.coLegalPacketPresent==false and
            .legalEvidence.formalLegalValidationComplete==false and
            .technicalW5Ready==true and
            .realDataPilotExecutionAllowed==false and
            .noCounselExceptionCanAuthorizeW5RealData==false and
            .remainingBlockers==[
              "FORMAL_LEGAL_VALIDATION_REQUIRED",
              "W5_EXACT_PILOT_SCOPE_REQUIRED",
              "W5_SUCCESS_PERSISTENCE_DISPOSITION_REQUIRED",
              "OWNER_W5_REAL_DATA_AUTHORIZATION_REQUIRED"
            ] and
            .boundaries.appDataReadsExecuted==0 and
            .boundaries.appDataWritesExecuted==0 and
            .boundaries.realDataTouched==false and
            .boundaries.productionTouched==false
          ' "$R" >/dev/null

      - name: Upload S4.59 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s459-w5-governance-${{ github.run_id }}
          path: ${{ runner.temp }}/s459/evidence/S459_W5_GOVERNANCE_RECONCILIATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
