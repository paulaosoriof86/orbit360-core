name: Gravicentra I4A Hydration Plan Readonly

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-hydration-plan-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_URL: https://ays-orbit-360-lab--gi-i3-34072755093-lezwsk5g.web.app
  SOURCE_SHA: 0a20a0ee8939c8fe4d2b0904ddf5fda383363434
  BUILD_ID: gi-i3-0a20a0ee8939-57f234755dc1

jobs:
  hydration-plan-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts firebase-admin@13.4.0 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture exact product hydration plans
        env:
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          I4A_HYDRATION_PLAN_DIR: ${{ runner.temp }}/gravicentra-i4a-hydration-plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$I4A_HYDRATION_PLAN_DIR"
          node tools/gravicentra-i4a-hydration-plan-readonly.mjs
      - name: Preserve hydration-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-i4a-hydration-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-i4a-hydration-plan
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
