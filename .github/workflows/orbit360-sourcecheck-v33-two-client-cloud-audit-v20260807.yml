name: Orbit360 sourcecheck v33 two-client cloud audit
on:
  pull_request:
    branches: [ays/backend-tenant-lab-v99-20260703]
permissions: {contents: read}
jobs:
  source-v33-two-client-cloud-audit:
    if: github.head_ref == 'ays/source-v33-two-client-cloud-audit-20260807'
    runs-on: ubuntu-24.04
    env:
      ORBIT360_GATE_PROFILE: v33-two-client-cloud-audit
      ORBIT360_REQUEST_FILE: .github/orbit360-requests/block1-client360-insurers-v33-two-client-cloud-audit-authorization.json
      ORBIT360_EXPECTED_REQUEST_VERSION: NONE_PENDING_FRESH_AUTHORIZATION
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Canonical v33 source gate
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .authorizationGeneration=="v33-two-client-cloud-audit-readonly" and .ok==true and .secretAccessAuthorized==false and .firestoreReadAuthorized==false and .loggingReadAuthorized==false and .writesAuthorized==0 and (.requestState=="ABSENT_PENDING_FRESH_AUTHORIZATION" or .requestState=="FROZEN_HISTORICAL_CONSUMED")' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Frozen product and protected backend
        run: |
          set -euo pipefail
          BASE=84d6daf66c99bba8fe6b4df5c9e327c05ec469dc
          for p in orbit360-platform/modules/cliente360.js orbit360-platform/modules/aseguradoras.js orbit360-platform/modules/polizas.js orbit360-platform/modules/cobros.js orbit360-platform/sw.js orbit360-platform/core/pwa.js orbit360-platform/data/store.js orbit360-platform/core/auth.js orbit360-platform/core/importa.js orbit360-platform/firestore.rules; do
            git diff --quiet "$BASE"...HEAD -- "$p" || { echo "STOP_V33_FROZEN_CHANGED:$p"; exit 41; }
          done
      - name: Source-safe external audit fixtures and request state
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs
          node --check tools/orbit360-test-two-client-cloud-audit-v33-source-v20260807.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-v33-v20260807.mjs
          node tools/orbit360-test-two-client-cloud-audit-v33-source-v20260807.mjs
          node <<'NODE'
          const fs=require('fs');const p=process.env.ORBIT360_REQUEST_FILE;
          if(!fs.existsSync(p))process.exit(0);
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const ok=['CONSUMED','CONSUMED_STOP_RETRY'].includes(String(r.status||''))&&r.allowedExecutions===0&&r.consumed===true&&r.authorizationFrozen===true&&r.replayAllowed===false;
          if(!ok){console.error('STOP_V33_REQUEST_NOT_FROZEN_HISTORICAL');process.exit(41);}
          NODE
      - name: Semantic privacy and zero-write boundary
        run: |
          set -euo pipefail
          node tools/orbit360-detect-firestore-mutations-v32-v20260807.mjs tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs > "$RUNNER_TEMP/v33-mutation-analysis.json"
          jq -e '.ok==true and (.findings|length)==0' "$RUNNER_TEMP/v33-mutation-analysis.json" >/dev/null
          ! grep -Eq 'firebase deploy|playwright|hosting:' tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs
          grep -Fq 'rawLogEntriesPersisted' tools/orbit360-validator-lifecycle-block1-two-client-cloud-audit-v33-v20260807.json
          echo PASS_V33_CANONICAL_SOURCE_GATE_NO_SECRETS_NO_RUNTIME_NO_WRITES
