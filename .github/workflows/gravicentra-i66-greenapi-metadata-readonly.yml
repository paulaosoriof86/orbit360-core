          selected=None
          for key in ('SA_LAB','SA_ALT','SA_DEFAULT'):
              try:item=json.loads(os.environ.get(key) or '{}')
              except (TypeError,ValueError):continue
              if item.get('type')=='service_account' and item.get('project_id')=='ays-orbit-360-lab' and item.get('private_key'):
                  selected=item
                  break
