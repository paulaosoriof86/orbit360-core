# I6.6 Preview32 causal successor: reobserve independent Functions, Run traffic and grants with the corrected executor pin.
# I6.6 20261124 R44: refresh existing inbound config preflight after external capacity restoration.
# I6.6 GREENAPI METADATA PROBE -- read-only evidence, no delivery.
# Manual read-only inventory of existing GCP Secret Manager/Functions/Cloud Run.
# Metadata job: no payload access. Config job: exact existing secret validation in memory,
# plus bounded projected mailbox-owner identity reads and provider metadata GETs. No job sends, writes or deploys.
# Runtime refresh also reads exact ingress configuration and function preimages without writes.
name: Gravicentra I6.6 GreenAPI Secure Readiness

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths: [.github/workflows/gravicentra-i66-greenapi-metadata-readonly.yml]
  workflow_dispatch:
    inputs:
      scope_confirmation:
        description: "Read metadata, or validate existing inbound configuration server-side without exposing payload"
        required: true
        type: choice
        options: [READ_ONLY_NO_SEND, READ_ONLY_VALIDATE_EXISTING_INBOUND_CONFIG]

permissions:
  contents: read

concurrency:
  group: gravicentra-i66-greenapi-metadata-readonly
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'paulaosoriof86/orbit360-core' &&
      github.ref == 'refs/heads/recovery/fase-a-clean-20260831' &&
      ((github.event_name == 'workflow_dispatch' && inputs.scope_confirmation == 'READ_ONLY_NO_SEND') ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, 'I66_GREENAPI_METADATA_READONLY')))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROJECT_ID: ays-orbit-360-lab
      REGION: us-central1
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Select already configured same-project service account without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/i66-greenapi-meta-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'i66-greenapi-meta-auth'
          selected=None
          for key in ('SA_LAB','SA_ALT','SA_DEFAULT'):
              try: row=json.loads(os.environ.get(key) or '{}')
              except (TypeError,ValueError): continue
              if row.get('type')=='service_account' and row.get('project_id')=='ays-orbit-360-lab' and row.get('private_key'):
                  selected=row
                  break
          if selected is None:
              print('I66_GREENAPI_METADATA_CREDENTIAL_MATCH=false')
              raise SystemExit(1)
          target=root/'selected.json'
          target.write_text(json.dumps(selected))
          target.chmod(0o600)
          print('I66_GREENAPI_METADATA_CREDENTIAL_MATCH=true')
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/i66-greenapi-meta-auth/selected.json" >> "$GITHUB_ENV"
      - name: Collect metadata only (never request a secret version payload)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          root="$RUNNER_TEMP/i66-greenapi-meta"
          mkdir -p "$root/functions" "$root/services" "$root/versions"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null 2>&1
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null 2>&1
          if gcloud secrets list --project "$PROJECT_ID" --format=json > "$root/secrets.json" 2> "$root/secrets.err" && python3 -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])),list)' "$root/secrets.json" >/dev/null 2>&1; then
            : > "$root/secrets-readable"
          fi
          if gcloud functions list --v2 --regions="$REGION" --project "$PROJECT_ID" --format=json > "$root/functions-list.json" 2> "$root/functions.err" && python3 -m json.tool "$root/functions-list.json" >/dev/null 2>&1; then
            : > "$root/functions-readable"
          fi
          for fn in orbit360GreenApiOutboxUpdated orbit360GreenApiDeliveryStatus; do
            if gcloud functions describe "$fn" --gen2 --region "$REGION" --project "$PROJECT_ID" --format=json > "$root/functions/$fn.json" 2> "$root/functions/$fn.err" && python3 -m json.tool "$root/functions/$fn.json" >/dev/null 2>&1; then
              : > "$root/functions/$fn-readable"
            fi
          done
          # Extract ONLY the two exact, same-project Cloud Run service names.
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'i66-greenapi-meta'
          out=[]
          for fn in ('orbit360GreenApiOutboxUpdated','orbit360GreenApiDeliveryStatus'):
              p=root/'functions'/f'{fn}.json'
              if not (root/'functions'/f'{fn}-readable').exists():continue
              item=json.loads(p.read_text())
              uri=str((item.get('serviceConfig') or {}).get('service') or '')
              prefix='projects/ays-orbit-360-lab/locations/us-central1/services/'
              if not uri.startswith(prefix):continue
              name=uri[len(prefix):]
              if re.fullmatch(r'[a-z][a-z0-9-]{1,62}',name):out.append((fn,name))
          (root/'services-to-read').write_text(''.join(f'{a} {b}\n' for a,b in out))
          PY
          while read -r fn service; do
            test -n "${fn:-}" || continue
            if gcloud run services describe "$service" --region "$REGION" --project "$PROJECT_ID" --format=json > "$root/services/$fn.json" 2> "$root/services/$fn.err" && python3 -m json.tool "$root/services/$fn.json" >/dev/null 2>&1; then
              : > "$root/services/$fn-readable"
            fi
          done < "$root/services-to-read"
          # IDs are not printed. Candidate selection is metadata-only and may
          # be inconclusive when the secret was named without a provider label.
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'i66-greenapi-meta'
          names=[]
          if (root/'secrets-readable').exists():
              rows=json.loads((root/'secrets.json').read_text())
              for item in rows if isinstance(rows,list) else []:
                  name=str(item.get('name') or '').split('/')[-1]
                  if re.fullmatch(r'[A-Za-z0-9_-]{4,100}',name) and re.search(r'green[-_]?api|whatsapp|wa[-_]?green',name,re.I):
                      names.append(name)
          # Exact server-side Secret Manager references outrank guessed names;
          # parse only the reference URI, never a payload or token.
          for fn in ('orbit360GreenApiOutboxUpdated','orbit360GreenApiDeliveryStatus'):
              p=root/'functions'/f'{fn}.json'
              if not (root/'functions'/f'{fn}-readable').exists():continue
              data=json.loads(p.read_text())
              settings=(data.get('serviceConfig') or {}).get('environmentVariables') or {}
              ref=str(settings.get('ORBIT360_GREENAPI_GT_SECRET_VERSION') or '')
              match=re.fullmatch(r'projects/ays-orbit-360-lab/secrets/([A-Za-z0-9_-]{4,100})/versions/(?:latest|[0-9]+)',ref)
              if match:names.append(match.group(1))
          # Bounded metadata scan; never access `secrets versions access`.
          (root/'candidate-secrets').write_text('\n'.join(sorted(set(names))[:5])+'\n' if names else '')
          PY
          while IFS= read -r secret; do
            test -n "${secret:-}" || continue
            gcloud secrets versions list "$secret" --project "$PROJECT_ID" --format=json > "$root/versions/$secret.json" 2> "$root/versions/$secret.err" || true
          done < "$root/candidate-secrets"
      - name: Reduce results to fixed boolean-only report
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'i66-greenapi-meta'
          def obj(path):
              try: return json.loads(path.read_text())
              except (OSError,ValueError):return None
          names=['orbit360GreenApiOutboxUpdated','orbit360GreenApiDeliveryStatus']
          functions=[obj(root/'functions'/f'{n}.json') for n in names]
          services=[obj(root/'services'/f'{n}.json') for n in names]
          refname='ORBIT360_GREENAPI_GT_SECRET_VERSION'
          flagname='ORBIT360_GREENAPI_ENABLED'
          def env_from_function(item):
              return (item.get('serviceConfig') or {}).get('environmentVariables') or {} if isinstance(item,dict) else {}
          def env_from_service(item):
              if not isinstance(item,dict):return {}
              containers=(((item.get('spec') or {}).get('template') or {}).get('spec') or {}).get('containers') or []
              if not containers:
                  containers=(((item.get('template') or {}).get('containers')) or [])
              envs=containers[0].get('env') or [] if containers else []
              return {str(e.get('name')):e for e in envs if isinstance(e,dict)}
          cfg=[env_from_function(x) for x in functions]
          renv=[env_from_service(x) for x in services]
          ver_dir=root/'versions'
          enabled_versions=False
          for path in ver_dir.glob('*.json'):
              rows=obj(path)
              if isinstance(rows,list) and any(str(x.get('state') or '').upper()=='ENABLED' for x in rows if isinstance(x,dict)):
                  enabled_versions=True
          names_source=pathlib.Path('functions/greenapi-firebase-bridge.js').read_text()
          report={
            'projectCredentialMatched':True,
            'secretMetadataListReadable':(root/'secrets-readable').exists(),
            'greenApiSecretCandidatePresent':bool((root/'candidate-secrets').read_text().strip()),
            'namedCandidateHasEnabledVersion':enabled_versions,
            'functionsMetadataListReadable':(root/'functions-readable').exists(),
            'outboxFunctionDescribeReadable':(root/'functions'/f'{names[0]}-readable').exists(),
            'webhookFunctionDescribeReadable':(root/'functions'/f'{names[1]}-readable').exists(),
            'outboxCloudRunDescribeReadable':(root/'services'/f'{names[0]}-readable').exists(),
            'webhookCloudRunDescribeReadable':(root/'services'/f'{names[1]}-readable').exists(),
            'bothFunctionsHaveEnvEnabledFlag':all(x.get(flagname)=='true' for x in cfg),
            'bothFunctionsHaveSecretPathReference':all(bool(x.get(refname)) and str(x.get(refname)).startswith('projects/ays-orbit-360-lab/secrets/') for x in cfg),
            'bothCloudRunServicesExposeEnableFlagName':all(flagname in x for x in renv),
            'bothCloudRunServicesExposeSecretVersionName':all(refname in x for x in renv),
            'activeInstanceIdMatchesApprovedSource':"const INSTANCE = '710522720868'" in names_source,
            'operationsGroupMatchesApprovedSource':"operations: '120363420665870658@g.us'" in names_source,
            'paymentsGroupMatchesApprovedSource':"payments: '120363421316253378@g.us'" in names_source,
            'providerAuthorizedStateVerifiedNow':False,
            'providerGroupMembershipVerifiedNow':False,
            'secretPayloadRead':False,
            'whatsappMessagesSent':False,
            'cloudResourcesMutated':False,
          }
          if not all(type(v) is bool for v in report.values()):raise RuntimeError('NON_BOOLEAN_REPORT_BLOCKED')
          print('I66_GREENAPI_READONLY_METADATA='+json.dumps(report,sort_keys=True,separators=(',',':')))
          PY
      - name: Inspect exact webhook invocation policy and Preview existence without IAM writes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PYIAM'
          import json,subprocess,urllib.request,urllib.error,re
          project='ays-orbit-360-lab'
          targets=[('orbit360GreenApiDeliveryStatus','us-central1'),('orbit360GreenApiDeliveryStatusPreview','us-east1')]
          allowed_accounts={'orbit360-secrets-lab@ays-orbit-360-lab.iam.gserviceaccount.com'}
          token_result=subprocess.run(['gcloud','auth','print-access-token'],capture_output=True,text=True,timeout=30)
          if token_result.returncode or not token_result.stdout.strip():raise SystemExit('I66_GREENAPI_IAM_READONLY_EXISTING_CREDENTIAL_UNAVAILABLE')
          token=token_result.stdout.strip()
          rows=[]
          for name,region in targets:
              resource=f'projects/{project}/locations/{region}/functions/{name}'
              request=urllib.request.Request('https://cloudfunctions.googleapis.com/v2/'+resource,
                headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      status=response.status
                      payload=response.read(1048577)
                  if len(payload)>1048576:raise SystemExit('I66_GREENAPI_IAM_READONLY_METADATA_BOUND')
                  item=json.loads(payload)
              except urllib.error.HTTPError as error:
                  status=error.code;item=None
              except (urllib.error.URLError,TimeoutError,ValueError):
                  status=None;item=None
              row={'functionName':name,'region':region,'functionHttpStatus':status,
                'functionExists':status==200,'exactNotFound':status==404,'functionReadIndeterminate':status not in (200,404),
                'serviceAccount':'','serviceAccountAllowed':False,'exactServiceReferenceVerified':False,
                'iamPolicyReadable':False,'iamReadErrorClass':'NOT_ATTEMPTED',
                'publicRunInvoker':False,'allowedInvocationBindings':[],'unlistedPrincipalCount':0,'conditionalInvokerBindings':False}
              if status==200 and isinstance(item,dict):
                  if item.get('name')!=resource:raise SystemExit('I66_GREENAPI_IAM_READONLY_RESOURCE_IDENTITY_DRIFT')
                  config=item.get('serviceConfig') or {};account=str(config.get('serviceAccountEmail') or '')
                  row['serviceAccountAllowed']=account in allowed_accounts
                  row['serviceAccount']=account if account in allowed_accounts else ''
                  reference=str(config.get('service') or '');prefix=f'projects/{project}/locations/{region}/services/'
                  service=reference[len(prefix):] if reference.startswith(prefix) else ''
                  if re.fullmatch(r'[a-z][a-z0-9-]{1,62}',service):
                      row['exactServiceReferenceVerified']=True
                      result=subprocess.run(['gcloud','run','services','get-iam-policy',service,'--region',region,
                        '--project',project,'--format=json'],capture_output=True,text=True,timeout=45)
                      if result.returncode:
                          row['iamReadErrorClass']='PERMISSION_DENIED' if re.search(r'PERMISSION_DENIED|permission|forbidden',result.stderr,re.I) else 'UNREADABLE'
                      else:
                          try:policy=json.loads(result.stdout)
                          except ValueError:policy=None
                          if isinstance(policy,dict) and isinstance(policy.get('bindings',[]),list):
                              row['iamPolicyReadable']=True;row['iamReadErrorClass']='NONE'
                              for binding in policy.get('bindings',[]):
                                  if not isinstance(binding,dict) or binding.get('role')!='roles/run.invoker':continue
                                  condition=bool(binding.get('condition'));row['conditionalInvokerBindings']|=condition
                                  safe=[]
                                  for member in binding.get('members',[]):
                                      if member=='allUsers' or member in {'serviceAccount:'+a for a in allowed_accounts}:safe.append(member)
                                      else:row['unlistedPrincipalCount']+=1
                                  if 'allUsers' in safe and not condition:row['publicRunInvoker']=True
                                  if safe:row['allowedInvocationBindings'].append({'role':'roles/run.invoker','members':sorted(set(safe)),'conditional':condition})
                          else:row['iamReadErrorClass']='INVALID_RESPONSE'
              rows.append(row)
          report={'schema':'GI_I66_GREENAPI_EXACT_IAM_READONLY_V1','functions':rows,
            'requiredPreviewCreationPolicy':{'functionName':'orbit360GreenApiDeliveryStatusPreview','region':'us-east1',
              'role':'roles/run.invoker','member':'allUsers','resourceScope':'EXACT_NEW_HTTP_SERVICE_ONLY',
              'applicationAuthentication':['providerBearer','verifiedFirebaseIdToken','exactImmutableReleaseAuthority']},
            'secretPayloadRead':False,'iamWrites':0,'cloudResourcesMutated':False,'messagesSent':0}
          print('I66_GREENAPI_EXACT_IAM_READONLY='+json.dumps(report,sort_keys=True,separators=(',',':')))
          PYIAM
      - name: Verify exact GreenAPI runtime secret accessor binding without payload
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PYACCESS'
          import json,subprocess
          project='ays-orbit-360-lab'
          secret='orbit360-greenapi-gt-alianzas-soluciones'
          principal='serviceAccount:orbit360-secrets-lab@ays-orbit-360-lab.iam.gserviceaccount.com'
          def read(args):
              p=subprocess.run(args,capture_output=True,text=True,timeout=45)
              try:value=json.loads(p.stdout) if p.returncode==0 else None
              except ValueError:value=None
              return value if isinstance(value,dict) else None
          def binding(policy):
              rows=[b for b in (policy or {}).get('bindings',[]) if b.get('role')=='roles/secretmanager.secretAccessor' and principal in b.get('members',[])]
              return {'readable':policy is not None,'unconditionalAccessor':any(not b.get('condition') for b in rows),'conditionalAccessor':any(bool(b.get('condition')) for b in rows)}
          direct=binding(read(['gcloud','secrets','get-iam-policy',secret,'--project',project,'--format=json']))
          inherited=binding(read(['gcloud','projects','get-iam-policy',project,'--format=json'])) if not direct['unconditionalAccessor'] else {'readable':False,'notRequired':True,'unconditionalAccessor':False,'conditionalAccessor':False}
          granted=direct['unconditionalAccessor'] or inherited['unconditionalAccessor']
          report={'schema':'GI_I66_GREENAPI_EXACT_RUNTIME_SECRET_ACCESS_V1','secretResource':'projects/'+project+'/secrets/'+secret,
            'runtimeServiceAccount':principal.removeprefix('serviceAccount:'),'secretPolicy':direct,'projectPolicy':inherited,
            'access':'GRANTED_BY_EXACT_UNCONDITIONAL_ACCESSOR_BINDING' if granted else 'UNPROVEN_NOT_A_DENIAL',
            'permission':'secretmanager.versions.access','secretPayloadRead':False,'iamWrites':0,'secretWrites':0,'messagesSent':0}
          print('I66_GREENAPI_EXACT_RUNTIME_SECRET_ACCESS='+json.dumps(report,sort_keys=True,separators=(',',':')))
          PYACCESS
      - name: Troubleshoot exact GreenAPI runtime access without reading payload or granting IAM
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PYEXACT'
          import datetime,json,re,subprocess,urllib.request,urllib.error
          project='ays-orbit-360-lab'
          secret='orbit360-greenapi-gt-alianzas-soluciones'
          principal='orbit360-secrets-lab@ays-orbit-360-lab.iam.gserviceaccount.com'
          permission='secretmanager.versions.access'
          def command(args):
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=45)
                  return json.loads(p.stdout) if p.returncode==0 else None
              except (ValueError,subprocess.TimeoutExpired):return None
          def roles(policy):
              if not isinstance(policy,dict):return {'readable':False,'exactPrincipalRoles':[]}
              rows=[]
              for b in policy.get('bindings',[]):
                  if not isinstance(b,dict) or 'serviceAccount:'+principal not in b.get('members',[]):continue
                  role=b.get('role','')
                  if re.fullmatch(r'roles/[A-Za-z0-9_.]+|projects/ays-orbit-360-lab/roles/[A-Za-z0-9_.]+',role):
                      rows.append({'role':role,'conditional':bool(b.get('condition'))})
              return {'readable':True,'exactPrincipalRoles':rows}
          direct=roles(command(['gcloud','secrets','get-iam-policy',secret,'--project',project,'--format=json']))
          inherited=roles(command(['gcloud','projects','get-iam-policy',project,'--format=json']))
          metadata=command(['gcloud','projects','describe',project,'--format=json'])
          project_number=str((metadata or {}).get('projectNumber',''))
          project_ok=isinstance(metadata,dict) and metadata.get('projectId')==project and bool(re.fullmatch(r'[0-9]+',project_number))
          version_rows=command(['gcloud','secrets','versions','list',secret,'--project',project,'--limit=100','--format=json'])
          versions=[]
          if isinstance(version_rows,list) and len(version_rows)<100 and project_ok:
              for row in version_rows:
                  name=row.get('name','')
                  match=re.fullmatch(r'projects/('+re.escape(project)+'|'+re.escape(project_number)+')/secrets/'+re.escape(secret)+r'/versions/([1-9][0-9]*)',name)
                  if not match:versions=[];break
                  versions.append({'version':int(match.group(2)),'state':row.get('state') if row.get('state') in ('ENABLED','DISABLED','DESTROYED') else 'UNKNOWN'})
          inventory_complete=bool(versions) and len({v['version'] for v in versions})==len(versions)
          next_version=max(v['version'] for v in versions)+1 if inventory_complete else None
          token_result=subprocess.run(['gcloud','auth','print-access-token'],capture_output=True,text=True,timeout=30)
          token=token_result.stdout.strip() if token_result.returncode==0 else ''
          states={'CAN_ACCESS','CANNOT_ACCESS','UNKNOWN_INFO','UNKNOWN_CONDITIONAL','OVERALL_ACCESS_STATE_UNSPECIFIED'}
          def troubleshoot(suffix):
              safe_resource='projects/'+project+'/secrets/'+secret+suffix
              result={'resource':safe_resource,'state':'UNPROVEN','httpStatus':None,'tupleVerified':False}
              if not project_ok or not token:return result
              full='//secretmanager.googleapis.com/projects/'+project_number+'/secrets/'+secret+suffix
              query={'accessTuple':{'principal':principal,'fullResourceName':full,'permission':permission,
                'conditionContext':{'request':{'receiveTime':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')}}}}
              req=urllib.request.Request('https://policytroubleshooter.googleapis.com/v3/iam:troubleshoot',
                data=json.dumps(query).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      result['httpStatus']=response.status;answer=json.load(response)
                  t=answer.get('accessTuple',{})
                  result['tupleVerified']=t.get('principal')==principal and t.get('fullResourceName')==full and t.get('permission')==permission
                  if result['tupleVerified'] and answer.get('overallAccessState') in states:result['state']=answer['overallAccessState']
              except urllib.error.HTTPError as error:result['httpStatus']=error.code
              except (ValueError,TimeoutError,urllib.error.URLError):pass
              return result
          queries=[troubleshoot(''),troubleshoot('/versions/1')]
          if next_version:queries.append(troubleshoot('/versions/'+str(next_version)))
          def inbox_endpoint(name,region):
              row={'function':name,'expectedRegion':region,'exists':None,'httpStatus':None,'exactResourceAndRegion':False,'active':False}
              if not token:return row
              url='https://cloudfunctions.googleapis.com/v2/projects/'+project+'/locations/'+region+'/functions/'+name
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      row['httpStatus']=response.status;function=json.load(response)
                  allowed_names={'projects/'+project+'/locations/'+region+'/functions/'+name,
                    'projects/'+project_number+'/locations/'+region+'/functions/'+name}
                  row['exists']=True;row['exactResourceAndRegion']=function.get('name') in allowed_names
                  row['active']=function.get('state')=='ACTIVE'
              except urllib.error.HTTPError as error:
                  row['httpStatus']=error.code
                  if error.code==404:row['exists']=False
              except (ValueError,TimeoutError,urllib.error.URLError):pass
              return row
          inbox_inventory=[inbox_endpoint(name,region) for name,region in [
            ('orbit360GetAdvisorOpsInboxPreview','us-east1'),('orbit360UpdateAdvisorOpsInboxStatePreview','us-east1'),
            ('orbit360GetAdvisorOpsInbox','us-central1'),('orbit360UpdateAdvisorOpsInboxState','us-central1')]]
          report={'schema':'GI_I66_GREENAPI_RUNTIME_EFFECTIVE_ACCESS_READONLY_V1','runtimeServiceAccount':principal,
            'permission':permission,'secretPolicy':direct,'projectPolicy':inherited,'projectIdentityVerified':project_ok,
            'versions':versions,'versionInventoryComplete':inventory_complete,'nextVersionReference':
              'projects/'+project+'/secrets/'+secret+'/versions/'+str(next_version) if next_version else None,
            'troubleshooter':queries,'existingInboxEndpoints':inbox_inventory,'secretPayloadRead':False,'secretWrites':0,'iamWrites':0,'messagesSent':0}
          print('I66_GREENAPI_RUNTIME_EFFECTIVE_ACCESS='+json.dumps(report,sort_keys=True,separators=(',',':')))
          PYEXACT
      - name: Publish approved non-secret resource references only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PYMETA'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'i66-greenapi-meta'
          project='ays-orbit-360-lab'
          names=['orbit360GreenApiOutboxUpdated','orbit360GreenApiDeliveryStatus']
          def obj(path):
              try:return json.loads(path.read_text())
              except (OSError,ValueError):return None
