name: CotComp S4.80 LAB dropdown UX preview

on:
  push:
    branches:
      - ays/cotcomp-s480-dropdown-ux-preview-lab-20261003
    paths:
      - '.github/cotcomp-lab-intents/s480-dropdown-ux-preview-lab-authorized.json'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_FUNCTION: cotcompVehicleDropdownPreviewS480
  COTCOMP_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompVehicleDropdownPreviewS480

jobs:
  s480-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.80 deployment intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s480-dropdown-ux-preview-lab-authorized.json
          jq -e '
            .authorization=="S480_DEPLOY_ZERO_PERSISTENCE_DROPDOWN_PREVIEW" and
            .projectId=="ays-orbit-360-lab" and
            .tenantId=="alianzas-soluciones" and
            .functionName=="cotcompVehicleDropdownPreviewS480" and
            .catalogFunctionName=="cotcompVehicleCatalogS479" and
            .appDataReads==false and
            .appDataWrites==false and
            .piiFields==false and
            .quoteCaseWrites==false and
            .providerOrRater==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.80 safeguards
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-vehicle-dropdown-preview-s480.js
          node --check cotcomp-vehicle-dropdown-preview-s480.test.js
          node --test cotcomp-vehicle-dropdown-preview-s480.test.js

      - name: Prepare exact LAB deployment credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s480/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s480/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S4.80 preview function to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$COTCOMP_FUNCTION" --project "$COTCOMP_PROJECT_ID" --non-interactive --force

      - name: Physically verify preview page and zero-persistence boundary
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/s480/evidence"
          CODE="$(curl -sS -o "$E/page.html" -w '%{http_code}' "$COTCOMP_URL")"
          test "$CODE" = "200"
          grep -q 'Vista previa del selector vehicular' "$E/page.html"
          grep -q 'id="vehicleClass"' "$E/page.html"
          grep -q 'id="brand"' "$E/page.html"
          grep -q 'id="model"' "$E/page.html"
          grep -q 'id="year"' "$E/page.html"
          grep -q 'Buscar marca' "$E/page.html"
          grep -q 'Buscar línea / modelo' "$E/page.html"
          grep -q '/cotcompVehicleCatalogS479' "$E/page.html"
          grep -q 'No encuentro mi vehículo' "$E/page.html"
          grep -q 'no guarda información' "$E/page.html"
          ! grep -q 'WhatsApp' "$E/page.html"
          ! grep -q 'Correo electrónico' "$E/page.html"
          ! grep -q 'requestManagement' "$E/page.html"
          POST_CODE="$(curl -sS -o "$E/post.txt" -w '%{http_code}' -X POST "$COTCOMP_URL")"
          test "$POST_CODE" = "405"

          CATALOG_URL='https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompVehicleCatalogS479'
          curl -fsS "$CATALOG_URL?op=brands&vehicleClass=AUTO_LIGHT&q=TOYOTA&limit=20" -o "$E/brands.json"
          BRAND_ID="$(jq -r '.items[] | select(.label=="TOYOTA") | .brandId' "$E/brands.json" | head -n1)"
          test -n "$BRAND_ID"
          curl -fsS --get "$CATALOG_URL" --data-urlencode "op=models" --data-urlencode "vehicleClass=AUTO_LIGHT" --data-urlencode "brandId=$BRAND_ID" --data-urlencode "q=COROLLA" --data-urlencode "limit=100" -o "$E/models.json"
          jq -e '.items | any(.label=="COROLLA")' "$E/models.json" >/dev/null
          curl -fsS "$CATALOG_URL?op=years" -o "$E/years.json"
          jq -e '.items|index(2006)!=null' "$E/years.json" >/dev/null

          jq -n --arg url "$COTCOMP_URL" '{
            schemaVersion:"ays-cotcomp-s480-preview-physical-receipt-v1.0",
            functionUrl:$url,
            deployed:true,
            pageGetPass:true,
            vehicleClassSelectPresent:true,
            brandSearchPresent:true,
            brandSelectPresent:true,
            dependentModelSearchPresent:true,
            modelSelectPresent:true,
            yearSelectPresent:true,
            missingVehicleFallbackPresent:true,
            piiFieldsPresent:false,
            quoteSubmissionPresent:false,
            postRejected:true,
            supportingCatalogToyotaCorolla2006Pass:true,
            appDataReads:0,
            appDataWrites:0,
            quoteCaseWrites:0,
            providerOrRaterCalls:0,
            productionTouched:false
          }' > "$E/S480_PREVIEW_PHYSICAL_RECEIPT.json"

      - name: Upload sanitized S4.80 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s480-dropdown-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s480/evidence/S480_PREVIEW_PHYSICAL_RECEIPT.json
            ${{ runner.temp }}/s480/evidence/page.html
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s480/firebase-service-account.json"
