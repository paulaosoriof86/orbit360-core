name: Orbit 360 · M5 Hosting control-plane redesign 5.0.31
run-name: M5 5.0.31 · immutable package input + append-only evidence · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-hosting-control-plane-531-v20260729.yml'

permissions:
  contents: read
  statuses: write

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  static_redesign:
    name: M5 · Hosting control-plane stability fixture · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar rama y ejecución única
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Ejecutar preflight canónico 5.0.31
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-hosting-control-plane-531-v20260729.mjs
          node --check tools/orbit360-m5-hosting-control-plane-contract-531-v20260729.mjs
          node --check tools/orbit360-m5-hosting-control-plane-fixture-531-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_HOSTING_CONTROL_PLANE_531_STATIC_PASS" and .contractVersion=="5.0.31" and .executionPhase=="M5_VALIDATOR_REDESIGN_STATIC" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .releaseCandidateHash=="4bf3c8025654f43f6e4af20e5d16115bdc0851352ccddc6f099649405883cf3b" and .criticalAssets==43 and .remoteAssetsExpected==26 and .knownRemoteAssetsMatched==24 and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .secretsRead==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .hostingAuthorizationRequiredAfterPass==true' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          jq -e '.ok==true and .status=="M5_HOSTING_CONTROL_PLANE_531_FIXTURE_PASS" and .failed==0 and .packageInputImmutable==true and .evidenceLedgerSeparate==true and .packageResultStableAfterEvidence==true and .candidateHash=="4bf3c8025654f43f6e4af20e5d16115bdc0851352ccddc6f099649405883cf3b" and .criticalAssets==43 and .remoteAssetsExpected==26 and .secrets==false and .firestoreRead==false and .writes==false and .runtime==false and .browser==false and .deploy==false' "$ORBIT360_EVIDENCE_DIR/m5-hosting-control-plane-fixture-531-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-hosting-control-plane-531-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-hosting-control-plane-fixture-531-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.31 static redesign failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(s.status==='M5_HOSTING_CONTROL_PLANE_531_STATIC_PASS'&&s.failed===0){state='success';description='M5 Hosting control-plane 5.0.31 static PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-hosting-control-plane-531',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
