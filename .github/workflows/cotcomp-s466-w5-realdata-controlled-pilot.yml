name: CotComp S4.66 W5 LAB controlled real-data pilot

on:
  push:
    branches:
      - ays/cotcomp-s466-w5-realdata-controlled-pilot-20261001
    paths:
      - '.github/cotcomp-lab-intents/s466-w5-realdata-authorized.json'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_TENANT_ID: alianzas-soluciones

jobs:
  s466-w5-realdata-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.66 Owner authorization intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s466-w5-realdata-authorized.json
          jq -e '
            .authorization=="S466_W5_LAB_REALDATA_CONTROLLED_PILOT" and
            .projectId=="ays-orbit-360-lab" and
            .tenantId=="alianzas-soluciones" and
            .country=="GT" and
            .journeyId=="GT_AUTO_MOTO_HYBRID" and
            .allowedStages==["W1","W2","W3","W4"] and
            .maxQuoteCases==1 and
            .maxDataSubjects==1 and
            .maxExistingRecords==8 and
            .allowedExecutions==1 and
            .successDisposition=="ROLLBACK_TO_BEFORE_STATE" and
            .healthSensitiveData==false and
            .providerOrRaterCalls==false and
            .production==false and
            .issuance==false and
            .binding==false and
            .payment==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.66 safeguards
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-w5-realdata-pilot-s466.js
          node --check cotcomp-w5-realdata-pilot-s466.test.js
          node --test cotcomp-w5-realdata-pilot-s466.test.js

      - name: Prepare exact LAB credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s466/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s466/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$COTCOMP_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Execute authorized W5 controlled pilot
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          export S466_PROOF_RUN_ID="s466-$GITHUB_RUN_ID"
          node cotcomp-w5-realdata-pilot-s466.js > "$RUNNER_TEMP/s466/evidence/S466_W5_REALDATA_PILOT_RECEIPT.json"
          R="$RUNNER_TEMP/s466/evidence/S466_W5_REALDATA_PILOT_RECEIPT.json"

          OUTCOME="$(jq -r '.outcome' "$R")"
          if [ "$OUTCOME" = "PASS" ]; then
            jq -e '
              .pilotExecuted==true and
              .discovery.recordsScanned<=8 and
              .discovery.selectedRealRecordsTouched==1 and
              (.commitments.caseSelectorSha256|test("^[a-f0-9]{64}$")) and
              (.commitments.actorSelectorSha256|test("^[a-f0-9]{64}$")) and
              (.commitments.consentEvidenceSha256|test("^[a-f0-9]{64}$")) and
              .w1.realQuoteCaseValidated==true and .w1.writes==0 and
              .w2.coreProjectionWrites==2 and .w2.readback==true and
              .w2.providerOutboxCreated==false and .w2.providerDeliveryExecuted==false and
              .w3.v1Writes==2 and .w3.v1RetryWrites==0 and .w3.v1ConflictDenied==true and
              .w3.v2Writes==3 and .w3.v2RetryWrites==0 and .w3.v2ConflictDenied==true and
              .w3.v1Superseded==true and .w3.v2ValidatedCurrent==true and .w3.providerOrRaterCalls==0 and
              .w4.comparisonSetWrites==1 and
              .w4.explicitUserChoiceEvidencePresent==false and
              .w4.selectionPersistenceBlocked==true and
              .w4.blockCode=="EXPLICIT_USER_CHOICE_REQUIRED" and
              .w4.selectionWrites==0 and .w4.realQuoteCasePatched==false and
              .rollback.disposition=="ROLLBACK_TO_BEFORE_STATE" and
              .rollback.deletes==7 and
              .rollback.realCaseRestoreWriteRequired==false and
              .rollback.realCaseFinalDigestMatches==true and
              .rollback.pilotDocumentsFinalAbsent==true and
              .writeAccounting.realRecordWrites==0 and
              .writeAccounting.rollbackRealRecordWrites==0 and
              .writeAccounting.netPilotDocuments==0 and
              .boundaries.realDataRead==true and
              .boundaries.realDataWrite==false and
              .boundaries.realDataSubjectsTouched==1 and
              .boundaries.existingRealRecordsTouched==1 and
              .boundaries.productionTouched==false and
              .boundaries.providerOrRaterCallsExecuted==0 and
              .boundaries.issuanceExecuted==false and
              .boundaries.bindingExecuted==false and
              .boundaries.paymentExecuted==false and
              .boundaries.healthSensitiveDataTouched==false and
              .boundaries.rawPiiEmittedInReceipt==false
            ' "$R" >/dev/null
          elif [ "$OUTCOME" = "BLOCKED_NO_ELIGIBLE_REAL_CASE" ]; then
            jq -e '
              .pilotExecuted==false and
              .discovery.recordsScanned<=8 and
              .discovery.eligibleCount==0 and
              .writeAccounting.totalMutations==0 and
              .boundaries.realDataRead==true and
              .boundaries.realDataWrite==false and
              .boundaries.productionTouched==false and
              .boundaries.providerOrRaterCallsExecuted==0
            ' "$R" >/dev/null
          else
            echo "Unexpected S4.66 outcome" >&2
            exit 1
          fi

      - name: Upload sanitized S4.66 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s466-w5-realdata-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/s466/evidence/S466_W5_REALDATA_PILOT_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s466/firebase-service-account.json"
