name: Orbit360 sourcecheck v25 differential universe diagnosis

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703

permissions:
  contents: read

jobs:
  source-v25-differential-universe:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'ays/source-v25-differential-universe-diagnosis-20260807'
    env:
      ORBIT360_V25_REQUEST_FILE: .github/orbit360-requests/block1-client360-insurers-v25-diagnostic-authorization.json
      ORBIT360_V25_PREFLIGHT_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v25-block1-diagnostic-preflight-sanitized-v20260807.json
    steps:
      - name: Checkout exact v25 source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorized base and frozen product control plane
        shell: bash
        run: |
          set -euo pipefail
          BASE='4d8c3f77588853a0abed512c0f19e7efb266d56a'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.sha }}' = "$BASE"
          git merge-base --is-ancestor "$BASE" "$HEAD_SHA"
          frozen=(
            'tools/orbit360-validar-gate-contracts-v20260717.mjs'
            'tools/orbit360-validar-gate-contracts-engine-block1-v23-native-v20260807.mjs'
            'tools/orbit360-gate-contract-block1-v23-native-v20260807.json'
            'tools/orbit360-validator-lifecycle-block1-v23-native-v20260807.json'
            'tools/orbit360-preflight-block1-v23-native-v20260807.mjs'
            'tools/orbit360-canonical-preflight-evidence-handoff-v24.mjs'
            'tools/orbit360-block1-native-matrix-v23-v20260807.mjs'
            'tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs'
            'tools/orbit360-event-driven-render-observer-v23.mjs'
            'tools/orbit360-adjudicate-block1-universe-readonly-v23-v20260807.mjs'
            'orbit360-platform/modules/cliente360.js'
            'orbit360-platform/modules/aseguradoras.js'
            'orbit360-platform/modules/polizas.js'
            'orbit360-platform/modules/cobros.js'
            'orbit360-platform/sw.js'
            'orbit360-platform/core/pwa.js'
            'orbit360-platform/data/store.js'
            'orbit360-platform/core/auth.js'
            'orbit360-platform/core/importa.js'
            'orbit360-platform/firestore.rules'
          )
          for p in "${frozen[@]}"; do git diff --quiet "$BASE"..."$HEAD_SHA" -- "$p" || { echo "STOP_V25_FROZEN_CHANGED:$p"; exit 41; }; done
          echo PASS_V25_PRODUCT_OWNER_MATRIX_OBSERVER_BACKEND_FROZEN

      - name: Validate exact diagnostic package source-only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$ORBIT360_V25_REQUEST_FILE"
          node --check tools/orbit360-diagnose-block1-universe-differential-v25-v20260807.mjs
          node --check tools/orbit360-test-block1-universe-differential-v25-source-v20260807.mjs
          node --check tools/orbit360-preflight-block1-universe-diagnostic-v25-v20260807.mjs
          node tools/orbit360-test-block1-universe-differential-v25-source-v20260807.mjs
          node tools/orbit360-preflight-block1-universe-diagnostic-v25-v20260807.mjs source

      - name: Prove diagnostic is read-only and scoped
        shell: bash
        run: |
          set -euo pipefail
          f=tools/orbit360-diagnose-block1-universe-differential-v25-v20260807.mjs
          ! grep -Eq '\.(set|update|delete|create)\(' "$f"
          ! grep -Eq 'batch\(|runTransaction|bulkWriter|auth\(\)' "$f"
          grep -Fq "canonicalRef(db, 'clientes')" "$f"
          grep -Fq "canonicalRef(db, 'aseguradoras')" "$f"
          grep -Fq "legacyRef(db, 'asesores')" "$f"
          grep -Fq 'firestoreWrites: 0' "$f"
          grep -Fq 'authReads: 0' "$f"
          grep -Fq 'hostingTouched: false' "$f"
          echo PASS_V25_DIAGNOSTIC_READONLY_THREE_COLLECTIONS_ONLY

      - name: Verify only v25 control-plane files changed
        shell: bash
        run: |
          set -euo pipefail
          BASE='4d8c3f77588853a0abed512c0f19e7efb266d56a'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          allowed='^(tools/orbit360-diagnose-block1-universe-differential-v25-v20260807\.mjs|tools/orbit360-test-block1-universe-differential-v25-source-v20260807\.mjs|tools/orbit360-validator-lifecycle-block1-universe-diagnostic-v25-v20260807\.json|tools/orbit360-preflight-block1-universe-diagnostic-v25-v20260807\.mjs|tools/orbit360-close-block1-universe-diagnostic-v25-v20260807\.mjs|\.github/workflows/orbit360-sourcecheck-v25-differential-universe-diagnosis-v20260807\.yml|\.github/workflows/orbit360-registered-relay-v25-differential-universe-diagnosis-v20260807\.yml|orbit360-platform/docs/CIERRE-V25-DIAGNOSTICO-UNIVERSO-DIFERENCIAL-20260807\.md|orbit360-platform/docs/ACADEMIA-ACTUALIZACION-V25-DIAGNOSTICO-UNIVERSO-20260807\.md|orbit360-platform/docs/CLAUDE-ACUMULADO-V25-DIAGNOSTICO-UNIVERSO-20260807\.md|orbit360-platform/runtime-gate-crm-v20260716/v25-block1-source-sanitized-v20260807\.json)$'
          while IFS= read -r p; do [[ "$p" =~ $allowed ]] || { echo "STOP_V25_UNAUTHORIZED_SOURCE_CHANGE:$p"; exit 41; }; done < <(git diff --name-only "$BASE"..."$HEAD_SHA")
          echo PASS_V25_SOURCE_SCOPE_EXACT

      - name: Assert source boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$ORBIT360_V25_REQUEST_FILE"
          echo PASS_V25_SOURCE_NO_SECRETS_FIREBASE_HOSTING_BROWSER_WRITES
