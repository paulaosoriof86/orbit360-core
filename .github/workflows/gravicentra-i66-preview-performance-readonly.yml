# I6.6: measure the existing immutable Preview artifact with real Chrome and Carlos's existing Operativo role.
# Read-only QA. Never applies payments, updates portfolio, or sends notifications.
name: Gravicentra I6.6 PREVIEW Performance READ ONLY
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-preview-performance-readonly.yml
      - tools/gravicentra-i66-live-performance-readonly.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gi-i66-preview-performance-readonly
  cancel-in-progress: false

jobs:
  exact-preview-chrome-perf:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GI_I66_PERF_PROJECT: ays-orbit-360-lab
      GI_I66_PERF_TENANT: alianzas-soluciones
      GI_I66_PERF_ORIGIN: https://ays-orbit-360-lab--gi-i66-rc-43116689585-17au0dhv.web.app
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exact source and prove read-only boundary
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard immutable PREVIEW build and zero business writes
        run: |
          set -euo pipefail
          node --check tools/gravicentra-i66-live-performance-readonly.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('tools/gravicentra-i66-live-performance-readonly.mjs','utf8');
          for(const re of [/\.set\s*\(/,/\.update\s*\(/,/\.delete\s*\(/,/\.runTransaction\s*\(/,/\.setCustomUserClaims\s*\(/,/\.createUser\s*\(/])
            if(re.test(s))throw Error('I66_PREVIEW_PERF_WRITE_PATH_DENIED');
          if(!s.includes('I66_PERF_ORIGIN_NOT_APPROVED')||!s.includes('firestoreWrites:0,businessActions:0,paymentActions:0'))
            throw Error('I66_PREVIEW_PERF_SCOPE_DRIFT');
          console.log('I66_PREVIEW_PERF_READ_ONLY_BOUNDARY_PASS');
          NODE
          curl -fsSL --max-time 25 "$GI_I66_PERF_ORIGIN/__recovery__/build.json" > "$RUNNER_TEMP/i66-preview-exact-build.json"
          node - <<'NODE'
          const b=require(process.env.RUNNER_TEMP+'/i66-preview-exact-build.json');
          if(b.sourceSha!=='1833a08efb9409478e46cd65e9c887122456d0be'||
             b.gate!=='I6.6'||!String(b.buildId||'').startsWith('gi-i66-1833a08efb94-'))
            throw Error('I66_PREVIEW_PERF_CERTIFIED_ARTIFACT_DRIFT');
          console.log('I66_PREVIEW_PERF_EXACT_ARTIFACT_PASS');
          NODE
      - name: Select existing Firebase account without disclosing credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-preview-perf-auth"
          chmod 700 "$RUNNER_TEMP/gi-i66-preview-perf-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-preview-perf-auth'
          for key in ('SA_LAB','SA_LAB_ALT','SA_DEFAULT'):
            try:v=json.loads(os.environ.get(key,''))
            except (TypeError,ValueError):continue
            if v.get('type')!='service_account' or v.get('project_id')!='ays-orbit-360-lab' or not v.get('private_key'):continue
            file=root/'existing.json';file.write_text(json.dumps(v));file.chmod(0o600)
            with open(os.environ['GITHUB_ENV'],'a') as out:out.write('GOOGLE_APPLICATION_CREDENTIALS='+str(file)+'\n')
            print('I66_PREVIEW_PERF_EXISTING_ACCOUNT_PASS');break
          else:raise SystemExit('I66_PREVIEW_PERF_EXISTING_ACCOUNT_HOLD')
          PY
      - name: Install pinned Chromium and read-only Admin dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Measure every authorized module in exact PREVIEW
        env:
          GI_I66_PERF_REPORT: ${{ runner.temp }}/gi-i66-preview-perf-summary.json
        run: |
          set -euo pipefail
          node tools/gravicentra-i66-live-performance-readonly.mjs
      - name: Preserve aggregate performance evidence without personal identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-preview-performance-readonly
          path: ${{ runner.temp }}/gi-i66-preview-perf-summary.json
          if-no-files-found: ignore
          retention-days: 3
