name: CotComp S5.05 Public Inbound LAB Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s505-public-inbound-lab-candidate-20261006
    paths:
      - 'functions/ops-leads-domain.js'
      - 'functions/cotcomp-public-inbound-lab-s505.js'
      - 'functions/cotcomp-public-inbound-lab-s505.test.js'
      - 'functions/cotcomp-public-inbound-lab-s505-fixture.js'
      - 'functions/cotcomp-public-inbound-lab-s505-fixture.test.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/cotcomp-s505-public-inbound-lab-candidate.yml'

permissions:
  contents: read
  actions: read

env:
  GCLOUD_PROJECT: ays-orbit-360-lab
  S505_FUNCTION: cotcompPublicInboundS505
  S505_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompPublicInboundS505
  S505_PROOF_RUN_ID: s505-${{ github.run_id }}
  S505_IDEMPOTENCY_KEY: idem-${{ github.run_id }}

jobs:
  public-inbound-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions dependencies
        working-directory: functions
        shell: bash
        run: npm ci

      - name: Static and unit QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node --check ops-leads-domain.js
          node --check cotcomp-public-inbound-lab-s505.js
          node --check cotcomp-public-inbound-lab-s505-fixture.js
          node --test cotcomp-public-inbound-lab-s505.test.js
          node --test cotcomp-public-inbound-lab-s505-fixture.test.js
          grep -q "PROJECT_ID='ays-orbit-360-lab'" cotcomp-public-inbound-lab-s505.js
          grep -q "TENANT_ID='alianzas-soluciones'" cotcomp-public-inbound-lab-s505.js
          grep -q "body.synthetic!==true" cotcomp-public-inbound-lab-s505.js

      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s505/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s505/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "ays-orbit-360-lab"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

          TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$TOKEN"
          echo "S505_PROOF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S5.05 endpoint to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$S505_FUNCTION" --project "$GCLOUD_PROJECT" --non-interactive --force

      - name: Setup synthetic one-time permit
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node cotcomp-public-inbound-lab-s505-fixture.js setup | tee "$RUNNER_TEMP/s505/evidence/setup.json"

      - name: First synthetic public submission
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(printf '{"synthetic":true,"proofRunId":"%s","idempotencyKey":"%s","country":"GT","needFamily":"vehicle"}' "$S505_PROOF_RUN_ID" "$S505_IDEMPOTENCY_KEY")"
          CODE="$(curl -sS -o "$RUNNER_TEMP/s505/evidence/first.json" -w '%{http_code}'             -X POST "$S505_URL"             -H 'Origin: https://aysseguros.com'             -H 'Content-Type: application/json'             -H "X-Ays-Proof-Token: $S505_PROOF_TOKEN"             --data "$BODY")"
          test "$CODE" = "200"
          node - "$RUNNER_TEMP/s505/evidence/first.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.ok!==true||r.registered!==true||r.synthetic!==true||r.reused!==false)process.exit(1);
          if(r.productionTouched!==false)process.exit(1);
          NODE
          FIRST="$(cat "$RUNNER_TEMP/s505/evidence/first.json")"
          echo "S505_FIRST_JSON<<EOF" >> "$GITHUB_ENV"
          echo "$FIRST" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Exact retry must reuse
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(printf '{"synthetic":true,"proofRunId":"%s","idempotencyKey":"%s","country":"GT","needFamily":"vehicle"}' "$S505_PROOF_RUN_ID" "$S505_IDEMPOTENCY_KEY")"
          CODE="$(curl -sS -o "$RUNNER_TEMP/s505/evidence/retry.json" -w '%{http_code}'             -X POST "$S505_URL"             -H 'Origin: https://aysseguros.com'             -H 'Content-Type: application/json'             -H "X-Ays-Proof-Token: $S505_PROOF_TOKEN"             --data "$BODY")"
          test "$CODE" = "200"
          node - "$RUNNER_TEMP/s505/evidence/first.json" "$RUNNER_TEMP/s505/evidence/retry.json" <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const b=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(b.reused!==true)process.exit(1);
          for(const k of ['entityId','requestId','eventId','advisorId'])if(a[k]!==b[k])process.exit(1);
          NODE

      - name: Changed payload with same request identity must fail
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(printf '{"synthetic":true,"proofRunId":"%s","idempotencyKey":"%s","country":"GT","needFamily":"home"}' "$S505_PROOF_RUN_ID" "$S505_IDEMPOTENCY_KEY")"
          CODE="$(curl -sS -o "$RUNNER_TEMP/s505/evidence/conflict.json" -w '%{http_code}'             -X POST "$S505_URL"             -H 'Origin: https://aysseguros.com'             -H 'Content-Type: application/json'             -H "X-Ays-Proof-Token: $S505_PROOF_TOKEN"             --data "$BODY")"
          test "$CODE" = "409"

      - name: Origin and synthetic-only gates
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(printf '{"synthetic":true,"proofRunId":"%s","idempotencyKey":"idem-origin-%s","country":"GT","needFamily":"vehicle"}' "$S505_PROOF_RUN_ID" "$GITHUB_RUN_ID")"
          BAD_ORIGIN="$(curl -sS -o "$RUNNER_TEMP/s505/evidence/bad-origin.json" -w '%{http_code}'             -X POST "$S505_URL"             -H 'Origin: https://example.com'             -H 'Content-Type: application/json'             -H "X-Ays-Proof-Token: $S505_PROOF_TOKEN"             --data "$BODY")"
          test "$BAD_ORIGIN" = "403"

          REAL_BODY='{"synthetic":false,"country":"GT","needFamily":"vehicle"}'
          REAL_CODE="$(curl -sS -o "$RUNNER_TEMP/s505/evidence/real-denied.json" -w '%{http_code}'             -X POST "$S505_URL"             -H 'Origin: https://aysseguros.com'             -H 'Content-Type: application/json'             -H "X-Ays-Proof-Token: $S505_PROOF_TOKEN"             --data "$REAL_BODY")"
          test "$REAL_CODE" = "403"

      - name: Physical Firestore readback
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node cotcomp-public-inbound-lab-s505-fixture.js verify | tee "$RUNNER_TEMP/s505/evidence/readback.json"

      - name: Cleanup synthetic evidence
        if: always()
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node cotcomp-public-inbound-lab-s505-fixture.js cleanup | tee "$RUNNER_TEMP/s505/evidence/cleanup.json"

      - name: Build receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/s505/evidence" <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=process.argv[2];
          const read=n=>{try{return JSON.parse(fs.readFileSync(path.join(dir,n),'utf8'));}catch(e){return null;}};
          const first=read('first.json'),retry=read('retry.json'),cleanup=read('cleanup.json'),readback=read('readback.json');
          const out={
            schemaVersion:'ays-cotcomp-s505-public-inbound-lab-receipt-v1.0',
            projectId:'ays-orbit-360-lab',
            tenantId:'alianzas-soluciones',
            proofRunId:process.env.S505_PROOF_RUN_ID,
            syntheticOnly:true,
            endpointDeployedToLab:true,
            first:first&&first.ok===true&&first.registered===true,
            retryReused:retry&&retry.reused===true,
            readback:readback&&readback.readback===true,
            cleanup:cleanup&&cleanup.result&&cleanup.result.finalAbsence===true,
            productionTouched:false,
            realCustomerDataUsed:false,
            realCustomerSubmissionAllowed:false
          };
          fs.writeFileSync(path.join(dir,'S505_PUBLIC_INBOUND_LAB_RECEIPT.json'),JSON.stringify(out,null,2));
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s505-public-inbound-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s505/evidence/S505_PUBLIC_INBOUND_LAB_RECEIPT.json
            ${{ runner.temp }}/s505/evidence/first.json
            ${{ runner.temp }}/s505/evidence/retry.json
            ${{ runner.temp }}/s505/evidence/conflict.json
            ${{ runner.temp }}/s505/evidence/bad-origin.json
            ${{ runner.temp }}/s505/evidence/real-denied.json
            ${{ runner.temp }}/s505/evidence/readback.json
            ${{ runner.temp }}/s505/evidence/cleanup.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s505/firebase-service-account.json"
