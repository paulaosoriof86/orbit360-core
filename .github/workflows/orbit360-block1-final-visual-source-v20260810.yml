name: Orbit360 Block1 final native visual source-only v7 late-ready
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-block1-final-visual-source-v20260810.yml'
      - '.github/workflows/orbit360-block1-final-visual-runtime-bootstrap-segmented-v20260811.yml'
      - 'tools/orbit360-validator-lifecycle-block1-final-visual-runtime-v20260810.json'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-final-visual-v20260810.mjs'
      - 'tools/orbit360-run-block1-final-visual-after-universe-v20260810.sh'
      - 'tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs'
      - 'tools/orbit360-block1-final-native-matrix-v20260811.mjs'
      - 'tools/fixtures/orbit360-block1-visual-antibucle-fixture-v20260811.mjs'
      - 'tools/fixtures/orbit360-block1-final-visual-request-fixture-v20260810.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-block1-final-native-visual-source-v20260810
  cancel-in-progress: false
env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  SOURCE_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/block1-final-visual-source-sanitized-v20260810.json
  FUTURE_REQUEST: .github/orbit360-requests/block1-final-visual-late-ready-recovery-v20260811-authorization.json
jobs:
  source:
    if: "${{ github.event.head_commit.message != 'docs: persist Block1 late-ready source v7 closure' }}"
    name: Block1 · late-ready recovery · source-only anti-loop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical Block1 gate before package validation
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .failed==0 and .executionAuthorized==false and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Require release universe and absent future request
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$FUTURE_REQUEST"
          jq -e '.decision=="RELEASE_UNIVERSE_ACCEPTED_WITH_2_CLIENT_PROVENANCE_EXCEPTIONS" and .classification=="PASS_BLOCK1_RELEASE_UNIVERSE_WITH_CONTROLLED_EXCEPTIONS" and .observed.clientes.raw==430 and .observed.clientes.baselineContract==414 and .observed.clientes.retained26Deferred==14 and .observed.clientes.controlledProvenanceExceptions==2 and .observed.aseguradoras.effective==26 and .observed.asesores.count==7 and .releaseEligible==true and .visualEligible==true and .firestoreWrites==0 and .ok==true' "$EVIDENCE_DIR/block1-release-universe-exception-sanitized-v20260810.json" >/dev/null
      - name: Validate late-ready rootfix package
        id: rootfix
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/orbit360-run-block1-final-visual-after-universe-v20260810.sh
          node --check tools/orbit360-validar-gate-contracts-engine-block1-final-visual-v20260810.mjs
          node --check tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs
          node --check tools/orbit360-block1-final-native-matrix-v20260811.mjs
          node --check tools/orbit360-event-driven-render-observer-v23.mjs
          node --check tools/orbit360-visual-runtime-rootfix-browser-precheck-v20260805.mjs
          node --check tools/fixtures/orbit360-block1-visual-antibucle-fixture-v20260811.mjs
          node tools/fixtures/orbit360-block1-visual-antibucle-fixture-v20260811.mjs > "$RUNNER_TEMP/antibucle.json"
          jq -e '.status=="PASS_BLOCK1_VISUAL_ANTIBUCLE_SYNTHETIC_V20260811" and .firebaseSdkWithoutDefaultAppBlocked==true and .firebaseDefaultAppAuthReady==true and .lateReadySyntheticPass==true and .routerLateReadyRecovered==true and .routerUnreadyBlocked==true and .clientDetailLateReadyRecovered==true and .clientRouteLateReadyRecovered==true and .clientRouteWrongParamBlocked==true and .ok==true and .runtime==false and .firebase==false and .hosting==false and .writes==0' "$RUNNER_TEMP/antibucle.json" >/dev/null
          ORBIT360_MATRIX_ARTIFACT_VALIDATE_ONLY=1 node tools/orbit360-block1-final-native-matrix-v20260811.mjs > "$RUNNER_TEMP/implementation-import.json"
          jq -e '.status=="PASS_BLOCK1_FINAL_NATIVE_MATRIX_IMPORT" and .classification=="SOURCE_ARTIFACT_VALIDATED" and .bootstrapSyntheticPass==true and .firebaseSdkWithoutDefaultAppBlocked==true and .firebaseDefaultAppAuthReady==true and .lateReadySyntheticPass==true and .routerLateReadyRecovered==true and .routerUnreadyBlocked==true and .clientDetailLateReadyRecovered==true and .clientRouteLateReadyRecovered==true and .clientRouteWrongParamBlocked==true and .sourceContract.routerReadinessOwner=="post-timeout-canonical-state-recheck-with-owner-diagnostics" and .sourceContract.clientLateReadyOwner=="post-timeout-canonical-state-recovery" and .sourceContract.validatorFailClosedOwner=="late-ready-recovered-owner-specific-failure-only" and .externalRuntimeDependenciesLoaded==false and .firebaseAccess==false and .browserExecuted==false and .hostingTouched==false and .writes==0 and .ok==true' "$RUNNER_TEMP/implementation-import.json" >/dev/null
          ORBIT360_MATRIX_ARTIFACT_VALIDATE_ONLY=1 node tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs > "$RUNNER_TEMP/matrix-import.json"
          jq -e '.status=="PASS_V23_NATIVE_MATRIX_IMPORT" and .classification=="SOURCE_ARTIFACT_VALIDATED" and .bootstrapSyntheticPass==true and .firebaseSdkWithoutDefaultAppBlocked==true and .firebaseDefaultAppAuthReady==true and .lateReadySyntheticPass==true and .routerLateReadyRecovered==true and .routerUnreadyBlocked==true and .clientDetailLateReadyRecovered==true and .clientRouteLateReadyRecovered==true and .clientRouteWrongParamBlocked==true and .sourceContract.routerReadinessOwner=="post-timeout-canonical-state-recheck-with-owner-diagnostics" and .sourceContract.clientLateReadyOwner=="post-timeout-canonical-state-recovery" and .sourceContract.validatorFailClosedOwner=="late-ready-recovered-owner-specific-failure-only" and .sourceContract.gateId=="block1-client360-insurers-lab-v20260717" and .sourceContract.contractVersion=="1.0.41" and .sourceContract.blockingRoutes==["inicio","cliente360","aseguradoras"] and .sourceContract.sharedImplementationImport=="tools/orbit360-block1-final-native-matrix-v20260811.mjs" and .firebaseAccess==false and .browserExecuted==false and .hostingTouched==false and .writes==0 and .ok==true' "$RUNNER_TEMP/matrix-import.json" >/dev/null
      - name: Validate owner-specific late-ready semantics fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('tools/orbit360-block1-final-native-matrix-v20260811.mjs','utf8');
          const canonical=fs.readFileSync('tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs','utf8');
          const lifecycle=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-block1-final-visual-runtime-v20260810.json','utf8'));
          const required=[
            "routerReadinessOwner:'post-timeout-canonical-state-recheck-with-owner-diagnostics'",
            "clientLateReadyOwner:'post-timeout-canonical-state-recovery'",
            "validatorFailClosedOwner:'late-ready-recovered-owner-specific-failure-only'",
            'routerReadyStateReady(state)',
            'clientDetailReadyState(state)',
            'clientRouteReadyState(state',
            'syntheticLateReadyRecoveryContract()',
            '_ROUTER_READY_POST_TIMEOUT_STATE',
            '_ROUTER_READY_LATE_PASS',
            'failedOwners',
            'CLIENT_DETAIL_LATE_READY_RECOVERED',
            'CLIENT_ROUTE_LATE_READY_RECOVERED',
            'FUNCTIONAL_ROUTER_READY_OWNER_TIMEOUT',
            'FUNCTIONAL_CLIENT_ROUTE_TIMEOUT'
          ];
          const missing=required.filter(x=>!src.includes(x));
          if(missing.length)throw new Error('LATE_READY_CONTRACT_MISSING:'+missing.join('|'));
          if(src.includes('VALIDATOR_STALE_CLIENT_DETAIL_POST_READY'))throw new Error('STALE_DETAIL_LATE_READY_BLOCKER_REMAINS');
          if(src.includes('VALIDATOR_STALE_CLIENT_ROUTE_POST_READY'))throw new Error('STALE_ROUTE_LATE_READY_BLOCKER_REMAINS');
          if(src.includes('FUNCTIONAL_ROUTER_READY_TIMEOUT:'))throw new Error('UNDIFFERENTIATED_ROUTER_TIMEOUT_REMAINS');
          if(!canonical.includes('syntheticLateReadyRecoveryContract'))throw new Error('CANONICAL_LATE_READY_SYNTHETIC_NOT_PROPAGATED');
          if(lifecycle.validatorLifecycleRevision!=='phase-capability-contract-v6-late-ready-recovery')throw new Error('LIFECYCLE_REVISION_STALE');
          if(lifecycle.status!=='SOURCE_CANDIDATE_REQUIRES_FAIL_CLOSED_PASS')throw new Error('LIFECYCLE_PREMATURE_SOURCE_PASS');
          if(lifecycle.freshRequestPath!=='.github/orbit360-requests/block1-final-visual-late-ready-recovery-v20260811-authorization.json')throw new Error('LIFECYCLE_FUTURE_REQUEST_PATH_STALE');
          if(lifecycle.priorAttempt?.runId!==31517840174)throw new Error('LIFECYCLE_PRIOR_RUNTIME_STALE');
          NODE
      - name: Validate final visual preflight with offline request fixture
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_REQUEST_FILE=tools/fixtures/orbit360-block1-final-visual-request-fixture-v20260810.json \
          ORBIT360_EXPECTED_REQUEST_VERSION=FIXTURE_BLOCK1_FINAL_VISUAL_AFTER_RELEASE_UNIVERSE \
          ORBIT360_EXPECTED_PARENT_HEAD=fixture-parent-head-block1-final-visual \
            node tools/orbit360-validar-gate-contracts-engine-block1-final-visual-v20260810.mjs
          jq -e '.status=="GO_GATE_CONTRACT_BLOCK1_FINAL_VISUAL" and .failed==0 and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .browserAuthorized==true and .hostingSafetyBackupAuthorized==true and .hostingBaselineRestoreAuthorized==true and .hostingDeployAuthorized==true and .hostingDeploysMaximum==1 and .hostingRollbackAuthorizedOnFailure==true and .firestoreWritesAuthorized==0 and .authWritesAuthorized==0 and .operationalWritesAuthorized==0 and .functionsDeployAuthorized==false and .rulesDeployAuthorized==false and .reimportAuthorized==false and .productionAuthorized==false and .runtimeExecuted==false and .secretAccess==false and .browserExecuted==false and .deployExecuted==false and .blockingRoutes==["inicio","cliente360","aseguradoras"] and .ok==true' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Enforce future runtime semantic boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const runner=fs.readFileSync('tools/orbit360-run-block1-final-visual-after-universe-v20260810.sh','utf8');
          const flow=fs.readFileSync('.github/workflows/orbit360-block1-final-visual-runtime-bootstrap-segmented-v20260811.yml','utf8');
          if(!runner.includes("BASELINE='visual-matrix-corrected-backup-31135532118'"))throw new Error('FINAL_VISUAL_BASELINE_MISSING');
          if((runner.match(/firebase deploy/g)||[]).length!==1)throw new Error('FINAL_VISUAL_DEPLOY_COUNT_SOURCE_INVALID');
          if(!flow.includes('.github/orbit360-requests/block1-final-visual-late-ready-recovery-v20260811-authorization.json'))throw new Error('FUTURE_REQUEST_PATH_NOT_FRESH');
          if(!flow.includes('20260811.block1-final-visual-late-ready-recovery'))throw new Error('FUTURE_REQUEST_VERSION_NOT_FRESH');
          if(!flow.includes('runtime: authorize Block1 late-ready recovery visual matrix'))throw new Error('FUTURE_COMMIT_MESSAGE_NOT_FRESH');
          for(const token of ['.lateReadySyntheticPass==true','.routerLateReadyRecovered==true','.routerUnreadyBlocked==true','.clientDetailLateReadyRecovered==true','.clientRouteLateReadyRecovered==true','.clientRouteWrongParamBlocked==true'])if(!flow.includes(token))throw new Error('FUTURE_RUNTIME_LATE_READY_REQUIREMENT_MISSING:'+token);
          if(/--only\s+(functions|firestore|rules)|firebase\s+deploy[^\n]*(functions|firestore|rules)|gcloud\s+.*deploy/i.test(runner+flow))throw new Error('FINAL_VISUAL_FORBIDDEN_DEPLOY_SCOPE');
          const forbiddenTrue=/(?:mainAuthorized|productionAuthorized|mergeAuthorized)\s*==\s*true/.test(flow)||/"(?:mainAuthorized|productionAuthorized|mergeAuthorized)"\s*:\s*true/.test(flow);
          if(forbiddenTrue)throw new Error('FINAL_VISUAL_PRODUCTION_CAPABILITY_FOUND');
          NODE
      - name: Seal sanitized late-ready source v7 evidence
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '{schemaVersion:"orbit360-block1-final-native-visual-source-v7",status:"PASS_BLOCK1_FINAL_NATIVE_VISUAL_SOURCE",ok:true,head:$sha,sourceRunId:($run|tonumber),gateId:"block1-client360-insurers-lab-v20260717",contractVersion:"1.0.41",blockingRoutes:["inicio","cliente360","aseguradoras"],releaseUniversePass:true,correctedValidatorSemantics:true,antiLoopSyntheticPass:true,bootstrapSyntheticPass:true,firebaseSdkWithoutDefaultAppBlocked:true,firebaseDefaultAppAuthReady:true,lateReadySyntheticPass:true,routerLateReadyRecovered:true,routerUnreadyBlocked:true,clientDetailLateReadyRecovered:true,clientRouteLateReadyRecovered:true,clientRouteWrongParamBlocked:true,canonicalBootstrapSyntheticHandoff:true,sourceStatusFailClosed:true,bootstrapNavigationOwner:"document-commit-login-form-firebase-sdk-default-app-auth-readiness-segmented",routerReadinessOwner:"post-timeout-canonical-state-recheck-with-owner-diagnostics",clientLateReadyOwner:"post-timeout-canonical-state-recovery",validatorFailClosedOwner:"late-ready-recovered-owner-specific-failure-only",accessOwner:"Orbit.access.can",clientScopeOwner:"Orbit.access.filter/withScope",sameRouteDetailOwner:"rendered-row-user-flow-plus-route-param-dom",routePerformanceOwner:"browserObserverElapsedMs",mobileMenuOwner:"router-ready-before-burger",priorRuntimeRun:31517840174,priorRuntimeClassification:"VALIDATOR_STALE_PIPELINE_MECHANISM_FAILURE",priorRuntimeCheckpoint:"ASESOR_ROUTER_READY_WAIT",runtimeRequestPresent:false,runtimeAuthorized:false,secretsRead:false,networkAccess:false,firestoreReads:0,firestoreWrites:0,authWrites:0,operationalWrites:0,browserExecuted:false,hostingTouched:false,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > "$SOURCE_EVIDENCE"
          jq -e --arg sha "$GITHUB_SHA" '.head==$sha and .lateReadySyntheticPass==true and .routerLateReadyRecovered==true and .routerUnreadyBlocked==true and .clientDetailLateReadyRecovered==true and .clientRouteLateReadyRecovered==true and .clientRouteWrongParamBlocked==true and .sourceStatusFailClosed==true and .runtimeRequestPresent==false and .runtimeAuthorized==false and .firestoreWrites==0 and .ok==true' "$SOURCE_EVIDENCE" >/dev/null
      - name: Publish fail-closed source status
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: orbit360-platform/runtime-gate-crm-v20260716/block1-final-visual-source-sanitized-v20260810.json
          SEAL_OUTCOME: '${{ steps.seal.outcome }}'
          PRIOR_JOB_STATUS: '${{ job.status }}'
        with:
          script: |
            const fs=require('fs');
            let state='failure',description='Block1 late-ready recovery source blocked fail-closed';
            try{
              if(process.env.SEAL_OUTCOME==='success' && process.env.PRIOR_JOB_STATUS==='success'){
                const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));
                if(p.ok===true&&p.schemaVersion==='orbit360-block1-final-native-visual-source-v7'&&p.status==='PASS_BLOCK1_FINAL_NATIVE_VISUAL_SOURCE'&&p.head===context.sha&&p.lateReadySyntheticPass===true&&p.routerLateReadyRecovered===true&&p.routerUnreadyBlocked===true&&p.clientDetailLateReadyRecovered===true&&p.clientRouteLateReadyRecovered===true&&p.clientRouteWrongParamBlocked===true&&p.sourceStatusFailClosed===true&&p.firestoreWrites===0){state='success';description='Block1 late-ready recovery SOURCE v7 PASS fail-closed';}
              }
            }catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/block1-final-native-visual-source',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Upload current-run sanitized source evidence
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-block1-final-native-visual-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/block1-final-visual-source-sanitized-v20260810.json
          if-no-files-found: error
          retention-days: 30
