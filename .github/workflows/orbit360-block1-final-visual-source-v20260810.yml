name: Orbit360 Block1 final native visual source-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-block1-final-visual-source-v20260810.yml'
      - '.github/workflows/orbit360-block1-final-visual-runtime-v20260810.yml'
      - 'tools/orbit360-validator-lifecycle-block1-final-visual-runtime-v20260810.json'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-final-visual-v20260810.mjs'
      - 'tools/orbit360-run-block1-final-visual-after-universe-v20260810.sh'
      - 'tools/fixtures/orbit360-block1-final-visual-request-fixture-v20260810.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-block1-final-native-visual-source-v20260810
  cancel-in-progress: false
env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  SOURCE_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/block1-final-visual-source-sanitized-v20260810.json
jobs:
  source:
    name: Block1 · final native visual · source-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical Block1 gate before package validation
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .failed==0 and .executionAuthorized==false and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Require release universe PASS and visual eligibility
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.decision=="RELEASE_UNIVERSE_ACCEPTED_WITH_2_CLIENT_PROVENANCE_EXCEPTIONS" and .classification=="PASS_BLOCK1_RELEASE_UNIVERSE_WITH_CONTROLLED_EXCEPTIONS" and .observed.clientes.raw==430 and .observed.clientes.baselineContract==414 and .observed.clientes.retained26Deferred==14 and .observed.clientes.controlledProvenanceExceptions==2 and .observed.aseguradoras.effective==26 and .observed.asesores.count==7 and .releaseEligible==true and .visualEligible==true and .firestoreWrites==0 and .ok==true' orbit360-platform/runtime-gate-crm-v20260716/block1-release-universe-exception-sanitized-v20260810.json >/dev/null
      - name: Validate exact final visual package
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/orbit360-run-block1-final-visual-after-universe-v20260810.sh
          node --check tools/orbit360-validar-gate-contracts-engine-block1-final-visual-v20260810.mjs
          node --check tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs
          node --check tools/orbit360-block1-native-matrix-v23-v20260807.mjs
          node --check tools/orbit360-event-driven-render-observer-v23.mjs
          node --check tools/orbit360-visual-runtime-rootfix-browser-precheck-v20260805.mjs
          node -e "JSON.parse(require('fs').readFileSync('tools/orbit360-validator-lifecycle-block1-final-visual-runtime-v20260810.json','utf8'));JSON.parse(require('fs').readFileSync('tools/fixtures/orbit360-block1-final-visual-request-fixture-v20260810.json','utf8'))"
          ORBIT360_MATRIX_ARTIFACT_VALIDATE_ONLY=1 node tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs > "$RUNNER_TEMP/matrix-import.json"
          jq -e '.status=="PASS_V23_NATIVE_MATRIX_IMPORT" and .classification=="SOURCE_ARTIFACT_VALIDATED" and .sourceContract.gateId=="block1-client360-insurers-lab-v20260717" and .sourceContract.contractVersion=="1.0.41" and .sourceContract.blockingRoutes==["inicio","cliente360","aseguradoras"] and .sourceContract.generatedFromPriorArtifact==false and .sourceContract.textualTransform==false and .firebaseAccess==false and .browserExecuted==false and .hostingTouched==false and .writes==0 and .ok==true' "$RUNNER_TEMP/matrix-import.json" >/dev/null
      - name: Validate final visual preflight with offline request fixture
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_REQUEST_FILE=tools/fixtures/orbit360-block1-final-visual-request-fixture-v20260810.json \
          ORBIT360_EXPECTED_REQUEST_VERSION=FIXTURE_BLOCK1_FINAL_VISUAL_AFTER_RELEASE_UNIVERSE \
          ORBIT360_EXPECTED_PARENT_HEAD=fixture-parent-head-block1-final-visual \
            node tools/orbit360-validar-gate-contracts-engine-block1-final-visual-v20260810.mjs
          jq -e '.status=="GO_GATE_CONTRACT_BLOCK1_FINAL_VISUAL" and .failed==0 and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .browserAuthorized==true and .hostingSafetyBackupAuthorized==true and .hostingBaselineRestoreAuthorized==true and .baselineHostingChannel=="visual-matrix-corrected-backup-31135532118" and .hostingDeployAuthorized==true and .hostingDeploysMaximum==1 and .hostingRollbackAuthorizedOnFailure==true and .firestoreWritesAuthorized==0 and .authWritesAuthorized==0 and .operationalWritesAuthorized==0 and .functionsDeployAuthorized==false and .rulesDeployAuthorized==false and .reimportAuthorized==false and .productionAuthorized==false and .runtimeExecuted==false and .secretAccess==false and .browserExecuted==false and .deployExecuted==false and .blockingRoutes==["inicio","cliente360","aseguradoras"] and .ok==true' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Enforce runtime semantic boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const runner=fs.readFileSync('tools/orbit360-run-block1-final-visual-after-universe-v20260810.sh','utf8');
          const flow=fs.readFileSync('.github/workflows/orbit360-block1-final-visual-runtime-v20260810.yml','utf8');
          const matrix=fs.readFileSync('tools/orbit360-block1-native-matrix-v23-v20260807.mjs','utf8');
          if(!runner.includes("BASELINE='visual-matrix-corrected-backup-31135532118'"))throw new Error('FINAL_VISUAL_BASELINE_MISSING');
          if((runner.match(/firebase deploy/g)||[]).length!==1)throw new Error('FINAL_VISUAL_DEPLOY_COUNT_SOURCE_INVALID');
          if(!runner.includes('firebase hosting:clone "$PROJECT:live" "$PROJECT:$SAFETY_CHANNEL"')||!runner.includes('firebase hosting:clone "$PROJECT:$BASELINE" "$PROJECT:live"')||!runner.includes('firebase hosting:clone "$PROJECT:$SAFETY_CHANNEL" "$PROJECT:live"'))throw new Error('FINAL_VISUAL_BACKUP_RESTORE_ROLLBACK_MISSING');
          if(!runner.includes("MATRIX_RUNNER='tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs'"))throw new Error('FINAL_VISUAL_NATIVE_MATRIX_NOT_BOUND');
          if(!matrix.includes("V23_BLOCKING_ROUTES = Object.freeze(['inicio', 'cliente360', 'aseguradoras'])"))throw new Error('FINAL_VISUAL_BLOCKING_SCOPE_INVALID');
          if(/--only\s+(functions|firestore|rules)|firebase\s+deploy[^\n]*(functions|firestore|rules)|gcloud\s+.*deploy/i.test(runner+flow))throw new Error('FINAL_VISUAL_FORBIDDEN_DEPLOY_SCOPE');
          const forbiddenTrue = /(?:mainAuthorized|productionAuthorized|mergeAuthorized)\s*==\s*true/.test(flow) || /"(?:mainAuthorized|productionAuthorized|mergeAuthorized)"\s*:\s*true/.test(flow);
          if(forbiddenTrue)throw new Error('FINAL_VISUAL_PRODUCTION_CAPABILITY_FOUND');
          NODE
      - name: Seal sanitized source evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$GITHUB_SHA" '{schemaVersion:"orbit360-block1-final-native-visual-source-v1",status:"PASS_BLOCK1_FINAL_NATIVE_VISUAL_SOURCE",ok:true,head:$sha,gateId:"block1-client360-insurers-lab-v20260717",contractVersion:"1.0.41",blockingRoutes:["inicio","cliente360","aseguradoras"],releaseUniversePass:true,runtimeRequestPresent:false,runtimeAuthorized:false,secretsRead:false,networkAccess:false,firestoreReads:0,firestoreWrites:0,authWrites:0,operationalWrites:0,browserExecuted:false,hostingTouched:false,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > "$SOURCE_EVIDENCE"
      - name: Publish source status
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: orbit360-platform/runtime-gate-crm-v20260716/block1-final-visual-source-sanitized-v20260810.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Block1 final native visual source blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.ok===true&&p.status==='PASS_BLOCK1_FINAL_NATIVE_VISUAL_SOURCE'&&p.firestoreWrites===0){state='success';description='Block1 final native visual SOURCE PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/block1-final-native-visual-source',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Upload sanitized source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-block1-final-native-visual-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/block1-final-visual-source-sanitized-v20260810.json
          if-no-files-found: warn
          retention-days: 30
