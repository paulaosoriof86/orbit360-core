name: Orbit 360 · Rootfix visual post-Auth · LAB

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/visual-runtime-rootfix-lab-v20260805-*.json'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-visual-runtime-rootfix-lab-v20260805
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block2.7-visual-runtime-rootfix-lab-v20260805
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-visual-runtime-rootfix-lab-v20260805.json
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_LAB_URL: https://ays-orbit-360-lab.web.app/index.html?orbitBackend=firestore-lab&tenant=alianzas-soluciones&runtime=20260717-2
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_LIVE_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/visual-runtime-rootfix-live-sanitized-v20260805.json
  ORBIT360_FINAL_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/visual-runtime-rootfix-final-sanitized-v20260805.json
  ORBIT360_CLOSURE: orbit360-platform/docs/CIERRE-VISUAL-RUNTIME-ROOTFIX-LAB-20260805.md
  ORBIT360_ARTIFACT_DIR: orbit360-visual-rootfix-artifacts

jobs:
  visual-runtime-rootfix:
    name: Gate → backup → Hosting LAB → navegador read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout request exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar request único e inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST_FILE="${CHANGED[0]}"
          case "$REQUEST_FILE" in
            .github/orbit360-requests/visual-runtime-rootfix-lab-v20260805-*.json) ;;
            *) echo 'PIPELINE_MECHANISM_FAILURE:UNEXPECTED_REQUEST_PATH' >&2; exit 41 ;;
          esac
          echo "ORBIT360_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-visual-runtime-rootfix-lab-request-v1" and
            .gateId=="block2.7-visual-runtime-rootfix-lab-v20260805" and
            .contractVersion=="2.7.2" and .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and .parentHead==$parent and
            .capabilities.secrets==true and .capabilities.firestoreRead==true and
            .capabilities.writes==false and .capabilities.runtime==true and
            .capabilities.browser==true and .capabilities.deploy==true and
            .capabilities.functionsDeploy==false and .capabilities.rulesDeploy==false and
            .capabilities.production==false and
            .scope.hostingDeploysMaximum==1 and .scope.hostingOnly==true and
            .scope.hostingBackupClone==true and .scope.hostingRollbackCloneOnFailure==true and
            .scope.functionsDeploy==false and .scope.rulesDeploy==false and
            .scope.firestoreWrites==false and .scope.authWrites==false and
            .scope.operationalWrites==false and .scope.reimport==false and
            .scope.production==false and .scope.main==false and .scope.merge==false and
            .scope.directionDesktop==true and .scope.operationalTablet==true and
            .scope.advisorMobile==true and .scope.liveReadOnlyOpsLeads==true
          ' "$REQUEST_FILE" >/dev/null

      - name: Validar sintaxis antes del gate
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-visual-runtime-rootfix-lab-v20260805.mjs
          node --check tools/orbit360-visual-runtime-rootfix-live-v20260805.mjs
          node --check orbit360-platform/core/visual-runtime-rootfix-v20260805.js
          node --check orbit360-platform/core/backend-lab-loader.js
          git diff --check

      - name: Gate canónico antes de secretos
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '
            .status=="GO_GATE_CONTRACT" and .contractVersion=="2.7.2" and
            .failed==0 and .ok==true and .executionAuthorized==true and
            .secretAccessAuthorized==true and .firestoreReadAuthorized==true and
            .writeAuthorized==false and .runtimeAuthorized==true and
            .browserAuthorized==true and .hostingDeployAuthorized==true and
            .hostingTarget=="ays-orbit-360-lab" and .hostingDeploysMaximum==1 and
            .hostingBackupCloneAuthorized==true and .hostingRollbackCloneAuthorizedOnFailure==true and
            .functionsDeployAuthorized==false and .rulesDeployAuthorized==false and
            .productionAuthorized==false and .firestoreWritesAuthorized==0 and
            .authWritesAuthorized==0 and .operationalWritesAuthorized==0 and
            .dataAccess==false and .secretAccess==false and .firestoreReads==0 and
            .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and
            .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false
          ' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Resolver credencial LAB
        id: credential
        env:
          SA1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA1:-${SA2:-${SA3:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY="$RUNNER_TEMP/orbit360-visual-rootfix-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY"
          chmod 600 "$KEY"
          test "$(jq -r '.project_id // empty' "$KEY")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY" >> "$GITHUB_ENV"

      - name: Instalar runtime reproducible
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 firebase-tools@15.25.1 playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Respaldar versión Hosting LAB vigente
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_CHANNEL="visual-rootfix-backup-${GITHUB_RUN_ID}"
          echo "ORBIT360_BACKUP_CHANNEL=$BACKUP_CHANNEL" >> "$GITHUB_ENV"
          npx firebase hosting:clone "$ORBIT360_PROJECT_ID:live" "$ORBIT360_PROJECT_ID:$BACKUP_CHANNEL" --project "$ORBIT360_PROJECT_ID" --non-interactive
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Desplegar exclusivamente Hosting LAB
        id: hosting_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx firebase deploy --project "$ORBIT360_PROJECT_ID" --only hosting --non-interactive
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Ejecutar prueba viva por rol y viewport
        id: live_test
        continue-on-error: true
        env:
          ORBIT360_VISUAL_ARTIFACT_DIR: ${{ env.ORBIT360_ARTIFACT_DIR }}
          ORBIT360_VISUAL_EVIDENCE: ${{ env.ORBIT360_LIVE_EVIDENCE }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-visual-runtime-rootfix-live-v20260805.mjs

      - name: Restaurar Hosting LAB ante fallo
        if: always() && steps.hosting_deploy.outcome == 'success' && steps.live_test.outcome != 'success'
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORBIT360_BACKUP_CHANNEL:-}"
          npx firebase hosting:clone "$ORBIT360_PROJECT_ID:$ORBIT360_BACKUP_CHANNEL" "$ORBIT360_PROJECT_ID:live" --project "$ORBIT360_PROJECT_ID" --non-interactive
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Sellar evidencia y consumir autorización
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          DEPLOY_OUTCOME: ${{ steps.hosting_deploy.outcome }}
          LIVE_OUTCOME: ${{ steps.live_test.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const live=read(process.env.ORBIT360_LIVE_EVIDENCE);
          const pre=read(process.env.ORBIT360_EVIDENCE_DIR+'/preflight-sanitizado.json');
          const lifecycle=read(process.env.ORBIT360_LIFECYCLE);
          const pass=process.env.LIVE_OUTCOME==='success' && live && live.ok===true && live.stage==='PASS_VISUAL_RUNTIME_ROOTFIX_LIVE' && live.snapshotIntegrity==='VERIFIED_UNCHANGED';
          const rollbackRequired=process.env.DEPLOY_OUTCOME==='success' && !pass;
          const rollbackRestored=!rollbackRequired || process.env.ROLLBACK_OUTCOME==='success';
          const classification=pass?'PASS_VISUAL_POST_AUTH':!rollbackRestored?'PIPELINE_MECHANISM_FAILURE':(live&&live.classification)||'ENVIRONMENT_FAILURE';
          const final={
            schemaVersion:'orbit360-visual-runtime-rootfix-final-v1',
            gateId:'block2.7-visual-runtime-rootfix-lab-v20260805',
            contractVersion:'2.7.2',
            runId:process.env.GITHUB_RUN_ID,
            attempt:Number(process.env.GITHUB_RUN_ATTEMPT||1),
            stage:pass?'PASS_VISUAL_RUNTIME_ROOTFIX_LIVE':'STOP_RETRY_VISUAL_RUNTIME_ROOTFIX',
            decision:pass?'PASS_VISUAL_POST_AUTH':'STOP_RETRY',
            classification,
            preflightStatus:pre&&pre.status||'MISSING',
            preflightChecks:pre&&pre.total||0,
            hostingBackupClone:process.env.BACKUP_OUTCOME==='success',
            hostingDeploys:process.env.DEPLOY_OUTCOME==='success'?1:0,
            hostingRollbackRequired:rollbackRequired,
            hostingRollbackRestored:rollbackRequired&&process.env.ROLLBACK_OUTCOME==='success',
            liveTestOutcome:process.env.LIVE_OUTCOME||'skipped',
            roleResults:live&&Array.isArray(live.roles)?live.roles.map(r=>({role:r.role,viewport:r.viewport,loginMs:r.loginMs,initialReadyMs:r.initialReadyMs,failed:r.failed,warnings:r.warnings,routeTimings:r.routeTimings,checks:r.checks,screenshots:r.screenshots,ok:r.ok})):[],
            totalRoleFailures:live&&live.totalRoleFailures!=null?live.totalRoleFailures:null,
            totalWarnings:live&&live.totalWarnings!=null?live.totalWarnings:null,
            snapshotIntegrity:live&&live.snapshotIntegrity||'NOT_VERIFIED',
            firestoreReads:live&&live.firestoreReads||0,
            firestoreWrites:0,
            authWrites:0,
            operationalWrites:0,
            functionsDeploys:0,
            rulesDeploys:0,
            reimports:0,
            productionTouched:false,
            mainTouched:false,
            mergeExecuted:false,
            containsPII:false,
            containsSecrets:false,
            containsPasswords:false,
            ok:pass
          };
          fs.mkdirSync(path.dirname(process.env.ORBIT360_FINAL_EVIDENCE),{recursive:true});
          fs.writeFileSync(process.env.ORBIT360_FINAL_EVIDENCE,JSON.stringify(final,null,2)+'\n','utf8');
          lifecycle.ownerVersion='20260805.5-runtime-consumed';
          lifecycle.status=pass?'CONSUMED_PASS':'CONSUMED_STOP_RETRY';
          lifecycle.classification=classification;
          lifecycle.currentPhase=pass?'LIVE_VISUAL_VERIFIED':'CONSUMED_STOP_RETRY';
          lifecycle.activeRequest=false;
          lifecycle.requestConsumed=true;
          lifecycle.allowedExecutions=0;
          lifecycle.executionAuthorized=false;
          lifecycle.secretAccessAuthorized=false;
          lifecycle.firestoreReadAuthorized=false;
          lifecycle.writeAuthorized=false;
          lifecycle.browserAuthorized=false;
          lifecycle.hostingDeployAuthorized=false;
          lifecycle.functionsDeployAuthorized=false;
          lifecycle.rulesDeployAuthorized=false;
          lifecycle.productionAuthorized=false;
          lifecycle.runtimeResult={runId:process.env.GITHUB_RUN_ID,attempt:Number(process.env.GITHUB_RUN_ATTEMPT||1),result:pass?'PASS':'STOP_RETRY',hostingDeploys:final.hostingDeploys,rollbackRestored:final.hostingRollbackRestored,snapshotIntegrity:final.snapshotIntegrity,totalRoleFailures:final.totalRoleFailures};
          lifecycle.nextAction=pass?'PREPARE_PLATFORM_NATIVE_CRUD_GATE_AND_RESUME_COBROS_4_1':'CLOSE_ROOT_CAUSE_FROM_CURRENT_RUN_WITHOUT_RETRY';
          fs.writeFileSync(process.env.ORBIT360_LIFECYCLE,JSON.stringify(lifecycle,null,2)+'\n','utf8');
          const lines=[
            '# CIERRE VISUAL RUNTIME ROOTFIX LAB — 2026-08-05','',
            '```text',
            'run: '+final.runId,
            'stage: '+final.stage,
            'classification: '+final.classification,
            'preflight: '+final.preflightStatus+' · '+final.preflightChecks+' checks',
            'Hosting deploys: '+final.hostingDeploys,
            'rollback restored: '+final.hostingRollbackRestored,
            'snapshot: '+final.snapshotIntegrity,
            'role failures: '+String(final.totalRoleFailures),
            'Firestore/Auth/operational writes: 0',
            'Functions/Rules deploys: 0',
            'production/main/merge: 0','```','',
            pass?'Salida: `PASS_VISUAL_POST_AUTH`.':'Salida: `STOP_RETRY`; no se autoriza otro deploy hasta cerrar la causa exacta del run.'
          ];
          fs.writeFileSync(process.env.ORBIT360_CLOSURE,lines.join('\n')+'\n','utf8');
          console.log(JSON.stringify(final,null,2));
          NODE

      - name: Persistir evidencia sanitizada y lifecycle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          FILES=(
            "$ORBIT360_LIFECYCLE"
            "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json"
            "$ORBIT360_FINAL_EVIDENCE"
            "$ORBIT360_CLOSURE"
          )
          [ -f "$ORBIT360_LIVE_EVIDENCE" ] && FILES+=("$ORBIT360_LIVE_EVIDENCE")
          git add "${FILES[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist visual rootfix LAB result [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Publicar evidencia visual sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-runtime-rootfix-lab-sanitized
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/visual-runtime-rootfix-*-sanitized-v20260805.json
            orbit360-platform/docs/CIERRE-VISUAL-RUNTIME-ROOTFIX-LAB-20260805.md
            orbit360-visual-rootfix-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Comentar cierre en PR 5
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const p=process.env.ORBIT360_FINAL_EVIDENCE;
            const e=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{stage:'STOP_RETRY_EVIDENCE_MISSING',classification:'PIPELINE_MECHANISM_FAILURE',ok:false};
            const body=`## Rootfix visual post-Auth — ${e.ok?'PASS':'STOP_RETRY'}\n\n\`\`\`text\nrun: ${e.runId||'—'}\n${e.stage}\n${e.classification}\npreflight: ${e.preflightStatus||'—'}\nroles con fallos: ${e.totalRoleFailures}\nsnapshot: ${e.snapshotIntegrity}\nHosting deploys: ${e.hostingDeploys||0}\nrollback: ${e.hostingRollbackRestored?'restaurado':'no requerido/no ejecutado'}\nFirestore/Auth/operational writes: 0\nFunctions/Rules/production: 0\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});

      - name: Exigir PASS final
        if: always()
        shell: bash
        run: |
          jq -e '.ok==true and .stage=="PASS_VISUAL_RUNTIME_ROOTFIX_LIVE" and .decision=="PASS_VISUAL_POST_AUTH" and .preflightStatus=="GO_GATE_CONTRACT" and .hostingDeploys==1 and .snapshotIntegrity=="VERIFIED_UNCHANGED" and .totalRoleFailures==0 and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .functionsDeploys==0 and .rulesDeploys==0 and .productionTouched==false' "$ORBIT360_FINAL_EVIDENCE" >/dev/null
