name: Orbit 360 · M5 multirol owner remediation 5.0.29 · FINAL STATIC ATTEMPT
run-name: M5 5.0.29 · final static after fixture correction · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-multirol-owner-remediation-529-v20260729.yml'

permissions:
  contents: read
  statuses: write

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  static_remediation:
    name: M5 · final Access/PWA root-cause remediation · zero operational capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar stop-line y segundo intento final
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f tools/orbit360-m5-runtime-smoke-528-request-v20260729.json
          test -f tools/orbit360-m5-multirol-owner-remediation-529-freeze-v20260729.json
          jq -e '.controls.sameStageFailureCount==1 and .controls.secondFailureStopsStage==true and .authorization.staticAttempt2Authorized==true and .authorization.allowedExecutions==1' tools/orbit360-m5-multirol-owner-remediation-529-freeze-v20260729.json >/dev/null

      - name: Preflight canónico 5.0.29 sin identidad ni runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-multirol-owner-remediation-529-v20260729.mjs
          node --check tools/orbit360-m5-multirol-owner-remediation-529-fixture-v20260729.mjs
          node --check orbit360-platform/core/session-multirol-visibility-v20260716.js
          node --check orbit360-platform/sw.js
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_MULTIROL_OWNER_REMEDIATION_529_STATIC_PASS" and .contractVersion=="5.0.29" and .classification=="FUNCTIONAL_DEFECT_REMEDIATED_STATIC" and .failed==0 and .compatibilityOwnerVersion=="20260729.2" and .canonicalAccessOwnerVersion=="20260729.3" and .pwaCacheGeneration=="orbit360-v20260729-11-multirol-owner" and .productChangedFiles==["orbit360-platform/core/session-multirol-visibility-v20260716.js","orbit360-platform/sw.js"] and .runtime528Rerun==false and .runtimeExecuted==false and .browserExecuted==false and .secretsRead==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          jq -e '.ok==true and .status=="M5_MULTIROL_OWNER_REMEDIATION_529_FIXTURE_PASS" and .failed==0' "$ORBIT360_EVIDENCE_DIR/m5-multirol-owner-remediation-529-fixture-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-multirol-owner-remediation-529-final-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-multirol-owner-remediation-529-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-multirol-owner-remediation-529-fixture-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-multirol-owner-remediation-529-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.29 final static failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.status==='M5_MULTIROL_OWNER_REMEDIATION_529_STATIC_PASS'&&s.failed===0){state='success';description='M5 5.0.29 Access/PWA static PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-multirol-owner-remediation-529',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
