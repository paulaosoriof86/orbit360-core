name: Orbit 360 · root fix reconciliador padrón aprobado RC1.2

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/rootfix-approved-roster-reconciler-v20260804.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: orbit360-rootfix-approved-roster-reconciler-v20260804
  cancel-in-progress: false

env:
  REQUEST: .github/orbit360-requests/rootfix-approved-roster-reconciler-v20260804.json
  PROOF: orbit360-platform/runtime-gate-crm-v20260716/rc12-approved-roster-reconciler-rootfix-static.json
  STATUS_CONTEXT: orbit360/rootfix-approved-roster-reconciler

jobs:
  rootfix:
    name: Reconciliador · source lock + digest · sin Firebase
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar frontera source-only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-rootfix-approved-roster-reconciler-request-v1" and .status=="AUTHORIZED_POST_NO_WRITE_ROOTFIX" and .priorRun==30908259200 and .priorDecision=="RC12_APPROVED_ROSTER_RECONCILIATION_NO_GO_NO_WRITE" and .candidate=="b699ba329960cd830121b57452ce558399aa84fb" and .secrets==false and .firestoreRead==false and .authRead==false and .writes==false and .browser==false and .deploy==false and .production==false and .consumed==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-aplicar-rootfix-roster-digest-source-lock-v20260804.mjs

      - name: Aplicar root fix coordinado
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-aplicar-rootfix-roster-digest-source-lock-v20260804.mjs
          node --check tools/orbit360-provisionar-roster-aprobado-final-rc12-v20260804.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-rc12-approved-roster-final-go-live-v20260804.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          jq -e '.decision=="APPROVED_ROSTER_RECONCILER_ROOTFIX_STATIC_PASS" and .classification=="GO_STATIC_VALIDATOR_ROOTFIX" and .rawEmailStored==false and .firestoreRead==false and .firestoreWrites==0 and .authRead==false and .authWrites==0 and .userCreates==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .ok==true' "$PROOF" >/dev/null
          ! grep -RE '@aysseguros\.com' tools/orbit360-provisionar-roster-aprobado-final-rc12-v20260804.mjs "$PROOF"
          git diff --check

      - name: Exigir delta exacto
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff --name-only)
          printf '%s\n' "${FILES[@]}"
          test "${#FILES[@]}" = '5'
          printf '%s\n' "${FILES[@]}" | grep -Fx 'tools/orbit360-provisionar-roster-aprobado-final-rc12-v20260804.mjs'
          printf '%s\n' "${FILES[@]}" | grep -Fx 'tools/orbit360-validator-lifecycle-contract-rc12-approved-roster-final-go-live-v20260804.json'
          printf '%s\n' "${FILES[@]}" | grep -Fx 'tools/orbit360-validar-gate-contracts-engine-rc12-approved-roster-final-go-live-v20260804.mjs'
          printf '%s\n' "${FILES[@]}" | grep -Fx 'tools/orbit360-validar-gate-contracts-v20260717.mjs'
          printf '%s\n' "${FILES[@]}" | grep -Fx "$PROOF"

      - name: Persistir root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/orbit360-provisionar-roster-aprobado-final-rc12-v20260804.mjs tools/orbit360-validator-lifecycle-contract-rc12-approved-roster-final-go-live-v20260804.json tools/orbit360-validar-gate-contracts-engine-rc12-approved-roster-final-go-live-v20260804.mjs tools/orbit360-validar-gate-contracts-v20260717.mjs "$PROOF"
          git commit -m 'auth: resolver padrón aprobado por source lock y digest'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703

      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'${{ job.status }}'==='success'?'success':'failure',context:process.env.STATUS_CONTEXT,description:'${{ job.status }}'==='success'?'Reconciliador padrón · root fix source-only PASS':'Reconciliador padrón · root fix FAIL',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
