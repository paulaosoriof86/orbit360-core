name: Orbit360 v33 external audit runtime preparation source-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-v33-two-client-cloud-audit-runtime-prep-source-v20260810.yml'
      - '.github/workflows/orbit360-v33-two-client-cloud-audit-runtime-v20260810.yml'
      - '.github/workflows/orbit360-sourcecheck-v33-two-client-cloud-audit-v20260807.yml'
      - 'tools/orbit360-validar-gate-contracts-v20260717.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-v33-v20260807.mjs'
      - 'tools/orbit360-validator-lifecycle-block1-two-client-cloud-audit-runtime-v33-v20260810.json'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-runtime-v33-v20260810.mjs'
      - 'tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs'
      - 'tools/orbit360-test-two-client-cloud-audit-v33-source-v20260807.mjs'
      - 'tools/fixtures/orbit360-v33-two-client-cloud-audit-runtime-request-fixture-v20260810.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-v33-runtime-prep-source-v20260810
  cancel-in-progress: false
env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  source:
    name: v33 runtime contract · source-only · zero capabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-v33-v20260807.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block1-two-client-cloud-audit-runtime-v33-v20260810.mjs
          node --check tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs
          node tools/orbit360-test-two-client-cloud-audit-v33-source-v20260807.mjs
          node -e "JSON.parse(require('fs').readFileSync('tools/orbit360-validator-lifecycle-block1-two-client-cloud-audit-runtime-v33-v20260810.json','utf8'));JSON.parse(require('fs').readFileSync('tools/fixtures/orbit360-v33-two-client-cloud-audit-runtime-request-fixture-v20260810.json','utf8'))"
          grep -Fq "Canonical GO gate before secrets" .github/workflows/orbit360-v33-two-client-cloud-audit-runtime-v20260810.yml
          grep -Fq "firestoreLocatorReadOperationsMaximum==1" .github/workflows/orbit360-v33-two-client-cloud-audit-runtime-v20260810.yml
          grep -Fq "loggingReadOperationsMaximum==2" .github/workflows/orbit360-v33-two-client-cloud-audit-runtime-v20260810.yml
          grep -Fq "firestoreWritesAuthorized==0" .github/workflows/orbit360-v33-two-client-cloud-audit-runtime-v20260810.yml
          grep -Fq "productionAuthorized==false" .github/workflows/orbit360-v33-two-client-cloud-audit-runtime-v20260810.yml
      - name: Preserve v33 source gate with historical request inert
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit \
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION \
            node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .failed==0 and .requestState=="FROZEN_HISTORICAL_CONSUMED" and .executionAuthorized==false and .secretAccessAuthorized==false and .firestoreReadAuthorized==false and .loggingReadAuthorized==false and .writesAuthorized==0 and .operationalWrites==0' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Validate runtime profile with inert request fixture
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit-runtime \
          ORBIT360_REQUEST_FILE=tools/fixtures/orbit360-v33-two-client-cloud-audit-runtime-request-fixture-v20260810.json \
          ORBIT360_EXPECTED_REQUEST_VERSION=FIXTURE_V33_RUNTIME_REQUEST \
          ORBIT360_EXPECTED_PARENT_HEAD=fixture-parent-head \
            node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="GO_GATE_CONTRACT_RUNTIME_V33" and .failed==0 and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .loggingReadAuthorized==true and .writesAuthorized==0 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Semantic zero-write boundary
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-detect-firestore-mutations-v32-v20260807.mjs tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs > "$RUNNER_TEMP/v33-runtime-mutation-analysis.json"
          jq -e '.ok==true and (.findings|length)==0' "$RUNNER_TEMP/v33-runtime-mutation-analysis.json" >/dev/null
          ! grep -Eq 'firebase deploy|playwright|hosting:' tools/orbit360-probe-two-client-cloud-audit-v33-v20260807.mjs
      - name: Seal source-only preparation evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$GITHUB_SHA" '{schemaVersion:"orbit360-v33-runtime-prep-source-v2",status:"PASS_V33_RUNTIME_PREP_SOURCE_FROZEN_HISTORY",ok:true,head:$sha,historicalRequestInert:true,requestFixtureOnly:true,secretsRead:false,firestoreRead:false,loggingRead:false,writes:0,runtimeExecuted:false,browserExecuted:false,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/v33-runtime-prep-source-sanitized-v20260810.json"
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v33-runtime-prep-source-sanitized-v20260810.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='v33 frozen-request source transition blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='PASS_V33_RUNTIME_PREP_SOURCE_FROZEN_HISTORY'&&p.writes===0){state='success';description='v33 SOURCE PASS; consumed request inert; zero capabilities';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/v33-runtime-prep-source',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-v33-runtime-prep-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/v33-runtime-prep-source-sanitized-v20260810.json
          if-no-files-found: warn
          retention-days: 30
