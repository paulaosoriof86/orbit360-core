name: Orbit 360 · M5 runtime preparation 5.0.39
run-name: M5 5.0.39 · static runtime package · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-runtime-prep-539-trigger-v20260730.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-prep-539-v20260730
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: 097d4e85b37e3c26406e856d94fe156e1f40723b9dec40ba567334c573cc855a

jobs:
  prep:
    name: M5 · runtime preparation 5.0.39 · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar rama y primer intento
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preflight canónico cerrado 5.0.38
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_HOSTING_538_CLOSED_29_OF_29_READY_TO_REQUEST_RUNTIME_AUTHORIZATION" and .contractVersion=="5.0.38" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==46 and .remoteAssetsExpected==29 and .remoteAssetsMatched==29 and .mismatchCount==0 and .remoteParity==true and .hostingLabDeliveryAuthorized==false and .allowedHostingExecutions==0 and .runtimeSmokeAuthorized==false and .allowedRuntimeExecutions==0 and .runtimeRequestCreated==false and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Confirmar paridad pública 29/29
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-537-v20260729.mjs
          jq -e '.ok==true and .status=="M5_RC_537_READY_FOR_RUNTIME_AFTER_HOSTING" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==46 and .remoteLab.assetsExpected==29 and .remoteLab.assetsChecked==29 and .remoteLab.assetsMatched==29 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .approvalReadyForRuntimeSmoke==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-537-summary.json" >/dev/null
      - name: Validar package runtime 5.0.39
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-m5-runtime-smoke-539-browser-adapter-v20260730.mjs
          node --check tools/orbit360-m5-runtime-smoke-539-close-v20260730.mjs
          node --check tools/orbit360-m5-runtime-prep-539-v20260730.mjs
          node tools/orbit360-m5-runtime-prep-539-v20260730.mjs
          jq -e '.ok==true and .status=="M5_RUNTIME_PREP_539_PASS_READY_TO_REQUEST_AUTHORIZATION" and .failed==0 and .passed==.total and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==46 and .remoteAssetsExpected==29 and .remoteAssetsMatched==29 and .remoteParity==true and .legacyProbeBlobSha=="70d6ad22553bd0387fa08dd2eeeb6e3b9834fa12" and .policyBlobSha=="fa4c29d30a82673a7bf2d3d55efce52eaf4cccf3" and .bridgeBlobSha=="51172365ea8cda420aa8e3ea379ef0a9b8331db1" and .secrets==false and .firestoreRead==false and .runtime==false and .browser==false and .deploy==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-prep-539-summary.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-prep-539-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-537-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-prep-539-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-prep-539-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 runtime prep 5.0.39 failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.ok===true&&s.status==='M5_RUNTIME_PREP_539_PASS_READY_TO_REQUEST_AUTHORIZATION'){state='success';description='M5 runtime 5.0.39 prepared; awaiting authorization';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-prep-539',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
