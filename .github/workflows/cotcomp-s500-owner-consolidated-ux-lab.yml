name: CotComp S5.00 Owner Consolidated UX LAB

on:
  workflow_dispatch:
  push:
    branches:
      - ays/cotcomp-s500-owner-consolidated-ux-lab-20261005
    paths:
      - 'functions/cotcomp-owner-review-s500.js'
      - 'functions/cotcomp-owner-review-s500.test.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/cotcomp-s500-owner-consolidated-ux-lab.yml'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_FUNCTION: cotcompOwnerReviewS500
  COTCOMP_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompOwnerReviewS500
  CATALOG_URL: https://us-central1-ays-orbit-360-lab.cloudfunctions.net/cotcompVehicleCatalogS479

jobs:
  s500-owner-consolidated-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deny boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "production:false" functions/cotcomp-owner-review-s500.js
          grep -q "writes:false" functions/cotcomp-owner-review-s500.js
          grep -q "realAdvisorTransport:false" functions/cotcomp-owner-review-s500.js
          grep -q "realQuoteTransport:false" functions/cotcomp-owner-review-s500.js

      - name: Run baseline + S5.00 QA
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:cotcomp:s497
          npm run test:cotcomp:s497
          node --check cotcomp-owner-review-s499.js
          node --test cotcomp-owner-review-s499.test.js
          node --check cotcomp-owner-review-s500.js
          node --check cotcomp-owner-review-s500.test.js
          node --test cotcomp-owner-review-s500.test.js

      - name: Prepare LAB credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s500/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s500/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools@15.32.0

      - name: Deploy only S5.00 Owner Review to LAB
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only "functions:$COTCOMP_FUNCTION" --project "$COTCOMP_PROJECT_ID" --non-interactive --force

      - name: Physical readback
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/s500/evidence"
          CODE="$(curl -sS -o "$E/page.html" -w '%{http_code}' "$COTCOMP_URL")"
          test "$CODE" = "200"
          grep -q 'S5.00 owner consolidated UX delta' "$E/page.html"
          grep -q 'Tu continuidad con A&S está preparada' "$E/page.html"
          grep -q 'alternativas validadas para tu caso' "$E/page.html"
          ! grep -q 'catálogo vehicular LAB' "$E/page.html"
          ! grep -q 'plantilla visual source-only' "$E/page.html"
          POST_CODE="$(curl -sS -o "$E/post.txt" -w '%{http_code}' -X POST "$COTCOMP_URL")"
          test "$POST_CODE" = "405"

          CAT_CODE="$(curl -sS -o "$E/catalog-meta.json" -w '%{http_code}' "$CATALOG_URL?op=meta")"
          test "$CAT_CODE" = "200"
          node - "$E/catalog-meta.json" <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(j.ok!==true || j.labOnly!==true || j.appDataSource!==false || j.providerEligibilityEmbedded!==false) process.exit(1);
          NODE

          node - "$E/S500_OWNER_CONSOLIDATED_UX_RECEIPT.json" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({
            schemaVersion:'ays-cotcomp-s500-owner-consolidated-ux-receipt-v1.0',
            functionUrl:process.env.COTCOMP_URL,
            projectId:process.env.COTCOMP_PROJECT_ID,
            heroComposition:true,
            modeSelectorRedesigned:true,
            vehicleComboboxClose:true,
            technicalCopyRemovedFromVisibleSurface:true,
            darkSurfaceRebalanced:true,
            continuityTerminalState:true,
            productionTouched:false,
            writes:false,
            realAdvisorTransport:false,
            realQuoteTransport:false
          },null,2));
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s500-owner-consolidated-ux-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s500/evidence/S500_OWNER_CONSOLIDATED_UX_RECEIPT.json
            ${{ runner.temp }}/s500/evidence/page.html
            ${{ runner.temp }}/s500/evidence/catalog-meta.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/s500/firebase-service-account.json"
