name: Gravicentra LIVE Read-Only Verification

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-live-readonly-verification.yml'
      - 'tools/gravicentra-live-readonly-verification-v1.mjs'
      - 'tools/gravicentra-i5-credential-live-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ays-orbit-360-lab
  PRODUCTION_URL: https://ays-orbit-360-lab.web.app
  SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
  SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/fase-a-clean-20260831
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact accepted production release
        shell: bash
        run: |
          set -euo pipefail
          node tools/gravicentra-governance-preflight-v1.mjs --mode=governance
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json','utf8'));
          if(c.status!=='PRODUCTION_ACCEPTED'||c.environmentState?.productionAccepted!==true) throw new Error('LIVE_VERIFY_REQUIRES_PRODUCTION_ACCEPTED');
          if(c.gateState?.gates?.I6?.status!=='HOLD_PENDING_EXPLICIT_AUTHORIZATION') throw new Error('LIVE_VERIFY_REQUIRES_I6_HOLD');
          const r=c.certifiedCandidate||{};
          if(!r.sourceSha||!r.buildId||!r.artifactId) throw new Error('LIVE_VERIFY_RELEASE_BINDING_MISSING');
          const env={SOURCE_SHA:r.sourceSha,BUILD_ID:r.buildId,PREVIEW_URL:process.env.PRODUCTION_URL};
          for(const [k,v] of Object.entries(env)) fs.appendFileSync(process.env.GITHUB_ENV,`${k}=${v}\n`);
          NODE

      - name: Install LIVE QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase-admin@13.10.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Fresh LIVE module, role, viewport and exhaustive insurer verification
        shell: bash
        run: |
          set -u
          E="$RUNNER_TEMP/gravicentra-live-readonly-verification"
          mkdir -p "$E/public" "$E/matrix" "$E/aseguradoras" "$E/aseguradoras-role-contract"
          set +e
          I4A_PUBLIC_EVIDENCE_DIR="$E/public" node tools/gravicentra-i4a-public-browser.mjs
          PUBLIC_RC=$?
          I4B_EVIDENCE_DIR="$E/matrix" node tools/gravicentra-i4b-transversal-v2.mjs
          MATRIX_RC=$?
          GI_LIVE_VERIFY_EVIDENCE_DIR="$E/aseguradoras" node tools/gravicentra-live-readonly-verification-v1.mjs
          ASEG_RC=$?
          I4A_AUTH_EVIDENCE_DIR="$E/aseguradoras-role-contract" node tools/gravicentra-i4a-authenticated-browser-v2.mjs
          ASEG_ROLE_RC=$?
          set -e
          printf '{"schemaVersion":"gravicentra-live-readonly-summary-v2","sourceSha":"%s","buildId":"%s","productionUrl":"%s","publicRc":%s,"matrixRc":%s,"aseguradorasRc":%s,"aseguradorasRoleContractRc":%s,"operationalWritesExecuted":0,"augustDataTouched":false}\n' "$SOURCE_SHA" "$BUILD_ID" "$PRODUCTION_URL" "$PUBLIC_RC" "$MATRIX_RC" "$ASEG_RC" "$ASEG_ROLE_RC" > "$E/summary.json"
          test "$PUBLIC_RC" -eq 0
          test "$MATRIX_RC" -eq 0
          test "$ASEG_RC" -eq 0
          test "$ASEG_ROLE_RC" -eq 0

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-live-readonly-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/gravicentra-live-readonly-verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
