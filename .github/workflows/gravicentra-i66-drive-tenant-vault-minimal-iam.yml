name: Gravicentra I6.6 Production Drive Tenant Vault Minimal Access
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-drive-tenant-vault-minimal-iam.yml
permissions:
  contents: read
concurrency:
  group: gi-i66-drive-tenant-secret-setup
  cancel-in-progress: false
jobs:
  provision-exact-tenant-document-vault:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROJECT_ID: ays-orbit-360-lab
      VAULT: orbit360-drive-oauth-alianzas-soluciones
      DOCUMENT_RUNTIME_SA: orbit360-secrets-lab@ays-orbit-360-lab.iam.gserviceaccount.com
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact production lineage and scoped minimum-permission guard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const pointer=require('./artifacts/orbit360-recovery/release-control/I6_6_LATEST_EXACT_LIVE_POINTER_20261113.json');
          const backend=require('fs').readFileSync('./functions/document-drive-domain.js','utf8');
          assert.equal(pointer.currentLiveSourceSha,'586401bfbe1a80cfef2820982f432743af36b108');
          assert.equal(pointer.currentLiveHostingVersion,'sites/ays-orbit-360-lab/versions/1dd873081501d7fb');
          assert.equal(pointer.fullI66ProductionAccepted,false);
          assert.ok(backend.includes("const SERVICE_ACCOUNT = process.env.ORBIT360_SECRETS_SERVICE_ACCOUNT || 'orbit360-secrets-lab@ays-orbit-360-lab.iam.gserviceaccount.com'"));
          assert.ok(backend.includes("return (previewOnly===true?'orbit360-drive-oauth-preview-':'orbit360-drive-oauth-')+tenantId;"));
          assert.ok(backend.includes("const[v]=await secrets.accessSecretVersion({name:vaultLatest(tenantId,previewOnly)});"));
          console.log('DRIVE_MINIMAL_VAULT_IAM_EXACT_R9_AUTHORITY_READ_ONLY_GUARD_PASS');
          NODE
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Select pre-existing authorized project service account
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-drive-vault-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-drive-vault-auth'
          found=[]
          for i,k in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:v=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError):continue
              if v.get('type')=='service_account' and v.get('project_id')=='ays-orbit-360-lab' and v.get('private_key'):
                  f=root/f'{i}.json';f.write_text(json.dumps(v));f.chmod(0o600);found.append(str(f))
          if not found:raise SystemExit('DRIVE_VAULT_EXISTING_PROJECT_CREDENTIAL_UNAVAILABLE')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          selected=''
          while IFS= read -r candidate; do
            if gcloud auth activate-service-account --key-file="$candidate" --quiet >/dev/null 2>&1 &&
               gcloud secrets list --project "$PROJECT_ID" --limit=1 --format='value(name)' >/dev/null 2>&1; then
              selected="$candidate"; break
            fi
          done < "$RUNNER_TEMP/gi-drive-vault-auth/candidates"
          test -n "$selected" || { echo DRIVE_VAULT_SAME_PROJECT_AUTH_FAILED; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$selected" >> "$GITHUB_ENV"
          echo 'DRIVE_VAULT_SAME_PROJECT_ADMIN_SELECTED_NO_KEY_EXPOSURE'
      - name: Provision only missing empty tenant vault and exact secret-level IAM
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          if ! gcloud secrets describe "$VAULT" --project "$PROJECT_ID" --format='value(name)' >/dev/null 2>&1; then
            gcloud secrets create "$VAULT" --project "$PROJECT_ID" --replication-policy='automatic' \
              --labels='purpose=drive-documents,tenant=alianzas-soluciones' --quiet >/dev/null
            echo DRIVE_PRODUCTION_TENANT_EMPTY_VAULT_CREATED_NO_TOKEN_COPIED
          else
            echo DRIVE_PRODUCTION_TENANT_VAULT_PREEXISTED_PRESERVED
          fi
          versions="$(gcloud secrets versions list "$VAULT" --project "$PROJECT_ID" --format='value(name)' --limit=2)"
          test -z "$versions" || { echo DRIVE_PRODUCTION_TENANT_VAULT_ALREADY_HAS_VERSIONS_STOP_TO_PROTECT; exit 1; }
          for role in roles/secretmanager.viewer roles/secretmanager.secretAccessor roles/secretmanager.secretVersionAdder; do
            gcloud secrets add-iam-policy-binding "$VAULT" --project "$PROJECT_ID" \
              --member="serviceAccount:$DOCUMENT_RUNTIME_SA" --role="$role" --quiet >/dev/null
          done
          gcloud secrets get-iam-policy "$VAULT" --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/gi-drive-vault-iam-policy.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/gi-drive-vault-iam-policy.json'))
          target='serviceAccount:'+os.environ['DOCUMENT_RUNTIME_SA']
          allowed={'roles/secretmanager.viewer','roles/secretmanager.secretAccessor','roles/secretmanager.secretVersionAdder'}
          got={r.get('role') for r in x.get('bindings',[]) if target in r.get('members',[])}
          if not allowed.issubset(got):raise SystemExit('DRIVE_TENANT_RUNTIME_MINIMAL_SECRET_IAM_INCOMPLETE')
          print('DRIVE_TENANT_RUNTIME_SECRET_SCOPED_VIEW_ACCESS_ADD_VERIFIED')
          PY
          test -z "$(gcloud secrets versions list "$VAULT" --project "$PROJECT_ID" --format='value(name)' --limit=1)" ||
            { echo DRIVE_TENANT_VAULT_UNEXPECTED_TOKEN_AFTER_SETUP; exit 1; }
          echo 'DRIVE_TENANT_OAUTH_ADMIN_CONSENT_STILL_REQUIRED_NO_PRODUCTION_REFRESH_TOKEN_INSERTED'
