name: CotComp S4.54 W4 selection source-only readiness

on:
  push:
    branches:
      - ays/cotcomp-s454-w4-selection-readiness-20261001
    paths:
      - '.github/cotcomp-lab-intents/s454-w4-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s454-w4-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify S4.54 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s454-w4-sourceonly.json
          jq -e '
            .authorization=="S454_W4_SOURCE_ONLY_READINESS" and
            .projectId=="ays-orbit-360-lab" and
            .stage=="W4" and
            .appDataReads==false and
            .appDataWrites==false and
            .realData==false and
            .production==false and
            .physicalW4==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"
      - name: Run accumulated QA and S4.54 tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-w4-selection-readiness-s454.js
          node --check cotcomp-w4-selection-readiness-s454.test.js
          node --test cotcomp-w4-selection-readiness-s454.test.js
      - name: Build and enforce S4.54 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s454/evidence"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./functions/cotcomp-w4-selection-readiness-s454');
          const r=s.audit();
          const out={
            schemaVersion:'ays-cotcomp-s454-w4-readiness-receipt-v1.0',
            projectId:'ays-orbit-360-lab',stage:'W4',
            sourceReadinessAuditPass:r.sourceReadinessAuditPass,
            technicalW4Ready:r.technicalW4Ready,
            physicalW4Ready:r.physicalW4Ready,
            physicalW4Allowed:r.physicalW4Allowed,
            findings:r.findings,blockers:r.blockers,
            boundaries:{appDataReadsExecuted:0,appDataWritesExecuted:0,realDataTouched:false,productionTouched:false}
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s454/evidence/S454_W4_SELECTION_READINESS_RECEIPT.json',JSON.stringify(out,null,2));
          NODE
          R="$RUNNER_TEMP/s454/evidence/S454_W4_SELECTION_READINESS_RECEIPT.json"
          jq -e '
            .sourceReadinessAuditPass==true and
            .technicalW4Ready==false and .physicalW4Ready==false and .physicalW4Allowed==false and
            (.blockers|index("SELECTION_COMPARISONSET_MEMBERSHIP_REQUIRED"))!=null and
            (.blockers|index("SELECTION_PROPOSAL_CASE_LINK_REQUIRED"))!=null and
            (.blockers|index("SELECTION_CURRENT_ELIGIBLE_PROPOSAL_REQUIRED"))!=null and
            (.blockers|index("SELECTION_IDEMPOTENCY_CONTRACT_REQUIRED"))!=null and
            (.blockers|index("SELECTION_ATOMIC_CASE_PATCH_REQUIRED"))!=null and
            (.blockers|index("SELECTION_MULTI_DOCUMENT_DRYRUN_CONTRACT_REQUIRED"))!=null and
            (.blockers|index("W4_PHYSICAL_ROLLBACK_JOURNAL_REQUIRED"))!=null and
            (.blockers|index("OWNER_W4_AUTHORIZATION_REQUIRED"))!=null and
            .boundaries.appDataReadsExecuted==0 and .boundaries.appDataWritesExecuted==0
          ' "$R" >/dev/null
      - name: Upload S4.54 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s454-w4-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/s454/evidence/S454_W4_SELECTION_READINESS_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
