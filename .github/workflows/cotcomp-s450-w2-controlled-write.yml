name: CotComp S4.50 W2 LAB controlled-write proof

on:
  push:
    branches:
      - ays/cotcomp-s450-w2-controlled-write-20260930
    paths:
      - '.github/cotcomp-lab-intents/s450-w2-authorized.json'

permissions:
  contents: read
  actions: read

env:
  COTCOMP_PROJECT_ID: ays-orbit-360-lab
  COTCOMP_REGION: us-central1
  COTCOMP_TENANT_ID: alianzas-soluciones
  EXPECTED_OWNER_BLOB: 73e09a4404cb4298dc34c9c38e26ad1f960d3170
  COTCOMP_WEB_APP_ID: '1:646761409743:web:2ec4595ee9160f9d945bba'

jobs:
  s450-w2-controlled-write:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.50 authorization intent
        shell: bash
        run: |
          set -euo pipefail
          INTENT=.github/cotcomp-lab-intents/s450-w2-authorized.json
          jq -e '
            .authorization == "S450_W2_LAB_SYNTHETIC_CONTROLLED_WRITE" and
            .projectId == "ays-orbit-360-lab" and
            .tenantId == "alianzas-soluciones" and
            .storageMode == "legacyCompatible" and
            .syntheticOnly == true and
            .createBusiness == true and
            .createManagement == true and
            .exactJournalReadback == true and
            .retryNoDuplicate == true and
            .conflictDeny == true and
            .cleanupRequired == true and
            .finalAbsenceRequired == true and
            .realClientOrBusinessData == false and
            .providerDelivery == false and
            .production == false
          ' "$INTENT" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$INTENT")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$INTENT"

      - name: Run accumulated QA plus S4.50 tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-provider-isolation-s448.js
          node --check cotcomp-w2-controlled-proof-s450.js
          node --check cotcomp-w2-controlled-proof-s450.test.js
          node --test cotcomp-w2-controlled-proof-s450.test.js

      - name: Prepare exact LAB credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s450/evidence"
          SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB"
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB"; fi
          if [ -z "$SA" ]; then SA="$FIREBASE_SERVICE_ACCOUNT_FALLBACK"; fi
          test -n "$SA"
          CRED="$RUNNER_TEMP/s450/firebase-service-account.json"
          printf '%s' "$SA" > "$CRED"
          chmod 600 "$CRED"
          PROJECT="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).project_id||'')" "$CRED")"
          test "$PROJECT" = "$COTCOMP_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Install Firebase CLI and gcloud
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.32.0
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Authenticate exact LAB
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
          gcloud config set project "$COTCOMP_PROJECT_ID" >/dev/null
          test "$(gcloud config get-value project 2>/dev/null)" = "$COTCOMP_PROJECT_ID"

      - name: Re-verify physical owner and provider isolation immediately before W2
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/s450"
          EVID="$ROOT/evidence"
          DESC="$ROOT/owner.json"
          gcloud functions describe orbit360OpsLeadsCommand --gen2 --region "$COTCOMP_REGION" --project "$COTCOMP_PROJECT_ID" --format=json > "$DESC"
          BUCKET="$(jq -r '.buildConfig.source.storageSource.bucket // empty' "$DESC")"
          OBJECT="$(jq -r '.buildConfig.source.storageSource.object // empty' "$DESC")"
          GENERATION="$(jq -r '.buildConfig.source.storageSource.generation // empty' "$DESC")"
          ARCHIVE="$ROOT/source.bin"
          URI="gs://$BUCKET/$OBJECT"; if [ -n "$GENERATION" ]; then URI="$URI#$GENERATION"; fi
          if ! gcloud storage cp "$URI" "$ARCHIVE" >/dev/null 2>&1; then gsutil cp "$URI" "$ARCHIVE" >/dev/null; fi
          mkdir -p "$ROOT/source"
          unzip -q "$ARCHIVE" -d "$ROOT/source" 2>/dev/null || tar -xzf "$ARCHIVE" -C "$ROOT/source"
          OWNER_FILE="$(find "$ROOT/source" -type f -name 'ops-leads-domain.js' -print -quit)"
          test -n "$OWNER_FILE"
          git hash-object "$OWNER_FILE" > "$EVID/deployed-owner-blob.txt"
          test "$(cat "$EVID/deployed-owner-blob.txt")" = "$EXPECTED_OWNER_BLOB"

          TOKEN="$(gcloud auth print-access-token)"
          curl -sS -L -H "Authorization: Bearer $TOKEN"             "https://cloudfunctions.googleapis.com/v2/projects/$COTCOMP_PROJECT_ID/locations/-/functions?pageSize=1000"             -o "$EVID/functions-response.json"
          jq '.functions // []' "$EVID/functions-response.json" > "$EVID/functions-inventory.json"
          gcloud eventarc triggers list --location "$COTCOMP_REGION" --project "$COTCOMP_PROJECT_ID" --format=json > "$EVID/eventarc-triggers.json"

          OWNER_PATH="$OWNER_FILE" node <<'NODE'
          const fs=require('fs');
          const iso=require('./functions/cotcomp-provider-isolation-s448');
          const ownerSource=fs.readFileSync(process.env.OWNER_PATH,'utf8');
          const functions=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/s450/evidence/functions-inventory.json','utf8'));
          const eventarcTriggers=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/s450/evidence/eventarc-triggers.json','utf8'));
          const proof=iso.evaluate({
            projectId:'ays-orbit-360-lab',region:'us-central1',functionState:'ACTIVE',
            deployedOwnerBlob:iso.EXPECTED_OWNER_BLOB,ownerSource,
            functionsInventoryRead:true,eventarcInventoryRead:true,functions,eventarcTriggers,
            appDataReadsExecuted:0,appDataWritesExecuted:0,w2Executed:false,
            providerDeliveryExecuted:false,realDataTouched:false,productionTouched:false
          });
          if(!proof.providerDeliveryIsolationVerified) throw new Error('S450_PROVIDER_ISOLATION_NOT_VERIFIED:'+proof.blockers.join(','));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s450/evidence/provider-isolation-s450.json',JSON.stringify({
            verified:true,
            automaticOutboxConsumerDetected:proof.infrastructure.automaticOutboxConsumerDetected,
            outboxFunctionConsumerCount:proof.infrastructure.outboxFunctionConsumers.length,
            outboxEventarcConsumerCount:proof.infrastructure.outboxEventarcConsumers.length
          },null,2));
          NODE
          rm -rf "$ROOT/source" "$ARCHIVE" "$DESC" "$EVID/functions-response.json"

      - name: Resolve Firebase Web API key read-only
        shell: bash
        run: |
          set -euo pipefail
          firebase apps:sdkconfig WEB "$COTCOMP_WEB_APP_ID" --project "$COTCOMP_PROJECT_ID" --json > "$RUNNER_TEMP/s450/sdk.raw.json"
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/s450/sdk.raw.json','utf8'));
          let cfg=null;
          function walk(v){if(cfg||!v||typeof v!=='object')return;if(typeof v.apiKey==='string'&&v.projectId==='ays-orbit-360-lab'){cfg=v;return;}for(const x of Object.values(v))if(typeof x==='object')walk(x);}
          walk(raw); if(!cfg||!cfg.apiKey)throw new Error('S450_WEB_API_KEY_NOT_FOUND');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s450/api-key.secret',cfg.apiKey,{mode:0o600});
          NODE
          rm -f "$RUNNER_TEMP/s450/sdk.raw.json"

      - name: Execute authorized W2 synthetic controlled-write proof
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          export S450_PROOF_RUN_ID="s450-$GITHUB_RUN_ID"
          export S450_FIREBASE_WEB_API_KEY="$(cat "$RUNNER_TEMP/s450/api-key.secret")"
          node cotcomp-w2-controlled-proof-s450.js > "$RUNNER_TEMP/s450/evidence/S450_W2_PROOF_RECEIPT.json"
          jq -e '
            .projectId=="ays-orbit-360-lab" and
            .storageMode=="legacyCompatible" and
            .syntheticOnly==true and
            .firstCall.pass==true and
            .firstCall.createdDocuments==8 and
            .firstReadback.pass==true and
            .firstReadback.documentCount==8 and
            .retry.pass==true and .retry.writes==0 and .retry.duplicateCreated==false and
            .conflict.pass==true and .conflict.writes==0 and .conflict.conflictArtifactsCreated==0 and
            .providerDelivery.executed==false and
            .cleanup.pass==true and .cleanup.deletes==8 and
            .finalAbsence.pass==true and .finalAbsence.documentCount==0 and
            .writeAccounting.createWrites==8 and
            .writeAccounting.retryWrites==0 and
            .writeAccounting.conflictWrites==0 and
            .writeAccounting.deleteWrites==8 and
            .writeAccounting.netPersistentDocuments==0 and
            .boundaries.realClientOrBusinessDataTouched==false and
            .boundaries.productionTouched==false
          ' "$RUNNER_TEMP/s450/evidence/S450_W2_PROOF_RECEIPT.json" >/dev/null

      - name: Independent final-absence verification
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {getApps,initializeApp,applicationDefault}=require('firebase-admin/app');
          const {getFirestore}=require('firebase-admin/firestore');
          const receipt=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/s450/evidence/S450_W2_PROOF_RECEIPT.json','utf8'));
          const app=getApps()[0]||initializeApp({credential:applicationDefault(),projectId:'ays-orbit-360-lab'});
          const db=getFirestore(app);
          const ids=receipt.projection;
          const paths=[
            'tenantId/alianzas-soluciones/negocios/'+ids.businessId,
            'tenantId/alianzas-soluciones/gestiones/'+ids.managementId,
            'tenants/alianzas-soluciones/workflowEvents/'+ids.businessEventId,
            'tenants/alianzas-soluciones/workflowEvents/'+ids.managementEventId,
            'tenants/alianzas-soluciones/workflowRequests/'+ids.businessRequestId,
            'tenants/alianzas-soluciones/workflowRequests/'+ids.managementRequestId,
            'tenants/alianzas-soluciones/notificationOutbox/'+ids.businessEventId,
            'tenants/alianzas-soluciones/notificationOutbox/'+ids.managementEventId
          ];
          (async()=>{
            const snaps=await Promise.all(paths.map(p=>db.doc(p).get()));
            const absent=snaps.every(s=>!s.exists);
            const out={schemaVersion:'ays-cotcomp-s450-independent-final-absence-v1',checkedDocuments:8,allAbsent:absent,writesExecuted:0};
            fs.writeFileSync(process.env.RUNNER_TEMP+'/s450/evidence/S450_INDEPENDENT_FINAL_ABSENCE.json',JSON.stringify(out,null,2));
            if(!absent)process.exit(1);
          })().catch(()=>process.exit(1));
          NODE

      - name: Upload sanitized S4.50 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s450-w2-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s450/evidence/deployed-owner-blob.txt
            ${{ runner.temp }}/s450/evidence/provider-isolation-s450.json
            ${{ runner.temp }}/s450/evidence/S450_W2_PROOF_RECEIPT.json
            ${{ runner.temp }}/s450/evidence/S450_INDEPENDENT_FINAL_ABSENCE.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/s450/api-key.secret"
          rm -f "$RUNNER_TEMP/s450/firebase-service-account.json"
