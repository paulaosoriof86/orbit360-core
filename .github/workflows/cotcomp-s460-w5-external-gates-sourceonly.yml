name: CotComp S4.60 W5 external-gate package source-only

on:
  push:
    branches:
      - ays/cotcomp-s460-w5-external-gates-20261001
    paths:
      - '.github/cotcomp-lab-intents/s460-w5-external-gates-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s460-w5-external-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.60 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s460-w5-external-gates-sourceonly.json
          jq -e '
            .authorization=="S460_W5_SOURCE_ONLY_EXTERNAL_GATE_PACKAGE" and
            .projectId=="ays-orbit-360-lab" and
            .stage=="W5" and
            .appDataReads==false and
            .appDataWrites==false and
            .realData==false and
            .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA and S4.60 tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-w5-external-gates-s460.js
          node --check cotcomp-w5-external-gates-s460.test.js
          node --test cotcomp-w5-external-gates-s460.test.js

      - name: Build and enforce S4.60 receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s460/evidence"
          node <<'NODE'
          const fs=require('fs');
          const s=require('./functions/cotcomp-w5-external-gates-s460');
          const r=s.sourceReadiness();
          const out={
            schemaVersion:'ays-cotcomp-s460-w5-external-gates-receipt-v1.0',
            projectId:'ays-orbit-360-lab',
            stage:'W5',
            externalGatePackageReady:r.externalGatePackageReady,
            technicalW5Ready:r.technicalW5Ready,
            executionAllowed:r.executionAllowed,
            realDataAllowed:r.realDataAllowed,
            productionAllowed:r.productionAllowed,
            current:r.current,
            template:r.template,
            legalEvidenceRequirements:r.legalEvidenceRequirements,
            nextHumanInputs:r.nextHumanInputs,
            boundaries:{
              appDataReadsExecuted:0,
              appDataWritesExecuted:0,
              realDataTouched:false,
              productionTouched:false
            }
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s460/evidence/S460_W5_EXTERNAL_GATE_PACKAGE_RECEIPT.json',JSON.stringify(out,null,2));
          NODE
          R="$RUNNER_TEMP/s460/evidence/S460_W5_EXTERNAL_GATE_PACKAGE_RECEIPT.json"
          jq -e '
            .externalGatePackageReady==true and
            .technicalW5Ready==true and
            .executionAllowed==false and
            .realDataAllowed==false and
            .productionAllowed==false and
            .current.formalLegalValidationComplete==false and
            .current.exactPilotScopeComplete==false and
            .current.successDispositionChosen==false and
            .current.ownerW5RealDataAuthorization==false and
            .template.hardLocks.maxQuoteCases==1 and
            .template.hardLocks.maxDataSubjects==1 and
            .template.hardLocks.providerOrRaterCallsAllowed==false and
            .template.hardLocks.productionAllowed==false and
            .legalEvidenceRequirements.bothCountriesRequiredByCurrentFrozenContract==true and
            .legalEvidenceRequirements.publicResearchCannotSubstituteFormalCounselEvidence==true and
            .boundaries.appDataReadsExecuted==0 and
            .boundaries.appDataWritesExecuted==0 and
            .boundaries.realDataTouched==false and
            .boundaries.productionTouched==false
          ' "$R" >/dev/null

      - name: Upload S4.60 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s460-w5-external-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/s460/evidence/S460_W5_EXTERNAL_GATE_PACKAGE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
