name: Gravicentra I6.2 Service Account Identity

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-i62-service-account-identity.yml'

permissions:
  contents: read

env:
  PROJECT_ID: ays-orbit-360-lab

jobs:
  identity:
    runs-on: ubuntu-24.04
    env:
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
    steps:
      - name: Resolve existing service account identity only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          for (const k of ['SA_DEFAULT','SA_ORBIT360_LAB','SA_ORBIT_360_LAB']) {
            try {
              const x=JSON.parse(process.env[k]||'');
              if (x?.type==='service_account' && x?.project_id===process.env.PROJECT_ID && x?.client_email && x?.private_key) {
                console.log('I62_SERVICE_ACCOUNT_CLIENT_EMAIL='+x.client_email);
                console.log('I62_PRIVATE_KEY_EXPOSED=false');
                process.exit(0);
              }
            } catch {}
          }
          throw new Error('I62_EXISTING_SERVICE_ACCOUNT_NOT_AVAILABLE');
          NODE
