name: Gravicentra I6.2 One-Time Canonical Cursor Sync

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - '.github/workflows/gravicentra-i62-service-account-identity.yml'

permissions:
  contents: write

env:
  ACTUAL_SOURCE_SHA256: f2e57fa72ff1b94b110b5037038c6c47fbc727c513f9eebd2348d7f4f2244083
  CONTROL: artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json
  INTAKE: artifacts/orbit360-recovery/release-control/I6_2_DIRECTORIO_SOURCE_INTAKE_20260917.json
  REGISTRY: artifacts/orbit360-recovery/release-control/DATA_UPDATE_MECHANISM_REGISTRY.json

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/fase-a-clean-20260831
          fetch-depth: 0

      - name: Synchronize canonical source pin and resume cursor only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const sha=process.env.ACTUAL_SOURCE_SHA256;
          const C=JSON.parse(fs.readFileSync(process.env.CONTROL,'utf8'));
          const S=JSON.parse(fs.readFileSync(process.env.INTAKE,'utf8'));
          const R=JSON.parse(fs.readFileSync(process.env.REGISTRY,'utf8'));

          C.postproductionDataUpdateControl.sourceSha256=sha;
          C.postproductionDataUpdateControl.activeModule='ASEGURADORAS_OPERATIONAL_DIRECTORY';
          C.postproductionDataUpdateControl.executionCursor='LIVE_READBACK_PASS';
          C.postproductionDataUpdateControl.nextRequiredStep='DETERMINISTIC_DIFF';

          S.schema='GRAVICENTRA_I6_2_DIRECTORIO_SOURCE_INTAKE_V3';
          S.source.sha256=sha;
          S.source.bytes=444455;
          S.reason='Current user-supplied workbook physically fingerprinted in the active execution environment and canonically repinned for Evergreen V5 delta-first execution.';
          S.execution={
            method:'DATA_UPDATE_DELTA_FIRST',
            cursorState:'LIVE_READBACK_PASS',
            writeApplied:false,
            readbackPassed:true,
            readbackRunId:35230577501,
            readbackDocumentCount:30,
            readbackWritesExecuted:0,
            liveVisualConfirmed:false,
            nextRequiredStep:'DETERMINISTIC_DIFF'
          };
          S.guards={
            doNotUsePriorHashAsCurrent:true,
            approvedWriteMechanismAlreadyVerified:true,
            doNotRepeatReadbackWithoutConcreteDrift:true,
            doNotRediscoverMechanismWithoutConcreteDrift:true,
            doNotClaimPassBeforeWriteReadbackIntegrityAndLiveVisualConfirmation:true
          };

          const M=R.modules.ASEGURADORAS_OPERATIONAL_DIRECTORY;
          M.sourceState='CURRENT_SOURCE_REPINNED_AND_LIVE_READBACK_PASS';
          M.nextMaterialStep='DETERMINISTIC_DIFF_AGAINST_CURRENT_PINNED_SOURCE_USING_APPROVED_WRITE_CHAIN';
          M.resumeCursor='LIVE_READBACK_PASS';
          M.doNotRepeat=['LIVE_READBACK_ALREADY_PASS','APPROVED_WRITE_MECHANISM_VERIFICATION_ALREADY_PASS','GENERAL_LINEAGE_OR_ARCHITECTURE_DIAGNOSIS'];

          fs.writeFileSync(process.env.CONTROL,JSON.stringify(C,null,2)+'\n');
          fs.writeFileSync(process.env.INTAKE,JSON.stringify(S,null,2)+'\n');
          fs.writeFileSync(process.env.REGISTRY,JSON.stringify(R,null,2)+'\n');
          NODE

      - name: Commit canonical cursor synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'paulaosoriof86'
          git config user.email 'paula.osorio.f86@gmail.com'
          git add "$CONTROL" "$INTAKE" "$REGISTRY"
          git diff --cached --quiet && exit 0
          git commit -m 'ops: pin I6.2 source and freeze resume cursor at deterministic diff'
          git push origin HEAD:recovery/fase-a-clean-20260831
