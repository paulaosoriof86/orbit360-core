# I6.6 canonical operational successor: three existing synthetic-only Preview callables,
# extracted from the EXACT immutable Hosting Preview artifact. Never LIVE.
name: Gravicentra I6.6 Five Role Exact Backend Preview And Signed Carlos UAT
on:
  workflow_dispatch:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-privileged-role-exact-preview-three-functions
  cancel-in-progress: false
jobs:
  phase:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.phase.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read canonical Preview phase without credentials or mutations
        id: phase
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
          const authorized=c.status==='OPERATIONAL_BACKEND_PREVIEW_AUTHORIZED';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'authorized='+String(authorized)+'\n');
          console.log(authorized?'I66_OPERATIONAL_PREVIEW_PHASE_READY_FOR_STRICT_GATES':'I66_OPERATIONAL_PREVIEW_PHASE_NOOP');
          NODE
  exact-preview-only:
    needs: phase
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831' && needs.phase.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PROJECT_ID: ays-orbit-360-lab
      GH_TOKEN: ${{ github.token }}
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove owner-scoped Preview authorization, immutable artifact and sealed source
        run: |
          set -euo pipefail
          node --test tools/gravicentra-i6-6-operational-release-candidate.test.cjs
          node --test tools/gravicentra-i6-6-preview-candidate-binding.test.cjs
          node --test tools/gravicentra-i6-6-direction-preview-i66-consent-scope.test.cjs
          node --test tools/gravicentra-i6-6-technical-preview-rollover.test.cjs
          node --test tools/gravicentra-i6-6-advisor-payables-signed-uat.test.cjs tools/gravicentra-i6-6-finance-ui-diagnostics.test.cjs
          node --test tools/gravicentra-i6-6-advisor-browser-observability.test.cjs
          node --test tools/gravicentra-i6-6-assignment-detail-navigation.test.cjs tools/gravicentra-i6-6-direction-preview-qa-navigation-retry.test.cjs tools/gravicentra-i6-6-preview-current-live-restore-47f4.test.cjs
          node --test tools/gravicentra-i6-6-proposal-uat-diagnostics.test.cjs tools/gravicentra-i6-6-direction-preview-proposal-diagnostic-retry.test.cjs tools/gravicentra-i6-6-preview-current-live-restore-39f54e2.test.cjs
          node tools/gravicentra-i6-6-operational-release-candidate.cjs preview
          node tools/gravicentra-i6-6-delta-guard.mjs > "$RUNNER_TEMP/i66-role-delta-guard.log"
          node --test tools/gravicentra-i6-6-privileged-role-portfolio-parity.test.cjs tools/gravicentra-i6-6-privileged-role-writer-transaction.test.cjs
      - name: Read back the exact immutable Hosting Preview source
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$I66_PREVIEW_ORIGIN/__recovery__/build.json" > "$RUNNER_TEMP/i66-role-preview-build.json"
          node - <<'NODE'
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const p=g.candidateForPhase(require('./'+g.CONTROL),'preview');
          const b=require(process.env.RUNNER_TEMP+'/i66-role-preview-build.json');
          g.validateBuildMarker(p,b);
          console.log('I66_ROLE_PREVIEW_HOSTING_EXACT_SOURCE_READBACK_PASS');
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACT_ID }}
          run-id: ${{ env.SOURCE_PACKAGE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gi-role-artifact
      - name: Prove exact immutable backend bytes and prepare isolated Firebase config
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/gi-role-artifact"
          mapfile -t TARS < <(find "$DL" -maxdepth 3 -type f -name 'gi-i66-exact-package.tar.gz')
          mapfile -t SUMS < <(find "$DL" -maxdepth 3 -type f -name 'gi-i66-exact-package.sha256')
          test "${#TARS[@]}" -eq 1 && test "${#SUMS[@]}" -eq 1
          TAR="${TARS[0]}";SUM="${SUMS[0]}"
          test "$(dirname "$TAR")" = "$(dirname "$SUM")"
          test "$(sha256sum "$TAR" | awk '{print $1}')" = "$(awk '{print $1}' "$SUM")"
          FROOT="$RUNNER_TEMP/gi-role-preview-only"
          mkdir -p "$FROOT"
          tar -xzf "$TAR" -C "$FROOT" --no-same-owner
          export I66_PACKAGE_ROOT="$FROOT"
          (cd "$FROOT/bundle/site" && sha256sum --check --quiet "$FROOT/evidence/site-manifest.sha256")
          node - <<'NODE'
          const fs=require('node:fs'),g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const p=g.candidateForPhase(require('./'+g.CONTROL),'preview');
          const hosted=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i66-role-preview-build.json','utf8'));
          const packaged=JSON.parse(fs.readFileSync(process.env.I66_PACKAGE_ROOT+'/bundle/site/__recovery__/build.json','utf8'));
          g.validateBuildMarker(p,hosted,packaged);
          console.log('I66_PREVIEW_HOSTED_MARKER_EQUALS_EXACT_ARTIFACT_MARKER_PASS');
          NODE
          BACKEND="$FROOT/bundle/backend"
          (cd "$BACKEND" && sha256sum --check --quiet "$FROOT/evidence/backend-manifest.sha256")
          for p in b4-003-scoped-access-boundary.js b4-003-scoped-related-reader.js product-operational-domain.js product-ops-leads-domain.js cobros-reconciliation-domain.js advisor-commission-payable-contract.js advisor-assignment-correction-contract.js proposal-application-boundary.js payment-inference-engine.js i66-conciliaciones-active-ledger-projection.js;do
            git show "$SOURCE_SHA:functions/$p" > "$RUNNER_TEMP/i66-source-$p"
            cmp "$RUNNER_TEMP/i66-source-$p" "$BACKEND/$p"
          done
          test -f "$BACKEND/index.js"
          node --check "$BACKEND/index.js"
          test -f "$BACKEND/package-lock.json"
          (cd "$BACKEND" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"bundle/backend","runtime":"nodejs22"}}\n' > "$FROOT/firebase.functions-transport.json"
          echo "I66_PACKAGE_ROOT=$FROOT" >> "$GITHUB_ENV"
          echo "I66_ROLE_PREVIEW_FIREBASE_CONFIG=$FROOT/firebase.functions-transport.json" >> "$GITHUB_ENV"
          echo 'I66_ROLE_EXACT_IMMUTABLE_BACKEND_BYTES_MATCH_CERTIFIED_PREVIEW_ARTIFACT_PASS'
      - name: Resolve existing LAB credentials and preserve LIVE hosting fingerprints
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-role-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-role-auth'
          found=[]
          for n,k in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:v=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError):continue
              if v.get('type')=='service_account' and v.get('project_id')==os.environ['PROJECT_ID'] and v.get('private_key'):
                  p=root/f'{n}.json';p.write_text(json.dumps(v));p.chmod(0o600);found.append(str(p))
          if not found:raise SystemExit('I66_PREVIEW_CONFIGURED_LAB_CREDENTIAL_MISSING')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-role-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-role-cli"
          CLI="$RUNNER_TEMP/gi-role-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r p;do
            if GOOGLE_APPLICATION_CREDENTIALS="$p" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-role-functions-before.json" 2>/dev/null;then selected="$p";break;fi
          done < "$RUNNER_TEMP/gi-role-auth/candidates"
          test -n "$selected"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$selected" >> "$GITHUB_ENV"
          echo "I66_ROLE_FIREBASE_CLI=$CLI" >> "$GITHUB_ENV"
          for o in https://ays-orbit-360-lab.web.app https://app.aysseguros.com;do
            curl -fsSL --max-time 30 "$o/" | sha256sum
          done > "$RUNNER_TEMP/gi-role-live-before.sha"
      - name: Verify exact three preexisting Preview callables then deploy only those
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const a=require(process.env.RUNNER_TEMP+'/gi-role-functions-before.json');
          const rows=Array.isArray(a.result)?a.result:Array.isArray(a)?a:[];
          const id=r=>String(r.entryPoint||r.id||r.name||'').split('/').pop();
          for(const {name:n,region} of require('./tools/gravicentra-i6-6-operational-release-candidate.cjs').TARGETS.preview){
            const found=rows.filter(r=>id(r)===n);assert.equal(found.length,1,'I66_PREVIEW_EXISTING_FUNCTION_NOT_UNIQUE_'+n);
            assert.equal(String(found[0].region||found[0].location||''),region);
          }
          console.log('I66_ONLY_THREE_PREEXISTING_EXACT_REGION_PREVIEW_CALLABLES_ALLOWED_PASS');
          NODE
          node "$I66_ROLE_FIREBASE_CLI" deploy \
            --only functions:orbit360ProductOperationalCommandPreview,functions:orbit360CobrosReconciliationCommandPreview,functions:orbit360ScopedPolicyReadPreview \
            --config "$I66_ROLE_PREVIEW_FIREBASE_CONFIG" --project "$PROJECT_ID" --non-interactive
          node "$I66_ROLE_FIREBASE_CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-role-functions-after.json"
          node - <<'NODE'
          const assert=require('node:assert/strict'),a=require(process.env.RUNNER_TEMP+'/gi-role-functions-before.json'),b=require(process.env.RUNNER_TEMP+'/gi-role-functions-after.json');
          const rows=x=>Array.isArray(x.result)?x.result:Array.isArray(x)?x:[];
          const id=x=>String(x.entryPoint||x.id||x.name||'').split('/').pop();
          assert.deepEqual(rows(a).map(id).sort(),rows(b).map(id).sort(),'I66_PREVIEW_OTHER_FUNCTION_INVENTORY_CHANGED');
          const targets=new Set(require('./tools/gravicentra-i6-6-operational-release-candidate.cjs').TARGETS.preview.map(x=>x.name));
          const untouched=x=>rows(x).filter(r=>!targets.has(id(r))).sort((l,r)=>id(l).localeCompare(id(r)));
          assert.deepEqual(untouched(a),untouched(b),'I66_PREVIEW_NON_TARGET_BACKEND_CHANGED');
          console.log('I66_EXACT_THREE_BACKEND_PREVIEW_FUNCTIONS_DEPLOYED_INVENTORY_READBACK_PASS');
          NODE
          for o in https://ays-orbit-360-lab.web.app https://app.aysseguros.com;do
            curl -fsSL --max-time 30 "$o/" | sha256sum
          done > "$RUNNER_TEMP/gi-role-live-after.sha"
          cmp "$RUNNER_TEMP/gi-role-live-before.sha" "$RUNNER_TEMP/gi-role-live-after.sha"
          echo 'I66_PREVIEW_BACKEND_ONLY_ZERO_LIVE_HOSTING_CHANGES_PASS'
      - name: Signed Carlos and Paula real-auth synthetic CRUD, durable readback, reload and restore
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
          node tools/gravicentra-i66-privileged-role-signed-ui-permissions-readonly.cjs
          node tools/gravicentra-i6-6-carlos-real-signed-synthetic-preview-uat.cjs
          node tools/gravicentra-i6-6-advisor-payables-signed-uat.cjs
          node tools/gravicentra-i6-6-proposal-application-signed-uat.cjs
          echo 'I66_ROLE_PREVIEW_SIGNED_CARLOS_PAULA_SYNTHETIC_FUNCTIONAL_UAT_PASS_ZERO_REAL_CUSTOMER_WRITES'
      - name: Seal source-artifact-specific signed Preview evidence
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const g=require('./tools/gravicentra-i6-6-operational-release-candidate.cjs');
          const p=g.candidateForPhase(require('./'+g.CONTROL),'preview');
          const receipt={schema:'I6_6_OPERATIONAL_SIGNED_PREVIEW_PROOF_V1',
            status:'SIGNED_DRIVERS_DURABLE_READBACK_RELOAD_RESTORE_PASS',
            ...Object.fromEntries(['sourceSha','buildRunId','artifactId','artifactDigest','previewUrl','previewChannelId'].map(k=>[k,p[k]])),
            ...(p.buildId===undefined?{}:{buildId:p.buildId}),
            targets:g.TARGETS.preview,signedDrivers:g.DRIVERS,realFinancialOrCustomerWrites:0,
            syntheticRestoreComplete:true,liveHostingUnchanged:true,liveBackendUnchanged:true,
            focusedReports:g.focusedReportsFromDisk(p,'PREVIEW'),
            runId:Number(process.env.GITHUB_RUN_ID),headSha:process.env.GITHUB_SHA};
          g.validateProof(p,receipt);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/i66-operational-preview-proof.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Preserve exact Preview receipt for the LIVE authorization
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-operational-preview-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/i66-operational-preview-proof.json
            ${{ runner.temp }}/gravicentra-i66-advisor-payables-signed-uat-preview.json
            ${{ env.I66_PACKAGE_ROOT }}/evidence/i66-proposal-application-signed-uat-preview.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve sanitized failure diagnostics without an acceptance proof
        if: failure()
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const {safeFinanceUiDiagnostics,safeLegalFailureSubstage}=require('./tools/gravicentra-i6-6-advisor-payables-signed-uat.cjs');
          const candidates=[
            path.join(process.env.RUNNER_TEMP,'gravicentra-i66-advisor-payables-signed-uat-preview.json'),
            process.env.I66_PACKAGE_ROOT?path.join(process.env.I66_PACKAGE_ROOT,'evidence','i66-proposal-application-signed-uat-preview.json'):null
          ].filter(Boolean);
          const safe={schema:'I6_6_PREVIEW_DIAGNOSTIC_ONLY_V1',status:'FAILED_NOT_ACCEPTED',runId:Number(process.env.GITHUB_RUN_ID),sourceSha:process.env.SOURCE_SHA||null,reports:[]};
          const keys=['status','phase','failureStage','failureCheck','failureLine','failureClass'];
          for(const file of candidates){
            if(!fs.existsSync(file))continue;
            const r=JSON.parse(fs.readFileSync(file,'utf8')),out={};
            if(path.basename(file)==='i66-proposal-application-signed-uat-preview.json'){
              const {safeProposalDiagnosticReport}=require('./tools/gravicentra-i6-6-proposal-uat-diagnostics.cjs');
              safe.reports.push(safeProposalDiagnosticReport(r));continue;
            }
            for(const k of keys){const v=r[k];if(typeof v==='number'&&Number.isSafeInteger(v))out[k]=v;else if(typeof v==='string'&&/^[A-Za-z0-9_.:-]{1,160}$/.test(v))out[k]=v;}
            const legalSubstage=safeLegalFailureSubstage(r.failureLegalSubstage);
            if(r.failureStage==='DIRECTION_LEGAL_ACCEPTANCE'&&legalSubstage)out.failureLegalSubstage=legalSubstage;
            const location=r.failureLocation;
            if(location?.file==='gravicentra-i6-6-advisor-payables-signed-uat.cjs'&&Number.isSafeInteger(location.line)&&location.line>0&&Number.isSafeInteger(location.column)&&location.column>0)
              out.failureLocation={file:location.file,line:location.line,column:location.column};
            if(r.financeUiDiagnostics)out.financeUiDiagnostics=safeFinanceUiDiagnostics(r.financeUiDiagnostics);
            out.checks=Array.isArray(r.checks)?r.checks.length:0;
            if(r.cleanup){out.cleanupStatus=['PASS','HOLD'].includes(r.cleanup.status)?r.cleanup.status:'UNKNOWN';out.remaining=Number.isSafeInteger(r.cleanup.remaining)?r.cleanup.remaining:null;}
            safe.reports.push(out);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'i66-preview-failure-diagnostic.json'),JSON.stringify(safe,null,2)+'\n');
          NODE
      - name: Upload diagnostics only - never authorizes LIVE
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-preview-failure-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/i66-preview-failure-diagnostic.json
          retention-days: 30
          if-no-files-found: error
