name: Orbit 360 · Preparar gate matriz visual corregida · una vez

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    types: [opened]

permissions:
  contents: write

concurrency:
  group: orbit360-prepare-visual-matrix-corrected-gate-v20260805
  cancel-in-progress: false

jobs:
  prepare-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout transporte exclusivo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar y persistir gate 2.7.8 source-only
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='ays/backend-tenant-lab-v99-20260703'
          WORKFLOW='.github/workflows/orbit360-prepare-visual-matrix-corrected-gate-once-v20260805.yml'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$WORKFLOW"
          git fetch origin "$BRANCH"
          git checkout --detach "origin/$BRANCH"
          node --check tools/orbit360-prepare-visual-matrix-corrected-post-auth-gate-v20260805.mjs
          node tools/orbit360-prepare-visual-matrix-corrected-post-auth-gate-v20260805.mjs
          jq -e '.status=="PASS_GATE_REGISTRATION" and .contractVersion=="2.7.8" and .failed==0 and .ok==true and .secretsRead==false and .browserExecuted==false and .deployExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-gate-registration-sanitized-v20260805.json >/dev/null
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-visual-matrix-corrected-post-auth-lab-v20260805.mjs
          node --check tools/orbit360-seal-visual-matrix-corrected-post-auth-runtime-v20260805.mjs
          git diff --check
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add \
            tools/orbit360-validar-gate-contracts-v20260717.mjs \
            tools/orbit360-validar-gate-contracts-engine-visual-matrix-corrected-post-auth-lab-v20260805.mjs \
            tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json \
            tools/orbit360-preflight-visual-matrix-corrected-post-auth-once-v20260805.sh \
            tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v20260805.sh \
            tools/orbit360-seal-visual-matrix-corrected-post-auth-runtime-v20260805.mjs \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-gate-registration-sanitized-v20260805.json \
            orbit360-platform/docs/PLAN-UNICO-SALIDA-RC-AYS-LAB-CANONICA-01-20260804.md \
            orbit360-platform/docs/ACADEMIA-GATE-MATRIZ-VISUAL-CORREGIDA-POST-AUTH-20260805.md
          test -n "$(git diff --cached --name-only)"
          git commit -m 'source: register corrected post-auth visual matrix gate 2.7.8 [skip ci]'
          git push origin "HEAD:$BRANCH"
