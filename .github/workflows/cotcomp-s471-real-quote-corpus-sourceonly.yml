name: CotComp S4.71 real quote corpus source-only

on:
  push:
    branches:
      - ays/cotcomp-s471-quote-corpus-sourceonly-20261002
    paths:
      - '.github/cotcomp-lab-intents/s471-real-quote-corpus-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  corpus-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s471-real-quote-corpus-sourceonly.json
          jq -e '
            .authorization=="S471_REAL_QUOTE_CORPUS_SOURCEONLY" and
            .appDataReads==false and .appDataWrites==false and .realData==false and
            .providerOrRater==false and .production==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"
      - name: Run accumulated QA plus quote corpus tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-real-quote-corpus-s471.js
          node --check cotcomp-real-quote-corpus-s471.test.js
          node --test cotcomp-real-quote-corpus-s471.test.js
      - name: Write sanitized receipt
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s471corpus"
          node <<'NODE'
          const fs=require('fs');const c=require('./cotcomp-real-quote-corpus-s471');const s=c.summary();
          if(s.clusters!==5||s.sourceDocuments!==16||s.uniqueInsurers!==10||s.currentW5Clusters!==1)throw new Error('S471_CORPUS_SUMMARY_INVALID');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/s471corpus/S471_REAL_QUOTE_CORPUS_RECEIPT.json',JSON.stringify({
            schemaVersion:'ays-cotcomp-s471-real-quote-corpus-receipt-v1.0',
            sourceSha:process.env.GITHUB_SHA,
            clusters:s.clusters,sourceDocuments:s.sourceDocuments,alternatives:s.alternatives,uniqueInsurers:s.uniqueInsurers,
            currentW5Clusters:s.currentW5Clusters,motorcycleSourceDocuments:s.motorcycleSourceDocuments,
            missingPremiumSources:s.missingPremiumSources,ambiguousPlanLabelSources:s.ambiguousPlanLabelSources,
            appDataReads:0,appDataWrites:0,realDataTouched:false,providerOrRaterCalls:0,productionTouched:false
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s471-real-quote-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/s471corpus/S471_REAL_QUOTE_CORPUS_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
