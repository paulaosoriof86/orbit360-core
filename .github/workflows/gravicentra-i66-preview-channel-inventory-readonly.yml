# Read-only inventory to resolve Firebase Hosting's confirmed HTTP 429 channel quota.
# Never deletes, creates, deploys or changes Hosting versions, Firestore or Auth.
# I6.6 2026-11-15: read exact 02463 candidate and R11 LIVE identities after signed Finance tab timeout; zero mutations.
name: Gravicentra I6.6 Preview Channels Inventory READONLY
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-preview-channel-inventory-readonly.yml
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROJECT_ID: ays-orbit-360-lab
      SITE_ID: ays-orbit-360-lab
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select existing project credentials and pinned CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-channels-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-channels-auth'
          candidates=[]
          for n,k in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:v=json.loads(os.environ.get(k,''))
              except (ValueError,TypeError):continue
              if v.get('type')=='service_account' and v.get('project_id')==os.environ['PROJECT_ID'] and v.get('private_key'):
                  p=root/f'{n}.json';p.write_text(json.dumps(v));p.chmod(0o600);candidates.append(str(p))
          if not candidates:raise SystemExit('I66_CHANNELS_AUTH_HOLD')
          (root/'candidates').write_text('\n'.join(candidates)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/gi-channels-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/gi-channels-cli"
          CLI="$RUNNER_TEMP/gi-channels-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          selected=''
          while IFS= read -r c; do
            if GOOGLE_APPLICATION_CREDENTIALS="$c" node "$CLI" apps:list WEB --project "$PROJECT_ID" --non-interactive --json >/dev/null 2>&1; then selected="$c";break;fi
          done < "$RUNNER_TEMP/gi-channels-auth/candidates"
          test -n "$selected"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$selected" >> "$GITHUB_ENV"
          echo "CLI=$CLI" >> "$GITHUB_ENV"
      - name: List Hosting channel metadata only without any mutations
        run: |
          set -euo pipefail
          node "$CLI" hosting:channel:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/gi-channels.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const json=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gi-channels.json','utf8'));
          const data=json.result||json;
          const values=Array.isArray(data)?data:Array.isArray(data.channels)?data.channels:[];
          if(!Array.isArray(values)||!values.length)throw Error('I66_CHANNEL_LIST_UNEXPECTED_OR_EMPTY');
          const output=values.map(c=>({
            id:String(c.channelId||c.name||'').split('/').pop(),
            expireTime:String(c.expireTime||c.expirationTime||''),
            createTime:String(c.createTime||''),
            releaseTime:String(c.release?.releaseTime||c.updateTime||''),
            releaseVersionId:String(c.release?.version?.name||'').split('/').pop()
          })).sort((a,b)=>a.id.localeCompare(b.id));
          console.log('I66_PREVIEW_CHANNEL_INVENTORY_READONLY total='+output.length+' i66='+output.filter(x=>x.id.startsWith('gi-i66-')).length);
          for(const c of output)console.log('I66_HOSTING_CHANNEL_METADATA '+JSON.stringify(c));
          console.log('I66_HOSTING_CHANNEL_MUTATIONS=0');
          NODE
      - name: Read current Preview and both LIVE build identities without changing their versions
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const root='artifacts/orbit360-recovery/release-control/';
          const plan=JSON.parse(fs.readFileSync(root+'I6_6_OPERATIONAL_CONTINUATION_20261115.json','utf8'));
          const transport=JSON.parse(fs.readFileSync(root+'I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json','utf8'));
          const preview=transport.previewChannelReuseAuthorization.expectedPreviewUrl;
          assert.equal(preview,'https://ays-orbit-360-lab--gi-i66-rc-42868854629-abj14q6n.web.app');
          const targets=[
            {name:'PREVIEW',origin:preview,source:plan.currentEvidenceBoundaries.failedPreviewSource},
            {name:'LIVE_FIREBASE',origin:'https://ays-orbit-360-lab.web.app',source:plan.lastProvenLive.sourceSha},
            {name:'LIVE_DOMAIN',origin:'https://app.aysseguros.com',source:plan.lastProvenLive.sourceSha}
          ];
          (async()=>{
            const results=await Promise.all(targets.map(async target=>{
              assert.match(target.source,/^[0-9a-f]{40}$/);
              const response=await fetch(target.origin+'/__recovery__/build.json',{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
              assert.equal(response.ok,true,'I66_CURRENT_BUILD_MARKER_HTTP_'+target.name);
              const marker=await response.json();
              assert.equal(marker.sourceSha,target.source,'I66_CURRENT_BUILD_MARKER_SOURCE_DRIFT_'+target.name);
              assert.equal(marker.gate,'I6.6','I66_CURRENT_BUILD_MARKER_GATE_DRIFT_'+target.name);
              assert.match(String(marker.buildId||''),/^gi-i66-[0-9a-f]{12}-[0-9a-f]{12}$/);
              return {target:target.name,sourceSha:marker.sourceSha,buildId:marker.buildId,gate:marker.gate};
            }));
            for(const result of results)console.log('I66_CURRENT_HOSTING_BUILD_IDENTITY '+JSON.stringify(result));
            console.log('I66_CURRENT_PREVIEW_AND_DUAL_LIVE_IDENTITY_READONLY_PASS');
          })().catch(()=>{console.error('I66_CURRENT_HOSTING_BUILD_IDENTITY_READONLY_HOLD');process.exitCode=1;});
          NODE
# I6.6 2026-11-16: refresh read-only inventory after signed immutable build 44009981499 returned Firebase 429.
