name: Orbit 360 · M5 runtime package 5.0.36
run-name: M5 5.0.36 · immutable runtime package · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-runtime-package-trigger-536-v20260729.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-package-536-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: 401f87b148048f85db3f4956474258c51c29e2c9e7c9a59e52f425d491ab89e7

jobs:
  package:
    name: M5 · runtime package 5.0.36 · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar rama y ejecución única
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preflight canónico cerrado 5.0.35
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="M5_HOSTING_535_CLOSED_27_OF_27_READY_TO_REQUEST_RUNTIME_AUTHORIZATION" and .contractVersion=="5.0.35" and .failed==0 and .executionAuthorized==false and .allowedExecutions==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==44 and .remoteAssetsExpected==27 and .remoteAssetsMatched==27 and .mismatchCount==0 and .remoteParity==true and .runtimeSmokeAuthorized==false and .allowedRuntimeExecutions==0 and .runtimeRequestCreated==false and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Validar contrato runtime 5.0.36
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-m5-runtime-smoke-536-contract-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-536-browser-adapter-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-536-close-v20260729.mjs
          node tools/orbit360-m5-runtime-smoke-536-contract-v20260729.mjs
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_536_CONTRACT_PASS" and .failed==0 and .passed==.total and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==44 and .remoteAssetsExpected==27 and .remoteAssetsMatched==27 and .remoteParity==true and .legacyProbeBlobSha=="70d6ad22553bd0387fa08dd2eeeb6e3b9834fa12" and .policyBlobSha=="fa4c29d30a82673a7bf2d3d55efce52eaf4cccf3" and .secrets==false and .firestoreRead==false and .runtime==false and .browser==false and .deploy==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-536-contract-summary.json" >/dev/null
      - name: Confirmar paridad pública 27/27
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-534-v20260729.mjs
          cp "$ORBIT360_EVIDENCE_DIR/m5-release-candidate-readiness-534-summary.json" "$ORBIT360_EVIDENCE_DIR/m5-runtime-readiness-536-package.json"
          jq -e '.ok==true and .status=="M5_RC_534_READY_FOR_RUNTIME_AFTER_HOSTING" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==44 and .remoteLab.assetsExpected==27 and .remoteLab.assetsChecked==27 and .remoteLab.assetsMatched==27 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-readiness-536-package.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-package-536-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-536-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-readiness-536-package.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          CONTRACT: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-536-contract-summary.json
          READY: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-readiness-536-package.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 runtime 5.0.36 package failed';
            try{const c=JSON.parse(fs.readFileSync(process.env.CONTRACT,'utf8'));const r=JSON.parse(fs.readFileSync(process.env.READY,'utf8'));if(c.ok===true&&c.status==='M5_RUNTIME_SMOKE_536_CONTRACT_PASS'&&r.status==='M5_RC_534_READY_FOR_RUNTIME_AFTER_HOSTING'&&r.remoteLab?.assetsMatched===27){state='success';description='M5 runtime 5.0.36 package PASS; RC 27/27';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-package-536',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
