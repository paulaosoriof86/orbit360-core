name: Orbit360 sourcecheck v23 native Block1 matrix

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-validar-gate-contracts-v20260717.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-v23-native-v20260807.mjs'
      - 'tools/orbit360-event-driven-render-observer-v23.mjs'
      - 'tools/orbit360-block1-native-matrix-v23-v20260807.mjs'
      - 'tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs'
      - 'tools/orbit360-adjudicate-block1-universe-readonly-v23-v20260807.mjs'
      - 'tools/orbit360-test-v23-native-block1-source-v20260807.mjs'
      - 'tools/orbit360-gate-contract-block1-v23-native-v20260807.json'
      - 'tools/orbit360-validator-lifecycle-block1-v23-native-v20260807.json'
      - 'tools/orbit360-preflight-block1-v23-native-v20260807.mjs'
      - 'tools/orbit360-block1-v23-browser-precheck-v20260807.mjs'
      - 'tools/orbit360-close-block1-v23-runtime-v20260807.mjs'
      - 'tools/orbit360-run-block1-v23-runtime-signal-safe-v20260807.sh'
      - '.github/workflows/orbit360-sourcecheck-v23-native-block1-v20260807.yml'
      - '.github/workflows/orbit360-registered-relay-v23-native-block1-v20260807.yml'
      - 'orbit360-platform/docs/CIERRE-SOURCEFIX-V23-NATIVE-BLOCK1-20260807.md'
      - 'orbit360-platform/docs/ACADEMIA-ACTUALIZACION-V23-NATIVE-BLOCK1-20260807.md'
      - 'orbit360-platform/docs/CLAUDE-ACUMULADO-V23-NATIVE-BLOCK1-20260807.md'
      - 'orbit360-platform/runtime-gate-crm-v20260716/v23-native-block1-source-sanitized-v20260807.json'

permissions:
  contents: read

concurrency:
  group: orbit360-sourcecheck-v23-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  source-v23-native-block1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact v23 source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact authorization base and frozen product
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BASE='ef9e0e1e738ce407025ed159067d8b3cc4d2683b'
          REQUEST='.github/orbit360-requests/block1-client360-insurers-v23-authorization.json'
          [[ '${{ github.event.pull_request.base.sha }}' == "$AUTH_BASE" ]] || { echo 'STOP_V23_SOURCE_BASE_MISMATCH'; exit 41; }
          git merge-base --is-ancestor "$AUTH_BASE" '${{ github.event.pull_request.head.sha }}'
          [[ ! -e "$REQUEST" ]] || { echo 'STOP_V23_REQUEST_EXISTS_BEFORE_SOURCE_PASS'; exit 41; }
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json','utf8'));
          if (!(r.requestVersion==='20260807.21-two-phase-runtime' && r.consumed===true && r.authorizationFrozen===true && r.allowedExecutions===0 && r.replayAllowed===false)) process.exit(41);
          console.log('PASS_V21_REQUEST_FROZEN_BEFORE_V23');
          NODE
          mapfile -t changed < <(git diff --name-only "$AUTH_BASE"...'${{ github.event.pull_request.head.sha }}')
          protected=(
            'orbit360-platform/modules/cliente360.js'
            'orbit360-platform/modules/polizas.js'
            'orbit360-platform/modules/cobros.js'
            'orbit360-platform/core/visual-runtime-rootfix-v20260805.js'
            'orbit360-platform/data/store.js'
            'orbit360-platform/data/store-firestore-lab.local.js'
            'orbit360-platform/core/auth.js'
            'orbit360-platform/core/importa.js'
            'orbit360-platform/firestore.rules'
          )
          for p in "${protected[@]}"; do
            if printf '%s\n' "${changed[@]}" | grep -Fxq "$p"; then
              echo "STOP_V23_FROZEN_OR_PROTECTED_FILE_CHANGED:$p"
              exit 41
            fi
          done
          echo 'PASS_V23_PRODUCT_AND_PROTECTED_BACKEND_FROZEN'

      - name: Validate exact native runtime files
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block1-v23-native-v20260807.mjs
          node --check tools/orbit360-event-driven-render-observer-v23.mjs
          node --check tools/orbit360-block1-native-matrix-v23-v20260807.mjs
          node --check tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs
          node --check tools/orbit360-adjudicate-block1-universe-readonly-v23-v20260807.mjs
          node --check tools/orbit360-test-v23-native-block1-source-v20260807.mjs
          node --check tools/orbit360-preflight-block1-v23-native-v20260807.mjs
          node --check tools/orbit360-block1-v23-browser-precheck-v20260807.mjs
          node --check tools/orbit360-close-block1-v23-runtime-v20260807.mjs
          bash -n tools/orbit360-run-block1-v23-runtime-signal-safe-v20260807.sh
          ORBIT360_MATRIX_ARTIFACT_VALIDATE_ONLY=1 node tools/orbit360-block1-native-matrix-v23-canonical-v20260807.mjs
          ORBIT360_PRECHECK_VALIDATE_ONLY=1 node tools/orbit360-block1-v23-browser-precheck-v20260807.mjs
          node tools/orbit360-test-v23-native-block1-source-v20260807.mjs

      - name: Mandatory canonical Block1 preflight plus v23 source overlay
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          node tools/orbit360-preflight-block1-v23-native-v20260807.mjs source

      - name: Governing signal and portability suites
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-runtime-transport-base-sha-v20260806.mjs

      - name: Assert source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e '.github/orbit360-requests/block1-client360-insurers-v23-authorization.json' ]]
          echo 'PASS_V23_SOURCE_ONLY_NO_SECRETS_FIREBASE_HOSTING_REAL_BROWSER_WRITES'
