name: Orbit 360 · Auth autoadministrable y contraseñas temporales

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/auth-selfmanaged-credentials-runtime-*.json'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-auth-selfmanaged-credentials-runtime-v20260805
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block-auth-selfmanaged-credentials-runtime-v20260805
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-auth-selfmanaged-credentials-runtime-v20260805.json
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_MAX_ACTIVE_TEAM_USERS: '100'
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_FINAL_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-credentials-runtime-final-sanitized-v20260805.json
  ORBIT360_CLOSURE: orbit360-platform/docs/CIERRE-AUTH-SELFMANAGED-CREDENTIALS-RUNTIME-20260805.md

jobs:
  auth-selfmanaged-credentials:
    name: Gate → datos → Auth N/N → contraseñas → UI LAB
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout request exacto con historia completa
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar request único, nuevo e inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          REQUEST_FILE="${CHANGED[0]}"
          case "$REQUEST_FILE" in
            .github/orbit360-requests/auth-selfmanaged-credentials-runtime-*.json) ;;
            *) echo 'PIPELINE_MECHANISM_FAILURE:UNEXPECTED_REQUEST_PATH' >&2; exit 41 ;;
          esac
          echo "ORBIT360_REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-auth-selfmanaged-credentials-runtime-request-v1" and
            .gateId=="block-auth-selfmanaged-credentials-runtime-v20260805" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and .status=="AUTHORIZED_ONCE" and
            .approved==true and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and .parentHead==$parent and
            .scope.completeFourIdentityRecords==true and .scope.dynamicAllActiveUsers==true and
            .scope.assignTemporaryPasswordPattern==true and .scope.forceChangeOnFirstLogin==true and
            .scope.verifyPasswordLoginForEveryActiveUser==true and
            .scope.enableAdminNameEmailPasswordManagement==true and
            .scope.deployOnlyOnboardingFunction==true and .scope.deployLabHostingForCredentialUi==true and
            .scope.crmSnapshotIntegrity==true and
            .scope.syntheticUsers==false and .scope.passwordsInRepository==false and
            .scope.passwordsInEvidence==false and .scope.currentPasswordRetrieval==false and
            .scope.otherFunctions==false and .scope.rules==false and .scope.reimport==false and
            .scope.crmWrites==false and .scope.production==false and .scope.main==false and .scope.merge==false
          ' "$REQUEST_FILE" >/dev/null

      - name: Ejecutar owner source-only con ledger
        id: source_owner
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-selfmanaged-source-stage-owner-v20260805.mjs

      - name: Gate canónico antes de secretos
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg run "$GITHUB_RUN_ID" '
            .runId==$run and .status=="pass" and .classification=="SOURCE_ONLY_ROOTFIX_PASS" and
            .staleEvidenceInvalidated==true and .secretsRead==false and .firebaseExecuted==false and
            .firestoreWrites==0 and .authWrites==0 and .deploys==0 and .productionTouched==false and
            ([.steps[].status] | all(.=="pass"))
          ' "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-source-stage-ledger-sanitized-v20260805.json" >/dev/null
          jq -e '
            .status=="GO_GATE_CONTRACT" and .contractVersion=="13.9.0" and .failed==0 and .ok==true and
            .executionAuthorized==true and .secretAccessAuthorized==true and
            .firestoreReadAuthorized==true and .writeAuthorized==true and .authWriteAuthorized==true and
            .runtimeAuthorized==true and .functionsDeployAuthorized==true and
            .allowedFunctions==["orbit360ProvisionTeamAccess"] and
            .hostingDeployAuthorized==true and .hostingTarget=="ays-orbit-360-lab" and .hostingDeploysMaximum==1 and
            .rulesDeployAuthorized==false and .productionAuthorized==false and
            .identityOverridesRequired==4 and .activeUserCountMode=="DYNAMIC_AT_RUNTIME" and
            .temporaryPasswordPolicy=="FIRST_NAME_123_STAR" and .forceChangeOnFirstLogin==true and
            .currentPasswordReadable==false and .passwordRollbackExact==false and .failureContainmentRequired==true and
            .dataAccess==false and .secretAccess==false and .firestoreReads==0 and .firestoreWrites==0 and
            .authReads==0 and .authWrites==0 and .runtimeExecuted==false and .deployExecuted==false
          ' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Persistir source fix y gate antes del runtime
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add \
            tools/orbit360-validar-gate-contracts-v20260717.mjs \
            functions/user-onboarding.js \
            orbit360-platform/core/access-role-session-owner-v20260728.js \
            orbit360-platform/index.html \
            "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" \
            "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-source-stage-ledger-sanitized-v20260805.json"
          if ! git diff --cached --quiet; then
            git commit -m 'auth: enable self-managed credentials [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Resolver credencial LAB
        env:
          SA1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA1:-${SA2:-${SA3:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY="$RUNNER_TEMP/orbit360-auth-selfmanaged-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY"
          chmod 600 "$KEY"
          test "$(jq -r '.project_id // empty' "$KEY")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY" >> "$GITHUB_ENV"
          echo "ORBIT360_AUTH_DYNAMIC_PRIVATE_STATE=$RUNNER_TEMP/orbit360-auth-dynamic-team-private.json" >> "$GITHUB_ENV"
          echo "ORBIT360_AUTH_CREDENTIAL_PRIVATE_STATE=$RUNNER_TEMP/orbit360-auth-selfmanaged-private.json" >> "$GITHUB_ENV"

      - name: Instalar runtime reproducible
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 firebase-tools@15.25.1 >/dev/null
          npm --prefix functions ci --include=prod
          node --check functions/user-onboarding.js
          node --check functions/user-credential-selfservice.js
          node --check tools/orbit360-auth-foundation-dynamic-team-runtime-v20260805.mjs
          node --check tools/orbit360-auth-selfmanaged-credentials-runtime-v20260805.mjs

      - name: Resolver API web sin exponerla
        shell: bash
        run: |
          set -euo pipefail
          npx firebase apps:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/firebase-apps.json"
          APP_ID="$(node - "$RUNNER_TEMP/firebase-apps.json" <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const found=[];
          const walk=v=>{if(!v)return;if(Array.isArray(v))return v.forEach(walk);if(typeof v==='object'){const p=String(v.platform||v.platformId||v.type||'').toUpperCase();const id=String(v.appId||v.app_id||'');if(p==='WEB'&&id)found.push(id);Object.values(v).forEach(walk);}};
          walk(data);if(!found.length)process.exit(2);process.stdout.write(found[0]);
          NODE
          )"
          npx firebase apps:sdkconfig WEB "$APP_ID" --project "$ORBIT360_PROJECT_ID" > "$RUNNER_TEMP/firebase-web-config.txt"
          API_KEY="$(node - "$RUNNER_TEMP/firebase-web-config.txt" <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.argv[2],'utf8');let key='';
          try{const data=JSON.parse(s);const walk=v=>{if(!v||key)return;if(Array.isArray(v))return v.forEach(walk);if(typeof v==='object'){if(typeof v.apiKey==='string')key=v.apiKey;else Object.values(v).forEach(walk);}};walk(data);}catch{}
          if(!key){const m=s.match(/apiKey\s*[:=]\s*["']([^"']+)["']/);if(m)key=m[1];}if(!key)process.exit(3);process.stdout.write(key);
          NODE
          )"
          echo "::add-mask::$API_KEY"
          echo "ORBIT360_FIREBASE_WEB_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: Planificar corrección de los cuatro datos de identidad
        id: identity_plan
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-selfmanaged-credentials-runtime-v20260805.mjs plan
          jq -e '.stage=="AUTH_SELFMANAGED_IDENTITY_PLAN_PASS" and .ok==true and .overridesPlanned==4 and .countriesResolved==4 and .firestoreWrites==0 and .authWrites==0' "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-identity-plan-sanitized-v20260805.json" >/dev/null

      - name: Aplicar datos autorizados en Equipo
        id: identity_apply
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-selfmanaged-credentials-runtime-v20260805.mjs apply
          jq -e '.stage=="AUTH_SELFMANAGED_IDENTITY_APPLY_PASS" and .ok==true and .overridesWritten==4 and .transactionStrategy=="READ_ALL_VALIDATE_ALL_WRITE_ALL"' "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-identity-apply-sanitized-v20260805.json" >/dev/null

      - name: Desplegar exclusivamente onboarding actualizado
        id: function_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx firebase deploy --project "$ORBIT360_PROJECT_ID" --only "functions:orbit360ProvisionTeamAccess" --non-interactive --force
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Desplegar UI de credenciales únicamente en Hosting LAB
        id: hosting_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx firebase deploy --project "$ORBIT360_PROJECT_ID" --only hosting --non-interactive
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Censo dinámico de todos los usuarios activos válidos
        id: census
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-foundation-dynamic-team-runtime-v20260805.mjs census
          jq -e '.stage=="AUTH_DYNAMIC_TEAM_CENSUS_PASS" and .ok==true and .activeUsersObserved>=1 and .plannedMembershipReconciliations==.activeUsersObserved and .plannedTeamLinks==.activeUsersObserved' "$ORBIT360_EVIDENCE_DIR/auth-dynamic-team-census-sanitized-v20260805.json" >/dev/null

      - name: Aplicar Fundación Auth dinámica
        id: foundation_apply
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-foundation-dynamic-team-runtime-v20260805.mjs apply
          jq -e '.stage=="AUTH_DYNAMIC_TEAM_APPLY_PASS" and .ok==true and (.authUsersCreated + .authUsersLinked)==.activeUsers and .membershipWrites<=.activeUsers and .teamWrites<=.activeUsers' "$ORBIT360_EVIDENCE_DIR/auth-dynamic-team-apply-sanitized-v20260805.json" >/dev/null

      - name: Verificar sesiones por membership antes de rotar contraseñas
        id: membership_sessions
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-foundation-dynamic-team-runtime-v20260805.mjs sessions
          jq -e '.stage=="AUTH_DYNAMIC_TEAM_SESSIONS_PASS" and .ok==true and .sessionsVerified==.activeUsers' "$ORBIT360_EVIDENCE_DIR/auth-dynamic-team-sessions-sanitized-v20260805.json" >/dev/null

      - name: Asignar y verificar contraseñas temporales
        id: passwords
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-selfmanaged-credentials-runtime-v20260805.mjs passwords
          jq -e '.stage=="AUTH_SELFMANAGED_PASSWORDS_PASS" and .ok==true and .passwordsAssigned==.activeUsers and .passwordLoginsVerified==.activeUsers and .membershipsFlagged==.activeUsers and .teamRecordsFlagged==.activeUsers and .plaintextPasswordsPersisted==0' "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-passwords-sanitized-v20260805.json" >/dev/null

      - name: Verificar autoadministración e integridad final
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-auth-selfmanaged-credentials-runtime-v20260805.mjs verify
          jq -e '.stage=="AUTH_SELFMANAGED_CREDENTIALS_RUNTIME_PASS" and .ok==true and .activeUsers>=1 and .identitiesVerified==.activeUsers and .membershipsVerified==.activeUsers and .teamLinksVerified==.activeUsers and .forcedPasswordChangesVerified==.activeUsers and .passwordLoginsVerified==.activeUsers and .sourceReady==true and .crmIntegrity=="VERIFIED_UNCHANGED" and .adminCanReplaceTemporaryPassword==true and .userCanChangeOwnPassword==true and .emailAndNameSyncSupported==true' "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-final-verify-sanitized-v20260805.json" >/dev/null

      - name: Rollback reversible antes de contraseña
        if: always() && steps.foundation_apply.outcome == 'success' && steps.passwords.outcome == 'skipped' && steps.verify.outcome != 'success'
        id: rollback
        shell: bash
        run: node tools/orbit360-auth-foundation-dynamic-team-runtime-v20260805.mjs rollback

      - name: Contener cualquier fallo posterior a la rotación
        if: always() && steps.passwords.outcome != 'skipped' && steps.verify.outcome != 'success'
        id: containment
        shell: bash
        run: node tools/orbit360-auth-selfmanaged-credentials-containment-v20260805.mjs

      - name: Sellar evidencia final del run actual y consumir autorización
        if: always()
        shell: bash
        env:
          FUNCTION_DEPLOYED: ${{ steps.function_deploy.outputs.deployed }}
          HOSTING_DEPLOYED: ${{ steps.hosting_deploy.outputs.deployed }}
          CONTAINMENT_OUTCOME: ${{ steps.containment.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: node tools/orbit360-auth-selfmanaged-final-sealer-v20260805.mjs

      - name: Persistir evidencia y lifecycle sin tocar request
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          CANDIDATES=(
            tools/orbit360-validator-lifecycle-contract-auth-selfmanaged-credentials-runtime-v20260805.json
            "$ORBIT360_FINAL_EVIDENCE"
            "$ORBIT360_CLOSURE"
            "$ORBIT360_EVIDENCE_DIR/auth-selfmanaged-source-stage-ledger-sanitized-v20260805.json"
          )
          FILES=()
          for file in "${CANDIDATES[@]}" "$ORBIT360_EVIDENCE_DIR"/auth-selfmanaged-*-sanitized-v20260805.json "$ORBIT360_EVIDENCE_DIR"/auth-dynamic-team-*-sanitized-v20260805.json; do
            [ -f "$file" ] && FILES+=("$file")
          done
          test "${#FILES[@]}" -ge 4
          git add "${FILES[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'auth: persist self-managed credential runtime result [skip ci]'
            git push origin "HEAD:$ORBIT360_BRANCH"
          fi

      - name: Publicar artefacto sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-selfmanaged-credentials-runtime-sanitized
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/auth-selfmanaged-*-sanitized-v20260805.json
            orbit360-platform/runtime-gate-crm-v20260716/auth-dynamic-team-*-sanitized-v20260805.json
            orbit360-platform/docs/CIERRE-AUTH-SELFMANAGED-CREDENTIALS-RUNTIME-20260805.md
          if-no-files-found: warn
          retention-days: 14

      - name: Comentar cierre sanitizado en PR 5
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const p=process.env.ORBIT360_FINAL_EVIDENCE;
            const e=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{stage:'STOP_RETRY_EVIDENCE_MISSING',classification:'PIPELINE_MECHANISM_FAILURE',activeUsers:0,ok:false};
            const body=`## Auth autoadministrable — ${e.ok?'PASS':'STOP_RETRY'}\n\n\`\`\`text\n${e.stage}\n${e.classification}\nusuarios: ${e.activeUsers||0}\nidentidades: ${e.identitiesVerified||0}/${e.activeUsers||0}\nmemberships: ${e.membershipsVerified||0}/${e.activeUsers||0}\ncontraseñas: ${e.temporaryPasswordsAssigned||0}/${e.activeUsers||0}\nlogins: ${e.passwordLoginsVerified||0}/${e.activeUsers||0}\ncambio obligatorio: ${e.forcedPasswordChangesVerified||0}/${e.activeUsers||0}\nCRM: ${e.crmIntegrity||'NOT_POSTVERIFIED'}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:5,body});

      - name: Exigir PASS final
        if: always()
        shell: bash
        run: jq -e '.ok==true and .stage=="AUTH_SELFMANAGED_CREDENTIALS_RUNTIME_PASS" and .currentRunLedgerVerified==true and .activeUsers>=1 and .identitiesVerified==.activeUsers and .membershipsVerified==.activeUsers and .teamLinksVerified==.activeUsers and .temporaryPasswordsAssigned==.activeUsers and .passwordLoginsVerified==.activeUsers and .forcedPasswordChangesVerified==.activeUsers and .adminCanReplaceTemporaryPassword==true and .userCanChangeOwnPassword==true and .emailAndNameSyncSupported==true and .crmIntegrity=="VERIFIED_UNCHANGED" and .functionDeploys==1 and .hostingDeploys==1' "$ORBIT360_FINAL_EVIDENCE" >/dev/null
