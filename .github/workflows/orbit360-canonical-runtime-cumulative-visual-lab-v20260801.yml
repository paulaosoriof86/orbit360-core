name: Orbit 360 · Runtime canónico · revisión visual acumulativa LAB
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-canonical-runtime-cumulative-visual-lab-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block7-canonical-runtime-cumulative-visual-lab-v20260801
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json
  ORBIT360_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-v20260801.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  validate:
    name: Runtime canónico · Dirección, Operativo y Asesor · read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización y límites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-canonical-runtime-cumulative-visual-lab-request-v1" and .gateId=="block7-canonical-runtime-cumulative-visual-lab-v20260801" and .contractVersion=="7.11.0" and .approved==true and .allowedExecutions==1 and .consumed==false and .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and .canonicalSnapshotDigest=="19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b" and .scope.exactCheckoutLocalServe==true and .scope.snapshotBeforeAfter==true and .scope.browserWriteGuard==true and .scope.roles==3 and .scope.viewports==3 and .scope.routes==3 and .scope.sanitizedScreenshots==true and .scope.singleCumulativeVisualReview==true and .identity.existingOnly==true and .identity.createUser==false and .identity.updateUser==false and .identity.customTokenEphemeral==true and .capabilities.secrets==true and .capabilities.firestoreRead==true and .capabilities.writes==false and .capabilities.runtime==true and .capabilities.browser==true and .capabilities.deploy==false and .capabilities.production==false' "$ORBIT360_REQUEST_FILE" >/dev/null
          jq -e '.status=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_AUTHORIZED" and .executionProfile.phase=="LAB_RUNTIME_GATE" and .authorization.allowedExecutions==1 and .authorization.consumed==false and .guards.firestoreDataWritesAllowed==false and .guards.operationalWritesAllowed==0 and .guards.reimportAllowed==false and .guards.hostingDeployAllowed==false and .guards.previewDeployAllowed==false and .guards.productionAllowed==false' "$ORBIT360_LIFECYCLE_FILE" >/dev/null
      - name: Gate canónico antes de secrets, Firestore y navegador
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-canonical-runtime-cumulative-visual-lab-v20260801.mjs
          node --check tools/orbit360-preparar-identidad-browser-canonica-readonly-v20260801.mjs
          node --check tools/orbit360-validar-canonical-runtime-cumulative-visual-lab-v20260801.mjs
          node --check tools/orbit360-validar-legal-deferred-order-gate711-v20260802.mjs
          node --check tools/orbit360-validar-authorization-binding-gate711-v20260802.mjs
          node tools/orbit360-validar-authorization-binding-gate711-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_AUTHORIZATION_BINDING_STATIC_PASS" and .classification=="GO_STATIC_AUTHORIZATION_BINDING" and .failed==0 and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false' "$EVIDENCE_DIR/gate711-authorization-binding-static-v20260802.json" >/dev/null
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_READY" and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .runtimeAuthorized==true and .browserAuthorized==true and .previewAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .failed==0 and .operationalWrites==0 and .authorizationBinding.lifecycleRefPresent==true and .authorizationBinding.requestMatchesLifecycle==true' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node tools/orbit360-validar-legal-deferred-order-gate711-v20260802.mjs
          jq -e '.ok==true and .status=="GATE711_LEGAL_DEFERRED_ORDER_STATIC_PASS" and .classification=="GO_STATIC_LEGAL_DEFERRED_ORDER" and .failed==0 and .productFilesChanged==0 and .dataFilesChanged==0 and .firestoreReads==0 and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false' "$EVIDENCE_DIR/gate711-legal-deferred-order-static-v20260802.json" >/dev/null
      - name: Instalar dependencias controladas
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 firebase@11 google-auth-library@9 playwright@1.52.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Resolver identidad de servicio LAB
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-canonical-runtime-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_PROJECT_ID=$ORBIT360_PROJECT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_TENANT_ID=$ORBIT360_TENANT_ID" >> "$GITHUB_ENV"
      - name: Derivar web config e identidad existente
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/orbit360-canonical-browser-token.txt"
          CONFIG_FILE="$GITHUB_WORKSPACE/orbit360-platform/core/auth-firebase.config.local.js"
          node tools/orbit360-preparar-identidad-browser-canonica-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="CANONICAL_BROWSER_EXISTING_IDENTITY_READY" and .classification=="GO_LAB_EXISTING_IDENTITY_READONLY" and .projectId=="ays-orbit-360-lab" and .tenantId=="alianzas-soluciones" and .eligibleExistingIdentityCount==1 and .uidMatched==true and .emailMatched==true and .customTokenCreatedEphemeral==true and .authWrites==0 and .firestoreWrites==0 and .operationalWrites==0 and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/canonical-browser-identity-readonly-v20260801.json" >/dev/null
          test -s "$TOKEN_FILE"
          test -s "$CONFIG_FILE"
          echo "ORBIT360_CUSTOM_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_LOCAL_FIREBASE_CONFIG_FILE=$CONFIG_FILE" >> "$GITHUB_ENV"
      - name: Snapshot canónico inicial
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-revalidar-policies-full-canonical-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="POLICIES_FULL_CANONICAL_REVALIDATION_READONLY_PASS" and .digests.canonicalDigestSealed=="19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b" and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" >/dev/null
          cp "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" "$EVIDENCE_DIR/canonical-runtime-before-v20260801.json"
      - name: Servir checkout exacto sin deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory orbit360-platform >"$RUNNER_TEMP/orbit360-http.log" 2>&1 &
          SERVER_PID=$!
          echo "ORBIT360_SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173/index.html" >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS "http://127.0.0.1:4173/index.html" >/dev/null
          echo "ORBIT360_BASE_URL=http://127.0.0.1:4173/index.html?orbitBackend=firestore-lab&tenant=alianzas-soluciones#/inicio" >> "$GITHUB_ENV"
      - name: Ejecutar runtime y revisión visual acumulativa
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-canonical-runtime-cumulative-visual-lab-v20260801.mjs
          jq -e '.ok==true and .status=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_PASS" and .classification=="GO_LAB_CANONICAL_RUNTIME_CUMULATIVE_VISUAL" and .authMode=="existing_custom_token_readonly" and .checks.existingIdentity==true and .checks.legalOneClick==true and .checks.legalSettledBeforeWriteGuard==true and .checks.storeContract==true and .checks.dataset==true and .checks.seedExclusion==true and .checks.validationPreserved==true and .checks.bridgeOwner==true and .checks.roles==true and .checks.responsive==true and .checks.routes==true and .checks.noTechnicalCopy==true and .checks.writeGuard==true and .checks.sanitizedScreenshots==true and .dataset.operational.clientes==430 and .dataset.operational.aseguradoras==30 and .dataset.operational.polizas==1373 and .dataset.operational.vehiculos==1032 and .dataset.operational.recibosEsperados==1294 and .dataset.operational.carteraPrimas==673 and .dataset.operational.cobros==5 and ((.store.apiMissing|length)==0) and .store.singleReadOwner==true and .store.canonicalReadModel==true and ((.writeGuard.calls|length)==0) and ((.browserDiagnostics.pageErrors|length)==0) and ((.screenshots|length)>=10) and .firestoreWrites==0 and .operationalWrites==0 and .reimportExecuted==false and .hostingDeploy==false and .previewDeploy==false and .production==false and .containsPII==false and .containsDocumentIds==false and .containsValues==false and .containsSecrets==false' "$EVIDENCE_DIR/canonical-runtime-cumulative-visual-lab-v20260801.json" >/dev/null
      - name: Snapshot canónico final y comparación
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-revalidar-policies-full-canonical-readonly-v20260801.mjs
          jq -e '.ok==true and .status=="POLICIES_FULL_CANONICAL_REVALIDATION_READONLY_PASS" and .digests.canonicalDigestSealed=="19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b" and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" >/dev/null
          cp "$EVIDENCE_DIR/policies-full-canonical-revalidation-readonly-v20260801.json" "$EVIDENCE_DIR/canonical-runtime-after-v20260801.json"
          BEFORE_SOURCE="$(jq -r '.digests.sourceSnapshotDigest' "$EVIDENCE_DIR/canonical-runtime-before-v20260801.json")"
          AFTER_SOURCE="$(jq -r '.digests.sourceSnapshotDigest' "$EVIDENCE_DIR/canonical-runtime-after-v20260801.json")"
          BEFORE_TARGET="$(jq -r '.digests.targetSnapshotDigest' "$EVIDENCE_DIR/canonical-runtime-before-v20260801.json")"
          AFTER_TARGET="$(jq -r '.digests.targetSnapshotDigest' "$EVIDENCE_DIR/canonical-runtime-after-v20260801.json")"
          test "$BEFORE_SOURCE" = "$AFTER_SOURCE"
          test "$BEFORE_TARGET" = "$AFTER_TARGET"
          test "$AFTER_TARGET" = '19e1927d39f6b713ee12504f8762bc42ead9de6e365bb0f12162d2a0c8f8469b'
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-canonical-runtime-cumulative-visual-lab-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-authorization-binding-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/gate711-legal-deferred-order-static-v20260802.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-browser-identity-readonly-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-before-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-cumulative-visual-lab-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-after-v20260801.json
            orbit360-platform/runtime-gate-crm-v20260716/visual-sanitized-v20260801/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/canonical-runtime-cumulative-visual-lab-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Canonical cumulative runtime/visual gate failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_PASS'&&p.firestoreWrites===0&&p.writeGuard?.calls?.length===0){state='success';description='Canonical runtime and cumulative visual review PASS; zero writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/canonical-runtime-cumulative-visual-lab',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Limpiar material efímero
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_SERVER_PID:-}" ]; then kill "$ORBIT360_SERVER_PID" 2>/dev/null || true; fi
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
          if [ -n "${ORBIT360_CUSTOM_TOKEN_FILE:-}" ] && [ -f "$ORBIT360_CUSTOM_TOKEN_FILE" ]; then shred -u "$ORBIT360_CUSTOM_TOKEN_FILE" || rm -f "$ORBIT360_CUSTOM_TOKEN_FILE"; fi
          rm -f orbit360-platform/core/auth-firebase.config.local.js
