name: Orbit 360 · Matriz visual post-Auth · runtime v7 una vez

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - tools/orbit360-runtime-v7-trigger-20260806.txt

permissions:
  contents: write

concurrency:
  group: orbit360-visual-matrix-runtime-v7-once
  cancel-in-progress: false

jobs:
  visual-matrix-runtime-v7:
    if: github.event.pull_request.head.ref == 'ays/runtime-visual-matrix-v7-once-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ORBIT360_CANONICAL_BRANCH: ays/backend-tenant-lab-v99-20260703
      ORBIT360_VISUAL_REQUEST_PATH: .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json
      ORBIT360_REQUEST_FILE: .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json
      ORBIT360_RESTORE_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-v7-prior-hosting-restore-sanitized-v20260806.json
      ORBIT360_FINAL_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-final-sanitized-v20260805.json
      ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json

    steps:
      - name: Checkout immutable request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate immutable request and source package
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='ays/backend-tenant-lab-v99-20260703'
          REQUEST='.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json'
          test "$GITHUB_BASE_REF" = "$BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.base.sha }}'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-visual-matrix-corrected-post-auth-request-v1" and
            .requestVersion=="20260806.7-direct-runtime-recovery" and
            .status=="AUTHORIZED_ONCE" and .approved==true and
            .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .parentHead==$parent and
            .scope.restorePriorV6BackupBeforeRuntime==true and
            .scope.restorePriorV6BackupChannel=="visual-matrix-corrected-backup-31116830824" and
            .scope.hostingDeploysMaximum==1 and
            .scope.functionsDeploy==false and .scope.rulesDeploy==false and
            .scope.firestoreWrites==false and .scope.authWrites==false and
            .scope.operationalWrites==false and .scope.reimport==false and
            .scope.production==false and .scope.main==false and .scope.merge==false
          ' "$REQUEST" >/dev/null
          bash -n tools/orbit360-preflight-visual-matrix-corrected-post-auth-once-v20260805.sh
          bash -n tools/orbit360-restore-visual-matrix-v6-backup-before-runtime-v20260806.sh
          bash -n tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v3-cross-runner-v20260806.sh
          node --check tools/orbit360-attach-visual-matrix-v7-restore-evidence-v20260806.mjs
          node tools/orbit360-test-windows-signal-compatibility-synthetic-v20260806.mjs
          node tools/orbit360-test-visual-matrix-timeout-signal-safe-portable-v20260806.mjs
          node tools/orbit360-test-visual-matrix-cross-runner-portable-v20260806.mjs

      - name: GO_GATE_CONTRACT before secrets
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          bash tools/orbit360-preflight-visual-matrix-corrected-post-auth-once-v20260805.sh
          OUT='orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-preflight-sanitized-v20260805.json'
          jq -e '
            .status=="GO_GATE_CONTRACT" and .contractVersion=="2.7.8" and
            .failed==0 and .ok==true and
            .executionAuthorized==true and .secretAccessAuthorized==true and
            .firestoreReadAuthorized==true and .writeAuthorized==false and
            .runtimeAuthorized==true and .browserAuthorized==true and
            .hostingDeployAuthorized==true and .hostingDeploysMaximum==1 and
            .functionsDeployAuthorized==false and .rulesDeployAuthorized==false and
            .productionAuthorized==false and
            .secretAccess==false and .runtimeExecuted==false and
            .browserExecuted==false and .deployExecuted==false
          ' "$OUT" >/dev/null
          echo 'go=true' >> "$GITHUB_OUTPUT"

      - name: Install restore transport after GO
        if: steps.preflight.outputs.go == 'true'
        shell: bash
        run: npm install --no-save --package-lock=false firebase-tools@15.25.1 >/dev/null

      - name: Restore authorized v6 Hosting LAB backup
        if: steps.preflight.outputs.go == 'true'
        id: restore
        shell: bash
        env:
          ORBIT360_RUNTIME_EXECUTION_AUTHORIZED: 'true'
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: bash tools/orbit360-restore-visual-matrix-v6-backup-before-runtime-v20260806.sh

      - name: Execute backup, one Hosting LAB deploy and supervised matrix
        if: steps.restore.outcome == 'success'
        id: runtime
        shell: bash
        env:
          ORBIT360_RUNTIME_EXECUTION_AUTHORIZED: 'true'
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: bash tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v3-cross-runner-v20260806.sh

      - name: Attach prior restore to closure
        if: always() && steps.preflight.outputs.go == 'true'
        shell: bash
        run: node tools/orbit360-attach-visual-matrix-v7-restore-evidence-v20260806.mjs

      - name: Persist sanitized closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add \
            .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-preflight-sanitized-v20260805.json \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-v7-prior-hosting-restore-sanitized-v20260806.json \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-precheck-sanitized-v20260805.json \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-matrix-sanitized-v20260805.json \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-supervisor-sanitized-v20260806.json \
            orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-final-sanitized-v20260805.json \
            tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json \
            orbit360-platform/docs/CIERRE-MATRIZ-VISUAL-CORREGIDA-POST-AUTH-20260805.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist visual matrix v7 closure [skip ci]'
            git push origin HEAD:ays/backend-tenant-lab-v99-20260703
          fi

      - name: Publish private sanitized captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-visual-matrix-runtime-v7-${{ github.run_id }}
          path: orbit360-visual-matrix-corrected-artifacts/
          if-no-files-found: ignore
          retention-days: 7
