name: Orbit360 F2 RULES01 Run Observer 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f2-rules01-run-observer-v20260818.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: orbit360-f2-rules01-run-observer-v20260818
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_SHA: 8d68f36182453ac70f2e68823e194db5a83c71f4
      TARGET_WORKFLOW_NAME: Orbit360 F2 Firestore Rules Parity Repair LAB 20260818
      EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/f2-rules01-run-observer-v20260818.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - name: Observe unique RULES01 run until terminal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EVIDENCE")"
          FOUND='[]'
          for i in $(seq 1 120); do
            RESP="$(curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
            FOUND="$(printf '%s' "$RESP" | jq --arg sha "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" '[.workflow_runs[] | select(.head_sha==$sha and .name==$name and .event=="push")]')"
            COUNT="$(printf '%s' "$FOUND" | jq 'length')"
            if [ "$COUNT" -gt 1 ]; then break; fi
            if [ "$COUNT" -eq 1 ] && [ "$(printf '%s' "$FOUND" | jq -r '.[0].status')" = 'completed' ]; then break; fi
            sleep 5
          done
          COUNT="$(printf '%s' "$FOUND" | jq 'length')"
          if [ "$COUNT" -eq 1 ]; then
            STATUS="$(printf '%s' "$FOUND" | jq -r '.[0].status')"
            TERMINAL=false; [ "$STATUS" = 'completed' ] && TERMINAL=true
            printf '%s' "$FOUND" | jq --arg observer "$GITHUB_RUN_ID" --arg target "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" --argjson terminal "$TERMINAL" '{schemaVersion:"orbit360-f2-rules01-run-observer-v1",ok:($terminal==true),status:(if $terminal then "TERMINAL_OBSERVED" else "NON_TERMINAL_TIMEOUT" end),uniquenessCount:length,observerRunId:$observer,targetSha:$target,targetWorkflowName:$name,run:(.[0]|{id,status,conclusion,run_attempt,head_sha,head_branch,event,name,path,created_at,updated_at}),secretAccess:false,firestoreRead:false,rulesDeploy:false,cloudMutation:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          else
            jq -n --arg observer "$GITHUB_RUN_ID" --arg target "$TARGET_SHA" --arg name "$TARGET_WORKFLOW_NAME" --argjson count "$COUNT" '{schemaVersion:"orbit360-f2-rules01-run-observer-v1",ok:false,status:(if $count==0 then "TARGET_RUN_NOT_OBSERVED" else "TARGET_RUN_NOT_UNIQUE" end),uniquenessCount:$count,observerRunId:$observer,targetSha:$target,targetWorkflowName:$name,secretAccess:false,firestoreRead:false,rulesDeploy:false,cloudMutation:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE"
          fi
          cat "$EVIDENCE"
      - name: Persist sanitized observer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-actions-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add "$EVIDENCE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(gate): persist RULES01 run observer [skip ci]'
          git pull --rebase origin ays/backend-tenant-lab-v99-20260703
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
