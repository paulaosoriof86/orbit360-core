# I6.6: one canonical LIVE performance discriminator. No product or data mutation.
# The tested LIVE build is SHA-pinned; cold auth and UI render are timed separately.
# 2026-11-19: after the targeted insurer rules exact-live gate, quantify
# Cobros separately: first paint, core data and all financial KPIs. No writes.
name: Gravicentra I6.6 LIVE Performance READ ONLY
# Same existing signed measurement; origin/source/artifact come from the current canonical release authority.
on:
  workflow_dispatch:
    inputs:
      read_mode:
        description: 'Existing signed driver mode; no business writes'
        type: choice
        options: [performance, six-existing-receipts]
        default: performance
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - artifacts/orbit360-recovery/release-control/CONTROL_PLANE.json

permissions:
  contents: read
  actions: read

concurrency:
  group: gi-i66-live-performance-readonly
  cancel-in-progress: false

jobs:
  real-chrome-perf:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'I66_LIVE_PERFORMANCE') || contains(github.event.head_commit.message, 'I66_SIX_RECEIPTS_UI_READONLY'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GI_I66_PERF_PROJECT: ays-orbit-360-lab
      GI_I66_PERF_TENANT: alianzas-soluciones
      GI_I66_PERF_PHASE: live
      GITHUB_TOKEN: ${{ github.token }}
      GI_I66_READONLY_MODE: ${{ inputs.read_mode || (contains(github.event.head_commit.message, 'I66_SIX_RECEIPTS_UI_READONLY') && 'six-existing-receipts') || 'performance' }}
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_LAB_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout exact canonical I6.6 and prove read-only code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard LIVE source and diagnostics scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${FIRESTORE_EMULATOR_HOST:-}"
          node --check tools/gravicentra-i66-live-performance-readonly.mjs
          node --test tools/gravicentra-i6-6-readonly-observer-authority.test.cjs tools/gravicentra-i6-6-performance-first-route-source-timeline.test.cjs tools/gravicentra-i6-6-six-existing-receipts-ui-readonly.test.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('tools/gravicentra-i66-live-performance-readonly.mjs','utf8');
          for(const re of [/\.set\s*\(/,/\.update\s*\(/,/\.delete\s*\(/,/\.runTransaction\s*\(/,/\.setCustomUserClaims\s*\(/,/\.createUser\s*\(/])
            if(re.test(s))throw Error('I66_PERF_WRITE_PATH_DENIED');
          if(!s.includes('I66_PERF_ORIGIN_NOT_APPROVED')||!s.includes('firestoreWrites:0,businessActions:0,paymentActions:0'))
            throw Error('I66_PERF_SCOPE_DRIFT');
          console.log('I66_PERF_STATIC_READONLY_BOUNDARY_PASS');
          NODE
          # The pinned driver resolves the current canonical artifact and checks the hosted marker before authentication.
      - name: Select existing exact Firebase account, never log credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gi-i66-perf-auth"
          chmod 700 "$RUNNER_TEMP/gi-i66-perf-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gi-i66-perf-auth'
          for key in ('SA_LAB','SA_LAB_ALT','SA_DEFAULT'):
            try: v=json.loads(os.environ.get(key,''))
            except (TypeError,ValueError): continue
            if v.get('type')!='service_account' or v.get('project_id')!='ays-orbit-360-lab' or not v.get('private_key'):continue
            file=root/'existing.json';file.write_text(json.dumps(v));file.chmod(0o600)
            with open(os.environ['GITHUB_ENV'],'a') as out:out.write('GOOGLE_APPLICATION_CREDENTIALS='+str(file)+'\n')
            print('I66_PERF_EXISTING_PROJECT_CREDENTIAL_PASS')
            break
          else:raise SystemExit('I66_PERF_EXISTING_AUTH_HOLD')
          PY
      - name: Install pinned CI browser and Admin read-only dependencies
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 playwright@1.55.0 >/dev/null
          node node_modules/playwright/cli.js install --with-deps chromium >/dev/null
      - name: Measure REAL Chromium origin timings as Carlos Operativo (no writes)
        env:
          GI_I66_PERF_REPORT: ${{ runner.temp }}/gi-i66-live-perf-summary.json
        run: |
          set -euo pipefail
          node tools/gravicentra-i66-live-performance-readonly.mjs
      - name: Certify LIVE topbar cold first-search latency independently
        if: env.GI_I66_READONLY_MODE == 'performance'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const x=require(process.env.RUNNER_TEMP+'/gi-i66-live-perf-summary.json');
          const s=x.globalTopbarSearch||{},t=x.globalTopbarTiming||{};
          if(x.status!=='LIVE_READONLY_MEASURED'||x.origin!=='https://app.aysseguros.com'||
             x.auth?.activation?.role!=='Operativo'||x.auth?.pageErrors!==0||x.auth?.consoleErrors!==0||
             !x.auth?.httpErrorClasses||typeof x.auth.httpErrorClasses!=='object'||Array.isArray(x.auth.httpErrorClasses)||
             Object.keys(x.auth.httpErrorClasses).length!==0||
             x.firestoreWrites!==0||x.paymentActions!==0||
             !s.ready||!s.first?.resultCount||s.first.timeMs>=2200||
             s.second?.timeMs>=1000||s.second.resultCount!==s.first.resultCount||
             t.projection?.calls!==0)
            throw Error('I66_LIVE_GLOBAL_TOPBAR_POST_DEPLOY_QA_HOLD');
          console.log('I66_LIVE_GLOBAL_TOPBAR_2P2S_0_REPROJECTIONS_CARLOS_OPERATIVO_PASS');
          console.log('I66_LIVE_FOUR_HUNDRED_PLUS_CLIENTS_AUTHORIZED_READ_ONLY_BROWSER_PASS');
          NODE
      - name: Certify exact six existing obligations after signed reload
        if: env.GI_I66_READONLY_MODE == 'six-existing-receipts'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const r=require(process.env.RUNNER_TEMP+'/gi-i66-live-perf-summary.json');
          assert.equal(r.status,'LIVE_SIX_EXISTING_RECEIPTS_SIGNED_UI_RELOAD_CALCULATION_PASS');
          assert.equal(r.financialFocal?.distinctObligationCount,6);
          assert.equal(r.financialFocal?.sourceGrossCents,166956);
          assert.equal(r.financialFocal?.additionalWrites,0);
          assert.equal(r.financialFocal?.newObligations,0);
          assert.equal(r.financialFocal?.observations?.filter(x=>x.reloadPass).length,6);
          assert.equal(r.firestoreWrites,0);assert.equal(r.paymentActions,0);
          console.log('I66_SIX_EXISTING_OBLIGATIONS_UI_RELOAD_CALCULATION_PASS_ADDITIONAL_WRITES_0');
          NODE
      - name: Preserve scoped read-only evidence without customer identity or tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-live-performance-readonly
          path: ${{ runner.temp }}/gi-i66-live-perf-summary.json
          if-no-files-found: ignore
          retention-days: 3
