name: Orbit 360 · Matriz visual corregida post-Auth · una vez v6

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - .github/workflows/orbit360-run-visual-matrix-corrected-post-auth-once-v6-20260806.yml

permissions:
  contents: write

concurrency:
  group: orbit360-visual-matrix-corrected-post-auth-278-v6-once
  cancel-in-progress: false

jobs:
  visual-matrix-corrected-post-auth:
    if: github.event.pull_request.head.ref == 'ays/run-visual-matrix-corrected-post-auth-278-v6-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout transporte exclusivo v6
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar cadena, contexto y cuatro source passes
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW='.github/workflows/orbit360-run-visual-matrix-corrected-post-auth-once-v6-20260806.yml'
          BRANCH='ays/backend-tenant-lab-v99-20260703'
          BASE_HEAD='86249253b6a69ead228a5dc1baec71aa82702e13'
          ACTIVATION_SHA='fed4daad7621ccf68bc958df6b41d2714761b2fe'
          REQUEST_SHA='0a53acd815e10c3283d899b11bac61c88bcd3bff'
          REQUEST='.github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json'
          LIFECYCLE='tools/orbit360-validator-lifecycle-contract-visual-matrix-corrected-post-auth-lab-v20260805.json'
          PREFLIGHT_RUNNER='tools/orbit360-preflight-visual-matrix-corrected-post-auth-once-v20260805.sh'
          RUNTIME_RUNNER='tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v20260805.sh'
          SEQUENCE_EVIDENCE='orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-lifecycle-sequence-source-test-sanitized-v20260806.json'
          OBSERVABLE_EVIDENCE='orbit360-platform/runtime-gate-crm-v20260716/observable-preflight-wrapper-source-test-sanitized-v20260806.json'
          BRANCH_EVIDENCE='orbit360-platform/runtime-gate-crm-v20260716/observable-preflight-branch-context-source-test-sanitized-v20260806.json'
          RUNTIME_BRANCH_EVIDENCE='orbit360-platform/runtime-gate-crm-v20260716/runtime-branch-context-source-test-sanitized-v20260806.json'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_BASE_REF" = "$BRANCH"
          test "$REQUEST_SHA" != 'ba993d061a2d55f1703ebaeb0bad2cd9ab8a98ad'
          test "$REQUEST_SHA" != '75a50b2176aa4e333fb859169e76d81fb03ed542'
          test "$REQUEST_SHA" != '63052380791b84917618e9664285dc5fb3f03f77'
          test "$REQUEST_SHA" != 'cd7b5cf881843da2e46bf9c337b4f9d1053a1cb3'
          test "$REQUEST_SHA" != 'd7d8521c531eb266222ebb01ee5491a096747f5d'
          mapfile -t TRANSPORT_CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#TRANSPORT_CHANGED[@]}" = '1'
          test "${TRANSPORT_CHANGED[0]}" = "$WORKFLOW"
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$REQUEST_SHA"
          test "$(git rev-parse "$REQUEST_SHA^")" = "$ACTIVATION_SHA"
          test "$(git rev-parse "$ACTIVATION_SHA^")" = "$BASE_HEAD"
          mapfile -t ACTIVATION_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$ACTIVATION_SHA")
          test "${#ACTIVATION_CHANGED[@]}" = '1'
          test "${ACTIVATION_CHANGED[0]}" = "$LIFECYCLE"
          mapfile -t REQUEST_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$REQUEST_SHA")
          test "${#REQUEST_CHANGED[@]}" = '1'
          test "${REQUEST_CHANGED[0]}" = "$REQUEST"
          git checkout --detach "$REQUEST_SHA"
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          jq -e '.status=="PASS_LIFECYCLE_SEQUENCE_SYNTHETIC" and .total==39 and .passed==39 and .failed==0 and .ok==true' "$SEQUENCE_EVIDENCE" >/dev/null
          jq -e '.status=="PASS_OBSERVABLE_PREFLIGHT_WRAPPER_SOURCE" and .total==18 and .passed==18 and .failed==0 and .ok==true' "$OBSERVABLE_EVIDENCE" >/dev/null
          jq -e '.status=="PASS_OBSERVABLE_PREFLIGHT_BRANCH_CONTEXT_SOURCE" and .total==24 and .passed==24 and .failed==0 and .ok==true' "$BRANCH_EVIDENCE" >/dev/null
          jq -e '.status=="PASS_RUNTIME_BRANCH_CONTEXT_SOURCE" and .total==24 and .passed==24 and .failed==0 and .ok==true' "$RUNTIME_BRANCH_EVIDENCE" >/dev/null
          jq -e --arg parent "$ACTIVATION_SHA" '.status=="AUTHORIZED_ONCE" and .approved==true and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and .parentHead==$parent and .scope.observableWrapperRequired==true and .scope.durableGoGateEvidenceRequired==true and .scope.runtimeBranchContextValidationRequired==true and .scope.githubRefNameCanonicalContract==false' "$REQUEST" >/dev/null
          jq -e '.status=="AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST" and .authorizationReserved==true and .allowedExecutions==1 and .requestConsumed==false and .replayAllowed==false and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .browserAuthorized==true and .hostingDeployAuthorized==true and .functionsDeployAuthorized==false and .rulesDeployAuthorized==false and .productionAuthorized==false and .mainAuthorized==false and .mergeAuthorized==false' "$LIFECYCLE" >/dev/null
          grep -q 'ORBIT360_CANONICAL_BRANCH' "$PREFLIGHT_RUNNER"
          grep -q 'GITHUB_BASE_REF' "$PREFLIGHT_RUNNER"
          ! grep -q 'GITHUB_REF_NAME' "$PREFLIGHT_RUNNER"
          grep -q 'ORBIT360_CANONICAL_BRANCH' "$RUNTIME_RUNNER"
          grep -q 'GITHUB_BASE_REF' "$RUNTIME_RUNNER"
          ! grep -q 'GITHUB_REF_NAME' "$RUNTIME_RUNNER"

      - name: GO_GATE_CONTRACT observable sin secretos
        id: preflight
        shell: bash
        env:
          ORBIT360_CANONICAL_BRANCH: ays/backend-tenant-lab-v99-20260703
        run: |
          set -euo pipefail
          OUT='orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-corrected-post-auth-preflight-sanitized-v20260805.json'
          bash tools/orbit360-preflight-visual-matrix-corrected-post-auth-once-v20260805.sh
          test -f "$OUT"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="2.7.8" and .failed==0 and .ok==true and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==false and .runtimeAuthorized==true and .browserAuthorized==true and .hostingDeployAuthorized==true and .hostingDeploysMaximum==1 and .functionsDeployAuthorized==false and .rulesDeployAuthorized==false and .productionAuthorized==false and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0' "$OUT" >/dev/null

      - name: Ejecutar backup, máximo un Hosting LAB y matriz read-only
        if: steps.preflight.outputs.go == 'true'
        shell: bash
        env:
          ORBIT360_CANONICAL_BRANCH: ays/backend-tenant-lab-v99-20260703
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          bash tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v20260805.sh

      - name: Publicar capturas acotadas privadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-visual-matrix-corrected-v6-${{ github.run_id }}
          path: orbit360-visual-matrix-corrected-artifacts/
          if-no-files-found: ignore
          retention-days: 7
