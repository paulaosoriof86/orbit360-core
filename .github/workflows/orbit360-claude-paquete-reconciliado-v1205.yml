name: Orbit 360 · Control-plane registrado · relay runtime

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

concurrency:
  group: orbit360-registered-runtime-relay
  cancel-in-progress: false

jobs:
  registered-runtime-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORBIT360_VISUAL_REQUEST_PATH: .github/orbit360-requests/visual-matrix-corrected-post-auth-lab-v20260805-authorization.json
      ORBIT360_EXPECTED_REQUEST_VERSION: NONE_PENDING_FRESH_AUTHORIZATION
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm fail-closed runtime relay
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$ORBIT360_VISUAL_REQUEST_PATH"
          GUARD='tools/orbit360-json-guard-visual-matrix-runtime-v20260806.mjs'
          if node "$GUARD" detect-active-request "$REQUEST" "$ORBIT360_EXPECTED_REQUEST_VERSION"; then
            echo 'STOP_REGISTERED_RELAY_UNEXPECTED_ACTIVE_REQUEST'
            exit 41
          fi
          echo 'SKIP_REGISTERED_RELAY_NONE_PENDING_FRESH_AUTHORIZATION'
