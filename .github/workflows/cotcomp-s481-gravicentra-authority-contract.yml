name: CotComp S4.81 Gravicentra authority contract

on:
  push:
    branches:
      - ays/cotcomp-s481-gravicentra-authority-contract-20261003
    paths:
      - '.github/cotcomp-lab-intents/s481-authority-contract-sourceonly.json'

permissions:
  contents: read
  actions: read

jobs:
  s481-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify S4.81 source-only intent
        shell: bash
        run: |
          set -euo pipefail
          I=.github/cotcomp-lab-intents/s481-authority-contract-sourceonly.json
          jq -e '
            .authorization=="S481_SOURCE_ONLY_GRAVICENTRA_AUTHORITY_CONTRACT" and
            .authority=="GRAVICENTRA" and
            .tenantId=="alianzas-soluciones" and
            .firebaseReads==false and
            .firebaseWrites==false and
            .providerOrRater==false and
            .production==false and
            .deploy==false
          ' "$I" >/dev/null
          PARENT="$(git rev-parse HEAD^)"
          test "$(jq -r '.authorizedSourceParent' "$I")" = "$PARENT"
          mapfile -t CHANGED < <(git diff --name-only "$PARENT" HEAD)
          test "${#CHANGED[@]}" = "1"
          test "${CHANGED[0]}" = "$I"

      - name: Run accumulated QA plus S4.81 contract tests
        working-directory: functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:cotcomp
          node --check cotcomp-gravicentra-authority-contract-s481.js
          node --check cotcomp-gravicentra-authority-contract-s481.test.js
          node --test cotcomp-gravicentra-authority-contract-s481.test.js

      - name: Build sanitized S4.81 contract receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s481/evidence"
          node - <<'NODE' > "$RUNNER_TEMP/s481/evidence/S481_GRAVICENTRA_AUTHORITY_CONTRACT_RECEIPT.json"
          const s=require('./functions/cotcomp-gravicentra-authority-contract-s481');
          const crypto=require('crypto');
          const matrix=s.authorityMatrix();
          const payload={
            schemaVersion:'ays-cotcomp-s481-authority-contract-receipt-v1.0',
            contractVersion:s.VERSION,
            authority:s.AUTHORITY,
            authorityMatrix:matrix,
            propagationPolicy:s.propagationPolicy(),
            comparisonSemantics:{
              comparabilityStates:s.COMPARABILITY_STATES,
              coverageStates:s.COVERAGE_STATES,
              missingDoesNotImplyNotCovered:true
            },
            selectionSemantics:{
              explicitUserChoiceRequired:true,
              selectedDoesNotImplyIssued:true,
              selectedDoesNotImplyBound:true,
              selectedDoesNotImplyConfirmed:true
            },
            firebaseReads:0,
            firebaseWrites:0,
            providerOrRaterCalls:0,
            productionTouched:false,
            deployed:false
          };
          payload.contractDigestSha256=crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          process.stdout.write(JSON.stringify(payload,null,2));
          NODE

      - name: Upload sanitized S4.81 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cotcomp-s481-gravicentra-authority-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/s481/evidence/S481_GRAVICENTRA_AUTHORITY_CONTRACT_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
