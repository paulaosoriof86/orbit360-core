name: Gravicentra I4A Causal Source Fix

on:
  push:
    branches:
      - recovery/fase-a-clean-20260831
    paths:
      - .github/workflows/gravicentra-i4a-causal-source-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravicentra-i4a-causal-source-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-causal-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify certified release before source mutation
        run: node tools/gravicentra-release-lineage-guard.mjs --mode=certified
      - name: Apply deterministic hydration causal patch
        run: python3 tools/gravicentra-i4a-apply-hydration-fix.py
      - name: Validate exact source scope
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/data/store-firestore-product-readonly-p0.js
          node --check orbit360-platform/core/router.js
          git diff --check
          FILES="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$FILES" = "orbit360-platform/core/router.js orbit360-platform/data/store-firestore-product-readonly-p0.js "
      - name: Commit source candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit360-platform/core/router.js orbit360-platform/data/store-firestore-product-readonly-p0.js
          git commit -m "fix(i4a): preserve authoritative hydration and suppress redundant rerenders"
          git push origin HEAD:recovery/fase-a-clean-20260831
          echo "PRODUCT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCT_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT=advance release lock candidate and run one new I3" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_TOUCHED=false" >> "$GITHUB_STEP_SUMMARY"
          echo "DATA_TOUCHED=false" >> "$GITHUB_STEP_SUMMARY"
