name: Gravicentra I4A Causal Source Fix

on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths: [.github/workflows/gravicentra-i4a-causal-source-fix.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravicentra-i4a-causal-source-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-causal-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only physically closed causal owners
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "recovery/fase-a-clean-20260831"
          python3 - <<'PY'
          from pathlib import Path
          def rx(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if n!=expected: raise SystemExit(f'PATCH_PRECONDITION_FAIL:{path}:expected={expected}:actual={n}:{old[:90]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          cfg='orbit360-platform/modules/configuracion.js'
          rx(cfg,"root=root||document.body;","root=root||document.querySelector('#cfg-body'); if(!root)return;")
          rx(cfg,"setTimeout(function(){scrub(document.querySelector('#cfg-body')||document.body);},250);","setTimeout(function(){scrub(document.querySelector('#cfg-body'));},250);")
          rx(cfg,"setTimeout(function(){scrub(document.querySelector('#cfg-body')||document.body);},1000);","setTimeout(function(){scrub(document.querySelector('#cfg-body'));},1000);")
          rx(cfg,"try{ new MutationObserver(function(){scrub(document.querySelector('#cfg-body')||document.body);}).observe(document.body,{childList:true,subtree:true}); }catch(e){}","try{ new MutationObserver(function(){scrub(document.querySelector('#cfg-body'));}).observe(document.body,{childList:true,subtree:true}); }catch(e){}")

          c='orbit360-platform/modules/cliente360.js'
          rx(c,"  const esRenovable = p => p && (p.estado === 'Vigente' || p.estado === 'Por renovar');\n","  const esRenovable = p => p && (p.estado === 'Vigente' || p.estado === 'Por renovar');\n  const policyTotal = p => U.finiteNumber(p && p.primaTotal);\n")
          rx(c,"      const primaAnual = vigentes.reduce((s, p) => s + (U.finiteNumber(p.prima) || 0), 0);","      const primaAnual = vigentes.reduce((s, p) => s + (policyTotal(p) || 0), 0);")
          rx(c,"      return s + (cli.moneda === 'COP' ? p.prima / 1000 : p.prima);","      const total = policyTotal(p);\n      if (total == null) return s;\n      return s + (cli.moneda === 'COP' ? total / 1000 : total);")
          rx(c,"    r.pol.filter(esRenovable).forEach(p => porRamo[p.ramo] = (porRamo[p.ramo] || 0) + p.prima);","    r.pol.filter(esRenovable).forEach(p => porRamo[p.ramo] = (porRamo[p.ramo] || 0) + (policyTotal(p) || 0));")
          rx(c,"          <td class=\"num\">${U.money(p.prima, p.moneda)}</td>","          <td class=\"num\">${policyTotal(p) == null ? 'Pendiente de completar' : U.money(policyTotal(p), p.moneda)}</td>")

          q='orbit360-platform/core/queries.js'
          rx(q,"  function polizasDe(cliId) { return S().where('polizas', p => p.clienteId === cliId); }\n  function recibosEsperadosDe(cliId) { return S().where('recibosEsperados', r => r.clienteId === cliId); }\n  function carteraPrimasDe(cliId) { return S().where('carteraPrimas', r => r.clienteId === cliId); }","  function polizasDe(cliId) { return S().where('polizas', p => p.clienteId === cliId); }\n  function policyLinkedClientId(row) {\n    if (!row || row.polizaId == null) return null;\n    const policy = S().get('polizas', row.polizaId);\n    return policy && policy.clienteId != null ? policy.clienteId : null;\n  }\n  function recibosEsperadosDe(cliId) { return S().where('recibosEsperados', r => policyLinkedClientId(r) === cliId); }\n  function carteraPrimasDe(cliId) { return S().where('carteraPrimas', r => policyLinkedClientId(r) === cliId); }")
          rx(q,"    const primaAnual = vigentes.reduce((s, p) => s + amount(p.prima), 0);","    const primaAnual = vigentes.reduce((s, p) => s + amount(p.primaTotal), 0);",expected=2)
          rx(q,"    const polByClient = new Map(), recByClient = new Map(), carByClient = new Map(), cobByClient = new Map(), comByClient = new Map();","    const polByClient = new Map(), polById = new Map(), recByClient = new Map(), carByClient = new Map(), cobByClient = new Map(), comByClient = new Map();")
          rx(q,"    polizas.forEach(p => add(polByClient, p.clienteId, p));\n    recibos.forEach(r => add(recByClient, r.clienteId, r));\n    cartera.forEach(r => add(carByClient, r.clienteId, r));","    polizas.forEach(p => { add(polByClient, p.clienteId, p); if (p && p.id != null) polById.set(p.id, p); });\n    recibos.forEach(r => { const p = r && polById.get(r.polizaId); if (p) add(recByClient, p.clienteId, r); });\n    cartera.forEach(r => { const p = r && polById.get(r.polizaId); if (p) add(carByClient, p.clienteId, r); });")
          rx(q,"  function rowPais(row, clients) { const cli = clients instanceof Map ? clients.get(row.clienteId) : S().get('clientes', row.clienteId); const p = paisActivo(); return !p || (cli && cli.pais === p) || row.pais === p; }\n  function polPais(p2, clients) {","  function rowPais(row, clients) { const cli = clients instanceof Map ? clients.get(row.clienteId) : S().get('clientes', row.clienteId); const p = paisActivo(); return !p || (cli && cli.pais === p) || row.pais === p; }\n  function policyLinkedRowPais(row, clients, policies) {\n    if (!row || row.polizaId == null) return false;\n    const policy = policies instanceof Map ? policies.get(row.polizaId) : S().get('polizas', row.polizaId);\n    if (!policy || policy.clienteId == null) return false;\n    const cli = clients instanceof Map ? clients.get(policy.clienteId) : S().get('clientes', policy.clienteId);\n    const p = paisActivo();\n    return !p || !!(cli && cli.pais === p);\n  }\n  function polPais(p2, clients) {")
          rx(q,"    const clients = clientIndex();\n    const cob = (S().all('cobros') || []).filter(c => rowPais(c, clients));\n    const car = (S().all('carteraPrimas') || []).filter(c => rowPais(c, clients));","    const clients = clientIndex();\n    const policies = new Map((S().all('polizas') || []).filter(p => p && p.id != null).map(p => [p.id, p]));\n    const cob = (S().all('cobros') || []).filter(c => rowPais(c, clients));\n    const car = (S().all('carteraPrimas') || []).filter(c => policyLinkedRowPais(c, clients, policies));")
          rx(q,"      .reduce((s, p) => s + norm(p.prima, p.moneda), 0);","      .reduce((s, p) => s + norm(p.primaTotal, p.moneda), 0);")

          a=Path(cfg).read_text(encoding='utf-8'); b=Path(q).read_text(encoding='utf-8'); d=Path(c).read_text(encoding='utf-8')
          if "root=root||document.body" in a or "#cfg-body')||document.body" in a: raise SystemExit('CONFIG_GLOBAL_SCRUB_STILL_PRESENT')
          if "recibosEsperados', r => r.clienteId === cliId" in b or "carteraPrimas', r => r.clienteId === cliId" in b: raise SystemExit('FINANCIAL_DIRECT_CLIENT_JOIN_STILL_PRESENT')
          if "primaAnual = vigentes.reduce((s, p) => s + amount(p.prima)" in b: raise SystemExit('QUERY_PRIMA_LEGACY_SEMANTIC_STILL_PRESENT')
          if "const primaAnual = vigentes.reduce((s, p) => s + (U.finiteNumber(p.prima)" in d: raise SystemExit('CLIENT360_PRIMA_LEGACY_SEMANTIC_STILL_PRESENT')
          PY
      - name: Validate exact source changes
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/modules/configuracion.js
          node --check orbit360-platform/modules/cliente360.js
          node --check orbit360-platform/core/queries.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "orbit360-platform/core/queries.js orbit360-platform/modules/cliente360.js orbit360-platform/modules/configuracion.js "
      - name: Commit source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit360-platform/core/queries.js orbit360-platform/modules/cliente360.js orbit360-platform/modules/configuracion.js
          git commit -m "fix(i4a): close policy labels and financial read joins"
          git push origin HEAD:recovery/fase-a-clean-20260831
          echo "PRODUCT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCT_SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCTION_TOUCHED=false" >> "$GITHUB_STEP_SUMMARY"
          echo "DATA_TOUCHED=false" >> "$GITHUB_STEP_SUMMARY"
