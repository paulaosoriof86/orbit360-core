name: Orbit360 R4 Certified Product Readonly Smoke 20260815

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4-certified-product-readonly-smoke-v20260815.yml'
      - 'tools/orbit360-r4-certified-product-contract-v20260815.json'
      - 'tools/orbit360-r4-certified-product-smoke-wrapper-v20260815.mjs'
      - 'tools/orbit360-r4-team-scope-relational-index-regression-v20260816.mjs'

permissions:
  contents: read

concurrency:
  group: orbit360-r4-certified-product-readonly-smoke-v20260815
  cancel-in-progress: false

env:
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_R4_URL: https://app.aysseguros.com
  ORBIT360_R4_PACKAGE_SOURCE_HEAD: 47249fd4d6032a2f4c09f6fbd3460d3804c199da
  ORBIT360_R4_PACKAGE_FILE_COUNT: '194'
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_R4_CERTIFIED_SOURCE_ONLY: 'true'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical product-contract gate before secrets and browser
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node --check tools/orbit360-r4-production-readonly-smoke-v20260815.mjs
          node --check tools/orbit360-r4-certified-product-smoke-wrapper-v20260815.mjs
          node --check tools/orbit360-r4-team-scope-relational-index-regression-v20260816.mjs
          node tools/orbit360-r4-certified-product-smoke-wrapper-v20260815.mjs --self-test
          jq -e '.ok==true and .status=="R4_CERTIFIED_VALIDATOR_ROOTFIX_SOURCE_PASS" and .classification=="VALIDATOR_STALE_ROOTFIX_PASS" and .authAsset.sourceSha256Matches==true and .authAsset.sourceBytesMatch==true and .staleLegacyAuthPathRemovedFromExecutableHarness==true and .productAuthPathBoundExactlyOnce==true and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .packageRebuilt==false and .productionTouched==false' "$EVIDENCE_DIR/r4-certified-validator-rootfix-source-v20260815.json" >/dev/null
      - name: Validate team-own scoped relational access regression source-only
        if: env.ORBIT360_R4_CERTIFIED_SOURCE_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$EVIDENCE_DIR/r4-team-scope-relational-index-regression-v20260816.json"
          ORBIT360_R4_TEAM_SCOPE_REGRESSION_OUT="$OUT" node tools/orbit360-r4-team-scope-relational-index-regression-v20260816.mjs
          jq -e '.ok==true and .status=="R4_TEAM_SCOPE_RELATIONAL_INDEX_REGRESSION_PASS" and .classification=="FUNCTIONAL_DEFECT_ROOTFIX_SOURCE_PROVEN" and .roles.Dirección.publicEqual==true and .roles.Dirección.facadeEqual==true and .roles.Operativo.publicEqual==true and .roles.Operativo.facadeEqual==true and .roles.Asesor.publicEqual==true and .roles.Asesor.facadeEqual==true and .reduction.operativoFacadeCloneRatio>=50 and .reduction.asesorFacadeCloneRatio>=50 and .roles.Operativo.candidate.facadeMetrics.getCalls<100 and .roles.Asesor.candidate.facadeMetrics.getCalls<100 and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .productionTouched==false' "$OUT" >/dev/null
      - name: Validate bounded recovered harness source-only
        if: env.ORBIT360_R4_CERTIFIED_SOURCE_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$EVIDENCE_DIR/r4-certified-harness-source-only-watchdog-v20260815.json"
          ORBIT360_R4_SYNTHETIC_MODE=watchdog ORBIT360_R4_SYNTHETIC_TIMEOUT_MS=120 ORBIT360_R4_OUT="$OUT" node tools/orbit360-r4-certified-product-smoke-wrapper-v20260815.mjs
          jq -e '.ok==true and .status=="R4_HARNESS_SOURCE_ONLY_WATCHDOG_PASS" and .classification=="PASS" and .synthetic==true and .stageTimeoutObserved==true and .evidencePersistedBeforeTimeout==true and .productionTouched==false and .containsPII==false and .containsSecrets==false and .deployExecuted==false and .packageRebuilt==false' "$OUT" >/dev/null
      - name: Install read-only production smoke tools
        if: env.ORBIT360_R4_CERTIFIED_SOURCE_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Bind existing protected smoke identity after gate
        if: env.ORBIT360_R4_CERTIFIED_SOURCE_ONLY != 'true'
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_EXISTING_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_EXISTING_LOGIN_PASSWORD} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-r4-certified-smoke.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PRODUCT_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_SMOKE_PASSWORD=$ORBIT360_EXISTING_LOGIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Resolve existing smoke identity read-only
        if: env.ORBIT360_R4_CERTIFIED_SOURCE_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .requiredRolesPresent==true and .firestoreWrites==0 and .operationalWrites==0 and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/m6-product-smoke-identity-summary.json" >/dev/null
      - name: Execute certified production read-only browser frontier
        if: env.ORBIT360_R4_CERTIFIED_SOURCE_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-r4-certified-product-smoke-wrapper-v20260815.mjs
          jq -e '.ok==true and .status=="POST_GO_LIVE_SMOKE_PASS" and .manifest.pass==true and .authAsset.pass==true and .authAsset.sha256Matches==true and .auth.signedIn==true and .auth.emailVerified==true and .auth.membershipAvailable==true and .auth.membershipActive==true and .auth.tenantMatches==true and .auth.requiredRolesPresent==true and .runtime.started==true and .runtime.routerStarted==true and .runtime.tenantContextReady==true and .runtime.storeReady==true and .runtime.storeStatus=="ready-read-only" and .runtime.storeWriteEnabled==false and .runtime.requiredMissingCount==0 and .runtime.requiredFailedCount==0 and .privileged.clientes==430 and .privileged.aseguradoras==30 and (.roles|length)==3 and ([.roles[].pass]|all) and (.pageErrors|length)==0 and (.consoleErrors|length)==0 and (.httpFailures|length)==0 and (.writeSignals|length)==0 and (.technicalCopy|length)==0 and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .containsPII==false and .containsSecrets==false and .deployExecuted==false and .packageRebuilt==false' "$EVIDENCE_DIR/r4-production-readonly-smoke-v20260815.json" >/dev/null
      - name: Cleanup protected key material
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4-certified-product-smoke-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4-certified-validator-rootfix-source-v20260815.json
            orbit360-platform/runtime-gate-crm-v20260716/r4-team-scope-relational-index-regression-v20260816.json
            orbit360-platform/runtime-gate-crm-v20260716/r4-certified-harness-source-only-watchdog-v20260815.json
            orbit360-platform/runtime-gate-crm-v20260716/m6-product-smoke-identity-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/r4-production-readonly-smoke-v20260815.json
          if-no-files-found: warn
          retention-days: 14
