# I6.6 P0 payment backend only: promote exact immutable source after QA + Preview, fail-closed rollback.
# Does NOT deploy Hosting, touch Firestore records, Rules/Auth, other Functions, or new Firebase.
name: Gravicentra I6.6 Payment Exact LIVE Backend Hotfix P0
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths:
      - .github/workflows/gravicentra-i66-payment-live-targeted-p0.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gi-i66-payment-live-targeted-p0
  cancel-in-progress: false
jobs:
  protected-promotion:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref == 'refs/heads/recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PROJECT_ID: ays-orbit-360-lab
      SOURCE_SHA: c6ee2b2edc5788a1172593507ebc70f493fb0dc1
      ARTIFACT_RUN: '43127221729'
      ARTIFACT_ID: '13902129993'
      ARTIFACT_DIGEST: sha256:1313e0a85a733f2e2bac93ca7d3233856b5c91ff5201aa2f9300404ac0d4c444
      QA_RUN: '43127221947'
      CONTROL_RUN: '43127221993'
      PREVIEW_FUNCTION_RUN: '43127910914'
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate exact scoped owner approval + green 122 emulator/guard/Preview/function evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          (async()=>{
            const c=JSON.parse(fs.readFileSync('artifacts/orbit360-recovery/release-control/I6_6_RELEASE_TRANSPORT_CONTROL_20261110.json'));
            assert.equal(c.status,'PAYMENT_LIVE_FUNCTION_PROMOTION_AUTHORIZED');
            assert.equal(c.livePromotionAuthorized,true);
            assert.equal(c.previewApproved,true);
            assert.equal(c.forbidFirestoreRulesDataAuthWrites,true);
            assert.equal(c.noHostingPromotion,true);
            assert.equal(c.forbidBackendLiveFunctionDeploy,false);
            assert.equal(c.liveFunctionScope,'orbit360CobrosReconciliationCommand');
            for(const [k,v] of [['approvedSourceSha',process.env.SOURCE_SHA],['sourceBuildWorkflowRunId',Number(process.env.ARTIFACT_RUN)],['immutableArtifactId',Number(process.env.ARTIFACT_ID)],['immutableArtifactZipDigest',process.env.ARTIFACT_DIGEST],['previewFunctionRunId',Number(process.env.PREVIEW_FUNCTION_RUN)]])assert.equal(c[k],v,k);
            const h={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','User-Agent':'GI-I66-Payment-Live-Scoped'};
            const base='https://api.github.com/repos/paulaosoriof86/orbit360-core/actions/';
            const names=[['EMULATOR',process.env.QA_RUN],['CONTROL',process.env.CONTROL_RUN],['BUILD',process.env.ARTIFACT_RUN],['PREVIEW_FUNCTION',process.env.PREVIEW_FUNCTION_RUN]];
            const runs=await Promise.all(names.map(async ([name,n])=>({name,run:await fetch(base+'runs/'+n,{headers:h}).then(r=>r.json())})));
            for(const {name,run} of runs){assert.equal(run.conclusion,'success',name);if(name!=='PREVIEW_FUNCTION')assert.equal(run.head_sha,process.env.SOURCE_SHA,name+' sha');}
            const a=await fetch(base+'artifacts/'+process.env.ARTIFACT_ID,{headers:h}).then(r=>r.json());
            assert.equal(a.digest,process.env.ARTIFACT_DIGEST);assert.equal(a.workflow_run.id,Number(process.env.ARTIFACT_RUN));assert.equal(a.expired,false);
            console.log('I66_PAYMENT_LIVE_OWNER_EXACT_ARTIFACT_AND_122_QA_PREVIEW_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13902129993
          run-id: 43127221729
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/payment-live-packet-download
      - name: Verify exact immutable TAR/backend bytes before any deployment
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/payment-live-packet-download"
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz | wc -l)" -eq 1
          test "$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 | wc -l)" -eq 1
          TAR=$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.tar.gz -print -quit)
          SUM=$(find "$DL" -maxdepth 3 -type f -name gi-i66-exact-package.sha256 -print -quit)
          test "$(sha256sum "$TAR" | awk '{print $1}')" = "$(awk '{print $1}' "$SUM")"
          mkdir -p "$RUNNER_TEMP/payment-live-packet"
          tar -xzf "$TAR" -C "$RUNNER_TEMP/payment-live-packet" --no-same-owner
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{execFileSync}=require('node:child_process');
          const b=process.env.RUNNER_TEMP+'/payment-live-packet/bundle/';
          const m=JSON.parse(fs.readFileSync(b+'site/__recovery__/build.json'));
          assert.equal(m.sourceSha,process.env.SOURCE_SHA);assert.equal(m.gate,'I6.6');
          for(const [target,src] of [['backend/cobros-reconciliation-domain.js','functions/cobros-reconciliation-domain.js'],['backend/payment-inference-engine.js','functions/payment-inference-engine.js']]){
            assert(fs.readFileSync(b+target).equals(execFileSync('git',['show',process.env.SOURCE_SHA+':'+src])),target+' SHA drift');
          }
          // bootstrap.js has the exact deterministic B4-003 Preview export injected by the certified package builder.
          assert(fs.existsSync(b+'backend/bootstrap.js')&&fs.existsSync(b+'backend/index.js'));
          assert(fs.readFileSync(b+'backend/cobros-reconciliation-domain.js','utf8').includes('PAYMENT_ALREADY_APPLIED'));
          console.log('I66_PAYMENT_LIVE_EXACT_SOURCE_BACKEND_AND_INFERENCE_ENGINE_PASS');
          NODE
      - name: Select configured current Firebase authority and pinned tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payment-live-auth"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'payment-live-auth';found=[]
          for i,key in enumerate(('SA_LAB','SA_ALT','SA_DEFAULT')):
              try:a=json.loads(os.environ.get(key,''))
              except (ValueError,TypeError):continue
              if a.get('type')=='service_account' and a.get('project_id')==os.environ['PROJECT_ID'] and a.get('private_key'):
                  p=root/f'{i}.json';p.write_text(json.dumps(a));p.chmod(0o600);found.append(str(p))
          if not found:raise SystemExit('I66_PAYMENT_LIVE_CONFIGURED_CREDENTIAL_HOLD')
          (root/'candidates').write_text('\n'.join(found)+'\n')
          PY
          npm install --prefix "$RUNNER_TEMP/payment-live-cli" --no-save --ignore-scripts --no-audit --no-fund firebase-tools@14.10.1 >/dev/null
          node tools/gravicentra-firebase-tools-empty-extensions-workaround-v1.mjs "$RUNNER_TEMP/payment-live-cli"
          CLI="$RUNNER_TEMP/payment-live-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          SEL=''
          while IFS= read -r c;do
            if GOOGLE_APPLICATION_CREDENTIALS="$c" node "$CLI" functions:list --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/payment-live-functions-before.json" 2>/dev/null;then SEL="$c";break;fi
          done < "$RUNNER_TEMP/payment-live-auth/candidates"
          test -n "$SEL"
          cp "$SEL" "$RUNNER_TEMP/payment-live-auth/selected.json"
          chmod 600 "$RUNNER_TEMP/payment-live-auth/selected.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/payment-live-auth/selected.json" >> "$GITHUB_ENV"
          echo "FIREBASE_CLI_BIN=$CLI" >> "$GITHUB_ENV"
      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 483.0.0'
      - name: Promote ONLY payment callable from exact artifact with old-revision rollback on failure
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet >/dev/null
          gcloud config set project "$PROJECT_ID" --quiet >/dev/null
          gcloud functions describe orbit360CobrosReconciliationCommand --gen2 --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-fn-before.json"
          node - <<'NODE'
          const fs=require('node:fs'),o=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/payment-live-fn-before.json'));
          const full=String(o.serviceConfig?.service||''),name=full.split('/').pop();
          if(!full.includes('/locations/us-central1/services/')||!/^[a-z][a-z0-9-]+$/.test(name))throw Error('I66_LIVE_PAYMENT_PREVIOUS_SERVICE_NOT_RESOLVED');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/payment-live-service-name',name);
          NODE
          SERVICE=$(< "$RUNNER_TEMP/payment-live-service-name")
          gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-run-before.json"
          OLD_REV=$(node - <<'NODE'
          const fs=require('node:fs'),j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/payment-live-run-before.json'));
          const a=(j.status?.traffic||j.traffic||[]).filter(r=>Number(r.percent)===100),v=String(a[0]?.revisionName||a[0]?.revision||'');
          if(a.length!==1||!v)throw Error('I66_PAYMENT_PREVIOUS_100_PERCENT_TRAFFIC_AMBIGUOUS');
          process.stdout.write(v);
          NODE
          )
          printf '%s\n' "$OLD_REV" > "$RUNNER_TEMP/payment-live-old-revision"
          curl -fsSL --max-time 30 'https://ays-orbit-360-lab.web.app/' | sha256sum > "$RUNNER_TEMP/payment-live-host-before.sha"
          curl -fsSL --max-time 30 'https://app.aysseguros.com/' | sha256sum > "$RUNNER_TEMP/payment-live-app-before.sha"
          FROOT="$RUNNER_TEMP/payment-live-functions";mkdir -p "$FROOT"
          cp -a "$RUNNER_TEMP/payment-live-packet/bundle/backend" "$FROOT/backend"
          (cd "$FROOT/backend" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          printf '{"functions":{"source":"backend"}}\n' > "$FROOT/firebase.json"
          completed=0
          rollback(){
            code=$?
            if test "$completed" != 1;then
              set +e
              echo 'I66_PAYMENT_LIVE_FAILURE_ROLLBACK_START'
              gcloud run services update-traffic "$SERVICE" --region us-central1 --project "$PROJECT_ID" --to-revisions="$OLD_REV=100" --quiet
              rev_code=$?
              echo "I66_PAYMENT_ROLLBACK_OLD_TRAFFIC_EXIT=$rev_code"
              if test "$rev_code" != 0;then echo 'I66_PAYMENT_CRITICAL_ROLLBACK_UNCONFIRMED';fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          node "$FIREBASE_CLI_BIN" deploy --only functions:orbit360CobrosReconciliationCommand --config "$FROOT/firebase.json" --project "$PROJECT_ID" --non-interactive
          gcloud functions describe orbit360CobrosReconciliationCommand --gen2 --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-fn-after.json"
          gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-run-after.json"
          NEW_REV=$(node - <<'NODE'
          const fs=require('node:fs'),a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/payment-live-run-after.json'));
          const rev=String(a.status?.latestReadyRevisionName||a.status?.latestCreatedRevisionName||'');
          if(!rev)throw Error('I66_PAYMENT_NEW_READY_REVISION_UNRESOLVED');
          process.stdout.write(rev);
          NODE
          )
          test "$NEW_REV" != "$OLD_REV"
          gcloud run services update-traffic "$SERVICE" --region us-central1 --project "$PROJECT_ID" --to-revisions="$NEW_REV=100" --quiet
          gcloud run services describe "$SERVICE" --region us-central1 --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/payment-live-run-verified.json"
          node - <<'NODE'
          const fs=require('node:fs'),a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/payment-live-run-verified.json'));
          const f=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/payment-live-fn-after.json'));
          const traffic=(a.status?.traffic||a.traffic||[]).filter(t=>Number(t.percent)>0);
          const ready=String(a.status?.latestReadyRevisionName||'');
          if(traffic.length!==1||Number(traffic[0].percent)!==100||String(traffic[0].revisionName||traffic[0].revision)!==ready)throw Error('I66_PAYMENT_FUNCTION_NOT_100_PERCENT_LATEST_READY');
          if(!['ACTIVE','READY'].includes(String(f.state||'').toUpperCase()))throw Error('I66_PAYMENT_FUNCTION_STATE_NOT_ACTIVE');
          console.log('I66_PAYMENT_LIVE_BACKEND_100_PERCENT_LATEST_READY_PASS');
          NODE
          STATUS=$(curl -sS --max-time 25 -o "$RUNNER_TEMP/payment-live-unauth.json" -w '%{http_code}' -X POST 'https://us-central1-ays-orbit-360-lab.cloudfunctions.net/orbit360CobrosReconciliationCommand' -H 'Content-Type: application/json' --data '{"data":{"tenantId":"alianzas-soluciones","operation":"apply_payment","payload":{"receiptId":"b3005qa_probe"}}}')
          test "$STATUS" = 401
          grep -q 'UNAUTHENTICATED' "$RUNNER_TEMP/payment-live-unauth.json"
          echo 'I66_PAYMENT_LIVE_AUTH_GUARD_401_PASS'
          curl -fsSL --max-time 30 'https://ays-orbit-360-lab.web.app/' | sha256sum > "$RUNNER_TEMP/payment-live-host-after.sha"
          curl -fsSL --max-time 30 'https://app.aysseguros.com/' | sha256sum > "$RUNNER_TEMP/payment-live-app-after.sha"
          cmp "$RUNNER_TEMP/payment-live-host-before.sha" "$RUNNER_TEMP/payment-live-host-after.sha"
          cmp "$RUNNER_TEMP/payment-live-app-before.sha" "$RUNNER_TEMP/payment-live-app-after.sha"
          echo 'I66_PAYMENT_BOTH_HOSTING_ORIGINS_UNCHANGED_PASS'
          echo 'I66_PAYMENT_CUSTOMER_RECORD_WRITES=0'
          completed=1
          echo "I66_PAYMENT_LIVE_SOURCE=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "I66_PAYMENT_PREVIOUS_REVISION=$OLD_REV" >> "$GITHUB_STEP_SUMMARY"
          echo "I66_PAYMENT_NEW_REVISION=$NEW_REV" >> "$GITHUB_STEP_SUMMARY"
          echo "I66_PAYMENT_RELEASE_STATUS=BACKEND_DEPLOYED_CLIENT_AUTHENTICATED_UAT_PENDING" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain backend-only transport and rollback readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gi-i66-payment-live-backend-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/payment-live-fn-before.json
            ${{ runner.temp }}/payment-live-fn-after.json
            ${{ runner.temp }}/payment-live-run-before.json
            ${{ runner.temp }}/payment-live-run-after.json
            ${{ runner.temp }}/payment-live-run-verified.json
          if-no-files-found: warn
          retention-days: 21
