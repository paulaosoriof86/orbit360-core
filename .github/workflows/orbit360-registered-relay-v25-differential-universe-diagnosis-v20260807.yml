name: Orbit360 registered relay v25 differential universe diagnosis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  registered-diagnostic-relay-v25:
    runs-on: ubuntu-latest
    env:
      ORBIT360_CANONICAL_BRANCH: ays/backend-tenant-lab-v99-20260703
      ORBIT360_TRANSPORT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      ORBIT360_V25_REQUEST_FILE: .github/orbit360-requests/block1-client360-insurers-v25-diagnostic-authorization.json
      ORBIT360_V25_PREFLIGHT_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v25-block1-diagnostic-preflight-sanitized-v20260807.json
      ORBIT360_V25_DIAGNOSTIC_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v25-block1-universe-differential-sanitized-v20260807.json
      ORBIT360_V25_FINAL_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v25-block1-final-sanitized-v20260807.json
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect exclusive immutable v25 diagnostic request before secrets
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$ORBIT360_V25_REQUEST_FILE"
          if [[ "${GITHUB_EVENT_NAME:-}" != 'pull_request' || "${ORBIT360_TRANSPORT_HEAD_REF:-}" != "$ORBIT360_CANONICAL_BRANCH" ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"; echo SKIP_V25_NONCANONICAL_CONTEXT; exit 0
          fi
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          if [[ "${#changed[@]}" != '1' || "${changed[0]}" != "$REQUEST" ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"; echo SKIP_V25_NOT_EXCLUSIVE_REQUEST_COMMIT; exit 0
          fi
          PARENT="$(git rev-parse HEAD^)"
          node - "$PARENT" <<'NODE'
          const fs=require('fs'); const parent=process.argv[2]; const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_V25_REQUEST_FILE,'utf8'));
          const ok=r.requestVersion==='20260807.25-differential-universe-diagnosis' && r.authorizationGeneration==='v25-differential-universe-diagnosis' && r.gateId==='block1-client360-insurers-lab-v20260717' && r.contractVersion==='1.0.41' && r.status==='AUTHORIZED_ONCE' && r.approved===true && r.allowedExecutions===1 && r.consumed===false && r.authorizationFrozen===false && r.replayAllowed===false && r.parentHead===parent && r.authorizedBaseHead===parent;
          if(!ok) process.exit(41);
          const l=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-block1-universe-diagnostic-v25-v20260807.json','utf8'));
          const ls=l.status==='AUTHORIZED_ONCE_PENDING_EXCLUSIVE_REQUEST' && l.currentPhase==='BLOCK1_UNIVERSE_DIAGNOSTIC_V25' && l.executionAuthorized===true && l.allowedExecutions===1 && l.authorizationFrozen===false && l.replayAllowed===false;
          if(!ls) process.exit(41);
          NODE
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          echo "request_parent=$PARENT" >> "$GITHUB_OUTPUT"
          echo PASS_V25_EXCLUSIVE_REQUEST_PARENT_BOUND_BEFORE_SECRETS

      - name: Require first and only attempt
        if: steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: GO diagnostic read-only gate before secrets
        if: steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-preflight-block1-universe-diagnostic-v25-v20260807.mjs diagnostic
          node - <<'NODE'
          const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.ORBIT360_V25_PREFLIGHT_EVIDENCE,'utf8'));
          const ok=e.status==='GO_V25_DIAGNOSTIC_READONLY' && e.ok===true && e.secretAccessAuthorized===true && e.firestoreReadAuthorized===true && e.firestoreReadsMaximum===3 && e.firestoreWriteAuthorized===false && e.authReadAuthorized===false && e.authWriteAuthorized===false && e.browserAuthorized===false && e.hostingAuthorized===false && e.writesAuthorized===0 && e.productionAuthorized===false;
          if(!ok) process.exit(41); console.log('PASS_V25_GO_READONLY_BEFORE_SECRETS_ZERO_WRITE_CAPS');
          NODE

      - name: Install read-only dependency after GO
        if: steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: npm install --no-save --package-lock=false firebase-admin@13.10.0 >/dev/null

      - name: Materialize LAB credential after GO
        if: steps.detect.outputs.dispatch == 'true'
        id: cred
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB:-${FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB:-${FIREBASE_SERVICE_ACCOUNT:-}}}"
          [[ -n "$SERVICE_ACCOUNT" ]] || { echo STOP_V25_SERVICE_ACCOUNT_MISSING; exit 41; }
          KEY="$RUNNER_TEMP/orbit360-v25-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY"; chmod 600 "$KEY"
          [[ "$(jq -r '.project_id // empty' "$KEY")" == 'ays-orbit-360-lab' ]] || { echo STOP_V25_SERVICE_ACCOUNT_PROJECT_MISMATCH; exit 41; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one differential LAB adjudication read-only
        if: steps.detect.outputs.dispatch == 'true'
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.cred.outputs.key }}
          ORBIT360_PROJECT_ID: ays-orbit-360-lab
          ORBIT360_TENANT_ID: alianzas-soluciones
        run: |
          set -euo pipefail
          node tools/orbit360-diagnose-block1-universe-differential-v25-v20260807.mjs
          node - <<'NODE'
          const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.ORBIT360_V25_DIAGNOSTIC_EVIDENCE,'utf8'));
          const allowed=['VALIDATOR_STALE','DATA_CONTRACT_FAILURE','REQUIERE_VALIDACION','PASS_DATA_CONTRACT'];
          const ok=e.ok===true && allowed.includes(e.decision) && e.firestoreReads===3 && e.firestoreWrites===0 && e.authReads===0 && e.authWrites===0 && e.operationalWrites===0 && e.reimport===false && e.hostingTouched===false && e.browserExecuted===false && e.productionTouched===false && e.containsPII===false;
          if(!ok) process.exit(42); console.log('PASS_V25_ONE_DIAGNOSTIC_READ_SANITIZED_ZERO_WRITES');
          NODE

      - name: Consume freeze and close v25 authorization
        if: always() && steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: node tools/orbit360-close-block1-universe-diagnostic-v25-v20260807.mjs || true

      - name: Persist sanitized terminal diagnostic to canonical
        if: always() && steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          files=(
            "$ORBIT360_V25_REQUEST_FILE"
            'tools/orbit360-validator-lifecycle-block1-universe-diagnostic-v25-v20260807.json'
            "$ORBIT360_V25_PREFLIGHT_EVIDENCE"
            "$ORBIT360_V25_DIAGNOSTIC_EVIDENCE"
            "$ORBIT360_V25_FINAL_EVIDENCE"
          )
          for file in "${files[@]}"; do [[ -e "$file" ]] && git add "$file"; done
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic: persist Block1 v25 terminal closure [skip ci]'
            git push origin HEAD:ays/backend-tenant-lab-v99-20260703
          fi

      - name: Assert no Hosting browser or operational writes
        if: always() && steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -d orbit360-block1-v23-artifacts
          echo PASS_V25_NO_HOSTING_BROWSER_AUTH_OR_OPERATIONAL_WRITES
