# I6.6 forensic: distinguish durable server commit vs rejected client/callable. No data values or writes.
name: Gravicentra I6.6 Insurer SAVE Server Receipts Readonly
on:
  push:
    branches: [recovery/fase-a-clean-20260831]
    paths: [.github/workflows/gravicentra-i66-insurer-save-server-receipts-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'paulaosoriof86/orbit360-core' && github.ref_name == 'recovery/fase-a-clean-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      SA_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
      SA_ALT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
      SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install exact existing Firestore admin reader
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-admin@13.4.0 >/dev/null
      - name: Read only scoped insurer audit and operational receipts
        run: |
          node - <<'NODE'
          'use strict';
          const assert=require('node:assert/strict'),sdk=require('firebase-admin');
          const service=['SA_LAB','SA_ALT','SA_DEFAULT'].map(n=>process.env[n]).filter(Boolean).map(s=>{try{return JSON.parse(s);}catch(_){return null;}})
            .find(s=>s&&s.type==='service_account'&&s.project_id==='ays-orbit-360-lab'&&s.private_key);
          assert.ok(service,'I66_RECEIPT_EXISTING_AUTH_MISSING');
          sdk.initializeApp({credential:sdk.credential.cert(service),projectId:'ays-orbit-360-lab'});
          const db=sdk.firestore(),tenant=db.collection('tenants').doc('alianzas-soluciones');
          const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const iso=v=>{if(!v)return '';try{return (typeof v.toDate==='function'?v.toDate():new Date(v)).toISOString();}catch{return '';}};
          (async()=>{
            const [insSnap,members,advisors,requestSnaps,insurerDirectory]=await Promise.all([
              tenant.collection('data').doc('aseguradoras').collection('items').doc('gt-aseguradora-guatemalteca').get(),
              tenant.collection('members').limit(150).get(),
              tenant.collection('data').doc('asesores').collection('items').limit(400).get(),
              tenant.collection('operationalRequests').orderBy('committedAt','desc').limit(250).get(),
              tenant.collection('data').doc('aseguradoras').collection('items').limit(120).get()
            ]);
            assert.ok(insSnap.exists,'I66_INSURER_NOT_FOUND');
            assert.ok(members.size<150&&advisors.size<400,'I66_MEMBER_ADVISOR_BOUNDED_READ_HOLD');
            const advisorIds=new Set(),userIds=new Set();
            for(const d of advisors.docs){
              const a=d.data()||{};
              if([a.nombre,a.nombreCompleto,a.displayName,a.name].some(x=>norm(x).startsWith('carlos castro'))){
                advisorIds.add(d.id);
                for(const k of [a.authUid,a.uid,a.userId])if(k)userIds.add(String(k));
              }
            }
            const member=members.docs.filter(d=>{
              const m=d.data()||{},isCarlos=[m.nombre,m.displayName,m.name,m.nombreCompleto,m.fullName]
                .some(x=>norm(x).startsWith('carlos castro'))||advisorIds.has(String(m.advisorId||m.asesorId||''))||userIds.has(d.id);
              const roles=[m.activeRole,m.rol,m.rolDefault,...[].concat(m.roles||[])].map(norm);
              return isCarlos&&roles.includes('operativo')&&norm(m.activeRole)==='operativo'&&m.active!==false&&m.activo!==false&&
                !['inactivo','inactive','bloqueado','blocked'].includes(norm(m.status||m.estado));
            });
            assert.equal(member.length,1,'I66_CARLOS_SIGNED_ACTIVE_MEMBER_NOT_UNIQUE');
            const uid=member[0].id,row=insSnap.data()||{},events=Array.isArray(row.actividad)?row.actividad:[],recentISO='2026-11-11T17:00:00.000Z';
            const carlosEvents=events.filter(e=>e?.actorUid===uid),todayEvents=carlosEvents.filter(e=>iso(e.fecha)>=recentISO);
            const receipts=requestSnaps.docs.map(d=>d.data()||{}).filter(d=>d.insurerActor?.uid===uid&&Array.isArray(d.result?.insurerActivityEvents)
              &&d.result.insurerActivityEvents.some(e=>e?.id==='gt-aseguradora-guatemalteca'));
            const todayReceipts=receipts.filter(r=>iso(r.committedAt)>=recentISO);
            const safeEvents=events.slice(0,5).map(e=>({utc:iso(e.fecha),serverOwned:e.serverOwned===true,
              actorCarlos:e.actorUid===uid,changedFieldCount:Array.isArray(e.camposCambiados)?e.camposCambiados.length:null}));
            // Reproduce exactly the frontend authorize() guard using KEYS ONLY.
            // It receives the *complete* row although insurerWritePayload sends changed fields alone.
            const secretKey=/(pass(word)?|contrasena|contraseña|secret|token|credential|credencial|username|usuario|login)/i;
            const guardedKeys=obj=>Object.keys(obj||{}).filter(k=>secretKey.test(k));
            const guardImpacted=insurerDirectory.docs.filter(d=>guardedKeys(d.data()).length>0);
            const synthetic=insurerDirectory.docs.filter(d=>/^b4003qa_insurer_/i.test(d.id));
            console.log('I66_INSURER_REAL_LIVE_SERVER_RECEIPTS_READONLY='+JSON.stringify({
              insurerExists:insSnap.exists,recordUpdatedUtc:iso(row.updatedAt),auditRows:events.length,
              recentActivitySummary:safeEvents,carlosActivitySince1100GT:todayEvents.length,
              carlosCommittedRequestReceiptsSince1100GT:todayReceipts.length,
              lastCarlosReceiptUtc:receipts.length?iso(receipts[0].committedAt):null,
              scopedRequestWindow:requestSnaps.size,requestWindowTruncated:requestSnaps.size===250,
              frontendGuardWouldRejectExistingRealRow:guardedKeys(row).length>0,
              existingRealRowSensitiveTopLevelKeys:guardedKeys(row),
              insurerDirectorySize:insurerDirectory.size,insurerRecordsWronglyRejectedByWholeRowGuard:guardImpacted.length,
              syntheticCount:synthetic.length,syntheticWronglyRejected:synthetic.filter(d=>guardedKeys(d.data()).length>0).length,
              noBusinessFieldValuesEmitted:true,readsOnly:true,writes:0
            }));
          })().catch(e=>{console.error('I66_INSURER_RECEIPT_READONLY_HOLD='+String(e?.message||e).replace(/[^A-Za-z0-9_-]/g,'').slice(0,70));process.exitCode=1;});
          NODE
