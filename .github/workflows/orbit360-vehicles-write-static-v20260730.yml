name: Orbit 360 · Vehicles controlled write static readiness
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'tools/orbit360-vehicles-canonical-apply-v20260730.mjs'
      - 'tools/orbit360-test-vehicles-controlled-write-static-v20260730.mjs'
      - 'tools/orbit360-vehicles-write-freeze-v20260730.json'
      - '.github/workflows/orbit360-vehicles-write-once-v20260730.yml'
      - '.github/workflows/orbit360-vehicles-write-static-v20260730.yml'
permissions:
  contents: read
  statuses: write
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block8-vehicles-static-v20260730
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="8.0.1" and .failed==0 and .operationalWrites==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Sintaxis y contrato de write
        run: |
          set -euo pipefail
          node --check tools/orbit360-vehicles-canonical-apply-v20260730.mjs
          node --check tools/orbit360-test-vehicles-controlled-write-static-v20260730.mjs
          node tools/orbit360-test-vehicles-controlled-write-static-v20260730.mjs > /tmp/vehicles-write-static.json
          jq -e '.status=="STATIC_WRITE_READY" and .ok==true and .failed==0 and .operationalWrites==0 and .productionTouched==false' /tmp/vehicles-write-static.json >/dev/null
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');let state='failure',description='Vehicles write static readiness failed';
            try{const p=JSON.parse(fs.readFileSync('/tmp/vehicles-write-static.json','utf8'));if(p.status==='STATIC_WRITE_READY'&&p.failed===0){state='success';description='Vehicles STATIC_WRITE_READY: request still absent';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/vehicles-write-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
