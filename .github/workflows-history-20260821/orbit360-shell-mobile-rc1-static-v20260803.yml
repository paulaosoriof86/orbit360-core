name: Orbit 360 · Shell móvil RC1 estático y visual

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - orbit360-platform/styles/base.css
      - tools/orbit360-validar-shell-mobile-rc1-v20260803.mjs
      - tools/orbit360-validar-shell-mobile-visual-v20260803.mjs
      - .github/workflows/orbit360-shell-mobile-rc1-static-v20260803.yml
      - orbit360-platform/docs/**
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - orbit360-platform/styles/base.css
      - tools/orbit360-validar-shell-mobile-rc1-v20260803.mjs
      - tools/orbit360-validar-shell-mobile-visual-v20260803.mjs
      - .github/workflows/orbit360-shell-mobile-rc1-static-v20260803.yml
      - orbit360-platform/docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit360-shell-mobile-rc1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-shell-mobile-rc1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gate contract preflight
        run: node tools/orbit360-validar-gate-contracts-v20260717.mjs block7-canonical-runtime-cumulative-visual-lab-v20260801

      - name: Validar owner Shell/Topbar móvil
        run: node tools/orbit360-validar-shell-mobile-rc1-v20260803.mjs | tee shell-mobile-rc1-static.json

      - name: Instalar navegador focalizado
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar visualmente las tres rutas afectadas
        run: node tools/orbit360-validar-shell-mobile-visual-v20260803.mjs

      - name: Verificar delta permitido
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD | tee changed-files.txt
          while IFS= read -r file; do
            case "$file" in
              orbit360-platform/styles/base.css|tools/orbit360-validar-shell-mobile-rc1-v20260803.mjs|tools/orbit360-validar-shell-mobile-visual-v20260803.mjs|.github/workflows/orbit360-shell-mobile-rc1-static-v20260803.yml|orbit360-platform/docs/*) ;;
              *) echo "Archivo fuera del alcance autorizado: $file" >&2; exit 31 ;;
            esac
          done < changed-files.txt

      - name: Publicar evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-mobile-rc1-static-visual
          path: |
            shell-mobile-rc1-static.json
            changed-files.txt
            artifacts/shell-mobile-rc1/
          if-no-files-found: warn
          retention-days: 14
