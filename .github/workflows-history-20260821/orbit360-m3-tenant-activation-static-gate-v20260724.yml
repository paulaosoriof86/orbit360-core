name: Orbit 360 · M3 tenant activation static preparation
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m3-tenant-activation-static-request-v20260724.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m3-tenant-activation-static-v1
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block3-tenant-activation-static-v20260724
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m3-tenant-activation-static-request-v20260724.json
jobs:
  m3-static:
    name: M3 · Tenant activation static · No Secrets · No Firebase · No Writes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar solicitud estática inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${ORBIT360_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m3-tenant-activation-static-request-v1'||r.contractVersion!=='3.0.0')bad.push('schema');
          if(r.gateId!==process.env.ORBIT360_GATE_ID||r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent)bad.push('binding');
          if(r.explicitStaticAuthorization!==true||r.allowedExecutions!==1||r.staticOnly!==true)bad.push('authorization');
          if(r.secretAccess!==false||r.firebaseAccess!==false||r.firestoreRead!==false||r.runtime!==false||r.activation!==false||r.writes!==false||r.rulesChange!==false||r.deploy!==false||r.imports!==false||r.mergeMain!==false)bad.push('scope');
          if(bad.length)throw new Error('REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="3.0.0" and .failed==0 and .m2Closed==true and .staticAuthorized==true and .allowedStaticExecutions==1 and .m3ActivationAuthorized==false and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .rulesApplied==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Probar contrato estático M3
        shell: bash
        run: node tools/orbit360-m3-tenant-activation-static-contract-v20260724.cjs
      - name: Validar aceptación sanitizada
        shell: bash
        run: |
          jq -e '.ok==true and .status=="M3_TENANT_ACTIVATION_STATIC_READY" and .failed==0 and .writeAuthorized==false and .writeExecuted==false and .activationAuthorized==false and .activationExecuted==false and .secretAccess==false and .firebaseAccess==false and .firestoreRead==false and .rulesChanged==false and .configurationWrites==0 and .membershipWrites==0 and .clientWrites==0 and .insurerWrites==0 and .m4Deferred==true' orbit360-platform/runtime-gate-crm-v20260716/m3-tenant-activation-static-summary.json >/dev/null
      - name: Subir evidencia estática sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m3-tenant-activation-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m3-tenant-activation-static-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable sanitizado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          summary='orbit360-platform/runtime-gate-crm-v20260716/m3-tenant-activation-static-summary.json'
          state=failure; description='M3 tenant activation static preparation failed'
          if [ -f "$summary" ] && [ "$(jq -r '.ok // false' "$summary")" = true ]; then state=success; description='M3 tenant activation static preparation ready'; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m3-tenant-activation-static-v1"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
