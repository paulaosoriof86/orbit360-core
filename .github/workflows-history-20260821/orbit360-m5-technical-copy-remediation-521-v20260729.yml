# mechanism-revision: visible-dom-proxy-v2-closed
name: Orbit 360 · M5 technical-copy validator remediation · 5.0.21
run-name: M5 5.0.21 · static technical-copy remediation · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: ae6bb2a35ce4f03c0353d670218c841e51b57a2461a3ba9e741d8bd7a973fd61

jobs:
  technical_copy_static:
    name: M5 · prove technical-copy validator fix · no runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history for protected-file proof
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar rama SHA y ejecución manual congelada
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 60562d429f2aff5583c47eeb5bf4d88c08deb184^{commit}

      - name: Preflight canónico 5.0.21 sin capacidades operativas
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-visible-technical-copy-predicate-v20260729.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-technical-copy-remediation-521-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-522-browser-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-522-close-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.ok==true and .status=="M5_TECHNICAL_COPY_REMEDIATION_521_STATIC_PASS" and .contractVersion=="5.0.21" and .classification=="VALIDATOR_STALE" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .candidateRuntimeContractVersion=="5.0.22" and .visibleTechnicalCopyPredicateVersion=="20260729.1" and .productDefectDemonstrated==false and .sourceWideScanUsedAsVisibleCopyProxy==false and .whiteLabelAllowed==true and .isolatedLabBlocked==true and .historical518Unchanged==true and .productProtectedUnchanged==true and .candidateExecuted==false and .failed==0 and .passed==.total and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .secrets==false and .deploy==false and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .visualReview==false and .policies==false and .["pólizas"]==false and .containsPII==false and .containsSecrets==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Validar regresiones semánticas
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .failed==0 and .passed==.total and (.checks|map(select(.ok==false))|length)==0 and .rootCause=="bare_LAB_regex_alternative_matched_lab_substring_inside_White-label" and .sourceWideScanUsedAsVisibleCopyProxy==false and .whiteLabelAllowed==true and .isolatedLabBlocked==true and .historical518Unchanged==true and .productProtectedUnchanged==true' "$ORBIT360_EVIDENCE_DIR/m5-technical-copy-remediation-521-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-technical-copy-remediation-521-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-technical-copy-remediation-521-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-technical-copy-remediation-521-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.21 technical-copy validator remediation failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true){state='success';description='M5 technical-copy validator semantic fix PASS; product unchanged';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-technical-copy-521',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
