name: Orbit 360 · M5 5.0.40 static router binding
run-name: M5 5.0.40 · bind legacy seed marker static gate · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-static-router-540-trigger-v20260730.json'

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 2
      - name: Reemplazo exacto único
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/orbit360-validar-gate-contracts-v20260717.mjs');s=p.read_text()
          old='"block5-release-candidate-visualization-v20260728":{contractVersion:"5.0.39",lifecycle:"tools/orbit360-validator-lifecycle-contract-m5-runtime-stop-539-v20260730.json",engine:"tools/orbit360-validar-gate-contracts-engine-m5-runtime-stop-539-v20260730.mjs"}'
          new='"block5-release-candidate-visualization-v20260728":{contractVersion:"5.0.40",lifecycle:"tools/orbit360-validator-lifecycle-contract-m5-academia-legacy-seed-marker-540-v20260730.json",engine:"tools/orbit360-validar-gate-contracts-engine-m5-academia-legacy-seed-marker-540-v20260730.mjs"}'
          if s.count(old)!=1: raise SystemExit(f'EXPECTED_EXACTLY_ONE_STOP_539_ENTRY:{s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
      - name: Commit único
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-ci'
          git config user.email 'orbit360-ci@users.noreply.github.com'
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs
          git diff --cached --quiet && { echo NO_PATCH >&2; exit 41; }
          git commit -m 'm5 5.0.40: bind canonical gate to legacy seed marker static validation'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'${{ job.status }}'==='success'?'success':'failure',context:'orbit360/m5-static-router-540',description:'M5 5.0.40 static gate binding '+('${{ job.status }}'==='success'?'PASS':'FAIL')});
