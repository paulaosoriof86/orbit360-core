name: Orbit 360 · root fix evidence path Gate 7.13

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/rootfix-evidence-path-gate713-v20260803.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: orbit360-rootfix-evidence-path-gate713-v20260803
  cancel-in-progress: false

env:
  REQUEST: .github/orbit360-requests/rootfix-evidence-path-gate713-v20260803.json
  CANDIDATE: b699ba329960cd830121b57452ce558399aa84fb
  RELEASE_BRANCH: release/gravicentra-insurance-rc1-2-membership-auth-20260803
  EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/rc12-auth-membership-rootfix-path-proof.json
  STATUS_CONTEXT: orbit360/rootfix-evidence-path-gate713

jobs:
  rootfix:
    name: Gate 7.13 · root fix aislado · cero datos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout request exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar STOP_RETRY y frontera source-only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.status=="AUTHORIZED_VALIDATOR_ROOTFIX_ONLY" and .classification=="VALIDATOR_STALE" and .secondaryClassification=="PIPELINE_MECHANISM_FAILURE" and .failedRuns==[30877460688,30879185924] and .candidate==env.CANDIDATE and .secrets==false and .firestoreRead==false and .authRead==false and .writes==false and .browser==false and .deploy==false and .production==false and .consumed==false' "$REQUEST" >/dev/null
          git fetch --no-tags origin "$RELEASE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          node --check tools/orbit360-validar-auth-membership-antiregression-rootfix-v20260803.mjs
          node --check tools/orbit360-aplicar-rootfix-evidence-path-gate713-v20260803.mjs

      - name: Aplicar root fix coordinado
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-aplicar-rootfix-evidence-path-gate713-v20260803.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-rc12-rootcause-cumulative-closure-v20260803.mjs
          node --check tools/orbit360-validar-auth-membership-antiregression-rootfix-v20260803.mjs
          bash -n .github/workflows/orbit360-rc12-rootcause-cumulative-closure-v20260803.yml 2>/dev/null || true
          git diff --check

      - name: Probar source root y output absoluto independientes
        shell: bash
        run: |
          set -euo pipefail
          RC12_ROOT="$RUNNER_TEMP/rc12-rootfix-source"
          git worktree add --detach "$RC12_ROOT" "$CANDIDATE"
          ABS_OUT="$GITHUB_WORKSPACE/$EVIDENCE"
          rm -f "$ABS_OUT"
          ORBIT360_AUTH_MEMBERSHIP_SOURCE_ROOT="$RC12_ROOT" \
          ORBIT360_AUTH_MEMBERSHIP_EVIDENCE="$ABS_OUT" \
            node tools/orbit360-validar-auth-membership-antiregression-rootfix-v20260803.mjs
          test -f "$ABS_OUT"
          jq -e '.schemaVersion=="orbit360-auth-membership-antiregression-rootfix-v3" and .status=="PASS" and .classification=="GO_STATIC_AUTH_MEMBERSHIP" and .total==16 and .passed==16 and .failed==0 and .outputPathAbsolute==true and .sourceRootIndependentFromOutput==true and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .productionTouched==false' "$ABS_OUT" >/dev/null
          test -z "$(git -C "$RC12_ROOT" diff --name-only)"
          test ! -f "$RC12_ROOT/$EVIDENCE"
          git worktree remove --force "$RC12_ROOT"

      - name: Persistir root fix y evidencia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/orbit360-validar-gate-contracts-engine-rc12-rootcause-cumulative-closure-v20260803.mjs \
            tools/orbit360-validator-lifecycle-contract-rc12-rootcause-cumulative-closure-v20260803.json \
            .github/workflows/orbit360-rc12-rootcause-cumulative-closure-v20260803.yml \
            "$EVIDENCE"
          git commit -m 'validator: cerrar root fix de rutas Gate 7.13'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703

      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,
              repo:context.repo.repo,
              sha:context.sha,
              state:'${{ job.status }}' === 'success' ? 'success' : 'failure',
              context:process.env.STATUS_CONTEXT,
              description:'${{ job.status }}' === 'success' ? 'Gate 7.13 · output absoluto probado · PASS' : 'Gate 7.13 · root fix de rutas incompleto',
              target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc12-rootfix-evidence-path-gate713-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE }}
            orbit360-platform/docs/DIAGNOSTICO-ROOTFIX-EVIDENCE-PATH-GATE713-RC12-20260803.md
          if-no-files-found: warn
          retention-days: 30
