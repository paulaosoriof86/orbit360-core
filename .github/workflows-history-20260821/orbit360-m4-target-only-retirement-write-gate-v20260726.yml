name: Orbit 360 · M4 atomic retirement write of 4 obsolete target-only · WRITE_ONCE
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m4-target-only-retirement-write-request-v20260726.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m4-target-only-retirement-write
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block4-target-only-retirement-write-v20260726
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m4-target-only-retirement-write-request-v20260726.json
  ORBIT360_EXISTING_FIREBASE_PROJECT_ID: ays-orbit-360-lab
jobs:
  retirement-write:
    name: M4 · Retire exactly 4 obsolete target-only · Atomic write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2, persist-credentials: false}
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validar autorización inmutable sin acceso externo
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${ORBIT360_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),bad=[];
          if(r.schemaVersion!=='orbit360-m4-target-only-retirement-write-request-v1'||r.contractVersion!=='4.2.9')bad.push('schema');
          if(r.gateId!==process.env.ORBIT360_GATE_ID||r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent)bad.push('binding');
          if(r.explicitAuthorization!==true||r.allowedExecutions!==1||r.atomicRetirementWrite!==true)bad.push('authorization');
          if(r.expectedClientObsolete!==2||r.expectedInsurerObsolete!==2||r.expectedTotalObsolete!==4||r.snapshotWritesAuthorized!==4||r.auditWritesAuthorized!==4||r.clientDeletesAuthorized!==2||r.insurerDeletesAuthorized!==2||r.emergencyRollbackAuthorized!==true||r.maxRollbackRestores!==4)bad.push('counts');
          if(r.gtGtqWrite!==false||r.otherClientWrites!==false||r.otherInsurerWrites!==false||r.merges!==false||r.imports!==false||r.policies!==false||r.deploy!==false||r.production!==false||r.mergeMain!==false||r.containsPII!==false||r.containsSecrets!==false)bad.push('scope');
          if(bad.length)throw new Error('REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico antes de secretos y escrituras
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="4.2.9" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .activationMode=="immutable_request_present" and .literalSourceInspection==false and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Probar contrato antes de secretos y escrituras
        run: node tools/orbit360-m4-target-only-retirement-write-contract-v20260726.cjs
      - name: Resolver cuenta existente después del preflight
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m4-target-only-retirement-write.json"; printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_EXISTING_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"; echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Instalar dependencia controlada
        run: npm install --no-save --ignore-scripts firebase-admin@13
      - name: Ejecutar retiro atómico de exactamente cuatro registros
        run: node tools/orbit360-m4-target-only-retirement-write-v20260726.mjs
      - name: Validar evidencia sanitizada
        shell: bash
        run: |
          jq -e '.ok==true and .status=="M4_TARGET_ONLY_RETIREMENT_WRITE_COMPLETED" and .transactionCommitted==true and .priorDryRunClosureValidated==true and .targetCollectionSemantic=="target_only_overlay" and .before.sourceClients==414 and .before.sourceInsurers==26 and .before.targetClients==2 and .before.targetInsurers==2 and .after.sourceClients==414 and .after.sourceInsurers==26 and .after.targetClients==0 and .after.targetInsurers==0 and .selection.clientSelected==2 and .selection.insurerSelected==2 and .selection.totalSelected==4 and .selection.classification=="obsolete" and .selection.deterministicSelection==true and .selection.recordIdsExported==false and .selection.rawValuesExported==false and .writes.snapshotWrites==4 and .writes.auditWrites==4 and .writes.clientDeletes==2 and .writes.insurerDeletes==2 and .writes.totalOperationalWrites==12 and .writes.gtGtqWrites==0 and .rollback.available==true and .rollback.executed==false and .audit.mode=="append_only" and .audit.eventsWritten==4 and .verification.snapshotReadback==4 and .verification.auditReadback==4 and .verification.deletedTargetReadback==4 and .verification.targetOnlyRemaining==0 and .verification.sourceCountsUnchanged==true and .approvalReadyForPostRetirementRevalidation==true and .approvalReadyForClientCorrectionWrite==false and .approvalReadyForM4Write==false and .containsPII==false and .containsSecrets==false' orbit360-platform/runtime-gate-crm-v20260716/m4-target-only-retirement-write-summary.json >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m4-target-only-retirement-write-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-target-only-retirement-write-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-target-only-retirement-write-summary.json
          retention-days: 30
      - name: Publicar estado observable sanitizado
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          summary='orbit360-platform/runtime-gate-crm-v20260716/m4-target-only-retirement-write-summary.json'; state=failure; description='M4 target-only retirement write failed'
          if [ -f "$summary" ] && [ "$(jq -r '.ok // false' "$summary")" = true ]; then state=success; description='M4 target-only retirement write completed'; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m4-target-only-retirement-write"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - name: Limpiar material efímero
        if: always()
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-}"
