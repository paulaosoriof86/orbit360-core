name: Orbit 360 · M4 durable writer · READONLY_DRYRUN_ONCE
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m4-durable-writer-dryrun-request-v20260724.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m4-durable-writer-dryrun
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block4-durable-writer-dryrun-v20260724
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m4-durable-writer-dryrun-request-v20260724.json
  ORBIT360_EXISTING_FIREBASE_PROJECT_ID: ays-orbit-360-lab
jobs:
  durable-writer-dryrun:
    name: M4 · Durable writer dry-run read-only · No Rules · No Writes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar autorización inmutable sin acceso externo
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${ORBIT360_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m4-durable-writer-dryrun-request-v1'||r.contractVersion!=='4.1.0')bad.push('schema');
          if(r.gateId!==process.env.ORBIT360_GATE_ID||r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent)bad.push('binding');
          if(r.explicitAuthorization!==true||r.allowedExecutions!==1||r.readOnlyDryRun!==true)bad.push('authorization');
          if(r.m3Closed!==true||r.m4StaticClosed!==true||r.expectedProjectId!==process.env.ORBIT360_EXISTING_FIREBASE_PROJECT_ID)bad.push('prerequisites');
          if(r.createProject!==false||r.createAuthUser!==false||r.updateAuthUser!==false||r.createMembership!==false||r.updateMembership!==false||r.configurationWrites!==false||r.operationalWrites!==false||r.clientWrites!==false||r.insurerWrites!==false||r.auditWrites!==false||r.applyRules!==false||r.hostingDeploy!==false||r.functionsDeploy!==false||r.imports!==false||r.policies!==false||r.mergeMain!==false)bad.push('scope');
          if(r.containsPII!==false||r.containsSecrets!==false)bad.push('sanitization');
          if(bad.length)throw new Error('REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="4.1.0" and .failed==0 and .m3Closed==true and .m4StaticClosed==true and .dryRunAuthorized==true and .allowedDryRunExecutions==1 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .rulesApplied==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Probar contrato dry-run M4 antes de secretos
        shell: bash
        run: node tools/orbit360-m4-durable-writer-dryrun-contract-v20260724.cjs
      - name: Resolver cuenta existente después del preflight
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m4-durable-writer-dryrun.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_EXISTING_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Instalar dependencia read-only controlada
        shell: bash
        run: npm install --no-save --ignore-scripts firebase-admin@13
      - name: Ejecutar dry-run externo read-only M4
        shell: bash
        run: node tools/orbit360-m4-durable-writer-dryrun-v20260724.mjs
      - name: Validar aceptación sanitizada
        shell: bash
        run: |
          jq -e '.ok==true and .status=="M4_DURABLE_WRITER_DRYRUN_COMPLETED" and .remoteReadConfirmed==true and .sourceCounts.clientes==414 and .sourceCounts.aseguradoras==26 and .sourceCounts.memberships>=1 and .sameInputSameIdempotencyKey==true and .writeAuthorized==false and .writeExecuted==false and .rulesChanged==false and .configurationWrites==0 and .membershipWrites==0 and .clientWrites==0 and .insurerWrites==0 and .auditWrites==0 and .secretValueCount==0' orbit360-platform/runtime-gate-crm-v20260716/m4-durable-writer-dryrun-summary.json >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m4-durable-writer-dryrun-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-durable-writer-dryrun-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-durable-writer-dryrun-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable sanitizado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          summary='orbit360-platform/runtime-gate-crm-v20260716/m4-durable-writer-dryrun-summary.json'
          state=failure; description='M4 durable writer dry-run failed'
          if [ -f "$summary" ] && [ "$(jq -r '.ok // false' "$summary")" = true ]; then state=success; description='M4 durable writer dry-run completed'; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m4-durable-writer-dryrun"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - name: Limpiar material efímero
        if: always()
        shell: bash
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-}"
