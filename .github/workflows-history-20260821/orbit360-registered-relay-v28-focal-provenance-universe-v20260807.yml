name: Orbit360 registered relay v28 focal provenance universe read-only

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: orbit360-registered-runtime-relay-v28
  cancel-in-progress: false

jobs:
  registered-runtime-relay-v28:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORBIT360_CANONICAL_BRANCH: ays/backend-tenant-lab-v99-20260703
      ORBIT360_TRANSPORT_HEAD_REF: ${{ github.head_ref }}
      ORBIT360_GATE_PROFILE: v28-focal-provenance-universe
      ORBIT360_V28_REQUEST_FILE: .github/orbit360-requests/block1-client360-insurers-v28-focal-provenance-universe-authorization.json
      ORBIT360_REQUEST_FILE: .github/orbit360-requests/block1-client360-insurers-v28-focal-provenance-universe-authorization.json
      ORBIT360_EXPECTED_REQUEST_VERSION: 20260807.28-focal-provenance-universe-readonly
      ORBIT360_V28_PREFLIGHT_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v28-block1-preflight-sanitized-v20260807.json
      ORBIT360_V28_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v28-block1-focal-provenance-universe-sanitized-v20260807.json
      ORBIT360_V28_FINAL_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v28-block1-final-sanitized-v20260807.json
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect exclusive immutable v28 request before secrets
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$ORBIT360_V28_REQUEST_FILE"
          if [[ "${GITHUB_EVENT_NAME:-}" != 'pull_request' || "${ORBIT360_TRANSPORT_HEAD_REF:-}" != "$ORBIT360_CANONICAL_BRANCH" ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"; echo SKIP_V28_NONCANONICAL_CONTEXT; exit 0
          fi
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          if [[ "${#changed[@]}" != '1' || "${changed[0]}" != "$REQUEST" ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"; echo SKIP_V28_NOT_EXCLUSIVE_REQUEST_COMMIT; exit 0
          fi
          PARENT="$(git rev-parse HEAD^)"
          BASE_REF="${GITHUB_BASE_REF:-}"
          [[ -n "$BASE_REF" ]] || { echo STOP_V28_TRANSPORT_BASE_REF_MISSING; exit 41; }
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}^{commit}" 2>/dev/null || true)"
          [[ -n "$BASE_SHA" && "$BASE_SHA" == "$PARENT" ]] || { echo "STOP_V28_TRANSPORT_BASE_SHA_MISMATCH"; exit 41; }
          node - "$PARENT" <<'NODE'
          const fs=require('fs');const parent=process.argv[2];const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_V28_REQUEST_FILE,'utf8'));
          const ok=r.requestVersion===process.env.ORBIT360_EXPECTED_REQUEST_VERSION&&r.authorizationGeneration==='v28-focal-provenance-universe-readonly'&&r.gateId==='block1-client360-insurers-lab-v20260717'&&r.contractVersion==='1.0.41'&&r.status==='AUTHORIZED_ONCE'&&r.approved===true&&r.allowedExecutions===1&&r.consumed===false&&r.authorizationFrozen===false&&r.replayAllowed===false&&r.parentHead===parent&&r.authorizedBaseHead===parent;
          if(!ok)process.exit(41);
          NODE
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          echo "request_parent=$PARENT" >> "$GITHUB_OUTPUT"
          echo PASS_V28_EXCLUSIVE_REQUEST_PARENT_BOUND_BEFORE_SECRETS

      - name: Require first and only attempt
        if: steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: GO_GATE_CONTRACT through canonical entrypoint before secrets
        if: steps.detect.outputs.dispatch == 'true'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="GO_BLOCK1_FOCAL_PROVENANCE_UNIVERSE_READONLY_V28" and .ok==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .browserAuthorized==false and .hostingAuthorized==false and .writesAuthorized==0' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
          echo PASS_V28_GO_GATE_CONTRACT_BEFORE_SECRETS

      - name: Runtime preflight before secrets
        if: steps.gate.outcome == 'success'
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-preflight-block1-focal-provenance-universe-v28-v20260807.mjs runtime
          jq -e '.status=="GO_V28_FOCAL_PROVENANCE_UNIVERSE_READONLY" and .firestoreReadOperationsMaximum==5 and .targetedClientPayloadReadsMaximum==16 and .firestoreWriteAuthorized==false and .browserAuthorized==false and .hostingAuthorized==false and .ok==true' "$ORBIT360_V28_PREFLIGHT_EVIDENCE" >/dev/null
          echo PASS_V28_RUNTIME_PREFLIGHT_BEFORE_SECRETS

      - name: Install read-only Firestore dependency after GO
        if: steps.preflight.outcome == 'success'
        id: admin
        shell: bash
        run: npm install --no-save --package-lock=false firebase-admin@13.10.0 >/dev/null

      - name: Materialize LAB credential after GO
        if: steps.admin.outcome == 'success'
        id: credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB:-${FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB:-${FIREBASE_SERVICE_ACCOUNT:-}}}"
          [[ -n "$SERVICE_ACCOUNT" ]] || { echo STOP_V28_SERVICE_ACCOUNT_MISSING; exit 41; }
          KEY="$RUNNER_TEMP/orbit360-v28-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY"; chmod 600 "$KEY"
          [[ "$(jq -r '.project_id // empty' "$KEY")" == 'ays-orbit-360-lab' ]] || { echo STOP_V28_SERVICE_ACCOUNT_PROJECT_MISMATCH; exit 41; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Execute one focal provenance then universe adjudication
        if: steps.credential.outcome == 'success'
        id: adjudication
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.credential.outputs.key }}
          ORBIT360_PROJECT_ID: ays-orbit-360-lab
          ORBIT360_TENANT_ID: alianzas-soluciones
        run: node tools/orbit360-focal-client-provenance-universe-v28-v20260807.mjs

      - name: Consume freeze and close v28 authorization
        if: always() && steps.detect.outputs.dispatch == 'true' && steps.gate.outcome != 'skipped'
        id: closure
        shell: bash
        run: node tools/orbit360-close-block1-focal-provenance-universe-v28-v20260807.mjs || true

      - name: Persist sanitized terminal closure to canonical
        if: always() && steps.detect.outputs.dispatch == 'true' && steps.gate.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          files=("$ORBIT360_V28_REQUEST_FILE" 'tools/orbit360-validator-lifecycle-block1-focal-provenance-universe-v28-v20260807.json' "$ORBIT360_V28_PREFLIGHT_EVIDENCE" "$ORBIT360_V28_EVIDENCE" "$ORBIT360_V28_FINAL_EVIDENCE" 'orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json')
          for file in "${files[@]}"; do [[ -e "$file" ]] && git add "$file"; done
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist Block1 v28 terminal closure [skip ci]'
            git push origin HEAD:ays/backend-tenant-lab-v99-20260703
          fi

      - name: Assert zero Hosting browser Auth or operational writes
        if: always() && steps.detect.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo PASS_V28_NO_HOSTING_BROWSER_AUTH_OR_OPERATIONAL_WRITES
