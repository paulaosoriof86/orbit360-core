name: Orbit 360 · Gate 7.11 · snapshot código diagnóstico

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-source-snapshot-diagnostic-run-v20260802.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-gate711-source-snapshot-diagnostic-v20260802
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 997fca628f95dd397dba347700a6bc644fe840f0
  REQUEST_FILE: .github/orbit360-static-requests/gate711-source-snapshot-diagnostic-run-v20260802.json
  STATUS_CONTEXT: orbit360/gate711-source-snapshot-diagnostic

jobs:
  snapshot:
    name: Source-only · core y módulos · sin datos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publicar estado pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state pending --arg context "$STATUS_CONTEXT" --arg description "Gate 7.11 snapshot código diagnóstico" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status.json" >/dev/null

      - name: Verificar request y freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST_FILE")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST_FILE"
          jq -e --arg product "$PRODUCT_HEAD" '.schemaVersion=="orbit360-gate711-source-snapshot-diagnostic-request-v1" and .productHead==$product and .approved==true and .allowedExecutions==1 and .consumed==false and .sourceRun==30774888921 and .scope=="CORE_MODULES_SOURCE_ONLY" and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST_FILE" >/dev/null
          mapfile -t PRODUCT_DIFF < <(git diff --name-only "$PRODUCT_HEAD"..HEAD -- orbit360-platform/index.html orbit360-platform/modules orbit360-platform/core orbit360-platform/styles orbit360-platform/data)
          test "${#PRODUCT_DIFF[@]}" = '0'

      - name: Construir snapshot sin datos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-source/orbit360-platform
          cp -R orbit360-platform/core diagnostic-source/orbit360-platform/core
          cp -R orbit360-platform/modules diagnostic-source/orbit360-platform/modules
          cp orbit360-platform/index.html diagnostic-source/orbit360-platform/index.html
          find diagnostic-source -type f ! -name '*.js' ! -name '*.html' -delete
          find diagnostic-source -type f -print0 | sort -z | xargs -0 sha256sum > diagnostic-source/SHA256SUMS.txt
          test "$(find diagnostic-source/orbit360-platform -type f | wc -l)" -gt 10

      - name: Guardar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gate711-source-snapshot-diagnostic-v20260802
          path: diagnostic-source
          if-no-files-found: error
          retention-days: 7

      - name: Publicar estado final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then STATE=success; DESCRIPTION="Gate 7.11 snapshot código PASS"; else STATE=failure; DESCRIPTION="Gate 7.11 snapshot código FAIL / STOP_RETRY"; fi
          jq -n --arg state "$STATE" --arg context "$STATUS_CONTEXT" --arg description "$DESCRIPTION" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status-final.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status-final.json" >/dev/null
