name: Orbit360 R4 Role Session Timing Probe V2 20260815

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4-role-session-timing-probe-v2-20260815.yml'
      - 'tools/orbit360-r4-role-session-timing-probe-v20260815.cjs'

permissions:
  contents: read

env:
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_R4_URL: https://app.aysseguros.com
  ORBIT360_R4_PACKAGE_SOURCE_HEAD: 4f70f0dd6e870e8c7443a7638a9dc6e954eace1b
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical gate before secrets/browser
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node tools/orbit360-r4-certified-product-smoke-wrapper-v20260815.mjs --self-test
          node --check tools/orbit360-r4-role-session-timing-probe-v20260815.cjs
          jq -e '.ok==true and .classification=="VALIDATOR_STALE_ROOTFIX_PASS"' "$EVIDENCE_DIR/r4-certified-validator-rootfix-source-v20260815.json" >/dev/null
      - name: Install timing tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Bind existing protected smoke identity
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_EXISTING_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_EXISTING_LOGIN_PASSWORD} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-r4-role-timing-v2.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PRODUCT_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_SMOKE_PASSWORD=$ORBIT360_EXISTING_LOGIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Resolve existing smoke identity read-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .requiredRolesPresent==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-smoke-identity-summary.json" >/dev/null
      - name: Measure role-session synchronous chain
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-r4-role-session-timing-probe-v20260815.cjs
          jq -e '.ok==true and .status=="ROLE_SESSION_TIMING_COMPLETE" and .runtimeReady==true and .storeReady==true and .clients==430 and .insurers==30 and .roleSetResult==true and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and (.writeSignals|length)==0 and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/r4-role-session-timing-probe-v20260815.json" >/dev/null
      - name: Cleanup protected key material
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4-role-session-timing-probe-v2-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m6-product-smoke-identity-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/r4-role-session-timing-probe-v20260815.json
          if-no-files-found: warn
          retention-days: 14
