name: Gravicentra Insurance RC1.2 · cierre post-rootfix Gate 7.13

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/rc12-rootcause-cumulative-closure-post-rootfix-v20260803.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-rc12-rootcause-cumulative-closure-v20260803
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  RESUME_REQUEST: .github/orbit360-requests/rc12-rootcause-cumulative-closure-post-rootfix-v20260803.json
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/rc12-rootcause-cumulative-closure-v20260803.json
  ORBIT360_GATE_ID: block7.13-rc12-membership-rootcause-cumulative-closure-v20260803
  ORBIT360_RELEASE_BRANCH: release/gravicentra-insurance-rc1-2-membership-auth-20260803
  ORBIT360_RELEASE_COMMIT: b699ba329960cd830121b57452ce558399aa84fb
  ORBIT360_BASELINE: 27cb7dfcda8568280ebef15993a953364304f29b
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_LIVE_URL: https://ays-orbit-360-lab.web.app
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ROOTFIX_PROOF: orbit360-platform/runtime-gate-crm-v20260716/rc12-auth-membership-rootfix-path-proof.json
  STATUS_CONTEXT: orbit360/rc12-closure-post-rootfix

jobs:
  closure:
    name: RC1.2 · post-rootfix · causa raíz · Hosting · 3 perfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout request post-rootfix
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar root fix probado y misma autorización
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-rc12-post-rootfix-resume-request-v1" and .status=="RESUME_SAME_AUTHORIZATION_AFTER_VALIDATOR_ROOTFIX" and .failedRun==30879185924 and .failedJob==91896674853 and .failedStage=="auth-antiregression-evidence-observability-before-secrets" and .previousGate713=="PASS_17_OF_17" and .rootfixRun==30879344813 and .rootfixArtifact==8880678880 and .rootfixProof=="PASS_16_OF_16" and .previousSecretsRead==false and .previousFirestoreRead==false and .previousAuthRead==false and .previousWrites==false and .previousDeploy==false and .previousProductionTouched==false and .releaseCommit==env.ORBIT360_RELEASE_COMMIT and .newAuthorization==false and .consumed==false' "$RESUME_REQUEST" >/dev/null
          jq -e '.schemaVersion=="orbit360-auth-membership-antiregression-rootfix-v3" and .status=="PASS" and .classification=="GO_STATIC_AUTH_MEMBERSHIP" and .total==16 and .passed==16 and .failed==0 and .outputPathAbsolute==true and .sourceRootIndependentFromOutput==true and .sourceRun==30879344813 and .sourceArtifact==8880678880 and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .productionTouched==false' "$ROOTFIX_PROOF" >/dev/null
          jq -e '.status=="AUTHORIZED_SINGLE_MACRO" and .approved==true and .allowedExecutions==1 and .releaseCommit==env.ORBIT360_RELEASE_COMMIT and .baseline==env.ORBIT360_BASELINE and .scope.authWrites==false and .scope.userCreates==false and .scope.userUpdates==false and .scope.reimport==false and .scope.rules==false and .scope.functions==false and .scope.main==false and .scope.merge==false' "$ORBIT360_REQUEST_FILE" >/dev/null
          git fetch --no-tags origin "$ORBIT360_BRANCH" "$ORBIT360_RELEASE_BRANCH"
          test "$(git rev-parse origin/$ORBIT360_RELEASE_BRANCH)" = "$ORBIT360_RELEASE_COMMIT"
          test "$(git merge-base "$ORBIT360_BASELINE" "$ORBIT360_RELEASE_COMMIT")" = "$ORBIT360_BASELINE"
          RC12_ROOT="$RUNNER_TEMP/gravicentra-insurance-rc12-post-rootfix"
          git worktree add --detach "$RC12_ROOT" "$ORBIT360_RELEASE_COMMIT"
          echo "ORBIT360_RC12_ROOT=$RC12_ROOT" >> "$GITHUB_ENV"
          echo "ORBIT360_RC1_ROOT=$RC12_ROOT" >> "$GITHUB_ENV"
          echo "ORBIT360_RC12_PRIVATE_IDENTITIES=$RUNNER_TEMP/gravicentra-rc12-identities.json" >> "$GITHUB_ENV"
          echo "ORBIT360_MEMBERSHIP_PRIVATE_PLAN=$RUNNER_TEMP/gravicentra-rc12-membership-plan.json" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$RUNNER_TEMP/gravicentra-rc12-service-account.json" >> "$GITHUB_ENV"
          test "$(jq -r '.hosting.public' "$RC12_ROOT/firebase.json")" = 'orbit360-platform'

      - name: Gate 7.13 y matriz forense antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_REQUEST_FILE="$ORBIT360_REQUEST_FILE" node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="RC12_ROOTCAUSE_CUMULATIVE_CLOSURE_EXECUTION_READY" and .total==17 and .passed==17 and .failed==0 and .maximumFirestoreDocumentsWritten==1 and .authWriteAuthorized==false and .deployAuthorized==true and .rulesDeployAuthorized==false and .functionsDeployAuthorized==false and .dataAccess==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .deployExecuted==false and .productionTouched==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          jq -e '.decision=="GO_STATIC_CUMULATIVE_MODULE_PARITY_WITH_MATURITY_GAPS" and .ok==true and .counts.routes==31 and .counts.failedModules==0 and .guarantees.moduleTreeParityBaseline==true and .guarantees.moduleTreeParityLive==true and .guarantees.noPostBaselineModuleChangesInLive==true' "$ORBIT360_EVIDENCE_DIR/rc12-forensic-module-audit.json" >/dev/null
          node --check tools/orbit360-normalizar-membership-direccion-rc12-v20260803.mjs
          grep -F 'membership_document_id_uid_mismatch' tools/orbit360-normalizar-membership-direccion-rc12-v20260803.mjs
          bash -n tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh
          grep -F 'firebase deploy --only hosting --project "$ORBIT360_PROJECT_ID" --config firebase.json --non-interactive' tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh

      - name: Ejecutar validador Auth rootfixed antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          ABS_OUT="$GITHUB_WORKSPACE/$ORBIT360_EVIDENCE_DIR/rc12-auth-membership-antiregression.json"
          rm -f "$ABS_OUT"
          ORBIT360_AUTH_MEMBERSHIP_SOURCE_ROOT="$ORBIT360_RC12_ROOT" \
          ORBIT360_AUTH_MEMBERSHIP_EVIDENCE="$ABS_OUT" \
            node tools/orbit360-validar-auth-membership-antiregression-rootfix-v20260803.mjs
          test -f "$ABS_OUT"
          jq -e '.schemaVersion=="orbit360-auth-membership-antiregression-rootfix-v3" and .status=="PASS" and .classification=="GO_STATIC_AUTH_MEMBERSHIP" and .total==16 and .passed==16 and .failed==0 and .outputPathAbsolute==true and .sourceRootIndependentFromOutput==true and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .productionTouched==false' "$ABS_OUT" >/dev/null
          test -z "$(git -C "$ORBIT360_RC12_ROOT" diff --name-only)"

      - name: Instalar herramientas después de los gates
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          firebase --version
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Resolver identidad de servicio existente
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          printf '%s' "$SERVICE_ACCOUNT" > "$ORBIT360_TEMP_KEY_FILE"
          chmod 600 "$ORBIT360_TEMP_KEY_FILE"
          test "$(jq -r '.project_id // empty' "$ORBIT360_TEMP_KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$ORBIT360_TEMP_KEY_FILE" >> "$GITHUB_ENV"

      - name: Ejecutar macrobloque post-rootfix
        id: macro
        shell: bash
        run: |
          set +e
          bash tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar decisión observable
        if: always()
        uses: actions/github-script@v7
        env:
          FINAL: orbit360-platform/runtime-gate-crm-v20260716/rc12-rootcause-cumulative-closure-final.json
        with:
          script: |
            const fs=require('fs');
            let state='failure',description='RC1.2 post-rootfix sin cierre observable';
            try {
              const f=JSON.parse(fs.readFileSync(process.env.FINAL,'utf8'));
              if (f.decision==='RC12_MEMBERSHIP_CUMULATIVE_GO_LIVE_PASS') {state='success';description='RC1.2 · acumulativa · acceso normal · PASS';}
              else if (/ROLLED_BACK_SAFE/.test(f.decision)) description=`RC1.2 · rollback seguro · ${f.decision}`;
              else description=`RC1.2 · ${f.decision}`;
            } catch (e) {}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:process.env.STATUS_CONTEXT,description:description.slice(0,140),target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc12-rootcause-cumulative-closure-post-rootfix-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-forensic-module-audit.json
            orbit360-platform/docs/AUDITORIA-FORENSE-CANDIDATA-ACUMULATIVA-MODULOS-RC12-20260803.md
            orbit360-platform/runtime-gate-crm-v20260716/rc12-auth-membership-rootfix-path-proof.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-auth-membership-antiregression.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-membership-contract-diagnostic.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-membership-rootcause-diagnostic.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-membership-normalization-apply.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-membership-normalization-verify.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-membership-normalization-rollback.json
            orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc12-membership-identities.json
            orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc1-go-live-before.json
            orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc12-membership-browser-smoke.json
            orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc1-go-live-smoke.json
            orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc1-go-live-rollback.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-rootcause-cumulative-closure-final.json
          if-no-files-found: warn
          retention-days: 30

      - name: Limpiar secretos y worktree
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
          if [ -n "${ORBIT360_RC12_PRIVATE_IDENTITIES:-}" ] && [ -f "$ORBIT360_RC12_PRIVATE_IDENTITIES" ]; then shred -u "$ORBIT360_RC12_PRIVATE_IDENTITIES" || rm -f "$ORBIT360_RC12_PRIVATE_IDENTITIES"; fi
          if [ -n "${ORBIT360_MEMBERSHIP_PRIVATE_PLAN:-}" ] && [ -f "$ORBIT360_MEMBERSHIP_PRIVATE_PLAN" ]; then shred -u "$ORBIT360_MEMBERSHIP_PRIVATE_PLAN" || rm -f "$ORBIT360_MEMBERSHIP_PRIVATE_PLAN"; fi
          if [ -n "${ORBIT360_RC12_ROOT:-}" ] && [ -d "$ORBIT360_RC12_ROOT" ]; then git worktree remove --force "$ORBIT360_RC12_ROOT" || true; fi

      - name: Exigir PASS real o cierre seguro
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ORBIT360_EVIDENCE_DIR/rc12-rootcause-cumulative-closure-final.json"
          jq -e '(.decision=="RC12_MEMBERSHIP_CUMULATIVE_GO_LIVE_PASS" and .productionMaintained==true and .hostingRollbackExecuted==false and .membershipRollbackExecuted==false and .ok==true) or ((.decision|test("ROLLED_BACK_SAFE|NO_GO|NO_PRODUCTION_CHANGE")) and .productionMaintained==false and .ok==false)' "$ORBIT360_EVIDENCE_DIR/rc12-rootcause-cumulative-closure-final.json" >/dev/null
          test "${{ steps.macro.outputs.exit_code }}" = '0'
