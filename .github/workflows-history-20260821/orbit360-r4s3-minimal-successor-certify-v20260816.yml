name: Orbit360 R4S3 Minimal Successor Certify 20260816

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4s3-minimal-successor-certify-v20260816.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit360-r4s3-minimal-successor-certify-v20260816
  cancel-in-progress: false

env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  BASE_ARTIFACT_ID: '9256096856'
  BASE_ZIP_NAME: orbit360-fase-a-product-r4s2-47249fd4d603.zip
  BASE_ZIP_SHA256: 580d7568d64deb0cf7b8eccdf91b99e5bdc005b6bd441c68f99ef0d36de305ca
  BASE_SOURCE_HEAD: 47249fd4d6032a2f4c09f6fbd3460d3804c199da
  DELTA_SOURCE_HEAD: 294ed22bdb564585b71fc59cefa1d04cdfa6b120
  ACCESS_PATH: orbit360-platform/core/access-scope.js
  ACCESS_SHA256: 624f7538809dbea59294a2c94a4acce58f326b0812625754891fb7b0fa4d3e1f
  SUCCESSOR_ZIP_NAME: orbit360-fase-a-product-r4s3-294ed22bdb56.zip

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical gate and exact R4S3 delta contract
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          node --check tools/orbit360-r4s3-minimal-successor-package-v20260816.mjs
          git cat-file -e "${BASE_SOURCE_HEAD}^{commit}"
          git cat-file -e "${DELTA_SOURCE_HEAD}^{commit}"
          test "$(git show "${DELTA_SOURCE_HEAD}:${ACCESS_PATH}" | sha256sum | awk '{print $1}')" = "$ACCESS_SHA256"
          test "$(git diff-tree --no-commit-id --name-only -r "$DELTA_SOURCE_HEAD" | grep '^orbit360-platform/' | wc -l | tr -d ' ')" = '1'
          test "$(git diff-tree --no-commit-id --name-only -r "$DELTA_SOURCE_HEAD" | grep '^orbit360-platform/' )" = "$ACCESS_PATH"

      - name: Recover exact durable R4S2 and construct one-delta R4S3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/orbit360-r4s3"
          BASE="$WORK/base"
          SUCCESSOR="$WORK/successor"
          VERIFY="$WORK/verify"
          OUTER="$WORK/r4s2-artifact.zip"
          INNER="$WORK/$BASE_ZIP_NAME"
          ACCESS_REPLACEMENT="$WORK/access-scope.rootfix.js"
          CERT="$EVIDENCE_DIR/r4s3-minimal-successor-certification-v20260816.json"
          mkdir -p "$WORK" "$BASE" "$VERIFY" "$EVIDENCE_DIR"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o "$OUTER"
          unzip -q "$OUTER" -d "$WORK/outer"
          test -f "$WORK/outer/$BASE_ZIP_NAME"
          cp "$WORK/outer/$BASE_ZIP_NAME" "$INNER"
          test "$(sha256sum "$INNER" | awk '{print $1}')" = "$BASE_ZIP_SHA256"
          unzip -q "$INNER" -d "$BASE"

          git show "${DELTA_SOURCE_HEAD}:${ACCESS_PATH}" > "$ACCESS_REPLACEMENT"
          node --check "$ACCESS_REPLACEMENT"
          test "$(sha256sum "$ACCESS_REPLACEMENT" | awk '{print $1}')" = "$ACCESS_SHA256"

          node tools/orbit360-r4s3-minimal-successor-package-v20260816.mjs prepare "$BASE" "$SUCCESSOR" "$ACCESS_REPLACEMENT" "$CERT"
          jq -e '.ok==false and .status=="R4S3_SUCCESSOR_STAGED_AWAITING_ZIP_VERIFY" and .baseZipSha256==env.BASE_ZIP_SHA256 and .baseSourceHead==env.BASE_SOURCE_HEAD and .deltaSourceHead==env.DELTA_SOURCE_HEAD and .changedProductFileCount==1 and .unchangedFileCount==193 and .fileCount==194 and (.deltaFiles|length)==1 and .deltaFiles[0]=="core/access-scope.js" and .targetInfo["core/access-scope.js"].sha256==env.ACCESS_SHA256 and .writeAuthorized==false and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .deployExecuted==false and .productionTouched==false' "$CERT" >/dev/null

          (cd "$SUCCESSOR" && find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/$SUCCESSOR_ZIP_NAME" -@)
          SUCCESSOR_ZIP_SHA256="$(sha256sum "$SUCCESSOR_ZIP_NAME" | awk '{print $1}')"
          test "${#SUCCESSOR_ZIP_SHA256}" -eq 64
          unzip -q "$SUCCESSOR_ZIP_NAME" -d "$VERIFY"
          export SUCCESSOR_ZIP_SHA256 SUCCESSOR_ZIP_NAME
          node tools/orbit360-r4s3-minimal-successor-package-v20260816.mjs verify "$BASE" "$VERIFY" - "$CERT"
          jq -e '.ok==true and .status=="R4S3_MINIMAL_SUCCESSOR_DURABLE_CERTIFIED" and .classification=="FUNCTIONAL_DEFECT_ROOTFIX_SUCCESSOR_CERTIFIED" and .baseZipSha256==env.BASE_ZIP_SHA256 and .baseSourceHead==env.BASE_SOURCE_HEAD and .deltaSourceHead==env.DELTA_SOURCE_HEAD and .changedProductFileCount==1 and .unchangedFileCount==193 and .fileCount==194 and (.deltaFiles|length)==1 and .deltaFiles[0]=="core/access-scope.js" and .targetInfo["core/access-scope.js"].sha256==env.ACCESS_SHA256 and (.zipSha256|length)==64 and .writeAuthorized==false and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .deployExecuted==false and .productionTouched==false and .containsPII==false and .containsSecrets==false' "$CERT" >/dev/null
          test "$(jq -r '.zipSha256' "$CERT")" = "$SUCCESSOR_ZIP_SHA256"
          test "$(sha256sum "$SUCCESSOR_ZIP_NAME" | awk '{print $1}')" = "$SUCCESSOR_ZIP_SHA256"
          cp "$VERIFY/orbit360-package-manifest.json" "$EVIDENCE_DIR/r4s3-orbit360-package-manifest-v20260816.json"
          printf '%s  %s\n' "$SUCCESSOR_ZIP_SHA256" "$SUCCESSOR_ZIP_NAME" > "$EVIDENCE_DIR/r4s3-minimal-successor-sha256-v20260816.txt"

      - name: Canonical gate after R4S3 certification
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s3-minimal-successor-evidence-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s3-minimal-successor-certification-v20260816.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s3-orbit360-package-manifest-v20260816.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s3-minimal-successor-sha256-v20260816.txt
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orbit360-r4s3-minimal-successor-durable-${{ github.run_id }}
          path: |
            orbit360-fase-a-product-r4s3-294ed22bdb56.zip
          if-no-files-found: error
          retention-days: 14
