name: Orbit360 F1.4C Validator Rootfix Observer 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-f1-4c-validator-rootfix-observer-v20260818.yml'
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TARGET_COMMIT: 945746ee0ce9aef6b901bb7c5abd422cffe090d8
      TARGET_WORKFLOW: Orbit360 F1.4C Validator Stale Rootfix Source Only 20260818
      EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Observe exact source-only rootfix run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_COMMIT}&event=push&per_page=20" > /tmp/runs.json
          COUNT="$(jq -r --arg n "$TARGET_WORKFLOW" '[.workflow_runs[]|select(.name==$n)]|length' /tmp/runs.json)"
          RUN_ID="$(jq -r --arg n "$TARGET_WORKFLOW" '[.workflow_runs[]|select(.name==$n)]|if length>=1 then .[0].id else "" end' /tmp/runs.json)"
          STATUS="$(jq -r --arg n "$TARGET_WORKFLOW" '[.workflow_runs[]|select(.name==$n)]|if length>=1 then .[0].status else "missing" end' /tmp/runs.json)"
          CONCLUSION="$(jq -r --arg n "$TARGET_WORKFLOW" '[.workflow_runs[]|select(.name==$n)]|if length>=1 then (. [0].conclusion // "") else "" end' /tmp/runs.json)"
          mkdir -p "$EVIDENCE_DIR"
          jq -n --arg count "$COUNT" --arg run "$RUN_ID" --arg status "$STATUS" --arg conclusion "$CONCLUSION" '{schemaVersion:"orbit360-f1-4c-validator-rootfix-observer-v1",ok:true,status:"F1_4C_VALIDATOR_ROOTFIX_OBSERVATION_CAPTURED",classification:"OBSERVATION_ONLY",targetCommit:"945746ee0ce9aef6b901bb7c5abd422cffe090d8",matchingRunCount:($count|tonumber),runId:$run,runStatus:$status,runConclusion:$conclusion,buildExecuted:false,browserExecuted:false,runtimeExecuted:false,secretAccess:false,dataAccess:false,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,productionTouched:false}' > "$EVIDENCE_DIR/f1-4c-validator-rootfix-observer-v20260818.json"
      - name: Persist observer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-f1-4c-validator-observer-bot
          git config user.email orbit360-f1-4c-validator-observer-bot@users.noreply.github.com
          git add "$EVIDENCE_DIR/f1-4c-validator-rootfix-observer-v20260818.json"
          git commit -m 'gate(f1.4c): persist validator rootfix run observation [skip ci]'
          git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
