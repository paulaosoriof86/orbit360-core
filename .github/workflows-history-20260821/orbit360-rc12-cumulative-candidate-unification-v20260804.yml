name: Orbit 360 · candidata acumulativa única RC1.2

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/rc12-cumulative-candidate-unification-v20260804.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-rc12-cumulative-candidate-unification-v20260804
  cancel-in-progress: false

env:
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/rc12-cumulative-candidate-unification-v20260804.json
  ORBIT360_RELEASE_BRANCH: release/gravicentra-insurance-rc1-2-membership-auth-20260803
  ORBIT360_RELEASE_COMMIT: b699ba329960cd830121b57452ce558399aa84fb
  ORBIT360_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/rc12-cumulative-candidate-unified-validation.json
  STATUS_CONTEXT: orbit360/rc12-cumulative-candidate-unified

jobs:
  validate:
    name: Producto + módulos + datos canónicos + acceso
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar solicitud y candidata sin secretos
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-cumulative-candidate-unification-request-v1" and .status=="AUTHORIZED_SOURCE_ONLY" and .approved==true and .allowedExecutions==1 and .consumed==false and .releaseCommit==env.ORBIT360_RELEASE_COMMIT and .firestoreRead==false and .firestoreWrites==0 and .authRead==false and .authWrites==0 and .deploy==false and .reimport==false and .gate711==false' "$ORBIT360_REQUEST_FILE" >/dev/null
          git fetch --no-tags origin "$ORBIT360_RELEASE_BRANCH"
          test "$(git rev-parse origin/$ORBIT360_RELEASE_BRANCH)" = "$ORBIT360_RELEASE_COMMIT"
          RC12_ROOT="$RUNNER_TEMP/orbit360-rc12-unified-candidate"
          git worktree add --detach "$RC12_ROOT" "$ORBIT360_RELEASE_COMMIT"
          echo "ORBIT360_RC12_ROOT=$RC12_ROOT" >> "$GITHUB_ENV"

      - name: Validar unión inmutable
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-candidata-acumulativa-unica-rc12-v20260804.mjs
          ORBIT360_UNIFIED_CANDIDATE_EVIDENCE="$ORBIT360_EVIDENCE" node tools/orbit360-validar-candidata-acumulativa-unica-rc12-v20260804.mjs
          jq -e '.decision=="CANDIDATE_UNIFICATION_STATIC_PASS" and .classification=="GO_STATIC_CUMULATIVE_PRODUCT_DATA_BINDING" and .failed==0 and .ok==true and .firestoreRead==false and .firestoreWrites==0 and .authRead==false and .authWrites==0 and .deployExecuted==false and .reimportExecuted==false and .gate711Repeated==false' "$ORBIT360_EVIDENCE" >/dev/null

      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: ${{ env.ORBIT360_EVIDENCE }}
        with:
          script: |
            const fs=require('fs');
            let state='failure', description='RC1.2 · unión acumulativa sin evidencia';
            try {
              const e=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));
              if (e.ok===true) { state='success'; description='RC1.2 · producto + módulos + datos · PASS'; }
              else description=`RC1.2 · ${e.decision}`;
            } catch (_) {}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:process.env.STATUS_CONTEXT,description:description.slice(0,140),target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc12-cumulative-candidate-unification-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/rc12-cumulative-candidate-unified-manifest.json
            orbit360-platform/runtime-gate-crm-v20260716/rc12-cumulative-candidate-unified-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Limpiar worktree
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_RC12_ROOT:-}" ] && [ -d "$ORBIT360_RC12_ROOT" ]; then git worktree remove --force "$ORBIT360_RC12_ROOT" || true; fi
