name: Orbit 360 · Planillas/Comisiones · HISTORICAL CLOSED · do not reuse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-closed:
    name: Historical lifecycle closed — no data execution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm closed lifecycle
        shell: bash
        run: |
          set -euo pipefail
          LIFECYCLE='tools/orbit360-validator-lifecycle-contract-planillas-comisiones-linkage-readonly-v20260801.json'
          jq -e '.status=="PLANILLAS_COMMISSION_CONTROLLED_WRITE_CLOSED" and .controlledWrite.status=="WRITE_PASS" and .authorization.consumed==true and .reuseAllowed==false and .financeActivated==false and .operationalWritesAllowed==0' "$LIFECYCLE" >/dev/null
          echo '{"ok":true,"status":"HISTORICAL_CLOSED_DO_NOT_REUSE","classification":"VALIDATOR_STALE_CORRECTED","secrets":false,"firestore":false,"writes":false,"deploy":false,"production":false}'
