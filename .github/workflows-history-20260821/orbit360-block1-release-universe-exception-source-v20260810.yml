name: Orbit360 Block1 release universe controlled exceptions source-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-block1-release-universe-exception-source-v20260810.yml'
      - '.github/workflows/orbit360-block1-release-universe-exception-runtime-v20260810.yml'
      - 'tools/orbit360-validator-lifecycle-block1-release-universe-exception-runtime-v20260810.json'
      - 'tools/orbit360-validar-gate-contracts-engine-block1-release-universe-exception-v20260810.mjs'
      - 'tools/orbit360-block1-release-universe-with-exceptions-readonly-v20260810.mjs'
      - 'tools/fixtures/orbit360-block1-release-universe-exception-request-fixture-v20260810.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-block1-release-universe-exception-source-v20260810
  cancel-in-progress: false
env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  SOURCE_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/block1-release-universe-exception-source-sanitized-v20260810.json
  RUNTIME_WORKFLOW: .github/workflows/orbit360-block1-release-universe-exception-runtime-v20260810.yml
jobs:
  source:
    name: Block1 · release universe controlled exceptions · source-only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical Block1 gate before package validation
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .failed==0 and .executionAuthorized==false and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Validate package syntax and immutable prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-engine-block1-release-universe-exception-v20260810.mjs
          node --check tools/orbit360-block1-release-universe-with-exceptions-readonly-v20260810.mjs
          node -e "JSON.parse(require('fs').readFileSync('tools/orbit360-validator-lifecycle-block1-release-universe-exception-runtime-v20260810.json','utf8'));JSON.parse(require('fs').readFileSync('tools/fixtures/orbit360-block1-release-universe-exception-request-fixture-v20260810.json','utf8'))"
          jq -e '.decision=="GO_PRODUCTION_PATH_WITH_2_CONTROLLED_CLIENT_PROVENANCE_EXCEPTIONS" and .authorizedByUser==true and .baselineContract.changedByException==false' tools/orbit360-block1-controlled-provenance-exception-policy-v20260810.json >/dev/null
          jq -e '.decision=="CONTROLLED_EXCEPTION_IMPACT_PASS" and .targetsLocated==2 and .releaseEligible==true and .firestoreWrites==0 and .ok==true' orbit360-platform/runtime-gate-crm-v20260716/block1-controlled-provenance-exception-impact-sanitized-v20260810.json >/dev/null
      - name: Validate release universe preflight with offline request fixture
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_REQUEST_FILE=tools/fixtures/orbit360-block1-release-universe-exception-request-fixture-v20260810.json \
          ORBIT360_EXPECTED_REQUEST_VERSION=FIXTURE_RELEASE_UNIVERSE_WITH_CONTROLLED_EXCEPTIONS_READONLY \
          ORBIT360_EXPECTED_PARENT_HEAD=fixture-parent-head-release-universe \
            node tools/orbit360-validar-gate-contracts-engine-block1-release-universe-exception-v20260810.mjs
          jq -e '.status=="GO_GATE_CONTRACT_RELEASE_UNIVERSE_EXCEPTION" and .failed==0 and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .maximumLogicalFirestoreOperations==3 and .firestoreWritesAuthorized==0 and .authReadsAuthorized==0 and .loggingReadsAuthorized==0 and .iamReadsAuthorized==0 and .operationalWritesAuthorized==0 and .hostingAuthorized==false and .browserAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .runtimeExecuted==false and .secretAccess==false and .firestoreRead==false and .ok==true' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Execute release universe offline fixture
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_SOURCE_ONLY=1 ORBIT360_RELEASE_UNIVERSE_EVIDENCE="$RUNNER_TEMP/release-universe-source.json" node tools/orbit360-block1-release-universe-with-exceptions-readonly-v20260810.mjs
          jq -e '.decision=="SOURCE_ONLY_RUNTIME_READY" and .classification=="PASS_SOURCE_FIXTURE" and .networkAccess==false and .secretAccess==false and .firestoreReadOperations==0 and .firestoreWrites==0 and .operationalWrites==0 and .observed.clientes.raw==430 and .observed.clientes.baseline==414 and .observed.clientes.retainedDeferred==14 and .observed.clientes.controlledExceptions==2 and .observed.aseguradoras.raw==30 and .observed.aseguradoras.effective==26 and .observed.asesores.count==7 and .ok==true' "$RUNNER_TEMP/release-universe-source.json" >/dev/null
      - name: Enforce semantic read-only runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('tools/orbit360-block1-release-universe-with-exceptions-readonly-v20260810.mjs','utf8');
          const flow=fs.readFileSync(process.env.RUNTIME_WORKFLOW,'utf8');
          const firestoreMutationPatterns=[/\.doc\([^)]*\)\.(?:set|update|delete|create)\s*\(/,/canonicalRef\([^)]*\)\.add\s*\(/,/\bdb\.batch\s*\(/,/\brunTransaction\s*\(/,/\bbulkWriter\s*\(/];
          if(firestoreMutationPatterns.some(r=>r.test(src)))throw new Error('RELEASE_UNIVERSE_FIRESTORE_MUTATION_FOUND');
          if(/firebase\s+deploy|gcloud\s+.*(?:iam|logging)/i.test(src))throw new Error('RELEASE_UNIVERSE_CONTROL_PLANE_TOKEN_FOUND');
          if(!/\.select\(\.\.\.CLIENT_FIELDS\)\.get\(\)/.test(src)||!/\.select\(\.\.\.INSURER_FIELDS\)\.get\(\)/.test(src)||!/listDocuments\(\)/.test(src))throw new Error('RELEASE_UNIVERSE_READ_SHAPE_MISSING');
          if(/firebase deploy|gcloud .* deploy|add-iam-policy-binding|set-iam-policy/i.test(flow))throw new Error('RELEASE_UNIVERSE_RUNTIME_DEPLOY_OR_IAM_TOKEN_FOUND');
          NODE
      - name: Seal sanitized source evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$GITHUB_SHA" '{schemaVersion:"orbit360-block1-release-universe-exception-source-v1",status:"PASS_RELEASE_UNIVERSE_EXCEPTION_SOURCE",ok:true,head:$sha,gateId:"block1-client360-insurers-lab-v20260717",contractVersion:"1.0.41",baselineContractChanged:false,controlledExceptionCount:2,runtimeRequestPresent:false,runtimeAuthorized:false,secretsRead:false,networkAccess:false,firestoreReads:0,firestoreWrites:0,authReads:0,loggingReads:0,iamReads:0,operationalWrites:0,runtimeExecuted:false,browserExecuted:false,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' > "$SOURCE_EVIDENCE"
      - name: Publish source status
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: orbit360-platform/runtime-gate-crm-v20260716/block1-release-universe-exception-source-sanitized-v20260810.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Block1 release universe exception source blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.ok===true&&p.status==='PASS_RELEASE_UNIVERSE_EXCEPTION_SOURCE'&&p.firestoreWrites===0){state='success';description='Block1 release universe exception SOURCE PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/block1-release-universe-exception-source',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Upload sanitized source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-block1-release-universe-exception-source-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/block1-release-universe-exception-source-sanitized-v20260810.json
          if-no-files-found: warn
          retention-days: 30
