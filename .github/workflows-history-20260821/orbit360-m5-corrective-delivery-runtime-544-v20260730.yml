      - name: Validar cierre esperado
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M5_CORRECTIVE_DELIVERY_RUNTIME_544_CLOSED_SUCCESS" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .beforeAssetsMatched==29 and .afterAssetsMatched==30 and .afterRemoteParity==true and .hostingDeployExecuted==true and .hostingDeployExecutions==1 and .snapshotBeforeOk==true and .snapshotAfterOk==true and .allCountsStable==true and .allDigestsStable==true and .transientStaticCalls>0 and .blockedOperationalCalls==0 and .firestoreWrites==0 and .operationalWrites==0 and .networkWriteCandidates==0 and .runtimeExecuted==true and .browserExecuted==true and .functionsDeploy==false and .rulesDeploy==false and .production==false and .main==false and .merge==false and .polizas==false and .visualReviewExecuted==false and .approvalReadyForVisualReview==true' "$EVIDENCE_DIR/m5-corrective-delivery-runtime-544-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-corrective-delivery-runtime-544-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-corrective-readiness-544-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-corrective-readiness-544-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-544-browser-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-corrective-delivery-runtime-544-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/m5-corrective-delivery-runtime-544-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.44 failed — STOP line';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.ok===true&&s.status==='M5_CORRECTIVE_DELIVERY_RUNTIME_544_CLOSED_SUCCESS'){state='success';description='M5 PASS: Hosting 30/30 + runtime zero writes; visual ready';}}catch(e){}
