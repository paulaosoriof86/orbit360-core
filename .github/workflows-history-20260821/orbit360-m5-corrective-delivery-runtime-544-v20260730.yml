name: Orbit 360 · M5 corrective Hosting + final runtime · 5.0.44
run-name: M5 5.0.44 · one block Hosting 30/30 + runtime · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-m5-corrective-delivery-runtime-544-request-v20260730.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-corrective-delivery-runtime-544-v20260730
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m5-corrective-delivery-runtime-544-request-v20260730.json
  EXPECTED_RC_HASH: eb4c5ba04c424667f2b27aa2daab05b16a7369ab6e227b4210e8b61f8b76d5de
  EXPECTED_FIREBASE_PROJECT_ID: ays-orbit-360-lab
  EXPECTED_CHANNEL: orbit360-ays-lab
  ORBIT360_PREVIEW_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_EXPECTED_RUNTIME: 20260717-2
  ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  corrective_delivery_runtime:
    name: M5 · corrective Hosting + runtime · one risk block · zero writes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar request inmutable y primer intento
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$ORBIT360_REQUEST_FILE"

      - name: Preflight canónico antes de secretos, Firebase, deploy o navegador
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-corrective-delivery-runtime-544-v20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.44" and .candidateContractVersion=="5.0.43" and .executionPhase=="M5_LAB_CORRECTIVE_DELIVERY_RUNTIME" and .activationMode=="immutable_combined_request_present" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==47 and .remoteAssetsExpected==30 and .expectedRemoteAssetsMatchedBefore==29 and .expectedMismatchOnly=="modules/portal-v1142-copyfix.js" and .capabilityProfile.secrets==true and .capabilityProfile.firestoreRead==true and .capabilityProfile.writes==false and .capabilityProfile.runtime==true and .capabilityProfile.browser==true and .capabilityProfile.deploy==true and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .dataAccess==false and .secretAccess==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Confirmar RC correctiva y único mismatch antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-543-v20260730.mjs
          cp "$EVIDENCE_DIR/m5-release-candidate-readiness-543-summary.json" "$EVIDENCE_DIR/m5-corrective-readiness-544-before.json"
          jq -e '.ok==true and .status=="M5_RC_543_STATIC_REMEDIATION_READY_LAB_DELIVERY_REQUIRED" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .releaseCandidate.criticalAssetCount==47 and .releaseCandidate.portalOwnerIncluded==true and .releaseCandidate.portalStaticCourseVersion==150 and .releaseCandidate.strictPolicyPreserved==true and .remoteLab.assetsExpected==30 and .remoteLab.assetsMatched==29 and .remoteLab.mismatchCount==1 and .remoteLab.mismatchPaths==["modules/portal-v1142-copyfix.js"] and .remoteLab.expectedPortalOwnerPending==true and .approvalReadyForLabDelivery==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .production==false' "$EVIDENCE_DIR/m5-corrective-readiness-544-before.json" >/dev/null

      - name: Preparar probe final con observabilidad segura
        shell: bash
        run: |
          set -euo pipefail
          cp tools/orbit360-m5-runtime-smoke-525-browser-v20260729.mjs tools/.orbit360-m5-runtime-544-browser.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/.orbit360-m5-runtime-544-browser.mjs')
          s=p.read_text()
          replacements={
            'm5-runtime-smoke-525-browser-summary.json':'m5-runtime-smoke-544-browser-summary.json',
            'ae6bb2a35ce4f03c0353d670218c841e51b57a2461a3ba9e741d8bd7a973fd61':'eb4c5ba04c424667f2b27aa2daab05b16a7369ab6e227b4210e8b61f8b76d5de',
            "EXPECTED_POLICY_VERSION='20260729.2'":"EXPECTED_POLICY_VERSION='20260730.1'",
            "schemaVersion:'orbit360-m5-runtime-smoke-browser-v8'":"schemaVersion:'orbit360-m5-corrective-runtime-544-browser-v1'",
            "contractVersion:'5.0.25'":"contractVersion:'5.0.44'"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit('PROBE_TRANSFORM_SOURCE_MISMATCH:'+old)
            s=s.replace(old,new,1)
          old="guard.blockedOperationalCalls.push({method:name,collection,reason:String(decision.reason||'')});throw new Error('M5_RUNTIME_DURABLE_WRITE_BLOCKED:'+name)"
          new="guard.blockedOperationalCalls.push({method:name,collection,id:String(id||'').slice(0,96),reason:String(decision.reason||''),payloadKeys:payload&&typeof payload==='object'?Object.keys(payload).sort().slice(0,24):[],cv:payload&&payload._cv!=null?String(payload._cv):'',staticCourse:Boolean(payload&&payload._staticCourse===true),stack:String(new Error().stack||'').split('\\n').slice(1,7).map(function(x){return String(x).replace(/https?:\\/\\/[^/\\s]+/g,'').slice(0,180)})});throw new Error('M5_RUNTIME_DURABLE_WRITE_BLOCKED:'+name)"
          if old not in s: raise SystemExit('DIAGNOSTIC_GUARD_SOURCE_MISMATCH')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check tools/.orbit360-m5-runtime-544-browser.mjs

      - name: Instalar dependencias después del preflight
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Resolver identidad LAB después del preflight
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_LOGIN_SECRET: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_LOGIN_SECRET} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-m5-corrective-544-lab.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$EXPECTED_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_LAB_LOGIN_PASSWORD=$ORBIT360_LOGIN_SECRET" >> "$GITHUB_ENV"

      - name: Ejecutar un único Hosting LAB correctivo
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "$EXPECTED_CHANNEL" --project "$EXPECTED_FIREBASE_PROJECT_ID" --config firebase.json --expires 7d --non-interactive --json > "$EVIDENCE_DIR/m5-corrective-hosting-544-raw.json"

      - name: Exigir paridad posterior 30/30 antes de runtime
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-release-candidate-readiness-543-v20260730.mjs
          cp "$EVIDENCE_DIR/m5-release-candidate-readiness-543-summary.json" "$EVIDENCE_DIR/m5-corrective-readiness-544-after.json"
          jq -e '.ok==true and .status=="M5_RC_543_READY_FOR_RUNTIME_AFTER_HOSTING" and .releaseCandidate.hash==env.EXPECTED_RC_HASH and .remoteLab.assetsExpected==30 and .remoteLab.assetsMatched==30 and .remoteLab.mismatchCount==0 and .remoteLab.remoteParity==true and .approvalReadyForRuntimeSmoke==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .browser==false and .runtime==false and .deploy==false and .production==false' "$EVIDENCE_DIR/m5-corrective-readiness-544-after.json" >/dev/null

      - name: Snapshot Firestore read-only antes
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs before
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .checksPassed==11 and .checksTotal==11 and .counts.sourceClients==414 and .counts.sourceInsurers==26 and .counts.advisors==7 and .counts.canonicalClients==414 and .counts.canonicalInsurers==26 and .counts.memberships==1 and .counts.config==1 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m5-runtime-smoke-live-before.json" >/dev/null

      - name: Ejecutar runtime final M5 sobre RC 30/30
        id: browser
        continue-on-error: true
        shell: bash
        run: node tools/.orbit360-m5-runtime-544-browser.mjs

      - name: Snapshot Firestore read-only después
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs after
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .checksPassed==11 and .checksTotal==11 and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m5-runtime-smoke-live-after.json" >/dev/null

      - name: Cerrar evidencia combinada
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const d=process.env.EVIDENCE_DIR,RC=process.env.EXPECTED_RC_HASH;const read=n=>{try{return JSON.parse(fs.readFileSync(path.join(d,n),'utf8'))}catch{return null}};
          const p=read('preflight-sanitizado.json'),rb=read('m5-corrective-readiness-544-before.json'),ra=read('m5-corrective-readiness-544-after.json'),b=read('m5-runtime-smoke-544-browser-summary.json'),before=read('m5-runtime-smoke-live-before.json'),after=read('m5-runtime-smoke-live-after.json');
          const keys=['sourceClients','sourceInsurers','advisors','canonicalClients','canonicalInsurers','memberships','config'];
          const digests=Object.fromEntries(keys.map(k=>[k,Boolean(before&&after&&before.digests&&after.digests&&before.digests[k]===after.digests[k])]));
          const allDigestsStable=keys.every(k=>digests[k]===true),allCountsStable=keys.every(k=>Boolean(before&&after&&before.counts&&after.counts&&before.counts[k]===after.counts[k]));
          const transient=Number(b&&b.writeGuard&&Array.isArray(b.writeGuard.transientStaticCalls)?b.writeGuard.transientStaticCalls.length:0),blocked=Number(b&&b.writeGuard&&Array.isArray(b.writeGuard.blockedOperationalCalls)?b.writeGuard.blockedOperationalCalls.length:0),network=Number(b&&b.writeGuard&&Array.isArray(b.writeGuard.networkWriteCandidates)?b.writeGuard.networkWriteCandidates.length:0);
          const roles=Boolean(b&&b.checks&&b.checks.desktopDirection===true&&b.checks.tabletOperativo===true&&b.checks.mobileAsesor===true&&b.checks.mobileMenu===true),policy=Boolean(b&&b.academiaStaticWritePolicy&&b.academiaStaticWritePolicy.ownerVersion==='20260730.1'&&b.writeGuard&&b.writeGuard.storeGuardInstalled===true&&b.writeGuard.policyVersion==='20260730.1');
          const hostingOk=Boolean(rb&&rb.remoteLab&&rb.remoteLab.assetsMatched===29&&rb.remoteLab.mismatchCount===1&&ra&&ra.remoteLab&&ra.remoteLab.assetsMatched===30&&ra.remoteLab.mismatchCount===0&&ra.remoteLab.remoteParity===true);
          const ok=Boolean(p&&p.status==='GO_GATE_CONTRACT'&&p.contractVersion==='5.0.44'&&p.failed===0&&hostingOk&&before&&before.ok===true&&after&&after.ok===true&&b&&b.ok===true&&b.releaseCandidateHash===RC&&b.contractVersion==='5.0.44'&&roles&&policy&&transient>0&&blocked===0&&network===0&&allDigestsStable&&allCountsStable);
