name: Orbit 360 · Vehicles canonical dry-run · historical
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical_guard:
    name: Vehicles · historical dry-run closure guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirmar cierre histórico sin secrets ni fuentes privadas
        shell: bash
        run: |
          set -euo pipefail
          test -f orbit360-platform/docs/CIERRE-WRITE-VEHICULOS-AYS-20260730.md
          grep -Fq 'Estado: `WRITE_PASS`' orbit360-platform/docs/CIERRE-WRITE-VEHICULOS-AYS-20260730.md
          grep -Fq 'vehiculos: 1032' orbit360-platform/docs/CIERRE-WRITE-VEHICULOS-AYS-20260730.md
          grep -Fq 'targetIdsUnique: 1032' orbit360-platform/docs/CIERRE-WRITE-VEHICULOS-AYS-20260730.md
          echo 'HISTORICAL_CANONICAL_DRYRUN_RETIRED_AFTER_WRITE_PASS'
