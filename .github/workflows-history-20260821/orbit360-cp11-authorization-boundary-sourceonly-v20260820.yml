name: Orbit360 CP11 Authorization Boundary Source Only
# HISTORICAL / READ-ONLY after definitive control-plane freeze 2026-08-21.
# CP11 is closed history. Only orbit360-continuity-canonical-source-only-v20260820.yml
# may publish operational continuity state.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-readback-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce CP11 non-writer contract
        shell: bash
        run: |
          set -euo pipefail
          echo '{"ok":true,"status":"CP11_HISTORICAL_READ_ONLY","branchMutation":false,"runtimeExecuted":false,"browserExecuted":false,"secretAccess":false,"firestoreRead":false,"operationalWrites":0,"deployExecuted":false,"productionTouched":false}'
