name: Orbit 360 · Cobros · controlled write gate preflight
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/cobros-controlled-write-preflight-static-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-cobros-controlled-write-preflight-static-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  GATE_ID: block10.9-cobros-controlled-write-lab-v20260801
  TRIGGER: .github/orbit360-triggers/cobros-controlled-write-preflight-static-v20260801.json
  EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
jobs:
  controlled_write_preflight:
    name: Gate 10.9 · controlled write preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar trigger y lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-cobros-controlled-write-preflight-trigger-v1" and .approved==true and .gateId==env.GATE_ID and .contractVersion=="10.9.0" and .branch==env.ORBIT360_BRANCH and .scope.staticPreflight==true and .scope.executionAuthorized==false and .scope.firestoreRead==false and .scope.writes==false and .scope.browser==false and .scope.deploy==false and .scope.production==false' "$TRIGGER" >/dev/null
          AUTHORIZED_HEAD="$(jq -r '.authorizedHead' "$TRIGGER")"
          test -n "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$AUTHORIZED_HEAD" HEAD
          bad="$(git diff --name-only "$AUTHORIZED_HEAD"..HEAD | grep -Ev '^\.github/orbit360-triggers/cobros-controlled-write-preflight-static-v20260801\.json$' || true)"
          test -z "$bad"
      - name: Validar contrato canónico primero
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-cobros-controlled-write-preflight-v20260801.mjs
          node --check tools/orbit360-validar-cobros-controlled-write-preflight-static-v20260801.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .gateId==env.GATE_ID and .contractVersion=="10.9.0" and .canonicalLifecycleComposition=="phase-capability-contract-v1" and .failed==0 and .phase=="PREPARED_STATIC" and .plan.cases==5 and .plan.direct==4 and .plan.historical==1 and .plan.atomicGroups==5 and .plan.snapshots==11 and .plan.operations==10 and .plan.rollbacks==11 and .executionAuthorized==false and .labWriteAuthorized==false and .writeEligible==0 and .genericWriterRemainsBlockedForCobros==true and .cobrosWrites==0 and .receiptWrites==0 and .policyWrites==0 and .finmovsWrites==0 and .firestoreWrites==0 and .operationalWrites==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE" >/dev/null
      - name: Subir evidencia sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-cobros-controlled-write-preflight-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/cobros-controlled-write-preflight-static-v20260801.json
            orbit360-platform/docs/AUTORIZACION-DIRECCION-COBROS-5-CASOS-20260801.json
            orbit360-platform/docs/AUDITORIA-READONLY-COBROS-GATE-ESCRITURA-PREFLIGHT-SANITIZADA-20260801.json
            orbit360-platform/docs/CIERRE-STATIC-COBROS-GATE-ESCRITURA-PREFLIGHT-20260801.md
            orbit360-platform/docs/ACADEMIA-GATE-UNICO-ESCRITURA-COBROS-20260801.md
            orbit360-platform/docs/CLAUDE-ACUMULADO-GATE-UNICO-ESCRITURA-COBROS-20260801.md
          if-no-files-found: error
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: ${{ env.EVIDENCE }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='Cobros controlled write preflight blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.status==='GO_GATE_CONTRACT'&&p.gateId===process.env.GATE_ID&&p.failed===0&&p.phase==='PREPARED_STATIC'){state='success';description='Cobros controlled write preflight PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/cobros-controlled-write-preflight',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
