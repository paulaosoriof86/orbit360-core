name: Orbit 360 · Receipts/portfolio canonical prewrite read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-receipts-portfolio-prewrite-readonly-v20260730.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-prewrite-readonly-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  DRIVE_FILE_ID: 1cttFAW4atpv8y9GAl5xrx26ojTDxQhYV
  PACKAGE_SHA256: e64e75f78f6a64101627a9a860db566a95b83677fcf20eeb05be44c6f3f6a1d7
  LOGICAL_SHA256: bb494a05aff75ff7baad39a07f23512187e39480d509f8ca1ace01e0b671362b
  RECEIPT_ID_DIGEST: f700a11643a1e4e62a13c3894d6f1097acef2ad5edfc0a32703d0d9b2ed5facf
  PORTFOLIO_ID_DIGEST: 144c8967704d1d06475144508e24cd8792ea8264faa7045eb50132316264bcd6
jobs:
  prewrite:
    name: Receipts/portfolio · exact package vs live store
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate canónico antes de secrets/Firestore
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.0.0" and .failed==0 and .receiptsExpected==1261 and .portfolioPending==641 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Preparar dependencias aisladas
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save firebase-admin@13.4.0 xlsx@0.18.5 >/dev/null 2>&1
      - name: Descargar paquete privado exacto
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          (async()=>{const sa=JSON.parse(process.env.SERVICE_ACCOUNT),now=Math.floor(Date.now()/1000);if(sa.project_id!=='ays-orbit-360-lab')throw new Error('ENVIRONMENT_FAILURE:PROJECT_ID_MISMATCH');const u=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/drive.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900}),sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url'),body=new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:u+'.'+sig});const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body}),tj=await tr.json();if(!tr.ok||!tj.access_token)throw new Error('ENVIRONMENT_FAILURE:OAUTH_'+tr.status);const r=await fetch(`https://www.googleapis.com/drive/v3/files/${process.env.DRIVE_FILE_ID}?alt=media&supportsAllDrives=true`,{headers:{authorization:`Bearer ${tj.access_token}`}});if(!r.ok)throw new Error('ENVIRONMENT_FAILURE:DRIVE_'+r.status);const b=Buffer.from(await r.arrayBuffer()),sha=crypto.createHash('sha256').update(b).digest('hex');if(sha!==process.env.PACKAGE_SHA256)throw new Error('DATA_CONTRACT_FAILURE:PACKAGE_SHA');fs.writeFileSync('/tmp/receipts-portfolio.xlsx',b);})().catch(e=>{console.error(String(e.message||e));process.exit(41);});
          NODE
      - name: Prewrite live store read-only
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          ORBIT360_RECEIPTS_MODE=DRY_RUN \
          ORBIT360_RECEIPTS_XLSX=/tmp/receipts-portfolio.xlsx \
          ORBIT360_RECEIPTS_XLSX_SHA256="$PACKAGE_SHA256" \
          ORBIT360_RECEIPTS_LOGICAL_SHA256="$LOGICAL_SHA256" \
          ORBIT360_RECEIPTS_ID_DIGEST="$RECEIPT_ID_DIGEST" \
          ORBIT360_PORTFOLIO_ID_DIGEST="$PORTFOLIO_ID_DIGEST" \
          ORBIT360_RECEIPTS_EVIDENCE="$EVIDENCE_DIR/receipts-portfolio-prewrite.json" \
          node tools/orbit360-receipts-portfolio-canonical-apply-v20260730.mjs
          jq -e '.status=="PREWRITE_READY" and .ok==true and .before.clientes==430 and .before.aseguradoras==30 and .before.asesores==7 and .before.polizas==1373 and .before.vehiculos==1032 and .before.recibosEsperados==0 and .before.carteraPrimas==0 and .before.cobros==0 and .before.finmovs==0 and .validation.missingParents==0 and .validation.invalidPolicyState==0 and .validation.policyRelationMismatches==0 and .validation.targetReceiptCollisions==0 and .validation.targetPortfolioCollisions==0 and .validation.activePolicies==224 and .validation.activePoliciesWithCalendar==223 and .validation.activePoliciesWithoutCalendar==1 and .validation.receiptCount==1261 and .validation.portfolioCount==641 and .validation.dueOrOverdue==99 and .validation.futurePending==542 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/receipts-portfolio-prewrite.json" >/dev/null
          rm -f /tmp/receipts-portfolio.xlsx
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-prewrite-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-prewrite.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-prewrite.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Receipts/portfolio prewrite failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.status==='PREWRITE_READY'&&p.firestoreWrites===0&&p.validation.receiptCount===1261&&p.validation.portfolioCount===641){state='success';description='Receipts/portfolio PREWRITE_READY: 1261 + 641; zero writes';}else if(p.classification){description=`Receipts/portfolio blocked: ${p.classification}`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-prewrite',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
