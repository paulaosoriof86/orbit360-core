name: Orbit 360 · Cobros 10.9 · post-close relations read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-diagnostics/cobros-post-close-relations-readonly-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-cobros-post-close-relations-readonly-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  GATE_ID: block10.9-cobros-controlled-write-lab-v20260801
  REQUEST_PATH: .github/orbit360-requests/cobros-controlled-write-lab-v20260801.json
  LIFECYCLE_PATH: tools/orbit360-validator-lifecycle-contract-cobros-controlled-write-lab-v20260801.json
  MARKER_PATH: .github/orbit360-diagnostics/cobros-post-close-relations-readonly-v20260801.json
  PACKAGE_PATH: /tmp/orbit360-cobros-gate10.9-private.json
  EVIDENCE_PATH: orbit360-platform/runtime-gate-crm-v20260716/cobros-post-close-relations-readonly-v20260801.json
jobs:
  verify:
    name: Gate 10.9 · verify five Cobros relations read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar alcance y lifecycle sellado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-cobros-post-close-relations-readonly-request-v1" and .gateId==env.GATE_ID and .contractVersion=="10.9.0" and .mode=="READ_ONLY_POST_CLOSE_RELATION_VERIFICATION" and .approved==true and .sourceExecutionRun==30712176452 and .expected.cases==5 and .expected.direct==4 and .expected.historical==1 and .expected.polizas==1373 and .expected.recibosEsperados==1294 and .expected.cobros==5 and .expected.finmovs==0 and .capabilities.secrets==true and .capabilities.firestoreRead==true and .capabilities.writes==false and .capabilities.browser==false and .capabilities.deploy==false and .capabilities.production==false' "$MARKER_PATH" >/dev/null
          jq -e '.status=="POST_CLOSE_READONLY_VERIFICATION_ACTIVE" and .executionProfile.mode=="READ_ONLY_POST_CLOSE_VERIFICATION" and .executionProfile.phase=="LAB_DATA_CONTRACT_REPAIR_DRYRUN" and .executionProfile.capabilities.writes==false and .requestSealedByLifecycle==true and .requestSemanticallyConsumed==true and .requestFileMutationProhibited==true and .additionalExecutionProhibited==true and .writeAuthorized==false and .productionAuthorized==false and .deployAuthorized==false' "$LIFECYCLE_PATH" >/dev/null
          jq -e '.gateId==env.GATE_ID and .contractVersion=="10.9.0" and .scope.cases==5 and .scope.policyWrites==0 and .scope.finmovs==0 and .privatePackage.driveFileId=="1FGpp_v6ZTs52VEeOnsH2IxoNCqWwVoAD" and .privatePackage.sha256=="beebdac90668291686f55610bdc2d8853ae5f2de4ae17b73732bb03812218911" and .privatePackage.logicalSha256=="fccae1f73d254a0fca8e1a0208a92f4a9a601bc83c8f8e26cb027be165f354bb"' "$REQUEST_PATH" >/dev/null
      - name: Gate canónico antes de secrets y Firestore
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-cobros-controlled-write-preflight-v20260801.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="READ_ONLY_POST_CLOSE_RELATION_VERIFICATION_READY" and .canonicalPhase=="LAB_DATA_CONTRACT_REPAIR_DRYRUN" and .phase=="READ_ONLY_POST_CLOSE_RELATION_VERIFICATION" and .requestState=="SEALED_NO_REPLAY" and .executionAuthorized==false and .labWriteAuthorized==false and .writeEligible==0 and .postCloseReadOnlyAuthorized==true and .requestReplayBlocked==true and .failed==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Preparar dependencia aislada
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save firebase-admin@13.4.0 >/dev/null 2>&1
      - name: Descargar paquete privado exacto
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          PACKAGE_ID="$(jq -r '.privatePackage.driveFileId' "$REQUEST_PATH")"
          PACKAGE_SHA="$(jq -r '.privatePackage.sha256' "$REQUEST_PATH")"
          export PACKAGE_ID PACKAGE_SHA
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          (async()=>{
            const sa=JSON.parse(process.env.SERVICE_ACCOUNT),now=Math.floor(Date.now()/1000);
            if(sa.project_id!=='ays-orbit-360-lab')throw new Error('ENVIRONMENT_FAILURE:PROJECT_ID_MISMATCH');
            const unsigned=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iss:sa.client_email,scope:'https://www.googleapis.com/auth/drive.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});
            const sig=crypto.sign('RSA-SHA256',Buffer.from(unsigned),sa.private_key).toString('base64url');
            const tokenResponse=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+sig})});
            const token=await tokenResponse.json();if(!tokenResponse.ok||!token.access_token)throw new Error('ENVIRONMENT_FAILURE:OAUTH_'+tokenResponse.status);
            const response=await fetch(`https://www.googleapis.com/drive/v3/files/${process.env.PACKAGE_ID}?alt=media&supportsAllDrives=true`,{headers:{authorization:`Bearer ${token.access_token}`}});
            if(!response.ok)throw new Error('ENVIRONMENT_FAILURE:DRIVE_'+response.status);
            const bytes=Buffer.from(await response.arrayBuffer()),sha=crypto.createHash('sha256').update(bytes).digest('hex');
            if(sha!==process.env.PACKAGE_SHA)throw new Error('DATA_CONTRACT_FAILURE:PRIVATE_PACKAGE_SHA');fs.writeFileSync(process.env.PACKAGE_PATH,bytes);
          })().catch(e=>{console.error(String(e.message||e));process.exit(41);});
          NODE
      - name: Ejecutar verificación read-only de relaciones
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"; export SERVICE_ACCOUNT
          export ORBIT360_COBROS_REQUEST="$REQUEST_PATH"
          export ORBIT360_COBROS_LIFECYCLE="$LIFECYCLE_PATH"
          export ORBIT360_COBROS_PACKAGE="$PACKAGE_PATH"
          export ORBIT360_COBROS_PACKAGE_SHA256="$(jq -r '.privatePackage.sha256' "$REQUEST_PATH")"
          export ORBIT360_COBROS_PACKAGE_LOGICAL_SHA256="$(jq -r '.privatePackage.logicalSha256' "$REQUEST_PATH")"
          export ORBIT360_COBROS_POST_CLOSE_EVIDENCE="$EVIDENCE_PATH"
          node --check tools/orbit360-verificar-cobros-post-close-relations-readonly-v20260801.mjs
          node tools/orbit360-verificar-cobros-post-close-relations-readonly-v20260801.mjs
          jq -e '.status=="POST_CLOSE_RELATIONS_PASS" and .classification=="GO_LAB_COBROS_POST_CLOSE_RELATIONS_READONLY" and .ok==true and .requestVerified==true and .lifecycleVerified==true and .packageVerified==true and .requestReplayBlocked==true and .counts.polizas==1373 and .counts.recibosEsperados==1294 and .counts.cobros==5 and .counts.finmovs==0 and .totals.cases==5 and .totals.direct==4 and .totals.historical==1 and .totals.policyRelations==5 and .totals.receiptRelations==5 and .totals.authorizationRelations==5 and .totals.idempotencyRelations==5 and .totals.policyStatesPreserved==5 and .totals.noFinmovCases==5 and ([.cases[].ok]|all) and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0 and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .containsPII==false and .containsPolicyNumbers==false and .containsAmounts==false and .containsSecrets==false' "$EVIDENCE_PATH" >/dev/null
          rm -f "$PACKAGE_PATH"
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-cobros-post-close-relations-readonly-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/cobros-post-close-relations-readonly-v20260801.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: ${{ env.EVIDENCE_PATH }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='Cobros 10.9 post-close relation verification failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.status==='POST_CLOSE_RELATIONS_PASS'&&p.totals.receiptRelations===5&&p.counts.finmovs===0&&p.firestoreWrites===0&&p.productionTouched===false){state='success';description='Cobros 10.9 post-close PASS: 5 relations; zero finmovs';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/cobros-post-close-relations-readonly',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
