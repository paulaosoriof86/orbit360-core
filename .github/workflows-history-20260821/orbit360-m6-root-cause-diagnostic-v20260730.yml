name: Orbit 360 · M6 root-cause diagnostic · read-only
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m6-root-cause-diagnostic-request-v20260730.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m6-root-cause-diagnostic-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block6-go-live-product-v20260730
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m6-root-cause-diagnostic-request-v20260730.json
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_URL: https://ays-orbit-360-lab.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  diagnose:
    name: M6 · diagnose failed go-live · no deploy · no writes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight canónico antes de secreto o APIs
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m6-root-cause-diagnostic-v20260730.mjs
          node --check tools/orbit360-m6-deploy-capability-diagnostic-readonly-v20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="6.1.1" and .executionPhase=="M6_PRODUCT_GO_LIVE_ROOT_CAUSE_DIAGNOSTIC" and .failed==0 and .diagnosticAuthorized==true and .capabilityProfile.secrets==true and .capabilityProfile.writes==false and .capabilityProfile.deploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .secretAccess==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Resolver identidad existente después del preflight
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m6-root-cause.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PRODUCT_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Instalar dependencia read-only
        shell: bash
        run: npm install --no-save --package-lock=false --ignore-scripts google-auth-library@9
      - name: Diagnosticar permisos Rules, Storage y estado remoto
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-deploy-capability-diagnostic-readonly-v20260730.mjs
          jq -e '.ok==true and .status=="M6_ROOT_CAUSE_DIAGNOSTIC_COMPLETE" and .dataWrites==0 and .firestoreWrites==0 and .operationalWrites==0 and .deployExecuted==false and .rulesApplied==false and .productionMutation==false and .containsPII==false and .containsSecrets==false' "$EVIDENCE_DIR/m6-root-cause-diagnostic-summary.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m6-root-cause-diagnostic-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m6-root-cause-diagnostic-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/m6-root-cause-diagnostic-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M6 root-cause diagnostic incomplete';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.ok===true){state='success';description=`M6 diagnostic complete: ${String(s.classification||'UNCLASSIFIED').slice(0,70)}`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m6-root-cause-diagnostic',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
