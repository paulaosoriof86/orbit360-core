name: Orbit360 R4 Access Filter Fastpath Rootfix 20260815

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4-access-filter-fastpath-rootfix-v20260815.yml'
      - 'tools/orbit360-access-filter-fastpath-rootfix-v20260815.mjs'

permissions:
  contents: write

env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical gate before source rootfix
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Validate semantic fast-path candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-access-filter-fastpath-rootfix-v20260815.mjs
          node tools/orbit360-access-filter-fastpath-rootfix-v20260815.mjs
          jq -e '.ok==true and .status=="ACCESS_FILTER_FASTPATH_SOURCE_PASS" and .classification=="FUNCTIONAL_DEFECT_ROOTFIX_SOURCE_PASS" and .semanticEquivalence==true and .directionOptimization.baseGetCalls>1000 and .directionOptimization.fastGetCalls<=6 and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .productionTouched==false and .deployExecuted==false and .packageRebuilt==false' "$EVIDENCE_DIR/r4-access-filter-fastpath-rootfix-v20260815.json" >/dev/null
          node --check "$EVIDENCE_DIR/access-scope.fastpath.candidate.js"
      - name: Apply only proven access-scope source rootfix
        shell: bash
        run: |
          set -euo pipefail
          TARGET='orbit360-platform/core/access-scope.js'
          cp "$EVIDENCE_DIR/access-scope.fastpath.candidate.js" "$TARGET"
          node --check "$TARGET"
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only)" = "$TARGET"
          grep -q 'v20260815: resolve invariant access context once per filter call' "$TARGET"
          git config user.name 'orbit360-control-plane'
          git config user.email 'orbit360-control-plane@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'fix: bound access filter invariant context once'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4-access-filter-fastpath-rootfix-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4-access-filter-fastpath-rootfix-v20260815.json
            orbit360-platform/runtime-gate-crm-v20260716/access-scope.fastpath.candidate.js
          if-no-files-found: warn
          retention-days: 14
