name: Orbit 360 · Store canónico · gate 7.10 cerrado

# Gate consumido. Se conserva únicamente como registro auditable.
# No posee disparador por push y aun el despacho manual queda bloqueado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Gate 7.10 cerrado
        run: echo "CANONICAL_STORE_CUMULATIVE_ADAPTER_STATIC_CLOSED"
