name: Orbit 360 · Validar failover cross-runner macOS · source-only

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - tools/orbit360-run-with-timeout-cross-platform-v20260806.mjs
      - tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v3-cross-runner-v20260806.sh
      - tools/orbit360-test-visual-matrix-cross-runner-source-v20260806.mjs
      - .github/workflows/orbit360-validate-visual-matrix-cross-runner-macos-source-v20260806.yml

permissions:
  contents: read

jobs:
  source-only-macos:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis portable
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-run-with-timeout-cross-platform-v20260806.mjs
          node --check tools/orbit360-test-visual-matrix-cross-runner-source-v20260806.mjs
          bash -n tools/orbit360-run-visual-matrix-corrected-post-auth-runtime-only-v3-cross-runner-v20260806.sh
      - name: Ejecutar prueba cross-runner source-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-test-visual-matrix-cross-runner-source-v20260806.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'orbit360-platform/runtime-gate-crm-v20260716/visual-matrix-cross-runner-source-test-sanitized-v20260806.json';
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!(value.status === 'PASS_VISUAL_MATRIX_CROSS_RUNNER_SOURCE' && value.total === 24 && value.passed === 24 && value.failed === 0 && value.priorSignalSafeChecks === 48 && value.priorSignalSafePassed === 48 && value.ok === true && value.secretsRead === false && value.firebaseAccess === false && value.browserExecuted === false && value.deployExecuted === false && value.productionTouched === false)) process.exit(42);
          NODE
