name: Orbit 360 · fijar binario Firebase RC1.2

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/patch-rc12-closure-macro-firebase-bin-v20260803.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: orbit360-patch-rc12-closure-macro-firebase-bin-v20260803
  cancel-in-progress: false

env:
  REQUEST: .github/orbit360-requests/patch-rc12-closure-macro-firebase-bin-v20260803.json
  STATUS_CONTEXT: orbit360/patch-rc12-firebase-bin

jobs:
  patch:
    name: RC1.2 · fijar firebase CLI · source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout request exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar frontera source-only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ays/backend-tenant-lab-v99-20260703'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.status=="AUTHORIZED_SOURCE_ONLY" and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false and .consumed==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-patch-rc12-closure-macro-firebase-bin-v20260803.mjs
          bash -n tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh

      - name: Aplicar ajuste determinista
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-patch-rc12-closure-macro-firebase-bin-v20260803.mjs
          bash -n tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh
          grep -F 'firebase deploy --only hosting --project "$ORBIT360_PROJECT_ID" --config firebase.json --non-interactive' tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh
          test -z "$(git diff --name-only | grep -v '^tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh$')"
          git diff --check

      - name: Persistir ajuste
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/orbit360-rc12-rootcause-cumulative-closure-macro-v20260803.sh
          git commit -m 'pipeline: fijar binario Firebase para cierre RC1.2'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703

      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,
              repo:context.repo.repo,
              sha:context.sha,
              state:'${{ job.status }}' === 'success' ? 'success' : 'failure',
              context:process.env.STATUS_CONTEXT,
              description:'${{ job.status }}' === 'success' ? 'RC1.2 · binario Firebase fijado' : 'RC1.2 · ajuste de binario falló',
              target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
