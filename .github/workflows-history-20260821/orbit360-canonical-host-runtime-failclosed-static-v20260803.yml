name: Orbit 360 · host canónico real · static root fix

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'orbit360-platform/core/backend-lab-loader.js'
      - 'tools/orbit360-canonical-host-runtime-failclosed-test-v20260803.mjs'
      - '.github/workflows/orbit360-canonical-host-runtime-failclosed-static-v20260803.yml'
      - 'orbit360-platform/docs/DIAGNOSTICO-POST-GO-LIVE-FALLBACK-DEMO-RC1-20260803.md'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-canonical-host-runtime-failclosed-static-v20260803
  cancel-in-progress: false

jobs:
  validate:
    name: Runtime canónico · no demo fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar contrato vigente antes de capacidades
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs block7-gravicentra-insurance-rc1-predeploy-readonly-v20260803
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="7.12.0" and .failed==0 and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null

      - name: Validar host canónico fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/backend-lab-loader.js
          node --check tools/orbit360-canonical-host-runtime-failclosed-test-v20260803.mjs
          node tools/orbit360-canonical-host-runtime-failclosed-test-v20260803.mjs > orbit360-platform/runtime-gate-crm-v20260716/canonical-host-runtime-failclosed-static-v20260803.json
          jq -e '.status=="PASS" and .classification=="GO_STATIC_RUNTIME_ROOT_FIX" and .failed==0 and .firestoreRead==false and .firestoreWrites==0 and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/canonical-host-runtime-failclosed-static-v20260803.json >/dev/null

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/canonical-host-runtime-failclosed-static-v20260803.json
        with:
          script: |
            const fs=require('fs');
            let state='failure',description='Canonical host runtime root fix failed';
            try{
              const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));
              if(s.status==='PASS'&&s.failed===0){state='success';description='Canonical host uses Firestore runtime; demo fallback blocked';}
            }catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/canonical-host-runtime-failclosed',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-host-runtime-failclosed-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/canonical-host-runtime-failclosed-static-v20260803.json
          if-no-files-found: warn
          retention-days: 30
