name: Orbit 360 · Cobros · authorization package static
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-triggers/cobros-authorization-package-static-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-cobros-authorization-package-static-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  TRIGGER: .github/orbit360-triggers/cobros-authorization-package-static-v20260801.json
  EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/cobros-authorization-package-static-v20260801.json
jobs:
  authorization_package_static:
    name: Gate 10.6 · sanitized authorization package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar trigger y lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          jq -e '.schemaVersion=="orbit360-cobros-authorization-package-static-trigger-v1" and .approved==true and .gateId=="block10.6-cobros-authorization-package-static-v20260801" and .contractVersion=="10.6.0" and .branch==env.ORBIT360_BRANCH and .scope.static==true and .scope.realPayloadsInRepo==false and .scope.browser==false and .scope.secrets==false and .scope.firestoreRead==false and .scope.writes==false and .scope.deploy==false and .scope.production==false' "$TRIGGER" >/dev/null
          AUTHORIZED_HEAD="$(jq -r '.authorizedHead' "$TRIGGER")"
          test -n "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$AUTHORIZED_HEAD" HEAD
          bad="$(git diff --name-only "$AUTHORIZED_HEAD"..HEAD | grep -Ev '^\.github/orbit360-triggers/cobros-authorization-package-static-v20260801\.json$' || true)"
          test -z "$bad"
      - name: Verificar gate predecessor 10.5
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-cobros-proposal-queue-static-v20260801.mjs
          jq -e '.status=="GO_GATE_CONTRACT" and .domainStatus=="COBROS_CONTROLLED_PROPOSAL_QUEUE_STATIC_READY" and .failed==0 and .queue.total==70 and .queue.authorizationReady==5 and .queue.reviewTemporal==24 and .queue.validationRequired==7 and .queue.hold==34 and .cobrosWrites==0 and .finmovsWrites==0 and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/cobros-proposal-queue-static-v20260801.json >/dev/null
      - name: Validar gate paquete 10.6
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/cobros-authorization-package-p0.js
          node --check tools/orbit360-test-cobros-authorization-package-p0-v20260801.mjs
          node --check tools/orbit360-validar-cobros-authorization-package-static-v20260801.mjs
          node tools/orbit360-validar-cobros-authorization-package-static-v20260801.mjs
          jq -e '.status=="GO_GATE_CONTRACT" and .domainStatus=="COBROS_AUTHORIZATION_PACKAGE_STATIC_READY" and .contractVersion=="10.6.0" and .failed==0 and .package.cards==5 and .package.direct==4 and .package.historical==1 and .package.authorizationGranted==0 and .package.writeEligible==0 and .duplicateIdempotencyKeys==0 and .diffsPresent==true and .rollbackPlansPresent==true and .privateMaterializationRequired==true and .privateValuesStoredInRepo==false and .packageGrantsAuthorization==false and .explicitAuthorizationRequired==true and .reinforcedAuthorizationForHistorical==true and .partialBatchDecisionAllowed==true and .realRowsStoredInRepo==0 and .cobrosWrites==0 and .finmovsWrites==0 and .firestoreWrites==0 and .operationalWrites==0 and .containsPII==false and .containsPolicyNumbers==false and .containsRealAmounts==false and .containsSecrets==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE" >/dev/null
      - name: Subir evidencia sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-cobros-authorization-package-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/cobros-authorization-package-static-v20260801.json
            orbit360-platform/docs/AUDITORIA-READONLY-COBROS-PAQUETE-AUTORIZACION-SANITIZADO-20260801.json
            orbit360-platform/docs/CIERRE-STATIC-COBROS-PAQUETE-AUTORIZACION-20260801.md
            orbit360-platform/docs/ACADEMIA-AUTORIZACION-COBROS-20260801.md
            orbit360-platform/docs/CLAUDE-ACUMULADO-COBROS-AUTORIZACION-CONTROLADA-20260801.md
          if-no-files-found: error
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: ${{ env.EVIDENCE }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='Cobros authorization package static blocked';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.status==='GO_GATE_CONTRACT'&&p.domainStatus==='COBROS_AUTHORIZATION_PACKAGE_STATIC_READY'&&p.failed===0){state='success';description='Cobros authorization package static PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/cobros-authorization-package-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
