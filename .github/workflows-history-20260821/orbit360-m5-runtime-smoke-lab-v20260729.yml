name: Orbit 360 · M5 runtime smoke LAB · RC d90ec601
run-name: M5 5.0.5 · Runtime smoke LAB exact RC · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - "tools/orbit360-m5-runtime-smoke-request-v20260729.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-smoke-lab-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m5-runtime-smoke-request-v20260729.json
  EXPECTED_RC_HASH: d90ec601d17c8e750cbba6f19197d3f906b29a1377817f53fb73f0779e843045
  EXPECTED_FIREBASE_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PREVIEW_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_EXPECTED_RUNTIME: 20260723-10
  ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  runtime_smoke_lab:
    name: M5 · Runtime smoke LAB · no deploy · no writes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar solicitud inmutable sin secretos
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m5-runtime-smoke-request-v1'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='5.0.5')bad.push('schema');
          if(r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent||r.allowedExecutions!==1||r.runtimeSmoke!==true)bad.push('binding');
          if(r.releaseCandidateHash!==process.env.EXPECTED_RC_HASH)bad.push('hash');
          if(r.projectId!==process.env.EXPECTED_FIREBASE_PROJECT_ID||r.canonicalUrl!==process.env.ORBIT360_PREVIEW_URL||r.reviewUrl!==process.env.ORBIT360_PREVIEW_URL+'/ays-lab-preview.html')bad.push('target');
          if(r.secrets!==true||r.firestoreRead!==true||r.firestoreWrite!==false||r.operationalWrites!==false||r.runtime!==true||r.browser!==true||r.deploy!==false||r.hostingDeploy!==false||r.functionsDeploy!==false||r.rulesDeploy!==false||r.production!==false||r.mergeMain!==false||r.policies!==false||r.visualReview!==false||r.containsPII!==false||r.containsSecrets!==false)bad.push('capabilities');
          if(bad.length)throw new Error('M5_RUNTIME_REQUEST_INVALID:'+bad.join(','));
          console.log('M5_RUNTIME_REQUEST_BOUND_OK');
          NODE

      - name: Preflight canónico antes de identidad
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-runtime-smoke-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-contract-v20260729.cjs
          node --check tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-browser-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-close-v20260729.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.5" and .executionPhase=="LAB_RUNTIME_GATE" and .failed==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==41 and .capabilityProfile.secrets==true and .capabilityProfile.firestoreRead==true and .capabilityProfile.writes==false and .capabilityProfile.runtime==true and .capabilityProfile.browser==true and .capabilityProfile.deploy==false and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .dataAccess==false and .secretAccess==false and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Verificar contrato estático y RC exacta
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-contract-v20260729.cjs
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_CONTRACT_PASS" and .failed==0 and .passed==.total and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==41 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0 and .runtime==true and .browser==true and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-contract-summary.json" >/dev/null

      - name: Instalar dependencias read-only y navegador
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Resolver identidad LAB después del preflight
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_LOGIN_SECRET: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_LOGIN_SECRET} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-m5-runtime-smoke-lab.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$EXPECTED_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_LAB_LOGIN_PASSWORD=$ORBIT360_LOGIN_SECRET" >> "$GITHUB_ENV"

      - name: Snapshot Firestore read-only antes del navegador
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs before
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .counts.sourceClients==414 and .counts.sourceInsurers==26 and .counts.advisors==7 and .counts.canonicalClients==414 and .counts.canonicalInsurers==26 and .counts.memberships==1 and .counts.config==1 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-live-before.json" >/dev/null

      - name: Ejecutar un único runtime smoke LAB
        id: browser
        continue-on-error: true
        shell: bash
        run: node tools/orbit360-m5-runtime-smoke-browser-v20260729.mjs

      - name: Snapshot Firestore read-only después del navegador
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs after
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-live-after.json" >/dev/null

      - name: Cerrar evidencia sanitizada y comparar digests
        if: always()
        shell: bash
        run: node tools/orbit360-m5-runtime-smoke-close-v20260729.mjs

      - name: Validar cierre runtime smoke ok true
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.browser.outcome }}" = "success"
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_LAB_CLOSED_SUCCESS" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .checks.desktopDirection==true and .checks.tabletOperativo==true and .checks.mobileAsesor==true and .checks.accessBoundary==true and .checks.dataBaseline==true and .checks.noWrites==true and .checks.noParseFailures==true and .allDigestsStable==true and .allCountsStable==true and .storeWriteCalls==0 and .networkWriteCandidates==0 and .firestoreWrites==0 and .operationalWrites==0 and .runtimeSmokeExecuted==true and .browserExecuted==true and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .policies==false and .approvalReadyForVisualReview==true and .containsPII==false and .containsSecrets==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-smoke-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-browser-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 runtime smoke LAB failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true&&s.status==='M5_RUNTIME_SMOKE_LAB_CLOSED_SUCCESS'&&s.allDigestsStable===true&&s.storeWriteCalls===0&&s.networkWriteCandidates===0){state='success';description='M5 runtime smoke LAB ok; zero writes';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-smoke-lab',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-${RUNNER_TEMP}/orbit360-m5-runtime-smoke-lab.json}"
