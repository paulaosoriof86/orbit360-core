name: Orbit 360 · Block 12 rootfix 6 · runtime con arnés endurecido LAB

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/block12-operational-runtime-lab-rootfix6-v20260804.json'

permissions:
  contents: write
  statuses: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-block12-operational-runtime-lab-rootfix6-v20260804
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/block12-operational-runtime-lab-rootfix6-v20260804.json
  ORBIT360_GATE_ID: block12-operational-runtime-lab-v20260804
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_REAL_TENANT_ID: alianzas-soluciones
  ORBIT360_HOSTING_CHANNEL: orbit360-operational-block12
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_FUNCTIONS: orbit360OpsLeadsCommandLabV20260804,orbit360GetAdvisorOpsInboxLabV20260804,orbit360CobrosReconciliationCommandLabV20260804,orbit360RecurringInsuranceImportLabV20260804

jobs:
  operational-runtime-rootfix6:
    name: Harness rootfix → gate → Functions/Hosting → runtime → rollback → visual
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout autorización exacta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar continuidad autorizada
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-block12-operational-runtime-lab-rootfix6-request-v1" and
            .status=="AUTHORIZED_AFTER_BROWSER_HARNESS_ROOTFIX" and
            .approved==true and
            .allowedExecutions==1 and
            .consumed==false and
            .replayAllowed==false and
            .retryAuthorized==true and
            .authorizationRef=="user_continue_urgent_block12_browser_harness_rootfix_20260804T1719-0600" and
            .previousRuntimeRunId==30956309298 and
            .previousRuntimeStatus=="cancelled" and
            .previousFailureClassification=="PIPELINE_MECHANISM_FAILURE" and
            .previousFailureCode=="BROWSER_BOOTSTRAP_WAIT_TIMEOUT_WITHOUT_FINALLY_CLOSE" and
            .previousScenariosPassed==0 and
            .previousScenariosFailed==0 and
            .previousRollbackExact==true and
            .previousRealTenantUnchanged==true and
            .rescueRunId==30959450996 and
            .rescueStatus=="RUNTIME_HANG_RESCUE_PASS" and
            .dependencyValidationRunId==30950155722 and
            .dependencyValidationStatus=="FUNCTIONS_BOOTSTRAP_LOAD_PASS" and
            .branch=="ays/backend-tenant-lab-v99-20260703" and
            .pullRequest==5 and
            .projectId=="ays-orbit-360-lab" and
            .gateId=="block12-operational-runtime-lab-v20260804" and
            .contractVersion=="12.0.5" and
            .parentHead==$parent
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - name: Materializar y validar root fix del arnés sin secretos
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-materializar-block12-browser-harness-rootfix-v20260804.mjs
          node --check tools/orbit360-materializar-block12-browser-harness-engine-fix-v20260804.mjs
          node tools/orbit360-materializar-block12-browser-harness-rootfix-v20260804.mjs
          node tools/orbit360-materializar-block12-browser-harness-engine-fix-v20260804.mjs
          node --check orbit360-platform/core/backend-lab-init.js
          node --check orbit360-platform/core/runtime-verification-center-v20260804.js
          node --check tools/orbit360-block12-operational-runtime-lab-v20260804.mjs
          node --check tools/orbit360-block12-cumulative-visual-v20260804.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block12-operational-runtime-lab-v20260804.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node - <<'NODE'
          const fs = require('fs');
          const harness = fs.readFileSync('tools/orbit360-block12-operational-runtime-lab-v20260804.mjs','utf8');
          const center = fs.readFileSync('orbit360-platform/core/runtime-verification-center-v20260804.js','utf8');
          const backend = fs.readFileSync('orbit360-platform/core/backend-lab-init.js','utf8');
          const checks = {
            browserV2: harness.includes("schemaVersion: 'orbit360-block12-browser-v2'"),
            browserFinally: harness.includes('if (browser) await browser.close().catch'),
            bootstrapStages: harness.includes('BACKEND_INIT_TERMINAL') && harness.includes('RUNTIME_CENTER_READY'),
            callTimeout: center.includes('withTimeout(callable(name)(payload), 30000'),
            authTimeout: center.includes("withTimeout(firebase.auth().signInWithCustomToken(token), 30000"),
            immediateCenterLoad: backend.includes("loadScriptOnce('core/runtime-verification-center-v20260804.js?v=20260804-2'") && !backend.includes("afterWindowLoad(function(){ loadScriptOnce('core/runtime-verification-center-v20260804.js?v=20260804-1'")
          };
          const failed = Object.entries(checks).filter(([,ok]) => !ok).map(([id]) => id);
          if (failed.length) throw new Error(`PIPELINE_MECHANISM_FAILURE:BROWSER_ROOTFIX_STATIC:${failed.join(',')}`);
          console.log(JSON.stringify({status:'BLOCK12_BROWSER_HARNESS_STATIC_PASS',checks,secretAccess:false,firestoreRead:false,deployExecuted:false,ok:true},null,2));
          NODE
          git diff --check
          test -z "$(git diff --name-only -- firestore.rules data/store.js orbit360-platform/data/store.js orbit360-platform/data/store-firestore-lab.local.js orbit360-platform/core/auth.js)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            orbit360-platform/core/backend-lab-init.js \
            orbit360-platform/core/runtime-verification-center-v20260804.js \
            tools/orbit360-block12-operational-runtime-lab-v20260804.mjs \
            tools/orbit360-validar-gate-contracts-v20260717.mjs \
            tools/orbit360-validar-gate-contracts-engine-block12-operational-runtime-lab-v20260804.mjs
          git commit -m 'fix(block12): harden runtime bootstrap and browser shutdown'
          git push origin HEAD:"$ORBIT360_BRANCH"
          echo "ORBIT360_MATERIALIZED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Gate contractual obligatorio antes de secretos
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '
            .status=="GO_GATE_CONTRACT" and
            .classification=="OPERATIONAL_RUNTIME_LAB_READY" and
            .contractVersion=="12.0.5" and
            .failed==0 and
            .executionAuthorized==true and
            .secretAccessAuthorized==true and
            .firestoreReadAuthorized==true and
            .writeAuthorized==true and
            .authWriteAuthorized==true and
            .runtimeAuthorized==true and
            .browserAuthorized==true and
            .deployAuthorized==true and
            .functionsDeployAuthorized==true and
            .hostingPreviewAuthorized==true and
            .rulesDeployAuthorized==false and
            .productionAuthorized==false and
            .realTenantWritesAuthorized==false and
            .realDataReimportAuthorized==false and
            .secretAccess==false and
            .firestoreRead==false and
            .firestoreWrites==0 and
            .authWrites==0 and
            .runtimeExecuted==false and
            .browserExecuted==false and
            .deployExecuted==false
          ' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Resolver identidad LAB después del gate
        id: credentials
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-block12-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_BLOCK12_PRIVATE_STATE=$RUNNER_TEMP/orbit360-block12-private-state.json" >> "$GITHUB_ENV"
          echo "ORBIT360_LOCAL_FIREBASE_CONFIG_FILE=$GITHUB_WORKSPACE/orbit360-platform/core/auth-firebase.config.local.js" >> "$GITHUB_ENV"

      - name: Instalar herramientas y Functions desde lockfile
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 google-auth-library@9 playwright@1.52.0 firebase-tools@15.25.1 >/dev/null
          npm --prefix functions ci --include=prod
          node tools/orbit360-validar-functions-runtime-dependencies-v20260804.mjs | tee "$RUNNER_TEMP/functions-runtime-pass.json"
          jq -e '.status=="FUNCTIONS_BOOTSTRAP_LOAD_PASS" and .ok==true' "$RUNNER_TEMP/functions-runtime-pass.json" >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npx firebase --version

      - name: Confirmar entorno limpio antes del fixture
        shell: bash
        run: |
          set -euo pipefail
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-before.json" || true
          for NAME in ${ORBIT360_FUNCTIONS//,/ }; do
            if grep -Fq "$NAME" "$RUNNER_TEMP/functions-before.json"; then
              echo "PIPELINE_MECHANISM_FAILURE:FUNCTION_ALIAS_ALREADY_EXISTS:$NAME"
              exit 42
            fi
          done

      - name: Preparar tenant sintético y snapshot inicial
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-block12-operational-runtime-lab-v20260804.mjs prepare
          jq -e '.status=="SYNTHETIC_RUNTIME_READY" and .syntheticUsersCreated==3 and .syntheticMembershipsCreated==3 and .realTenantWrites==0 and .rulesChanged==false and .productionTouched==false and .ok==true' "$ORBIT360_EVIDENCE_DIR/block12-operational-runtime-prepare-sanitized.json" >/dev/null

      - name: Desplegar y verificar exactamente cuatro Functions LAB
        id: functions_deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          ONLY=""
          for NAME in ${ORBIT360_FUNCTIONS//,/ }; do ONLY="${ONLY}${ONLY:+,}functions:${NAME}"; done
          set +e
          npx firebase deploy --project "$ORBIT360_PROJECT_ID" --only "$ONLY" --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/functions-deploy.log"
          DEPLOY_CODE=${PIPESTATUS[0]}
          set -e
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-after.json" || true
          VERIFIED=0
          for NAME in ${ORBIT360_FUNCTIONS//,/ }; do grep -Fq "$NAME" "$RUNNER_TEMP/functions-after.json" && VERIFIED=$((VERIFIED+1)); done
          echo "cli_exit=$DEPLOY_CODE" >> "$GITHUB_OUTPUT"
          echo "verified_count=$VERIFIED" >> "$GITHUB_OUTPUT"
          test "$VERIFIED" = 4
          echo "FUNCTIONS_VERIFIED_4_OF_4"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Desplegar Hosting en canal preview LAB
        id: hosting_deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          LOG="$RUNNER_TEMP/hosting-channel.log"
          npx firebase hosting:channel:deploy "$ORBIT360_HOSTING_CHANNEL" --expires 7d --project "$ORBIT360_PROJECT_ID" --non-interactive | tee "$LOG"
          URL="$(grep -Eo 'https://[-A-Za-z0-9.]+\.web\.app' "$LOG" | tail -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas dentro de Orbit 360 con timeout duro
        id: browser_runtime
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 420s node tools/orbit360-block12-operational-runtime-lab-v20260804.mjs browser
          CODE=$?
          pkill -TERM -f 'headless_shell|chrome-linux|chromium' 2>/dev/null || true
          BROWSER="$ORBIT360_EVIDENCE_DIR/block12-operational-runtime-browser-sanitized.json"
          if [ ! -f "$BROWSER" ]; then
            node -e "const fs=require('fs');const p=process.argv[1];fs.writeFileSync(p,JSON.stringify({schemaVersion:'orbit360-block12-browser-v2',status:'OPERATIONAL_RUNTIME_BROWSER_FAIL',classification:'PIPELINE_MECHANISM_FAILURE',verdict:'FAIL',error:'BROWSER_HARD_TIMEOUT_OR_PROCESS_EXIT',exitCode:Number(process.argv[2]),passed:0,failed:1,results:[],browserExecuted:true,realTenantWrites:0,containsTokens:false,ok:false},null,2)+'\n')" "$BROWSER" "$CODE"
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Construir candidata visual acumulativa read-only
        id: cumulative_visual
        if: steps.browser_runtime.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 300s node tools/orbit360-block12-cumulative-visual-v20260804.mjs
          CODE=$?
          pkill -TERM -f 'headless_shell|chrome-linux|chromium' 2>/dev/null || true
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Rollback exacto y snapshot final
        id: cleanup
        if: always() && steps.tools.outcome == 'success'
        shell: bash
        run: |
          set +e
          CODE=0
          if [ -n "${ORBIT360_BLOCK12_PRIVATE_STATE:-}" ] && [ -f "$ORBIT360_BLOCK12_PRIVATE_STATE" ]; then
            node tools/orbit360-block12-operational-runtime-lab-v20260804.mjs cleanup
            CODE=$?
            FINAL="$ORBIT360_EVIDENCE_DIR/block12-operational-runtime-final.json"
            if [ -f "$FINAL" ] && jq -e '.rollback.exact == true and .realTenant.unchanged == true' "$FINAL" >/dev/null; then CODE=0; fi
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Consolidar veredicto y retirar deploy fallido
        id: decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FINAL="$ORBIT360_EVIDENCE_DIR/block12-operational-runtime-final.json"
          VISUAL="$ORBIT360_EVIDENCE_DIR/block12-cumulative-visual-sanitized.json"
          BROWSER="$ORBIT360_EVIDENCE_DIR/block12-operational-runtime-browser-sanitized.json"
          FINAL_OK=false; VISUAL_OK=false; ROLLBACK_OK=false; BROWSER_OK=false
          test -f "$FINAL" && FINAL_OK="$(jq -r '.ok // false' "$FINAL")"
          test -f "$FINAL" && ROLLBACK_OK="$(jq -r '(.rollback.exact == true and .realTenant.unchanged == true)' "$FINAL")"
          test -f "$VISUAL" && VISUAL_OK="$(jq -r '.ok // false' "$VISUAL")"
          test -f "$BROWSER" && BROWSER_OK="$(jq -r '.ok // false' "$BROWSER")"
          BROWSER_EXIT="${{ steps.browser_runtime.outputs.exit_code }}"
          VISUAL_EXIT="${{ steps.cumulative_visual.outputs.exit_code }}"
          CLEANUP_EXIT="${{ steps.cleanup.outputs.exit_code }}"
          PASS=false
          if [ "$FINAL_OK" = true ] && [ "$VISUAL_OK" = true ] && [ "$BROWSER_OK" = true ] && [ "$ROLLBACK_OK" = true ] && [ "$BROWSER_EXIT" = 0 ] && [ "$VISUAL_EXIT" = 0 ] && [ "$CLEANUP_EXIT" = 0 ]; then PASS=true; fi
          FIRST_FAILURE=""; FAILURE_CLASS=""
          if [ -f "$BROWSER" ]; then
            FIRST_FAILURE="$(jq -r '[.results[]? | select(.status=="FAIL")][0].code // .bootstrap.stages[-1].stage // .error // empty' "$BROWSER")"
            FAILURE_CLASS="$(jq -r '[.results[]? | select(.status=="FAIL")][0].classification // .classification // empty' "$BROWSER")"
          fi
          [ -n "$FIRST_FAILURE" ] || FIRST_FAILURE="POST_RUNTIME_OR_VISUAL_VERDICT"
          [ -n "$FAILURE_CLASS" ] || FAILURE_CLASS="RUNTIME_OR_PIPELINE_FAILURE"
          if [ "${{ steps.tools.outcome }}" = success ] && [ "$PASS" != true ]; then
            if [ "${{ steps.functions_deploy.outputs.attempted }}" = true ]; then
              for NAME in ${ORBIT360_FUNCTIONS//,/ }; do npx firebase functions:delete "$NAME" --region us-central1 --project "$ORBIT360_PROJECT_ID" --force || true; done
            fi
            if [ "${{ steps.hosting_deploy.outputs.attempted }}" = true ]; then
              npx firebase hosting:channel:delete "$ORBIT360_HOSTING_CHANNEL" --project "$ORBIT360_PROJECT_ID" --force || true
            fi
          fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg head "${ORBIT360_MATERIALIZED_HEAD:-}" \
            --arg previewUrl "${ORBIT360_PREVIEW_URL:-}" \
            --arg browserExit "$BROWSER_EXIT" \
            --arg visualExit "$VISUAL_EXIT" \
            --arg cleanupExit "$CLEANUP_EXIT" \
            --arg firstFailure "$FIRST_FAILURE" \
            --arg failureClass "$FAILURE_CLASS" \
            --argjson pass "$PASS" \
            '{schemaVersion:"orbit360-block12-rootfix6-macro-decision-v1",generatedAt:$generatedAt,gateId:"block12-operational-runtime-lab-v20260804",contractVersion:"12.0.5",previousRuntimeRunId:30956309298,rescueRunId:30959450996,materializedHead:$head,decision:(if $pass then "GO_LAB_OPERATIONAL_RUNTIME_AND_CUMULATIVE_VISUAL" else "STOP_BLOCK12_ROOTFIX6" end),classification:(if $pass then "GO_LAB" else $failureClass end),firstFailure:$firstFailure,previewUrl:(if $pass then $previewUrl else "" end),browserExitCode:$browserExit,visualExitCode:$visualExit,cleanupExitCode:$cleanupExit,functionsVerified4of4:($pass or ($firstFailure != "FUNCTIONS_DEPLOY_VERIFICATION")),rollbackExact:($cleanupExit=="0"),authorizationConsumed:true,allowedExecutionsRemaining:0,replayAllowed:false,functionsKept:$pass,hostingPreviewKept:$pass,rulesDeployed:false,realDataReimported:false,productionTouched:false,mainTouched:false,mergeExecuted:false,ok:$pass,containsPII:false,containsSecrets:false}' > "$ORBIT360_EVIDENCE_DIR/block12-rootfix6-macro-decision.json"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "first_failure=$FIRST_FAILURE" >> "$GITHUB_OUTPUT"
          if [ "$PASS" != true ]; then exit 45; fi

      - name: Publicar evidencias sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-block12-rootfix6-runtime-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/functions-dependency-rootfix-source-v20260804.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-operational-runtime-prepare-sanitized.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-operational-runtime-browser-sanitized.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-operational-runtime-final.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-cumulative-visual-sanitized.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-rootfix6-macro-decision.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-operational-runtime-center.png
            orbit360-platform/runtime-gate-crm-v20260716/block12-cumulative-visual/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar decisión en PR 5
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$ORBIT360_EVIDENCE_DIR/block12-rootfix6-macro-decision.json"
          DECISION="STOP_BLOCK12_ROOTFIX6_BEFORE_DECISION"; CLASSIFICATION="PIPELINE_MECHANISM_FAILURE"; FIRST="UNKNOWN"; PREVIEW=""
          if [ -f "$FILE" ]; then
            DECISION="$(jq -r '.decision' "$FILE")"
            CLASSIFICATION="$(jq -r '.classification' "$FILE")"
            FIRST="$(jq -r '.firstFailure // ""' "$FILE")"
            PREVIEW="$(jq -r '.previewUrl // ""' "$FILE")"
          fi
          BODY="## Block 12 rootfix 6 · run ${GITHUB_RUN_ID}\n\n- Decisión: \`${DECISION}\`\n- Clasificación: \`${CLASSIFICATION}\`\n- Primer fallo: \`${FIRST}\`\n- HEAD materializado: \`${ORBIT360_MATERIALIZED_HEAD:-no-materializado}\`\n- Rules/reimportación real/producción/main/merge: no"
          if [ -n "$PREVIEW" ]; then BODY="${BODY}\n- Candidata visual LAB: ${PREVIEW}"; fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="$BODY" >/dev/null
