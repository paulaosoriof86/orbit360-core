name: Orbit 360 · M5 runtime 5.0.8 · remediación estática 5.0.9
run-name: M5 5.0.9 · static root-cause remediation · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-runtime-smoke-509-remediation-static-v20260729.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-smoke-509-remediation-static-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  static_remediation:
    name: M5 · static only · load order + evidence owner + new RC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar alcance estático
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${ORBIT360_LAB_LOGIN_PASSWORD:-}"

      - name: Preflight canónico 5.0.9
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-runtime-smoke-509-remediation-static-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-509-remediation-static-contract-v20260729.cjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.9" and .executionPhase=="M5_RUNTIME_SMOKE_ROOT_CAUSE_REMEDIATION_STATIC" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .releaseCandidateHash != .priorReleaseCandidateHash and .criticalAssets==42 and .remoteAssetsExpected==25 and .remoteAssetsMatched==24 and .mismatchCount==1 and .approvalReadyForLabDelivery==true and .capabilityProfile.secrets==false and .capabilityProfile.firestoreRead==false and .capabilityProfile.writes==false and .capabilityProfile.runtime==false and .capabilityProfile.browser==false and .capabilityProfile.deploy==false and .dataAccess==false and .secretAccess==false and .operationalWrites==0' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Validar contrato y fixtures
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-509-remediation-static-contract-v20260729.cjs
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_509_REMEDIATION_STATIC_CONTRACT_PASS" and .failed==0 and .passed==.total and .releaseCandidateHash != .priorReleaseCandidateHash and .criticalAssets==42 and .remoteAssetsExpected==25 and .remoteAssetsMatched==24 and .mismatchCount==1 and .remoteParity==false and .approvalReadyForLabDelivery==true and .secrets==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .deploy==false' "$EVIDENCE_DIR/m5-runtime-smoke-509-remediation-static-contract-summary.json" >/dev/null
          jq -e '.ok==true and .status=="M5_ACADEMIA_STATIC_BOOTSTRAP_LOAD_ORDER_PASS" and .failed==0 and .passed==.total' "$EVIDENCE_DIR/m5-academia-static-bootstrap-load-order-test.json" >/dev/null
          jq -e '.ok==true and .status=="M5_BOOTSTRAP_EVIDENCE_NORMALIZER_PASS" and .failed==0 and .passed==.total' "$EVIDENCE_DIR/m5-bootstrap-evidence-normalizer-test.json" >/dev/null

      - name: Crear cierre sanitizado del package
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const d=process.env.EVIDENCE_DIR;
          const read=n=>JSON.parse(fs.readFileSync(path.join(d,n),'utf8'));
          const p=read('preflight-sanitizado.json'),c=read('m5-runtime-smoke-509-remediation-static-contract-summary.json'),l=read('m5-academia-static-bootstrap-load-order-test.json'),n=read('m5-bootstrap-evidence-normalizer-test.json'),r=read('m5-release-candidate-readiness-summary.json');
          const ok=p.status==='GO_GATE_CONTRACT'&&p.failed===0&&c.ok===true&&c.failed===0&&l.ok===true&&n.ok===true&&c.releaseCandidateHash!==c.priorReleaseCandidateHash&&r.releaseCandidate?.hash===c.releaseCandidateHash&&r.remoteLab?.assetsMatched===24&&r.remoteLab?.mismatchCount===1;
          const out={schemaVersion:'orbit360-m5-runtime-smoke-509-remediation-static-package-summary-v1',generatedAt:new Date().toISOString(),ok,status:ok?'M5_RUNTIME_SMOKE_509_REMEDIATION_STATIC_PACKAGE_PASS':'M5_RUNTIME_SMOKE_509_REMEDIATION_STATIC_PACKAGE_FAIL',gateId:process.env.ORBIT360_GATE_ID,contractVersion:'5.0.9',priorReleaseCandidateHash:c.priorReleaseCandidateHash,releaseCandidateHash:c.releaseCandidateHash,preflightPassed:p.passed,preflightTotal:p.total,contractPassed:c.passed,contractTotal:c.total,loadOrderFixture:`${l.passed}/${l.total}`,normalizerFixture:`${n.passed}/${n.total}`,criticalAssets:c.criticalAssets,remoteAssetsExpected:c.remoteAssetsExpected,remoteAssetsMatched:c.remoteAssetsMatched,mismatchCount:c.mismatchCount,mismatchPaths:(r.remoteLab?.rows||[]).filter(row=>!row.match).map(row=>row.path),approvalReadyForLabDelivery:c.approvalReadyForLabDelivery,secrets:false,firestoreRead:false,firestoreWrites:0,operationalWrites:0,runtime:false,browser:false,deploy:false,functionsDeploy:false,rulesDeploy:false,production:false,mergeMain:false,policies:false,containsPII:false,containsSecrets:false};
          fs.writeFileSync(path.join(d,'m5-runtime-smoke-509-remediation-static-package-summary.json'),JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Validar cierre package
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_509_REMEDIATION_STATIC_PACKAGE_PASS" and .releaseCandidateHash != .priorReleaseCandidateHash and .criticalAssets==42 and .remoteAssetsExpected==25 and .remoteAssetsMatched==24 and .mismatchCount==1 and .mismatchPaths==["index.html"] and .approvalReadyForLabDelivery==true and .secrets==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtime==false and .browser==false and .deploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .policies==false' "$EVIDENCE_DIR/m5-runtime-smoke-509-remediation-static-package-summary.json" >/dev/null

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-smoke-509-remediation-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-509-remediation-static-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-academia-static-bootstrap-load-order-test.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-bootstrap-evidence-normalizer-test.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-509-remediation-static-package-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-509-remediation-static-package-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 static root-cause remediation failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true){state='success';description='M5 static root-cause remediation passed; new RC';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-remediation-509',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
