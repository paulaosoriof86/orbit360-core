name: Orbit 360 · M4 final canonical migration · WRITE_ONCE
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m4-final-canonical-write-request-v20260728.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m4-final-canonical-migration-write
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block4-final-canonical-migration-write-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m4-final-canonical-write-request-v20260728.json
  ORBIT360_EXISTING_FIREBASE_PROJECT_ID: ays-orbit-360-lab
jobs:
  final-canonical-write:
    name: M4 · Final canonical target write · chunked durable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2, persist-credentials: false}
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validar autorización inmutable sin acceso externo
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${ORBIT360_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),bad=[];
          if(r.schemaVersion!=='orbit360-m4-final-canonical-migration-write-request-v1'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='4.3.1'||r.branch!==process.env.ORBIT360_BRANCH)bad.push('schema_scope');
          if(r.authorizedBaseCommit!==parent||r.explicitAuthorization!==true||r.allowedExecutions!==1||r.atomicPerChunkWrite!==true)bad.push('binding_authorization');
          if(r.expectedProjectId!==process.env.ORBIT360_EXISTING_FIREBASE_PROJECT_ID||r.expectedConfigCreates!==1||r.expectedClientCreates!==414||r.expectedInsurerCreates!==26||r.expectedTargetCreates!==441)bad.push('selection');
          if(r.snapshotWritesAuthorized!==441||r.auditWritesAuthorized!==442||r.importBatchWritesAuthorized!==2||r.maxSuccessOperationalWrites!==1326||r.membershipWrites!==false)bad.push('write_budget');
          if(r.emergencyRollbackAuthorized!==true||r.maxRollbackTargetDeletes!==441||r.maxRollbackAuditWrites!==442||r.maxRollbackBatchUpdates!==1||r.maxRollbackOperationalWrites!==884)bad.push('rollback_budget');
          if(r.dryRunIdempotencyKey!=='ed2f0adc554700556d80c2625913b34256a043b5226629b125d6e0203a076573')bad.push('dryrun_binding');
          if(r.policies!==false||r.vehicles!==false||r.receivables!==false||r.collections!==false||r.commissions!==false||r.financialHistory!==false||r.deploy!==false||r.rulesDeploy!==false||r.functionsDeploy!==false||r.production!==false||r.mergeMain!==false)bad.push('scope');
          if(r.containsPII!==false||r.containsSecrets!==false)bad.push('sanitization');if(bad.length)throw new Error('REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico antes de secretos y escrituras
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="4.3.1" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .activationMode=="immutable_request_present" and .validationMode=="executed_contract_fixtures" and .literalSourceInspection==false and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false and .operationalWrites==0' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Probar contrato antes de secretos y escrituras
        run: node tools/orbit360-m4-final-canonical-write-contract-v20260728.cjs
      - name: Resolver cuenta existente después del preflight
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"; test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-m4-final-canonical-write.json"; printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_EXISTING_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"; echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Instalar dependencia controlada
        run: npm install --no-save --ignore-scripts firebase-admin@13
      - name: Ejecutar migración canónica durable por lotes
        run: node tools/orbit360-m4-final-canonical-write-v20260728.mjs
      - name: Validar evidencia sanitizada post-write
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and .status=="M4_FINAL_CANONICAL_MIGRATION_WRITE_COMPLETED" and .priorDryRunClosureValidated==true and .before.sourceClients==414 and .before.sourceInsurers==26 and .before.targetClients==0 and .before.targetInsurers==0 and .before.targetConfig==0 and .before.memberships==1 and .after.sourceClients==414 and .after.sourceInsurers==26 and .after.targetClients==414 and .after.targetInsurers==26 and .after.targetConfig==1 and .after.memberships==1 and .selection.targetCreates==441 and .selection.membershipWrites==0 and .selection.requiresValidation==0 and .selection.targetOnly==0 and .writes.configWrites==1 and .writes.clientWrites==414 and .writes.insurerWrites==26 and .writes.targetCreates==441 and .writes.snapshotWrites==441 and .writes.auditWrites==442 and .writes.importBatchWrites==2 and .writes.membershipWrites==0 and .writes.totalOperationalWrites==1326 and .audit.recordCreateEvents==441 and .audit.batchSummaryEvents==1 and .rollback.available==true and .rollback.executed==false and .verification.sourceDigestsUnchanged==true and .verification.membershipDigestUnchanged==true and .verification.targetDigestMatchesExpected==true and .verification.allTargetsTenantScoped==true and .verification.countryCurrencyConsistent==true and .verification.snapshotReadback==441 and .verification.recordAuditReadback==441 and .verification.batchAuditReadback==1 and .verification.batchStatus=="completed" and .approvalReadyForM4FinalRevalidation==true and .policies==false and .containsPII==false and .containsSecrets==false' orbit360-platform/runtime-gate-crm-v20260716/m4-final-canonical-write-summary.json >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m4-final-canonical-write-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-final-canonical-write-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m4-final-canonical-write-summary.json
          retention-days: 30
      - name: Publicar estado observable sanitizado
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          summary='orbit360-platform/runtime-gate-crm-v20260716/m4-final-canonical-write-summary.json'; state=failure; description='M4 final canonical write failed'
          if [ -f "$summary" ] && [ "$(jq -r '.ok // false' "$summary")" = true ]; then state=success; description='M4 final canonical write completed'; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m4-final-canonical-write"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
      - name: Limpiar material efímero
        if: always()
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-}"
