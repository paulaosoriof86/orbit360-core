name: Orbit 360 · M5 control-plane schema redesign 5.0.27
run-name: M5 5.0.27 · schema-driven static redesign · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  EXPECTED_RC_HASH: ae6bb2a35ce4f03c0353d670218c841e51b57a2461a3ba9e741d8bd7a973fd61

jobs:
  schema_driven_static:
    name: M5 · schema-driven validator redesign · zero operational capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar freeze cerrado
        shell: bash
        run: |
          set -euo pipefail
          echo 'M5_CONTROL_PLANE_REDESIGN_527_STATIC_PASS_CLOSED'
          exit 1
