name: Orbit 360 · M6 stable recovery owner
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-m6-corrective-go-live-v20260730.yml'
      - 'tools/orbit360-m6-final-closure-630-request-v20260730.json'
      - 'tools/orbit360-m6-generate-product-runtime-config-v20260730.mjs'
      - 'tools/orbit360-m6-build-product-shell-v20260730.mjs'
      - 'orbit360-platform/core/product-app-runtime-p0.js'
      - 'orbit360-platform/core/tenant-access-policy-product-p0.js'
      - 'orbit360-platform/core/product-membership-access-bridge-p0.js'
      - 'tools/orbit360-m6-product-membership-access-bridge-test-v20260730.mjs'
      - 'tools/orbit360-m6-product-browser-smoke-v20260730.mjs'
      - 'tools/orbit360-browser-blocking-gate-readiness-v20260730.mjs'
      - 'tools/orbit360-browser-blocking-gate-readiness-test-v20260730.mjs'
      - 'tools/orbit360-m6-final-closure-620-access-root-cause-v20260730.json'
      - 'tools/orbit360-m6-final-closure-630-preflight-pipeline-root-cause-v20260730.json'
      - 'tools/orbit360-validator-lifecycle-contract-m6-final-package-630-static-v20260730.json'
      - 'tools/orbit360-validar-gate-contracts-engine-m6-final-package-630-static-v20260730.mjs'
      - 'tools/orbit360-validator-lifecycle-contract-m6-final-closure-630-v20260730.json'
      - 'tools/orbit360-validar-gate-contracts-engine-m6-final-closure-630-v20260730.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-m6-final-closure-630-resume-v20260730.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m6-product-go-live-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block6-go-live-product-v20260730
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m6-final-closure-630-request-v20260730.json
  ORBIT360_PIPELINE_RC_FILE: tools/orbit360-m6-final-closure-630-preflight-pipeline-root-cause-v20260730.json
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_PRODUCT_URL: https://ays-orbit-360-lab.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  static_preflight:
    name: M6 · canonical static/pre-risk preflight
    runs-on: ubuntu-24.04
    outputs:
      recovery_requested: ${{ steps.detect.outputs.recovery_requested }}
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detectar request nuevo o reanudación pre-risk autorizada
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "recovery_requested=false" >> "$GITHUB_OUTPUT"
          if git diff --name-only HEAD^ HEAD | grep -Fxq "$ORBIT360_REQUEST_FILE"; then
            echo "recovery_requested=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git rev-parse HEAD^)" = "fd7a48ffc67c35267546fc80afde227158852f14"
          test -f "$ORBIT360_REQUEST_FILE"
          test -f "$ORBIT360_PIPELINE_RC_FILE"
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const req=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const rc=JSON.parse(fs.readFileSync(process.env.ORBIT360_PIPELINE_RC_FILE,'utf8'));
          const requestCommit=cp.execFileSync('git',['log','-n','1','--format=%H','--',process.env.ORBIT360_REQUEST_FILE],{encoding:'utf8'}).trim();
          const requestParent=cp.execFileSync('git',['rev-parse',requestCommit+'^'],{encoding:'utf8'}).trim();
          if(requestCommit!==rc.sourceRequestCommit||req.recoveryBaseCommit!==requestParent)throw new Error('M6_RESUME_REQUEST_LINEAGE_INVALID');
          if(rc.sourceRun!==30561973750||rc.canonicalChecksPassed!==23||rc.canonicalChecksFailed!==0||rc.recoverySkipped!==true||rc.secretsRead!==false||rc.firestoreRead!==false||rc.firestoreWrites!==0||rc.operationalWrites!==0||rc.browserExecuted!==false||rc.rulesApplied!==false||rc.deployExecuted!==false||rc.productionTouched!==false||rc.authorizationConsumedByDeploy!==false||rc.requestImmutable!==true||rc.sameRequestResumeAllowed!==true)throw new Error('M6_RESUME_PRE_RISK_PROOF_INVALID');
          if(req.explicitRecoveryAuthorization!==true||req.authorizationConsumed!==false||req.allowedExecutions!==1)throw new Error('M6_RESUME_AUTHORIZATION_NOT_AVAILABLE');
          NODE
          echo "recovery_requested=true" >> "$GITHUB_OUTPUT"
      - name: Preflight canónico antes de cualquier capacidad
        id: static_preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-hosting-readiness-bounded-v20260730.mjs
          node --check tools/orbit360-m6-product-browser-smoke-v20260730.mjs
          node --check tools/orbit360-browser-blocking-gate-readiness-v20260730.mjs
          node --check tools/orbit360-m6-product-membership-access-bridge-test-v20260730.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m6-final-closure-630-resume-v20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="6.3.0" and .failed==0 and .membershipAccessBridge==true and .advisorMigrationRequired==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .rulesApplied==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          if [ "${{ steps.detect.outputs.recovery_requested }}" = "true" ]; then
            jq -e '.executionPhase=="M6_PRODUCT_GO_LIVE_RECOVERY_EXECUTION" and .executionAuthorized==true and .allowedExecutions==1 and .pipelineResumeAllowed==true and .sourcePreRiskFailedRun==30561973750' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          else
            jq -e '.nextRecoveryPrepared==true and .nextRecoveryRequestPresent==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          fi
      - name: Publicar estado estático
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M6 static/pre-risk preflight failed';
            try{const p=JSON.parse(fs.readFileSync(process.env.PREFLIGHT,'utf8'));if(p.status==='GO_GATE_CONTRACT'&&p.failed===0){state='success';description=`M6 preflight ${p.contractVersion} PASS; zero capabilities`;}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m6-static-preflight',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Subir evidencia estática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m6-static-preflight-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          if-no-files-found: warn
          retention-days: 30
  recovery:
    name: M6 · final closure 6.3.0 · Firestore read-only + Hosting · Storage deferred
    needs: static_preflight
    if: needs.static_preflight.outputs.recovery_requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar request macro final closure 6.3.0 inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$ORBIT360_REQUEST_FILE"
          test -f "$ORBIT360_PIPELINE_RC_FILE"
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const prc=JSON.parse(fs.readFileSync(process.env.ORBIT360_PIPELINE_RC_FILE,'utf8'));
          const requestCommit=cp.execFileSync('git',['log','-n','1','--format=%H','--',process.env.ORBIT360_REQUEST_FILE],{encoding:'utf8'}).trim();
          const requestParent=cp.execFileSync('git',['rev-parse',requestCommit+'^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m6-final-closure-request-v2'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='6.3.0'||r.macroClosure!==true)bad.push('schema');
          if(r.branch!==process.env.ORBIT360_BRANCH||r.recoveryBaseCommit!==requestParent||requestCommit!==prc.sourceRequestCommit)bad.push('binding');
          if(prc.sourceRun!==30561973750||prc.recoverySkipped!==true||prc.deployExecuted!==false||prc.productionTouched!==false||prc.authorizationConsumedByDeploy!==false||prc.requestImmutable!==true||prc.sameRequestResumeAllowed!==true)bad.push('resume_proof');
          if(r.explicitRecoveryAuthorization!==true||r.authorizationSource!=='user_authorized_m6_final_closure_630_after_membership_access_remediation_20260730'||r.allowedExecutions!==1||r.authorizationConsumed!==false||r.rootCauseClosed!==true)bad.push('authorization');
          if(r.target?.projectId!==process.env.ORBIT360_PRODUCT_PROJECT_ID||r.target?.tenantId!==process.env.ORBIT360_PRODUCT_TENANT_ID||r.target?.liveUrl!==process.env.ORBIT360_PRODUCT_URL)bad.push('target');
          if(r.firestoreDataWrites!==false||r.hostingDeploy!==true||r.firestoreRulesDeploy!==true||r.storageRulesDeploy!==false||r.storageDeferredFailClosed!==true||r.createStorageBucket!==false||r.runtime!==true||r.browser!==true||r.production!==true||r.rollbackOnFailure!==true||r.functionsDeploy!==false||r.main!==false||r.merge!==false||r.polizas!==false)bad.push('scope');
          if(JSON.stringify(r.canonicalMigratedCollections)!==JSON.stringify(['clientes','aseguradoras'])||r.logicalCountryField!=='country'||r.physicalCountryField!=='pais'||r.waitAllActiveCollections!==true||r.semanticInsurerCardClick!==true||r.viewportHitTest!==true||r.reusableBrowserReadiness!==true||r.blockingGateSyntheticProof!==true||r.smokeValidatorContractVersion!=='6.2.0'||r.smokeValidatorRevision!=='20260730.7'||r.membershipAccessBridge!==true||r.advisorSourceOnly!==true||r.advisorMigrationRequired!==false||r.accessRemediationStaticRun!==30559288433||r.accessRemediationStaticArtifact!==8766146164)bad.push('validator_contract');
          if(r.previousRecoveryRun!==30557653576||r.previousRecoveryArtifact!==8765527693||r.previousRecoveryResult!=='ROLLED_BACK_SAFE')bad.push('history');
          if(bad.length)throw new Error('M6_FINAL_CLOSURE_630_REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Repetir preflight canónico 6.3.0 antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="6.3.0" and .executionPhase=="M6_PRODUCT_GO_LIVE_RECOVERY_EXECUTION" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .macroClosure==true and .pipelineResumeAllowed==true and .membershipAccessBridge==true and .advisorSourceOnly==true and .advisorMigrationRequired==false and .reusableBrowserReadiness==true and .blockingGateSyntheticProof==true and .canonicalMigratedCollections==["clientes","aseguradoras"] and .logicalCountryField=="country" and .physicalCountryField=="pais" and .waitAllActiveCollections==true and .semanticInsurerCardClick==true and .viewportHitTest==true and .smokeValidatorContractVersion=="6.2.0" and .smokeValidatorRevision=="20260730.7" and .storageDeferredFailClosed==true and .capabilityProfile.writes==false and .capabilityProfile.rulesDeploy==true and .capabilityProfile.production==true and .secretAccess==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Instalar herramientas después del preflight
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Resolver identidad existente y secreto de smoke
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_EXISTING_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_EXISTING_LOGIN_PASSWORD} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-m6-final-closure-product.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PRODUCT_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_SMOKE_PASSWORD=$ORBIT360_EXISTING_LOGIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Derivar configuración web e identidad de smoke read-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-generate-product-runtime-config-v20260730.mjs
          node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .projectIdentityMatches==true and .webConfigDerivedReadOnly==true and .canonicalMigratedCollectionsOnly==true and .collectionCount==2 and .collections==["clientes","aseguradoras"] and .canonicalCollectionContract=="m4_clients_insurers_only" and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-runtime-config-summary.json" >/dev/null
          jq -e '.ok==true and .eligibleSmokeIdentityCount==1 and .requiredRolesPresent==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-smoke-identity-summary.json" >/dev/null
      - name: Snapshot productivo read-only antes
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-product-data-snapshot-readonly-v20260730.mjs before
          jq -e '.ok==true and .counts.clientes==414 and .counts.aseguradoras==26 and .counts.asesoresFuente==7 and .counts.memberships==1 and .counts.config==1 and .advisorSourceOnly==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-data-before.json" >/dev/null
      - name: Construir shell productivo efímero
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-build-product-shell-v20260730.mjs --apply > "$EVIDENCE_DIR/m6-product-shell-build-summary.json"
          jq -e '.ok==true and .status=="M6_PRODUCT_SHELL_BUILT" and .apply==true and ((.forbiddenPresent|length)==0) and .requiredPresent>=8' "$EVIDENCE_DIR/m6-product-shell-build-summary.json" >/dev/null
      - name: Publicar Firestore Rules read-only + Hosting
        id: firebase_deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/m6-deploy-attempted"
          firebase deploy --only firestore:rules,hosting --project "$ORBIT360_PRODUCT_PROJECT_ID" --config firebase.product-go-live.json --non-interactive --json > "$EVIDENCE_DIR/m6-product-deploy-raw.json"
          jq -e '.status=="success"' "$EVIDENCE_DIR/m6-product-deploy-raw.json" >/dev/null
      - name: Esperar readiness de Hosting con presupuesto acotado
        id: hosting_readiness
        if: steps.firebase_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_HOSTING_READINESS_TIMEOUT_MS=90000 ORBIT360_HOSTING_READINESS_INTERVAL_MS=3000 node tools/orbit360-hosting-readiness-bounded-v20260730.mjs product
          jq -e '.ok==true and .status=="M6_HOSTING_READINESS_PASS" and .mode=="product" and .readOnly==true' "$EVIDENCE_DIR/m6-hosting-readiness-product.json" >/dev/null
      - name: Smoke productivo tres vistas con blocking-gate readiness y Access membership
        id: browser
        if: steps.hosting_readiness.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node tools/orbit360-m6-product-browser-smoke-v20260730.mjs
          jq -e '.ok==true and .contractVersion=="6.2.0" and .validatorRevision=="20260730.7" and .storageDeferredFailClosed==true and .checks.blockingGates==true and .blockingGateSettlement.ok==true and .blockingGateSettlement.remaining==0 and .runtime.ready==true and .runtime.noFallback==true and .runtime.writeEnabled==false and .runtime.clients==414 and .runtime.insurers==26 and .runtime.advisorBound==true and .runtime.physicalCountryFieldAlias=="pais" and .runtime.queryPlansUsePhysicalCountry==true and .runtime.allActiveCollectionsReady==true and .checks.queryAlias==true and .checks.allActiveCollections==true and .checks.writeGuard==true and .checks.insurerSemanticClick==true and .checks.roles==true and .roleViews.desktopDirection.insurers.count==26 and .roleViews.tabletOperativo.insurers.count==26 and .roleViews.mobileAsesor.insurers.count==26 and .roleViews.desktopDirection.insurers.interaction.scrolledIntoView==true and .roleViews.desktopDirection.insurers.interaction.centerInsideViewport==true and .roleViews.desktopDirection.insurers.interaction.centerHit==true and .roleViews.tabletOperativo.insurers.interaction.scrolledIntoView==true and .roleViews.tabletOperativo.insurers.interaction.centerInsideViewport==true and .roleViews.tabletOperativo.insurers.interaction.centerHit==true and .roleViews.mobileAsesor.insurers.interaction.scrolledIntoView==true and .roleViews.mobileAsesor.insurers.interaction.centerInsideViewport==true and .roleViews.mobileAsesor.insurers.interaction.centerHit==true and ((.networkWriteCandidates|length)==0)' "$EVIDENCE_DIR/m6-product-browser-smoke-summary.json" >/dev/null
      - name: Snapshot productivo read-only después
        id: snapshot_after
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node tools/orbit360-m6-product-data-snapshot-readonly-v20260730.mjs after
          jq -e '.ok==true and .advisorSourceOnly==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-data-after.json" >/dev/null
      - name: Verificar integridad exclusiva de datos before/after
        id: data_integrity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='orbit360-platform/runtime-gate-crm-v20260716/';const read=n=>{try{return JSON.parse(fs.readFileSync(p+n,'utf8'))}catch{return null}};const a=read('m6-product-data-before.json'),b=read('m6-product-data-after.json');const keys=['clientes','aseguradoras','asesoresFuente','memberships','config'];const countsStable=keys.every(k=>a&&b&&a.counts&&b.counts&&a.counts[k]===b.counts[k]);const digestsStable=keys.every(k=>a&&b&&a.digests&&b.digests&&a.digests[k]===b.digests[k]);const ok=Boolean(a&&a.ok&&b&&b.ok&&countsStable&&digestsStable);const out={ok,status:ok?'M6_PRODUCT_DATA_INTEGRITY_PASS':'M6_PRODUCT_DATA_INTEGRITY_FAIL',countsStable,digestsStable,advisorSourceOnly:true,storageDeferredFailClosed:true,firestoreWrites:0,operationalWrites:0,containsPII:false,containsSecrets:false};fs.writeFileSync(p+'m6-product-integrity-summary.json',JSON.stringify(out,null,2)+'\n');if(!ok)process.exit(41);
          NODE
      - name: Rollback automático si el bloque no cerró
        id: rollback
        if: always()
        env:
          FIREBASE_DEPLOY_OUTCOME: ${{ steps.firebase_deploy.outcome }}
          READINESS_OUTCOME: ${{ steps.hosting_readiness.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_after.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.data_integrity.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "executed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f "${RUNNER_TEMP}/m6-deploy-attempted" ]; then exit 0; fi
          if [ "$FIREBASE_DEPLOY_OUTCOME" = success ] && [ "$READINESS_OUTCOME" = success ] && [ "$BROWSER_OUTCOME" = success ] && [ "$SNAPSHOT_OUTCOME" = success ] && [ "$INTEGRITY_OUTCOME" = success ]; then exit 0; fi
          echo "executed=true" >> "$GITHUB_OUTPUT"
          firebase deploy --only firestore:rules,hosting --project "$ORBIT360_PRODUCT_PROJECT_ID" --config firebase.product-rollback-safe.json --non-interactive --json > "$EVIDENCE_DIR/m6-product-rollback-raw.json"
          jq -e '.status=="success"' "$EVIDENCE_DIR/m6-product-rollback-raw.json" >/dev/null
          ORBIT360_HOSTING_READINESS_TIMEOUT_MS=90000 ORBIT360_HOSTING_READINESS_INTERVAL_MS=3000 node tools/orbit360-hosting-readiness-bounded-v20260730.mjs rollback
          jq -e '.ok==true and .status=="M6_HOSTING_READINESS_PASS" and .mode=="rollback" and .readOnly==true' "$EVIDENCE_DIR/m6-hosting-readiness-rollback.json" >/dev/null
      - name: Cerrar evidencia M6 Final Closure 6.3.0
        id: close
        if: always()
        env:
          FIREBASE_DEPLOY_OUTCOME: ${{ steps.firebase_deploy.outcome }}
          READINESS_OUTCOME: ${{ steps.hosting_readiness.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_after.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.data_integrity.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_EXECUTED: ${{ steps.rollback.outputs.executed }}
        shell: bash
