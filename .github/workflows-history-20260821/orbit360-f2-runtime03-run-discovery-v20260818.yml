name: Orbit360 F2 Runtime03 Run Discovery 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/f2-runtime03-discovery-20260818.json'
permissions:
  contents: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Discover exact authorized F2 runtime03 run
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
          REQUEST_COMMIT: 809228b1e8d65282f553881b0e2b4dd5e1974e2a
          TARGET_NAME: Orbit360 F2 Productive Acceptance Runtime Browser Readonly 20260818
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${REQUEST_COMMIT}&event=push&per_page=100")"
          COUNT="$(printf '%s' "$JSON" | jq --arg n "$TARGET_NAME" '[.workflow_runs[] | select(.name==$n)] | length')"
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          if [ "$COUNT" = '1' ]; then
            printf '%s' "$JSON" | jq --arg n "$TARGET_NAME" '.workflow_runs[] | select(.name==$n) | {schemaVersion:"orbit360-f2-runtime03-discovery-v1",ok:true,status:"F2_RUNTIME03_RUN_DISCOVERED",classification:"PASS",requestCommit:"809228b1e8d65282f553881b0e2b4dd5e1974e2a",runtimeRunId:.id,runtimeStatus:.status,runtimeConclusion:(.conclusion // null),runAttempt:.run_attempt,event:.event,headSha:.head_sha,workflowName:.name,createdAt:.created_at,updatedAt:.updated_at,multipleRuns:false,containsPII:false,containsSecrets:false}' > orbit360-platform/runtime-gate-crm-v20260716/f2-runtime03-discovery-v20260818.json
          else
            jq -n --argjson count "$COUNT" '{schemaVersion:"orbit360-f2-runtime03-discovery-v1",ok:false,status:(if $count==0 then "F2_RUNTIME03_RUN_NOT_FOUND" else "F2_RUNTIME03_MULTIPLE_RUNS" end),classification:"PIPELINE_MECHANISM_FAILURE",requestCommit:"809228b1e8d65282f553881b0e2b4dd5e1974e2a",matchCount:$count,multipleRuns:($count>1),containsPII:false,containsSecrets:false}' > orbit360-platform/runtime-gate-crm-v20260716/f2-runtime03-discovery-v20260818.json
          fi
          git config user.name 'orbit360-f2-runtime03-discovery-bot'
          git config user.email 'orbit360-f2-runtime03-discovery-bot@users.noreply.github.com'
          git add orbit360-platform/runtime-gate-crm-v20260716/f2-runtime03-discovery-v20260818.json
          git commit -m 'diag(f2): persist exact runtime03 run discovery [skip ci]'
          git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
