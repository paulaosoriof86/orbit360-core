name: Orbit360 Apply F2 Request08 Router Readiness Rootfix 20260819

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - .github/orbit360-requests/f2-request08-router-readiness-rootfix-source-only-v20260819.json

permissions:
  contents: write

jobs:
  apply_rootfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ays/backend-tenant-lab-v99-20260703
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inert source-only request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" = '1'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/orbit360-requests/f2-request08-router-readiness-rootfix-source-only-v20260819.json'
          jq -e '.approved==true and .sourceOnly==true and .browser==false and .runtime==false and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false and .predecessorArtifactId==9385306424 and .request08RunId==32313759752' .github/orbit360-requests/f2-request08-router-readiness-rootfix-source-only-v20260819.json >/dev/null
      - name: Apply exact owner rootfix
        run: node tools/orbit360-apply-f2-request08-router-readiness-rootfix-v20260819.mjs
      - name: Static and behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/router.js
          node --check orbit360-platform/core/product-app-p0.js
          node tools/orbit360-test-f2-router-readiness-rootfix-v20260819.mjs | tee /tmp/f2-router-readiness-regression.json
          jq -e '.ok==true and .status=="PASS_F2_REQUEST08_ROUTER_READINESS_ROOTFIX" and .routerInitIdempotent==true and .activationWaitsForRouter==true and .hostRenderedBeforeReady==true' /tmp/f2-router-readiness-regression.json >/dev/null
          jq -e '.ok==true and .status=="F2_REQUEST08_ROUTER_READINESS_ROOTFIX_APPLIED" and .changedFiles==["orbit360-platform/core/router.js","orbit360-platform/core/product-app-p0.js"] and .firestoreWrites==0 and .authWrites==0 and .dataWrites==0 and .deployExecuted==false and .productionTouched==false' orbit360-platform/runtime-gate-crm-v20260716/f2-request08-router-readiness-rootfix-source-v20260819.json >/dev/null
          git diff --check
      - name: Commit rootfix and source evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orbit360-f2-rootfix-bot'
          git config user.email 'orbit360-f2-rootfix-bot@users.noreply.github.com'
          git add -- orbit360-platform/core/router.js orbit360-platform/core/product-app-p0.js orbit360-platform/runtime-gate-crm-v20260716/f2-request08-router-readiness-rootfix-source-v20260819.json
          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          test "${#STAGED[@]}" = '3'
          test "${STAGED[0]}" = 'orbit360-platform/core/product-app-p0.js'
          test "${STAGED[1]}" = 'orbit360-platform/core/router.js'
          test "${STAGED[2]}" = 'orbit360-platform/runtime-gate-crm-v20260716/f2-request08-router-readiness-rootfix-source-v20260819.json'
          git commit -m 'fix(f2): await router readiness before product app start'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703
