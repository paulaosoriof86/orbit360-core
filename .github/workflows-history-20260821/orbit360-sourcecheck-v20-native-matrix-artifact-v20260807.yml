name: Orbit360 sourcecheck v20 exact matrix artifact gate · historical

on:
  pull_request:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'tools/orbit360-build-v20-route-aware-matrix-artifact-v20260807.mjs'
      - 'tools/orbit360-test-v20-native-matrix-artifact-source-v20260807.mjs'
      - 'tools/orbit360-test-v20-runtime-package-source-v20260807.mjs'
      - '.github/workflows/orbit360-sourcecheck-v20-native-matrix-artifact-v20260807.yml'

permissions:
  contents: read

concurrency:
  group: orbit360-sourcecheck-v20-historical-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  source-v20-historical-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Historical v20 owner boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'V20_SOURCECHECK_HISTORICAL_ONLY_CURRENT_OWNER_V21'
          node --check tools/orbit360-build-v20-route-aware-matrix-artifact-v20260807.mjs
