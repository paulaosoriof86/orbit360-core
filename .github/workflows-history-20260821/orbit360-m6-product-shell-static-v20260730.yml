name: Orbit 360 · M6 product shell static · zero capabilities
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m6-product-shell-static-retry-v20260730.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m6-product-shell-static-v20260730
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block6-go-live-product-v20260730
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  REQUEST_FILE: tools/orbit360-m6-product-shell-static-retry-v20260730.json
  EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
jobs:
  static:
    name: M6 · product shell static preparation · zero capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar segundo request estático inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$REQUEST_FILE"
          parent="$(git rev-parse HEAD^)"
          jq -e --arg p "$parent" '.schemaVersion=="orbit360-m6-product-shell-static-request-v1" and .gateId=="block6-go-live-product-v20260730" and .contractVersion=="6.0.0" and .branch=="ays/backend-tenant-lab-v99-20260703" and .baseCommit==$p and .zeroCapabilities==true and .retryOfRun==30514625372 and .retryReason=="VALIDATOR_STALE_COMMENT_TOKEN_FALSE_POSITIVE" and .productChanged==false and .production==false and .deploy==false and .firestoreRead==false and .writes==false and .containsPII==false and .containsSecrets==false' "$REQUEST_FILE" >/dev/null
      - name: Preflight canónico M6
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="6.0.0" and .executionPhase=="M6_PRODUCT_SHELL_STATIC_PREPARATION" and .failed==0 and .productShellBuilt==true and .rollbackDenyAllReady==true and .productReadonlyRulesReady==true and .productionAuthorizationRequired==true and .secretAccess==false and .firestoreRead==false and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m6-product-shell-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ env.EVIDENCE }}
        with:
          script: |
            const fs=require('fs');let state='failure',description='M6 product shell static failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));if(s.status==='GO_GATE_CONTRACT'&&s.failed===0&&s.productShellBuilt===true){state='success';description='M6 product shell static PASS; production still blocked';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m6-product-shell-static',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
