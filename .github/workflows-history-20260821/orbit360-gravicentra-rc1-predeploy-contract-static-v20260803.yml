name: Orbit 360 · Gravicentra RC1 · contrato predeploy static

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - 'tools/orbit360-validar-gate-contracts-v20260717.mjs'
      - 'tools/orbit360-validar-gate-contracts-engine-gravicentra-rc1-predeploy-readonly-v20260803.mjs'
      - 'tools/orbit360-validator-lifecycle-contract-gravicentra-rc1-predeploy-readonly-v20260803.json'
      - 'tools/orbit360-gravicentra-insurance-rc1-release-seal-v20260803.json'
      - '.github/workflows/orbit360-gravicentra-rc1-predeploy-readonly-v20260803.yml'
      - '.github/workflows/orbit360-gravicentra-rc1-predeploy-contract-static-v20260803.yml'
      - 'orbit360-platform/docs/ROOT-FIX-CONTRATO-PREDEPLOY-RC1-IMPLEMENTACION-20260803.md'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-gravicentra-rc1-predeploy-contract-static-v20260803
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block7-gravicentra-insurance-rc1-predeploy-readonly-v20260803
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  STATUS_CONTEXT: orbit360/gravicentra-rc1-predeploy-contract-static

jobs:
  validate:
    name: Contrato · registro · sello · workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxis y contrato canónico sin capacidades
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-gravicentra-rc1-predeploy-readonly-v20260803.mjs
          node --check tools/orbit360-gravicentra-rc1-predeploy-probe-v20260803.mjs
          unset ORBIT360_REQUEST_FILE || true
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '
            .status=="GO_GATE_CONTRACT" and
            .classification=="GRAVICENTRA_RC1_PREDEPLOY_CONTRACT_STATIC_READY" and
            .contractVersion=="7.12.0" and
            .staticReady==true and
            .requestPresent==false and
            .executionAuthorized==false and
            .secretAccessAuthorized==false and
            .firestoreReadAuthorized==false and
            .writeAuthorized==false and
            .runtimeAuthorized==false and
            .browserAuthorized==false and
            .deployAuthorized==false and
            .rulesDeployAuthorized==false and
            .functionsDeployAuthorized==false and
            .productionAuthorized==false and
            .failed==0 and
            .dataAccess==false and
            .secretAccess==false and
            .firestoreRead==false and
            .firestoreWrites==0 and
            .operationalWrites==0 and
            .runtimeExecuted==false and
            .browserExecuted==false and
            .rulesApplied==false and
            .deployExecuted==false and
            .productionTouched==false
          ' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null

      - name: Validar promoción, sello y workflow futuro
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e '27cb7dfcda8568280ebef15993a953364304f29b^{commit}'
          git cat-file -e '267f7231b46d65b80c167f54567a67503b6a6793^{commit}'
          mapfile -t PRODUCT_DIFF < <(git diff --name-only 267f7231b46d65b80c167f54567a67503b6a6793..27cb7dfcda8568280ebef15993a953364304f29b -- \
            orbit360-platform/index.html \
            orbit360-platform/core \
            orbit360-platform/modules \
            orbit360-platform/styles \
            orbit360-platform/data)
          test "${#PRODUCT_DIFF[@]}" = '1'
          test "${PRODUCT_DIFF[0]}" = 'orbit360-platform/styles/base.css'
          jq -e '.status=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_PASS_CLOSED" and .runtimeEvidence.run==30816576914 and .runtimeEvidence.firestoreWrites==0 and .runtimeEvidence.operationalWrites==0 and .runtimeEvidence.deployExecuted==false and .runtimeEvidence.productionTouched==false' tools/orbit360-validator-lifecycle-contract-gate711-release-critical-runtime-v20260802.json >/dev/null
          jq -e '.status=="STOP_RETRY" and .consumed==true and .allowedExecutions==0' .github/orbit360-requests/canonical-runtime-cumulative-visual-lab-v20260801.json >/dev/null
          jq -e '.status=="CANONICAL_RUNTIME_CUMULATIVE_VISUAL_LAB_STOP_RETRY" and .authorization.consumed==true and .authorization.allowedExecutions==0' tools/orbit360-validator-lifecycle-contract-canonical-runtime-cumulative-visual-lab-v20260801.json >/dev/null
          grep -Fq 'ORBIT360_GATE_ID: block7-gravicentra-insurance-rc1-predeploy-readonly-v20260803' .github/workflows/orbit360-gravicentra-rc1-predeploy-readonly-v20260803.yml
          grep -Fq 'gravicentra-insurance-rc1-predeploy-readonly-resume-v20260803.json' .github/workflows/orbit360-gravicentra-rc1-predeploy-readonly-v20260803.yml
          ! grep -Fq 'ORBIT360_GATE_ID: block7-canonical-runtime-cumulative-visual-lab-v20260801' .github/workflows/orbit360-gravicentra-rc1-predeploy-readonly-v20260803.yml
          jq -n \
            --arg gate "$ORBIT360_GATE_ID" \
            --arg releaseCommit '27cb7dfcda8568280ebef15993a953364304f29b' \
            --arg changed "${PRODUCT_DIFF[0]}" \
            '{schemaVersion:"orbit360-gravicentra-rc1-predeploy-contract-static-evidence-v1",ok:true,status:"GRAVICENTRA_RC1_PREDEPLOY_CONTRACT_STATIC_PASS",classification:"GO_STATIC_PREDEPLOY_CONTRACT_ROOT_FIX",gateId:$gate,contractVersion:"7.12.0",releaseCommit:$releaseCommit,productChangedFiles:[$changed],historicalStopRetryPreserved:true,gate711PassPromoted:true,futureRequestRequired:true,secretAccess:false,firestoreRead:false,firestoreWrites:0,operationalWrites:0,runtimeExecuted:false,browserExecuted:false,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false}' \
            > "$EVIDENCE_DIR/gravicentra-rc1-predeploy-contract-static-v20260803.json"

      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc1-predeploy-contract-static-v20260803.json
        with:
          script: |
            const fs=require('fs');
            let state='failure',description='RC1 predeploy contract static failed';
            try{
              const s=JSON.parse(fs.readFileSync(process.env.SUMMARY,'utf8'));
              if(s.ok===true&&s.status==='GRAVICENTRA_RC1_PREDEPLOY_CONTRACT_STATIC_PASS'){
                state='success';description='RC1 predeploy contract 7.12 static PASS';
              }
            }catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:process.env.STATUS_CONTEXT,description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravicentra-rc1-predeploy-contract-static-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/gravicentra-rc1-predeploy-contract-static-v20260803.json
          if-no-files-found: warn
          retention-days: 30
