name: Orbit360 Post-close Audit Redirection Diagnostic

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-postclose-reconciliation-diagnostic-v20260820.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-audit-redirection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Replicate owner projection and exact redirected audits
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          post() {
            stage="$1"; state="$2"; description="$3"
            payload=$(printf '{"state":"%s","context":"orbit360/redir-%s","description":"%s"}' "$state" "$stage" "$description")
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
          }
          LR=$(node -p "require('./orbit360-platform/docs/orbit360-continuity-ledger-v20260820.json').revision") || exit 21
          PR=$(node -p "require('./orbit360-platform/docs/orbit360-production-reopening-package-v20260820.json').revision") || exit 22
          if node tools/orbit360-continuity-transition-owner-v20260820.mjs --expected-revision "$LR" --expected-package-revision "$PR" --transition POST_CLOSE_RECONCILE_CONTROL_PLANE_METADATA; then post owner success 'owner PASS'; else post owner failure 'owner FAIL'; exit 31; fi
          LR=$((LR+1))
          if node tools/orbit360-continuity-projection-atomic-v20260820.mjs --expected-revision "$LR"; then post projection success 'projection PASS'; else post projection failure 'projection FAIL'; exit 32; fi

          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          COMPOSITE_OUT=orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-composite-v20260820.json
          READBACK_OUT=orbit360-platform/runtime-gate-crm-v20260716/cp10-postclose-reconciled-readback-v20260820.json

          if node tools/orbit360-control-plane-composite-invariant-v20260820.mjs > "$COMPOSITE_OUT"; then post composite-command success 'redirected composite command PASS'; else post composite-command failure 'redirected composite command FAIL'; exit 33; fi
          if node -e "const x=require('./$COMPOSITE_OUT'); if(x.ok!==true||x.status!=='CONTROL_PLANE_COMPOSITE_INVARIANT_PASS') process.exit(1)"; then post composite-json success 'redirected composite JSON PASS'; else post composite-json failure 'redirected composite JSON invalid'; exit 34; fi

          if ORBIT360_CONTROL_PLANE_HEAD="$GITHUB_SHA" node tools/orbit360-control-plane-independent-readback-v20260820.mjs --expected-step CP-11 --expected-package-status CLOSED_PASS > "$READBACK_OUT"; then post readback-command success 'redirected readback command PASS'; else post readback-command failure 'redirected readback command FAIL'; exit 35; fi
          if node -e "const x=require('./$READBACK_OUT'); if(x.ok!==true||x.status!=='CONTROL_PLANE_INDEPENDENT_READBACK_PASS') process.exit(1)"; then post readback-json success 'redirected readback JSON PASS'; else post readback-json failure 'redirected readback JSON invalid'; exit 36; fi

          post diagnostic success 'redirected composite + readback PASS'
