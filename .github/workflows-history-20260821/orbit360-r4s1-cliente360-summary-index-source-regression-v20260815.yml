name: Orbit360 R4S1 Cliente360 Summary Index Source Regression 20260815

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/workflows/orbit360-r4s1-cliente360-summary-index-source-regression-v20260815.yml'

permissions:
  contents: read

env:
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical source gate
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs fase-a-ops-leads-crm-release-lab-v20260812
          jq -e '.ok==true and .secretAccessAuthorized==false and .writesAuthorized==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Build candidate in memory and compare current vs candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r4s1-c360" "$EVIDENCE_DIR"
          node <<'NODE'
          const fs=require('fs'), vm=require('vm'), path=require('path');
          const queriesPath='orbit360-platform/core/queries.js';
          const ownerPath='orbit360-platform/modules/policy-receipts-v1199-detail-guard.js';
          const clientPath='orbit360-platform/modules/cliente360.js';
          const storePath='orbit360-platform/data/store-firestore-product-readonly-p0.js';
          const oldEvidencePath='orbit360-platform/runtime-gate-crm-v20260716/v19-cliente360-bounded-render-source-sanitized-v20260807.json';
          const queries=fs.readFileSync(queriesPath,'utf8');
          const owner=fs.readFileSync(ownerPath,'utf8');
          const client=fs.readFileSync(clientPath,'utf8');
          const storeSource=fs.readFileSync(storePath,'utf8');
          const oldEvidence=JSON.parse(fs.readFileSync(oldEvidencePath,'utf8'));

          function count(hay,needle){return hay.split(needle).length-1;}
          if(count(client,'q.clientesResumenIndex ? q.clientesResumenIndex() : null')!==1) throw new Error('CLIENTE360_SUMMARY_INDEX_CALLSITE_NOT_EXACT');
          if(count(owner,'q.clientesResumenIndex = function')!==0) throw new Error('CURRENT_OWNER_ALREADY_DEFINES_INDEX');
          if(!/function get\(collection, id\)\s*\{\s*return all\(collection\)\.find/.test(storeSource)) throw new Error('PRODUCT_STORE_GET_CLONE_CONTRACT_DRIFT');
          if(oldEvidence.fixture.summaryIndexCalls!==1 || oldEvidence.fixture.fallbackSummaryCalls!==0) throw new Error('V19_FIXTURE_EXPECTATION_DRIFT');

          let candidate=owner;
          const rebuildOld=`    const policies = (S().all('polizas') || []).map(policyVisual);\n    const vehicles = (S().all('vehiculos') || []).map(vehicleVisual);\n    indexes = {\n      policies, vehicles,`;
          const rebuildNew=`    const clients = S().all('clientes') || [];\n    const policies = (S().all('polizas') || []).map(policyVisual);\n    const vehicles = (S().all('vehiculos') || []).map(vehicleVisual);\n    indexes = {\n      clients, clientsById: new Map(clients.filter(row => row && row.id).map(row => [row.id, row])),\n      policies, vehicles,`;
          if(count(candidate,rebuildOld)!==1) throw new Error('CANDIDATE_REBUILD_ANCHOR_INVALID');
          candidate=candidate.replace(rebuildOld,rebuildNew);
          const rawOld=`      const rawCli = S().get('clientes', clientId);`;
          const rawNew=`      const rawCli = (I.clientsById && I.clientsById.get(clientId)) || S().get('clientes', clientId);`;
          if(count(candidate,rawOld)!==1) throw new Error('CANDIDATE_CLIENT_GET_ANCHOR_INVALID');
          candidate=candidate.replace(rawOld,rawNew);
          const exportOld=`    q.__clientSummaryV1199c = { original: originalClientSummary, indexed: true };`;
          const exportNew=`    q.clientesResumenIndex = function () {\n      const I = idx();\n      const clients = (I && I.clients) || [];\n      clients.forEach(rawCli => {\n        const clientId = rawCli && rawCli.id;\n        if (clientId && !summaries.has(clientId)) q.clienteResumen(clientId);\n      });\n      return new Map(summaries);\n    };\n    q.__clientSummaryV1199c = { original: originalClientSummary, indexed: true, indexedAll: true };`;
          if(count(candidate,exportOld)!==1) throw new Error('CANDIDATE_EXPORT_ANCHOR_INVALID');
          candidate=candidate.replace(exportOld,exportNew);
          if(count(candidate,'q.clientesResumenIndex = function')!==1) throw new Error('CANDIDATE_INDEX_NOT_BOUND_ONCE');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/r4s1-c360/policy-receipts-v1199-detail-guard.candidate.js',candidate);
          new vm.Script(candidate,{filename:'candidate-owner.js'});

          const CLIENTS=430, POLICIES=1375;
          const data={clientes:[],asesores:[],polizas:[],vehiculos:[],cobros:[],comisiones:[],recibosEsperados:[]};
          for(let i=0;i<CLIENTS;i++) data.clientes.push({id:`cli_${i}`,nombre:`Cliente ${i}`,email:`c${i}@example.invalid`,identificacion:`ID${i}`,pais:i%7===0?'CO':'GT',moneda:i%7===0?'COP':'GTQ',tipo:i%5===0?'Empresa':'Persona',ciudad:'Ciudad',segmento:i%9===0?'Premium':'Estándar',asesorId:`ase_${i%7}`});
          for(let i=0;i<7;i++) data.asesores.push({id:`ase_${i}`,nombre:`Asesor ${i}`,color:'#999'});
          for(let i=0;i<POLICIES;i++){const cid=`cli_${i%CLIENTS}`; data.polizas.push({id:`pol_${i}`,clienteId:cid,asesorId:`ase_${i%7}`,estado:i%6===0?'Por renovar':'Vigente',prima:1000+(i%100),primaTotal:1000+(i%100),primaNeta:900+(i%100),moneda:(i%CLIENTS)%7===0?'COP':'GTQ'});}
          for(let i=0;i<CLIENTS*2;i++){const cid=`cli_${i%CLIENTS}`;data.cobros.push({id:`cob_${i}`,clienteId:cid,estado:i%11===0?'Vencido':i%3===0?'Pagado':'Pendiente',monto:100+(i%50)});}
          for(let i=0;i<CLIENTS;i++){const cid=`cli_${i}`;data.comisiones.push({id:`com_${i}`,clienteId:cid,monto:25+(i%7)});}
          for(let i=0;i<120;i++) data.vehiculos.push({id:`veh_${i}`,clienteId:`cli_${i%CLIENTS}`,polizaId:`pol_${i}`,marca:'Marca',modelo:'Modelo'});

          function makeStore(seed){
            const metrics={allCalls:{},getCalls:{},whereCalls:{},findCalls:{},cloneRows:{},writes:0};
            const clone=v=>JSON.parse(JSON.stringify(v));
            const store={
              all(c){metrics.allCalls[c]=(metrics.allCalls[c]||0)+1;const rows=seed[c]||[];metrics.cloneRows[c]=(metrics.cloneRows[c]||0)+rows.length;return rows.map(clone);},
              get(c,id){metrics.getCalls[c]=(metrics.getCalls[c]||0)+1;return store.all(c).find(r=>(r.id||r.uid||r.codigo||r.numero||r.key)===id)||null;},
              where(c,p){metrics.whereCalls[c]=(metrics.whereCalls[c]||0)+1;return store.all(c).filter(p);},
              find(c,p){metrics.findCalls[c]=(metrics.findCalls[c]||0)+1;return store.all(c).find(p);},
              insert(){metrics.writes++;throw new Error('WRITE_FORBIDDEN_FIXTURE');}, update(){metrics.writes++;throw new Error('WRITE_FORBIDDEN_FIXTURE');}, remove(){metrics.writes++;throw new Error('WRITE_FORBIDDEN_FIXTURE');}
            }; return {store,metrics};
          }
          function sandboxFor(ownerSource){
            const {store,metrics}=makeStore(data);
            const sandbox={console,setTimeout:()=>0,clearTimeout:()=>{},performance:{now:()=>Date.now()},Map,Set,Date,Math,JSON,Object,Array,String,Number,Boolean,RegExp};
            sandbox.window=sandbox; sandbox.globalThis=sandbox;
            sandbox.addEventListener=()=>{};
            sandbox.document={addEventListener:()=>{},getElementById:()=>null,head:{appendChild:()=>{}},createElement:()=>({dataset:{},style:{},set textContent(v){this._text=v},get textContent(){return this._text||''},addEventListener:()=>{},querySelectorAll:()=>[]})};
            sandbox.Orbit={store,ui:{},modules:{},route:{params:{}},clientProjection:null};
            vm.createContext(sandbox);
            new vm.Script(queries,{filename:'queries.js'}).runInContext(sandbox);
            new vm.Script(ownerSource,{filename:'owner.js'}).runInContext(sandbox);
            return {sandbox,metrics};
          }
          function normalizeSummary(r){return {id:r&&r.cli&&r.cli.id,moneda:r&&r.moneda,nPolizas:r&&r.nPolizas,nVigentes:r&&r.nVigentes,primaAnual:r&&r.primaAnual,cobrado:r&&r.cobrado,pendiente:r&&r.pendiente,vencido:r&&r.vencido,comisionGen:r&&r.comisionGen,porRenovar:r&&r.porRenovar,salud:r&&r.salud};}
          function runCase(ownerSource){
            const {sandbox,metrics}=sandboxFor(ownerSource), q=sandbox.Orbit.q, S=sandbox.Orbit.store;
            const clients=S.all('clientes');
            let summaryIndexCalls=0,fallbackSummaryCalls=0;
            let summaryIndex=null;
            if(typeof q.clientesResumenIndex==='function'){summaryIndexCalls++;summaryIndex=q.clientesResumenIndex();}
            const resumenDe=c=>{if(summaryIndex&&typeof summaryIndex.get==='function'&&summaryIndex.get(c.id)) return summaryIndex.get(c.id);fallbackSummaryCalls++;return q.clienteResumen(c.id);};
            const totPrima=clients.reduce((s,c)=>{const r=resumenDe(c);return s+(r.moneda==='COP'?r.primaAnual/1000:r.primaAnual);},0);
            const first40=clients.slice(0,40).map(c=>normalizeSummary(resumenDe(c)));
            return {metrics,summaryIndexCalls,fallbackSummaryCalls,totPrima,first40};
          }
          const baseline=runCase(owner), applied=runCase(candidate);
          const semanticEqual=JSON.stringify({totPrima:baseline.totPrima,first40:baseline.first40})===JSON.stringify({totPrima:applied.totPrima,first40:applied.first40});
          const baselineClientGets=baseline.metrics.getCalls.clientes||0;
          const appliedClientGets=applied.metrics.getCalls.clientes||0;
          const baselineClientCloneRows=baseline.metrics.cloneRows.clientes||0;
          const appliedClientCloneRows=applied.metrics.cloneRows.clientes||0;
          const cloneReduction=baselineClientCloneRows-appliedClientCloneRows;
          const checks={
            gateConcept:true,
            currentCallsiteExpectsIndex:true,
            currentOwnerMissingIndex:true,
            v19FixtureClaimedIndex:true,
            validatorStaleProven:true,
            candidateSyntax:true,
            candidateIndexBoundOnce:count(candidate,'q.clientesResumenIndex = function')===1,
            semanticEqual,
            baselineFallbackObserved:baseline.fallbackSummaryCalls>=430,
            appliedSummaryIndexOnce:applied.summaryIndexCalls===1,
            appliedFallbackZero:applied.fallbackSummaryCalls===0,
            baselineClientGetsHigh:baselineClientGets>=430,
            appliedClientGetsZero:appliedClientGets===0,
            clientCloneRowsReduced:cloneReduction>=180000,
            writesZero:baseline.metrics.writes===0&&applied.metrics.writes===0
          };
          const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
          const evidence={
            schemaVersion:'orbit360-r4s1-cliente360-summary-index-source-regression-v1',
            generatedAt:new Date().toISOString(),
            status:failed.length?'FAIL':'PASS_R4S1_CLIENTE360_SUMMARY_INDEX_SOURCE_REGRESSION',
            classification:failed.length?'PIPELINE_MECHANISM_FAILURE':'FUNCTIONAL_DEFECT_ROOTFIX_CANDIDATE_SOURCE_PASS',
            rootCause:'CLIENTE360_EXPECTED_SUMMARY_INDEX_MISSING_CAUSES_PER_CLIENT_PRODUCT_STORE_GET_AND_NX_COLLECTION_CLONE',
            staleValidator:{classification:'VALIDATOR_STALE',source:'v19-cliente360-bounded-render-source-sanitized-v20260807.json',claimedSummaryIndexCalls:oldEvidence.fixture.summaryIndexCalls,claimedFallbackSummaryCalls:oldEvidence.fixture.fallbackSummaryCalls,actualIndexDefinitionCount:count(owner,'q.clientesResumenIndex = function')},
            fixture:{clients:CLIENTS,policies:POLICIES,visibleRows:40},
            baseline:{summaryIndexCalls:baseline.summaryIndexCalls,fallbackSummaryCalls:baseline.fallbackSummaryCalls,clientGetCalls:baselineClientGets,clientCloneRows:baselineClientCloneRows,allCalls:baseline.metrics.allCalls,cloneRows:baseline.metrics.cloneRows,totPrima:baseline.totPrima},
            candidate:{summaryIndexCalls:applied.summaryIndexCalls,fallbackSummaryCalls:applied.fallbackSummaryCalls,clientGetCalls:appliedClientGets,clientCloneRows:appliedClientCloneRows,allCalls:applied.metrics.allCalls,cloneRows:applied.metrics.cloneRows,totPrima:applied.totPrima},
            reduction:{clientCloneRows:cloneReduction,ratio:appliedClientCloneRows?baselineClientCloneRows/appliedClientCloneRows:null},
            semanticEqual,checks,failedCheckIds:failed,
            sourceFilesChanged:0,candidateArtifactOnly:true,browserExecuted:false,secretAccess:false,dataAccess:false,firestoreWrites:0,authWrites:0,operationalWrites:0,deployExecuted:false,productionTouched:false,containsPII:false,containsSecrets:false,ok:failed.length===0
          };
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/r4s1-cliente360-summary-index-source-regression-v20260815.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          if(failed.length) process.exit(1);
          NODE
          jq -e '.ok==true and .semanticEqual==true and .staleValidator.classification=="VALIDATOR_STALE" and .baseline.clientGetCalls>=430 and .candidate.clientGetCalls==0 and .candidate.summaryIndexCalls==1 and .candidate.fallbackSummaryCalls==0 and .reduction.clientCloneRows>=180000 and .browserExecuted==false and .secretAccess==false and .dataAccess==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/r4s1-cliente360-summary-index-source-regression-v20260815.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit360-r4s1-cliente360-summary-index-source-regression-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/r4s1-cliente360-summary-index-source-regression-v20260815.json
            ${{ runner.temp }}/r4s1-c360/policy-receipts-v1199-detail-guard.candidate.js
          if-no-files-found: warn
          retention-days: 14
