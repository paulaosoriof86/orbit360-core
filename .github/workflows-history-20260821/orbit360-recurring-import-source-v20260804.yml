name: Orbit 360 Recurring Import Source

on:
  workflow_dispatch:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'functions/recurring-insurance-import.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - 'orbit360-platform/core/recurring-insurance-import-client.js'
      - 'orbit360-platform/core/recurring-insurance-document-extractor.js'
      - 'orbit360-platform/modules/importar-recurring-bridge-v20260804.js'
      - 'orbit360-platform/core/backend-lab-init.js'
      - 'orbit360-platform/docs/PAQUETE-ACUMULADO-CLAUDE-ORBIT360-20260804-V2.md'
      - 'tools/orbit360-recurring-import-contract-v20260804.mjs'
      - 'tools/orbit360-validar-recurring-import-source-v20260804.mjs'
      - '.github/workflows/orbit360-recurring-import-source-v20260804.yml'

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Functions syntax
        working-directory: functions
        run: npm run check
      - name: Frontend source syntax
        run: |
          node --check orbit360-platform/core/recurring-insurance-import-client.js
          node --check orbit360-platform/core/recurring-insurance-document-extractor.js
          node --check orbit360-platform/modules/importar-recurring-bridge-v20260804.js
          node --check orbit360-platform/core/backend-lab-init.js
      - name: Recurring import contracts
        run: node tools/orbit360-validar-recurring-import-source-v20260804.mjs .
