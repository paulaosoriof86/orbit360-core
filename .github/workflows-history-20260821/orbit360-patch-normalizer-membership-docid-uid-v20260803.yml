name: Orbit 360 · normalizador membership documentId UID

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/patch-normalizer-membership-docid-uid-v20260803.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: orbit360-patch-normalizer-membership-docid-uid-v20260803
  cancel-in-progress: false

env:
  REQUEST: .github/orbit360-requests/patch-normalizer-membership-docid-uid-v20260803.json
  STATUS_CONTEXT: orbit360/patch-normalizer-docid-uid

jobs:
  patch:
    name: Membership · documentId UID · source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout request exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar frontera
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status=="AUTHORIZED_SOURCE_ONLY" and .secrets==false and .firestoreRead==false and .writes==false and .deploy==false and .production==false and .consumed==false' "$REQUEST" >/dev/null
          node --check tools/orbit360-patch-normalizer-membership-docid-uid-v20260803.mjs

      - name: Aplicar y validar
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-patch-normalizer-membership-docid-uid-v20260803.mjs
          node --check tools/orbit360-normalizar-membership-direccion-rc12-v20260803.mjs
          grep -F 'membership_document_id_uid_mismatch' tools/orbit360-normalizar-membership-direccion-rc12-v20260803.mjs
          git diff --check

      - name: Persistir
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/orbit360-normalizar-membership-direccion-rc12-v20260803.mjs
          git commit -m 'membership: validar vínculo documentId UID'
          git push origin HEAD:ays/backend-tenant-lab-v99-20260703

      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'${{ job.status }}'==='success'?'success':'failure',context:process.env.STATUS_CONTEXT,description:'${{ job.status }}'==='success'?'Membership documentId UID · PASS':'Membership documentId UID · FAIL',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
