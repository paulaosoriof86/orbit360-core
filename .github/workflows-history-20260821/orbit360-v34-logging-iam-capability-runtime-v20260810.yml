name: Orbit360 v34 logging IAM capability read-only runtime
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/block1-client360-insurers-v34-logging-iam-capability-authorization.json'
      - '.github/workflows/orbit360-v34-logging-iam-capability-runtime-v20260810.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-v34-logging-iam-capability-runtime-v20260810
  cancel-in-progress: false
env:
  REQUEST_FILE: .github/orbit360-requests/block1-client360-insurers-v34-logging-iam-capability-authorization.json
  REQUEST_VERSION: 20260810.34-logging-iam-capability-readonly
  EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/v34-logging-iam-capability-sanitized-v20260810.json
jobs:
  runtime:
    if: "${{ github.event.head_commit.message == 'v34 runtime: authorize one IAM logging capability check' || github.event.head_commit.message == 'v34 runtime repair pre-execution trigger' }}"
    name: v34 · testIamPermissions · read-only once
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable request and parent binding before capabilities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          SUBJECT="$(git show -s --format=%s HEAD)"
          if [ "$SUBJECT" = "v34 runtime: authorize one IAM logging capability check" ]; then
            AUTH_COMMIT="$(git rev-parse HEAD)"
          elif [ "$SUBJECT" = "v34 runtime repair pre-execution trigger" ]; then
            test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1
            test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/orbit360-v34-logging-iam-capability-runtime-v20260810.yml"
            AUTH_COMMIT="$(git rev-parse HEAD^)"
            test "$(git show -s --format=%s "$AUTH_COMMIT")" = "v34 runtime: authorize one IAM logging capability check"
            git diff --quiet "$AUTH_COMMIT" HEAD -- "$REQUEST_FILE"
          else
            echo "STOP_V34_UNAUTHORIZED_TRIGGER"
            exit 41
          fi
          test "$(git diff --name-only "$AUTH_COMMIT^" "$AUTH_COMMIT" | wc -l)" -eq 1
          test "$(git diff --name-only "$AUTH_COMMIT^" "$AUTH_COMMIT")" = "$REQUEST_FILE"
          PARENT="$(git rev-parse "$AUTH_COMMIT^")"
          jq -e --arg p "$PARENT" --arg v "$REQUEST_VERSION" '.schemaVersion=="orbit360-runtime-request-v1" and .authorizationGeneration=="v34-logging-iam-capability-runtime" and .gateId=="block1-client360-insurers-lab-v20260717" and .contractVersion=="1.0.41" and .requestVersion==$v and .status=="AUTHORIZED_ONCE" and .approved==true and .allowedExecutions==1 and .consumed==false and .authorizationFrozen==false and .replayAllowed==false and .parentHead==$p and .authorizedBaseHead==$p and .operation=="LOGGING_IAM_TEST_PERMISSIONS_READONLY" and .permissions==["logging.logEntries.list","logging.privateLogEntries.list"] and .networkOperationsMaximum==1 and .firestoreReadsAuthorized==0 and .authReadsAuthorized==0 and .auditLogReadsAuthorized==0 and .iamPolicyBindingReadsAuthorized==0 and .iamWritesAuthorized==0 and .operationalWritesAuthorized==0 and .hostingAuthorized==false and .browserAuthorized==false and .productionAuthorized==false and .mainAuthorized==false and .mergeAuthorized==false and .authorizedByUser==true and .containsPII==false and .containsSecrets==false' "$REQUEST_FILE" >/dev/null
          echo "ORBIT360_EXPECTED_PARENT_HEAD=$PARENT" >> "$GITHUB_ENV"
      - name: Canonical Block1 gate before any secret
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_GATE_PROFILE=v33-two-client-cloud-audit \
          ORBIT360_EXPECTED_REQUEST_VERSION=NONE_PENDING_FRESH_AUTHORIZATION \
            node tools/orbit360-validar-gate-contracts-v20260717.mjs block1-client360-insurers-lab-v20260717
          jq -e '.status=="PASS_GATE_CONTRACT_SOURCE_V33" and .failed==0 and .executionAuthorized==false and .secretAccessAuthorized==false and .writesAuthorized==0 and .secretAccess==false and .firestoreRead==false and .runtimeExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: v34 GO gate before secret materialization
        shell: bash
        run: |
          set -euo pipefail
          ORBIT360_REQUEST_FILE="$REQUEST_FILE" \
          ORBIT360_EXPECTED_REQUEST_VERSION="$REQUEST_VERSION" \
          ORBIT360_EXPECTED_PARENT_HEAD="$ORBIT360_EXPECTED_PARENT_HEAD" \
            node tools/orbit360-validar-gate-contracts-engine-block1-logging-iam-capability-runtime-v34-v20260810.mjs
          jq -e '.status=="GO_GATE_CONTRACT_RUNTIME_V34" and .failed==0 and .executionAuthorized==true and .secretAccessAuthorized==true and .networkOperationsMaximum==1 and .firestoreReadAuthorized==false and .authReadAuthorized==false and .auditLogReadAuthorized==false and .iamPolicyBindingReadAuthorized==false and .iamWriteAuthorized==false and .writesAuthorized==0 and .secretAccess==false and .runtimeExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Zero-write and no-data-read boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs','utf8');
          const forbidden=[/setIamPolicy/i,/add-iam-policy-binding/i,/logging\.googleapis\.com\/v2\/entries:list/i,/firebase-admin/i,/\.firestore\s*\(/i,/playwright/i,/firebase\s+deploy/i];
          const hit=forbidden.find(re=>re.test(s));
          if(hit) throw new Error(`V34_FORBIDDEN_OPERATIONAL_API:${hit}`);
          if(!s.includes(':testIamPermissions')) throw new Error('V34_TEST_IAM_PERMISSIONS_MISSING');
          NODE
      - name: Prepare isolated dependency
        shell: bash
        run: npm install --no-save --ignore-scripts google-auth-library@9.15.1 >/dev/null 2>&1
      - name: Execute exactly one testIamPermissions diagnostic
        id: diagnostic
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$EVIDENCE")"
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          CODE=0
          if [ -z "$SERVICE_ACCOUNT" ]; then
            jq -n '{schemaVersion:"orbit360-v34-logging-iam-capability-diagnostic-v1",projectIdClass:"EXPECTED_LAB_PROJECT",permissionCount:2,loggingLogEntriesList:false,loggingPrivateLogEntriesList:false,iamPolicyBindingsRead:false,auditLogEntriesRead:false,targetClientDataRead:false,iamWrites:0,operationalWrites:0,firestoreReads:0,firestoreWrites:0,authReads:0,authWrites:0,rawPrincipalPersisted:false,credentialsPersisted:false,containsPII:false,containsSecrets:false,decision:"STOP_RETRY",classification:"ENVIRONMENT_FAILURE",rootCause:"SERVICE_ACCOUNT_SECRET_UNAVAILABLE",ok:false}' > "$EVIDENCE"
            CODE=42
          else
            SA_FILE="$RUNNER_TEMP/v34-sa.json"
            printf '%s' "$SERVICE_ACCOUNT" > "$SA_FILE"
            chmod 600 "$SA_FILE"
            PROJECT_ID="$(jq -r '.project_id // empty' "$SA_FILE")"
            if [ "$PROJECT_ID" != "ays-orbit-360-lab" ]; then
              jq -n '{schemaVersion:"orbit360-v34-logging-iam-capability-diagnostic-v1",projectIdClass:"MISMATCH",permissionCount:2,loggingLogEntriesList:false,loggingPrivateLogEntriesList:false,iamPolicyBindingsRead:false,auditLogEntriesRead:false,targetClientDataRead:false,iamWrites:0,operationalWrites:0,firestoreReads:0,firestoreWrites:0,authReads:0,authWrites:0,rawPrincipalPersisted:false,credentialsPersisted:false,containsPII:false,containsSecrets:false,decision:"STOP_RETRY",classification:"SECURITY_FAILURE",rootCause:"PROJECT_ID_MISMATCH",ok:false}' > "$EVIDENCE"
              CODE=42
            else
              GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE" ORBIT360_PROJECT_ID=ays-orbit-360-lab ORBIT360_V34_EVIDENCE="$EVIDENCE" node tools/orbit360-diagnose-logging-iam-capability-v34-v20260810.mjs
              CODE=$?
            fi
            rm -f "$SA_FILE"
          fi
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify sanitized evidence and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EVIDENCE"
          jq -e '.permissionCount==2 and .iamPolicyBindingsRead==false and .auditLogEntriesRead==false and .targetClientDataRead==false and .iamWrites==0 and .operationalWrites==0 and .firestoreReads==0 and .firestoreWrites==0 and .authReads==0 and .authWrites==0 and .rawPrincipalPersisted==false and .credentialsPersisted==false and .containsPII==false and .containsSecrets==false' "$EVIDENCE" >/dev/null
      - name: Publish observable diagnostic status
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE_FILE: orbit360-platform/runtime-gate-crm-v20260716/v34-logging-iam-capability-sanitized-v20260810.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='v34 IAM Logging diagnostic stopped safely';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));if(p.ok===true&&(p.decision==='IAM_LOGGING_CAPABILITY_PRESENT'||p.decision==='IAM_LOGGING_CAPABILITY_GAP')&&p.iamWrites===0){state='success';description=p.decision==='IAM_LOGGING_CAPABILITY_PRESENT'?'v34: both Logging permissions effective':'v34: required Logging permission gap identified';}else if(p.rootCause){description=`v34: ${p.classification} / ${p.rootCause}`.slice(0,140);}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/v34-logging-iam-runtime',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-v34-logging-iam-runtime-${{ github.run_id }}
          path: orbit360-platform/runtime-gate-crm-v20260716/v34-logging-iam-capability-sanitized-v20260810.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce completed diagnostic without retry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EVIDENCE"
          jq -e '.ok==true and (.decision=="IAM_LOGGING_CAPABILITY_PRESENT" or .decision=="IAM_LOGGING_CAPABILITY_GAP") and .iamWrites==0' "$EVIDENCE" >/dev/null
