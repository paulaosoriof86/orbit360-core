        shell: bash
        run: |
          set -euo pipefail
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          cat > orbit360-platform/runtime-gate-crm-v20260716/f1-4c-validator-stale-rootfix-source-only-v20260818.json <<'JSON'
