      - name: Validate corrected evidence contract source-only
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=tools/orbit360-validar-gate-contracts-engine-f1-4c-successor-artifact-build-v20260818.mjs
          EVID=orbit360-platform/runtime-gate-crm-v20260716/f1-3-membership-email-ownership-source-only-v20260818.json
          node --check "$ENGINE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const f=JSON.parse(fs.readFileSync('orbit360-platform/runtime-gate-crm-v20260716/f1-3-membership-email-ownership-source-only-v20260818.json','utf8'));
          const a=f.assertions||{}, s=f.sample||{};
          const ok=f.ok===true && f.status==='F1_3_MEMBERSHIP_EMAIL_OWNERSHIP_SOURCE_ONLY_PASS' &&
            Array.isArray(f.failed)&&f.failed.length===0 && Array.isArray(f.staticViolations)&&f.staticViolations.length===0 &&
