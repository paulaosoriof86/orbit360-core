            a.mismatchedMembershipEmailBlocked===true && s.emailOptional===true && s.emailIdentityOwner==='auth' &&
            s.writeAuthorized===false && s.writeExecuted===false;
          if(!ok) throw new Error('F1_3_CANONICAL_EVIDENCE_SCHEMA_NOT_PASS');
          NODE
          grep -F "const s=f13&&f13.sample||{};" "$ENGINE" >/dev/null
          grep -F "a.optionalMembershipEmail===true" "$ENGINE" >/dev/null
          grep -F "s.emailOptional===true" "$ENGINE" >/dev/null
          grep -F "s.emailIdentityOwner==='auth'" "$ENGINE" >/dev/null
          grep -F "f13.failed.length===0" "$ENGINE" >/dev/null
          grep -F "f13.staticViolations.length===0" "$ENGINE" >/dev/null
          test -f orbit360-platform/runtime-gate-crm-v20260716/f1-4c-build-observer-diagnostic-v20260818.json
          jq -e '.matchingRunCount==1 and .runId=="32193519205" and .runConclusion=="failure" and .artifactCount==0 and .rerunExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/f1-4c-build-observer-diagnostic-v20260818.json >/dev/null
