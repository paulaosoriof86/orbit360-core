name: Orbit 360 · M5 post-Access RC readiness · 5_0_3
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths: ['tools/orbit360-m5-post-access-readiness-request-v20260728.json']
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-m5-post-access-readiness
  cancel-in-progress: false
env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m5-post-access-readiness-request-v20260728.json
jobs:
  readiness:
    name: M5 · Post-Access RC readiness · no deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2, persist-credentials: false}
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validar solicitud inmutable sin acceso externo
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${ORBIT360_BRANCH}"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),bad=[];
          if(r.schemaVersion!=='orbit360-m5-release-candidate-readiness-request-v3'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='5.0.3'||r.branch!==process.env.ORBIT360_BRANCH)bad.push('schema_scope');
          if(r.authorizedBaseCommit!==parent||r.explicitAuthorization!==true||r.allowedExecutions!==1||r.readinessStatic!==true||r.accessBoundaryClosed!==true||r.remoteLabIntegrityRead!==true)bad.push('binding_authorization');
          if(r.secrets!==false||r.firestoreRead!==false||r.browser!==false||r.deploy!==false||r.operationalWrites!==false||r.production!==false||r.policies!==false||r.mergeMain!==false)bad.push('capabilities');
          if(r.expectedCriticalAssets!==41||r.expectedRemoteAssets!==24)bad.push('asset_budget');
          if(r.containsPII!==false||r.containsSecrets!==false)bad.push('sanitization');if(bad.length)throw new Error('REQUEST_INVALID:'+bad.join(','));
          NODE
      - name: Preflight canónico post-Access
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "${ORBIT360_GATE_ID}"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.3" and .failed==0 and .executionAuthorized==true and .allowedExecutions==1 and .activationMode=="immutable_request_present" and .secretAccess==false and .firestoreRead==false and .browserExecuted==false and .operationalWrites==0 and .deployExecuted==false' orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json >/dev/null
      - name: Probar contrato post-Access
        run: node tools/orbit360-m5-post-access-readiness-contract-v20260728.cjs
      - name: Recalcular RC y comparar LAB
        run: node tools/orbit360-m5-release-candidate-readiness-v20260728.mjs
      - name: Validar evidencia sanitizada
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and (.status=="M5_RC_READY_FOR_RUNTIME_SMOKE" or .status=="M5_RC_READY_LAB_DELIVERY_REQUIRED") and .prerequisites.accessBoundaryClosed==true and .dataBaseline.sourceClients==414 and .dataBaseline.sourceInsurers==26 and .dataBaseline.canonicalTargetConfig==1 and .dataBaseline.canonicalTargetMemberships==1 and .dataBaseline.canonicalTargetClients==414 and .dataBaseline.canonicalTargetInsurers==26 and .releaseCandidate.allCriticalAssetsPresent==true and .releaseCandidate.criticalAssetCount==41 and .releaseCandidate.accessOwnerBound==true and .remoteLab.assetsExpected==24 and .remoteLab.assetsChecked==24 and ((.remoteLab.remoteParity==true and .remoteLab.assetsMatched==24 and .approvalReadyForRuntimeSmoke==true and .approvalReadyForLabDelivery==false) or (.remoteLab.remoteParity==false and .remoteLab.mismatchCount>0 and .approvalReadyForRuntimeSmoke==false and .approvalReadyForLabDelivery==true)) and .writes.operationalWrites==0 and .deploy==false and .browser==false and .containsPII==false and .containsSecrets==false' orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-post-access-readiness-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-post-access-readiness-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-manifest.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json
          retention-days: 30
      - name: Publicar estado observable sanitizado
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          summary='orbit360-platform/runtime-gate-crm-v20260716/m5-release-candidate-readiness-summary.json'; state=failure; description='M5 post-Access readiness failed'
          if [ -f "$summary" ] && [ "$(jq -r '.ok // false' "$summary")" = true ]; then state=success; description="$(jq -r '.status' "$summary")"; fi
          payload="$(jq -n --arg state "$state" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"orbit360/m5-post-access-readiness"}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload"
