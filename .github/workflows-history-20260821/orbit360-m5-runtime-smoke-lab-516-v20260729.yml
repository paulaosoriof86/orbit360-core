name: Orbit 360 · M5 runtime smoke LAB · RC ae6bb2a3 · jq safe
run-name: M5 5.0.16 · runtime smoke exact RC · ${{ github.sha }}

on:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - '.github/workflows/orbit360-m5-runtime-smoke-lab-516-v20260729.yml'
      - 'tools/orbit360-m5-runtime-smoke-516-request-v20260729.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-m5-runtime-smoke-lab-516-v20260729
  cancel-in-progress: false

env:
  ORBIT360_GATE_ID: block5-release-candidate-visualization-v20260728
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: tools/orbit360-m5-runtime-smoke-516-request-v20260729.json
  EXPECTED_RC_HASH: ae6bb2a35ce4f03c0353d670218c841e51b57a2461a3ba9e741d8bd7a973fd61
  EXPECTED_FIREBASE_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PREVIEW_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_EXPECTED_RUNTIME: 20260717-2
  ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_NORMALIZED_OWNER: tools/orbit360-gate-bootstrap-auth-legal-normalized-v20260729.mjs
  ORBIT360_JQ_SAFETY: tools/orbit360-jq-selector-safety-contract-v20260729.json

jobs:
  runtime_smoke_lab:
    name: M5 · package or one runtime smoke LAB · owner normalized · jq safe · zero writes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolver modo controlado
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ORBIT360_REQUEST_FILE" ]; then echo 'value=request' >> "$GITHUB_OUTPUT"; else echo 'value=package' >> "$GITHUB_OUTPUT"; fi

      - name: Verificar rama SHA y primer intento
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validar solicitud inmutable sin secretos
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const r=JSON.parse(fs.readFileSync(process.env.ORBIT360_REQUEST_FILE,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          const bad=[];
          if(r.schemaVersion!=='orbit360-m5-runtime-smoke-request-v5'||r.gateId!==process.env.ORBIT360_GATE_ID||r.contractVersion!=='5.0.16')bad.push('schema');
          if(r.branch!==process.env.ORBIT360_BRANCH||r.authorizedBaseCommit!==parent||r.allowedExecutions!==1||r.runtimeSmoke!==true)bad.push('binding');
          if(r.releaseCandidateHash!==process.env.EXPECTED_RC_HASH||r.criticalAssets!==42||r.remoteAssetsExpected!==25)bad.push('candidate');
          if(r.projectId!==process.env.EXPECTED_FIREBASE_PROJECT_ID||r.canonicalUrl!==process.env.ORBIT360_PREVIEW_URL||r.reviewUrl!==process.env.ORBIT360_PREVIEW_URL+'/ays-lab-preview.html')bad.push('target');
          if(r.bootstrapOwner!==process.env.ORBIT360_NORMALIZED_OWNER||r.jqSelectorSafetyContract!==process.env.ORBIT360_JQ_SAFETY||r.snapshotsRequired!==true)bad.push('runtime_contract');
          if(r.secrets!==true||r.firestoreRead!==true||r.firestoreWrite!==false||r.operationalWrites!==false||r.runtime!==true||r.browser!==true||r.deploy!==false||r.hostingDeploy!==false||r.functionsDeploy!==false||r.rulesDeploy!==false||r.production!==false||r.mergeMain!==false||r.policies!==false||r.visualReview!==false||r['pólizas']!==false||r.containsPII!==false||r.containsSecrets!==false)bad.push('capabilities');
          if(bad.length)throw new Error('M5_RUNTIME_516_REQUEST_INVALID:'+bad.join(','));
          console.log('M5_RUNTIME_516_REQUEST_BOUND_OK');
          NODE

      - name: Preflight canónico y seguridad jq antes de identidad
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-m5-runtime-smoke-516-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-516-contract-v20260729.cjs
          node --check tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-514-browser-v20260729.mjs
          node --check tools/orbit360-m5-runtime-smoke-514-close-v20260729.mjs
          node --check tools/orbit360-gate-bootstrap-auth-legal-normalized-v20260729.mjs
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync(process.env.ORBIT360_JQ_SAFETY,'utf8'));
          if(c.classification!=='PIPELINE_MECHANISM_ROOT_CAUSE_CONTROL'||!c.requiredRule||!Array.isArray(c.knownIncidents)||c.knownIncidents.length!==2)throw new Error('JQ_SELECTOR_SAFETY_CONTRACT_INVALID');
          const w=fs.readFileSync('.github/workflows/orbit360-m5-runtime-smoke-lab-516-v20260729.yml','utf8');
          const unsafe='.'+'p'+'ó'+'lizas';
          if(w.includes(unsafe))throw new Error('UNSAFE_JQ_UNICODE_SELECTOR_PRESENT');
          if(!w.includes('.["pólizas"]'))throw new Error('SAFE_JQ_UNICODE_SELECTOR_MISSING');
          console.log('JQ_SELECTOR_SAFETY_PASS');
          NODE
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="5.0.16" and .executionPhase=="LAB_RUNTIME_GATE" and .failed==0 and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==42 and .remoteAssetsExpected==25 and .remoteAssetsMatched==25 and .accessOwnerVersion=="20260729.3" and .jqSelectorSafety==true and .capabilityProfile.secrets==true and .capabilityProfile.firestoreRead==true and .capabilityProfile.writes==false and .capabilityProfile.runtime==true and .capabilityProfile.browser==true and .capabilityProfile.deploy==false and .capabilityProfile.functionsDeploy==false and .capabilityProfile.rulesDeploy==false and .capabilityProfile.production==false and .dataAccess==false and .secretAccess==false and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then jq -e '.executionAuthorized==true and .allowedExecutions==1 and .activationMode=="immutable_request_present"' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null; else jq -e '.executionAuthorized==false and .allowedExecutions==0 and .activationMode=="package_without_request"' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null; fi

      - name: Verificar contrato estático y RC exacta
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-516-contract-v20260729.cjs
          jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_516_CONTRACT_PASS" and .failed==0 and .passed==.total and .releaseCandidateHash==env.EXPECTED_RC_HASH and .criticalAssets==42 and .remoteAssetsExpected==25 and .remoteAssetsMatched==25 and .accessOwnerVersion=="20260729.3" and .jqSelectorSafety==true and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0 and .runtime==true and .browser==true and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-516-contract-summary.json" >/dev/null

      - name: Instalar dependencias read-only y navegador
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Resolver identidad LAB después del preflight
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_LOGIN_SECRET: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_LOGIN_SECRET} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-m5-runtime-smoke-516-lab.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$EXPECTED_FIREBASE_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_LAB_LOGIN_PASSWORD=$ORBIT360_LOGIN_SECRET" >> "$GITHUB_ENV"

      - name: Snapshot Firestore read-only antes del navegador
        if: ${{ steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs before
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .checksPassed==11 and .checksTotal==11 and .counts.sourceClients==414 and .counts.sourceInsurers==26 and .counts.advisors==7 and .counts.canonicalClients==414 and .counts.canonicalInsurers==26 and .counts.memberships==1 and .counts.config==1 and .firestoreRead==true and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-live-before.json" >/dev/null

      - name: Ejecutar un único runtime smoke LAB
        if: ${{ steps.mode.outputs.value == 'request' }}
        id: browser
        continue-on-error: true
        shell: bash
        run: node tools/orbit360-m5-runtime-smoke-514-browser-v20260729.mjs

      - name: Snapshot Firestore read-only después del navegador
        if: ${{ always() && steps.mode.outputs.value == 'request' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m5-runtime-smoke-live-readonly-v20260729.mjs after
          jq -e '.ok==true and .status=="M5_RUNTIME_LIVE_SNAPSHOT_PASS" and .checksPassed==11 and .checksTotal==11 and .firestoreWrites==0 and .operationalWrites==0' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-live-after.json" >/dev/null

      - name: Cerrar evidencia sanitizada y comparar digests
        if: ${{ always() && steps.mode.outputs.value == 'request' }}
        continue-on-error: true
        shell: bash
        run: node tools/orbit360-m5-runtime-smoke-514-close-v20260729.mjs

      - name: Crear resumen de control 5.0.16
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const d=process.env.ORBIT360_EVIDENCE_DIR,mode='${{ steps.mode.outputs.value }}';
          const read=n=>{try{return JSON.parse(fs.readFileSync(path.join(d,n),'utf8'))}catch{return null}};
          const p=read('preflight-sanitizado.json'),c=read('m5-runtime-smoke-516-contract-summary.json'),r=read('m5-runtime-smoke-514-summary.json');
          const packageOk=!!(p&&p.status==='GO_GATE_CONTRACT'&&p.activationMode==='package_without_request'&&p.failed===0&&p.jqSelectorSafety===true&&c&&c.status==='M5_RUNTIME_SMOKE_516_CONTRACT_PASS'&&c.failed===0&&c.jqSelectorSafety===true);
          const runtimeOk=!!(p&&p.status==='GO_GATE_CONTRACT'&&p.executionAuthorized===true&&p.failed===0&&p.jqSelectorSafety===true&&c&&c.status==='M5_RUNTIME_SMOKE_516_CONTRACT_PASS'&&c.failed===0&&r&&r.ok===true&&r.status==='M5_RUNTIME_SMOKE_514_CLOSED_SUCCESS');
          const ok=mode==='request'?runtimeOk:packageOk;
          const out={schemaVersion:'orbit360-m5-runtime-smoke-516-control-summary-v1',generatedAt:new Date().toISOString(),mode,ok,status:mode==='request'?(ok?'M5_RUNTIME_SMOKE_516_CLOSED_SUCCESS':'M5_RUNTIME_SMOKE_516_FAILED_STOP_LINE'):(ok?'M5_RUNTIME_SMOKE_516_PACKAGE_PASS':'M5_RUNTIME_SMOKE_516_PACKAGE_FAIL'),releaseCandidateHash:process.env.EXPECTED_RC_HASH,bootstrapOwner:process.env.ORBIT360_NORMALIZED_OWNER,accessOwnerVersion:'20260729.3',jqSelectorSafety:true,preflightStatus:p&&p.status||'NOT_RUN',preflightPassed:p&&p.passed||0,preflightTotal:p&&p.total||0,contractStatus:c&&c.status||'NOT_RUN',contractPassed:c&&c.passed||0,contractTotal:c&&c.total||0,runtimeStatus:r&&r.status||'NOT_RUN',runtimeSourceContractVersion:r&&r.contractVersion||'',allCountsStable:!!(r&&r.allCountsStable),allDigestsStable:!!(r&&r.allDigestsStable),normalizedBootstrapOwner:!!(r&&r.normalizedBootstrapOwner),roleViewsCompleted:!!(r&&r.roleViewsCompleted),transientStaticCalls:Number(r&&r.transientStaticCalls||0),blockedOperationalCalls:Number(r&&r.blockedOperationalCalls||0),networkWriteCandidates:Number(r&&r.networkWriteCandidates||0),firestoreRead:mode==='request',firestoreWrites:0,operationalWrites:0,runtimeExecuted:mode==='request',browserExecuted:mode==='request',hostingDeploy:false,functionsDeploy:false,rulesDeploy:false,production:false,mergeMain:false,policies:false,visualReviewExecuted:false,'pólizas':false,approvalReadyForVisualReview:mode==='request'&&ok,containsPII:false,containsSecrets:false};
          fs.writeFileSync(path.join(d,'m5-runtime-smoke-516-control-summary.json'),JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Validar cierre esperado con selector Unicode seguro
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.mode.outputs.value }}' = 'request' ]; then
            test "${{ steps.browser.outcome }}" = 'success'
            jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_516_CLOSED_SUCCESS" and .releaseCandidateHash==env.EXPECTED_RC_HASH and .bootstrapOwner==env.ORBIT360_NORMALIZED_OWNER and .accessOwnerVersion=="20260729.3" and .jqSelectorSafety==true and .allCountsStable==true and .allDigestsStable==true and .normalizedBootstrapOwner==true and .roleViewsCompleted==true and .transientStaticCalls>0 and .blockedOperationalCalls==0 and .networkWriteCandidates==0 and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==true and .browserExecuted==true and .hostingDeploy==false and .functionsDeploy==false and .rulesDeploy==false and .production==false and .mergeMain==false and .policies==false and .visualReviewExecuted==false and .["pólizas"]==false and .approvalReadyForVisualReview==true and .containsPII==false and .containsSecrets==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-516-control-summary.json" >/dev/null
          else
            jq -e '.ok==true and .status=="M5_RUNTIME_SMOKE_516_PACKAGE_PASS" and .jqSelectorSafety==true and .firestoreRead==false and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .hostingDeploy==false' "$ORBIT360_EVIDENCE_DIR/m5-runtime-smoke-516-control-summary.json" >/dev/null
          fi

      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-m5-runtime-smoke-516-${{ steps.mode.outputs.value }}-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-516-contract-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-before.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-514-browser-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-live-after.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-514-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-516-control-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar estado observable sanitizado
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: orbit360-platform/runtime-gate-crm-v20260716/m5-runtime-smoke-516-control-summary.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='M5 5.0.16 runtime control failed';
            try{const s=JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH,'utf8'));if(s.ok===true){state='success';description=s.mode==='request'?'M5 runtime smoke LAB ok; zero writes':'M5 runtime package jq-safe verified';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/m5-runtime-smoke-516',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - name: Limpiar identidad temporal
        if: always()
        shell: bash
        run: rm -f "${ORBIT360_TEMP_KEY_FILE:-${RUNNER_TEMP}/orbit360-m5-runtime-smoke-516-lab.json}"
