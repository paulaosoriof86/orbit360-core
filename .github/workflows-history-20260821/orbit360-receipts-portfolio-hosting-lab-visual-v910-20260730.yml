name: Orbit 360 · Recibos/Cartera 9.1.0 · Hosting LAB + visual once
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/receipts-portfolio-hosting-lab-v910-20260730.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-hosting-lab-v910-20260730
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_REQUEST: .github/orbit360-requests/receipts-portfolio-hosting-lab-v910-20260730.json
  ORBIT360_AUTHORIZED_FUNCTIONAL_HEAD: 1a3b80edabceef7f61b3fc0efd93c026d3eb1aa8
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_CHANNEL_ID: orbit360-ays-lab
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  hosting_visual_once:
    name: Hosting LAB exacto + revisión visual 9.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización y lineage funcional
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$ORBIT360_REQUEST"
          jq -e '.schemaVersion=="orbit360-hosting-lab-authorization-v1" and .approved==true and .phrase=="AUTORIZO HOSTING LAB RECIBOS CARTERA V910 20260730" and .branch==env.ORBIT360_BRANCH and .authorizedFunctionalHead==env.ORBIT360_AUTHORIZED_FUNCTIONAL_HEAD and .projectId==env.ORBIT360_PROJECT_ID and .channelId==env.ORBIT360_CHANNEL_ID and .scope.hostingLab==true and .scope.browserVisual==true and .scope.production==false and .scope.functions==false and .scope.rules==false and .scope.main==false and .scope.merge==false and .scope.cobros==false and .allowedDeployExecutions==1' "$ORBIT360_REQUEST" >/dev/null
          git merge-base --is-ancestor "$ORBIT360_AUTHORIZED_FUNCTIONAL_HEAD" HEAD
          if git diff --name-only "$ORBIT360_AUTHORIZED_FUNCTIONAL_HEAD"..HEAD | grep -E '^orbit360-platform/(?!docs/)'; then
            echo 'FUNCTIONAL_HEAD_DRIFT_AFTER_AUTHORIZATION' >&2
            exit 41
          fi
      - name: Gate canónico antes de secrets/deploy/browser
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Instalar herramientas después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Resolver credencial técnica LAB
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="${RUNNER_TEMP}/orbit360-receipts-portfolio-hosting-lab.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
      - name: Deploy único Hosting LAB preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          firebase hosting:channel:deploy "$ORBIT360_CHANNEL_ID" --project "$ORBIT360_PROJECT_ID" --expires 7d --non-interactive --json > "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-deploy-v910.json"
          test -s "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-deploy-v910.json"
      - name: Verificar paridad remota de activos críticos
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'index.html'
            'core/backend-lab-init.js'
            'core/backend-lab-canonical-view-sync.js'
            'core/backend-lab-receipts-portfolio-projection-v910.js'
            'modules/cliente360.js'
            'modules/polizas.js'
          )
          pass=0
          for f in "${files[@]}"; do
            local_sha="$(sha256sum "orbit360-platform/$f" | awk '{print $1}')"
            tmp="${RUNNER_TEMP}/remote-$(basename "$f")"
            ok=false
            for i in $(seq 1 30); do
              if curl -fsSL --retry 2 "${ORBIT360_LAB_URL}/${f}?orbitV910=${GITHUB_SHA}-${i}" -o "$tmp"; then
                remote_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then ok=true; break; fi
              fi
              sleep 3
            done
            test "$ok" = true
            pass=$((pass+1))
          done
          jq -n --argjson pass "$pass" '{schemaVersion:"orbit360-hosting-lab-parity-v910",ok:($pass==6),criticalAssets:6,passed:$pass,failed:(6-$pass),hostingLab:true,production:false,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/receipts-portfolio-hosting-lab-parity-v910.json"
          test "$pass" = '6'
      - name: Revisión visual automatizada LAB
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
          ORBIT360_LAB_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          jq -e '.ok==true and .status=="VISUAL_LAB_PASS" and .contractVersion=="9.1.0" and .counts.clientes==430 and .counts.aseguradoras==30 and .counts.asesores==7 and .counts.polizas==1373 and .counts.vehiculos==1032 and .counts.recibosEsperados==1293 and .counts.carteraPrimas==673 and .counts.cobros==0 and .counts.finmovs==0 and .checks.projectionReady==true and .checks.activeCalendar==true and .checks.historicalExigible==true and .checks.paymentReportedPendingReconciliation==true and .checks.cobrosSeparated==true and .roleViews["Dirección"].rowsVisible>0 and .roleViews["Operativo"].rowsVisible>0 and .roleViews["Asesor"].rowsVisible>0 and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null
      - name: Limpiar credencial temporal
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ]; then rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-hosting-visual-v910-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hosting-lab-parity-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-lab-v910.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          VISUAL: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-lab-v910.json
          PARITY: orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-hosting-lab-parity-v910.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Recibos/Cartera Hosting LAB visual failed';
            try{const v=JSON.parse(fs.readFileSync(process.env.VISUAL,'utf8'));const p=JSON.parse(fs.readFileSync(process.env.PARITY,'utf8'));if(v.ok===true&&v.status==='VISUAL_LAB_PASS'&&p.ok===true){state='success';description='Recibos/Cartera 9.1.0 Hosting LAB + visual PASS';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-hosting-visual-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
