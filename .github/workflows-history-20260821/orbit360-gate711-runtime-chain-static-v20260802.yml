name: Orbit 360 · Gate 7.11 · cadena runtime integral source-only

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-static-requests/gate711-runtime-chain-static-run-v20260802.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: orbit360-gate711-runtime-chain-static-v20260802
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 997fca628f95dd397dba347700a6bc644fe840f0
  REQUEST_FILE: .github/orbit360-static-requests/gate711-runtime-chain-static-run-v20260802.json
  EVIDENCE_FILE: orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-chain-static-v20260802-v2.json
  STATUS_CONTEXT: orbit360/gate711-runtime-chain-static

jobs:
  validate:
    name: Source-only · cadena productor-consumidor completa
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publicar estado pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state pending --arg context "$STATUS_CONTEXT" --arg description "Gate 7.11 cadena runtime source-only" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status.json" >/dev/null

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar request inmutable y producto congelado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = "$(jq -r '.parentHead' "$REQUEST_FILE")"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$REQUEST_FILE"
          jq -e --arg product "$PRODUCT_HEAD" '.schemaVersion=="orbit360-gate711-runtime-chain-static-request-v1" and .gateId=="block7-canonical-runtime-cumulative-visual-lab-v20260801" and .productHead==$product and .approved==true and .allowedExecutions==1 and .consumed==false and .scope=="FULL_PIPELINE_PRODUCER_CONSUMER_CHAIN" and .capabilities.secrets==false and .capabilities.firestoreRead==false and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.writes==false and .capabilities.deploy==false and .capabilities.production==false' "$REQUEST_FILE" >/dev/null
          mapfile -t PRODUCT_DIFF < <(git diff --name-only "$PRODUCT_HEAD"..HEAD -- orbit360-platform/index.html orbit360-platform/modules orbit360-platform/core orbit360-platform/styles orbit360-platform/data)
          test "${#PRODUCT_DIFF[@]}" = '0'

      - name: Validar cadena integral
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs
          node tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs
          jq -e '.ok==true and .status=="GATE711_RUNTIME_CHAIN_STATIC_PASS" and .classification=="GO_STATIC_RUNTIME_CHAIN_END_TO_END" and .total==55 and .passed==55 and .failed==0 and .productFilesChanged==0 and .secretsAccessed==false and .firestoreReads==0 and .firestoreWrites==0 and .operationalWrites==0 and .runtimeExecuted==false and .browserExecuted==false and .deployExecuted==false and .productionTouched==false and .containsPII==false and .containsSecrets==false' "$EVIDENCE_FILE" >/dev/null

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate711-runtime-chain-static-v20260802
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/gate711-runtime-chain-static-v20260802-v2.json
            tools/orbit360-validar-gate711-runtime-chain-static-v20260802-v2.mjs
            .github/workflows/orbit360-gate711-release-critical-runtime-v20260802.yml
            tools/orbit360-validar-gate711-release-critical-runtime-v20260802.mjs
            tools/orbit360-preparar-identidad-browser-canonica-readonly-v20260801.mjs
            tools/orbit360-revalidar-policies-full-canonical-readonly-v20260801.mjs
          if-no-files-found: error
          retention-days: 14

      - name: Publicar estado final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then STATE=success; DESCRIPTION="Gate 7.11 cadena runtime 55/55 PASS"; else STATE=failure; DESCRIPTION="Gate 7.11 cadena runtime FAIL / STOP_RETRY"; fi
          jq -n --arg state "$STATE" --arg context "$STATUS_CONTEXT" --arg description "$DESCRIPTION" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > "$RUNNER_TEMP/status-final.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @"$RUNNER_TEMP/status-final.json" >/dev/null
