name: Orbit 360 · Recibos/Cartera 9.1.0 · Rules compat + visual once
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/receipts-portfolio-rules-compat-v910-20260730.json'
      - '.github/orbit360-triggers/receipts-portfolio-rules-compat-resume-v910-20260730.json'
permissions:
  contents: write
  statuses: write
concurrency:
  group: orbit360-receipts-portfolio-rules-compat-v910-20260730
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block9-receipts-portfolio-static-v20260730
  ORBIT360_REQUEST: .github/orbit360-requests/receipts-portfolio-rules-compat-v910-20260730.json
  ORBIT360_RESUME: .github/orbit360-triggers/receipts-portfolio-rules-compat-resume-v910-20260730.json
  ORBIT360_AUTHORIZED_HEAD: 54e85a30a9c2a604ba50d16ebc03eed834ff4ed2
  ORBIT360_SOURCE_SHA256: 977d5841c5d54f139d2bf287914ae6bb19fad64fbe80b1cade807c5026a493ef
  ORBIT360_CANDIDATE_SHA256: a78ad9e7ec3dc7277dda81d10ef223784d762f3b5d52e4040d9436679db7f4eb
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_PRODUCT_TENANT_ID: alianzas-soluciones
  ORBIT360_LAB_URL: https://ays-orbit-360-lab--orbit360-ays-lab-fj1zxnk2.web.app
  ORBIT360_PRODUCT_URL: https://ays-orbit-360-lab.web.app
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  rules_compat_visual:
    name: Rules read-only exactas + regresión productiva + visual LAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 40
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización, resume y lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$ORBIT360_REQUEST"
          jq -e '.schemaVersion=="orbit360-rules-readonly-compat-authorization-v1" and .approved==true and .phrase=="AUTORIZO RULES READONLY COMPAT LAB RECIBOS CARTERA V910 20260730" and .branch==env.ORBIT360_BRANCH and .authorizedHead==env.ORBIT360_AUTHORIZED_HEAD and .sourceRulesSha256==env.ORBIT360_SOURCE_SHA256 and .candidateRulesSha256==env.ORBIT360_CANDIDATE_SHA256 and .staticProof.run==30606629580 and .staticProof.artifact==8783834911 and .scope.rulesDeploy==true and .scope.hosting==false and .scope.functions==false and .scope.storage==false and .scope.dataWrites==false and .scope.main==false and .scope.merge==false and .scope.cobros==false and .scope.visualAfterRules==true and .allowedRulesDeployExecutions==1 and .rollbackOnSecurityFailure==true' "$ORBIT360_REQUEST" >/dev/null
          if [ -f "$ORBIT360_RESUME" ]; then
            jq -e '.schemaVersion=="orbit360-rules-compat-resume-v1" and .classification=="PIPELINE_MECHANISM_FAILURE" and .sourceFailedRun==30629152231 and .failedStage=="source_sync_guard" and .rulesDeployExecuted==false and .hostingDeployExecuted==false and .browserExecuted==false and .authorizationConsumedByRulesDeploy==false and .sameRequestResumeAllowed==true' "$ORBIT360_RESUME" >/dev/null
          fi
          git merge-base --is-ancestor "$ORBIT360_AUTHORIZED_HEAD" HEAD
          bad="$(git diff --name-only "$ORBIT360_AUTHORIZED_HEAD"..HEAD | grep -Ev '^tools/orbit360-rules-compat-live-read-probe-v910-20260730.mjs$|^\.github/workflows/orbit360-receipts-portfolio-rules-compat-visual-v910-20260730.yml$|^\.github/orbit360-requests/receipts-portfolio-rules-compat-v910-20260730.json$|^\.github/orbit360-triggers/receipts-portfolio-rules-compat-resume-v910-20260730.json$' || true)"
          test -z "$bad"
          test "$(sha256sum firestore.product-readonly.rules | awk '{print $1}')" = "$ORBIT360_SOURCE_SHA256"
      - name: Gate canónico antes de secrets/Rules/browser
        env:
          ORBIT360_RECEIPTS_GATE_PHASE: AUTHORIZED_WRITE
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-build-legacy-lab-read-compat-candidate-v910-20260730.mjs
          node --check tools/orbit360-rules-compat-live-read-probe-v910-20260730.mjs
          node --check tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .contractVersion=="9.1.0" and .failed==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Reconstruir exactamente la candidata probada
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-build-legacy-lab-read-compat-candidate-v910-20260730.mjs
          CAND="$EVIDENCE_DIR/firestore.product-readonly.v910-candidate.rules"
          test -s "$CAND"
          test "$(sha256sum "$CAND" | awk '{print $1}')" = "$ORBIT360_CANDIDATE_SHA256"
          jq -e '.candidateCommitted==false and .candidateSha256==env.ORBIT360_CANDIDATE_SHA256 and .readOnly==true and .writesAllowed==false and .credentialRefsAllowed==false and .otherMembersLegacyAllowed==false and .deployExecuted==false' "$EVIDENCE_DIR/firestore-legacy-lab-compat-candidate-v910.json" >/dev/null
      - name: Instalar herramientas después del gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 google-auth-library@9 playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Resolver credencial técnica existente
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ORBIT360_EXISTING_LOGIN_PASSWORD: ${{ secrets.ORBIT360_LAB_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          test ${#ORBIT360_EXISTING_LOGIN_PASSWORD} -ge 12
          KEY_FILE="${RUNNER_TEMP}/orbit360-rules-compat-v910.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_SMOKE_PASSWORD=$ORBIT360_EXISTING_LOGIN_PASSWORD" >> "$GITHUB_ENV"
          echo "ORBIT360_LAB_LOGIN_PASSWORD=$ORBIT360_EXISTING_LOGIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Sincronizar fuente exacta de Rules y registrar commit
        id: source_sync
        shell: bash
        run: |
          set -euo pipefail
          cp firestore.product-readonly.rules "${RUNNER_TEMP}/firestore.product-readonly.original.rules"
          cp "$EVIDENCE_DIR/firestore.product-readonly.v910-candidate.rules" firestore.product-readonly.rules
          test "$(sha256sum firestore.product-readonly.rules | awk '{print $1}')" = "$ORBIT360_CANDIDATE_SHA256"
          git diff --check -- firestore.product-readonly.rules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.product-readonly.rules
          test "$(git diff --cached --name-only)" = 'firestore.product-readonly.rules'
          git diff --cached --check
          git commit -m 'security(receipts): activate exact read-only LAB Rules compatibility 9.1.0'
          RULES_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:$ORBIT360_BRANCH"
          echo "rules_commit=$RULES_COMMIT" >> "$GITHUB_OUTPUT"
          echo "ORBIT360_RULES_SOURCE_COMMIT=$RULES_COMMIT" >> "$GITHUB_ENV"
      - name: Deploy único de Firestore Rules
        id: rules_deploy
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only firestore:rules --project "$ORBIT360_PROJECT_ID" --config firebase.product-go-live.json --non-interactive --json > "$EVIDENCE_DIR/rules-compat-deploy-v910.json"
          jq -e '.status=="success"' "$EVIDENCE_DIR/rules-compat-deploy-v910.json" >/dev/null
          jq -n --arg commit "$ORBIT360_RULES_SOURCE_COMMIT" --arg sha "$ORBIT360_CANDIDATE_SHA256" '{schemaVersion:"orbit360-rules-compat-deploy-v1",contractVersion:"9.1.0",ok:true,status:"RULES_DEPLOY_PASS",rulesSourceCommit:$commit,candidateSha256:$sha,rulesDeployExecutions:1,hostingDeployExecutions:0,functionsDeploy:false,storageDeploy:false,firestoreDataWrites:0,operationalWrites:0,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/rules-compat-deploy-summary-v910.json"
      - name: Probe live read-only de Rules
        id: live_probe
        continue-on-error: true
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-rules-compat-live-read-probe-v910-20260730.mjs
          jq -e '.ok==true and .status=="RULES_COMPAT_LIVE_READ_PASS" and .checks.legacyAllowedCollectionRead==true and .checks.productNormalizedReadPreserved==true and .checks.sensitiveLegacyCollectionDenied==true and .checks.credentialRefsStillDenied==true and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/rules-compat-live-read-probe-v910.json" >/dev/null
      - name: Resolver identidad productiva read-only
        id: product_identity
        if: steps.live_probe.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-resolve-smoke-identity-readonly-v20260730.mjs
          jq -e '.ok==true and .status=="M6_PRODUCT_SMOKE_IDENTITY_RESOLVED" and .eligibleSmokeIdentityCount==1 and .firestoreWrites==0 and .operationalWrites==0' "$EVIDENCE_DIR/m6-product-smoke-identity-summary.json" >/dev/null
      - name: Regresión productiva read-only M6
        id: product_smoke
        if: steps.live_probe.outcome == 'success' && steps.product_identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-m6-product-browser-smoke-v20260730.mjs
          jq -e '.ok==true and .status=="M6_PRODUCT_BROWSER_SMOKE_PASS" and .runtime.clients==414 and .runtime.insurers==26 and .runtime.writeEnabled==false and .firestoreWrites==0 and .operationalWrites==0 and (.networkWriteCandidates|length)==0' "$EVIDENCE_DIR/m6-product-browser-smoke-summary.json" >/dev/null
      - name: Rollback fail-closed si seguridad/producto no preservados
        id: rollback
        if: steps.live_probe.outcome != 'success' || steps.product_identity.outcome != 'success' || steps.product_smoke.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/firestore.product-readonly.original.rules" firestore.product-readonly.rules
          test "$(sha256sum firestore.product-readonly.rules | awk '{print $1}')" = "$ORBIT360_SOURCE_SHA256"
          firebase deploy --only firestore:rules --project "$ORBIT360_PROJECT_ID" --config firebase.product-go-live.json --non-interactive --json > "$EVIDENCE_DIR/rules-compat-rollback-v910.json"
          jq -e '.status=="success"' "$EVIDENCE_DIR/rules-compat-rollback-v910.json" >/dev/null
          git add firestore.product-readonly.rules
          test "$(git diff --cached --name-only)" = 'firestore.product-readonly.rules'
          git commit -m 'rollback(receipts): restore pre-compat product read-only Rules 9.1.0'
          git push origin "HEAD:$ORBIT360_BRANCH"
          jq -n '{schemaVersion:"orbit360-rules-compat-rollback-v1",ok:true,status:"ROLLED_BACK_SAFE",rulesRollbackExecuted:true,hostingDeployExecutions:0,firestoreDataWrites:0,operationalWrites:0,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/rules-compat-rollback-summary-v910.json"
      - name: Detener si hubo rollback de seguridad
        if: steps.rollback.outcome == 'success'
        shell: bash
        run: |
          echo 'SECURITY_COMPAT_ROLLED_BACK_SAFE' >&2
          exit 41
      - name: Revisión visual Recibos/Cartera sobre Hosting ya publicado
        id: visual
        env:
          ORBIT360_LAB_LOGIN_EMAIL: orbit.lab@demo.com
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-receipts-portfolio-visual-lab-v910-20260730.mjs
          jq -e '.ok==true and .status=="VISUAL_LAB_PASS" and .contractVersion=="9.1.0" and .counts.clientes==430 and .counts.aseguradoras==30 and .counts.asesores==7 and .counts.polizas==1373 and .counts.vehiculos==1032 and .counts.recibosEsperados==1293 and .counts.carteraPrimas==673 and .counts.cobros==0 and .counts.finmovs==0 and .checks.projectionReady==true and .checks.activeCalendar==true and .checks.historicalExigible==true and .checks.paymentReportedPendingReconciliation==true and .checks.cobrosSeparated==true and .roleViews["Dirección"].rowsVisible>0 and .roleViews["Operativo"].rowsVisible>0 and .roleViews["Asesor"].rowsVisible>0 and .firestoreWrites==0 and .operationalWrites==0 and .productionTouched==false' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null
      - name: Cerrar evidencia sanitizada
        if: always()
        shell: bash
        run: |
          set +e
          LIVE=false; PRODUCT=false; VISUAL=false; ROLLBACK=false; DEPLOY=false
          jq -e '.ok==true' "$EVIDENCE_DIR/rules-compat-deploy-summary-v910.json" >/dev/null 2>&1 && DEPLOY=true
          jq -e '.ok==true' "$EVIDENCE_DIR/rules-compat-live-read-probe-v910.json" >/dev/null 2>&1 && LIVE=true
          jq -e '.ok==true' "$EVIDENCE_DIR/m6-product-browser-smoke-summary.json" >/dev/null 2>&1 && PRODUCT=true
          jq -e '.ok==true' "$EVIDENCE_DIR/receipts-portfolio-visual-lab-v910.json" >/dev/null 2>&1 && VISUAL=true
          test -f "$EVIDENCE_DIR/rules-compat-rollback-summary-v910.json" && ROLLBACK=true
          jq -n --argjson deploy "$DEPLOY" --argjson live "$LIVE" --argjson product "$PRODUCT" --argjson visual "$VISUAL" --argjson rollback "$ROLLBACK" --arg rulesCommit "${ORBIT360_RULES_SOURCE_COMMIT:-}" '{schemaVersion:"orbit360-rules-compat-final-v1",contractVersion:"9.1.0",ok:($deploy and $live and $product and $visual and ($rollback|not)),status:(if ($deploy and $live and $product and $visual and ($rollback|not)) then "RULES_COMPAT_AND_VISUAL_PASS" elif $rollback then "ROLLED_BACK_SAFE" else "RULES_COMPAT_OR_VISUAL_FAIL" end),rulesSourceCommit:$rulesCommit,liveRulesReadContract:$live,productReadOnlyRegression:$product,visualLab:$visual,rollbackExecuted:$rollback,rulesDeployExecutions:(if $deploy then 1 else 0 end),hostingDeployExecutions:0,functionsDeploy:false,storageDeploy:false,firestoreDataWrites:0,operationalWrites:0,containsPII:false,containsSecrets:false}' > "$EVIDENCE_DIR/rules-compat-final-v910.json"
      - name: Limpiar credencial temporal
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ]; then rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-receipts-portfolio-rules-compat-visual-v910-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/firestore-legacy-lab-compat-candidate-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/rules-compat-deploy-summary-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/rules-compat-live-read-probe-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/m6-product-smoke-identity-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/m6-product-browser-smoke-summary.json
            orbit360-platform/runtime-gate-crm-v20260716/receipts-portfolio-visual-lab-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/rules-compat-rollback-summary-v910.json
            orbit360-platform/runtime-gate-crm-v20260716/rules-compat-final-v910.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado
        if: always()
        uses: actions/github-script@v7
        env:
          FINAL: orbit360-platform/runtime-gate-crm-v20260716/rules-compat-final-v910.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Rules compatibility / visual failed';
            try{const f=JSON.parse(fs.readFileSync(process.env.FINAL,'utf8'));if(f.ok===true&&f.status==='RULES_COMPAT_AND_VISUAL_PASS'){state='success';description='Rules compat 9.1.0 + product read-only + visual PASS';}else if(f.status==='ROLLED_BACK_SAFE'){description='Rules compat rolled back safely';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/receipts-portfolio-rules-compat-visual-v910',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
