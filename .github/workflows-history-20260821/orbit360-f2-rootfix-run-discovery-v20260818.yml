name: Orbit360 F2 Rootfix Run Discovery 20260818
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-observers/f2-rootfix-run-discovery-20260818.json'
permissions:
  contents: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Discover source-only rootfix run
        env:
          GH_TOKEN_RUNTIME: ${{ github.token }}
          TRIGGER_SHA: 24e00e7f608eda4c9156034fdc7f169beb3fa3c2
          TARGET_NAME: Orbit360 F2 Validator Stale Rootfix Source Only 20260818
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN_RUNTIME" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TRIGGER_SHA}&event=push&per_page=100")"
          COUNT="$(printf '%s' "$JSON" | jq --arg n "$TARGET_NAME" '[.workflow_runs[] | select(.name==$n)] | length')"
          mkdir -p orbit360-platform/runtime-gate-crm-v20260716
          if [ "$COUNT" = '1' ]; then
            printf '%s' "$JSON" | jq --arg n "$TARGET_NAME" '.workflow_runs[] | select(.name==$n) | {schemaVersion:"orbit360-f2-rootfix-run-discovery-v1",ok:true,status:"F2_ROOTFIX_RUN_DISCOVERED",classification:"PASS",triggerSha:.head_sha,runId:.id,runStatus:.status,runConclusion:(.conclusion // null),runAttempt:.run_attempt,workflowName:.name,createdAt:.created_at,updatedAt:.updated_at,multipleRuns:false,containsPII:false,containsSecrets:false}' > orbit360-platform/runtime-gate-crm-v20260716/f2-rootfix-run-discovery-v20260818.json
          else
            jq -n --argjson count "$COUNT" '{schemaVersion:"orbit360-f2-rootfix-run-discovery-v1",ok:false,status:(if $count==0 then "F2_ROOTFIX_RUN_NOT_FOUND" else "F2_ROOTFIX_MULTIPLE_RUNS" end),classification:"PIPELINE_MECHANISM_FAILURE",matchCount:$count,multipleRuns:($count>1),containsPII:false,containsSecrets:false}' > orbit360-platform/runtime-gate-crm-v20260716/f2-rootfix-run-discovery-v20260818.json
          fi
          git config user.name 'orbit360-f2-rootfix-discovery-bot'
          git config user.email 'orbit360-f2-rootfix-discovery-bot@users.noreply.github.com'
          git add orbit360-platform/runtime-gate-crm-v20260716/f2-rootfix-run-discovery-v20260818.json
          git commit -m 'diag(f2): persist rootfix source run discovery [skip ci]'
          git push origin "HEAD:ays/backend-tenant-lab-v99-20260703"
