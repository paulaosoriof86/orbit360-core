name: Orbit 360 Ops Advisor and Cobros Source

on:
  workflow_dispatch:
  push:
    branches:
      - ays/backend-tenant-lab-v99-20260703
    paths:
      - 'functions/**'
      - 'orbit360-platform/modules/ops.js'
      - 'orbit360-platform/modules/ops-workflows-v1201-bridge.js'
      - 'orbit360-platform/core/access-scope.js'
      - 'orbit360-platform/docs/PAQUETE-ACUMULADO-CLAUDE-ORBIT360-20260804.md'
      - 'orbit360-platform/docs/ADDENDUM-OPS-ASESOR-Y-MOMENTO-ENTREGA-CLAUDE-20260804.md'
      - 'tools/orbit360-cobros-inferencia-secuencial-v20260804.mjs'
      - 'tools/orbit360-validar-ops-advisor-y-cobros-source-v20260804.mjs'
      - '.github/workflows/orbit360-ops-advisor-cobros-source-v20260804.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'functions/**'
      - 'orbit360-platform/modules/ops.js'
      - 'orbit360-platform/modules/ops-workflows-v1201-bridge.js'
      - 'orbit360-platform/core/access-scope.js'
      - 'orbit360-platform/docs/PAQUETE-ACUMULADO-CLAUDE-ORBIT360-20260804.md'
      - 'orbit360-platform/docs/ADDENDUM-OPS-ASESOR-Y-MOMENTO-ENTREGA-CLAUDE-20260804.md'
      - 'tools/orbit360-cobros-inferencia-secuencial-v20260804.mjs'
      - 'tools/orbit360-validar-ops-advisor-y-cobros-source-v20260804.mjs'
      - '.github/workflows/orbit360-ops-advisor-cobros-source-v20260804.yml'

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Functions syntax
        working-directory: functions
        run: npm run check
      - name: Frontend syntax
        run: |
          node --check orbit360-platform/modules/ops.js
          node --check orbit360-platform/modules/ops-workflows-v1201-bridge.js
          node --check orbit360-platform/core/access-scope.js
      - name: Advisor Ops and reconciliation contracts
        run: node tools/orbit360-validar-ops-advisor-y-cobros-source-v20260804.mjs
