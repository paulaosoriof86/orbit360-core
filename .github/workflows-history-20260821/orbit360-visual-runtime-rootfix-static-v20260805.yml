name: Orbit 360 · Visual runtime rootfix · source-only

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/visual-runtime-rootfix-static-v20260805.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orbit360-visual-runtime-rootfix-static-v20260805
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST: .github/orbit360-requests/visual-runtime-rootfix-static-v20260805.json
  ORBIT360_LIFECYCLE: tools/orbit360-validator-lifecycle-contract-visual-runtime-rootfix-v20260805.json
  ORBIT360_EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/visual-runtime-rootfix-source-test-sanitized-v20260805.json

jobs:
  source-only:
    name: Sintaxis → contrato → seguridad · cero acceso
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout solicitud exacta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: true

      - name: Verificar request inmutable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-visual-runtime-rootfix-static-request-v1" and
            .gateId=="block2.7-visual-runtime-rootfix-static-v20260805" and
            .contractVersion=="2.7.1" and
            .rcId=="RC-AYS-LAB-CANONICA-01" and
            .status=="AUTHORIZED_SOURCE_ONLY_ONCE" and
            .approved==true and .allowedExecutions==1 and .consumed==false and .replayAllowed==false and
            .branch=="ays/backend-tenant-lab-v99-20260703" and .pullRequest==5 and
            .parentHead==$parent and
            .capabilities.secrets==false and .capabilities.firestoreRead==false and
            .capabilities.writes==false and .capabilities.runtime==false and
            .capabilities.browser==false and .capabilities.deploy==false and
            .capabilities.functionsDeploy==false and .capabilities.rulesDeploy==false and
            .capabilities.production==false
          ' "$ORBIT360_REQUEST" >/dev/null

      - name: Validar sintaxis
        shell: bash
        run: |
          set -euo pipefail
          node --check orbit360-platform/core/visual-runtime-rootfix-v20260805.js
          node --check orbit360-platform/core/backend-lab-loader.js
          node --check tools/orbit360-test-visual-runtime-rootfix-source-v20260805.mjs
          git diff --check

      - name: Ejecutar prueba source-only
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-test-visual-runtime-rootfix-source-v20260805.mjs | tee "$ORBIT360_EVIDENCE"
          jq -e '.status=="PASS_VISUAL_RUNTIME_ROOTFIX_SOURCE" and .total==28 and .passed==28 and .failed==0 and .sourceOnly==true and .browserExecuted==false and .secretsRead==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .operationalWrites==0 and .deployExecuted==false and .productionTouched==false and .ok==true' "$ORBIT360_EVIDENCE" >/dev/null

      - name: Sellar lifecycle source-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = process.env.ORBIT360_LIFECYCLE;
          const lifecycle = JSON.parse(fs.readFileSync(path, 'utf8'));
          lifecycle.ownerVersion = '20260805.2-static-source-pass';
          lifecycle.status = 'STATIC_SOURCE_PASS_NOT_DEPLOYED';
          lifecycle.classification = 'SOURCE_FIX_READY_FOR_LAB_VISUAL_VALIDATION';
          lifecycle.currentPhase = 'STATIC_SOURCE_PASS';
          lifecycle.staticRequest = {
            path: process.env.ORBIT360_REQUEST,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
            consumed: true,
            replayAllowed: false,
            result: 'PASS',
            sourceChecks: 28
          };
          lifecycle.activeRequest = false;
          lifecycle.allowedExecutions = 0;
          lifecycle.executionAuthorized = false;
          lifecycle.secretAccessAuthorized = false;
          lifecycle.firestoreReadAuthorized = false;
          lifecycle.writeAuthorized = false;
          lifecycle.browserAuthorized = false;
          lifecycle.hostingDeployAuthorized = false;
          lifecycle.functionsDeployAuthorized = false;
          lifecycle.rulesDeployAuthorized = false;
          lifecycle.productionAuthorized = false;
          lifecycle.nextAction = 'PREPARE_EXACT_ONE_HOSTING_LAB_DEPLOY_AND_LIVE_VISUAL_TEST_AUTHORIZATION';
          fs.writeFileSync(path, JSON.stringify(lifecycle, null, 2) + '\n', 'utf8');
          NODE
          jq -e '.status=="STATIC_SOURCE_PASS_NOT_DEPLOYED" and .staticRequest.result=="PASS" and .staticRequest.sourceChecks==28 and .executionAuthorized==false and .browserAuthorized==false and .hostingDeployAuthorized==false and .productionAuthorized==false' "$ORBIT360_LIFECYCLE" >/dev/null

      - name: Persistir evidencia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name orbit360-gate-bot
          git config user.email orbit360-gate-bot@users.noreply.github.com
          git add "$ORBIT360_LIFECYCLE" "$ORBIT360_EVIDENCE"
          git commit -m 'runtime: persist visual rootfix source pass [skip ci]'
          git push origin "HEAD:$ORBIT360_BRANCH"

      - name: Comentar PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `## Visual runtime rootfix — source PASS\n\n\`\`\`text\nsource checks: 28/28 PASS\nbrowser: not executed\nFirestore/Auth writes: 0\ndeploy: 0\nproduction: 0\nstatus: STATIC_SOURCE_PASS_NOT_DEPLOYED\n\`\`\``;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 5, body });
