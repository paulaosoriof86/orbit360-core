name: Orbit 360 · Block 12 · rescate rootfix del runtime LAB

on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/block12-runtime-hang-rescue-rootfix-lab-v20260804.json'

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: orbit360-block12-runtime-hang-rescue-rootfix-v20260804
  cancel-in-progress: false

env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/block12-runtime-hang-rescue-rootfix-lab-v20260804.json
  ORBIT360_GATE_ID: block12-runtime-hang-rescue-lab-v20260804
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_REAL_TENANT_ID: alianzas-soluciones
  ORBIT360_TARGET_RUN_ID: '30956309298'
  ORBIT360_EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
  ORBIT360_FUNCTIONS: orbit360OpsLeadsCommandLabV20260804,orbit360GetAdvisorOpsInboxLabV20260804,orbit360CobrosReconciliationCommandLabV20260804,orbit360RecurringInsuranceImportLabV20260804
  ORBIT360_HOSTING_CHANNEL: orbit360-operational-block12

jobs:
  rescue-rootfix:
    name: Rootfix canónico → cancelar → limpiar → verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout solicitud exacta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: true

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar continuidad pre-secreto
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = "$ORBIT360_REQUEST_FILE"
          PARENT="$(git rev-parse HEAD^)"
          jq -e --arg parent "$PARENT" '
            .schemaVersion=="orbit360-block12-runtime-hang-rescue-rootfix-request-v1" and
            .status=="AUTHORIZED_RUNTIME_HANG_RESCUE_ROOTFIX" and
            .approved==true and
            .allowedExecutions==1 and
            .consumed==false and
            .replayAllowed==false and
            .authorizationRef=="user_continue_urgent_block12_runtime_hang_rescue_rootfix_20260804T1714-0600" and
            .previousRescueRunId==30959160007 and
            .previousRescueStoppedBeforeSecrets==true and
            .previousFailureClassification=="VALIDATOR_STALE" and
            .previousFailureCode=="CANONICAL_LIFECYCLE_PHASE_MISMATCH" and
            .targetRunId==30956309298 and
            .previousStatus=="in_progress" and
            .previousStep=="Ejecutar pruebas dentro de Orbit 360" and
            .branch=="ays/backend-tenant-lab-v99-20260703" and
            .projectId=="ays-orbit-360-lab" and
            .pullRequest==5 and
            .contractVersion=="12.0.4" and
            .parentHead==$parent and
            .rules==false and .realTenantWrites==false and .realDataReimport==false and .production==false and .main==false and .merge==false
          ' "$ORBIT360_REQUEST_FILE" >/dev/null

      - name: Materializar fase, lifecycle y validador juntos
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-materializar-block12-runtime-hang-rescue-rootfix-v20260804.mjs
          node tools/orbit360-materializar-block12-runtime-hang-rescue-rootfix-v20260804.mjs
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-block12-runtime-hang-rescue-lab-v20260804.mjs
          node --check tools/orbit360-block12-runtime-hang-rescue-v20260804.mjs
          node -e "const fs=require('fs');const l=JSON.parse(fs.readFileSync('tools/orbit360-validator-lifecycle-contract-block12-runtime-hang-rescue-lab-v20260804.json','utf8'));if(l.gateContractVersion!=='12.0.4'||l.executionProfile.phase!=='RUNTIME_HANG_RESCUE_LAB_EXECUTION'||Object.keys(l.executionProfile.capabilities).length!==9)throw new Error('VALIDATOR_STALE:RESCUE_LIFECYCLE_ROOTFIX');"
          git diff --check
          test -z "$(git diff --name-only -- firestore.rules data/store.js orbit360-platform/data/store.js orbit360-platform/data/store-firestore-lab.local.js orbit360-platform/core/auth.js)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/orbit360-validar-gate-contracts-v20260717.mjs
          git commit -m 'fix(block12): register canonical runtime rescue phase'
          git push origin HEAD:"$ORBIT360_BRANCH"
          echo "ORBIT360_MATERIALIZED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Gate contractual obligatorio antes de secretos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="RUNTIME_HANG_RESCUE_READY" and .contractVersion=="12.0.4" and .failed==0 and .executionAuthorized==true and .secretAccessAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==true and .authWriteAuthorized==true and .deployDeleteAuthorized==true and .runtimeAuthorized==false and .browserAuthorized==false and .rulesDeployAuthorized==false and .productionAuthorized==false and .realTenantWritesAuthorized==false and .realDataReimportAuthorized==false and .secretAccess==false and .firestoreRead==false and .firestoreWrites==0 and .authWrites==0 and .deployExecuted==false' "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
          cp "$ORBIT360_EVIDENCE_DIR/preflight-sanitizado.json" "$ORBIT360_EVIDENCE_DIR/block12-runtime-hang-rescue-preflight.json"

      - name: Cancelar solo el run colgado
        id: cancel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORBIT360_TARGET_RUN_ID}" --jq '.status')"
          if [ "$CURRENT" != completed ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${ORBIT360_TARGET_RUN_ID}/cancel" >/dev/null || true
          fi
          STATUS="$CURRENT"; CONCLUSION=""
          for _ in $(seq 1 120); do
            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORBIT360_TARGET_RUN_ID}" --jq '.status')"
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORBIT360_TARGET_RUN_ID}" --jq '.conclusion // ""')"
            [ "$STATUS" = completed ] && break
            sleep 2
          done
          test "$STATUS" = completed
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Resolver identidad LAB después del gate
        shell: bash
        env:
          SA_ORBIT360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}
          SA_ORBIT_360_LAB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}
          SA_DEFAULT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-block12-rescue-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Instalar herramientas controladas
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase-admin@13.10.0 firebase-tools@15.25.1 >/dev/null
          npx firebase --version

      - name: Retirar tenant y usuarios sintéticos
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-block12-runtime-hang-rescue-v20260804.mjs
          jq -e '.status=="RUNTIME_HANG_SYNTHETIC_CLEANUP_PASS" and .realTenantUnchanged==true and .syntheticTenantRemoved==true and .authUsersRemaining==0 and .realTenantWrites==0 and .rulesChanged==false and .productionTouched==false and .ok==true' "$ORBIT360_EVIDENCE_DIR/block12-runtime-hang-rescue-data-auth.json" >/dev/null

      - name: Retirar Functions y canal preview temporales
        id: deploy_cleanup
        shell: bash
        run: |
          set -euo pipefail
          for NAME in ${ORBIT360_FUNCTIONS//,/ }; do
            npx firebase functions:delete "$NAME" --region us-central1 --project "$ORBIT360_PROJECT_ID" --force || true
          done
          npx firebase hosting:channel:delete "$ORBIT360_HOSTING_CHANNEL" --project "$ORBIT360_PROJECT_ID" --force || true
          npx firebase functions:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/functions-after-rescue.json" || true
          npx firebase hosting:channel:list --project "$ORBIT360_PROJECT_ID" --json > "$RUNNER_TEMP/channels-after-rescue.json" || true
          REMAINING=0
          for NAME in ${ORBIT360_FUNCTIONS//,/ }; do grep -Fq "$NAME" "$RUNNER_TEMP/functions-after-rescue.json" && REMAINING=$((REMAINING+1)); done
          CHANNEL_REMAINS=false
          grep -Fq "$ORBIT360_HOSTING_CHANNEL" "$RUNNER_TEMP/channels-after-rescue.json" && CHANNEL_REMAINS=true
          echo "functions_remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "channel_remains=$CHANNEL_REMAINS" >> "$GITHUB_OUTPUT"
          test "$REMAINING" = 0
          test "$CHANNEL_REMAINS" = false

      - name: Consolidar cierre del rescate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DATA_OK=false
          test -f "$ORBIT360_EVIDENCE_DIR/block12-runtime-hang-rescue-data-auth.json" && DATA_OK="$(jq -r '.ok // false' "$ORBIT360_EVIDENCE_DIR/block12-runtime-hang-rescue-data-auth.json")"
          FUNCTIONS_REMAINING="${{ steps.deploy_cleanup.outputs.functions_remaining }}"
          CHANNEL_REMAINS="${{ steps.deploy_cleanup.outputs.channel_remains }}"
          CANCEL_STATUS="${{ steps.cancel.outputs.status }}"
          CANCEL_CONCLUSION="${{ steps.cancel.outputs.conclusion }}"
          PASS=false
          if [ "$DATA_OK" = true ] && [ "$FUNCTIONS_REMAINING" = 0 ] && [ "$CHANNEL_REMAINS" = false ] && [ "$CANCEL_STATUS" = completed ]; then PASS=true; fi
          jq -n --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg head "${ORBIT360_MATERIALIZED_HEAD:-}" --arg cancelStatus "$CANCEL_STATUS" --arg cancelConclusion "$CANCEL_CONCLUSION" --arg functionsRemaining "$FUNCTIONS_REMAINING" --arg channelRemains "$CHANNEL_REMAINS" --argjson pass "$PASS" '{schemaVersion:"orbit360-block12-runtime-hang-rescue-final-v2",generatedAt:$generatedAt,gateId:"block12-runtime-hang-rescue-lab-v20260804",contractVersion:"12.0.4",targetRunId:30956309298,previousRescueRunId:30959160007,materializedHead:$head,status:(if $pass then "RUNTIME_HANG_RESCUE_PASS" else "RUNTIME_HANG_RESCUE_FAIL" end),classification:(if $pass then "GO_RESCUE_CLEAN" else "PIPELINE_MECHANISM_FAILURE" end),cancelStatus:$cancelStatus,cancelConclusion:$cancelConclusion,syntheticDataAuthCleanup:$pass,functionsRemaining:$functionsRemaining,hostingChannelRemains:$channelRemains,rulesDeployed:false,realDataReimported:false,productionTouched:false,mainTouched:false,mergeExecuted:false,containsPII:false,containsSecrets:false,ok:$pass}' > "$ORBIT360_EVIDENCE_DIR/block12-runtime-hang-rescue-final.json"
          if [ "$PASS" != true ]; then exit 45; fi

      - name: Publicar evidencias sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-block12-runtime-hang-rescue-rootfix-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/block12-runtime-hang-rescue-preflight.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-runtime-hang-rescue-data-auth.json
            orbit360-platform/runtime-gate-crm-v20260716/block12-runtime-hang-rescue-final.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar decisión en PR 5
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$ORBIT360_EVIDENCE_DIR/block12-runtime-hang-rescue-final.json"
          STATUS="RUNTIME_HANG_RESCUE_FAIL"; CLASSIFICATION="PIPELINE_MECHANISM_FAILURE"
          if [ -f "$FILE" ]; then STATUS="$(jq -r '.status' "$FILE")"; CLASSIFICATION="$(jq -r '.classification' "$FILE")"; fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="## Block 12 · rescate rootfix · run ${GITHUB_RUN_ID}\n\n- Estado: \`${STATUS}\`\n- Clasificación: \`${CLASSIFICATION}\`\n- Run objetivo: \`30956309298\`\n- Rescate previo pre-secreto: \`30959160007\`\n- Rules/reimportación real/producción/main/merge: no" >/dev/null
