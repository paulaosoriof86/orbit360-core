name: Orbit 360 · Pólizas · escritura controlada de padres HOLD LAB
on:
  push:
    branches: [ays/backend-tenant-lab-v99-20260703]
    paths:
      - '.github/orbit360-requests/policies-held-parents-controlled-write-lab-v20260801.json'
permissions:
  contents: read
  statuses: write
concurrency:
  group: orbit360-policies-held-parents-controlled-write-lab-v20260801
  cancel-in-progress: false
env:
  ORBIT360_BRANCH: ays/backend-tenant-lab-v99-20260703
  ORBIT360_GATE_ID: block7-policies-held-parents-controlled-write-lab-v20260801
  ORBIT360_PROJECT_ID: ays-orbit-360-lab
  ORBIT360_TENANT_ID: alianzas-soluciones
  ORBIT360_REQUEST_FILE: .github/orbit360-requests/policies-held-parents-controlled-write-lab-v20260801.json
  ORBIT360_LIFECYCLE_FILE: tools/orbit360-validator-lifecycle-contract-policies-held-parents-controlled-write-lab-v20260801.json
  EVIDENCE_DIR: orbit360-platform/runtime-gate-crm-v20260716
jobs:
  write:
    name: Pólizas · 20 padres HOLD · create-only, snapshot y rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización y límites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$ORBIT360_BRANCH"
          jq -e '.schemaVersion=="orbit360-policies-held-parents-controlled-write-request-v1" and .gateId=="block7-policies-held-parents-controlled-write-lab-v20260801" and .contractVersion=="7.8.0" and .approved==true and .allowedExecutions==1 and .consumed==false and .authorizationRef=="user_authorized_held_parents_controlled_write_20_20260801" and .scope.createClients==16 and .scope.createInsurers==4 and .scope.createDocuments==20 and .scope.updateDocuments==0 and .scope.overwriteDocuments==0 and .scope.preserveRequiresValidation==20 and .scope.verifyAffectedPolicies==75 and .scope.verifyAffectedDescendants==162 and .scope.atomicBatchCount==1 and .capabilities.firestoreRead==true and .capabilities.writes==true and .capabilities.runtime==false and .capabilities.browser==false and .capabilities.preview==false and .capabilities.deploy==false and .capabilities.rulesDeploy==false and .capabilities.functionsDeploy==false and .capabilities.production==false and .capabilities.main==false and .capabilities.merge==false' "$ORBIT360_REQUEST_FILE" >/dev/null
          jq -e '.status=="POLICIES_HELD_PARENTS_CONTROLLED_WRITE_AUTHORIZED" and .executionProfile.phase=="LAB_DATA_CONTRACT_REPAIR_APPLY" and .authorization.allowedExecutions==1 and .authorization.consumed==false and .writePlan.createDocuments==20 and .writePlan.updateDocuments==0 and .writePlan.overwriteDocuments==0 and .writePlan.preserveRequiresValidation==20 and .writePlan.atomicBatchCount==1 and .guards.operationalWritesAllowed==20 and .guards.updatesAllowed==0 and .guards.overwritesAllowed==0 and .guards.reimportAllowed==false and .guards.frontendAdaptationAllowed==false and .guards.browserAllowed==false and .guards.previewAllowed==false and .guards.hostingDeployAllowed==false and .guards.productionAllowed==false' "$ORBIT360_LIFECYCLE_FILE" >/dev/null
      - name: Gate canónico antes de secrets y Firestore
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/orbit360-validar-gate-contracts-v20260717.mjs
          node --check tools/orbit360-validar-gate-contracts-engine-policies-held-parents-controlled-write-lab-v20260801.mjs
          node --check tools/orbit360-ejecutar-policies-held-parents-controlled-write-lab-v20260801.mjs
          node tools/orbit360-validar-gate-contracts-v20260717.mjs "$ORBIT360_GATE_ID"
          jq -e '.status=="GO_GATE_CONTRACT" and .classification=="POLICIES_HELD_PARENTS_CONTROLLED_WRITE_READY" and .executionAuthorized==true and .firestoreReadAuthorized==true and .writeAuthorized==true and .operationalWritesAllowed==20 and .updatesAllowed==0 and .overwritesAllowed==0 and .snapshotRequired==true and .idempotencyRequired==true and .postVerificationRequired==true and .rollbackRequired==true and .atomicBatchCount==1 and .frontendAdaptationAuthorized==false and .browserAuthorized==false and .previewAuthorized==false and .deployAuthorized==false and .productionAuthorized==false and .frozenGateReopenAuthorized==false and .failed==0' "$EVIDENCE_DIR/preflight-sanitizado.json" >/dev/null
      - name: Instalar dependencia aislada
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase-admin@13 >/dev/null
      - name: Resolver identidad LAB
        env:
          SA_ORBIT360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT360_LAB }}'
          SA_ORBIT_360_LAB: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBIT_360_LAB }}'
          SA_DEFAULT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT="${SA_ORBIT360_LAB:-${SA_ORBIT_360_LAB:-${SA_DEFAULT:-}}}"
          test -n "$SERVICE_ACCOUNT"
          KEY_FILE="$RUNNER_TEMP/orbit360-policies-held-parents-write.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          test "$(jq -r '.project_id // empty' "$KEY_FILE")" = "$ORBIT360_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_TEMP_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_PROJECT_ID=$ORBIT360_PROJECT_ID" >> "$GITHUB_ENV"
          echo "ORBIT360_PRODUCT_TENANT_ID=$ORBIT360_TENANT_ID" >> "$GITHUB_ENV"
      - name: Ejecutar escritura atómica y post-verificación
        shell: bash
        run: |
          set -euo pipefail
          node tools/orbit360-ejecutar-policies-held-parents-controlled-write-lab-v20260801.mjs
          jq -e '.ok==true and .status=="POLICIES_HELD_PARENTS_CONTROLLED_WRITE_PASS" and .classification=="GO_LAB_HELD_PARENTS_CONTROLLED_WRITE_CLOSED" and .requestVerified==true and .lifecycleVerified==true and .digestsVerified==true and .planVerified==true and .snapshot.created==true and .snapshot.private==true and .snapshot.entries==4822 and .plan.createClients==16 and .plan.createInsurers==4 and .plan.createDocuments==20 and .plan.updateDocuments==0 and .plan.overwriteDocuments==0 and .plan.preserveRequiresValidation==20 and .plan.affectedPolicies==75 and .plan.affectedDescendants==162 and .plan.unresolvedBatchReferences==0 and .execution.atomicBatchesPlanned==1 and .execution.atomicBatchesCommitted==1 and .execution.createdDocuments==20 and .execution.overwriteAttempts==0 and .postVerification.executed==true and .postVerification.countsMatch==true and .postVerification.contentMatch==true and .postVerification.sourceUnchanged==true and .postVerification.createdPayloadsMatch==true and .postVerification.requiresValidationPreserved==true and .postVerification.affectedPoliciesVerified==75 and .postVerification.affectedDescendantsVerified==162 and .postVerification.allPolicyRelationsResolved==true and .rollback.executed==false and .firestoreWrites==20 and .operationalWrites==20 and .reimportExecuted==false and .frontendAdapted==false and .browserExecuted==false and .previewExecuted==false and .deployExecuted==false and .rulesApplied==false and .functionsDeployed==false and .productionTouched==false and .mainTouched==false and .mergeExecuted==false and .containsPII==false and .containsDocumentIds==false and .containsValues==false and .containsSecrets==false' "$EVIDENCE_DIR/policies-held-parents-controlled-write-lab-v20260801.json" >/dev/null
      - name: Subir evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit360-policies-held-parents-controlled-write-lab-${{ github.run_id }}
          path: |
            orbit360-platform/runtime-gate-crm-v20260716/preflight-sanitizado.json
            orbit360-platform/runtime-gate-crm-v20260716/policies-held-parents-controlled-write-lab-v20260801.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar estado observable
        if: always()
        uses: actions/github-script@v7
        env:
          EVIDENCE: orbit360-platform/runtime-gate-crm-v20260716/policies-held-parents-controlled-write-lab-v20260801.json
        with:
          script: |
            const fs=require('fs');let state='failure',description='Held-parent controlled write failed or rolled back';
            try{const p=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));if(p.ok===true&&p.status==='POLICIES_HELD_PARENTS_CONTROLLED_WRITE_PASS'&&p.execution?.createdDocuments===20&&p.firestoreWrites===20&&p.rollback?.executed===false){state='success';description='20 restricted parents created and dependencies verified';}else if(p.rollback?.executed===true&&p.rollback?.restoredSnapshot===true){description='Held-parent write failed; exact rollback verified';}}catch(e){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'orbit360/policies-held-parents-controlled-write-lab',description,target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Limpiar identidad y snapshot temporal
        if: always()
        shell: bash
        run: |
          if [ -n "${ORBIT360_TEMP_KEY_FILE:-}" ] && [ -f "$ORBIT360_TEMP_KEY_FILE" ]; then shred -u "$ORBIT360_TEMP_KEY_FILE" || rm -f "$ORBIT360_TEMP_KEY_FILE"; fi
          rm -f "$RUNNER_TEMP"/orbit360-held-parents-target-snapshot-*.json || true
